<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f0cf.svg" type="image/svg+xml">
<title>Блэкджек — стол</title>
<!-- доска ведущего с кодом комнаты: в поиске ей делать нечего -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=EB+Garamond:wght@600&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=EB+Garamond:wght@600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="blackjack-table.css">
<style>
  /* Доска «Блэкджека»: сцена рисует BJTable (blackjack-table.js), поверх — лобби, лента, кнопки ведущего.
     Накладки масштабируются вместе со сценой через --u (= 1px на экране 1920 px). Без :has, subgrid, gap в grid на
     старых движках закрывает legacy-compat.js. */
  :root { --u: calc(100vw / 1920); --surface: rgba(16, 6, 8, .92); --line: rgba(212, 175, 55, .35); --line-2: rgba(212, 175, 55, .7); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bj-bg); color: var(--bj-ivory); font: 500 16px/1.3 var(--bj-cond); -webkit-user-select: none; user-select: none; }
  /* стол занимает экран без нижней полосы: там бегунок ленты, ничего поверх боксов и HUD */
  /* height:auto — иначе .bj{height:100%} перебивает bottom и рельс уезжает под бегунок */
  #table, #table.bj { position: fixed; left: 0; top: 0; right: 0; bottom: calc(46 * var(--u)); height: auto; width: auto; }
  /* центральную табличку лобби рисуем сами (QR, список, настройки) */
  #table .bj-center.is-lobby { display: none; }
  /* пояснения фаз длиннее реплик в 2–6 слов: пузырю Марго разрешаем перенос */
  #table .bj-bubble { white-space: normal; width: max-content; max-width: 400px; font-size: 29px; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--bj-gold); background: var(--bj-gold); color: var(--bj-ink); font: 700 calc(22 * var(--u))/1 var(--bj-cond); letter-spacing: .14em; text-transform: uppercase; padding: calc(16 * var(--u)) calc(34 * var(--u)); transition: transform .15s, background .15s; }
  .btn:hover { background: var(--bj-gold-hi); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: var(--surface); color: var(--bj-gold-hi); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--bj-gold); background: #1d0b0e; }
  .btn.small { font-size: calc(15 * var(--u)); padding: calc(9 * var(--u)) calc(14 * var(--u)); letter-spacing: .1em; }
  .btn[data-armed="1"] { background: var(--bj-red); border-color: var(--bj-red); color: #fff; }

  /* ---------- лобби: «табличка клуба» ----------
     Единица --lu = 1 px сцены (1920×1080), считается по меньшей стороне окна с учётом нижней полосы, поэтому панель
     подгоняется и на 3840×2160, и на 2970×1066, и на 2560×720. Сверху над панелью остаются Марго и вывеска «21»
     (сцена: Марго по y<430). Три колонки: код/QR | 12 мест 4×3 | настройки; все колонки одной высоты и тянутся. */
  #lobby { --lu: min(calc(100vw / 1920), calc((100vh - 46 * var(--u)) / 1080)); --pad: calc(28 * var(--lu));
    position: fixed; left: 50%; top: calc(428 * var(--lu)); transform: translateX(-50%); width: calc(1820 * var(--lu)); height: calc(630 * var(--lu)); z-index: 12;
    display: grid; grid-template-columns: calc(330 * var(--lu)) minmax(0, 1fr) calc(650 * var(--lu)); grid-template-rows: minmax(0, 1fr) auto; column-gap: calc(40 * var(--lu)); row-gap: calc(14 * var(--lu));
    padding: calc(24 * var(--lu)) var(--pad) calc(22 * var(--lu)); box-sizing: border-box; background: #120a0b; border: 1px solid var(--bj-gold); border-radius: 4px;
    box-shadow: inset 0 0 0 calc(5 * var(--lu)) #120a0b, inset 0 0 0 calc(6 * var(--lu)) rgba(212, 175, 55, .4), 0 calc(24 * var(--lu)) calc(60 * var(--lu)) rgba(0, 0, 0, .65); }
  #lobby > div { min-width: 0; min-height: 0; }
  #lobby .cap { display: flex; align-items: center; justify-content: space-between; gap: calc(12 * var(--lu)); height: calc(30 * var(--lu)); margin-bottom: calc(12 * var(--lu)); font: 700 calc(18 * var(--lu))/1 var(--bj-cond); letter-spacing: .12em; text-transform: uppercase; color: var(--bj-gold); white-space: nowrap; }
  #lobby .cap > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #lobby .cap #seatn { display: flex; align-items: center; gap: calc(12 * var(--lu)); color: var(--bj-ivory); overflow: visible; }
  #lobby .join { display: flex; flex-direction: column; align-items: flex-start; }
  #lobby #qr { width: calc(260 * var(--lu)); height: calc(260 * var(--lu)); padding: calc(8 * var(--lu)); background: #fbf4e3; box-sizing: content-box; border-radius: 2px; flex: none; }
  #lobby #qr img, #lobby #qr canvas { width: 100% !important; height: 100% !important; display: block; }
  #lobby .code { margin-top: calc(12 * var(--lu)); height: calc(52 * var(--lu)); font: 800 calc(52 * var(--lu) * var(--k, 1))/calc(52 * var(--lu)) var(--bj-cond); letter-spacing: .04em; color: var(--bj-gold-hi); white-space: nowrap; max-width: 100%; }
  #lobby .url { margin-top: calc(8 * var(--lu)); font: 600 calc(21 * var(--lu))/1.1 var(--bj-cond); color: var(--bj-ivory); white-space: nowrap; max-width: 100%; }
  #lobby .scan { margin-top: calc(8 * var(--lu)); font: 500 calc(18 * var(--lu))/1.3 var(--bj-cond); color: var(--bj-muted); }
  #lobby .seats { display: flex; flex-direction: column; }
  #lobby .who { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: calc(10 * var(--lu)); }
  #lobby .who > div { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); align-content: space-between; row-gap: calc(8 * var(--lu)); min-width: 0; padding: calc(12 * var(--lu)) calc(12 * var(--lu)) calc(12 * var(--lu)) calc(14 * var(--lu)); box-sizing: border-box; border: 1px solid rgba(212, 175, 55, .2); border-left: calc(4 * var(--lu)) solid var(--c, #777); border-radius: 3px; background: #1c0f11; }
  #lobby .who > div.new { animation: seat-in .45s var(--bj-spring); }
  #lobby .who > div.off { opacity: .5; }
  #lobby .who > div.empty { border: 1px dashed rgba(212, 175, 55, .28); background: #150a0c; }
  #lobby .who .top { display: flex; align-items: center; gap: calc(8 * var(--lu)); height: calc(56 * var(--lu)); }
  #lobby .who .num { flex: 1; min-width: 0; }
  #lobby .who .nm { align-self: end; min-width: 0; font: 700 calc(22 * var(--lu))/1.15 var(--bj-cond); color: var(--bj-ivory); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  #lobby .who > div.empty .nm { font-weight: 600; color: var(--bj-muted); }
  #lobby .who .ghost { width: calc(56 * var(--lu)); height: calc(56 * var(--lu)); box-sizing: border-box; border-radius: 50%; display: grid; place-items: center; font: 700 calc(22 * var(--lu))/1 var(--bj-cond); color: var(--bj-muted); border: 1px dashed rgba(212, 175, 55, .35); flex: none; }
  #lobby .x { flex: none; width: calc(40 * var(--lu)); height: calc(40 * var(--lu)); border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--bj-muted); font-size: calc(18 * var(--lu)); line-height: 1; padding: 0; }
  #lobby .x[data-armed="1"] { background: var(--bj-red); color: #fff; border-color: var(--bj-red); }
  #lobby .av { width: calc(56 * var(--lu)); height: calc(56 * var(--lu)); border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #111; font: 800 calc(22 * var(--lu))/1 var(--bj-cond); box-shadow: 0 0 0 2px rgba(0, 0, 0, .5); flex: none; }
  #lobby .av.em { font-size: calc(28 * var(--lu)); }
  #lobby .purge { flex: none; height: calc(30 * var(--lu)); border: 1px solid var(--line-2); border-radius: 3px; background: transparent; color: var(--bj-gold-hi); font: 700 calc(15 * var(--lu))/1 var(--bj-cond); letter-spacing: .06em; text-transform: uppercase; padding: 0 calc(10 * var(--lu)); white-space: nowrap; }
  #lobby .opts { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(4, auto); align-content: space-between; column-gap: calc(14 * var(--lu)); }
  #lobby .optwrap { display: flex; flex-direction: column; }
  #lobby .optwrap .opts { flex: 1; min-height: 0; }
  #lobby .o { grid-column: span 3; min-width: 0; }
  #lobby .o.w6 { grid-column: span 6; }
  #lobby .o.w2 { grid-column: span 2; }
  #lobby .o .k { height: calc(22 * var(--lu)); margin-bottom: calc(6 * var(--lu)); font: 600 calc(17 * var(--lu))/calc(22 * var(--lu)) var(--bj-cond); letter-spacing: .06em; text-transform: uppercase; color: var(--bj-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lobby .o.na .k { opacity: .5; }
  #lobby .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(max-content, 1fr); gap: calc(3 * var(--lu)); padding: calc(3 * var(--lu)); border: 1px solid var(--line); border-radius: 4px; background: #0b0506; }
  #lobby .seg button { height: calc(58 * var(--lu)); min-width: 0; border: 0; border-radius: 2px; background: #241316; color: var(--bj-ivory); font: 700 calc(23 * var(--lu))/1 var(--bj-cond); padding: 0 calc(10 * var(--lu)); white-space: nowrap; }
  #lobby .seg button.on { background: var(--bj-gold); color: var(--bj-ink); }
  #lobby .seg button:disabled { cursor: default; }
  #lobby .seg button:disabled:not(.on) { opacity: .6; }
  #lobby .o.na .seg button { opacity: .35; }
  #lobby .foot { grid-column: 1 / -1; display: flex; align-items: center; gap: calc(16 * var(--lu)); border-top: 1px solid rgba(212, 175, 55, .25); padding-top: calc(14 * var(--lu)); }
  #lobby .foot .btn { height: calc(64 * var(--lu)); padding: 0 calc(30 * var(--lu)); border-radius: 3px; font-size: calc(24 * var(--lu)); letter-spacing: .1em; white-space: nowrap; }
  #lobby .foot .btn.go { min-width: calc(300 * var(--lu)); font-size: calc(28 * var(--lu)); background: linear-gradient(#e4c24e, #c19a2a); border-color: #e4c24e; }
  #lobby .foot .btn.go:disabled { background: #3a2f12; border-color: #5a4a1a; color: #a89867; opacity: 1; }
  #lobby .foot .btn.ghost { background: transparent; border-color: var(--bj-gold); color: var(--bj-gold-hi); }
  #lobby .foot .btn.ghost:hover { background: #241316; }
  #lobby .foot .btn.dev { height: calc(48 * var(--lu)); font-size: calc(18 * var(--lu)); padding: 0 calc(18 * var(--lu)); border-color: var(--line); color: var(--bj-muted); }
  #lobby .foot .fine { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: calc(14 * var(--lu)); text-align: right; font: 600 calc(24 * var(--lu))/1.2 var(--bj-cond); color: var(--bj-muted); }
  #lobby .foot .fine.need { color: var(--bj-gold-hi); }
  #lobby .foot .fine .mk { flex: none; width: calc(34 * var(--lu)); height: calc(34 * var(--lu)); box-sizing: border-box; border: 2px solid currentColor; border-radius: 50%; display: grid; place-items: center; font: 800 calc(18 * var(--lu))/1 var(--bj-cond); }
  @keyframes seat-in { from { transform: translateY(14px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- лента: бегунок под столом, по одному сообщению ---------- */
  #feed { position: fixed; left: 0; right: calc(620 * var(--u)); bottom: 0; height: calc(46 * var(--u)); z-index: 8; display: flex; align-items: center; justify-content: center; gap: calc(10 * var(--u)); padding: 0 calc(20 * var(--u)); overflow: hidden; }
  #feed::before { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: calc(46 * var(--u)); background: var(--bj-ink); border-top: 1px solid rgba(212, 175, 55, .35); z-index: -1; }
  #feed .msg { display: flex; align-items: center; gap: calc(10 * var(--u)); max-width: calc(1500 * var(--u)); padding: calc(5 * var(--u)) calc(14 * var(--u)); border-left: 3px solid var(--c, var(--bj-gold)); font: 500 calc(23 * var(--u))/1.2 var(--bj-cond); color: var(--bj-ivory); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: msg-in .35s ease-out; }
  #feed .msg.out { animation: msg-out .3s ease-in forwards; }
  #feed .msg.sys { border-left-color: var(--bj-gold); color: var(--bj-gold-hi); font-weight: 600; }
  #feed .msg.sys.big { font-size: calc(23 * var(--u)); }
  #feed .msg b { color: var(--c, var(--bj-gold-hi)); margin-right: 4px; }
  #feed .msg .x { width: calc(28 * var(--u)); height: calc(28 * var(--u)); border: 1px solid var(--line); background: transparent; color: var(--bj-muted); font-size: calc(13 * var(--u)); padding: 0; line-height: 1; flex: none; }
  @keyframes msg-in { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes msg-out { to { transform: translateY(-100%); opacity: 0; } }
  .fly { position: fixed; z-index: 30; font-size: calc(44 * var(--u)); pointer-events: none; animation: fly 1.4s ease-out forwards; transform: translate(-50%, -50%); }
  .fly small { display: block; font: 600 calc(17 * var(--u))/1 var(--bj-cond); letter-spacing: .08em; color: var(--bj-ivory); text-align: center; text-shadow: 0 1px 4px #000; }
  @keyframes fly { 0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -70%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -260%) scale(1); opacity: 0; } }

  /* ---------- кнопки ведущего, зритель, связь ---------- */
  #ctrl { position: fixed; right: calc(14 * var(--u)); bottom: calc(5 * var(--u)); height: calc(36 * var(--u)); z-index: 14; display: flex; align-items: center; gap: calc(8 * var(--u)); flex-wrap: wrap; justify-content: flex-end; max-width: calc(600 * var(--u)); }
  #ctrl .note { font: 600 calc(18 * var(--u))/1.2 var(--bj-cond); color: var(--bj-gold-hi); }
  #ctrl input { width: calc(300 * var(--u)); background: #1d0b0e; border: 1px solid var(--line); color: var(--bj-ivory); font: 600 calc(18 * var(--u))/1 var(--bj-cond); padding: calc(10 * var(--u)); }
  .sound-toggle-btn { width: calc(36 * var(--u)); height: calc(36 * var(--u)); border: 1px solid var(--line); background: var(--surface); color: var(--bj-gold); padding: 0; display: grid; place-items: center; }
  .sound-toggle-btn svg { width: 55%; height: 55%; }
  #viewer { position: fixed; left: 50%; top: calc(12 * var(--u)); transform: translateX(-50%); z-index: 14; background: var(--surface); border: 1px solid var(--line); padding: calc(6 * var(--u)) calc(14 * var(--u)); font: 600 calc(17 * var(--u))/1 var(--bj-cond); letter-spacing: .12em; text-transform: uppercase; color: var(--bj-muted); }
  #pausenext { position: fixed; left: 50%; top: calc(12 * var(--u)); transform: translateX(-50%); z-index: 14; background: var(--surface); border: 1px solid var(--line); padding: calc(6 * var(--u)) calc(14 * var(--u)); font: 600 calc(18 * var(--u))/1 var(--bj-cond); letter-spacing: .1em; color: var(--bj-gold-hi); }
  #conn { position: fixed; left: 50%; top: 0; transform: translate(-50%, -110%); z-index: 40; background: var(--bj-red); color: #fff; font: 700 calc(19 * var(--u))/1 var(--bj-cond); letter-spacing: .1em; text-transform: uppercase; padding: calc(8 * var(--u)) calc(18 * var(--u)); transition: transform .3s; }
  #conn.on { transform: translate(-50%, 0); }
  #center { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; }
  #center .banner { background: var(--surface); border: 1px solid var(--bj-gold); padding: calc(26 * var(--u)) calc(46 * var(--u)); font: 700 calc(40 * var(--u))/1.1 var(--bj-serif); color: var(--bj-ivory); text-align: center; }
  #menu { position: fixed; z-index: 30; background: var(--surface); border: 1px solid var(--line-2); padding: 6px; display: none; min-width: 190px; box-shadow: 0 20px 40px rgba(0, 0, 0, .7); }
  #menu.on { display: grid; }
  #menu button { background: none; border: 0; text-align: left; padding: 10px 12px; font: 600 18px/1 var(--bj-cond); letter-spacing: .04em; }
  #menu button:hover { background: #1d0b0e; }
  #menu .fine { padding: 6px 12px 4px; font: 600 13px/1 var(--bj-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--bj-muted); }

  /* ---------- финал, демо ---------- */
  #final { position: fixed; left: calc(960 * var(--u) + 340 * var(--u)); top: calc(560 * var(--u)); transform: none; z-index: 15; display: flex; flex-direction: column; align-items: center; gap: calc(10 * var(--u)); }
  #final .sub { display: none; font: 600 calc(20 * var(--u))/1 var(--bj-cond); letter-spacing: .18em; text-transform: uppercase; color: var(--bj-muted); }
  #demo { position: fixed; left: calc(44 * var(--u)); top: calc(236 * var(--u)); z-index: 16; display: flex; align-items: center; gap: calc(14 * var(--u)); }
  #demo .t { font: 700 calc(21 * var(--u))/1 var(--bj-cond); letter-spacing: .2em; text-transform: uppercase; color: var(--bj-gold-hi); }

  /* узкий экран (ноутбук в окне, планшет): лобби в одну колонку */
  @media (max-aspect-ratio: 4/3) {
    :root { --u: calc(100vw / 1400); }
    /* почти квадратное окно: две колонки (код | места), настройки третьим рядом во всю ширину */
    #lobby { --lu: min(calc(100vw / 1260), calc((100vh - 46 * var(--u) - 24px) / 1100)); top: auto; bottom: calc(46 * var(--u) + 14 * var(--lu)); width: calc(1220 * var(--lu)); height: auto; grid-template-columns: calc(380 * var(--lu)) minmax(0, 1fr); column-gap: calc(30 * var(--lu)); grid-template-rows: auto auto auto; }
    #lobby .join { grid-column: 1; grid-row: 1; }
    #lobby .seats { grid-column: 2; grid-row: 1; }
    #lobby .who { grid-template-rows: repeat(3, calc(120 * var(--lu))); }
    #lobby .optwrap { grid-column: 1 / -1; grid-row: 2; }
    #lobby .foot { grid-row: 3; }
    #lobby .opts { grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: auto; row-gap: calc(14 * var(--lu)); }
    #lobby .o { grid-column: span 4; }
    #lobby .o.w6 { grid-column: span 6; }
    #lobby .o.w2 { grid-column: span 4; }
  }
</style>
<script src="legacy-compat.js"></script>
<script src="mp-common.js"></script>
</head>
<body>
<div id="table"></div>
<div id="lobby" class="hidden"></div>
<div id="feed"></div>
<div id="ctrl"><button class="sound-toggle-btn" type="button"></button></div>
<div id="viewer" class="hidden" data-i18n="viewer">Только просмотр — управляет другая доска</div>
<div id="pausenext" class="hidden"></div>
<div id="final" class="hidden"></div>
<div id="demo" class="hidden"></div>
<div id="center"></div>
<div id="menu"></div>
<div id="conn"></div>

<script>
window.I18N_DICT = {
  ru: {
    _title: `Блэкджек — стол`,
    viewer: `Только просмотр — управляет другая доска`,
    creating: `Создаём комнату…`, noroom: `Такой комнаты нет`, expired: `Комната закрыта`,
    lobby_title: `Садитесь за стол`, lobby_scan: `Наведите камеру телефона на QR или откройте ссылку и введите имя.`,
    lobby_opts: `Настройки`, lobby_who: `За столом`, lobby_seats: `{n} из 12`, lobby_free: `свободно`, lobby_fine: `Фишки виртуальные, на деньги не играем`,
    lobby_hi: `{name} за столом`, need_two: `Нужно хотя бы два игрока`, offline_tip: `Нет связи с телефоном`,
    purge_off: `Убрать офлайн ({n})`, purge_sure: `Точно убрать {n}?`,
    opt_format: `Формат`, opt_hands: `Раздач`, opt_stack: `Стартовый стек`, opt_pace: `Темп уровней`, opt_time: `Таймер ставок`, opt_cards: `Карты-пакости`, opt_chat: `Чат`, opt_calm: `Без спецэффектов`,
    on: `вкл`, off: `выкл`, sec: `{n} с`,

<script>
"use strict";
const T = (k) => bjT(k);
const tpl = (k, v) => bjTpl(k, v);
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const DEV = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || params.get("dev") === "1";

let conn = null, state = null, isHost = false, dead = false;
let table = null;
const hostKey = () => "blackjack-host-" + CODE;
const lang = () => (window.I18N && I18N.lang) || "ru";
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const player = (id) => state && state.players.find((p) => p.id === id);
const nameOf = (id) => (player(id) || {}).name || "?";

// ---------- стол ----------
function makeTable() {
  // autoSay остаётся у рендерера: реплики по событиям (блэкджек, перебор, ва-банк…) делает он;
  // доска добавляет только пояснения фаз для новичков (§8 п.3) — say() после render() перекрывает автореплику той же фазы
  table = BJTable.create($("table"), { fx: !reduceMotion(), lang: lang(), layout: "board", autoSay: true });
  window.TABLE = table;
}
function applyFx() {
  const calm = !!(state && state.settings && state.settings.calm);
  const on = !calm && !reduceMotion();
  if (table && table.state && table.state.fxOn !== on) { table.state.fxOn = on; table.setFx(on); }
}

// Снимок сервера → снимок рендерера: без зрителей и ушедших, winner/stats в формате стола, события в его именах
function adapt(s) {
  const out = {};
  for (const k in s) out[k] = s[k];
  out.players = s.players.filter((p) => !p.left && !p.spectator).map((p) => {
    const q = {};
    for (const k in p) q[k] = p[k];
    const d = s.dealer || {};
    q.allin = !!(p.allIn || (d.allin && d.allin.indexOf(p.id) >= 0));
    q.rescued = !!(d.rescue && d.rescue.indexOf(p.id) >= 0 && (s.phase === "payout" || s.phase === "finished"));
    return q;
  });
  out.code = null; // табличку лобби рисуем сами
  out.winner = s.winnerId || null;
  out.stats = statRows(s);
  out.events = (s.events || []).map(mapEvent).filter(Boolean);
  return out;
}
function mapEvent(e) {
  switch (e.type) {
    case "penalty": return { t: e.t, type: "penalty", id: e.playerId, amount: e.amount };
    case "allin": return { t: e.t, type: "allin" };
    case "cut": return { t: e.t, type: "cut", text: tpl(e.coin ? "ev_cut_coin" : "ev_cut", { name: nameOf(e.playerId) }) };
    default: return null;
  }
}
function statRows(s) {
  if (!s.stats) return null;
  const st = s.stats, rows = [];
  if (st.biggestWin) rows.push({ key: "biggestWin", name: nameOf(st.biggestWin.playerId), value: "+" + bjNum(st.biggestWin.amount) });
  if (st.biggestBust) rows.push({ key: "biggestBust", name: nameOf(st.biggestBust.playerId), value: "−" + bjNum(st.biggestBust.amount) });
  const bjs = Object.keys(st.blackjacks || {}).map((id) => [id, st.blackjacks[id]]).sort((a, b) => b[1] - a[1]);
  const bjTotal = bjs.reduce((a, x) => a + x[1], 0);
  if (bjTotal) rows.push({ key: "bjs", name: bjs[0] ? nameOf(bjs[0][0]) : "", value: bjTotal });
  if (st.cruelCard) rows.push({ key: "meanCard", name: nameOf(st.cruelCard.by), value: T("card_" + st.cruelCard.card) + " → " + nameOf(st.cruelCard.target) });
  const breath = Object.keys(st.lastBreath || {}).map((id) => [id, st.lastBreath[id]]).sort((a, b) => b[1] - a[1])[0];
  if (breath) rows.push({ key: "last", name: nameOf(breath[0]), value: breath[1] === 1 ? T("st_hand1") : tpl("st_hands", { n: breath[1] }) });
  rows.push({ key: "twentyOne", value: st.exact21 || 0 });
  if (st.dealerBusts) rows.push({ label: T("st_dealer_busts"), value: st.dealerBusts });
  if (st.sideJackpot) rows.push({ label: T("st_side_jackpot"), name: nameOf(st.sideJackpot.playerId), value: T(st.sideJackpot.box + "_" + st.sideJackpot.kind) });
  return rows;
}

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  $("center").innerHTML = `<div class="banner">${escapeHtml(T("creating"))}</div>`;
  try {
    const res = await fetch("/blackjack/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: lang() } }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
    $("center").innerHTML = "";
    return true;
  } catch (err) {
    $("center").innerHTML = `<div class="banner">${escapeHtml(String(err.message || err))}</div>`;
    return false;
  }
}

// ---------- лента: чат и события ----------
// Бегунок: сообщения выходят по одному (системные 2,6 с, чат 4 с, итоги рук 2,2 с), очередь не длиннее 14
const feedQ = [];
let feedCur = null, feedTimer = 0;
const shownChat = new Set();
function feedPush(node, ms) {
  node._ms = ms || (node.classList.contains("sys") ? 2600 : 4000);
  feedQ.push(node);
  while (feedQ.length > 14) feedQ.shift();
  feedPump();
}
function feedPump() {
  // итоги рук живут только в фазе выплат и 3 с после: просроченные и чужой раздачи в очередь не лезут
  while (feedQ.length && feedQ[0]._res && (feedQ[0]._hand !== (state && state.hand) || Date.now() > feedQ[0]._until)) feedQ.shift();
  if (feedCur || !feedQ.length) return;
  const f = $("feed");
  feedCur = feedQ.shift();
  f.append(feedCur);
  feedTimer = setTimeout(() => {
    const n = feedCur; feedCur = null;
    if (n) { n.classList.add("out"); setTimeout(() => n.remove(), 300); }
    feedPump();
  }, feedCur._ms);
}
function feedSys(text, big, ms) {
  const fn = typeof text === "function" ? text : null;
  const n = el("div", "msg sys" + (big ? " big" : ""), fn ? fn() : text);
  if (fn) n._fn = fn;
  feedPush(n, ms);
}
function feedClear() { feedQ.length = 0; clearTimeout(feedTimer); if (feedCur) { feedCur.remove(); feedCur = null; } }
function feedRetranslate() { for (const n of $("feed").querySelectorAll(".msg.sys")) if (n._fn) n.textContent = n._fn(); }
function feedChat(m) {
  if (shownChat.has(m.id)) return;
  shownChat.add(m.id);
  const p = player(m.pid);
  const d = el("div", "msg");
  d.dataset.id = m.id;
  d.style.cssText = bjChipVars(p ? p.color : "#d4af37");
  const body = el("div");
  body.append(el("b", null, (p ? p.name : "?") + ":"), document.createTextNode(m.text));
  d.append(body);
  if (isHost) {
    const x = el("button", "x", "✕");
    x.title = T("hide");
    x.onclick = () => conn.send({ type: "hide", id: m.id });
    d.append(x);
  }
  feedPush(d);
}
function syncChat() {
  if (!state) return;
  const visible = new Set(state.chat.map((m) => m.id));
  // скрытое ведущим — снимаем с экрана и из очереди
  for (const node of Array.from($("feed").querySelectorAll(".msg[data-id]"))) if (!visible.has(Number(node.dataset.id))) { node.remove(); if (feedCur === node) { clearTimeout(feedTimer); feedCur = null; feedPump(); } }
  for (let i = feedQ.length - 1; i >= 0; i--) if (feedQ[i].dataset.id && !visible.has(Number(feedQ[i].dataset.id))) feedQ.splice(i, 1);
  for (const m of state.chat) feedChat(m);
}
// реакция над местом игрока на рельсе (элементы мест — у рендерера)
function floatAt(pid, emoji, label) {
  const seat = table && table.state && table.state.seats[pid];
  let x = innerWidth / 2, y = innerHeight - 120;
  if (seat) { const r = seat.el.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top; }
  const f = el("div", "fly", emoji);
  if (label) f.append(el("small", null, label));
  f.style.left = x + "px"; f.style.top = y + "px";
  document.body.append(f);
  setTimeout(() => f.remove(), 1500);
}

// события движка — в ленту (по одному разу)
const seenEv = new Set();
function feedEvents() {
  if (!state) return;
  for (const e of state.events || []) {
    const key = e.t + ":" + e.type + ":" + (e.playerId || "") + ":" + (e.hand || "");
    if (seenEv.has(key)) continue;
    seenEv.add(key);
    if (seenEv.size > 400) seenEv.delete(seenEv.values().next().value);
    if (!feedReady) continue; // первый снимок: старые события не пересказываем
    switch (e.type) {
      case "level": { if (state.hand <= 1) break; const ov = e.overtime, mb = e.minBet; feedSys(() => (ov ? tpl("ev_overtime", { p: ov }) : tpl("ev_level", { n: bjNum(mb) })), true); break; }
      case "card_reveal": { const self = BJ_TRICKS[e.card] && BJ_TRICKS[e.card].self; const by = nameOf(e.playerId), tg = nameOf(e.target), c = e.card, o = e.outcome;
        feedSys(() => tpl(self ? "ev_card_self" : "ev_card", { by, target: tg, card: bjTrickName(c) }) + (o === "ok" ? "" : ` — ${T("out_" + o)}`)); break; }
      case "penalty": { const nm = nameOf(e.playerId), n = e.amount; feedSys(() => tpl("ev_penalty", { name: nm, n: bjNum(n) })); break; }
      case "out": { const nm = nameOf(e.playerId); feedSys(() => tpl("ev_out", { name: nm }), true); break; }
      case "allin": { const nm = nameOf(e.playerId); feedSys(() => tpl("ev_allin", { name: nm }), true); break; }

let resultsHand = -1;
function resultsToFeed() {

// ---------- Марго комментирует фазы (§8 п.3): первые 3 раздачи развёрнуто, до 10 коротко, дальше только события ----------
let sayTimer = 0;
function margotSay(text, ms) { clearTimeout(sayTimer); if (table) table.say(text, ms || 4200); }
function margotLater(text, ms, delay) { clearTimeout(sayTimer); sayTimer = setTimeout(() => margotSay(text, ms), delay); }
let phaseKey = "";
function margotPhase(prevState) {
  const s = state;
  const key = s.game + ":" + s.hand + ":" + s.phase + ":" + s.wave;
  if (key === phaseKey) return;
  phaseKey = key;
  const h = s.hand;
  const long = h <= 3, short = h > 3 && h <= 10;
  if (prevState && s.level > prevState.level && s.phase !== "lobby") { margotSay(tpl("m_level", { n: bjNum(s.minBet) }), 4200); return; }
  if (s.format === "tournament" && s.cutIn === 0 && s.phase === "betting") { margotLater(T("m_cut"), 4200, 600); return; }
  switch (s.phase) {
    case "betting":
      if (h === 1 && long) { margotSay(T("m_start"), 6500); margotLater(tpl("m_bets_long", { n: bjNum(s.minBet) }), 4800, 6800); }
      else if (long) margotSay(tpl("m_bets_long", { n: bjNum(s.minBet) }), 4800);
      else if (short) margotSay(tpl("m_bets_short", { n: bjNum(s.minBet) }), 3000);
      break;
    case "deciding":
      if (s.wave !== 1) break;
      if (long) margotSay(T("m_decide_long"), 4800);
      else if (short) margotSay(T("m_decide_short"), 2500);
      break;
    case "dealer":
      if (long && s.dealer && s.dealer.cards && s.dealer.cards.length) margotSay(T("m_dealer"), 3500);
      break;
    case "payout":
      if (long) margotLater(T("m_payout"), 5200, 1400);
      break;
  }
}

  const A = [card("K", "s"), card("6", "h")], B = [card("Q", "d"), card("10", "c")], up = card("9", "d"), hole = card("7", "h"), draw = card("2", "s"), hitCard = card("9", "c");
  // реплика — после render() и с hold: автореплики рендерера на ту же перемену не перекрывают урок

  const step = (t, fn) => demo.timers.push(setTimeout(() => { if (!demo.on) return; s.now = Date.now(); line = null; fn(); table.render(JSON.parse(JSON.stringify(s))); if (line) { clearTimeout(sayTimer); table.say(line[0], line[1], { hold: true }); } }, t));
  if (table.setAutoSay) table.setAutoSay(false);

  step(8800, () => { s.players[1].bet = 100; s.players[1].stack -= 100; });
  step(11300, () => { s.phase = "closing"; s.phaseEndsAt = 0; });
  step(12400, () => { s.phase = "dealing"; say(T("d_deal"), 3800); });

}
function drawPauseNext() {
  const on = !!(state && state.pauseNext && state.phase !== "paused" && state.phase !== "lobby" && state.phase !== "finished");
  $("pausenext").classList.toggle("hidden", !on);
  if (on) $("pausenext").textContent = "II " + T("pause_next");
}

// ---------- сообщения ----------
let prevState = null;
function render(force) {
  if (dead || !state) return;
  applyFx();
  if (demo.on) { if (state.phase !== "lobby") demo.stop(); else return; }
  const snap = adapt(state);
  table.render(snap);
  if (table.state.snap === snap) { /* рендерер хранит наш снимок */ }
  drawLobby();
  drawCtrl();
  drawFinal();
  drawPauseNext();
  syncChat();
  feedEvents();
  margotPhase(prevState);
  feedReady = true;
  prevState = state;
}

function onMessage(m) {
  switch (m.type) {
    case "hello":
      state = m.state;
      if (goneFlow) goneFlow.hello();
      if (m.state && !isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      // новая партия — лента прошлой больше не нужна
      if (state && m.state && m.state.game !== state.game) { feedClear(); resultsHand = -1; }
      state = m.state;
      render();
      break;
    case "host_ok":
      isHost = true; hostLost = false; pasteOpen = false;
      document.body.classList.add("host");
      $("lobby").dataset.built = "";
      render();
      break;
    case "host_lost":
      isHost = false; hostLost = true;
      document.body.classList.remove("host");
      $("lobby").dataset.built = "";
      render();
      break;
    case "event": {
      const e = m.event || {};
      if (e.type === "react") floatAt(e.playerId, e.emoji);
      else if (e.type === "cheer") { floatAt(e.forId, "💛", nameOf(e.playerId)); const a = nameOf(e.playerId), b = nameOf(e.forId); feedSys(() => tpl("ev_cheer", { name: a, forName: b })); }
      else if (e.type === "rejoin") { const rn = nameOf(e.playerId); feedSys(() => tpl("ev_rejoin", { name: rn })); }
      break;
    }
    case "error":
      if (m.error === "room_expired") onRoomGone();
      if (m.error === "bad host token") {
        hostLost = false;
        try { localStorage.removeItem(hostKey()); } catch (e) {}
        pasteOpen = true;
        setHostNote(T("host_bad"));
      }
      break;
  }
}

const goneFlow = window.MP && MP.roomGone ? MP.roomGone({ showForm: () => gone("noroom"), onClosed: () => gone("expired") }) : null;
function onRoomGone() { if (goneFlow) goneFlow.gone(); else gone("expired"); }
function gone(key) {
  dead = true;
  demo.stop();
  $("lobby").classList.add("hidden");
  $("center").innerHTML = `<div class="banner">${escapeHtml(T(key === "noroom" ? "noroom" : "expired"))}</div>`;
}

window.addEventListener("langchange", () => {
  $("lobby").dataset.built = "";
  ctrlKey = "";
  if (table) table.setLang(lang());
  feedRetranslate();
  if (state) render(true);
});

// фоновый шум зала — после первого жеста (браузер не даёт звук без него), только в игре
let ambientOn = false;
window.addEventListener("pointerdown", () => {
  if (ambientOn || !window.BJSfx || !state) return;
  ambientOn = true;
  BJSfx.ambient(true);
}, { passive: true });

async function boot() {
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  makeTable();
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  conn = bjConnect({
    code: CODE,
    onMessage,
    onGone: onRoomGone,
    onOpen: () => { isHost = false; },
    auth: () => { let t = null; try { t = localStorage.getItem(hostKey()); } catch (e) {} return t ? "&h=" + encodeURIComponent(t) : ""; },
    onQuiet: (q) => { banner.textContent = T("conn_quiet"); banner.classList.toggle("on", q); },
    onState: (st) => { banner.textContent = T("err_connect"); banner.classList.toggle("on", st === "lost"); },
  });
  // ручка для отладки и стенда: те же сообщения, что шлют кнопки доски
  window.bjBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; }, demo };
}
boot();
</script>
