Скорость", "desc": "Стремительное развитие. Результаты раньше ожидаемого.", "ext": "Восемь жезлов летят в воздухе — всё стремительно ускоряется и движется к финалу. Коммуникации налаживаются, события разворачиваются быстрее ожидаемого. Сохраняйте фокус — результаты появятся раньше, чем вы думаете."}, "30": {"name": "Девятка Жезлов", "suit": "Жезлы", "tag": "Стойкость", "desc": "Устали, но финишная прямая близко.", "ext": "Усталый воин, опирающийся на жезл, знает — до финиша уже недалеко. Раны есть, но накопленный опыт создал несокрушимую внутреннюю силу. Последний рывок — и победа будет полной."}, "31": {"name": "Десятка Жезлов", "suit": "Жезлы", "tag": "Бремя", "desc": "Слишком много ответственности. Делегируйте.", "ext": "Человек, согнувшийся под тяжестью десяти жезлов, несёт слишком много в одиночку. Цель близко, но ноша чрезмерна — пора честно признать это и перераспределить нагрузку. Делегируйте и откажитесь от лишнего: лёгкость движения важнее самодостаточности."}, "32": {"name": "Паж Жезлов", "suit": "Жезлы", "tag": "Энтузиазм", "desc": "Свежая энергия и жажда приключений.", "ext": "Юный Паж с жезлом вглядывается вдаль — новая идея зажгла огонь энтузиазма. Свежая энергия и жажда приключений открывают двери, которые раньше были закрыты. Действуйте из вдохновения, пока искра горит ярко."}, "33": {"name": "Рыцарь Жезлов", "suit": "Жезлы", "tag": "Порыв", "desc": "Страстный порыв и смелые действия.", "ext": "Огненный Рыцарь устремляется вперёд на вздыбленном коне — страсть и смелость его главные союзники. Энергия и харизма притягивают людей и обстоятельства. Действуйте решительно, но следите, чтобы пыл не превратился в безрассудство."}, "34": {"name": "Королева Жезлов", "suit": "Жезлы", "tag": "Уверенность", "desc": "Тёплая, уверенная энергия. Доверяйте огню.", "ext": "Тёплая, уверенная Королева сидит с подсолнухом — воплощение жизнерадостности и внутренней силы. Её энергия притягивает людей и освещает любое пространство вокруг. Доверяйте своему огню — он ведёт вас верной дорогой."}, "35": {"name": "Король Жезлов", "suit": "Жезлы", "tag": "Лидерство", "desc": "Прирождённый лидер с чётким видением.", "ext": "Несгибаемый Король Жезлов — прирождённый лидер с ясным видением и непоколебимой волей. Его страсть к жизни создаёт вокруг него целые империи. Возьмите бразды правления и двигайтесь к цели без колебаний."}, "36": {"name": "Туз Кубков", "suit": "Кубки", "tag": "Любовь", "desc": "Новый эмоциональный этап — любовь и обновление.", "ext": "Переполненная чаша, из которой льётся вода — образ безусловной любви и нового эмоционального начала. Сердце открывается навстречу чему-то светлому и подлинному. Примите этот дар чистых чувств с доверием и благодарностью."}, "37": {"name": "Двойка Кубков", "suit": "Кубки", "tag": "Партнёрство", "desc": "Гармоничный союз и глубокая связь.", "ext": "Двое обмениваются кубками в акте равноправного союза — это начало глубокой и искренней связи. Гармоничное партнёрство строится на взаимном уважении и готовности отдавать. Отношения, рождённые сейчас, будут иметь подлинную эмоциональную глубину."}, "38": {"name": "Тройка Кубков", "suit": "Кубки", "tag": "Веселье", "desc": "Праздник, дружба и радость общения.", "ext": "Три женщины поднимают кубки в радостном танце — дружба, изобилие и праздник наполняют жизнь. Время отмечать совместные достижения и ценить тех, кто рядом. Социальные связи укрепляются, и общение приносит истинную радость."}, "39": {"name": "Четвёрка Кубков", "suit": "Кубки", "tag": "Апатия", "desc": "Невнимание к хорошему. Дар прямо перед вами.", "ext": "Человек, погружённый в апатию, не замечает кубок, протянутый из облака прямо перед ним. Дар находится в поле зрения — нужно лишь поднять взгляд от того, что надоело. Выход из застоя — внимание к настоящему моменту и его возможностям."}, "40": {"name": "Пятёрка Кубков", "suit": "Кубки", "tag": "Утрата", "desc": "Горечь потери. Но два кубка стоят — не всё потеряно.", "ext": "Три кубка опрокинуты в горе, но два стоят позади — не всё потеряно. Боль утраты реальна, но за спиной есть мост к дому и будущему. Оплакав потерянное, обернитесь — там ещё есть на что опираться."}, "41": {"name": "Шестёрка Кубков", "suit": "Кубки", "tag": "Ностальгия", "desc": "Тёплые воспоминания и связь с прошлым.", "ext": "Дети обмениваются цветами в кубках — образ тёплых воспоминаний и невинной детской радости. Прошлое напоминает о себе добрым образом, предлагая исцеляющую ностальгию. Связь с детской чистотой и простотой восстанавливает силы."}, "42": {"name": "Семёрка Кубков", "suit": "Кубки", "tag": "Фантазии", "desc": "Отделите реальное от воздушных замков.", "ext": "Семь кубков с разными сокровищами и иллюзиями плывут в облаках грёз. Не все манящие возможности одинаково реальны и достойны погони. Трезво оцените варианты, выберите один и воплощайте его с полной отдачей."}, "43": {"name": "Восьмёрка Кубков", "suit": "Кубки", "tag": "Уход", "desc": "Время оставить то, что не наполняет.", "ext": "Человек уходит ночью, оставляя позади аккуратно выстроенные восемь кубков. Поиск более глубокого смысла требует жертвы тем, что когда-то казалось достаточным. Отпустить наполненное, но уже не питающее — это мужество, а не слабость."}, "44": {"name": "Девятка Кубков", "suit": "Кубки", "tag": "Исполнение", "desc": "Исполнение желаний. Вы это заслужили.", "ext": "Довольный человек сидит перед рядом кубков — образ исполненного желания и заслуженного удовольствия. Вы вложили усилия и вправе наслаждаться результатом без вины. Это ваш момент изобилия — примите его полностью."}, "45": {"name": "Десятка Кубков", "suit": "Кубки", "tag": "Счастье", "desc": "Полное счастье и семейная гармония.", "ext": "Радуга из десяти кубков над счастливой семьёй — образ высшего эмоционального благополучия. Гармония в отношениях, дом наполнен любовью, и душа поёт. Всё, о чём мечталось в плане счастья, собирается воедино."}, "46": {"name": "Паж Кубков", "suit": "Кубки", "tag": "Мечтатель", "desc": "Мечтательная энергия. Новое чувство стучится.", "ext": "Юный Паж удивлённо смотрит на рыбку в кубке — послание из мира чувств и воображения. Интуитивное, мечтательное начало открывает новый эмоциональный горизонт. Будьте открыты к творческим и романтическим импульсам, которые просятся наружу."}, "47": {"name": "Рыцарь Кубков", "suit": "Кубки", "tag": "Романтик", "desc": "Благородный романтик. Красота спасёт мир.", "ext": "Романтичный Рыцарь движется вперёд плавно, как вода — он несёт предложение или вдохновляющее послание. Красота, чувствительность и идеализм — его оружие. Следуйте за тем, что глубоко трогает сердце, даже если это кажется нереалистичным."}, "48": {"name": "Королева Кубков", "suit": "Кубки", "tag": "Эмпатия", "desc": "Глубокая интуиция и эмоциональная мудрость.", "ext": "Задумчивая Королева созерцает кубок — воплощение глубочайшей интуиции и эмоциональной мудрости. Она чувствует то, что другие не видят, и принимает решения из глубины душевного знания. Доверяйте эмоциональному интеллекту больше, чем холодному расчёту."}, "49": {"name": "Король Кубков", "suit": "Кубки", "tag": "Мудрость", "desc": "Эмоциональная зрелость. Спокойная сила.", "ext": "Король восседает на троне посреди бурного моря — он управляет стихией чувств без подавления. Эмоциональная зрелость позволяет ему быть сострадательным лидером. Спокойная внутренняя сила притягивает доверие и создаёт пространство для других."}, "50": {"name": "Туз Мечей", "suit": "Мечи", "tag": "Прорыв", "desc": "Интеллектуальный прорыв и ясность мысли.", "ext": "Сверкающий меч пронзает облака — это момент интеллектуального прорыва и абсолютной ясности. Истина обнажается, иллюзии рассеиваются, и путь вперёд становится очевидным. Используйте эту ясность, чтобы принять решение, которое откладывали."}, "51": {"name": "Двойка Мечей", "suit": "Мечи", "tag": "Тупик", "desc": "Сложный выбор. Снимите повязку.", "ext": "Женщина с повязкой на глазах держит скрещённые мечи — она боится выбора и застыла в тупике. Снять повязку и взглянуть на ситуацию прямо — единственный выход. Решение уже назрело; нужна лишь смелость его принять."}, "52": {"name": "Тройка Мечей", "suit": "Мечи", "tag": "Боль", "desc": "Сердечная боль или горькая правда.", "ext": "Три меча пронзают сердце на фоне дождя — образ сердечной боли или горькой правды. Честность ранит, но именно она открывает путь к подлинному исцелению. Позвольте боли пройти сквозь вас — она очищает и освобождает."}, "53": {"name": "Четвёрка Мечей", "suit": "Мечи", "tag": "Отдых", "desc": "Восстановление сил и перезагрузка.", "ext": "Рыцарь лежит в безмолвии часовни — это намеренное уединение и восстановление истощённых сил. Передышка перед новыми сражениями — не слабость, а стратегическая мудрость. Позвольте телу и разуму полностью перезарядиться."}, "54": {"name": "Пятёрка Мечей", "suit": "Мечи", "tag": "Поражение", "desc": "Конфликт без победителей. Иногда лучше отступить.", "ext": "Победитель собирает мечи поверженных, но его лицо не светится торжеством. Пиррова победа оставляет всех в проигрыше — такой конфликт истощает все стороны. Иногда мудрее отступить, чем одержать разрушительную победу."}, "55": {"name": "Шестёрка Мечей", "suit": "Мечи", "tag": "Переход", "desc": "К спокойным водам. Впереди — покой.", "ext": "Перевозчик везёт путника с мечами к спокойным водам вдали — трудные времена постепенно уходят. Движение к исцелению и покою уже началось, даже если ещё не ощущается в полной мере. Впереди — более тихая и безопасная пристань."}, "56": {"name": "Семёрка Мечей", "suit": "Мечи", "tag": "Обман", "desc": "Скрытые намерения. Будьте бдительны.", "ext": "Фигура крадёт мечи из лагеря — скрытые намерения и тактические манёвры присутствуют в ситуации. Не всё то, чем кажется, и не все действуют с открытыми картами. Сохраняйте бдительность и доверяйте только проверенным."}, "57": {"name": "Восьмёрка Мечей", "suit": "Мечи", "tag": "Ловушка", "desc": "Чувство загнанности — но клетка не заперта.", "ext": "Женщина в повязке окружена мечами, но они лишь обозначают пространство, не создавая реальной ловушки. Ограничения существуют прежде всего в уме, а не во внешних обстоятельствах. Осмелившись снять повязку, вы обнаружите свободу."}, "58": {"name": "Девятка Мечей", "suit": "Мечи", "tag": "Тревога", "desc": "Навязчивые мысли. Большинство страхов беспочвенны.", "ext": "Человек просыпается в ужасе — девять мечей нависают в темноте, воплощая тревогу и ночные страхи. Большинство из этих страхов существуют только в уме и преувеличивают реальную угрозу. Рассвет и перспектива другого человека принесут облегчение."}, "59": {"name": "Десятка Мечей", "suit": "Мечи", "tag": "Конец", "desc": "Болезненный финал. Рассвет следует за тьмой.", "ext": "Фигура лежит с десятью мечами в спине — окончательный крах того, что нельзя было удержать. Это болезненный финал, но рассвет уже розовеет на горизонте. От этого дна можно только подняться, и новый цикл начнётся более мудрым."}, "60": {"name": "Паж Мечей", "suit": "Мечи", "tag": "Любопытство", "desc": "Острый ум и жажда знаний.", "ext": "Молодой Паж с мечом наготове — острый ум, полный готовности и любопытства. Он не боится задавать неудобные вопросы и смотреть в лицо неприятным истинам. Интеллектуальная смелость и честность открывают двери, которые казались закрытыми."}, "61": {"name": "Рыцарь Мечей", "suit": "Мечи", "tag": "Напор", "desc": "Стремительность и прямота.", "ext": "Рыцарь мчится вперёд на полном скаку — стремительность, прямота и напор его отличительные черты. Он действует быстро и решительно, не задерживаясь на сомнениях. Следите, чтобы скорость не отменяла точность и такт."}, "62": {"name": "Королева Мечей", "suit": "Мечи", "tag": "Ясность", "desc": "Чистый разум и объективность.", "ext": "Королева сидит с мечом поднятым — её взгляд ясен, а суждения непредвзяты и точны. Мудрость, рождённая из личного опыта и честности, позволяет видеть суть без иллюзий. Объективность и прямота сейчас важнее дипломатической мягкости."}, "63": {"name": "Король Мечей", "suit": "Мечи", "tag": "Авторитет", "desc": "Интеллектуальный авторитет и стратегия.", "ext": "Король Мечей — воплощение интеллектуального авторитета, стратегического мышления и беспристрастной справедливости. Его разум острее любого клинка, а решения принимаются с холодной точностью. Мудрость разума создаёт порядок там, где царил хаос."}, "64": {"name": "Туз Пентаклей", "suit": "Пентакли", "tag": "Процветание", "desc": "Новая финансовая возможность. Начало процветания.", "ext": "Золотая монета с пентаграммой протянута из облака — это начало реального, осязаемого процветания. Новая финансовая возможность или материальный фундамент входит в жизнь. Используйте этот шанс с практической мудростью и долгосрочным видением."}, "65": {"name": "Двойка Пентаклей", "suit": "Пентакли", "tag": "Баланс", "desc": "Жонглирование обязанностями. Гибкость — ключ.", "ext": "Жонглёр балансирует двумя монетами на фоне бурного моря — гибкость в управлении ресурсами. Жизнь требует умелого жонглирования приоритетами, и вы справляетесь лучше, чем кажется. Сохраняйте лёгкость и адаптивность, не теряя внутреннего стержня."}, "66": {"name": "Тройка Пентаклей", "suit": "Пентакли", "tag": "Мастерство", "desc": "Признание навыков и командная работа.", "ext": "Мастер-каменщик представляет план монахам — командная работа и признание профессиональных навыков. Ваши умения замечены и оценены по достоинству теми, кто имеет значение. Сотрудничество и мастерство создают нечто большее, чем возможно в одиночку."}, "67": {"name": "Четвёрка Пентаклей", "suit": "Пентакли", "tag": "Контроль", "desc": "Безопасность граничит с жадностью.", "ext": "Человек сжимает монеты в напряжённой позе — стремление к безопасности переходит в жадность. Страх потери блокирует новые возможности и не позволяет деньгам работать. Отпустите контроль там, где он превратился в скованность."}, "68": {"name": "Пятёрка Пентаклей", "suit": "Пентакли", "tag": "Нужда", "desc": "Финансовые трудности. Помощь ближе, чем кажется.", "ext": "Две фигуры бредут в снегу мимо освещённого витража — нужда рядом с помощью. Ресурсы и поддержка ближе, чем кажется — нужно лишь повернуть голову и попросить. Трудности временны; одиночество в беде необязательно."}, "69": {"name": "Шестёрка Пентаклей", "suit": "Пентакли", "tag": "Щедрость", "desc": "Время давать и получать.", "ext": "Щедрый купец взвешивает дары — время давать с умом и с благодарностью принимать. Баланс между щедростью и мудрым распределением ресурсов создаёт устойчивую гармонию. Отдавая, вы запускаете поток изобилия в обоих направлениях."}, "70": {"name": "Семёрка Пентаклей", "suit": "Пентакли", "tag": "Терпение", "desc": "Плоды не созрели. Результат придёт.", "ext": "Фермер смотрит на созревающий урожай — плоды ещё не готовы, но рост очевиден. Инвестиции созревают, и только терпение отличает успех от преждевременного разочарования. Продолжайте заботиться о посеянном."}, "71": {"name": "Восьмёрка Пентаклей", "suit": "Пентакли", "tag": "Усердие", "desc": "Кропотливый труд. Совершенство из повторения.", "ext": "Мастер кропотливо вырезает монеты одну за другой — совершенство достигается только повторением. Каждый час практики и каждое усилие приближают к подлинному мастерству. Погружение в детали работы приносит не только результат, но и глубокое удовлетворение."}, "72": {"name": "Девятка Пентаклей", "suit": "Пентакли", "tag": "Достаток", "desc": "Заслуженное изобилие и самодостаточность.", "ext": "Независимая женщина в цветущем саду — образ заслуженного изобилия и самодостаточности. Вы создали своё пространство благополучия собственными усилиями и умом. Наслаждайтесь плодами — вы это заработали."}, "73": {"name": "Десятка Пентаклей", "suit": "Пентакли", "tag": "Наследие", "desc": "Семейное богатство и стабильность.", "ext": "Многопоколенческая семья под аркой — богатство, традиции и прочный семейный фундамент. То, что создаётся сейчас, переживёт вас и станет подлинным наследием. Стабильность и изобилие распространяются на всех близких."}, "74": {"name": "Паж Пентаклей", "suit": "Пентакли", "tag": "Ученик", "desc": "Жажда знаний и первые шаги.", "ext": "Юный Паж внимательно изучает пентакль, стоя среди цветущего поля — жажда практических знаний. Первые шаги к мастерству требуют усердия и готовности учиться на каждом опыте. Прочный фундамент, заложенный сегодня, даст плоды завтра."}, "75": {"name": "Рыцарь Пентаклей", "suit": "Пентакли", "tag": "Надёжность", "desc": "Медленно, но верно к цели.", "ext": "Рыцарь стоит неподвижно на тяжёлом коне — медленно, но верно к намеченной цели. Его сила в неуклонности, надёжности и методичном движении вперёд без спешки. Стабильность и упорство важнее скорости на этом этапе пути."}, "76": {"name": "Королева Пентаклей", "suit": "Пентакли", "tag": "Забота", "desc": "Практичная мудрость и забота о близких.", "ext": "Задумчивая Королева держит пентакль с заботой — воплощение практической мудрости и материнского начала. Она создаёт уют, заботится о близких и управляет ресурсами с любовью и умом. Земля, тело и дом требуют вашего внимания прямо сейчас."}, "77": {"name": "Король Пентаклей", "suit": "Пентакли", "tag": "Империя", "desc": "Финансовый успех и деловая хватка.", "ext": "Король Пентаклей сидит на троне в окружении виноградных листьев — мастер процветания и деловой хватки. Финансовая проницательность и щедрость создают устойчивую, долгосрочную империю. Мудрость распоряжения ресурсами — высшее из материальных искусств."}}, "pos": ["Прошлое", "Настоящее", "Будущее"], "pos_d": ["Эта карта отражает влияние прошлого — события и энергии, которые привели вас к текущему моменту.", "Карта настоящего показывает ключевые энергии, вызовы и возможности текущего момента.", "Карта будущего указывает на наиболее вероятное развитие событий при текущем курсе."], "intents": {"Любовь": ["Что ждёт меня в любви?", "Стоит ли мне открыться?", "Когда он напишет?", "Каков мой партнёр?", "Готов ли я к любви?", "Готов ли он к любви?", "Взаимны ли чувства?", "Как улучшить отношения?", "Есть ли будущее у нас?"], "Карьера": ["Каковы мои перспективы?", "Стоит ли менять работу?", "Как расти в карьере?", "Подходит ли мне моя сфера?", "Когда придёт успех?", "Стоит ли открыть дело?", "Можно ли ускорить мой рост?", "Смогу ли найти работу мечты?", "Правильный ли это путь?"], "Финансы": ["Что ждёт меня в финансах?", "Как улучшить мои доходы?", "Стоит ли рисковать?", "Когда придёт достаток?", "Скоро ли закрою ипотеку?", "Стоит ли брать кредит?", "Скоро ли я создам накопления?", "Правильно ли я трачу?", "Придёт ли мне удача?"], "Здоровье": ["Каково моё здоровье?", "Как улучшить здоровье?", "Как обрести баланс?", "Что говорит моё тело?", "Когда я смогу снизить стресс?", "Что даёт мне силы?", "Что важно для здоровья?", "Как найти гармонию?", "Где искать исцеление?"], "Общий": ["Что ждёт меня впереди?", "Какой урок несёт судьба?", "Как я буду жить через 5 лет?", "Как принять решение?", "Когда я стану счастлив?", "Моя жизнь движется к лучшему?", "Чего я не вижу в себе?", "Придет ли мне удача?", "Смогу ли найти свой путь?"]}, "energy_4": ["Карты излучают мощную позитивную энергию. Расклад однозначно благоприятный — вселенная на вашей стороне.", "Три карты формируют исключительно сильный позитивный поток. Удача, возможности и внутренняя сила сходятся воедино.", "Расклад переполнен созидательной энергией. Всё складывается в вашу пользу — действуйте смело и без колебаний.", "Мощный благоприятный расклад. Карты говорят: вы в потоке — используйте этот момент полностью."], "energy_2": ["Общий фон расклада — благоприятный с нюансами. Возможности открыты, но потребуется внимательность к деталям.", "Карты показывают позитивную картину с отдельными зонами роста. Направление верное — продолжайте двигаться вперёд.", "Расклад в целом обнадёживающий. Энергия поддерживает ваши намерения, хотя потребуется определённая гибкость.", "Позитивный фон с призывом к осознанности. У вас есть всё необходимое — важно правильно направить усилия."], "energy_0": ["Расклад показывает неоднозначную картину. Здесь есть и потенциал, и предостережения — баланс в ваших руках.", "Карты отражают переходный период. Старое уступает место новому, и именно от вас зависит, каким будет это новое.", "Ситуация находится на развилке. Расклад нейтральный — то, что произойдёт дальше, определят ваши решения.", "Энергия момента неустойчива, но управляема. Осознанность сейчас важнее скорости."], "energy_m2": ["Карты указывают на непростой период. Это время испытаний, но именно они формируют характер.", "Расклад говорит о напряжённом, но важном этапе. Трудности — не приговор, а сигнал к переосмыслению.", "Энергия момента требовательна. Карты призывают не к бегству, а к честному взгляду на происходящее.", "Непростой расклад, требующий мужества. Важно не сопротивляться потоку, а найти в нём опору."], "energy_m4": ["Расклад отражает серьёзные вызовы. Сейчас время для внутренней работы и переосмысления пути.", "Карты говорят об интенсивном периоде трансформации. Разрушается то, что уже не служит вам.", "Тяжёлый расклад, требующий честности с собой. Не время для иллюзий — время для глубокой работы.", "Карты показывают точку минимума. Именно отсюда начинается путь вверх — если позволить себе измениться."], "outlook_4": ["Доверьтесь потоку и действуйте уверенно.", "Смело следуйте своему пути — звёзды на вашей стороне.", "Позвольте себе принимать удачу — вы её заслуживаете.", "Действуйте решительно: сейчас всё, за что вы беретесь, имеет шанс расцвести."], "outlook_2": ["Ситуация складывается в вашу пользу — не упустите момент.", "Идите вперёд с уверенностью, оставаясь чуткими к изменениям.", "Потенциал велик — вопрос лишь в том, как вы им воспользуетесь.", "Путь открыт. Ваши действия сейчас определят результат."], "outlook_0": ["Результат зависит от ваших решений — будьте осознанны в каждом шаге.", "Путь не предопределён — именно сейчас вы пишете свою историю.", "Баланс сил ровный. Небольшое усилие в нужном направлении изменит всё.", "Карты дают вам свободу выбора — воспользуйтесь ею мудро."], "outlook_m2": ["Проявите терпение — после тёмной полосы всегда наступает рассвет.", "Испытания временны. То, что вы сейчас строите внутри себя, останется навсегда.", "Самое тёмное время — перед рассветом. Держитесь своего пути.", "Кризис — это приглашение к росту. Примите его с достоинством."], "outlook_m4": ["Замедлитесь, прислушайтесь к себе и не принимайте резких решений.", "Остановитесь. Иногда лучшее, что можно сделать — это не делать ничего.", "Дайте себе время. Внутренняя тишина сейчас ценнее любых действий.", "Отпустите контроль. Позвольте ситуации разрешиться своим путём."], "adv_2": ["Ситуация развивается от сложного к светлому — будущее обещает значительное улучшение.", "Траектория расклада восходящая. Вы уже прошли самое трудное — впереди открывается новое пространство.", "Прошлое было уроком, настоящее — переходом, будущее — наградой. Вы на верном пути.", "Динамика вашего расклада говорит о росте. С каждым шагом ситуация становится светлее."], "adv_1": ["Динамика положительная — каждый следующий шаг приближает к лучшему.", "Вектор движения верный. Продолжайте в том же духе — результаты не заставят себя ждать.", "Прогресс налицо. Карты подтверждают: вы двигаетесь в нужном направлении.", "Ситуация улучшается. Доверяйте процессу — он ведёт вас туда, куда нужно."], "adv_0": ["Энергия стабильна — ключевые изменения зависят от ваших осознанных действий.", "Ситуация устойчива. Для перемен потребуется ваша инициатива — они сами не придут.", "Плато — это не конец, это платформа для следующего прыжка. Готовьтесь.", "Баланс сохраняется. Ваш следующий осознанный шаг сдвинет ситуацию с места."], "adv_m1": ["Будьте внимательны к деталям — впереди могут быть подводные камни.", "Нисходящая динамика призывает к осторожности. Сейчас лучше наблюдать, чем торопиться.", "То, что кажется хорошим прямо сейчас, может не быть таковым завтра. Смотрите глубже.", "Ситуация требует пересмотра. Не форсируйте события — дайте себе время увидеть полную картину."], "adv_m2": ["Стоит замедлиться и пересмотреть подход — осторожность сейчас важнее скорости.", "Тенденция к ухудшению говорит о том, что выбранный путь требует пересмотра.", "Прежде чем двигаться дальше, оглянитесь. Что вы оставили незавершённым? Ответ там.", "Карты настойчиво советуют взять паузу. Импульсивные решения сейчас могут стоить дорого."], "c_health_3": ["Энергия восстановления и жизненной силы на вашей стороне — прекрасное время для укрепления здоровья.", "Карты говорят о жизненной силе и обновлении. Организм готов к восстановлению — помогите ему.", "Мощный поток целительной энергии. Всё, что вы сделаете сейчас для здоровья, принесёт плоды."], "c_health_1": ["Здоровье укрепляется — продолжайте заботиться о себе и слушать своё тело.", "Положительная динамика. Ваше тело восстанавливается — дайте ему время и поддержку.", "Карты поддерживают ваш путь к здоровью. Не останавливайтесь — вы на верном пути."], "c_health_0": ["Уделите внимание внутреннему балансу — тело и дух неразрывно связаны.", "Тело просит внимания. Прислушайтесь к его сигналам — они появились не случайно.", "Здоровье требует более осознанного подхода. Начните с малого: сон, питание, покой."], "c_health_n": ["Прислушайтесь к себе и не игнорируйте сигналы тела — покой и забота о себе сейчас важнее всего.", "Карты настаивают: здоровье важнее любых планов. Остановитесь и позаботьтесь о себе.", "Тело говорит вам что-то важное. Не отмахивайтесь — прислушайтесь и действуйте."], "c_love_3": ["Сейчас прекрасное время для любви — откройте сердце навстречу чувствам.", "Карты поют о любви. Позвольте себе быть уязвимым — именно это открывает двери к настоящей близости.", "Мощная любовная энергия в раскладе. То, что вы ищете, уже ищет вас.", "Сердце готово. Карты говорят — не откладывайте. Любовь не терпит промедления."], "c_love_1": ["В сфере чувств ожидается развитие — будьте честны с собой и партнёром.", "Отношения движутся вперёд. Открытость и честность — ключи к следующему уровню близости.", "Карты видят потенциал для роста в ваших отношениях. Инвестируйте в них время и внимание."], "c_love_0": ["Отношения потребуют работы и терпения, но потенциал для роста есть.", "Сейчас время честного разговора — с собой и с близкими. Ясность лучше иллюзий.", "Карты показывают точку равновесия. Что вы хотите сохранить, а что отпустить — только ваш выбор."], "c_love_n": ["Сейчас важно разобраться в своих истинных чувствах, прежде чем двигаться дальше.", "Отношения проходят испытание. Это не конец — это возможность увидеть, что действительно важно.", "Карты призывают к честности. Отношения без правды не имеют будущего — но правда может всё изменить."], "c_career_3": ["Профессиональная сфера открывает отличные возможности — время действовать.", "Карты указывают на период профессионального расцвета. Амбиции сейчас — не грех, а необходимость.", "Всё, что вы вложили в своё дело, начинает приносить плоды. Не останавливайтесь.", "Звёздный момент для карьерного роста. Покажите себя — мир готов вас принять."], "c_career_1": ["На работе наметился прогресс — будьте инициативны и не бойтесь перемен.", "Карты поддерживают ваш профессиональный путь. Сделайте шаг навстречу тому, чего хотите.", "Хороший момент для карьерных решений. Доверяйте своей экспертизе."], "c_career_0": ["В карьере предстоят перемены — адаптируйтесь и ищите новые подходы.", "Карты говорят о необходимости пересмотра профессионального пути. Это не кризис — это рост.", "Переходный период в карьере. Используйте его для развития новых навыков."], "c_career_n": ["Стоит пересмотреть свой профессиональный путь и расставить приоритеты.", "Карты предупреждают о профессиональных трудностях. Лучшее — честно оценить ситуацию.", "Сейчас не лучшее время для рискованных карьерных шагов. Укрепите фундамент."], "c_fin_3": ["Финансовая ситуация складывается очень благоприятно — действуйте решительно.", "Карты открывают период финансового изобилия. Время воплощать задуманное.", "Деньги движутся к вам. Оставайтесь открытыми к неожиданным возможностям.", "Мощный финансовый потенциал в раскладе. Ваши вложения дадут плоды."], "c_fin_1": ["Денежные перспективы позитивны, но требуют взвешенного подхода.", "Финансовая ситуация улучшается. Продолжайте двигаться в выбранном направлении.", "Карты видят рост. Разумные шаги сейчас заложат основу для будущего благополучия."], "c_fin_0": ["Будьте осмотрительны в денежных вопросах, но не упускайте реальные шансы.", "Финансовый баланс требует внимания. Считайте не только деньги, но и ресурсы.", "Карты советуют: прежде чем тратить, спросите — это нужда или желание?"], "c_fin_n": ["Сейчас лучше воздержаться от крупных трат и рискованных вложений.", "Карты предупреждают о финансовой нестабильности. Сохраните то, что есть.", "Время финансовой сдержанности. Каждая сэкономленная копейка — вклад в будущую свободу."], "c_gen_3": ["Сейчас очень благоприятный период — энергия на вашей стороне, можно смело двигаться вперёд.", "Карты дают ясный ответ: все складывается отлично. Действуйте — момент благоприятен.", "Всё складывается лучшим образом. Доверьтесь процессу и делайте то, что подсказывает сердце.", "Редкий расклад полного благоприятствования. Используйте этот период с умом."], "c_gen_1": ["Ситуация в целом складывается позитивно — доверяйте себе и будьте внимательны к знакам.", "Карты поддерживают вас. Идите вперёд с открытым сердцем.", "Хороший момент для начинаний. Ваша интуиция — лучший компас.", "Условия благоприятны. Осталось сделать шаг."], "c_gen_0": ["Сейчас время осознанности — взвешивайте каждый шаг и прислушивайтесь к интуиции.", "Карты приглашают к паузе и размышлению. Не торопитесь — ясность придёт.", "Нейтральный момент. Ваша сила — в наблюдении и терпении.", "Прежде чем действовать — поймите, чего вы действительно хотите."], "c_gen_n": ["Возьмите паузу и доверьтесь внутренней мудрости — спешка сейчас ни к чему.", "Карты советуют остановиться. Иногда лучшее решение — это не принимать решений.", "Сложный период требует мудрости, а не скорости. Дайте себе время.", "Карты призывают к покою. Буря утихнет — если вы не будете её раздувать."], "kw_health": ["здоров", "самочувств", "болезн", "лечен", "врач", "медиц"], "kw_love": ["люб", "отношени", "партн", "чувств", "роман", "свидан", "брак", "свадьб"], "kw_career": ["карьер", "работ", "профессион", "должност", "бизнес", "проект"], "kw_fin": ["финанс", "деньг", "материальн", "инвестиц", "доход", "зарплат"]}, "en": {"_title": "Tarot Cards — Random Picker Online", "meta_desc": "Draw a Tarot card online! Ask a question, place your hands on the screen and get a three-card spread with interpretation.", "home": "Home", "panel_eyebrow": "Interpretation", "panel_title": "Three-card spread", "tab_sum": "Summary", "empty": "Start a session to get your card interpretation", "s_title": "Tarot Cards", "btn_start": "Start session", "ov_q_title": "What shall you ask the cards?", "ov_your": "Your question", "q_ph": "What's on your heart...", "continue": "Continue", "hands_title": "Place your hands on the screen", "hands_sub": "Focus on your question and let<br>the cards tune in to your energy", "custom_q": "Your own question", "prog_q": "Question", "prog_energy": "Energy", "prog_select": "Choosing cards", "prog_interp": "Interpretation", "shuffling": "The cards are shuffling...", "choose3": "Choose 3 cards", "chosen_of": "{n} of 3 chosen", "new_spread": "New spread", "pos_label": "Position:", "sum_eyebrow": "Spread summary", "card_text": {"0": {"name": "The Fool", "suit": "Major Arcana", "tag": "New Beginning", "desc": "A card of new beginnings, spontaneity and faith in life. The Fool invites you to trust the flow and not fear the unknown. Ahead lies an adventure that will change everything.", "ext": "Upright, the Fool means innocence, freedom and the start of a journey. It speaks of trusting life and being ready to take a leap. The inner child leads you toward new horizons."}, "1": {"name": "The Magician", "suit": "Major Arcana", "tag": "Action", "desc": "The Magician symbolises willpower, skill and the ability to make ideas real. Every resource is already in your hands — it is time to act.", "ext": "The Magician is the channel between heaven and earth, master of all four elements. You already hold every tool you need — now direct your intention and act. Will and skill turn ideas into reality."}, "2": {"name": "The High Priestess", "suit": "Major Arcana", "tag": "Intuition", "desc": "The Priestess speaks of hidden knowledge and the need to listen to intuition. The answer is already within you.", "ext": "The High Priestess guards the secrets of the subconscious and intuitive knowing. Listen to the quiet inner voice — it knows what logic cannot reach. Meditation, dreams and silence will reveal what lies behind the veil."}, "3": {"name": "The Empress", "suit": "Major Arcana", "tag": "Abundance", "desc": "The Empress carries the energy of fertility, care and creative blossoming. It is time to create beauty and receive gifts.", "ext": "The Empress embodies Mother Nature — bloom, fertility and the sensual beauty of life. It is time to create, nurture and receive gifts with gratitude. Everything sown with love will yield a rich harvest."}, "4": {"name": "The Emperor", "suit": "Major Arcana", "tag": "Order", "desc": "The Emperor stands for structure, power and stability. The time has come to bring order.", "ext": "The father archetype sets the rules and holds boundaries with a firm hand. Discipline and structure build the foundation on which everything meaningful grows. It is time to take responsibility and build order where chaos reigned."}, "5": {"name": "The Hierophant", "suit": "Major Arcana", "tag": "Tradition", "desc": "The Hierophant points to the wisdom of tradition and spiritual mentorship.", "ext": "The Hierophant is the bridge between the earthly and the sacred, keeper of spiritual traditions. A mentor, an institution or a belief system shows the way at this moment. Follow proven methods — deep generational wisdom is hidden in them."}, "6": {"name": "The Lovers", "suit": "Major Arcana", "tag": "Choice", "desc": "A card of love, harmony and an important life choice. Follow the call of your heart.", "ext": "A moment of truth — a choice that will define the whole path ahead. It is not only a romantic partnership but also the need to unite opposing parts of yourself. Follow your heart, even if reason offers a compromise."}, "7": {"name": "The Chariot", "suit": "Major Arcana", "tag": "Victory", "desc": "The triumph of will over circumstance. Keep going with determination.", "ext": "Two sphinxes pull in different directions, but the master steers them toward a single goal by force of will. Victory is won not by force but by mastering opposing energies. Determination and focus turn any obstacle into a springboard."}, "8": {"name": "Strength", "suit": "Major Arcana", "tag": "Inner Power", "desc": "Inner power, patience and gentle control. Tame your fears through acceptance, not struggle.", "ext": "True strength lies not in force but in gently taming the inner beast. Accepting your fears and weaknesses paradoxically makes you invincible. The wildest forces are conquered with tenderness, not chains."}, "9": {"name": "The Hermit", "suit": "Major Arcana", "tag": "Seeking", "desc": "A call to solitude and inner search. A time for reflection.", "ext": "The old man with the lantern lights the path through the dark — wisdom is found only in solitude. The answers to the great questions live within, but their voice is heard only in silence. It is time to step back from the bustle and go deep within."}, "10": {"name": "Wheel of Fortune", "suit": "Major Arcana", "tag": "Fate", "desc": "The cyclical nature of life. Luck is turning — be ready.", "ext": "The eternal wheel turns — no moment lasts forever, neither hard nor happy. Change is already knocking at the door, and your task is to meet it consciously. Today's decisions shape the next turn of fate."}, "11": {"name": "Justice", "suit": "Major Arcana", "tag": "Balance", "desc": "Honesty, objectivity and responsibility. Karma returns.", "ext": "Scales and a sword — symbols of an impartial judgement that balances every action. Karma returns: what you have sown will inevitably bear fruit. Honesty with yourself and others matters most right now."}, "12": {"name": "The Hanged Man", "suit": "Major Arcana", "tag": "Pause", "desc": "Stop and look from another side. Sacrifice leads to gain.", "ext": "The upside-down world opens an entirely new perspective on familiar things. A voluntary sacrifice and a temporary release of control lead to deeper understanding. Sometimes you must stop completely to see the way forward."}, "13": {"name": "Death", "suit": "Major Arcana", "tag": "Transformation", "desc": "Not an end but a deep transformation. The old leaves to make room for the new.", "ext": "From the ashes of the old, something fundamentally new is born — this is not an end but a great transformation. The most liberating card invites you to release what has run its course. Resisting change only prolongs the inevitable renewal."}, "14": {"name": "Temperance", "suit": "Major Arcana", "tag": "Harmony", "desc": "Patience, balance and the golden mean. Calm is your ally.", "ext": "An angel patiently blends the waters of two cups, creating a perfect balance between opposites. Patience, moderation and the synthesis of life's different sides bring lasting harmony. The middle way is not compromise but the highest wisdom."}, "15": {"name": "The Devil", "suit": "Major Arcana", "tag": "Bondage", "desc": "Attachments and illusions bind you. Recognise the captivity.", "ext": "The chains on the figures are loose — they can be removed at any moment by your own will. Suffering is sustained by the illusion that there is no choice. Recognising the dependency is the first and decisive step to freedom."}, "16": {"name": "The Tower", "suit": "Major Arcana", "tag": "Upheaval", "desc": "Sudden upheaval. False structures collapse. From the ruins the real is born.", "ext": "Lightning strikes the tower of pride, destroying structures built on false foundations. The shock is painful, but it clears space for something genuine. From the ruins, true wisdom is born."}, "17": {"name": "The Star", "suit": "Major Arcana", "tag": "Hope", "desc": "Hope, inspiration and healing after hard times.", "ext": "After the Tower's destruction, the star's peaceful light over still water heals the soul. Hope is restored, inspiration returns and faith in the future grows stronger. This is a time of healing and reconnecting with your true purpose."}, "18": {"name": "The Moon", "suit": "Major Arcana", "tag": "Illusion", "desc": "Illusions and hidden dangers. Trust intuition, but check the facts.", "ext": "The path by moonlight is full of shadows and deceptive shapes — not all is as it seems. Subconscious fears and unprocessed emotions distort your perception of reality. Trust intuition, but verify the facts before deciding."}, "19": {"name": "The Sun", "suit": "Major Arcana", "tag": "Joy", "desc": "The most positive card. Joy, success, vitality. Everything in the best way.", "ext": "Bright light scatters every shadow — this is the card of absolute success, joy and vitality. The child on the white horse symbolises pure happiness, reached through simplicity and presence. Everything works out for the best, and life literally blossoms."}, "20": {"name": "Judgement", "suit": "Major Arcana", "tag": "Awakening", "desc": "Rethinking the past and an important decision. A call to change.", "ext": "The angel sounds the trumpet — it is time for awakening and rethinking everything you have lived. You have heard the call to a higher level of being and are ready to answer. Release the weight of the past and rise toward your purpose."}, "21": {"name": "The World", "suit": "Major Arcana", "tag": "Completion", "desc": "The completion of a cycle and fullness. Wholeness and harmony are the reward.", "ext": "The dancer in the laurel wreath symbolises fullness, completion and achieved perfection. The cycle is closed — all that had to be learned is learned, all that was to be created is created. Complete harmony with yourself and the world is the true victory."}, "22": {"name": "Ace of Wands", "suit": "Wands", "tag": "Inspiration", "desc": "A burst of inspiration and creative energy. A new idea is ready to ignite.", "ext": "The Ace of Wands is a spark of pure potential and raw creative fire. A new passion, project or idea is being handed to you — seize it. Act on the inspiration before the flame fades."}, "23": {"name": "Two of Wands", "suit": "Wands", "tag": "Planning", "desc": "Planning and the first step toward a bigger vision. The world is in your hands.", "ext": "You stand looking out over your domain, weighing where to go next. The first success is behind you; now comes the choice to expand beyond the familiar. Bold planning turns a small win into a far-reaching journey."}, "24": {"name": "Three of Wands", "suit": "Wands", "tag": "Expansion", "desc": "Expansion and the first results of your efforts. Look further ahead.", "ext": "Your ships are already sailing — the early efforts are paying off and horizons widen. This is a moment of foresight and confident growth. Keep looking beyond the current success toward the bigger plan."}, "25": {"name": "Four of Wands", "suit": "Wands", "tag": "Celebration", "desc": "Celebration, stability and a happy milestone. Joy shared with others.", "ext": "Four wands form a gateway of celebration — a harmonious, joyful moment. Home, community and belonging are highlighted. Pause to enjoy a well-earned achievement with those you love."}, "26": {"name": "Five of Wands", "suit": "Wands", "tag": "Conflict", "desc": "Conflict, competition and clashing energies. Tension that can be channelled.", "ext": "Five figures spar with wands — friction, rivalry and scattered effort. The struggle is rarely serious; it is more like sparring that sharpens you. Channel the competitive energy toward a shared, constructive goal."}, "27": {"name": "Six of Wands", "suit": "Wands", "tag": "Triumph", "desc": "Public recognition and a well-earned victory. The crowd cheers you on.", "ext": "The rider returns triumphant, crowned with laurels and acclaimed by the crowd. Your effort has been seen and rewarded. Accept the recognition, then keep the momentum going."}, "28": {"name": "Seven of Wands", "suit": "Wands", "tag": "Defence", "desc": "Defending what you have built. Stand your ground with courage.", "ext": "You hold the high ground, defending your position against challengers below. The pressure is real, but you have the advantage and the conviction. Stand firm — perseverance now protects everything you have built."}, "29": {"name": "Eight of Wands", "suit": "Wands", "tag": "Speed", "desc": "Speed, movement and rapid developments. Events accelerate.", "ext": "Eight wands fly through the air — swift movement, news and fast progress. Obstacles clear and things finally start to move. Act quickly and ride the momentum to your goal."}, "30": {"name": "Nine of Wands", "suit": "Wands", "tag": "Resilience", "desc": "Resilience and the last stand. You are stronger than you think.", "ext": "Wounded but unbowed, you stand guard with the last of your wands. You have come too far to give up now — one more push remains. Resilience and a wary readiness carry you through the final stretch."}, "31": {"name": "Ten of Wands", "suit": "Wands", "tag": "Burden", "desc": "A heavy burden carried alone. Time to set some of it down.", "ext": "Ten wands weigh you down as you carry everything yourself toward the finish. Success has come with overload — you are doing too much alone. Lighten the load and delegate; the goal is near, but not worth burning out for."}, "32": {"name": "Page of Wands", "suit": "Wands", "tag": "Enthusiasm", "desc": "Youthful enthusiasm and a spark of discovery. A fresh adventure calls.", "ext": "The Page of Wands is eager, curious and full of fiery enthusiasm. A new venture or message of opportunity arrives. Embrace the spark with playful courage and see where it leads."}, "33": {"name": "Knight of Wands", "suit": "Wands", "tag": "Impulse", "desc": "Bold impulse and adventurous energy. Charge ahead — but mind the recklessness.", "ext": "The Knight of Wands rides fearlessly toward adventure, full of passion and daring. Momentum and confidence carry you far, but impatience can scatter your fire. Channel the impulse with a clear direction."}, "34": {"name": "Queen of Wands", "suit": "Wands", "tag": "Confidence", "desc": "Confidence, warmth and magnetic charisma. Own your power.", "ext": "The Queen of Wands radiates confidence, warmth and creative vitality. She is independent, magnetic and unafraid to be seen. Stand in your power with generosity and self-assurance."}, "35": {"name": "King of Wands", "suit": "Wands", "tag": "Leadership", "desc": "Visionary leadership and bold direction. Lead by example.", "ext": "The King of Wands is a natural leader — visionary, decisive and inspiring. He turns big ideas into movements and rallies others to the cause. Lead boldly, set the direction and let your vision blaze the trail."}, "36": {"name": "Ace of Cups", "suit": "Cups", "tag": "Love", "desc": "A new love and an open heart. Emotional renewal flows in.", "ext": "The Ace of Cups overflows with love, compassion and emotional possibility. A new relationship, friendship or wave of feeling is offered. Open your heart and let the emotion flow freely."}, "37": {"name": "Two of Cups", "suit": "Cups", "tag": "Partnership", "desc": "Partnership and mutual attraction. Two become a harmonious pair.", "ext": "Two cups raised in a toast — a meeting of hearts and a balanced union. Mutual respect and attraction create genuine connection. Honour the bond and let it grow on equal footing."}, "38": {"name": "Three of Cups", "suit": "Cups", "tag": "Joyful Bonds", "desc": "Friendship, celebration and joyful bonds. Gather with your people.", "ext": "Three friends raise their cups in celebration — community, joy and belonging. This is a time to share happiness and lean on your circle. Celebrate the good things together."}, "39": {"name": "Four of Cups", "suit": "Cups", "tag": "Apathy", "desc": "Apathy and emotional withdrawal. A gift is being overlooked.", "ext": "Lost in discontent, you ignore a new cup offered from the side. Boredom or apathy blinds you to a real opportunity. Lift your gaze — what you long for may already be within reach."}, "40": {"name": "Five of Cups", "suit": "Cups", "tag": "Loss", "desc": "Loss and grief, yet not everything is lost. Turn around and see what remains.", "ext": "Three cups spilled, two still standing — focus has fixed on the loss. Grief is real, but it has blinded you to what remains. Turn around: not everything is gone, and healing can begin."}, "41": {"name": "Six of Cups", "suit": "Cups", "tag": "Nostalgia", "desc": "Nostalgia and innocent kindness. A sweet echo of the past returns.", "ext": "A tender memory of the past warms the present, full of innocence and kindness. Someone or something from before may return. Cherish the warmth, but stay rooted in the present."}, "42": {"name": "Seven of Cups", "suit": "Cups", "tag": "Daydreams", "desc": "Daydreams and many tempting options. Choose with clear eyes.", "ext": "Seven cups float with visions — some golden, some illusory. Choices abound, but not all are real or wise. Cut through fantasy and choose what truly serves you."}, "43": {"name": "Eight of Cups", "suit": "Cups", "tag": "Walking Away", "desc": "Walking away in search of something deeper. Leave what no longer fulfils you.", "ext": "You turn from the cups you have filled to seek a more meaningful path. What once satisfied no longer does, and the soul calls you onward. Have the courage to walk away toward something deeper."}, "44": {"name": "Nine of Cups", "suit": "Cups", "tag": "Fulfilment", "desc": "Wishes fulfilled and contentment. The 'wish card' smiles on you.", "ext": "Nine cups arranged in pride — satisfaction, comfort and a wish coming true. Emotional and material wishes align in your favour. Savour the contentment you have earned."}, "45": {"name": "Ten of Cups", "suit": "Cups", "tag": "Happiness", "desc": "Lasting happiness and emotional fulfilment. Harmony at home and in love.", "ext": "The rainbow of ten cups crowns lasting joy, family harmony and emotional fulfilment. This is the happy ending of the Cups journey. Treasure the love and belonging that surround you."}, "46": {"name": "Page of Cups", "suit": "Cups", "tag": "Dreamer", "desc": "A gentle dreamer and creative spark. Listen to your imagination.", "ext": "The Page of Cups is sensitive, imaginative and open-hearted. A surprising message, idea or feeling bubbles up. Follow your intuition and let creativity flow without judgement."}, "47": {"name": "Knight of Cups", "suit": "Cups", "tag": "Romantic", "desc": "A romantic on a quest. Follow your heart's invitation.", "ext": "The Knight of Cups arrives bearing a cup — an offer of love, romance or a heartfelt invitation. He moves with charm, idealism and emotional grace. Follow the call of the heart, but keep your feet on the ground."}, "48": {"name": "Queen of Cups", "suit": "Cups", "tag": "Empathy", "desc": "Empathy, compassion and emotional depth. Trust your feeling.", "ext": "The Queen of Cups embodies empathy, intuition and emotional wisdom. She holds space for others and reads the unspoken. Trust your feelings and care for yourself as deeply as you care for others."}, "49": {"name": "King of Cups", "suit": "Cups", "tag": "Wisdom", "desc": "Emotional mastery and calm wisdom. Lead with a balanced heart.", "ext": "The King of Cups masters his emotions with calm and compassion. He stays steady amid emotional storms and offers wise, balanced counsel. Lead with a warm but level heart."}, "50": {"name": "Ace of Swords", "suit": "Swords", "tag": "Breakthrough", "desc": "A breakthrough of clarity and truth. Cut through to the heart of it.", "ext": "The Ace of Swords is a flash of pure mental clarity and decisive truth. A breakthrough idea or honest realisation cuts through confusion. Wield your clarity with precision and act on it."}, "51": {"name": "Two of Swords", "suit": "Swords", "tag": "Stalemate", "desc": "A stalemate and an avoided decision. Remove the blindfold and choose.", "ext": "Blindfolded, you balance two swords, refusing to choose. The stalemate is comfortable but cannot last. Take off the blindfold, weigh the truth and make the decision."}, "52": {"name": "Three of Swords", "suit": "Swords", "tag": "Heartbreak", "desc": "Heartbreak and painful truth. Let the rain pass, then heal.", "ext": "Three swords pierce the heart — grief, betrayal or painful clarity. The hurt is real and must be felt, not denied. Let the storm pass; clarity and healing follow the rain."}, "53": {"name": "Four of Swords", "suit": "Swords", "tag": "Rest", "desc": "Rest and recovery. Step back to restore your strength.", "ext": "A figure rests in stillness, swords laid aside — recovery after struggle. This is a needed pause, not defeat. Step back, restore your mind and return stronger."}, "54": {"name": "Five of Swords", "suit": "Swords", "tag": "Defeat", "desc": "Conflict with a hollow victory. Count the true cost.", "ext": "One figure gathers swords while others walk away defeated — a win that leaves wounds. Pride or conflict has a hidden price. Ask whether being right is worth what it costs."}, "55": {"name": "Six of Swords", "suit": "Swords", "tag": "Transition", "desc": "A transition toward calmer waters. Leave the difficulty behind.", "ext": "A quiet crossing carries you away from troubled waters toward calmer shores. The hardest part is passing, even if sadness lingers. Trust the transition — you are moving toward peace."}, "56": {"name": "Seven of Swords", "suit": "Swords", "tag": "Deceit", "desc": "Deceit, strategy or a quiet escape. Act with integrity.", "ext": "Slipping away with swords in hand — cunning, secrecy or a clever workaround. Strategy may be needed, but so is honesty. Make sure the cleverness does not cost your integrity."}, "57": {"name": "Eight of Swords", "suit": "Swords", "tag": "Restriction", "desc": "Feeling trapped, though the way out is open. Free your own mind.", "ext": "Bound and blindfolded among swords, you feel trapped — yet the bonds are loose. The restriction is mostly in the mind. Free yourself: the way out has been open all along."}, "58": {"name": "Nine of Swords", "suit": "Swords", "tag": "Anxiety", "desc": "Anxiety, worry and sleepless nights. The fear is larger than the fact.", "ext": "Awake in the dark, gripped by worry, the mind magnifies every fear. The dread is heavier than the reality behind it. Name the fears in daylight and they begin to shrink."}, "59": {"name": "Ten of Swords", "suit": "Swords", "tag": "Ending", "desc": "A painful ending, but the worst is over. Dawn follows the darkest night.", "ext": "Ten swords mark a hard ending — rock bottom of the suit's journey. As painful as it is, it cannot get worse from here. The only way now is up; let the dawn come."}, "60": {"name": "Page of Swords", "suit": "Swords", "tag": "Curiosity", "desc": "Curiosity and a sharp, eager mind. Ask questions and stay alert.", "ext": "The Page of Swords is curious, vigilant and quick-witted. New ideas, information or a need to speak the truth arise. Stay alert, ask questions, but watch for restless overthinking."}, "61": {"name": "Knight of Swords", "suit": "Swords", "tag": "Drive", "desc": "Forceful drive toward a goal. Charge ahead — but think first.", "ext": "The Knight of Swords charges at full speed, driven by logic and ambition. His focus is fierce, but haste can overrun caution. Direct the drive with a clear, well-reasoned plan."}, "62": {"name": "Queen of Swords", "suit": "Swords", "tag": "Clarity", "desc": "Clear-eyed honesty and independent judgement. See things as they are.", "ext": "The Queen of Swords sees clearly and speaks the truth without flattery. Experience has given her sharp perception and healthy boundaries. Judge with clarity, compassion and unflinching honesty."}, "63": {"name": "King of Swords", "suit": "Swords", "tag": "Authority", "desc": "Authority of intellect and fair judgement. Lead with reason.", "ext": "The King of Swords rules with intellect, ethics and impartial judgement. He cuts through emotion to find the truth and decide fairly. Lead with reason, clarity and integrity."}, "64": {"name": "Ace of Pentacles", "suit": "Pentacles", "tag": "Prosperity", "desc": "Prosperity and a tangible new opportunity. Plant the seed now.", "ext": "The Ace of Pentacles offers a seed of prosperity — a new job, venture or material opportunity. The potential is solid and real, not just an idea. Plant it with care and it will grow into abundance."}, "65": {"name": "Two of Pentacles", "suit": "Pentacles", "tag": "Balance", "desc": "Balancing priorities with agility. Juggle, but stay grounded.", "ext": "Two pentacles dance in balance — juggling time, money and competing demands. Flexibility and good humour keep everything afloat. Stay adaptable, but don't take on more than you can hold."}, "66": {"name": "Three of Pentacles", "suit": "Pentacles", "tag": "Mastery", "desc": "Mastery, collaboration and skilled work. Build it together.", "ext": "Three pentacles mark skilled craftsmanship and teamwork. Your abilities are recognised and combined with others' toward a shared build. Collaborate, refine your craft and lay solid foundations."}, "67": {"name": "Four of Pentacles", "suit": "Pentacles", "tag": "Control", "desc": "Holding on tightly — control and security. Loosen the grip a little.", "ext": "Four pentacles clutched close — a need for security and control. Stability is good, but holding too tightly blocks the flow. Loosen the grip enough to let new energy and growth in."}, "68": {"name": "Five of Pentacles", "suit": "Pentacles", "tag": "Hardship", "desc": "Hardship and a feeling of lack. Help is closer than it seems.", "ext": "Two figures struggle in the cold outside a lit window — hardship and a sense of exclusion. The difficulty is real, but support is nearer than it appears. Reach out; you do not have to endure it alone."}, "69": {"name": "Six of Pentacles", "suit": "Pentacles", "tag": "Generosity", "desc": "Generosity and fair exchange. Give and receive in balance.", "ext": "Coins flow from one hand to another, weighed on the scales — generosity and balanced exchange. Whether giving or receiving, fairness restores flow. Share what you have and accept help with grace."}, "70": {"name": "Seven of Pentacles", "suit": "Pentacles", "tag": "Patience", "desc": "Patience while your investment matures. Tend the garden and wait.", "ext": "Leaning on the hoe, you survey a crop not yet ripe — a pause to assess your investment. Growth takes time, and impatience now would be costly. Tend what you have planted and let it mature."}, "71": {"name": "Eight of Pentacles", "suit": "Pentacles", "tag": "Diligence", "desc": "Diligence and devoted craft. Keep refining your skill.", "ext": "Eight pentacles show focused, repeated work — apprenticeship and dedication to a craft. Mastery is built one careful piece at a time. Keep refining your skill; steady effort pays off."}, "72": {"name": "Nine of Pentacles", "suit": "Pentacles", "tag": "Comfort", "desc": "Comfort, independence and earned abundance. Enjoy your self-made garden.", "ext": "A figure stands in a lush garden — refinement, independence and well-earned comfort. Self-discipline has produced material and personal abundance. Enjoy the fruits of your own efforts."}, "73": {"name": "Ten of Pentacles", "suit": "Pentacles", "tag": "Legacy", "desc": "Legacy, family and lasting wealth. Build something that endures.", "ext": "Ten pentacles crown lasting wealth, family and legacy. The work of generations creates security that outlives you. Build foundations and traditions meant to endure."}, "74": {"name": "Page of Pentacles", "suit": "Pentacles", "tag": "Apprentice", "desc": "An apprentice eager to learn. Study, plan and start small.", "ext": "The Page of Pentacles is studious, grounded and eager to learn a new skill. An opportunity to study, plan or start a practical venture appears. Begin modestly and build steadily."}, "75": {"name": "Knight of Pentacles", "suit": "Pentacles", "tag": "Reliability", "desc": "Reliability and patient, steady effort. Slow and sure wins.", "ext": "The Knight of Pentacles is dependable, methodical and hardworking. He may be slow, but he finishes what he starts. Trust patient, consistent effort to carry you to the goal."}, "76": {"name": "Queen of Pentacles", "suit": "Pentacles", "tag": "Nurturing", "desc": "Practical nurturing and grounded care. Tend to home and self.", "ext": "The Queen of Pentacles nurtures with warmth and down-to-earth practicality. She cares for home, body and resources with steady abundance. Tend to the practical needs of yourself and others."}, "77": {"name": "King of Pentacles", "suit": "Pentacles", "tag": "Mastery", "desc": "Mastery, wealth and enduring success. Build your empire wisely.", "ext": "The King of Pentacles is the master of the material world — wealthy, reliable and generous. He has built lasting success through discipline and good judgement. Steward your resources wisely and let your empire grow."}}, "pos": ["Past", "Present", "Future"], "pos_d": ["This card reflects the influence of the past — the events and energies that brought you to this moment.", "The present card shows the key energies, challenges and opportunities of the current moment.", "The future card points to the most likely development of events on your current course."], "intents": {"Love": ["What awaits me in love?", "Should I open up?", "When will they message me?", "What is my partner like?", "Am I ready for love?", "Are they ready for love?", "Are the feelings mutual?", "How can I improve the relationship?", "Is there a future for us?"], "Career": ["What are my prospects?", "Should I change jobs?", "How do I grow in my career?", "Is my field right for me?", "When will success come?", "Should I start a business?", "Can I speed up my growth?", "Will I find my dream job?", "Is this the right path?"], "Finances": ["What awaits me financially?", "How can I increase my income?", "Should I take a risk?", "When will prosperity come?", "Will I pay off my mortgage soon?", "Should I take out a loan?", "Will I build up savings soon?", "Am I spending wisely?", "Will luck come my way?"], "Health": ["How is my health?", "How can I improve my health?", "How do I find balance?", "What is my body telling me?", "When can I reduce my stress?", "What gives me strength?", "What matters for my health?", "How do I find harmony?", "Where should I look for healing?"], "General": ["What lies ahead for me?", "What lesson does fate hold?", "How will I be living in 5 years?", "How do I make a decision?", "When will I be happy?", "Is my life moving for the better?", "What am I not seeing in myself?", "Will luck come my way?", "Will I find my path?"]}, "energy_4": ["The cards radiate powerful positive energy. The spread is clearly favourable — the universe is on your side.", "The three cards form an exceptionally strong positive flow. Luck, opportunity and inner strength converge.", "The spread overflows with creative energy. Everything works in your favour — act boldly and without hesitation.", "A powerful, favourable spread. The cards say: you are in the flow — use this moment fully."], "energy_2": ["The overall tone of the spread is favourable, with nuances. Opportunities are open, but attention to detail is needed.", "The cards show a positive picture with some areas of growth. The direction is right — keep moving forward.", "The spread is broadly encouraging. The energy supports your intentions, though some flexibility will be required.", "A positive backdrop with a call to awareness. You have everything you need — the key is to channel your effort well."], "energy_0": ["The spread shows a mixed picture. There is both potential and caution here — the balance is in your hands.", "The cards reflect a transitional period. The old gives way to the new, and it is up to you what that new will be.", "The situation is at a crossroads. The spread is neutral — what happens next will be decided by your choices.", "The energy of the moment is unsteady but manageable. Awareness matters more than speed right now."], "energy_m2": ["The cards point to a difficult period. It is a time of trials, but trials are what forge character.", "The spread speaks of a tense but important stage. Difficulties are not a verdict but a signal to rethink.", "The energy of the moment is demanding. The cards call not for escape but for an honest look at what is happening.", "A challenging spread that calls for courage. The key is not to resist the current but to find support within it."], "energy_m4": ["The spread reflects serious challenges. Now is a time for inner work and rethinking your path.", "The cards speak of an intense period of transformation. What no longer serves you is breaking down.", "A heavy spread that demands honesty with yourself. This is no time for illusions — it is a time for deep work.", "The cards show the lowest point. It is from here that the way up begins — if you allow yourself to change."], "outlook_4": ["Trust the flow and act with confidence.", "Boldly follow your path — the stars are on your side.", "Allow yourself to receive good fortune — you deserve it.", "Act decisively: right now everything you take on has a chance to flourish."], "outlook_2": ["The situation is shaping up in your favour — do not miss the moment.", "Go forward with confidence while staying alert to change.", "The potential is great — the only question is how you use it.", "The way is open. Your actions now will determine the outcome."], "outlook_0": ["The outcome depends on your decisions — be mindful in every step.", "The path is not predetermined — right now you are writing your story.", "The balance of forces is even. A small effort in the right direction will change everything.", "The cards give you freedom of choice — use it wisely."], "outlook_m2": ["Be patient — dawn always follows a dark stretch.", "Trials are temporary. What you build within yourself now will stay forever.", "The darkest time is before dawn. Hold to your path.", "A crisis is an invitation to grow. Accept it with dignity."], "outlook_m4": ["Slow down, listen to yourself and do not make sudden decisions.", "Stop. Sometimes the best thing you can do is nothing at all.", "Give yourself time. Inner silence is worth more than any action right now.", "Let go of control. Allow the situation to resolve in its own way."], "adv_2": ["The situation moves from hard to bright — the future promises significant improvement.", "The trajectory of the spread is rising. You have already passed the hardest part — new space opens ahead.", "The past was a lesson, the present a transition, the future a reward. You are on the right path.", "The dynamics of your spread speak of growth. With each step the situation grows brighter."], "adv_1": ["The dynamics are positive — each next step brings you closer to better.", "Your direction is right. Keep it up — results will not keep you waiting.", "Progress is clear. The cards confirm: you are moving in the right direction.", "The situation is improving. Trust the process — it is taking you where you need to go."], "adv_0": ["The energy is stable — key changes depend on your conscious actions.", "The situation is steady. Change will require your initiative — it will not come on its own.", "A plateau is not an end; it is a platform for the next leap. Get ready.", "The balance holds. Your next conscious step will set things in motion."], "adv_m1": ["Pay attention to details — there may be hidden pitfalls ahead.", "The downward dynamic calls for caution. Right now it is better to observe than to rush.", "What looks good right now may not be so tomorrow. Look deeper.", "The situation needs review. Do not force events — give yourself time to see the full picture."], "adv_m2": ["It is worth slowing down and rethinking your approach — caution matters more than speed now.", "The downward trend suggests the chosen path needs reconsidering.", "Before moving on, look back. What have you left unfinished? The answer is there.", "The cards strongly advise a pause. Impulsive decisions now could cost you dearly."], "c_health_3": ["The energy of recovery and vitality is on your side — a wonderful time to strengthen your health.", "The cards speak of vitality and renewal. Your body is ready to recover — help it along.", "A powerful flow of healing energy. Everything you do for your health now will bear fruit."], "c_health_1": ["Your health is strengthening — keep caring for yourself and listening to your body.", "Positive momentum. Your body is recovering — give it time and support.", "The cards support your path to health. Do not stop — you are on the right track."], "c_health_0": ["Give attention to your inner balance — body and spirit are inseparably linked.", "Your body is asking for attention. Heed its signals — they did not appear by chance.", "Your health needs a more mindful approach. Start small: sleep, nutrition, rest."], "c_health_n": ["Listen to yourself and do not ignore your body's signals — rest and self-care matter most right now.", "The cards insist: health matters more than any plans. Stop and take care of yourself.", "Your body is telling you something important. Do not brush it off — listen and act."], "c_love_3": ["Now is a wonderful time for love — open your heart to your feelings.", "The cards sing of love. Allow yourself to be vulnerable — that is what opens the door to true closeness.", "Powerful love energy in the spread. What you are seeking is already seeking you.", "Your heart is ready. The cards say — do not delay. Love does not tolerate hesitation."], "c_love_1": ["Development is expected in matters of the heart — be honest with yourself and your partner.", "The relationship is moving forward. Openness and honesty are the keys to the next level of closeness.", "The cards see potential for growth in your relationship. Invest time and attention in it."], "c_love_0": ["The relationship will require work and patience, but the potential for growth is there.", "Now is the time for an honest conversation — with yourself and your loved ones. Clarity beats illusions.", "The cards show a point of balance. What to keep and what to release is your choice alone."], "c_love_n": ["Right now it is important to understand your true feelings before moving on.", "The relationship is being tested. This is not an end — it is a chance to see what truly matters.", "The cards call for honesty. A relationship without truth has no future — but the truth can change everything."], "c_career_3": ["Your professional sphere is opening up excellent opportunities — it is time to act.", "The cards point to a period of professional flourishing. Ambition now is not a sin but a necessity.", "Everything you invested in your work is starting to pay off. Do not stop.", "A stellar moment for career growth. Show yourself — the world is ready to receive you."], "c_career_1": ["Progress is showing at work — take initiative and do not fear change.", "The cards support your professional path. Take a step toward what you want.", "A good moment for career decisions. Trust your expertise."], "c_career_0": ["Changes lie ahead in your career — adapt and look for new approaches.", "The cards speak of a need to reconsider your professional path. This is not a crisis — it is growth.", "A transitional period in your career. Use it to develop new skills."], "c_career_n": ["It is worth reconsidering your professional path and setting priorities.", "The cards warn of professional difficulties. The best move is to assess the situation honestly.", "Now is not the best time for risky career moves. Strengthen your foundation."], "c_fin_3": ["Your financial situation is shaping up very favourably — act decisively.", "The cards open a period of financial abundance. It is time to realise your plans.", "Money is moving toward you. Stay open to unexpected opportunities.", "Powerful financial potential in the spread. Your investments will bear fruit."], "c_fin_1": ["Financial prospects are positive, but require a measured approach.", "Your financial situation is improving. Keep moving in your chosen direction.", "The cards see growth. Sensible steps now will lay the foundation for future prosperity."], "c_fin_0": ["Be prudent in money matters, but do not miss real chances.", "Your financial balance needs attention. Count not only money but also resources.", "The cards advise: before spending, ask — is this a need or a want?"], "c_fin_n": ["Right now it is better to hold off on big spending and risky investments.", "The cards warn of financial instability. Hold on to what you have.", "A time for financial restraint. Every penny saved is an investment in future freedom."], "c_gen_3": ["This is a very favourable period — the energy is on your side, you can confidently move forward.", "The cards give a clear answer: everything is going great. Act — the moment is favourable.", "Everything is working out for the best. Trust the process and do what your heart suggests.", "A rare spread of complete favour. Use this period wisely."], "c_gen_1": ["The situation is generally shaping up positively — trust yourself and watch for the signs.", "The cards support you. Go forward with an open heart.", "A good moment for new beginnings. Your intuition is the best compass.", "Conditions are favourable. All that remains is to take the step."], "c_gen_0": ["Now is a time for awareness — weigh every step and listen to your intuition.", "The cards invite you to pause and reflect. Do not rush — clarity will come.", "A neutral moment. Your strength lies in observation and patience.", "Before you act — understand what you truly want."], "c_gen_n": ["Take a pause and trust your inner wisdom — haste serves nothing right now.", "The cards advise you to stop. Sometimes the best decision is to make no decision.", "A difficult period calls for wisdom, not speed. Give yourself time.", "The cards call for calm. The storm will pass — if you do not fan it."], "kw_health": ["health", "wellbeing", "illness", "sick", "doctor", "medic", "body"], "kw_love": ["love", "relationship", "partner", "feeling", "roman", "date", "marri", "wedding", "crush"], "kw_career": ["career", "job", "work", "profession", "position", "business", "project"], "kw_fin": ["financ", "money", "material", "invest", "income", "salary", "wealth"]}, "el": {"_title": "Κάρτες Ταρώ — Τυχαία Επιλογή Online", "meta_desc": "Τράβα μια κάρτα Ταρώ online! Κάνε μια ερώτηση, ακούμπησε τα χέρια σου στην οθόνη και πάρε ένα άνοιγμα τριών καρτών με ερμηνεία.", "home": "Αρχική", "panel_eyebrow": "Ερμηνεία", "panel_title": "Άνοιγμα τριών καρτών", "tab_sum": "Σύνοψη", "empty": "Ξεκίνα μια συνεδρία για να πάρεις την ερμηνεία των καρτών", "s_title": "Κάρτες Ταρώ", "btn_start": "Έναρξη συνεδρίας", "ov_q_title": "Τι θα ρωτήσεις τις κάρτες;", "ov_your": "Η ερώτησή σου", "q_ph": "Τι έχεις στην καρδιά σου...", "continue": "Συνέχεια", "hands_title": "Ακούμπησε τα χέρια σου στην οθόνη", "hands_sub": "Συγκεντρώσου στην ερώτηση κι άσε<br>τις κάρτες να συντονιστούν με την ενέργειά σου", "custom_q": "Δική σου ερώτηση", "prog_q": "Ερώτηση", "prog_energy": "Ενέργεια", "prog_select": "Επιλογή καρτών", "prog_interp": "Ερμηνεία", "shuffling": "Οι κάρτες ανακατεύονται...", "choose3": "Διάλεξε 3 κάρτες", "chosen_of": "Διαλέχτηκαν {n} από 3", "new_spread": "Νέο άνοιγμα", "pos_label": "Θέση:", "sum_eyebrow": "Σύνοψη ανοίγματος", "card_text": {"0": {"name": "Ο Τρελός", "suit": "Μείζονα Αρκάνα", "tag": "Νέα Αρχή", "desc": "Κάρτα νέων αρχών, αυθορμητισμού και πίστης στη ζωή. Ο Τρελός σε καλεί να εμπιστευτείς τη ροή και να μη φοβάσαι το άγνωστο. Μπροστά σου μια περιπέτεια που θα τα αλλάξει όλα.", "ext": "Στην όρθια θέση ο Τρελός σημαίνει αθωότητα, ελευθερία και την αρχή ενός ταξιδιού. Μιλά για εμπιστοσύνη στη ζωή και ετοιμότητα να ρισκάρεις. Το εσωτερικό παιδί σε οδηγεί σε νέους ορίζοντες."}, "1": {"name": "Ο Μάγος", "suit": "Μείζονα Αρκάνα", "tag": "Δράση", "desc": "Ο Μάγος συμβολίζει τη θέληση, τη δεξιοτεχνία και την ικανότητα να υλοποιείς ιδέες. Όλοι οι πόροι είναι ήδη στα χέρια σου — ώρα να δράσεις.", "ext": "Ο Μάγος είναι ο δίαυλος ανάμεσα σε ουρανό και γη, κυρίαρχος και των τεσσάρων στοιχείων. Έχεις ήδη όλα τα εργαλεία που χρειάζεσαι — μένει να κατευθύνεις την πρόθεση και να δράσεις. Θέληση και δεξιότητα μετατρέπουν τις ιδέες σε πραγματικότητα."}, "2": {"name": "Η Ιέρεια", "suit": "Μείζονα Αρκάνα", "tag": "Διαίσθηση", "desc": "Η Ιέρεια μιλά για κρυμμένη γνώση και την ανάγκη να ακούσεις τη διαίσθησή σου. Η απάντηση είναι ήδη μέσα σου.", "ext": "Η Ιέρεια φυλάει τα μυστικά του υποσυνείδητου και της διαισθητικής γνώσης. Άκουσε την ήσυχη εσωτερική φωνή — ξέρει αυτά που δεν φτάνει η λογική. Ο διαλογισμός, τα όνειρα και η σιωπή θα αποκαλύψουν ό,τι κρύβεται πίσω από το πέπλο."}, "3": {"name": "Η Αυτοκράτειρα", "suit": "Μείζονα Αρκάνα", "tag": "Αφθονία", "desc": "Η Αυτοκράτειρα φέρνει την ενέργεια της γονιμότητας, της φροντίδας και της δημιουργικής άνθησης. Ώρα να δημιουργήσεις ομορφιά και να δεχτείς δώρα.", "ext": "Η Αυτοκράτειρα ενσαρκώνει τη Μητέρα Φύση — άνθηση, γονιμότητα και την αισθησιακή ομορφιά της ζωής. Ώρα να δημιουργείς, να φροντίζεις και να δέχεσαι δώρα με ευγνωμοσύνη. Ό,τι σπείρεις με αγάπη θα δώσει πλούσια σοδειά."}, "4": {"name": "Ο Αυτοκράτορας", "suit": "Μείζονα Αρκάνα", "tag": "Τάξη", "desc": "Ο Αυτοκράτορας συμβολίζει τη δομή, τη δύναμη και τη σταθερότητα. Ήρθε η ώρα να βάλεις τάξη.", "ext": "Το αρχέτυπο του πατέρα θέτει κανόνες και κρατά τα όρια με σταθερό χέρι. Η πειθαρχία και η δομή χτίζουν το θεμέλιο πάνω στο οποίο μεγαλώνει κάθε σημαντικό. Ώρα να αναλάβεις ευθύνη και να βάλεις τάξη εκεί που επικρατούσε χάος."}, "5": {"name": "Ο Ιεροφάντης", "suit": "Μείζονα Αρκάνα", "tag": "Παράδοση", "desc": "Ο Ιεροφάντης δείχνει τη σοφία της παράδοσης και της πνευματικής καθοδήγησης.", "ext": "Ο Ιεροφάντης είναι η γέφυρα ανάμεσα στο γήινο και το ιερό, φύλακας των πνευματικών παραδόσεων. Ένας μέντορας, ένας θεσμός ή ένα σύστημα πεποιθήσεων δείχνει τον δρόμο αυτή τη στιγμή. Ακολούθησε δοκιμασμένες μεθόδους — κρύβουν βαθιά σοφία γενεών."}, "6": {"name": "Οι Εραστές", "suit": "Μείζονα Αρκάνα", "tag": "Επιλογή", "desc": "Κάρτα αγάπης, αρμονίας και μιας σημαντικής επιλογής ζωής. Ακολούθησε το κάλεσμα της καρδιάς σου.", "ext": "Στιγμή αλήθειας — μια επιλογή που θα καθορίσει όλη τη συνέχεια. Δεν είναι μόνο ρομαντική σχέση, αλλά και η ανάγκη να ενώσεις αντίθετα κομμάτια του εαυτού σου. Ακολούθησε την καρδιά, ακόμη κι αν η λογική προτείνει συμβιβασμό."}, "7": {"name": "Το Άρμα", "suit": "Μείζονα Αρκάνα", "tag": "Νίκη", "desc": "Ο θρίαμβος της θέλησης πάνω στις περιστάσεις. Συνέχισε με αποφασιστικότητα.", "ext": "Δύο σφίγγες τραβούν προς διαφορετικές κατευθύνσεις, αλλά ο αρματηλάτης τις οδηγεί σε έναν κοινό στόχο με τη θέλησή του. Η νίκη κερδίζεται όχι με βία αλλά με τον έλεγχο αντίθετων ενεργειών. Αποφασιστικότητα και συγκέντρωση μετατρέπουν κάθε εμπόδιο σε εφαλτήριο."}, "8": {"name": "Η Δύναμη", "suit": "Μείζονα Αρκάνα", "tag": "Δύναμη", "desc": "Εσωτερική δύναμη, υπομονή και ήπιος έλεγχος. Δάμασε τους φόβους με αποδοχή, όχι με μάχη.", "ext": "Η αληθινή δύναμη δεν είναι στον εξαναγκασμό, αλλά στο τρυφερό δάμασμα του εσωτερικού θηρίου. Η αποδοχή των φόβων και των αδυναμιών παράδοξα σε κάνει ανίκητο. Με τρυφερότητα, όχι με αλυσίδες, υποτάσσονται οι πιο άγριες δυνάμεις."}, "9": {"name": "Ο Ερημίτης", "suit": "Μείζονα Αρκάνα", "tag": "Αναζήτηση", "desc": "Κάλεσμα στη μοναξιά και στην εσωτερική αναζήτηση. Ώρα για περισυλλογή.", "ext": "Ο γέροντας με το φανάρι φωτίζει τον δρόμο στο σκοτάδι — η σοφία βρίσκεται μόνο στη μοναξιά. Οι απαντήσεις στα μεγάλα ερωτήματα ζουν μέσα σου, αλλά η φωνή τους ακούγεται μόνο στη σιωπή. Ώρα να αποτραβηχτείς από τη φασαρία και να βυθιστείς μέσα σου."}, "10": {"name": "Ο Τροχός της Τύχης", "suit": "Μείζονα Αρκάνα", "tag": "Πεπρωμένο", "desc": "Η κυκλικότητα της ζωής. Η τύχη γυρίζει — να είσαι έτοιμος.", "ext": "Ο αιώνιος τροχός γυρίζει — καμία στιγμή δεν κρατά για πάντα, ούτε η δύσκολη ούτε η ευτυχισμένη. Η αλλαγή χτυπά ήδη την πόρτα, και έργο σου είναι να τη συναντήσεις συνειδητά. Οι σημερινές αποφάσεις διαμορφώνουν την επόμενη στροφή της μοίρας."}, "11": {"name": "Η Δικαιοσύνη", "suit": "Μείζονα Αρκάνα", "tag": "Ισορροπία", "desc": "Εντιμότητα, αντικειμενικότητα και ευθύνη. Το κάρμα επιστρέφει.", "ext": "Η ζυγαριά και το ξίφος — σύμβολα μιας αμερόληπτης κρίσης που ισορροπεί κάθε πράξη. Το κάρμα επιστρέφει: ό,τι έσπειρες θα δώσει αναπόφευκτα καρπούς. Η ειλικρίνεια με τον εαυτό σου και τους άλλους έχει τώρα τη μεγαλύτερη σημασία."}, "12": {"name": "Ο Κρεμασμένος", "suit": "Μείζονα Αρκάνα", "tag": "Παύση", "desc": "Σταμάτα και κοίτα από άλλη οπτική. Η θυσία οδηγεί στο κέρδος.", "ext": "Ο ανάποδος κόσμος ανοίγει μια εντελώς νέα οπτική στα γνώριμα. Η εκούσια θυσία και η προσωρινή παραίτηση από τον έλεγχο οδηγούν σε βαθύτερη κατανόηση. Μερικές φορές πρέπει να σταματήσεις εντελώς για να δεις τον δρόμο μπροστά."}, "13": {"name": "Ο Θάνατος", "suit": "Μείζονα Αρκάνα", "tag": "Μεταμόρφωση", "desc": "Όχι τέλος, αλλά βαθιά μεταμόρφωση. Το παλιό φεύγει για να κάνει χώρο στο νέο.", "ext": "Από τις στάχτες του παλιού γεννιέται κάτι ριζικά νέο — δεν είναι τέλος, αλλά μεγάλη μεταμόρφωση. Η πιο απελευθερωτική κάρτα σε καλεί να αφήσεις ό,τι έχει εξαντληθεί. Η αντίσταση στην αλλαγή μόνο καθυστερεί την αναπόφευκτη ανανέωση."}, "14": {"name": "Η Εγκράτεια", "suit": "Μείζονα Αρκάνα", "tag": "Αρμονία", "desc": "Υπομονή, ισορροπία και η χρυσή τομή. Η ηρεμία είναι σύμμαχός σου.", "ext": "Ένας άγγελος αναμειγνύει υπομονετικά τα νερά δύο κυπέλλων, δημιουργώντας τέλεια ισορροπία ανάμεσα στα αντίθετα. Η υπομονή, η εγκράτεια και η σύνθεση των διαφορετικών πλευρών της ζωής φέρνουν διαρκή αρμονία. Η χρυσή τομή δεν είναι
