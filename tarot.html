 συμβιβασμός, αλλά ανώτερη σοφία."}, "15": {"name": "Ο Διάβολος", "suit": "Μείζονα Αρκάνα", "tag": "Εξάρτηση", "desc": "Προσκολλήσεις και ψευδαισθήσεις σε δεσμεύουν. Συνειδητοποίησε την αιχμαλωσία.", "ext": "Οι αλυσίδες στις φιγούρες είναι χαλαρές — μπορούν να βγουν ανά πάσα στιγμή με τη θέλησή σου. Η οδύνη συντηρείται από την ψευδαίσθηση ότι δεν υπάρχει επιλογή. Η συνειδητοποίηση της εξάρτησης είναι το πρώτο και καθοριστικό βήμα προς την ελευθερία."}, "16": {"name": "Ο Πύργος", "suit": "Μείζονα Αρκάνα", "tag": "Καταστροφή", "desc": "Ξαφνικές αναταραχές. Οι ψεύτικες κατασκευές καταρρέουν. Από τα ερείπια γεννιέται το αληθινό.", "ext": "Ο κεραυνός χτυπά τον πύργο της αλαζονείας, γκρεμίζοντας κατασκευές χτισμένες σε ψεύτικα θεμέλια. Το σοκ είναι οδυνηρό, αλλά καθαρίζει τον χώρο για κάτι αυθεντικό. Από τα ερείπια γεννιέται η αληθινή σοφία."}, "17": {"name": "Το Άστρο", "suit": "Μείζονα Αρκάνα", "tag": "Ελπίδα", "desc": "Ελπίδα, έμπνευση και θεραπεία μετά από δύσκολες εποχές.", "ext": "Μετά την καταστροφή του Πύργου, το γαλήνιο φως του άστρου πάνω από τα ήρεμα νερά θεραπεύει την ψυχή. Η ελπίδα αποκαθίσταται, η έμπνευση επιστρέφει και η πίστη στο μέλλον δυναμώνει. Είναι μια εποχή θεραπείας και επανασύνδεσης με τον αληθινό σκοπό σου."}, "18": {"name": "Η Σελήνη", "suit": "Μείζονα Αρκάνα", "tag": "Ψευδαίσθηση", "desc": "Ψευδαισθήσεις και κρυμμένοι κίνδυνοι. Εμπιστεύσου τη διαίσθηση, αλλά έλεγξε τα γεγονότα.", "ext": "Ο δρόμος στο φως του φεγγαριού είναι γεμάτος σκιές και απατηλές μορφές — δεν είναι όλα όπως φαίνονται. Υποσυνείδητοι φόβοι και ανεπεξέργαστα συναισθήματα παραμορφώνουν την αντίληψη της πραγματικότητας. Εμπιστεύσου τη διαίσθηση, αλλά έλεγξε τα γεγονότα πριν αποφασίσεις."}, "19": {"name": "Ο Ήλιος", "suit": "Μείζονα Αρκάνα", "tag": "Χαρά", "desc": "Η πιο θετική κάρτα. Χαρά, επιτυχία, ζωτικότητα. Όλα με τον καλύτερο τρόπο.", "ext": "Το λαμπερό φως διαλύει κάθε σκιά — είναι η κάρτα της απόλυτης επιτυχίας, χαράς και ζωτικότητας. Το παιδί στο λευκό άλογο συμβολίζει την καθαρή ευτυχία, που επιτυγχάνεται μέσα από την απλότητα και την παρουσία. Όλα εξελίσσονται με τον καλύτερο τρόπο, και η ζωή κυριολεκτικά ανθίζει."}, "20": {"name": "Η Κρίση", "suit": "Μείζονα Αρκάνα", "tag": "Αφύπνιση", "desc": "Επανεκτίμηση του παρελθόντος και μια σημαντική απόφαση. Κάλεσμα για αλλαγή.", "ext": "Ο άγγελος σαλπίζει — ήρθε η ώρα της αφύπνισης και της επανεκτίμησης όλων όσων έζησες. Άκουσες το κάλεσμα για ένα ανώτερο επίπεδο ύπαρξης και είσαι έτοιμος να απαντήσεις. Άφησε το βάρος του παρελθόντος και υψώσου προς τον σκοπό σου."}, "21": {"name": "Ο Κόσμος", "suit": "Μείζονα Αρκάνα", "tag": "Ολοκλήρωση", "desc": "Η ολοκλήρωση ενός κύκλου και η πληρότητα. Η ακεραιότητα και η αρμονία είναι η ανταμοιβή.", "ext": "Η χορεύτρια μέσα στο δάφνινο στεφάνι συμβολίζει την πληρότητα, την ολοκλήρωση και την επιτευχθείσα τελειότητα. Ο κύκλος έκλεισε — ό,τι έπρεπε να μαθευτεί μαθεύτηκε, ό,τι έπρεπε να δημιουργηθεί δημιουργήθηκε. Η πλήρης αρμονία με τον εαυτό σου και τον κόσμο είναι η αληθινή νίκη."}, "22": {"name": "Άσος των Ράβδων", "suit": "Ράβδοι", "tag": "Έμπνευση", "desc": "Μια έκρηξη έμπνευσης και δημιουργικής ενέργειας. Μια νέα ιδέα είναι έτοιμη να ανάψει.", "ext": "Ο Άσος των Ράβδων είναι μια σπίθα καθαρού δυναμικού και ωμής δημιουργικής φωτιάς. Ένα νέο πάθος, έργο ή ιδέα σου προσφέρεται — άρπαξέ το. Δράσε πάνω στην έμπνευση πριν σβήσει η φλόγα."}, "23": {"name": "Δύο των Ράβδων", "suit": "Ράβδοι", "tag": "Σχεδιασμός", "desc": "Σχεδιασμός και το πρώτο βήμα προς ένα μεγαλύτερο όραμα. Ο κόσμος στα χέρια σου.", "ext": "Στέκεσαι κοιτάζοντας την επικράτειά σου, ζυγίζοντας πού να πας. Η πρώτη επιτυχία πέρασε· τώρα έρχεται η επιλογή να επεκταθείς πέρα από το γνωστό. Ο τολμηρός σχεδιασμός μετατρέπει μια μικρή νίκη σε ένα μεγάλο ταξίδι."}, "24": {"name": "Τρία των Ράβδων", "suit": "Ράβδοι", "tag": "Επέκταση", "desc": "Επέκταση και τα πρώτα αποτελέσματα των προσπαθειών σου. Κοίτα πιο μακριά.", "ext": "Τα καράβια σου ταξιδεύουν ήδη — οι πρώτες προσπάθειες αποδίδουν και οι ορίζοντες διευρύνονται. Στιγμή διορατικότητας και σίγουρης ανάπτυξης. Συνέχισε να κοιτάς πέρα από την τρέχουσα επιτυχία, προς το μεγαλύτερο σχέδιο."}, "25": {"name": "Τέσσερα των Ράβδων", "suit": "Ράβδοι", "tag": "Γιορτή", "desc": "Γιορτή, σταθερότητα και ένα ευτυχισμένο ορόσημο. Χαρά μοιρασμένη με άλλους.", "ext": "Τέσσερις ράβδοι σχηματίζουν μια πύλη γιορτής — μια αρμονική, χαρούμενη στιγμή. Το σπίτι, η κοινότητα και η αίσθηση του ανήκειν αναδεικνύονται. Σταμάτα για να απολαύσεις ένα δικαιωμένο επίτευγμα με όσους αγαπάς."}, "26": {"name": "Πέντε των Ράβδων", "suit": "Ράβδοι", "tag": "Σύγκρουση", "desc": "Σύγκρουση, ανταγωνισμός και αντίθετες ενέργειες. Ένταση που μπορεί να κατευθυνθεί.", "ext": "Πέντε φιγούρες παλεύουν με ράβδους — τριβές, ανταγωνισμός και διασκορπισμένη προσπάθεια. Η διαμάχη σπάνια είναι σοβαρή· μοιάζει με προπόνηση που σε ακονίζει. Κατεύθυνε την ανταγωνιστική ενέργεια προς έναν κοινό, εποικοδομητικό στόχο."}, "27": {"name": "Έξι των Ράβδων", "suit": "Ράβδοι", "tag": "Θρίαμβος", "desc": "Δημόσια αναγνώριση και μια δικαιωμένη νίκη. Το πλήθος σε επευφημεί.", "ext": "Ο καβαλάρης επιστρέφει θριαμβευτής, στεφανωμένος με δάφνες και επευφημούμενος. Η προσπάθειά σου έγινε ορατή και ανταμείφθηκε. Δέξου την αναγνώριση και κράτα τη φόρα."}, "28": {"name": "Επτά των Ράβδων", "suit": "Ράβδοι", "tag": "Άμυνα", "desc": "Υπερασπίζεσαι ό,τι έχτισες. Κράτα τη θέση σου με θάρρος.", "ext": "Κρατάς το ψηλό έδαφος, υπερασπιζόμενος τη θέση σου απέναντι σε αντιπάλους. Η πίεση είναι αληθινή, αλλά έχεις το πλεονέκτημα και την πεποίθηση. Στάσου σταθερά — η επιμονή τώρα προστατεύει ό,τι έχτισες."}, "29": {"name": "Οκτώ των Ράβδων", "suit": "Ράβδοι", "tag": "Ταχύτητα", "desc": "Ταχύτητα, κίνηση και ραγδαίες εξελίξεις. Τα γεγονότα επιταχύνονται.", "ext": "Οκτώ ράβδοι πετούν στον αέρα — γρήγορη κίνηση, νέα και ραγδαία πρόοδος. Τα εμπόδια ξεκαθαρίζουν και τα πράγματα επιτέλους κινούνται. Δράσε γρήγορα και αξιοποίησε τη φόρα προς τον στόχο σου."}, "30": {"name": "Εννέα των Ράβδων", "suit": "Ράβδοι", "tag": "Αντοχή", "desc": "Αντοχή και η τελευταία στάση. Είσαι πιο δυνατός απ' όσο νομίζεις.", "ext": "Πληγωμένος αλλά αλύγιστος, στέκεσαι φρουρός με την τελευταία σου ράβδο. Έφτασες πολύ μακριά για να τα παρατήσεις τώρα — μένει μία ακόμη προσπάθεια. Η αντοχή και η επιφυλακτική ετοιμότητα σε φέρνουν ως το τέλος."}, "31": {"name": "Δέκα των Ράβδων", "suit": "Ράβδοι", "tag": "Βάρος", "desc": "Ένα βαρύ φορτίο που κουβαλάς μόνος. Ώρα να αφήσεις λίγο κάτω.", "ext": "Δέκα ράβδοι σε βαραίνουν καθώς κουβαλάς τα πάντα μόνος προς τον τερματισμό. Η επιτυχία ήρθε με υπερφόρτωση — κάνεις πολλά μόνος. Ελάφρυνε το φορτίο και ανάθεσε· ο στόχος είναι κοντά, αλλά δεν αξίζει να καείς."}, "32": {"name": "Βαλές των Ράβδων", "suit": "Ράβδοι", "tag": "Ενθουσιασμός", "desc": "Νεανικός ενθουσιασμός και μια σπίθα ανακάλυψης. Μια φρέσκια περιπέτεια καλεί.", "ext": "Ο Βαλές των Ράβδων είναι πρόθυμος, περίεργος και γεμάτος φλογερό ενθουσιασμό. Ένα νέο εγχείρημα ή μήνυμα ευκαιρίας φτάνει. Αγκάλιασε τη σπίθα με παιχνιδιάρικο θάρρος και δες πού οδηγεί."}, "33": {"name": "Ιππότης των Ράβδων", "suit": "Ράβδοι", "tag": "Ορμή", "desc": "Τολμηρή ορμή και ενέργεια περιπέτειας. Όρμα μπροστά — αλλά πρόσεχε την απερισκεψία.", "ext": "Ο Ιππότης των Ράβδων καλπάζει άφοβα προς την περιπέτεια, γεμάτος πάθος και τόλμη. Η φόρα και η αυτοπεποίθηση σε πάνε μακριά, αλλά η ανυπομονησία μπορεί να σκορπίσει τη φωτιά σου. Κατεύθυνε την ορμή με σαφή στόχο."}, "34": {"name": "Βασίλισσα των Ράβδων", "suit": "Ράβδοι", "tag": "Αυτοπεποίθηση", "desc": "Αυτοπεποίθηση, ζεστασιά και μαγνητικό χάρισμα. Στάσου στη δύναμή σου.", "ext": "Η Βασίλισσα των Ράβδων ακτινοβολεί αυτοπεποίθηση, ζεστασιά και δημιουργική ζωτικότητα. Είναι ανεξάρτητη, μαγνητική και δεν φοβάται να φανεί. Στάσου στη δύναμή σου με γενναιοδωρία και σιγουριά."}, "35": {"name": "Βασιλιάς των Ράβδων", "suit": "Ράβδοι", "tag": "Ηγεσία", "desc": "Οραματική ηγεσία και τολμηρή κατεύθυνση. Ηγήσου με το παράδειγμα.", "ext": "Ο Βασιλιάς των Ράβδων είναι γεννημένος ηγέτης — οραματιστής, αποφασιστικός και εμπνευσμένος. Μετατρέπει μεγάλες ιδέες σε κινήματα και συσπειρώνει τους άλλους. Ηγήσου τολμηρά, δώσε κατεύθυνση και άσε το όραμά σου να ανοίξει τον δρόμο."}, "36": {"name": "Άσος των Κυπέλλων", "suit": "Κύπελλα", "tag": "Αγάπη", "desc": "Μια νέα αγάπη και μια ανοιχτή καρδιά. Συναισθηματική ανανέωση ξεχειλίζει.", "ext": "Ο Άσος των Κυπέλλων ξεχειλίζει από αγάπη, συμπόνια και συναισθηματικές δυνατότητες. Μια νέα σχέση, φιλία ή κύμα συναισθήματος προσφέρεται. Άνοιξε την καρδιά σου και άσε το συναίσθημα να κυλήσει ελεύθερα."}, "37": {"name": "Δύο των Κυπέλλων", "suit": "Κύπελλα", "tag": "Συντροφικότητα", "desc": "Συντροφικότητα και αμοιβαία έλξη. Δύο γίνονται ένα αρμονικό ζευγάρι.", "ext": "Δύο κύπελλα υψωμένα σε πρόποση — μια συνάντηση καρδιών και μια ισορροπημένη ένωση. Ο αμοιβαίος σεβασμός και η έλξη δημιουργούν αληθινή σύνδεση. Τίμησε τον δεσμό και άσ' τον να μεγαλώσει ισότιμα."}, "38": {"name": "Τρία των Κυπέλλων", "suit": "Κύπελλα", "tag": "Γλέντι", "desc": "Φιλία, γιορτή και χαρούμενοι δεσμοί. Μαζέψου με τους δικούς σου.", "ext": "Τρεις φίλοι υψώνουν τα κύπελλά τους σε γιορτή — κοινότητα, χαρά και αίσθηση του ανήκειν. Είναι ώρα να μοιραστείς ευτυχία και να στηριχτείς στην παρέα σου. Γιόρτασε τα όμορφα μαζί."}, "39": {"name": "Τέσσερα των Κυπέλλων", "suit": "Κύπελλα", "tag": "Απάθεια", "desc": "Απάθεια και συναισθηματική απόσυρση. Ένα δώρο περνά απαρατήρητο.", "ext": "Χαμένος στη δυσαρέσκεια, αγνοείς ένα νέο κύπελλο που σου προσφέρεται από το πλάι. Η πλήξη ή η απάθεια σε τυφλώνει σε μια αληθινή ευκαιρία. Σήκωσε το βλέμμα — αυτό που ποθείς μπορεί να είναι ήδη κοντά σου."}, "40": {"name": "Πέντε των Κυπέλλων", "suit": "Κύπελλα", "tag": "Απώλεια", "desc": "Απώλεια και θλίψη, μα δεν χάθηκαν όλα. Γύρνα και δες τι έμεινε.", "ext": "Τρία κύπελλα χυμένα, δύο ακόμη όρθια — η προσοχή κόλλησε στην απώλεια. Η θλίψη είναι αληθινή, αλλά σε τύφλωσε σε ό,τι απομένει. Γύρνα: δεν χάθηκαν όλα, και η θεραπεία μπορεί να ξεκινήσει."}, "41": {"name": "Έξι των Κυπέλλων", "suit": "Κύπελλα", "tag": "Νοσταλγία", "desc": "Νοσταλγία και αθώα καλοσύνη. Μια γλυκιά ηχώ του παρελθόντος επιστρέφει.", "ext": "Μια τρυφερή ανάμνηση του παρελθόντος ζεσταίνει το παρόν, γεμάτη αθωότητα και καλοσύνη. Κάποιος ή κάτι από παλιά μπορεί να επιστρέψει. Κράτησε τη ζεστασιά, αλλά μείνε ριζωμένος στο παρόν."}, "42": {"name": "Επτά των Κυπέλλων", "suit": "Κύπελλα", "tag": "Φαντασιώσεις", "desc": "Φαντασιώσεις και πολλές δελεαστικές επιλογές. Διάλεξε με καθαρό βλέμμα.", "ext": "Επτά κύπελλα αιωρούνται με οράματα — άλλα χρυσά, άλλα απατηλά. Οι επιλογές αφθονούν, αλλά δεν είναι όλες αληθινές ή σοφές. Πέρνα μέσα από τη φαντασία και διάλεξε ό,τι σε υπηρετεί πραγματικά."}, "43": {"name": "Οκτώ των Κυπέλλων", "suit": "Κύπελλα", "tag": "Αποχώρηση", "desc": "Αποχώρηση σε αναζήτηση κάτι βαθύτερου. Άφησε ό,τι δεν σε γεμίζει πια.", "ext": "Γυρνάς την πλάτη στα κύπελλα που γέμισες για να αναζητήσεις ένα πιο ουσιαστικό μονοπάτι. Ό,τι κάποτε σε ικανοποιούσε δεν το κάνει πια, και η ψυχή σε καλεί παρακάτω. Βρες το θάρρος να φύγεις προς κάτι βαθύτερο."}, "44": {"name": "Εννέα των Κυπέλλων", "suit": "Κύπελλα", "tag": "Εκπλήρωση", "desc": "Ευχές που εκπληρώνονται και ικανοποίηση. Η «κάρτα της ευχής» σου χαμογελά.", "ext": "Εννέα κύπελλα παραταγμένα με περηφάνια — ικανοποίηση, άνεση και μια ευχή που πραγματοποιείται. Συναισθηματικές και υλικές ευχές ευθυγραμμίζονται υπέρ σου. Απόλαυσε την ικανοποίηση που κέρδισες."}, "45": {"name": "Δέκα των Κυπέλλων", "suit": "Κύπελλα", "tag": "Ευτυχία", "desc": "Διαρκής ευτυχία και συναισθηματική εκπλήρωση. Αρμονία στο σπίτι και στην αγάπη.", "ext": "Το ουράνιο τόξο των δέκα κυπέλλων στεφανώνει διαρκή χαρά, οικογενειακή αρμονία και συναισθηματική εκπλήρωση. Είναι το ευτυχισμένο τέλος του ταξιδιού των Κυπέλλων. Κράτησε ως θησαυρό την αγάπη που σε περιβάλλει."}, "46": {"name": "Βαλές των Κυπέλλων", "suit": "Κύπελλα", "tag": "Ονειροπόλος", "desc": "Ένας τρυφερός ονειροπόλος και μια δημιουργική σπίθα. Άκου τη φαντασία σου.", "ext": "Ο Βαλές των Κυπέλλων είναι ευαίσθητος, ονειροπόλος και ανοιχτόκαρδος. Ένα απρόσμενο μήνυμα, ιδέα ή συναίσθημα αναβλύζει. Ακολούθησε τη διαίσθησή σου και άσε τη δημιουργικότητα να ρέει χωρίς κριτική."}, "47": {"name": "Ιππότης των Κυπέλλων", "suit": "Κύπελλα", "tag": "Ρομαντικός", "desc": "Ένας ρομαντικός σε αναζήτηση. Ακολούθησε το κάλεσμα της καρδιάς σου.", "ext": "Ο Ιππότης των Κυπέλλων φτάνει κρατώντας ένα κύπελλο — μια προσφορά αγάπης, ρομαντισμού ή μια εγκάρδια πρόσκληση. Κινείται με γοητεία, ιδεαλισμό και συναισθηματική χάρη. Ακολούθησε το κάλεσμα της καρδιάς, αλλά κράτα τα πόδια σου στη γη."}, "48": {"name": "Βασίλισσα των Κυπέλλων", "suit": "Κύπελλα", "tag": "Ενσυναίσθηση", "desc": "Ενσυναίσθηση, συμπόνια και συναισθηματικό βάθος. Εμπιστεύσου το συναίσθημά σου.", "ext": "Η Βασίλισσα των Κυπέλλων ενσαρκώνει την ενσυναίσθηση, τη διαίσθηση και τη συναισθηματική σοφία. Κρατά χώρο για τους άλλους και διαβάζει τα ανείπωτα. Εμπιστεύσου τα συναισθήματά σου και φρόντισε τον εαυτό σου όσο φροντίζεις τους άλλους."}, "49": {"name": "Βασιλιάς των Κυπέλλων", "suit": "Κύπελλα", "tag": "Σοφία", "desc": "Συναισθηματική κυριαρχία και ήρεμη σοφία. Ηγήσου με ισορροπημένη καρδιά.", "ext": "Ο Βασιλιάς των Κυπέλλων κυριαρχεί στα συναισθήματά του με ηρεμία και συμπόνια. Μένει σταθερός μέσα στις συναισθηματικές καταιγίδες και προσφέρει σοφή, ισορροπημένη συμβουλή. Ηγήσου με ζεστή αλλά νηφάλια καρδιά."}, "50": {"name": "Άσος των Σπαθιών", "suit": "Σπαθιά", "tag": "Ρήξη", "desc": "Μια ρήξη διαύγειας και αλήθειας. Φτάσε στην ουσία.", "ext": "Ο Άσος των Σπαθιών είναι μια λάμψη καθαρής πνευματικής διαύγειας και αποφασιστικής αλήθειας. Μια ιδέα-ρήξη ή μια ειλικρινής συνειδητοποίηση κόβει μέσα από τη σύγχυση. Χρησιμοποίησε τη διαύγειά σου με ακρίβεια και δράσε."}, "51": {"name": "Δύο των Σπαθιών", "suit": "Σπαθιά", "tag": "Αδιέξοδο", "desc": "Αδιέξοδο και μια απόφαση που αποφεύγεται. Βγάλε το κάλυμμα και διάλεξε.", "ext": "Με δεμένα μάτια ισορροπείς δύο σπαθιά, αρνούμενος να επιλέξεις. Το αδιέξοδο είναι βολικό αλλά δεν κρατά. Βγάλε το κάλυμμα, ζύγισε την αλήθεια και πάρε την απόφαση."}, "52": {"name": "Τρία των Σπαθιών", "suit": "Σπαθιά", "tag": "Πόνος", "desc": "Πόνος και οδυνηρή αλήθεια. Άσε τη βροχή να περάσει, μετά θεράπευσε.", "ext": "Τρία σπαθιά τρυπούν την καρδιά — θλίψη, προδοσία ή οδυνηρή διαύγεια. Ο πόνος είναι αληθινός και πρέπει να βιωθεί, όχι να αρνηθεί. Άσε την καταιγίδα να περάσει· η διαύγεια και η θεραπεία ακολουθούν τη βροχή."}, "53": {"name": "Τέσσερα των Σπαθιών", "suit": "Σπαθιά", "tag": "Ανάπαυση", "desc": "Ανάπαυση και ανάρρωση. Κάνε ένα βήμα πίσω για να ανακτήσεις δυνάμεις.", "ext": "Μια φιγούρα αναπαύεται στην ησυχία, με τα σπαθιά στην άκρη — ανάρρωση μετά τον αγώνα. Είναι μια αναγκαία παύση, όχι ήττα. Κάνε ένα βήμα πίσω, ξεκούρασε το μυαλό σου και γύρνα πιο δυνατός."}, "54": {"name": "Πέντε των Σπαθιών", "suit": "Σπαθιά", "tag": "Ήττα", "desc": "Σύγκρουση με μια κούφια νίκη. Μέτρα το πραγματικό κόστος.", "ext": "Μια φιγούρα μαζεύει σπαθιά ενώ άλλοι φεύγουν ηττημένοι — μια νίκη που αφήνει πληγές. Η περηφάνια ή η σύγκρουση έχει κρυφό τίμημα. Αναρωτήσου αν αξίζει να έχεις δίκιο με τέτοιο κόστος."}, "55": {"name": "Έξι των Σπαθιών", "suit": "Σπαθιά", "tag": "Μετάβαση", "desc": "Μια μετάβαση προς πιο ήρεμα νερά. Άφησε πίσω τη δυσκολία.", "ext": "Ένα ήσυχο πέρασμα σε απομακρύνει από τα ταραγμένα νερά προς πιο γαλήνιες ακτές. Το πιο δύσκολο περνά, ακόμη κι αν μένει η θλίψη. Εμπιστεύσου τη μετάβαση — κινείσαι προς τη γαλήνη."}, "56": {"name": "Επτά των Σπαθιών", "suit": "Σπαθιά", "tag": "Απάτη", "desc": "Απάτη, στρατηγική ή μια ήσυχη διαφυγή. Δράσε με ακεραιότητα.", "ext": "Ξεγλιστράς με σπαθιά στα χέρια — πονηριά, μυστικότητα ή μια έξυπνη παράκαμψη. Ίσως χρειάζεται στρατηγική, αλλά και ειλικρίνεια. Φρόντισε η εξυπνάδα να μην κοστίσει την ακεραιότητά σου."}, "57": {"name": "Οκτώ των Σπαθιών", "suit": "Σπαθιά", "tag": "Παγίδα", "desc": "Νιώθεις παγιδευμένος, αν και η έξοδος είναι ανοιχτή. Ελευθέρωσε το μυαλό σου.", "ext": "Δεμένος και με κλειστά μάτια ανάμεσα σε σπαθιά, νιώθεις παγιδευμένος — όμως οι δεσμοί είναι χαλαροί. Ο περιορισμός είναι κυρίως στο μυαλό. Ελευθερώσου: η έξοδος ήταν πάντα ανοιχτή."}, "58": {"name": "Εννέα των Σπαθιών", "suit": "Σπαθιά", "tag": "Άγχος", "desc": "Άγχος, ανησυχία και άυπνες νύχτες. Ο φόβος είναι μεγαλύτερος από το γεγονός.", "ext": "Ξύπνιος στο σκοτάδι, πιασμένος από την ανησυχία, το μυαλό μεγεθύνει κάθε φόβο. Ο τρόμος είναι βαρύτερος από την πραγματικότητα πίσω του. Ονομάτισε τους φόβους στο φως της μέρας και αρχίζουν να μικραίνουν."}, "59": {"name": "Δέκα των Σπαθιών", "suit": "Σπαθιά", "tag": "Τέλος", "desc": "Ένα οδυνηρό τέλος, μα το χειρότερο πέρασε. Η αυγή ακολουθεί την πιο σκοτεινή νύχτα.", "ext": "Δέκα σπαθιά σηματοδοτούν ένα σκληρό τέλος — τον πάτο του ταξιδιού. Όσο οδυνηρό κι αν είναι, χειρότερα δεν γίνεται από εδώ. Ο μόνος δρόμος τώρα είναι προς τα πάνω· άσε την αυγή να έρθει."}, "60": {"name": "Βαλές των Σπαθιών", "suit": "Σπαθιά", "tag": "Περιέργεια", "desc": "Περιέργεια και ένα κοφτερό, πρόθυμο μυαλό. Κάνε ερωτήσεις και μείνε σε εγρήγορση.", "ext": "Ο Βαλές των Σπαθιών είναι περίεργος, άγρυπνος και ευφυής. Νέες ιδέες, πληροφορίες ή η ανάγκη να πεις την αλήθεια αναδύονται. Μείνε σε εγρήγορση, κάνε ερωτήσεις, αλλά πρόσεχε την ανήσυχη υπερανάλυση."}, "61": {"name": "Ιππότης των Σπαθιών", "suit": "Σπαθιά", "tag": "Ορμή", "desc": "Ορμητική ώθηση προς έναν στόχο. Όρμα μπροστά — αλλά σκέψου πρώτα.", "ext": "Ο Ιππότης των Σπαθιών ορμά ολοταχώς, κινούμενος από λογική και φιλοδοξία. Η συγκέντρωσή του είναι έντονη, αλλά η βιασύνη μπορεί να παρακάμψει τη σύνεση. Κατεύθυνε την ώθηση με ένα ξεκάθαρο, καλά μελετημένο σχέδιο."}, "62": {"name": "Βασίλισσα των Σπαθιών", "suit": "Σπαθιά", "tag": "Διαύγεια", "desc": "Καθαρή εντιμότητα και ανεξάρτητη κρίση. Δες τα πράγματα όπως είναι.", "ext": "Η Βασίλισσα των Σπαθιών βλέπει καθαρά και λέει την αλήθεια χωρίς κολακείες. Η εμπειρία της έδωσε οξεία αντίληψη και υγιή όρια. Κρίνε με διαύγεια, συμπόνια και ατρόμητη ειλικρίνεια."}, "63": {"name": "Βασιλιάς των Σπαθιών", "suit": "Σπαθιά", "tag": "Κύρος", "desc": "Το κύρος της διάνοιας και η δίκαιη κρίση. Ηγήσου με τη λογική.", "ext": "Ο Βασιλιάς των Σπαθιών κυβερνά με διάνοια, ηθική και αμερόληπτη κρίση. Κόβει μέσα από το συναίσθημα για να βρει την αλήθεια και να αποφασίσει δίκαια. Ηγήσου με λογική, διαύγεια και ακεραιότητα."}, "64": {"name": "Άσος των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Ευημερία", "desc": "Ευημερία και μια απτή νέα ευκαιρία. Φύτεψε τον σπόρο τώρα.", "ext": "Ο Άσος των Πεντάκλων προσφέρει έναν σπόρο ευημερίας — μια νέα δουλειά, εγχείρημα ή υλική ευκαιρία. Το δυναμικό είναι στέρεο και αληθινό, όχι απλή ιδέα. Φύτεψέ το με φροντίδα και θα μεγαλώσει σε αφθονία."}, "65": {"name": "Δύο των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Ισορροπία", "desc": "Ισορροπία προτεραιοτήτων με ευελιξία. Κάνε ταχυδακτυλουργίες, αλλά μείνε γειωμένος.", "ext": "Δύο πεντάκλες χορεύουν σε ισορροπία — ζογκλάρισμα με χρόνο, χρήμα και αντικρουόμενες απαιτήσεις. Η ευελιξία και το καλό χιούμορ κρατούν τα πάντα στον αέρα. Μείνε προσαρμοστικός, αλλά μην αναλάβεις περισσότερα απ' όσα αντέχεις."}, "66": {"name": "Τρία των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Δεξιοτεχνία", "desc": "Δεξιοτεχνία, συνεργασία και επιδέξια δουλειά. Χτίστε το μαζί.", "ext": "Τρεις πεντάκλες σημαδεύουν επιδέξια τεχνική και ομαδικότητα. Οι ικανότητές σου αναγνωρίζονται και συνδυάζονται με των άλλων προς ένα κοινό χτίσιμο. Συνεργάσου, τελειοποίησε την τέχνη σου και βάλε στέρεα θεμέλια."}, "67": {"name": "Τέσσερα των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Έλεγχος", "desc": "Κρατάς σφιχτά — έλεγχος και ασφάλεια. Χαλάρωσε λίγο τη λαβή.", "ext": "Τέσσερις πεντάκλες αγκαλιασμένες σφιχτά — ανάγκη για ασφάλεια και έλεγχο. Η σταθερότητα είναι καλή, αλλά το να κρατάς πολύ σφιχτά μπλοκάρει τη ροή. Χαλάρωσε λίγο τη λαβή για να μπει νέα ενέργεια και ανάπτυξη."}, "68": {"name": "Πέντε των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Ανάγκη", "desc": "Δυσκολία και μια αίσθηση έλλειψης. Η βοήθεια είναι πιο κοντά απ' όσο φαίνεται.", "ext": "Δύο φιγούρες παλεύουν στο κρύο έξω από ένα φωτισμένο παράθυρο — δυσκολία και αίσθηση αποκλεισμού. Η δυσκολία είναι αληθινή, αλλά η στήριξη είναι πιο κοντά απ' όσο δείχνει. Ζήτα βοήθεια· δεν χρειάζεται να το αντέξεις μόνος."}, "69": {"name": "Έξι των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Γενναιοδωρία", "desc": "Γενναιοδωρία και δίκαιη ανταλλαγή. Δίνε και δέξου με ισορροπία.", "ext": "Νομίσματα ρέουν από το ένα χέρι στο άλλο, ζυγισμένα στη ζυγαριά — γενναιοδωρία και ισορροπημένη ανταλλαγή. Είτε δίνεις είτε δέχεσαι, η δικαιοσύνη αποκαθιστά τη ροή. Μοιράσου ό,τι έχεις και δέξου βοήθεια με χάρη."}, "70": {"name": "Επτά των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Υπομονή", "desc": "Υπομονή ενώ η επένδυσή σου ωριμάζει. Φρόντισε τον κήπο και περίμενε.", "ext": "Ακουμπώντας στην τσάπα, κοιτάζεις μια σοδειά που δεν ωρίμασε ακόμη — μια παύση για να αξιολογήσεις την επένδυσή σου. Η ανάπτυξη θέλει χρόνο, και η ανυπομονησία τώρα θα κόστιζε. Φρόντισε ό,τι φύτεψες και άσ' το να ωριμάσει."}, "71": {"name": "Οκτώ των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Επιμέλεια", "desc": "Επιμέλεια και αφοσιωμένη τέχνη. Συνέχισε να τελειοποιείς τη δεξιότητά σου.", "ext": "Οκτώ πεντάκλες δείχνουν συγκεντρωμένη, επαναλαμβανόμενη δουλειά — μαθητεία και αφοσίωση σε μια τέχνη. Η δεξιοτεχνία χτίζεται ένα προσεκτικό κομμάτι κάθε φορά. Συνέχισε να τελειοποιείς τη δεξιότητά σου· η σταθερή προσπάθεια αποδίδει."}, "72": {"name": "Εννέα των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Άνεση", "desc": "Άνεση, ανεξαρτησία και κερδισμένη αφθονία. Απόλαυσε τον κήπο που έφτιαξες.", "ext": "Μια φιγούρα στέκεται σε έναν πλούσιο κήπο — εκλέπτυνση, ανεξαρτησία και καλοκερδισμένη άνεση. Η αυτοπειθαρχία απέδωσε υλική και προσωπική αφθονία. Απόλαυσε τους καρπούς των κόπων σου."}, "73": {"name": "Δέκα των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Κληρονομιά", "desc": "Κληρονομιά, οικογένεια και διαρκής πλούτος. Χτίσε κάτι που αντέχει.", "ext": "Δέκα πεντάκλες στεφανώνουν διαρκή πλούτο, οικογένεια και κληρονομιά. Το έργο γενεών δημιουργεί ασφάλεια που σε ξεπερνά. Χτίσε θεμέλια και παραδόσεις που θα αντέξουν."}, "74": {"name": "Βαλές των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Μαθητευόμενος", "desc": "Ένας μαθητευόμενος πρόθυμος να μάθει. Μελέτησε, σχεδίασε και ξεκίνα από λίγο.", "ext": "Ο Βαλές των Πεντάκλων είναι μελετηρός, γειωμένος και πρόθυμος να μάθει μια νέα δεξιότητα. Μια ευκαιρία να σπουδάσεις, να σχεδιάσεις ή να ξεκινήσεις ένα πρακτικό εγχείρημα εμφανίζεται. Ξεκίνα μετριοπαθώς και χτίσε σταθερά."}, "75": {"name": "Ιππότης των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Αξιοπιστία", "desc": "Αξιοπιστία και υπομονετική, σταθερή προσπάθεια. Αργά και σίγουρα κερδίζεις.", "ext": "Ο Ιππότης των Πεντάκλων είναι αξιόπιστος, μεθοδικός και εργατικός. Μπορεί να είναι αργός, αλλά τελειώνει ό,τι ξεκινά. Εμπιστεύσου την υπομονετική, συνεπή προσπάθεια να σε φέρει στον στόχο."}, "76": {"name": "Βασίλισσα των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Φροντίδα", "desc": "Πρακτική φροντίδα και γειωμένη μέριμνα. Φρόντισε το σπίτι και τον εαυτό σου.", "ext": "Η Βασίλισσα των Πεντάκλων φροντίζει με ζεστασιά και γήινη πρακτικότητα. Νοιάζεται για το σπίτι, το σώμα και τους πόρους με σταθερή αφθονία. Φρόντισε τις πρακτικές ανάγκες του εαυτού σου και των άλλων."}, "77": {"name": "Βασιλιάς των Πεντάκλων", "suit": "Πεντάκλες", "tag": "Επικράτεια", "desc": "Δεξιοτεχνία, πλούτος και διαρκής επιτυχία. Χτίσε σοφά την αυτοκρατορία σου.", "ext": "Ο Βασιλιάς των Πεντάκλων είναι ο κυρίαρχος του υλικού κόσμου — πλούσιος, αξιόπιστος και γενναιόδωρος. Έχτισε διαρκή επιτυχία μέσα από πειθαρχία και καλή κρίση. Διαχειρίσου σοφά τους πόρους σου και άσε την αυτοκρατορία σου να μεγαλώσει."}}, "pos": ["Παρελθόν", "Παρόν", "Μέλλον"], "pos_d": ["Αυτή η κάρτα αντανακλά την επιρροή του παρελθόντος — τα γεγονότα και τις ενέργειες που σε έφεραν σε αυτή τη στιγμή.", "Η κάρτα του παρόντος δείχνει τις βασικές ενέργειες, προκλήσεις και ευκαιρίες της τρέχουσας στιγμής.", "Η κάρτα του μέλλοντος δείχνει την πιο πιθανή εξέλιξη των γεγονότων στην τρέχουσα πορεία σου."], "intents": {"Αγάπη": ["Τι με περιμένει στην αγάπη;", "Να ανοιχτώ;", "Πότε θα μου γράψει;", "Πώς είναι ο σύντροφός μου;", "Είμαι έτοιμος για αγάπη;", "Είναι έτοιμος για αγάπη;", "Είναι αμοιβαία τα συναισθήματα;", "Πώς να βελτιώσω τη σχέση;", "Υπάρχει μέλλον για εμάς;"], "Καριέρα": ["Ποιες είναι οι προοπτικές μου;", "Να αλλάξω δουλειά;", "Πώς θα εξελιχθώ στην καριέρα;", "Μου ταιριάζει ο τομέας μου;", "Πότε θα έρθει η επιτυχία;", "Να ανοίξω δική μου δουλειά;", "Μπορώ να επιταχύνω την εξέλιξή μου;", "Θα βρω τη δουλειά των ονείρων μου;", "Είναι ο σωστός δρόμος;"], "Οικονομικά": ["Τι με περιμένει στα οικονομικά;", "Πώς να αυξήσω το εισόδημά μου;", "Να ρισκάρω;", "Πότε θα έρθει η ευημερία;", "Θα ξεχρεώσω σύντομα το δάνειο;", "Να πάρω δάνειο;", "Θα δημιουργήσω σύντομα αποταμιεύσεις;", "Ξοδεύω σωστά;", "Θα μου έρθει τύχη;"], "Υγεία": ["Πώς είναι η υγεία μου;", "Πώς να βελτιώσω την υγεία μου;", "Πώς θα βρω ισορροπία;", "Τι μου λέει το σώμα μου;", "Πότε θα μειώσω το άγχος μου;", "Τι μου δίνει δύναμη;", "Τι είναι σημαντικό για την υγεία μου;", "Πώς θα βρω αρμονία;", "Πού να ψάξω για θεραπεία;"], "Γενικά": ["Τι με περιμένει μπροστά;", "Τι μάθημα κρύβει η μοίρα;", "Πώς θα ζω σε 5 χρόνια;", "Πώς να πάρω μια απόφαση;", "Πότε θα γίνω ευτυχισμένος;", "Πάει η ζωή μου προς το καλύτερο;", "Τι δεν βλέπω στον εαυτό μου;", "Θα μου έρθει τύχη;", "Θα βρω τον δρόμο μου;"]}, "energy_4": ["Οι κάρτες ακτινοβολούν ισχυρή θετική ενέργεια. Το άνοιγμα είναι ξεκάθαρα ευνοϊκό — το σύμπαν είναι με το μέρος σου.", "Οι τρεις κάρτες σχηματίζουν μια εξαιρετικά ισχυρή θετική ροή. Τύχη, ευκαιρίες και εσωτερική δύναμη συγκλίνουν.", "Το άνοιγμα ξεχειλίζει από δημιουργική ενέργεια. Όλα παίζουν υπέρ σου — δράσε τολμηρά και χωρίς δισταγμό.", "Ένα ισχυρό, ευνοϊκό άνοιγμα. Οι κάρτες λένε: είσαι στη ροή — αξιοποίησε πλήρως αυτή τη στιγμή."], "energy_2": ["Ο γενικός τόνος του ανοίγματος είναι ευνοϊκός, με αποχρώσεις. Οι ευκαιρίες είναι ανοιχτές, αλλά χρειάζεται προσοχή στις λεπτομέρειες.", "Οι κάρτες δείχνουν θετική εικόνα με κάποια σημεία ανάπτυξης. Η κατεύθυνση είναι σωστή — συνέχισε μπροστά.", "Το άνοιγμα είναι γενικά ενθαρρυντικό. Η ενέργεια στηρίζει τις προθέσεις σου, αν και θα χρειαστεί κάποια ευελιξία.", "Θετικό υπόβαθρο με κάλεσμα για επίγνωση. Έχεις ό,τι χρειάζεσαι — το κλειδί είναι να κατευθύνεις σωστά την προσπάθειά σου."], "energy_0": ["Το άνοιγμα δείχνει μια ανάμεικτη εικόνα. Υπάρχει και δυναμικό και προειδοποίηση — η ισορροπία είναι στα χέρια σου.", "Οι κάρτες αντανακλούν μια μεταβατική περίοδο. Το παλιό δίνει τη θέση του στο νέο, κι εξαρτάται από σένα ποιο θα είναι αυτό.", "Η κατάσταση είναι σε σταυροδρόμι. Το άνοιγμα είναι ουδέτερο — ό,τι συμβεί στη συνέχεια θα το κρίνουν οι επιλογές σου.", "Η ενέργεια της στιγμής είναι ασταθής αλλά διαχειρίσιμη. Η επίγνωση μετράει τώρα πιο πολύ από την ταχύτητα."], "energy_m2": ["Οι κάρτες δείχνουν μια δύσκολη περίοδο. Είναι καιρός δοκιμασιών, αλλά οι δοκιμασίες σφυρηλατούν τον χαρακτήρα.", "Το άνοιγμα μιλά για ένα τεταμένο αλλά σημαντικό στάδιο. Οι δυσκολίες δεν είναι καταδίκη αλλά σήμα για επανεξέταση.", "Η ενέργεια της στιγμής είναι απαιτητική. Οι κάρτες δεν καλούν σε φυγή αλλά σε ειλικρινή ματιά στα όσα συμβαίνουν.", "Ένα δύσκολο άνοιγμα που ζητά θάρρος. Το ζητούμενο δεν είναι να αντισταθείς στο ρεύμα αλλά να βρεις στήριγμα μέσα του."], "energy_m4": ["Το άνοιγμα αντανακλά σοβαρές προκλήσεις. Τώρα είναι καιρός για εσωτερική δουλειά και επανεξέταση του δρόμου σου.", "Οι κάρτες μιλούν για μια έντονη περίοδο μεταμόρφωσης. Καταρρέει ό,τι δεν σε υπηρετεί πια.", "Ένα βαρύ άνοιγμα που ζητά ειλικρίνεια με τον εαυτό σου. Δεν είναι ώρα για ψευδαισθήσεις — είναι ώρα για βαθιά δουλειά.", "Οι κάρτες δείχνουν το χαμηλότερο σημείο. Από εδώ ξεκινά ο δρόμος προς τα πάνω — αν επιτρέψεις στον εαυτό σου να αλλάξει."], "outlook_4": ["Εμπιστεύσου τη ροή και δράσε με σιγουριά.", "Ακολούθησε τολμηρά τον δρόμο σου — τα άστρα είναι με το μέρος σου.", "Επίτρεψε στον εαυτό σου να δεχτεί την τύχη — της αξίζεις.", "Δράσε αποφασιστικά: τώρα ό,τι αναλαμβάνεις έχει την ευκαιρία να ανθίσει."], "outlook_2": ["Η κατάσταση διαμορφώνεται υπέρ σου — μη χάσεις τη στιγμή.", "Προχώρα με σιγουριά, μένοντας προσεκτικός στις αλλαγές.", "Το δυναμικό είναι μεγάλο — το ερώτημα είναι μόνο πώς θα το αξιοποιήσεις.", "Ο δρόμος είναι ανοιχτός. Οι πράξεις σου τώρα θα κρίνουν το αποτέλεσμα."], "outlook_0": ["Το αποτέλεσμα εξαρτάται από τις αποφάσεις σου — να είσαι συνειδητός σε κάθε βήμα.", "Ο δρόμος δεν είναι προδιαγεγραμμένος — αυτή τη στιγμή γράφεις την ιστορία σου.", "Η ισορροπία των δυνάμεων είναι ίση. Μια μικρή προσπάθεια στη σωστή κατεύθυνση θα τα αλλάξει όλα.", "Οι κάρτες σου δίνουν ελευθερία επιλογής — αξιοποίησέ την σοφά."], "outlook_m2": ["Κάνε υπομονή — μετά τη σκοτεινή περίοδο έρχεται πάντα η αυγή.", "Οι δοκιμασίες είναι προσωρινές. Ό,τι χτίζεις τώρα μέσα σου θα μείνει για πάντα.", "Η πιο σκοτεινή ώρα είναι πριν την αυγή. Κράτα τον δρόμο σου.", "Η κρίση είναι πρόσκληση για ανάπτυξη. Δέξου την με αξιοπρέπεια."], "outlook_m4": ["Επιβράδυνε, άκουσε τον εαυτό σου και μην παίρνεις απότομες αποφάσεις.", "Σταμάτα. Μερικές φορές το καλύτερο που μπορείς να κάνεις είναι να μην κάνεις τίποτα.", "Δώσε στον εαυτό σου χρόνο. Η εσωτερική σιωπή αξίζει τώρα πιο πολύ από κάθε πράξη.", "Άσε τον έλεγχο. Επίτρεψε στην κατάσταση να λυθεί με τον δικό της τρόπο."], "adv_2": ["Η κατάσταση κινείται από το δύσκολο στο φωτεινό — το μέλλον υπόσχεται σημαντική βελτίωση.", "Η τροχιά του ανοίγματος είναι ανοδική. Πέρασες ήδη το πιο δύσκολο — μπροστά ανοίγει νέος χώρος.", "Το παρελθόν ήταν μάθημα, το παρόν μετάβαση, το μέλλον ανταμοιβή. Είσαι στον σωστό δρόμο.", "Η δυναμική του ανοίγματός σου μιλά για ανάπτυξη. Με κάθε βήμα η κατάσταση γίνεται πιο φωτεινή."], "adv_1": ["Η δυναμική είναι θετική — κάθε επόμενο βήμα σε φέρνει πιο κοντά στο καλύτερο.", "Η κατεύθυνσή σου είναι σωστή. Συνέχισε έτσι — τα αποτελέσματα δεν θα αργήσουν.", "Η πρόοδος είναι ορατή. Οι κάρτες επιβεβαιώνουν: κινείσαι στη σωστή κατεύθυνση.", "Η κατάσταση βελτιώνεται. Εμπιστεύσου τη διαδικασία — σε πάει εκεί που πρέπει."], "adv_0": ["Η ενέργεια είναι σταθερή — οι βασικές αλλαγές εξαρτώνται από τις συνειδητές πράξεις σου.", "Η κατάσταση είναι σταθερή. Η αλλαγή θα χρειαστεί την πρωτοβουλία σου — δεν θα έρθει μόνη της.", "Το πλατό δεν είναι τέλος· είναι η πλατφόρμα για το επόμενο άλμα. Ετοιμάσου.", "Η ισορροπία κρατά. Το επόμενο συνειδητό σου βήμα θα κινήσει τα πράγματα."], "adv_m1": ["Πρόσεχε τις λεπτομέρειες — μπροστά μπορεί να υπάρχουν κρυφές παγίδες.", "Η καθοδική δυναμική ζητά προσοχή. Τώρα είναι καλύτερα να παρατηρείς παρά να βιάζεσαι.", "Ό,τι φαίνεται καλό τώρα μπορεί να μην είναι αύριο. Κοίτα βαθύτερα.", "Η κατάσταση θέλει επανεξέταση. Μη βιάζεις τα γεγονότα — δώσε χρόνο να δεις όλη την εικόνα."], "adv_m2": ["Αξίζει να επιβραδύνεις και να επανεξετάσεις την προσέγγισή σου — η σύνεση μετράει τώρα πιο πολύ από την ταχύτητα.", "Η πτωτική τάση δείχνει ότι ο δρόμος που διάλεξες χρειάζεται επανεξέταση.", "Πριν προχωρήσεις, κοίτα πίσω. Τι άφησες ημιτελές; Εκεί είναι η απάντηση.", "Οι κάρτες συμβουλεύουν επίμονα μια παύση. Οι παρορμητικές αποφάσεις τώρα μπορεί να κοστίσουν ακριβά."], "c_health_3": ["Η ενέργεια της ανάρρωσης και της ζωτικότητας είναι με το μέρος σου — υπέροχη στιγμή να δυναμώσεις την υγεία σου.", "Οι κάρτες μιλούν για ζωτικότητα και ανανέωση. Το σώμα σου είναι έτοιμο να αναρρώσει — βοήθησέ το.", "Μια ισχυρή ροή θεραπευτικής ενέργειας. Ό,τι κάνεις τώρα για την υγεία σου θα αποδώσει."], "c_health_1": ["Η υγεία σου δυναμώνει — συνέχισε να φροντίζεις τον εαυτό σου και να ακούς το σώμα σου.", "Θετική δυναμική. Το σώμα σου αναρρώνει — δώσε του χρόνο και στήριξη.", "Οι κάρτες στηρίζουν τον δρόμο σου προς την υγεία. Μη σταματάς — είσαι στον σωστό δρόμο."], "c_health_0": ["Δώσε προσοχή στην εσωτερική σου ισορροπία — σώμα και πνεύμα είναι αξεχώριστα δεμένα.", "Το σώμα σου ζητά προσοχή. Άκουσε τα σήματά του — δεν εμφανίστηκαν τυχαία.", "Η υγεία σου θέλει πιο συνειδητή προσέγγιση. Ξεκίνα από τα μικρά: ύπνος, διατροφή, ξεκούραση."], "c_health_n": ["Άκουσε τον εαυτό σου και μην αγνοείς τα σήματα του σώματος — η ξεκούραση και η αυτοφροντίδα μετράνε τώρα πιο πολύ.", "Οι κάρτες επιμένουν: η υγεία μετράει πιο πολύ από κάθε σχέδιο. Σταμάτα και φρόντισε τον εαυτό σου.", "Το σώμα σου σου λέει κάτι σημαντικό. Μην το προσπερνάς — άκου και δράσε."], "c_love_3": ["Τώρα είναι μια υπέροχη στιγμή για αγάπη — άνοιξε την καρδιά σου στα συναισθήματά σου.", "Οι κάρτες τραγουδούν για αγάπη. Επίτρεψε στον εαυτό σου να είναι ευάλωτος — αυτό ανοίγει την πόρτα στην αληθινή εγγύτητα.", "Ισχυρή ενέργεια αγάπης στο άνοιγμα. Αυτό που ψάχνεις σε ψάχνει κιόλας.", "Η καρδιά σου είναι έτοιμη. Οι κάρτες λένε — μην το αναβάλλεις. Η αγάπη δεν ανέχεται δισταγμό."], "c_love_1": ["Στα συναισθηματικά αναμένεται εξέλιξη — να είσαι ειλικρινής με τον εαυτό σου και τον σύντροφό σου.", "Η σχέση προχωρά μπροστά. Το άνοιγμα και η ειλικρίνεια είναι τα κλειδιά για το επόμενο επίπεδο εγγύτητας.", "Οι κάρτες βλέπουν δυναμικό ανάπτυξης στη σχέση σου. Επένδυσε χρόνο και προσοχή σε αυτήν."], "c_love_0": ["Η σχέση θα χρειαστεί δουλειά και υπομονή, αλλά το δυναμικό ανάπτυξης υπάρχει.", "Τώρα είναι ώρα για μια ειλικρινή κουβέντα — με τον εαυτό σου και τους δικούς σου. Η διαύγεια νικά τις ψευδαισθήσεις.", "Οι κάρτες δείχνουν ένα σημείο ισορροπίας. Τι θα κρατήσεις και τι θα αφήσεις είναι δική σου μόνο επιλογή."], "c_love_n": ["Τώρα είναι σημαντικό να καταλάβεις τα αληθινά σου συναισθήματα πριν προχωρήσεις.", "Η σχέση δοκιμάζεται. Δεν είναι τέλος — είναι ευκαιρία να δεις τι έχει πραγματικά σημασία.", "Οι κάρτες καλούν σε ειλικρίνεια. Μια σχέση χωρίς αλήθεια δεν έχει μέλλον — μα η αλήθεια μπορεί να τα αλλάξει όλα."], "c_career_3": ["Ο επαγγελματικός σου τομέας ανοίγει εξαιρετικές ευκαιρίες — ώρα να δράσεις.", "Οι κάρτες δείχνουν μια περίοδο επαγγελματικής άνθησης. Η φιλοδοξία τώρα δεν είναι αμαρτία αλλά αναγκαιότητα.", "Ό,τι επένδυσες στη δουλειά σου αρχίζει να αποδίδει. Μη σταματάς.", "Λαμπρή στιγμή για επαγγελματική ανέλιξη. Δείξε τον εαυτό σου — ο κόσμος είναι έτοιμος να σε δεχτεί."], "c_career_1": ["Στη δουλειά διαφαίνεται πρόοδος — πάρε πρωτοβουλία και μη φοβάσαι την αλλαγή.", "Οι κάρτες στηρίζουν τον επαγγελματικό σου δρόμο. Κάνε ένα βήμα προς αυτό που θέλεις.", "Καλή στιγμή για επαγγελματικές αποφάσεις. Εμπιστεύσου την εμπειρογνωμοσύνη σου."], "c_career_0": ["Στην καριέρα έρχονται αλλαγές — προσαρμόσου και ψάξε νέες προσεγγίσεις.", "Οι κάρτες μιλούν για ανάγκη επανεξέτασης του επαγγελματικού δρόμου. Δεν είναι κρίση — είναι ανάπτυξη.", "Μεταβατική περίοδος στην καριέρα. Αξιοποίησέ την για να αναπτύξεις νέες δεξιότητες."], "c_career_n": ["Αξίζει να επανεξετάσεις τον επαγγελματικό σου δρόμο και να βάλεις προτεραιότητες.", "Οι κάρτες προειδοποιούν για επαγγελματικές δυσκολίες. Το καλύτερο είναι να αξιολογήσεις ειλικρινά την κατάσταση.", "Τώρα δεν είναι η καλύτερη στιγμή για ριψοκίνδυνες επαγγελματικές κινήσεις. Ενίσχυσε τα θεμέλια."], "c_fin_3": ["Η οικονομική σου κατάσταση διαμορφώνεται πολύ ευνοϊκά — δράσε αποφασιστικά.", "Οι κάρτες ανοίγουν μια περίοδο οικονομικής αφθονίας. Ώρα να υλοποιήσεις τα σχέδιά σου.", "Τα χρήματα κινούνται προς εσένα. Μείνε ανοιχτός σε απρόσμενες ευκαιρίες.", "Ισχυρό οικονομικό δυναμικό στο άνοιγμα. Οι επενδύσεις σου θα αποδώσουν."], "c_fin_1": ["Οι οικονομικές προοπτικές είναι θετικές, αλλά θέλουν ζυγισμένη προσέγγιση.", "Η οικονομική σου κατάσταση βελτιώνεται. Συνέχισε στην κατεύθυνση που διάλεξες.", "Οι κάρτες βλέπουν ανάπτυξη. Συνετά βήματα τώρα θα βάλουν τα θεμέλια για μελλοντική ευημερία."], "c_fin_0": ["Να είσαι συνετός στα οικονομικά, αλλά μη χάνεις τις πραγματικές ευκαιρίες.", "Η οικονομική σου ισορροπία θέλει προσοχή. Μέτρα όχι μόνο τα χρήματα αλλά και τους πόρους.", "Οι κάρτες συμβουλεύουν: πριν ξοδέψεις, αναρωτήσου — είναι ανάγκη ή επιθυμία;"], "c_fin_n": ["Τώρα είναι καλύτερα να αποφύγεις μεγάλα έξοδα και ριψοκίνδυνες επενδύσεις.", "Οι κάρτες προειδοποιούν για οικονομική αστάθεια. Κράτα ό,τι έχεις.", "Καιρός για οικονομική εγκράτεια. Κάθε δεκάρα που γλιτώνεις είναι επένδυση στη μελλοντική ελευθερία."], "c_gen_3": ["Είναι μια πολύ ευνοϊκή περίοδος — η ενέργεια είναι με το μέρος σου, μπορείς να προχωρήσεις με σιγουριά.", "Οι κάρτες δίνουν ξεκάθαρη απάντηση: όλα πάνε τέλεια. Δράσε — η στιγμή είναι ευνοϊκή.", "Όλα εξελίσσονται με τον καλύτερο τρόπο. Εμπιστεύσου τη διαδικασία και κάνε ό,τι σου λέει η καρδιά.", "Ένα σπάνιο άνοιγμα πλήρους εύνοιας. Αξιοποίησε σοφά αυτή την περίοδο."], "c_gen_1": ["Η κατάσταση γενικά διαμορφώνεται θετικά — εμπιστεύσου τον εαυτό σου και πρόσεχε τα σημάδια.", "Οι κάρτες σε στηρίζουν. Προχώρα με ανοιχτή καρδιά.", "Καλή στιγμή για νέα ξεκινήματα. Η διαίσθησή σου είναι η καλύτερη πυξίδα.", "Οι συνθήκες είναι ευνοϊκές. Μένει μόνο να κάνεις το βήμα."], "c_gen_0": ["Τώρα είναι καιρός επίγνωσης — ζύγισε κάθε βήμα και άκουσε τη διαίσθησή σου.", "Οι κάρτες σε καλούν σε παύση και περισυλλογή. Μη βιάζεσαι — η διαύγεια θα έρθει.", "Μια ουδέτερη στιγμή. Η δύναμή σου είναι στην παρατήρηση και την υπομονή.", "Πριν δράσεις — κατάλαβε τι θέλεις πραγματικά."], "c_gen_n": ["Κάνε μια παύση και εμπιστεύσου την εσωτερική σου σοφία — η βιασύνη δεν προσφέρει τίποτα τώρα.", "Οι κάρτες σε συμβουλεύουν να σταματήσεις. Μερικές φορές η καλύτερη απόφαση είναι να μην πάρεις απόφαση.", "Μια δύσκολη περίοδος θέλει σοφία, όχι ταχύτητα. Δώσε στον εαυτό σου χρόνο.", "Οι κάρτες καλούν σε ηρεμία. Η καταιγίδα θα περάσει — αν δεν τη φουντώσεις."], "kw_health": ["υγεί", "αρρώστ", "ασθέν", "γιατρ", "σώμα", "θεραπ"], "kw_love": ["αγάπ", "σχέσ", "σύντροφ", "συναίσθ", "ρομαντ", "ραντεβ", "γάμο", "έρωτ"], "kw_career": ["καριέρ", "δουλει", "επάγγελμ", "θέσ", "επιχείρ", "πρότζεκτ", "εργασ"], "kw_fin": ["οικονομ", "χρήμα", "λεφτ", "επένδυσ", "εισόδ", "μισθ", "πλούτ"]}};
