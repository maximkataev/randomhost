<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121f16">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f3eb.svg" type="image/svg+xml">
<title>Сто к одному — общий экран</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400..800&family=Roboto+Condensed:wght@500..800&display=swap">
<link rel="stylesheet" href="oneword-theme.css">
<style>
  /* oneword, общий экран — школьная доска мела: тема раунда мелом сверху, ответы встают считалками-пучками
     |||| с диагональной пятой. Токены и компонент считалки — oneword-theme.css; тут раскладка экранов доски.
     Шапка — деревянная планка (цвет рамки доски) с меловыми буквами, не жёлтый баннер. */
  :root {
    --lang-switch-bg: var(--frame-ink); --lang-switch-border: rgba(242, 239, 226, .4); --lang-switch-fg: var(--chalk);
    --lang-switch-active-bg: var(--chalk); --lang-switch-active-fg: var(--ink); --lang-switch-active-border: var(--chalk);
    --lang-switch-font: var(--body);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { color: var(--text); font: 500 20px/1.3 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }
  .hidden { display: none !important; }
  b, strong { font-weight: 800; }

  .top { position: fixed; left: 0; right: 0; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 var(--lsw, 160px) 0 20px; border-bottom: 6px solid var(--frame-ink); }
  .brand { font: 700 26px/1 var(--display); letter-spacing: 0; color: var(--chalk); }
  .chip { flex: none; font: 800 20px/1 var(--body); padding: 8px 16px; letter-spacing: .1em; }
  .grow { flex: 1; }
  .hostctl { display: flex; align-items: center; gap: 10px; }
  .hostctl button, .endbtn, .sound-toggle-btn { height: 44px; border: 2px solid rgba(242, 239, 226, .7); border-radius: var(--r); background: transparent; color: var(--chalk); font: 700 16px/1 var(--body); padding: 0 14px; }
  .hostctl button:hover, .endbtn:hover { background: rgba(242, 239, 226, .12); }
  .hostctl .note { font: 700 16px/1.2 var(--body); color: var(--chalk); opacity: .85; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .endbtn { padding: 0 16px; font-weight: 800; }
  .sound-toggle-btn { flex: none; width: 44px; padding: 0; display: grid; place-items: center; font-size: 16px; }

  main { position: fixed; left: 0; right: 0; top: 64px; bottom: 0; padding: 26px 40px 30px; overflow: auto; }
  .scr { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; height: 100%; }

  .meta { display: flex; justify-content: space-between; align-items: baseline; font: 800 16px/1 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .meta b { font: 700 32px/1 var(--display); color: var(--chalk); font-variant-numeric: tabular-nums; }
  .timer { flex: none; height: 16px; background: var(--board); border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--chalk); transform-origin: left; }
  .timer.hot i { background: var(--hot); }
  .topic { padding: 22px 32px; display: flex; flex-direction: column; gap: 12px; flex: none; }
  .topictxt { font: 700 clamp(26px, min(4.8vw, 6.6vh), 54px)/1.2 var(--display); letter-spacing: 0; text-wrap: balance; }
  /* подсказка фазы — меловая рамка цвета фазы (белая / жёлтая «популярное» / голубая «редкое»), не плита */
  .prompt { --pc: var(--chalk); align-self: flex-start; border: 3px solid var(--pc); color: var(--pc); font: 700 22px/1.1 var(--display); padding: 6px 16px 8px; border-radius: var(--r); }
  .prompt.guessPopular { --pc: var(--chalk-yellow); }
  .prompt.guessRare { --pc: var(--chalk-blue); }

  /* ---------- стена-считалка (ответ/угадывание): большая цифра «N из M» и палочки по одной на каждого,
     кто уже записал. Анонимно: никаких слов, только число штрихов (секретность). Штрихи ещё не написаны
     просто не видны — рамок-заглушек нет. ---------- */
  .wordwrap { display: flex; flex-direction: column; gap: 18px; flex: 1; min-height: 0; }
  .wall { flex: 1; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; gap: 6cqw; padding: 0 2cqw; }
  .wallnum { display: flex; align-items: center; gap: 2.6cqw; flex: none; }
  .wallnum b { font: 700 min(80cqh, 21cqw)/1 var(--display); color: var(--chalk); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
  .wallof { display: flex; flex-direction: column; gap: .6em; font: 700 min(15cqh, 6cqw)/1.05 var(--display); color: var(--text); }
  .wallof em { font: 800 min(7cqh, 2.2cqw)/1.1 var(--body); font-style: normal; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  svg.wallsvg { flex: none; height: min(82cqh, 340px, calc(40cqw * 30 / var(--vbw, 30))); overflow: visible; display: block; }
  svg.wallsvg path { fill: none; stroke: var(--chalk); stroke-width: 2.3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; transition: stroke-dashoffset .3s ease-out, opacity 0s; }
  svg.wallsvg path.on { stroke-dashoffset: 0; opacity: 1; }

  /* ---------- раскрытие: пучки подгоняются под сцену (JS fitReveal подбирает --s по реальному размеру) ---------- */
  .reveal-grid { --s: 1; flex: 1; min-height: 0; margin-top: -4px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; align-items: flex-start; gap: calc(14px * var(--s)) calc(30px * var(--s)); overflow: hidden; padding: 10px 4px 4px; }
  .reveal-grid .tslot { --th: calc(58px * var(--s)); --tsw: 2.6; width: auto; min-width: max(calc(var(--th) * var(--asp, 2)), calc(90px * var(--s))); max-width: calc(330px * var(--s)); height: auto; padding: 0; gap: calc(7px * var(--s)); justify-content: flex-start; }
  .reveal-grid .tslot svg.tally { width: calc(var(--th) * var(--asp, 2)); height: var(--th); }
  .reveal-grid .tslot .tword { font-size: min(calc(21px * var(--s)), 76px); }
  .reveal-grid .tslot .tcount { font-size: min(calc(28px * var(--s)), 84px); }
  .revealtopic { font-size: clamp(20px, min(3vw, 4.2vh), 32px); }

  .lobbywrap { display: flex; flex-direction: column; gap: 18px; flex: 1; min-height: 0; }
  .lobby { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 1.25fr); gap: 30px; flex: 1; min-height: 0; }
  .lobcard { padding: 22px 30px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .lobcard .eyebrow { font: 800 14px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .bigcode { font: 700 clamp(32px, min(5vw, 7vh), 56px)/1.08 var(--display); letter-spacing: .02em; color: var(--chalk); overflow-wrap: anywhere; word-break: break-word; max-width: 100%; }
  .joinbox { display: flex; align-items: center; gap: 18px; }
  #qr { flex: none; width: clamp(110px, 24vh, 236px); height: clamp(110px, 24vh, 236px); background: #fff; border-radius: var(--r); overflow: hidden; border: 4px solid var(--frame); }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  .joininfo { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .url { font: 700 20px/1.25 var(--body); color: var(--chalk); overflow-wrap: anywhere; }
  .scan { font: 600 16px/1.25 var(--body); color: var(--muted); }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 16px; background: var(--board); border-radius: var(--r); }
  .opt b { font: 700 20px/1.1 var(--display); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 44px; height: 44px; border-radius: var(--r); border: 2px solid var(--chalk); background: transparent; color: var(--text); font: 800 22px/1 var(--body); }
  .stepper .n { min-width: 2.4ch; text-align: center; font: 700 26px/1 var(--display); }
  .start { border: 0; border-radius: var(--r); font: 700 26px/1 var(--display); letter-spacing: 0; padding: 16px; color: var(--ink); background: var(--chalk); }
  .start:not(:disabled):hover { background: #fff; }
  .hint { font: 700 18px/1.3 var(--body); color: var(--muted); min-height: 1.3em; }
  /* как играть — три меловые строки на свободном месте карточки; на низких экранах уступают место */
  .howto { list-style: none; margin: 0; padding: 0; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; gap: 6px; counter-reset: h; border-top: 2px dashed var(--line); padding-top: 10px; overflow: hidden; }
  .howto li { counter-increment: h; display: grid; grid-template-columns: 1.3em minmax(0, 1fr); align-items: baseline; gap: 10px; font: 600 clamp(16px, 2.2vh, 21px)/1.2 var(--display); color: var(--text); }
  .howto li::before { content: counter(h); font: 700 1.5em/1 var(--display); color: var(--chalk-yellow); text-align: center; }
  @media (max-height: 820px) { .howto { display: none; } }

  .players { padding: 22px 30px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .players-h { display: flex; justify-content: space-between; align-items: baseline; font: 800 14px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .players-h b { font: 700 28px/1 var(--display); color: var(--text); letter-spacing: 0; }
  /* перекличка: имена записаны мелом столбиком (до 6) или двумя столбцами, высота строки и шрифт растут при малом числе игроков */
  .plist { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; counter-reset: pl; }
  .plist.few { justify-content: center; }
  .plist li { position: relative; flex: 1 1 0; min-height: 0; max-height: 170px; container-type: size; display: flex; align-items: center; gap: 14px; border-bottom: 2px dashed var(--line); padding: 0 52px 0 4px; }
    .plist li::before { content: attr(data-n) "."; flex: none; width: 1.6em; text-align: right; font: 600 clamp(14px, 40cqh, 44px)/1 var(--display); color: var(--muted); }
  .plist li.off { opacity: .55; }
  .av { width: clamp(28px, 70cqh, 100px); height: clamp(28px, 70cqh, 100px); flex: none; border-radius: 50%; background: var(--bg); border: 3px solid var(--pc, var(--line)); display: grid; place-items: center; font-size: clamp(14px, 36cqh, 52px); font-style: normal; }
  .plist li b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 clamp(18px, 44cqh, 54px)/1.2 var(--display); }
  .rollempty { margin: auto; text-align: center; font: 600 26px/1.3 var(--display); color: var(--muted); }
  /* кнопка «убрать»: ведущему видна всегда (на тач-экране нет hover), цель 44px */
  .plist li .x { display: none; position: absolute; right: 2px; top: 50%; margin-top: -22px; width: 44px; height: 44px; border: 2px solid var(--line); border-radius: var(--r); background: transparent; color: var(--muted); font: 800 18px/1 var(--body); padding: 0; }
  body.host .plist li .x { display: block; }
  body.host .plist li:hover .x { background: var(--bad); border-color: var(--bad); color: #1a0509; }
  body.host .plist li .x[data-armed] { background: var(--chalk); border-color: var(--chalk); color: var(--ink); font-size: 13px; width: 84px; margin-right: 0; }
  body.host .plist li:has(.x[data-armed]) { padding-right: 92px; }

  /* ---------- счёт раунда / итоги: список класса ---------- */
  .sc-tab { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; gap: 0; }
  .row { flex: 1 1 0; min-height: 28px; max-height: 190px; container-type: size; display: grid; grid-template-columns: 1.5em minmax(0, auto) minmax(0, 1fr) minmax(2.6em, max-content) minmax(2.4em, max-content); align-items: center; gap: 18px; border-bottom: 2px dashed var(--line); padding: 0 18px; }
  .row .rk { text-align: center; font: 700 clamp(16px, 40cqh, 70px)/1 var(--display); color: var(--muted); }
  .row .av { width: clamp(24px, 62cqh, 130px); height: clamp(24px, 62cqh, 130px); font-size: clamp(14px, 32cqh, 60px); }
  .nmw { position: relative; justify-self: start; max-width: 100%; min-width: 0; }
  .row .nm { display: block; font: 700 clamp(17px, 44cqh, 92px)/1.2 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nmw svg.chalk-ul { position: absolute; left: -2%; width: 104%; bottom: -2px; height: .3em; }
  .row .dl { text-align: right; font: 700 clamp(16px, 36cqh, 64px)/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ok); }
  .row .dl.zero { color: var(--muted); }
  .row .tot { text-align: right; font: 800 clamp(22px, 52cqh, 110px)/1 var(--display); font-variant-numeric: tabular-nums; }
  .row.lead .rk { color: var(--chalk); }
  .fin .sc-tab { flex: 1 1 0; }
  .fin .row { flex: 1 1 0; max-height: 72px; }
  .row.fr { grid-template-columns: 1.5em minmax(0, auto) minmax(0, max-content) minmax(0, 1fr) minmax(2.6em, max-content); }
  .row.fr .tl { justify-self: start; margin-left: 14px; display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font: 700 clamp(12px, 28cqh, 20px)/1 var(--body); }
  .row.fr svg.tline { height: clamp(14px, 56cqh, 64px); width: auto; display: block; flex: none; }
  svg.tline path { fill: none; stroke: var(--chalk); stroke-width: 3; stroke-linecap: round; }

  .fin { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
  .finhead { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex: none; }
  .finhead h1 { margin: 0; font: 700 clamp(28px, 4.6vh, 44px)/1.1 var(--display); color: var(--muted); }
  .finhead .hint { margin: 0; }
  .winners { flex: none; min-height: 0; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; align-content: center; justify-content: center; gap: 4px 40px; padding: 4px 0 6px; }
  .winner { --wf: var(--wfit, 72px); display: flex; align-items: center; gap: .3em; font-size: var(--wf); max-width: 100%; min-width: 0; }
  .rank1 { position: relative; flex: none; width: 1.3em; height: 1.3em; display: grid; place-items: center; font: 700 .8em/1 var(--display); color: var(--chalk); }
  .rank1 svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wnt { display: block; font: 700 1em/1.2 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 .05em; }
  .winner .nmw { max-width: 11em; }
  .winner .nmw svg.chalk-ul { left: -1%; width: 102%; bottom: .02em; height: .26em; }
  .winner .wpts { font: 600 .42em/1 var(--display); color: var(--muted); align-self: flex-end; padding-bottom: .5em; }
  .wlabel { flex: none; text-align: center; font: 700 clamp(18px, 2.8vh, 26px)/1 var(--display); color: var(--chalk-pink); margin-top: -4px; }
  .awards { display: flex; gap: 14px; flex-wrap: wrap; flex: none; }
  .aw { flex: 1 1 340px; display: flex; align-items: center; gap: 14px; border: 2px dashed var(--line); border-radius: var(--r); padding: clamp(6px, 1vh, 12px) 18px; }
  .aw .rosette { font-size: clamp(22px, 3.2vh, 30px); flex: none; }
  .aw b { display: block; font: 800 clamp(14px, 2.1vh, 19px)/1.15 var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .aw span { font: 700 clamp(18px, 2.8vh, 26px)/1.2 var(--display); color: var(--chalk); }
  .fbtn { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; flex: none; }
  @media (max-height: 820px) { .awards { display: none; } }

  .full { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  .full h1 { font: 700 clamp(38px, 6.5vw, 64px)/1.15 var(--display); color: var(--chalk); margin: 0; }
  .full p { font: 700 24px/1.3 var(--body); color: var(--muted); margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<script src="legacy-compat.js"></script>
<script src="mp-common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="sound-toggle.js" defer></script>
</head>
<body class="chalkboard">
<div class="top plate">
  <span class="brand" id="brand" data-i18n="game_name">Сто к одному</span>
  <span class="chip hidden" id="codechip"></span>
  <span class="grow"></span>
  <span class="hostctl" id="hostctl"></span>
  <button class="endbtn hidden" id="endbtn" type="button">■</button>
  <button class="sound-toggle-btn" type="button"></button>
</div>
<main id="main"></main>

<script>
window.I18N_DICT = {

    reveal_title: `Раскрытие`, nobody: `Никто не ответил`, scores_title: `Счёт раунда`,
    finished_title: `Итоги`, aw_popular: `Лучше всех угадывает популярное`, aw_rare: `Лучше всех находит редкое`,

    pause_title: `Ждём игроков`, pause_sub: `Нужно хотя бы {n} человека онлайн`,
    final_host: `Ведущий закончил партию`, final_few: `Партия остановлена: слишком мало игроков`,

  en: {

    lobby_scan: `Point your phone camera at the QR or open the link and type your name.`,
    rounds_label: `Rounds`, start_btn: `Pick up the chalk`, start_need: `Need at least {n} people`,

    prompt_answer: `Writing a one-word answer`, prompt_popular: `Guessing: what did MOST people answer?`, prompt_rare: `Guessing: what did only ONE person answer?`,

    finished_title: `Results`, aw_popular: `Best at guessing the popular one`, aw_rare: `Best at finding the rare one`,

    pause_title: `Waiting for players`, pause_sub: `At least {n} people must be online`,
    final_host: `The host ended the game`, final_few: `The game was stopped: too few players`,
    end_btn: `End`, end_confirm: `End for real?`,
    kick_confirm: `Remove?`,

const wvSfx = (function () {
  let ctx = null;
  function ac() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume().catch(() => {}); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;

  }
  ["pointerdown", "keydown"].forEach((t) => window.addEventListener(t, () => ac(), { passive: true, capture: true }));

    g.gain.setValueAtTime(0.0001, t);

// ---------- транспорт (копия логики oneword.html, свой экземпляр) ----------
let wsBroken = false;
function openTransport({ code, onMessage, onClose, onOpen, onSendFail, onGone, onQuiet }) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  let closed = false, opened = false, sid = null, ws = null, polling = false, pollAbort = null;
  let beat = null, mpConn = null, inGame = false;
  const stopBeat = () => { if (beat) { clearInterval(beat); beat = null; } if (mpConn) { mpConn.stop(); mpConn = null; } };
  const fireClose = () => {
    if (closed) return;
    stopBeat(); closed = true;
    try { if (ws) ws.close(); } catch (e) {}
    try { if (pollAbort) pollAbort.abort(); } catch (e) {}
    sid = null;
    if (onClose) onClose();
  };
  const ping = () => api.send({ type: "ping", c: Date.now() });
  const deliver = (m) => {
    if (closed) return;
    if (m && m.type === "hello" && window.MP && MP.applyHello) MP.applyHello(m);
    if (mpConn) mpConn.seen(Date.now());
    if (m && (m.type === "state" || m.type === "hello") && m.state) inGame = !!m.state.phase && m.state.phase !== "lobby" && m.state.phase !== "finished";
    onMessage(m);
  };
  const startBeat = () => {
    stopBeat();
    ping();
    if (window.MP && typeof MP.conn === "function" && !MP.off) {
      mpConn = MP.conn({
        ping: () => { if (!closed) ping(); },
        inGame: () => inGame,
        onOffline: () => { if (onQuiet) onQuiet(true); },
        onOnline: () => { if (onQuiet) onQuiet(false); },
        onDead: () => fireClose(),
      });
      mpConn.start();
      return;
    }
    beat = setInterval(ping, 8000);
  };
  const api = {
    send(msg, attempt) {
      if (closed) { if (onSendFail && msg && msg.type !== "ping") onSendFail(msg); return; }
      if (ws && ws.readyState === 1) return ws.send(JSON.stringify(msg));
      if (!sid) { if (onSendFail && msg && msg.type !== "ping") onSendFail(msg); return; }
      const tries = attempt || 0;
      fetch("/oneword/api/msg", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sid, msg }) })
        .then((r) => { if (r.ok || r.status === 410) return; if (tries < 2) setTimeout(() => api.send(msg, tries + 1), 400 * (tries + 1)); else if (onSendFail) onSendFail(msg); })
        .catch(() => { if (tries < 2) setTimeout(() => api.send(msg, tries + 1), 400 * (tries + 1)); else if (onSendFail) onSendFail(msg); });
    },
    close() { closed = true; stopBeat(); try { if (ws) ws.close(); } catch (e) {} try { if (pollAbort) pollAbort.abort(); } catch (e) {} sid = null; },
    visible() { if (mpConn) mpConn.visible(Date.now()); },
    probe(ms) { if (closed || !opened) return; ping(); },
    get mode() { if (closed) return "none"; if (ws && ws.readyState === 1) return "ws"; if (ws && ws.readyState === 0) return "connecting"; if (sid) return "poll"; if (polling) return "connecting"; return "none"; },
  };
  const timedFetch = (url, ms) => {
    const ctl = typeof AbortController === "function" ? new AbortController() : null;
    pollAbort = ctl;
    const t = ctl ? setTimeout(() => ctl.abort(), ms) : null;
    return fetch(url, ctl ? { signal: ctl.signal } : undefined).finally(() => clearTimeout(t));
  };
  async function startPolling() {
    if (closed || polling) return;
    polling = true;
    try {
      const res = await timedFetch(`/oneword/api/session?r=${encodeURIComponent(code)}`, 15000);
      if (res.status === 404 && onGone) { closed = true; stopBeat(); polling = false; onGone(); return; }
      if (!res.ok) throw new Error("session " + res.status);
      const data = await res.json();
      if (closed) return;
      sid = data.sid; opened = true; startBeat(); if (onOpen) onOpen();
      for (const m of data.messages) deliver(m);
      while (!closed && sid) {
        const r = await timedFetch(`/oneword/api/poll?sid=${sid}`, 28000);
        if (r.status === 410) throw new Error("session gone");
        if (!r.ok) { await new Promise((z) => setTimeout(z, 1500)); continue; }
        const body = await r.json();
        for (const m of body.messages) deliver(m);
      }
    } catch (e) { if (!closed) { sid = null; polling = false; fireClose(); } }
  }
  if (wsBroken || typeof WebSocket !== "function") { startPolling(); return api; }
  try {
    ws = new WebSocket(`${proto}://${location.host}/oneword/ws?r=${encodeURIComponent(code)}`);
    const handshake = setTimeout(() => {
      if (closed || opened || !ws || ws.readyState !== 0) return;
      wsBroken = true;
      const d = ws; ws = null;
      d.onclose = d.onmessage = d.onopen = null;
      try { d.close(); } catch (e) {}
      startPolling();
    }, 5000);
    ws.onopen = () => { clearTimeout(handshake); opened = true; startBeat(); if (onOpen) onOpen(); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } deliver(m); };
    ws.onclose = () => { clearTimeout(handshake); if (closed) return; if (!opened) { ws = null; startPolling(); } else fireClose(); };
    ws.onerror = () => {};
  } catch (e) { startPolling(); }

}
function connect({ code, onMessage, onOpen, onGone, onState, onQuiet }) {
  let t = null, delay = 500, stopped = false;
  const holder = { api: null, send(m) { if (holder.api) holder.api.send(m); }, stop() { stopped = true; clearTimeout(t); if (holder.api) holder.api.close(); } };
  const open = () => {
    if (stopped) return;
    if (onState) onState("connecting");
    holder.api = openTransport({
      code, onMessage, onQuiet,
      onOpen: () => { delay = 500; if (onState) onState("open"); if (onOpen) onOpen(); },
      onClose: () => { if (stopped) return; if (onState) onState("lost"); t = setTimeout(open, delay); delay = Math.min(delay * 2, 8000); },
      onGone: () => { stopped = true; if (onGone) onGone(); },
    });
  };
  open();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && holder.api) { holder.api.visible(); holder.api.probe(); } });
  window.addEventListener("online", () => { if (holder.api) holder.api.probe(); });
  return holder;
}

// ---------- считалка-пучок: четыре палочки + диагональная пятая, следующий пучок рядом ----------
// Геометрия одна для раскрытия (крупные пучки), стены «N из M» (по штриху на игрока) и строк итогов.
// Штрихи чуть «дрожат» (детерминированный разброс по номеру штриха) — рука, а не линейка.
const TALLY_PITCH = 27;
function jit(i, k) { const r = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return (r - Math.floor(r) - 0.5) * 1.1; }
function tallyGeom(count) {
  const total = Math.max(0, count | 0), nb = Math.ceil(total / 5);
  let left = total, stroke = 0;
  const paths = [];
  for (let bi = 0; left > 0; bi++) {
    const n = Math.min(5, left);
    left -= n;
    const ox = 4 + bi * TALLY_PITCH;
    for (let v = 0; v < Math.min(n, 4); v++) {
      const x = ox + v * 5;
      paths.push(`M${(x + jit(stroke, 1)).toFixed(1)} 4 L${(x + jit(stroke, 2)).toFixed(1)} 26`);
      stroke++;
    }
    if (n === 5) { paths.push(`M${ox - 2.5} 24.5 L${ox + 17.5} 5.5`); stroke++; }
  }
  const lastN = total - (nb - 1) * 5, lox = 4 + (nb - 1) * TALLY_PITCH;
  const right = total ? (lastN === 5 ? lox + 19.5 : lox + (lastN - 1) * 5 + 3) : 8;
  return { paths, vbw: Math.ceil(right) };
}
// цвет пучка по смыслу: самый популярный — жёлтый мелок («популярное»), одиночные — голубой («редкое»), остальные чередуют белый и розовый
function clusterColor(c, i) { return i === 0 && c.count > 1 ? "var(--chalk-yellow)" : c.count === 1 ? "var(--chalk-blue)" : i % 2 ? "var(--chalk-pink)" : "var(--chalk)"; }
function tallySlotHtml(word, count, color, extra) {
  const g = tallyGeom(count || 0);
  const paths = g.paths.map((d, i) => `<path pathLength="1" style="--sd:${i * 70}ms" d="${d}"></path>`).join("");
  return `<div class="tslot" style="--chalk-c:${color};--asp:${g.vbw / 30}"${extra || ""}>
    <svg class="tally" viewBox="0 0 ${g.vbw} 30" aria-hidden="true">${paths}</svg>
    <b class="tword">${escapeHtml(word || "")}</b><em class="tcount">${count || ""}</em></div>`;
}
// маленькая статичная считалка в строке итогов; больше 40 очков — один штрих = unit очков (подпись ×unit)
function tallyLineHtml(total) {
  if (!(total > 0)) return `<span class="tl"></span>`;
  let unit = 1;
  while (Math.ceil(total / unit) > 40) unit++;
  const g = tallyGeom(Math.ceil(total / unit));
  return `<span class="tl"><svg class="tline" viewBox="0 0 ${g.vbw} 30" aria-hidden="true">${g.paths.map((d) => `<path d="${d}"></path>`).join("")}</svg>${unit > 1 ? `<small>×${unit}</small>` : ""}</span>`;
}
// «написано мелом»: подчёркивание (двойной штрих) и кружок вокруг цифры места; штрих-дэш рисует CSS при классе .drawn

  const g = tallyGeom(voters);
  return `<div class="wall" id="wall" data-m="${voters}"><div class="wallnum"><b id="wn">0</b><div class="wallof"><span>${escapeHtml(tpl("of_total", { m: voters }))}</span><em>${escapeHtml(T("answered_lbl"))}</em></div></div>
    <svg class="wallsvg" id="wallsvg" viewBox="0 0 ${g.vbw} 30" style="--vbw:${g.vbw};aspect-ratio:${g.vbw}/30" aria-hidden="true">${g.paths.map((d) => `<path pathLength="1" d="${d}"></path>`).join("")}</svg></div>`;
}
let wallSeen = -1;
function patchWall(confirmed, voters) {
  let wall = document.getElementById("wall");
  if (wall && +wall.dataset.m !== voters) { wall.outerHTML = wallHtml(voters); wall = document.getElementById("wall"); }
  document.getElementById("wn").textContent = confirmed;
  document.querySelectorAll("#wallsvg path").forEach((p, i) => p.classList.toggle("on", i < confirmed));
  if (wallSeen >= 0 && confirmed > wallSeen) wvSfx.tick();
  wallSeen = confirmed;
}
function renderWordPhase() {
  const r = state.round;
  const confirmed = (r.confirmed[state.phase] || []).length;
  const voters = (r.voters || []).length;
  const html = `<div class="scr wordwrap">
    <div class="topic cabinet">
      <div class="meta"><span>${escapeHtml(tpl("topic_of", { n: r.num, m: state.total }))}</span><b id="tsec"></b></div>
      ${timerHtml()}
      <div class="topictxt">${escapeHtml(r.topic.topic)}</div>
      <div class="prompt ${state.phase}">${escapeHtml(T(PROMPT_KEY[state.phase]))}</div>
    </div>
    ${wallHtml(Math.max(voters, 1))}</div>`;
  // новая тема раунда — короткий аккорд (только на первой фазе, не на каждом угадывании)
  if (show(html, state.phase + ":" + r.num)) { wallSeen = -1; if (state.phase === "answer") wvSfx.chord(); }
  patchWall(confirmed, Math.max(voters, 1));
  patchTimer();
}

// считалки раскрытия: слоты стоят в порядке кластеров (устойчиво по макету), но мел дорисовывается
// в порядке round.order (сервер, §7 спеки: случайный порядок раскрытия от seed раунда) — так макет не прыгает,
// а зрелище всё равно идёт вразнобой. Размер пучков подбирает fitReveal() под реальную высоту сцены.
function fitReveal() {
  const g = document.getElementById("revealGrid");
  if (!g) return;
  // центрирование (align-content:center) прячет переполнение вверх/влево от scrollHeight, поэтому меряем сами слоты
  const over = () => {
    const gr = g.getBoundingClientRect(), cs = getComputedStyle(g);
    const top = gr.top + parseFloat(cs.paddingTop), bottom = gr.bottom - parseFloat(cs.paddingBottom);
    const left = gr.left + parseFloat(cs.paddingLeft), right = gr.right - parseFloat(cs.paddingRight);
    if (g.scrollHeight > g.clientHeight + 1 || g.scrollWidth > g.clientWidth + 1) return true; // хвосты букв и штрихов тоже не должны резаться
    for (const k of g.children) {
      const r = k.getBoundingClientRect();
      if (r.top < top - 1 || r.bottom > bottom + 1 || r.left < left - 1 || r.right > right + 1) return true;
    }
    return false;
  };
  const oneRow = () => { const t0 = g.children[0].getBoundingClientRect().top; return Array.from(g.children).every((k) => Math.abs(k.getBoundingClientRect().top - t0) < 4); };
  const best = (row) => {
    const bad = () => over() || (row && !oneRow());
    let lo = 0.3, hi = 4.6;
    g.style.setProperty("--s", hi);
    if (!bad()) return hi;
    for (let i = 0; i < 14; i++) {
      const mid = (lo + hi) / 2;
      g.style.setProperty("--s", mid);
      if (bad()) hi = mid; else lo = mid;
    }
    return lo;
  };
  // до трёх кластеров — одним рядом (композиция «три крупных пучка»), если так пучки всё ещё крупные; иначе переносим
  const s = best(false);
  if (g.children.length <= 3) {
    const sRow = best(true);
    if (sRow >= 1.8 || sRow >= s * 0.55) { g.style.setProperty("--s", (sRow * 0.99).toFixed(3)); return; }
  }
  g.style.setProperty("--s", (s * 0.99).toFixed(3));
}
window.addEventListener("resize", fitReveal);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitReveal);
function renderReveal() {
  const r = state.round;
  const clusters = r.clusters;
  const order = (r.order && r.order.length ? r.order : clusters.map((c) => c.key))
    .map((key) => clusters.findIndex((c) => c.key === key)).filter((i) => i >= 0);
  const slots = clusters.map((c, i) => {
    const names = c.players.map((id) => (player(id) || {}).name || "?").join(", ");
    return tallySlotHtml(c.sample, c.count, clusterColor(c, i), ` data-idx="${i}" title="${escapeHtml(names)}"`);
  }).join("");
  const html = `<div class="scr wordwrap">
    <div class="topic cabinet">
      <div class="meta"><span>${escapeHtml(T("reveal_title"))} · ${escapeHtml(tpl("topic_of", { n: r.num, m: state.total }))}</span></div>
      <div class="topictxt revealtopic">${escapeHtml(r.topic.topic)}</div>
    </div>
    ${clusters.length ? `<div class="reveal-grid" id="revealGrid">${slots}</div>` : `<div class="full"><h1>${escapeHtml(T("nobody"))}</h1></div>`}</div>`;
  if (show(html, "reveal:" + r.num, true)) {
    wvSfx.pop();
    fitReveal();
    const grid = document.getElementById("revealGrid");
    const calm = reducedMotion();
    order.forEach((idx, step) => {
      const go = () => {
        const el = grid && grid.querySelector(`.tslot[data-idx="${idx}"]`);
        if (el) { el.classList.add("revealed"); wvSfx.tick(); }
      };
      if (calm) go(); else setTimeout(go, 500 + step * 480);
    });
  }
}

function rankedPlayers() {
  return window.MP && MP.rank ? MP.rank(state.players, { score: "score" }).list : state.players.slice().sort((a, b) => b.score - a.score);
}
function renderScores() {
  const r = state.round;
  const ranked = rankedPlayers();
  const topScore = Math.max(0, ...ranked.map((e) => (e.player || e).score));
  const rows = ranked.map((e, i) => {
    const p = e.player || e;
    const lead = p.score > 0 && p.score === topScore;
    const delta = (r.popularPts[p.id] || 0) + (r.rarePts[p.id] || 0);
    return `<div class="row${lead ? " lead" : ""}"><span class="rk">${e.place || ""}</span>${avHtml(p)}<span class="nmw"><span class="nm">${escapeHtml(p.name)}</span>${lead ? UL_SVG : ""}</span><span class="dl ${delta ? "" : "zero"}">+${delta}</span><span class="tot">${p.score}</span></div>`;
  }).join("");
  const html = `<div class="scr wordwrap">
    <div class="topic cabinet">
      <div class="meta"><span>${escapeHtml(T("scores_title"))} · ${escapeHtml(tpl("topic_of", { n: r.num, m: state.total }))}</span></div>
    </div>
    <div class="sc-tab">${rows}</div></div>`;
  if (show(html, "scores:" + r.num, true)) drawChalk();
}

function renderPause() {
  show(`<div class="full"><h1>${escapeHtml(T("pause_title"))}</h1><p>${escapeHtml(tpl("pause_sub", { n: state.minPlayers }))}</p></div>`, "pause", true);
}

// итоги: победитель (или все, кто делит первое место) написан мелом крупно, подчёркнут, цифра 1 обведена кружком;
// остальные — список класса с считалкой очков
// блок победителей: высоту отдаём по остатку сцены (список остальных получает не меньше 30px на строку), а шрифт
// подбираем самым крупным, при котором все победители (в т.ч. при ничьей, с переносом) влезают в этот блок
function fitFinished() {
  const fin = document.querySelector(".fin"), win = fin && fin.querySelector(".winners");
  if (!win) return;
  const others = fin.querySelectorAll(".sc-tab .row").length;
  const gap = 12;
  const kids = Array.from(fin.children).filter((e) => e !== win && !e.classList.contains("sc-tab") && getComputedStyle(e).display !== "none");
  const used = kids.reduce((a, e) => a + e.offsetHeight + gap, 0) + gap;
  const room = fin.clientHeight - used;
  const listH = others ? Math.min(others * 64, Math.max(others * 30, room - 150)) + gap : 0;
  win.style.height = Math.max(90, room - listH) + "px";
  let lo = 18, hi = 104;
  const bad = () => win.scrollHeight > win.clientHeight + 1 || win.scrollWidth > win.clientWidth + 1;
  win.style.setProperty("--wfit", hi + "px");
  if (bad()) {
    for (let i = 0; i < 12; i++) {
      const mid = (lo + hi) / 2;
      win.style.setProperty("--wfit", mid + "px");
      if (bad()) hi = mid; else lo = mid;
    }
    win.style.setProperty("--wfit", Math.floor(lo) + "px");
  }
}
window.addEventListener("resize", fitFinished);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitFinished);
function renderFinished() {
  const ranked = rankedPlayers();
  const topScore = Math.max(0, ...ranked.map((e) => (e.player || e).score));
  const isWin = (e) => (e.player || e).score > 0 && (e.player || e).score === topScore;
  const winners = ranked.filter(isWin);
  const others = ranked.filter((e) => !isWin(e));
  const winHtml = winners.map((e) => {
    const p = e.player || e;
    return `<div class="winner"><span class="rank1"><b>${e.place || 1}</b>${RING_SVG}</span><span class="nmw"><span class="wnt">${escapeHtml(p.name)}</span>${UL_SVG}</span><span class="wpts">${p.score}</span></div>`;
  }).join("");
  const rows = others.map((e) => {
    const p = e.player || e;
    return `<div class="row fr"><span class="rk">${e.place || ""}</span>${avHtml(p)}<span class="nmw"><span class="nm">${escapeHtml(p.name)}</span></span>${tallyLineHtml(p.score)}<span class="tot">${p.score}</span></div>`;
  }).join("");
  const nameOf = (id) => (player(id) || {}).name || "?";
  const awards = state.awards || {};
  const awardsHtml = [
    awards.popular ? `<div class="aw"><span class="rosette">🏆</span><div><b>${escapeHtml(T("aw_popular"))}</b><span>${escapeHtml(awards.popular.ids.map(nameOf).join(", "))}</span></div></div>` : "",
    awards.rare ? `<div class="aw"><span class="rosette">🔎</span><div><b>${escapeHtml(T("aw_rare"))}</b><span>${escapeHtml(awards.rare.ids.map(nameOf).join(", "))}</span></div></div>` : "",
  ].join("");
  const reasonTxt = state.finishedReason === "host" ? T("final_host") : state.finishedReason === "few" || state.finishedReason === "paused" ? T("final_few") : "";
  const html = `<div class="scr fin${others.length ? "" : " solo"}">
    <div class="finhead"><h1>${escapeHtml(T("finished_title"))}</h1>${reasonTxt ? `<p class="hint">${escapeHtml(reasonTxt)}</p>` : ""}</div>
    ${winners.length ? `<div class="winners">${winHtml}</div>${winners.length > 1 ? `<div class="wlabel">${escapeHtml(T("tie_label"))}</div>` : ""}` : ""}
    <div class="awards">${awardsHtml}</div>
    <div class="sc-tab">${rows}</div>
    <div class="fbtn">${isHost ? `<button class="start" id="lobbybtn" type="button">${escapeHtml(T("lobby_btn"))}</button>` : ""}</div></div>`;
  if (show(html, "finished:" + state.game, true)) {
    fitFinished();
    drawChalk();
    if (state.finishedReason !== "few" && state.finishedReason !== "paused") wvSfx.fanfare();
  }
  if (isHost) document.getElementById("lobbybtn").onclick = () => conn.send({ type: "lobby" });
}

function show(html, key, skipAnim) {
  if (key === viewKey) return false;
  viewKey = key;
  main.innerHTML = html;
  return true;
}

function render(force) {
  if (force) viewKey = "";
  document.body.classList.toggle("host", isHost);
  document.getElementById("codechip").classList.toggle("hidden", !CODE);
  document.getElementById("codechip").textContent = CODE;
  renderHostCtl();
  if (dead || !state) { show(`<div class="full"><h1>…</h1></div>`, "wait", true); return; }
  switch (state.phase) {
    case "lobby": return renderLobby();
    case "answer": case "guessPopular": case "guessRare": return renderWordPhase();
    case "reveal": return renderReveal();
    case "scores": return renderScores();
    case "pause": return renderPause();
    case "finished": return renderFinished();
    default: return renderLobby();
  }
}

function handleMessage(m) {
  if (!m || typeof m !== "object") return;
  switch (m.type) {
    case "hello":
      state = m.state;
      if (!isHost) { let t = null; try { t = localStorage.getItem(hostKey()); } catch (e) {} if (t) conn.send({ type: "host", token: t }); }
      render();
      return;
    case "state":
      state = m.state;
      render();
      return;
    case "host_ok":
      isHost = true;
      render(true);
      return;
    case "host_lost":
      isHost = false;
      render(true);
      return;
    case "error":
      if (m.error === "bad host token") { try { localStorage.removeItem(hostKey()); } catch (e) {} }
      if (m.error === "room_expired") { dead = true; render(); }
      return;
    case "room_expired":
      dead = true;
      render();
      return;
    default:
      return;
  }
}

conn = connect({
  code: CODE,
  onMessage: handleMessage,
  onGone: () => { dead = true; render(); },
});
render();
</script>
