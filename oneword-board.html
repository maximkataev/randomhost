<meta charset="utf-8">

<link rel="stylesheet" href="oneword-theme.css">
<style>
  /* oneword, общий экран — школьная доска мела: тема раунда мелом сверху, ответы встают считалками-пучками
     |||| с диагональной пятой. Токены и компонент считалки — oneword-theme.css; тут раскладка экранов доски. */
  :root {
    --lang-switch-bg: var(--board2); --lang-switch-border: var(--line); --lang-switch-fg: var(--text);
    --lang-switch-active-bg: var(--chalk); --lang-switch-active-fg: var(--ink); --lang-switch-active-border: var(--chalk);
    --lang-switch-font: var(--body);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { color: var(--text); font: 500 20px/1.3 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }
  .hidden { display: none !important; }
  b, strong { font-weight: 800; }

  /* верхняя плата — меловая плита во всю ширину: корпус доски начинается отсюда, а не только у панелей сцены */
  .top { position: fixed; left: 0; right: 0; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 var(--lsw, 160px) 0 20px; border-bottom: 6px solid var(--bg); }
  .brand { font: 700 26px/1 var(--display); letter-spacing: 0; }
  .chip { flex: none; font: 800 20px/1 var(--body); padding: 8px 16px; background: var(--bg); color: var(--chalk-yellow); border: 2px solid var(--ink); border-radius: var(--r); letter-spacing: .1em; }
  .grow { flex: 1; }
  .hostctl { display: flex; align-items: center; gap: 10px; }
  .hostctl button { height: 44px; border: 2px solid var(--ink); border-radius: var(--r); background: transparent; color: var(--ink); font: 700 16px/1 var(--body); padding: 0 14px; }
  .hostctl button:hover { background: rgba(0, 0, 0, .08); }
  .hostctl .note { font: 700 16px/1.2 var(--body); color: var(--ink); opacity: .7; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .endbtn { height: 44px; border: 2px solid var(--ink); border-radius: var(--r); background: transparent; color: var(--ink); padding: 0 16px; font: 800 16px/1 var(--body); }
  .sound-toggle-btn { flex: none; height: 44px; width: 44px; border: 2px solid var(--ink); border-radius: var(--r); background: transparent; color: var(--ink); padding: 0; display: grid; place-items: center; font-size: 16px; }

  main { position: fixed; left: 0; right: 0; top: 64px; bottom: 0; padding: 26px 40px 30px; overflow: auto; }
  .scr { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; height: 100%; }

  .meta { display: flex; justify-content: space-between; align-items: baseline; font: 800 16px/1 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .meta b { font: 900 32px/1 var(--body); color: var(--chalk); font-variant-numeric: tabular-nums; }
  .timer { flex: none; height: 16px; background: var(--board2); border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--chalk); transform-origin: left; }
  .timer.hot i { background: var(--hot); }
  .topic { padding: 26px 32px; display: flex; flex-direction: column; gap: 14px; flex: none; }
  .topictxt { font: 700 clamp(30px, 5.2vw, 58px)/1.18 var(--display); letter-spacing: 0; text-wrap: balance; }
  /* подсказка — не просто цветной текст (жалоба владельца: "цвета простые"), а сплошная меловая плита */
  .prompt { align-self: flex-start; background: var(--a); color: var(--a-ink); font: 800 18px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; padding: 7px 14px; border-radius: var(--r); }
  .progress { font: 700 22px/1.2 var(--body); color: var(--muted); }
  .progress b { color: var(--text); font-weight: 900; }
  .segdots { margin-top: 4px; }
  .segdots i { width: 7px; height: 20px; }

  .lobbywrap { display: flex; flex-direction: column; gap: 18px; flex: 1; min-height: 0; }
  .boardrest { justify-content: center; padding: 10px 0 0; }
  .boardrest .tslot { --sw: 72px; --sh: 86px; --stw: 58px; --sth: 22px; --sword: 12px; --scount: 13px; }
  /* тот же ряд слотов-считалок, что в раскрытии, но пустых (пунктирная рамка) — стоит на месте будущих
     кластеров уже во время ответа/угадывания, а не только в момент реального раскрытия. Снимает скачок
     (DESIGNER-SKILL §4: итоговый размер слота резервируется с первой отрисовки) и держит "доску" на виду. */
  .wordwrap { display: flex; flex-direction: column; gap: 18px; flex: 1; min-height: 0; }
  .lobby { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 1.3fr); gap: 30px; flex: 1; min-height: 0; }
  .lobcard { padding: 26px 30px; display: flex; flex-direction: column; gap: 14px; }
  .lobcard .eyebrow { font: 800 14px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .bigcode { font: 900 clamp(32px, 5.2vw, 56px)/1.08 var(--body); letter-spacing: .02em; color: var(--chalk); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; word-break: break-word; max-width: 100%; }
  .joinbox { display: flex; align-items: center; gap: 16px; }
  #qr { flex: none; width: clamp(96px, 16vh, 150px); height: clamp(96px, 16vh, 150px); background: #fff; border-radius: var(--r); overflow: hidden; border: 4px solid var(--frame); }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  .joininfo { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .url { font: 600 18px/1.3 var(--body); color: var(--muted); overflow-wrap: anywhere; }
  .scan { font: 600 15px/1.25 var(--body); color: var(--muted); }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 16px; background: var(--board2); border-radius: var(--r); }
  .opt b { font: 800 18px/1.1 var(--body); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 40px; height: 40px; border-radius: var(--r); border: 2px solid var(--chalk); background: transparent; color: var(--text); font: 900 20px/1 var(--body); }
  .stepper .n { min-width: 2.4ch; text-align: center; font: 900 22px/1 var(--body); }
  .start { border: 0; border-radius: var(--r); font: 700 26px/1 var(--display); letter-spacing: .01em; padding: 18px; color: var(--ink); background: var(--chalk); }
  .start:not(:disabled):hover { background: var(--a); }
  .hint { font: 700 18px/1.3 var(--body); color: var(--muted); min-height: 1.3em; }

  .players { padding: 26px 30px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .players-h { display: flex; justify-content: space-between; align-items: baseline; font: 800 14px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .players-h b { font: 900 24px/1 var(--body); color: var(--text); }
  .plist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; overflow: auto; }
  .plist li { position: relative; display: flex; align-items: center; gap: 10px; background: var(--board2); border-left: 6px solid var(--pc, var(--chalk)); border-radius: var(--r); padding: 10px 14px; }
  .plist li.off { opacity: .55; }
  .av { width: 38px; height: 38px; flex: none; border-radius: 50%; background: var(--bg); border: 3px solid var(--pc, var(--line)); display: grid; place-items: center; font-size: 20px; font-style: normal; }
  .plist li b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 800 18px/1.1 var(--body); }
  .plist li .x { position: absolute; right: 8px; top: 50%; margin-top: -18px; width: 36px; height: 36px; border: 0; border-radius: var(--r); background: var(--bad); color: #1a0509; font: 900 16px/1 var(--body); display: none; }
  body.host .plist li .x { display: block; opacity: 0; transition: opacity .15s; }
  body.host .plist li:hover .x, body.host .plist li .x[data-armed] { opacity: 1; }
  body.host .plist li .x[data-armed] { background: var(--chalk); color: var(--ink); font-size: 13px; }

  /* размер слота — от числа слотов (--k считает slotScale() в JS, одна и та же функция для пустых рамок во время
     ответа и для раскрытия): мало кластеров — крупные пучки и слова; --u урезает всё на низких/узких экранах */
  .reveal-grid { --k: 1; --u: min(1px, .1111vh, .0625vw); flex: 1; min-height: 0; align-content: flex-start; justify-content: center; overflow: auto; gap: calc(18 * var(--u) * var(--k)); padding: 6px 2px; }
  .reveal-grid .tslot { --sw: calc(150 * var(--u) * var(--k)); --sh: calc(220 * var(--u) * var(--k)); --stw: calc(130 * var(--u) * var(--k)); --sth: calc(80 * var(--u) * var(--k)); --sword: calc(20 * var(--u) * var(--k)); --scount: calc(24 * var(--u) * var(--k)); }
  /* штрихи тоньше шага между ними: в крупном масштабе пучок читается как |||| с диагональю, а не как сплошной блок */
  .reveal-grid .tslot svg.tally path { stroke-width: 3; }
  .revealnames { font: 600 14px/1.25 var(--body); color: var(--muted); margin-top: 6px; max-width: 320px; }

  /* мало игроков — строки не прилипают кучкой к верху над текстурой доски, а стоят по центру
     отведённого места: то же правило §4 "никаких пустот", применённое к короткому списку, а не только к фазам */
  /* строки растут на всю высоту сцены (flex 1 1 0, потолок --rowmax) и прижаты к плите сверху; шрифты и аватар
     считаются от высоты самой строки (container query units), поэтому 2-3 игрока читаются крупно, 12 — компактно */
  .sc-tab { --rowmax: 240px; flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; justify-content: flex-start; gap: 6px; }
  .row { flex: 1 1 0; min-height: 32px; max-height: var(--rowmax); container-type: size; display: grid; grid-template-columns: 1.2em minmax(0, auto) minmax(0, 1fr) 2.6em 2.4em; align-items: center; gap: 18px; background: var(--board2); border: 2px solid var(--line); border-left: 8px solid var(--chalk); border-radius: var(--r); padding: 0 24px; }
  .row .rk { text-align: center; font: 900 clamp(16px, 34cqh, 60px)/1 var(--body); color: var(--muted); }
  .row .av { width: clamp(30px, 66cqh, 150px); height: clamp(30px, 66cqh, 150px); font-size: clamp(16px, 34cqh, 64px); }
  .row .nm { font: 800 clamp(18px, 42cqh, 100px)/1.1 var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .dl { text-align: right; font: 800 clamp(16px, 34cqh, 60px)/1 var(--body); font-variant-numeric: tabular-nums; color: var(--ok); }
  .row .dl.zero { color: var(--muted); }
  .row .tot { text-align: right; font: 900 clamp(22px, 50cqh, 120px)/1 var(--body); font-variant-numeric: tabular-nums; }
  .row.lead { border-left-color: var(--chalk-yellow); box-shadow: inset 0 0 0 2px var(--chalk-yellow); }

  .fin { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
  .fin .sc-tab { --rowmax: 160px; }
  .fin .topic { flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: 6px 24px; padding: 10px 32px; }
  .fin .topic .hint { margin: 0; }
  .fin h1 { margin: 0; font: 700 clamp(36px, 6vh, 56px)/1.1 var(--display); color: var(--chalk); }
  .awards { display: flex; gap: 14px; flex-wrap: wrap; flex: none; }
  .aw { flex: 1 1 340px; display: flex; align-items: center; gap: 20px; background: var(--board2); border-left: 8px solid var(--a); border-radius: var(--r); padding: clamp(8px, 1.4vh, 16px) 24px; }
  .aw .rosette { width: clamp(44px, 6.4vh, 64px); height: clamp(44px, 6.4vh, 64px); border-radius: var(--r); background: var(--a); color: var(--a-ink); display: grid; place-items: center; font-size: clamp(22px, 3.4vh, 32px); flex: none; }
  .aw b { display: block; font: 800 clamp(18px, 2.7vh, 26px)/1.15 var(--body); }
  .aw span { font: 700 clamp(16px, 2.4vh, 24px)/1.2 var(--display); color: var(--chalk); }
  .fbtn { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

  .full { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  .full h1 { font: 700 clamp(38px, 6.5vw, 64px)/1.15 var(--display); color: var(--chalk); margin: 0; }
  .full p { font: 700 24px/1.3 var(--body); color: var(--muted); margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
"use strict";
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function T(key) { if (window.I18N && I18N.t) return I18N.t(key); const d = (window.I18N_DICT || {}).ru || {}; return key in d ? d[key] : key; }
function tpl(key, vars) { return String(T(key)).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? String(vars[k]) : m)); }

// ---------- звуки: тот же беcфайловый синтез, что в oneword.html/crowd-shared.js (sound-toggle.js глушит общий выход) ----------
const wvSfx = (function () {
  let ctx = null;
  function ac() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume().catch(() => {}); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { return null; }
    return ctx;
  }
  ["pointerdown", "keydown"].forEach((t) => window.addEventListener(t, () => ac(), { passive: true, capture: true }));
  function env(g, t, a, d, v) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(f0, f1, at, dur, type, vol) {
    const c = ac(); if (!c || c.state !== "running") return;
    const t = c.currentTime + at;
    const o = c.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); o.connect(g); g.connect(c.destination); env(g, t, 0.004, dur, vol);
    o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    chord() { [392, 494, 587].forEach((f, i) => tone(f, f, i * 0.04, 0.4, "triangle", 0.1)); },
    pop() { tone(300, 900, 0, 0.14, "triangle", 0.2); tone(900, 450, 0.12, 0.24, "triangle", 0.14); },
    fanfare() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, f, i * 0.1, 0.18, "triangle", 0.16)); },
    // короткий стук мелка по доске — один пучок дорисован
    tick() { tone(2200, 1500, 0, 0.025, "square", 0.045); },
  };

// ---------- транспорт (копия логики oneword.html, свой экземпляр) ----------
let wsBroken = false;
function openTransport({ code, onMessage, onClose, onOpen, onSendFail, onGone, onQuiet }) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  let closed = false, opened = false, sid = null, ws = null, polling = false, pollAbort = null;
  let beat = null, mpConn = null, inGame = false;
  const stopBeat = () => { if (beat) { clearInterval(beat); beat = null; } if (mpConn) { mpConn.stop(); mpConn = null; } };
  const fireClose = () => {
    if (closed) return;
    stopBeat(); closed = true;
    try { if (ws) ws.close(); } catch (e) {}
    try { if (pollAbort) pollAbort.abort(); } catch (e) {}
    sid = null;
    if (onClose) onClose();
  };
  const ping = () => api.send({ type: "ping", c: Date.now() });
  const deliver = (m) => {
    if (closed) return;
    if (m && m.type === "hello" && window.MP && MP.applyHello) MP.applyHello(m);
    if (mpConn) mpConn.seen(Date.now());
    if (m && (m.type === "state" || m.type === "hello") && m.state) inGame = !!m.state.phase && m.state.phase !== "lobby" && m.state.phase !== "finished";
    onMessage(m);
  };
  const startBeat = () => {
    stopBeat();
    ping();
    if (window.MP && typeof MP.conn === "function" && !MP.off) {
      mpConn = MP.conn({
        ping: () => { if (!closed) ping(); },
        inGame: () => inGame,
        onOffline: () => { if (onQuiet) onQuiet(true); },
        onOnline: () => { if (onQuiet) onQuiet(false); },
        onDead: () => fireClose(),
      });
      mpConn.start();
      return;
    }
    beat = setInterval(ping, 8000);
  };
  const api = {
    send(msg, attempt) {
      if (closed) { if (onSendFail && msg && msg.type !== "ping") onSendFail(msg); return; }
      if (ws && ws.readyState === 1) return ws.send(JSON.stringify(msg));
      if (!sid) { if (onSendFail && msg && msg.type !== "ping") onSendFail(msg); return; }
      const tries = attempt || 0;
      fetch("/oneword/api/msg", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sid, msg }) })
        .then((r) => { if (r.ok || r.status === 410) return; if (tries < 2) setTimeout(() => api.send(msg, tries + 1), 400 * (tries + 1)); else if (onSendFail) onSendFail(msg); })
        .catch(() => { if (tries < 2) setTimeout(() => api.send(msg, tries + 1), 400 * (tries + 1)); else if (onSendFail) onSendFail(msg); });
    },
    close() { closed = true; stopBeat(); try { if (ws) ws.close(); } catch (e) {} try { if (pollAbort) pollAbort.abort(); } catch (e) {} sid = null; },
    visible() { if (mpConn) mpConn.visible(Date.now()); },
    probe(ms) { if (closed || !opened) return; ping(); },
    get mode() { if (closed) return "none"; if (ws && ws.readyState === 1) return "ws"; if (ws && ws.readyState === 0) return "connecting"; if (sid) return "poll"; if (polling) return "connecting"; return "none"; },
  };
  const timedFetch = (url, ms) => {
    const ctl = typeof AbortController === "function" ? new AbortController() : null;
    pollAbort = ctl;
    const t = ctl ? setTimeout(() => ctl.abort(), ms) : null;
    return fetch(url, ctl ? { signal: ctl.signal } : undefined).finally(() => clearTimeout(t));
  };
  async function startPolling() {
    if (closed || polling) return;
    polling = true;
    try {
      const res = await timedFetch(`/oneword/api/session?r=${encodeURIComponent(code)}`, 15000);
      if (res.status === 404 && onGone) { closed = true; stopBeat(); polling = false; onGone(); return; }
      if (!res.ok) throw new Error("session " + res.status);
      const data = await res.json();
      if (closed) return;
      sid = data.sid; opened = true; startBeat(); if (onOpen) onOpen();
      for (const m of data.messages) deliver(m);
      while (!closed && sid) {
        const r = await timedFetch(`/oneword/api/poll?sid=${sid}`, 28000);
        if (r.status === 410) throw new Error("session gone");
        if (!r.ok) { await new Promise((z) => setTimeout(z, 1500)); continue; }
        const body = await r.json();
        for (const m of body.messages) deliver(m);
      }
    } catch (e) { if (!closed) { sid = null; polling = false; fireClose(); } }
  }
  if (wsBroken || typeof WebSocket !== "function") { startPolling(); return api; }
  try {
    ws = new WebSocket(`${proto}://${location.host}/oneword/ws?r=${encodeURIComponent(code)}`);
    const handshake = setTimeout(() => {
      if (closed || opened || !ws || ws.readyState !== 0) return;
      wsBroken = true;
      const d = ws; ws = null;
      d.onclose = d.onmessage = d.onopen = null;
      try { d.close(); } catch (e) {}
      startPolling();
    }, 5000);
    ws.onopen = () => { clearTimeout(handshake); opened = true; startBeat(); if (onOpen) onOpen(); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } deliver(m); };
    ws.onclose = () => { clearTimeout(handshake); if (closed) return; if (!opened) { ws = null; startPolling(); } else fireClose(); };
    ws.onerror = () => {};
  } catch (e) { startPolling(); }
  return api;
}
function connect({ code, onMessage, onOpen, onGone, onState, onQuiet }) {
  let t = null, delay = 500, stopped = false;
  const holder = { api: null, send(m) { if (holder.api) holder.api.send(m); }, stop() { stopped = true; clearTimeout(t); if (holder.api) holder.api.close(); } };
  const open = () => {
    if (stopped) return;
    if (onState) onState("connecting");
    holder.api = openTransport({
      code, onMessage, onQuiet,
      onOpen: () => { delay = 500; if (onState) onState("open"); if (onOpen) onOpen(); },
      onClose: () => { if (stopped) return; if (onState) onState("lost"); t = setTimeout(open, delay); delay = Math.min(delay * 2, 8000); },
      onGone: () => { stopped = true; if (onGone) onGone(); },
    });
  };
  open();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && holder.api) { holder.api.visible(); holder.api.probe(); } });
  window.addEventListener("online", () => { if (holder.api) holder.api.probe(); });
  return holder;
}

// ---------- считалка-пучок: четыре палочки + диагональная пятая, следующий пучок рядом ----------
// viewBox фиксирован на максимум вместимости комнаты (12 игроков = 3 пучка), чтобы графика считалки
// не меняла размер слота от раунда к раунду (DESIGNER-SKILL §4) — пучки рисуются только до нужного count.
const CHALK_CYCLE = ["var(--chalk)", "var(--chalk-yellow)", "var(--chalk-pink)", "var(--chalk-blue)"];
function tallySVG(count, stepMs) {
  const step = stepMs || 70;
  let left = Math.max(0, count | 0), stroke = 0, paths = [];
  for (let bi = 0; left > 0; bi++) {
    const n = Math.min(5, left);
    left -= n;
    const ox = 4 + bi * 24;
    for (let v = 0; v < Math.min(n, 4); v++) {
      const x = ox + v * 5;
      paths.push(`<path pathLength="1" style="--sd:${stroke * step}ms" d="M${x} 4 L${x} 26"></path>`);
      stroke++;
    }
    if (n === 5) {
      paths.push(`<path pathLength="1" style="--sd:${stroke * step}ms" d="M${ox - 2} 25 L${ox + 17} 5"></path>`);
      stroke++;
    }
  }
  // viewBox обрезан по содержимому (иначе одна палочка прилипает к левому краю бокса, а подпись по центру)
  const total = Math.max(0, count | 0), nb = Math.ceil(total / 5), lastN = total - (nb - 1) * 5;
  const right = total ? 4 + (nb - 1) * 24 + (lastN === 5 ? 20 : (lastN - 1) * 5 + 3) + 1 : 80;
  return `<svg class="tally" viewBox="0 0 ${right} 30" aria-hidden="true">${paths.join("")}</svg>`;
}
function tallySlotHtml(word, count, colorIdx, revealed, extra) {
  const color = CHALK_CYCLE[(colorIdx || 0) % CHALK_CYCLE.length];
  return `<div class="tslot${revealed ? " revealed" : ""}" style="--chalk-c:${color}"${extra || ""}>
    <div class="trest"></div>${tallySVG(count || 0)}
    <b class="tword">${escapeHtml(word || "")}</b><em class="tcount">${count || ""}</em></div>`;
}
function emptySlotHtml() { return `<div class="tslot" aria-hidden="true"><div class="trest"></div>${tallySVG(0)}<b class="tword"></b><em class="tcount"></em></div>`; }

function timerHtml() { return `<div class="timer" id="timer"><i></i></div>`; }
function nowServer() { return (state && state.serverNow) || Date.now(); }
function patchTimer() {
  const bar = document.getElementById("timer");
  if (!bar || !state || state.phaseStart == null || state.phaseEnd == null) return;
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const left = Math.max(0, state.phaseEnd - nowServer());
  const frac = Math.max(0, Math.min(1, left / total));

}

// считалки раскрытия: слоты стоят в порядке кластеров (устойчиво по макету), но мел дорисовывается
// в порядке round.order (сервер, §7 спеки: случайный порядок раскрытия от seed раунда) — так макет не прыгает,
// а зрелище всё равно идёт вразнобой, не по величине кластера. Цвет мелка циклится по позиции в макете,

function renderReveal() {

  const slots = clusters.map((c, i) => {
    const names = c.players.map((id) => (player(id) || {}).name || "?").join(", ");

  const html = `<div class="scr wordwrap">

  if (show(html, "reveal:" + r.num, true)) {

  }
}

}

function show(html, key, skipAnim) {
  if (key === viewKey) return false;
  viewKey = key;
  main.innerHTML = html;
  return true;
}

function render(force) {
  if (force) viewKey = "";
  document.body.classList.toggle("host", isHost);
  document.getElementById("codechip").classList.toggle("hidden", !CODE);
  document.getElementById("codechip").textContent = CODE;
  renderHostCtl();
  if (dead || !state) { show(`<div class="full"><h1>…</h1></div>`, "wait", true); return; }
  switch (state.phase) {
    case "lobby": return renderLobby();
    case "answer": case "guessPopular": case "guessRare": return renderWordPhase();
    case "reveal": return renderReveal();
    case "scores": return renderScores();
    case "pause": return renderPause();
    case "finished": return renderFinished();
    default: return renderLobby();
  }
}

function handleMessage(m) {
  if (!m || typeof m !== "object") return;
  switch (m.type) {
    case "hello":
      state = m.state;
      if (!isHost) { let t = null; try { t = localStorage.getItem(hostKey()); } catch (e) {} if (t) conn.send({ type: "host", token: t }); }
      render();
      return;
    case "state":
      state = m.state;
      render();
      return;
    case "host_ok":
      isHost = true;
      render(true);
      return;
    case "host_lost":
      isHost = false;
      render(true);
      return;
    case "error":
      if (m.error === "bad host token") { try { localStorage.removeItem(hostKey()); } catch (e) {} }
      if (m.error === "room_expired") { dead = true; render(); }
      return;
    case "room_expired":
      dead = true;
      render();
      return;
    default:
      return;
  }
}

conn = connect({
  code: CODE,
  onMessage: handleMessage,
  onGone: () => { dead = true; render(); },
});
render();
</script>
</body>
</html>
