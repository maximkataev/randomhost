<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f925.svg" type="image/svg+xml">
<title>Не верю! — полоса</title>
<!-- доска ведущего с кодом комнаты: в поиске ей делать нечего -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Cousine:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Cousine:wght@400;700&display=swap" rel="stylesheet"></noscript>
<style>
  /* Мир: жёлтая пресса (fibs-spec.md §9). Соседи — бомба (дневной цветной комикс) и «Вопрос ребром» (ночной клуб, неон).
     Отличаемся материалом (газетная бумага, растр), цветом (чёрно-белая печать + один красный штемпель)
     и движением (вырезки ложатся на полосу, раскрытие — удар штемпеля «ЛОЖЬ» / «ПРАВДА»). */
  :root {
    --paper: #efe8d8;
    --paper-2: #e3d8c0;
    --sheet: #fbf8f0;
    --ink: #151412;
    --ink-2: #3b3833;
    --muted: #6f685c;
    --rule: #cfc4ab;
    --red: #c8201e;
    --ok: #1f7a3c;
    --font: "Noto Serif", Georgia, "Times New Roman", serif;
    --head: "Noto Serif Display", "Noto Serif", Georgia, serif;
    --mono: "Cousine", "Courier New", monospace;
    --press: cubic-bezier(.2, .9, .3, 1.2);
    --lang-switch-bg: var(--sheet);
    --lang-switch-border: var(--ink);
    --lang-switch-fg: var(--ink);
    --lang-switch-active-bg: var(--ink);
    --lang-switch-active-fg: var(--sheet);
    --lang-switch-active-border: var(--ink);
    --lang-switch-font: var(--mono);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse 70% 50% at 30% 0%, rgba(255, 255, 255, .55), transparent 70%),
      radial-gradient(rgba(21, 20, 18, .07) 1px, transparent 1.3px) 0 0 / 6px 6px,
      linear-gradient(180deg, var(--paper), var(--paper-2));
    background-color: var(--paper);
    color: var(--ink);
    font: 400 18px/1.35 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* шапка газеты: название, выпуск (раунд), код, звук; справа — место под переключатель языка */
  .top { flex: none; display: flex; align-items: center; gap: 18px; height: calc(var(--lsc, 32px) * 2); padding: 0 var(--lsw, 160px) 0 22px; border-bottom: 3px double var(--ink); margin: 0 0 4px; position: relative; z-index: 2; }
  .top h1 { margin: 0; font: 900 30px/1 var(--head); white-space: nowrap; }
  .top h1 em { font-style: normal; color: var(--red); }
  .chip { font: 700 18px/1 var(--mono); padding: 8px 12px; border: 1.5px solid var(--ink); background: var(--sheet); white-space: nowrap; }
  .chip b { color: var(--red); }
  .top .grow { flex: 1; }
  .sound-toggle-btn { flex: none; width: calc(var(--lsh, 44px) * 1.25); height: var(--lsh, 44px); border: 1.5px solid var(--ink); border-radius: 0; background: var(--sheet); font-size: 17px; display: grid; place-items: center; padding: 0; }
  .banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 50; background: var(--red); color: #fff; padding: 8px 14px; font: 700 16px/1.2 var(--mono); }
  .conn { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 50; background: var(--red); color: #fff; padding: 6px 12px; font: 700 15px/1.2 var(--mono); visibility: hidden; }
  .conn.on { visibility: visible; }
  .endbtn { flex: none; border: 1.5px dashed var(--ink); background: var(--sheet); padding: 8px 12px; font: 700 15px/1 var(--mono); color: var(--ink-2); }

  main { flex: 1; min-height: 0; position: relative; z-index: 1; }
  .screen { position: absolute; inset: 6px 22px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }

  .sheet { background: var(--sheet); border: 1px solid var(--rule); box-shadow: 0 1px 0 var(--rule), 4px 5px 0 rgba(21, 20, 18, .12); }
  .kicker { font: 700 17px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* ---------- лобби: игроки слева (правило владельца), подключение и настройки справа ---------- */
  .lobby { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr); gap: 22px; }
  .panel { padding: 20px; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
  .panel h2 { margin: 0; font: 900 26px/1.1 var(--head); display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  .panel h2 span { color: var(--muted); font: 700 16px/1 var(--mono); }
  .seats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 10px; flex: 1; min-height: 0; }
  .seat { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--sheet); border: 1.5px solid var(--ink); border-left: 6px solid var(--pc); min-width: 0; min-height: 52px; }
  .seat .av { font-size: clamp(26px, 3.4vh, 40px); line-height: 1; font-style: normal; }
  /* место высокое — длинное имя встаёт в две строки, а не режется на «Константи…» */
  .seat b { font: 700 clamp(17px, 2.2vh, 24px)/1.15 var(--mono); overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-width: 0; flex: 1; }
  .seat .off { color: var(--muted); font-size: 13px; }
  .seat .x { position: absolute; right: 4px; top: 4px; background: none; border: 0; color: var(--muted); padding: 2px 6px; visibility: hidden; }
  .host .seat:hover .x, .host .seat:focus-within .x { visibility: visible; }
  @media (prefers-reduced-motion: no-preference) { .seat.new { animation: clip .5s var(--press); } }
  @keyframes clip { from { transform: translateY(-14px) rotate(-3deg); opacity: .2; } }
  .seat.empty { border: 1.5px dashed var(--rule); background: transparent; color: var(--muted); font: italic 15px/1 var(--font); justify-content: center; }
  .seat.empty.next { border-color: var(--ink-2); color: var(--ink-2); }
  .howto { display: grid; gap: 12px; font-size: 20px; margin: auto 0; }
  .howto div { display: flex; gap: 14px; align-items: center; }
  .howto i { flex: none; font-style: normal; font-size: 30px; width: 40px; text-align: center; }
  .join { display: flex; gap: 22px; align-items: center; }
  /* QR крупный: его сканируют с дивана, метров с трёх */
  #qr { flex: none; width: clamp(150px, 27vh, 250px); height: clamp(150px, 27vh, 250px); background: #fff; padding: 8px; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--red); }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  .bigcode { font: 700 var(--code-fs, 60px)/1 var(--mono); letter-spacing: .04em; white-space: nowrap; overflow: hidden; }
  .url { color: var(--ink-2); font: 400 18px/1.3 var(--mono); overflow-wrap: anywhere; }
  .scan { font-size: 19px; margin-top: 6px; }
  .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .opt-row .lbl b { display: block; }
  .opt-row .lbl b { font-size: 20px; }
  .opt-row .lbl span { color: var(--muted); font-size: 16px; }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); flex: none; }
  .seg button { background: var(--sheet); border: 0; padding: 8px 14px; font: 700 16px/1 var(--mono); min-width: 48px; }
  .seg button.on { background: var(--ink); color: var(--sheet); }
  .startbox { margin-top: auto; display: grid; gap: 8px; }
  .start { width: 100%; border: 2px solid var(--ink); background: var(--ink); color: var(--sheet); font: 700 30px/1 var(--mono); padding: 20px; box-shadow: 6px 6px 0 var(--red); }
  .start:not(:disabled):active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--red); }
  .fine { color: var(--ink-2); font-size: 18px; }

  /* ---------- заставка раунда: экстренный выпуск ---------- */
  .intro { justify-content: center; align-items: center; text-align: center; }
  .intro .kicker { font-size: 22px; }
  .intro h2 { font: 900 clamp(64px, 13vh, 132px)/1 var(--head); margin: 14px 0; border-top: 6px solid var(--ink); border-bottom: 6px solid var(--ink); padding: 14px 40px 10px; }
  .intro .desc { font: italic 400 28px/1.3 var(--font); max-width: 960px; }
  .intro .pts { font: 700 26px/1 var(--mono); margin-top: 22px; }
  .intro .pts b { color: var(--red); }
  @media (prefers-reduced-motion: no-preference) { .intro.go h2 { animation: press .6s var(--press) both; } }
  @keyframes press { from { transform: scale(1.4); opacity: 0; letter-spacing: .1em; } }

  /* ---------- шкала времени ---------- */
  /* высота постоянная: часы пустые до первого кадра, и без неё полоса «подпрыгивала», а заголовок подгонялся под чужую высоту */
  .bar { flex: none; display: flex; align-items: center; gap: 16px; height: 60px; }
  .bar .what { font: 700 26px/1.2 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .bar .what b { color: var(--red); }
  .bar .clock { font: 700 56px/1 var(--mono); width: 130px; text-align: right; font-variant-numeric: tabular-nums; }
  .bar .clock.hot { color: var(--red); }
  .timeline { flex: none; height: 8px; background: var(--rule); overflow: hidden; }
  .timeline i { display: block; height: 100%; background: var(--ink); transform-origin: 0 50%; }
  .timeline.hot i { background: var(--red); }

  /* ---------- выбор темы ---------- */
  .topicwho { text-align: center; font: 900 clamp(40px, 7vh, 72px)/1.1 var(--head); margin: auto 0 12px; }
  .topicwho .av { font-style: normal; }
  .topiclist { display: grid; grid-template-columns: repeat(var(--tc, 4), minmax(0, 1fr)); gap: 20px; margin: 0 auto auto; width: min(1300px, 100%); }
  .topiclist div { display: grid; place-items: center; min-height: clamp(130px, 20vh, 200px); padding: 24px 18px; text-align: center; font: 900 clamp(26px, 4vh, 40px)/1.1 var(--head); border: 3px solid var(--ink); background: var(--sheet); box-shadow: 6px 6px 0 var(--ink); overflow-wrap: break-word; hyphens: auto; }

  /* ---------- факт: заголовок полосы, высота постоянна, шрифт подгоняется ---------- */
  .headline { flex: none; height: var(--hh, 30vh); overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 14px 26px; border-top: 7px double var(--ink); border-bottom: 2px solid var(--ink); }
  .headline .kicker { flex: none; font-size: 20px; color: var(--ink-2); margin-bottom: 4px; }
  /* на ложь заголовок берёт всё место до карточек игроков */
  .screen.lie .headline { height: auto; flex: 1 1 0; min-height: 0; }
  /* снизу запас под черту пропуска: без него она «торчит» из коробки на 3 px, и подгонка шрифта сжимала заголовок до минимума */
  .headline .t { font: 900 var(--hfs, 64px)/1.08 var(--head); overflow-wrap: break-word; overflow: hidden; padding-bottom: .16em; }
  .gap { display: inline-block; width: 3.2em; border-bottom: .09em solid var(--ink); vertical-align: -.08em; }
  mark.ans { background: none; color: var(--red); border-bottom: .09em solid var(--red); padding: 0 .06em; }
  @media (prefers-reduced-motion: no-preference) { mark.ans { animation: ink .7s var(--press) both; } }
  @keyframes ink { from { opacity: 0; filter: blur(6px); } }
  .src { flex: none; font: 400 18px/1.2 var(--mono); color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- кто уже соврал / выбрал ---------- */
  .writers { flex: none; margin-top: auto; display: grid; grid-template-columns: repeat(var(--wc, 5), minmax(0, 1fr)); gap: 12px; }
  .writer { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1.5px dashed var(--ink-2); height: 70px; min-width: 0; transition: background .25s, transform .35s var(--press); }
  .writer .av { font-size: 34px; font-style: normal; }
  .writer b { font: 700 22px/1.1 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .writer .st { font: 700 22px/1 var(--mono); color: var(--muted); white-space: nowrap; }
  .writer.done { background: var(--sheet); border: 1.5px solid var(--ink); border-left: 6px solid var(--pc); transform: rotate(-1deg); box-shadow: 3px 4px 0 rgba(21, 20, 18, .15); }
  .writer.done:nth-child(even) { transform: rotate(1deg); }
  .writer.done .st { color: var(--red); font-size: 30px; }
  .typer { display: inline-block; }
  @media (prefers-reduced-motion: no-preference) { .writer:not(.done) .typer { animation: tap .35s infinite alternate steps(2); } }
  @keyframes tap { to { transform: translateY(-3px); } }

  /* ---------- варианты: вырезки на полосе ---------- */
  .clips { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: stretch; gap: var(--gap, 16px); padding: 14px 6px 6px; }
  .clips > .clip { flex: none; width: calc((100% - (var(--cols, 3) - 1) * var(--gap, 16px)) / var(--cols, 3)); height: calc((100% - (var(--rows, 2) - 1) * var(--gap, 16px)) / var(--rows, 2)); }
  .clip { position: relative; display: flex; flex-direction: column; min-height: 0; padding: 12px 16px 10px 52px; background: var(--sheet); border: 1.5px solid var(--ink); transform: rotate(var(--rot, 0deg)); transition: opacity .4s, transform .35s var(--press), box-shadow .3s; }
  .clip .l { position: absolute; left: 10px; top: 12px; width: 32px; height: 32px; border: 2px solid var(--ink); font: 700 18px/28px var(--mono); text-align: center; }
  .clip .t { flex: 1; min-height: 0; display: flex; align-items: safe center; font: 700 var(--cfs, 34px)/1.15 var(--mono); overflow: hidden; overflow-wrap: anywhere; }
  .clip .foot { flex: none; min-height: 38px; display: flex; align-items: center; gap: 10px; border-top: 1.5px dashed var(--rule); padding-top: 6px; margin-top: 6px; visibility: hidden; }
  .clip .who { font: 700 22px/1.2 var(--font); min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .pts { font: 700 22px/1 var(--mono); color: var(--red); white-space: nowrap; }
  .clip .pickers { position: absolute; right: 8px; top: -18px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px; max-width: 70%; font-size: 30px; line-height: 1; }
  .clip .pickers i { font-style: normal; background: var(--sheet); border: 1.5px solid var(--ink); padding: 2px 3px; }
  .clip .likes { font: 700 20px/1 var(--mono); color: var(--ink-2); white-space: nowrap; }
  .clip.shown .foot { visibility: visible; }
  .clip.shown { border-left: 7px solid var(--pc, var(--ink)); }
  /* текущий раскрываемый — крупнее и ярче, прошлые уходят в тень */
  .clip.focus { z-index: 3; box-shadow: 0 0 0 4px var(--ink), 10px 12px 0 rgba(21, 20, 18, .25); transform: rotate(0) scale(1.03); }
  .clip.past { opacity: .55; }
  .clip.past.truth { opacity: 1; }
  .clip.truth.shown { background: color-mix(in srgb, var(--ok) 10%, var(--sheet)); border-color: var(--ok); }
  .clip .stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg); font: 900 var(--sfs, 48px)/1 var(--head); letter-spacing: .08em; color: var(--red); border: .09em solid var(--red); padding: .1em .3em 0; mix-blend-mode: multiply; pointer-events: none; visibility: hidden; white-space: nowrap; }
  .clip.truth .stamp { color: var(--ok); border-color: var(--ok); }
  .clip.shown .stamp { visibility: visible; }
  @media (prefers-reduced-motion: no-preference) {
    .clip.laid { animation: lay .45s var(--press) both; animation-delay: var(--d, 0s); }
    .clip.shown .stamp { animation: slam .35s var(--press); }
    .clip.shown .pickers i { animation: drop .35s var(--press) both; animation-delay: var(--vd, 0s); }
  }
  @keyframes lay { from { transform: translateY(-30px) rotate(calc(var(--rot, 0deg) * 4)); opacity: 0; } }
  @keyframes slam { from { transform: translate(-50%, -50%) rotate(-8deg) scale(2.4); opacity: 0; } }
  @keyframes drop { from { transform: translateY(-16px); opacity: 0; } }
  .votebar { flex: none; display: flex; justify-content: center; gap: 10px; min-height: 44px; align-items: center; font: 700 22px/1 var(--mono); color: var(--ink-2); }
  .votebar .dot { font-size: 32px; opacity: .25; font-style: normal; }
  .votebar .dot.on { opacity: 1; }

  /* ---------- счёт: сводка котировок ---------- */
  .board { flex: 1; min-height: 0; display: grid; grid-auto-rows: var(--rowh, 56px); gap: 8px; align-content: center; width: min(1240px, 100%); align-self: center; }
  .board.two { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(var(--rows), var(--rowh)); grid-auto-flow: column; column-gap: 20px; width: min(1560px, 100%); }
  .rowx { display: grid; grid-template-columns: 1.8em 1.6em minmax(0, 1fr) 4.2em 4.6em; align-items: center; gap: .6em; padding: 0 .8em; background: var(--sheet); border: 1.5px solid var(--ink); border-left: 7px solid var(--pc); font: 700 clamp(20px, calc(var(--rowh, 56px) * .36), 36px)/1 var(--mono); }
  .rowx .n { color: var(--muted); }
  .rowx .av { font-size: 1.3em; font-style: normal; }
  .rowx b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowx .d { color: var(--red); text-align: right; white-space: nowrap; }
  .rowx .s { font-size: 1.2em; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rowx.lead { background: var(--ink); color: var(--sheet); box-shadow: 6px 6px 0 var(--red); }
  .rowx.lead .n { color: var(--sheet); }
  .rowx.lead .d { color: #ff7a6e; }
  @media (prefers-reduced-motion: no-preference) { .rowx .d:not(:empty) { animation: drop .45s var(--press) both; animation-delay: var(--dd, .3s); } }

  /* ---------- итоги: первая полоса ---------- */
  .final { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
  .podium { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; gap: 14px; padding: 10px 0 0; }
  .step { text-align: center; display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; min-width: 0; }
  .step .av { font-size: clamp(54px, 9vh, 88px); line-height: 1.1; display: block; font-style: normal; }
  .step b { display: block; font: 700 26px/1.2 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .sc { font: 700 30px/1 var(--mono); margin-top: 6px; color: var(--red); }
  .step .col { flex: none; margin-top: 12px; background: var(--ink); color: var(--sheet); border-top: 8px solid var(--pc); display: grid; place-items: start center; padding-top: 14px; font: 900 56px/1 var(--head); }
  .step.p1 .col { height: 56%; }
  .step.p2 .col { height: 40%; }
  .step.p3 .col { height: 28%; }
  @media (prefers-reduced-motion: no-preference) {
    .step .col { animation: rise-col .7s var(--press) both; transform-origin: 50% 100%; }
    .step.p3 .col { animation-delay: .1s; } .step.p2 .col { animation-delay: .25s; } .step.p1 .col { animation-delay: .45s; }
  }
  @keyframes rise-col { from { transform: scaleY(0); } }
  /* правая колонка: награды сверху, сводка тянется до низа — без пустоты под короткой колонкой */
  .awards { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .awcards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .award { padding: 14px 16px; min-width: 0; }
  .award.wide { grid-column: 1 / -1; }
  /* непарная награда в конце — на всю ширину, без дыры справа */
  .awcards > .award.wide ~ .award:last-child:nth-child(even), .awcards > .award:not(.wide):first-child ~ .award:last-child:nth-child(odd), .awcards > .award:only-child { grid-column: 1 / -1; }
  .award .k { color: var(--red); }
  .award .a { font: 900 30px/1.15 var(--head); overflow-wrap: anywhere; margin-top: 4px; }
  .award .by { margin-top: 4px; font: 400 19px/1.3 var(--mono); color: var(--ink-2); }
  .award .q { font: italic 400 18px/1.3 var(--font); color: var(--muted); margin-top: 6px; }
  .table { flex: 1; padding: 14px 16px; min-height: 0; overflow: hidden; }

  .ghostbtn { border: 2px dashed var(--ink); background: var(--sheet); padding: 14px; font: 700 24px/1 var(--mono); }

  /* реакции взлетают снизу */

  .floater small { font: 700 14px/1.2 var(--mono); background: var(--ink); color: var(--sheet); padding: 2px 6px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: no-preference) { .floater { animation: rise 2.6s ease-out forwards; } }

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
const T = (k) => qpT(k);
const tpl = (k, v) => qpTpl(k, v);
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const hostKey = () => "fibs-host-" + CODE;
const main = $("main");

let conn = null, state = null, isHost = false, dead = false;
let viewKey = "";

const player = (id) => state && state.players.find((p) => p.id === id);
const present = () => state.players.filter((p) => !p.left);
const factKey = () => state.game + ":" + state.ri + ":" + state.fi;

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  showBanner(T("creating"));
  try {
    const res = await fetch("/fibs/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: qpLang() } }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
    showBanner(null);
    return true;
  } catch (err) {
    showBanner(String(err.message || err));
    return false;
  }
}
function showBanner(text) {
  const b = $("banner");
  b.classList.toggle("hidden", !text);
  b.textContent = text || "";
}

// подогнать шрифт под коробку: уменьшаем, пока текст не влезет (коробка не растёт — правило «без скачков»)
function fit(box, holder, varName, max, min) {
  let fs = max;
  holder.style.setProperty(varName, fs + "px");
  let guard = 0;
  while (fs > min && (box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1) && guard++ < 60) {
    fs -= 2;
    holder.style.setProperty(varName, fs + "px");
  }
}

const avatarName = (p) => `<i class="av">${escapeHtml(p.avatar)}</i><b>${escapeHtml(p.name)}</b>`;

// ---------- лобби ----------
let qrDrawn = false;
const seen = new Set();
function drawLobby() {
  const url = `${location.origin}/fibs.html?r=${CODE}`;
  const key = "lobby:" + qpLang() + ":" + isHost;
  if (viewKey !== key) {
    viewKey = key;
    qrDrawn = false;
    main.innerHTML = `<div class="screen lobby">
      <div class="panel sheet"><h2>${T("lobby_who")}<span id="seatn"></span></h2><div class="seats" id="seats"></div></div>
      <div class="panel sheet">
        <div class="join"><div id="qr"></div><div style="min-width:0;flex:1"><div class="bigcode" id="bigcode">${escapeHtml(CODE)}</div><div class="url">${escapeHtml(url.replace(/^https?:\/\//, ""))}</div><div class="scan">${T("lobby_scan")}</div></div></div>
        <div id="opts" style="display:grid;gap:14px"></div>
        <div class="howto"><div><i>📱</i>${T("how1")}</div><div><i>🤥</i>${T("how2")}</div><div><i>🔎</i>${T("how3")}</div></div>
        <div class="startbox"><div class="fine" id="starthint"></div><button class="start" id="startbtn" type="button">${T("btn_start")}</button></div>
      </div></div>`;
    $("startbtn").onclick = () => conn.send({ type: "start" });
    const code = $("bigcode");
    let fs = 96;
    code.style.setProperty("--code-fs", fs + "px");
    while (fs > 30 && code.scrollWidth > code.clientWidth + 1) { fs -= 4; code.style.setProperty("--code-fs", fs + "px"); }
  }
  if (!qrDrawn && window.QRCode) {
    qrDrawn = true;
    $("qr").replaceChildren();
    new QRCode($("qr"), { text: url, width: 240, height: 240, colorDark: "#151412", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  }
  const ps = present();
  if (ps.some((p) => !seen.has(p.id)) && seen.size) qpSfx.type(4);
  const nodes = ps.map((p) => {
    const d = el("div", "seat" + (seen.has(p.id) ? "" : " new"));
    d.style.setProperty("--pc", p.color);
    d.innerHTML = avatarName(p) + (p.online ? "" : `<span class="off">${escapeHtml(T("offline"))}</span>`);
    if (isHost) { const x = el("button", "x", "✕"); x.type = "button"; x.title = T("kick"); x.setAttribute("aria-label", T("kick")); x.onclick = () => conn.send({ type: "kick", playerId: p.id }); d.append(x); }
    return d;
  });
  // все 16 мест видны сразу: свободные — пунктиром, ближайшее подсвечено
  for (let i = ps.length; i < 16; i++) nodes.push(el("div", "seat empty" + (i === ps.length ? " next" : ""), T("lobby_empty")));
  $("seats").replaceChildren(...nodes);
  ps.forEach((p) => seen.add(p.id));
  $("seatn").textContent = tpl("lobby_n", { n: ps.length });
  drawOpts();
  const need = Math.max(0, state.minPlayers - ps.length);
  $("startbtn").disabled = !isHost || need > 0;
  $("startbtn").classList.toggle("hidden", !isHost);
  $("starthint").textContent = !isHost ? T("viewer") : need ? tpl("need_more", { n: need }) : T("ready");
}

function drawOpts() {
  const s = state.settings;
  const seg = (name, values, cur, label) => `<span class="seg" role="group" aria-label="${escapeHtml(label)}">${values.map(([v, l]) => `<button type="button" data-k="${name}" data-v="${v}" class="${String(cur) === String(v) ? "on" : ""}"${isHost ? "" : " disabled"} aria-pressed="${String(cur) === String(v)}">${escapeHtml(l)}</button>`).join("")}</span>`;
  $("opts").innerHTML = `
    <div class="opt-row"><div class="lbl"><b>${T("opt_hints")}</b><span>${T("opt_hints_d")}</span></div>${seg("hints", [[1, "1"], [2, "2"], [3, "3"]], s.hints, T("opt_hints"))}</div>
    <div class="opt-row"><div class="lbl"><b>${T("opt_short")}</b><span>${T("opt_short_d")}</span></div>${seg("short", [[false, T("off")], [true, T("on")]], s.short, T("opt_short"))}</div>`;
  $("opts").querySelectorAll("button[data-k]").forEach((b) => {
    b.onclick = () => {
      const v = b.dataset.k === "hints" ? Number(b.dataset.v) : b.dataset.v === "true";
      conn.send({ type: "settings", settings: { [b.dataset.k]: v } });
    };
  });
}

// ---------- заставка ----------
let roundBase = null; // счёт до факта: из него на табло считается прибавка
function drawIntro() {
  const key = "intro:" + state.game + ":" + state.ri + qpLang();
  if (viewKey === key) return;
  viewKey = key;
  const pts = state.points;
  main.innerHTML = `<div class="screen intro go">
    <div class="kicker">${escapeHtml(tpl("round_n", { n: state.ri + 1 }))} / 3</div>
    <h2>${escapeHtml(qpRoundName(state.roundKey))}</h2>
    <div class="desc">${escapeHtml(qpRoundDesc(state.roundKey))}</div>
    ${pts ? `<div class="pts">${escapeHtml(tpl("pts_truth", { n: pts.truth }))} · <b>${escapeHtml(tpl("pts_fool", { n: pts.fool }))}</b></div>` : ""}</div>`;
  qpSfx.type(10);
}

// ---------- шапка факта ----------
function clockHtml(what) {
  return `<div class="bar"><div class="what">${escapeHtml(tpl("fact_of", { i: state.fi + 1, n: state.factsInRound }))} · <b>${escapeHtml(what)}</b></div><div class="clock" id="clock"></div></div><div class="timeline" id="timeline"><i></i></div>`;
}
function headlineHtml(ans, src) {
  const f = state.fact;
  const kind = f.final ? T("r_final") : qpTopic(f.topic);
  return `<div class="headline" id="headline"><div class="kicker">${escapeHtml(kind)}</div><div class="t" id="hl">${qpFactHtml(f.text, ans)}</div>${src ? `<div class="src">${escapeHtml(T("source"))}: ${escapeHtml(src)}</div>` : ""}</div>`;
}
function fitHeadline() {
  const hl = $("hl");
  if (hl) fit(hl, $("headline"), "--hfs", 84, 24);
}

// ---------- выбор темы ----------
function drawTopic() {
  const key = "topic:" + factKey() + qpLang();
  if (viewKey === key) return;
  viewKey = key;
  roundBase = { key: factKey(), scores: Object.fromEntries(state.players.map((p) => [p.id, p.score])) };
  const ch = player(state.chooser);
  main.innerHTML = `<div class="screen">${clockHtml(qpRoundName(state.roundKey))}
    <div class="topicwho">${escapeHtml(T("topic_by"))} ${ch ? `<i class="av">${escapeHtml(ch.avatar)}</i> ${escapeHtml(ch.name)}` : "?"}</div>
    <div class="topiclist" style="--tc:${state.topics.length}">${state.topics.map((t) => `<div>${escapeHtml(qpTopic(t))}</div>`).join("")}</div></div>`;
}

// ---------- ложь ----------
function writersHtml(ids, doneIds) {
  const n = Math.max(1, ids.length);
  const cols = Math.ceil(n / Math.ceil(n / 6));
  return `<div class="writers" id="writers" style="--wc:${cols}">${ids.map((id) => {
    const p = player(id) || { avatar: "?", name: "?", color: "#777" };
    const done = doneIds.includes(id);
    return `<div class="writer${done ? " done" : ""}" style="--pc:${p.color}">${avatarName(p)}<span class="st">${done ? "✓" : `<span class="typer">⌨️</span>`}</span></div>`;
  }).join("")}</div>`;
}
function drawLie() {
  const key = "lie:" + factKey() + qpLang();
  if (!roundBase || roundBase.key !== factKey()) roundBase = { key: factKey(), scores: Object.fromEntries(state.players.map((p) => [p.id, p.score])) };
  if (viewKey !== key) {
    viewKey = key;
    main.innerHTML = `<div class="screen lie">${clockHtml(T("lie_what"))}${headlineHtml()}<div id="wr"></div></div>`;
    qpSfx.type(8);
  }
  const roster = state.roster || [];
  const done = state.lied || [];
  const was = drawLie.done || 0;
  if (done.length > was && drawLie.key === key) qpSfx.type(3);
  drawLie.done = done.length; drawLie.key = key;
  const fresh = !$("writers");
  $("wr").innerHTML = writersHtml(roster, done);
  // заголовок занимает место до карточек игроков — подгоняем, когда карточки уже стоят
  if (fresh) fitHeadline();
}

// ---------- варианты ----------
function clipGrid(n) {
  // ряды поровну и на всю ширину; неполный последний ряд — по центру
  const cols = n <= 4 ? n : n <= 8 ? Math.ceil(n / 2) : Math.ceil(n / 3);
  return { cols, rows: Math.ceil(n / cols) };
}
function drawClips(revealed) {
  const opts = state.options;
  const { cols, rows } = clipGrid(opts.length);
  const rot = (i) => (((i * 37) % 7) - 3) * 0.35;
  return `<div class="clips" id="clips" style="--cols:${cols};--rows:${rows}">${opts.map((o, i) => {
    const p = revealed && o.kind === "lie" ? player(o.authors[0]) : null;
    return `<div class="clip laid${revealed && o.kind === "truth" ? " truth" : ""}" id="clip${i}" style="--d:${(i * 0.07).toFixed(2)}s;--rot:${rot(i)}deg;--pc:${p ? p.color : "var(--ink)"}">
      <span class="l">${String.fromCharCode(65 + i)}</span><div class="t">${escapeHtml(o.text)}</div>
      <div class="foot"><span class="who" id="who${i}"></span><span class="likes" id="lk${i}"></span><span class="pts" id="pt${i}"></span></div>
      <div class="pickers" id="pk${i}"></div><div class="stamp" id="st${i}"></div></div>`;
  }).join("")}</div>`;
}
function fitClips() {
  const clips = [...main.querySelectorAll(".clip")];
  if (!clips.length) return;
  // один кегль на все вырезки: самая длинная определяет размер
  const h = clips[0].clientHeight;
  let fs = Math.max(20, Math.min(46, Math.floor(h * 0.28)));
  const setAll = (v) => clips.forEach((c) => c.style.setProperty("--cfs", v + "px"));
  setAll(fs);
  const over = () => clips.some((c) => { const t = c.querySelector(".t"); return t.scrollHeight > t.clientHeight + 1 || t.scrollWidth > t.clientWidth + 1; });
  let guard = 0;
  while (fs > 16 && over() && guard++ < 40) { fs -= 2; setAll(fs); }
  clips.forEach((c) => c.style.setProperty("--sfs", Math.max(28, Math.min(64, Math.floor(c.clientHeight * 0.3))) + "px"));
}

function drawChoose() {
  const key = "choose:" + factKey() + qpLang();
  if (viewKey !== key) {
    viewKey = key;
    main.innerHTML = `<div class="screen">${clockHtml(T("choose_what"))}${headlineHtml()}${drawClips(false)}<div class="votebar" id="votebar"></div></div>`;
    $("headline").style.setProperty("--hh", "min(24vh, 230px)");
    fitHeadline();
    fitClips();
    qpSfx.type(6);
  }
  const ps = present().filter((p) => p.online);
  const chose = state.chose || [];
  $("votebar").innerHTML = ps.map((p) => `<i class="dot${chose.includes(p.id) ? " on" : ""}" title="${escapeHtml(p.name)}">${escapeHtml(p.avatar)}</i>`).join("") + `<span style="margin-left:10px">${escapeHtml(tpl("chose_n", { n: chose.length, m: ps.length }))}</span>`;
}

// ---------- раскрытие: шаги по расписанию сервера ----------
function drawReveal() {
  const key = "reveal:" + factKey() + qpLang();
  if (viewKey === key) return;
  viewKey = key;
  main.innerHTML = `<div class="screen">${clockHtml(T("reveal_what"))}<div id="hlbox">${headlineHtml()}</div>${drawClips(true)}<div class="votebar"></div></div>`;
  $("headline").style.setProperty("--hh", "min(24vh, 230px)");
  fitHeadline();
  fitClips();
  revealShown = -1;
  revealTick();
}
let revealShown = -1;
function revealTick() {
  if (!state || (state.phase !== "reveal" && state.phase !== "scores") || !state.steps) return;
  const elapsed = state.phase === "scores" ? Infinity : qpNow() - state.phaseStart;
  const steps = state.steps;
  let cur = -1;
  steps.forEach((s, i) => { if (s.at <= elapsed) cur = i; });
  if (cur === revealShown) return;
  for (let k = revealShown + 1; k <= cur; k++) showStep(steps[k].opt, k === cur);
  steps.forEach((s, i) => {
    const c = $("clip" + s.opt);
    if (!c) return;
    c.classList.toggle("focus", i === cur && state.phase === "reveal");
    c.classList.toggle("past", i < cur);
  });
  revealShown = cur;
}
function showStep(i, live) {
  const o = state.options[i];
  const c = $("clip" + i);
  if (!c) return;
  const R = state.points || { truth: 0, fool: 0 };
  c.classList.add("shown");
  $("st" + i).textContent = o.kind === "truth" ? T("truth") : T("fake");
  $("who" + i).textContent = o.kind === "lie" ? tpl("lie_of", { names: qpNames(o.authors, player) }) + o.authors.map((a, k) => (o.late[k] ? " 🐌" : o.hint[k] ? " 🎲" : "")).join("") : o.kind === "trap" ? T("trap") : T("truth");
  $("pk" + i).innerHTML = o.choosers.map((ch, k) => { const p = player(ch.playerId) || { avatar: "?" }; return `<i style="--vd:${(0.25 + k * 0.08).toFixed(2)}s" title="${escapeHtml(p.name || "")}">${escapeHtml(p.avatar)}${ch.half ? "½" : ""}</i>`; }).join("");
  $("lk" + i).textContent = o.likes ? tpl("likes_n", { n: o.likes }) : "";
  if (o.kind === "lie" && o.choosers.length) {
    const pts = o.choosers.reduce((n, ch) => n + (ch.half ? R.fool / 2 : R.fool), 0);
    $("pt" + i).textContent = tpl("pts", { n: pts });
  }
  if (o.kind === "truth") {
    if (o.choosers.length) $("pt" + i).textContent = tpl("pts", { n: R.truth });
    // правда вписывается в заголовок, внизу — источник
    const src = state.truth && state.truth.source ? qpSourceHost(state.truth.source) : "";
    $("hlbox").innerHTML = headlineHtml(state.truth ? state.truth.answer : o.text, src);
    $("headline").style.setProperty("--hh", "min(24vh, 230px)");
    fitHeadline();
  }
  if (!live) return;
  if (o.kind === "truth") qpSfx.fanfare();
  else if (o.kind === "trap" && o.choosers.length) qpSfx.womp();
  else qpSfx.stamp();
}

// ---------- счёт ----------
function ranked() {
  return present().slice().sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
}
function drawScores() {
  const key = "scores:" + factKey() + qpLang();
  if (viewKey === key) return;
  viewKey = key;
  const list = ranked();
  // больше десяти — в две колонки: иначе строки сжимаются до мелкого шрифта или вылезают за низ экрана
  const two = list.length > 10;
  const rows = two ? Math.ceil(list.length / 2) : Math.max(list.length, 1);
  const rowh = Math.max(40, Math.min(96, Math.floor((main.clientHeight - 110) / rows) - 8));
  const base = roundBase && roundBase.key === factKey() ? roundBase.scores : null;
  const from = (p) => (base && base[p.id] != null ? base[p.id] : p.score);
  main.innerHTML = `<div class="screen">
    <div class="bar"><div class="what">${escapeHtml(T("scores_what"))}</div><div class="clock" id="clock"></div></div>
    <div class="board${two ? " two" : ""}" style="--rowh:${rowh}px;--rows:${rows}">${list.map((p, i) => { const d = p.score - from(p); return `<div class="rowx${i === 0 && p.score > 0 ? " lead" : ""}" style="--pc:${p.color}"><span class="n">${i + 1}</span><i class="av">${escapeHtml(p.avatar)}</i><b>${escapeHtml(p.name)}</b><span class="d" style="--dd:${(0.3 + i * 0.08).toFixed(2)}s">${d > 0 ? escapeHtml(tpl("pts", { n: d })) : ""}</span><span class="s" data-from="${from(p)}" data-to="${p.score}">${p.score}</span></div>`; }).join("")}</div></div>`;
  countUp();
}
// прибавка «набегает» на табло: числа идут от старого счёта к новому (при reduced-motion — сразу итог)
function countUp() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const nodes = [...main.querySelectorAll(".rowx .s[data-from]")].filter((n) => n.dataset.from !== n.dataset.to);
  if (!nodes.length) return;
  const t0 = performance.now() + 250, dur = 1000;
  nodes.forEach((n) => (n.textContent = n.dataset.from));
  const step = (now) => {
    const k = Math.max(0, Math.min(1, (now - t0) / dur));
    const e = 1 - Math.pow(1 - k, 3);
    nodes.forEach((n) => { if (n.isConnected) n.textContent = Math.round(+n.dataset.from + (n.dataset.to - n.dataset.from) * e); });
    if (k < 1 && nodes[0].isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---------- итоги ----------
function drawFinal() {
  const key = "final:" + state.game + ":" + state.finishedReason + ":" + isHost + qpLang();
  if (viewKey === key) return;
  viewKey = key;
  const list = ranked();
  const top = [list[1], list[0], list[2]];
  const cls = ["p2", "p1", "p3"];
  const num = [2, 1, 3];
  const a = state.awards || {};
  const names = (x) => x.ids.map((id) => { const p = player(id) || { avatar: "?", name: "?" }; return `${p.avatar} ${p.name}`; }).join(", ");
  const award = (label, x, dKey) => (x ? `<div class="award sheet"><div class="kicker">${escapeHtml(label)}</div><div class="a">${escapeHtml(names(x))}</div><div class="by">${escapeHtml(tpl(dKey, { n: x.n }))}</div></div>` : "");
  const best = a.bestLie ? `<div class="award sheet wide"><div class="kicker">${escapeHtml(T("aw_best"))}</div><div class="a">«${escapeHtml(a.bestLie.text)}»</div><div class="by">${escapeHtml(qpNames(a.bestLie.authors, player))} · ${escapeHtml(tpl("likes_n", { n: a.bestLie.likes }))}</div><div class="q">${qpFactHtml(a.bestLie.fact)}</div></div>` : "";
  const cards = [best, award(T("aw_liar"), a.liar, "aw_liar_d"), award(T("aw_detector"), a.detector, "aw_detector_d"), award(T("aw_gullible"), a.gullible, "aw_gullible_d")].filter(Boolean).join("");
  const reason = state.finishedReason === "few" ? T("final_few") : state.finishedReason === "host" ? T("final_host") : "";
  main.innerHTML = `<div class="screen final">
    <div class="panel sheet"><h2>${T("final_title")}<span>${escapeHtml(reason)}</span></h2>
      <div class="podium">${top.map((p, i) => (p ? `<div class="step ${cls[i]}" style="--pc:${p.color}"><i class="av">${escapeHtml(p.avatar)}</i><b>${escapeHtml(p.name)}</b><div class="sc">${p.score}</div><div class="col">${num[i]}</div></div>` : `<div class="step"></div>`)).join("")}</div>
      <div class="hostbtns">${isHost ? `<button class="start" id="again" type="button">${T("btn_again")}</button><button class="ghostbtn" id="tolobby" type="button">${T("btn_lobby")}</button>` : ""}<a class="ghostbtn homebtn" id="homebtn" href="index.html">${T("btn_home")}</a></div>
    </div>
    <div class="awards"><div class="awcards">${cards || `<div class="award sheet wide"><div class="a">${T("no_awards")}</div></div>`}</div>
      <div class="table sheet" id="ftable"><div class="kicker">${T("scores_what")}</div><ol class="${list.length > 8 ? "two" : ""}" style="grid-template-rows:repeat(${list.length > 8 ? Math.ceil(list.length / 2) : list.length}, auto)">${list.map((p, i) => `<li><span class="n">${i + 1}</span><i style="font-style:normal">${escapeHtml(p.avatar)}</i><b>${escapeHtml(p.name)}</b><span>${p.score}</span></li>`).join("")}</ol></div>
    </div></div>`;
  // сводка тянется до низа колонки: кегль — самый крупный, при котором все строки влезают
  fit($("ftable"), $("ftable"), "--tfs", 36, 12);
  if (isHost) {
    $("again").onclick = () => conn.send({ type: "start" });
    $("tolobby").onclick = () => conn.send({ type: "lobby" });
  }
  if (state.finishedReason === "done") qpSfx.fanfare();
}

// ---------- кадр: часы и раскрытие ----------
let lastTick = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead || !state.phaseEnd) return;
  const left = state.phaseEnd - qpNow();
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const clock = $("clock");
  const hot = left < 5000 && (state.phase === "lie" || state.phase === "choose");
  if (clock) { clock.textContent = state.phase === "reveal" ? "" : Math.max(0, Math.ceil(left / 1000)); clock.classList.toggle("hot", hot); }
  const tl = $("timeline");
  if (tl) { tl.firstChild.style.transform = `scaleX(${state.phase === "reveal" ? 0 : Math.max(0, Math.min(1, left / total))})`; tl.classList.toggle("hot", hot); }
  if (hot && left > 0) {
    const s = Math.ceil(left / 1000);
    if (s !== lastTick) { lastTick = s; qpSfx.tick(true); }
  }
  if (state.phase === "reveal") revealTick();
}

// ---------- отрисовка ----------
function render() {
  if (!state || dead) return;
  document.body.dataset.phase = state.phase;
  $("brand").innerHTML = escapeHtml(T("game_name")).replace(/!$/, "<em>!</em>");
  $("codechip").innerHTML = `<b>${escapeHtml(CODE)}</b>`;
  $("codechip").classList.toggle("hidden", state.phase === "lobby");
  const inGame = !["lobby", "finished"].includes(state.phase);
  $("roundchip").classList.toggle("hidden", !inGame);
  if (inGame && state.roundKey) $("roundchip").innerHTML = `${escapeHtml(tpl("round_n", { n: state.ri + 1 }))} · <b>${escapeHtml(qpRoundName(state.roundKey))}</b>`;
  $("endbtn").classList.toggle("hidden", !(isHost && inGame));
  $("endbtn").textContent = T("btn_end");
  switch (state.phase) {
    case "lobby": return drawLobby();
    case "intro": return drawIntro();
    case "topic": return drawTopic();
    case "lie": return drawLie();
    case "choose": return drawChoose();
    case "reveal": return drawReveal();
    case "scores": return drawScores();
    case "finished": return drawFinal();
  }
}
$("endbtn").onclick = () => conn.send({ type: "end" });

window.addEventListener("resize", () => { viewKey = ""; if (state) render(); });
window.addEventListener("langchange", () => {
  viewKey = "";
  // язык доски — язык банка фактов комнаты: в лобби ведущий переключает и факты
  if (isHost && state && (state.phase === "lobby" || state.phase === "finished") && state.settings.lang !== qpLang()) conn.send({ type: "settings", settings: { lang: qpLang() } });
  render();
});

// реакции: эмодзи взлетает снизу с именем
function floatReact(playerId, emoji) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const p = player(playerId);
  const f = el("div", "floater");
  f.style.left = (8 + Math.random() * 84) + "vw";
  f.append(el("span", null, emoji), el("small", null, p ? p.name : ""));
  document.body.append(f);
  setTimeout(() => f.remove(), 2700);
}

// ---------- связь ----------
function onMessage(m) {
  switch (m.type) {
    case "hello":
      state = m.state;
      if (!isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      state = m.state;
      render();
      break;
    case "host_ok":
      isHost = true;
      document.body.classList.add("host");
      viewKey = "";
      // язык доски главнее: комнату создали на одном языке, а доску переключили — синхронизируем
      if (state && state.phase === "lobby" && state.settings.lang !== qpLang()) conn.send({ type: "settings", settings: { lang: qpLang() } });
      render();
      break;
    case "host_lost":
      isHost = false;
      document.body.classList.remove("host");
      viewKey = "";
      render();
      break;
    case "event":
      if (m.event.type === "react") floatReact(m.event.playerId, m.event.emoji);
      break;
    case "error":
      if (m.error === "room_expired") gone();
      break;
  }
}

function gone() {
  dead = true;
  main.innerHTML = "";
  showBanner(T("expired"));
}

async function boot() {
  // ?h=токен — ссылка ведущего на другое устройство: токен кладём в хранилище и убираем из адреса
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  conn = qpConnect({
    code: CODE,
    onMessage,
    onGone: gone,
    onOpen: () => { isHost = false; },
    onState: (st) => { banner.textContent = T("err_connect"); banner.classList.toggle("on", st === "lost"); },
  });
  requestAnimationFrame(frame);
  // ручка для отладки и стенда: те же сообщения, что шлют кнопки доски
  window.qpBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
boot();
</script>
