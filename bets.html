      if (res.status === 404) { teardown(S0); stopped = true; o.onGone(); return; }
      if (!res.ok) throw new Error("session " + res.status);
      const data = await res.json();
      if (S0.closed) return;
      S0.sid = data.sid; opened(S0);
      for (const m of data.messages) deliver(S0, m);
      while (!S0.closed && S0.sid) {
        const r = await tf(S0, `/bets/api/poll?sid=${S0.sid}`, 28000);
        if (r.status === 410) throw new Error("gone");
        if (!r.ok) { await new Promise((z) => setTimeout(z, 1500)); continue; }

      const ws = S0.ws = new WebSocket(`${proto}://${location.host}/bets/ws?r=${encodeURIComponent(CODE)}`);
      S0.handshake = setTimeout(() => {
        if (S0.closed || S0.opened) return;
        wsBroken = true;
        try { ws.onclose = ws.onopen = ws.onmessage = null; ws.close(); } catch (e) {}
        S0.ws = null; poll(S0);
      }, 5000);

  window.addEventListener("online", () => api.probe());
  window.addEventListener("offline", () => api.netOffline());
  start();
  return api;
}

    <div class="wn">${won ? `<b>${esc(T("fin_stack", { n: fmt(p.stack) }))}</b>` : w ? esc(T("fin_winner", { name: w.name })) : ""}</div>
    <div class="board">${ranked.map((x, i) => `<div class="row${x.id === me ? " me" : ""}${x.alive ? "" : " out"}"><span class="pl">${i + 1}</span>${avatar(x)}<span class="nm">${esc(x.name)}</span><span class="s">${fmt(x.stack)}</span><span class="d"></span></div>`).join("")}</div>
    <div class="fine">${esc(T("fin_wait"))}</div></div>`;
  if (won) buzz([80, 50, 80, 50, 260]);
}

// ---------- диспетчер ----------
function render() {
  if (dead || !state) return;
  if (screen === "kicked") return;
  const p = mine();
  if (!p) {
    if (claimPrompt) return;
    if (!token && screen !== "enter") renderEnter(); // с токеном ждём ответа на join, а не мигаем формой
    return;
  }
  if (state.phase === "lobby") { draft = {}; curEv = ""; vibratedFor = ""; return renderLobby(); }
  if (state.phase === "done") return renderFinal(p);
  renderGame(p);
}
window.addEventListener("langchange", safe(() => {
  if (!CODE) return renderLanding();
  if (screen === "enter") return renderEnter();
  if (screen === "claim") return renderClaim();
  if (screen === "noroom") return renderNoRoom();
  if (screen === "expired") return renderExpired();
  midKey = slipKey = tabsKey = ""; app.dataset.key = "";
  if (screen === "game") { screen = null; }
  render();
}));
if (window.MP && MP.keyboardClass) { try { MP.keyboardClass({}); } catch (e) {} }

// ---------- связь ----------
function onMessage(m) {
  if (mpOn()) {
    if (m.type === "hello" && goneFlow) goneFlow.hello();
    if (m.type === "hello" && MP.applyHello(m) === false) { flow = tab = null; }
    else if (tab && tab.handle(m)) return;
    else if (flow && flow.handle(m)) return;
  }
  switch (m.type) {
    case "hello":
    case "state":
      state = m.state; stateAt = performance.now();
      if (m.type === "hello" && token && !me) { joinName = joinName || savedName(); doJoin(); }
      else if (m.type === "hello" && !me && flow && flow.state().prompting) flow.resume();
      render();
      break;
    case "joined":
      me = m.playerId; token = m.token; claimPrompt = null; screen = screen === "claim" ? null : screen;
      if (m.name) { joinName = m.name; lsSet("bets-name", m.name); if (m.renamed) { renamedTo = m.name; toast(m.name); } }
      lsSet(tokenKey(), token);
      render();
      if (outq && outq.size()) outq.flush((x) => !!state && (x.type === "submit" ? state.phase === "bets" : true), () => {});
      break;
    case "rejected": {
      const known = { too_fast: "rj_too_fast", phase: "rj_phase" };
      const txt = m.action === "chat" ? T("chat_fast") : T(known[m.reason] || "rj");
      toast(txt, true);
      if (m.action === "chat") { const i = $("chatin"); if (i && !i.value) i.value = lastChatText; chatAt = 0; }
      if (m.action === "bet" || m.action === "unbet" || m.action === "clear") { pendingUntil = 0; const p = mine(); if (p && p.draft) { draft = Object.assign({}, p.draft); paintGame(); } }
      if (m.action === "submit") { submittedLocal = false; clearTimeout(submitT); slipKey = ""; paintGame(); }
      break;
    }
    case "error":
      if (m.error === "room_expired") return onRoomGone();
      if (m.error === "too_fast") return toast(T("rj_too_fast"), true);
      if (["game_started", "room_full", "token_gone", "bad_name", "name_taken"].includes(m.error)) {
        if (m.error === "token_gone") { lsDel(tokenKey()); token = null; }
        joinErr = m.error === "bad_name" ? "err_name" : "err_" + m.error;
        me = null; renderEnter();
      }
      break;
    case "kicked":
      me = null; lsDel(tokenKey()); token = null; screen = "kicked";
      renderCenter("kicked_title", null, `<button class="btn" id="sitagain" type="button">${esc(T("kicked_again"))}</button>`); screen = "kicked";
      $("sitagain").onclick = () => { screen = null; joinErr = null; renderEnter(); };
      break;
    case "replaced":
      showReplaced();
      break;
  }
}
function showReplaced() {
  me = null;
  renderCenter("replaced_title", "replaced_text", `<button class="btn" id="here" type="button">${esc(T("btn_back_here"))}</button>`); screen = "replaced";
  $("here").onclick = () => { if (tab && tab.back()) return; doJoin(); };
}

function start() {
  if (!CODE) return renderLanding();
  renderCenter("wait_title");
  const banner = $("conn");
  net = createNet({
    onMessage,
    onGone: onRoomGone,
    onOpen: () => { me = null; }, // после переподключения снова садимся за место своим токеном (hello придёт первым)
    onQuiet: (q) => { banner.textContent = T("conn_quiet"); banner.classList.toggle("on", q); },
    onState: (st) => { if (st === "lost") { banner.textContent = T("conn_lost"); banner.classList.add("on"); } else if (st === "open") banner.classList.remove("on"); },
    onSendFail,
  });
}
if (window.MP) {
  flow = MP.joinFlow({
    send: (m) => net.send(m),
    buildJoin,
    onClaimPrompt: (c) => { claimPrompt = c; renderClaim(); },
    onRetry: () => { const e = $("err"); if (e && screen === "enter") e.textContent = T("seat_wait"); },
    onGiveUp: () => { joinErr = "err_name_taken"; me = null; renderEnter(); },
  });
  tab = MP.replacedTab({
    rejoin: () => doJoin(),
    onReplaced: showReplaced,
    onTokenGone: () => { lsDel(tokenKey()); token = null; me = null; joinErr = null; if (savedName()) { joinName = savedName(); doJoin(); } else renderEnter(); },
  });
}
start();
</script>
