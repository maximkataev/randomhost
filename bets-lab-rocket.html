<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Ставки · лаборатория: ракета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<style>
  :root {
    --bg: #07090c; --glass: #0d1217; --glass-2: #121a21; --line: #1f2b34; --text: #eef2ee; --dim: #7d8c93;
    --lime: #b6ff2e; --magenta: #ff2e88; --amber: #ffd34d;
    --disp: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); min-height: 100%; }
  body { font-family: var(--mono); display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 18px; padding: 14px 22px 10px; border-bottom: 1px solid var(--line); }
  .sign { font-family: var(--disp); font-weight: 900; font-size: 34px; letter-spacing: .14em; text-transform: uppercase; color: #fff;
    text-shadow: 0 0 4px #fff, 0 0 12px var(--magenta), 0 0 28px var(--magenta), 0 0 52px var(--magenta); animation: hum 5s infinite; }
  @keyframes hum { 0%, 92%, 96%, 100% { opacity: 1 } 93% { opacity: .55 } 95% { opacity: .85 } }
  .sub { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .spacer { flex: 1; }
  .live { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--lime); }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px var(--lime); animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25 } }
  main { flex: 1; display: grid; grid-template-columns: 372px 1fr; gap: 16px; padding: 16px 22px 22px; min-height: 0; }
  main > * { min-width: 0; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; padding: 12px 12px 18px; }
    .stage { order: -1; }
    .view { aspect-ratio: 3 / 4 !important; }
    header { flex-wrap: wrap; padding: 10px 14px 8px; gap: 6px 12px; }
    .sign { font-size: 26px; } .sub { display: none; } .say { font-size: 18px; } button { padding: 11px 14px; }
  }
  .board { background: var(--glass); border: 1px solid var(--line); padding-bottom: 12px; }
  .board h2 { font-family: var(--disp); font-weight: 800; font-size: 20px; letter-spacing: .1em; text-transform: uppercase; padding: 12px 14px 4px; display: flex; justify-content: space-between; align-items: baseline; }
  .board h2 small { font-family: var(--mono); font-size: 11px; color: var(--dim); font-weight: 700; letter-spacing: .06em; }
  .grp { padding: 10px 14px 4px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .mk { display: grid; grid-template-columns: 1fr 64px 84px; gap: 8px; align-items: center; padding: 6px 14px; border-top: 1px solid var(--line); transition: background .3s, opacity .3s; }
  .mk b { font-family: var(--disp); font-weight: 800; font-size: 22px; letter-spacing: .04em; }
  .mk .p { color: var(--dim); font-size: 12px; text-align: right; }
  .mk.hit { background: linear-gradient(90deg, rgba(182,255,46,.2), transparent 80%); }
  .mk.miss { opacity: .35; }
  .flap { display: inline-flex; gap: 2px; justify-content: center; }
  .flap span { position: relative; width: 15px; height: 25px; display: grid; place-items: center; background: linear-gradient(#232c33 50%, #1a2128 50%); color: var(--amber); font-weight: 800; font-size: 17px; border-radius: 2px; font-variant-numeric: tabular-nums; }
  .flap span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #000; opacity: .7; }
  .flap span.dot { width: 8px; background: none; } .flap span.dot::after { display: none; }
  .flap span.flip { animation: flip .38s cubic-bezier(.3,.1,.3,1); }
  @keyframes flip { 0% { transform: rotateX(-95deg); filter: brightness(.4) } 100% { transform: rotateX(0); filter: none } }
  .mk.hit .flap span { color: var(--lime); }

  .mine { padding: 4px 14px 8px; }
  .mine .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .mine input[type=range] { flex: 1; accent-color: var(--lime); }
  .mine .big { font-family: var(--disp); font-weight: 900; font-size: 34px; color: var(--lime); min-width: 92px; text-align: right; text-shadow: 0 0 14px rgba(182,255,46,.4); }
  .mine .calc { font-size: 12px; color: var(--dim); line-height: 1.6; margin-top: 4px; }
  .mine .calc b { color: var(--text); }
  .pl { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 6px 14px; border-top: 1px solid var(--line); font-size: 12px; transition: background .3s; }
  .pl .av { width: 24px; height: 24px; display: grid; place-items: center; font: 900 14px var(--disp); color: #07090c; }
  .pl .nm { font-family: var(--disp); font-weight: 800; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; }
  .pl .nm small { font: 500 11px var(--mono); color: var(--dim); margin-left: 6px; text-transform: none; letter-spacing: 0; }
  .pl .st { font-weight: 800; letter-spacing: .06em; color: var(--dim); text-align: right; }
  .pl.ok { background: linear-gradient(90deg, rgba(182,255,46,.2), transparent 80%); } .pl.ok .st { color: var(--lime); }
  .pl.burn { background: linear-gradient(90deg, rgba(255,46,136,.2), transparent 80%); } .pl.burn .st { color: var(--magenta); }

  .stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .view { position: relative; background: #000; border: 1px solid var(--line); aspect-ratio: 16 / 10; width: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .count { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-family: var(--disp); font-weight: 900; font-size: min(26vw, 260px); color: #fff;
    text-shadow: 0 0 8px #fff, 0 0 30px var(--magenta), 0 0 70px var(--magenta); opacity: 0; }
  .count.on { animation: pop .8s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(1.7) } 18% { opacity: 1 } 100% { opacity: 0; transform: scale(.85) } }
  .stamp { position: absolute; left: 56%; top: 46%; transform: translate(-50%, -50%) rotate(-4deg); font-family: var(--disp); font-weight: 900; font-size: min(10vw, 110px); letter-spacing: .06em; text-transform: uppercase;
    color: #fff; text-shadow: 0 0 6px #fff, 0 0 24px var(--magenta), 0 0 54px var(--magenta); opacity: 0; pointer-events: none; white-space: nowrap; }
  .stamp.on { animation: stamp 2.4s ease-out forwards; }
  @keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scale(2.4) } 10% { opacity: 1; transform: translate(-50%, -50%) rotate(-4deg) scale(1) } 80% { opacity: 1 } 100% { opacity: 0 } }
  .say { font-family: var(--disp); font-weight: 700; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; min-height: 30px; }
  .say em { font-style: normal; color: var(--lime); }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: 800 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #06090b; background: var(--lime); border: 0; padding: 11px 18px; cursor: pointer; border-bottom: 3px solid #6c9e10; }
  button.ghost { background: var(--glass-2); color: var(--text); border-bottom-color: #000; }
  button:active { transform: translateY(2px); border-bottom-width: 1px; }
  label { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .hint { font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="sign">Тотализатор</div>
  <div class="sub">лаборатория · ракета · не в деплое</div>
  <div class="spacer"></div>
  <div class="live"><i></i>LIVE</div>
</header>

<main>
  <section class="board" aria-label="Табло ракеты">
    <h2><span>Долетит до…</span><small>цель = коэффициент</small></h2>
    <div id="mk"></div>
    <div class="grp">Своя цель</div>
    <div class="mine">
      <div class="row"><input type="range" id="tg" min="0" max="1000" value="256"><div class="big" id="tgBig">×3,00</div></div>
      <div class="calc" id="calc"></div>
    </div>
    <div class="grp">Купоны игроков</div>
    <div id="pl"></div>
  </section>

  <section class="stage">
    <div class="view" id="view">
      <canvas id="cv"></canvas>
      <div class="count" id="count">3</div>
      <div class="stamp" id="stamp">Взрыв</div>
    </div>
    <div class="say" id="say">Нажми <em>«Запуск»</em></div>
    <div class="ctl">
      <button id="go">Запуск</button>
      <label><input type="checkbox" id="fast"> ×2 быстрее</label>
      <span class="hint">рынки и точки взрыва — из настоящего движка (bets/events/rocket.js); в демо-подборку добавлены несколько дальних полётов</span>
    </div>
  </section>
</main>

<script src="bets-lab-rocket-data.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const D = window.LAB_ROCKET;
const GROWTH = 0.2;                 // d ln M / dt, как в спеке §4.4
const kc2 = (kc) => (kc / 100).toFixed(2).replace(".", ",");
const fmtX = (x) => "×" + x.toFixed(2).replace(".", ",");
const rng = (a, b) => a + Math.random() * (b - a);

// ---------- split-flap ----------
function setFlap(el, text) {
  const prev = el._t || ""; if (prev === text) return;
  el._t = text; el.innerHTML = "";
  [...text].forEach((ch, i) => { const s = document.createElement("span"); s.textContent = ch; if (ch === ",") s.className = "dot"; if (prev[i] !== ch) { s.classList.add("flip"); s.style.animationDelay = (i * 0.05) + "s"; } el.appendChild(s); });
}

// ---------- табло рынков ----------
const mkEls = {};
function buildMarkets() {
  const box = $("mk"); box.innerHTML = "";
  D.markets.filter((m) => m.id.startsWith("target:")).forEach((m) => {
    const x = parseFloat(m.id.slice(7));
    const d = document.createElement("div"); d.className = "mk";
    d.innerHTML = `<b>×${String(x).replace(".", ",")}</b><div class="p">${(m.p * 100).toFixed(1).replace(".", ",")}%</div><div class="flap"></div>`;
    box.appendChild(d); mkEls[x] = d; setFlap(d.querySelector(".flap"), kc2(m.kc));
  });
  const inst = D.markets.find((m) => m.id === "instant");
  if (inst) { const d = document.createElement("div"); d.className = "mk"; d.innerHTML = `<b>Взрыв на старте</b><div class="p">${(inst.p * 100).toFixed(1).replace(".", ",")}%</div><div class="flap"></div>`; box.appendChild(d); mkEls.instant = d; setFlap(d.querySelector(".flap"), kc2(inst.kc)); }
}

// ---------- своя цель: p = (1−e)/x, k = x ----------
const tgToX = (v) => Math.round(Math.exp(Math.log(1.2) + (Math.log(100) - Math.log(1.2)) * v / 1000) * 100) / 100;
function updateMine() {
  const x = tgToX(+$("tg").value);
  $("tgBig").textContent = fmtX(x);
  const p = (1 - D.edge) / x;
  $("calc").innerHTML = `Шанс долететь: <b>${(p * 100).toFixed(2).replace(".", ",")}%</b><br>Ставка 100 → выигрыш <b>${Math.floor(100 * x)}</b>, ожидание на 100: <b>${(p * Math.floor(100 * x)).toFixed(1).replace(".", ",")}</b> (${((1 - p * x) * 100).toFixed(1).replace(".", ",")}% маржа)`;
  state.myTarget = x;
}
$("tg").addEventListener("input", updateMine);

// ---------- игроки (демо-купоны) ----------
const NAMES = ["Маша", "Петя", "Лена", "Гриша", "Оля", "Влад", "Тим", "Соня"];
const COLORS = ["#ff2e88", "#b6ff2e", "#38d3ff", "#ffd34d", "#a78bfa", "#ff7a2e", "#4dffb0", "#ff5c5c"];
function makePlayers() {
  const targets = [];
  const pool = [1.3, 1.5, 1.8, 2, 2.4, 3, 3.5, 4.5, 6, 8, 12, 20];
  while (targets.length < 5) targets.push(pool[Math.floor(Math.random() * pool.length)] * (1 + Math.floor(Math.random() * 3) * 0.01));
  const nm = NAMES.slice().sort(() => Math.random() - 0.5);
  const ps = targets.map((x, i) => ({ name: nm[i], color: COLORS[(NAMES.indexOf(nm[i]))], x: Math.round(x * 100) / 100, stake: [50, 100, 100, 200, 300][i] * 1, status: "play" }));
  ps.push({ name: "Ты", color: "#ffffff", x: state.myTarget, stake: 100, status: "play", mine: true });
  return ps.sort((a, b) => a.x - b.x);
}
function renderPlayers() {
  $("pl").innerHTML = state.players.map((p, i) => {
    const cls = p.status === "ok" ? "ok" : p.status === "burn" ? "burn" : "";
    const st = p.status === "ok" ? "+" + Math.floor(p.stake * p.x - p.stake) : p.status === "burn" ? "−" + p.stake : "в полёте";
    return `<div class="pl ${cls}" id="pl${i}"><div class="av" style="background:${p.color}">${p.name[0]}</div><div class="nm">${p.name}<small>×${String(p.x).replace(".", ",")} · ${p.stake}</small></div><div class="st">${st}</div></div>`;
  }).join("");
}

// ---------- состояние ----------
const state = { phase: "idle", t: 0, M: 1, crash: 1, idx: -1, ts: 1, myTarget: 3, players: [], flames: [], smoke: [], sparks: [], stars: [], clouds: [], shake: 0, flash: 0, bg: 0, ringT: -1, debris: [], floats: [], said: {}, alt: 0, igniteT: 0 };
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, SC = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const b = cv.getBoundingClientRect();
  W = Math.max(300, Math.round(b.width)); H = Math.max(240, Math.round(b.height));
  cv.width = W * DPR; cv.height = H * DPR;
  SC = Math.min(W / 1100, H / 690);
}
window.addEventListener("resize", resize);
function say(h) { $("say").innerHTML = h; }
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
{ const r = mulberry(11); for (let i = 0; i < 160; i++) state.stars.push({ x: r(), y: r(), z: 0.2 + r() * 0.8, tw: r() * 6 }); for (let i = 0; i < 9; i++) state.clouds.push({ x: r(), y: r(), w: 0.2 + r() * 0.3 }); }

// шкала: y(M) — положение отметки на экране, текущий множитель держим на уровне ракеты
const ROCKET_X = () => W * 0.58, ROCKET_Y = () => H * 0.62;
const PX_LN = () => H * 0.3;
const yOf = (M) => ROCKET_Y() - (Math.log(M) - Math.log(state.M)) * PX_LN();

// ---------- рисование ----------
function drawSky(now) {
  const k = Math.min(1, Math.log(state.M) / 3.2);       // выше — глубже космос
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const lerp = (a, b, t) => Math.round(a + (b - a) * t);
  g.addColorStop(0, `rgb(${lerp(14, 3, k)},${lerp(10, 4, k)},${lerp(34, 12, k)})`);
  g.addColorStop(0.6, `rgb(${lerp(70, 10, k)},${lerp(26, 8, k)},${lerp(70, 30, k)})`);
  g.addColorStop(1, `rgb(${lerp(255, 40, k)},${lerp(70, 18, k)},${lerp(130, 70, k)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // звёзды: параллакс по высоте
  const speed = (state.phase === "fly" ? 60 + 26 * Math.min(state.M, 25) : 8) * SC;
  state.alt += speed * (state._dt || 0.016);
  for (const s of state.stars) {
    const y = ((s.y * H + state.alt * s.z * 0.5) % H + H) % H;
    const a = (0.35 + 0.65 * Math.abs(Math.sin(now * 1.5 + s.tw))) * (0.4 + k * 0.6);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    const len = state.phase === "fly" ? Math.min(26, speed * 0.03 * s.z) : 0;
    ctx.fillRect(s.x * W, y, 1.5 + s.z, 1.5 + s.z + len);
  }
  // облака у земли
  if (state.M < 3) {
    ctx.fillStyle = `rgba(255,170,220,${0.16 * (1 - k)})`;
    for (const c of state.clouds) { const y = ((c.y * H * 1.2 + state.alt * 1.0) % (H * 1.2)); ctx.beginPath(); ctx.ellipse(c.x * W, y, c.w * W * 0.5, 18 * SC, 0, 0, 6.3); ctx.fill(); }
  }
}

function drawGround(now) {
  // стартовая площадка уезжает вниз вместе с высотой
  const off = Math.log(state.M) * PX_LN();
  const gy = ROCKET_Y() + 62 * SC + off;
  if (gy > H + 40) return;
  ctx.fillStyle = "#0a0c12"; ctx.fillRect(0, gy, W, H - gy + 80);
  ctx.fillStyle = "#171a26"; ctx.fillRect(0, gy, W, 6);
  // неоновая кромка площадки
  ctx.strokeStyle = "#b6ff2e"; ctx.shadowColor = "#b6ff2e"; ctx.shadowBlur = 14; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, gy + 1); ctx.lineTo(W, gy + 1); ctx.stroke(); ctx.shadowBlur = 0;
  // пусковая башня
  const tx = ROCKET_X() - 110 * SC;
  ctx.fillStyle = "#11151f"; ctx.fillRect(tx, gy - 210 * SC, 26 * SC, 210 * SC);
  ctx.strokeStyle = "#2b3547"; ctx.lineWidth = 2; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(tx, gy - i * 24 * SC); ctx.lineTo(tx + 26 * SC, gy - (i + 1) * 24 * SC); ctx.stroke(); }
  ctx.fillStyle = "#ff2e88"; ctx.fillRect(tx + 8 * SC, gy - 218 * SC, 10 * SC, 8 * SC);
  ctx.fillStyle = (Math.floor(now * 2) % 2) ? "#ff2e88" : "#3a1020"; ctx.beginPath(); ctx.arc(tx + 13 * SC, gy - 224 * SC, 4 * SC, 0, 6.3); ctx.fill();
  // силуэт города
  ctx.fillStyle = "#0d101a";
  for (let i = 0; i < 18; i++) { const bx = i * (W / 17) - 20, bh = (28 + ((i * 53) % 70)) * SC; ctx.fillRect(bx, gy - bh, W / 17 - 6, bh); }
}

function drawRocket(x, y, s, tilt, thrust, alive) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(s, s);
  // пламя
  if (thrust > 0) {
    const fl = 40 + thrust * 70 + Math.random() * 18 * thrust;
    const g = ctx.createLinearGradient(0, 40, 0, 40 + fl);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.25, "#ffe27a"); g.addColorStop(0.6, "#ff5a2e"); g.addColorStop(1, "rgba(255,46,136,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-13, 40); ctx.quadraticCurveTo(-20 - thrust * 4, 40 + fl * 0.6, 0, 40 + fl); ctx.quadraticCurveTo(20 + thrust * 4, 40 + fl * 0.6, 13, 40); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = "lighter"; const gl = ctx.createRadialGradient(0, 56, 0, 0, 56, 90 + thrust * 60); gl.addColorStop(0, "rgba(255,150,60,.45)"); gl.addColorStop(1, "rgba(255,46,136,0)"); ctx.fillStyle = gl; ctx.fillRect(-160, -80, 320, 360); ctx.globalCompositeOperation = "source-over";
  }
  // стабилизаторы
  ctx.fillStyle = "#b6ff2e";
  ctx.beginPath(); ctx.moveTo(-14, 6); ctx.lineTo(-40, 50); ctx.lineTo(-14, 40); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(14, 6); ctx.lineTo(40, 50); ctx.lineTo(14, 40); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#86c21f"; ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(-7, 50); ctx.lineTo(7, 50); ctx.closePath(); ctx.fill();
  // корпус
  const bg = ctx.createLinearGradient(-20, 0, 20, 0); bg.addColorStop(0, "#9aa6b2"); bg.addColorStop(0.45, "#fbfdff"); bg.addColorStop(1, "#8a95a3");
  ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(0, -78); ctx.bezierCurveTo(26, -50, 22, 0, 20, 42); ctx.lineTo(-20, 42); ctx.bezierCurveTo(-22, 0, -26, -50, 0, -78); ctx.closePath(); ctx.fill();
  // носовой конус
  ctx.fillStyle = "#ff2e88"; ctx.beginPath(); ctx.moveTo(0, -78); ctx.bezierCurveTo(14, -62, 17, -52, 19, -46); ctx.lineTo(-19, -46); ctx.bezierCurveTo(-17, -52, -14, -62, 0, -78); ctx.closePath(); ctx.fill();
  // иллюминатор
  ctx.fillStyle = "#101820"; ctx.beginPath(); ctx.arc(0, -14, 11, 0, 6.3); ctx.fill();
  ctx.fillStyle = "#38d3ff"; ctx.beginPath(); ctx.arc(-2, -16, 7.5, 0, 6.3); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(-5, -19, 2.6, 0, 6.3); ctx.fill();
  // полосы и сопло
  ctx.fillStyle = "#b6ff2e"; ctx.fillRect(-21, 18, 42, 5);
  ctx.fillStyle = "#2b3140"; ctx.fillRect(-14, 40, 28, 8);
  ctx.restore();
}

function drawRuler(now) {
  const rx = Math.max(66, 78 * SC + 10);
  ctx.fillStyle = "rgba(6,8,12,.72)"; ctx.fillRect(0, 0, rx + 20, H);
  ctx.strokeStyle = "#2b3a46"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, H); ctx.stroke();
  const ticks = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 7, 10, 15, 20, 30, 50, 70, 100, 150, 200, 300, 500, 1000];
  ctx.textAlign = "right"; ctx.font = `800 ${13 * Math.max(0.8, SC)}px "JetBrains Mono", monospace`;
  for (const m of ticks) {
    const y = yOf(m); if (y < -10 || y > H + 10) continue;
    const major = [2, 5, 10, 20, 50, 100].includes(m);
    ctx.strokeStyle = major ? "rgba(255,255,255,.55)" : "rgba(255,255,255,.22)"; ctx.lineWidth = major ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(rx - (major ? 16 : 9), y); ctx.lineTo(rx, y); ctx.stroke();
    ctx.fillStyle = major ? "#fff" : "#8f9aa3"; ctx.fillText("×" + m, rx - 22, y + 4);
  }
  ctx.textAlign = "left";
  // отметки игроков: пунктир до ракеты и чип с именем
  const ry = ROCKET_Y();
  let prevY = -99, shiftN = 0;
  state.players.forEach((p, i) => {
    const y = yOf(p.x); if (y < -20 || y > H + 20) return;
    shiftN = Math.abs(y - prevY) < 24 * Math.max(0.85, SC) ? shiftN + 1 : 0; prevY = y;
    const done = p.status === "ok", burn = p.status === "burn";
    const col = done ? "#b6ff2e" : burn ? "#ff2e88" : p.color;
    ctx.strokeStyle = col; ctx.globalAlpha = done ? 0.9 : burn ? 0.5 : 0.55; ctx.lineWidth = done ? 2.5 : 1.5; ctx.setLineDash(done ? [] : [5, 6]);
    ctx.beginPath(); ctx.moveTo(rx, y); ctx.lineTo(W - 12, y); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    // чип
    const label = `${p.name} ×${String(p.x).replace(".", ",")}`;
    ctx.font = `800 ${14 * Math.max(0.85, SC)}px "Big Shoulders Display", Impact, sans-serif`;
    const tw = ctx.measureText(label).width + 22, th = 22 * Math.max(0.85, SC), cx = rx + 14 + shiftN * (tw + 8), cy = y - th / 2;
    ctx.fillStyle = done ? "#b6ff2e" : burn ? "#4a1530" : "rgba(8,10,14,.9)"; ctx.fillRect(cx, cy, tw, th);
    ctx.fillStyle = p.color; ctx.fillRect(cx, cy, 5, th);
    ctx.fillStyle = done ? "#07090c" : burn ? "#ff9ac4" : "#fff"; ctx.fillText(label + (done ? " ✓" : burn ? " ✗" : ""), cx + 11, cy + th * 0.74);
  });
  // стрелка текущего множителя
  const y = ry;
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(rx + 2, y); ctx.lineTo(rx + 16, y - 7); ctx.lineTo(rx + 16, y + 7); ctx.fill();
}

function drawBigX(now) {
  const M = state.M;
  const hot = Math.min(1, Math.log(M) / 3);
  const col = state.phase === "boom" || state.phase === "result" ? "#ff2e88" : hot < 0.5 ? "#b6ff2e" : hot < 0.85 ? "#ffd34d" : "#ff7a2e";
  const size = (86 + Math.min(1, Math.log(Math.max(1.001, M)) / 3) * 40) * SC;
  ctx.font = `900 ${size}px "Big Shoulders Display", Impact, sans-serif`; ctx.textAlign = "center";
  ctx.shadowColor = col; ctx.shadowBlur = 24 + 20 * hot; ctx.fillStyle = "#fff";
  const shakeX = (Math.random() - 0.5) * state.shake * 5, shakeY = (Math.random() - 0.5) * state.shake * 4;
  ctx.fillText(fmtX(M), W * 0.58 + shakeX, H * 0.2 + shakeY);
  ctx.shadowBlur = 0; ctx.fillStyle = col; ctx.globalAlpha = 0.32; ctx.fillText(fmtX(M), W * 0.58 + shakeX, H * 0.2 + shakeY); ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

function spawnFlame(x, y, thrust) {
  if (state.smoke.length > 260) return;
  for (let i = 0; i < 2; i++) state.smoke.push({ x: x + rng(-8, 8) * SC, y: y + 48 * SC, vx: rng(-20, 20), vy: rng(60, 140) + thrust * 80, r: rng(5, 11) * SC, life: rng(0.7, 1.4), age: 0, hot: Math.random() < 0.35 });
}
function explode(x, y) {
  state.phase = "boom";
  state.flash = 1; state.shake = 3; state.ringT = 0;
  for (let i = 0; i < 90; i++) { const a = rng(0, 6.283), s = rng(80, 520); state.sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rng(0.6, 1.6), age: 0, c: ["#ffffff", "#ffd34d", "#ff7a2e", "#ff2e88", "#b6ff2e"][Math.floor(rng(0, 5))], r: rng(2, 5) * SC }); }
  for (let i = 0; i < 12; i++) state.debris.push({ x, y, vx: rng(-260, 260), vy: rng(-380, 100), rot: rng(0, 6), vr: rng(-8, 8), w: rng(8, 22) * SC, c: ["#fbfdff", "#ff2e88", "#b6ff2e", "#9aa6b2"][i % 4], life: 2 });
  // финал: кто долетел, кто сгорел
  state.players.forEach((p, i) => { if (p.status === "play") p.status = p.x <= state.crash + 1e-9 ? "ok" : "burn"; });
  renderPlayers();
  const st = $("stamp"); st.textContent = state.crash <= 1.0001 ? "Взрыв на старте" : "Взрыв!"; st.className = "stamp"; void st.offsetWidth; st.classList.add("on");
  // подсветка рынков: выигравшие цели
  Object.entries(mkEls).forEach(([x, el]) => { if (x === "instant") el.className = "mk " + (state.crash <= 1.0001 ? "hit" : "miss"); else el.className = "mk " + (parseFloat(x) <= state.crash ? "hit" : "miss"); });
  const winners = state.players.filter((p) => p.status === "ok").length;
  say(state.crash <= 1.0001 ? "Ракета взорвалась <em>на старте</em>!" : `Взрыв на <em>${fmtX(state.crash)}</em>. Долетели ${winners} из ${state.players.length}`);
  setTimeout(() => { state.phase = "result"; }, 2200);
}

let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!W) resize();
  const now = ts / 1000;
  const dtReal = Math.min(0.05, now - (last || now)); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // время полёта и замедление перед чьей-то целью
  let target = $("fast").checked ? 2 : 1;
  if (state.phase === "fly") {
    const next = state.players.find((p) => p.status === "play" && p.x > state.M);
    if (next && next.x / state.M < 1.045 && next.x <= state.crash + 0.2) target *= 0.55;
    if (state.crash / state.M < 1.04) target *= 0.5;   // до взрыва совсем близко: тишина перед ударом
  }
  state.ts += (target - state.ts) * Math.min(1, dtReal * 6);
  const dt = dtReal * state.ts; state._dt = dtReal;

  if (state.phase === "fly") {
    state.t += dt;
    state.M = Math.exp(GROWTH * state.t);
    state.shake = Math.min(1.6, Math.log(state.M) / 2.2);
    // цели, которые только что пересекли
    state.players.forEach((p, i) => { if (p.status === "play" && state.M >= p.x) { p.status = "ok"; state.floats.push({ txt: `+${Math.floor(p.stake * p.x - p.stake)}`, y: yOf(p.x), t: 0, c: p.color }); say(`<em>${p.name}</em> долетел до ${fmtX(p.x)}!`); renderPlayers(); } });
    const mt = state.myTarget;
    if (state.M >= state.crash) { state.M = state.crash; explode(ROCKET_X(), ROCKET_Y()); }
    if (state.t > 1.2 && !state.said.s1) { state.said.s1 = 1; say("Ракета набирает высоту… <em>держитесь!</em>"); }
    if (state.M > 4 && !state.said.s4) { state.said.s4 = 1; say(`Уже <em>${fmtX(state.M)}</em> — остались самые смелые`); }
    if (state.M > 10 && !state.said.s10) { state.said.s10 = 1; say("Десятикратный! <em>Это уже безумие.</em>"); }
  } else if (state.phase === "ignite") {
    state.igniteT += dt; state.shake = Math.min(1.2, state.igniteT * 1.1);
    if (state.igniteT > 0.9) { state.phase = "fly"; state.t = 0; state.shake = 0; if (state.crash <= 1.0001) { state.M = 1; explode(ROCKET_X(), ROCKET_Y()); } }
  }
  state.shake = Math.max(0, state.shake - (state.phase === "fly" || state.phase === "ignite" ? 0 : dtReal * 2));

  // камера с тряской
  ctx.save();
  const sh = state.shake * SC;
  ctx.translate((Math.random() - 0.5) * 6 * sh, (Math.random() - 0.5) * 5 * sh);
  drawSky(now);
  drawGround(now);

  // дым и огонь
  const thrust = state.phase === "fly" ? Math.min(1, 0.45 + Math.log(state.M) / 3) : state.phase === "ignite" ? 0.35 : 0;
  if (thrust > 0) spawnFlame(ROCKET_X(), ROCKET_Y(), thrust);
  for (let i = state.smoke.length - 1; i >= 0; i--) {
    const s = state.smoke[i]; s.age += dtReal; if (s.age > s.life) { state.smoke.splice(i, 1); continue; }
    s.x += s.vx * dtReal; s.y += s.vy * dtReal * (state.phase === "fly" ? 1 : 0.6) ;
    const a = 1 - s.age / s.life;
    ctx.fillStyle = s.hot ? `rgba(255,${Math.round(120 + a * 100)},60,${a * 0.55})` : `rgba(200,190,215,${a * 0.28})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (1 + (1 - a) * 1.6), 0, 6.3); ctx.fill();
  }

  // ракета: слегка колеблется, чем выше — тем сильнее
  if (state.phase !== "boom" && state.phase !== "result" || false) {
    const tilt = Math.sin(now * 17) * 0.012 * state.shake;
    drawRocket(ROCKET_X() + (Math.random() - 0.5) * state.shake * 3, ROCKET_Y() + (state.phase === "idle" || state.phase === "count" ? 0 : (Math.random() - 0.5) * state.shake * 2), 1.0 * SC, tilt, thrust, true);
  }

  // взрыв
  if (state.ringT >= 0) {
    state.ringT += dtReal; const r = state.ringT * 700 * SC, a = Math.max(0, 1 - state.ringT / 0.7);
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 8 * a * SC + 1; ctx.beginPath(); ctx.arc(ROCKET_X(), ROCKET_Y(), r, 0, 6.3); ctx.stroke();
    ctx.strokeStyle = `rgba(255,46,136,${a})`; ctx.lineWidth = 4 * a * SC + 1; ctx.beginPath(); ctx.arc(ROCKET_X(), ROCKET_Y(), r * 0.75, 0, 6.3); ctx.stroke();
    if (a <= 0) state.ringT = -1;
  }
  ctx.globalCompositeOperation = "lighter";
  for (let i = state.sparks.length - 1; i >= 0; i--) {
    const s = state.sparks[i]; s.age += dtReal; if (s.age > s.life) { state.sparks.splice(i, 1); continue; }
    s.vy += 420 * dtReal; s.vx *= 0.99; s.x += s.vx * dtReal; s.y += s.vy * dtReal;
    ctx.globalAlpha = 1 - s.age / s.life; ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  for (let i = state.debris.length - 1; i >= 0; i--) {
    const d = state.debris[i]; d.life -= dtReal; if (d.life <= 0) { state.debris.splice(i, 1); continue; }
    d.vy += 520 * dtReal; d.x += d.vx * dtReal; d.y += d.vy * dtReal; d.rot += d.vr * dtReal;
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot); ctx.globalAlpha = Math.min(1, d.life); ctx.fillStyle = d.c; ctx.fillRect(-d.w / 2, -d.w / 4, d.w, d.w / 2); ctx.restore();
  }
  ctx.globalAlpha = 1;

  drawRuler(now);
  // всплывающие выигрыши
  for (let i = state.floats.length - 1; i >= 0; i--) {
    const f = state.floats[i]; f.t += dtReal; if (f.t > 1.4) { state.floats.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - f.t / 1.4; ctx.fillStyle = "#b6ff2e"; ctx.font = `900 ${28 * Math.max(0.9, SC)}px "Big Shoulders Display", Impact, sans-serif`;
    ctx.fillText(f.txt, W * 0.58 + 70 * SC, f.y - f.t * 50); ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawBigX(now);

  // вспышка и виньетка
  if (state.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85, state.flash)})`; ctx.fillRect(0, 0, W, H); state.flash -= dtReal * 2.4; }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.5)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

// ---------- ход ----------
function launch() {
  if (state.phase === "count" || state.phase === "ignite" || state.phase === "fly" || state.phase === "boom") return;
  state.idx = (state.idx + 1) % D.crashes.length;
  state.crash = D.crashes[state.idx];
  state.players = makePlayers();
  state.M = 1; state.t = 0; state.said = {}; state.smoke.length = 0; state.sparks.length = 0; state.debris.length = 0; state.floats.length = 0; state.alt = 0; state.igniteT = 0; state.ringT = -1; state.flash = 0; state.shake = 0;
  Object.values(mkEls).forEach((e) => (e.className = "mk"));
  renderPlayers();
  state.phase = "count";
  say("Ракета на старте. <em>Ставки закрыты.</em>");
  let n = 3;
  const tick = () => {
    const c = $("count"); c.textContent = n > 0 ? n : "ПУСК"; c.className = "count"; void c.offsetWidth; c.classList.add("on");
    if (n > 0) { n--; setTimeout(tick, 800); } else { state.phase = "ignite"; }
  };
  tick();
}
$("go").onclick = launch;
window.labLaunch = launch; window.labState = state;
buildMarkets(); updateMine(); state.players = makePlayers(); renderPlayers();
requestAnimationFrame(frame);
</script>
</body>
