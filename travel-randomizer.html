<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Рандомное место для путешествия — куда поехать?</title>
  <meta name="description" content="✈️ Рандомайзер путешествий: выбери регион — Европа, Азия, Америка, Африка, Океания — и получи случайное направление из 1800 мест на посадочном талоне." data-i18n-meta="meta_desc">
  <meta name="robots" content="index,follow">

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png" type="image/png">

  <meta name="theme-color" content="#0a1421">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --ink: #0a1421;
      --ink-2: #101f31;
      --paper: #f7f3ea;
      --paper-2: #ebe3d4;
      --amber: #ffb703;
      --amber-deep: #fb8500;
      --teal: #2ec4b6;
      --line: rgba(255, 255, 255, 0.14);

      /* размеры названия: подбирается автоматически в пределах min..max */
      --name-max: 50px;
      --name-min: 15px;
      --name-box: 80px;
      --note-box: 21px;
      --muted: #8ea0b5;
      --pass-ink: #17202b;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      background: var(--ink);
      color: #e8eef6;
      font-family: 'Roboto', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: calc(58px + var(--safe-top)) calc(18px + var(--safe-right)) calc(26px + var(--safe-bottom)) calc(18px + var(--safe-left));
      display: flex;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Фон: ночное небо, сетка-«карта», световые пятна */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(1100px 620px at 12% -8%, rgba(255, 183, 3, 0.16), transparent 62%),
        radial-gradient(900px 540px at 92% 108%, rgba(46, 196, 182, 0.16), transparent 60%),
        linear-gradient(180deg, #0a1421 0%, #0c1a2b 55%, #08111c 100%);
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.14) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: 0.22;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 100%);
    }

    .arcs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }

    .arcs path {
      fill: none;
      stroke: rgba(255, 255, 255, 0.22);
      stroke-width: 1.2;
      stroke-dasharray: 5 9;
    }

    /* Кнопка домой */
    .home-button {
      position: fixed;
      top: calc(14px + var(--safe-top));
      left: calc(14px + var(--safe-left));
      z-index: 90;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #dbe6f2;
      text-decoration: none;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
    }

    .home-button:hover { background: rgba(255, 255, 255, 0.14); color: #fff; transform: translateY(-1px); }

    .wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Шапка */
    
    
    
    
    /* Панель управления */
    .controls {
      margin-top: 18px;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .chips {
      max-width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px 9px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: #cfdcea;
      cursor: pointer;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.14s ease;
    }

    .chip .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      color: #9fb3c8;
    }

    .chip .num {
      font-variant-numeric: tabular-nums;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0;
    }

    .chip:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-1px); }

    .chip.active {
      background: linear-gradient(180deg, var(--amber), var(--amber-deep));
      border-color: rgba(255, 183, 3, 0.6);
      color: #241a02;
      box-shadow: 0 8px 22px rgba(251, 133, 0, 0.28);
    }

    .chip.active .code { background: rgba(0, 0, 0, 0.16); color: #3a2a04; }
    .chip.active .num { color: rgba(36, 26, 2, 0.62); }

    .kinds { gap: 6px; }

    .kind-btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px dashed rgba(255, 255, 255, 0.22);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.6px;
      transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .kind-btn:hover { color: #dce8f5; border-color: rgba(255, 255, 255, 0.4); }

    .kind-btn.active {
      color: var(--teal);
      border-color: rgba(46, 196, 182, 0.55);
      border-style: solid;
      background: rgba(46, 196, 182, 0.1);
    }

    /* ===== ПОСАДОЧНЫЙ ТАЛОН ===== */
    .pass {
      margin-top: 20px;
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: 1fr 168px;
      background: var(--paper);
      color: var(--pass-ink);
      border-radius: 18px;
      position: relative;
      box-shadow:
        0 30px 60px -22px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: box-shadow 0.4s ease, transform 0.4s ease;
    }

    .pass.settled {
      box-shadow:
        0 30px 70px -20px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 183, 3, 0.35),
        0 0 60px -10px rgba(255, 183, 3, 0.35);
    }

    .pass.shake { animation: passShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

    @keyframes passShake {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0); }
      15% { transform: translate3d(-5px, 2px, 0) rotate(-0.5deg); }
      35% { transform: translate3d(4px, -2px, 0) rotate(0.4deg); }
      55% { transform: translate3d(-3px, 1px, 0) rotate(-0.3deg); }
      75% { transform: translate3d(2px, 0, 0) rotate(0.15deg); }
    }

    .pass-main {
      padding: 18px 24px 16px;
      position: relative;
      min-width: 0;
      overflow: hidden;
      border-radius: 18px 0 0 18px;
      min-height: 296px;
      display: flex;
      flex-direction: column;
    }

    /* линия отрыва + «пробитые» отверстия */
    .pass-stub {
      position: relative;
      border-left: 2px dashed rgba(23, 32, 43, 0.28);
      background: var(--paper-2);
      border-radius: 0 18px 18px 0;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pass-stub::before,
    .pass-stub::after {
      content: '';
      position: absolute;
      left: -12px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .pass-stub::before { top: -11px; }
    .pass-stub::after { bottom: -11px; }

    /* сканирующая полоса при поиске */
    .scan {
      position: absolute;
      left: 0;
      right: 0;
      top: -40%;
      height: 40%;
      background: linear-gradient(180deg, transparent, rgba(255, 183, 3, 0.28), transparent);
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }

    .pass.searching .scan { opacity: 1; animation: scanMove 1.1s linear infinite; }

    @keyframes scanMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(350%); }
    }

    .pass-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(23, 32, 43, 0.14);
    }

    .pass-head .logo {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--pass-ink);
      color: var(--amber);
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .pass-head .brand {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2.6px;
      text-transform: uppercase;
    }

    .pass-head .serial {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(23, 32, 43, 0.55);
      letter-spacing: 1px;
    }

    .route {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 0 4px;
    }

    .route-col .lbl {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(23, 32, 43, 0.45);
      margin-bottom: 2px;
    }

    .route-col .code {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 7vw, 40px);
      letter-spacing: 2px;
      line-height: 1;
    }

    .route-col.to { text-align: right; }
    .route-col.to .code { color: var(--amber-deep); }

    .route-line {
      position: relative;
      height: 20px;
    }

    .route-line::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 2px dashed rgba(23, 32, 43, 0.28);
    }

    .route-line .plane {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--paper);
      padding: 0 8px;
      font-size: 17px;
      line-height: 1;
    }

    .pass.searching .route-line .plane { animation: taxi 1.2s ease-in-out infinite alternate; }

    @keyframes taxi {
      from { left: 18%; }
      to { left: 82%; }
    }

    /* Главное: название места */
    .dest {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6px 0 4px;
      min-height: 133px;
    }

    .dest-flag {
      font-size: 32px;
      line-height: 1;
      height: 36px;
      opacity: 0;
      transform: scale(0.4) rotate(-12deg);
      transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pass.settled .dest-flag { opacity: 1; transform: scale(1) rotate(0); }

    .dest-name {
      margin-top: 6px;
      display: flex;
      align-items: center;
      height: var(--name-box);
      overflow: hidden;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: var(--name-max);
      line-height: 1.04;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      /* рвём строку только между словами, а не посреди слова */
      word-break: normal;
      overflow-wrap: normal;
      hyphens: none;
      text-wrap: balance;
    }

    /* внутренний блок обязателен: у flex/grid-контейнера дети «блокифицируются»,
       и каждое слово вставало бы на отдельную строку */
    .name-inner { display: block; width: 100%; }

    /* слово целиком — чтобы на второй строке не оставалось «хвоста» из двух букв */
    .dest-name .w {
      display: inline-block;
      white-space: nowrap;
    }

    .dest-name .ch {
      display: inline-block;
      transition: color 0.16s ease;
    }

    /* невидимая линейка для подбора кегля */
    .name-measure {
      position: absolute;
      left: -9999px;
      top: 0;
      visibility: hidden;
      pointer-events: none;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      word-break: normal;
      overflow-wrap: normal;
      text-wrap: balance;
    }

    .name-measure .seg,
    .name-measure .w { white-space: nowrap; display: inline-block; }

    .name-measure .ch { display: inline-block; }

    /* буквы во время прокрутки занимают ровно ту же ширину, что финальные,
       поэтому строка не «дышит» и не переносится иначе */
    /* overflow тут оставляем visible: у inline-block со скрытым overflow
       базовая линия считается по нижнему краю и строки становятся выше */
    .dest-name .ch.rolling {
      text-align: center;
    }

    .dest-name .ch.rolling {
      color: rgba(23, 32, 43, 0.32);
      font-family: 'JetBrains Mono', monospace;
    }

    .dest-name .ch.locked { animation: flapIn 0.26s ease-out; }

    @keyframes flapIn {
      0% { transform: translateY(-46%) scaleY(0.35); color: var(--amber-deep); }
      60% { transform: translateY(6%) scaleY(1.06); }
      100% { transform: translateY(0) scaleY(1); }
    }

    .dest-country {
      margin-top: 10px;
      height: 17px;
      white-space: nowrap;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: rgba(23, 32, 43, 0.6);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.35s ease 0.1s, transform 0.35s ease 0.1s;
    }

    .pass.settled .dest-country { opacity: 1; transform: none; }

    .note {
      margin-top: 10px;
      height: var(--note-box);
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(23, 32, 43, 0.72);
      max-width: 92%;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.35s ease 0.2s, transform 0.35s ease 0.2s;
    }

    .pass.settled .note { opacity: 1; transform: none; }

    .pass-foot {
      margin-top: auto;
      padding-top: 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 14px;
      border-top: 1px solid rgba(23, 32, 43, 0.14);
    }

    .map-btn {
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--pass-ink);
      color: var(--paper);
      text-decoration: none;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.3s ease 0.28s, transform 0.3s ease 0.28s, background 0.2s ease;
    }

    .pass.settled .map-btn { opacity: 1; pointer-events: auto; transform: none; }
    .map-btn:hover { background: var(--amber-deep); color: #fff; }

    .barcode {
      margin-left: auto;
      width: 118px;
      height: 34px;
      opacity: 0.85;
      background-image: repeating-linear-gradient(90deg,
        var(--pass-ink) 0 2px, transparent 2px 4px,
        var(--pass-ink) 4px 5px, transparent 5px 9px,
        var(--pass-ink) 9px 12px, transparent 12px 13px,
        var(--pass-ink) 13px 14px, transparent 14px 18px);
    }

    /* Печать ЮНЕСКО */
    .pass.has-stamp .dest { padding-right: 132px; }

    .stamp {
      position: absolute;
      right: 16px;
      bottom: 74px;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      border: 3px double rgba(203, 60, 45, 0.75);
      color: rgba(203, 60, 45, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 3px;
      transform: rotate(-14deg) scale(2.6);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
    }

    .stamp b { font-size: 19px; letter-spacing: 2px; line-height: 1; }
    .stamp span { font-size: 9px; letter-spacing: 1.4px; line-height: 1.2; max-width: 96px; }
    .stamp i { font-family: 'JetBrains Mono', monospace; font-style: normal; font-size: 9px; opacity: 0.8; }

    .stamp.on { display: flex; animation: stampIn 0.45s cubic-bezier(0.2, 1.2, 0.3, 1) forwards; }

    @keyframes stampIn {
      0% { opacity: 0; transform: rotate(-32deg) scale(2.6); }
      70% { opacity: 0.95; transform: rotate(-12deg) scale(0.94); }
      100% { opacity: 0.9; transform: rotate(-14deg) scale(1); }
    }

    /* Корешок */
    .stub-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stub-row span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: rgba(23, 32, 43, 0.45);
    }

    .stub-row b {
      font-variant-numeric: tabular-nums;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 19px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stub-code {
      margin-top: auto;
      writing-mode: vertical-rl;
      align-self: flex-end;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(23, 32, 43, 0.5);
    }

    /* Кнопка запуска */
    .go {
      max-width: 100%;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 17px 40px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--amber), var(--amber-deep));
      color: #241a02;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(19px, 3.4vw, 24px);
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 16px 34px -12px rgba(251, 133, 0, 0.75);
      transition: transform 0.16s ease, box-shadow 0.2s ease, filter 0.2s ease;
      touch-action: manipulation;
    }

    .go:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 20px 40px -12px rgba(251, 133, 0, 0.85); }
    .go:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
    .go:disabled { filter: grayscale(0.45) brightness(0.9); cursor: progress; }
    .go .ico { font-size: 20px; }
    .go:hover:not(:disabled) .ico { animation: nudge 0.6s ease infinite alternate; }

    @keyframes nudge {
      from { transform: translateX(0); }
      to { transform: translateX(5px); }
    }

    :focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
      border-radius: 999px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-align: center;
      min-height: 18px;
    }

    @media (max-width: 720px) {
      :root { --name-max: 34px; --name-box: 70px; --note-box: 40px; }

      .note { font-size: 13px; }

      .pass { grid-template-columns: 1fr; max-width: 480px; }

      .pass-main { border-radius: 18px 18px 0 0; padding: 20px 18px 18px; min-height: 0; }

      .pass-stub {
        border-left: 0;
        border-top: 2px dashed rgba(23, 32, 43, 0.28);
        border-radius: 0 0 18px 18px;

  <script>
    // PLACES: [cc, region, kind, nameRu, nameEn, nameEl] — kind 1 = объект ЮНЕСКО
    const pass = document.getElementById('pass');
    const regionsBox = document.getElementById('regions');
    const kindsBox = document.getElementById('kinds');
    const destName = document.getElementById('destName');
    const nameInner = document.getElementById('nameInner');
    const nameMeasure = document.getElementById('nameMeasure');
    const segMeasure = document.getElementById('segMeasure');
    const charMeasure = document.getElementById('charMeasure');
    const liveEl = document.getElementById('live');
    const destCountry = document.getElementById('destCountry');
    const flagEl = document.getElementById('flag');
    const noteEl = document.getElementById('note');
    const toCode = document.getElementById('toCode');
    const serialEl = document.getElementById('serial');
    const stampEl = document.getElementById('stamp');
    const stampCode = document.getElementById('stampCode');
    const stubRegion = document.getElementById('stubRegion');
    const stubPool = document.getElementById('stubPool');
    const stubCode = document.getElementById('stubCode');
    const mapLink = document.getElementById('mapLink');
    const pickBtn = document.getElementById('pickBtn');
    const pickLabel = document.getElementById('pickLabel');
    const hint = document.getElementById('hint');

    const LANG_IDX = { ru: 3, en: 4, el: 5 };
    const CODES = { e: 'EU', a: 'AS', m: 'AM', f: 'AF', o: 'OC', w: 'WW' };
    const GLYPHS = {
      ru: 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЫЭЮЯ',
      en: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      el: 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ'
    };

    const SEARCH_MS = 1000;   // «поиск» до того, как буквы начнут вставать на место
    const TICK_MS = 45;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let region = 'e';
    let kind = 'all';
    let busy = false;
    let winner = null;
    let recent = [];
    let timers = [];

    function lang() { return (window.I18N && I18N.lang) || 'ru'; }
    function flagOf(cc) { return String.fromCodePoint(...[...cc].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)); }
    function nameOf(p) { return p[LANG_IDX[lang()] || 3] || p[4] || p[3]; }

    function countryOf(p) {
      const c = COUNTRIES[p[0]];
      if (!c) return '';
      return c[{ ru: 0, en: 1, el: 2 }[lang()] || 0] || c[1];
    }

    function noteOf(p) {
      const f = window.I18N && I18N.t('featured');
      return (f && typeof f === 'object' && f[p[4]]) || '';
    }

    function codeOf(p) {
      const words = (p[4] || '').toUpperCase().replace(/[^A-Z ]/g, ' ').split(/\s+/)
        .filter(w => w.length > 2 && ['THE', 'AND', 'FOR', 'ITS'].indexOf(w) === -1);
      const code = words.length >= 3
        ? words.slice(0, 3).map(w => w[0]).join('')
        : (words.join('') + 'XXX').slice(0, 3);
      return (code + 'XXX').slice(0, 3);
    }

    function pool(r, k) {
      r = r || region; k = k === undefined ? kind : k;
      return PLACES.filter(p => (r === 'w' || p[1] === r) && (k === 'all' || String(p[2]) === k));
    }

    function updateCounts() {
      document.querySelectorAll('[data-count]').forEach(el => {
        el.textContent = pool(el.dataset.count, kind).length;
      });
      stubRegion.textContent = CODES[region];
      stubPool.textContent = pool().length;
    }

    // Слова (и куски после дефиса) — точки, где строка имеет право переноситься.
    function segments(text) {
      const out = [];
      text.split(' ').forEach(word => {
        const parts = word.split('-');
        parts.forEach((part, i) => out.push(i < parts.length - 1 ? part + '-' : part));
      });
      return out.filter(x => x !== '');
    }

    const charWidths = new Map();

    function charWidth(ch, size) {
      const key = size + ch;
      if (charWidths.has(key)) return charWidths.get(key);
      charMeasure.style.fontSize = size + 'px';
      charMeasure.textContent = ch;
      const w = charMeasure.getBoundingClientRect().width;
      charMeasure.textContent = '';
      charWidths.set(key, w);
      return w;
    }

    function latinChar() {
      const g = GLYPHS.en;
      return g[Math.floor(Math.random() * g.length)];
    }

    function randChar() {
      const g = GLYPHS[lang()] || GLYPHS.ru;
      return g[Math.floor(Math.random() * g.length)];
    }

    // Разметка «каждое слово — неразрывный блок»: одна и та же в анимации
    // и в измерителе, иначе подобранный кегль не совпадёт с реальным.
    function wordsFragment(text, makeChar) {
      const frag = document.createDocumentFragment();
      const words = text.split(' ');
      words.forEach((word, wi) => {
        segments(word).forEach(seg => {
          const box = document.createElement('span');
          box.className = 'w';
          if (makeChar) {
            for (const ch of seg) box.appendChild(makeChar(ch));
          } else {
            box.textContent = seg;
          }
          frag.appendChild(box);
        });
        if (wi < words.length - 1) frag.appendChild(document.createTextNode(' '));
      });
      return frag;
    }

    function buildChars(text) {
      const size = parseFloat(destName.style.fontSize) || cssPx('--name-max');
      nameInner.textContent = '';
      const spans = [];
      nameInner.appendChild(wordsFragment(text, (ch) => {
        const el = document.createElement('span');
        el.className = 'ch';
        if (!/[\p{L}\p{N}]/u.test(ch)) {
          el.textContent = ch;
          el.dataset.fixed = '1';
        } else {
          el.textContent = randChar();
          el.classList.add('rolling');
          el.dataset.final = ch;
          el.style.width = charWidth(ch.toUpperCase(), size).toFixed(2) + 'px';
        }
        spans.push(el);
        return el;
      }));
      return spans;
    }

    function cssPx(name) {
      return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0;
    }

    // Подбираем кегль так, чтобы название влезло в отведённый бокс,
    // ни одно слово не пришлось рвать пополам и строк было как можно меньше:
    // одна строка покрупнее читается лучше, чем две с «хвостом» из одного слова.
    function fitName(text) {
      const boxW = destName.clientWidth;
      const boxH = destName.clientHeight;
      const max = Math.round(cssPx('--name-max'));
      const min = Math.round(cssPx('--name-min'));
      if (!boxW || !boxH) { destName.style.fontSize = max + 'px'; return; }

      nameMeasure.style.width = boxW + 'px';
      const segs = segments(text);

      // сколько строк занимает текст этим кеглем (0 — не влезает по ширине слова)
      const linesAt = (size) => {
        segMeasure.style.fontSize = size + 'px';
        for (const seg of segs) {
          segMeasure.textContent = seg;
          if (segMeasure.getBoundingClientRect().width > boxW) return 0;
        }
        segMeasure.textContent = '';
        nameMeasure.style.fontSize = size + 'px';
        const probe = document.createElement('span');
        probe.appendChild(wordsFragment(text, (ch) => {
          const el = document.createElement('span');
          el.className = 'ch';
          el.textContent = ch;
          return el;
        }));
        nameMeasure.appendChild(probe);
        const h = nameMeasure.scrollHeight;
        probe.remove();
        return Math.max(1, Math.round(h / (size * 1.04)));
      };

      // самый крупный кегль, укладывающийся в заданное число строк
      const bestFor = (lines) => {
        let lo = min, hi = max, best = 0;
        while (lo <= hi) {
          const mid = Math.floor((lo + hi) / 2);
          const n = linesAt(mid);
          if (n && n <= lines && mid * 1.04 * n <= boxH + 1) { best = mid; lo = mid + 1; }
          else hi = mid - 1;
        }
        return best;
      };

      const maxLines = Math.max(1, Math.floor(boxH / (min * 1.04)));
      const comfy = Math.round(max * 0.55);   // ниже этого кегля одна строка уже мелковата
      let chosen = 0;
      for (let lines = 1; lines <= maxLines; lines++) {
        const size = bestFor(lines);
        if (!size) continue;
        chosen = size;
        if (size >= comfy) break;             // читаемо — берём минимум строк
      }
      destName.style.fontSize = (chosen || min) + 'px';
    }

    const nameOverflows = () => nameInner.scrollHeight > destName.clientHeight + 1;

    // Контрольная примерка на живом элементе: измеритель даёт оценку,
    // а дальше убавляем кегль, пока строка реально не влезет в бокс.
    // Текст ставится синхронно, до перерисовки, поэтому «подсмотреть» его нельзя.
    function showNameText(text) {
      fitName(text);
      const min = Math.round(cssPx('--name-min'));
      let size = parseFloat(destName.style.fontSize) || Math.round(cssPx('--name-max'));
      nameInner.textContent = text;
      let guard = 0;
      while (nameOverflows() && size > min && guard++ < 14) {
        size -= 1;
        destName.style.fontSize = size + 'px';
      }
      return size;
    }

    // То же самое, но для разметки прокрутки (буквы в неразрывных словах):
    // кегль обязан подходить и ей, и обычному тексту.
    function prepareName(text) {
      let size = showNameText(text);
      const min = Math.round(cssPx('--name-min'));
      let spans = buildChars(text);
      let guard = 0;
      while (nameOverflows() && size > min && guard++ < 14) {
        size -= 1;
        destName.style.fontSize = size + 'px';
        spans = buildChars(text);
      }
      return spans;
    }

    function clearTimers() {
      timers.forEach(clearTimeout);
      timers = [];
    }

    function showIdle() {
      pass.classList.remove('settled', 'searching', 'has-stamp');
      stampEl.classList.remove('on');
      destName.style.fontSize = '';
      nameInner.innerHTML = '<span class="ch rolling">•</span><span class="ch rolling">•</span><span class="ch rolling">•</span>';
      destCountry.textContent = '';
      noteEl.textContent = '';
      flagEl.textContent = '🌍';
      pass.classList.remove('has-stamp');
      toCode.textContent = '???';
      serialEl.textContent = 'RH-0000';
      stubCode.textContent = 'RANDOMHOST';
      hint.textContent = I18N.t('hint_start');
    }

    // Ужимаем строку, пока она не влезет в свой бокс
    function fitLine(el, min, max) {
      let size = max;
      el.style.fontSize = size + 'px';
      while (size > min &&
             (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1)) {
        size -= 1;
        el.style.fontSize = size + 'px';
      }
    }

    // Заполняем всё, что занимает место, заранее: пока нет класса settled,
    // эти элементы прозрачны, но высота талона уже финальная и не прыгает.
    function prepare(p) {
      pass.classList.toggle('has-stamp', p[2] === 1);
      flagEl.textContent = flagOf(p[0]);
      destCountry.textContent = countryOf(p);
      fitLine(destCountry, 9, window.innerWidth <= 720 ? 12 : 13);
      noteEl.textContent = noteOf(p);
      fitLine(noteEl, 11, window.innerWidth <= 720 ? 13 : 14);
      mapLink.href = 'https://www.google.com/maps/search/?api=1&query=' +
        encodeURIComponent(nameOf(p) + ', ' + countryOf(p));
      stampCode.textContent = p[0] + ' · ' + CODES[p[1]];
    }

    function reveal(p) {
      prepare(p);
      toCode.textContent = codeOf(p);
      const serial = 'RH-' + String(PLACES.indexOf(p) + 1).padStart(4, '0');
      stubCode.textContent = serial;
      serialEl.textContent = serial;
      pass.classList.add('settled');
      stampEl.classList.toggle('on', p[2] === 1);
      pickLabel.textContent = I18N.t('gen_btn_again');
      hint.textContent = '';
      liveEl.textContent = nameOf(p) + ', ' + countryOf(p);
    }

    function pick() {
      if (busy) return;
      const list = pool();
      if (!list.length) return;

      busy = true;
      clearTimers();
      pickBtn.disabled = true;
      pass.classList.remove('settled', 'shake', 'has-stamp');
      stampEl.classList.remove('on');
      hint.textContent = I18N.t('searching');

      let p = list[Math.floor(Math.random() * list.length)];
      if (list.length > recent.length + 1) {
        let guard = 0;
        while (recent.indexOf(p) !== -1 && guard++ < 40) p = list[Math.floor(Math.random() * list.length)];
      }
      recent.push(p);
      if (recent.length > 40) recent.shift();
      winner = p;

      prepare(p);
      const text = nameOf(p);
      const spans = prepareName(text);

      if (reduceMotion) {
        nameInner.textContent = text;
        reveal(p);
        pickBtn.disabled = false;
        busy = false;
        return;
      }

      pass.classList.add('searching');
      const rolling = spans.filter(s => !s.dataset.fixed);
      const step = Math.max(24, Math.min(70, Math.round(900 / Math.max(rolling.length, 1))));
      const lockAt = rolling.map((_, i) => SEARCH_MS + i * step);
      const total = lockAt.length ? lockAt[lockAt.length - 1] : SEARCH_MS;

      const start = performance.now();
      const spin = setInterval(() => {
        const t = performance.now() - start;
        // «поиск» — прыгают цифры рейса и код направления
        if (t < total) {
          serialEl.textContent = 'RH-' + String(Math.floor(Math.random() * 9000) + 1000);
          toCode.textContent = latinChar() + latinChar() + latinChar();
        }
        rolling.forEach((s, i) => {
          if (s.dataset.done) return;
          if (t >= lockAt[i]) {
            s.textContent = s.dataset.final;
            s.classList.remove('rolling');
            s.classList.add('locked');
            s.style.width = '';
            s.dataset.done = '1';
          } else {
            s.textContent = randChar();
          }
        });
      }, TICK_MS);

      timers.push(setTimeout(() => {
        clearInterval(spin);
        rolling.forEach(s => {
          s.textContent = s.dataset.final;
          s.classList.remove('rolling');
          s.style.width = '';
          s.dataset.done = '1';
        });
        pass.classList.remove('searching');
        reveal(p);
        // после того как последняя буква «щёлкнула», отдаём строку целиком:
        // так работает кернинг и балансировка строк, а не набор inline-блоков
        timers.push(setTimeout(() => {
          if (winner === p && !busy) nameInner.textContent = text;
        }, 420));
        if (p[2] === 1) {
          pass.classList.add('shake');
          timers.push(setTimeout(() => pass.classList.remove('shake'), 600));
        }
        pickBtn.disabled = false;
        busy = false;
      }, total + 180));
    }

    regionsBox.addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn || busy) return;
      region = btn.dataset.region;
      document.querySelectorAll('#regions .chip').forEach(b => {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');

      updateCounts();

    kindsBox.addEventListener('click', (e) => {
      const btn = e.target.closest('.kind-btn');
      if (!btn || busy) return;
      kind = btn.dataset.kind;
      document.querySelectorAll('.kind-btn').forEach(b => {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      try { localStorage.setItem('travel-kind', kind); } catch (err) {}
      updateCounts();
    });

    pickBtn.addEventListener('click', pick);

    try {
      const savedRegion = localStorage.getItem('travel-region');
      const rBtn = savedRegion && document.querySelector('#regions .chip[data-region="' + savedRegion + '"]');
      if (rBtn) {
        region = savedRegion;
        document.querySelectorAll('#regions .chip').forEach(b => b.classList.toggle('active', b === rBtn));
      }
      const savedKind = localStorage.getItem('travel-kind');
      const kBtn = savedKind && document.querySelector('.kind-btn[data-kind="' + savedKind + '"]');
      if (kBtn) {
        kind = savedKind;
        document.querySelectorAll('.kind-btn').forEach(b => b.classList.toggle('active', b === kBtn));
      }
    } catch (err) {}

    window.addEventListener('langchange', () => {
      updateCounts();
      if (winner && !busy) {
        reveal(winner);
        showNameText(nameOf(winner));
      } else if (!busy) {
        showIdle();
      }
    });

    document.querySelectorAll('#regions .chip, .kind-btn').forEach(b => {
      b.setAttribute('aria-pressed', b.classList.contains('active') ? 'true' : 'false');
    });

    // при смене ширины окна пересчитываем кегль под новый бокс
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (winner && !busy) {
          showNameText(nameOf(winner));
        }
      }, 150);
    });

    updateCounts();
    showIdle();
