    host_start_need: `Για να ξεκινήσει χρειάζονται δύο συνδεδεμένοι παίκτες`,
    host_players: `Παίκτες`,
    host_kick: `Αφαίρεση`,
    host_kick_confirm: `Να αφαιρεθεί ο/η {name} από το παιχνίδι;`,
    host_skip_confirm: `Παράλειψη λοτ; Αν υπάρχουν ήδη προσφορές, πάει σε όποιον προηγείται.`,
    host_end_confirm: `Τέλος παιχνιδιού και πάμε στα αποτελέσματα;`,
  }
};
</script>
<script src="i18n.js"></script>

<script>
// какой экран открыт: от этого зависит, скроллится ли страница (важно для мобильной клавиатуры)
function screenMode(mode) {
  const b = document.body;
  b.classList.remove("m-start", "m-enter", "m-final", "m-game");
  if (mode) b.classList.add("m-" + mode);
}
const params = new URLSearchParams(location.search);
// код комнаты идёт в innerHTML — оставляем только буквы алфавита кодов, иначе ?r=<img onerror> даёт XSS
const CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 8);
// Язык интерфейса — устройства, а не комнаты. Задание и название категории это подписи, а не
// содержимое лота: игрок с английским телефоном должен читать их по-английски, даже если партия
// идёт на русских карточках. От языка комнаты зависят только сами лоты и вердикты судьи —
// они приходят с сервера и общие для всех за столом.
const uiLang = () => (window.I18N && window.I18N.lang) || "ru";
const app = document.getElementById("app");
const overlay = document.getElementById("overlay");
let state = null, ws, offset = 0, me = null, token = null, lastLot = -1, thumbLot = -1;
// пульт ведущего: сервер признал хост-токен этого телефона (host_ok remote) — есть кнопки ведущего
let isHostRemote = false;
const hostToken = () => { try { return localStorage.getItem("auction-host-" + CODE); } catch (e) { return null; } };
// категорию и счётчики стартового экрана держим снаружи: при смене языка экран перерисовывается,
// и выбор игрока не должен слетать, а счётчики — грузиться заново
let startKind = null, startCounts = null;
// ключ последней ошибки входа: при смене языка экран входа перерисовывается вместе с ней
let joinErrKey = null;

// ---------- язык ----------
// Если i18n.js не доехал (блокировщик, сбой раздачи статики) — пульт обязан работать по-русски,
// а не остаться белым экраном. Настоящий I18N, если он загрузился, эту заглушку не трогает.
window.I18N = window.I18N || { t: function (k) { const d = (window.I18N_DICT || {}).ru || {}; return k in d ? d[k] : k; }, lang: "ru", setLang: function () {}, supported: ["ru"] };
// Все подстановки идут через явные {плейсхолдеры}: в английском и греческом порядок слов свой,
// поэтому склеивать строку из кусков нельзя.
const tpl = (key, vars) => String(I18N.t(key)).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
const NUM_LOCALE = { ru: "ru-RU", en: "en-US", el: "el-GR" };
const numFmt = (n) => Number(n).toLocaleString(NUM_LOCALE[I18N.lang] || "en-US");
// формы слова: в русском их три (лот / лота / лотов), в английском и греческом хватает двух
function pluralWord(n, key) {
  const forms = I18N.t(key);
  if (!Array.isArray(forms)) return String(forms);
  if (I18N.lang === "ru") {
    const i = n % 10 === 1 && n % 100 !== 11 ? 0 : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 1 : 2);
    return forms[i] || forms[forms.length - 1];
  }
  return n === 1 ? forms[0] : (forms[1] || forms[0]);
}
// оверлей помнит свой ключ: при смене языка надпись обязана перевестись, а не застыть
let overlayKey = null;
// Терминальное состояние: комнаты больше нет. Флаг гасит переподключение — без него onClose
// каждые 2 секунды заново дёргал бы join() к несуществующей комнате и перерисовывал экран.
let dead = false;
function renderExpired() {
  dead = true;
  try { localStorage.removeItem("auction-token-" + CODE); } catch (e) {}
  setOverlay(null);
  screenMode("enter");
  app.innerHTML = `<div class="center expired"><h1>${escapeHtml(I18N.t("expired_title"))}</h1><p class="sub">${escapeHtml(I18N.t("expired_text"))}</p>
    <a class="big expired-new" href="auction.html">${escapeHtml(I18N.t("expired_new"))}</a></div>`;
}

let overlayVars = null;
function setOverlay(key, vars) {
  overlayKey = key || null;
  overlayVars = vars || null;
  const text = overlayKey ? (overlayVars ? tpl(overlayKey, overlayVars) : I18N.t(overlayKey)) : "";
  // Пауза закрывает весь экран — у ведущего с телефона на ней должны остаться «Продолжить» и
  // управление, иначе снять паузу можно было бы только с доски (§10.4)
  if (isHostRemote && /^ov_(paused|wait_players|wait_player)$/.test(overlayKey || "")) {
    const box = el("div", "ovbox");
    const resume = el("button", "big", I18N.t("host_resume"));
    resume.id = "ovresume";
    resume.onclick = () => sendMsg({ type: "resume" });
    const more = el("button", "mid", I18N.t("host_title"));
    more.onclick = openHostSheet;
    box.append(el("div", null, text), resume, more);
    overlay.replaceChildren(box);
  } else overlay.textContent = text;
  overlay.classList.toggle("on", !!overlayKey);
}

// Запуск экрана — в самом конце скрипта (см. boot() внизу): join() пишет в let-переменные,
// объявленные ниже, и вызов отсюда падал с ReferenceError (TDZ) — пульт с токеном оставался пустым.

// Смена языка: статические узлы обновит сам i18n.js, но все экраны пульта строит JS — перерисовываем.
window.addEventListener("langchange", () => {
  if (dead) return renderExpired();
  if (overlayKey) setOverlay(overlayKey, overlayVars);
  if (state) { app.innerHTML = ""; lastLot = -1; introShown = null; render(); return; }
  const input = document.getElementById("name");
  if (input) { const v = input.value; renderJoin(joinErrKey); const again = document.getElementById("name"); if (again) again.value = v; return; }
  if (document.querySelector(".start")) renderCreate();
});

// ---------- стартовый экран (этот экран становится доской) ----------
async function renderCreate() {
  screenMode("start");
  if (!startCounts) { let c = {}; try { c = await (await fetch("/auction/api/kinds")).json(); } catch {} startCounts = c; }
  const counts = startCounts;
  const kinds = Object.keys(AUCTION_KINDS).filter((k) => !Object.keys(counts).length || counts[k]);
  if (!startKind || kinds.indexOf(startKind) === -1) startKind = kinds[Math.floor(Math.random() * kinds.length)] || "artist";
  let kind = startKind;
  document.body.dataset.kind = kind;
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  app.innerHTML = `<div class="start">
    <div class="start-head">
      <div class="eyebrow"><i></i>${I18N.t("start_eyebrow")}</div>
      <h1><span class="w">${I18N.t("h1_a")}</span><em>${I18N.t("h1_b")}</em><span class="gavel" id="gavel" aria-hidden="true">🔨</span></h1>
      <p class="lede">${I18N.t("start_lede")}</p>
    </div>
    <div class="stage" aria-hidden="true">
      <div class="stage-head"><span class="live"><i></i>${I18N.t("stage_live")}</span><span class="stage-kind" id="stagekind"></span></div>
      <div class="reel" id="reel"><div class="reel-track" id="reeltrack"></div></div>
      <div class="stage-foot">${I18N.t("stage_foot")}</div>
    </div>
    <div class="start-body">
      <div class="picker">
        <div class="eyebrow pick-cap">${total ? tpl("pick_cap_n", { n: numFmt(total), w: pluralWord(total, "plural_lot") }) : I18N.t("pick_cap")}</div>
        <div class="tiles" id="tiles">${kinds.map((k, i) => `<button class="tile ${k === kind ? "on" : ""}" data-kind="${k}" style="animation-delay:${i * 0.03}s"><span class="ico">${AUCTION_KINDS[k].icon}</span>${auctionKind(k, uiLang()).button}${counts[k] ? `<span class="n">${counts[k]}</span>` : ""}</button>`).join("")}</div>
      </div>
      <div class="cta">
        <button class="big" id="create">${I18N.t("btn_create")}</button>
        <div class="sub2"><span>${I18N.t("cta_sub")}</span><a class="link" href="#" id="havecode">${I18N.t("have_code")}</a></div>
      </div>
      <div class="steps">
        <div class="step"><div class="k">1</div><div class="t">${I18N.t("step1_t")}</div><div class="d">${I18N.t("step1_d")}</div></div>
        <div class="step"><div class="k">2</div><div class="t">${I18N.t("step2_t")}</div><div class="d">${I18N.t("step2_d")}</div></div>
        <div class="step"><div class="k">3</div><div class="t">${I18N.t("step3_t")}</div><div class="d">${I18N.t("step3_d")}</div></div>
      </div>
    </div>
  </div>`;
  showKind(kind, counts[kind]);
  document.getElementById("tiles").onclick = (e) => {
    const t = e.target.closest(".tile"); if (!t) return;
    if (t.dataset.kind === kind) return strikeGavel();
    kind = startKind = t.dataset.kind;
    document.querySelectorAll(".tile").forEach((x) => x.classList.toggle("on", x === t));
    showKind(kind, counts[kind]);
  };
  document.getElementById("create").onclick = async () => {
    const btn = document.getElementById("create"); btn.disabled = true; btn.textContent = I18N.t("btn_creating");
    try {
      const res = await fetch("/auction/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kind }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || I18N.t("err_create"));
      // хост-токен помним: без него, закрыв доску на телефоне, вернуть её было нечем (пульт этой
      // же комнаты показывает ссылку «Открыть доску», если токен есть)
      try { localStorage.setItem("auction-host-" + data.code, data.hostToken); } catch (e) {}
      location.href = `auction-board.html?r=${data.code}&t=${data.hostToken}`;
    } catch (err) { btn.disabled = false; btn.textContent = I18N.t("btn_create"); alert(err.message); }
  };
  document.getElementById("havecode").onclick = (e) => { e.preventDefault(); const c = prompt(I18N.t("prompt_code")); if (c) location.href = `auction.html?r=${c.trim().toUpperCase()}`; };
}

// ---------- живая лента лотов на стартовом экране ----------
// Витрина: показываем настоящие карточки выбранной категории с «ценой» и печатью «продано».
// Данные лежат рядом с доской: auction-data/<kind>.js → window.CARDS[kind] (русские),
// auction-data/<lang>/<kind>.js → window.CARDS_BY_LANG[lang][kind] (переводы) — грузим по одному файлу лениво.
let reelToken = 0;
const cardsLoading = {};
const CARD_LANGS = ["en", "el"];

function loadCards(kind, lang) {
  if (CARD_LANGS.indexOf(lang) === -1) lang = "ru";
  const pick = () => (lang === "ru" ? window.CARDS || {} : (window.CARDS_BY_LANG || {})[lang] || {})[kind];
  if (pick()) return Promise.resolve(pick());
  const key = lang + "/" + kind;
  cardsLoading[key] = cardsLoading[key] || new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = lang === "ru" ? `auction-data/${kind}.js` : `auction-data/${lang}/${kind}.js`;
    s.onload = () => res(pick() || []);
    s.onerror = () => { delete cardsLoading[key]; rej(new Error("no data")); };
    document.head.append(s);
  });
  // перевода нет — лучше русская лента, чем пустая
  return lang === "ru" ? cardsLoading[key] : cardsLoading[key].catch(() => loadCards(kind, "ru"));
}

function strikeGavel() {
  const g = document.getElementById("gavel");
  if (!g) return;
  g.classList.remove("hit"); void g.offsetWidth; g.classList.add("hit");
}

function showKind(kind, count) {
  document.body.dataset.kind = kind;
  const cap = document.getElementById("stagekind");
  if (cap) cap.textContent = count
    ? tpl("stage_kind_n", { kind: auctionKind(kind, uiLang()).button, n: numFmt(count), w: pluralWord(count, "plural_lot") })
    : auctionKind(kind, uiLang()).button;
  strikeGavel();
  fillReel(kind);
}

function fillReel(kind) {
  const track = document.getElementById("reeltrack");
  if (!track) return;
  const my = ++reelToken, reel = track.parentElement;
  if (!track.children.length) track.innerHTML = '<div class="lotcard skel"></div>'.repeat(8);
  reel.classList.add("swap");
  loadCards(kind, uiLang()).then((cards) => {
    if (my !== reelToken) return;
    if (!cards.length) return reel.classList.remove("swap");
    // Интрига: колоду не раскрываем. Открытыми едут только две «звезды» — начало массива
    // отсортировано по известности; у остальных настоящие эмодзи, цена и печать, а имя закрыто плашкой.
    const shuffled = (arr, n) => arr.slice().sort(() => Math.random() - .5).slice(0, n);
    const OPEN = [1, 5, 8];
    const stars = shuffled(cards.slice(0, Math.min(14, cards.length)), OPEN.length);
    const deck = cards.map((c, i) => ({ c, i })).filter((x) => !stars.includes(x.c));
    const hidden = shuffled(deck, 9 - OPEN.length);
    const list = [];
    for (let i = 0, s = 0, h = 0; i < 9; i++) list.push(OPEN.includes(i) ? { star: stars[s++] || stars[0] } : hidden[h++] || { star: stars[0] });

    const html = list.map((item, i) => {
      const sold = i % 4 === 2, hot = i % 5 === 1;
      const card = item.star || item.c;
      const tail = sold ? `<span class="lc-stamp">${I18N.t("stamp_sold")}</span>` : `<span class="lc-bid">$${2 + Math.floor(Math.random() * 26)}</span>`;
      const body = item.star
        ? `<span class="lc-name">${escapeHtml(card.name)}</span><span class="lc-meta">${escapeHtml((card.meta || []).slice(0, 2).join(" · "))}</span>`
        : `<span class="lc-name closed">${tpl("lc_lot_no", { n: String(item.i + 1).padStart(3, "0") })}</span><span class="lc-meta bars" aria-hidden="true">${maskBars(card.name)}</span>`;
      return `<div class="lotcard${hot ? " hot" : ""}"><span class="lc-emoji">${card.emoji || AUCTION_KINDS[kind].icon}</span>` +
        `<span class="lc-text">${body}</span>${tail}</div>`;
    }).join("");
    track.innerHTML = html + html; // две копии — для бесшовной прокрутки
    reel.classList.remove("swap");
  }).catch(() => { if (my === reelToken) reel.classList.remove("swap"); });
}

// имя закрытого лота → плашки по длине слов: ритм живой, текста в DOM нет
function maskBars(name) {
  return String(name).split(/\s+/).slice(0, 3)
    .map((w) => `<i style="width:${Math.min(86, Math.max(16, w.length * 8))}px"></i>`).join("");
}

// ---------- вход ----------
// error — ключ словаря (или сырая ошибка сервера: I18N.t вернёт её как есть)
function renderJoin(error) {
  screenMode("enter");
  joinErrKey = error || null;
  app.innerHTML = `<div class="center enter"><h1>${I18N.t("h1_a")}<em>${I18N.t("h1_b")}</em></h1><p class="sub">${tpl("join_room", { code: CODE })}</p>
    <label for="name" class="note" style="text-align:left;margin:0">${I18N.t("join_label")}</label>
    <input type="text" id="name" maxlength="24" placeholder="${escapeHtml(I18N.t("ph_name"))}" autocomplete="nickname" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" inputmode="text">
    <button class="big" id="go">${I18N.t("btn_go")}</button><div class="note" id="err">${error ? escapeHtml(I18N.t(error)) : ""}</div></div>`;
  const input = document.getElementById("name");
  const go = () => { const n = input.value.trim(); if (n) join(n); };
  document.getElementById("go").onclick = go;
  // Тело обязано быть блоком: стрелка вида `e.key === "Enter" && go()` возвращает false на любой
  // другой клавише, а DOM0-обработчик, вернувший false, отменяет действие по умолчанию —
  // символ не вставлялся, и имя нельзя было ввести вообще.
  input.onkeydown = (e) => { if (e.key === "Enter") go(); };
  // мобильная клавиатура: поднимаем поле над ней, когда оно получило фокус
  input.addEventListener("focus", () => setTimeout(() => input.scrollIntoView({ block: "center", behavior: "smooth" }), 300));
  // autofocus в innerHTML не срабатывает; на мобильных фокус без жеста всё равно запрещён — там просто тап
  if (!matchMedia("(hover: none)").matches) input.focus();
}

// Переподключение. Первая попытка — немедленная: моргнувший Wi-Fi возвращается за доли секунды,
// и фиксированная пауза в 2 с превращала незаметный обрыв в заметный простой. Дальше — рост
// с разбросом, чтобы восемь телефонов после общего обрыва не ломились в сервер в одну миллисекунду.
let lastName = "", retry = 0, retryTimer = null, offlineTimer = null;
// halted — игру открыли на другом устройстве или выгнали: сами обратно не подключаемся,
// иначе пульт по первому же visibilitychange отнимал бы сессию у нового телефона
let halted = false;

function scheduleRejoin() {
  if (dead || halted || retryTimer) return;
  const delay = retry === 0 ? 0 : Math.min(8000, 500 * 2 ** (retry - 1)) + Math.floor(Math.random() * 400);
  retry++;
  retryTimer = setTimeout(() => { retryTimer = null; if (!dead) join(lastName); }, delay);
}

// Устройство само знает, когда связь вернулась и когда экран снова виден, — в этот момент ждать
// очередного шага backoff незачем. Сюда же приходит возврат из фона: вкладку могли заморозить,
// и событие close от мёртвого сокета дойдёт с опозданием или не дойдёт вовсе.
// Сокет «жив» по readyState ещё не значит живой: после смены сети (Wi-Fi → LTE) он молча мёртв.
// Поэтому живой транспорт проверяем пингом с таймаутом (probe), а не верим ему на слово.
// Вошедший по токену (перезагрузка) тоже переподключается: имени у него нет, есть токен.
function rejoinNow() {
  if (dead || halted || (!lastName && !token)) return;
  if (ws && (ws.mode === "ws" || ws.mode === "poll")) { ws.probe(); return; }
  if (ws && ws.mode === "connecting") return;
  clearTimeout(retryTimer);
  retryTimer = null;
  retry = 0;
  join(lastName);
}
addEventListener("online", rejoinNow);
document.addEventListener("visibilitychange", () => { if (!document.hidden) rejoinNow(); });
// bfcache: при уходе «назад» страница замораживается целиком, и браузер рвёт сокет — Chrome делает
// это принудительно при попадании в bfcache. При восстановлении оттуда visibilitychange срабатывает
// не всегда, надёжный хук — pageshow с persisted. А на pagehide закрываемся сами: уходя, честно
// освобождаем место, вместо того чтобы сервер ещё грацию считал нас живыми.
addEventListener("pageshow", (e) => { if (e.persisted) rejoinNow(); });
addEventListener("pagehide", () => { try { if (ws) ws.close(); } catch (e) {} });

// Погасший экран замораживает вкладку, сокет умирает, игрок выпадает из партии. Wake Lock держит
// экран включённым, пока открыт пульт. Где его нет (iOS до 16.4) — просто ничего не происходит:
// падать из-за отсутствия необязательной возможности нельзя.
let wakeLock = null;
async function keepAwake() {
  try {
    if (!navigator.wakeLock || document.hidden || wakeLock) return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
keepAwake();

function join(name) {
  lastName = name;
  halted = false;
  // прежний транспорт гасим: два живых соединения одного пульта отнимали бы друг у друга сессию
  if (ws) { try { ws.close(); } catch (e) {} }
  // вход по токену или ?name=: до ответа сервера экран не пустой (за прокси это секунды)
  if (!state && !app.firstChild) app.innerHTML = `<div class="center"><p class="sub" style="text-align:center">${escapeHtml(I18N.t("connecting"))}</p></div>`;
  ws = openTransport({
    code: CODE,
    onClock: () => { offset = serverOffset(); },
    onOpen: () => {
      retry = 0;
      clearTimeout(offlineTimer);
      offlineTimer = null;
      // плашку снимаем сразу; если партия и правда на паузе, ближайший state вернёт «ov_paused»
      if (overlayKey === "ov_offline") setOverlay(null);
      sendMsg({ type: "join", name, token });
      // хост-токен этой комнаты на телефоне — просим права ведущего на этом соединении (§10.4);
      // права живут на соединении, поэтому просим заново после каждого переподключения
      const ht = hostToken();
      if (ht) sendMsg({ type: "host", token: ht, remote: true });
    },
    onMessage: (msg) => {
      settle();
      if (msg.type === "joined") { me = msg.playerId; token = msg.token; try { localStorage.setItem("auction-token-" + CODE, token); } catch {} }
      if (msg.type === "hello" || msg.type === "state") setState(msg.state);
      if (msg.type === "event") onEvent(msg.event);
      if (msg.type === "host_ok" && msg.remote) { isHostRemote = true; if (overlayKey) setOverlay(overlayKey, overlayVars); render(); }
      // токен не подошёл (комнату пересоздали с тем же кодом) — забываем его, кнопок ведущего нет
      if (msg.type === "host_denied") { isHostRemote = false; try { localStorage.removeItem("auction-host-" + CODE); } catch (e) {} render(); }
      if (msg.type === "rejected") onRejected(msg);
      if (msg.type === "replaced") { halted = true; ws.close(); setOverlay("ov_replaced"); }
      if (msg.type === "kicked") { halted = true; ws.close(); try { localStorage.removeItem("auction-token-" + CODE); } catch {} token = null; setOverlay("ov_kicked"); }
      if (msg.type === "error") {
        ws.close();
        // Комната закрылась по неактивности — переподключаться некуда: возвращать игрока на ввод
        // имени значит гонять его по кругу «нет связи → введи имя → нет связи».
        if (msg.error === "room_expired") renderExpired();
        // игрока по токену больше нет (выгнали в лобби, пока телефон был офлайн, или ведущий начал
        // новую игру без него) — забываем токен и спрашиваем имя, а не висим фантомом
        else if (msg.error === "token_gone") { token = null; me = null; state = null; try { localStorage.removeItem("auction-token-" + CODE); } catch {} setOverlay(null); renderJoin(); }
        else if (msg.error === "game_started") renderJoin("err_started");
        else if (msg.error === "room_full") renderJoin("err_room_full");
        else renderJoin(msg.error);
      }
    },
    onClose: () => {
      if (dead) return;
      // Плашку «нет связи» не показываем мгновенно: обрыв на 300 мс, который мы тут же и залечим,
      // не должен мигать тревогой во весь экран посреди торгов.
      if (!offlineTimer) offlineTimer = setTimeout(() => { offlineTimer = null; if (!dead) setOverlay("ov_offline"); }, 1200);
      scheduleRejoin();
    },
    // Действие не ушло: связи нет или сервер его не принял после повторов. Молча терять нельзя —
    // игрок думает, что поставил. Кнопки перерисовываем, чтобы снова были активны.
    onSendFail: (msg) => {
      if (!msg || !/^(bid|take|skip|vote)$/.test(msg.type)) return;
      settle();
      const alive = ws && (ws.mode === "ws" || ws.mode === "poll");
      if (msg.type === "vote") myVote = null;
      render();
      setNote(I18N.t(msg.type === "bid" && alive ? "note_send_fail" : "note_not_sent"));
    },
    // комнаты больше нет — показываем это прямо, вместо вечного «переподключаемся…»
    onGone: () => renderExpired(),
  });
}
const sendMsg = (m) => ws && ws.send(m);

// Отправка действия игрока. Кнопка сразу гаснет (на медленной сети иначе жмут повторно), а если
// за 3 с сервер не ответил ничем — пишем «нет ответа» и проверяем связь пингом: после смены сети
// соединение бывает молча мёртвым, и ставка уходила в пустоту без единого слова.
let pendingTimer = null;
function act(msg, btn) {
  if (btn) { btn.classList.add("busy"); btn.disabled = true; }
  sendMsg(msg);
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => {
    pendingTimer = null;
    render();
    setNote(I18N.t("note_no_answer"));
    if (ws) ws.probe();
  }, 3000);
}
// любое сообщение от сервера — связь жива, ожидание ответа снимаем
function settle() { if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; } }

// Подсказка под кнопками. Держится, пока не сменится ход торгов (лидер, фаза, лот), —
// раньше «Перебили!» и «Ты и так лидер» висели до следующего лота.
let noteAt = 0, noteKey = "";
function setNote(text) {
  const n = document.getElementById("note");
  if (!n) return;
  n.textContent = text || "";
  noteAt = Date.now();
}

function setState(s) {
  if (!me) return;
  state = s;
  // смещение часов — по лучшему замеру ping/pong, а не «как пришёл этот state» (§6.4)
  offset = serverOffset(s.serverNow);
  document.body.dataset.kind = s.kind;
  // пауза бывает разная: ведущий, «ждём Аню» (соло-добор), «ждём игроков» (отвалилось больше
  // половины — снимется сама). Раньше пульт на любую писал «ждём ведущего»
  if (!s.paused) setOverlay(null);
  else if (s.pausedFor) setOverlay("ov_wait_player", { name: nameOf(s.pausedFor) });
  else if (s.pausedAuto) setOverlay("ov_wait_players");
  else setOverlay("ov_paused");
  if (s.phase !== "finished") myVote = null;
  render();
  if (hostSheetOpen) fillHostSheet();
}
const money = (n) => "$" + numFmt(n);
const mine = () => state.players.find((p) => p.id === me);
// Если auction-modes.js не доехал (блокировщик, сбой раздачи статики), задание неизвестно.
// Врать нельзя: показать «Лучший набор», когда сервер судит по «Худшему», хуже, чем не показать
// ничего — доска-то задание знает, и игрок весь матч собирал бы обратное тому, что судят.
const modeNow = () => (window.auctionModeText ? auctionModeText(state && state.settings && state.settings.mode, state && state.kind, uiLang()) : null);
const taskNow = () => { const m = modeNow(); return m && m.id !== "base" ? m : null; };
const nameOf = (id) => (state.players.find(function (p) { return p.id === id; }) || {}).name || "?";
// соло-добор мой: сервер прислал фазу ДОБОР и в ней указан я (§6.5)
const drafting = (p) => !!(state && state.solo && p && state.solo.playerId === p.id);

// ---------- звук ----------
let actx;
function beep(freq, ms = 90, type = "sine", gain = .1) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = freq; g.gain.value = gain; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + ms / 1000); } catch {}
}
function onEvent(e) {
  if (e.type === "outbid" && e.playerId === me) { beep(220, 200, "square"); flashButton(I18N.t("note_outbid")); }
  if (e.type === "sold" && e.playerId === me) { beep(520, 120); setTimeout(() => beep(780, 180), 130); confetti(); }
  if (e.type === "taken" && e.playerId === me) { beep(440, 160, "triangle"); confetti(); }
  if (e.type === "lot") beep(880, 40, "sine", .04);
}
function onRejected(r) {
  if (r.action === "vote") myVote = null;
  // причины известны заранее: незнакомую показываем как есть, а не ключом словаря
  const known = ["price_changed", "too_low", "not_enough_money", "already_leader", "closed", "cannot_bid", "cannot_skip", "must_take", "paused", "cannot_take", "no_lots", "bad_vote"];
  render();
  setNote(known.indexOf(r.reason) !== -1 ? I18N.t("rej_" + r.reason) : r.reason);
}
function flashButton(text) { const b = document.getElementById("bid"); if (b) { b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 400); } setNote(text); }

// ---------- рендер ----------
function render() {
  if (!state) return;
  if (state.phase === "lobby") return renderLobby();
  if (state.phase === "intro") return renderIntro();
  if (state.phase === "finished") return renderFinal();
  renderGame();
}

// Заставка: на телефоне она нарочно почти пустая — смысл в том, чтобы игрок поднял голову
// на большой экран, где крупно показывают задание и отсчёт. Цифры дублируем, чтобы те,
// кто всё-таки смотрит в телефон, не пропустили старт торгов.
const COUNTDOWN_MS = 3000;
let introShown = null, introLoop = false, timerLoop = false;

function renderIntro() {
  screenMode("");
  lastLot = -1;
  const s = state, m = modeNow();
  if (!document.getElementById("introbox")) {
    app.innerHTML = `<div class="center intro" id="introbox">
      <p class="sub">${I18N.t("intro_watch")}</p>
      ${m ? `<div class="plate task"><span class="eyebrow">${I18N.t("task_eyebrow")}</span><b>${m.icon} ${escapeHtml(m.title)}</b>${escapeHtml(m.short || "")}.</div>` : ""}
      <div class="icount" id="icount">${I18N.t("intro_starting")}</div>
    </div>`;
    introShown = null;
    // цикл заводим один раз: он живёт до конца страницы, а экран перерисовывается и при смене языка
    if (!introLoop) { introLoop = true; requestAnimationFrame(tickIntro); }
  }
}

function tickIntro() {
  const box = document.getElementById("icount");
  if (!box || !state || state.phase !== "intro") { introShown = null; return requestAnimationFrame(tickIntro); }
  const left = Math.max(0, state.deadline - (Date.now() + offset));
  if (left <= COUNTDOWN_MS) {
    const n = Math.max(1, Math.ceil(left / 1000));
    if (introShown !== n) { introShown = n; box.textContent = String(n); box.className = "icount go"; }
  }
  requestAnimationFrame(tickIntro);
}

function renderLobby() {
  screenMode("");
  lastLot = -1;
  const m = modeNow(), slots = state.settings.slots;
  const roomTitle = (state.settings.title || "").trim();
  // Имя комнаты, если ведущий его задал: игрок должен узнать, что попал именно туда, куда звали.
  app.innerHTML = `<div class="center"><h1>${I18N.t("h1_a")}<em>${I18N.t("h1_b")}</em></h1>${roomTitle ? `<p class="roomname">${escapeHtml(roomTitle)}</p>` : ""}<p class="sub">${tpl("lobby_sub", { code: CODE })}</p>
    <div class="plate"><b>${(AUCTION_KINDS[state.kind] || {}).icon || ""} ${auctionKind(state.kind, uiLang()).label || state.kind}</b>${tpl("lobby_budget", { money: money(state.settings.budget), slots: slots, w: pluralWord(slots, "plural_slot") })}</div>
    ${m ? `<div class="plate task"><span class="eyebrow">${I18N.t("task_eyebrow")}</span><b>${m.icon} ${escapeHtml(m.title)}</b>${escapeHtml(m.short || "")}.<span class="by">${state.settings.judge === "vote" ? I18N.t("lobby_judge_vote") : tpl("lobby_judge_ai", { how: escapeHtml(m.judge || "") })}</span></div>` : ""}
    <div class="chips">${state.players.map((p) => `<span class="chip ${p.id === me ? "me" : ""}">${escapeHtml(p.name)}</span>`).join("")}</div>${hostLobby()}${boardLink()}</div>`;
  const start = document.getElementById("hoststart");
  if (start) start.onclick = () => { unlockAudio(); sendMsg({ type: "start" }); };
  const more = document.getElementById("hostmore");
  if (more) more.onclick = openHostSheet;
}

// Ведущий играет с телефона: старт и управление прямо из лобби пульта, доска может стоять далеко
function hostLobby() {
  if (!isHostRemote) return "";
  const online = state.players.filter((p) => p.online && !p.left).length;
  return `<div class="hostlobby"><button class="big" id="hoststart"${online < 2 ? " disabled" : ""}>${escapeHtml(I18N.t("host_start"))}</button>` +
    (online < 2 ? `<div class="note">${escapeHtml(I18N.t("host_start_need"))}</div>` : "") +
    `<button class="mid" id="hostmore">${escapeHtml(I18N.t("host_title"))}</button></div>`;
}

// ---------- шторка ведущего (§10.4): пауза, пропуск лота, завершение, кик ----------
// Разрушительное (пропустить, завершить, убрать) — только через подтверждение: промах пальцем
// посреди торгов не должен продавать лот или заканчивать вечер.
let hostSheetOpen = false;
function openHostSheet() {
  hostSheetOpen = true;
  const sh = document.getElementById("sheet");
  sh.classList.add("on", "host");
  fillHostSheet();
}
function closeHostSheet() {
  hostSheetOpen = false;
  const sh = document.getElementById("sheet");
  sh.classList.remove("on", "host");
}
function fillHostSheet() {
  const sh = document.getElementById("sheet");
  if (!state || !isHostRemote) return closeHostSheet();
  const s = state;
  const box = el("div", "hostsheet");
  box.append(el("h2", null, I18N.t("host_title")));
  const row = el("div", "hrow");
  const btn = (key, cls, fn, id) => { const b = el("button", "mid" + (cls ? " " + cls : ""), I18N.t(key)); if (id) b.id = id; b.onclick = fn; row.append(b); return b; };
  const playing = s.phase !== "lobby" && s.phase !== "finished";
  if (s.phase === "lobby") {
    const online = s.players.filter((p) => p.online && !p.left).length;
    btn("host_start", "", () => { closeHostSheet(); sendMsg({ type: "start" }); }, "hs_start").disabled = online < 2;
  }
  if (playing) {
    btn(s.paused ? "host_resume" : "host_pause", "", () => sendMsg({ type: s.paused ? "resume" : "pause" }), "hs_pause");
    const skippable = !s.paused && (s.phase === "lot" || s.phase === "bidding" || s.phase === "pickup" || s.phase === "draft");
    const round = s.round;
    // round: подтверждение могло провисеть до следующего лота — сервер тогда отказ, а не продажа
    btn("host_skip", "", () => { if (confirm(I18N.t("host_skip_confirm"))) sendMsg({ type: "skip_lot", round }); }, "hs_skip").disabled = !skippable;
    btn("host_end", "warn", () => { if (confirm(I18N.t("host_end_confirm"))) { closeHostSheet(); sendMsg({ type: "end" }); } }, "hs_end");
  }
  if (row.children.length) box.append(row);
  const others = s.players.filter((p) => !p.left && p.id !== me);
  if (others.length && s.phase !== "finished") {
    box.append(el("div", "note", I18N.t("host_players")));
    others.forEach((p) => {
      const line = el("div", "pl");
      line.append(el("span", p.online ? null : "off", p.name));
      const k = el("button", "mid warn", I18N.t("host_kick"));
      k.dataset.kick = p.id;
      k.onclick = () => { if (confirm(tpl("host_kick_confirm", { name: p.name }))) sendMsg({ type: "kick", playerId: p.id }); };
      line.append(k);
      box.append(line);
    });
  }
  const close = el("button", "mid", I18N.t("sheet_close"));
  close.id = "hs_close";
  close.onclick = closeHostSheet;
  box.append(close);
  sh.replaceChildren(box);
}

// Хост, играющий с того же телефона, может потерять вкладку доски — хост-токен сохранён при
// создании комнаты, по нему доску можно открыть снова (§2, §10.4)
function boardLink() {
  let t = null;
  try { t = localStorage.getItem("auction-host-" + CODE); } catch (e) {}
  return t ? `<a class="linkbtn" style="text-align:center" target="_blank" rel="noopener" href="auction-board.html?r=${CODE}&t=${encodeURIComponent(t)}">${escapeHtml(I18N.t("lobby_open_board"))}</a>` : "";
}

function renderGame() {
  screenMode("game");
  const s = state, p = mine();
  if (!p) return;
  if (!document.getElementById("bidbox")) {
    app.innerHTML = `<div class="status"><button class="hostpill" id="hostbtn" hidden>${escapeHtml(I18N.t("host_btn"))}</button><b id="myname"></b><span class="slots" id="myslots"></span><span class="spacer"></span><span id="lotno"></span><span class="money" id="mymoney"></span></div>
      <div class="taskbar" id="task"></div>
      <div class="lotbox" id="lot"></div>
      <div class="bidinfo"><div class="ring" id="ring"><svg viewBox="0 0 62 62"><circle class="track" cx="31" cy="31" r="27"/><circle class="arc" id="arc" cx="31" cy="31" r="27" stroke-dasharray="170" stroke-dashoffset="0"/></svg><div class="num" id="tnum"></div></div><div class="lead" id="lead"></div></div>
      <div class="actions" id="bidbox"><div class="bidmain" id="bidmain"></div><div class="ownwrap" id="ownwrap"></div></div><div class="note" id="note"></div>`;
    // как и в заставке: один цикл на всю страницу, иначе смена языка удваивала бы кадры
    if (!timerLoop) { timerLoop = true; requestAnimationFrame(tickTimer); }
  }
  document.getElementById("myname").textContent = p.name;
  const hb = document.getElementById("hostbtn");
  if (hb) { hb.hidden = !isHostRemote; hb.onclick = openHostSheet; }
  document.getElementById("mymoney").textContent = drafting(p)
    ? tpl("draft_status", { n: Math.min(p.lots.length + 1, s.settings.slots), total: s.settings.slots, money: money(p.money) })
    : money(p.money);
  document.getElementById("lotno").textContent = tpl("lot_counter", { n: s.round + 1 });
  const task = document.getElementById("task");
  if (task) {
    const custom = taskNow();
    task.className = "taskbar" + (custom ? " on" : "");
    if (custom) task.replaceChildren(el("b", null, custom.icon + " " + custom.title), el("span", null, custom.short || ""));
  }
  const slots = document.getElementById("myslots");
  slots.replaceChildren(...Array.from({ length: s.settings.slots }, (_, i) => { const d = el("i", i < p.lots.length ? "on" : null); return d; }));

  if (s.lot && lastLot !== s.round) { lastLot = s.round; renderLot(s.lot, s.kind); }
  // сменился лидер, фаза или лот — старая подсказка («Перебили!», «Ты и так лидер») уже неправда
  const key = s.round + "|" + s.phase + "|" + s.leaderId + "|" + s.price;
  if (key !== noteKey) { noteKey = key; if (Date.now() - noteAt > 1500) setNote(""); }

  const lead = document.getElementById("lead");
  lead.replaceChildren();
  lead.className = "lead" + (s.phase === "sold" || s.phase === "taken" ? " sold" : "");
  if (s.phase === "lot" || s.phase === "bidding") {
    const who = el("div", "who");
    if (s.leaderId) { who.append(el("b", null, s.leaderId === me ? I18N.t("you") : nameOf(s.leaderId)), document.createTextNode(` ${money(s.price)}`)); lead.append(el("div", "cap", I18N.t("cap_leader")), who); }
    else { who.textContent = I18N.t("no_bids"); lead.append(el("div", "cap", tpl("cap_min", { money: money(1) })), who); }
  } else if (s.phase === "pickup") lead.append(el("div", "cap", I18N.t("cap_pickup")), el("div", "who", I18N.t("pickup_none")));
  else if (s.phase === "draft") lead.append(el("div", "cap", I18N.t("draft_cap")), el("div", "who", I18N.t("draft_free")));
  else if (s.phase === "sold" || s.phase === "taken") {
    // цена отдельным элементом в строке печати: имя переносится, цена не пропадает на узком экране
    const who = el("div", "who"); who.append(el("b", null, s.leaderId === me ? I18N.t("yours") : nameOf(s.leaderId)));
    lead.append(el("div", "cap", I18N.t(s.phase === "sold" ? "cap_sold" : "cap_taken")), el("span", "amt", s.phase === "sold" ? money(s.price) : I18N.t("for_free")), who);
  }
  else lead.append(el("div", "cap", ""), el("div", "who", I18N.t("nobody_took")));

  renderActions(p);
}

function renderLot(lot, kind) {
  const box = document.getElementById("lot");
  box.replaceChildren();
  const img = el("img", "thumb"); img.alt = "";
  const meta = el("div", "meta"); (lot.meta || []).forEach((m) => meta.append(el("span", null, m)));
  const more = el("button", "more", I18N.t("more_btn"));
  more.onclick = () => openSheet(lot);
  box.append(img, el("div", "emoji", lot.emoji), el("div", "kind", auctionKind(kind, uiLang()).label || kind), el("div", "name", lot.name), meta, el("div", "short", lot.description), more);
  setNote("");
  // новый лот — ряд «своей суммы» пересоздаём пустым: прежняя сумма относилась к другому лоту
  const wrap = document.getElementById("ownwrap"); if (wrap) wrap.replaceChildren();
  // Картинка: тот же поиск, что на доске, но превью 240px (показываем 120 CSS-пикселей) — 1200px
  // съедали до 10 МБ за партию. Ведущий выключил картинки — пульт их тоже не качает.
  if (state.settings && state.settings.media === false) return;
  const round = state.round;
  findImage(lot, kind, 240).then((found) => { if (found && state.round === round) { img.src = found.src; img.classList.add("on"); } }).catch(() => {});
}

function renderActions(p) {
  const s = state, box = document.getElementById("bidmain");
  box.replaceChildren();
  const plate = (cls, title, text) => { const d = el("div", "plate " + cls); if (title) d.append(el("b", null, title)); d.append(document.createTextNode(text || "")); return d; };
  const next = s.price + 1;
  // «Своя сумма» живёт в своём контейнере и не пересоздаётся на каждом state: раньше чужая ставка
  // закрывала поле вместе с набранной суммой и клавиатурой
  const ownOk = !p.full && (s.phase === "lot" || s.phase === "bidding") && p.money > 0 && s.leaderId !== me && next < p.money;
  syncOwnBid(ownOk ? p : null);
  if (p.full) return box.append(plate("", I18N.t("done_title"), I18N.t("done_text")));
  // round в каждом действии: на медленной сети «Скип» или «Забрать» иначе доезжали до следующего,
  // ещё не показанного лота — сервер отвечает closed, если лот уже другой
  if (s.phase === "pickup") {
    if (p.canTake) { const b = el("button", "big", I18N.t("take_free")); b.onclick = () => { unlockAudio(); act({ type: "take", round: s.round }, b); }; return box.append(b); }
    return box.append(plate("", "", I18N.t(p.money === 0 ? "already_taken" : "pickup_hint")));
  }
  // Соло-добор: две кнопки вместо ставок. Скипов не осталось — «Скип» не рисуем совсем,
  // а не гасим серым: на этом лоте выбора действительно нет (§10.3).
  if (s.phase === "draft") {
    if (!drafting(p)) return box.append(plate("", "", s.solo ? tpl("draft_other", { name: nameOf(s.solo.playerId) }) : I18N.t("next_lot")));
    // лот в доборе стоит $1, пока есть деньги; без денег — даром и без скипов
    const take = el("button", "big", s.solo.price ? tpl("draft_take", { money: money(s.solo.price) }) : I18N.t("draft_take_free"));
    take.onclick = () => { unlockAudio(); act({ type: "take", round: s.round }, take); };
    box.append(take);
    if (s.solo.skips > 0) {
      const skip = el("button", "mid", tpl("draft_skip", { n: s.solo.skips }));
      skip.onclick = () => act({ type: "skip", round: s.round }, skip);
      box.append(skip);
    } else {
      box.append(plate("", "", I18N.t(s.solo.price ? "draft_must" : "draft_broke")));
    }
    return;
  }
  if (s.phase !== "lot" && s.phase !== "bidding") return box.append(plate("", "", I18N.t("next_lot")));
  if (p.money === 0) return box.append(plate("", I18N.t("broke_title"), I18N.t("broke_text")));
  if (s.leaderId === me) return box.append(plate("lead-me", I18N.t("lead_me_title"), tpl("lead_me_text", { money: money(s.price) })));
  if (next > p.money) return box.append(plate("err", I18N.t("not_enough_title"), tpl("not_enough_text", { have: money(p.money), need: money(next) })));
  // «Перебить» уместно только когда есть кого перебивать: на первой ставке лота лидера нет,
  // и кнопка «Перебить $1» врала бы игроку про то, что происходит.
  const big = el("button", "big", tpl(s.leaderId ? "bid_btn" : "bid_first_btn", { money: money(next) })); big.id = "bid";
  big.onclick = () => { unlockAudio(); act({ type: "bid", amount: next, expectedPrice: s.price, round: s.round }, big); };
  box.append(big);
  // «+$5» и своя сумма — в одном ряду под главной кнопкой (syncOwnBid): поле всегда на экране
}

// Своя сумма: кнопками можно только шагать по $1 и $5, а перебить сразу на $12 нельзя было.
// Поле всегда на экране, в одном ряду с «+$5»: раньше его открывала отдельная ссылка — два нажатия
// до клавиатуры, пока лот тикает. Ряд переживает любые state: обновляем только границы и «+$5»,
// фокус и набранное остаются.
function syncOwnBid(p) {
  const wrap = document.getElementById("ownwrap");
  if (!wrap) return;
  if (!p) { if (wrap.firstChild) wrap.replaceChildren(); return; }
  const next = state.price + 1, plus = state.price + 5;
  let input = document.getElementById("ownbid");
  if (!input) {
    wrap.replaceChildren();
    const row = el("div", "ownbid");
    const m = el("button", "mid plus5"); m.id = "plus5";
    let t = 0;
    // сумма берётся на момент нажатия, из подписи: цена могла вырасти между state и тапом
    m.onclick = () => { if (Date.now() - t < 300) return; t = Date.now(); const s = state; act({ type: "bid", amount: Number(m.dataset.amount), expectedPrice: s.price, round: s.round }, m); };
    input = el("input");
    input.type = "number"; input.id = "ownbid"; input.step = "1";
    input.inputMode = "numeric"; input.enterKeyHint = "send";
    input.setAttribute("aria-label", I18N.t("own_bid_label"));
    const go = el("button", "mid go", I18N.t("own_bid_go"));
    const err = el("div", "note", "");
    const send = () => {
      // границы — на момент нажатия: цена могла вырасти, пока набирали сумму. Они те же, что у
      // сервера: он отклонит и сам, но человеку нужен ответ сразу
      const s = state, self = mine(), low = s.price + 1;
      const raw = String(input.value).trim().replace(",", ".");
      const v = Number(raw);
      if (!raw || !Number.isFinite(v) || v < low) { err.textContent = tpl("own_bid_min", { money: money(low) }); return; }
      // 27.9 раньше молча превращалось в $27 — дробную сумму не угадываем, а просим целую
      if (!Number.isInteger(v)) { err.textContent = I18N.t("own_bid_int"); return; }
      if (!self || v > self.money) { err.textContent = tpl("own_bid_max", { money: money(self ? self.money : 0) }); return; }
      err.textContent = "";
      unlockAudio();
      act({ type: "bid", amount: v, expectedPrice: s.price, round: s.round });
      input.value = "";
    };
    go.onclick = send;
    // тело блоком: стрелка `e.key === "Enter" && send()` вернула бы false на любой другой клавише,
    // а DOM0-обработчик, вернувший false, отменяет ввод символа — так уже ломался ввод имени
    input.onkeydown = (e) => { if (e.key === "Enter") send(); };
    row.append(m, input, go);
    wrap.append(row, err);
  }
  input.min = String(next); input.max = String(p.money);
  input.placeholder = I18N.t("own_bid_open");
  const m = document.getElementById("plus5");
  m.hidden = plus > p.money;
  m.dataset.amount = String(plus);
  m.textContent = tpl("plus5_btn", { money: money(plus) });
}

function tickTimer() {
  const ring = document.getElementById("ring");
  if (!state || !ring) return requestAnimationFrame(tickTimer);
  const s = state;
  const total = { lot: s.settings.t1, bidding: s.settings.t2, pickup: 5000, draft: s.t4 || 10000 }[s.phase] || 2000;
  const left = s.paused ? total : Math.max(0, s.deadline - (Date.now() + offset));
  document.getElementById("arc").setAttribute("stroke-dashoffset", String(170 * (1 - Math.min(1, left / total))));
  document.getElementById("tnum").textContent = (s.phase === "lot" || s.phase === "bidding" || s.phase === "pickup" || s.phase === "draft") ? Math.ceil(left / 1000) : "";
  // краснеет только там, где идёт отсчёт: в «Забрали»/«Мимо» спешить уже некуда
  ring.classList.toggle("urgent", left < 3000 && (s.phase === "lot" || s.phase === "bidding" || s.phase === "pickup" || s.phase === "draft"));
  requestAnimationFrame(tickTimer);
}

function openSheet(lot) {
  const sh = document.getElementById("sheet");
  hostSheetOpen = false;
  sh.classList.remove("host");
  sh.innerHTML = `<div style="font:900 22px var(--display);margin-bottom:8px">${escapeHtml(lot.name)}</div><p>${escapeHtml(lot.description)}</p><p class="fact"><b>${I18N.t("sheet_fact")}</b>${escapeHtml(lot.fact)}</p><button class="mid" id="close">${I18N.t("sheet_close")}</button>`;
  sh.classList.add("on");
  document.getElementById("close").onclick = () => sh.classList.remove("on");
}

// за кого я голосовал — сервер этого не рассказывает (счёт открывается после закрытия, §9)
let myVote = null;
function renderFinal() {
  screenMode("final");
  const s = state, p = mine();
  lastLot = -1;
  const players = s.players.filter((x) => !x.left);
  if (!s.results) {
    if (s.voting) {
      // Задание обязано быть на этом экране: голосование — единственный режим, где оно
      // больше ни на что не влияет, и без напоминания критерия «худший набор» голосуют за лучший.
      const vtask = taskNow();
      // Проголосовал ли я — из state (переживает перерисовку и перезагрузку), а не из DOM:
      // раньше ✓ пропадал на первом же чужом голосе, и кнопки снова становились активными.
      const voted = (s.voted || []).indexOf(me) !== -1 || !!myVote;
      const canVote = !!(p && p.lots.length);
      app.innerHTML = `<div class="final"><h1>${I18N.t("vote_h1_a")}<em>${I18N.t("vote_h1_b")}</em></h1>${vtask ? `<div class="taskbar on" style="justify-content:center"><b>${escapeHtml(vtask.icon + " " + vtask.title)}</b><span style="flex:none">${escapeHtml(vtask.short || "")}</span></div>` : ""}<p class="sub">${tpl("vote_sub", { n: s.votes, total: players.filter((x) => x.lots.length).length })}</p>${!canVote ? `<div class="plate">${escapeHtml(I18N.t("vote_no_lots"))}</div>` : voted ? `<div class="plate lead-me">${escapeHtml(I18N.t("vote_done"))}</div>` : ""}<div class="vote" id="vote"></div><div class="note" id="note"></div></div>`;
      const box = document.getElementById("vote");
      players.filter((x) => x.id !== me && x.lots.length).forEach((x) => {
        const row = el("div", "row"); const n = el("div", "n", x.name); n.append(el("small", null, x.lots.map((l) => l.emoji + " " + l.name).join(" · ")));
        row.append(n);
        // без лотов голосовать нельзя (§9) — кнопок не рисуем, а не ждём молчаливого отказа сервера
        if (canVote) {
          const b = el("button", "mid", myVote === x.id ? "✓" : I18N.t("vote_btn")); b.style.width = "auto";
          b.disabled = voted;
          b.onclick = () => { myVote = x.id; box.querySelectorAll("button").forEach((q) => (q.disabled = true)); b.textContent = "✓"; act({ type: "vote", for: x.id }); };
          row.append(b);
        }
        box.append(row);
      });
      return;
    }
    app.innerHTML = `<div class="center" style="text-align:center"><div style="font-size:56px">🎲</div><h1>${I18N.t("judge_h1_a")}<em>${I18N.t("judge_h1_b")}</em></h1><p class="sub">${I18N.t("judge_sub")}</p></div>`;
    return;
  }
  const idx = s.results.ranking.findIndex((r) => r.playerId === me);
  const r = s.results.ranking[idx];
  const places = ["🥇", "🥈", "🥉"];
  const custom = taskNow();
  const ftask = custom ? `<div class="taskbar on" style="justify-content:center"><b>${escapeHtml(custom.icon + " " + custom.title)}</b></div>` : "";
  // single — лайнап собрал один: судить было не с кем, очков нет, вместо них пояснение сервера
  const mode = s.results.mode;
  const score = r && mode === "vote" ? tpl("votes_score", { n: r.score, w: pluralWord(r.score, "plural_vote") }) : (r && r.score != null ? r.score : "");
  const verdict = r ? (r.verdict || (mode === "single" ? s.results.summary || "" : "")) : "";
  // как решилась ничья и что значит «0 голосов» — то же пояснение, что на доске (§9)
  const tieKey = mode !== "vote" ? "" : s.results.votes === 0 ? "no_votes" : s.results.tieBreak === "spent" ? "tie_spent" : s.results.tieBreak === "coin" ? "tie_coin" : "";
  const tie = tieKey ? `<p class="note tie" id="tie">${escapeHtml(I18N.t(tieKey))}</p>` : "";
  app.innerHTML = `<div class="final">${ftask}<div class="place${idx >= 0 ? "" : " none"}">${idx >= 0 ? places[idx] || tpl("place_n", { n: idx + 1 }) : "—"}</div>${r ? `${score !== "" ? `<div class="score">${score}</div>` : ""}<div class="verdict">${escapeHtml(verdict)}</div>` : `<p class="sub" style="text-align:center">${I18N.t("final_no_judge")}</p>`}${tie}<div class="lots">${((p && p.lots) || []).map((l) => `<span class="chip">${l.emoji} ${escapeHtml(l.name)}</span>`).join("")}</div><p class="note" style="margin-top:18px">${I18N.t("final_foot")}</p></div>`;
}

function confetti() {
  // «меньше движения» — без летящих конфетти; звук и надпись и так говорят, что лот твой
  try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (e) {}
  const c = document.getElementById("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cs = getComputedStyle(document.body);
  const colors = [cs.getPropertyValue("--c1"), cs.getPropertyValue("--c2"), cs.getPropertyValue("--c3"), "#fff"];
  const parts = Array.from({ length: 90 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * 200, vy: 3 + Math.random() * 4, vx: -2 + Math.random() * 4, r: 4 + Math.random() * 5, col: colors[Math.floor(Math.random() * colors.length)] }));
  let frames = 0;
  (function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.r, p.r * 1.6); }
    if (++frames < 110) requestAnimationFrame(draw); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}
function escapeHtml(t) { return String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// Старт — последней строкой: к этому моменту объявлены все let/const, которые трогают join() и рендер.
if (!CODE) renderCreate();
else { try { token = localStorage.getItem("auction-token-" + CODE); } catch {} if (token) join(""); else if (params.get("name")) join(params.get("name")); else renderJoin(); }
</script>
</body>
