<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Аукцион</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f528.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auction-shared.css">
<style>
  html, body { width: 100%; max-width: 100vw; overflow-x: hidden; }
  body { padding: calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .screen, .screen > *, .lotbox > *, .actions > * { max-width: 100%; min-width: 0; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* строка статуса всегда одна: длинное имя обрезается многоточием, номер лота не переносится */
  .status { display: flex; align-items: center; gap: 10px; min-height: 26px; font-size: 13px; color: var(--muted); flex: none; }
  .status b { color: var(--text); font-weight: 600; min-width: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status .money { flex: none; font: 900 18px/1 var(--display); color: var(--text); }
  .status #lotno { flex: none; white-space: nowrap; }
  .status .spacer { flex: 1; }
  .slots { flex: none; display: flex; gap: 4px; }
  .slots i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--glass-line); }
  .slots i.on { background: var(--c1); border-color: var(--c1); }

  /* карточка лота — верхний уровень фона: стекло поверх панели, панель поверх пятен */
  .lotbox {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: safe center; text-align: center; min-height: 0;
    margin: 10px 0; padding: 18px 16px;
    background: rgba(255, 255, 255, .055); border: 1px solid var(--glass-line); border-radius: 26px;
    backdrop-filter: blur(16px); box-shadow: 0 24px 60px -40px #000;
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  }
  .lotbox::-webkit-scrollbar { display: none; }
  .lotbox > * { flex: none; max-width: 100%; }
  /* картинка и подписи считают высоту экрана: на 568px и в ландшафте карточка не выдавливает соседей */
  .lotbox .thumb { width: clamp(72px, 17vh, 120px); height: clamp(72px, 17vh, 120px); border-radius: 22px; object-fit: cover; background: rgba(255, 255, 255, .06); margin-bottom: 10px; display: none; }
  .lotbox .thumb.on { display: block; }
  .lotbox .emoji { font-size: clamp(30px, 6vh, 44px); line-height: 1.1; margin-bottom: 4px; }
  .lotbox .thumb.on ~ .emoji { display: none; } /* фото уже показывает лот — эмодзи дублирует и съедает высоту */
  .lotbox .kind { font: 700 10px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--c1); }
  .lotbox .name { font: 900 clamp(20px, min(7.6vw, 4.6vh), 32px)/1.08 var(--display); letter-spacing: -.035em; margin: 8px 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .lotbox .meta { justify-content: center; margin-bottom: 8px; max-height: 58px; overflow: hidden; }
  .lotbox .short { font-size: 14px; line-height: 1.45; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 340px; }
  .lotbox .more { min-height: 44px; display: inline-flex; align-items: center; font: 600 12.5px var(--body); color: var(--c1); margin-top: 8px; background: none; border: 1px solid var(--glass-line); border-radius: 999px; padding: 0 16px; }
  .lotbox .lotno { font-size: 12px; color: var(--muted); margin-top: 8px; }
  /* высокие экраны: места хватает — показываем имя лота и описание целиком */
  @media (min-height: 800px) {
    .lotbox .name { -webkit-line-clamp: 4; }
    .lotbox .short { -webkit-line-clamp: 3; }
  }
  /* экраны вроде iPhone SE/8: имя в две строки, картинка меньше — «подробнее» остаётся на виду */
  @media (max-height: 720px) {
    .lotbox .thumb { width: clamp(64px, 14vh, 104px); height: clamp(64px, 14vh, 104px); }
    .lotbox .name { -webkit-line-clamp: 2; }
  }
  /* низкие экраны: описание уходит в шторку «подробнее», чтобы имя лота осталось крупным */
  @media (max-height: 640px) {
    .lotbox { padding: 14px 14px; margin: 8px 0; }
    .lotbox .short { display: none; }
    .lotbox .meta { max-height: 30px; margin-bottom: 6px; }
    .lotbox .thumb { width: clamp(64px, 13vh, 96px); height: clamp(64px, 13vh, 96px); margin-bottom: 8px; }
    .lotbox .name { -webkit-line-clamp: 2; margin: 6px 0; }
  }

  .bidinfo { display: flex; align-items: center; gap: 16px; justify-content: center; margin: 6px 0 12px; flex: none; min-height: 62px; }
  .ring { position: relative; width: 62px; height: 62px; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .track { stroke: rgba(255, 255, 255, .1); }
  .ring .arc { stroke: var(--c1); stroke-linecap: round; }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font: 900 20px/1 var(--display); }
  /* в фазах без отсчёта цифры нет — вместо «пустого» кольца ставим нейтральный прочерк */
  .ring .num:empty::after { content: "—"; color: var(--muted); font-size: 15px; }
  .ring { flex: none; }
  .ring.urgent .arc { stroke: #ff6b6b; }
  .lead { min-width: 0; text-align: left; overflow-wrap: anywhere; }
  .lead .cap { font: 700 10px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .lead .who { font: 900 clamp(20px, 6vw, 24px)/1.05 var(--display); letter-spacing: -.03em; }
  .lead .who b { color: var(--c1); }
  /* продано: та же печать и тот же удар молотка, что на доске и на старте */
  /* nowrap + обрезка имени: строка «продано» занимает ту же высоту, что «лидер», — карточка лота не дёргается */
  .lead.sold { display: flex; align-items: center; flex-wrap: nowrap; gap: 6px 8px; }
  .lead.sold .who { min-width: 0; font-size: clamp(17px, 4.6vw, 22px); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lead.sold .cap { order: 2; flex: none; white-space: nowrap; font: 900 11px/1 var(--display); letter-spacing: .1em; color: var(--c3); border: 1.5px solid var(--c3); border-radius: 7px; padding: 6px 7px; transform: rotate(-7deg); animation: stamp .45s cubic-bezier(.3, 1.8, .5, 1) both; }
  .lead.sold::before { content: "🔨"; order: 1; flex: none; font-size: 26px; line-height: 1; transform: rotate(-32deg); transform-origin: 75% 85%; animation: strike .6s cubic-bezier(.3, 1.4, .5, 1); }
  .lead.sold .who { order: 3; }

  /* высота блока действий постоянна: кнопка, плашка «ты лидер» и «следующий лот»
     занимают один и тот же прямоугольник — карточка лота над ними не дёргается при смене фазы */
  .actions { flex: none; display: flex; flex-direction: column; justify-content: center; gap: 8px; min-height: 124px; }
  .big { position: relative; font: 900 clamp(18px, 5.5vw, 24px)/1 var(--display); letter-spacing: .05em; text-transform: uppercase; color: #0a0a0f; background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3)); border: 0; border-radius: 20px; padding: 22px; width: 100%; box-shadow: 0 22px 60px -22px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45); }
  .big:active { transform: scale(.97); }
  .big.flash { animation: flash .35s; }
  @keyframes flash { 0%, 100% { filter: none; } 50% { filter: brightness(1.6) hue-rotate(-60deg); } }
  .mid { font: 700 14px/1 var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--text); background: none; border: 1px solid var(--glass-line); border-radius: 999px; padding: 15px; width: 100%; }
  .mid:active { background: rgba(255, 255, 255, .08); }
  .plate { text-align: center; padding: 18px; border: 1px dashed var(--glass-line); border-radius: 20px; font-size: 16px; color: rgba(244, 242, 255, .8); }
  .plate b { font: 900 20px/1.2 var(--display); letter-spacing: -.03em; color: var(--text); display: block; margin-bottom: 4px; }
  .plate.lead-me { border-style: solid; border-color: var(--c1); background: color-mix(in srgb, var(--c1) 12%, transparent); }
  .plate.err { color: #ff8a8a; }
  .plate.task { border-style: solid; border-color: color-mix(in srgb, var(--c1) 45%, transparent); background: color-mix(in srgb, var(--c1) 8%, transparent); }
  .plate.task .eyebrow { display: block; font: 700 10px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }
  /* заставка: на телефоне главное — отправить взгляд на большой экран, поэтому крупно только цифра */
  .intro { text-align: center; }
  .icount { font: 500 15px/1 var(--body); color: var(--muted); min-height: 96px; display: flex; align-items: center; justify-content: center; }
  .icount.go { font: 900 84px/1 var(--display); letter-spacing: -.05em; color: var(--text); animation: icount .9s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes icount { 0% { opacity: 0; transform: scale(1.8); } 16% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: .4; transform: scale(.92); } }
  @media (prefers-reduced-motion: reduce) { .icount.go { animation: none; } }
  /* «кто судит» отделено от самого задания: раньше это был один слипшийся абзац из двух почти одинаковых фраз */
  .plate.task .by { display: block; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--glass-line); font-size: 13.5px; line-height: 1.35; color: var(--muted); }
  /* задание игры — отдельной строкой под статусом: в статусбаре оно обрезалось до пары букв */
  .taskbar { display: none; align-items: baseline; flex-wrap: wrap; gap: 1px 7px; font-size: 13px; line-height: 1.3; padding: 7px 12px; margin: -2px 0 2px; border-radius: 12px;
    border: 1px solid color-mix(in srgb, var(--c1) 35%, transparent); background: color-mix(in srgb, var(--c1) 10%, transparent); color: rgba(244, 242, 255, .78); }
  .taskbar.on { display: flex; }
  .taskbar b { color: var(--text); font-weight: 700; white-space: nowrap; }
  /* пояснение переносится, а не обрывается на полуслове (на 320px от него оставалось «у кого в…»);
     больше двух строк не берёт — высота карточки лота и кнопки ставки не страдает */
  .taskbar span { flex: 1 1 auto; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .note { text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; }

  /* ===== стартовый экран: «аукционный зал» ===== */
  body.m-start, body.m-enter, body.m-final { height: auto; min-height: 100vh; min-height: 100dvh; overflow-y: auto; }

  /* Переключатель языка (его вставляет i18n.js) висит в правом верхнем углу — ровно там, где
     во время торгов стоят номер лота и деньги. Свободного места в этой строке нет даже на 320px,
     поэтому на игровом экране переключатель прячем: язык меняют на входе, в лобби или на финале,
     а в торгах интерфейс и так почти весь из цифр. */
  body.m-game .lang-switch { display: none; }

  /* служебная строка: назад в каталог + звук. Только на входных экранах — в игре руки заняты ставкой.
     Правый верхний угол оставлен пустым: туда i18n.js кладёт фиксированный .lang-switch. */
  .util { position: fixed; left: 14px; top: calc(10px + env(safe-area-inset-top)); z-index: 30; display: none; align-items: center; gap: 8px; }
  body.m-start .util, body.m-enter .util { display: flex; }
  .util a, .util button {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 15px; border-radius: 999px;
    border: 1px solid var(--glass-line); background: rgba(12, 10, 20, .5); backdrop-filter: blur(10px);
    color: var(--muted); font: 500 13px/1 var(--body); text-decoration: none; cursor: pointer;
  }
  .util button { width: 44px; padding: 0; }
  .util a:active, .util button:active { color: var(--text); border-color: var(--c1); }

  .start {
    flex: 1; width: 100%; max-width: 1260px; margin: 0 auto; padding: 50px 0 16px;
    display: grid; align-content: start;
    grid-template-areas: "head" "stage" "body";
    grid-template-columns: minmax(0, 1fr);
    row-gap: 20px;
  }
  .start-head { grid-area: head; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .stage { grid-area: stage; min-width: 0; }
  .start-body { grid-area: body; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  @media (min-width: 900px) {
    .start {
      grid-template-areas: "head stage" "body stage";
      grid-template-columns: minmax(0, 1fr) clamp(320px, 34%, 430px);
      grid-template-rows: auto auto;
      column-gap: clamp(26px, 4vw, 54px); row-gap: clamp(18px, 3.4vh, 32px);
    }
    .start-head, .start-body { max-width: 700px; }
    .stage { align-self: center; }
  }
  /* центрируем только если экран заведомо выше контента — иначе верх уехал бы за край */
  @media (min-width: 900px) and (min-height: 780px) {
    .start { align-content: center; }
  }

  /* надзаголовок */
  .start .eyebrow { font: 700 11px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: rgba(244, 242, 255, .62); display: flex; align-items: center; gap: 10px; }
  .start .eyebrow i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c1); box-shadow: 0 0 14px var(--c1); animation: glow 1.8s ease-in-out infinite alternate; }
  @keyframes glow { to { opacity: .35; transform: scale(.7); } }

  /* плакатный заголовок в две строки + молоток */
  .start h1 {
    position: relative; margin: 0; padding-right: .5em;
    font: 900 clamp(46px, 12.5vw, 104px)/.84 var(--display);
    letter-spacing: -.055em; text-transform: uppercase;
    width: fit-content;
  }
  .start h1 span.w { display: block; }
  /* «дыхание» заголовка держим внутри палитры категории: полный оборот hue уводил его в чужие цвета */
  .start h1 em { display: block; animation: hue 9s ease-in-out infinite; }
  @keyframes hue { 50% { filter: hue-rotate(16deg) saturate(1.12); } }
  .start h1 .gavel {
    position: absolute; right: -.4em; bottom: .04em;
    font-size: .46em; line-height: 1; transform: rotate(-32deg); transform-origin: 75% 85%;
    filter: drop-shadow(0 10px 26px color-mix(in srgb, var(--c1) 70%, transparent));
  }
  .start h1 .gavel::after {
    content: ""; position: absolute; left: 50%; top: 88%; width: 1.5em; height: 1.5em; margin: -.75em 0 0 -.75em;
    border-radius: 50%; border: 2px solid var(--c1); opacity: 0;
  }
  .start h1 .gavel.hit { animation: strike .6s cubic-bezier(.3, 1.4, .5, 1); }
  .start h1 .gavel.hit::after { animation: shock .6s ease-out; }
  @keyframes strike { 0% { transform: rotate(-32deg); } 30% { transform: rotate(-58deg); } 52% { transform: rotate(6deg); } 70% { transform: rotate(-16deg); } 100% { transform: rotate(-32deg); } }
  @keyframes shock { 0%, 45% { opacity: 0; transform: scale(.2); } 60% { opacity: .85; } 100% { opacity: 0; transform: scale(2.4); } }

  .start .lede { font-size: clamp(15.5px, 1.45vw, 18px); line-height: 1.5; color: rgba(244, 242, 255, .78); max-width: 48ch; margin: 0; }
  .start .lede b { color: var(--text); font-weight: 600; white-space: nowrap; }

  /* выбор категории: лента «фишек» (.tile живёт в auction-shared.css — её же использует лобби доски) */
  .pick-cap { margin-bottom: 11px; }
  .pick-cap::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--glass-line), transparent); }

  /* главная кнопка */
  .cta { display: flex; flex-direction: column; gap: 11px; }
  .cta .big {
    position: relative; overflow: hidden; border-radius: 20px;
    padding: clamp(20px, 2.6vh, 26px) 24px;
    font-size: clamp(17px, 2.1vw, 23px); letter-spacing: .05em;
    box-shadow: 0 22px 60px -22px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45);
    cursor: pointer; transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), box-shadow .3s;
  }
  .cta .big::before {
    content: "→"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border-radius: 50%; background: rgba(10, 10, 15, .16);
    display: grid; place-items: center; font: 500 20px/1 var(--body);
    transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
  }
  .cta .big:hover { transform: translateY(-2px); box-shadow: 0 30px 70px -20px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45); }
  .cta .big:hover::before { transform: translateY(-50%) translateX(4px); }
  .cta .big:disabled { opacity: .6; transform: none; }
  .cta .big::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .5), transparent); transform: skewX(-20deg); animation: shine 3.6s ease-in-out infinite; }
  @keyframes shine { 0%, 55% { left: -40%; } 100% { left: 130%; } }
  .cta .sub2 { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: rgba(244, 242, 255, .68); }
  .cta .sub2 .link { flex: none; margin-left: auto; display: inline-flex; align-items: center; min-height: 44px; color: var(--text); text-decoration: none; font-weight: 500; border: 1px solid var(--glass-line); border-radius: 999px; padding: 0 16px; transition: border-color .2s, background .2s; }
  .cta .sub2 .link:hover { border-color: var(--c1); background: rgba(255, 255, 255, .06); }

  /* три шага */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; border-top: 1px solid var(--glass-line); padding-top: 14px; }
  .step { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; }
  .step .k { grid-row: 1 / span 2; font: 900 24px/.95 var(--display); color: var(--c1); }
  .step .t { font: 600 13.5px/1.3 var(--body); }
  .step .d { font-size: 12.5px; line-height: 1.4; color: rgba(244, 242, 255, .68); }
  @media (max-width: 560px) { .steps { grid-template-columns: 1fr; gap: 12px; } }

  /* ===== живая лента лотов ===== */
  .stage { display: flex; flex-direction: column; gap: 10px; pointer-events: none; user-select: none; }
  .stage-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 700 10px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; }
  .stage-head .live { display: flex; align-items: center; gap: 8px; color: rgba(244, 242, 255, .7); }
  .stage-head .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--c1); box-shadow: 0 0 12px var(--c1); animation: glow 1.4s ease-in-out infinite alternate; }
  .stage-head .stage-kind { color: var(--c1); }
  .stage-foot { font: 500 11.5px/1 var(--body); color: rgba(244, 242, 255, .5); text-align: center; }
  .reel {
    position: relative; overflow: hidden;
    border-radius: 22px;
    transition: opacity .3s;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 9%, #000 88%, transparent);
    mask-image: linear-gradient(180deg, transparent, #000 9%, #000 88%, transparent);
  }
  .reel.swap { opacity: .35; }
  .reel-track { display: flex; flex-direction: column; animation: reelY 34s linear infinite; will-change: transform; }
  @keyframes reelY { to { transform: translateY(-50%); } }
  .lotcard {
    flex: none; display: flex; align-items: center; gap: 11px;
    margin-bottom: 10px; padding: 11px 13px;
    border-radius: 18px; border: 1px solid var(--glass-line);
    background: linear-gradient(120deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .03));
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 40px -30px #000;
  }
  .lotcard .lc-emoji { flex: none; font-size: 23px; line-height: 1; }
  .lotcard .lc-text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .lotcard .lc-name { font: 600 14.5px/1.2 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lotcard .lc-meta { font-size: 11.5px; color: rgba(244, 242, 255, .58); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* закрытый лот: эмодзи, цена и печать настоящие, имя — плашка, чтобы колода не раскрывалась до игры */
  .lotcard .lc-name.closed { color: rgba(244, 242, 255, .74); font-weight: 500; }
  .lotcard .lc-name.closed b { font: 700 10px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--c1); margin-right: 7px; }
  .lotcard .lc-meta.bars { display: flex; align-items: center; gap: 5px; height: 14px; filter: blur(.5px); }
  .lotcard .lc-meta.bars i { display: block; height: 7px; border-radius: 3px; background: linear-gradient(90deg, rgba(244, 242, 255, .34), rgba(244, 242, 255, .14)); }
  .lotcard .lc-bid { flex: none; font: 900 17px/1 var(--display); letter-spacing: -.02em; color: var(--c1); }
  .lotcard .lc-stamp { flex: none; font: 900 9px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--c3); border: 1.5px solid var(--c3); border-radius: 6px; padding: 5px 6px; transform: rotate(-7deg); }
  .lotcard.hot { border-color: color-mix(in srgb, var(--c1) 75%, transparent); background: linear-gradient(120deg, color-mix(in srgb, var(--c1) 22%, transparent), rgba(255, 255, 255, .04)); box-shadow: 0 16px 44px -22px var(--c1); }
  .lotcard.skel { height: 59px; background: rgba(255, 255, 255, .04); }
  .lotcard.skel::after { content: ""; flex: 1; height: 100%; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .07) 50%, transparent 70%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
  @media (min-width: 900px) { .reel { height: clamp(360px, 64vh, 620px); } }
  @media (max-width: 899px) {
    /* на телефоне лента едет вбок */
    .reel { -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 92%, transparent); }
    .reel-track { flex-direction: row; width: max-content; animation-name: reelX; animation-duration: 42s; }
    .lotcard { width: 246px; margin: 0 10px 0 0; }
    .lotcard.skel { height: 59px; }
    @keyframes reelX { to { transform: translateX(-50%); } }
  }

  @media (prefers-reduced-motion: reduce) {
    .reel-track, .start h1 em, .start .eyebrow i, .stage-head .live i, .cta .big::after, .tile, .lotcard.skel::after,
    .start h1 .gavel.hit, .start h1 .gavel.hit::after, .lead.sold .cap, .lead.sold .cap::before, .big.flash { animation: none !important; }
    .cta .big::after { display: none; }
    .tile { opacity: 1; }
  }

  /* вход и лобби: экран ожидания стоит ровно по центру по вертикали */
  /* 52px сверху — зазор под переключателем языка: на 320px длинный заголовок («Δημοπρασία»)
     иначе подлезал под него, когда содержимого много и центрирование упирается в верх экрана */
  .center { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 12px; padding-top: 52px; }
  /* экран ввода имени: страница должна скроллиться, иначе мобильная клавиатура накрывает поле */

  /* 62px снизу — гарантированный зазор под служебной строкой «Все игры / звук» (в том числе в ландшафте) */
  .center.enter { justify-content: flex-start; padding-top: clamp(62px, 12vh, 120px); padding-bottom: 40vh; }
  h1 { font: 900 32px/1 var(--display); text-transform: uppercase; letter-spacing: -.03em; margin: 0 0 6px; }
  h1 em { font-style: normal; background: linear-gradient(100deg, var(--c1), var(--c2) 55%, var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  input[type=text] { font: 600 18px var(--body); color: var(--text); background: rgba(255, 255, 255, .06); border: 1px solid var(--glass-line); border-radius: 16px; padding: 16px; outline: none; width: 100%; -webkit-appearance: none; appearance: none; }
  input:focus { border-color: var(--c1); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: rgba(255, 255, 255, .06); border: 1px solid var(--glass-line); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .chip.me { border-color: var(--c1); }
  .link { color: var(--c1); }

  /* финал */
  .final { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: safe center; gap: 4px; }
  .place { font: 900 64px/1 var(--display); text-align: center; }
  .place.none { font-size: 34px; color: var(--muted); }
  .score { font: 900 40px/1 var(--display); color: var(--c1); text-align: center; }
  .verdict { text-align: center; margin: 10px 0 14px; }
  .lots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .vote { display: flex; flex-direction: column; gap: 8px; }
  .vote .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(255, 255, 255, .05); border: 1px solid var(--glass-line); border-radius: 14px; }
  /* на 320px кнопка «Голос» выезжала за экран: имя теперь сжимается, а кнопка при нехватке места уходит на свою строку */
  .vote .row .n { flex: 1 1 60%; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .vote .row small { color: var(--muted); display: block; font-weight: 400; }
  .vote .row .mid { flex: 0 0 auto; margin-left: auto; min-height: 44px; padding: 12px 20px; }
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .65); backdrop-filter: blur(6px); display: none; place-items: center; z-index: 50; font: 900 26px var(--display); text-transform: uppercase; text-align: center; padding: 20px; }
  .overlay.on { display: grid; }
  /* закрытая шторка не должна перехватывать тапы (на телефоне это ломало ввод имени) */
  .sheet { position: fixed; inset: auto 0 0 0; background: #1a1822; border-radius: 22px 22px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 78vh; max-height: 78dvh; overflow-y: auto; transform: translateY(100%); transition: transform .3s, visibility .3s; z-index: 40; visibility: hidden; pointer-events: none; }
  .sheet.on { transform: none; visibility: visible; pointer-events: auto; }
  /* «Закрыть» всегда под рукой, даже если факт длинный и шторка прокручивается */
  .sheet .mid { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom)); margin-top: 16px; background: #1a1822; box-shadow: 0 -12px 18px 6px #1a1822; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 45; }

  /* ===== телефон боком: лот слева, ставка справа (иначе всё налезает друг на друга) ===== */
  @media (orientation: landscape) and (max-height: 520px) {
    .screen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 38%); grid-template-rows: auto auto minmax(0, 1fr) auto auto; column-gap: 14px; }
    /* экраны из одного блока (старт, вход, ожидание, финал) занимают всю сетку */
    .screen > .start, .screen > .center, .screen > .final { grid-column: 1 / -1; grid-row: 1 / -1; }
    .status { grid-column: 1 / -1; grid-row: 1; }
    /* без явного места строка задания попадала в автоячейку и вываливалась за нижнюю кромку */
    .screen > .taskbar { grid-column: 1 / -1; grid-row: 2; margin: 4px 0 0; }
    .lotbox { grid-column: 1; grid-row: 3 / -1; margin: 8px 0 0; }
    .bidinfo { grid-column: 2; grid-row: 3; align-self: end; justify-content: flex-start; margin: 8px 0 10px; }
    .actions { grid-column: 2; grid-row: 4; min-height: 0; }
    .note { grid-column: 2; grid-row: 5; }
    .big { padding: 16px; }
    .mid { padding: 14px; }
    .lotbox .name { -webkit-line-clamp: 2; }
  }
</style>

<script src="i18n.js"></script>

<script>
// какой экран открыт: от этого зависит, скроллится ли страница (важно для мобильной клавиатуры)
function screenMode(mode) {
  const b = document.body;
  b.classList.remove("m-start", "m-enter", "m-final", "m-game");
  if (mode) b.classList.add("m-" + mode);
}
const params = new URLSearchParams(location.search);
// код комнаты идёт в innerHTML — оставляем только буквы алфавита кодов, иначе ?r=<img onerror> даёт XSS
const CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 8);
// Язык интерфейса — устройства, а не комнаты. Задание и название категории это подписи, а не
// содержимое лота: игрок с английским телефоном должен читать их по-английски, даже если партия
// идёт на русских карточках. От языка комнаты зависят только сами лоты и вердикты судьи —
// они приходят с сервера и общие для всех за столом.
const uiLang = () => (window.I18N && window.I18N.lang) || "ru";
const app = document.getElementById("app");
const overlay = document.getElementById("overlay");
let state = null, ws, offset = 0, me = null, token = null, lastLot = -1, thumbLot = -1;
// категорию и счётчики стартового экрана держим снаружи: при смене языка экран перерисовывается,
// и выбор игрока не должен слетать, а счётчики — грузиться заново
let startKind = null, startCounts = null;
// ключ последней ошибки входа: при смене языка экран входа перерисовывается вместе с ней
let joinErrKey = null;

// ---------- язык ----------
// Если i18n.js не доехал (блокировщик, сбой раздачи статики) — пульт обязан работать по-русски,
// а не остаться белым экраном. Настоящий I18N, если он загрузился, эту заглушку не трогает.
window.I18N = window.I18N || { t: function (k) { const d = (window.I18N_DICT || {}).ru || {}; return k in d ? d[k] : k; }, lang: "ru", setLang: function () {}, supported: ["ru"] };
// Все подстановки идут через явные {плейсхолдеры}: в английском и греческом порядок слов свой,
// поэтому склеивать строку из кусков нельзя.
const tpl = (key, vars) => String(I18N.t(key)).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
const NUM_LOCALE = { ru: "ru-RU", en: "en-US", el: "el-GR" };
const numFmt = (n) => Number(n).toLocaleString(NUM_LOCALE[I18N.lang] || "en-US");
// формы слова: в русском их три (лот / лота / лотов), в английском и греческом хватает двух
function pluralWord(n, key) {
  const forms = I18N.t(key);
  if (!Array.isArray(forms)) return String(forms);
  if (I18N.lang === "ru") {
    const i = n % 10 === 1 && n % 100 !== 11 ? 0 : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 1 : 2);
    return forms[i] || forms[forms.length - 1];
  }
  return n === 1 ? forms[0] : (forms[1] || forms[0]);
}
// оверлей помнит свой ключ: при смене языка надпись обязана перевестись, а не застыть
let overlayKey = null;
function setOverlay(key) {
  overlayKey = key || null;
  overlay.textContent = overlayKey ? I18N.t(overlayKey) : "";
  overlay.classList.toggle("on", !!overlayKey);
}

if (!CODE) renderCreate();
else { try { token = localStorage.getItem("auction-token-" + CODE); } catch {} if (token) join(""); else if (params.get("name")) join(params.get("name")); else renderJoin(); }

// Смена языка: статические узлы обновит сам i18n.js, но все экраны пульта строит JS — перерисовываем.
window.addEventListener("langchange", () => {
  if (overlayKey) setOverlay(overlayKey);
  if (state) { app.innerHTML = ""; lastLot = -1; introShown = null; render(); return; }
  const input = document.getElementById("name");
  if (input) { const v = input.value; renderJoin(joinErrKey); const again = document.getElementById("name"); if (again) again.value = v; return; }
  if (document.querySelector(".start")) renderCreate();
});

// ---------- стартовый экран (этот экран становится доской) ----------
async function renderCreate() {
  screenMode("start");
  if (!startCounts) { let c = {}; try { c = await (await fetch("/auction/api/kinds")).json(); } catch {} startCounts = c; }
  const counts = startCounts;
  const kinds = Object.keys(AUCTION_KINDS).filter((k) => !Object.keys(counts).length || counts[k]);
  if (!startKind || kinds.indexOf(startKind) === -1) startKind = kinds[Math.floor(Math.random() * kinds.length)] || "artist";
  let kind = startKind;
  document.body.dataset.kind = kind;
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  app.innerHTML = `<div class="start">
    <div class="start-head">
      <div class="eyebrow"><i></i>${I18N.t("start_eyebrow")}</div>
      <h1><span class="w">${I18N.t("h1_a")}</span><em>${I18N.t("h1_b")}</em><span class="gavel" id="gavel" aria-hidden="true">🔨</span></h1>
      <p class="lede">${I18N.t("start_lede")}</p>
    </div>
    <div class="stage" aria-hidden="true">
      <div class="stage-head"><span class="live"><i></i>${I18N.t("stage_live")}</span><span class="stage-kind" id="stagekind"></span></div>
      <div class="reel" id="reel"><div class="reel-track" id="reeltrack"></div></div>
      <div class="stage-foot">${I18N.t("stage_foot")}</div>
    </div>
    <div class="start-body">
      <div class="picker">
        <div class="eyebrow pick-cap">${total ? tpl("pick_cap_n", { n: numFmt(total), w: pluralWord(total, "plural_lot") }) : I18N.t("pick_cap")}</div>
        <div class="tiles" id="tiles">${kinds.map((k, i) => `<button class="tile ${k === kind ? "on" : ""}" data-kind="${k}" style="animation-delay:${i * 0.03}s"><span class="ico">${AUCTION_KINDS[k].icon}</span>${auctionKind(k, uiLang()).button}${counts[k] ? `<span class="n">${counts[k]}</span>` : ""}</button>`).join("")}</div>
      </div>
      <div class="cta">
        <button class="big" id="create">${I18N.t("btn_create")}</button>
        <div class="sub2"><span>${I18N.t("cta_sub")}</span><a class="link" href="#" id="havecode">${I18N.t("have_code")}</a></div>
      </div>
      <div class="steps">
        <div class="step"><div class="k">1</div><div class="t">${I18N.t("step1_t")}</div><div class="d">${I18N.t("step1_d")}</div></div>
        <div class="step"><div class="k">2</div><div class="t">${I18N.t("step2_t")}</div><div class="d">${I18N.t("step2_d")}</div></div>
        <div class="step"><div class="k">3</div><div class="t">${I18N.t("step3_t")}</div><div class="d">${I18N.t("step3_d")}</div></div>
      </div>
    </div>
  </div>`;
  showKind(kind, counts[kind]);
  document.getElementById("tiles").onclick = (e) => {
    const t = e.target.closest(".tile"); if (!t) return;
    if (t.dataset.kind === kind) return strikeGavel();
    kind = startKind = t.dataset.kind;
    document.querySelectorAll(".tile").forEach((x) => x.classList.toggle("on", x === t));
    showKind(kind, counts[kind]);
  };
  document.getElementById("create").onclick = async () => {
    const btn = document.getElementById("create"); btn.disabled = true; btn.textContent = I18N.t("btn_creating");
    try {
      const res = await fetch("/auction/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kind }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || I18N.t("err_create"));
      location.href = `auction-board.html?r=${data.code}&t=${data.hostToken}`;
    } catch (err) { btn.disabled = false; btn.textContent = I18N.t("btn_create"); alert(err.message); }
  };
  document.getElementById("havecode").onclick = (e) => { e.preventDefault(); const c = prompt(I18N.t("prompt_code")); if (c) location.href = `auction.html?r=${c.trim().toUpperCase()}`; };
}

// ---------- живая лента лотов на стартовом экране ----------
// Витрина: показываем настоящие карточки выбранной категории с «ценой» и печатью «продано».
// Данные лежат рядом с доской (auction-data/<kind>.js → window.CARDS[kind]) — грузим по одному файлу лениво.
let reelToken = 0;
const cardsLoading = {};

function loadCards(kind) {
  if ((window.CARDS || {})[kind]) return Promise.resolve(window.CARDS[kind]);
  cardsLoading[kind] = cardsLoading[kind] || new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = `auction-data/${kind}.js`;
    s.onload = () => res((window.CARDS || {})[kind] || []);
    s.onerror = () => { delete cardsLoading[kind]; rej(new Error("no data")); };
    document.head.append(s);
  });
  return cardsLoading[kind];
}

function strikeGavel() {
  const g = document.getElementById("gavel");
  if (!g) return;
  g.classList.remove("hit"); void g.offsetWidth; g.classList.add("hit");
}

function showKind(kind, count) {
  document.body.dataset.kind = kind;
  const cap = document.getElementById("stagekind");
  if (cap) cap.textContent = count
    ? tpl("stage_kind_n", { kind: auctionKind(kind, uiLang()).button, n: numFmt(count), w: pluralWord(count, "plural_lot") })
    : auctionKind(kind, uiLang()).button;
  strikeGavel();
  fillReel(kind);
}

function fillReel(kind) {
  const track = document.getElementById("reeltrack");
  if (!track) return;
  const my = ++reelToken, reel = track.parentElement;
  if (!track.children.length) track.innerHTML = '<div class="lotcard skel"></div>'.repeat(8);
  reel.classList.add("swap");
  loadCards(kind).then((cards) => {
    if (my !== reelToken) return;
    if (!cards.length) return reel.classList.remove("swap");
    // Интрига: колоду не раскрываем. Открытыми едут только две «звезды» — начало массива
    // отсортировано по известности; у остальных настоящие эмодзи, цена и печать, а имя закрыто плашкой.
    const shuffled = (arr, n) => arr.slice().sort(() => Math.random() - .5).slice(0, n);
    const OPEN = [1, 5, 8];
    const stars = shuffled(cards.slice(0, Math.min(14, cards.length)), OPEN.length);
    const deck = cards.map((c, i) => ({ c, i })).filter((x) => !stars.includes(x.c));
    const hidden = shuffled(deck, 9 - OPEN.length);
    const list = [];
    for (let i = 0, s = 0, h = 0; i < 9; i++) list.push(OPEN.includes(i) ? { star: stars[s++] || stars[0] } : hidden[h++] || { star: stars[0] });

    const html = list.map((item, i) => {
      const sold = i % 4 === 2, hot = i % 5 === 1;
      const card = item.star || item.c;
      const tail = sold ? `<span class="lc-stamp">${I18N.t("stamp_sold")}</span>` : `<span class="lc-bid">$${2 + Math.floor(Math.random() * 26)}</span>`;
      const body = item.star
        ? `<span class="lc-name">${escapeHtml(card.name)}</span><span class="lc-meta">${escapeHtml((card.meta || []).slice(0, 2).join(" · "))}</span>`
        : `<span class="lc-name closed">${tpl("lc_lot_no", { n: String(item.i + 1).padStart(3, "0") })}</span><span class="lc-meta bars" aria-hidden="true">${maskBars(card.name)}</span>`;
      return `<div class="lotcard${hot ? " hot" : ""}"><span class="lc-emoji">${card.emoji || AUCTION_KINDS[kind].icon}</span>` +
        `<span class="lc-text">${body}</span>${tail}</div>`;
    }).join("");
    track.innerHTML = html + html; // две копии — для бесшовной прокрутки
    reel.classList.remove("swap");
  }).catch(() => { if (my === reelToken) reel.classList.remove("swap"); });
}

// имя закрытого лота → плашки по длине слов: ритм живой, текста в DOM нет
function maskBars(name) {
  return String(name).split(/\s+/).slice(0, 3)
    .map((w) => `<i style="width:${Math.min(86, Math.max(16, w.length * 8))}px"></i>`).join("");
}

// ---------- вход ----------
// error — ключ словаря (или сырая ошибка сервера: I18N.t вернёт её как есть)
function renderJoin(error) {
  screenMode("enter");
  joinErrKey = error || null;
  app.innerHTML = `<div class="center enter"><h1>${I18N.t("h1_a")}<em>${I18N.t("h1_b")}</em></h1><p class="sub">${tpl("join_room", { code: CODE })}</p>
    <label for="name" class="note" style="text-align:left;margin:0">${I18N.t("join_label")}</label>
    <input type="text" id="name" maxlength="24" placeholder="${escapeHtml(I18N.t("ph_name"))}" autocomplete="nickname" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" inputmode="text">
    <button class="big" id="go">${I18N.t("btn_go")}</button><div class="note" id="err">${error ? escapeHtml(I18N.t(error)) : ""}</div></div>`;
  const input = document.getElementById("name");
  const go = () => { const n = input.value.trim(); if (n) join(n); };
  document.getElementById("go").onclick = go;
  // Тело обязано быть блоком: стрелка вида `e.key === "Enter" && go()` возвращает false на любой
  // другой клавише, а DOM0-обработчик, вернувший false, отменяет действие по умолчанию —
  // символ не вставлялся, и имя нельзя было ввести вообще.
  input.onkeydown = (e) => { if (e.key === "Enter") go(); };
  // мобильная клавиатура: поднимаем поле над ней, когда оно получило фокус
  input.addEventListener("focus", () => setTimeout(() => input.scrollIntoView({ block: "center", behavior: "smooth" }), 300));
  // autofocus в innerHTML не срабатывает; на мобильных фокус без жеста всё равно запрещён — там просто тап
  if (!matchMedia("(hover: none)").matches) input.focus();
}

function join(name) {
  ws = openTransport({
    code: CODE,
    onOpen: () => sendMsg({ type: "join", name, token }),
    onMessage: (msg) => {
      if (msg.type === "joined") { me = msg.playerId; token = msg.token; try { localStorage.setItem("auction-token-" + CODE, token); } catch {} }
      if (msg.type === "hello" || msg.type === "state") setState(msg.state);
      if (msg.type === "event") onEvent(msg.event);
      if (msg.type === "rejected") onRejected(msg);
      if (msg.type === "replaced") { ws.close(); setOverlay("ov_replaced"); }
      if (msg.type === "kicked") { ws.close(); try { localStorage.removeItem("auction-token-" + CODE); } catch {} setOverlay("ov_kicked"); }
      if (msg.type === "error") {
        ws.close();
        if (msg.error === "game_started") renderJoin("err_started");
        else if (msg.error === "room_full") renderJoin("err_room_full");
        else renderJoin(msg.error);
      }
    },
    onClose: () => { setOverlay("ov_offline"); setTimeout(() => join(name), 2000); },
    onSendFail: (msg) => { const n = document.getElementById("note"); if (n && msg && msg.type === "bid") n.textContent = I18N.t("note_send_fail"); },
  });
}
const sendMsg = (m) => ws && ws.send(m);

function setState(s) {
  if (!me) return;
  state = s;
  offset = s.serverNow - Date.now();
  document.body.dataset.kind = s.kind;
  setOverlay(s.paused ? "ov_paused" : null);
  render();
}
const money = (n) => "$" + numFmt(n);
const mine = () => state.players.find((p) => p.id === me);
// Если auction-modes.js не доехал (блокировщик, сбой раздачи статики), задание неизвестно.
// Врать нельзя: показать «Лучший набор», когда сервер судит по «Худшему», хуже, чем не показать
// ничего — доска-то задание знает, и игрок весь матч собирал бы обратное тому, что судят.
const modeNow = () => (window.auctionModeText ? auctionModeText(state && state.settings && state.settings.mode, state && state.kind, uiLang()) : null);
const taskNow = () => { const m = modeNow(); return m && m.id !== "base" ? m : null; };
const nameOf = (id) => (state.players.find(function (p) { return p.id === id; }) || {}).name || "?";

// ---------- звук ----------
let actx;
function beep(freq, ms = 90, type = "sine", gain = .1) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = freq; g.gain.value = gain; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + ms / 1000); } catch {}
}
function onEvent(e) {
  if (e.type === "outbid" && e.playerId === me) { beep(220, 200, "square"); flashButton(I18N.t("note_outbid")); }
  if (e.type === "sold" && e.playerId === me) { beep(520, 120); setTimeout(() => beep(780, 180), 130); confetti(); }
  if (e.type === "taken" && e.playerId === me) { beep(440, 160, "triangle"); confetti(); }
  if (e.type === "lot") beep(880, 40, "sine", .04);
}
function onRejected(r) {
  const note = document.getElementById("note");
  if (!note) return;
  // причины известны заранее: незнакомую показываем как есть, а не ключом словаря
  const known = ["price_changed", "too_low", "not_enough_money", "already_leader", "closed", "cannot_bid"];
  note.textContent = known.indexOf(r.reason) !== -1 ? I18N.t("rej_" + r.reason) : r.reason;
  render();
}
function flashButton(text) { const b = document.getElementById("bid"); if (!b) return; b.classList.add("flash"); const note = document.getElementById("note"); if (note) note.textContent = text; setTimeout(() => b.classList.remove("flash"), 400); }

// ---------- рендер ----------
function render() {
  if (!state) return;
  if (state.phase === "lobby") return renderLobby();
  if (state.phase === "intro") return renderIntro();
  if (state.phase === "finished") return renderFinal();
  renderGame();
}

// Заставка: на телефоне она нарочно почти пустая — смысл в том, чтобы игрок поднял голову
// на большой экран, где крупно показывают задание и отсчёт. Цифры дублируем, чтобы те,
// кто всё-таки смотрит в телефон, не пропустили старт торгов.
const COUNTDOWN_MS = 3000;
let introShown = null, introLoop = false, timerLoop = false;

function renderIntro() {
  screenMode("");
  lastLot = -1;
  const s = state, m = modeNow();
  if (!document.getElementById("introbox")) {
    app.innerHTML = `<div class="center intro" id="introbox">
      <p class="sub">${I18N.t("intro_watch")}</p>
      ${m ? `<div class="plate task"><span class="eyebrow">${I18N.t("task_eyebrow")}</span><b>${m.icon} ${escapeHtml(m.title)}</b>${escapeHtml(m.short || "")}.</div>` : ""}
      <div class="icount" id="icount">${I18N.t("intro_starting")}</div>
    </div>`;
    introShown = null;
    // цикл заводим один раз: он живёт до конца страницы, а экран перерисовывается и при смене языка
    if (!introLoop) { introLoop = true; requestAnimationFrame(tickIntro); }
  }
}

function tickIntro() {
  const box = document.getElementById("icount");
  if (!box || !state || state.phase !== "intro") { introShown = null; return requestAnimationFrame(tickIntro); }
  const left = Math.max(0, state.deadline - (Date.now() + offset));
  if (left <= COUNTDOWN_MS) {
    const n = Math.max(1, Math.ceil(left / 1000));
    if (introShown !== n) { introShown = n; box.textContent = String(n); box.className = "icount go"; }
  }
  requestAnimationFrame(tickIntro);
}

function renderLobby() {
  screenMode("");
  lastLot = -1;
  const m = modeNow(), slots = state.settings.slots;
  app.innerHTML = `<div class="center"><h1>${I18N.t("h1_a")}<em>${I18N.t("h1_b")}</em></h1><p class="sub">${tpl("lobby_sub", { code: CODE })}</p>
    <div class="plate"><b>${(AUCTION_KINDS[state.kind] || {}).icon || ""} ${auctionKind(state.kind, uiLang()).label || state.kind}</b>${tpl("lobby_budget", { money: money(state.settings.budget), slots: slots, w: pluralWord(slots, "plural_slot") })}</div>
    ${m ? `<div class="plate task"><span class="eyebrow">${I18N.t("task_eyebrow")}</span><b>${m.icon} ${escapeHtml(m.title)}</b>${escapeHtml(m.short || "")}.<span class="by">${state.settings.judge === "vote" ? I18N.t("lobby_judge_vote") : tpl("lobby_judge_ai", { how: escapeHtml(m.judge || "") })}</span></div>` : ""}
    <div class="chips">${state.players.map((p) => `<span class="chip ${p.id === me ? "me" : ""}">${escapeHtml(p.name)}</span>`).join("")}</div></div>`;
}

function renderGame() {
  screenMode("game");
  const s = state, p = mine();
  if (!p) return;
  if (!document.getElementById("bidbox")) {
    app.innerHTML = `<div class="status"><b id="myname"></b><span class="slots" id="myslots"></span><span class="spacer"></span><span id="lotno"></span><span class="money" id="mymoney"></span></div>
      <div class="taskbar" id="task"></div>
      <div class="lotbox" id="lot"></div>
      <div class="bidinfo"><div class="ring" id="ring"><svg viewBox="0 0 62 62"><circle class="track" cx="31" cy="31" r="27"/><circle class="arc" id="arc" cx="31" cy="31" r="27" stroke-dasharray="170" stroke-dashoffset="0"/></svg><div class="num" id="tnum"></div></div><div class="lead" id="lead"></div></div>
      <div class="actions" id="bidbox"></div><div class="note" id="note"></div>`;
    // как и в заставке: один цикл на всю страницу, иначе смена языка удваивала бы кадры
    if (!timerLoop) { timerLoop = true; requestAnimationFrame(tickTimer); }
  }
  document.getElementById("myname").textContent = p.name;
  document.getElementById("mymoney").textContent = money(p.money);
  document.getElementById("lotno").textContent = tpl("lot_counter", { n: s.round + 1, total: s.rounds });
  const task = document.getElementById("task");
  if (task) {
    const custom = taskNow();
    task.className = "taskbar" + (custom ? " on" : "");
    if (custom) task.replaceChildren(el("b", null, custom.icon + " " + custom.title), el("span", null, custom.short || ""));
  }
  const slots = document.getElementById("myslots");
  slots.replaceChildren(...Array.from({ length: s.settings.slots }, (_, i) => { const d = el("i", i < p.lots.length ? "on" : null); return d; }));

  if (s.lot && lastLot !== s.round) { lastLot = s.round; renderLot(s.lot, s.kind); }

  const lead = document.getElementById("lead");
  lead.replaceChildren();
  lead.className = "lead" + (s.phase === "sold" || s.phase === "taken" ? " sold" : "");
  if (s.phase === "lot" || s.phase === "bidding") {
    const who = el("div", "who");
    if (s.leaderId) { who.append(el("b", null, s.leaderId === me ? I18N.t("you") : nameOf(s.leaderId)), document.createTextNode(` ${money(s.price)}`)); lead.append(el("div", "cap", I18N.t("cap_leader")), who); }
    else { who.textContent = I18N.t("no_bids"); lead.append(el("div", "cap", tpl("cap_min", { money: money(1) })), who); }
  } else if (s.phase === "pickup") lead.append(el("div", "cap", I18N.t("cap_pickup")), el("div", "who", I18N.t("pickup_none")));
  else if (s.phase === "sold" || s.phase === "taken") { const who = el("div", "who"); who.append(el("b", null, s.leaderId === me ? I18N.t("yours") : nameOf(s.leaderId)), document.createTextNode(" " + (s.phase === "sold" ? money(s.price) : I18N.t("for_free")))); lead.append(el("div", "cap", I18N.t(s.phase === "sold" ? "cap_sold" : "cap_taken")), who); }
  else lead.append(el("div", "cap", ""), el("div", "who", I18N.t("nobody_took")));

  renderActions(p);
}

function renderLot(lot, kind) {
  const box = document.getElementById("lot");
  box.replaceChildren();
  const img = el("img", "thumb"); img.alt = "";
  const meta = el("div", "meta"); (lot.meta || []).forEach((m) => meta.append(el("span", null, m)));
  const more = el("button", "more", I18N.t("more_btn"));
  more.onclick = () => openSheet(lot);
  box.append(img, el("div", "emoji", lot.emoji), el("div", "kind", auctionKind(kind, uiLang()).label || kind), el("div", "name", lot.name), meta, el("div", "short", lot.description), more);
  document.getElementById("note").textContent = "";
  // картинка: тот же поиск, что на доске, но маленькая
  const round = state.round;
  findImage(lot, kind).then((found) => { if (found && state.round === round) { img.src = found.src; img.classList.add("on"); } }).catch(() => {});
}

function renderActions(p) {
  const s = state, box = document.getElementById("bidbox");
  box.replaceChildren();
  const plate = (cls, title, text) => { const d = el("div", "plate " + cls); if (title) d.append(el("b", null, title)); d.append(document.createTextNode(text || "")); return d; };
  if (p.full) return box.append(plate("", I18N.t("done_title"), I18N.t("done_text")));
  if (s.phase === "pickup") {
    if (p.canTake) { const b = el("button", "big", I18N.t("take_free")); b.onclick = () => sendMsg({ type: "take" }); return box.append(b); }
    return box.append(plate("", "", I18N.t(p.money === 0 ? "already_taken" : "pickup_hint")));
  }
  if (s.phase !== "lot" && s.phase !== "bidding") return box.append(plate("", "", I18N.t("next_lot")));
  if (p.money === 0) return box.append(plate("", I18N.t("broke_title"), I18N.t("broke_text")));
  if (s.leaderId === me) return box.append(plate("lead-me", I18N.t("lead_me_title"), tpl("lead_me_text", { money: money(s.price) })));
  const next = s.price + 1;
  if (next > p.money) return box.append(plate("err", I18N.t("not_enough_title"), tpl("not_enough_text", { have: money(p.money), need: money(next) })));
  const big = el("button", "big", tpl("bid_btn", { money: money(next) })); big.id = "bid";
  big.onclick = () => { unlockAudio(); sendMsg({ type: "bid", amount: next, expectedPrice: s.price }); };
  box.append(big);
  const plus = s.price + 5;
  if (plus <= p.money) { const m = el("button", "mid", tpl("plus5_btn", { money: money(plus) })); let t = 0; m.onclick = () => { if (Date.now() - t < 300) return; t = Date.now(); sendMsg({ type: "bid", amount: plus, expectedPrice: s.price }); }; box.append(m); }
}

function tickTimer() {
  const ring = document.getElementById("ring");
  if (!state || !ring) return requestAnimationFrame(tickTimer);
  const s = state;
  const total = { lot: s.settings.t1, bidding: s.settings.t2, pickup: 5000 }[s.phase] || 2000;
  const left = s.paused ? total : Math.max(0, s.deadline - (Date.now() + offset));
  document.getElementById("arc").setAttribute("stroke-dashoffset", String(170 * (1 - Math.min(1, left / total))));
  document.getElementById("tnum").textContent = (s.phase === "lot" || s.phase === "bidding" || s.phase === "pickup") ? Math.ceil(left / 1000) : "";
  ring.classList.toggle("urgent", left < 3000 && s.phase !== "sold");
  requestAnimationFrame(tickTimer);
}

function openSheet(lot) {
  const sh = document.getElementById("sheet");
  sh.innerHTML = `<div style="font:900 22px var(--display);margin-bottom:8px">${escapeHtml(lot.name)}</div><p>${escapeHtml(lot.description)}</p><p class="fact"><b>${I18N.t("sheet_fact")}</b>${escapeHtml(lot.fact)}</p><button class="mid" id="close">${I18N.t("sheet_close")}</button>`;
  sh.classList.add("on");
  document.getElementById("close").onclick = () => sh.classList.remove("on");
}

function renderFinal() {
  screenMode("final");
  const s = state, p = mine();
  lastLot = -1;
  const players = s.players.filter((x) => !x.left);
  if (!s.results) {
    if (s.voting) {
      // Задание обязано быть на этом экране: голосование — единственный режим, где оно
      // больше ни на что не влияет, и без напоминания критерия «худший набор» голосуют за лучший.
      const vtask = taskNow();
      app.innerHTML = `<div class="final"><h1>${I18N.t("vote_h1_a")}<em>${I18N.t("vote_h1_b")}</em></h1>${vtask ? `<div class="taskbar on" style="justify-content:center"><b>${escapeHtml(vtask.icon + " " + vtask.title)}</b><span style="flex:none">${escapeHtml(vtask.short || "")}</span></div>` : ""}<p class="sub">${tpl("vote_sub", { n: s.votes, total: players.filter((x) => x.lots.length).length })}</p><div class="vote" id="vote"></div></div>`;
      const box = document.getElementById("vote");
      players.filter((x) => x.id !== me && x.lots.length).forEach((x) => {
        const row = el("div", "row"); const n = el("div", "n", x.name); n.append(el("small", null, x.lots.map((l) => l.emoji + " " + l.name).join(" · ")));
        const b = el("button", "mid", I18N.t("vote_btn")); b.style.width = "auto"; b.onclick = () => { sendMsg({ type: "vote", for: x.id }); box.querySelectorAll("button").forEach((q) => (q.disabled = true)); b.textContent = "✓"; };
        row.append(n, b); box.append(row);
      });
      return;
    }
    app.innerHTML = `<div class="center" style="text-align:center"><div style="font-size:56px">🎲</div><h1>${I18N.t("judge_h1_a")}<em>${I18N.t("judge_h1_b")}</em></h1><p class="sub">${I18N.t("judge_sub")}</p></div>`;
    return;
  }
  const idx = s.results.ranking.findIndex((r) => r.playerId === me);
  const r = s.results.ranking[idx];
  const places = ["🥇", "🥈", "🥉"];
  const custom = taskNow();
  const ftask = custom ? `<div class="taskbar on" style="justify-content:center"><b>${escapeHtml(custom.icon + " " + custom.title)}</b></div>` : "";
  const score = r && s.results.mode === "vote" ? tpl("votes_score", { n: r.score, w: pluralWord(r.score, "plural_vote") }) : (r ? r.score : "");
  app.innerHTML = `<div class="final">${ftask}<div class="place${idx >= 0 ? "" : " none"}">${idx >= 0 ? places[idx] || tpl("place_n", { n: idx + 1 }) : "—"}</div>${r ? `<div class="score">${score}</div><div class="verdict">${escapeHtml(r.verdict || "")}</div>` : `<p class="sub" style="text-align:center">${I18N.t("final_no_judge")}</p>`}<div class="lots">${((p && p.lots) || []).map((l) => `<span class="chip">${l.emoji} ${escapeHtml(l.name)}</span>`).join("")}</div><p class="note" style="margin-top:18px">${I18N.t("final_foot")}</p></div>`;
}

function confetti() {
  const c = document.getElementById("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cs = getComputedStyle(document.body);
  const colors = [cs.getPropertyValue("--c1"), cs.getPropertyValue("--c2"), cs.getPropertyValue("--c3"), "#fff"];
  const parts = Array.from({ length: 90 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * 200, vy: 3 + Math.random() * 4, vx: -2 + Math.random() * 4, r: 4 + Math.random() * 5, col: colors[Math.floor(Math.random() * colors.length)] }));
  let frames = 0;
  (function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.r, p.r * 1.6); }
    if (++frames < 110) requestAnimationFrame(draw); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}
function escapeHtml(t) { return String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
</script>
</body>
