<!-- неблокирующий шрифт. Noto Serif Display — заголовки полосы, Noto Serif — текст, Cousine — пишущая машинка; все три с кириллицей и греческим -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Cousine:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Cousine:wght@400;700&display=swap" rel="stylesheet"></noscript>
<style>
  /* Мир: жёлтая пресса (fibs-spec.md §9). Газетная бумага, чёрная печать, один акцент — красный штемпель.
     Факт — заголовок полосы, варианты — вырезки, раскрытие — штампы «ЛОЖЬ» / «ПРАВДА».
     Пульт — «репортёрский блокнот»: светлый, крупный, всё под большой палец. */
  :root {
    --paper: #efe8d8;
    --paper-2: #e6dcc6;
    --sheet: #fbf8f0;
    --ink: #151412;
    --ink-2: #3b3833;
    --muted: #6f685c;
    --rule: #cfc4ab;
    --red: #c8201e;
    --red-2: #a31414;
    --ok: #1f7a3c;
    --font: "Noto Serif", Georgia, "Times New Roman", serif;
    --head: "Noto Serif Display", "Noto Serif", Georgia, serif;
    --mono: "Cousine", "Courier New", monospace;
    --press: cubic-bezier(.2, .9, .3, 1.2);
    --lang-switch-bg: var(--sheet);
    --lang-switch-border: var(--ink);
    --lang-switch-fg: var(--ink);
    --lang-switch-active-bg: var(--ink);
    --lang-switch-active-fg: var(--sheet);
    --lang-switch-active-border: var(--ink);
    --lang-switch-font: var(--mono);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    /* газетная бумага: лёгкий растр точек и пятна старения */
    background:
      radial-gradient(circle at 20% 10%, rgba(255, 255, 255, .5), transparent 40%),
      radial-gradient(rgba(21, 20, 18, .06) 1px, transparent 1.2px) 0 0 / 5px 5px,
      linear-gradient(180deg, var(--paper), var(--paper-2));
    background-color: var(--paper);
    background-attachment: fixed;
    color: var(--ink);
    font: 400 17px/1.4 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .hidden { display: none !important; }
  /* справа — место под переключатель языка из i18n.js (--lsw меряет fibs-shared.js) */
  .util { display: flex; align-items: center; gap: 12px; height: calc(var(--lsc, 30px) * 2); padding: 0 var(--lsw, 150px) 0 14px; }
  .util a { color: var(--ink-2); text-decoration: none; font: 700 14px/1 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* «← Все игры» — строка высотой 44 px под палец; на 320 px английское «← All games» не влезало на пару пикселей */
  .util a { line-height: 44px; }
  @media (max-width: 340px) { .util { gap: 8px; padding-left: 10px; } }
  .sound-toggle-btn { flex: none; width: calc(var(--lsh, 44px) * 1.25); height: var(--lsh, 44px); border: 1.5px solid var(--ink); border-radius: 2px; background: var(--sheet); font-size: 17px; display: grid; place-items: center; padding: 0; }
  /* под шапкой (сверху её закрывает переключатель языка) и в ширину экрана: на 320 px русский текст в одну строку — 352 px,
     а невидимая плашка вылезала за край и iOS растягивал страницу */
  .conn { position: fixed; left: 50%; top: calc(var(--lsc, 30px) * 2); transform: translateX(-50%); z-index: 30; background: var(--red); color: #fff; font: 700 14px/1.3 var(--mono); padding: 8px 12px; visibility: hidden; width: max-content; max-width: calc(100% - 16px); text-align: center; }
  .conn.on { visibility: visible; }
  /* подсказка «Язык комнаты: EN. Переключить?» — в потоке над экраном, поверх ничего не закрывает */
  .langhint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 0 16px 8px; padding: 8px 10px; border: 2px solid var(--ink); background: var(--sheet); font: 700 15px/1.3 var(--mono); }
  .langhint[hidden] { display: none; }
  .langhint span { flex: 1 1 180px; min-width: 0; }
  .langhint button { min-height: 44px; padding: 8px 14px; border: 2px solid var(--ink); background: var(--sheet); color: var(--ink); font: 700 15px/1 var(--mono); }
  .langhint button.yes { background: var(--ink); color: var(--sheet); }
  .enter .cnt { display: flex; justify-content: flex-end; color: var(--ink-2); font: 400 14px/1 var(--mono); min-height: 16px; margin-top: 6px; }
  .codeform { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; }
  .codeform input { flex: 1; min-width: 0; border: 2px solid var(--ink); background: var(--sheet); border-radius: 0; padding: 10px 12px; font: 700 20px/1.2 var(--mono); text-transform: uppercase; }
  .codeform .btn { flex: none; width: auto; padding: 0 18px; }
  .claimbtns { display: grid; gap: 10px; }
  .toast { position: fixed; left: 50%; top: calc(var(--lsc, 30px) * 2 + 4px); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--sheet); font: 700 15px/1.3 var(--mono); padding: 11px 14px; max-width: calc(100% - 32px); visibility: hidden; box-shadow: 4px 4px 0 var(--red); }
  .toast.on { visibility: visible; animation: toast .3s var(--press); }
  @keyframes toast { from { transform: translate(-50%, -20px); } }
  #app { max-width: 520px; margin: 0 auto; padding: 0 16px 28px; min-height: calc(100vh - var(--lsc, 30px) * 2); min-height: calc(100dvh - var(--lsc, 30px) * 2); display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  #app.top { justify-content: flex-start; padding-top: 4px; }

  /* шапка газеты */
  .masthead { text-align: center; border-top: 4px double var(--ink); border-bottom: 4px double var(--ink); padding: 8px 0 6px; }
  .masthead .kicker { font: 700 12px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); text-wrap: balance; }
  .masthead h1 { margin: 4px 0 0; font: 900 clamp(44px, 14vw, 64px)/.95 var(--head); letter-spacing: -.01em; }
  .masthead h1 em { font-style: normal; color: var(--red); }
  .headline { font: 900 30px/1.05 var(--head); margin: 0; }

  /* кнопки: чёрная печатная плашка, вторичная — пунктир «вырезать здесь» */
  .btn { display: block; width: 100%; border: 2px solid var(--ink); border-radius: 0; background: var(--ink); color: var(--sheet); font: 700 20px/1 var(--mono); letter-spacing: .02em; padding: 17px 14px; box-shadow: 4px 4px 0 var(--red); text-align: center; text-decoration: none; transition: transform .08s; }
  .btn:not(:disabled):active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--red); }
  .btn.ghost { background: var(--sheet); color: var(--ink); box-shadow: none; border: 2px dashed var(--ink); font-size: 17px; }
  .btn.ghost.sure { border-style: solid; border-color: var(--red); color: var(--red); }
  .btn.ghost.on { background: var(--red); border-color: var(--red); color: #fff; border-style: solid; }
  /* вторичное действие под пальцем: строка целиком, 44 px в высоту */
  .link { display: block; min-height: 44px; margin: 2px auto 0; background: none; border: 0; color: var(--red); text-decoration: underline; text-underline-offset: 3px; padding: 10px 16px; font-weight: 700; font-size: 17px; }

  /* лист: вырезка из газеты */
  .card { position: relative; background: var(--sheet); color: var(--ink); padding: 16px; border: 1px solid var(--rule); box-shadow: 0 1px 0 var(--rule), 3px 4px 0 rgba(21, 20, 18, .12); }
  .card .k { font: 700 12px/1.2 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
  .card .k:empty { display: none; }
  .fact { font: 700 24px/1.22 var(--head); overflow-wrap: anywhere; }
  .mini .card { padding: 10px 12px; }
  .mini .card .k { margin-bottom: 2px; }
  .mini .fact { font-size: 17px; line-height: 1.25; }
  .fact .gap { display: inline-block; width: 3.2em; border-bottom: 3px solid var(--ink); vertical-align: -2px; }
  .fact mark.ans { background: none; color: var(--red); border-bottom: 3px solid var(--red); padding: 0 2px; }

  .eyebrow { color: var(--ink-2); font: 700 13px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .lede { margin: 0; font-size: 18px; }
  .lede b { color: var(--red); }
  .rules { margin: 0; padding-left: 22px; color: var(--ink-2); display: grid; gap: 6px; }
  .fine { color: var(--muted); font-size: 14px; }
  .center { text-align: center; }

  /* вход */
  .enter .room { font: 700 15px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
  .enter h2 { margin: 6px 0 12px; font: 900 28px/1.1 var(--head); }
  .enter input { width: 100%; border: 0; border-bottom: 3px solid var(--ink); background: transparent; color: var(--ink); font: 700 28px/1.2 var(--font); padding: 4px 0; border-radius: 0; }
  .err { min-height: 22px; color: var(--red); font-weight: 700; }

  /* игроки */
  .players { display: flex; flex-wrap: wrap; gap: 6px; }
  .pl { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; background: var(--sheet); border: 1.5px solid var(--pc); font: 700 14px/1.2 var(--mono); max-width: 100%; }
  .pl b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pl.me { background: #f1e3d9; background: color-mix(in srgb, var(--pc) 16%, var(--sheet)); }
  .pl.off { opacity: .45; }
  .av { font-style: normal; font-size: 18px; line-height: 1; }
  .me-badge { display: flex; align-items: center; gap: 12px; }
  .me-badge .av { font-size: 44px; }
  .me-badge b { font: 900 28px/1.1 var(--head); display: block; overflow-wrap: anywhere; }
  .avbtn { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; font: inherit; color: inherit; line-height: 0; flex: none; }
  .avpick { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .avpick button { aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--sheet); font-size: 22px; line-height: 1; padding: 0; cursor: pointer; }
  .avpick button.on { background: var(--red); box-shadow: 0 0 0 3px var(--ink); }
  .avpick button:disabled { opacity: .3; cursor: default; }
  @media (max-width: 360px) { .avpick { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

  /* «ΑΛΕΞΑΝΔΡΟΥΠΟΛΗ выбирает тему»: длинное имя одним словом вылезало за карточку на 320 px */
  .status h2 { margin: 0 0 4px; font: 900 28px/1.1 var(--head); overflow-wrap: anywhere; }
  .status p { margin: 0; color: var(--ink-2); }

  /* ложь */
  .ahead { display: flex; justify-content: space-between; align-items: baseline; font: 700 14px/1.2 var(--mono); color: var(--ink-2); gap: 10px; }
  .ahead b { color: var(--red); }
  .timer { height: 6px; background: var(--rule); overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--ink); transform-origin: 0 50%; }
  .timer.hot i { background: var(--red); }
  .write input { width: 100%; background: var(--sheet); border: 2px solid var(--ink); border-radius: 0; padding: 14px 12px; font: 700 22px/1.2 var(--mono); color: var(--ink); }
  .write input:focus { outline: none; box-shadow: 4px 4px 0 var(--red); }
  .write .cnt { display: flex; justify-content: space-between; color: var(--ink-2); font: 400 14px/1 var(--mono); min-height: 16px; margin-top: 6px; }
  .write .truthmsg { color: var(--red); font: 700 16px/1.2 var(--mono); min-height: 20px; }
  .row2 { display: grid; gap: 10px; }
  .gotit { font: 700 24px/1.25 var(--mono); overflow-wrap: anywhere; }
  .flip { perspective: 900px; }
  @media (prefers-reduced-motion: no-preference) { .flip.go .card { animation: flip .6s var(--press); } }
  @keyframes flip { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
  .tag { display: inline-block; font: 700 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; background: var(--ink); color: var(--sheet); vertical-align: middle; }

  /* темы */
  .topics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .topics button { min-height: 104px; background: var(--sheet); border: 2px solid var(--ink); font: 900 19px/1.15 var(--head); padding: 10px; box-shadow: 3px 3px 0 var(--ink); overflow-wrap: anywhere; }
  .topics button:not(:disabled):active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  /* выбор правды: вырезки */
  .opts { display: grid; gap: 10px; }
  .opt { position: relative; display: flex; align-items: center; gap: 10px; text-align: left; background: var(--sheet); color: var(--ink); border: 2px solid var(--ink); padding: 13px 12px; font: 700 20px/1.2 var(--mono); overflow-wrap: anywhere; min-height: 56px; }
  .opt .l { flex: none; width: 28px; height: 28px; border: 2px solid var(--ink); font: 700 15px/24px var(--mono); text-align: center; }
  .opt .t { flex: 1; min-width: 0; }
  .opt .lk { flex: none; font-size: 20px; opacity: .35; }
  .opt .lk.on { opacity: 1; }
  .opt.sel { background: var(--ink); color: var(--sheet); box-shadow: 4px 4px 0 var(--red); }
  .opt.sel .l { border-color: var(--sheet); }
  .opt.own { opacity: .45; border-style: dashed; }
  .opt.own::after { content: attr(data-own); position: absolute; right: 8px; top: -9px; background: var(--paper); padding: 0 4px; font: 700 12px/1.4 var(--mono); text-transform: uppercase; color: var(--ink-2); }
  .opt:not(:disabled):active { transform: scale(.985); }
  /* «Подстраховка» стоит над списком: на SE под сгибом её не видно; «Это правда · 2/2» липнет к низу экрана */
  .hedge { display: flex; gap: 10px; align-items: center; }
  .hedge .btn { flex: 1; padding-top: 13px; padding-bottom: 13px; font-size: 17px; }
  #pickbtn { position: sticky; bottom: 10px; z-index: 5; }
  .enter .latenote { margin: 0; padding: 8px 10px; border: 2px dashed var(--ink-2); background: var(--sheet); font: 700 15px/1.3 var(--mono); }

  /* раскрытие */
  .res { display: grid; gap: 8px; }
  .res .r { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: start; background: var(--sheet); border: 1px solid var(--rule); border-left: 5px solid var(--pc, var(--muted)); padding: 10px 12px; }
  .res .r.truth { border-left-color: var(--ok); background: #e8eedf; background: color-mix(in srgb, var(--ok) 8%, var(--sheet)); }
  .res .r .t { font: 700 18px/1.25 var(--mono); overflow-wrap: anywhere; }
  .res .r .who { grid-column: 1 / -1; color: var(--ink-2); font-size: 14px; }
  .res .r .p { font: 700 16px/1.2 var(--mono); color: var(--red); white-space: nowrap; }
  .res .r[hidden] { display: none; }
  .res .r.picked { box-shadow: inset 0 0 0 2px var(--ink); }
  .res .r .tagme { display: inline-block; margin-left: 6px; padding: 1px 5px; background: var(--ink); color: var(--sheet); font: 700 11px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .05em; vertical-align: 2px; }
  @media (prefers-reduced-motion: no-preference) { .res .r.in { animation: rowin .35s var(--press) both; } }
  @keyframes rowin { from { transform: translateY(-8px); opacity: 0; } }
  .res .r.focus { background: #fff; }
  /* итог факта: пока идёт раскрытие, место держит «смотри на экран», потом на нём проступает результат — без прыжков */
  .resbox { position: relative; }
  .resbox .resfinal { visibility: hidden; }
  .resbox.done .resfinal { visibility: visible; }
  .resbox .reswait { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-2); font: 700 16px/1.3 var(--mono); padding: 0 8px; }
  .resbox.done .reswait { display: none; }
  .bd { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; text-align: left; }
  .bd li { display: flex; justify-content: space-between; gap: 10px; font: 700 15px/1.3 var(--mono); border-bottom: 1px dotted var(--rule); padding: 3px 0; }
  .bd li b { color: var(--red); white-space: nowrap; }
  .bd .note { display: block; border: 0; color: var(--muted); font-weight: 400; font-size: 13px; }
  .marks { margin: 8px 0 0; text-align: center; }
  .big { font: 900 clamp(40px, 13vw, 64px)/1.05 var(--head); color: var(--ink); }
  .big.sm { font-size: clamp(26px, 8vw, 36px); }
  /* награды партии на телефоне (fibs-029) */
  .awards { display: grid; gap: 10px; }
  .aw { background: var(--sheet); border: 1px solid var(--rule); border-left: 5px solid var(--red); padding: 10px 12px; box-shadow: 0 1px 0 var(--rule); }
  .aw.me { background: #f1e3d9; background: color-mix(in srgb, var(--red) 9%, var(--sheet)); }
  .aw .k { font: 700 12px/1.2 var(--mono); color: var(--red); text-transform: uppercase; letter-spacing: .1em; }
  .aw .a { font: 900 20px/1.2 var(--head); overflow-wrap: anywhere; margin-top: 3px; }
  .aw .by { font: 400 14px/1.3 var(--mono); color: var(--ink-2); margin-top: 2px; }
  .aw .q { font: italic 400 14px/1.3 var(--font); color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
  .aw .you { display: inline-block; margin-left: 6px; padding: 1px 6px; background: var(--red); color: #fff; font: 700 11px/1.4 var(--mono); text-transform: uppercase; vertical-align: 3px; }
  .final-home { position: sticky; bottom: 10px; z-index: 5; background: var(--sheet); }
  .progress { margin: 0; text-align: center; font: 700 15px/1.3 var(--mono); color: var(--ink-2); min-height: 20px; }
  .big.red { color: var(--red); }
  /* штемпель */
  .stamp { display: inline-block; font: 900 26px/1 var(--head); letter-spacing: .08em; color: var(--red); border: 4px solid var(--red); padding: 6px 12px 4px; transform: rotate(-6deg); mix-blend-mode: multiply; }
  .stamp.ok { color: var(--ok); border-color: var(--ok); }
  @media (prefers-reduced-motion: no-preference) { .stamp.in { animation: stampin .35s var(--press) both; } }
  @keyframes stampin { from { transform: rotate(-6deg) scale(2.2); opacity: .2; } }
  /* штемпель «ПРАВДА» в начале удара вдвое шире экрана 320 px — телефон успевал отдалить страницу */
  .center:has(> .lede > .stamp) { overflow-x: clip; }

  /* таблица счёта — как колонка биржевых котировок */
  .table ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  .table li { display: flex; align-items: center; gap: 8px; min-height: 32px; font: 700 15px/1 var(--mono); border-bottom: 1px dotted var(--rule); }
  .table li .n { width: 22px; flex: none; color: var(--muted); }
  .table li b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .table li .s { flex: none; font-variant-numeric: tabular-nums; }
  .table li.off { opacity: .55; }
  .table li.me { color: var(--red); }
  .howcard ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

  /* реакции */
  .reacts { display: flex; justify-content: center; gap: 10px; }
  .reacts button { width: 54px; height: 54px; border: 1.5px solid var(--ink); border-radius: 0; background: var(--sheet); font-size: 26px; }
  .reacts button:not(:disabled):active { transform: scale(.9); }

  /* пример на стартовом экране */
  .sample { display: grid; gap: 10px; }
  .sample .card { transform: rotate(-1deg); }
  .sample .clips { display: flex; flex-wrap: wrap; gap: 8px; }
  .sample .clip { background: var(--sheet); border: 1px dashed var(--ink); padding: 6px 10px; font: 700 16px/1.2 var(--mono); }
  .sample .clip.t { border: 2px solid var(--ok); color: var(--ok); }
  /* повёрнутая на 1° карточка шире своей колонки на 2–3 px (на 320 px вылезала за край) — поле по бокам её вмещает */
  .sample { padding: 0 4px; }

  /* невысокие экраны (SE, телефоны с панелями Safari, ландшафт): главная кнопка — на первом экране, пример под ней */
  @media (max-height: 760px) {
    .sample { order: 1; }
    .rules { order: 2; }
  }
  /* невысокие экраны (SE 2/3 и 12 mini с панелями Safari, 548 px): на экране «Соври» факт, поле и «Отправить» без прокрутки.
     Место под счётчик символов не убираем — иначе поле прыгало бы при наборе */
  @media (max-height: 620px) {
    #app { gap: 12px; }
    .card { padding: 14px; }
    .fact { font-size: 21px; line-height: 1.18; }
    .fact.long { font-size: 19px; }
    .write .truthmsg:empty { min-height: 0; }
    .write .cnt { margin-top: 4px; }
    .write .row2 { margin-top: 0 !important; }
    .mini .fact.long { font-size: 17px; }
  }
  /* SE 1-го поколения с панелями Safari (~460 px) */
  @media (max-height: 520px) {
    #app { gap: 10px; padding-bottom: 16px; }
    .card { padding: 12px; }
    .card .k { margin-bottom: 4px; }
    .fact { font-size: 19px; }
    .fact.long { font-size: 18px; }
    .mini .fact.long { font-size: 17px; }
    .fact .gap { border-bottom-width: 2px; }
    .write input { padding: 11px 12px; }
    .btn { padding: 15px 14px; }
  }
  /* телефон боком: шапка газеты ниже, чтобы «Открыть редакцию» влезла в первый экран */
  @media (max-height: 420px) and (orientation: landscape) {
    .masthead { padding: 4px 0 3px; }
    .masthead h1 { font-size: 38px; }
    .lede { font-size: 16px; }
  }

  /* невысокий портрет (SE): варианты плотнее, чтобы к сгибу влезало как можно больше */
  @media (max-height: 640px) and (orientation: portrait) {
    .opts { gap: 6px; }
    .opt { min-height: 46px; padding: 8px 10px; font-size: 18px; line-height: 1.15; gap: 8px; }
    .opt .l { width: 26px; height: 26px; font-size: 14px; line-height: 22px; }
    .mini .card { padding: 8px 10px; }
    .mini .card .k { display: none; }
    .mini .fact, .mini .fact.long { font-size: 16px; line-height: 1.2; }
  }
  /* телефон боком: две колонки — слева факт и подсказки, справа варианты / форма (fibs-035) */
  @media (orientation: landscape) and (max-height: 500px) and (min-width: 480px) {
    #app { max-width: 900px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    #app[data-screen="choose"], #app[data-screen="lie"], #app[data-screen="lied"] {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); column-gap: 16px; row-gap: 10px;
      grid-template-rows: repeat(5, min-content) 1fr; justify-content: stretch; align-content: start; align-items: start; min-height: 0;
    }
    #app[data-screen="choose"] > *, #app[data-screen="lie"] > *, #app[data-screen="lied"] > * { grid-column: 1; }
    #app[data-screen="choose"] > .opts { grid-column: 2; grid-row: 1 / span 6; }
    #app[data-screen="lie"] > .write { grid-column: 2; grid-row: 1 / span 6; }
    #app[data-screen="lied"] > :nth-child(n+4) { grid-column: 2; }
    .opts { gap: 6px; }
    .opt { min-height: 42px; padding: 6px 10px; font-size: 17px; line-height: 1.15; gap: 8px; }
    .opt .l { width: 24px; height: 24px; font-size: 13px; line-height: 20px; }
    .mini .card .k { display: none; }
    .mini .fact, .mini .fact.long { font-size: 16px; line-height: 1.2; }
    .hedge .btn { padding: 10px 12px; font-size: 15px; }
    #pickbtn { bottom: 6px; }
    .reacts button { width: 44px; height: 44px; font-size: 22px; }
  }
  /* экранная клавиатура открыта (MP.keyboardClass → html.kb): шапка и переключатель языка уходят, форма сжимается,
     «Соври за меня» остаётся в видимой области (fibs-034, 035, 036) */
  html.kb .util, html.kb .lang-switch, html.kb .langhint, html.kb .ahead, html.kb .masthead { display: none !important; }
  html.kb #app { min-height: 0; padding-top: 4px; padding-bottom: 8px; gap: 8px; justify-content: flex-start; }
  html.kb .card { padding: 8px 10px; }
  html.kb .card .k { display: none; }
  html.kb .fact, html.kb .fact.long { font-size: 16px; line-height: 1.2; }
  html.kb .write input { padding: 9px 10px; font-size: 20px; }
  html.kb .write .truthmsg:empty { min-height: 0; }
  html.kb .write .cnt { margin-top: 2px; min-height: 0; }
  html.kb .write .row2 { gap: 6px; margin-top: 2px !important; }
  html.kb .btn { padding: 10px 12px; font-size: 17px; box-shadow: 3px 3px 0 var(--red); }
  html.kb .btn.ghost { font-size: 15px; }
  html.kb .enter h2 { margin: 2px 0 6px; font-size: 22px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

    btn_hint: `🎲 Πες ψέμα για μένα · απομένουν {n}`, btn_hint_sure: `Έτοιμο; Δεν αλλάζει μετά`, btn_hint_none: `🎲 Δεν έμειναν βοήθειες`,

    reveal_title: `Αποκάλυψη`, you_got: `+{n}`, you_zero: `Άστοχο`,
    reveal_wait: `Αποκαλύπτουμε τις επιλογές — κοίτα την κοινή οθόνη`, you_nopick: `Δεν έγινε επιλογή`, //EL:unverified
    bd_truth: `Βρήκες την αλήθεια`, bd_truth_half: `Βρήκες την αλήθεια (δίχτυ: μισό)`, bd_likes: `Like στο ψέμα σου: {n}`, //EL:unverified
    bd_half_note: `Με δίχτυ ασφαλείας παίρνεις τους μισούς πόντους`, legend_marks: `🎲 {h} · 🐌 {l}`, //EL:unverified

    kicked_title: `Ο οικοδεσπότης σε έβγαλε από το δωμάτιο`,
    replaced_title: `Άνοιξες το παιχνίδι σε άλλη καρτέλα`, replaced_text: `Μπορείς να παίζεις μόνο σε μία.`, btn_back_here: `Παίξε εδώ`,
    expired_title: `Το δωμάτιο έκλεισε`, expired_text: `Έμεινε άδειο μισή ώρα ή το έκλεισε ο οικοδεσπότης.`, expired_new: `Άνοιξε νέα σύνταξη`,
    table: `Κατάταξη`, how_k: `Όσο περιμένουμε — πώς παίζεται`, how_lie: `Ένα καλό ψέμα μοιάζει με αλήθεια: ίδιο είδος, ίδιο μήκος`,
    not_sent: `Δεν στάλθηκε — πάτα ξανά`, rj_no_hints: `Τελείωσαν οι βοήθειες`, rj_empty: `Γράψε κάτι`, rj_not_lie: `Τέλος χρόνου`, rj_done: `Στάλθηκε ήδη`, rj_own: `Όχι το δικό σου ψέμα`, rj_chosen: `Διάλεξες ήδη`, rj_not_choose: `Η επιλογή τελείωσε`, rj_no_likes: `Τελείωσαν τα like`, rj_not_chooser: `Άλλος διαλέγει θέμα`, rj_bad_topic: `Δεν υπάρχει τέτοιο θέμα`,
  },

<script src="mp-common.js"></script>
<script src="fibs-shared.js"></script>
<script src="i18n.js"></script>
<script src="sound-toggle.js" defer></script>
<script>
"use strict";
const params = new URLSearchParams(location.search);
// код идёт в разметку — только алфавит кодов, иначе ?r=<img onerror> даёт XSS
const CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const app = document.getElementById("app");
const T = (k) => qpT(k);
const tpl = (k, v) => qpTpl(k, v);
const REACTIONS = ["😂", "😱", "🤥", "👏", "🤯"];

let conn = null, state = null, me = null, token = null, dead = false;
let screen = null, screenKey = "", screenHead = ""; // screenHead — фаза экрана, её смена сбрасывает прокрутку
let joinErr = null;
let joinName = ""; // имя, с которым идёт вход (joinFlow шлёт его в каждом повторе)
let joinFlow = null; // MP.joinFlow: name_claim / retry; null без mp-common.js
let draft = ""; // черновик лжи: переживает перерисовки
let draftFact = null; // к какому факту черновик
let truthMsg = false; // последняя попытка оказалась правдой
let hintArmed = false; // кнопка подсказки ждёт второго нажатия
let justHinted = false; // только что вытянули готовую ложь
let hedge = false; // подстраховка: два варианта
let picks = []; // выбранные варианты до отправки
let sentPick = false;
const tokenKey = () => "fibs-token-" + CODE;
try { token = localStorage.getItem(tokenKey()); } catch (e) {}

const player = (id) => state && state.players.find((p) => p.id === id);
const mine = () => (state && me ? player(me) : null);
const avHtml = (p) => `<i class="av">${escapeHtml(p.avatar)}</i>`;
// «1st / 2nd / 3rd» в английском; ru/el — как в словаре (fibs-031)
const placeTxt = (n) => {
  if (qpLang() !== "en") return tpl("place", { n });
  const m = n % 100, k = n % 10;
  return n + (m >= 11 && m <= 13 ? "th" : k === 1 ? "st" : k === 2 ? "nd" : k === 3 ? "rd" : "th") + " place";
};
// дробные очки: «5,5» в ru/el, «5.5» в en
const fmtNum = (n) => (qpLang() === "en" ? String(n) : String(n).replace(".", ","));
// «Ответили 4 из 6 · ~40 с» (MP.progress, U-29): знаменатель — онлайн + уже ответившие, чтобы «4 из 3» не бывало
function progressText() {
  if (!state) return "";
  let done, total, kind;
  if (state.phase === "lie" && state.roster) {
    const lied = state.lied || [];
    done = lied.length;
    total = state.roster.filter((id) => lied.indexOf(id) >= 0 || (player(id) && player(id).online && !player(id).left)).length;
    kind = "answered";
  } else if (state.phase === "choose") {
    const chose = state.chose || [];
    done = chose.length;
    total = state.players.filter((p) => !p.left && (p.online || chose.indexOf(p.id) >= 0)).length;
    kind = "voted";
  } else return "";
  const secs = state.phaseEnd ? (state.phaseEnd - qpNow()) / 1000 : null;
  if (window.MP && MP.progress && !MP.off) return MP.progress.text(done, total, secs, { kind });
  return done + " / " + Math.max(done, total);
}
let progAt = 0;
function updateProgress() {
  const n = document.getElementById("prog");
  if (!n) return;
  const t = progressText();
  if (n.textContent !== t) n.textContent = t;
}
const progHtml = () => `<p class="progress" id="prog" role="status">${escapeHtml(progressText())}</p>`;
const factId = () => (state ? state.game + ":" + state.ri + ":" + state.fi : "");

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), 1600);
}
function show(html, key, top) {
  // новый экран (другая фаза) — с самого верха: на SE прокрутка от прошлого экрана прятала факт и первые варианты
  const head = key.split(":")[0], fresh = head !== screenHead;
  screenHead = head;
  screenKey = key;
  app.classList.toggle("top", !!top);
  app.dataset.screen = head;
  app.innerHTML = html;
  if (fresh && scrollY > 0) scrollTo(0, 0);
}

// клавиатура открыта: поле и кнопка под ним должны быть видны вместе (на SE кнопка уходила под клавиатуру)
let kbPair = null; // [поле, кнопка] текущего экрана
function fitAction() {
  if (!kbPair) return;
  const [input, btn] = kbPair;
  if (document.activeElement !== input || !btn.isConnected) return;
  const vv = window.visualViewport;
  const top = vv ? vv.offsetTop : 0, bottom = top + (vv ? vv.height : innerHeight);
  const over = btn.getBoundingClientRect().bottom + 8 - bottom;
  const room = input.getBoundingClientRect().top - 8 - top; // поле при этом не уезжает за верх
  if (over > 0 && room > 0) scrollBy(0, Math.min(over, room));
}
function keepActionVisible(input, btn) {
  kbPair = [input, btn];
  input.addEventListener("focus", () => setTimeout(fitAction, 350));
}
if (window.visualViewport) visualViewport.addEventListener("resize", fitAction);
// html.kb, пока клавиатура съела > 120 px: CSS прячет шапку и сжимает форму; после смены раскладки — подтягиваем кнопки
if (window.MP && MP.keyboardClass) MP.keyboardClass({ threshold: 100, onChange: () => { setTimeout(fitAction, 60); setTimeout(fitAction, 400); } });

// экран не гаснет, пока идёт игра (где поддерживается)
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && me) keepAwake(); });

// ---------- стартовый экран ----------
function renderLanding() {
  screen = "landing";
  show(`<div class="masthead"><div class="kicker">${T("kicker")}</div><h1>${escapeHtml(T("game_name")).replace(/!$/, "<em>!</em>")}</h1></div>
    <p class="lede">${T("lede")}</p>
    <div class="sample" aria-hidden="true">
      <div class="card"><div class="k">${T("sample_k")}</div><div class="fact">${qpFactHtml(T("sample_q"))}</div></div>
      <div class="clips"><span class="clip">${qpLang() === "ru" ? "кроликам" : qpLang() === "en" ? "rabbits" : "κουνέλια"}</span><span class="clip t">${qpLang() === "ru" ? "эму" : qpLang() === "en" ? "emus" : "εμού"}</span><span class="clip">${qpLang() === "ru" ? "кенгуру" : qpLang() === "en" ? "kangaroos" : "καγκουρό"}</span></div>
    </div>
    <div><button class="btn" id="create" type="button">${T("btn_create")}</button>
      <div class="fine center" style="margin-top:10px;text-wrap:balance">${T("cta_sub")}</div><button class="link" id="havecode" type="button">${T("have_code")}</button></div>
    <ol class="rules"><li>${T("rule1")}</li><li>${T("rule2")}</li><li>${T("rule3")}</li></ol>`, "landing");
  document.getElementById("create").onclick = async () => {
    const btn = document.getElementById("create");
    btn.disabled = true;
    btn.textContent = T("btn_creating");
    try {
      const res = await fetch("/fibs/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: qpLang() } }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "error");
      try { localStorage.setItem("fibs-host-" + data.code, data.hostToken); } catch (e) {}
      location.href = `fibs-board.html?r=${data.code}`;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = T("btn_create");
      toast(String(err.message || err));
    }
  };
  // поле кода прямо на экране (prompt() на телефоне блокирует страницу и не переводится)
  document.getElementById("havecode").onclick = () => {
    const b = document.getElementById("havecode");
    b.outerHTML = codeFormHtml("");
    bindCodeForm();
    document.getElementById("codein").focus();
  };
}

// ---------- ввод кода комнаты ----------
function normCode(raw) {
  if (window.MP && MP.roomGone) return MP.roomGone.normalize(raw);
  return String(raw || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
}
function codeFormHtml(value) {
  return `<form class="codeform" id="codeform" autocomplete="off"><input id="codein" maxlength="24" value="${escapeHtml(value)}" placeholder="${escapeHtml(T("prompt_code"))}" aria-label="${escapeHtml(T("prompt_code"))}" autocapitalize="characters" enterkeyhint="go"><button class="btn" type="submit">${T("btn_go")}</button></form>`;
}
function bindCodeForm() {
  document.getElementById("codeform").onsubmit = (e) => {
    e.preventDefault();
    const c = normCode(document.getElementById("codein").value); // уходим с кодом уже после фильтра
    if (c) location.href = `fibs.html?r=${encodeURIComponent(c)}`;
  };
}

// ---------- вход ----------
function renderEnter() {
  screen = "enter";
  let saved = "";
  try { saved = localStorage.getItem("fibs-name") || ""; } catch (e) {}
  show(`<form class="enter" id="enterform" autocomplete="off" style="display:grid;gap:14px">
    <div class="card"><div class="room">${escapeHtml(CODE)}</div><h2>${T("enter_title")}</h2>
      <input id="name" maxlength="16" placeholder="${escapeHtml(T("enter_ph"))}" value="${escapeHtml(saved)}" enterkeyhint="go" aria-label="${escapeHtml(T("enter_ph"))}">
      <div class="cnt"><span></span><span id="ncnt"></span></div></div>
    ${state && ["intro", "topic", "lie", "choose", "reveal", "scores"].includes(state.phase) ? `<p class="latenote">${escapeHtml(T("enter_late"))}</p>` : ""}
    <div class="err" id="err">${joinErr ? escapeHtml(T(joinErr)) : ""}</div>
    <button class="btn" type="submit">${T("btn_join")}</button>
  </form>`, "enter");
  const input = document.getElementById("name");
  // «N/16» появляется, когда осталось ≤ 4 символа (fibs-010); лимит — hello.limits.name
  if (window.MP && MP.nameCounter) MP.nameCounter(input, (MP.limits && MP.limits.name) || 16, { threshold: 4, el: document.getElementById("ncnt") });
  keepActionVisible(input, document.querySelector("#enterform .btn"));
  document.getElementById("enterform").onsubmit = (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) { document.getElementById("err").textContent = T("err_name"); return; }
    try { localStorage.setItem("fibs-name", name); } catch (e2) {}
    joinErr = null;
    joinName = name;
    // joinFlow добавляет caps:["claim"]: сервер может спросить «Это ты?» вместо тихого перехвата места
    if (joinFlow) joinFlow.join(); else conn.send({ type: "join", name });
    keepAwake();
  };
}

// «Это ты, Маша?» (name_claim): тёзка офлайн — занять его место или войти под другим именем (U-01, fibs-019/020)
let lastSpecial = null;
function renderClaim(c) {
  screen = "claim";
  lastSpecial = () => renderClaim(c);
  show(`<div class="card status"><div class="room">${escapeHtml(CODE)}</div><h2>${escapeHtml(tpl("claim_title", { name: c.name }))}</h2>
    <p>${escapeHtml(tpl("claim_sub", { n: (c.summary && c.summary.score) || 0 }))}</p></div>
    <div class="claimbtns"><button class="btn" id="claimyes" type="button">${T("claim_yes")}</button><button class="btn ghost" id="claimno" type="button">${T("claim_no")}</button></div>`, "claim:" + c.name + qpLang());
  const lock = () => { document.getElementById("claimyes").disabled = true; document.getElementById("claimno").disabled = true; };
  document.getElementById("claimyes").onclick = () => { lock(); c.accept(); };
  document.getElementById("claimno").onclick = () => { lock(); c.decline(); };
}
// «Игрок уже в игре» (name_taken в партии): войти как «Имя (2)» или выбрать другое имя
function renderTaken(m) {
  me = null;
  screen = "taken";
  lastSpecial = () => renderTaken(m);
  const alt = m.suggested || "";
  show(`<div class="card status"><div class="room">${escapeHtml(CODE)}</div><h2>${escapeHtml(tpl("taken_title", { name: m.name || joinName }))}</h2><p>${T("taken_sub")}</p></div>
    <div class="claimbtns">${alt ? `<button class="btn" id="takenas" type="button">${escapeHtml(tpl("taken_as", { alt }))}</button>` : ""}<button class="btn ghost" id="takenother" type="button">${T("taken_other")}</button></div>`, "taken:" + (m.name || "") + qpLang());
  const as = document.getElementById("takenas");
  if (as) as.onclick = () => { as.disabled = true; if (joinFlow) joinFlow.join({ fresh: true }); else conn.send({ type: "join", name: joinName, fresh: true }); };
  document.getElementById("takenother").onclick = () => { joinErr = null; screen = null; renderEnter(); };
}

function renderCenter(titleKey, textKey, extra, key) {
  show(`<div class="card status"><h2>${T(titleKey)}</h2>${textKey ? `<p>${T(textKey)}</p>` : ""}${extra || ""}</div>`, key || "c:" + titleKey);
}
function renderExpired() {
  dead = true;
  screen = "expired";
  try { localStorage.removeItem(tokenKey()); } catch (e) {}
  draftClear();
  renderCenter("expired_title", "expired_text", `<a class="btn" style="margin-top:14px" href="fibs.html">${T("expired_new")}</a>`);
}
// Неверный код: hello не приходил ни разу — комнаты с таким кодом нет (или её давно убрали), а не «закрылась»
function renderNoRoom() {
  dead = true;
  screen = "noroom";
  renderCenter("noroom_title", "noroom_text", codeFormHtml(CODE));
  bindCodeForm();
}
const goneFlow = window.MP && MP.roomGone ? MP.roomGone({ showForm: renderNoRoom, onClosed: renderExpired }) : null;
function onRoomGone() { if (goneFlow) goneFlow.gone(); else renderExpired(); }

// Черновик лжи (fibs-018): MP.draft хранит в localStorage {факт, текст, время}, TTL 2 ч; ключ — публичный «game:ri:fi»
const draftStore = () => (window.MP && MP.draft ? MP.draft({ game: "fibs", room: CODE, max: (MP.limits && MP.limits.answer) || 25 }) : null);
function draftClear() { const d = draftStore(); if (d) d.clear(); }

// Язык комнаты: игра идёт на языке банка фактов (settings.lang), а телефон мог открыться на другом. По умолчанию — подсказка
// «Язык комнаты: EN. Переключить?»; автоследование — за флагом MP.rules.RULE_U17_LANG_FOLLOW (по умолчанию выкл.).
function hideLangHint() { const h = document.getElementById("langhint"); if (h) { h.hidden = true; h.innerHTML = ""; } }
function showLangHint(sug) {
  const h = document.getElementById("langhint");
  if (!h) return;
  h.innerHTML = `<span>${escapeHtml(tpl("lang_hint", { lang: sug.lang.toUpperCase() }))}</span><button class="yes" type="button" data-y>${escapeHtml(T("lang_yes"))}</button><button type="button" data-n>${escapeHtml(T("lang_no"))}</button>`;
  h.hidden = false;
  h.querySelector("[data-y]").onclick = () => { hideLangHint(); sug.accept(); };
  h.querySelector("[data-n]").onclick = () => { hideLangHint(); sug.decline(); };
}
const langAuto = !!(window.MP && MP.rules && MP.rules.RULE_U17_LANG_FOLLOW);
const langFollow = window.MP && MP.followRoomLang ? MP.followRoomLang({
  enabled: true,
  auto: langAuto,
  getRoomLang: () => (state && state.settings ? state.settings.lang : null),
  onSuggest: showLangHint,
}) : null;
function checkRoomLang() {
  if (!langFollow || !state) return;
  // подсказка безобидна в любой фазе; авто-переключение — только там, где человек не печатает и не выбирает
  if (langAuto && !["lobby", "intro", "scores", "finished"].includes(state.phase)) return;
  langFollow.check();
}

// ---------- общие куски ----------
function playersHtml() {
  return `<div class="players">${state.players.filter((p) => !p.left).map((p) => `<span class="pl${p.id === me ? " me" : ""}${p.online ? "" : " off"}" style="--pc:${p.color}">${avHtml(p)}<b>${escapeHtml(p.name)}</b></span>`).join("")}</div>`;
}
function reactsHtml() {
  return `<div class="reacts">${REACTIONS.map((e) => `<button type="button" data-e="${e}" aria-label="${e}">${e}</button>`).join("")}</div>`;
}
function bindReacts() {
  app.querySelectorAll(".reacts button").forEach((b) => {
    b.onclick = () => { conn.send({ type: "react", emoji: b.dataset.e }); qpVibrate(8); b.disabled = true; setTimeout(() => (b.disabled = false), 2000); };
  });
}
let avOpen = false; // открыт ли выбор аватарки
// выбор аватарки: свободные и своя; занятые другими — серые
function avPickHtml() {
  if (!avOpen || !state.avatarChoices) return `<p class="fine" style="margin:0">${escapeHtml(T("av_pick"))}</p>`;
  const taken = new Set(state.players.filter((x) => !x.left && x.id !== me).map((x) => x.avatar));
  const cur = mine().avatar;
  return `<div class="avpick" role="group" aria-label="${escapeHtml(T("av_pick"))}">${state.avatarChoices.map((a) => `<button type="button" data-a="${escapeHtml(a)}" class="${a === cur ? "on" : ""}"${taken.has(a) ? " disabled" : ""}>${escapeHtml(a)}</button>`).join("")}</div>`;
}
const avBtnHtml = (inner) => `<button class="avbtn" id="avbtn" type="button" aria-label="${escapeHtml(T("av_pick"))}" aria-expanded="${avOpen}">${inner}</button>`;
// ключ экрана лобби: меняется, когда у кого-то сменилась аватарка (пока выбор открыт) или он открылся/закрылся
const avKey = () => (avOpen ? "1" + state.players.map((p) => p.avatar).join("") : "0" + (mine() ? mine().avatar : ""));
function bindAvatars() {

function renderLie() {
  const s = state.me;
  if (!s || !s.inRound) {
    const key = "late:" + factId() + qpLang();
    if (screenKey === key) return;
    show(`${factCard()}<div class="card status"><h2>${T("late_title")}</h2><p>${T("late_sub")}</p></div>${progHtml()}${reactsHtml()}`, key, true);
    return bindReacts();
  }
  if (draftFact !== factId()) {
    // новый факт — чистый лист; тот же факт после reload — текст из MP.draft (чужой ключ он сам удаляет)
    draftFact = factId();
    const d = draftStore();
    draft = (d && d.load(factId())) || "";
    truthMsg = false; hintArmed = false; justHinted = false;
  }
  if (s.lie) {
    draftClear(); // ложь принята — черновик больше не нужен
    const key = "lied:" + factId() + ":" + justHinted + qpLang();
    if (screenKey === key) return;
    show(`${factHead()}${timerHtml()}${factCard()}
      <div class="${justHinted ? "flip go" : ""}"><div class="card"><div class="k">${T("got_hint")}</div><div class="gotit">${escapeHtml(s.lie.text)} ${s.lie.hint ? `<span class="tag">🎲</span>` : ""}</div></div></div>
      <div class="status center"><h2>${T("done_title")}</h2><p>${T("done_sub")}</p></div>${progHtml()}${reactsHtml()}`, key, true);
    if (justHinted) { qpSfx.flip(); justHinted = false; }
    return bindReacts();
  }
  const key = "lie:" + factId() + ":" + s.hintsLeft + ":" + hintArmed + ":" + truthMsg + qpLang();
  if (screenKey === key) return;
  const hintLabel = s.hintsLeft <= 0 ? T("btn_hint_none") : hintArmed ? T("btn_hint_sure") : tpl("btn_hint", { n: s.hintsLeft });
  const max = state.liesMax || 25;
  show(`${factHead()}${timerHtml()}${factCard()}
    <form class="write" id="write" autocomplete="off">
      <div class="truthmsg" id="truthmsg">${truthMsg ? escapeHtml(T("truth_rj")) : ""}</div>
      <input id="lie" maxlength="${max}" placeholder="${escapeHtml(T("ph_lie"))}" value="${escapeHtml(draft)}" enterkeyhint="send" aria-label="${escapeHtml(T("ph_lie"))}" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="cnt"><span></span><span id="cnt"></span></div>
      <div class="row2" style="margin-top:6px"><button class="btn" type="submit" id="sendbtn">${T("btn_send")}</button>
      <button class="btn ghost${hintArmed ? " sure" : ""}" type="button" id="hintbtn"${s.hintsLeft <= 0 ? " disabled" : ""}>${escapeHtml(hintLabel)}</button></div>
    </form>`, key, true);
  const form = document.getElementById("write");
  const inp = document.getElementById("lie");
  const cnt = document.getElementById("cnt");
  const upd = () => {
    draft = inp.value;
    const d = draftStore();
    if (d) d.save(factId(), draft);
    cnt.textContent = inp.value.length > max - 8 ? `${inp.value.length}/${max}` : "";
  };
  inp.oninput = upd;
  upd();
  keepActionVisible(inp, document.getElementById("hintbtn")); // под кнопкой «Отправить» — «Соври за меня»: видны обе
  if (!matchMedia("(pointer: coarse)").matches || truthMsg) inp.focus();
  form.onsubmit = (e) => {
    e.preventDefault();
    const text = draft.trim();
    if (!text) { toast(T("rj_empty")); return; }
    conn.send({ type: "lie", text });
    qpSfx.send();
    qpVibrate(15);
    document.getElementById("sendbtn").disabled = true;
    hintArmed = false;
    const f = factId();
    watchAction(() => state.phase === "lie" && factId() === f && state.me && !state.me.lie, () => {});
  };
  document.getElementById("hintbtn").onclick = () => {
    if (!hintArmed) { hintArmed = true; screenKey = ""; return render(); }
    hintArmed = false;
    justHinted = true;
    conn.send({ type: "hint" });
    qpVibrate([10, 30, 10]);
    const f = factId();
    watchAction(() => state.phase === "lie" && factId() === f && state.me && !state.me.lie, () => { justHinted = false; });
  };
}

function renderChoose() {
  const s = state.me;
  if (!state.options) return;
  const chose = s && (s.picks || sentPick);
  const key = "choose:" + factId() + ":" + !!chose + ":" + hedge + ":" + picks.join(",") + ":" + (s ? s.likes.join(",") : "") + qpLang();
  if (screenKey === key) return;
  if (!s) return;
  const letter = (i) => String.fromCharCode(65 + i);
  if (chose) {
    const mineIdx = s.picks || picks;
    const left = 2 - s.likes.length;
    show(`${timerHtml()}<div class="status"><h2>${T("chose_title")}</h2><p>${T("chose_sub")}</p></div>${progHtml()}
      <div class="eyebrow">${escapeHtml(tpl("likes_left", { n: left }))}</div>
      <div class="opts">${state.options.map((o, i) => {
        const liked = s.likes.includes(i);
        return `<button type="button" class="opt${o.mine ? " own" : ""}${mineIdx.includes(i) ? " sel" : ""}" data-i="${i}" data-own="${escapeHtml(T("own"))}"${o.mine || liked || left <= 0 ? " disabled" : ""}><span class="l">${letter(i)}</span><span class="t">${escapeHtml(o.text)}</span><span class="lk${liked ? " on" : ""}">👍</span></button>`;
      }).join("")}</div>${reactsHtml()}`, key, true);
    app.querySelectorAll(".opt:not(:disabled)").forEach((b) => {
      b.onclick = () => { conn.send({ type: "like", opt: Number(b.dataset.i) }); qpSfx.pop(); qpVibrate(10); b.disabled = true;
        const f = factId(), opt = Number(b.dataset.i);
        watchAction(() => state.phase === "choose" && factId() === f && state.me && !state.me.likes.includes(opt), () => {});
      };
    });
    return bindReacts();
  }
  const need = hedge ? 2 : 1;
  // «Подстраховка» сразу под подсказкой, над списком: на SE (320×568) список с 6–7 вариантами уходит под сгиб (fibs-033)
  show(`${timerHtml()}<div class="mini">${factCard()}</div>
    <div class="eyebrow">${escapeHtml(hedge ? T("choose_two") : T("choose_one"))}</div>
    <div class="hedge"><button class="btn ghost${hedge ? " on" : ""}" type="button" id="hedge">${escapeHtml(hedge ? T("btn_hedge_on") : T("btn_hedge"))}</button></div>
    <div class="opts">${state.options.map((o, i) => `<button type="button" class="opt${o.mine ? " own" : ""}${picks.includes(i) ? " sel" : ""}" data-i="${i}" data-own="${escapeHtml(T("own"))}"${o.mine ? " disabled" : ""}><span class="l">${letter(i)}</span><span class="t">${escapeHtml(o.text)}</span></button>`).join("")}</div>
    ${hedge ? `<button class="btn" type="button" id="pickbtn"${picks.length === 2 ? "" : " disabled"}>${escapeHtml(tpl("btn_pick", { n: `${picks.length}/2` }))}</button>` : ""}`, key, true);
  app.querySelectorAll(".opt:not(.own)").forEach((b) => {
    b.onclick = () => {
      const i = Number(b.dataset.i);
      qpSfx.tap();
      if (need === 1) { picks = [i]; sendPick(); return; }
      picks = picks.includes(i) ? picks.filter((x) => x !== i) : picks.length < 2 ? picks.concat(i) : [picks[1], i];
      render();
    };
  });
  document.getElementById("hedge").onclick = () => { hedge = !hedge; picks = []; render(); };
  const pb = document.getElementById("pickbtn");
  if (pb) pb.onclick = sendPick;
}
function sendPick() {
  if (!picks.length) return;
  conn.send({ type: "choose", picks });
  sentPick = true;
  qpVibrate(15);
  qpSfx.send();
  render();
  const f = factId();
  watchAction(() => state.phase === "choose" && factId() === f && !(state.me && state.me.picks), () => { sentPick = false; });
}

// Раскрытие на телефоне — по шагам расписания сервера (state.steps), как на доске: сначала никем не выбранные,
// правда последней, итог своего факта — после правды (fibs-032, U-32). window.qpRevealSpeed — только для стенда (SPEED > 1).
let revShown = -1, revFactKey = "";
function renderReveal() {
  const s = state.me;
  if (!state.options || !s) return;
  const key = "rev:" + factId() + qpLang();
  if (screenKey === key) return;
  const opts = state.options;
  const R = state.points || { truth: 0, fool: 0 };
  const truthI = opts.findIndex((o) => o.kind === "truth");
  const picks = s.picks || [];
  const found = picks.indexOf(truthI) >= 0;
  const likedMine = s.likes || [];
  // порядок строк — порядок шагов; без steps (старый сервер) — как раньше: правда последней
  const order = state.steps && state.steps.length === opts.length
    ? state.steps.map((st) => st.opt)
    : opts.map((_, i) => i).filter((i) => i !== truthI).concat(truthI);
  // разбивка очков (fibs-040): правда + поверившие + лайки (остаток до итога)
  const gain = s.gain || 0;
  let foolPart = 0, foolN = 0, anyHalf = false, likesN = 0;
  opts.forEach((o) => {
    if (o.kind !== "lie" || o.authors.indexOf(me) < 0) return;
    likesN += o.likes || 0;
    o.choosers.forEach((c) => { foolN++; foolPart += c.half ? R.fool / 2 : R.fool; if (c.half) anyHalf = true; });
  });
  const truthPart = found ? (picks.length === 2 ? R.truth / 2 : R.truth) : 0;
  const likesPart = Math.max(0, gain - truthPart - foolPart);
  const bd = [];
  if (found) bd.push(`<li><span>${escapeHtml(T(picks.length === 2 ? "bd_truth_half" : "bd_truth"))}</span><b>+${truthPart}</b></li>`);
  if (foolN) bd.push(`<li><span>${escapeHtml(tpl("you_fooled", { n: foolN }))}</span><b>+${foolPart}</b></li>`);
  if (likesPart) bd.push(`<li><span>${escapeHtml(tpl("bd_likes", { n: likesN || likesPart / 100 }))}</span><b>+${likesPart}</b></li>`);
  if (anyHalf && foolN) bd.push(`<li class="note">${escapeHtml(T("bd_half_note"))}</li>`);
  let anyMark = false;
  const rowHtml = (i, k) => {
    const o = opts[i];
    const marks = o.kind === "lie" ? (o.late || []).concat(o.hint || []).some(Boolean) : false;
    if (marks) anyMark = true;
    const authorsTxt = o.kind === "lie" ? tpl("lie_of", { names: qpNamesMarked(o, player) }) : o.kind === "trap" ? T("trap") : T("truth");
    const p = o.kind === "lie" ? player(o.authors[0]) : null;
    const ch = o.choosers.map((c) => ((player(c.playerId) || {}).avatar || "") + (c.half ? "½" : "")).join(" ");
    const isMine = o.kind === "lie" && o.authors.indexOf(me) >= 0;
    return `<div class="r${o.kind === "truth" ? " truth" : ""}${isMine ? " mine" : ""}${picks.indexOf(i) >= 0 ? " picked" : ""}" data-k="${k}" hidden style="--pc:${p ? p.color : "var(--muted)"}"><div class="t">${escapeHtml(o.text)}</div><div class="p">${o.likes ? escapeHtml(tpl("likes_n", { n: o.likes })) : ""}</div>
      <div class="who">${escapeHtml(authorsTxt)}${ch ? " · " + escapeHtml(ch) : ""}${isMine ? `<span class="tagme">${escapeHtml(T("own"))}</span>` : ""}${picks.indexOf(i) >= 0 ? `<span class="tagme">${escapeHtml(T("picked_mark"))}</span>` : ""}</div></div>`;
  };
  const rows = order.map((i, k) => rowHtml(i, k)).join("");
  const resTitle = !s.inRound ? T("late_title") : !s.picks ? T("you_nopick") : gain ? tpl("you_got", { n: gain }) : T("you_zero");
  const small = !s.inRound || !s.picks;
  revShown = -1;
  revFactKey = factId();
  show(`<div id="factbox">${factCard(null)}</div>
    <div class="resbox" id="resbox"><div class="resfinal center"><div class="big${gain ? " red" : ""}${small ? " sm" : ""}">${escapeHtml(resTitle)}</div>
      <p class="lede">${found ? `<span class="stamp ok in">${T("truth")}</span> ` : ""}</p>${bd.length && s.inRound ? `<ul class="bd">${bd.join("")}</ul>` : ""}</div>
      <div class="reswait">${escapeHtml(T("reveal_wait"))}</div></div>
    <div class="eyebrow">${T("reveal_title")}</div><div class="res" id="revlist">${rows}</div>
    <p class="fine marks hidden" id="marks">${escapeHtml(tpl("legend_marks", { h: T("hint_mark"), l: T("late_mark") }))}</p>${reactsHtml()}`, key, true);
  bindReacts();
  revealTick();
}
function revealTick() {
  if (!state || state.phase !== "reveal" || !state.options || !state.me) return;
  const list = document.getElementById("revlist");
  if (!list || revFactKey !== factId()) return;
  const steps = state.steps;
  const rows = list.children;
  let cur = rows.length - 1; // нет расписания — показываем всё сразу
  if (steps && steps.length === rows.length) {
    const elapsed = (qpNow() - state.phaseStart) * (window.qpRevealSpeed || 1);
    cur = -1;
    steps.forEach((st, i) => { if (st.at <= elapsed) cur = i; });
  }
  if (cur === revShown) return;
  const truthI = state.options.findIndex((o) => o.kind === "truth");
  let sawTruth = false;
  for (let k = revShown + 1; k <= cur; k++) {
    const row = rows[k];
    if (!row) continue;
    row.hidden = false;
    row.classList.add("in");
    const opt = steps && steps[k] ? steps[k].opt : k;
    if (opt === truthI) sawTruth = true;
  }
  for (let k = 0; k < rows.length; k++) rows[k].classList.toggle("focus", k === cur && cur < rows.length - 1);
  const live = revShown >= 0;
  revShown = cur;
  const mk = document.getElementById("marks");
  if (mk && state.options.some((o) => o.kind === "lie" && (o.late || []).concat(o.hint || []).some(Boolean))) mk.classList.remove("hidden");
  const last = cur >= rows.length - 1;
  if (sawTruth || last) {
    const fb = document.getElementById("factbox");
    if (fb && state.truth && !fb.dataset.ans) { fb.dataset.ans = "1"; fb.innerHTML = factCard(state.truth.answer); }
  }
  if (last) {
    const rb = document.getElementById("resbox");
    if (rb && !rb.classList.contains("done")) {
      rb.classList.add("done");
      const s = state.me;
      if (live && s && (s.picks || []).indexOf(truthI) >= 0) qpVibrate([40, 40, 80]);
    }
  }
  // последний показанный ряд — в область видимости (список длиннее экрана)
  const fr = rows[cur];
  if (fr && live && cur >= 0) {
    const r = fr.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (r.bottom > vh - 8) window.scrollBy(0, Math.min(r.bottom - vh + 16, r.top - 60));
  }
}

function standing() {
  // `played === 0`: призрак и новичок без единого хода в таблице не нужны; старый сервер поле не шлёт — показываем всех
  const list = state.players.filter((p) => !p.left && (p.id === me || p.played !== 0 || (p.online && state.phase !== "finished"))).slice().sort((a, b) => b.score - a.score);
  const p = mine();
  const place = 1 + list.filter((x) => x.score > p.score).length;
  return { list, place, p };
}
function tableHtml(list) {
  return `<div class="card table"><div class="k">${T("table")}</div><ol>${list.map((x, i) => `<li class="${x.id === me ? "me" : ""}${x.online ? "" : " off"}"><span class="n">${i + 1}</span>${avHtml(x)}<b>${escapeHtml(x.name)}</b><span class="s">${x.score}</span></li>`).join("")}</ol></div>`;
}

function renderScores() {
  const key = "scores:" + factId() + qpLang();
  if (screenKey === key) return;
  const { list, place, p } = standing();
  show(`<div class="center"><div class="eyebrow">${T("scores_title")}</div>
    <div class="big" style="margin:10px 0">${escapeHtml(placeTxt(place))}</div><div class="lede">${escapeHtml(p.avatar)} ${escapeHtml(p.name)} · <b>${p.score}</b></div></div>${tableHtml(list)}${reactsHtml()}`, key, true);
  bindReacts();
}

function awardsHtml() {
  const a = state.awards || {};
  const nameOf = (id) => { const p = player(id); return p ? `${p.avatar} ${p.name}` : "?"; };
  const card = (label, x, dKey) => {
    if (!x) return "";
    const mineAw = x.ids.indexOf(me) >= 0;
    return `<div class="aw${mineAw ? " me" : ""}"><div class="k">${escapeHtml(label)}${mineAw ? `<span class="you">${escapeHtml(T("aw_you"))}</span>` : ""}</div><div class="a">${escapeHtml(x.ids.map(nameOf).join(", "))}</div><div class="by">${escapeHtml(tpl(dKey, { n: fmtNum(x.n) }))}</div></div>`;
  };
  let best = "";
  if (a.bestLie) {
    const mineAw = a.bestLie.authors.indexOf(me) >= 0;
    best = `<div class="aw${mineAw ? " me" : ""}"><div class="k">${escapeHtml(T("aw_best"))}${mineAw ? `<span class="you">${escapeHtml(T("aw_you"))}</span>` : ""}</div><div class="a">«${escapeHtml(a.bestLie.text)}»</div><div class="by">${escapeHtml(qpNames(a.bestLie.authors, player))} · ${escapeHtml(tpl("likes_n", { n: a.bestLie.likes }))}</div><div class="q">${qpFactHtml(a.bestLie.fact)}</div></div>`;
  }
  const cards = [best, card(T("aw_liar"), a.liar, "aw_liar_d"), card(T("aw_detector"), a.detector, "aw_detector_d"), card(T("aw_gullible"), a.gullible, "aw_gullible_d")].filter(Boolean).join("");
  const stopped = state.finishedReason === "host" || state.finishedReason === "few";
  return `<div class="awards">${cards || `<div class="aw"><div class="a" style="font-size:17px">${escapeHtml(T(stopped ? "no_awards_stopped" : "no_awards"))}</div></div>`}</div>`;
}

function renderFinal() {
  const key = "final:" + state.game + ":" + state.finishedReason + qpLang();
  if (screenKey === key) return;
  const { list, place, p } = standing();
  const sub = state.finishedReason === "few" ? T("final_few") : state.finishedReason === "host" ? T("final_host") : T("final_sub");
  // партию оборвали с нулями: «N место» было бы произвольным (fibs-004)
  const noPlaces = !list.length || list[0].score <= 0;
  show(`<div class="center"><h1 class="headline">${T("final_title")}</h1>
    ${noPlaces ? `<div class="big sm" style="margin:12px 0 6px">${escapeHtml(T("final_stopped"))}</div>`
      : `<div class="big${place === 1 ? " red" : ""}" style="margin:14px 0 6px">${escapeHtml(placeTxt(place))}</div>
    <div class="lede">${escapeHtml(p.avatar)} ${escapeHtml(p.name)} · <b>${p.score}</b></div>`}
    <p class="fine">${escapeHtml(sub)}</p></div>${awardsHtml()}${tableHtml(list)}${reactsHtml()}
    <a class="btn ghost final-home" id="homebtn" href="index.html">${T("btn_home")}</a>`, key, true);
  bindReacts();
}

// ---------- выбор экрана ----------
function render() {
  if (dead || !state) return;
  if (me && conn && conn.gated && !state.me) return; // идёт повторный вход по токену — не мигаем экраном «опоздал»
  if (!me) {
    if (screen === "kicked" || screen === "replaced" || screen === "enter" || screen === "claim" || screen === "taken") return;
    return renderEnter();
  }
  if (!mine()) return renderEnter();
  screen = "game";
  switch (state.phase) {
    case "lobby": return renderLobby();
    case "intro": return renderIntro();
    case "topic": return renderTopic();
    case "lie": return renderLie();
    case "choose": return renderChoose();
    case "reveal": return renderReveal();
    case "scores": return renderScores();
    case "finished": return renderFinal();
  }
}

// таймер фазы: полоска и секунды; последние 5 с — красным и с тиканьем
let lastTickSec = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead || !state.phaseEnd) return;
  const now = qpNow();
  const left = state.phaseEnd - now;
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const bar = document.getElementById("timer");
  if (bar) {
    bar.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`;
    bar.classList.toggle("hot", left < 5000);
  }
  const tl = document.getElementById("tleft");
  if (tl) tl.textContent = tpl("sec", { s: Math.max(0, Math.ceil(left / 1000)) });
  if (state.phase === "reveal") revealTick();
  if (now - progAt > 400) { progAt = now; updateProgress(); }
  if ((state.phase === "lie" || state.phase === "choose") && left < 5000 && left > 0) {
    const sec = Math.ceil(left / 1000);
    if (sec !== lastTickSec) { lastTickSec = sec; qpSfx.tick(true); }
  }
}

window.addEventListener("langchange", () => {
  if (!CODE) return renderLanding();
  hideLangHint();
  if (screen === "enter") return renderEnter();
  if ((screen === "claim" || screen === "taken") && lastSpecial) return lastSpecial();
  if (screen === "noroom") return renderNoRoom();
  screenKey = "";
  screen === "expired" ? renderExpired() : render();
});

// ---------- связь ----------
let prevPhase = null, needJoin = true, pendingFlush = false;
// действие улетело, а подтверждения нет (связь пропала, пока тап летел) — не оставляем кнопки мёртвыми:
// через 2.5 с, если мы всё ещё на том же вопросе и связь жива, снимаем замок. Пока связь в обрыве — ждём очередь (до 6 с).
function watchAction(stuck, release, tries) {
  setTimeout(() => {
    if (dead || !state || !stuck()) return;
    const a = conn && conn.api;
    const offline = !a || conn.gated || pendingFlush || a.mode === "none" || a.mode === "connecting";
    if (offline && (tries || 0) < 2) return watchAction(stuck, release, (tries || 0) + 1);
    release();
    screenKey = "";
    render();
  }, 2500);
}
// что нажато во время обрыва — отправляем, если ещё актуально (иначе сервер ответил бы «отказ» на давнее действие)
function keepQueued(q, tg) {
  const mc = state && state.me;
  if (!mc) return false;
  if (tg && tg !== factId()) return false; // нажато на прошлом факте — к этому не относится
  switch (q.type) {
    case "lie": return state.phase === "lie" && !mc.lie;
    case "hint": return state.phase === "lie" && !mc.lie && mc.hintsLeft > 0;
    case "choose": return state.phase === "choose" && !mc.picks;
    case "like": return state.phase === "choose" && !!mc.picks && !mc.likes.includes(q.opt) && mc.likes.length < 2;
    case "topic": return state.phase === "topic" && !!mc.chooser;
    default: return true;
  }
}
function flushQueued() { conn.flush(); } // keepQueued и onDrop заданы при создании очереди (MP.sendQueue)
// действие не дошло (связь не вернулась за 30 с или оно устарело): снимаем замки кнопок и говорим об этом
function unlockDropped(q) {
  if (dead) return;
  if (q.type === "choose") sentPick = false;
  if (q.type === "hint") justHinted = false;
  // уже видно по состоянию, что действие дошло (или фаза прошла) — тост «не дошло» был бы неправдой
  const mc = state && state.me;
  const landed = !mc || (q.type === "lie" || q.type === "hint" ? !!mc.lie : q.type === "choose" ? !!mc.picks : q.type === "like" ? mc.likes.includes(q.opt) : q.type === "topic" ? !mc.chooser : true);
  if (!landed && ["lie", "hint", "choose", "like", "topic"].indexOf(q.type) >= 0) toast(T("not_sent"));
  screenKey = "";
  render();
}
function onMessage(m) {
  // name_claim («Это ты?» / тихий повтор) разбирает joinFlow; true — сообщение потреблено
  if (joinFlow && joinFlow.handle(m)) return;
  switch (m.type) {
    case "hello":
    case "state":
      state = m.state;
      if (m.type === "hello") {
        if (goneFlow) goneFlow.hello();
        if (window.MP && MP.applyHello) MP.applyHello(m);
        // сокет переоткрылся, пока человек решал «Это ты?» — повторяем join: сервер продлит ожидание
        if (joinFlow && joinFlow.state().prompting) joinFlow.resume();
      }
      if (m.type === "hello" && token && needJoin) { needJoin = false; conn.send({ type: "join", token }); }
      checkRoomLang();
      if (state.phase !== prevPhase) {
        if (state.phase === "choose") { hedge = false; picks = []; sentPick = false; }
        if (state.phase === "lie" || state.phase === "choose") qpVibrate(30);
        prevPhase = state.phase;
      }
      // hello на новом сокете без игрока приходит «чужим» состоянием — при возврате по токену экран не трогаем до joined
      if (!(m.type === "hello" && me && token)) render();
      // вернулись по токену: действия, нажатые в обрыв, отправляем, когда сервер снова признал нас
      if (pendingFlush && state.me) { pendingFlush = false; flushQueued(); }
      break;
    case "joined": {
      const was = me;
      me = m.playerId;
      token = m.token;
      joinErr = null;
      try { localStorage.setItem(tokenKey(), token); } catch (e) {}
      // имя занято, и сервер дал «Имя (2)» — говорим об этом (fibs-027)
      if (m.renamed && m.name) toast(tpl("renamed_toast", { name: m.name }));
      keepAwake();
      if (was !== me) { screen = null; screenKey = ""; } // повторный вход после обрыва экран не пересобирает
      render();
      pendingFlush = true;
      setTimeout(() => { if (pendingFlush) { pendingFlush = false; flushQueued(); } }, 2000);
      break;
    }
    case "rejected":
      if (m.action === "hint") { justHinted = false; screenKey = ""; }
      if (m.action === "choose") { sentPick = false; screenKey = ""; }
      if (m.action === "lie") {
        screenKey = "";
        if (m.reason === "truth") { truthMsg = true; draft = ""; draftClear(); qpSfx.buzz(); qpVibrate([60, 40, 60]); render(); break; }
      }
      if (T("rj_" + m.reason) !== "rj_" + m.reason) toast(T("rj_" + m.reason));
      render();
      break;
    case "error":
      if (m.error === "name_taken") return renderTaken(m); // имя занято в партии: «Войти как «Имя (2)»» или другое имя
      conn.flush(() => false);
      if (m.error === "room_expired") return renderExpired();
      if (["room_full", "token_gone", "bad_name"].includes(m.error)) {
        if (m.error === "token_gone") { try { localStorage.removeItem(tokenKey()); } catch (e) {} token = null; }
        joinErr = m.error === "bad_name" ? "err_name" : "err_" + m.error;
        me = null;
        renderEnter();
      }
      break;
    case "kicked":
      conn.flush(() => false);
      draftClear();
      if (joinFlow) joinFlow.cancel();
      me = null;
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
      token = null;
      screen = "kicked";
      renderCenter("kicked_title");
      break;
    case "replaced":
      me = null;
      screen = "replaced";
      renderCenter("replaced_title", "replaced_text", `<button class="btn" style="margin-top:14px" id="here" type="button">${T("btn_back_here")}</button>`);
      document.getElementById("here").onclick = () => { conn.send({ type: "join", token }); };
      break;
  }
}

function start() {
  if (!CODE) return renderLanding();
  renderCenter("wait_title");
  const banner = document.getElementById("conn");
  let netLost = false, netQuiet = false;
  const showNet = () => {
    banner.textContent = T(netLost ? "err_connect" : "conn_lost");
    banner.classList.toggle("on", netLost || netQuiet);
  };
  window.addEventListener("langchange", showNet);
  conn = qpConnect({
    code: CODE,
    onMessage,
    onGone: onRoomGone,
    onDrop: unlockDropped,
    keep: keepQueued,
    tag: () => (state ? factId() : null),
    // переподключились — снова входим своим токеном (hello придёт первым)
    onOpen: () => { needJoin = true; if (token) conn.gated = true; },
    // «lost» — сокет закрыт, переподключаемся; «quiet» — сокет жив, но молчит дольше 10 с (MP.conn): только предупреждение
    onState: (st) => { netLost = st === "lost"; if (st === "open") netQuiet = false; showNet(); },
    onQuiet: (q) => { netQuiet = !!q; showNet(); },
  });
  joinFlow = window.MP && MP.joinFlow && !MP.off ? MP.joinFlow({
    send: (m) => conn.send(m),
    buildJoin: () => ({ name: joinName }),
    onClaimPrompt: renderClaim,
  }) : null;
  requestAnimationFrame(frame);
  // ручка для стенда: состояние и отправка
  window.qpPhone = { send: (msg) => conn.send(msg), get state() { return state; }, get me() { return me; } };
}
start();
</script>
