<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08070b">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1fac2.svg" type="image/svg+xml">
<title>Айфилю — игра для компании: угадай, как друг расставил</title>
<meta name="robots" content="index,follow">
<meta name="description" content="🫂 Мультиплеерная игра для компании: каждый тайно расставляет пять карточек от самого любимого до наименее, а остальные угадывают его порядок. Бесплатно, в браузере, с телефонов." data-i18n-meta="_meta">
<!-- ссылки на комнаты (?r=КОД) — та же страница: в выдаче должна быть одна, без кода -->
<link rel="canonical" href="https://randomhost.online/ifeel.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Айфилю — игра для компании">
<meta property="og:description" content="Каждый тайно расставляет пять карточек, остальные угадывают его порядок. Бесплатно, в браузере, с телефонов.">
<meta property="og:url" content="https://randomhost.online/ifeel.html">
<meta property="og:image" content="https://randomhost.online/og-image.png">
<meta property="og:site_name" content="Рандомайзер Онлайн">
<meta property="og:locale" content="ru_RU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="ifeel-theme.css">
<style>
  /* Пульт «Айфилю» — тепловизор в кармане. Пока ты расставляешь, каждая карточка, встав на место, «нагревается»:
     1-е — раскалено добела, 5-е — холодный кобальт, у места своя «температура». Непоставленные — серые, без температуры.
     Расстановка — только тапами (не drag): тап ставит на следующее место, тап по поставленной снимает её и всё ниже. */
  :root {
    --lang-switch-bg: var(--bg);
    --lang-switch-border: var(--line);
    --lang-switch-fg: var(--muted);
    --lang-switch-active-bg: var(--hud);
    --lang-switch-active-fg: var(--bg);
    --lang-switch-active-border: var(--hud);
    --lang-switch-font: var(--mono);
    --btn-hot: var(--h3); --btn-hot-ink: var(--h3i); --btn-hot-edge: var(--h4);
  }
  body.edgy { --btn-hot: var(--edgy); --btn-hot-ink: #fff; --btn-hot-edge: #8e0a26; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--text); font: 600 17px/1.25 var(--font); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 3px solid var(--hud); outline-offset: 2px; }

  .util { display: flex; align-items: center; gap: 8px; height: 52px; padding: 8px calc(var(--lsw, 150px)) 0 12px; position: relative; z-index: 3; }
  .util a { color: var(--text); text-decoration: none; font: 700 14px/1 var(--mono); white-space: nowrap; flex: none; height: 44px; min-width: 44px; padding: 0 12px; border: 2px solid var(--line); border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; }
  @media (max-width: 400px) { .util a { font-size: 0; padding: 0; width: 44px; } .util a::before { content: "←"; font-size: 22px; } }
  .sound-toggle-btn { flex: none; margin: 0; width: 44px; height: 44px; border: 2px solid var(--line); border-radius: var(--r-sm); background: transparent; color: var(--text); font-size: 16px; display: grid; place-items: center; padding: 0; }
  .lang-switch { top: 8px !important; right: 12px !important; height: 44px !important; padding: 3px !important; box-sizing: border-box !important; align-items: center; border-radius: var(--r-sm) !important; }
  .conn { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); z-index: 30; background: var(--hud); color: var(--bg); font: 700 14px/1.2 var(--mono); padding: 8px 14px; border-radius: var(--r-sm); visibility: hidden; white-space: nowrap; }
  .conn.on { visibility: visible; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 30; background: var(--hud); color: var(--bg); font: 700 15px/1.25 var(--mono); padding: 10px 16px; border-radius: var(--r-sm); max-width: calc(100% - 32px); text-align: center; visibility: hidden; }
  .toast.on { visibility: visible; }
  .langhint { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 31; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; background: var(--text); color: var(--bg); border-radius: var(--r-sm); font-weight: 800; font-size: 16px; }
  .langhint[hidden] { display: none; }
  .langhint span { flex: 1 1 160px; min-width: 0; }
  .langhint button { min-height: 44px; min-width: 44px; padding: 0 14px; border: 2px solid var(--bg); border-radius: var(--r-sm); background: transparent; color: var(--bg); font-weight: 800; }
  .langhint button.yes { background: var(--bg); color: var(--text); }

  #app { position: relative; z-index: 2; max-width: 520px; margin: 0 auto; padding: 2px 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; min-height: calc(100dvh - 52px); }
  #app > * { min-width: 0; }
  #app.mid { justify-content: center; }

  h1, h2 { margin: 0; font-weight: 900; line-height: 1.02; }
  h2 { font-size: clamp(24px, 7.4vw, 30px); text-transform: uppercase; text-wrap: balance; }
  .lede { font-size: 17px; font-weight: 600; margin: 0; color: var(--muted); }
  .fine { font-size: 15px; font-weight: 600; margin: 0; color: var(--muted); }
  .eyebrow { font: 700 12px/1.1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .panel { background: var(--bg2); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .note { flex: 1 1 auto; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 12px; background-color: var(--bg2); border-radius: var(--r); padding: 22px 18px; }
  .note.vf { --vf-l: 26px; }
  #app.mid .note { flex: 0 0 auto; }
  .note .btn { align-self: stretch; }

  /* верх игрового экрана: раунд/вопрос слева, секунды справа, полоса таймера */
  .meta { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 700 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .meta b { font: 700 22px/1 var(--mono); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; color: var(--hud); min-width: 3.4ch; text-align: right; }
  .meta.hot b { color: var(--h3); }
  .meta > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timer { flex: none; height: 4px; background: var(--bg3); overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--hud); transform-origin: left; }

  .ask { flex: none; font: 900 clamp(24px, 7.6vw, 32px)/1 var(--font); text-transform: uppercase; overflow-wrap: anywhere; text-wrap: balance; }
  .ask small { display: block; font: 700 12px/1.25 var(--mono); color: var(--muted); letter-spacing: .06em; margin-bottom: 6px; text-transform: uppercase; }
  .tag { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--text); border: 2px solid var(--line); border-radius: var(--r-sm); padding: 4px 10px; font: 700 12px/1.2 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
  .ask .qplace { font-size: 1.08em; }
  .ask .qc { text-transform: none; }
  /* «Твой ход!»: весь экран — шкала тепловизора, крупно и сразу видно с вытянутой руки */
  .yourturn { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 22px 18px; border-radius: var(--r); background-color: var(--h1); color: var(--h1i); --vf-c: var(--h1i); --vf-l: 30px; --vf-t: 4px; animation: yt .45s steps(3, end) both; }
  .yourturn .eyebrow { color: var(--h1i); }
  .yourturn h1 { font: 900 clamp(56px, 19vw, 92px)/.9 var(--font); text-transform: uppercase; letter-spacing: -.01em; }
  .yourturn .who { font: 900 clamp(26px, 8vw, 34px)/1 var(--font); text-transform: uppercase; overflow-wrap: anywhere; }
  .yourturn .lede { color: var(--h1i); opacity: .8; }
  .yourturn .exposed { height: 18px; }
  /* только background-color: шорткат background сбросил бы уголки видоискателя (.vf — это background-image) */
  @keyframes yt { 0% { background-color: var(--h5); color: var(--h5i); } 50% { background-color: var(--h3); color: var(--h3i); } }
  /* зритель хода: «Петя → Маша» в рамке видоискателя, без кнопок */
  .watchcard { gap: 14px; }
  .watchcard .duo { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; font: 900 clamp(26px, 8vw, 34px)/1 var(--font); text-transform: uppercase; }
  .watchcard .duo .arr { font: 700 22px/1 var(--mono); color: var(--hud); }
  .watchcard .duo span { overflow-wrap: anywhere; min-width: 0; }
  .watchcard .qnow { font: 800 clamp(19px, 5.6vw, 23px)/1.15 var(--font); margin: 0; }
  /* свой порядок после «Готово» — из памяти телефона: сервер его не отдаёт никому */
  .myorder { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; align-self: stretch; }
  .myorder .icard { padding: 7px 10px; font-size: 16px; min-height: 38px; }
  .pick .newtag { margin-left: auto; flex: none; font: 700 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 6px; border: 2px solid currentColor; border-radius: var(--r-sm); }
  .pick.fresh { box-shadow: inset 0 0 0 3px var(--hud); }
  .restart { align-self: stretch; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--hud); color: var(--bg); font: 700 13px/1.25 var(--mono); text-transform: uppercase; letter-spacing: .04em; }
  .qres li { flex-wrap: wrap; }
  .qres li em { flex-basis: 100%; font: 500 13px/1.25 var(--mono); font-style: normal; color: var(--muted); }
  .winline { font: 900 clamp(22px, 7vw, 28px)/1.05 var(--font); text-transform: uppercase; margin: 0; overflow-wrap: anywhere; }

  /* шкала + расстановка: слева ступенчатая полоса тепловизора, справа места 1..N с «температурой» */
  .rankbox { flex: none; display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; }
  .scalebar { background: var(--scale); }
  .slots { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .slab { font: 700 12px/1.2 var(--mono); color: var(--h2); text-transform: uppercase; letter-spacing: .03em; }
  .slab.b { color: var(--cold); }
  .slot { min-height: 46px; padding: 6px 10px; font-size: 17px; width: 100%; border: 0; text-align: left; }
  .slot .deg { font-size: 13px; }
  .slot.empty { background: transparent; border: 2px dashed var(--line); color: var(--muted); font-weight: 700; }
  .slot.empty .deg { opacity: .5; }
  .pool { flex: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  /* в расстановке непоставленные — в две колонки: места, карточки и «Готово» влезают в 360×740 без прокрутки */
  .pool.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pool.two .pick { font-size: 16px; padding: 6px 10px; min-height: 50px; }
  .btn.stick { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 4; }
  .pick { min-height: 54px; padding: 8px 12px; width: 100%; border: 0; text-align: left; font-size: 18px; box-shadow: inset 0 0 0 2px var(--line); transition: transform .08s, opacity .15s; }
  .pick:active:not(:disabled) { transform: scale(.98); }
  .pick:disabled { opacity: .45; }
  .pick.sel { background: var(--h1); color: var(--h1i); box-shadow: none; }
  .pick.veto { animation: wob .5s ease-in-out infinite; box-shadow: inset 0 0 0 3px var(--bad); }
  @keyframes wob { 50% { transform: rotate(-1deg); } }
  .pair { flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; min-height: 150px; max-height: 340px; }
  .pair .pick { flex-direction: column; justify-content: center; text-align: center; font-size: clamp(19px, 5.8vw, 24px); font-weight: 900; }
  .pair .pick .e { font-size: 36px; }

  .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 58px; border: 0; border-radius: var(--r-sm); background: var(--text); color: var(--bg); font: 900 clamp(19px, 5.6vw, 22px)/1.05 var(--font); text-transform: uppercase; letter-spacing: .02em; padding: 12px; text-align: center; text-decoration: none; box-shadow: 0 4px 0 rgba(244, 241, 234, .35); margin-bottom: 4px; transition: transform .08s, opacity .15s; }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(244, 241, 234, .35); }
  .btn:disabled { opacity: 1; background: var(--bg3); color: var(--muted); box-shadow: none; }
  .btn.hot:not(:disabled) { background: var(--btn-hot); color: var(--btn-hot-ink); box-shadow: 0 4px 0 var(--btn-hot-edge); }
  .btn.hot:active:not(:disabled) { box-shadow: 0 1px 0 var(--btn-hot-edge); }
  .btn.ghost { background: transparent; color: var(--text); border: 2px solid var(--line); font: 700 15px/1.1 var(--mono); min-height: 48px; box-shadow: none; }
  .link { background: none; border: 0; min-height: 44px; padding: 8px 12px; font: 500 14px/1.2 var(--mono); color: var(--muted); text-decoration: underline; text-underline-offset: 4px; display: block; margin: 0 auto; }
  .link.leave { margin-top: auto; }

  /* вход: логотип-тепловизор и заголовок крупно */
  .enter { display: flex; flex-direction: column; gap: 14px; }
  .enter-h { display: grid; gap: 8px; padding-top: 6px; }
  .enter-h .gname { display: flex; align-items: center; gap: 10px; font: 900 22px/1 var(--font); text-transform: uppercase; letter-spacing: .02em; color: var(--text); }
  .enter-h .gname::before { content: ""; width: 22px; height: 22px; background: var(--scale); border-radius: 2px; }
  .enter-h h1 { font-size: clamp(38px, 12.5vw, 54px); text-transform: uppercase; }
  .fld { display: grid; gap: 6px; position: relative; }
  .fld > span { font: 700 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  input.field { width: 100%; border: 2px solid var(--line); border-radius: var(--r-sm); background: var(--bg2); color: var(--text); font: 800 22px/1.2 var(--font); padding: 12px 14px; outline: none; }
  input.field:focus { border-color: var(--hud); }
  input.field.code { text-transform: uppercase; letter-spacing: .1em; font-family: var(--mono); font-weight: 700; }
  .fld.cnt-on input.field { padding-right: 58px; }
  .fld .cnt { position: absolute; right: 12px; bottom: 17px; font: 700 12px/1 var(--mono); color: var(--muted); pointer-events: none; font-style: normal; }
  .fld .cnt[data-state="full"] { color: var(--bad); }
  .signcode { align-self: stretch; font: 700 clamp(28px, 10vw, 40px)/1 var(--mono); letter-spacing: .06em; padding: 12px 14px; color: var(--hud); border: 2px solid var(--hud); border-radius: var(--r-sm); white-space: nowrap; }
  .err { min-height: 18px; margin: -6px 0; font-weight: 800; font-size: 15px; color: var(--bad); }
  .or { display: flex; align-items: center; gap: 12px; font: 700 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .or::before, .or::after { content: ""; flex: 1; height: 2px; background: var(--line); }
  ol.rules { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: r; }
  ol.rules li { counter-increment: r; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; font: 600 16px/1.25 var(--font); color: var(--text); }
  ol.rules li::before { content: counter(r); display: grid; place-items: center; height: 34px; font: 700 16px/1 var(--mono); background: var(--h1); color: var(--h1i); }
  ol.rules li:nth-child(2)::before { background: var(--h3); color: var(--h3i); }
  ol.rules li:nth-child(3)::before { background: var(--h5); color: var(--h5i); }
  .claimbtns { display: grid; gap: 10px; align-self: stretch; }

  /* лобби */
  .me-badge { display: flex; align-items: center; gap: 12px; background: var(--bg2); border-radius: var(--r); padding: 10px 14px; }
  .av { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--bg3); border: 3px solid var(--pc, var(--line)); display: grid; place-items: center; font-size: 22px; font-style: normal; line-height: 1; }
  .me-badge b { font-size: 22px; font-weight: 900; overflow-wrap: anywhere; min-width: 0; }
  .avbtn { border: 0; background: none; padding: 0; border-radius: 50%; line-height: 0; flex: none; display: grid; place-items: center; min-width: 44px; min-height: 44px; }
  .avpick { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .avpick button { aspect-ratio: 1; border: 0; border-radius: var(--r-sm); background: var(--bg3); font-size: 22px; line-height: 1; padding: 0; }
  .avpick button.on { box-shadow: inset 0 0 0 3px var(--hud); }
  .avpick button:disabled { opacity: .3; }
  @media (max-width: 360px) { .avpick { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .plist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; list-style: none; margin: 0; padding: 0; }
  .plist li { display: flex; align-items: center; gap: 8px; background: var(--bg3); border-radius: var(--r-sm); padding: 6px 8px; font: 800 16px/1.1 var(--font); min-width: 0; }
  .plist li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .av { width: 28px; height: 28px; font-size: 15px; border-width: 2px; }
  .plist li.me { background: var(--text); color: var(--bg); }
  .plist li.off { opacity: .45; }
  .plist li.ok { box-shadow: inset 0 -3px 0 var(--h1); }
  .plist li.ok::after { content: "✓"; margin-left: auto; color: var(--h1); font: 700 15px/1 var(--mono); }
  .plist li.me.ok::after { color: var(--bg); }

  /* выбор категории: три карточки, у каждой шкала полосой тепловизора слева */
  .offers { flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px; }
  .offer { position: relative; flex: 1 1 0; min-height: 96px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 8px; text-align: left; border: 0; border-radius: var(--r); padding: 14px 16px 14px 26px; background: var(--bg2); color: var(--text); transition: transform .08s; }
  .offer::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--scale); }
  .offer b { font-size: clamp(20px, 6.2vw, 25px); font-weight: 900; line-height: 1.04; text-transform: uppercase; }
  .offer .sc { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 700 12px/1.25 var(--mono); text-transform: uppercase; }
  .offer .sc span.t { color: var(--h2); } .offer .sc span.b { color: var(--cold); }
  .offer .sc span.t::before { content: "▲ "; } .offer .sc span.b::before { content: "▼ "; }
  .offer .rn { font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--hud); }
  .offer.sel { background: var(--h1); color: var(--h1i); }
  .offer.sel .sc span.t, .offer.sel .sc span.b, .offer.sel .rn { color: var(--h1i); }
  .offer:active { transform: scale(.985); }

  /* сочинение карточек */
  .wrow { display: grid; grid-template-columns: minmax(0, 1fr) 50px; gap: 6px; }
  .wrow input { width: 100%; min-height: 50px; border: 2px solid var(--line); border-radius: var(--r-sm); background: var(--cold-card); color: var(--text); font: 800 18px/1.2 var(--font); padding: 8px 12px; outline: none; }
  .wrow input::placeholder { color: var(--muted); font: 500 14px/1.2 var(--mono); }
  .wrow input:focus { border-color: var(--hud); }
  .wrow input.bad { border-color: var(--bad); }
  .wrow button { border: 2px solid var(--line); border-radius: var(--r-sm); background: transparent; font-size: 22px; }
  .werr { min-height: 16px; font: 700 13px/1.2 var(--mono); color: var(--bad); }
  .prompt { font: 900 clamp(22px, 6.8vw, 28px)/1.02 var(--font); text-transform: uppercase; overflow-wrap: anywhere; margin: 0; }
  .scaleline { display: flex; justify-content: space-between; gap: 8px; font: 700 12px/1.25 var(--mono); text-transform: uppercase; }
  .scaleline .t { color: var(--h2); } .scaleline .b { color: var(--cold); text-align: right; }
  .scaleline .t::before { content: "▲ "; } .scaleline .b::after { content: " ▼"; }

  /* итог хода */
  .gain { font: 700 clamp(64px, 22vw, 96px)/.9 var(--mono); letter-spacing: -.05em; font-variant-numeric: tabular-nums; color: var(--h1); }
  .qres { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; align-self: stretch; }

<script src="mp-common.js"></script>
<script src="ifeel-shared.js"></script>

<script src="sound-toggle.js" defer></script>
<script>
"use strict";
const params = new URLSearchParams(location.search);
// код идёт в разметку и в запросы — только алфавит кодов (слово + цифры 2–9)
const cleanCode = (s) => String(s || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const CODE = cleanCode(params.get("r"));
const app = document.getElementById("app");
const T = (k) => wvT(k);
const tpl = (k, v) => wvTpl(k, v);
const esc = escapeHtml;
const tokenKey = () => "ifeel_token_" + CODE;
const CARD_MAX = 40;

let conn = null, state = null, me = null, token = null, dead = false;
let screen = null, screenKey = "";
let joinErr = null;
let flow = null, tab = null, langFollow = null;
let joinName = "";
let claimPrompt = null;
let waitPhase = null;
const NAME_LIMIT = () => (window.MP && MP.limits && MP.limits.name) || 15;
const mpOn = () => !!(window.MP && !MP.off);
function buildJoin() {
  const m = { type: "join" };
  if (joinName) m.name = joinName;
  if (token) m.token = token;
  return m;
}
function doJoin(extra) {
  if (flow && flow.join(extra)) return;
  const m = buildJoin();
  if (extra) for (const k in extra) m[k] = extra[k];
  conn.send(m);
}
try { token = localStorage.getItem(tokenKey()); } catch (e) {}

const player = (id) => state && state.players.find((p) => p.id === id);
const mine = () => (state && me ? player(me) : null);
const nameOf = (id) => (player(id) || {}).name || "?";
const avHtml = (p) => `<i class="av" style="--pc:${esc(p.color)}">${esc(p.avatar)}</i>`;
// ключ фазы: игра, раунд, ход и вопрос — по нему живут локальные черновики (расстановка, ответы)
const phaseKey = () => (state ? [state.game, state.round ? state.round.n : 0, state.phase, state.round ? state.round.ti : "", state.turn ? state.turn.qi : ""].join(":") : "");
const turnKey = () => (state && state.round ? [state.game, state.round.n, state.round.ti].join(":") : "");
const itemHtml = (x, no, extra) => `${no ? `<span class="no p${no}">${no}</span>` : ""}${x.e ? `<span class="e">${esc(x.e)}</span>` : ""}<span>${esc(x.t)}</span>${extra || ""}`;

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), 2600);
}
// пересобираем экран только при смене ключа: иначе кнопка, которую нажимают, исчезает из-под пальца
function show(html, key, mid) {
  if (key === screenKey) return false;
  screenKey = key;
  app.classList.toggle("mid", !!mid);
  app.innerHTML = html;
  return true;
}

let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && me) keepAwake(); });

// ---------- действия с id: кнопка «ушло» до ack, снимается по отказу, обрыву и таймауту ----------
let acts = null;
const busy = (type, pred) => !!(acts && acts.waiting(type, pred));
function act(msg) {
  if (!acts) { conn.send(msg); return; }
  acts.act(msg);
  screenKey = "";
  render();
}

// ---------- вход ----------
function renderEnter() {
  screen = "enter";
  let saved = "";
  try { saved = localStorage.getItem("ifeel-name") || ""; } catch (e) {}
  const codeBlock = CODE
    ? `<div class="fld"><span>${esc(T("room_label"))}</span><div class="signcode">${esc(CODE)}</div></div>`
    : `<label class="fld"><span>${esc(T("code_ph"))}</span><input class="field code" id="code" maxlength="12" autocapitalize="characters" autocomplete="off" aria-label="${esc(T("code_ph"))}"></label>`;
  const html = `<form id="enterform" class="enter" autocomplete="off">
    <header class="enter-h"><div class="gname">${esc(T("game_name"))}</div><h1>${esc(T("enter_title"))}</h1></header>
    <label class="fld"><span>${esc(T("enter_ph"))}</span><input class="field" id="name"${mpOn() ? "" : ' maxlength="15"'} value="${esc(saved)}" enterkeyhint="go" aria-label="${esc(T("enter_ph"))}"></label>
    ${codeBlock}
    <div class="err" id="err" role="alert">${joinErr ? esc(T(joinErr)) : ""}</div>
    <button class="btn" type="submit">${esc(T("btn_join"))}</button>
    ${CODE ? "" : `<div class="or">${esc(T("or"))}</div><button class="btn ghost" id="create" type="button">${esc(T("btn_create"))}</button>`}
    <ol class="rules"><li>${esc(T("rule1"))}</li><li>${esc(T("rule2"))}</li><li>${esc(T("rule3"))}</li></ol>
  </form>`;
  screenKey = "";
  show(html, "enter", true);
  const input = document.getElementById("name");
  if (mpOn() && input) {
    const fld = input.closest(".fld"), cnt = document.createElement("em");
    cnt.className = "cnt";
    fld.classList.add("cnt-on");
    fld.appendChild(cnt);
    MP.nameCounter(input, NAME_LIMIT(), { el: cnt });
  }
  const createBtn = document.getElementById("create");
  if (createBtn) createBtn.onclick = async () => {
    const err = document.getElementById("err");
    createBtn.disabled = true;
    createBtn.textContent = T("btn_creating");
    try {
      const res = await fetch("/ifeel/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: wvLang() } }) });
      const data = await res.json();
      if (!res.ok) throw new Error("create");
      try { localStorage.setItem("ifeel-host-" + data.code, data.hostToken); } catch (e2) {}
      location.href = "ifeel-board.html?r=" + encodeURIComponent(data.code);
    } catch (e2) {
      createBtn.disabled = false;
      createBtn.textContent = T("btn_create");
      err.textContent = T("err_create");
    }
  };
  document.getElementById("enterform").onsubmit = (e) => {
    e.preventDefault();
    const name = input.value.trim();
    const err = document.getElementById("err");
    if (!CODE) {
      const c = cleanCode(document.getElementById("code").value);
      if (!c) { err.textContent = T("err_code"); return; }
      if (name) { try { localStorage.setItem("ifeel-name", name); } catch (e2) {} }
      location.href = "ifeel.html?r=" + encodeURIComponent(c);
      return;
    }
    if (!name) { err.textContent = T("err_name"); return; }
    try { localStorage.setItem("ifeel-name", name); } catch (e2) {}
    joinErr = null;
    waitPhase = null;
    joinName = name;
    doJoin();
    keepAwake();
  };
}

function renderCenter(titleKey, text, extra, key) {
  show(`<div class="note"><h2>${esc(T(titleKey))}</h2>${text ? `<p class="lede">${esc(text)}</p>` : ""}${extra || ""}</div>`, key || "c:" + titleKey + ":" + (text || ""), true);
}
function renderClaim() {
  if (!claimPrompt) return;
  screen = "claim";
  const c = claimPrompt;
  const sc = c.summary && typeof c.summary.score === "number" ? c.summary.score : null;
  const text = sc == null ? tpl("claim_text0", { name: c.name }) : tpl("claim_text", { name: c.name, n: sc + " " + T("pts") });
  screenKey = "";
  renderCenter("claim_title", text, `<div class="claimbtns"><button class="btn" id="claimyes" type="button">${esc(T("btn_claim_yes"))}</button><button class="btn ghost" id="claimno" type="button">${esc(T("btn_claim_no"))}</button></div>`, "claim");
  document.getElementById("claimyes").onclick = () => { const p = claimPrompt; claimPrompt = null; screen = null; if (p) p.accept(); };
  document.getElementById("claimno").onclick = () => { const p = claimPrompt; claimPrompt = null; screen = null; if (p) p.decline(); };
}
let replacedHere = false;
function showReplaced() {
  replacedHere = true;
  me = null;
  screen = "replaced";
  renderCenter("replaced_title", T("replaced_text"), `<button class="btn" id="here" type="button">${esc(T("btn_back_here"))}</button>`);
  document.getElementById("here").onclick = () => { if (tab && tab.back()) return; doJoin(); };
}
function renderNoRoom() {
  dead = true;
  screen = "noroom";
  try { localStorage.removeItem(tokenKey()); } catch (e) {}
  const form = `<form id="codeform" class="enter" autocomplete="off"><label class="fld"><span>${esc(T("code_ph"))}</span><input class="field code" id="code2" maxlength="12" value="${esc(CODE)}" autocapitalize="characters" autocomplete="off" enterkeyhint="go"></label><div class="err" id="err2" role="alert"></div><button class="btn" type="submit">${esc(T("btn_go"))}</button><a class="btn ghost" href="index.html">${esc(T("expired_new"))}</a></form>`;
  screenKey = "";
  renderCenter("noroom_title", T("noroom_text"), form, "noroom");
  document.getElementById("codeform").onsubmit = (e) => {
    e.preventDefault();
    const c = cleanCode(document.getElementById("code2").value);
    if (!c) { document.getElementById("err2").textContent = T("err_code"); return; }
    location.href = "ifeel.html?r=" + encodeURIComponent(c);
  };
}
const goneFlow = window.MP && MP.roomGone ? MP.roomGone({ showForm: renderNoRoom, onClosed: () => renderExpired() }) : null;
function onRoomGone() { if (goneFlow) goneFlow.gone(); else renderExpired(); }
function renderExpired() {
  dead = true;
  screen = "expired";
  try { localStorage.removeItem(tokenKey()); } catch (e) {}
  renderCenter("expired_title", T("expired_text"), `<a class="btn" href="index.html">${esc(T("expired_new"))}</a>`);
}

// ---------- общие куски ----------
function metaHtml(left) {
  return `<div class="meta" id="meta"><span>${esc(left)}</span><b id="tsec"></b></div><div class="timer" id="timer"><i></i></div>`;
}
const roundLabel = () => (state.round ? tpl("round_n", { n: state.round.n }) : "");
const scaleHtml = (set) => `<div class="scaleline"><span class="t">${esc(set.top)}</span><span class="b">${esc(set.bottom)}</span></div>`;

// ---------- лобби ----------
let avOpen = false;
function avPickHtml() {
  if (!avOpen || !state.avatarChoices) return `<p class="fine">${esc(T("av_pick"))}</p>`;
  const taken = new Set(state.players.filter((x) => !x.left && x.id !== me).map((x) => x.avatar));
  const cur = mine().avatar;
  return `<div class="avpick" role="group">${state.avatarChoices.map((a) => `<button type="button" data-a="${esc(a)}" class="${a === cur ? "on" : ""}"${taken.has(a) ? " disabled" : ""}>${esc(a)}</button>`).join("")}</div>`;
}
const avKey = () => (avOpen ? "1" + state.players.map((p) => p.avatar).join("") : "0" + (mine() ? mine().avatar : ""));
function bindAvatars() {
  const b = document.getElementById("avbtn");
  if (b) b.onclick = () => { avOpen = !avOpen; screenKey = ""; render(); };
  app.querySelectorAll(".avpick button:not(:disabled)").forEach((x) => {
    x.onclick = () => { conn.send({ type: "avatar", avatar: x.dataset.a }); wvVibrate(10); avOpen = false; screenKey = ""; render(); };
  });
}
const LANG_NAMES = { ru: "Русский", en: "English", el: "Ελληνικά" };
function hideLangHint() { const h = document.getElementById("langhint"); if (h) { h.hidden = true; h.textContent = ""; } }
function showLangHint(s) {
  const h = document.getElementById("langhint");
  if (!h) return;
  h.textContent = "";
  const t = document.createElement("span");
  t.textContent = tpl("lang_hint", { lang: LANG_NAMES[s.lang] || s.lang.toUpperCase() });
  const yes = document.createElement("button"); yes.type = "button"; yes.className = "yes"; yes.textContent = T("lang_hint_yes");
  const no = document.createElement("button"); no.type = "button"; no.textContent = T("lang_hint_no");
  yes.onclick = () => { hideLangHint(); s.accept(); };
  no.onclick = () => { hideLangHint(); s.decline(); };
  h.append(t, yes, no);
  h.hidden = false;
}
function checkRoomLang() {
  if (!langFollow || !state) return;
  if (state.phase !== "lobby" && state.phase !== "finished") { hideLangHint(); return; }
  langFollow.check();
}
function renderLobby() {
  const p = mine();
  const list = state.players.filter((x) => !x.left);
  const need = Math.max(0, state.minPlayers - list.length);
  const deck = state.contentLang && state.contentLang !== wvLang() && LANG_NAMES[state.contentLang] ? tpl("lang_deck", { lang: LANG_NAMES[state.contentLang] }) : "";
  const key = "lobby:" + avKey() + ":" + list.map((x) => x.id + (x.online ? 1 : 0) + x.avatar).join(",") + ":" + state.settings.mode + deck;
  show(`<div class="me-badge"><button class="avbtn" id="avbtn" type="button" aria-label="${esc(T("av_pick"))}">${avHtml(p)}</button><div style="min-width:0"><div class="fine">${esc(T("lobby_in"))}</div><b>${esc(p.name)}</b></div></div>

  if (a) a.onclick = () => sendAnswer(qi, order.slice());
}
const resLabel = (q) => (q.kind === "pair" ? esc(T("res_q1")) : wvPlaceOf(q) != null ? wvTplHtml("res_q2", { place: esc(wvOrd(wvPlaceOf(q), "nom")) }) : esc(T("res_q3")));
function renderReveal() {
  const t = state.turn, m = state.me;
  const tname = nameOf(t.target);
  // итог — не раньше, чем доска раскроет порядок: иначе телефон выдаст то, что все смотрят на экране
  if (wvNow() < state.phaseStart + 5200) {
    const sub = m.role === "target" ? T("watch_me") : tpl("watch_reveal", { name: tname });
    return renderCenter("watch_title", sub, `<div class="exposed"></div>`, "watch:" + turnKey() + wvLang());
  }
  if (m.role === "target") return renderCenter("res_t", T("res_t_sub"), "", "res-t:" + turnKey() + wvLang());
  const res = t.result || { order: [], pts: {} };
  if (m.role !== "guesser") {
    const lines = t.guessers.map((g) => `<p class="winline">${esc(tpl("watch_res", { g: nameOf(g), n: (res.pts[g] || [0, 0, 0]).reduce((a, b) => a + b, 0) }))}</p>`).join("");
    return show(`<div class="note vf"><div class="eyebrow">${esc(tpl("watch_turn", { g: t.guessers.map(nameOf).join(" + ") || "—", t: tname }))}</div><h2>${esc(T("res_t"))}</h2>${lines}<p class="fine">${esc(T("res_t_sub"))}</p></div>`, "res-w:" + turnKey() + wvLang(), true);
  }
  const pts = m.pts || [0, 0, 0];
  const total = pts.reduce((a, b) => a + b, 0);
  const ans = (t.answers[me] || []);
  // строка вопроса: очки и пояснение частичных — «рядом: 3-е место вместо 2-го, +100»
  const rows = `<ul class="qres">${t.qs.map((q, i) => `<li class="${pts[i] > 0 ? "ok" : "no"}"><span>${resLabel(q)}</span><b>+${pts[i]}</b><em>${esc(wvExplain(q, ans[i], res.order, pts[i]))}</em></li>`).join("")}</ul>`;
  const html = `<div class="note vf"><div class="eyebrow">⌖ ${esc(tname)}</div><h2>${esc(T("res_g"))}</h2><div class="gain">+${total}</div>${rows}</div>`;
  if (show(html, "res:" + turnKey() + wvLang(), true)) (total >= 500 ? wvSfx.win : total > 0 ? wvSfx.hit : wvSfx.womp)();
}

// ---------- счёт, пауза, итоги ----------
function standingsHtml() {
  const list = state.players.filter((x) => !x.left).slice().sort((a, b) => b.score - a.score);
  return `<ol class="standings">${list.map((x) => `<li class="${x.id === me ? "me" : ""}"><span class="rk">${wvRank(list, x)}</span>${avHtml(x)}<span class="nm">${esc(x.name)}</span><b>${x.score}</b></li>`).join("")}</ol>`;
}
function renderScores() {
  const list = state.players.filter((x) => !x.left);
  const self = mine();
  show(`<div class="note"><div class="eyebrow">${esc(tpl("scores_title", { n: state.round ? state.round.n : 1 }))}</div><div class="place">${esc(tpl("place", { n: wvRank(list, self) }))}</div>
    <p class="lede">${esc(T("score_label"))}: <b>${self.score}</b></p></div>${standingsHtml()}`, "scores:" + phaseKey(), false);
}
function renderPause() {
  renderCenter("pause_title", tpl("pause_sub", { n: state.minPlayers }), "", "pause:" + state.phaseStart);
}
function renderFinal() {
  const self = mine();
  const list = state.players.filter((x) => !x.left);
  const place = wvRank(list, self);
  const winners = wvWinners(list);
  const top = winners.length ? winners[0].score : 0;
  const why = state.finishedReason;
  const sub = why === "host" ? T("final_host") : why === "paused" ? T("final_paused") : why === "few" ? T("final_few") : T("final_sub");
  // победители названы явно; ничья — «Победу делят: …», места с учётом ничьих (1, 1, 3)
  const win = winners.length > 1 ? tpl("final_shared", { names: winners.map((x) => x.name).join(", ") }) : winners.length ? tpl("final_win", { name: winners[0].name }) : "";
  const mineTag = self.score < top ? tpl("final_gap", { n: top - self.score }) : winners.length > 1 ? T("final_leader_shared") : T("final_leader");
  const html = `<div class="note"><div class="eyebrow">${esc(T("final_title"))}</div>${win ? `<p class="winline">🏆 ${esc(win)}</p>` : ""}<div class="place">${esc(tpl("place", { n: place }))}</div>
      <p class="lede">${esc(self.avatar)} ${esc(self.name)} · <b>${self.score}</b> ${esc(T("pts"))}</p>
      <span class="tag">${esc(mineTag)}</span>
      <p class="fine">${esc(sub)}</p></div>${standingsHtml()}
    <button class="btn ghost" id="leave" type="button">${esc(T("btn_leave"))}</button>`;
  if (show(html, "finished:" + state.game + ":" + list.map((x) => x.score).join(",") + wvLang(), false)) {
    if (place === 1 && why === "done") wvSfx.fanfare();
    document.getElementById("leave").onclick = leave;
  }
}
function renderLate() {
  renderCenter("late_title", T("late_sub"), "", "late:" + phaseKey());
}

// ---------- выбор экрана ----------
function render() {
  if (dead || !state) return;
  if (!me) {
    if (token) return;
    if (["kicked", "replaced", "left", "claim", "enter"].includes(screen)) return;
    return renderEnter();
  }
  const p = mine();
  if (!p || p.left || !state.me) return;
  screen = "game";
  document.body.classList.toggle("edgy", !!(state.settings && state.settings.mode === "edgy"));
  switch (state.phase) {
    case "lobby": return renderLobby();
    case "pick": return renderPick();
    case "write": return renderWrite();
    case "rank": return renderRank();
    case "tintro": return state.turn && state.me.role ? renderTintro() : renderLate();
    case "ask": return state.turn && state.me.role ? renderAsk() : renderLate();
    case "reveal": return state.turn && state.me.role ? renderReveal() : renderLate();
    case "scores": return renderScores();
    case "pause": return renderPause();
    case "finished": return renderFinal();
  }
}

// таймер фазы; авто-отправка полной расстановки и написанных карточек за 1,5 с до конца (не дополняем — только то, что сделано)
let lastTickSec = null, autoSent = "";
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead || !state.phaseEnd) return;
  const left = state.phaseEnd - wvNow();
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  if (screenKey.startsWith("watch:") && state.phase === "reveal" && wvNow() >= state.phaseStart + 5200) render();
  const bar = document.getElementById("timer");
  if (bar) bar.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`;
  const ts = document.getElementById("tsec");
  if (ts) {
    ts.textContent = tpl("sec", { s: Math.max(0, Math.ceil(left / 1000)) });
    document.getElementById("meta").classList.toggle("hot", left < 5000);
  }
  const live = state.phase === "ask" || state.phase === "rank" || state.phase === "pick" || state.phase === "write";
  if (live && left < 5000 && left > 0) {
    const sec = Math.ceil(left / 1000);
    if (sec !== lastTickSec) { lastTickSec = sec; if (state.phase === "ask" && state.me && state.me.role === "guesser") wvSfx.tick(true); }
  }
  if (left < 1500 && left > 0 && autoSent !== phaseKey() && state.me) {
    autoSent = phaseKey();
    if (state.phase === "rank" && state.me.set && !state.me.ranked && rankOrder().length === state.me.set.items.length) sendRank(true);
    if (state.phase === "write" && state.me.write && !state.me.write.cards && writeLocal && writeLocal.key === phaseKey() && writeLocal.cards.some((x) => x.trim())) sendCards(true);
  }
}

window.addEventListener("langchange", () => {
  hideLangHint();
  if (screen === "enter") return renderEnter();
  screenKey = "";
  if (screen === "expired") return renderExpired();
  if (screen === "noroom") return renderNoRoom();
  if (screen === "claim") return renderClaim();
  if (screen === "kicked" || screen === "replaced" || screen === "left") return;
  if (!state) return renderCenter("wait_title");
  render();
});

// ---------- связь ----------
let needJoin = true, pendingFlush = false;
// что нажато во время обрыва — отправляем, только если ещё актуально (та же фаза, ход и вопрос)
const sentKey = typeof WeakMap === "function" ? new WeakMap() : null;
function stillWanted(q) {
  const mc = state && state.me;
  if (!mc) return false;
  if (sentKey && sentKey.has(q) && sentKey.get(q) !== phaseKey()) return false;
  switch (q.type) {
    case "pick": return state.phase === "pick";
    case "cards": return state.phase === "write" && !!mc.write && !mc.write.cards;
    case "rank": return state.phase === "rank" && !mc.ranked;
    case "veto": return state.phase === "rank" && !mc.ranked && !!mc.veto && !mc.veto.used;
    case "answer": return state.phase === "ask" && !!state.turn && state.turn.qi === q.qi;
    case "avatar": return state.phase === "lobby";
    default: return true;
  }
}
function onDrop(q) {
  if (acts) acts.drop(q);
  if (!q || !state || !stillWanted(q)) { screenKey = ""; render(); return; }
  toast(T("rj_dropped"));
  screenKey = "";
  render();
}
function flushQueued() { conn.flush(stillWanted, onDrop); }
function onMessage(m) {
  if (mpOn()) {
    if (m.type === "hello" && MP.applyHello(m) === false) { flow = tab = null; }
    else if (tab && tab.handle(m)) return;
    else if (flow && flow.handle(m)) return;
  }
  if (acts) acts.handle(m);
  switch (m.type) {
    case "hello":
    case "state": {
      const prev = state;
      state = m.state;
      if (m.type === "hello" && goneFlow) goneFlow.hello();
      checkRoomLang();
      if (waitPhase && !me && state.phase !== waitPhase) { waitPhase = null; joinErr = null; doJoin(); }
      if (m.type === "hello" && needJoin && !replacedHere) {
        if (token) { needJoin = false; joinName = joinName || savedName(); doJoin(); }
        else if (flow && flow.state().prompting) { needJoin = false; flow.resume(); }
      }
      if (!prev || prev.phase !== state.phase) {
        vetoArmed = false;
        if (state.phase === "rank" || state.phase === "pick" || state.phase === "write") wvVibrate(30);
      }
      render();
      if (pendingFlush && state.me) { pendingFlush = false; flushQueued(); }
      break;
    }
    case "joined": {
      const was = me;
      me = m.playerId;
      replacedHere = false;
      token = m.token;
      joinErr = null;
      waitPhase = null;
      claimPrompt = null;
      if (m.name) {
        joinName = m.name;
        try { localStorage.setItem("ifeel-name", m.name); } catch (e) {}
        if (m.renamed) toast(tpl("renamed_toast", { name: m.name }));
      }
      try { localStorage.setItem(tokenKey(), token); } catch (e) {}
      keepAwake();
      if (was !== me) { screen = null; screenKey = ""; }
      render();
      pendingFlush = true;
      setTimeout(() => { if (pendingFlush) { pendingFlush = false; flushQueued(); } }, 2000);
      break;
    }
    case "ack":
      if (m.action === "cards" && draft) draft.clear();
      if (m.action === "veto" && !m.dup) { toast(T("veto_done")); wvVibrate(30); }
      screenKey = "";
      render();
      break;
    case "rejected":
      if (m.action === "pick") localPick = null;
      if (m.action === "answer" && state && state.turn) { const v = myAns(); for (let i = 0; i < 3; i++) if (!(state.me && state.me.answered && state.me.answered[i])) v[i] = null; }
      if (m.action === "cards" && typeof m.idx === "number") writeErr = { idx: m.idx, key: m.reason === "dup" ? "err_card_dup" : m.reason === "too_long" ? "err_card_long" : "err_card_link" };
      // номер карточки — с единицы, как в полях «Карточка 1…5»
      if (T("rj_" + m.reason) !== "rj_" + m.reason) toast(tpl("rj_" + m.reason, { n: typeof m.idx === "number" ? m.idx + 1 : "" }));
      screenKey = "";
      render();
      break;
    case "error":
      conn.flush(() => false, () => {});
      if (m.error === "room_expired") return onRoomGone();
      if (["room_full", "token_gone", "bad_name", "name_taken"].includes(m.error)) {
        if (m.error === "token_gone") { try { localStorage.removeItem(tokenKey()); } catch (e) {} token = null; }
        joinErr = m.error === "bad_name" ? "err_name" : "err_" + m.error;
        waitPhase = m.error === "name_taken" && m.retry === true && state ? state.phase : null;
        if (waitPhase) joinErr = "err_name_wait";
        me = null;
        renderEnter();
      }
      break;
    case "kicked":
      conn.flush(() => false, () => {});
      me = null;
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
      token = null;
      screen = "kicked";
      renderCenter("kicked_title", T("kicked_text"), `<a class="btn" href="index.html">${esc(T("btn_home"))}</a><button class="link" type="button" onclick="location.reload()">${esc(T("btn_join"))}</button>`);
      break;
    case "replaced":
      showReplaced();
      break;
  }
}

function start() {
  if (!CODE) return renderEnter();
  renderCenter("wait_title");
  const banner = document.getElementById("conn");
  let netLost = false, netQuiet = false;
  const showNet = () => {
    banner.textContent = T(netLost ? "err_connect" : "conn_lost");
    banner.classList.toggle("on", netLost || netQuiet);
  };
  window.addEventListener("langchange", showNet);
  if (window.MP && MP.draft) draft = MP.draft({ game: "ifeel", room: CODE, max: 400 });
  conn = wvConnect({
    code: CODE,
    onMessage,
    onGone: onRoomGone,
    onOpen: () => { needJoin = true; if (token && !replacedHere) conn.gated = true; },
    keep: stillWanted,
    onDrop,
    onSendFail: () => { setTimeout(() => { if (state && state.me) flushQueued(); }, 1200); },
    onState: (st) => { netLost = st === "lost"; if (st === "open") netQuiet = false; showNet(); },
    onQuiet: (q) => { netQuiet = !!q; showNet(); },
  });
  // действие помечаем фазой, в которой оно нажато: из очереди оно уйдёт только в ней
  if (sentKey) { const rawSend = conn.send; conn.send = (m) => { if (m && typeof m === "object" && !sentKey.has(m)) sentKey.set(m, phaseKey()); return rawSend(m); }; }
  acts = wvActions({
    send: (m) => conn.send(m),
    onSettle: () => { screenKey = ""; render(); },
    // ни ack, ни отказа за 7 с: снимаем «Отправляем…», игрок нажмёт снова (сервер идемпотентен по aid)
    onTimeout: (m) => { if (stillWanted(m)) toast(T("rj_timeout")); if (m.type === "pick") localPick = null; screenKey = ""; render(); if (conn) conn.probe(1500); },
  });
  requestAnimationFrame(frame);
  // ручка для стенда: состояние и отправка
  window.wvPhone = { send: (msg) => conn.send(msg), act: (msg) => act(msg), get state() { return state; }, get me() { return me; } };
}
function savedName() { try { return localStorage.getItem("ifeel-name") || ""; } catch (e) { return ""; } }
if (window.MP) {
  flow = MP.joinFlow({
    send: (m) => conn.send(m),
    buildJoin,
    onClaimPrompt: (c) => { claimPrompt = c; renderClaim(); },
    onGiveUp: () => { joinErr = "err_name_taken"; me = null; renderEnter(); },
  });
  langFollow = MP.followRoomLang({
    enabled: true,
    auto: !!(MP.rules && MP.rules.RULE_U17_LANG_FOLLOW),
    getRoomLang: () => state && state.settings && state.settings.lang,
    onSuggest: showLangHint,
  });
  tab = MP.replacedTab({
    rejoin: () => doJoin(),
    onReplaced: () => showReplaced(),
    onTokenGone: () => { try { localStorage.removeItem(tokenKey()); } catch (e) {} token = null; me = null; joinErr = null; if (savedName()) { joinName = savedName(); doJoin(); } else renderEnter(); },
  });
}
start();
</script>
