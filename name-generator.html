<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Генератор названий — имя для IT-проекта или заведения</title>
  <meta name="description" content="✏️ Рандомайзер названий с карандашным дизайном: 1000 готовых имён для стартапа, пет-проекта, кафе или бара. Жми кнопку и забирай." data-i18n-meta="meta_desc">
  <meta name="robots" content="index,follow">

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/992/992651.png" type="image/png">

  <meta name="theme-color" content="#ffffff">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --white: #fcfcfc;
      --black: #232323; /* не глухой, ближе к карандашу */
      --gray-light: #f3f3f3;
      --gray-medium: #c7c7c7;
      --gray-dark: #777777;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 0 0, rgba(0,0,0,0.04), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(0,0,0,0.04), transparent 55%),
        var(--white);
      font-family: 'Permanent Marker', 'Bangers', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(80px + var(--safe-top)) var(--safe-right) calc(20px + var(--safe-bottom)) var(--safe-left);
      position: relative;
      overflow-x: hidden;
      color: var(--black);
    }

    /* Лист в клетку легким карандашом */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(0,0,0,0.04) 27px,
          rgba(0,0,0,0.04) 28px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 27px,
          rgba(0,0,0,0.025) 27px,
          rgba(0,0,0,0.025) 28px
        );
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 1;
    }

    /* Кнопка домой */
    .home-button {
      position: fixed;
      top: calc(20px + var(--safe-top));
      left: calc(20px + var(--safe-left));
      z-index: 1000;
      padding: 10px 22px;
      background: var(--white);
      color: var(--black);
      text-decoration: none;
      font-family: 'Bangers', cursive;
      font-size: 20px;
      border-radius: 12px;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.5),
        3px 3px 0 rgba(0,0,0,0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      letter-spacing: 1px;
      text-transform: uppercase;
      transform: rotate(-2deg);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.08) 0 1px,
          transparent 1px 3px
        );
    }

    .home-button:hover {
      transform: rotate(-2deg) translate(-2px, -2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.6),
        5px 5px 0 rgba(0,0,0,0.6);
    }

    .home-button:active {
      transform: rotate(-2deg) translate(2px, 2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.6),
        1px 1px 0 rgba(0,0,0,0.6);
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1100px;
      background: var(--white);
      padding: 40px 30px;
      border-radius: 20px;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.7),
        6px 6px 0 rgba(0,0,0,0.7);
      transform: rotate(-0.8deg);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.03) 0 2px,
          transparent 2px 4px
        );
      overflow: hidden;
    }

    /* "Кривой" контур, как от руки */
    .container::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 16px;
      border: 2px dashed rgba(0,0,0,0.3);
      transform: rotate(0.8deg);
      pointer-events: none;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .settings-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .generator-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
    }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: clamp(32px, 8vw, 52px);
      color: var(--black);
      text-align: center;
      margin-bottom: 30px;
      font-weight: 400;
      letter-spacing: 2px;
      position: relative;
      text-shadow:
        0 0 1px rgba(0,0,0,0.8),
        -1px 1px 0 rgba(255,255,255,0.5);
      transform: rotate(-3deg);
      grid-column: 1 / -1;
    }

    .input-group {
      background: var(--gray-light);
      padding: 20px;
      border-radius: 15px;
      position: relative;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.4),
        4px 4px 0 rgba(0,0,0,0.4);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.02) 0 2px,
          transparent 2px 4px
        );
    }

    .input-group::after {
      content: '';
      position: absolute;
      top: 5px;
      right: 5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--black);
      background:
        radial-gradient(circle at 30% 30%, rgba(0,0,0,0.15), transparent 60%),
        var(--white);
    }

    .input-label {
      display: block;
      font-size: clamp(18px, 4.5vw, 22px);
      color: var(--black);
      margin-bottom: 15px;
      font-family: 'Bangers', cursive;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Переключатели — маленькие карандашные кнопки */
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .preset-btn {
      padding: 8px 14px;
      font-family: 'Permanent Marker', cursive;
      font-size: 15px;
      color: var(--black);
      background: var(--white);
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.4),
        2px 2px 0 rgba(0,0,0,0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.04) 0 1px,
          transparent 1px 3px
        );
    }

    .preset-btn:nth-child(1) { transform: rotate(-1.5deg); }
    .preset-btn:nth-child(2) { transform: rotate(1deg); }
    .preset-btn:nth-child(3) { transform: rotate(-0.5deg); }
    .preset-btn:nth-child(4) { transform: rotate(1.2deg); }

    .preset-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.55),
        4px 4px 0 rgba(0,0,0,0.6);
    }

    .preset-btn:active {
      transform: translate(2px, 2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.55),
        1px 1px 0 rgba(0,0,0,0.6);
    }

    .preset-btn.active {
      background: var(--black);
      color: var(--white);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(255,255,255,0.12) 0 1px,
          transparent 1px 3px
        );
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.6),
        3px 3px 0 rgba(0,0,0,0.6);
    }

    .pool-counter {
      margin-top: 14px;
      font-family: 'Permanent Marker', cursive;
      font-size: 14px;
      color: var(--gray-dark);
      letter-spacing: 0.3px;
    }

    /* Кнопка генерации */
    .generate-btn {
      padding: 18px 34px;
      font-family: 'Bangers', cursive;
      font-size: clamp(24px, 6vw, 34px);
      font-weight: 400;
      color: var(--black);
      background: var(--gray-light);
      border-radius: 14px;
      cursor: pointer;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.6),
        4px 4px 0 rgba(0,0,0,0.7);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      text-transform: uppercase;
      letter-spacing: 2px;
      transform: rotate(-1deg);
      margin-top: 26px;
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.08) 0 2px,
          transparent 2px 5px
        );
    }

    .generate-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 15px,
          rgba(0,0,0,0.08) 15px 17px
        );
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .generate-btn:hover:not(:disabled)::before {
      opacity: 1;
    }

    .generate-btn:hover:not(:disabled) {
      transform: rotate(-1deg) translate(-2px, -2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.75),
        6px 6px 0 rgba(0,0,0,0.8);
    }

    .generate-btn:active:not(:disabled) {
      transform: rotate(-1deg) translate(2px, 2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.75),
        2px 2px 0 rgba(0,0,0,0.8);
    }

    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: rotate(-1deg);
    }

    .result-container {
      text-align: center;
      min-height: 280px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--white);
      border-radius: 15px;
      padding: 25px;
      position: relative;
      border: 2px dashed var(--black);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.25);
      transform: rotate(1deg);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.02) 0 3px,
          transparent 3px 6px
        );
    }

    .result-container::before {
      content: '?';
      position: absolute;
      font-size: 110px;
      color: rgba(0,0,0,0.04);
      font-weight: 700;
      pointer-events: none;
      font-family: 'Bangers', cursive;
    }

    /* Высота всегда зарезервирована, чтобы контейнер не прыгал */
    .result-emoji {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      filter: grayscale(1);
      opacity: 0;
      position: relative;
      z-index: 2;
    }

    .result-emoji.show {
      animation: emojiIn 0.4s ease-out forwards;
    }

    @keyframes emojiIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* === Сцена с названием === */
    .result-stage {
      position: relative;
      width: 100%;
      z-index: 2;
      --name-h: clamp(54px, 13vw, 74px);
    }

    .name-line {
      position: relative;
      width: 100%;
      height: var(--name-h);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rubik', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: clamp(26px, 6.5vw, 44px);
      font-weight: 500;
      letter-spacing: 0.5px;
      line-height: 1.15;
      color: var(--black);
      text-shadow:
        0 0 1px rgba(0,0,0,0.6),
        -1px 1px 0 rgba(255,255,255,0.6);
      opacity: 0;
    }

    .name-line.shown { opacity: 1; }

    .name-inner {
      display: inline-block;
      white-space: pre;
      transform-origin: center center;
    }

    .ltr { display: inline-block; }

    /* черканье карандашом, пока идёт "раздумье" */
    .scribble-svg {
      position: absolute;
      pointer-events: none;
      overflow: visible;
      opacity: 0;
    }

    .scribble-svg.show { opacity: 1; }

    .scribble-svg path {
      fill: none;
      stroke: var(--black);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.5;
    }

    /* Обводка карандашом вокруг победителя */
    .circle-svg {
      position: absolute;
      pointer-events: none;
      overflow: visible;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .circle-svg.show { opacity: 1; }

    .circle-svg path {
      fill: none;
      stroke: var(--black);
      stroke-width: 2.4;
      stroke-linecap: round;
      opacity: 0.7;
    }

    /* Иконка "скопировать" рядом с названием */
    .copy-icon {
      position: absolute;
      top: 50%;
      left: 0;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: 10px;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.35),
        2px 2px 0 rgba(0,0,0,0.45);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) rotate(2deg);
      transition: opacity 0.25s ease, transform 0.15s ease, background 0.2s ease;
    }

    .copy-icon.show {
      opacity: 1;
      pointer-events: auto;
    }

    .copy-icon:hover {
      transform: translateY(-50%) rotate(2deg) translate(-1px, -1px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.5),
        4px 4px 0 rgba(0,0,0,0.5);
    }

    .copy-icon:active {
      transform: translateY(-50%) rotate(2deg) translate(2px, 2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.5),
        1px 1px 0 rgba(0,0,0,0.5);
    }

    .copy-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--black);
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .copy-icon.copied {
      background: var(--black);
    }

    .copy-icon.copied svg { stroke: var(--white); }

    /* лёгкий "стук" листа в момент остановки */
    .result-container.thud {
      animation: thud 0.35s ease-out;
    }

    @keyframes thud {
      0% { transform: rotate(1deg) scale(1); }
      40% { transform: rotate(1.5deg) scale(1.015); }
      100% { transform: rotate(1deg) scale(1); }
    }

    .result-hint {
      margin-top: 14px;
      min-height: 22px;
      font-size: 15px;
      color: var(--gray-dark);
      font-family: 'Permanent Marker', cursive;
      position: relative;
      z-index: 2;
    }

    .error-message {
      color: var(--black);
      background: var(--white);
      border-radius: 8px;
      font-size: 15px;
      margin-top: 15px;
      text-align: center;
      font-family: 'Permanent Marker', cursive;
      opacity: 0;
      transition: opacity 0.3s ease;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.4),
        3px 3px 0 rgba(0,0,0,0.5);
      transform: rotate(-1deg);
      padding: 8px 12px;
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.02) 0 2px,
          transparent 2px 4px
        );
    }

    .error-message.show {
      opacity: 1;
      animation: wiggle 0.5s ease;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-1deg); }
      25% { transform: rotate(-3deg); }
      75% { transform: rotate(1deg); }
    }

    /* Декоративные звездочки */
    .star-decoration {
      position: absolute;
      font-size: 22px;
      opacity: 0.22;
      pointer-events: none;
      font-family: 'Bangers', cursive;
      color: var(--black);
    }

    .star-decoration:nth-child(1) { top: 10px; right: 16px; transform: rotate(9deg); }
    .star-decoration:nth-child(2) { top: 50%; left: -6px; transform: rotate(-18deg); }
    .star-decoration:nth-child(3) { bottom: 15px; right: -4px; transform: rotate(27deg); }

    /* Карандашные декорации */
    .pencil-decoration {
      position: fixed;
      pointer-events: none;
      opacity: 0.16;
      z-index: 0;
      font-size: 72px;
      filter: grayscale(1);
      color: var(--black);
    }

    /* ===== РЯД 1 — ВЕРХНИЙ ===== */
    .pencil-1 { top: 7%; left: 9%; transform: rotate(-20deg); }
    .pencil-2 { top: 3%; left: 45%; transform: rotate(12deg); }
    .pencil-3 { top: 5%; right: 8%; transform: rotate(160deg); }

    /* ===== РЯД 2 — СРЕДНИЙ ===== */
    .pencil-4 { top: 45%; left: 10%; transform: rotate(95deg); }
    .pencil-5 { top: 50%; left: 48%; transform: rotate(-35deg); }
    .pencil-6 { top: 40%; right: 10%; transform: rotate(-10deg); }

    /* ===== РЯД 3 — НИЖНИЙ ===== */
    .pencil-7 { bottom: 20%; left: 12%; transform: rotate(110deg); }
    .pencil-8 { bottom: 4%; left: 50%; transform: rotate(270deg); }
    .pencil-9 { bottom: 5%; right: 12%; transform: rotate(10deg); }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: calc(80px + var(--safe-top)) 12px calc(20px + var(--safe-bottom)) 12px;
      }

      .home-button {
        position: absolute;
        font-size: 18px;
        padding: 8px 18px;
      }

      .container {
        padding: 28px 18px;
        transform: rotate(-0.4deg);
      }

      .main-layout {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .generator-column {
        min-height: auto;
      }

      .generate-btn {
        width: 100%;
        margin-top: 20px;
        padding: 16px 24px;
      }

      .result-container {
        min-height: 220px;
      }

      .pencil-decoration {
        font-size: 56px;
        opacity: 0.18;
      }

      /* часть карандашей убираем, чтобы не перегружать фон */
      .pencil-3,
      .pencil-4,
      .pencil-5,
      .pencil-6,
      .pencil-7,
      .pencil-8,
      .pencil-9 {
        display: none;
      }

      /* 👉 мобильный шрифт (iPhone fix) */
      body,
      h1,
      .input-label,
      .preset-btn,
      .generate-btn,
      .name-line,
      .result-hint,
      .pool-counter,
      .error-message,
      .home-button {
        font-family: 'Rubik', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      }
    }

    @media (max-width: 360px) {
      .input-group {
        padding: 15px;
      }

      .preset-btn {
        font-size: 14px;
        padding: 7px 12px;
      }
    }

    @media (hover: none) {
      .generate-btn:hover {
        transform: rotate(-1deg) !important;
      }
    }
  </style>

</head>
<body>
  <a href="/" class="home-button" data-i18n="home">Главная</a>

  <!-- фоновые карандашные декорации -->
  <div class="pencil-decoration pencil-1">💡</div>
  <div class="pencil-decoration pencil-2">✎</div>
  <div class="pencil-decoration pencil-3">🏷️</div>
  <div class="pencil-decoration pencil-4">💻</div>
  <div class="pencil-decoration pencil-5">✏</div>
  <div class="pencil-decoration pencil-6">☕</div>
  <div class="pencil-decoration pencil-7">🚀</div>
  <div class="pencil-decoration pencil-8">✏</div>
  <div class="pencil-decoration pencil-9">🍸</div>

  <div class="container">
    <div class="star-decoration">✶</div>
    <div class="star-decoration">✶</div>
    <div class="star-decoration">✶</div>

    <h1 data-i18n="h1">Генератор названий</h1>

    <div class="main-layout">
      <div class="settings-column">
        <div class="input-group">
          <span class="input-label" data-i18n="label_kind">Что придумываем?</span>
          <div class="presets" id="kindGroup">
            <button class="preset-btn active" data-kind="all" data-i18n="kind_all">Всё подряд</button>
            <button class="preset-btn" data-kind="it" data-i18n="kind_it">IT-проект</button>
            <button class="preset-btn" data-kind="venue" data-i18n="kind_venue">Заведение</button>
          </div>
        </div>

        <div class="input-group">

      const scripts = script === 'any' ? ['latin', 'cyr'] : [script];
      const pool = [];
      kinds.forEach(k => scripts.forEach(s => {

      }));
      return pool;

    // Название собираем по буквам, чтобы «писать» его карандашом
    function renderName(name) {
      const inner = document.createElement('span');
      inner.className = 'name-inner';
      for (const ch of name) {
        const letter = document.createElement('span');
        letter.className = 'ltr';
        letter.textContent = ch;
        inner.appendChild(letter);
      }
      nameLine.innerHTML = '';
      nameLine.appendChild(inner);
      fitName();
      return inner;
    }

    // длинные названия ужимаем, чтобы не вылезали за края листа
    function fitName() {
      const inner = nameLine.firstElementChild;
      if (!inner) return 1;
      inner.style.transform = '';
      const max = stage.offsetWidth - 10;
      const w = inner.offsetWidth;
      const k = w > max ? max / w : 1;
      inner.dataset.scale = k;
      if (k < 1) inner.style.transform = 'scale(' + k.toFixed(3) + ')';
      return k;
    }

    function writeLetters(inner) {
      const letters = inner.querySelectorAll('.ltr');
      if (!letters.length || !letters[0].animate) return 0;
      letters.forEach((el, i) => {
        el.animate(
          [
            { opacity: 0, transform: 'translateY(7px) rotate(-9deg)' },
            { opacity: 1, transform: 'translateY(0) rotate(0deg)' }
          ],
          { duration: LETTER_MS, delay: i * LETTER_STEP, easing: 'cubic-bezier(0.2, 0.9, 0.3, 1.4)', fill: 'backwards' }
        );
      });
      return (letters.length - 1) * LETTER_STEP + LETTER_MS;
    }

    // Черканье карандашом: резкая штриховка туда-обратно в три прохода
    function scribbleData(w, h) {
      const cy = h / 2;
      const amp = h / 2 - 5;
      const n = 9;
      const pts = [];
      for (let pass = 0; pass < 3; pass++) {
        const drift = (pass - 1) * 4;
        for (let i = 0; i <= n; i++) {
          const step = pass % 2 === 0 ? i : n - i;
          const x = (w / n) * step + (Math.random() - 0.5) * 6;
          const dir = (i + pass) % 2 === 0 ? -1 : 1;
          const y = cy + drift + dir * amp * (0.72 + Math.random() * 0.28);
          pts.push([x, y]);
        }
      }
      let d = 'M ' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
      for (let i = 1; i < pts.length; i++) {
        const prev = pts[i - 1], cur = pts[i];
        // короткая дуга с заносом — так штрих выглядит нарисованным от руки
        const cx = prev[0] + (cur[0] - prev[0]) * 0.62 + (Math.random() - 0.5) * 5;
        d += ' Q ' + cx.toFixed(1) + ' ' + cur[1].toFixed(1) + ', ' +
             cur[0].toFixed(1) + ' ' + cur[1].toFixed(1);
      }
      return d;
    }

    function drawScribble() {
      const w = Math.min(stage.offsetWidth * 0.66, 280);
      const h = Math.min(stage.offsetHeight - 8, 54);
      scribbleSvg.setAttribute('width', w);
      scribbleSvg.setAttribute('height', h);
      scribbleSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      scribbleSvg.style.left = ((stage.offsetWidth - w) / 2) + 'px';
      scribbleSvg.style.top = ((stage.offsetHeight - h) / 2) + 'px';
      scribblePath.setAttribute('d', scribbleData(w, h));

      const len = scribblePath.getTotalLength();
      scribblePath.style.strokeDasharray = len;
      scribblePath.style.strokeDashoffset = 0;
      scribbleSvg.classList.add('show');
      if (scribblePath.animate) {
        scribblePath.animate(
          [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
          { duration: SCRIBBLE_MS, easing: 'linear' }
        );
      }
    }

    function hideScribble() {
      if (scribbleSvg.animate) {
        scribbleSvg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-out' });
      }
      scribbleSvg.classList.remove('show');
    }

    // «от руки» нарисованный овал: дуги с дрожанием и небольшим перехлёстом
    function ellipsePath(w, h) {
      const cx = w / 2, cy = h / 2;
      const rx = w / 2 - 3, ry = h / 2 - 3;
      const j = (a) => (Math.random() - 0.5) * a;
      return [
        'M', (cx + rx + j(2)), (cy + ry * 0.1 + j(3)),
        'C', (cx + rx + j(3)), (cy - ry * 0.72), (cx + rx * 0.62), (cy - ry + j(3)), (cx + j(6)), (cy - ry + j(2)),
        'C', (cx - rx * 0.66), (cy - ry + j(3)), (cx - rx + j(3)), (cy - ry * 0.62), (cx - rx + j(2)), (cy + j(4)),
        'C', (cx - rx + j(3)), (cy + ry * 0.68), (cx - rx * 0.6), (cy + ry + j(3)), (cx + j(6)), (cy + ry + j(2)),
        'C', (cx + rx * 0.72), (cy + ry + j(3)), (cx + rx + j(3)), (cy + ry * 0.55), (cx + rx * 0.99 + j(2)), (cy - ry * 0.28 + j(3))
      ].map(v => typeof v === 'number' ? v.toFixed(1) : v).join(' ');
    }

    // Контейнеры повёрнуты, поэтому считаем всё в layout-координатах
    // (offset*), а не через getBoundingClientRect — тот отдаёт bbox поворота.
    function markWinner(animate) {
      const inner = nameLine.firstElementChild;
      if (!inner) return;
      const k = parseFloat(inner.dataset.scale || '1') || 1;
      const textW = inner.offsetWidth * k;
      const textH = inner.offsetHeight * k;
      const stageW = stage.offsetWidth;
      const cx = stageW / 2;
      const cy = stage.offsetHeight / 2;

      // обводка
      const w = Math.min(textW + 36, stageW);
      const h = textH + 20;
      circleSvg.setAttribute('width', w);
      circleSvg.setAttribute('height', h);
      circleSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      circleSvg.style.left = (cx - w / 2) + 'px';
      circleSvg.style.top = (cy - h / 2) + 'px';
      circlePath.setAttribute('d', ellipsePath(w, h));

      const len = circlePath.getTotalLength();
      circlePath.style.strokeDasharray = len;
      circlePath.style.strokeDashoffset = 0;
      circleSvg.classList.add('show');
      if (animate && circlePath.animate) {
        circlePath.animate(
          [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
          { duration: 600, easing: 'ease-out' }
        );
      }

      // иконка копирования — сразу за обводкой, вплотную к названию
      const iconW = copyBtn.offsetWidth || 36;
      const left = Math.max(0, Math.min(cx + w / 2 + 8, stageW - iconW));
      copyBtn.style.left = left + 'px';
      copyBtn.style.top = cy + 'px';
      copyBtn.classList.add('show');
    }

    async function pickName() {
      if (isPicking) return;

      const pool = buildPool();
      if (!pool.length) {
        showError(I18N.t('err_empty'));
        return;
      }

      let fresh = pool.filter(item => !used.has(item.name));
      let looped = false;
      if (!fresh.length) {
        used = new Set();
        fresh = pool;
        looped = true;
      }

      isPicking = true;
      pickBtn.disabled = true;
      resetStage();
      resultHint.textContent = '';

      const choice = randomOf(fresh);
      used.add(choice.name);
      lastName = choice.name;

      // имя уже в разметке, но строка скрыта — до конца анимации ничего не видно
      const inner = renderName(choice.name);
      const animate = !reduceMotion.matches;

      if (animate) {
        drawScribble();
        await wait(SCRIBBLE_MS);
        hideScribble();
      }

      nameLine.classList.add('shown');
      const writeMs = animate ? writeLetters(inner) : 0;

      resultContainer.classList.add('thud');
      setTimeout(() => resultContainer.classList.remove('thud'), 400);

      if (writeMs) await wait(writeMs);

      markWinner(animate);
      resultEmoji.textContent = randomOf(EMOJIS);
      resultEmoji.classList.add('show');
      resultHint.textContent = looped
        ? I18N.t('hint_loop')
        : I18N.t(choice.kind === 'it' ? 'hint_it' : 'hint_venue');
      updateCounter();

      pickBtn.disabled = false;
      isPicking = false;
    }

    async function copyName() {
      if (!lastName) return;
      try {
        await navigator.clipboard.writeText(lastName);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = lastName;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (err) { /* ничего не поделать */ }
        document.body.removeChild(ta);
      }
      copyBtn.innerHTML = ICON_DONE;
      copyBtn.classList.add('copied');
      copyBtn.setAttribute('title', I18N.t('copied'));
      copyBtn.setAttribute('aria-label', I18N.t('copied'));
      setTimeout(() => {
        copyBtn.innerHTML = ICON_COPY;
        copyBtn.classList.remove('copied');
        copyBtn.setAttribute('title', I18N.t('copy_btn'));
        copyBtn.setAttribute('aria-label', I18N.t('copy_btn'));
      }, 1500);
    }

    // при смене размеров пересобираем позиции обводки и иконки
    let resizeTimer;
    window.addEventListener('resize', () => {
      if (isPicking || !lastName) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        fitName();
        markWinner(false);
      }, 150);
    });

    pickBtn.addEventListener('click', pickName);
    copyBtn.addEventListener('click', copyName);

    window.addEventListener('langchange', () => {
      // для не-русского интерфейса по умолчанию показываем латиницу
      if (!userTouchedScript) {
        const next = I18N.lang === 'ru' ? 'any' : 'latin';
        if (next !== script) {
          script = next;
          setActive(document.getElementById('scriptGroup'), 'script', script);
          used = new Set();
        }
      }
      if (!lastName) resultHint.textContent = I18N.t('hint_start');
      updateCounter();
    });

    updateCounter();
  </script>
