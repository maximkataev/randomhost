<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4a3.svg" type="image/svg+xml">
<title>Бомба — общий экран</title>
<!-- доска ведущего с кодом комнаты: в поиске ей делать нечего -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:ital,wght@0,500;0,700;0,900;1,900&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:ital,wght@0,500;0,700;0,900;1,900&display=swap" rel="stylesheet"></noscript>
<style>
  /* Мир: дневной ретро-комикс (bomb-spec.md §9). Кремовая бумага с растром, толстый чёрный контур,
     плоские печатные цвета, жёсткая тень-«сдвиг печати». Соседи — аукцион и рулетка — тёмные и вечерние;
     здесь светло, всё пружинит, а бомба — классический чёрный шар с фитилём. */
  :root {
    --paper: #fbf1d9;
    --paper-2: #f3e2b8;
    --paper-3: #ead198;
    --ink: #16120c;
    --ink-2: #4a3f2e;
    --muted: #7a6a4f;
    --red: #e8322b;
    --red-ink: #b31d17;
    --yellow: #ffc21a;
    --blue: #1e6fd9;
    --green: #16924a;
    --line: 3px solid var(--ink);
    --shift: 4px 4px 0 var(--ink);
    --font: "Fira Sans Extra Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --spring: cubic-bezier(.3, 1.6, .5, 1);
    --lang-switch-bg: var(--paper);
    --lang-switch-border: var(--ink);
    --lang-switch-fg: var(--ink);
    --lang-switch-active-bg: var(--ink);
    --lang-switch-active-fg: var(--paper);
    --lang-switch-active-border: var(--ink);
    --lang-switch-font: var(--font);
    --vh: 1vh; --vw: 1vw; /* под zoom единицы окна не делятся на масштаб сами — делим вручную */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* ТВ и проектор от Full HD: доска свёрстана под ~1500×850 CSS-пикселей, на 4K и в Full HD текст был мелким для дивана.
     Масштаб выставляет fitScreen() через --z, высота делится на тот же множитель, чтобы доска влезала в экран (как у аукциона) */
  body.scaled { --vh: calc(1vh / var(--z)); --vw: calc(1vw / var(--z)); zoom: var(--z); height: calc(100vh / var(--z)); height: calc(100dvh / var(--z)); }
  body {
    background: radial-gradient(rgba(22, 18, 12, .09) 1.1px, transparent 1.7px) 0 0 / 11px 11px, var(--paper);
    color: var(--ink);
    font: 500 18px/1.25 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- верхняя полоса ---------- */
  .top { position: fixed; top: 0; right: 0; bottom: auto; left: 0; height: max(64px, calc(var(--lsc, 32px) * 2)); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 0 var(--lsw, 170px) 0 20px; z-index: 5; } /* справа — место под переключатель языка (--lsw меряет bomb-shared.js) */
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand a { color: var(--ink-2); text-decoration: none; font-weight: 700; font-size: 16px; white-space: nowrap; }
  .logo { font: italic 900 38px/1 var(--font); letter-spacing: .01em; text-transform: uppercase; color: var(--red); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink); white-space: nowrap; }
  .seal { justify-self: center; display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; height: 40px; padding: 0 14px; background: var(--paper); border: var(--line); box-shadow: var(--shift); visibility: hidden; }
  .seal.on { visibility: visible; }
  .seal .k { font-weight: 900; text-transform: uppercase; font-size: 15px; white-space: nowrap; }
  .seal button { border: 0; background: none; padding: 0; font: 600 15px/1 var(--mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 10px; }
  .code-chip { font: 900 22px/1 var(--font); letter-spacing: .06em; padding: 6px 10px; border: var(--line); background: var(--yellow); box-shadow: var(--shift); white-space: nowrap; }
  /* звук — «таблетка» как переключатель языка, той же высоты */
  .sound-toggle-btn { flex: none; width: calc(var(--lsh, 44px) * 1.25); height: var(--lsh, 44px); border: 1px solid var(--ink); border-radius: 999px; background: var(--paper); box-shadow: 0 4px 14px rgba(22, 18, 12, .12); font-size: 17px; display: grid; place-items: center; padding: 0; }

  /* ---------- сцена ---------- */
  main { position: fixed; top: max(64px, calc(var(--lsc, 32px) * 2)); right: 0; bottom: 0; left: 0; }
  .conn { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); z-index: 30; background: var(--red); color: #fff; font-weight: 700; padding: 6px 14px; border: var(--line); visibility: hidden; }
  .conn.on { visibility: visible; }

  /* лобби: участники слева (правило владельца), вход и настройки справа */
  .lobby { position: absolute; top: 12px; right: 20px; bottom: 20px; left: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, clamp(460px, calc(27 * var(--vw)), 600px)); gap: 24px; }
  .panel { background: var(--paper); border: var(--line); box-shadow: 6px 6px 0 var(--ink); min-height: 0; }
  .who { display: flex; flex-direction: column; padding: 18px 20px; overflow: hidden; }
  .who h2 { margin: 0 0 12px; font: 900 30px/1 var(--font); text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .who h2 span { font-size: 20px; color: var(--ink-2); }
  .seats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-content: start; flex: none; }
  .howto { flex: none; height: clamp(150px, calc(22 * var(--vh)), 260px); margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .howto div { border: var(--line); background: #fff; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 8px 12px; font-size: clamp(17px, calc(2.4 * var(--vh)), 32px); font-weight: 700; line-height: 1.15; }
  .howto div:nth-child(2) { background: var(--yellow); }
  .howto div:nth-child(3) { background: var(--red); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .howto i { font-style: normal; font-size: clamp(32px, calc(5 * var(--vh)), 72px); line-height: 1; }
  .seat { display: flex; align-items: center; gap: 10px; height: clamp(52px, calc(6.2 * var(--vh)), 78px); padding: 0 10px; border: var(--line); background: #fff; position: relative; }
  .seat.new { animation: drop .45s var(--spring); }
  .seat.empty { border-style: dashed; background: transparent; color: var(--muted); border-color: rgba(22, 18, 12, .35); }
  /* ✕ — цель не меньше 36×36 (было 30×22); второй тап подтверждает (T-W3-14, bomb-008) */
  .seat .x { margin-left: auto; flex: none; border: 0; background: none; font-size: 20px; line-height: 1; color: var(--muted); padding: 0 6px; min-width: 36px; min-height: 36px; }
  .seat .x[data-armed="1"] { background: var(--red); color: #fff; font-weight: 700; font-size: 16px; padding: 0 10px; border: 2px solid var(--ink); white-space: nowrap; }
  .av { flex: none; width: 32px; height: 32px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--pc, #ccc); display: grid; place-items: center; font: 900 14px/1 var(--font); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .seat b { font-weight: 700; font-size: clamp(20px, calc(2.3 * var(--vh)), 30px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .seat .off { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .side { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px 0; overflow: auto; }
  /* QR растёт с высотой экрана: на 1080p при zoom ≈ 215 px (было 136 css = 175 px) */
  .join { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
  #qr { --qrs: clamp(136px, calc(17.5 * var(--vh)), 260px); width: var(--qrs); height: var(--qrs); background: #fff; border: var(--line); padding: 6px; }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; }
  .bigcode { font: 900 var(--code-fs, 64px)/1 var(--font); letter-spacing: .04em; white-space: nowrap; overflow: hidden; }
  .url { font: 600 clamp(16px, calc(2 * var(--vh)), 26px)/1.2 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
  .scan { font-size: clamp(16px, calc(1.7 * var(--vh)), 22px); color: var(--ink-2); margin-top: 6px; }
  .opt { display: grid; gap: 6px; }
  .opt .k { font-weight: 900; text-transform: uppercase; font-size: clamp(15px, calc(2 * var(--vh)), 24px); letter-spacing: .04em; color: var(--ink-2); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 2.5px solid var(--ink); background: #fff; padding: 6px 10px; font-weight: 700; font-size: clamp(18px, calc(2.2 * var(--vh)), 28px); line-height: 1.1; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .opt .d { font-size: clamp(16px, calc(2.1 * var(--vh)), 26px); color: var(--ink-2); min-height: 1.2em; }
  .startbox { position: sticky; bottom: 0; margin-top: auto; background: var(--paper); padding: 8px 0 16px; display: grid; gap: 6px; }
  .start { border: var(--line); background: var(--red); color: #fff; font: italic 900 30px/1 var(--font); text-transform: uppercase; padding: 14px 18px; box-shadow: 6px 6px 0 var(--ink); letter-spacing: .02em; text-shadow: 2px 2px 0 var(--ink); }
  .start:not(:disabled):active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--ink); }
  .fine { font-size: clamp(16px, calc(2 * var(--vh)), 24px); color: var(--ink-2); min-height: 1.25em; }

  /* ---------- арена: игроки кольцом, бомба летает между ними ---------- */
  .arena { position: absolute; top: 8px; right: 16px; bottom: 16px; left: 16px; overflow: hidden; overflow: clip; } /* hidden — для старого Chromium (<90) на проекторах, где clip не знают */
  .pc { position: absolute; left: 0; top: 0; width: var(--cw, 190px); height: 58px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: var(--line); background: #fff; box-shadow: var(--shift); transition: transform .5s var(--spring), background .2s, opacity .3s; will-change: transform; }
  .pc b { font-weight: 700; font-size: 21px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .pc .st { font-size: 15px; font-weight: 700; white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  /* узкие карточки: аватарка (инициал дублирует имя) уступает место имени */
  .arena.tight .pc .av { display: none; }
  .arena.tight .pc { padding: 0 8px; }
  .arena.tight .pc b { font-size: 19px; }
  .pc.hold { background: var(--yellow); }
  .pc.hot { background: var(--red); color: #fff; }
  .pc.hot .st { color: #fff; }
  .pc.out { opacity: .38; background: var(--paper-2); box-shadow: none; }
  .pc.off b::after { content: " ·"; color: var(--muted); }
  .pc.victim { background: var(--ink); color: var(--paper); }
  .pc.victim .st { color: var(--yellow); }
  .bombwrap { position: absolute; left: 0; top: 0; width: 110px; height: 110px; margin: -55px 0 0 -55px; z-index: 4; pointer-events: none; will-change: transform; }
  .bombwrap .shake { width: 100%; height: 100%; animation: shake calc(.5s - var(--heat, 0) * .42s) linear infinite; }
  .bomb { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(4px 5px 0 rgba(22, 18, 12, .35)); }
  .bomb .spark { animation: spark .18s steps(2) infinite; transform-box: fill-box; }
  .bombwrap.gone { visibility: hidden; }

  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: var(--cenw, min(56%, 760px)); display: grid; justify-items: center; text-align: center; gap: 10px; z-index: 3; }
  .center .lbl { font: 900 18px/1 var(--font); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); height: 18px; }
  .holder { font: italic 900 var(--hfs, 84px)/1 var(--font); text-transform: uppercase; height: 96px; display: flex; align-items: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-text-stroke: 2px var(--ink); color: var(--hc, var(--red)); text-shadow: 4px 4px 0 var(--ink); padding: 8px 6px 0; }
  .doing { font-size: 24px; font-weight: 700; height: 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  /* вопрос держателя крупно — чтобы зал подсказывал (§5.3); место под него зарезервировано всегда */
  .bubble { position: relative; width: 100%; height: 132px; background: #fff; border: var(--line); box-shadow: var(--shift); border-radius: 18px; display: grid; place-items: center; padding: 10px 18px; overflow: hidden; }
  .bubble .q { font-weight: 900; font-size: 30px; line-height: 1.1; }
  .bubble .q.crowdcode { font-size: 44px; }
  .bubble .opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 8px; font-size: 20px; font-weight: 700; color: var(--ink-2); }
  .bubble .opts span::before { content: "▸ "; color: var(--red); }
  .bubble .meta { display: flex; gap: 28px; font-size: 22px; font-weight: 700; }
  .bubble .meta b { display: block; font: 900 44px/1 var(--font); font-variant-numeric: tabular-nums; }
  .danger { font: italic 900 26px/1 var(--font); text-transform: uppercase; color: var(--red); height: 30px; visibility: hidden; letter-spacing: .02em; }
  body.hot .danger { visibility: visible; animation: blink .7s steps(2) infinite; }
  body.hot main::before { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(232, 50, 43, .09); animation: pulse 1.1s ease-in-out infinite; pointer-events: none; }
  /* «Остановить раунд» живёт в шапке рядом с кодом: внизу арены она закрывала карточку игрока в углу */
  .hostbar { display: flex; gap: 8px; }
  .hostbar { align-items: center; }
  .hostbar .linkbtn { min-height: 44px; min-width: 44px; }
  .hostbar input { font: 700 16px/1 var(--font); border: var(--line); background: #fff; color: var(--ink); padding: 6px 8px; min-height: 44px; width: 190px; min-width: 0; border-radius: 0; }
  .hostbar .note { font-size: 14px; font-weight: 700; max-width: 240px; }
  .gonebox { display: grid; gap: 10px; justify-items: center; }
  .gonebox .t { font-size: 28px; font-weight: 900; }
  .gonebox form { display: flex; gap: 8px; }
  .gonebox input { font: 700 22px/1 var(--font); border: var(--line); background: #fff; color: var(--ink); padding: 8px 10px; min-height: 44px; width: 180px; text-transform: uppercase; border-radius: 0; }
  .gonebox button { border: var(--line); background: var(--paper); font-weight: 700; padding: 6px 14px; min-height: 44px; box-shadow: var(--shift); font-size: 18px; }
  @media (max-width: 640px) { .hostbar .lt { display: none; } .hostbar .note { display: none; } }
  /* ТВ 1024: подпись «Ссылка ведущего» съедала шапку (печать раунда сжималась до «СФРАГ…», T-W3-32) — остаётся 🔑 */
  @media (max-width: 1100px) { .hostbar .lt { display: none; } }
  .hostbar button { border: var(--line); background: var(--paper); font-weight: 700; padding: 6px 12px; box-shadow: var(--shift); font-size: 16px; white-space: nowrap; }

  /* отсчёт: печать на весь центр */
  .sealcard { background: #fff; border: var(--line); box-shadow: 6px 6px 0 var(--ink); padding: 16px 22px; display: grid; gap: 6px; justify-items: center; width: 100%; }
  .sealcard .t { font: 900 22px/1 var(--font); text-transform: uppercase; letter-spacing: .06em; }
  .sealcard .h { font: 700 22px/1.1 var(--mono); word-break: break-all; }
  .sealcard .s { font-size: 18px; color: var(--ink-2); }
  .count { font: italic 900 150px/1 var(--font); color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 6px 6px 0 var(--ink); height: 150px; }
  .count.pop { animation: pop .5s var(--spring); }

  /* взрыв */
  .flash { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; pointer-events: none; background: #fff; opacity: 0; }
  .flash.on { animation: flash 1.1s ease-out forwards; }
  .kapow { position: absolute; z-index: 21; width: 380px; height: 300px; margin: -150px 0 0 -190px; display: grid; place-items: center; pointer-events: none; visibility: hidden; }
  /* звезда живёт ~1,6 с: 1,2 с вылет и выдержка, дальше растворяется — дольше она закрывала имя проигравшего */
  .kapow.on { visibility: visible; animation: kapow 1.2s var(--spring) both, kapowout .35s ease-in 1.25s forwards; }
  @keyframes kapowout { to { opacity: 0; } }
  .kapow svg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; }
  .kapow span { position: relative; font: italic 900 96px/1 var(--font); color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 5px 5px 0 var(--ink); transform: rotate(-8deg); }
  body.shaking main { animation: bigshake .6s linear; }
  .float { position: absolute; z-index: 8; font-size: 40px; pointer-events: none; animation: floatup 1.6s ease-out forwards; }

  /* итоги поверх арены */
  body[data-phase="finished"] .center, body[data-phase="finished"] .bombwrap { visibility: hidden; }
  .result { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; z-index: 10; background: rgba(251, 241, 217, .72); }
  /* карточка не прокручивается целиком: листаются только печати (при длинной партии их десятки), вердикт и кнопки всегда на виду */
  .rcard { width: min(880px, calc(100% - 32px)); max-height: calc(100% - 24px); overflow: hidden; background: var(--paper); border: var(--line); box-shadow: 8px 8px 0 var(--ink); padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; text-align: center; animation: drop .5s var(--spring); }
  .rcard > * { flex: none; }
  .rcard > .seals { flex: 1 1 auto; min-height: 96px; overflow: auto; align-content: start; }
  .verdict { display: grid; gap: 4px; }
  .verdict .k { font: 900 20px/1 var(--font); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
  .verdict .n { font: italic 900 clamp(48px, calc(8 * var(--vh)), 96px)/1 var(--font); text-transform: uppercase; color: var(--vc, var(--red)); -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 10px 8px 6px; }
  .verdict .sub { font-size: 20px; font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } } /* 3+1 с сиротой внизу выглядело кривовато */
  .stat { border: 2.5px solid var(--ink); background: #fff; padding: 8px 10px; text-align: center; }
  .stat .k { font-size: 14px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .03em; }
  .stat .v { font-size: 22px; font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; } /* имя + «· 2 раза» переносится, а не обрезается многоточием (T-W3-32) */
  .seals { display: grid; gap: 8px; }
  .sealrow { border: 2.5px solid var(--ink); background: #fff; padding: 8px 12px; display: grid; gap: 4px; text-align: left; }
  .sealrow .top2 { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
  .sealrow .ok { color: var(--green); font-weight: 900; }
  .sealrow .bad { color: var(--red); font-weight: 900; }
  .sealrow code { font: 13px/1.3 var(--mono); word-break: break-all; color: var(--ink-2); user-select: all; }
  .rbtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .rbtns button { border: var(--line); background: var(--paper); font: 900 22px/1 var(--font); text-transform: uppercase; padding: 12px 18px; box-shadow: var(--shift); }
  .rbtns button.main { background: var(--red); color: #fff; text-shadow: 2px 2px 0 var(--ink); }
  .banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 26px; font-weight: 700; text-align: center; background: var(--paper); border: var(--line); box-shadow: var(--shift); padding: 16px 22px; max-width: calc(100% - 32px); }

  @keyframes drop { from { transform: translateY(-14px) scale(.96); } }

    kick: `Αφαίρεση`, kick_sure: `Αφαίρεση;`, end_sure: `Σίγουρα;`, offline: `εκτός σύνδεσης`, nolink: `χωρίς σύνδεση`, doing_off: `{name} χωρίς σύνδεση…`, //EL:unverified
    now_holds: `Την κρατά τώρα`, now_hold2: `Την κρατούν`,
    doing: `{name} {what}…`, armed: `{name} διαλέγει σε ποιον θα την πετάξει!`, fresh: `{name} πήρε τη βόμβα!`,
    danger: `Μπορεί να σκάσει ανά πάσα στιγμή`,
    burning: `Καίει`, passes: `Πάσες`, in_hands: `Στα χέρια`, burned: `Έκαιγε`, fuse_was: `Το φιτίλι ήταν`,
    get_ready: `Ανάβουμε σε`,
    seal_full: `πάτα για ολόκληρη`,
    boom: `ΜΠΟΥΜ!`,
    loser: `Κακή τύχη`, winner: `Ο τελευταίος όρθιος`, boom_line: `Έσκασε στα χέρια του/της`, out_line: `Εκτός παιχνιδιού`,
    boom_at: `Κακή τύχη`,
    out_mark: `εκτός`,
    st_longest: `Την κράτησε περισσότερο`, st_mostgot: `Την πήρε πιο συχνά`, st_fastest: `Πιο γρήγορη πάσα`, st_passes: `Πάσες στον γύρο`,
    st_times1: `{n} φορά`, st_times: `{n} φορές`, st_times5: `{n} φορές`, st_none: `—`,
    fin_few: `Ο γύρος σταμάτησε: έμειναν λιγότεροι από δύο παίκτες`,
    fin_host: `Ο γύρος σταμάτησε από τον οικοδεσπότη`,
    out_order: `Σειρά αποκλεισμού`,
    seals_title: `Σφραγίδες`, seal_round: `Γύρος {n}`, seal_bomb: `βόμβα {n}`,
    round_n: `Γύρος {n}`,
    wait_host: `Περιμένουμε τον οικοδεσπότη`,
    wheel_left: `απομένουν {n}`,
  },
};
</script>
<script src="bomb-shared.js"></script>
<script src="i18n.js"></script>
<script src="sound-toggle.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
const T = (k) => bmT(k);
const tpl = (k, v) => bmTpl(k, v);
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const hostKey = () => "bomb-host-" + CODE;
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

let conn = null, state = null, isHost = false, dead = false, prev = null;

const player = (id) => state && state.players.find((p) => p.id === id);
const nameOf = (id) => (player(id) || {}).name || "?";
const initials = (name) => String(name || "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
const live = () => state && state.phase === "live";

// Масштаб под большой экран: от 1800px шириной доску увеличиваем целиком (zoom), но не выше, чем позволяет высота
function fitScreen() {
  const w = window.innerWidth || 0, h = window.innerHeight || 0;
  const z = w >= 1800 ? Math.max(1, Math.min(2.5, Math.round(Math.min(w / 1500, h / 760) * 100) / 100)) : 1;
  document.body.style.setProperty("--z", String(z));
  document.body.classList.toggle("scaled", z > 1);
}
fitScreen();

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  showBanner(T("creating"));
  try {
    const res = await fetch("/bomb/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: bmLang() } }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
    showBanner(null);
    return true;
  } catch (err) {
    showBanner(String(err.message || err));
    return false;
  }
}
function showBanner(text) {
  const b = $("banner");
  b.classList.toggle("hidden", !text);
  b.textContent = text || "";
}

// ---------- печать в верхней полосе ----------
let sealFull = false;
function drawSeal() {
  const box = $("seal");
  const b = state && state.bombs[0];
  const on = !!(b && state.phase !== "lobby");
  box.classList.toggle("on", on);
  if (!on) return;
  const commits = state.bombs.map((x) => x.commit);
  $("sealhash").textContent = sealFull ? commits.join(" · ") : commits.map((c) => c.slice(0, 8) + "…").join(" · ");
  $("sealhash").title = T("seal_full");
}
$("sealhash").onclick = () => { sealFull = !sealFull; drawSeal(); };

// ---------- лобби ----------
let qrDrawn = false;
// код комнаты: самый крупный кегль, при котором слово влезает в свою колонку (меняется с шириной экрана — зовём и при resize)
function fitCode() {
  const code = $("bigcode");
  if (!code) return;
  let fs = 64;
  code.style.setProperty("--code-fs", fs + "px");
  while (fs > 26 && code.scrollWidth > code.clientWidth + 1) { fs -= 4; code.style.setProperty("--code-fs", fs + "px"); }
}
const lobbySeen = new Set();
// ✕ убирает игрока необратимо: первый тап взводит «Убрать?», второй за 3 с убирает (U-12, класс A)
const kickTap = window.MP && MP.twoTap && MP.twoTap.create && !MP.off ? MP.twoTap.create({ armedMs: 3000, onChange: () => { if (state && state.phase === "lobby") drawLobby(); } }) : null;
function drawLobby() {
  const box = $("lobby");
  const on = state.phase === "lobby";
  box.classList.toggle("hidden", !on);
  if (!on) return;
  const url = `${location.origin}/bomb.html?r=${CODE}`;
  if (box.dataset.lang !== bmLang()) {
    box.dataset.lang = bmLang();
    qrDrawn = false;
    box.innerHTML = `<div class="panel who"><h2>${T("lobby_who")}<span id="seatn"></span></h2><div class="seats" id="seats"></div>
        <div class="howto"><div><i>📱</i>${T("rule0")}</div><div><i>💣</i>${T("rule1")}. ${T("rule2")}</div><div><i>💥</i>${T("rule3")}</div></div></div>
      <div class="panel side">
        <div class="join"><div id="qr"></div><div><div class="bigcode" id="bigcode">${escapeHtml(CODE)}</div><div class="url">${escapeHtml(url.replace(/^https?:\/\//, "")).replace("?r=", "<wbr>?r=")}</div><div class="scan">${T("lobby_scan")}</div></div></div>
        <div id="opts" style="display:grid;gap:12px"></div>
        <div class="startbox"><div class="fine" id="starthint"></div><button class="start" id="startbtn" type="button">${T("btn_start")}</button></div>
      </div>`;
    $("startbtn").onclick = () => conn.send({ type: "start" });
    fitCode();
  }
  if (!qrDrawn && window.QRCode) {
    qrDrawn = true;
    new QRCode($("qr"), { text: url, width: 256, height: 256, colorDark: "#16120c", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  }
  const players = state.players.filter((p) => !p.left);
  const fresh = players.filter((p) => !lobbySeen.has(p.id));
  if (fresh.length && lobbySeen.size) bmSfx.pop();
  const nodes = players.map((p) => {
    const d = el("div", "seat" + (lobbySeen.has(p.id) ? "" : " new"));
    const av = el("i", "av", initials(p.name));
    av.style.setProperty("--pc", p.color);
    d.append(av, el("b", null, p.name));
    if (!p.online) d.append(el("span", "off", T("offline")));
    if (isHost) {
      const armed = kickTap && kickTap.isArmed(p.id);
      const x = el("button", "x", armed ? T("kick_sure") : "✕");
      x.type = "button"; x.title = T("kick"); x.setAttribute("aria-label", T("kick") + ": " + p.name);
      if (armed) x.setAttribute("data-armed", "1");
      x.onclick = () => {
        if (!kickTap || kickTap.tap(p.id)) conn.send({ type: "kick", playerId: p.id });
      };
      d.append(x);
    }
    return d;
  });
  fresh.forEach((p) => lobbySeen.add(p.id));
  // пустые места пунктиром, чтобы колонка не зияла пустотой
  const free = Math.max(0, 16 - players.length);
  for (let i = 0; i < free; i++) { const d = el("div", "seat empty"); d.append(el("i", "av"), el("b", null, T("lobby_free"))); nodes.push(d); }
  $("seats").replaceChildren(...nodes);
  fitNames($("seats"), ".seat b");
  $("seatn").textContent = tpl("lobby_n", { n: players.length });
  drawOpts(players);
  const enough = players.filter((p) => p.online).length >= 2;
  $("startbtn").disabled = !isHost || !enough;
  $("startbtn").classList.toggle("hidden", !isHost);
  const notes = [];
  if (!enough) notes.push(T("need_two"));
  if (state.settings.mode === "two" && players.length < state.twoBombsMin) notes.push(T("two_note"));
  if (!isHost) notes.push(T("viewer"));
  $("starthint").textContent = notes.join(" · ");
}

function drawOpts(players) {
  const s = state.settings;
  const opt = (label, buttons, desc) => {
    const o = el("div", "opt");
    const seg = el("div", "seg");
    seg.append(...buttons);
    o.append(el("div", "k", label), seg);
    if (desc != null) o.append(el("div", "d", desc));
    return o;
  };
  const btn = (html, on, send) => {
    const b = el("button", on ? "on" : "");
    b.type = "button";
    b.innerHTML = html;
    b.disabled = !isHost;
    b.onclick = () => conn.send({ type: "settings", settings: send });
    return b;
  };
  const two = players.length === 2;
  $("opts").replaceChildren(
    opt(T("opt_mode"), ["classic", "elim", "two", "quiz"].map((m) => btn(escapeHtml(T("mode_" + m)), s.mode === m, { mode: m })), T("mode_" + s.mode + "_d")),
    opt(T("opt_fuse"), ["short", "normal", "long"].map((f) => {
      // границы фитиля не пишем нигде: зная нижнюю, игроки не торопятся первые полминуты
      return btn(escapeHtml(T("fuse_" + f)), s.fuse === f, { fuse: f });
    })),
    opt(T("opt_return"), [true, false].map((v) => { const b = btn(escapeHtml(T(v ? "on" : "off")), s.returnOk === v, { returnOk: v }); if (two) b.disabled = true; return b; }), two ? T("return_two") : T("return_d")),
    opt(T("opt_groups"), ["hands", "eyes", "head", "crowd"].map((g) => {
      const b = btn(escapeHtml(T("grp_" + g)), s.groups[g], { groups: { [g]: !s.groups[g] } });
      // эрудиту группы не нужны — он всегда задаёт вопросы
      if (s.mode === "quiz") b.disabled = true;
      return b;
    })),
  );
}

// ---------- арена ----------
const cards = new Map(); // id → элемент карточки
const bombEls = []; // по номеру бомбы
const cardPos = new Map(); // id → {x, y} центр карточки в координатах арены
let arenaSize = "";

function arenaPlayers() {
  return state.players.filter((p) => !p.left);
}

// раскладка: широкий экран — эллипс вокруг центра, узкий — сетка сверху.
// Эллипс красив при 4–10 игроках, но при 16 или на низком экране карточки наезжают друг на друга и на центр —
// тогда игроки встают рамкой по краю арены: ряд сверху, ряд снизу и по колонке слева и справа.
const CARD_H = 58, CENTER_H = 350, NARROW_W = 760; // NARROW_W — ширина арены телефона и узкого планшета: там игроки сеткой
function ellipseSpots(n, W, H, cw) {
  const rx = W / 2 - cw / 2 - 8, ry = H / 2 - CARD_H / 2 - 8;
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
    return { x: W / 2 + rx * Math.cos(a), y: H / 2 + ry * Math.sin(a) };
  });
}
function frameSpots(n, W, H, cw) {
  // сколько карточек в боковых колонках: пропорционально высоте, остальное — поровну сверху и снизу
  const side = Math.max(0, Math.min(Math.floor((H - 2 * CARD_H - 24) / (CARD_H + 10)), Math.round((n * H) / (2 * (W + H)))));
  const rest = n - 2 * side, top = Math.ceil(rest / 2), bottom = rest - top;
  const out = [];
  for (let i = 0; i < top; i++) out.push({ x: ((i + 0.5) * W) / top, y: CARD_H / 2 + 4 });
  for (let j = 0; j < side; j++) out.push({ x: W - cw / 2 - 4, y: CARD_H + 8 + ((j + 0.5) * (H - 2 * CARD_H - 16)) / side });
  for (let i = bottom - 1; i >= 0; i--) out.push({ x: ((i + 0.5) * W) / Math.max(1, bottom), y: H - CARD_H / 2 - 4 });
  for (let j = side - 1; j >= 0; j--) out.push({ x: cw / 2 + 4, y: CARD_H + 8 + ((j + 0.5) * (H - 2 * CARD_H - 16)) / side });
  return out;
}
// двое-трое на низком экране (проектор): эллипс сажает карточку прямо над «Сейчас держит» — тогда игроки встают
// колонками слева и справа от центра, по высоте поровну
function sideSpots(n, W, H, cw) {
  const left = Math.ceil(n / 2), right = n - left, out = [];
  for (let j = 0; j < left; j++) out.push({ x: cw / 2 + 4, y: ((j + 0.5) * H) / left });
  for (let j = 0; j < right; j++) out.push({ x: W - cw / 2 - 4, y: ((j + 0.5) * H) / right });
  return out;
}
function spotsOverlap(spots, W, H, cw, cenH) {
  const hw = Math.min(W * 0.56, 760) / 2, hh = Math.max(CENTER_H, cenH || 0) / 2;
  const hit = (a, b, dw, dh) => Math.abs(a.x - b.x) < dw + 10 && Math.abs(a.y - b.y) < dh + 10; // карточки не ближе 10px друг к другу
  for (let i = 0; i < spots.length; i++) {
    const p = spots[i];
    if (Math.abs(p.x - W / 2) < hw + cw / 2 + 4 && Math.abs(p.y - H / 2) < hh + CARD_H / 2 + 4) return true;
    for (let j = i + 1; j < spots.length; j++) if (hit(p, spots[j], cw, CARD_H)) return true;
  }
  return false;
}
// имя целиком, где помещается: если не влезло — кегль мельче (не ниже ~70%), крайний случай — многоточие + title (T-W3-32)
function fitName(b) {
  b.style.fontSize = "";
  if (b.clientWidth < 8) return;
  b.title = b.textContent;
  if (b.scrollWidth <= b.clientWidth + 1) return;
  const base = parseFloat(getComputedStyle(b).fontSize) || 20;
  let fs = base;
  while (b.scrollWidth > b.clientWidth + 1 && fs > base * 0.7) { fs -= 1; b.style.fontSize = fs + "px"; }
}
function fitNames(root, sel) {
  const bs = root.querySelectorAll(sel);
  for (let i = 0; i < bs.length; i++) fitName(bs[i]);
}
function layout() {
  const arena = $("arena");
  const W = arena.clientWidth, H = arena.clientHeight;
  const list = arenaPlayers();
  const n = list.length;
  const narrow = W < NARROW_W;
  let cw, ch, cols = 1, pitch = 66, spots = null;
  if (narrow) {
    // узкий экран: карточки сеткой сверху, центр прижат книзу. Телефон боком — карточки слева, центр справа.
    // Колонок и высоту ряда подбираем так, чтобы сетка не залезала под центр
    const side = W > H * 1.5;
    arena.classList.toggle("side", side);
    const GW = side ? Math.floor(W / 2) : W;
    const center = $("center");
    const free = side ? H : H - (center.offsetHeight + (parseFloat(getComputedStyle(center).bottom) || 0)) - 8;
    cols = Math.max(1, Math.min(3, Math.floor(GW / 150)));
    const fits = (c, h) => Math.ceil(n / c) * h - 8 <= free;
    if (!fits(cols, 66)) {
      if (fits(cols, 46)) pitch = 46;
      else { cols = Math.max(cols, Math.min(4, Math.floor(GW / 90))); pitch = 46; }
    }
    arena.classList.toggle("compact", pitch === 46);
    ch = pitch - 8;
    cw = Math.floor((GW - 8) / cols) - 8;
    // совсем узкая карточка — без кружка-аватара, чтобы имя читалось
    arena.classList.toggle("tiny", cw < 110);
    arena.classList.remove("tight");
    arena.style.setProperty("--cenw", "");
  } else {
    arena.classList.remove("side", "compact", "tiny");
    ch = CARD_H;
    cw = Math.max(150, Math.min(230, Math.floor(Math.max(W / 6.2, Math.min(W, H) / 3.6))));
    // реальная высота центра: пузырь с вариантами в две строки выше, чем CENTER_H
    const cenH = $("center").offsetHeight;
    spots = ellipseSpots(n, W, H, cw);
    let sides = false;
    if (n <= 3 && spotsOverlap(spots, W, H, cw, cenH)) { spots = sideSpots(n, W, H, cw); sides = true; }
    else if (n > 3 && spotsOverlap(spots, W, H, cw, cenH)) {
      // рамка: ширина карточки — по числу в верхнем ряду, но не меньше 120
      const top = Math.ceil((n - 2 * Math.max(0, Math.round((n * H) / (2 * (W + H))))) / 2);
      cw = Math.max(120, Math.min(cw, Math.floor(W / Math.max(1, top)) - 10));
      spots = frameSpots(n, W, H, cw);
    }
    arena.classList.toggle("tight", cw < 190);
    // между боковыми карточками рамки центр не должен быть шире, чем остаётся
    const sideRoom = n > 3 || sides ? W - 2 * (cw + 24) : 0;
    arena.style.setProperty("--cenw", sideRoom > 0 && sideRoom < Math.min(W * 0.56, 760) ? Math.max(300, sideRoom) + "px" : "");
  }
  arena.style.setProperty("--cw", cw + "px");
  list.forEach((p, i) => {
    let x, y;
    if (narrow) {
      x = (i % cols) * (cw + 8) + cw / 2;
      y = Math.floor(i / cols) * pitch + ch / 2;
    } else {
      x = spots[i].x; y = spots[i].y;
    }
    cardPos.set(p.id, { x, y });
    const c = cards.get(p.id);
    if (c) c.style.transform = `translate(${x - cw / 2}px, ${y - ch / 2}px)`;
  });
  fitNames(arena, ".pc b");
}

function drawArena() {
  const arena = $("arena");
  const on = state.phase !== "lobby";
  arena.classList.toggle("hidden", !on);
  if (!on) return;
  const list = arenaPlayers();
  const ids = new Set(list.map((p) => p.id));
  for (const [id, c] of cards) if (!ids.has(id)) { c.remove(); cards.delete(id); }
  for (const p of list) {
    let c = cards.get(p.id);
    if (!c) {
      c = el("div", "pc");
      c.innerHTML = `<i class="av"></i><b></b><span class="st"></span>`;
      arena.append(c);
      cards.set(p.id, c);
    }
    c.querySelector(".av").textContent = initials(p.name);
    c.querySelector(".av").style.setProperty("--pc", p.color);
    c.querySelector("b").textContent = p.name;
    c.classList.toggle("out", p.out);
    c.classList.toggle("off", !p.online);
    c.classList.toggle("hold", live() && p.holding);
    c.classList.toggle("victim", (state.phase === "boom" || state.phase === "finished") && lastVictim() === p.id);
    c.dataset.id = p.id;
  }
  drawCenter();
  // высота центра — в ключе: на узком экране сетка карточек подстраивается под неё (отсчёт выше, чем раунд)
  const key = `${arena.clientWidth}x${arena.clientHeight}:${$("center").offsetHeight}:${list.map((p) => p.id).join(",")}`;
  if (key !== arenaSize) { arenaSize = key; layout(); }
  drawBombs();
}

function lastVictim() {
  const b = state.booms[state.booms.length - 1];
  return b && b.round === state.round ? b.playerId : null;
}

// место бомбы: у карточки держателя, чуть ближе к центру
function bombSpot(holder) {
  const p = cardPos.get(holder);
  if (!p) return null;
  const arena = $("arena");
  const W = arena.clientWidth, H = arena.clientHeight;
  // узкий экран: на правом краю карточки, но не за краем арены (там её обрезает)
  if (W < NARROW_W) return { x: Math.min(p.x + (parseFloat(getComputedStyle(arena).getPropertyValue("--cw")) || 150) / 2 - 20, W - 50), y: p.y - 18 };
  // бомба садится на границе карточки со стороны центра — имя держателя она не закрывает
  const cw = parseFloat(getComputedStyle(arena).getPropertyValue("--cw")) || 150;
  const dx = W / 2 - p.x, dy = H / 2 - p.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const t = Math.min(cw / 2 / Math.max(Math.abs(ux), 0.001), 29 / Math.max(Math.abs(uy), 0.001)) + (cw < 190 ? 34 : 46);
  return { x: p.x + ux * t, y: p.y + uy * t };
}

function drawBombs() {
  const arena = $("arena");
  const bombs = state.phase === "lobby" ? [] : state.bombs;
  while (bombEls.length < bombs.length) {
    const w = el("div", "bombwrap");
    w.innerHTML = `<div class="shake">${bmBombSvg()}</div>`;
    arena.append(w);
    bombEls.push({ el: w, holder: null, at: null });
  }
  bombEls.forEach((be, i) => {
    const b = bombs[i];
    const visible = !!(b && b.holder && (state.phase === "live" || state.phase === "boom"));
    be.el.classList.toggle("gone", !visible || state.phase === "boom");
    if (!visible) { be.holder = null; return; }
    const to = bombSpot(b.holder);
    if (!to) return;
    if (be.holder && be.holder !== b.holder && be.at && !reduceMotion()) flyBomb(be, be.at, to);
    else be.el.style.transform = `translate(${to.x}px, ${to.y}px)`;
    be.holder = b.holder;
    be.at = to;
  });
}

// полёт дугой: вверх к середине пути и вниз к получателю, с поворотом
function flyBomb(be, from, to) {
  const mx = (from.x + to.x) / 2, my = Math.min(from.y, to.y) - 90 - Math.abs(from.x - to.x) * 0.08;
  bmSfx.whoosh();
  const a = be.el.animate([
    { transform: `translate(${from.x}px, ${from.y}px) rotate(0deg) scale(1)` },
    { transform: `translate(${mx}px, ${my}px) rotate(200deg) scale(1.25)`, offset: 0.5 },
    { transform: `translate(${to.x}px, ${to.y}px) rotate(360deg) scale(1)` },
  ], { duration: 600, easing: "cubic-bezier(.4,.1,.5,1)" });
  be.el.style.transform = `translate(${to.x}px, ${to.y}px)`;
  a.onfinish = () => { bmSfx.catch(); const c = cards.get(be.holder); if (c && !reduceMotion()) c.animate([{ transform: c.style.transform + " scale(1.08)" }, { transform: c.style.transform }], { duration: 300, easing: "ease-out" }); };
}

// центр: держатель крупно, что он делает, пузырь с вопросом или счётчики
function drawCenter() {
  const c = $("center");
  const ph = state.phase;
  if (ph === "countdown") {
    if (c.dataset.mode !== "cd" + state.round) {
      c.dataset.mode = "cd" + state.round;
      c.innerHTML = `<div class="lbl">${escapeHtml(tpl("round_n", { n: state.roundInGame }))}</div>
        <div class="sealcard"><div class="t">${T("seal_title")}</div>${state.bombs.map((b) => `<div class="h">${escapeHtml(b.commit)}</div>`).join("")}
        <div class="s">${escapeHtml(T("seal_line"))}</div></div>
        <div class="count" id="count"></div>`;
    }
    return;
  }
  if (c.dataset.mode !== "live") {
    c.dataset.mode = "live";
    bubbleKey = ""; // центр пересобран — пузырь тоже
    c.innerHTML = `<div class="lbl" id="lbl"></div><div class="holder" id="holder"></div><div class="doing" id="doing"></div>
      <div class="bubble" id="bubble"></div><div class="danger">${T("danger")}</div>`;
  }
  const holders = [...new Set(state.bombs.filter((b) => b.alive && b.holder).map((b) => b.holder))];
  const victim = lastVictim();
  const shown = ph === "boom" || ph === "finished" ? (victim ? [victim] : []) : holders;
  $("lbl").textContent = ph === "boom" || ph === "finished" ? (victim ? T("boom_at") : "") : holders.length > 1 ? T("now_hold2") : T("now_holds");
  const h = $("holder");
  h.textContent = shown.map(nameOf).join(" + ");
  h.style.setProperty("--hc", shown.length === 1 ? (player(shown[0]) || {}).color || "var(--red)" : "var(--red)");
  let fs = 84;
  h.style.setProperty("--hfs", fs + "px");
  while (fs > 34 && h.scrollWidth > h.clientWidth + 1) { fs -= 6; h.style.setProperty("--hfs", fs + "px"); }
  // что делает держатель
  let doing = "";
  if (live()) {
    const p0 = holders.map(player).find(Boolean);
    if (p0 && p0.online === false) doing = tpl("doing_off", { name: p0.name });
    else if (p0 && p0.armed) doing = tpl("armed", { name: p0.name });
    else if (p0 && p0.solving) doing = tpl("doing", { name: p0.name, what: T("ch_" + p0.solving) });
    else if (p0) doing = tpl("fresh", { name: p0.name });
  } else if (ph === "boom" || ph === "finished") {
    doing = victim ? T(state.settings.mode === "elim" ? "out_line" : "boom_line") : "";
  }
  const dn = $("doing");
  dn.textContent = doing;
  // длинная подпись («… вспоминает историю…») в узком центре рамки не должна обрезаться многоточием — ужимаем кегль
  let df = 24;
  dn.style.fontSize = df + "px";
  while (df > 15 && dn.scrollWidth > dn.clientWidth + 1) { df -= 1; dn.style.fontSize = df + "px"; }
  drawBubble(holders);
}

// пузырь: вопрос «головы» у держателя — крупно; иначе счётчики раунда. Место всегда занято (без пустот)
let bubbleKey = "";
function drawBubble(holders) {
  const box = $("bubble");
  const chs = live() && state.challenges ? holders.map((id) => [id, state.challenges[id]]).filter(([, c]) => c) : [];
  // «Зал» важнее всего: без доски держатель кода не узнает; дальше — вопросы «головы»
  const crowd = chs.find(([, c]) => c.type === "crowd");
  if (crowd) {
    const [holder, c] = crowd;
    const key = "c" + c.id + bmLang();
    if (bubbleKey === key) return;
    bubbleKey = key;
    const txt = c.view.where === "tv" ? tpl("crowd_tv", { name: nameOf(holder), code: c.code || "?" }) : tpl("crowd_phone", { name: nameOf(holder), helper: nameOf(c.view.helper) });
    box.innerHTML = `<div class="q${c.view.where === "tv" ? " crowdcode" : ""}">${escapeHtml(txt)}</div>`;
    return;
  }
  const ch = (chs.find(([, c]) => c.group === "head") || [])[1];
  if (ch) {
    const key = "q" + ch.id + bmLang();
    if (bubbleKey === key) return;
    bubbleKey = key;
    const v = ch.view;
    let q = "", opts = [];
    if (ch.type === "quiz") { q = bmTx(v.q); opts = v.options.map(bmTx); }
    else if (ch.type === "tf") { q = bmTx(v.q); opts = [T("q_true"), T("q_false")]; }
    else if (ch.type === "heavy") { q = v.options.map(bmTx).join("  ⚖  "); }
    else if (ch.type === "chrono") { q = v.items.map(bmTx).join(" · "); }
    else if (ch.type === "math") { q = v.text + " = ?"; }
    else if (ch.type === "seq") { q = seqText(v) + ", ?"; }
    else if (ch.type === "sudoku") { q = "🧩 " + v.n + "×" + v.n; }
    else if (ch.type === "rebus") { q = v.q; opts = v.options.map(bmTx); }
    else if (ch.type === "manual") { q = T("mr_" + v.rule); opts = v.wires.map((w, i) => `${i + 1} ${{ red: "🟥", blue: "🟦", yellow: "🟨", green: "🟩", white: "⬜", black: "⬛" }[w]}`); }
    else if (ch.type === "oddmeaning") { q = v.items.join("  "); }
    else if (ch.type === "dice") { q = v.dice.map((d) => "⚀⚁⚂⚃⚄⚅"[d - 1]).join(" ") + " = ?"; }
    box.innerHTML = `<div><div class="q">${escapeHtml(q)}</div>${opts.length ? `<div class="opts">${opts.map((o) => `<span>${escapeHtml(o)}</span>`).join("")}</div>` : ""}</div>`;
    return;
  }
  // после взрыва: сколько горел раунд и какой был фитиль — печать уже вскрыта
  if (state.phase === "boom" || state.phase === "finished") {
    const key = "b" + state.round + bmLang();
    if (bubbleKey === key) return;
    bubbleKey = key;
    const st = state.stats || {};
    const boom = state.booms[state.booms.length - 1];
    const seal = boom && state.seals.find((x) => x.round === boom.round && x.bomb === boom.bomb && x.revealed);
    const dur = Math.round((st.duration || 0) / 1000);
    box.innerHTML = `<div class="meta"><div>${T("burned")}<b>${Math.floor(dur / 60)}:${String(dur % 60).padStart(2, "0")}</b></div><div>${T("passes")}<b>${st.passes || 0}</b></div>${seal ? `<div>${T("fuse_was")}<b>${escapeHtml(tpl("sec_s", { s: seal.fuseMs / 1000 }))}</b></div>` : ""}</div>`;
    return;
  }
  const key = "m";
  if (bubbleKey !== key) {
    bubbleKey = key;
    box.innerHTML = `<div class="meta"><div>${T("burning")}<b id="m-el">0:00</b></div><div>${T("passes")}<b id="m-pa">0</b></div><div>${T("in_hands")}<b id="m-ih">0,0</b></div></div>`;
  }
  $("m-pa").textContent = String(state.passes || 0);
}
function seqText(v) {
  if (v.kind === "days") { const d = String(T("days")).split("|"); return v.items.map((i) => d[i]).join(", "); }
  return v.items.join(", ");
}

// «🔑 Ссылка ведущего»: ключ ведущего живёт только в localStorage этого экрана; кнопка копирует ссылку
// …?r=КОД&h=ТОКЕН в буфер, токен на экране не рисуется (доска видна всем). Без MP работает как раньше.

const HL = window.MP && MP.hostLink ? MP.hostLink({

function setHostNote(text) {

function hasHostToken() {

}
function drawHostbar() {
  const bar = $("hostbar");
  if (dead || !state) { bar.innerHTML = ""; hostBarKey = ""; return; }
  const showEnd = isHost && (state.phase === "live" || state.phase === "countdown");

    if (window.MP && MP.twoTap && !MP.off) MP.twoTap(b, { armedLabel: T("end_sure"), onConfirm: () => conn.send({ type: "end" }) });
    else b.onclick = () => conn.send({ type: "end" });

      <div class="stat"><div class="k">${T("st_mostgot")}</div><div class="v">${who(st.mostGot)}${st.mostGot ? " · " + escapeHtml(bmTplN("st_times", st.mostGot.n)) : ""}</div></div>
      <div class="stat"><div class="k">${T("st_fastest")}</div><div class="v">${who(st.fastest)}${st.fastest ? " · " + escapeHtml(tpl("sec_s", { s: bmSec(st.fastest.ms) })) : ""}</div></div>

    : "";

  const seals = state.seals.map((x, i) => `<div class="sealrow"><div class="top2"><span>${escapeHtml(tpl("seal_round", { n: rounds.indexOf(x.round) + 1 }))}${twoOf(x) ? " · " + escapeHtml(tpl("seal_bomb", { n: x.bomb + 1 })) : ""} · ${escapeHtml(tpl("seal_fuse", { n: x.revealed ? x.fuseMs / 1000 : "?" }))}</span><span class="chk" data-i="${i}">${T("seal_check")}</span></div>

  box.innerHTML = `<div class="rcard">${verdict}${stats}${order}
    <div class="seals"><div class="stat" style="border:0;background:none;padding:0"><div class="k">${T("seals_title")} · ${escapeHtml(T("seal_line"))}</div></div>${seals}</div>

  if (isHost) {
    $("again").onclick = () => conn.send({ type: "start" });
    $("tolobby").onclick = () => conn.send({ type: "lobby" });
  }
  state.seals.forEach(async (x, i) => {
    const ok = await bmVerifySeal(x);
    const node = box.querySelector(`.chk[data-i="${i}"]`);
    if (!node) return;
    node.className = "chk " + (ok ? "ok" : "bad");
    node.textContent = ok ? "✓ " + T("seal_ok") : "✗ " + T("seal_bad");
  });
}

// ---------- эффекты по смене состояния ----------
function effects() {
  if (!prev) return;
  // новый взрыв — вспышка, «БУМ!» над карточкой, тряска
  if (state.booms.length > prev.booms.length || (state.phase === "boom" && prev.phase !== "boom")) {
    const v = lastVictim();
    boomFx(v);
  }
  if (state.phase === "countdown" && prev.phase !== "countdown") lastCount = null;
}

// Звезда не должна лежать на крупном имени и его подписи в центре (bomb-006) — и, по возможности, на чужих карточках:
// перебираем места по сетке в границах арены, берём ближайшее к карточке жертвы с наименьшим налезанием на карточки;
// нет свободного места под имя — звезда уходит под него (z-index), а не поверх. Прямоугольники приводим к CSS-пикселям
// арены (под zoom доски getBoundingClientRect может быть и в увеличенных единицах).
function avoidName(k, arena, victim) {
  const hd = $("holder");
  if (!hd || !hd.textContent) return;
  const ar = arena.getBoundingClientRect();
  const sc = ar.width / (arena.clientWidth || ar.width) || 1;
  const rel = (r) => ({ x0: (r.left - ar.left) / sc, x1: (r.right - ar.left) / sc, y0: (r.top - ar.top) / sc, y1: (r.bottom - ar.top) / sc });
  const rg = document.createRange();
  rg.selectNodeContents(hd);
  const boxes = [rel(rg.getBoundingClientRect())];
  ["lbl", "doing"].forEach((id) => { const n = $(id); if (n && n.textContent) { const r2 = document.createRange(); r2.selectNodeContents(n); boxes.push(rel(r2.getBoundingClientRect())); } });
  const nm = { x0: Math.min.apply(null, boxes.map((r) => r.x0)), x1: Math.max.apply(null, boxes.map((r) => r.x1)), y0: Math.min.apply(null, boxes.map((r) => r.y0)), y1: Math.max.apply(null, boxes.map((r) => r.y1)) };
  const vc = cards.get(victim);
  const others = [...arena.querySelectorAll(".pc")].filter((c) => c !== vc).map((c) => rel(c.getBoundingClientRect()));
  const hw = k.offsetWidth / 2, hh = k.offsetHeight / 2, W = arena.clientWidth, H = arena.clientHeight;
  const ovl = (x, y, r) => Math.max(0, Math.min(x + hw, r.x1) - Math.max(x - hw, r.x0)) * Math.max(0, Math.min(y + hh, r.y1) - Math.max(y - hh, r.y0));
  const x0 = parseFloat(k.style.left), y0 = parseFloat(k.style.top);
  if (ovl(x0, y0, nm) === 0) return;
  let best = null;
  for (let x = hw; x <= W - hw; x += 40) {
    for (let y = hh; y <= H - hh; y += 40) {
      if (ovl(x, y, nm) > 0) continue;
      let cost = Math.hypot(x - x0, y - y0);
      for (const r of others) cost += ovl(x, y, r) / 20;
      if (!best || cost < best.cost) best = { x, y, cost };
    }
  }
  if (best) { k.style.left = best.x + "px"; k.style.top = best.y + "px"; }
  else k.style.zIndex = "2";
}

function boomFx(victim) {
  bmSfx.boom();
  if (reduceMotion()) return;
  const f = $("flash");
  f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  document.body.classList.remove("shaking"); void document.body.offsetWidth; document.body.classList.add("shaking");
  const pos = cardPos.get(victim);
  if (!pos) return;
  const k = el("div", "kapow on");
  k.innerHTML = `<svg viewBox="0 0 380 300"><path d="M190 8 L222 92 L300 40 L276 124 L372 132 L292 176 L352 262 L252 226 L230 296 L186 234 L126 292 L122 214 L20 244 L84 170 L8 118 L104 110 L70 26 L150 84Z" fill="#e8322b" stroke="#16120c" stroke-width="8" stroke-linejoin="round"/></svg><span>${escapeHtml(T("boom"))}</span>`;
  const arena = $("arena");
  arena.append(k);
  // у края арены «БУМ!» обрезался (arena — overflow: clip): держим звезду целиком в её границах
  const hw = k.offsetWidth / 2, hh = k.offsetHeight / 2, W = arena.clientWidth, H = arena.clientHeight;
  k.style.left = Math.min(Math.max(pos.x, hw), Math.max(hw, W - hw)) + "px";
  k.style.top = Math.min(Math.max(pos.y, hh), Math.max(hh, H - hh)) + "px";
  avoidName(k, arena, victim);
  setTimeout(() => k.remove(), 1700);
}

function floatAt(id, emoji) {
  const pos = cardPos.get(id);
  if (!pos || state.phase === "lobby") return;
  // у верхнего края лететь вверх некуда — улетает вниз под карточку
  const down = pos.y < 130;
  const f = el("div", "float" + (down ? " down" : ""), emoji);
  f.style.left = pos.x + "px";
  f.style.top = pos.y + (down ? 30 : -50) + "px";
  $("arena").append(f);
  setTimeout(() => f.remove(), 1700);
}

// ---------- кадр: фитиль, тряска, часы, тиканье ----------
let lastTick = 0, lastCount = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state) return;
  const now = bmNow();
  const heatOn = live();
  const left = bmFuseLeft(state, now);
  for (const be of bombEls) {
    bmSetFuse(be.el.querySelector("svg"), heatOn ? left : 1);
    be.el.style.setProperty("--heat", heatOn ? (1 - left).toFixed(3) : "0");
  }
  const elapsed = heatOn && state.startedAt ? now - state.startedAt : 0;
  // «может рвануть» горит с первой секунды: включаться на нижней границе — значит выдать её
  document.body.classList.toggle("hot", heatOn);
  if (heatOn) {
    const m = $("m-el");
    if (m) m.textContent = `${Math.floor(elapsed / 60000)}:${String(Math.floor(elapsed / 1000) % 60).padStart(2, "0")}`;
    const ih = $("m-ih");
    const b = state.bombs.find((x) => x.alive);
    if (ih && b && b.since) ih.textContent = bmSec(now - b.since);
    // тиканье чаще вместе с фитилём: по верхней границе нельзя — она выдала бы конец
    const gap = 720 - 540 * (1 - left);
    if (now - lastTick > gap) { lastTick = now; bmSfx.tick(true); }
    for (const p of arenaPlayers()) {
      const c = cards.get(p.id);
      if (!c) continue;
      const st = c.querySelector(".st");
      const hb = state.bombs.find((x) => x.alive && x.holder === p.id);
      st.textContent = hb ? (p.online === false ? "🧨 ⚡ " + T("nolink") : "🧨 " + tpl("sec_s", { s: bmSec(now - hb.since) })) : p.out ? T("out_mark") : !p.online ? T("offline") : "";
      if (!!hb !== !!c._hasSt) { c._hasSt = !!hb; fitName(c.querySelector("b")); } // у держателя справа секундомер — имя ужимается под него
      c.classList.toggle("hot", !!hb && now - hb.since > 6000);
    }
  } else if (state.phase === "countdown") {
    const n = Math.max(1, Math.ceil((state.phaseEnd - now) / 1000));
    const cnt = $("count");
    if (cnt && n !== lastCount && state.phaseEnd - now > 0) {
      lastCount = n;
      cnt.textContent = n;
      cnt.classList.remove("pop"); void cnt.offsetWidth; cnt.classList.add("pop");
      bmSfx.count(false);
    }
  } else {
    for (const p of arenaPlayers()) {
      const c = cards.get(p.id);
      if (!c) continue;
      c.classList.remove("hot");
      c.querySelector(".st").textContent = p.out ? T("out_mark") : !p.online ? T("offline") : "";
    }
  }
}

// ---------- отрисовка ----------
function render() {
  if (!state || dead) return;
  document.body.dataset.phase = state.phase;
  $("codechip").textContent = CODE;
  $("codechip").classList.toggle("hidden", state.phase === "lobby");
  drawSeal();
  drawLobby();
  drawArena();
  drawHostbar();
  drawResult();
  effects();
  prev = state;
}

window.addEventListener("resize", () => { fitScreen(); arenaSize = ""; if (state) { drawArena(); fitCode(); } });
window.addEventListener("langchange", () => { $("lobby").dataset.lang = ""; $("center").dataset.mode = ""; bubbleKey = ""; resultKey = ""; render(); });

// ---------- связь ----------
function onMessage(m) {
  switch (m.type) {
    case "hello":
      state = m.state;
      if (gone$) gone$.hello();
      if (!isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      // команды ведущего, нажатые при обрыве, уходят после host-токена: раньше они молча пропадали (T-W2-16)
      if (conn.queue && conn.queue.size()) conn.flush();
      render();
      break;
    case "state":
      state = m.state;
      render();
      break;
    case "host_ok":
      isHost = true;
      hostLost = false;
      pasteOpen = false;
      document.body.classList.add("host");
      $("lobby").dataset.lang = "";
      resultKey = "";
      break;
    case "host_lost":
      isHost = false;
      hostLost = true;
      document.body.classList.remove("host");
      $("lobby").dataset.lang = "";
      resultKey = "";
      render();
      break;
    case "event":
      if (m.event.type === "react") floatAt(m.event.playerId, m.event.emoji);
      break;
    case "error":
      if (m.error === "room_expired") gone();
      if (m.error === "bad host token") {
        hostLost = false;
        try { localStorage.removeItem(hostKey()); } catch (e) {}
        pasteOpen = true;
        setHostNote(T("host_bad"));
      }
      break;
  }
}

// Комнаты нет (404 до первого hello) и «закрылась» (после) — разные экраны. Серверного различителя нет:
// опечатка в коде и комната, убранная по сроку, до hello выглядят одинаково (К-11).
const gone$ = window.MP && MP.roomGone ? MP.roomGone({ showForm: noRoom, onClosed: closed }) : null;
function gone() {
  if (gone$) gone$.gone(); else closed();
}
function endScreen() {
  dead = true;
  for (const id of ["lobby", "arena", "result"]) $(id).classList.add("hidden");
  $("seal").classList.remove("on");
  $("hostbar").innerHTML = "";
}
function closed() {
  endScreen();
  showBanner(T("expired"));
}
function noRoom() {
  endScreen();
  const b = $("banner");
  b.classList.remove("hidden");
  b.innerHTML = `<div class="gonebox"><div class="t">${escapeHtml(T("noroom_title"))}</div><div>${escapeHtml(T("noroom_text"))}</div>
    <form id="goneform" autocomplete="off"><input id="gonecode" maxlength="24" placeholder="${escapeHtml(T("code_ph"))}" aria-label="${escapeHtml(T("code_ph"))}" value="${escapeHtml(CODE)}"><button type="submit">${escapeHtml(T("btn_go"))}</button></form></div>`;
  $("goneform").onsubmit = (e) => {
    e.preventDefault();
    const c = MP.roomGone.normalize($("gonecode").value);
    if (c) location.href = `bomb-board.html?r=${encodeURIComponent(c)}`;
  };
}

async function boot() {
  // ?h=токен — ссылка ведущего на другое устройство: токен кладём в хранилище и убираем из адреса
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  let netLost = false, netQuiet = false;
  const showNet = () => {
    banner.textContent = T("err_connect");
    banner.classList.toggle("on", netLost || netQuiet);
  };
  conn = bmConnect({
    code: CODE,
    onMessage,
    onGone: gone,
    onOpen: () => { isHost = false; },
    // «lost» — сокет закрыт; «quiet» — сокет жив, но молчит > 10 с (MP.conn) либо браузер сообщил offline
    onState: (st) => { netLost = st === "lost"; if (st === "open") netQuiet = false; showNet(); },
    onQuiet: (q) => { netQuiet = !!q; showNet(); },
  });
  window.addEventListener("langchange", showNet);
  requestAnimationFrame(frame);
  // ручка для отладки и стенда: те же сообщения, что шлют кнопки доски
  window.bmBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
boot();
</script>
