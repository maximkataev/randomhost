<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08080c">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1faa2.svg" type="image/svg+xml">
<title>Как все — игра для компании: угадай, что скажет большинство</title>
<meta name="robots" content="index,follow">
<meta name="description" content="🪢 Мультиплеерная игра для компании: на общем экране вопрос, а ты отвечаешь не за себя, а за всех — что выберет большинство? Угадал — очки. Бесплатно, в браузере, с телефонов." data-i18n-meta="_meta">
<!-- ссылки на комнаты (?r=КОД) — та же страница: в выдаче должна быть одна, без кода -->
<link rel="canonical" href="https://randomhost.online/crowd.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Как все — игра для компании">
<meta property="og:description" content="Вопрос на экране, а ты угадываешь, что ответит большинство. Бесплатно, в браузере, с телефонов.">
<meta property="og:url" content="https://randomhost.online/crowd.html">
<meta property="og:image" content="https://randomhost.online/og-image.png">
<meta property="og:site_name" content="Рандомайзер Онлайн">
<meta property="og:locale" content="ru_RU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="crowd-theme.css">
<style>
  /* Пульт «Как все» — язык аукциона: тёмное стекло, цветные пятна, Unbounded + Onest, градиентные кнопки.
     Две стороны различимы и без цвета: значок ✔ / ✖ или буква А / Б в углу кнопки. Токены — в crowd-theme.css. */
  :root {
    --lang-switch-bg: rgba(20, 20, 30, .6);
    --lang-switch-border: var(--glass-line);
    --lang-switch-fg: var(--muted);
    --lang-switch-active-bg: rgba(255, 255, 255, .16);
    --lang-switch-active-fg: var(--text);
    --lang-switch-active-border: rgba(255, 255, 255, .3);
    --lang-switch-font: var(--body);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: transparent; color: var(--text); font: 500 16px/1.3 var(--body); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  /* «А сам-то ты?»: другие цвета пятен — фиолетовый и золото, чтобы экран не спутать с голосованием */
  body[data-scene="op"] .blob.a { background: var(--c1); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; }

  /* единая верхняя панель: всё высотой 44px и в одну линию, на каждом экране одинаково */
  .util { display: flex; align-items: center; gap: 8px; height: 52px; padding: 8px calc(var(--lsw, 150px)) 0 12px; position: relative; z-index: 3; }
  .util a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap; flex: none; height: 44px; min-width: 44px; padding: 0 16px; border: 1px solid var(--glass-line); border-radius: 22px; background: var(--glass); display: inline-flex; align-items: center; justify-content: center; }
  @media (max-width: 400px) { .util a { font-size: 0; padding: 0; width: 44px; } .util a::before { content: "←"; font-size: 22px; } }
  .sound-toggle-btn { flex: none; margin: 0; width: 44px; height: 44px; border: 1px solid var(--glass-line); border-radius: 50%; background: var(--glass); color: var(--text); font-size: 16px; display: grid; place-items: center; padding: 0; }
  /* переключатель языка из i18n.js: ровно 44px, тот же центр по вертикали */
  .lang-switch { top: 8px !important; right: 12px !important; height: 44px !important; padding: 3px !important; box-sizing: border-box !important; align-items: center; }
  /* пятна света ярче: на тёмном стекле им есть чем светиться */
  .blob { opacity: .55; width: 70vmax; height: 70vmax; }
  .blob.c { opacity: .3; width: 40vmax; height: 40vmax; }
  body[data-scene="op"] .blob.b { background: var(--c2); opacity: .45; }
  .conn { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); z-index: 30; background: rgba(20, 20, 30, .92); border: 1px solid var(--glass-line); color: var(--text); font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 14px; visibility: hidden; white-space: nowrap; }
  .conn.on { visibility: visible; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 30; background: rgba(20, 20, 30, .94); border: 1px solid var(--glass-line); color: var(--text); font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 14px; max-width: calc(100% - 32px); text-align: center; visibility: hidden; }
  .toast.on { visibility: visible; }

  /* золотое свечение по краю экрана, пока включён ва-банк */
  #frame { position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0; transition: opacity .15s; box-shadow: inset 0 0 0 2px #fff, inset 0 0 70px rgba(236, 72, 153, .42); }
  #frame.on { opacity: 1; }

  #app { position: relative; z-index: 2; max-width: 520px; margin: 0 auto; padding: 2px 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; min-height: calc(100dvh - 52px); }
  #app > * { min-width: 0; }
  #app.mid { justify-content: center; }
  #app.mid .note { flex: 0 0 auto; margin-bottom: 0; }
  #app.mid .ticket { flex: 0 1 auto; padding: 24px 14px; }

  h1, h2 { margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.12; }
  .lede { font-size: 16px; font-weight: 500; margin: 0; color: var(--muted); }
  .fine { font-size: 14px; font-weight: 500; margin: 0; color: var(--muted); }
  .center { text-align: center; }

  /* «Угадай, что скажет БОЛЬШИНСТВО» — подпись над вопросом */
  .banner { flex: none; text-align: center; color: var(--muted); font: 500 13px/1.2 var(--body); }
  .banner b { font: 900 .95em/1 var(--display); letter-spacing: .06em; background: linear-gradient(100deg, var(--c3), var(--c1) 55%, var(--c2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
  .meta { flex: none; min-height: 20px; /* секунды пишет frame() уже после fit(): высота не должна прыгать */ display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 700 12px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: -2px; }
  .meta b { font: 900 20px/1 var(--display); letter-spacing: 0; font-variant-numeric: tabular-nums; min-width: 3.4ch; text-align: right; display: inline-block; color: var(--text); }
  .meta i { font-style: normal; background: #fff; color: #0b1030; border-radius: 8px; padding: 3px 7px; margin-left: 8px; font-weight: 800; letter-spacing: .02em; }
  .timer { flex: none; height: 8px; background: var(--glass-hi); border: 1px solid var(--glass-line); border-radius: 6px; position: relative; overflow: hidden; }
  .timer i { position: absolute; inset: 0; background: linear-gradient(90deg, var(--c3), var(--c1) 60%, var(--c2)); transform-origin: left; }
  .timer.hot i { background: var(--bad); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .meta.hot b { color: var(--bad); }

  /* вопрос на стеклянной панели */
  .q { flex: none; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; padding: 12px 14px; font: 700 clamp(17px, 5.6vw, 24px)/1.15 var(--display); overflow-wrap: anywhere; text-wrap: balance; text-align: center; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .q.sm { font-size: clamp(15px, 4.6vw, 19px); }

  /* стороны: две большие кнопки; a слева (синяя → циан), b справа (оранжевая → розовая) — места не меняются */
  .sides { flex: 1 1 auto; min-height: 112px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .side { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 24px; color: #0b1030; padding: 40px 8px 12px; text-align: center; min-width: 0; min-height: 112px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 18px 44px -22px var(--glow, transparent);
    transition: transform .1s, filter .15s, opacity .15s, box-shadow .15s; }
  .side.a { background: linear-gradient(135deg, var(--side-a), var(--side-a2)); --glow: var(--side-a); }
  .side.b { background: linear-gradient(135deg, var(--side-b), var(--side-b2)); --glow: var(--side-b); }
  .side .ico { position: absolute; top: 10px; left: 10px; width: 30px; height: 30px; border-radius: 50%; background: #0b1030; color: #fff; font: 900 15px/30px var(--display); text-align: center; }
  .side .sm { font: 700 13px/1.15 var(--body); text-transform: uppercase; letter-spacing: .06em; color: #0b1030; opacity: .9; }
  .side .big { color: #0b1030; font: 900 clamp(22px, 8.4vw, 36px)/1.05 var(--display); max-width: 100%; overflow-wrap: normal; word-break: normal; }
  .side .big.up { text-transform: uppercase; }
  .side .tick { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #0b1030; font: 900 16px/30px var(--body); display: none; }
  /* выбранная: яркое свечение и белое кольцо; остальные гаснут */
  .side.sel { transform: scale(1.02); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .95), 0 0 46px -4px var(--glow), 0 18px 44px -18px var(--glow); }
  .side.sel .tick { display: block; }
  .sides.picked .side:not(.sel) { opacity: .45; filter: saturate(.6); }
  .side:active:not(:disabled) { transform: scale(.97); }
  .side:disabled { opacity: .5; }

  /* ва-банк: переключатель в стекле над «Готово» */
  .bankrow { flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 52px; border: 1px solid var(--glass-line); border-radius: 18px; background: var(--glass); color: var(--text); font: 700 15px/1.1 var(--body); padding: 6px 14px; transition: border-color .15s, box-shadow .15s, background .15s; }
  .bankrow .sw { flex: none; width: 44px; height: 26px; border-radius: 13px; background: rgba(255, 255, 255, .16); position: relative; transition: background .15s; }
  .bankrow .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .12s; }
  .bankrow[aria-pressed="true"] { border-color: #fff; background: rgba(255, 255, 255, .12); box-shadow: 0 0 28px -8px var(--c2); }
  .bankrow[aria-pressed="true"] .sw { background: linear-gradient(100deg, var(--c3), var(--c1)); }
  .bankrow[aria-pressed="true"] .sw::after { transform: translateX(18px); background: #fff; }
  .bankslot { flex: none; display: none; min-height: 52px; }
  @media (min-height: 640px) { .bankslot { display: block; } }

  .done { flex: none; width: 100%; min-height: 60px; border: 0; border-radius: 20px; background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3)); color: #0a0a0f; font: 900 clamp(17px, 5vw, 22px)/1 var(--display); letter-spacing: .05em; text-transform: uppercase; box-shadow: 0 22px 60px -22px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45); transition: transform .08s, opacity .15s; }
  .done:active:not(:disabled) { transform: scale(.98); }
  .done:disabled { background: var(--glass); color: rgba(244, 242, 255, .55); box-shadow: none; border: 2px solid rgba(255, 255, 255, .28); }

  /* ждём остальных: показываем свой выбор тем же цветом */
  .mine { position: relative; flex: 1 1 auto; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 24px; color: #0b1030; text-align: center; padding: 12px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 18px 50px -20px var(--glow, transparent); }
  .mine.a { background: linear-gradient(135deg, var(--side-a), var(--side-a2)); --glow: var(--side-a); }
  .mine.b { background: linear-gradient(135deg, var(--side-b), var(--side-b2)); --glow: var(--side-b); }
  .mine .sm { font: 700 13px/1 var(--body); text-transform: uppercase; letter-spacing: .06em; opacity: .92; }
  .mine .big { font: 900 clamp(26px, 10vw, 44px)/1.05 var(--display); max-width: 100%; }
  .mine .big.up { text-transform: uppercase; }
  .mine .ico { position: absolute; top: 12px; left: 12px; width: 32px; height: 32px; border-radius: 50%; background: #0b1030; color: #fff; font: 900 16px/32px var(--display); text-align: center; }
  .mine .x2 { background: #fff; color: #0b1030; border-radius: 10px; padding: 4px 12px; font: 900 15px/1.1 var(--display); }
  .count { flex: none; text-align: center; font: 600 15px/1.2 var(--body); color: var(--muted); background: var(--glass); border: 1px solid var(--glass-line); border-radius: 16px; padding: 12px; }
  .count b { font: 900 20px/1 var(--display); color: var(--text); }

  /* плашка опоздавшего / ожидания / паузы */
  .note { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 22px; padding: 18px 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .note h2 { font-size: clamp(19px, 6vw, 26px); }

  /* вход */
  .signcode { align-self: center; text-align: center; font: 900 clamp(28px, 11vw, 44px)/1 var(--display); letter-spacing: .08em; padding: 4px 0 2px; background: linear-gradient(100deg, var(--c3), var(--c1) 55%, var(--c2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; max-width: 100%; white-space: nowrap; }
  input.field { width: 100%; border: 1px solid var(--glass-line); border-radius: 18px; background: var(--glass); color: var(--text); font: 600 20px/1.2 var(--body); padding: 15px 16px; outline: none; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  input.field::placeholder { color: rgba(244, 242, 255, .4); }
  input.field:focus { border-color: var(--c3); box-shadow: 0 0 0 3px rgba(34, 211, 238, .22); }
  .err { min-height: 18px; font-weight: 700; font-size: 14px; color: var(--bad); text-align: center; }
  ol.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: r; }
  ol.rules li { counter-increment: r; position: relative; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 16px; padding: 9px 12px 9px 46px; font: 500 14px/1.3 var(--body); color: var(--muted); }
  ol.rules li::before { content: counter(r); position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--c1), var(--c2)); color: #0a0a0f; font: 900 13px/26px var(--display); text-align: center; }

  .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 58px; border: 0; border-radius: 20px; background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3)); color: #0a0a0f; font: 900 clamp(15px, 4.4vw, 19px)/1.1 var(--display); letter-spacing: .05em; text-transform: uppercase; box-shadow: 0 22px 60px -22px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45); padding: 12px; text-align: center; text-decoration: none; transition: transform .08s, opacity .15s; }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: var(--glass); color: var(--text); border: 1px solid var(--glass-line); box-shadow: none; font-size: clamp(14px, 4vw, 16px); }
  .link { background: none; border: 0; min-height: 44px; padding: 8px 12px; font-weight: 700; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; display: block; margin: 0 auto; }

  /* лобби */
  .me-badge { display: flex; align-items: center; gap: 12px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; padding: 10px 14px; }
  .av { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--pc, var(--glass-hi)); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); display: grid; place-items: center; font-size: 22px; font-style: normal; line-height: 1; }
  .me-badge b { font: 700 18px/1.15 var(--display); overflow-wrap: anywhere; min-width: 0; }
  .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; list-style: none; margin: 0; padding: 0; }
  .plist li { display: flex; align-items: center; gap: 8px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 14px; padding: 5px 8px; font: 600 13px/1.1 var(--body); min-width: 0; }
  .plist li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .av { width: 26px; height: 26px; font-size: 14px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35); }
  .plist li.me { border-color: rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .12); }
  .plist li.off { opacity: .5; }

  /* интро финала */
  .plank { align-self: stretch; border-radius: 22px; text-align: center; padding: 16px 10px; color: #0a0a0f; background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3)); box-shadow: 0 22px 60px -22px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45); font: 900 clamp(26px, 9.5vw, 42px)/1.05 var(--display); text-transform: uppercase; overflow-wrap: anywhere; }

  /* результат */
  .ticket { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 26px; padding: 16px 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .ticket .eyebrow { font: 700 12px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .ticket h2 { font-size: clamp(20px, 6.6vw, 28px); overflow-wrap: anywhere; }
  .ticket .gain { font: 900 clamp(52px, 18vw, 76px)/1 var(--display); font-variant-numeric: tabular-nums; }
  .ticket.ok { border-color: rgba(52, 211, 153, .45); box-shadow: 0 0 60px -26px var(--ok); }
  .ticket.bad { border-color: rgba(251, 113, 133, .45); box-shadow: 0 0 60px -26px var(--bad); }
  /* раскол: нейтрально-белая рамка и пополам синее/оранжевое свечение — как на доске */
  .ticket.split { border-color: rgba(255, 255, 255, .55); box-shadow: -26px 0 60px -34px var(--side-a), 26px 0 60px -34px var(--side-b); }
  .ticket.split h2, .ticket.split .gain { background: linear-gradient(90deg, var(--side-a2), #fff 50%, var(--side-b2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
  .ticket.ok .gain, .ticket.ok h2 { color: var(--ok); }
  .ticket.bad .gain, .ticket.bad h2 { color: var(--bad); }
  .ticket .line { font: 500 14px/1.3 var(--body); margin: 0; color: var(--muted); }
  .ticket .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .tag { background: rgba(255, 255, 255, .12); color: var(--text); border: 1px solid rgba(255, 255, 255, .4); border-radius: 999px; padding: 4px 11px; font: 700 13px/1.2 var(--body); }
  .tag.ill { background: linear-gradient(100deg, var(--c1), var(--c2)); color: #0a0a0f; border: 0; font: 900 15px/1.2 var(--display); }
  .scorebar { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 18px; padding: 12px 16px; font: 600 14px/1.1 var(--body); color: var(--muted); }
  .scorebar b { font: 900 20px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--text); }

  /* лобби: код комнаты и список игроков */
  .lobcode .eyebrow { font: 700 12px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .lobcode .signcode { letter-spacing: .02em; }
  .roster { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 22px; padding: 14px; min-height: 0; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .roster-h { display: flex; justify-content: space-between; align-items: baseline; font: 700 12px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .roster-h b { font: 900 15px/1 var(--display); letter-spacing: 0; color: var(--text); }
  .roster .plist { grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; flex: 1 1 auto; }
  .roster .plist li { min-height: 46px; font-size: 15px; padding: 6px 10px; border-radius: 16px; }
  .roster .plist .av { width: 32px; height: 32px; font-size: 18px; }
  .plist li.empty { border-style: dashed; background: transparent; justify-content: center; color: var(--muted); font-size: 22px; }
  /* после «Готово»: кто уже ответил (без выбора) */
  .waitbox { flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; padding: 12px; }
  .waith { display: flex; align-items: center; gap: 8px; font: 700 15px/1.1 var(--body); }

    .skip { min-height: 44px; }
    .opnote { min-height: 0; }

    op_agg: `Προσωπικά: {n} από {m} — {side}`, op_agg_tie: `Προσωπικά: ίσα μοιρασμένοι`,
    score_label: `Το σκορ σου`, place: `{n}η θέση`,
    pause_title: `Περιμένουμε παίκτες`, pause_sub: `Χρειάζονται τουλάχιστον {n} άτομα online. Μη φύγεις`, pause_void: `Δύο ερωτήσεις στη σειρά σχεδόν χωρίς ψήφους. Συνεχίζουμε σε ένα λεπτό — μη φύγεις`,
    final_title: `Αποτελέσματα`, final_paused: `Η παρτίδα διακόπηκε`, final_host: `Ο οικοδεσπότης τερμάτισε την παρτίδα`, final_sub: `Ο οικοδεσπότης μπορεί να ξεκινήσει νέα παρτίδα`,
    aw_crowd: `Μυρίζεται το πλήθος`, aw_crow: `Το μαύρο πρόβατο`, aw_risk: `Ρίσκαρε`, aw_wolf: `Μοναχικός λύκος`,
    pts: `πόντοι`,
    rj_late: `Παίζεις από την επόμενη ερώτηση`, rj_not_vote: `Η ψηφοφορία έκλεισε`, rj_confirmed: `Πάτησες ήδη «Έτοιμο»`,
    rj_pick_first: `Διάλεξε πρώτα πλευρά`, rj_no_banks: `Τέλειωσαν τα all-in`, rj_no_bank_here: `Εδώ δεν υπάρχει all-in`,
    kicked_title: `Ο οικοδεσπότης σε έβγαλε από το δωμάτιο`,
    replaced_title: `Μπήκες από άλλη καρτέλα`, replaced_text: `Εδώ το παιχνίδι είναι σε παύση`, btn_back_here: `Παίξε εδώ`,
    expired_title: `Το δωμάτιο έκλεισε`, expired_text: `Ζει μισή ώρα χωρίς παιχνίδι. Άνοιξε νέο`, expired_new: `Αρχική`,
  },
};
</script>
<script src="crowd-shared.js"></script>
<script src="i18n.js"></script>
<script src="sound-toggle.js" defer></script>
<script>
"use strict";
const params = new URLSearchParams(location.search);
// код идёт в разметку и в запросы — только алфавит кодов (слово + цифры 2–9)
const cleanCode = (s) => String(s || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const CODE = cleanCode(params.get("r"));
const app = document.getElementById("app");
const T = (k) => wvT(k);
const tpl = (k, v) => wvTpl(k, v);
const tokenKey = () => "crowd_token_" + CODE;

let conn = null, state = null, me = null, token = null, dead = false;
let screen = null, screenKey = "";
let joinErr = null;
let blockUntil = 0; // кнопки «Мнения» молчат 400 мс после смены фазы
let prevPhase = null;
let ov = null; // то, что игрок только что нажал: показываем сразу, не дожидаясь снимка
try { token = localStorage.getItem(tokenKey()); } catch (e) {}

const player = (id) => state && state.players.find((p) => p.id === id);
const mine = () => (state && me ? player(me) : null);
const avHtml = (p) => `<i class="av" style="--pc:${p.color}">${escapeHtml(p.avatar)}</i>`;
const roundKey = () => (state && state.round ? [state.game, state.n, state.round.kind, state.round.q.id].join(":") : "");
const sideLabel = (q, s) => (s === "a" ? q.a : s === "b" ? q.b : "");

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), 2400);
}
function setScene(scene) {
  document.body.dataset.scene = scene;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = "#08080c";
}
// пересобираем экран только при смене ключа: иначе кнопка, которую нажимают, исчезает из-под пальца
function show(html, key, mid) {
  if (key === screenKey) return false;
  screenKey = key;
  app.classList.toggle("mid", !!mid);
  app.innerHTML = html;
  fit();
  return true;
}
// вопрос и подписи сторон ужимаются, пока экран не влезет без прокрутки (320×460)
function fit() {
  app.querySelectorAll(".side .big, .mine .big").forEach((h) => {
    h.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(h).fontSize), guard = 0;
    while (h.scrollWidth > h.clientWidth + 1 && fs > 12 && guard++ < 40) { fs -= 1; h.style.fontSize = fs + "px"; }
    if (h.scrollWidth > h.clientWidth + 1) h.style.overflowWrap = "anywhere";
  });
  app.querySelectorAll(".signcode").forEach((h) => {
    h.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(h).fontSize), guard = 0;
    while (h.scrollWidth > h.clientWidth + 1 && fs > 14 && guard++ < 40) { fs -= 1; h.style.fontSize = fs + "px"; }
  });
  const q = app.querySelector(".q");
  if (q) {
    q.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(q).fontSize), guard = 0;
    while (document.documentElement.scrollHeight > innerHeight + 1 && fs > 13 && guard++ < 40) { fs -= 1; q.style.fontSize = fs + "px"; }
  }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
window.addEventListener("resize", () => { if (document.activeElement && document.activeElement.tagName === "INPUT") return; fit(); });

// экран не гаснет, пока идёт игра
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && me) keepAwake(); });

// ---------- то, что игрок нажал, пока снимок в пути ----------
function setOv(field, v) {
  if (!ov || ov.key !== roundKey()) ov = { key: roundKey() };
  ov[field] = { v, t: performance.now() };
}
function eff(field) {
  const p = state && state.me;
  if (ov && ov.key === roundKey() && ov[field] && performance.now() - ov[field].t < 1200) return ov[field].v;
  return p ? p[field] : null;
}

// ---------- вход ----------
function renderEnter() {
  screen = "enter";
  setScene("day");
  setFrame(false);
  let saved = "";
  try { saved = localStorage.getItem("crowd-name") || ""; } catch (e) {}
  const html = `<form id="enterform" autocomplete="off" style="display:grid;gap:10px">
    ${CODE ? `<div class="signcode">${escapeHtml(CODE)}</div>` : `<input class="field" id="code" maxlength="12" autocapitalize="characters" placeholder="${escapeHtml(T("code_ph"))}" aria-label="${escapeHtml(T("code_ph"))}">`}
    <h1 style="font-size:clamp(24px,8vw,32px);text-align:center">${escapeHtml(T("enter_title"))}</h1>
    <input class="field" id="name" maxlength="15" placeholder="${escapeHtml(T("enter_ph"))}" value="${escapeHtml(saved)}" enterkeyhint="go" aria-label="${escapeHtml(T("enter_ph"))}">
    <div class="err" id="err">${joinErr ? escapeHtml(T(joinErr)) : ""}</div>
    <button class="btn" type="submit">${escapeHtml(T("btn_join"))}</button>
    ${CODE ? "" : `<button class="btn ghost" id="create" type="button">${escapeHtml(T("btn_create"))}</button>`}
    <ol class="rules"><li>${escapeHtml(T("rule1"))}</li><li>${escapeHtml(T("rule2"))}</li><li>${escapeHtml(T("rule3"))}</li></ol>
  </form>`;
  screenKey = "";
  show(html, "enter", true);
  const input = document.getElementById("name");
  const createBtn = document.getElementById("create");
  if (createBtn) createBtn.onclick = async () => {
    const err = document.getElementById("err");
    createBtn.disabled = true;
    createBtn.textContent = T("btn_creating");
    try {
      const res = await fetch("/crowd/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: wvLang() } }) });
      const data = await res.json();
      if (!res.ok) throw new Error("create");
      try { localStorage.setItem("crowd-host-" + data.code, data.hostToken); } catch (e2) {}
      location.href = "crowd-board.html?r=" + encodeURIComponent(data.code);
    } catch (e2) {
      createBtn.disabled = false;
      createBtn.textContent = T("btn_create");
      err.textContent = T("err_create");
    }
  };
  document.getElementById("enterform").onsubmit = (e) => {
    e.preventDefault();
    const name = input.value.trim();
    const err = document.getElementById("err");
    if (!CODE) {
      const c = cleanCode(document.getElementById("code").value);
      if (!c) { err.textContent = T("err_code"); return; }
      if (name) { try { localStorage.setItem("crowd-name", name); } catch (e2) {} }
      location.href = "crowd.html?r=" + encodeURIComponent(c);
      return;
    }
    if (!name) { err.textContent = T("err_name"); return; }
    try { localStorage.setItem("crowd-name", name); } catch (e2) {}
    joinErr = null;
    conn.send({ type: "join", name });
    keepAwake();
  };
}

function renderCenter(titleKey, textKey, extra, key) {
  setScene("day");
  setFrame(false);
  show(`<div class="note"><h2>${escapeHtml(T(titleKey))}</h2>${textKey ? `<p class="lede">${escapeHtml(T(textKey))}</p>` : ""}${extra || ""}</div>`, key || "c:" + titleKey, true);
}
function renderExpired() {
  dead = true;
  screen = "expired";
  try { localStorage.removeItem(tokenKey()); } catch (e) {}
  renderCenter("expired_title", "expired_text", `<a class="btn" href="index.html">${escapeHtml(T("expired_new"))}</a>`);
}

function setFrame(on) { document.getElementById("frame").classList.toggle("on", !!on); }

// ---------- общие куски ----------
const bannerHtml = () => `<div class="banner">${T("banner")}</div>`;
function metaHtml(r) {
  let left;
  if (r.kind === "extra") left = escapeHtml(T("q_extra"));
  else if (r.kind === "decider") left = escapeHtml(T("q_decider"));
  else left = escapeHtml(tpl("q_of", { n: r.num, m: state.total }));
  const x2 = r.mult === 2 ? `<i>${escapeHtml(T("x2"))}</i>` : "";
  return `<div class="meta" id="meta"><span>${left}${x2}</span><b id="tsec"></b></div><div class="timer" id="timer"><i></i></div>`;
}
const qHtml = (r, cls) => `<h2 class="q ${cls || ""}">${escapeHtml(r.q.q)}</h2>`;
const isYn = (q) => q.kind !== "ab";
// значок стороны не зависит от цвета: ✔ / ✖ для «да / нет», А / Б для выбора
const iconOf = (q, s) => (isYn(q) ? (s === "a" ? "✔" : "✖") : T(s === "a" ? "ab_a" : "ab_b"));

// ---------- лобби ----------
function renderLobby() {
  setScene("day");
  setFrame(false);
  const p = mine();
  const list = state.players.filter((x) => !x.left);
  const need = Math.max(0, state.minPlayers - list.length);
  const html = `<div class="me-badge">${avHtml(p)}<div style="min-width:0"><div class="fine">${escapeHtml(T("lobby_in"))}</div><b>${escapeHtml(p.name)}</b></div></div>
    <div class="note lobcode" style="flex:0 0 auto"><div class="eyebrow">${escapeHtml(T("code_ph"))}</div><div class="signcode">${escapeHtml(CODE)}</div><h2>${escapeHtml(T("lobby_wait"))}</h2><p class="fine" id="lobnote"></p></div>
    <section class="roster"><div class="roster-h"><span>${escapeHtml(T("lobby_players"))}</span><b id="lobcnt"></b></div><ul class="plist" id="plist"></ul></section>
    <button class="link" id="leave" type="button">${escapeHtml(T("btn_leave"))}</button>`;
  show(html, "lobby");
  document.getElementById("lobnote").textContent = need ? tpl("lobby_need", { n: need }) : T("lobby_look");
  document.getElementById("lobcnt").textContent = list.length + " / 12";
  const ul = document.getElementById("plist");
  const empties = Math.max(need, 8 - list.length);
  ul.innerHTML = list.map((x) => `<li class="${x.id === me ? "me" : ""} ${x.online ? "" : "off"}">${avHtml(x)}<span>${escapeHtml(x.name)}</span></li>`).join("") +
    Array.from({ length: Math.min(empties, 8) }, () => `<li class="empty"><span>+</span></li>`).join("");
  document.getElementById("leave").onclick = leave;
}
function leave() {
  conn.send({ type: "leave" });
  try { localStorage.removeItem(tokenKey()); } catch (e) {}
  token = null; me = null; screen = "left";
  renderCenter("left_title", null, `<a class="btn" href="index.html">${escapeHtml(T("btn_home"))}</a><button class="link" onclick="location.reload()">${escapeHtml(T("btn_join"))}</button>`, "left");
}

// ---------- заставка финала ----------
function renderIntro() {
  setScene("day");
  setFrame(false);
  const r = state.round;
  const key = "intro:" + roundKey();
  const title = T(r.kind === "final" ? "intro_final" : r.kind === "extra" ? "intro_extra" : "intro_decider");
  let sub;
  if (r.kind === "final") sub = T("intro_final_sub");
  else if (r.kind === "extra") sub = T("intro_extra_sub");
  else {
    const only = r.only || [];
    sub = only.includes(me) ? T("intro_decider_in") : tpl("intro_decider_out", { names: wvNames(only, player) });
  }
  if (show(`<div class="plank">${escapeHtml(title)}</div><h2 class="q">${escapeHtml(r.q.q)}</h2><p class="lede center">${escapeHtml(sub)}</p>`, key, true)) wvSfx.fanfare();
}

// ---------- голосование ----------
function renderVote() {
  setScene("day");
  const r = state.round, p = state.me, q = r.q;
  const play = p.inRound;
  const confirmed = play && eff("confirmed");
  const showBank = play && r.bankAllowed && p.banks > 0;
  const mode = !play ? "late" : confirmed ? "wait" : "play";
  const key = `vote:${roundKey()}:${mode}:${showBank ? 1 : 0}`;
  let html = bannerHtml() + metaHtml(r);
  if (mode === "late") {
    html += qHtml(r, "sm") + `<div class="note"><h2>${escapeHtml(T("late_title"))}</h2><p class="lede">${escapeHtml(T("late_sub"))}</p></div>`;
  } else if (mode === "wait") {
    html += qHtml(r, "sm") +
      `<div class="mine" id="mine"><span class="ico" id="mineico" aria-hidden="true"></span><span class="sm">${escapeHtml(T("picked"))}</span><span class="big ${isYn(q) ? "up" : ""}" id="minelab"></span><span class="x2" id="minex2" hidden>${escapeHtml(T("bank_chip"))}</span></div>
       <div class="waitbox"><div class="waith"><span class="pulse"></span>${escapeHtml(T("wait_others"))}</div><div class="rdy" id="rdy"></div><div class="count" id="count"></div></div>`;
  } else {
    html += qHtml(r) +
      `<div class="sides" id="sides">` +
      ["a", "b"].map((s) => `<button class="side ${s}" type="button" data-s="${s}"><span class="ico" aria-hidden="true">${escapeHtml(iconOf(q, s))}</span><span class="sm">${escapeHtml(T(isYn(q) ? "say_yn" : "say_ab"))}</span><span class="big ${isYn(q) ? "up" : ""}">${escapeHtml(sideLabel(q, s))}</span><span class="tick">✓</span></button>`).join("") +
      `</div>` +
      (showBank ? `<button class="bankrow" id="bank" type="button" aria-pressed="false"><span class="sw"></span><span>${escapeHtml(tpl("bank_row", { n: p.banks }))}</span></button>` : `<div class="bankslot"></div>`) +
      `<button class="done" id="done" type="button" disabled>${escapeHtml(T("btn_done"))}</button>`;
  }
  const fresh = show(html, key);
  if (fresh && mode === "play") bindVote();
  patchVote(mode);
  if (fresh) fit();
}
function bindVote() {
  app.querySelectorAll(".side").forEach((b) => {
    b.onclick = () => {
      const s = b.dataset.s;
      if (eff("vote") !== s) { setOv("vote", s); wvSfx.tap(); try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} conn.send({ type: "vote", side: s }); }
      patchVote("play");
    };
  });
  const bank = document.getElementById("bank");
  if (bank) bank.onclick = () => {
    const on = !eff("bank");
    setOv("bank", on);
    (on ? wvSfx.bank : wvSfx.tap)();
    conn.send({ type: "bank", on });
    patchVote("play");
  };
  document.getElementById("done").onclick = () => {
    if (!eff("vote") || eff("confirmed")) return;
    setOv("confirmed", true);
    wvSfx.lock();
    wvVibrate(25);
    conn.send({ type: "confirm" });
    renderVote();
  };
}
function patchVote(mode) {
  const vote = eff("vote"), bank = !!eff("bank");
  setFrame(mode !== "late" && bank);
  if (mode === "play") {
    const sides = document.getElementById("sides");
    sides.classList.toggle("picked", !!vote);
    sides.querySelectorAll(".side").forEach((b) => b.classList.toggle("sel", b.dataset.s === vote));
    const bk = document.getElementById("bank");
    if (bk) bk.setAttribute("aria-pressed", bank ? "true" : "false");
    document.getElementById("done").disabled = !vote;
  } else if (mode === "wait") {
    const mineEl = document.getElementById("mine");
    mineEl.className = "mine " + (vote || "a");
    document.getElementById("minelab").textContent = sideLabel(state.round.q, vote);
    document.getElementById("mineico").textContent = vote ? iconOf(state.round.q, vote) : "";
    document.getElementById("minex2").hidden = !bank;
    const r = state.round;
    const ready = r.ready || [];
    document.getElementById("rdy").innerHTML = (r.voters || []).map((id) => { const pl = player(id); return pl ? `<i class="rv ${ready.includes(id) ? "on" : ""}" style="--pc:${pl.color}" title="${escapeHtml(pl.name)}">${escapeHtml(pl.avatar)}<em>✓</em></i>` : ""; }).join("");
    document.getElementById("count").innerHTML = escapeHtml(tpl("ready", { n: "\u0001", m: (r.voters || []).length })).replace("\u0001", `<b>${(r.ready || []).length}</b>`);
  }
}

// ---------- «А сам-то ты?» ----------
function renderOpinion() {
  setScene("op");
  setFrame(false);
  const r = state.round, p = state.me, q = r.q;
  const asked = p.asked;
  const answered = asked && p.opinion;
  const key = `op:${roundKey()}:${asked ? (answered ? "sent" : "ask") : "wait"}`;
  const noteTxt = escapeHtml(T("op_note"));
  let html;
  if (asked && !answered) {
    html = `<div class="oplate">${escapeHtml(T("op_plate"))}</div>${metaHtml(r)}${qHtml(r, "sm")}
      <button class="skip" id="skip" type="button" data-s="skip">${escapeHtml(T("op_skip"))}</button>
      <div class="sides" id="sides">` +
      ["a", "b"].map((s) => `<button class="side ${s}" type="button" data-s="${s}"><span class="ico" aria-hidden="true">${escapeHtml(iconOf(q, s))}</span><span class="big ${isYn(q) ? "up" : ""}">${escapeHtml(tpl("op_me", { side: sideLabel(q, s) }))}</span></button>`).join("") +
      `</div><div class="opnote">${noteTxt}</div>`;
  } else if (asked) {
    html = `<div class="oplate">${escapeHtml(T("op_plate"))}</div>${metaHtml(r)}
      <div class="note"><h2>${escapeHtml(T("op_sent"))}</h2><p class="lede" id="opw"></p></div>`;
  } else {
    html = `<div class="oplate">${escapeHtml(T("op_plate"))}</div>${metaHtml(r)}
      <div class="note"><h2>${escapeHtml(T("op_wait"))}</h2><p class="lede">${escapeHtml(T("op_wait_sub"))}</p><p class="fine" id="opw"></p></div>`;
  }
  const fresh = show(html, key);
  if (fresh && asked && !answered) {
    // двойной тап по «Готово» не должен отправить мнение: 400 мс после смены фазы кнопки глухие
    const btns = app.querySelectorAll(".side, .skip");
    const wait = blockUntil - performance.now();
    if (wait > 0) {
      btns.forEach((b) => { b.disabled = true; });
      setTimeout(() => btns.forEach((b) => { b.disabled = false; }), wait);
    }
    btns.forEach((b) => {
      b.onclick = () => {
        if (b.disabled || performance.now() < blockUntil) return;
        btns.forEach((x) => { x.disabled = true; });
        wvSfx.tap();
        conn.send({ type: "opinion", side: b.dataset.s });
      };
    });
  }
  const opw = document.getElementById("opw");
  if (opw) opw.textContent = tpl("op_count", { n: r.answered || 0, m: r.askN || 0 });
}

// ---------- раскрытие и счёт ----------
const fmtGain = (g) => (g > 0 ? "+" + g : g < 0 ? "−" + -g : "0");
function placeOf(p) {
  const list = state.players.filter((x) => !x.left);
  return wvRank(list, p);
}
function renderResult() {
  setScene("day");
  setFrame(false);
  const r = state.round, res = r.result, p = state.me, q = r.q, self = mine();
  const key = "res:" + roundKey();
  const vote = p.vote;
  let tone = "", title, gain = null, lines = [], tags = [], sound = null;
  const only = r.only;
  const obs = only && !only.includes(me);
  if (!p.inRound) {
    title = T("late_title");
  } else if (res.void) {
    title = T("res_void");
    if (p.bankBack) tags.push(T("tag_bank_back"));
  } else if (obs) {
    title = tpl("res_obs", { names: wvNames(only, player) });
  } else if (!vote) {
    title = T("res_novote"); gain = p.gain != null ? p.gain : 0; tone = "";
  } else if (res.tie) {
    title = T("res_split"); gain = p.gain; tone = "split"; sound = "strain"; lines.push(T("res_split_sub"));
  } else if (res.unanimous) {
    title = T("res_one"); gain = p.gain; tone = "ok"; sound = "chord"; lines.push(T("res_one_sub"));
  } else if (vote === res.side) {
    title = T("res_major"); gain = p.gain; tone = "ok"; sound = "win";
  } else {
    title = T("res_miss"); gain = p.gain; tone = gain < 0 ? "bad" : ""; sound = "womp";
  }
  if (res.void) lines.push("");
  if (!res.void && p.inRound) {
    if (!res.tie) lines.push(tpl("res_maj", { side: sideLabel(q, res.side), k: Math.max(res.a, res.b), n: res.cast }));
    if (vote && !obs) lines.push(tpl("res_you", { side: sideLabel(q, vote) }));
    if (res.banked && res.banked[me]) tags.push(T("tag_bank"));
    if (p.bankBack) tags.push(T("tag_bank_back"));
    if (r.mult === 2) tags.push(T("tag_mult"));
    const o = res.opinions;
    if (o && o.a + o.b > 0) lines.push(o.a === o.b ? T("op_agg_tie") : tpl("op_agg", { n: Math.max(o.a, o.b), m: o.a + o.b, side: sideLabel(q, o.a > o.b ? "a" : "b") }));
  }
  const ill = res.illusion
    ? `<span class="tag ill">${escapeHtml(T("illusion"))}</span><p class="line">${escapeHtml(tpl("illusion_sub", { v: sideLabel(q, res.illusion.vote), o: sideLabel(q, res.illusion.opinion) }))}</p>` : "";
  const html = `<div class="ticket ${tone}">
      <h2>${escapeHtml(title)}</h2>
      ${gain != null ? `<div class="gain">${escapeHtml(fmtGain(gain))}</div>` : ""}
      ${tags.length ? `<div class="tags">${tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
      ${lines.filter(Boolean).map((l) => `<p class="line">${escapeHtml(l)}</p>`).join("")}
      ${ill}
    </div>
    <div class="scorebar"><span>${escapeHtml(T("score_label"))}</span><span><b id="myscore"></b> · <span id="myplace"></span></span></div>`;
  const fresh = show(html, key, true);
  document.getElementById("myscore").textContent = self.score;
  document.getElementById("myplace").textContent = tpl("place", { n: placeOf(self) });
  if (fresh) {
    if (sound && wvSfx[sound]) wvSfx[sound]();
    if (res.illusion) setTimeout(() => wvSfx.pop(), 450);
    if (gain) wvVibrate(gain > 0 ? 40 : [30, 40, 30]);
  }
}

// ---------- пауза и итоги ----------
function renderPause() {
  setScene("day");
  setFrame(false);
  // все на связи, а пауза — значит, два вопроса подряд аннулированы
  const vd = state.players.filter((x) => !x.left && x.online).length >= state.minPlayers;
  show(`<div class="note"><h2>${escapeHtml(T("pause_title"))}</h2><p class="lede">${escapeHtml(vd ? T("pause_void") : tpl("pause_sub", { n: state.minPlayers }))}</p><p class="fine" id="psec"></p></div>`, "pause:" + vd, true);
}
function renderFinal() {
  setScene("day");
  setFrame(false);
  const self = mine();
  const place = placeOf(self);
  const sub = state.finishedReason === "paused" ? T("final_paused") : state.finishedReason === "host" ? T("final_host") : T("final_sub");
  const aw = state.awards || {};
  const mineAw = ["crowd", "crow", "risk", "wolf"].filter((k) => aw[k] && aw[k].ids.includes(me));
  const icons = { crowd: "🎯", crow: "🐦‍⬛", risk: "🎲", wolf: "🐺" };
  const list = state.players.filter((x) => !x.left);
  const top = Math.max(...list.map((x) => x.score));
  const gap = top - self.score;
  const sorted = list.slice().sort((x, y) => y.score - x.score);
  let rows = sorted.slice(0, 5);
  if (!rows.includes(self)) rows = rows.slice(0, 4).concat([self]);
  const board = rows.map((x) => `<li class="${x.id === me ? "me" : ""}"><span class="rk">${wvRank(list, x)}</span>${avHtml(x)}<span class="nm">${escapeHtml(x.name)}</span><b>${x.score}</b></li>`).join("");
  const html = `<div class="ticket"><div class="eyebrow">${escapeHtml(T("final_title"))}</div>
      <div class="place">${escapeHtml(tpl("place", { n: place }))}</div>
      <p class="lede">${escapeHtml(self.avatar)} ${escapeHtml(self.name)} · <b>${self.score}</b> ${escapeHtml(T("pts"))}</p>
      <span class="tag">${escapeHtml(gap > 0 ? tpl("final_gap", { n: gap + " " + T("pts") }) : T("final_leader"))}</span>
      ${mineAw.length ? `<div class="awards">${mineAw.map((k) => `<span class="tag">${icons[k]} ${escapeHtml(T("aw_" + k))}</span>`).join("")}</div>` : ""}
      <p class="fine">${escapeHtml(sub)}</p></div>
    <ol class="standings">${board}</ol>
    <button class="btn ghost" id="leave" type="button">${escapeHtml(T("btn_leave"))}</button>`;
  if (show(html, "finished:" + state.game, true)) { if (place === 1 && state.finishedReason === "done") wvSfx.fanfare(); document.getElementById("leave").onclick = leave; }
}

// ---------- выбор экрана ----------
function render() {
  if (dead || !state) return;
  if (!me) {
    if (token) return; // входим по токену — не мигаем экраном входа
    if (screen === "kicked" || screen === "replaced" || screen === "left") return;
    if (screen === "enter") return;
    return renderEnter();
  }
  const p = mine();
  if (!p || p.left || !state.me) return; // снимок с нами ещё в пути, либо нас убрали (скажет kicked)
  screen = "game";
  switch (state.phase) {
    case "lobby": return renderLobby();
    case "intro": return renderIntro();
    case "vote": return renderVote();
    case "opinion": return renderOpinion();
    case "reveal": case "scores": {
      if (!(state.round && state.round.result)) return undefined;
      // итог не раньше, чем доска закончит раскрытие: иначе телефон выдаёт то, что все смотрят на экране.
      // Аннулированный раунд раскрывать нечего — показываем сразу.
      if (state.phase === "reveal" && !state.round.result.void && wvNow() < state.phaseEnd - 300) {
        return renderCenter("watch_title", "watch_sub", "", "watch");
      }
      return renderResult();
    }
    case "pause": return renderPause();
    case "finished": return renderFinal();
  }
}

// таймер фазы: полоска и секунды; последние 5 с краснеют и тикают
let lastTickSec = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead || !state.phaseEnd) return;
  const left = state.phaseEnd - wvNow();
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  if (screenKey === "watch" && state.phase === "reveal" && left <= 300) render();
  const bar = document.getElementById("timer");
  if (bar) {
    bar.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`;
    bar.classList.toggle("hot", left < 5000 && state.phase === "vote");
  }
  const ts = document.getElementById("tsec");
  if (ts) {
    ts.textContent = tpl("sec", { s: Math.max(0, Math.ceil(left / 1000)) });
    document.getElementById("meta").classList.toggle("hot", left < 5000 && state.phase === "vote");
  }
  const ps = document.getElementById("psec");
  if (ps) ps.textContent = tpl("sec", { s: Math.max(0, Math.ceil(left / 1000)) });
  if (state.phase === "vote" && left < 5000 && left > 0) {
    const sec = Math.ceil(left / 1000);
    if (sec !== lastTickSec) { lastTickSec = sec; wvSfx.tick(true); }
  }
}

window.addEventListener("langchange", () => {
  if (screen === "enter") return renderEnter();
  screenKey = "";
  if (screen === "expired") return renderExpired();
  if (screen === "kicked" || screen === "replaced" || screen === "left") return;
  if (!state) return renderCenter("wait_title");
  render();
});

// ---------- связь ----------
function onMessage(m) {
  switch (m.type) {
    case "hello":
    case "state":
      state = m.state;
      if (m.type === "hello" && token && !me) conn.send({ type: "join", token });
      if (state.phase !== prevPhase) {
        prevPhase = state.phase;
        blockUntil = performance.now() + 400;
        if (state.phase === "vote") wvVibrate(30);
        if (state.phase === "opinion" && state.me && state.me.asked) wvVibrate(40);
      }
      render();
      break;
    case "joined":
      me = m.playerId;
      token = m.token;
      joinErr = null;
      try { localStorage.setItem(tokenKey(), token); } catch (e) {}
      keepAwake();
      screen = null;
      screenKey = "";
      render();
      break;
    case "rejected":
      ov = null;
      if (T("rj_" + m.reason) !== "rj_" + m.reason) toast(T("rj_" + m.reason));
      screenKey = "";
      render();
      break;
    case "error":
      if (m.error === "room_expired") return renderExpired();
      if (["room_full", "token_gone", "bad_name", "name_taken"].includes(m.error)) {
        if (m.error === "token_gone") { try { localStorage.removeItem(tokenKey()); } catch (e) {} token = null; }
        joinErr = m.error === "bad_name" ? "err_name" : "err_" + m.error;
        me = null;
        renderEnter();
      }
      break;
    case "kicked":
      me = null;
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
      token = null;
      screen = "kicked";
      renderCenter("kicked_title");
      break;
    case "replaced":
      me = null;
      screen = "replaced";
      renderCenter("replaced_title", "replaced_text", `<button class="btn" id="here" type="button">${escapeHtml(T("btn_back_here"))}</button>`);
      document.getElementById("here").onclick = () => { conn.send({ type: "join", token }); };
      break;
  }
}

function start() {
  if (!CODE) return renderEnter();
  renderCenter("wait_title");
  const banner = document.getElementById("conn");
  conn = wvConnect({
    code: CODE,
    onMessage,
    onGone: renderExpired,
    // переподключились — снова входим своим токеном (hello придёт первым)
    onOpen: () => { me = null; },
    onState: (st) => { banner.textContent = T("err_connect"); banner.classList.toggle("on", st === "lost"); },
  });
  requestAnimationFrame(frame);
  // ручка для стенда: состояние и отправка
  window.wvPhone = { send: (msg) => conn.send(msg), get state() { return state; }, get me() { return me; } };
}
start();
</script>
