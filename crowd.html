<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0d0f">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1faa2.svg" type="image/svg+xml">
<title>Как все — игра для компании: угадай, что скажет большинство</title>
<meta name="robots" content="index,follow">
<meta name="description" content="🪢 Мультиплеерная игра для компании: на общем экране вопрос, а ты отвечаешь не за себя, а за всех — что выберет большинство? Угадал — очки. Бесплатно, в браузере, с телефонов." data-i18n-meta="_meta">
<!-- ссылки на комнаты (?r=КОД) — та же страница: в выдаче должна быть одна, без кода -->
<link rel="canonical" href="https://randomhost.online/crowd.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Как все — игра для компании">
<meta property="og:description" content="Вопрос на экране, а ты угадываешь, что ответит большинство. Бесплатно, в браузере, с телефонов.">
<meta property="og:url" content="https://randomhost.online/crowd.html">
<meta property="og:image" content="https://randomhost.online/og-image.png">
<meta property="og:site_name" content="Рандомайзер Онлайн">
<meta property="og:locale" content="ru_RU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="crowd-theme.css">
<style>
  /* Пульт «Как все» — плакат референдума: плоские блоки на чёрном, у каждой панели толстая линейка сверху,
     две стороны — жёлтая (тёмный текст) и синяя (белый текст). Ни стекла, ни градиентов, ни свечения.
     Стороны различимы и без цвета: значок ✔ / ✖ или буква А / Б в углу кнопки. Токены — в crowd-theme.css. */
  :root {
    --lang-switch-bg: var(--panel);
    --lang-switch-border: var(--line);
    --lang-switch-fg: var(--muted);
    --lang-switch-active-bg: var(--paper);
    --lang-switch-active-fg: var(--bg);
    --lang-switch-active-border: var(--paper);
    --lang-switch-font: var(--body);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--text); font: 500 16px/1.3 var(--body); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }

  /* единая верхняя панель: всё высотой 44px и в одну линию, на каждом экране одинаково */
  .util { display: flex; align-items: center; gap: 8px; height: 52px; padding: 8px calc(var(--lsw, 150px)) 0 12px; position: relative; z-index: 3; }
  .util a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap; flex: none; height: 44px; min-width: 44px; padding: 0 16px; border: 2px solid var(--line); border-radius: var(--r); background: transparent; display: inline-flex; align-items: center; justify-content: center; }
  @media (max-width: 400px) { .util a { font-size: 0; padding: 0; width: 44px; } .util a::before { content: "←"; font-size: 22px; } }
  .sound-toggle-btn { flex: none; margin: 0; width: 44px; height: 44px; border: 2px solid var(--line); border-radius: var(--r); background: transparent; color: var(--text); font-size: 16px; display: grid; place-items: center; padding: 0; }
  /* переключатель языка из i18n.js: ровно 44px, тот же центр по вертикали */
  .lang-switch { top: 8px !important; right: 12px !important; height: 44px !important; padding: 3px !important; box-sizing: border-box !important; align-items: center; border-radius: var(--r) !important; }
  .conn { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); z-index: 30; background: var(--paper); color: var(--bg); font-weight: 800; font-size: 14px; padding: 8px 14px; border-radius: var(--r); visibility: hidden; white-space: nowrap; }
  .conn.on { visibility: visible; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 30; background: var(--paper); color: var(--bg); font-weight: 800; font-size: 15px; padding: 10px 16px; border-radius: var(--r); max-width: calc(100% - 32px); text-align: center; visibility: hidden; }
  .toast.on { visibility: visible; }
  /* подсказка «Язык комнаты: EN. Переключить?» (U-17, класс A): плоская плита внизу, кнопки 44px */
  .langhint { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 31; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; background: var(--paper); color: var(--bg); border-radius: var(--r); font-weight: 800; font-size: 15px; }
  .langhint[hidden] { display: none; }
  .langhint span { flex: 1 1 160px; min-width: 0; }
  .langhint button { min-height: 44px; min-width: 44px; padding: 0 14px; border: 2px solid var(--bg); border-radius: var(--r); background: transparent; color: var(--bg); font-weight: 800; font-size: 15px; }
  .langhint button.yes { background: var(--bg); color: var(--paper); }

  /* рамка по краю экрана, пока включён ва-банк */
  #frame { position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0; transition: opacity .15s; box-shadow: inset 0 0 0 6px var(--hot); }
  #frame.on { opacity: 1; }

  #app { position: relative; z-index: 2; max-width: 520px; margin: 0 auto; padding: 2px 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; min-height: calc(100dvh - 52px); }
  #app > * { min-width: 0; }
  #app.mid { justify-content: center; }
  #app.mid .note { flex: 0 0 auto; margin-bottom: 0; }
  #app.mid .ticket { flex: 0 1 auto; padding: 24px 14px; }

  h1, h2 { margin: 0; font-family: var(--display); font-weight: 900; line-height: 1.05; letter-spacing: -.02em; }
  .lede { font-size: 16px; font-weight: 500; margin: 0; color: var(--muted); }
  .fine { font-size: 14px; font-weight: 500; margin: 0; color: var(--muted); }
  .center { text-align: center; }
  .eyebrow { font: 800 12px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }

  /* «Угадай, что скажет БОЛЬШИНСТВО» — подпись над вопросом */
  .banner { flex: none; text-align: center; color: var(--muted); font: 600 13px/1.2 var(--body); }
  .banner b { font: 900 1em/1 var(--display); letter-spacing: .08em; color: var(--a); }
  .meta { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 800 12px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: -2px; }
  .meta b { font: 900 22px/1 var(--display); letter-spacing: 0; font-variant-numeric: tabular-nums; min-width: 3.4ch; text-align: right; display: inline-block; color: var(--text); }
  .meta > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta i { font-style: normal; background: var(--hot); color: #fff; border-radius: var(--r); padding: 3px 7px; margin-left: 8px; font-weight: 900; letter-spacing: .04em; }
  /* таймер — рулетка: полоса со шкалой делений */
  .timer { flex: none; height: 14px; background: var(--panel2); position: relative; overflow: hidden; }
  .timer i { position: absolute; inset: 0; background: var(--paper); transform-origin: left; }
  .timer::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--bg) calc(10% - 2px) 10%); }
  .timer.hot i { background: var(--hot); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .5; } }
  .meta.hot b { color: var(--hot); }

  /* вопрос: плита с линейкой сверху */
  .q { flex: none; background: var(--panel); border-top: 6px solid var(--paper); padding: 14px 14px 15px; font: 900 clamp(17px, 5.6vw, 24px)/1.12 var(--display); letter-spacing: -.015em; overflow-wrap: anywhere; text-wrap: balance; text-align: left; }
  .q.sm { font-size: clamp(15px, 4.6vw, 19px); }

  /* стороны: две большие плоские плиты; a слева (жёлтая), b справа (синяя) — места не меняются */
  .sides { flex: 1 1 auto; min-height: 112px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .side { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 6px; border: 0; border-radius: var(--r); padding: 44px 10px 12px; text-align: left; min-width: 0; min-height: 112px;
    transition: transform .08s, opacity .15s; }
  .side.a { background: var(--a); color: var(--a-ink); --ink: var(--a-ink); }
  .side.b { background: var(--b); color: var(--b-ink); --ink: var(--b-ink); }
  .side .ico { position: absolute; top: 10px; left: 10px; width: 30px; height: 30px; border-radius: var(--r); background: var(--ink); color: var(--a); font: 900 15px/30px var(--display); text-align: center; }
  .side.b .ico { color: var(--b); }
  .side .sm { font: 800 12px/1.15 var(--body); text-transform: uppercase; letter-spacing: .1em; opacity: .75; }
  .side .big { font: 900 clamp(22px, 8.4vw, 36px)/1.02 var(--display); letter-spacing: -.02em; max-width: 100%; overflow-wrap: normal; word-break: normal; }
  .side .big.up { text-transform: uppercase; }
  .side .tick { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paper); font: 900 16px/30px var(--body); text-align: center; display: none; }
  /* выбранная: белая рамка вокруг плиты; остальные гаснут */
  .side.sel { box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--paper); transform: translateY(-2px); z-index: 1; }
  .side.sel .tick { display: block; }
  .sides.picked .side:not(.sel) { opacity: .4; }
  .side:active:not(:disabled) { transform: scale(.97); }
  .side:disabled { opacity: .5; }

  /* ва-банк: переключатель над «Готово» */
  .bankrow { flex: none; display: flex; align-items: center; justify-content: flex-start; gap: 12px; width: 100%; min-height: 52px; border: 2px solid var(--line); border-radius: var(--r); background: transparent; color: var(--text); font: 700 15px/1.1 var(--body); padding: 6px 14px; text-align: left; transition: border-color .15s, background .15s; }
  .bankrow .bt { min-width: 0; }
  .bankrow .bh { display: block; font: 700 12px/1.2 var(--body); color: var(--hot); margin-top: 3px; }
  /* тумблер — плашка с текстом «ВЫКЛ» / «ВКЛ»: состояние видно без догадок о цвете и положении */
  .bankrow .sw { flex: none; min-width: 62px; height: 30px; padding: 0 8px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: var(--r); background: transparent; color: var(--muted); font: 900 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; transition: background .15s, color .15s, border-color .15s; }
  .bankrow[aria-pressed="true"] { border-color: var(--hot); background: rgba(255, 74, 28, .12); }
  .bankrow[aria-pressed="true"] .sw { background: var(--hot); border-color: var(--hot); color: #fff; }
  .bankslot { flex: none; display: none; min-height: 52px; }
  @media (min-height: 640px) { .bankslot { display: block; } }

  .done { flex: none; width: 100%; min-height: 60px; border: 0; border-radius: var(--r); background: var(--paper); color: var(--bg); font: 900 clamp(17px, 5vw, 22px)/1 var(--display); letter-spacing: .04em; text-transform: uppercase; transition: transform .08s, opacity .15s; }
  .done:active:not(:disabled) { transform: translateY(2px); }
  .done:disabled { background: transparent; color: rgba(244, 241, 232, .5); border: 2px solid var(--line); }

  /* ждём остальных: показываем свой выбор той же плитой */
  .mine { position: relative; flex: 1 1 auto; min-height: 120px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 6px; border-radius: var(--r); text-align: left; padding: 58px 14px 14px; }
  .mine.a { background: var(--a); color: var(--a-ink); --ink: var(--a-ink); }
  .mine.b { background: var(--b); color: var(--b-ink); --ink: var(--b-ink); }
  .mine .sm { font: 800 13px/1 var(--body); text-transform: uppercase; letter-spacing: .1em; opacity: .75; }
  .mine .big { font: 900 clamp(26px, 10vw, 44px)/1.02 var(--display); letter-spacing: -.02em; max-width: 100%; }
  .mine .big.up { text-transform: uppercase; }
  .mine .ico { position: absolute; top: 12px; left: 12px; width: 32px; height: 32px; border-radius: var(--r); background: var(--ink); color: var(--a); font: 900 16px/32px var(--display); text-align: center; }
  .mine.b .ico { color: var(--b); }
  .mine .x2 { position: absolute; top: 12px; right: 12px; background: var(--hot); color: #fff; padding: 4px 10px; border-radius: var(--r); font: 900 15px/1.1 var(--display); }
  .count { flex: none; text-align: center; font: 600 15px/1.2 var(--body); color: var(--muted); background: var(--panel); border-top: 4px solid var(--line); padding: 12px; }
  .count b { font: 900 20px/1 var(--display); color: var(--text); }

  /* плашка опоздавшего / ожидания / паузы */
  .note { flex: 1 1 auto; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 10px; text-align: left; background: var(--panel); border-top: 6px solid var(--paper); padding: 20px 16px; }
  .note h2 { font-size: clamp(22px, 7vw, 30px); }
  #app.mid .note, .note .btn { align-self: stretch; }
  .note.lobcode { align-items: flex-start; }

  /* вход: одна колонка сверху вниз — кто ты, куда идёшь, действия, правила */
  .enter { display: flex; flex-direction: column; gap: 14px; }
  .enter-h { display: grid; gap: 8px; padding-top: 6px; }
  .enter-h .gname { font: 900 13px/1 var(--display); text-transform: uppercase; letter-spacing: .16em; color: var(--a); display: flex; align-items: center; gap: 10px; }
  .enter-h .gname::before { content: ""; width: 38px; height: 8px; background: linear-gradient(90deg, var(--a) 0 50%, var(--b) 50% 100%); flex: none; }
  .enter-h h1 { font-size: clamp(30px, 10.5vw, 44px); line-height: 1; }
  .fld { display: grid; gap: 6px; }
  .fld > span { font: 800 12px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  input.field { width: 100%; border: 0; border-bottom: 3px solid var(--paper); border-radius: 0; background: var(--panel); color: var(--text); font: 700 22px/1.2 var(--body); padding: 14px 14px; outline: none; }
  input.field::placeholder { color: rgba(244, 241, 232, .32); font-weight: 600; }
  input.field:focus { background: var(--panel2); border-bottom-color: var(--a); }
  input.field.code { text-transform: uppercase; letter-spacing: .1em; }
  .fld.cnt-on { position: relative; }
  .fld.cnt-on input.field { padding-right: 58px; }
  .fld .cnt { position: absolute; right: 12px; bottom: 15px; font: 800 12px/1 var(--body); letter-spacing: .06em; color: var(--muted); pointer-events: none; }
  .fld .cnt[data-state="full"] { color: var(--bad); }
  .claimbtns { display: grid; gap: 10px; align-self: stretch; margin-top: 6px; }
  .signcode { align-self: stretch; font: 900 clamp(28px, 11vw, 44px)/1 var(--display); letter-spacing: .06em; padding: 12px 14px; background: var(--paper); color: var(--bg); max-width: 100%; white-space: nowrap; }
  .err { min-height: 18px; margin: -6px 0; font-weight: 800; font-size: 14px; color: var(--bad); }
  .or { display: flex; align-items: center; gap: 12px; font: 800 12px/1 var(--body); text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }
  .or::before, .or::after { content: ""; flex: 1; height: 2px; background: var(--line); }
  ol.rules { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 0; counter-reset: r; border-top: 2px solid var(--line); }
  ol.rules li { counter-increment: r; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; padding: 11px 0; border-bottom: 2px solid var(--line); font: 500 14px/1.3 var(--body); color: var(--muted); }
  ol.rules li::before { content: counter(r); font: 900 26px/.9 var(--display); color: var(--a); }
  ol.rules li:nth-child(2)::before { color: var(--b-text); }
  ol.rules li:nth-child(3)::before { color: var(--hot); }

  .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; border: 0; border-radius: var(--r); background: var(--paper); color: var(--bg); font: 900 clamp(16px, 4.6vw, 20px)/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; padding: 12px; text-align: center; text-decoration: none; transition: transform .08s, opacity .15s; }
  .btn:active:not(:disabled) { transform: translateY(2px); }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: transparent; color: var(--text); border: 2px solid var(--paper); font-size: clamp(14px, 4vw, 16px); }
  .link.leave { position: sticky; bottom: 0; z-index: 4; background: var(--bg); width: 100%; margin-top: auto; }
  .link { background: none; border: 0; min-height: 44px; padding: 8px 12px; font-weight: 700; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; display: block; margin: 0 auto; }

  /* лобби */
  .me-badge { display: flex; align-items: center; gap: 12px; background: var(--panel); border-left: 6px solid var(--pc, var(--paper)); padding: 10px 14px; }
  .av { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--panel2); border: 3px solid var(--pc, var(--line)); display: grid; place-items: center; font-size: 22px; font-style: normal; line-height: 1; }
  .me-badge b { font: 800 18px/1.15 var(--display); overflow-wrap: anywhere; min-width: 0; }
  .avbtn { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; font: inherit; color: inherit; line-height: 0; flex: none; }
  .avpick { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .avpick button { aspect-ratio: 1; border: 0; border-radius: var(--r); background: var(--panel2); font-size: 22px; line-height: 1; padding: 0; cursor: pointer; }
  .avpick button.on { box-shadow: 0 0 0 3px var(--paper); }
  .avpick button:disabled { opacity: .3; cursor: default; }
  @media (max-width: 360px) { .avpick { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; list-style: none; margin: 0; padding: 0; }
  .plist li { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-left: 5px solid var(--pc, var(--line)); padding: 5px 8px; font: 700 13px/1.1 var(--body); min-width: 0; }
  .plist li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .av { width: 26px; height: 26px; font-size: 14px; border-width: 2px; }
  .plist li.me { background: var(--paper); color: var(--bg); }
  .plist li.off { opacity: .5; }

  /* интро финала */
  .plank { align-self: stretch; text-align: left; padding: 18px 14px; color: var(--a-ink); background: var(--a); border-radius: var(--r); font: 900 clamp(26px, 9.5vw, 42px)/1 var(--display); letter-spacing: -.02em; text-transform: uppercase; overflow-wrap: anywhere; }

  /* результат */
  .ticket { flex: 1 1 auto; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; text-align: left; background: var(--panel); border-top: 6px solid var(--paper); padding: 18px 14px; }
  .ticket .eyebrow { color: var(--muted); }
  .ticket h2 { font-size: clamp(20px, 6.6vw, 28px); overflow-wrap: anywhere; }
  .ticket .gain { font: 900 clamp(60px, 21vw, 92px)/.9 var(--display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .ticket.ok { border-top-color: var(--ok); }
  .ticket.bad { border-top-color: var(--bad); }
  /* раскол: линейка пополам жёлтая / синяя */
  .ticket.split { border-image: linear-gradient(90deg, var(--a) 0 50%, var(--b) 50% 100%) 1; border-top-width: 6px; }
  .ticket.ok .gain, .ticket.ok h2 { color: var(--ok); }
  .ticket.bad .gain, .ticket.bad h2 { color: var(--bad); }
  .ticket .line { font: 500 14px/1.3 var(--body); margin: 0; color: var(--muted); }
  .ticket .tags { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; }
  .tag { background: transparent; color: var(--text); border: 2px solid var(--line); border-radius: var(--r); padding: 3px 9px; font: 800 13px/1.2 var(--body); }
  .tag.me { background: var(--paper); color: var(--bg); border-color: var(--paper); }
  .tag.ill { background: var(--hot); color: #fff; border: 0; font: 900 15px/1.2 var(--display); }
  .scorebar { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel); border-left: 6px solid var(--paper); padding: 12px 16px; font: 700 14px/1.1 var(--body); color: var(--muted); }
  .scorebar b { font: 900 20px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--text); }

  /* лобби: код комнаты и список игроков */
  .lobcode .eyebrow { font: 800 12px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .lobcode .signcode { letter-spacing: .02em; }

<script>
"use strict";
const params = new URLSearchParams(location.search);
// код идёт в разметку и в запросы — только алфавит кодов (слово + цифры 2–9)
const cleanCode = (s) => String(s || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const CODE = cleanCode(params.get("r"));
const app = document.getElementById("app");
const T = (k) => wvT(k);
const tpl = (k, v) => wvTpl(k, v);
const tokenKey = () => "crowd_token_" + CODE;

let conn = null, state = null, me = null, token = null, dead = false;
let screen = null, screenKey = "";
let joinErr = null;
// вход по имени (T-W1-06): MP.joinFlow («Это ты?», тихие повторы), счётчик имени, «ты открыл игру в другой вкладке»
let flow = null, tab = null, langFollow = null;
let joinName = ""; // имя, с которым входим: из формы либо сохранённое — уходит вместе с токеном
let claimPrompt = null; // {name, summary, accept, decline}: открытый экран «Это ты?»
let waitPhase = null; // «имя занято в секретной фазе»: повторим вход, когда фаза сменится
const NAME_LIMIT = () => (window.MP && MP.limits && MP.limits.name) || 15;
const mpOn = () => !!(window.MP && !MP.off);
function buildJoin() {
  const m = { type: "join" };
  if (joinName) m.name = joinName;
  if (token) m.token = token;
  return m;
}
// все входы идут одним путём; без mp-common (или при MP_OFF) — прежнее сообщение без caps
function doJoin(extra) {
  if (flow && flow.join(extra)) return;
  const m = buildJoin();
  if (extra) for (const k in extra) m[k] = extra[k];
  conn.send(m);
}
let blockUntil = 0; // кнопки «Мнения» молчат 400 мс после смены фазы
let prevPhase = null;
let ov = null; // то, что игрок только что нажал: показываем сразу, не дожидаясь снимка
try { token = localStorage.getItem(tokenKey()); } catch (e) {}

const player = (id) => state && state.players.find((p) => p.id === id);
const mine = () => (state && me ? player(me) : null);
const avHtml = (p) => `<i class="av" style="--pc:${p.color}">${escapeHtml(p.avatar)}</i>`;
const roundKey = () => (state && state.round ? [state.game, state.n, state.round.kind, state.round.q.id].join(":") : "");
const sideLabel = (q, s) => (s === "a" ? q.a : s === "b" ? q.b : "");

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), 2400);
}
function setScene(scene) {
  document.body.dataset.scene = scene;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = "#0d0d0f";
}
// пересобираем экран только при смене ключа: иначе кнопка, которую нажимают, исчезает из-под пальца
function show(html, key, mid) {
  if (key === screenKey) return false;
  screenKey = key;
  app.classList.toggle("mid", !!mid);
  app.innerHTML = html;
  fit();
  return true;
}
// вопрос и подписи сторон ужимаются, пока экран не влезет без прокрутки (320×460)
function fit() {
  app.querySelectorAll(".side .big, .mine .big").forEach((h) => {
    h.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(h).fontSize), guard = 0;
    while (h.scrollWidth > h.clientWidth + 1 && fs > 12 && guard++ < 40) { fs -= 1; h.style.fontSize = fs + "px"; }
    if (h.scrollWidth > h.clientWidth + 1) h.style.overflowWrap = "anywhere";
  });
  app.querySelectorAll(".signcode").forEach((h) => {
    h.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(h).fontSize), guard = 0;
    while (h.scrollWidth > h.clientWidth + 1 && fs > 14 && guard++ < 40) { fs -= 1; h.style.fontSize = fs + "px"; }
  });
  const q = app.querySelector(".q");
  if (q) {
    q.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(q).fontSize), guard = 0;
    while (document.documentElement.scrollHeight > innerHeight + 1 && fs > 13 && guard++ < 40) { fs -= 1; q.style.fontSize = fs + "px"; }
  }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
window.addEventListener("resize", () => { if (document.activeElement && document.activeElement.tagName === "INPUT") return; fit(); });

// экран не гаснет, пока идёт игра
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && me) keepAwake(); });

// ---------- единый коалесцер тапов: vote и bank уходят не чаще 4 раз в секунду (лимит сервера CMD_RATE = 5) ----------
// Последнее значение по типу не теряется; «Готово» не режется (сервер её не считает) и перед отправкой сбрасывает хвост коалесцера.
const CO_GAP_MS = 250;
const co = { last: 0, timer: null, pend: {} };
const want = { key: null, vote: null, bank: null }; // что игрок хочет: по нему повторяем после отказа по частоте
let rateTries = 0, rateTimer = null;
function coSend(msg) {
  co.pend[msg.type] = msg;
  coPump();
}
function coPump() {
  clearTimeout(co.timer); co.timer = null;
  const types = Object.keys(co.pend);
  if (!types.length) return;
  const wait = co.last + CO_GAP_MS - Date.now();
  if (wait > 0) { co.timer = setTimeout(coPump, wait); return; }
  const t = types[0];
  const m = co.pend[t];
  delete co.pend[t];
  co.last = Date.now();
  conn.send(m);
  if (types.length > 1) co.timer = setTimeout(coPump, CO_GAP_MS);
}
function coFlushNow() {
  clearTimeout(co.timer); co.timer = null;
  for (const t of Object.keys(co.pend)) { const m = co.pend[t]; delete co.pend[t]; conn.send(m); }
  co.last = Date.now();
}
function noteWant(field, v) {
  if (want.key !== roundKey()) { want.key = roundKey(); want.vote = null; want.bank = null; rateTries = 0; }
  want[field] = v;
}
// после «rejected rate»: повторяем актуальное желание, если сервер его ещё не принял
function retryWant() {
  rateTimer = null;
  const mc = state && state.me;
  if (!mc || state.phase !== "vote" || mc.confirmed || want.key !== roundKey()) { rateTries = 0; return; }
  let sent = false;
  if (want.vote && mc.vote !== want.vote) { coSend({ type: "vote", side: want.vote }); sent = true; }
  if (want.bank != null && !!mc.bank !== want.bank) { coSend({ type: "bank", on: want.bank }); sent = true; }
  if (!sent) rateTries = 0;
}

// ---------- то, что игрок нажал, пока снимок в пути ----------
function setOv(field, v) {
  if (!ov || ov.key !== roundKey()) ov = { key: roundKey() };
  ov[field] = { v, t: performance.now() };
}
function eff(field) {
  const p = state && state.me;
  // идёт повтор после отказа по частоте: показываем желание игрока, а не прежнюю сторону сервера — иначе кнопка «перескакивает»
  if (rateTries > 0 && (field === "vote" || field === "bank") && want.key === roundKey() && want[field] != null) return want[field];
  if (ov && ov.key === roundKey() && ov[field] && performance.now() - ov[field].t < 1200) return ov[field].v;
  return p ? p[field] : null;
}

// ---------- вход ----------
function renderEnter() {
  screen = "enter";
  setScene("day");
  setFrame(false);
  let saved = "";
  try { saved = localStorage.getItem("crowd-name") || ""; } catch (e) {}
  // сверху вниз: что за игра и кто ты → в какую комнату → действие → «или» создать свою → правила
  const codeBlock = CODE
    ? `<div class="fld"><span>${escapeHtml(T("room_label"))}</span><div class="signcode">${escapeHtml(CODE)}</div></div>`
    : `<label class="fld"><span>${escapeHtml(T("code_ph"))}</span><input class="field code" id="code" maxlength="12" autocapitalize="characters" autocomplete="off" aria-label="${escapeHtml(T("code_ph"))}"></label>`;
  const html = `<form id="enterform" class="enter" autocomplete="off">
    <header class="enter-h"><div class="gname">${escapeHtml(T("game_name"))}</div><h1>${escapeHtml(T("enter_title"))}</h1></header>
    <label class="fld"><span>${escapeHtml(T("enter_ph"))}</span><input class="field" id="name"${mpOn() ? "" : ' maxlength="15"'} value="${escapeHtml(saved)}" enterkeyhint="go" aria-label="${escapeHtml(T("enter_ph"))}"></label>
    ${codeBlock}
    <div class="err" id="err" role="alert">${joinErr ? escapeHtml(T(joinErr)) : ""}</div>
    <button class="btn" type="submit">${escapeHtml(T("btn_join"))}</button>
    ${CODE ? "" : `<div class="or">${escapeHtml(T("or"))}</div><button class="btn ghost" id="create" type="button">${escapeHtml(T("btn_create"))}</button>`}
    <ol class="rules"><li>${escapeHtml(T("rule1"))}</li><li>${escapeHtml(T("rule2"))}</li><li>${escapeHtml(T("rule3"))}</li></ol>
  </form>`;
  screenKey = "";
  show(html, "enter", true);
  const input = document.getElementById("name");
  if (mpOn() && input) {
    // «12/15» у поля, когда осталось ≤ 4 знака; срез по символам (эмодзи не рвётся) — вместо молчаливого maxlength
    const fld = input.closest(".fld"), cnt = document.createElement("em");
    cnt.className = "cnt";
    fld.classList.add("cnt-on");
    fld.appendChild(cnt);
    MP.nameCounter(input, NAME_LIMIT(), { el: cnt });
  }
  const createBtn = document.getElementById("create");
  if (createBtn) createBtn.onclick = async () => {
    const err = document.getElementById("err");
    createBtn.disabled = true;
    createBtn.textContent = T("btn_creating");
    try {

function bindVote() {
  app.querySelectorAll(".side").forEach((b) => {
    b.onclick = () => {
      const s = b.dataset.s;
      if (eff("vote") !== s) { setOv("vote", s); noteWant("vote", s); wvSfx.tap(); wvVibrate(15); coSend({ type: "vote", side: s }); }
      patchVote("play");
    };
  });
  const bank = document.getElementById("bank");
  if (bank) bank.onclick = () => {
    const on = !eff("bank");
    setOv("bank", on);
    noteWant("bank", on);

    coSend({ type: "bank", on });
    patchVote("play");
  };
  document.getElementById("done").onclick = () => {
    if (!eff("vote") || eff("confirmed")) return;
    setOv("confirmed", true);
    wvSfx.lock();
    wvVibrate(25);
    coFlushNow(); // хвост голоса/ва-банка уходит раньше «Готово»: порядок на сервере важен

    renderVote();
  };
}
function patchVote(mode) {

  if (mode === "play") {
    const sides = document.getElementById("sides");

    const bsw = document.getElementById("bsw");

    document.getElementById("done").disabled = !vote;
  } else if (mode === "late") {

    document.getElementById("count").innerHTML = escapeHtml(tpl("ready", { n: "\u0001", m: (r.voters || []).length })).replace("\u0001", `<b>${(r.ready || []).length}</b>`);
  }
}

function renderOpinion() {
  setScene("op");

  const answered = asked && p.opinion;
  const skipped = answered && p.opinion === "skip";
  const key = `op:${roundKey()}:${asked ? (answered ? (skipped ? "skip" : "sent") : "ask") : "wait"}`;
  const noteTxt = escapeHtml(T("op_note"));

  if (asked && !answered) {

      <button class="skip" id="skip" type="button" data-s="skip">${escapeHtml(T("op_skip"))}</button>

      <div class="note"><h2>${escapeHtml(skipped ? T("op_sent_skip") : T("op_sent"))}</h2>${skipped ? "" : `<p class="lede">${escapeHtml(tpl("op_me", { side: sideLabel(q, p.opinion) }))}</p>`}<p class="fine" id="opw"></p></div>`;
  } else {
    html = `<div class="oplate">${escapeHtml(T("op_plate"))}</div>${metaHtml(r)}
      <div class="note"><h2>${escapeHtml(T("op_wait"))}</h2><p class="lede">${escapeHtml(T("op_wait_sub"))}</p><p class="fine" id="opw"></p></div>`;
  }
  const fresh = show(html, key);
  if (fresh && asked && !answered) {
    // двойной тап по «Готово» не должен отправить мнение: 400 мс после смены фазы кнопки глухие
    const btns = app.querySelectorAll(".side, .skip");
    const wait = blockUntil - performance.now();
    if (wait > 0) {
      btns.forEach((b) => { b.disabled = true; });
      setTimeout(() => btns.forEach((b) => { b.disabled = false; }), wait);
    }
    btns.forEach((b) => {
      b.onclick = () => {
        if (b.disabled || performance.now() < blockUntil) return;
        btns.forEach((x) => { x.disabled = true; });
        wvSfx.tap();

        // подтверждения нет (связь пропала, пока тап летел) и экран тот же — снова даём ответить
        const k = key;
        setTimeout(() => {
          if (screenKey !== k || !b.isConnected) return;
          btns.forEach((x) => { x.disabled = false; });
        }, 3000);
      };
    });
  }
  const opw = document.getElementById("opw");

}

const fmtGain = (g) => (g > 0 ? "+" + g : g < 0 ? "−" + -g : "0");

function renderResult() {
  setScene("day");
  setFrame(false);
  const r = state.round, res = r.result, p = state.me, q = r.q, self = mine();
  const key = "res:" + roundKey();
  const vote = p.vote;
  let tone = "", title, gain = null, lines = [], tags = [], sound = null;
  const only = r.only;
  const obs = only && !only.includes(me);
  // решающий вопрос без +50 (RULE_U47_CROWD_DECIDER v1/v2): единодушие/ничья очков не дают — подпись честная
  const undecided = !!only && !res.void && Object.keys(res.pts || {}).length > 0 && Object.values(res.pts).every((v) => v === 0);
  if (!p.inRound) {
    title = T("late_title");
  } else if (res.void) {
    title = T(res.replace === false ? "res_void_none" : "res_void");
    if (p.bankBack || p.bankLate) tags.push(T("tag_bank_back"));
  } else if (obs) {
    title = tpl("res_obs", { names: wvNames(only, player) });
  } else if (!vote) {
    title = T("res_novote"); gain = p.gain != null ? p.gain : 0; tone = "";
  } else if (res.tie) {
    title = T("res_split"); gain = p.gain; tone = "split"; sound = "strain"; lines.push(T(undecided ? "res_split_dec" : "res_split_sub"));
  } else if (res.unanimous) {
    title = T("res_one"); gain = p.gain; tone = "ok"; sound = "chord"; lines.push(T(undecided ? "res_one_dec" : "res_one_sub"));
  } else if (vote === res.side) {
    title = T("res_major"); gain = p.gain; tone = "ok"; sound = "win";
  } else {
    title = T("res_miss"); gain = p.gain; tone = gain < 0 ? "bad" : ""; sound = "womp";
  }
  if (res.void && p.inRound) {
    lines.push(T("res_void_sub"));
    if (res.replace && res.replaceNo) lines.push(tpl("res_repl", { k: res.replaceNo, m: res.replaceMax }));
  }
  if (!res.void && p.inRound) {
    if (!res.tie) lines.push(tpl("res_maj", { side: sideLabel(q, res.side), k: Math.max(res.a, res.b), n: res.cast }));
    if (vote && !obs) lines.push(tpl("res_you", { side: sideLabel(q, vote) }));
    if (res.banked && res.banked[me]) tags.push(T("tag_bank"));
    if (p.bankBack) tags.push(T("tag_bank_back"));
    if (p.bankLate) tags.push(T("tag_bank_late"));
    if (r.mult === 2) tags.push(T("tag_mult"));
    const o = res.opinions;
    if (o && o.a + o.b > 0) lines.push(o.a === o.b ? T("op_agg_tie") : tpl("op_agg", { n: Math.max(o.a, o.b), m: o.a + o.b, side: sideLabel(q, o.a > o.b ? "a" : "b") }));
  }
  const ill = res.illusion
    ? `<span class="tag ill">${escapeHtml(T("illusion"))}</span><p class="line">${escapeHtml(tpl("illusion_sub", { v: sideLabel(q, res.illusion.vote), o: sideLabel(q, res.illusion.opinion) }))}</p>` : "";
  const html = `<div class="ticket ${tone}">
      <h2>${escapeHtml(title)}</h2>
      ${gain != null ? `<div class="gain">${escapeHtml(fmtGain(gain))}</div>` : ""}
      ${tags.length ? `<div class="tags">${tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
      ${lines.filter(Boolean).map((l) => `<p class="line">${escapeHtml(l)}</p>`).join("")}
      ${ill}
    </div>
    <div class="scorebar"><span>${escapeHtml(T("score_label"))}</span><span><b id="myscore"></b> · <span id="myplace"></span></span></div>`;
  const fresh = show(html, key, true);
  document.getElementById("myscore").textContent = self.score;
  document.getElementById("myplace").textContent = tpl("place", { n: placeOf(self) });
  if (fresh) {
    if (sound && wvSfx[sound]) wvSfx[sound]();
    if (res.illusion) setTimeout(() => wvSfx.pop(), 450);
    if (gain) wvVibrate(gain > 0 ? 40 : [30, 40, 30]);
  }
}

// ---------- пауза и итоги ----------
function renderPause() {
  setScene("day");
  setFrame(false);
  if (state.pauseReason === "passive") {
    // все на связи, но голосов не набирается: другая причина — и другой текст
    const idle = (state.pauseIdle || []).includes(me);
    show(`<div class="note"><h2>${escapeHtml(T("pause_pt"))}</h2><p class="lede">${escapeHtml(tpl("pause_ps", { n: state.minPlayers }))}</p>${idle ? `<p class="fine">${escapeHtml(T("pause_me"))}</p>` : ""}</div>`, "pause:passive:" + (idle ? 1 : 0), true);
    return;
  }
  show(`<div class="note"><h2>${escapeHtml(T("pause_title"))}</h2><p class="lede">${escapeHtml(tpl("pause_sub", { n: state.minPlayers }))}</p><p class="fine" id="psec"></p></div>`, "pause", true);
}
// ничья на первом месте — «Победу делят», на втором — «Делят 2-е место» (T-W2-37, crowd-010/011; класс A)
function tieLine(list, reason) {
  if (reason !== "done" || list.length < 2) return null;
  const sc = list.map((x) => x.score).sort((a, b) => b - a);
  const names = (arr) => arr.map((x) => x.name).join(", ");
  const w = list.filter((x) => x.score === sc[0]);
  if (w.length >= 2) return { k: "final_shared", names: names(w) };
  const s2 = sc.find((x) => x < sc[0]);
  const w2 = s2 == null ? [] : list.filter((x) => x.score === s2);
  return w2.length >= 2 ? { k: "final_tie2", names: names(w2) } : null;
}
function renderFinal() {
  setScene("day");
  setFrame(false);
  const self = mine();
  const place = placeOf(self);
  const sub = state.finishedReason === "paused" ? T("final_paused") : state.finishedReason === "idle" ? T("final_idle") : state.finishedReason === "host" ? T("final_host") : T("final_sub");
  const aw = state.awards || {};
  const icons = { crowd: "🎯", crow: "🐦‍⬛", risk: "🎲", wolf: "🐺" };
  const list = state.players.filter((x) => !x.left);
  const top = Math.max(...list.map((x) => x.score));
  const gap = top - self.score;
  const sorted = list.slice().sort((x, y) => y.score - x.score);
  const tie = tieLine(list, state.finishedReason);
  // до 5 игроков — все; больше — топ-4 и «я»; если между ними пропущены места — строка «…» (ранги 1, 2, 2, 2, … 6)
  let rows = sorted.slice(0, sorted.length <= 5 ? sorted.length : 4).map((x) => ({ x }));
  const si = sorted.indexOf(self);
  if (si >= rows.length) { if (si > rows.length) rows.push({ gap: true }); rows.push({ x: self }); }
  const board = rows.map((r) => r.gap ? `<li class="gap" aria-hidden="true"><span class="rk">…</span></li>`
    : `<li class="${r.x.id === me ? "me" : ""}"><span class="rk">${wvRank(list, r.x)}</span>${avHtml(r.x)}<span class="nm">${escapeHtml(r.x.name)}</span><b>${r.x.score}</b></li>`).join("");
  // награды вечера — все, свои выделены
  const awAll = ["crowd", "crow", "risk", "wolf"].filter((k) => aw[k] && aw[k].ids && aw[k].ids.length).map((k) => {
    const mineK = aw[k].ids.includes(me);
    const names = aw[k].ids.map((id) => (player(id) || {}).name || "?").join(", ");
    return `<span class="tag${mineK ? " me" : ""}">${icons[k]} ${escapeHtml(T("aw_" + k))}: ${escapeHtml(names)}</span>`;
  }).join("");
  const html = `<div class="finwrap"><div class="ticket"><div class="eyebrow">${escapeHtml(T("final_title"))}</div>
      <div class="place">${escapeHtml(tpl("place", { n: place }))}</div>
      <p class="lede">${escapeHtml(self.avatar)} ${escapeHtml(self.name)} · <b>${self.score}</b> ${escapeHtml(T("pts"))}</p>
      <span class="tag">${escapeHtml(gap > 0 ? tpl("final_gap", { n: gap + " " + T("pts") }) : T("final_leader"))}</span>
      ${awAll ? `<div class="awards">${awAll}</div>` : ""}
      ${tie ? `<p class="fine tieline">${escapeHtml(tpl(tie.k, { names: tie.names }))}</p>` : ""}
      <p class="fine finsub">${escapeHtml(sub)}</p></div>
    <ol class="standings">${board}</ol></div>
    <button class="btn ghost leave" id="leave" type="button">${escapeHtml(T("btn_leave"))}</button>`;
  if (show(html, "finished:" + state.game, true)) { if (place === 1 && state.finishedReason === "done") wvSfx.fanfare(); document.getElementById("leave").onclick = leave; }
}

// ---------- выбор экрана ----------
function render() {
  if (dead || !state) return;
  if (!me) {
    if (token) return; // входим по токену — не мигаем экраном входа
    if (screen === "kicked" || screen === "replaced" || screen === "left" || screen === "claim") return;
    if (screen === "enter") return;
    return renderEnter();
  }
  const p = mine();
  if (!p || p.left || !state.me) return; // снимок с нами ещё в пути, либо нас убрали (скажет kicked)
  screen = "game";
  switch (state.phase) {
    case "lobby": return renderLobby();
    case "intro": return renderIntro();
    case "vote": return renderVote();
    case "opinion": return renderOpinion();
    case "reveal": case "scores": {
      if (!(state.round && state.round.result)) return undefined;
      // итог не раньше, чем доска закончит раскрытие: иначе телефон выдаёт то, что все смотрят на экране.
      // Аннулированный раунд раскрывать нечего — показываем сразу.
      if (state.phase === "reveal" && !state.round.result.void && wvNow() < state.phaseEnd - 300) {
        const pv = state.me && state.me.vote;
        const you = pv && state.me.inRound ? `<span class="tag">${escapeHtml(tpl("watch_you", { side: sideLabel(state.round.q, pv) }))}${state.me.bank ? " · " + escapeHtml(T("watch_x2")) : ""}</span>` : "";
        return renderCenter("watch_title", "watch_sub", you, "watch:" + (pv || "-") + (state.me && state.me.bank ? "x" : ""));
      }
      return renderResult();
    }
    case "pause": return renderPause();
    case "finished": return renderFinal();
  }
}

// таймер фазы: полоска и секунды; последние 5 с краснеют и тикают
let lastTickSec = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead || !state.phaseEnd) return;
  const left = state.phaseEnd - wvNow();
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  if (screenKey === "watch" && state.phase === "reveal" && left <= 300) render();
  const bar = document.getElementById("timer");
  if (bar) {
    bar.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`;
    bar.classList.toggle("hot", left < 5000 && state.phase === "vote");
  }
  const ts = document.getElementById("tsec");
  if (ts) {
    ts.textContent = tpl("sec", { s: Math.max(0, Math.ceil(left / 1000)) });
    document.getElementById("meta").classList.toggle("hot", left < 5000 && state.phase === "vote");
  }
  const wt = document.getElementById("waittx");
  if (wt) {
    const txt = conn && conn.pending && conn.pending() > 0 ? T("sending") : T("wait_others");
    if (wt.textContent !== txt) wt.textContent = txt;
  }
  const ps = document.getElementById("psec");
  if (ps) ps.textContent = tpl("sec", { s: Math.max(0, Math.ceil(left / 1000)) });
  if (state.phase === "vote" && left < 5000 && left > 0) {
    const sec = Math.ceil(left / 1000);
    if (sec !== lastTickSec) { lastTickSec = sec; wvSfx.tick(true); }
  }
}

window.addEventListener("langchange", () => {
  hideLangHint();
  if (screen === "enter") return renderEnter();
  screenKey = "";
  if (screen === "expired") return renderExpired();
  if (screen === "noroom") return renderNoRoom();
  if (screen === "claim") return renderClaim();
  if (screen === "kicked" || screen === "replaced" || screen === "left") return;
  if (!state) return renderCenter("wait_title");
  render();
});

// ---------- связь ----------
let needJoin = true, pendingFlush = false;
// что нажато во время обрыва — отправляем, если ещё актуально (иначе сервер ответил бы «отказ» на давнее действие).
// Очередь живёт до 90 с (MP.sendQueue), поэтому «актуально» = тот же раунд и та же фаза, а не «недавно».
const sentRound = typeof WeakMap === "function" ? new WeakMap() : null; // в каком раунде нажато
function stillWanted(q) {
  const mc = state && state.me;
  if (!mc) return false;
  if (sentRound && sentRound.has(q) && sentRound.get(q) !== roundKey()) return false; // раунд сменился — действие устарело
  switch (q.type) {
    case "vote": case "bank": case "confirm": return state.phase === "vote" && !mc.confirmed;
    case "opinion": return state.phase === "opinion" && !!mc.asked && !mc.opinion;
    case "avatar": return state.phase === "lobby";
    default: return true;
  }
}
// действие нужно, но не ушло (потолок, переполнение): убираем «ушло» с экрана (иначе кнопка мертва, а игрок уверен,
// что нажал) и просим нажать снова. Ненужное (раунд сменился) — молча.
function onDrop(q, why) {
  if (!q || !state || !stillWanted(q)) return;
  if (q.type === "vote" || q.type === "bank" || q.type === "confirm") ov = null;
  toast(T("rj_dropped"));
  screenKey = "";
  render();
}
function flushQueued() {
  conn.flush(stillWanted, onDrop);
}
function onMessage(m) {
  if (mpOn()) {
    if (m.type === "hello" && MP.applyHello(m) === false) { flow = tab = null; } // MP_OFF на сервере: старый протокол
    else if (tab && tab.handle(m)) return;
    else if (flow && flow.handle(m)) return;
  }
  switch (m.type) {
    case "hello":
    case "state":
      state = m.state;
      if (m.type === "hello" && goneFlow) goneFlow.hello();
      checkRoomLang();
      // сервер сказал «имя занято, пока идёт секретная фаза» — входим сами, как только фаза сменилась
      if (waitPhase && !me && state.phase !== waitPhase) { waitPhase = null; joinErr = null; doJoin(); }
      if (rateTries && state.me && (want.vote == null || state.me.vote === want.vote) && (want.bank == null || !!state.me.bank === want.bank)) rateTries = 0;
      if (m.type === "hello" && needJoin && !replacedHere) {
        // вошли по токену — и с именем: если токен протух, сервер найдёт место по имени, а не заведёт безымянного
        if (token) { needJoin = false; joinName = joinName || savedName(); doJoin(); }
        // обрыв на экране «Это ты?»: повторяем join (без claim) — сервер продлевает ожидание, экран не пропадает
        else if (flow && flow.state().prompting) { needJoin = false; flow.resume(); }
      }
      if (state.phase !== prevPhase) {
        prevPhase = state.phase;
        blockUntil = performance.now() + 400;
        if (state.phase === "vote") wvVibrate(30);
        if (state.phase === "opinion" && state.me && state.me.asked) wvVibrate(40);
      }
      render();
      // вернулись по токену: действия, нажатые в обрыв, отправляем, когда сервер снова признал нас
      if (pendingFlush && state.me) { pendingFlush = false; flushQueued(); }
      break;
    case "joined": {
      const was = me;
      me = m.playerId;
      replacedHere = false;
      token = m.token;
      joinErr = null;
      waitPhase = null;
      claimPrompt = null;
      if (m.name) {
        joinName = m.name;
        try { localStorage.setItem("crowd-name", m.name); } catch (e) {}
        if (m.renamed) toast(tpl("renamed_toast", { name: m.name }));
      }
      try { localStorage.setItem(tokenKey(), token); } catch (e) {}
      keepAwake();
      if (was !== me) { screen = null; screenKey = ""; } // повторный вход после обрыва экран не пересобирает — иначе кнопки пропадают из-под пальца
      render();
      pendingFlush = true;
      setTimeout(() => { if (pendingFlush) { pendingFlush = false; flushQueued(); } }, 2000);
      break;
    }
    case "rejected":
      if (m.reason === "rate" && (m.action === "vote" || m.action === "bank") && state && state.phase === "vote" && rateTries < 3) {
        // тихий повтор через 800 мс; выбор игрока на экране не сбрасываем, тост — только если и повтор не прошёл
        rateTries++;
        clearTimeout(rateTimer);
        rateTimer = setTimeout(retryWant, 800);
        break;
      }
      rateTries = 0;
      ov = null;
      if (T("rj_" + m.reason) !== "rj_" + m.reason) toast(T("rj_" + m.reason));
      screenKey = "";
      render();
      break;
    case "error":
      conn.flush(() => false, () => {});
      if (m.error === "room_expired") return onRoomGone();
      if (["room_full", "token_gone", "bad_name", "name_taken"].includes(m.error)) {
        if (m.error === "token_gone") { try { localStorage.removeItem(tokenKey()); } catch (e) {} token = null; }
        joinErr = m.error === "bad_name" ? "err_name" : "err_" + m.error;
        // секретная фаза: имя освободится со сменой фазы — ждём и входим сами
        waitPhase = m.error === "name_taken" && m.retry === true && state ? state.phase : null;
        if (waitPhase) joinErr = "err_name_wait";
        me = null;
        renderEnter();
      }
      break;
    case "kicked":
      conn.flush(() => false, () => {});
      me = null;
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
      token = null;
      screen = "kicked";
      renderCenter("kicked_title", "kicked_text", `<a class="btn" href="index.html">${escapeHtml(T("btn_home"))}</a><button class="link" type="button" onclick="location.reload()">${escapeHtml(T("btn_join"))}</button>`);
      break;
    case "replaced":
      showReplaced();
      break;
  }
}

function start() {
  if (!CODE) return renderEnter();
  renderCenter("wait_title");
  const banner = document.getElementById("conn");
  let netLost = false, netQuiet = false;
  const showNet = () => {
    banner.textContent = T(netLost ? "err_connect" : "conn_lost");
    banner.classList.toggle("on", netLost || netQuiet);
  };
  window.addEventListener("langchange", showNet);
  conn = wvConnect({
    code: CODE,
    onMessage,
    onGone: onRoomGone,
    // переподключились — снова входим своим токеном (hello придёт первым)
    onOpen: () => { needJoin = true; if (token && !replacedHere) conn.gated = true; },
    keep: stillWanted,
    onDrop,
    onSendFail: () => { setTimeout(() => { if (state && state.me) flushQueued(); }, 1200); },
    // «lost» — сокет закрыт, переподключаемся; «quiet» — сокет жив, но молчит дольше 10 с (MP.conn): только предупреждение
    onState: (st) => { netLost = st === "lost"; if (st === "open") netQuiet = false; showNet(); },
    onQuiet: (q) => { netQuiet = !!q; showNet(); },
  });
  // действие помечаем раундом, в котором оно нажато: из очереди оно уйдёт только в нём
  if (sentRound) { const rawSend = conn.send; conn.send = (m) => { if (m && typeof m === "object" && !sentRound.has(m)) sentRound.set(m, roundKey()); return rawSend(m); }; }
  requestAnimationFrame(frame);
  // ручка для стенда: состояние и отправка
  window.wvPhone = { send: (msg) => conn.send(msg), get state() { return state; }, get me() { return me; } };
}
function savedName() { try { return localStorage.getItem("crowd-name") || ""; } catch (e) { return ""; } }
if (window.MP) {
  flow = MP.joinFlow({
    send: (m) => conn.send(m),
    buildJoin,
    onClaimPrompt: (c) => { claimPrompt = c; renderClaim(); },
    // «подождите» не бесконечно: после повторов — обычное «имя занято»
    onGiveUp: () => { joinErr = "err_name_taken"; me = null; renderEnter(); },
  });
  // язык комнаты: подсказка (класс A) или, за флагом, авто-следование; ручной выбор не сбивается
  langFollow = MP.followRoomLang({
    enabled: true,
    auto: !!(MP.rules && MP.rules.RULE_U17_LANG_FOLLOW),
    getRoomLang: () => state && state.settings && state.settings.lang,
    onSuggest: showLangHint,
  });
  tab = MP.replacedTab({
    rejoin: () => doJoin(),
    onReplaced: () => showReplaced(),
    // токен отозван (место вернули с другого устройства): обычный вход по имени
    onTokenGone: () => { try { localStorage.removeItem(tokenKey()); } catch (e) {} token = null; me = null; joinErr = null; if (savedName()) { joinName = savedName(); doJoin(); } else renderEnter(); },
  });
}
start();
</script>
