name: Deploy static site to server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Deploy via rsync
        run: |
          rsync -avz --delete --checksum \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.vscode*' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='auction/state' \
            --exclude='*.md' \
            --exclude='LICENSE' \
            --exclude='/package*.json' \
            --exclude='/pnpm-lock.yaml' \
            --exclude='/yarn.lock' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SERVER_PORT }}" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/randomhostwebsite/

      # Сначала собираем образы, и только потом подменяем контейнеры. Раньше здесь стояло
      # `docker rm -f randomhost && docker compose up -d --build`: сайт лежал всю сборку,
      # а при ошибке сборки оставался лежать совсем — контейнер уже удалён, новый не поднялся.
      - name: Rebuild and restart randomhost
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'cd /opt/randomhostwebsite && docker compose build && docker compose up -d --force-recreate --remove-orphans'

      # Проверка ждёт, пока контейнеры поднимутся, и падает, если сайт или аукцион не отвечают:
      # молчаливый зелёный деплой при лежащем сайте — худший из возможных исходов.
      - name: Post-check
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'docker ps | grep randomhost
             for i in $(seq 1 30); do
               curl -sf http://127.0.0.1:8080/ -o /dev/null && curl -sf http://127.0.0.1:8080/auction/api/health && exit 0
               sleep 2
             done
             echo "сайт или аукцион не отвечают после деплоя"; docker compose -f /opt/randomhostwebsite/docker-compose.yml logs --tail 40; exit 1'