// прибавка «набегает» на табло: числа идут от старого счёта к новому (при reduced-motion — сразу итог)
function countUp() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const nodes = [...main.querySelectorAll(".rowx .s[data-from]")].filter((n) => n.dataset.from !== n.dataset.to);
  if (!nodes.length) return;
  const t0 = performance.now() + 250, dur = 1000;
  nodes.forEach((n) => (n.textContent = n.dataset.from));
  const step = (now) => {
    const k = Math.max(0, Math.min(1, (now - t0) / dur));
    const e = 1 - Math.pow(1 - k, 3);
    nodes.forEach((n) => { if (n.isConnected) n.textContent = Math.round(+n.dataset.from + (n.dataset.to - n.dataset.from) * e); });
    if (k < 1 && nodes[0].isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---------- итоги ----------
function drawFinal() {
  const key = "final:" + state.game + ":" + state.finishedReason + ":" + isHost + qpLang();
  if (viewKey === key) return;
  viewKey = key;
  const list = ranked();
  const top = [list[1], list[0], list[2]];
  const cls = ["p2", "p1", "p3"];
  const award = (label, a) => {
    if (!a) return "";
    const p = player(a.playerId) || { name: "?", avatar: "?" };
    return `<div class="card award"><div class="k">${escapeHtml(label)}</div><div class="q">${qpPromptHtml(a.prompt)}</div>
      <div class="a">${boardAnswerHtml(a)}</div><div class="by">${escapeHtml(p.avatar)} ${escapeHtml(p.name)} · ${escapeHtml(qpVotes(a.votes))}</div></div>`;
  };
  const fast = present().filter((p) => p.avgMs != null).sort((a, b) => a.avgMs - b.avgMs)[0];
  const reason = state.finishedReason === "few" ? T("final_few") : state.finishedReason === "host" ? T("final_host") : "";
  main.innerHTML = `<div class="screen final">
    <div class="panel cast"><h2>${T("final_title")}<span${reason ? "" : ` class="hidden"`}>${escapeHtml(reason)}</span></h2>
      <div class="podium">${top.map((p, i) => (p ? `<div class="step ${cls[i]}" style="--pc:${p.color}">${p.place === 1 ? `<span class="crown" aria-hidden="true">👑</span>` : ""}<i class="av puck">${escapeHtml(p.avatar)}</i><b>${escapeHtml(p.name)}</b><div class="sc">${p.score}</div><div class="col">${escapeHtml(qpPlaceLabel(p))}</div></div>` : `<div class="step"></div>`)).join("")}</div>
      <div class="hostbtns" style="margin-top:auto">${isHost ? `<button class="start" id="again" type="button">${T("btn_again")}</button><button class="ghostbtn" id="tolobby" type="button">${T("btn_lobby")}</button>` : ""}<a class="ghostbtn homebtn" id="homebtn" href="index.html">${T("btn_home")}</a></div>
    </div>
    <div class="awards">${award(T("best"), state.best) || `<div class="card award"><div class="a">${T("no_best")}</div></div>`}
      ${award(T("hint_star"), state.hintStar)}
      ${fast ? `<div class="card award"><div class="k">${T("fastest")}</div><div class="a">${escapeHtml(fast.avatar)} ${escapeHtml(fast.name)}</div><div class="by">${escapeHtml(tpl("avg_s", { s: qpSec(fast.avgMs) }))}</div></div>` : ""}
      <div class="setlist" id="setlist"><div class="k">${T("setlist")}</div>
        <ol class="${list.length > 8 ? "two" : ""}" style="grid-template-rows:repeat(${list.length > 8 ? Math.ceil(list.length / 2) : list.length}, minmax(0, 1fr))">${list.map((p) => `<li><span class="n">${escapeHtml(qpPlaceLabel(p))}</span><i class="av">${escapeHtml(p.avatar)}</i><b>${escapeHtml(p.name)}</b><span class="dots"></span><span class="s">${p.score}</span></li>`).join("")}</ol></div>
    </div></div>`;
  // шрифт сет-листа — по высоте строки: трое — крупно, шестнадцать — мельче, но без обрезки
  const sl = $("setlist");
  if (sl) {
    const ol = sl.querySelector("ol");
    const rowsN = Math.max(1, list.length > 8 ? Math.ceil(list.length / 2) : list.length);
    // и по ширине колонки: номер, значок, очки и точки съедают ~8.5em, имени должно остаться место (на 1024px было «А…»)
    const cols = list.length > 8 ? 2 : 1;
    const colW = (ol.clientWidth - (cols - 1) * 28) / cols;
    const fs = Math.max(13, Math.min(34, Math.floor((ol.clientHeight / rowsN) * 0.5), Math.floor((colW - 24) / 8.5)));
    sl.style.setProperty("--slfs", fs + "px");
  }
  if (isHost) {
    $("again").onclick = () => conn.send({ type: "start" });
    $("tolobby").onclick = () => conn.send({ type: "lobby" });
  }
  // конец шоу: фанфары и дождь конфетти над пьедесталом
  if (state.finishedReason === "done") {
    qpSfx.fanfare();
    setTimeout(() => { if (state && state.phase === "finished") qpConfetti({ mode: "rain", n: 220 }); }, 700);
  }
}

// ---------- кадр: часы ----------
let lastTick = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead || !state.phaseEnd) return;
  const left = state.phaseEnd - qpNow();
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const clock = $("clock");
  const hot = left < 5000 && (state.phase === "answer" || state.phase === "vote");
  if (clock) { clock.textContent = Math.max(0, Math.ceil(left / 1000)); clock.classList.toggle("hot", hot); }
  const tl = $("timeline");
  if (tl) { tl.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`; tl.classList.toggle("hot", hot); }
  if (hot && left > 0) {
    const s = Math.ceil(left / 1000);
    if (s !== lastTick) { lastTick = s; qpSfx.tick(true); }
  }
}

// ---------- отрисовка ----------
function render() {
  if (!state || dead) return;
  const was = viewKey;
  paint();
  if (viewKey !== was) qpConfettiClear();
}
function paint() {
  document.body.dataset.phase = state.phase;
  $("codechip").innerHTML = `<b>${escapeHtml(CODE)}</b>`;
  $("codechip").classList.toggle("hidden", state.phase === "lobby");
  const inGame = !["lobby", "finished"].includes(state.phase);
  $("roundchip").classList.toggle("hidden", !inGame);
  if (inGame && state.roundKey) $("roundchip").innerHTML = `${escapeHtml(tpl("round_n", { n: state.ri + 1 }))} · <b>${escapeHtml(qpRoundName(state.roundKey, state.small))}</b>${state.mult > 1 ? " " + escapeHtml(tpl("mult", { n: state.mult })) : ""}`;
  $("endbtn").classList.toggle("hidden", !(isHost && inGame));
  // «Дальше» — как «время вышло»: заставка, ответы, голосование, раскрытие, табло (К-9: и в фазе ответов)
  const canSkip = isHost && ["intro", "answer", "vote", "reveal", "scores"].includes(state.phase);
  $("skipbtn").classList.toggle("hidden", !canSkip);
  if (!(isHost && inGame)) hostTap.disarm();
  syncHostBtns();
  drawHostbar();
  switch (state.phase) {
    case "lobby": return drawLobby();
    case "intro": return drawIntro();
    case "answer": return drawAnswer();
    case "vote":
    case "reveal": return drawWall();
    case "scores": return drawScores();
    case "finished": return drawFinal();
  }
}
// Команды ведущего, которые нельзя отменить, — двухтактные (MP.twoTap, U-12): первый тап взводит на 3 с, второй выполняет.
// Если mp-common.js не загрузился или выключен — один тап, как раньше. Взведённая — только одна на всю шапку и список.
const hostTap = (window.MP && MP.twoTap && MP.twoTap.create ? MP.twoTap.create : () => ({ tap: () => true, armed: () => null, isArmed: () => false, disarm() {} }))({ armedMs: 3000, onChange: () => syncHostBtns() });
function syncHostBtns() {
  const set = (id, key, label, sure) => {
    const b = $(id);
    if (!b) return;
    const on = hostTap.isArmed(key);
    b.textContent = on ? T(sure) : T(label);
    if (on) b.setAttribute("data-armed", "1"); else b.removeAttribute("data-armed");
  };
  set("endbtn", "end", "btn_end", "end_sure");
  set("skipbtn", "skip", "btn_skip", "skip_sure");
  for (const b of document.querySelectorAll("[data-kick]")) {
    const on = hostTap.isArmed("kick:" + b.dataset.kick);
    b.textContent = on ? T("kick_sure") : "✕";
    if (on) b.setAttribute("data-armed", "1"); else b.removeAttribute("data-armed");
  }
}
$("endbtn").onclick = () => { if (hostTap.tap("end")) conn.send({ type: "end" }); };
$("skipbtn").onclick = () => { if (hostTap.tap("skip")) conn.send({ type: "skip" }); };
document.addEventListener("click", (e) => {
  const b = e.target && e.target.closest ? e.target.closest("[data-kick]") : null;
  if (b && isHost && hostTap.tap("kick:" + b.dataset.kick)) conn.send({ type: "kick", playerId: b.dataset.kick });
});
// ✕ у игрока без связи: виден всегда (а не только при наведении), цель 44 px; в лобби — у любого места при наведении
function kickBtn(p, cls) {
  const on = hostTap.isArmed("kick:" + p.id);
  const x = el("button", cls, on ? T("kick_sure") : "✕");
  x.type = "button";
  x.dataset.kick = p.id;
  x.title = T("kick");
  x.setAttribute("aria-label", T("kick"));
  if (on) x.setAttribute("data-armed", "1");
  return x;
}

// «🔑 Ссылка ведущего»: ключ ведущего живёт только в localStorage этого экрана; кнопка копирует ссылку
// …?r=КОД&h=ТОКЕН в буфер, токен на экране не рисуется. Без mp-common работает как раньше (ссылки нет).
let hostNote = "", hostNoteT = 0, pasteOpen = false, hostLost = false, hostBarKey = "";
const HL = window.MP && MP.hostLink && !MP.off ? MP.hostLink({
  hostKeyFn: hostKey,
  boardPath: "quip-board.html",
  getRoom: () => CODE,
  sendHost: (t) => { if (conn) conn.send({ type: "host", token: t }); },
  onToast: (kind) => {
    if (kind === "copied") setHostNote(T("link_copied"));
    else if (kind === "shared") setHostNote(T("link_shared"));
    else if (kind === "none") setHostNote(T("link_none"));
  },
  prompt: (m, v) => window.prompt(T("link_prompt_hint"), v),
}) : null;
function setHostNote(text) {
  hostNote = text;
  clearTimeout(hostNoteT);
  if (text) hostNoteT = setTimeout(() => { hostNote = ""; drawHostbar(); }, 5000);
  drawHostbar();
}
function hasHostToken() {
  try { return !!localStorage.getItem(hostKey()); } catch (e) { return false; }
}
function drawHostbar() {
  const bar = $("hostbar");
  if (dead || !state || !HL) { bar.innerHTML = ""; hostBarKey = ""; return; }
  const claim = !isHost && (hostLost || !hasHostToken());
  const key = [isHost, hostLost, claim, pasteOpen, hostNote, qpLang()].join("|");
  if (key === hostBarKey) return;
  hostBarKey = key;
  bar.innerHTML = "";
  if (isHost) {
    const lb = el("button", "linkbtn");
    lb.type = "button";
    lb.title = T("host_link");
    lb.setAttribute("aria-label", T("host_link"));
    lb.append("🔑", el("span", "lt", " " + T("host_link")));
    lb.onclick = () => { HL.copy(); };
    bar.append(lb);
  }
  if (claim && hostLost && hasHostToken()) {
    const note = el("span", "note", T("host_lost_msg"));
    const tk = el("button", "linkbtn", T("btn_take"));
    tk.type = "button";
    tk.onclick = () => { HL.take(); };
    bar.append(note, tk);
  } else if (claim) {
    if (pasteOpen) {
      const inp = el("input");
      inp.type = "text";
      inp.placeholder = T("host_paste_ph");
      inp.autocomplete = "off";
      const ok = el("button", "linkbtn", T("btn_ok"));
      ok.type = "button";
      const submit = () => {
        if (!MP.hostLink.parseToken(inp.value)) { setHostNote(T("host_bad")); return; }
        HL.take(Date.now(), inp.value);
        pasteOpen = false;
      };
      ok.onclick = submit;
      inp.onkeydown = (e) => { if (e.key === "Enter") submit(); };
      bar.append(inp, ok);
      setTimeout(() => inp.focus(), 0);
    } else {
      const im = el("button", "linkbtn", T("btn_im_host"));
      im.type = "button";
      im.onclick = () => { pasteOpen = true; drawHostbar(); };
      bar.append(im);
    }
  }
  if (hostNote) bar.append(el("span", "note", hostNote));
}

// имена на доске: целиком, где помещаются. Не влезло — кегль мельче (не ниже 70%), в крайнем случае многоточие + title (T-W3-32)
const FIT_SEL = ".writer b, .rowx b, .step b, .ans .who span, .setlist li b, .seat:not(.empty) b";
function fitNameEl(b) {
  b.style.fontSize = "";
  if (b.clientWidth < 8) return;
  b.title = b.textContent;
  if (b.scrollWidth <= b.clientWidth + 1) return;
  const base = parseFloat(getComputedStyle(b).fontSize) || 20;
  let fs = base;
  while (b.scrollWidth > b.clientWidth + 1 && fs > base * 0.7) { fs -= 1; b.style.fontSize = fs + "px"; }
}
let fitQueued = false;
function fitAllNames() {
  fitQueued = false;
  const bs = document.querySelectorAll(FIT_SEL);
  for (let i = 0; i < bs.length; i++) fitNameEl(bs[i]);
}
function queueFit() { if (!fitQueued) { fitQueued = true; requestAnimationFrame(fitAllNames); } }
if (window.MutationObserver) new MutationObserver(queueFit).observe(document.body, { childList: true, subtree: true, characterData: true });
window.addEventListener("resize", queueFit);

window.addEventListener("resize", () => { fitScreen(); viewKey = ""; if (state) render(); });
window.addEventListener("langchange", () => {
  viewKey = "";
  // язык доски — язык колоды комнаты: в лобби ведущий переключает и вопросы
  if (isHost && state && (state.phase === "lobby" || state.phase === "finished") && state.settings.lang !== qpLang()) conn.send({ type: "settings", settings: { lang: qpLang() } });
  render();
});

// реакции: эмодзи взлетает снизу с именем
function floatReact(playerId, emoji) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const p = player(playerId);
  const f = el("div", "floater");
  f.style.left = (8 + Math.random() * 84) + "vw";
  f.append(el("span", null, emoji), el("small", null, p ? p.name : ""));
  document.body.append(f);
  setTimeout(() => f.remove(), 2700);
}

// ---------- связь ----------
function onMessage(m) {
  switch (m.type) {
    case "hello":
      state = m.state;
      if (goneFlow) goneFlow.hello();
      if (!isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      state = m.state;
      render();
      break;
    case "host_ok":
      isHost = true;
      hostLost = false;
      pasteOpen = false;
      document.body.classList.add("host");
      viewKey = "";
      // язык доски главнее: комнату создали на одном языке, а доску переключили — синхронизируем
      if (state && state.phase === "lobby" && state.settings.lang !== qpLang()) conn.send({ type: "settings", settings: { lang: qpLang() } });
      render();
      break;
    case "host_lost":
      isHost = false;
      hostLost = true;
      hostTap.disarm();
      document.body.classList.remove("host");
      viewKey = "";
      render();
      break;
    case "event":
      if (m.event.type === "react") floatReact(m.event.playerId, m.event.emoji);
      break;
    case "error":
      if (m.error === "room_expired") closed();
      if (m.error === "bad host token") {
        // ключ не подошёл: забываем его и просим вставить ссылку ведущего
        hostLost = false;
        try { localStorage.removeItem(hostKey()); } catch (e) {}
        pasteOpen = true;
        setHostNote(T("host_bad"));
      }
      break;
    case "rejected":
      // «Дальше» слишком рано после смены фазы — тихо: следующий тап пройдёт
      break;
  }
}

function closed() {
  dead = true;
  main.innerHTML = "";
  showBanner(T("expired"));
}
// Неверный код (hello не приходил ни разу) — «Такой комнаты нет» с полем кода, а не «комната закрыта»
function noRoom() {
  dead = true;
  showBanner(null);
  const code = window.MP && MP.roomGone ? MP.roomGone.normalize(CODE) : CODE;
  main.innerHTML = `<div class="screen" style="align-items:center;justify-content:center"><div class="panel" style="max-width:560px;width:100%"><h2>${escapeHtml(T("noroom_title"))}</h2><p>${escapeHtml(T("noroom_text"))}</p>
    <form id="codeform" autocomplete="off" style="display:flex;gap:10px;margin-top:12px"><input id="codein" maxlength="24" value="${escapeHtml(code)}" placeholder="${escapeHtml(T("code_ph"))}" aria-label="${escapeHtml(T("code_ph"))}" style="flex:1;min-width:0;font:700 22px/1.2 var(--font);padding:10px 12px;border-radius:12px;border:2px solid var(--deep);text-transform:uppercase"><button class="start" type="submit" style="flex:none">${escapeHtml(T("btn_go"))}</button></form></div></div>`;
  $("codeform").onsubmit = (e) => {
    e.preventDefault();
    const c = window.MP && MP.roomGone ? MP.roomGone.normalize($("codein").value) : $("codein").value.toUpperCase().replace(/[^A-Z2-9]/g, "");
    if (c) location.href = `quip-board.html?r=${encodeURIComponent(c)}`;
  };
}
const goneFlow = window.MP && MP.roomGone && !MP.off ? MP.roomGone({ showForm: noRoom, onClosed: closed }) : null;
function gone() { if (goneFlow) goneFlow.gone(); else closed(); }

async function boot() {
  // ?h=токен — ссылка ведущего на другое устройство: токен кладём в хранилище и убираем из адреса
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  let netLost = false, netQuiet = false;
  const showNet = () => {
    banner.textContent = T(netLost ? "err_connect" : "conn_lost");
    banner.classList.toggle("on", netLost || netQuiet);
  };
  window.addEventListener("langchange", showNet);
  conn = qpConnect({
    code: CODE,
    onMessage,
    onGone: gone,
    onOpen: () => { isHost = false; },
    onState: (st) => { netLost = st === "lost"; if (st === "open") netQuiet = false; showNet(); },
    onQuiet: (q) => { netQuiet = !!q; showNet(); },
  });
  requestAnimationFrame(frame);
  // ручка для отладки и стенда: те же сообщения, что шлют кнопки доски
  window.qpBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
boot();
</script>
