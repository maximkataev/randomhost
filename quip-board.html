<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f3a4.svg" type="image/svg+xml">
<title>Вопрос ребром — сцена</title>
<!-- доска ведущего с кодом комнаты: в поиске ей делать нечего -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- неблокирующий шрифт: одна гарнитура Commissioner (вариативная, кириллица и греческий нарисованы родные, не японские).
     Вывеска шоу — она же с осями FLAR/VOLM на максимум: расклёшенные засечки, как у заставок телешоу 70-х; текст — без них -->
<link href="https://fonts.googleapis.com/css2?family=Commissioner:FLAR,VOLM,wght@0..100,0..100,500..900&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Commissioner:FLAR,VOLM,wght@0..100,0..100,500..900&display=swap" rel="stylesheet"></noscript>
<style>
  /* ============================================================================================
     Мир: субботний прайм-тайм, телеигра «Вопрос ребром» в студии.
     Метафора — студия телешоу: оранжевый задник с солнечными лучами (медленно крутится),
       бордовые декорации с гирляндами лампочек, участники за пультами-стойками.
     Ведущий — Ребрик: жёлтый кубик, который буквально стоит «ребром» и держит микрофон.
     Сигнатурный элемент — ответы как толстые таблички на ребре (белое лицо, бирюзовый торец):
       при раскрытии табличка крутится вокруг ребра и снизу выезжает табличка автора в его цвете.
     Раскрытие — момент шоу: барабанная дробь → голоса падают жёлтыми жетонами 😂 →
       победитель поднимается в кольце мигающих лампочек, остальные гаснут →
       «РАЗГРОМ!» — жёлтая лента, фанфары и хлопушка конфетти из таблички; «ДЖИНКС!» — розовая лента и тромбон.
     Палитра: апельсиновый задник, бордовые декорации, жёлтые лампы, бирюза торцов, розовый — только беда (джинкс, красные секунды).
     Соседи: бомба — светлая бумага с контуром и растром, «Не верю!» — ч/б газета, аукцион/рулетка — тёмные.
     Здесь нет контуров-обводок, растра и тёмного фона: плоский сочный цвет, толщина предметов и свет лампочек.
     ============================================================================================ */
  :root {
    --or: #ff8a3d;
    --or-2: #ff7a2f;
    --deep: #3d0b16;
    --deep-2: #561425;
    --deep-3: #72203a;
    --ink: #2a0810;
    --bulb: #ffe14d;
    --bulb-edge: #c98a00;
    --teal: #12b8a6;
    --teal-edge: #0a7a6f;
    --pink: #ff2e74;
    --pink-edge: #a3103f;
    --mint: #3ee6a8;
    --tile: #fffaf3;
    --tile-muted: #8a5a50;
    --text: #fff6ec;
    --muted: #f5c3b0;
    --font: "Commissioner", system-ui, -apple-system, "Segoe UI", sans-serif;
    --show: "Commissioner", system-ui, sans-serif;
    --show-w: 900;
    --show-fvs: "FLAR" 100, "VOLM" 100;
    --boing: cubic-bezier(.34, 1.56, .64, 1);
    --snap: cubic-bezier(.2, .9, .3, 1.2);
    --lang-switch-bg: var(--deep);
    --lang-switch-border: rgba(255, 225, 77, .45);
    --lang-switch-fg: var(--text);
    --lang-switch-active-bg: var(--bulb);
    --lang-switch-active-fg: var(--ink);
    --lang-switch-active-border: var(--bulb);
    --lang-switch-font: var(--font);
  }
  * { box-sizing: border-box; }
  /* <b> внутри жирного текста браузер делает «bolder» = 900, а 900 у Commissioner — уже почти вывеска. Выделение — 700 */
  b, strong { font-weight: 700; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--or-2);
    color: var(--ink);
    font: 500 18px/1.3 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  /* на бордовых декорациях фокус — жёлтый, чтобы был виден */
  .top :focus-visible, .panel:not(.cast) :focus-visible, .seg :focus-visible { outline-color: var(--bulb); }
  .hidden { display: none !important; }

  /* ---------- студия: лучи задника, свет в центре, виньетка. Всё под контентом и не ловит клики ---------- */
  .stagefx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .stagefx .rays { position: absolute; left: 50%; top: 46%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax;
    background: repeating-conic-gradient(from 0deg, var(--or) 0 7.5deg, var(--or-2) 7.5deg 15deg); }
  .stagefx .glow { position: absolute; inset: 0;
    background: radial-gradient(ellipse 55% 50% at 50% 46%, rgba(255, 226, 140, .5), transparent 70%),
      radial-gradient(ellipse 110% 95% at 50% 50%, transparent 60%, rgba(150, 30, 20, .38)); }
  @media (prefers-reduced-motion: no-preference) { .stagefx .rays { animation: spin 160s linear infinite; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- шапка: бордовая балка с гирляндой ---------- */
  .top { flex: none; position: relative; z-index: 3; display: flex; align-items: center; gap: 16px; height: calc(var(--lsc, 32px) * 2); padding: 0 var(--lsw, 160px) 0 22px; background: var(--deep); color: var(--text); }
  .top::after { content: ""; position: absolute; left: 0; right: -28px; bottom: -9px; height: 18px; pointer-events: none;
    background: radial-gradient(circle at 7px 9px, #fffbe0 0 2px, var(--bulb) 2.5px 5.5px, var(--bulb-edge) 6px 6.5px, transparent 7px) 0 0 / 28px 18px repeat-x; }
  .top::before { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 18px; pointer-events: none;
    background: radial-gradient(circle at 21px 9px, #7a3a12 0 5.5px, #4a1a08 6px 6.5px, transparent 7px) 0 0 / 28px 18px repeat-x; }
  @media (prefers-reduced-motion: no-preference) { .top::after { animation: chase 1.1s steps(2) infinite; } }
  @keyframes chase { to { transform: translateX(-28px); } }
  .top .sign { font-size: 24px; }
  .chip { font: 600 16px/1 var(--font); padding: 9px 14px; border-radius: 999px; background: var(--deep-2); color: var(--text); white-space: nowrap; }
  .chip b { color: var(--bulb); }
  #codechip { background: var(--bulb); color: var(--ink); font-family: var(--show); font-weight: var(--show-w); font-variation-settings: var(--show-fvs); letter-spacing: .06em; }
  #codechip b { color: var(--ink); }
  .top .grow { flex: 1; }
  .sound-toggle-btn { flex: none; width: calc(var(--lsh, 44px) * 1.25); height: var(--lsh, 44px); border: 2px solid rgba(255, 225, 77, .45); border-radius: 999px; background: var(--deep); color: var(--text); font-size: 17px; display: grid; place-items: center; padding: 0; }
  .banner { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 50; background: var(--pink); color: #fff; padding: 10px 18px; font-weight: 600; border-radius: 999px; }
  .conn { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 50; background: var(--pink); color: #fff; padding: 8px 16px; font-weight: 600; visibility: hidden; border-radius: 999px; }
  .conn.on { visibility: visible; }

  /* логотип шоу: белые буквы с выдавленным торцом — розовым, потом бордовым (без градиентов в тексте) */
  .sign { font: var(--show-w) 44px/1.08 var(--show); font-variation-settings: var(--show-fvs); color: #fff; margin: 0; white-space: nowrap; letter-spacing: .01em;
    text-shadow: .02em .02em 0 var(--pink), .04em .04em 0 var(--pink), .06em .06em 0 var(--pink), .08em .08em 0 var(--ink), .1em .1em 0 var(--ink), .12em .12em 0 var(--ink); }
  .top .sign { text-shadow: 1px 1px 0 var(--pink), 2px 2px 0 var(--pink), 3px 3px 0 var(--ink), 4px 4px 0 var(--ink); }
  @media (prefers-reduced-motion: no-preference) { .sign.flick { animation: wiggle 7s ease-in-out infinite; transform-origin: 20% 60%; } }
  @keyframes wiggle { 0%, 88%, 100% { transform: rotate(0); } 91% { transform: rotate(-3deg) scale(1.04); } 94% { transform: rotate(2deg); } 97% { transform: rotate(-1deg); } }

  main { flex: 1; min-height: 0; position: relative; z-index: 1; padding: 20px 22px 22px; }
  .screen { position: absolute; inset: 20px 22px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }

  /* ---------- ведущий Ребрик (класс не .host: .host у body — «эта доска ведущего») ---------- */
  .rebrik { display: block; width: auto; overflow: visible; }
  .rebrik .h-body { transform-origin: 108px 226px; transform-box: view-box; }
  .rebrik .h-eyes { transform-origin: 108px 92px; transform-box: view-box; }
  .rebrik .h-arm { transform-origin: 42px 128px; transform-box: view-box; }
  @media (prefers-reduced-motion: no-preference) {
    .rebrik .h-body { animation: teeter 2.6s ease-in-out infinite; }
    .rebrik .h-eyes { animation: blink 4.2s infinite; }
    .rebrik .h-arm { animation: mic 1.3s ease-in-out infinite alternate; }
  }
  /* балансирует на ребре: качается вокруг нижнего угла */
  @keyframes teeter { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes mic { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }

  /* ---------- общие предметы ---------- */
  /* табличка: белое лицо и бирюзовый торец снизу — толщина предмета, не «тень ради тени» */
  .card { position: relative; background: var(--tile); color: var(--ink); border-radius: 18px; padding: 18px 22px; box-shadow: 0 9px 0 var(--teal-edge); }
  .card .k { font: 600 15px/1.2 var(--font); color: var(--tile-muted); text-transform: uppercase; letter-spacing: .08em; }
  /* вопрос — вывеска шоу: бордовый щит в рамке из лампочек */
  .prompt { flex: none; align-self: center; width: min(1180px, 100%); height: var(--ph, 176px); overflow: hidden; display: flex; flex-direction: column;
    background: var(--deep); color: #fff; border-radius: 22px; padding: 16px 34px; box-shadow: 0 10px 0 var(--ink), inset 0 0 0 7px var(--deep-2); }
  .prompt::before { content: ""; position: absolute; inset: 6px; border: 7px dotted var(--bulb); border-radius: 17px; pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) { body[data-phase=reveal] .prompt::before { animation: bulbs 1.2s steps(2) infinite; } }
  @keyframes bulbs { 50% { opacity: .6; } }
  .prompt > .k { margin-top: auto; color: var(--bulb); position: relative; }
  .prompt > .q { margin-bottom: auto; position: relative; }
  .prompt > .k, .prompt > .q { text-align: center; }
  .prompt .q { font: 700 var(--pfs, 44px)/1.16 var(--font); overflow-wrap: anywhere; }
  .prompt .q .scene { display: block; font-size: calc(var(--pfs, 44px) * 2.1); line-height: 1.1; letter-spacing: .1em; text-align: center; }
  .items { margin: 0; padding-left: 1.2em; }

  /* аватар: эмодзи в кружке цвета игрока с белым ободком */
  .av { font-style: normal; line-height: 1; }
  .puck { flex: none; display: grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--pc, var(--teal)); box-shadow: 0 0 0 .12em #fff, 0 .14em 0 .12em rgba(42, 8, 16, .35); font-style: normal; line-height: 1; }

  /* ---------- лобби: участники слева (правило владельца), вывеска входа справа ---------- */
  .lobby { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(380px, 1fr); gap: 24px; }
  .panel { background: var(--deep); color: var(--text); border-radius: 22px; padding: 20px 22px; min-height: 0; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 0 var(--ink); }
  .panel h2 { margin: 0; font: var(--show-w) 26px/1.1 var(--show); font-variation-settings: var(--show-fvs); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: #fff; }
  .panel h2 span { color: var(--bulb); font: 600 17px/1 var(--font); white-space: nowrap; }
  /* колонка участников — прямо на заднике студии: светлее, стойки бордовые, свободные места пунктиром */
  .panel.cast { background: rgba(61, 11, 22, .12); box-shadow: inset 0 0 0 4px rgba(42, 8, 16, .18); }
  .panel.cast h2 { color: #fff; text-shadow: 2px 2px 0 var(--pink), 4px 4px 0 var(--ink); font-size: 30px; }
  .panel.cast h2 span { background: var(--deep); padding: 8px 14px; border-radius: 999px; text-shadow: none; }
  .seats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 12px; flex: 1; min-height: 0; }
  /* место участника — стойка: сверху полоса его цвета */
  .seat { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--deep); border-radius: 14px; box-shadow: inset 0 7px 0 var(--pc), 0 6px 0 var(--ink); min-width: 0; min-height: 52px; font-size: clamp(18px, 2.3vh, 24px); }
  .seat .puck { font-size: clamp(22px, 2.9vh, 32px); }
  /* занятое место — карточка участника: большой аватар, имя под ним */
  .seat:not(.empty) { flex-direction: column; justify-content: center; gap: 10px; padding: 18px 10px 8px; text-align: center; box-shadow: inset 0 9px 0 var(--pc), 0 7px 0 var(--ink); font-size: clamp(20px, 2.7vh, 28px); }
  .seat:not(.empty) .puck { font-size: clamp(28px, 4.8vh, 48px); }
  .seat:not(.empty) b { flex: none; max-width: 100%; }
  .seat b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; color: #fff; }
  .seat .off { color: var(--muted); font-size: 13px; font-weight: 600; }
  .seat .x { position: absolute; right: 6px; top: 8px; background: var(--deep); border: 0; border-radius: 50%; color: var(--muted); width: 28px; height: 28px; padding: 0; visibility: hidden; }
  .host .seat:hover .x, .host .seat:focus-within .x { visibility: visible; }
  @media (prefers-reduced-motion: no-preference) { .seat.new { animation: hop .6s var(--boing); } }
  @keyframes hop { from { transform: translateY(-30px) scale(.7); opacity: .3; } }
  /* свободное место — тихий скелет: едва заметная выемка с номером, без рамок и надписей.
     Героями остаются пришедшие; подсвечено только ближайшее место — туда встанет следующий */
  .seat.empty { background: rgba(61, 11, 22, .07); box-shadow: inset 0 3px 0 rgba(61, 11, 22, .08); color: rgba(42, 8, 16, .2); font: var(--show-w) clamp(22px, 3.4vh, 34px)/1 var(--show); font-variation-settings: var(--show-fvs); justify-content: center; }
  .seat.empty.next { background: rgba(255, 246, 236, .22); box-shadow: inset 0 0 0 3px rgba(42, 8, 16, .35); color: var(--ink); font: 700 16px/1.2 var(--font); text-align: center; }
  .seat.empty.next::before { content: "+"; display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bulb); font: var(--show-w) 22px/1 var(--show); font-variation-settings: var(--show-fvs); }
  .seat.empty.next { flex-direction: column; gap: 8px; }
  @media (prefers-reduced-motion: no-preference) { .seat.empty.next::before { animation: nudge 1.6s ease-in-out infinite; } }
  @keyframes nudge { 50% { transform: scale(1.15); } }
  .howwrap { margin: auto 0; display: flex; align-items: center; gap: 18px; min-height: 0; }
  .howwrap .rebrik { height: min(190px, 21vh); }
  .howto { flex: 1; display: grid; gap: 10px; font-size: 19px; font-weight: 600; }
  .howto div { display: flex; gap: 14px; align-items: center; }
  .howto i { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--bulb); font-style: normal; font-size: 22px; box-shadow: 0 4px 0 var(--bulb-edge); }
  .join { display: flex; gap: 24px; align-items: center; padding: 8px 0 10px 8px; }
  /* QR крупный: его сканируют с дивана, метров с трёх. Рамка — лампочки */
  #qr { flex: none; position: relative; width: clamp(150px, 27vh, 250px); height: clamp(150px, 27vh, 250px); background: #fff; padding: 10px; border-radius: 14px; box-shadow: 0 0 0 8px var(--bulb), 0 8px 0 8px var(--bulb-edge); }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  .bigcode { font: var(--show-w) var(--code-fs, 60px)/1.05 var(--show); font-variation-settings: var(--show-fvs); color: var(--bulb); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-shadow: 0 .06em 0 var(--pink-edge); padding-bottom: .08em; }
  .url { color: var(--muted); font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .scan { font-size: 16px; margin-top: 6px; }
  .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .opt-row .lbl b { display: block; font-weight: 700; }
  .opt-row .lbl span { color: var(--muted); font-size: 14px; }
  .seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--ink); border-radius: 14px; flex: none; }
  .seg button { background: none; border: 0; padding: 8px 14px; font-weight: 700; min-width: 50px; border-radius: 10px; color: var(--text); transition: transform .2s var(--boing); }
  .seg button.on { background: var(--bulb); color: var(--ink); box-shadow: 0 3px 0 var(--bulb-edge); }
  .seg button:not(:disabled):not(.on):hover { background: var(--deep-3); }
  .startbox { margin-top: auto; display: grid; gap: 10px; }
  /* главная кнопка — большая аркадная кнопка пульта: толстая, с торцом, нажимается вниз */
  .start { width: 100%; border: 0; border-radius: 18px; background: var(--bulb); color: var(--ink); font: var(--show-w) 32px/1 var(--show); font-variation-settings: var(--show-fvs); padding: 20px; box-shadow: 0 8px 0 var(--bulb-edge); transition: transform .12s, box-shadow .12s; }
  .start:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 10px 0 var(--bulb-edge); }
  .start:not(:disabled):active { transform: translateY(6px); box-shadow: 0 2px 0 var(--bulb-edge); }
  .start:disabled { background: #b98c7d; box-shadow: 0 8px 0 #7c5146; opacity: 1; color: var(--deep); }
  .fine { color: var(--muted); font-size: 15px; font-weight: 600; }

  /* ---------- заставка раунда ---------- */
  .intro { justify-content: center; align-items: center; text-align: center; gap: 12px; }
  .intro .eyebrow { display: inline-block; font: 700 26px/1 var(--font); background: var(--deep); color: var(--bulb); padding: 12px 22px; border-radius: 999px; letter-spacing: .06em; text-transform: uppercase; transform: rotate(-2deg); }
  .intro .sign { font-size: clamp(60px, 14vh, 140px); margin: 6px 0; white-space: normal; max-width: 1400px; }
  .intro .desc { font: 700 30px/1.25 var(--font); max-width: 980px; color: var(--ink); }
  .intro .row { display: flex; align-items: center; justify-content: center; gap: 40px; margin-top: 8px; }
  .intro .rebrik { height: min(260px, 28vh); }
  /* множитель очков — розовая «звезда»-взрыв */
  .burst { display: grid; place-items: center; width: 190px; height: 190px; background: var(--pink); color: #fff; font: var(--show-w) 70px/1 var(--show); font-variation-settings: var(--show-fvs);
    clip-path: polygon(50.0% 0.0%, 59.1% 10.0%, 71.7% 5.0%, 75.6% 17.9%, 89.1% 18.8%, 86.9% 32.2%, 98.7% 38.9%, 91.0% 50.0%, 98.7% 61.1%, 86.9% 67.8%, 89.1% 81.2%, 75.6% 82.1%, 71.7% 95.0%, 59.1% 90.0%, 50.0% 100.0%, 40.9% 90.0%, 28.3% 95.0%, 24.4% 82.1%, 10.9% 81.2%, 13.1% 67.8%, 1.3% 61.1%, 9.0% 50.0%, 1.3% 38.9%, 13.1% 32.2%, 10.9% 18.8%, 24.4% 17.9%, 28.3% 5.0%, 40.9% 10.0%); }
  .burst span { transform: rotate(-8deg); text-shadow: 0 5px 0 var(--pink-edge); }
  @media (prefers-reduced-motion: no-preference) {
    .intro.go .sign { animation: slam .55s var(--boing) both; }
    .intro.go .eyebrow { animation: dropin .5s var(--boing) both; }
    .intro.go .desc { animation: descin .4s ease-out .35s both; }
    .intro.go .burst { animation: burstin .7s var(--boing) .45s both, burstspin 9s linear 1.2s infinite; }
  }
  @keyframes slam { from { transform: scale(.35) rotate(-8deg); opacity: .25; } }
  @keyframes descin { from { transform: translateY(14px); opacity: .25; } }

  .writer.done { transform: translateY(-8px); background: var(--deep-3); }
  .writer.done .st { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--mint); color: var(--ink); font-size: 28px; box-shadow: 0 0 0 4px rgba(62, 230, 168, .35), 0 0 22px rgba(62, 230, 168, .7); }

  /* ---------- стена табличек ---------- */
  .wall { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: stretch; gap: var(--gap, 18px); overflow: clip; overflow-clip-margin: 24px; padding: 30px 14px 14px; }
  .wall > .ans { flex: none; width: calc((100% - (var(--cols, 2) - 1) * var(--gap, 18px)) / var(--cols, 2)); height: calc((100% - (var(--rows, 1) - 1) * var(--gap, 18px)) / var(--rows, 1) - 9px); }
  .duel { position: relative; }
  /* «VS» — розовая шайба с жёлтым ободом между табличками */
  .duel .vs { position: absolute; left: 50%; top: 50%; width: 118px; height: 118px; margin: -59px 0 0 -59px; z-index: 3; display: grid; place-items: center; border-radius: 50%; background: var(--pink); border: 8px solid var(--bulb); color: #fff; font: var(--show-w) 40px/1 var(--show); font-variation-settings: var(--show-fvs); box-shadow: 0 7px 0 var(--pink-edge); pointer-events: none; transform: rotate(-10deg); }

  .duel > .ans:nth-child(1) .foot { margin-right: -68px; }

  /* джинкс: обе таблички в розовой рамке и вздрагивают */

  /* буква таблички — жёлтая лампа в углу */

  .ans .l { position: absolute; left: -10px; top: -14px; z-index: 5; width: 44px; height: 44px; border-radius: 50%; background: var(--bulb); color: var(--ink); font: var(--show-w) 22px/44px var(--show); font-variation-settings: var(--show-fvs); text-align: center; box-shadow: 0 4px 0 var(--bulb-edge), 0 0 0 4px var(--tile); }
  .ans .t { flex: 1; min-height: 0; display: flex; align-items: safe center; justify-content: safe center; text-align: center; font: 700 var(--afs, 30px)/1.2 var(--font); overflow: hidden; overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
  /* три пункта — блок по центру таблички, пункты по левому краю: номера в столбик */

  .fitting .ans .t { overflow-wrap: normal; }

  .ans .foot { flex: none; height: 44px; display: flex; align-items: center; gap: 12px; margin: 8px -8px 0 -12px; padding: 0 10px; border-radius: 12px; background: var(--pc, #ddd); visibility: hidden; }
  .ans .who { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 22px; min-width: 0; flex: 1; }
  .ans .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ans .who i { font-style: normal; font-size: 26px; }
  .ans .who .mk { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #fff; font-size: 18px; }
  .ans .tags { color: var(--ink); font-size: 16px; font-weight: 600; white-space: nowrap; opacity: .8; }
  .ans .vn { font: 700 18px/1 var(--font); color: var(--ink); white-space: nowrap; }
  /* очки — белая «бирка» на табличке автора */
  .ans .pts { font: var(--show-w) 26px/1 var(--show); font-variation-settings: var(--show-fvs); color: var(--ink); background: #fff; border-radius: 10px; padding: 6px 10px; white-space: nowrap; }
  .ans.win .pts { background: var(--bulb); }
  /* голоса — жёлтые жетоны 😂 падают в правый верхний угол */
  .ans .tally { position: absolute; right: 12px; top: -16px; z-index: 3; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 60%; font-size: 22px; line-height: 1; }
  .ans .tally .v { display: grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--bulb); box-shadow: 0 3px 0 var(--bulb-edge); }
  .ans .tally b { font: var(--show-w) 18px/1.6em var(--show); font-variation-settings: var(--show-fvs); padding: 0 4px; }
  /* плотная стена (5+ ответов): имя автора главнее всего — метки 🎲/🐌 значками у имени, «N голосов» прячем (их видно по жетонам) */
  .wall.dense .ans { padding: 24px 16px 10px; }
  .wall.dense .ans .l { width: 38px; height: 38px; font-size: 19px; line-height: 38px; }
  .wall.dense .ans .tally { font-size: 18px; }
  .wall.dense .ans .foot { height: 38px; gap: 8px; }
  .wall.dense .ans .who { font-size: 19px; gap: 6px; }
  .wall.dense .ans .who i { font-size: 21px; }

  .wall.dense .ans .tags, .wall.dense .ans .vn { display: none; }
  .wall.dense .ans .pts { font-size: 21px; padding: 5px 8px; }
  .votebar .none { color: var(--ink); font-weight: 700; }
  .ans.shown .foot { visibility: visible; }
  /* панчлайн: жетоны падают, потом победитель поднимается в кольце лампочек, остальные гаснут */
  .ans::after { content: ""; position: absolute; inset: -13px; border: 6px dotted var(--bulb); border-radius: 28px; pointer-events: none; opacity: 0; }
  .ans.win { translate: 0 -10px; scale: 1.02; z-index: 2; box-shadow: 0 9px 0 var(--teal-edge), 0 0 0 5px var(--bulb), 0 0 44px 8px rgba(255, 240, 150, .85); transition-delay: var(--wd, 0s); }
  .ans.win::after { opacity: 1; transition: opacity .2s var(--wd, 0s); }
  @media (prefers-reduced-motion: no-preference) { .ans.win::after { animation: bulbs .9s steps(2) var(--wd, 0s) infinite; } }
  .ans.dim { opacity: .5; transition: opacity .45s var(--wd, 0s); }
  /* лента-штамп — слева в шапке: справа жетоны, их закрывать нельзя. Джинкс розовый, разгром жёлтый со звёздами */
  .ans .stamp { position: absolute; left: 48px; top: -16px; transform: rotate(-5deg); font: var(--show-w) var(--sfs, 34px)/1 var(--show); font-variation-settings: var(--show-fvs); padding: 8px 18px 10px; border-radius: 10px; white-space: nowrap; pointer-events: none; visibility: hidden; z-index: 4;
    background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--pink-edge); }

  .ans .stamp.sw::before, .ans .stamp.sw::after { content: "★"; color: var(--pink); margin: 0 .25em; }
  .ans.stamped .stamp { visibility: visible; }
  @media (prefers-reduced-motion: no-preference) {
    .ans.pinned { animation: plateIn .55s var(--boing) both; animation-delay: var(--d, 0s); }
    /* раскрытие: табличка вздрагивает, а табличка автора переворачивается на ребре и встаёт */
    .ans.shown { animation: jolt .45s ease-out; animation-delay: var(--d, 0s); }
    .ans.shown .foot { animation: footflip .6s var(--boing) both; animation-delay: var(--d, 0s); transform-origin: 50% 0; }
    .ans.jx { animation: shake .5s ease-in-out .5s 2; }

  }
  @keyframes plateIn { from { transform: translateY(60px) rotateX(-70deg); opacity: .25; } }
  @keyframes shake { 20% { transform: translateX(-8px) rotate(-.6deg); } 40% { transform: translateX(8px) rotate(.6deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  @keyframes jolt { 35% { transform: translateY(8px) rotate(-.4deg); } 70% { transform: translateY(-3px); } }
  @keyframes footflip { from { transform: perspective(500px) rotateX(-100deg); opacity: .3; } }
  @keyframes stampin { from { transform: rotate(-20deg) scale(2.4); opacity: .3; } }
  @keyframes coin { from { transform: translateY(-40px) scale(.4); opacity: .3; } }
  /* лампочки голосования: сколько человек уже нажали */
  .votebar { flex: none; display: flex; justify-content: center; gap: 12px; height: 34px; align-items: center; font-size: 22px; }
  .votebar .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--deep-2); box-shadow: inset 0 0 0 3px var(--deep); transition: background .2s, box-shadow .2s; }
  .votebar .dot.on { background: var(--bulb); box-shadow: 0 0 0 3px var(--deep), 0 0 18px var(--bulb); }

  /* ---------- счёт: табло шоу ---------- */
  .board { flex: 1; min-height: 0; display: grid; grid-auto-rows: var(--rowh, 56px); gap: 12px; align-content: center; width: min(1240px, 100%); align-self: center; }
  .rowx { position: relative; display: grid; grid-template-columns: 1.7em 1.9em minmax(0, 1fr) 4.4em 4.4em; align-items: center; gap: .6em; padding: 0 .9em 0 .6em; background: var(--deep); color: #fff; border-radius: 16px; box-shadow: inset 8px 0 0 var(--pc), 0 7px 0 var(--ink); font-size: clamp(20px, calc(var(--rowh, 56px) * .36), 36px); }
  .rowx .n { display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--deep-3); font: var(--show-w) .9em/1 var(--show); font-variation-settings: var(--show-fvs); color: #fff; margin-left: .3em; }

  .rowx.lead { background: var(--bulb); color: var(--ink); box-shadow: inset 8px 0 0 var(--pc), 0 7px 0 var(--bulb-edge); }
  .rowx.lead .n { background: var(--ink); color: var(--bulb); }

  .rowx .puck { position: relative; }

  /* ---------- итоги ---------- */

    .step .col { animation: rise-col .8s cubic-bezier(.2, .8, .3, 1) both; transform-origin: 50% 100%; }

  }
  @keyframes rise-col { from { transform: scaleY(0); } }

  .awards { display: flex; flex-direction: column; gap: 18px; min-height: 0; }

  @media (max-width: 1000px) {
    body { overflow: auto; }
    .screen { position: static; }
    main { padding: 20px 16px 16px; }
    .lobby, .final { grid-template-columns: 1fr; }
    .intro .sign { font-size: 56px; }
    .top .sign { display: none; }
  }
  /* ---------- телефон: ведущий создал комнату с телефона — лобби в одну колонку ----------
     Сначала то, что нужно ведущему: код, QR, ссылка, настройки и «Начать»; участники — ниже, в две колонки.
     ТВ-раскладка выше не трогается: всё только внутри этого блока */
  @media (max-width: 760px) {
    /* гирлянда шапки уезжает вправо на шаг анимации — на телефоне это давало горизонтальную прокрутку */
    .top { overflow-x: clip; padding-left: 12px; }
    /* шапка прилипает: звук и переключатель языка (он fixed из i18n.js) всегда лежат на балке, а не поверх панелей */
    body[data-phase=lobby] { height: auto; min-height: 100%; }
    body[data-phase=lobby] .top { position: sticky; top: 0; }
    main { padding: 22px 12px 18px; }
    /* minmax(0, …): иначе колонка растягивается под код комнаты в 96px (fitCode ещё не успел ужать) */
    .lobby { grid-template-columns: minmax(0, 1fr); gap: 22px; }
    .lobby > .panel:not(.cast) { order: -1; }
    .lobby .panel { padding: 16px 14px 18px; border-radius: 18px; }
    /* вывеска входа: код во всю ширину, под ним QR и подсказка, ссылка — строкой ниже */
    .lobby .join { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "code code" "qr scan" "url url";
      gap: 10px 18px; align-items: center; padding: 0 0 4px; }
    .lobby .join > div:not(#qr) { display: contents; }
    .lobby .bigcode { grid-area: code; text-align: center; }
    .lobby #qr { grid-area: qr; width: 132px; height: 132px; padding: 7px; margin: 8px 8px 16px; }
    .lobby .scan { grid-area: scan; margin: 0; font-size: 15px; font-weight: 600; }
    .lobby .url { grid-area: url; text-align: center; font-size: 15px; background: var(--ink); border-radius: 12px; padding: 10px 12px; }
    /* настройки: подпись над переключателем, если не влезают в строку; кнопки — под палец */
    .opt-row { flex-wrap: wrap; }
    .opt-row .lbl { flex: 1 1 120px; min-width: 0; }
    .seg button { min-height: 44px; min-width: 52px; }
    /* «Начать» сразу после настроек, правила для зрителей — в конце панели */
    .lobby .startbox { order: 1; margin-top: 4px; }
    .lobby .howwrap { order: 2; margin: 4px 0 0; gap: 10px; }
    .lobby .howwrap .rebrik { height: 120px; }
    .lobby .howto { font-size: 16px; }
    .lobby .howto i { width: 40px; height: 40px; font-size: 20px; }
    .lobby .start { font-size: 28px; padding: 18px 14px; }
    /* участники: две колонки, строки по содержимому вместо растягивания на высоту экрана */
    .panel.cast h2 { font-size: 26px; }
    .lobby .seats { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: minmax(64px, auto); gap: 10px; flex: none; }
    .seat:not(.empty) { padding: 16px 8px 10px; gap: 8px; font-size: 19px; }
    .seat:not(.empty) .puck { font-size: 34px; }
    .seat.empty { font-size: 24px; }
    /* на тач-экране нет наведения: крестик «выгнать» виден всегда и размером под палец */
    .host .seat .x { visibility: visible; width: 44px; height: 44px; right: 0; top: 4px; background: transparent; font-size: 16px; }
  }
  /* совсем узкий телефон: QR по центру над подсказкой, иначе текст рядом с ним в столбик по слову */
  @media (max-width: 360px) {
    .lobby .join { grid-template-columns: minmax(0, 1fr); grid-template-areas: "code" "qr" "scan" "url"; justify-items: center; }
    .lobby #qr { width: 156px; height: 156px; }
    .lobby .scan { text-align: center; }
    /* код и ссылка — во всю ширину, иначе fitCode не увидит переполнения */
    .lobby .bigcode, .lobby .url { justify-self: stretch; }
    .panel.cast h2 { font-size: 22px; }
    /* правила рядом с Ребриком в столбик по слову — Ребрик встаёт над ними */
    .lobby .howwrap { flex-direction: column; align-items: stretch; }
    .lobby .howwrap .rebrik { order: -1; align-self: center; height: 96px; }
  }
  /* телефон боком / маленький планшет: ширины хватает на четыре места в ряд */
  @media (min-width: 560px) and (max-width: 760px) {

    .lobby .join { grid-template-areas: "qr code" "qr scan" "url url"; row-gap: 4px; }

  /* ---------- телефон: ведущий ведёт всё шоу с телефона — заставка, ответы, стена, счёт, итоги ----------
     Игровые экраны снова во весь экран (стена и табло подгоняют шрифт под высоту коробки), всё мельче и плотнее.

<script>
"use strict";
const T = (k) => qpT(k);
const tpl = (k, v) => qpTpl(k, v);
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const hostKey = () => "quip-host-" + CODE;
const main = $("main");

let conn = null, state = null, isHost = false, dead = false;
let viewKey = "";

const player = (id) => state && state.players.find((p) => p.id === id);
const present = () => state.players.filter((p) => !p.left);

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  showBanner(T("creating"));
  try {
    const res = await fetch("/quip/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: qpLang() } }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
    showBanner(null);
    return true;
  } catch (err) {
    showBanner(String(err.message || err));
    return false;
  }
}
function showBanner(text) {
  const b = $("banner");
  b.classList.toggle("hidden", !text);
  b.textContent = text || "";
}

// подогнать шрифт под коробку: уменьшаем, пока текст не влезет (коробка не растёт — правило «без скачков»)
function fit(node, varName, max, min) {
  let fs = max;
  node.style.setProperty(varName, fs + "px");
  const box = node.querySelector(".t") || node;
  let guard = 0;
  while (fs > min && (box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1) && guard++ < 40) {
    fs -= 2;
    node.style.setProperty(varName, fs + "px");
  }
}

// ---------- лобби ----------
// код комнаты — во всю ширину, но целиком. вывеска Commissioner шире системного шрифта: после его загрузки подгоняем снова

  code.style.setProperty("--code-fs", fs + "px");
  while (fs > 26 && code.scrollWidth > code.clientWidth + 1) { fs -= 4; code.style.setProperty("--code-fs", fs + "px"); }
}

}

let writersDone = null;

// ---------- голосование и раскрытие ----------
// Раскладка стены: из разумных вариантов берём тот, где шрифт ответов выходит крупнее всего
// (финал «три пункта» при 5 игроках — один ряд из пяти высоких табличек, а не 3+2 низких).
// Выбирается один раз при сборке стены — потом табличка не меняет размер (правило «без скачков»).
function wallOptions(n, kind) {
  const w = main.clientWidth || innerWidth;
  // телефон стоя: таблички списком друг под другом (CSS: высота по тексту, экран прокручивается)
  if (w < 560) return [1];
  if (kind === "duel") return [2];
  if (n <= 3) return [n];
  const out = [];
  for (let c = Math.max(2, Math.ceil(Math.sqrt(n)) - 1); c <= Math.min(n, 6); c++) {
    // слишком узкие таблички не берём: имя автора и очки должны влезать
    if ((w - 28) / c < 250) break;
    // последний ряд не должен быть одинокой табличкой при многих столбцах
    const rows = Math.ceil(n / c);
    if (rows > 1 && n % c === 1 && c > 2) continue;
    out.push(c);
  }
  return out.length ? out : [Math.min(n, 4)];
}
function setWallGrid(wall, n, cols) {
  const rows = Math.ceil(n / cols);
  wall.style.setProperty("--cols", cols);
  wall.style.setProperty("--rows", rows);
  // буквы-лампы и жетоны висят над кромкой — между рядами им нужен зазор
  wall.style.setProperty("--gap", (rows > 1 ? (n > 8 ? 20 : 26) : 18) + "px");
  return rows;
}
function drawWall() {
  const c = state.current;
  if (!c || !c.answers) return;
  const revealed = state.phase === "reveal";
  const key = "wall:" + c.id + qpLang();
  if (viewKey !== key) {
    viewKey = key;
    const n = c.answers.length;
    main.innerHTML = `<div class="screen${n > 4 ? " dense" : ""}">${clockHtml()}
      <div class="card prompt" id="prompt"><div class="k" id="pk"></div><div class="q">${qpPromptHtml(c.prompt)}</div></div>
      <div class="wall${c.kind === "duel" ? " duel" : ""}${n > 4 ? " dense" : ""}" id="wall" lang="${qpLang()}">
        ${c.answers.map((a, i) => `<div class="card ans pinned" id="a${i}" style="--d:${(i * 0.08).toFixed(2)}s;--rot:${i % 2 ? 3 : -3}deg"><span class="l">${String.fromCharCode(65 + i)}</span>
          <div class="tally" id="tally${i}"></div>
          <div class="t">${qpAnswerHtml(a)}</div>
          <div class="foot"><div class="who" id="who${i}"></div><span class="tags" id="tags${i}"></span><span class="vn" id="vn${i}"></span><span class="pts" id="pts${i}"></span></div>
          <div class="stamp" id="stamp${i}"></div></div>`).join("")}
        ${c.kind === "duel" ? `<div class="vs">${T("vs")}</div>` : ""}
      </div><div class="votebar" id="votebar"></div></div>`;

    $("pk").textContent = (state.matchupsN > 1 ? tpl(c.kind === "duel" ? "match_n" : "q_n", { i: state.mi + 1, n: state.matchupsN }) + " · " : "") + qpRoundName(state.roundKey, state.small);
    pickWall(n, c.kind);
    // после первого кадра раскладка окончательная (шрифты, полоса голосов) — подгоняем ещё раз
    requestAnimationFrame(() => fitWall());
    setTimeout(() => fitWall(), 400);

  const vb = $("votebar");

    vb.innerHTML = Array.from({ length: c.votersN || 0 }, (_, i) => `<span class="dot${i < (c.votedN || 0) ? " on" : ""}"></span>`).join("");
  } else vb.innerHTML = c.result && !c.result.tally.some(Boolean) ? `<span class="none">${escapeHtml(T("no_votes"))}</span>` : "";

// Шрифт вопроса и ответов подгоняется под коробки. Веб-шрифт шире системного — после его загрузки подгоняем снова.
let wallFit = null;
function pickWall(n, kind) {
  const wall = $("wall");
  const maxAns = kind === "duel" ? 48 : n <= 4 ? 42 : n <= 8 ? 38 : 30;
  const maxPrompt = n > 4 ? 40 : 44;
  let best = null;
  for (const cols of wallOptions(n, kind)) {
    setWallGrid(wall, n, cols);
    fitWall(maxAns, maxPrompt);
    const fs = parseFloat(main.style.getPropertyValue("--afs")) || 0;
    // при равном шрифте — меньше столбцов (таблички шире, ряды ровнее)
    if (!best || fs > best.fs) best = { cols, fs };
  }
  setWallGrid(wall, n, best.cols);
  fitWall(maxAns, maxPrompt);
}
function fitWall(ans, prompt) {
  if (ans) wallFit = { ans, prompt };
  if (!wallFit || !$("wall")) return;
  const pr = $("prompt");
  if (pr) fit(pr, "--pfs", wallFit.prompt, 20);
  // шрифт ответов — один на всю стену, по самому длинному
  const cards = [...main.querySelectorAll(".ans")];
  let fs = wallFit.ans;
  const over = () => cards.some((x) => { const t = x.querySelector(".t"); return t.scrollHeight > t.clientHeight + 1 || t.scrollWidth > t.clientWidth + 1; });
  main.style.setProperty("--afs", fs + "px");
  main.classList.add("fitting");
  let guard = 0;
  while (fs > 12 && over() && guard++ < 30) { fs -= 2; main.style.setProperty("--afs", fs + "px"); }
  main.classList.remove("fitting");
}
if (document.fonts) {
  document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", () => { fitWall(); const pr = $("prompt"); if (pr && !$("wall")) fit(pr, "--pfs", 60, 24); });
  document.fonts.ready.then(() => fitWall());
}

let revealedKey = "";
function drawReveal(c) {
  if (revealedKey === c.id + qpLang()) return;
  revealedKey = c.id + qpLang();
  const r = c.result;
  const total = r.tally.reduce((a, b) => a + b, 0);
  c.answers.forEach((a, i) => {
    const p = player(a.playerId) || { name: "?", avatar: "?", color: "#777" };
    const card = $("a" + i);
    card.classList.add("shown");
    const mk = a.late ? "🐌" : a.hint ? "🎲" : "";
    $("who" + i).innerHTML = `<i>${escapeHtml(p.avatar)}</i><span>${escapeHtml(p.name)}</span>${mk ? `<i class="mk">${mk}</i>` : ""}`;
    card.style.setProperty("--pc", p.color);
    // победитель вспыхивает, когда упадёт последний голос самой длинной «пачки»
    card.style.setProperty("--wd", (0.55 + Math.min(Math.max(...r.tally), 16) * 0.12).toFixed(2) + "s");
    $("vn" + i).textContent = qpVotes(r.tally[i]);
    $("tags" + i).textContent = a.late ? T("late_mark") : a.hint ? T("hint_mark") : "";
    $("pts" + i).textContent = tpl("pts", { n: r.points[i] });
    $("tally" + i).innerHTML = Array.from({ length: Math.min(r.tally[i], 16) }, (_, k) => `<span class="v" style="--vd:${(0.4 + k * 0.12).toFixed(2)}s">😂</span>`).join("") + (r.tally[i] > 16 ? `<b>+${r.tally[i] - 16}</b>` : "");
    const jinx = r.jinx.includes(a.playerId);
    const win = r.winners.includes(a.playerId);
    card.classList.toggle("win", win);
    card.classList.toggle("dim", !win && r.winners.length > 0);
    card.classList.toggle("jx", jinx);
    const stamp = jinx ? T("jinx") : r.sweep === a.playerId ? T("sweep") : "";
    $("stamp" + i).textContent = stamp;
    $("stamp" + i).className = "stamp" + (jinx ? " jx" : stamp ? " sw" : "");
    card.classList.toggle("stamped", !!stamp);
    if (stamp) {
      const s = $("stamp" + i);
      let fs = 30;
      s.style.setProperty("--sfs", fs + "px");
      while (fs > 18 && s.scrollWidth > card.clientWidth - 20) { fs -= 3; s.style.setProperty("--sfs", fs + "px"); }
    }
  });
  if (r.jinx.length) qpSfx.jinx();
  if (total) qpSfx.applause(Math.max(...r.tally) / Math.max(1, total));
  // разгром: фанфары и хлопушка конфетти из таблички победителя — когда упадёт последний жетон
  if (r.sweep) {
    const si = c.answers.findIndex((a) => a.playerId === r.sweep);
    const card = $("a" + si);
    const wd = card ? parseFloat(card.style.getPropertyValue("--wd")) || 1 : 1;
    setTimeout(() => {
      qpSfx.sweep();
      if (!card || !card.isConnected) return;
      const b = card.getBoundingClientRect();
      qpConfetti({ x: b.left + b.width / 2, y: b.top + b.height / 3, n: 150 });
    }, wd * 1000 + 150);
  }
}

    <div class="board" style="--rowh:${rowh}px">${list.map((p, i) => { const d = p.score - from(p); return `<div class="rowx${p.place === 1 && p.score > 0 ? " lead" : ""}" style="--pc:${p.color};--ri:${(i * 0.06).toFixed(2)}s"><span class="n">${p.place}</span><i class="av puck">${escapeHtml(p.avatar)}</i><b>${escapeHtml(p.name)}</b><span class="d" style="--dd:${(0.3 + i * 0.08).toFixed(2)}s">${d > 0 ? escapeHtml(tpl("pts", { n: d })) : ""}</span><span class="s" data-from="${from(p)}" data-to="${p.score}">${p.score}</span></div>`; }).join("")}</div></div>`;

// прибавка «набегает» на табло: числа идут от старого счёта к новому (при reduced-motion — сразу итог)
function countUp() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const nodes = [...main.querySelectorAll(".rowx .s[data-from]")].filter((n) => n.dataset.from !== n.dataset.to);
  if (!nodes.length) return;
  const t0 = performance.now() + 250, dur = 1000;
  nodes.forEach((n) => (n.textContent = n.dataset.from));
  const step = (now) => {
    const k = Math.max(0, Math.min(1, (now - t0) / dur));
    const e = 1 - Math.pow(1 - k, 3);
    nodes.forEach((n) => { if (n.isConnected) n.textContent = Math.round(+n.dataset.from + (n.dataset.to - n.dataset.from) * e); });
    if (k < 1 && nodes[0].isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  const cls = ["p2", "p1", "p3"];
  const award = (label, a) => {
    if (!a) return "";
    const p = player(a.playerId) || { name: "?", avatar: "?" };
    return `<div class="card award"><div class="k">${escapeHtml(label)}</div><div class="q">${qpPromptHtml(a.prompt)}</div>
      <div class="a">${qpAnswerHtml(a)}</div><div class="by">${escapeHtml(p.avatar)} ${escapeHtml(p.name)} · ${escapeHtml(qpVotes(a.votes))}</div></div>`;
  };
  const fast = present().filter((p) => p.avgMs != null).sort((a, b) => a.avgMs - b.avgMs)[0];
  const reason = state.finishedReason === "few" ? T("final_few") : state.finishedReason === "host" ? T("final_host") : "";
  main.innerHTML = `<div class="screen final">
    <div class="panel cast"><h2>${T("final_title")}<span${reason ? "" : ` class="hidden"`}>${escapeHtml(reason)}</span></h2>
      <div class="podium">${top.map((p, i) => (p ? `<div class="step ${cls[i]}" style="--pc:${p.color}">${cls[i] === "p1" ? `<span class="crown" aria-hidden="true">👑</span>` : ""}<i class="av puck">${escapeHtml(p.avatar)}</i><b>${escapeHtml(p.name)}</b><div class="sc">${p.score}</div><div class="col">${p.place}</div></div>` : `<div class="step"></div>`)).join("")}</div>
      <div class="hostbtns" style="margin-top:auto">${isHost ? `<button class="start" id="again" type="button">${T("btn_again")}</button><button class="ghostbtn" id="tolobby" type="button">${T("btn_lobby")}</button>` : ""}<a class="ghostbtn homebtn" id="homebtn" href="index.html">${T("btn_home")}</a></div>
    </div>
    <div class="awards">${award(T("best"), state.best) || `<div class="card award"><div class="a">${T("no_best")}</div></div>`}
      ${award(T("hint_star"), state.hintStar)}
      ${fast ? `<div class="card award"><div class="k">${T("fastest")}</div><div class="a">${escapeHtml(fast.avatar)} ${escapeHtml(fast.name)}</div><div class="by">${escapeHtml(tpl("avg_s", { s: qpSec(fast.avgMs) }))}</div></div>` : ""}
      <div class="setlist" id="setlist"><div class="k">${T("setlist")}</div>
        <ol class="${list.length > 8 ? "two" : ""}" style="grid-template-rows:repeat(${list.length > 8 ? Math.ceil(list.length / 2) : list.length}, minmax(0, 1fr))">${list.map((p) => `<li><span class="n">${p.place}</span><i class="av">${escapeHtml(p.avatar)}</i><b>${escapeHtml(p.name)}</b><span class="dots"></span><span class="s">${p.score}</span></li>`).join("")}</ol></div>
    </div></div>`;
  // шрифт сет-листа — по высоте строки: трое — крупно, шестнадцать — мельче, но без обрезки
  const sl = $("setlist");
  if (sl) {
    const ol = sl.querySelector("ol");
    const rowsN = Math.max(1, list.length > 8 ? Math.ceil(list.length / 2) : list.length);
    const fs = Math.max(15, Math.min(34, Math.floor((ol.clientHeight / rowsN) * 0.5)));
    sl.style.setProperty("--slfs", fs + "px");
  }
  if (isHost) {
    $("again").onclick = () => conn.send({ type: "start" });
    $("tolobby").onclick = () => conn.send({ type: "lobby" });
  }
  // конец шоу: фанфары и дождь конфетти над пьедесталом
  if (state.finishedReason === "done") {
    qpSfx.fanfare();
    setTimeout(() => { if (state && state.phase === "finished") qpConfetti({ mode: "rain", n: 220 }); }, 700);
  }
}

// ---------- кадр: часы ----------
let lastTick = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead || !state.phaseEnd) return;
  const left = state.phaseEnd - qpNow();
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const clock = $("clock");
  const hot = left < 5000 && (state.phase === "answer" || state.phase === "vote");
  if (clock) { clock.textContent = Math.max(0, Math.ceil(left / 1000)); clock.classList.toggle("hot", hot); }
  const tl = $("timeline");
  if (tl) { tl.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`; tl.classList.toggle("hot", hot); }
  if (hot && left > 0) {
    const s = Math.ceil(left / 1000);
    if (s !== lastTick) { lastTick = s; qpSfx.tick(true); }
  }
}

// ---------- отрисовка ----------
function render() {
  if (!state || dead) return;
  const was = viewKey;
  paint();
  if (viewKey !== was) qpConfettiClear();
}
function paint() {
  document.body.dataset.phase = state.phase;
  $("codechip").innerHTML = `<b>${escapeHtml(CODE)}</b>`;
  $("codechip").classList.toggle("hidden", state.phase === "lobby");
  const inGame = !["lobby", "finished"].includes(state.phase);
  $("roundchip").classList.toggle("hidden", !inGame);
  if (inGame && state.roundKey) $("roundchip").innerHTML = `${escapeHtml(tpl("round_n", { n: state.ri + 1 }))} · <b>${escapeHtml(qpRoundName(state.roundKey, state.small))}</b>${state.mult > 1 ? " " + escapeHtml(tpl("mult", { n: state.mult })) : ""}`;
  $("endbtn").classList.toggle("hidden", !(isHost && inGame));
  $("endbtn").textContent = T("btn_end");
  switch (state.phase) {
    case "lobby": return drawLobby();
    case "intro": return drawIntro();
    case "answer": return drawAnswer();
    case "vote":
    case "reveal": return drawWall();
    case "scores": return drawScores();
    case "finished": return drawFinal();
  }
}
$("endbtn").onclick = () => conn.send({ type: "end" });

window.addEventListener("resize", () => { viewKey = ""; if (state) render(); });
window.addEventListener("langchange", () => {
  viewKey = "";
  // язык доски — язык колоды комнаты: в лобби ведущий переключает и вопросы
  if (isHost && state && (state.phase === "lobby" || state.phase === "finished") && state.settings.lang !== qpLang()) conn.send({ type: "settings", settings: { lang: qpLang() } });
  render();
});

// реакции: эмодзи взлетает снизу с именем
function floatReact(playerId, emoji) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const p = player(playerId);
  const f = el("div", "floater");
  f.style.left = (8 + Math.random() * 84) + "vw";
  f.append(el("span", null, emoji), el("small", null, p ? p.name : ""));
  document.body.append(f);
  setTimeout(() => f.remove(), 2700);
}

// ---------- связь ----------
function onMessage(m) {
  switch (m.type) {
    case "hello":
      state = m.state;
      if (!isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      state = m.state;
      render();
      break;
    case "host_ok":
      isHost = true;
      document.body.classList.add("host");
      viewKey = "";
      // язык доски главнее: комнату создали на одном языке, а доску переключили — синхронизируем
      if (state && state.phase === "lobby" && state.settings.lang !== qpLang()) conn.send({ type: "settings", settings: { lang: qpLang() } });
      render();
      break;
    case "host_lost":
      isHost = false;
      document.body.classList.remove("host");
      viewKey = "";
      render();
      break;
    case "event":
      if (m.event.type === "react") floatReact(m.event.playerId, m.event.emoji);
      break;
    case "error":
      if (m.error === "room_expired") gone();
      break;
  }
}

function gone() {
  dead = true;
  main.innerHTML = "";
  showBanner(T("expired"));
}

async function boot() {
  // ?h=токен — ссылка ведущего на другое устройство: токен кладём в хранилище и убираем из адреса
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  conn = qpConnect({
    code: CODE,
    onMessage,
    onGone: gone,
    onOpen: () => { isHost = false; },
    onState: (st) => { banner.textContent = T("err_connect"); banner.classList.toggle("on", st === "lost"); },
  });
  requestAnimationFrame(frame);
  // ручка для отладки и стенда: те же сообщения, что шлют кнопки доски
  window.qpBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
boot();
</script>
