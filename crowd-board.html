<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1faa2.svg" type="image/svg+xml">
<title>Как все — общий экран</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="crowd-theme.css">
<style>
  /* Мир: «перетягивание каната на сельской ярмарке» (crowd-spec.md §9). Дневной свет, небо и трава, канат через весь экран,
     красный лоскут над ямой с лужей, вывески-стрелки «ДА» / «НЕТ» на столбах. Общий экран смотрят с трёх метров.
     Результат остаётся в сцене: лоскут у большинства, меньшинство сидит в луже, пока не начнётся следующий вопрос. */
  :root {
    --lang-switch-bg: var(--paper);
    --lang-switch-border: var(--ink);
    --lang-switch-fg: var(--ink);
    --lang-switch-fg-hover: var(--ink);
    --lang-switch-hover-bg: var(--paper-d);
    --lang-switch-active-bg: var(--ink);
    --lang-switch-active-fg: var(--paper);
    --lang-switch-active-border: var(--ink);
    --lang-switch-font: var(--f-body);
    --sgw: clamp(120px, 15vw, 300px);
    --sh: 440px;      /* высота сцены (JS) */
    --gy: 220px;      /* линия травы в сцене (JS) */
    --sz: 80px;       /* максимальный размер аватара (JS) */
    --bar-h: 64px;
    --pop: cubic-bezier(.2, 1.5, .4, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--sky); color: var(--ink); font: 500 18px/1.3 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  b, strong { font-weight: 900; }

  /* ---------- небо и трава ---------- */
  #sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: linear-gradient(#8fc3d6 0%, var(--sky) 38%, #e6f1ea 78%); }
  #sky svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  #sky .cloud { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  #ground { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--sh) - var(--gy)); z-index: 1; background: var(--grass); pointer-events: none;
    background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, .0) 0 7vw, rgba(70, 120, 30, .13) 7vw 14vw); }
  #ground::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 16px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='16' viewBox='0 0 36 16'><path d='M0 16 L4 4 L8 16 L13 2 L18 16 L23 5 L28 16 L32 3 L36 16Z' fill='%238cbb52'/></svg>") repeat-x bottom / 36px 16px; }
  #ground::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: var(--grass-d); opacity: .22; }

  /* ---------- шапка ---------- */
  .top { position: fixed; left: 0; right: 0; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; height: calc(var(--lsc, 32px) * 2); padding: 0 var(--lsw, 160px) 0 26px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { font: 900 24px/1 var(--f-head); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
  .brand i { width: 38px; height: 14px; border-radius: 8px; background: var(--rope); border-bottom: 4px solid var(--rope-d); position: relative; flex: none; }
  .brand i::after { content: ""; position: absolute; left: 16px; top: -10px; width: 9px; height: 17px; background: var(--flag); border-radius: 1px 5px 1px 5px; }
  .chip { font: 900 18px/1 var(--f-head); padding: 7px 12px; background: var(--paper); border: 3px solid var(--ink); border-radius: 4px; letter-spacing: .08em; white-space: nowrap; }
  .grow { flex: 1; }
  .sound-toggle-btn, .endbtn { flex: none; height: var(--lsh, 44px); width: var(--lsh, 44px); border: 3px solid var(--ink); border-radius: 50%; background: var(--paper); color: var(--ink); padding: 0; display: grid; place-items: center; font-size: 16px; }
  .sound-toggle-btn svg { width: 20px; height: 20px; }
  .endbtn:hover, .sound-toggle-btn:hover { background: var(--paper-d); }
  .banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--paper); padding: 8px 14px; font-weight: 800; border-radius: 4px; }
  .conn { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--paper); padding: 6px 12px; font-weight: 800; border-radius: 4px; visibility: hidden; }
  .conn.on { visibility: visible; }

  main { position: fixed; left: 0; right: 0; top: calc(var(--lsc, 32px) * 2); bottom: 0; z-index: 2; }
  #upper { position: absolute; left: 0; right: 0; top: 0; bottom: var(--sh); z-index: 3; }
  body.fin #upper { bottom: 0; }
  .up { position: absolute; inset: 0; display: grid; grid-template-columns: var(--sgw) minmax(0, 1fr) var(--sgw); gap: 2vw; padding: 0 2vw 0; min-height: 0; }

  /* ---------- вывески на столбах: стрелки ДА ← → НЕТ ---------- */
  .sign { position: relative; align-self: end; height: min(100%, 24vh); min-height: 96px; display: flex; flex-direction: column; justify-content: flex-start; }
  .sign.a { grid-column: 1; grid-row: 1; }
  .sign.b { grid-column: 3; grid-row: 1; }
  .sg-board { position: relative; flex: 1; min-height: 0; color: #fff; display: flex; align-items: center; gap: .35em; padding: 0 .5em 0 .7em; font-family: var(--f-head); font-weight: 900; text-transform: uppercase; line-height: 1;
    background-color: var(--c); background-image: repeating-linear-gradient(180deg, transparent 0 30px, rgba(0, 0, 0, .13) 30px 32px); box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .2); text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
  .sign.a { --c: var(--side-a); }
  .sign.b { --c: var(--side-b); }
  .sign.a .sg-board { clip-path: polygon(0 50%, 16% 0, 100% 0, 100% 100%, 16% 100%); padding-left: 18%; }
  .sign.b .sg-board { clip-path: polygon(0 0, 84% 0, 100% 50%, 84% 100%, 0 100%); padding-right: 18%; flex-direction: row-reverse; }
  .sg-ico { flex: none; display: grid; place-items: center; width: 1.1em; height: 1.1em; border-radius: 50%; background: #fff; color: var(--c); font-size: clamp(22px, 4.6vh, 56px); text-shadow: none; font-family: var(--f-body); font-weight: 900; }
  .sg-word { min-width: 0; flex: 1; font-size: clamp(26px, 6vh, 74px); display: flex; align-items: center; justify-content: center; text-align: center; }
  .sg-word > span { min-width: 0; overflow-wrap: normal; word-break: normal; hyphens: manual; }
  .sign.ab .sg-word { font-size: clamp(18px, 3.4vh, 40px); line-height: 1.05; }
  .sg-post { height: 14px; flex: none; width: 18px; margin: 0 auto; background: linear-gradient(90deg, #a87a3d, #8c5a22 60%, #6e4617); }
  .sg-n { position: absolute; top: -.35em; z-index: 2; min-width: 1.5em; height: 1.5em; padding: 0 .3em; border-radius: 999px; background: var(--paper); color: var(--ink); border: 4px solid var(--c); font: 900 clamp(28px, 6vh, 64px)/1.3 var(--f-head); text-align: center; font-variant-numeric: tabular-nums; opacity: 0; transform: scale(.4); transition: opacity .25s, transform .35s var(--pop); }
  .sign.a .sg-n { right: -.2em; }
  .sign.b .sg-n { left: -.2em; }
  .sg-n.on { opacity: 1; transform: none; }
  .sg-n.bump { animation: bump .3s var(--pop); }
  @keyframes bump { from { transform: scale(1.35); } }

  /* ---------- центральная колонка ---------- */
  .mid { grid-column: 2; grid-row: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 1.2vh; padding-top: 1.2vh; }
  .ribbon { position: relative; flex: none; background: var(--flag); color: var(--paper); font: 800 clamp(16px, 2.9vh, 34px)/1 var(--f-head); padding: .55em 1.8em; clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 50%, 100% 100%, 0 100%, 20px 50%); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .18); text-align: center; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .ribbon b { text-transform: uppercase; letter-spacing: .03em; border-bottom: 3px solid rgba(255, 245, 220, .6); }
  .ribbon.think { background: var(--ink-soft); }
  .qbox { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .qtxt { margin: 0; width: 100%; text-align: center; font: 900 var(--qfs, 64px)/1.06 var(--f-head); text-wrap: balance; overflow-wrap: anywhere; hyphens: auto; }
  .meta { flex: none; width: 100%; display: flex; align-items: center; justify-content: center; gap: 2.2vw; font: 800 clamp(15px, 2.4vh, 28px)/1 var(--f-head); padding-bottom: 1.2vh; }
  .meta .prog { white-space: nowrap; text-transform: uppercase; letter-spacing: .06em; }
  .pips { display: flex; gap: 5px; }
  .pips i { width: 11px; height: 11px; border-radius: 50%; background: rgba(42, 29, 18, .22); }
  .pips i.d { background: var(--ink); }
  .pips i.c { background: var(--flag); transform: scale(1.35); }
  .rdy { min-width: 9.5em; text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rdy::before { content: "✓"; display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; margin-right: .45em; border-radius: 50%; background: var(--ok); color: #fff; font-size: .9em; }
  .rdy.ask::before { content: "💭"; background: none; }

  /* ---------- раскрытие ---------- */
  .qline { flex: none; width: 100%; display: flex; align-items: baseline; justify-content: center; gap: 1.2vw; }
  .qline .qk { flex: none; font: 800 clamp(13px, 2vh, 22px)/1 var(--f-head); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; opacity: .75; }
  .qline .qtxt { width: auto; flex: 0 1 auto; max-height: 2.2em; overflow: hidden; }
  .verdict { position: relative; flex: 1; min-height: 0; width: 100%; }
  .verdict > * { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .3em; opacity: 0; transform: scale(.7) rotate(-3deg); transition: opacity .25s, transform .4s var(--pop); pointer-events: none; }
  .verdict > .on { opacity: 1; transform: none; }
  .vd-idle { opacity: 1 !important; transform: none !important; }
  .stamp { display: inline-block; font: 900 var(--u, 60px)/1.05 var(--f-head); text-transform: uppercase; padding: .12em .5em; border: .09em solid currentColor; border-radius: .12em; background: rgba(255, 245, 220, .7); transform: rotate(-2deg); text-wrap: balance; max-width: 100%; }
  .vd-sub { font: 800 max(calc(var(--u, 60px) * .38), 15px)/1.1 var(--f-head); }
  .stamp.a { color: var(--side-a); } .stamp.b { color: var(--side-b); }
  .stamp.tie { color: var(--ink); } .stamp.one { color: var(--ok); } .stamp.void { color: var(--ink-soft); font-size: calc(var(--u, 60px) * .62); }
  .wolfnote { font: 800 max(calc(var(--u, 60px) * .3), 15px)/1.1 var(--f-head); }
  .illusion { z-index: 2; }
  .illusion .plate { background: var(--flag); color: var(--paper); padding: .5vh 2vw 1vh; border: 5px solid var(--ink); border-radius: 6px; box-shadow: 0 8px 0 rgba(42, 29, 18, .3); transform: rotate(-2deg); max-width: 100%; }
  .illusion .plate h2 { margin: 0; font: 900 var(--u, 60px)/1.05 var(--f-head); letter-spacing: .03em; }
  .illusion .plate p { margin: .1em 0 0; font: 700 max(calc(var(--u, 60px) * .4), 15px)/1.15 var(--f-head); text-wrap: balance; }
  .illusion .plate p b { background: var(--paper); color: var(--ink); padding: 0 .35em; border-radius: 3px; white-space: nowrap; }
  .oprope { flex: none; width: 100%; height: clamp(86px, 15vh, 170px); position: relative; }
  .oprope .oh { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: baseline; font: 900 clamp(14px, 2.3vh, 26px)/1 var(--f-head); text-transform: uppercase; letter-spacing: .05em; }
  .oprope .oh span { font-variant-numeric: tabular-nums; }
  .oprope .oc { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
  .oprope .orope { position: absolute; left: 0; right: 0; top: 58%; height: .6em; border-radius: 6px; background: var(--rope); border-bottom: 4px solid var(--rope-d); font-size: clamp(12px, 2vh, 22px); }
  .oprope .tk { position: absolute; top: 58%; width: 1.9em; height: 1.9em; margin-top: -2.05em; border-radius: 50%; background: var(--paper); border: 3px solid var(--c); display: grid; place-items: center; font-size: clamp(12px, 2vh, 22px); opacity: 0; transform: translateY(-.8em) scale(.5); transition: opacity .2s, transform .35s var(--pop); }
  .oprope .tk.on { opacity: 1; transform: none; }
  .oprope .tk.a { --c: var(--side-a); } .oprope .tk.b { --c: var(--side-b); }
  .oprope .oflag { position: absolute; top: 58%; left: 0; width: 0; height: 0; z-index: 2; }
  .oprope .oflag svg { position: absolute; left: -.7em; bottom: .15em; width: clamp(24px, 4.4vh, 48px); height: auto; overflow: visible; }

  /* ---------- счёт ---------- */
  .sc { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 1.2vh; grid-template-columns: none; padding: 1vh 5vw 1.4vh; }
  .sc-head { flex: none; display: flex; align-items: baseline; justify-content: center; gap: 1.6vw; flex-wrap: wrap; text-align: center; }
  .sc-head h2 { margin: 0; font: 900 clamp(24px, 4.6vh, 54px)/1.1 var(--f-head); }
  .sc-head p { margin: 0; font: 700 clamp(14px, 2.4vh, 26px)/1.1 var(--f-head); }
  .sc-tab { font-size: var(--fs, 24px); flex: 0 0 auto; height: var(--th, 300px); min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 6), minmax(0, 1fr)); grid-auto-flow: column; gap: .6vh 3vw; align-content: stretch; width: 100%; max-width: 1500px; margin: 0 auto; }
  .row { display: grid; grid-template-columns: 1.4em 1.9em minmax(0, 7.5em) auto minmax(40px, 1fr) 3em 3.4em; align-items: center; gap: .5em; min-height: 0; font: 800 1em/1 var(--f-head); background: rgba(255, 245, 220, .72); border-radius: 6px; padding: 0 .5em; border-left: .3em solid var(--pc); }
  .row .rk { text-align: center; font-variant-numeric: tabular-nums; }
  .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { display: grid; place-items: center; width: 1.8em; height: 1.8em; font-size: .62em; border-radius: 50%; background: var(--paper); border: .16em solid var(--pc); font-style: normal; line-height: 1; flex: none; }
  .row .av { font-size: .7em; }
  .row .bd { display: flex; gap: .3em; white-space: nowrap; font-size: .7em; }
  .row .bd:empty { visibility: hidden; }
  .tag2 { background: var(--flag); color: #fff; border-radius: 4px; padding: .1em .35em; font-weight: 900; }
  .bar { height: .6em; border-radius: 4px; background: rgba(42, 29, 18, .13); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--pc); transform-origin: left; transform: scaleX(var(--w0, 0)); transition: transform 1s cubic-bezier(.3, 1, .4, 1) .3s; }
  .row .tot { text-align: right; font-variant-numeric: tabular-nums; }
  .row .tot.neg { color: var(--bad); }
  .row .dl { text-align: right; font-variant-numeric: tabular-nums; font-size: .85em; opacity: 0; transform: translateY(.4em); transition: opacity .3s .5s, transform .4s var(--pop) .5s; }
  .row .dl.on { opacity: 1; transform: none; }
  .row .dl.pos { color: var(--ok); } .row .dl.neg { color: var(--bad); } .row .dl.zero { opacity: .55; }
  .row.out { opacity: .55; }

  /* ---------- заставки, пауза ---------- */
  .full { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; grid-template-columns: none; padding: 0 8vw; }
  .poster { position: relative; background: var(--paper); border: 6px solid var(--ink); border-radius: 8px; padding: 2.4vh 4vw 2.8vh; box-shadow: 0 10px 0 rgba(42, 29, 18, .28); transform: rotate(-1.2deg); animation: slam .55s var(--pop) both; max-width: 100%; }
  .poster h1 { margin: 0; font: 900 clamp(46px, 15vh, 190px)/1.05 var(--f-head); text-transform: uppercase; letter-spacing: .02em; }
  .poster .x2 { display: inline-block; margin-left: .15em; color: var(--flag); }
  .poster p { margin: 1vh 0 0; font: 700 clamp(18px, 3.2vh, 40px)/1.2 var(--f-head); max-width: 24em; text-wrap: balance; }
  .poster::before, .poster::after { content: ""; position: absolute; top: -18px; width: 14px; height: 36px; background: var(--rope-d); border-radius: 3px; }
  .poster::before { left: 12%; } .poster::after { right: 12%; }
  @keyframes slam { from { transform: scale(1.5) rotate(4deg); opacity: 0; } }
  .only { display: flex; flex-wrap: wrap; justify-content: center; gap: 1vh 1.2vw; }
  .only span { display: inline-flex; align-items: center; gap: .5em; font: 800 clamp(16px, 3vh, 34px)/1 var(--f-head); background: var(--paper); border-radius: 999px; padding: .2em .8em .2em .2em; border: 3px solid var(--ink); }
  .only .av { font-size: .8em; }
  .wait { font: 900 clamp(26px, 5vh, 60px)/1 var(--f-head); }

  /* ---------- лобби ---------- */
  .lobby { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); gap: 2.6vw; padding: 1.5vh 3vw 2.4vh; align-items: stretch; }
  .lobby > div { min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 1.4vh; }
  .ticket { position: relative; background: var(--paper); border: 4px solid var(--ink); border-radius: 8px; padding: 1.6vh 1.2vw; display: flex; flex-direction: column; align-items: center; gap: 1vh; text-align: center; transform: rotate(-1deg); box-shadow: 0 8px 0 rgba(42, 29, 18, .22); }
  .ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 26px; height: 26px; margin-top: -13px; border-radius: 50%; background: var(--sky-d); border: 4px solid var(--ink); }
  .ticket::before { left: -17px; } .ticket::after { right: -17px; }
  #qr { width: clamp(120px, 24vh, 250px); height: clamp(120px, 24vh, 250px); background: #fff; padding: 6px; border: 3px solid var(--ink); }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  .bigcode { font: 900 var(--code-fs, 56px)/1 var(--f-head); letter-spacing: .04em; white-space: nowrap; max-width: 100%; overflow: hidden; }
  .url { font: 600 clamp(12px, 1.8vh, 18px)/1.2 var(--f-body); opacity: .75; overflow-wrap: anywhere; }
  .lb-h { margin: 0; font: 900 clamp(40px, 11vh, 130px)/1 var(--f-head); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; overflow-wrap: anywhere; }
  .lb-tag { margin: 0; font: 700 clamp(18px, 3.2vh, 38px)/1.15 var(--f-head); }
  .lb-tag b { color: var(--flag); text-transform: uppercase; }
  .rules { margin: 0; padding: 0; list-style: none; counter-reset: r; display: flex; flex-direction: column; gap: .9vh; }
  .rules li { counter-increment: r; display: grid; grid-template-columns: 2em 1fr; align-items: center; gap: .6em; font: 600 clamp(14px, 2.2vh, 24px)/1.2 var(--f-body); }
  .rules li::before { content: counter(r); display: grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--ink); color: var(--paper); font: 900 1em var(--f-head); }
  .lb-pn { font: 800 clamp(15px, 2.4vh, 26px)/1 var(--f-head); text-transform: uppercase; letter-spacing: .06em; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255, 245, 220, .8); border: 3px solid var(--ink); border-radius: 6px; padding: 1vh 14px; }
  .opt b { display: block; font: 900 clamp(16px, 2.6vh, 28px)/1.1 var(--f-head); }
  .opt span { font-size: clamp(12px, 1.8vh, 18px); opacity: .8; display: block; line-height: 1.2; }
  .opt span.warn { color: var(--bad); opacity: 1; font-weight: 700; }
  .tog { flex: none; width: 76px; height: 38px; border: 3px solid var(--ink); border-radius: 20px; background: var(--paper-d); position: relative; padding: 0; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); transition: transform .2s var(--pop); }
  .tog[aria-pressed="true"] { background: var(--ok); }
  .tog[aria-pressed="true"]::after { transform: translateX(38px); background: var(--paper); }
  .start, .ghostbtn { border: 4px solid var(--ink); border-radius: 8px; font: 900 clamp(22px, 3.8vh, 40px)/1 var(--f-head); text-transform: uppercase; letter-spacing: .04em; padding: 1.6vh 20px; text-align: center; text-decoration: none; color: var(--ink); }
  .start { width: 100%; background: var(--flag); color: var(--paper); box-shadow: 0 7px 0 rgba(42, 29, 18, .35); transition: transform .1s, box-shadow .1s; }

<script>
"use strict";

const params = new URLSearchParams(location.search);

const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

let conn = null, state = null, isHost = false, dead = false;

(function buildSky() {

    <g transform="translate(300 600)"><rect x="-4" y="30" width="8" height="48" fill="#8c5a22"/><circle cx="0" cy="18" r="34" fill="#6fa047"/><circle cx="-24" cy="36" r="22" fill="#79ad50"/></g>
    <g transform="translate(470 620)"><rect x="-3" y="22" width="6" height="36" fill="#8c5a22"/><circle cx="0" cy="12" r="24" fill="#6fa047"/></g>
  </svg>`;
})();

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  showBanner(T("creating"));
  try {
    const body = { settings: { lang: wvLang() } };
    if (params.get("speed")) body.speed = Number(params.get("speed"));
    const res = await fetch("/crowd/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
    showBanner(null);
    return true;
  } catch (err) {
    showBanner(String(err.message || err));
    return false;
  }
}
function showBanner(text) {
  const b = $("banner");
  b.classList.toggle("hidden", !text);
  b.textContent = text || "";
}

// ---------- геометрия сцены ----------
const M = { W: 1600, H: 440, sz: 80, ropeY: 160, gy: 220, postL: 120, postR: 1480, px: 800, py: 340, rx: 140, ry: 40, nfs: 16 };
function measure() {
  const vw = innerWidth, vh = innerHeight;
  const portrait = vw / vh < 1.25;
  const sh = Math.round(clamp(vh * (portrait ? 0.38 : 0.44), 300, 560));
  const gy = Math.round(sh * 0.5);
  const sz = Math.round(clamp((gy - 40) / 2.35, 40, 88));
  const ropeY = Math.round(40 + 1.5 * sz);
  document.documentElement.style.setProperty("--sh", sh + "px");
  document.documentElement.style.setProperty("--gy", gy + "px");
  document.documentElement.style.setProperty("--sz", sz + "px");
  const sgw = clamp(vw * 0.15, 120, 300);
  M.W = vw; M.H = sh; M.sz = sz; M.ropeY = ropeY; M.gy = gy;
  M.postL = portrait ? vw * 0.05 : vw * 0.02 + sgw / 2;
  M.postR = vw - M.postL;
  M.px = vw / 2;
  M.py = gy + (sh - gy) * 0.5;
  M.rx = clamp(vw * 0.085, 80, 220);
  M.ry = clamp((sh - gy) * 0.3, 30, 90);
  M.nfs = Math.round(clamp(sz * 0.2, 12, 19));
  M.portrait = portrait;
  buildStageSvg();
}
const sagAt = (x, sag) => { const u = (x - M.W / 2) / (M.W / 2); return sag * (1 - u * u); };
let sagNow = 5;
function ropePath(sag) {
  const y = M.ropeY, W = M.W;
  return `M -30 ${y} Q ${W / 2} ${y + sag * 2} ${W + 30} ${y}`;
}
function setRope(sag) {
  sagNow = sag;
  const d = ropePath(sag);
  const sw = Math.max(12, M.sz * 0.19);
  const sh = $("ropeSh"), p = $("ropeP"), t = $("ropeT");
  sh.setAttribute("d", ropePath(sag + 0)); sh.setAttribute("transform", `translate(0 ${sw * 0.7})`); sh.setAttribute("stroke-width", sw);
  p.setAttribute("d", d); p.setAttribute("stroke-width", sw);
  t.setAttribute("d", d); t.setAttribute("stroke-width", sw * 0.8); t.setAttribute("stroke-dasharray", `${sw * 0.35} ${sw * 1.05}`);
}
function buildStageSvg() {
  const { W, H, gy, ropeY, postL, postR, px, py, rx, ry } = M;
  for (const id of ["sgBack", "sgRope", "sgFront"]) $(id).setAttribute("viewBox", `0 0 ${W} ${H}`);
  const post = (x) => `<g><rect x="${x - 10}" y="-4" width="20" height="${gy + 34}" rx="3" fill="#a87a3d"/><rect x="${x + 2}" y="-4" width="8" height="${gy + 34}" rx="3" fill="#6e4617" opacity=".55"/><ellipse cx="${x}" cy="${gy + 32}" rx="26" ry="8" fill="#4a3220" opacity=".35"/></g>`;
  const bale = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-34" y="-26" width="68" height="40" rx="6" fill="#e3c26a" stroke="#9b7a22" stroke-width="3"/><path d="M-34 -12 H34 M-34 2 H34 M-16 -26 V14 M16 -26 V14" stroke="#9b7a22" stroke-width="2.5" opacity=".7"/></g>`;
  const tuft = (x, y) => `<path d="M${x} ${y} l-5 -14 l7 9 l2 -16 l4 15 l7 -10 l-4 16Z" fill="#5b8a34"/>`;
  let tufts = "";
  for (let i = 0; i < 14; i++) tufts += tuft(((i * 137.5) % 100) / 100 * W, gy + 14 + ((i * 53) % 100) / 100 * (H - gy - 20));
  const pitCy = py;
  $("sgBack").innerHTML =
    post(postL) + post(postR) + tufts +
    // яма: тёмный край и глинистая вода
    `<ellipse cx="${px}" cy="${pitCy + 6}" rx="${rx * 1.24}" ry="${ry * 1.25}" fill="#3a2716"/>
     <ellipse cx="${px}" cy="${pitCy}" rx="${rx * 1.16}" ry="${ry * 1.15}" fill="#6a4a2e"/>
     <ellipse cx="${px}" cy="${pitCy + 2}" rx="${rx}" ry="${ry}" fill="#7b9aa0"/>
     <ellipse cx="${px - rx * 0.25}" cy="${pitCy - ry * 0.25}" rx="${rx * 0.35}" ry="${ry * 0.12}" fill="#fff" opacity=".28"/>` +
    bale(M.W * 0.045, H - 18, 0.9) + bale(M.W * 0.955, H - 14, 0.8) +
    // меловая метка центра под канатом
    `<path d="M${px} ${ropeY + 14} V${pitCy - ry * 1.2}" stroke="#fff5dc" stroke-width="3" stroke-dasharray="7 8" opacity=".55"/>`;
  // «вода поверх»: упавшие игроки сидят в луже до пояса
  $("sgFront").innerHTML =
    `<g id="veil" opacity="0" style="transition:opacity .4s"><ellipse cx="${px}" cy="${pitCy + 3}" rx="${rx * 1.02}" ry="${ry * 1.02}" fill="#6f939c" opacity=".6"/>
     <path d="M${px - rx * 0.8} ${pitCy + ry * 0.3} q ${rx * 0.2} -8 ${rx * 0.4} 0 t ${rx * 0.4} 0 t ${rx * 0.4} 0 t ${rx * 0.4} 0" fill="none" stroke="#fff" stroke-width="3" opacity=".4" stroke-linecap="round"/></g>`;
  // бечёвка таймера с флажками
  const n = Math.ceil(W / 46), ys = (x) => 12 + 10 * (1 - Math.pow((x - W / 2) / (W / 2), 2));
  let flags = "";
  const cols = ["#e0352b", "#2e6fd9", "#ffd34d", "#fff5dc"];
  for (let i = 1; i < n; i++) { const x = (i / n) * W, y = ys(x); flags += `<path d="M${x - 9} ${y} h18 l-9 18Z" fill="${cols[i % 4]}" stroke="rgba(42,29,18,.5)" stroke-width="1.5" stroke-linejoin="round"/>`; }
  const tpath = `M -10 ${ys(0) - 1} Q ${W / 2} ${ys(W / 2) + 10} ${W + 10} ${ys(W) - 1}`;
  $("tsvg").setAttribute("viewBox", `0 0 ${W} 44`);
  $("tsvg").innerHTML = `<path d="${tpath}" fill="none" stroke="#6e4617" stroke-width="3"/>${flags}<g id="tdone"><path d="${tpath}" fill="none" stroke="#2a1d12" stroke-width="5" stroke-linecap="round"/></g>`;
  $("tstring").dataset.ys = "";
  M.tys = ys;
  setRope(sagNow);
}

// ---------- игроки на канате ----------
const PL = new Map(); // id → {el, key, ...}
let mode = ""; // "spread" | "huddle" | "reveal"
function ensurePlayers() {
  const ps = present();
  const ids = new Set(ps.map((p) => p.id));
  for (const [id, pl] of PL) if (!ids.has(id)) { pl.el.remove(); PL.delete(id); }
  ps.forEach((p, i) => {
    let pl = PL.get(p.id);
    if (!pl) {
      const el = document.createElement("div");
      el.className = "pl f enter inst";
      el.id = "pl-" + p.id;
      el.innerHTML = `<div class="pl-s"><div class="pl-w"><div class="pl-in"><i class="hand l"></i><i class="hand r"></i><div class="bub"></div></div></div><span class="chk">✓</span><span class="wmark">🐺</span></div><div class="nm2"><span></span><button class="x" type="button">✕</button></div><span class="pts"></span>`;
      el.style.setProperty("--dl", ((i * 0.37) % 3).toFixed(2) + "s");
      stage.append(el);
      pl = { el, id: p.id, key: "", placed: false };
      PL.set(p.id, pl);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("inst")));
      setTimeout(() => el.classList.remove("enter"), 700);
      el.querySelector(".x").onclick = (e) => { e.stopPropagation(); if (isHost) conn.send({ type: "kick", playerId: p.id }); };
    }
    pl.el.style.setProperty("--pc", p.color);
    const bub = pl.el.querySelector(".bub");
    if (bub.textContent !== p.avatar) bub.textContent = p.avatar;
    pl.el.querySelector(".nm2 span").textContent = p.name;
    pl.p = p;
  });
}
// размеры и позиции
function rowsFor(n) { return n > (M.portrait ? 3 : 6) ? 2 : 1; }
// слоты в полосе [x0, x1] (x0 — ближний к центру край, x1 — дальний), порядок от x0 к x1
function layoutRow(n, x0, x1, maxStep) {
  const R = rowsFor(n), cols = Math.ceil(n / R);
  const span = Math.abs(x1 - x0), dir = x1 >= x0 ? 1 : -1;
  const step = Math.min(span / (cols + (R === 2 ? 0.5 : 0)), maxStep);
  const out = [];
  for (let j = 0; j < n; j++) {
    const row = R === 2 ? j % 2 : 0, col = Math.floor(j / R);
    out.push({ x: x0 + dir * (col + 0.5 + (row ? 0.5 : 0)) * step, row });
  }
  return { slots: out, step, k: Math.min(1, (step * 0.94) / M.sz) };
}
function centered(n, half, maxStep) {
  // толпа по обе стороны от центра: посередине оставлен просвет под лоскут и меловую метку
  const R = rowsFor(n), nl = Math.ceil(n / 2), nr = n - nl, gap = M.sz * 0.62;
  const cols = Math.ceil(nl / R);
  const step = Math.min((half - gap) / (cols + (R === 2 ? 0.5 : 0)), maxStep);
  const out = [];
  for (let j = 0; j < nl; j++) { const row = R === 2 ? j % 2 : 0, col = Math.floor(j / R); out.push({ x: M.px - gap - (col + 0.5 + (row ? 0.5 : 0)) * step, row }); }
  for (let j = 0; j < nr; j++) { const row = R === 2 ? j % 2 : 0, col = Math.floor(j / R); out.push({ x: M.px + gap + (col + 0.5 + (row ? 0.5 : 0)) * step, row }); }
  return { slots: out, step, k: Math.min(1, (step * 0.94) / M.sz) };
}
const yFor = (row, k) => M.ropeY + (row ? -0.28 : 0.38) * M.sz * k;
function setT(pl, t) {
  const key = [Math.round(t.x), Math.round(t.y), t.k.toFixed(2), t.row, Math.round(t.lean || 0), Math.round(t.tw), t.fallen ? 1 : 0].join();
  if (pl.key === key) return;
  pl.key = key;
  const e = pl.el;
  e.style.transform = `translate(${t.x.toFixed(1)}px,${t.y.toFixed(1)}px)`;
  e.style.setProperty("--k", t.k.toFixed(3));
  e.style.setProperty("--tw", Math.round(t.tw) + "px");
  e.style.setProperty("--nfs", M.nfs + "px");
  e.querySelector(".pl-in").style.setProperty("--lean", (t.lean || 0) + "deg");
  e.classList.toggle("b", t.row === 1);
  e.classList.toggle("fallen", !!t.fallen);
}
function groupTargets(ids, lay, lean) {
  ids.forEach((id, j) => {
    const pl = PL.get(id); if (!pl) return;
    const s = lay.slots[j];
    setT(pl, { x: s.x, y: yFor(s.row, lay.k), k: lay.k, row: s.row, lean: lean || 0, tw: Math.max(54, lay.step * 0.98) });
  });
}
function layoutSpread() {
  const ids = [...PL.keys()];
  const lay = centered(ids.length, M.W * 0.43, M.sz * 2.3);
  groupTargets(ids, lay, 0);
}

let lastTickSec = null;
function timerFrame() {
  const tf = $("tflag"), live = state && !dead && (state.phase === "vote" || state.phase === "opinion" || state.phase === "pause") && state.phaseEnd;
  tf.classList.toggle("on", !!live);
  if (!live) { $("tdone").style.transform = "scaleX(0)"; return; }
  const left = phaseLeft();
  // в голосовании первые 5 с — чтение вопроса: флажок едет по всему отрезку, но красный только в последние 5 с
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const f = clamp(1 - left / total, 0, 1);
  const W = M.W, x = 18 + f * (W - 36);
  const y = M.tys ? M.tys(x) : 14;
  tf.style.transform = `translate(${x.toFixed(1)}px,${(y - 1).toFixed(1)}px)`;
  const hot = left < 5000 && state.phase !== "pause";
  tf.classList.toggle("hot", hot);
  const dn = $("tdone");
  dn.style.transform = `scaleX(${f.toFixed(4)})`;
  const sec = Math.max(0, Math.ceil(left / 1000));
  if (hot && left > 0 && sec !== lastTickSec) { lastTickSec = sec; wvSfx.tick(sec <= 2); }
  if (!hot) lastTickSec = null;
  if (tf.dataset.s !== String(sec)) { tf.dataset.s = sec; $("stage").setAttribute("aria-label", tpl("tm_left", { n: sec })); }
}

// ---------- раскрытие ----------
const RV = { id: "", plan: null, fired: new Set(), placed: new Set(), flagX: null, flagTo: 0, fallen: new Set(), lean: 0, op: null };

function buildPlan() {
  const r = state.round, res = r.result, q = r.q;
  const order = res.order;
  const N = order.length;
  const sides = { a: [], b: [] };
  for (const id of order) if (PL.has(id)) sides[res.votes[id]].push(id);
  const plan = { N, sides, vt: (i) => 500 + 600 * i };
  plan.tLast = N ? plan.vt(N - 1) : 500;
  plan.tEnd = plan.tLast + 750;
  plan.hasOp = !!res.opinions;
  plan.opAt = plan.tEnd + 1900;
  const oa = res.opinions ? res.opinions.a : 0, ob = res.opinions ? res.opinions.b : 0;
  plan.opSeq = [];
  for (let i = 0, a = oa, b = ob, s = "a"; a + b > 0; i++) { if ((s === "a" && a > 0) || b === 0) { plan.opSeq.push("a"); a--; } else { plan.opSeq.push("b"); b--; } s = s === "a" ? "b" : "a"; }
  plan.opDone = plan.opAt + 220 * plan.opSeq.length + 400;
  // раскладка по сторонам
  const { W, px, rx } = M;
  const near = W * (M.portrait ? 0.22 : 0.17);
  plan.lay = {};
  for (const s of ["a", "b"]) {
    const x0 = s === "a" ? px - near : px + near;
    const x1 = s === "a" ? W * 0.045 : W * 0.955;
    plan.lay[s] = layoutRow(sides[s].length || 1, x0, x1, M.sz * 1.7);
  }
  // меньшинство в луже
  const minSide = res.side && !res.unanimous ? (res.side === "a" ? "b" : "a") : null;
  plan.minSide = minSide;
  plan.fall = {};
  if (minSide) {
    const ids = sides[minSide], m = ids.length, R = m > 4 ? 2 : 1, cols = Math.ceil(m / R);
    const k = Math.min(0.9, (rx * 1.5) / (cols + 0.3) / M.sz);
    ids.forEach((id, j) => {
      const row = R === 2 ? j % 2 : 0, col = Math.floor(j / R);
      const u = cols > 1 ? (col + (row ? 0.5 : 0)) / (cols - 0.5) - 0.5 : 0; // −0.5…0.5
      const x = M.px + u * rx * 1.45;
      const edge = M.ry * Math.sqrt(Math.max(0.15, 1 - Math.pow((x - M.px) / (rx * 1.02), 2)));
      const y = M.py - edge - 0.06 * M.sz * k + row * M.ry * 0.9 + (row ? 6 : 0);
      plan.fall[id] = { x, y, k, row, delay: j * 260 };
    });
  }
  plan.minSide = minSide;
  return plan;
}
const dFor = (na, nb, cast) => (cast ? (na - nb) / cast : 0);

function dropPlayer(id, instant) {

  const tw = Math.max(54, M.rx * 1.4 / 3);
  const fin = { x: f.x, y: f.y, k: f.k, row: 0, lean: 0, tw, fallen: true };
  if (instant) { pl.el.classList.add("inst"); setT(pl, fin); pl.el.classList.add("mud"); requestAnimationFrame(() => pl.el.classList.remove("inst")); $("veil").setAttribute("opacity", 1); return; }
  const side = state.round.result.votes[id];
  // 1) канат тащит к центру, 2) падение в лужу
  const cur = pl.key.split(",");
  setT(pl, { x: M.px + (side === "a" ? -1 : 1) * M.rx * 1.1, y: M.ropeY + 0.1 * M.sz, k: Math.min(1, +cur[2]), row: 0, lean: side === "a" ? 28 : -28, tw: 60 });
  later(420, () => {
    pl.el.style.transition = "transform .42s cubic-bezier(.5, 0, .9, .6)";
    pl.el.classList.add("fallen");
    setT(pl, fin);
    later(400, () => { splash(f.x, f.y + M.sz * f.k * 0.35); wvSfx.splash(); pl.el.classList.add("mud"); pl.el.style.transition = ""; $("veil").setAttribute("opacity", 1); });
  });
}

function updateReveal(t, instant) {
  const plan = RV.plan; if (!plan) return;
  const r = state.round, res = r.result;
  const first = (k) => { if (RV.fired.has(k)) return false; RV.fired.add(k); return true; };
  const live = (at) => !instant && t - at < 900;
  // голоса по очереди
  let na = 0, nb = 0, shown = 0;
  const order = res.order;
  for (let i = 0; i < order.length; i++) {
    if (t < plan.vt(i) && !instant) break;
    const id = order[i], s = res.votes[id];
    if (s === "a") na++; else nb++;
    shown++;
    if (first("v" + i)) {
      const pl = PL.get(id);
      if (pl) {
        const j = plan.sides[s].indexOf(id);
        RV.placed.add(id);
        const lay = plan.lay[s];
        const sl = lay.slots[j];
        pl.el.classList.remove("ready");
        if (instant) pl.el.classList.add("inst");
        setT(pl, { x: sl.x, y: yFor(sl.row, lay.k), k: lay.k, row: sl.row, lean: s === "a" ? -8 : 8, tw: Math.max(54, lay.step * 0.98) });
        if (instant) requestAnimationFrame(() => pl.el.classList.remove("inst"));
      }
      if (live(plan.vt(i))) {
        const d = Math.abs(dFor(na, nb, res.cast));
        if (i === order.length - 1 && res.side) { wvSfx.step(); wvSfx.thud(); }
        else { wvSfx.step(); if (i % 2 === 0) wvSfx.creak(d); }
      }
      const el = $("n" + s); if (el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    }
  }
  for (const s of ["a", "b"]) { const e = $("n" + s); if (e) { const n = s === "a" ? na : nb; e.textContent = n; e.classList.toggle("on", shown > 0); } }
  const d = dFor(na, nb, res.cast);
  RV.flagTo = d;
  // натяжение
  const taut = shown > 0 && !res.void;
  const rope = $("ropeG");
  rope.classList.toggle("shake", taut && t < plan.tEnd + 300 && !instant);
  RV.sag = taut ? 0 : 5;
  // лидирующая сторона наклоняется сильнее
  if (shown > 0) {
    for (const s of ["a", "b"]) for (const id of plan.sides[s]) {
      if (!RV.placed.has(id)) continue;
      const pl = PL.get(id), ld = s === "a" ? Math.max(0, d) : Math.max(0, -d), cur = pl.key.split(",");
      const lean = (s === "a" ? -1 : 1) * (7 + 12 * ld);
      if (!RV.fallen.has(id) && +cur[4] !== Math.round(lean)) setT(pl, { x: +cur[0], y: +cur[1], k: +cur[2], row: +cur[3], lean, tw: +cur[5] });
    }
  }
  // итог
  const end = instant || t >= plan.tEnd;
  if (res.void) {
    if (instant || t >= 300) { showVerdict("vdVoid"); if (first("void") && !instant) wvSfx.buzz(); }
    return;
  }
  if (end) {
    const ended = first("end");
    if (res.tie) {
      showVerdict("vdTie");
      rope.classList.toggle("shake", !instant); rope.classList.add("shake2");
      if (ended && !instant) wvSfx.strain();
    } else if (res.unanimous) {
      showVerdict("vdOne");
      if (ended && !instant) wvSfx.chord();
    } else {
      showVerdict("vdMaj");
    }
    if (ended) {
      if (!res.tie) rope.classList.remove("shake", "shake2");
      // победители подпрыгивают, у меньшинства — падение
      const winners = res.unanimous ? plan.sides.a.concat(plan.sides.b) : res.tie ? [] : plan.sides[res.side];
      winners.forEach((id, i) => { const pl = PL.get(id); if (!pl) return; pl.el.style.setProperty("--hd", (i * 0.07) + "s"); pl.el.classList.add("hop"); });
      if (plan.minSide) plan.sides[plan.minSide].forEach((id) => { const f = plan.fall[id]; if (instant) dropPlayer(id, true); else later(f.delay + 150, () => dropPlayer(id, false)); });
      if (res.wolf) { const wp = PL.get(res.wolf); if (wp) wp.el.classList.add("wolf"); }
      // очки над аватарами
      let n = 0;
      for (const id of order) {
        const pl = PL.get(id); if (!pl || !(id in res.pts)) continue;
        const v = res.pts[id], b = pl.el.querySelector(".pts");
        b.textContent = (v > 0 ? "+" + v : v < 0 ? "−" + Math.abs(v) : "0");
        b.className = "pts " + (v > 0 ? "pos" : v < 0 ? "neg" : "zero") + (res.banked[id] ? " bk" : "");
        if (instant) b.classList.add("on"); else later(350 + n++ * 70, () => b.classList.add("on"));
      }
    }
  }
  // мнения
  // шкала мнений могла уже уйти из DOM (экран сменился, а кадр ещё идёт) — тогда рисовать нечего
  if (plan.hasOp && $("oprope")) {
    const tks = $("tks");
    if (instant || t >= plan.opAt) {
      const seq = plan.opSeq;
      let oa = 0, ob = 0;
      for (let i = 0; i < seq.length; i++) {
        if (!instant && t < plan.opAt + 220 * i) break;
        if (first("o" + i)) {
          const el = document.createElement("div");
          const s = seq[i];
          const cnt = seq.slice(0, i).filter((x) => x === s).length;
          const w = $("oprope").clientWidth, pitch = clamp(w * 0.5 / 13, 22, 44);
          el.className = "tk " + s; el.textContent = "👤";
          el.style.left = s === "a" ? cnt * pitch + "px" : "auto";
          if (s === "b") el.style.right = cnt * pitch + "px";
          tks.append(el);
          requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
          if (!instant) wvSfx.step();
        }
        if (seq[i] === "a") oa++; else ob++;
      }
      $("opA").textContent = oa ? oa : ""; $("opB").textContent = ob ? ob : "";
      RV.opTo = (oa + ob) ? (oa - ob) / (oa + ob) : 0;
      if (res.illusion && (instant || t >= plan.opDone)) {
        showVerdict("vdIll");
        if (first("ill") && !instant) wvSfx.pop();
      }
    }
  }
}

// флаг и канат — по кадрам
function frameFlag(dt) {
  const showFlag = state && !dead && state.phase !== "finished";
  const f = $("flag");
  if (!showFlag) return;
  const inRev = state.phase === "reveal" || state.phase === "scores";
  const to = inRev && RV.plan && state.round && state.round.result && !state.round.result.void ? RV.flagTo : 0;
  const tx = M.px - to * 0.30 * M.W;
  if (RV.flagX == null) RV.flagX = tx;
  RV.flagX += (tx - RV.flagX) * Math.min(1, dt * 0.006);
  const sag = inRev && RV.sag != null ? RV.sag : 5;
  if (Math.abs(sag - sagNow) > 0.05) setRope(sagNow + (sag - sagNow) * Math.min(1, dt * 0.01));
  const y = M.ropeY + sagAt(RV.flagX, sagNow) * 1.0;
  f.style.transform = `translate(${RV.flagX.toFixed(1)}px,${y.toFixed(1)}px)`;
  const fl = f.querySelector(".fl");
  const dir = to > 0.01 ? -1 : 1;
  fl.style.transform = dir < 0 ? "scaleX(-1) translateX(0)" : "none";
  // мнения
  const of = $("oflag"), orp = $("oprope");
  if (of && orp && RV.opTo != null) {
    const w = orp.clientWidth;
    RV.opX = (RV.opX == null ? 0.5 : RV.opX) + ((0.5 - RV.opTo * 0.3) - (RV.opX == null ? 0.5 : RV.opX)) * Math.min(1, dt * 0.006);
    of.style.transform = `translateX(${(RV.opX * w).toFixed(1)}px)`;
  } else if (of && orp) { of.style.transform = `translateX(${(orp.clientWidth / 2).toFixed(1)}px)`; }
}

function drawReveal() {
  const id = "rev:" + roundId() + wvLang() + M.W + M.H;
  if (viewKey === id) return;
  const sameRound = RV.id === roundId();
  viewKey = id;
  clearLater();
  const res = state.round.result;
  if (!sameRound) {
    RV.id = roundId(); RV.fired = new Set(); RV.placed = new Set(); RV.fallen = new Set(); RV.flagTo = 0; RV.opTo = null; RV.opX = null; RV.sag = 5;
    resetPlayersFlags();
    layoutHuddle();
    $("veil").setAttribute("opacity", 0);
    $("fx").replaceChildren();
  } else { RV.fired = new Set(); RV.placed = new Set(); RV.fallen = new Set(); RV.opTo = null; RV.opX = null; resetPlayersFlags(); $("veil").setAttribute("opacity", 0); }
  RV.plan = buildPlan();
  revealSetup();
  showVerdict("vdIdle");
  // «не голосовали» остаются в толпе слегка приглушёнными
  const inst = RM || state.phase === "scores" || (state.phase === "reveal" && phaseNow() > RV.plan.vt(0) + 600 * RV.plan.N + 5000);
  RV.instant = inst;
  if (inst) {
    // страница открыта поздно: показываем итог без анимации
    updateReveal(Infinity, true);
  } else {
    // пересборка в середине: проигрываем всё, что уже должно было случиться, без звуков
    const t = phaseNow();
    if (t > 900) { updateReveal(t, false); }
  }
}

// ---------- счёт ----------
function drawScores() {
  const key = "scores:" + roundId() + wvLang() + M.W + M.H;
  if (viewKey === key) return;
  viewKey = key;
  const r = state.round, res = r.result;
  // сцена: итог раскрытия остаётся
  if (RV.id !== roundId() || !RV.plan) { RV.id = roundId(); RV.fired = new Set(); RV.placed = new Set(); RV.fallen = new Set(); resetPlayersFlags(); RV.plan = buildPlan(); }
  const list = present().slice();
  const before = (p) => p.score - (res.void ? 0 : res.pts[p.id] || 0);
  list.sort((a, b) => b.score - a.score);
  const max = Math.max(1, ...list.map((p) => p.score));
  const cols = list.length > 6 ? 2 : 1, rows = Math.ceil(list.length / cols);
  const title = r.num && (r.kind === "normal" || r.kind === "final") ? tpl("scores_title", { n: r.num }) : T("scores_title_x");
  const note = res.void ? T("void_note") : r.only ? tpl("decider_note", { names: wvNames(r.only, player) }) : "";
  const fmtD = (v) => (v > 0 ? "+" + v : v < 0 ? "−" + Math.abs(v) : "0");
  upper.innerHTML = `<div class="up sc"><div class="sc-head"><h2>${esc(title)}</h2>${note ? `<p>${esc(note)}</p>` : ""}</div>
    <div class="sc-tab" style="--cols:${cols};--rows:${rows}">${list.map((p) => {
      const has = !res.void && p.id in res.pts, d = has ? res.pts[p.id] : 0, b0 = before(p);
      const bd = (has && res.banked[p.id] ? `<span class="tag2" title="${esc(T("bank_tip"))}">×2</span>` : "") + (res.wolf === p.id && !res.void ? `<span title="${esc(T("wolf_tip"))}">🐺</span>` : "");
      return `<div class="row${has || res.void || r.only ? "" : " out"}" style="--pc:${esc(p.color)};--w0:${Math.max(0, b0) / max}" data-w="${Math.max(0, p.score) / max}"><span class="rk">${wvRank(list, p)}</span>${avHtml(p)}<b class="nm">${esc(p.name)}</b><span class="bd">${bd}</span><div class="bar"><i></i></div><span class="tot${p.score < 0 ? " neg" : ""}" data-from="${b0}" data-to="${p.score}">${b0}</span><span class="dl ${d > 0 ? "pos" : d < 0 ? "neg" : "zero"}">${has ? fmtD(d) : ""}</span></div>`;
    }).join("")}</div></div>`;
  const tab = upper.querySelector(".sc-tab");
  {
    const head = upper.querySelector(".sc-head"), avail = upper.clientHeight - head.offsetHeight - 40;
    const rh = Math.min(86, (avail - 6 * (rows - 1)) / rows), cw = (upper.clientWidth * 0.9) / cols;
    tab.style.setProperty("--th", Math.round(rh * rows + 6 * (rows - 1)) + "px");
    tab.style.setProperty("--fs", clamp(Math.min(rh * 0.42, cw / 19), 13, 34) + "px");
  }
  const rowsEl = upper.querySelectorAll(".row");
  rowsEl.forEach((row) => { row.querySelector(".nm").style.minWidth = "0"; });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    rowsEl.forEach((row) => { row.querySelector(".bar i").style.setProperty("--w0", row.dataset.w); row.querySelector(".bar i").style.transform = `scaleX(${row.dataset.w})`; row.querySelector(".dl").classList.add("on"); });
    countUp(upper.querySelectorAll(".tot"), 900, 350);
  }));
  // сцена: показываем итог раскрытия без анимации, если он ещё не показан
  if (!RV.fired.has("end") && !res.void) updateReveal(Infinity, true);
  else if (res.void) updateReveal(Infinity, true);
}
function countUp(nodes, dur, delay) {
  const t0 = performance.now() + delay;
  const step = (t) => {
    const k = clamp((t - t0) / dur, 0, 1), e = 1 - Math.pow(1 - k, 3);
    nodes.forEach((n) => { const f = +n.dataset.from, to = +n.dataset.to; n.textContent = Math.round(f + (to - f) * e); });
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---------- итоги ----------
function drawFinal() {
  const key = "final:" + state.game + wvLang() + isHost + M.W + M.H;
  if (viewKey === key) return;
  viewKey = key;
  const list = present().slice().sort((a, b) => b.score - a.score);
  const top = [list[1], list[0], list[2]];
  const hsOf = (rk) => (rk === 1 ? "76%" : rk === 2 ? "58%" : "44%"), ds = ["1.1s", "1.6s", "0.7s"];
  const aw = state.awards || {};
  const names = (ids) => ids.map((id) => (player(id) || {}).name || "?").join(", ");
  const rows = [];
  const add = (a, ico, k) => { if (a && a.ids && a.ids.length) rows.push(`<div class="aw"><span class="rosette">${ico}</span><div style="min-width:0"><div class="ek">${esc(T("aw_" + k))}</div><b>${esc(names(a.ids))}</b><p>${esc(tpl("aw_" + k + "_d", { n: a.n }))}</p></div></div>`); };
  add(aw.crowd, "👥", "crowd"); add(aw.crow, "🐑", "crow"); add(aw.risk, "🎲", "risk"); add(aw.wolf, "🐺", "wolf");
  const sub = state.finishedReason === "paused" ? T("final_paused") : state.finishedReason === "few" ? T("final_few") : state.finishedReason === "host" ? T("final_host") : "";
  const head = state.finishedReason === "paused" ? T("final_paused") : T("final_title");
  upper.innerHTML = `<div class="up fin-up"><div class="fin-l"><h1>${esc(head)}</h1>${sub && state.finishedReason !== "paused" ? `<p class="sub">${esc(sub)}</p>` : ""}
    <div class="podium">${top.map((p, i) => p ? `<div class="step${wvRank(list, p) === 1 ? " first" : ""}"><div class="who" style="--d:${ds[i]}">${avHtml(p)}<span>${esc(p.name)}</span></div><div class="blk" style="--h:${hsOf(wvRank(list, p))};--d:${[0.4, 0.9, 0.1][i]}s">${wvRank(list, p)}<small>${p.score}</small></div></div>` : `<div class="step"></div>`).join("")}</div>
    ${list.length > 3 ? `<div class="rest">${list.slice(3).map((p) => `<span>${avHtml(p)}<b>${wvRank(list, p)}. ${esc(p.name)}</b> ${p.score}</span>`).join("")}</div>` : ""}</div>
    <div class="fin-r">${rows.join("")}<div class="hostbtns">${isHost ? `<button class="start" id="again" type="button">${esc(T("btn_again"))}</button><button class="ghostbtn" id="tolobby" type="button">${esc(T("btn_lobby"))}</button>` : ""}<a class="ghostbtn" href="index.html"${isHost ? "" : ' style="grid-column:1 / -1"'}>${esc(T("btn_home"))}</a></div></div></div>`;
  if (isHost) { $("again").onclick = () => conn.send({ type: "start" }); $("tolobby").onclick = () => conn.send({ type: "lobby" }); }
  if (state.finishedReason === "done" && !RM) later(900, () => wvSfx.fanfare());
}

// ---------- отрисовка ----------
let lastPhase = null, prevReady = new Set(), prevRoundId = "";
function render() {
  if (!state || dead) return;
  const ph = state.phase;
  document.body.dataset.phase = ph;
  document.body.classList.toggle("fin", ph === "finished");
  document.body.classList.toggle("lobbyp", ph === "lobby");
  topBar();
  ensurePlayers();
  const r = state.round;
  const dimOf = (p) => !p.online || (ph === "vote" && r && r.voters && !r.voters.includes(p.id)) || ((ph === "reveal" || ph === "scores") && r && r.result && !r.result.void && !(p.id in r.result.votes));
  for (const pl of PL.values()) pl.el.classList.toggle("dim", dimOf(pl.p));
  if (ph !== lastPhase) {
    if (ph === "lobby" || ph === "vote" || ph === "intro") { clearLater(); $("veil").setAttribute("opacity", 0); }
    if (ph === "vote") { RV.plan = null; RV.id = ""; RV.flagTo = 0; RV.sag = 5; $("ropeG").classList.remove("shake", "shake2"); $("fx").replaceChildren(); }
    lastPhase = ph;
  }
  // позиции в сцене
  if (ph === "lobby" || ph === "finished") { for (const pl of PL.values()) pl.el.classList.remove("ready", "hop", "wolf", "mud"); layoutSpread(); }
  else if (ph === "intro" || ph === "vote" || ph === "opinion" || ph === "pause") {
    if (ph === "vote") for (const pl of PL.values()) { pl.el.classList.remove("hop", "wolf", "mud"); pl.el.querySelector(".pts").className = "pts"; }
    layoutHuddle();
  }
  if (ph !== "reveal" && ph !== "scores") for (const pl of PL.values()) { pl.el.classList.remove("hop", "wolf", "mud"); const pt = pl.el.querySelector(".pts"); if (pt.className !== "pts") pt.className = "pts"; }
  // «готов»
  if (ph === "vote" && r) {
    const rdy = new Set(r.ready || []);
    const same = prevRoundId === roundId();
    for (const [id, pl] of PL) {
      const on = rdy.has(id);
      pl.el.classList.toggle("ready", on);
      if (on && same && !prevReady.has(id)) { pl.el.classList.remove("shiver"); void pl.el.offsetWidth; pl.el.classList.add("shiver"); wvSfx.lock(); }
    }
    prevReady = rdy;
  } else { prevReady = new Set(); if (ph !== "vote") for (const pl of PL.values()) pl.el.classList.remove("ready"); }
  prevRoundId = r ? roundId() : "";
  switch (ph) {
    case "lobby": return drawLobby();
    case "intro": return drawIntro();
    case "vote": case "opinion": return drawVote();
    case "reveal": return drawReveal();
    case "scores": return drawScores();
    case "pause": return drawPause();
    case "finished": return drawFinal();
  }
}
$("endbtn").onclick = () => { if (confirm(T("btn_end") + "?")) conn.send({ type: "end" }); };

let lastFrame = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(100, t - lastFrame); lastFrame = t;
  if (!state || dead) return;
  timerFrame();
  frameFlag(dt);
  if (state.phase === "reveal" && RV.plan && !RV.instant) updateReveal(phaseNow(), false);
}

let rsz = null;
window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { measure(); for (const pl of PL.values()) pl.key = ""; viewKey = ""; if (state) render(); }, 120); });
window.addEventListener("langchange", () => {
  viewKey = "";
  if (isHost && state && (state.phase === "lobby" || state.phase === "finished") && state.settings.lang !== wvLang()) conn.send({ type: "settings", settings: { lang: wvLang() } });
  render();
});

// ---------- связь ----------
function setState(s) { s.__at = performance.now(); state = s; }
function onMessage(m) {
  switch (m.type) {
    case "hello":
      setState(m.state);
      if (!isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      setState(m.state);
      render();
      break;
    case "host_ok":
      isHost = true;
      document.body.classList.add("host");
      viewKey = "";
      if (state && state.phase === "lobby" && state.settings.lang !== wvLang()) conn.send({ type: "settings", settings: { lang: wvLang() } });
      render();
      break;
    case "host_lost":
      isHost = false;
      document.body.classList.remove("host");
      viewKey = "";
      render();
      break;
    case "error":
      if (m.error === "room_expired") gone();
      break;
  }
}
function gone() {
  dead = true;
  upper.innerHTML = "";
  showBanner(T("expired"));
}
async function boot() {
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  measure();
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  conn = wvConnect({
    code: CODE,
    onMessage,
    onGone: gone,
    onOpen: () => { isHost = false; },
    onState: (st) => { banner.textContent = T("err_connect"); banner.classList.toggle("on", st === "lost"); },
  });
  requestAnimationFrame(frame);
  window.wvBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
boot();
</script>
</body>
