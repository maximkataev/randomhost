<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1faa2.svg" type="image/svg+xml">
<title>Как все — общий экран</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="crowd-theme.css">
<style>
  /* Мир «Как все»: перетягивание каната на тёмной стеклянной сцене (crowd-spec.md §9). Язык аукциона: тёмный фон с цветными
     пятнами и зерном (crowd-theme.css), стеклянные панели, Unbounded + Onest, градиентные плашки сторон. Канат — светящийся
     трос с бусинами, ямка проигрыша — красное кольцо под центром. Общий экран смотрят с трёх метров: крупно и контрастно.
     Результат остаётся в сцене: маркер у большинства, меньшинство в красной зоне, пока не начнётся следующий вопрос. */
  :root {
    --z: 1;           /* масштаб для ТВ (JS): страница живёт в виртуальном экране (100vw/z × 100vh/z) и растягивается transform'ом */
    --vh: calc(1vh / var(--z)); --vw: calc(1vw / var(--z));
    --ry: 130px;      /* y каната в сцене (JS) */
    --sgw: clamp(150px, calc(17 * var(--vw)), 340px);
    --sh: 440px;      /* высота сцены (JS) */
    --gy: 220px;      /* ось сцены (JS) */
    --sz: 80px;       /* максимальный размер аватара (JS) */
    --pop: cubic-bezier(.2, 1.5, .4, 1);
    --panel: rgba(255, 255, 255, .06);
    --hair: rgba(255, 255, 255, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 500 18px/1.3 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 3px solid var(--c3); outline-offset: 3px; }
  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  b, strong { font-weight: 700; }

  #root { position: fixed; left: 0; top: 0; width: calc(100vw / var(--z)); height: calc(100vh / var(--z)); transform: scale(var(--z)); transform-origin: 0 0; overflow: hidden; }
  .lang-switch { transform: scale(var(--z)); transform-origin: top right; }

  /* ---------- шапка ---------- */
  .top { position: fixed; left: 0; right: 0; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; height: calc(var(--lsc, 32px) * 2 / var(--z)); padding: 0 calc(var(--lsw, 160px) / var(--z)) 0 26px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { font: 900 20px/1 var(--display); text-transform: uppercase; letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; gap: 12px; min-width: 0; flex: 0 1 auto; }
  .brand span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .chip, .endbtn, .sound-toggle-btn { flex: none; }
  @media (max-width: 900px) { .brand { font-size: 15px; gap: 8px; } .brand i { width: 28px; } .top { gap: 8px; } }
  .brand i { width: 40px; height: 12px; border-radius: 8px; flex: none; position: relative; background: linear-gradient(90deg, var(--side-a), var(--side-a2) 40%, var(--side-b) 60%, var(--side-b2)); box-shadow: 0 0 18px -2px var(--side-a), 0 0 18px -2px var(--side-b); }
  .brand i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .8); }
  .chip { font: 900 17px/1 var(--display); padding: 9px 14px; background: var(--panel); border: 1px solid var(--hair); border-radius: 999px; letter-spacing: .1em; white-space: nowrap; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .grow { flex: 1; }
  .top .sound-toggle-btn, .endbtn { flex: none; height: calc(var(--lsh, 44px) / var(--z)); width: calc(var(--lsh, 44px) / var(--z)); border: 1px solid var(--hair); border-radius: 50%; background: var(--panel); color: var(--text); padding: 0; display: grid; place-items: center; font-size: 15px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: background .15s, border-color .15s; }
  .sound-toggle-btn svg { width: 20px; height: 20px; }
  .endbtn:hover, .top .sound-toggle-btn:hover { background: var(--glass-hi); border-color: rgba(255, 255, 255, .28); }
  .banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 50; background: rgba(14, 14, 24, .92); border: 1px solid var(--hair); color: var(--text); padding: 10px 18px; font-weight: 600; border-radius: 999px; }
  .conn { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 50; background: rgba(14, 14, 24, .92); border: 1px solid var(--bad); color: var(--text); padding: 8px 16px; font-weight: 600; border-radius: 999px; visibility: hidden; }
  .conn.on { visibility: visible; }

  main { position: fixed; left: 0; right: 0; top: calc(var(--lsc, 32px) * 2 / var(--z)); bottom: 0; z-index: 2; }
  #upper { position: absolute; left: 0; right: 0; top: 0; bottom: var(--sh); z-index: 3; }
  body.fin #upper { bottom: 0; }
  .up { position: absolute; inset: 0; display: grid; grid-template-columns: var(--sgw) minmax(0, 1fr) var(--sgw); gap: calc(2 * var(--vw)); padding: 0 calc(2 * var(--vw)) calc(1.6 * var(--vh)); min-height: 0; }

  /* ---------- стороны: плашки ✔ / ✖ или А / Б ---------- */
  .sign { position: relative; height: min(100%, calc(30 * var(--vh))); align-self: end; min-height: 110px; display: flex; flex-direction: column; }
  .sign.a { grid-column: 1; grid-row: 1; --c: var(--side-a); --c2: var(--side-a2); }
  .sign.b { grid-column: 3; grid-row: 1; --c: var(--side-b); --c2: var(--side-b2); }
  .sg-board { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: calc(1.2 * var(--vh)); padding: calc(1.8 * var(--vh)) 12px calc(1.6 * var(--vh));
    border-radius: 26px; border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
    background: linear-gradient(165deg, color-mix(in srgb, var(--c) 36%, transparent), color-mix(in srgb, var(--c2) 8%, transparent) 75%), var(--panel);
    box-shadow: 0 0 70px -28px var(--c), inset 0 1px 0 rgba(255, 255, 255, .2); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .sg-ico { flex: none; display: grid; place-items: center; width: clamp(36px, calc(6.4 * var(--vh)), 68px); height: clamp(36px, calc(6.4 * var(--vh)), 68px); border-radius: 50%;
    background: linear-gradient(135deg, var(--c), var(--c2)); color: #07070c; font: 900 clamp(18px, calc(3.2 * var(--vh)), 36px)/1 var(--display);
    box-shadow: 0 10px 30px -10px var(--c), inset 0 1px 0 rgba(255, 255, 255, .5); }
  .sg-word { min-width: 0; min-height: 0; flex: 1; width: 100%; font: 800 clamp(24px, calc(6.4 * var(--vh)), 76px)/1.1 var(--body); display: flex; align-items: center; justify-content: center; text-align: center; }
  .sg-word > span { min-width: 0; overflow-wrap: normal; word-break: normal; hyphens: manual; text-wrap: balance; }
  .sg-post { display: none; }
  .sg-n { position: absolute; top: -.6em; z-index: 2; min-width: 1.6em; height: 1.6em; padding: 0 .4em; border-radius: 999px; background: #0b0b14; color: var(--text); border: 2px solid var(--c);
    box-shadow: 0 0 24px -4px var(--c); font: 900 clamp(22px, calc(4.4 * var(--vh)), 48px)/1.45 var(--display); text-align: center; font-variant-numeric: tabular-nums; opacity: 0; transform: scale(.4); transition: opacity .25s, transform .35s var(--pop); }
  .sign.a .sg-n { right: -.3em; }
  .sign.b .sg-n { left: -.3em; }
  .sg-n.on { opacity: 1; transform: none; }
  .sg-n.bump { animation: bump .3s var(--pop); }
  @keyframes bump { from { transform: scale(1.35); } }

  /* ---------- центральная колонка ---------- */
  .mid { grid-column: 2; grid-row: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: calc(1.2 * var(--vh)); padding-top: calc(1.2 * var(--vh)); }
  .ribbon { flex: none; font: 700 clamp(11px, calc(1.7 * var(--vh)), 17px)/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: .8em 1.5em; border: 1px solid var(--hair); border-radius: 999px; background: var(--panel);
    text-align: center; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .ribbon b { color: var(--text); font-weight: 700; }
  .ribbon.think { color: var(--text); border-color: color-mix(in srgb, var(--c1) 55%, transparent); background: color-mix(in srgb, var(--c1) 16%, transparent); }
  .qbox { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .qtxt { margin: 0; width: 100%; text-align: center; font: 700 var(--qfs, 64px)/1.14 var(--display); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; hyphens: manual; }
  .meta { flex: none; width: 100%; display: flex; align-items: center; justify-content: center; gap: calc(1.6 * var(--vw)); font: 700 clamp(12px, calc(1.9 * var(--vh)), 20px)/1 var(--display); padding-bottom: calc(1 * var(--vh)); }
  .meta .prog { white-space: nowrap; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .pips { display: flex; gap: 5px; }
  .pips i { width: 18px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .16); }
  .pips i.d { background: linear-gradient(90deg, var(--c1), var(--c3)); }
  .pips i.c { background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .7); }
  .rdy { min-width: 9.5em; text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; font-family: var(--body); font-weight: 700; font-size: 1.15em; padding: .5em .9em .5em .6em; border-radius: 999px; background: var(--panel); border: 1px solid var(--hair); }
  .rdy::before { content: "✓"; display: inline-grid; place-items: center; width: 1.4em; height: 1.4em; margin-right: .5em; border-radius: 50%; background: var(--ok); color: #07120c; font-size: .85em; font-weight: 900; }
  .rdy.ask::before { content: "💭"; background: none; }

  /* ---------- раскрытие ---------- */
  .qline { flex: none; width: 100%; display: flex; align-items: baseline; justify-content: center; gap: calc(1.2 * var(--vw)); }
  .qline .qk { flex: none; font: 700 clamp(11px, calc(1.6 * var(--vh)), 16px)/1 var(--display); text-transform: uppercase; letter-spacing: .12em; white-space: nowrap; color: var(--muted); }
  .qline .qtxt { width: auto; flex: 0 1 auto; max-height: 2.4em; overflow: hidden; }
  .verdict { position: relative; flex: 1; min-height: 0; width: 100%; }
  .verdict > * { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .3em; opacity: 0; transform: scale(.8); transition: opacity .25s, transform .4s var(--pop); pointer-events: none; }
  .verdict > .on { opacity: 1; transform: none; }
  .vd-idle { opacity: 1 !important; transform: none !important; }
  .stamp { --sc: var(--c1); display: inline-block; font: 900 var(--u, 60px)/1.08 var(--display); text-transform: uppercase; letter-spacing: -.015em; padding: .16em .5em; border-radius: .3em; text-wrap: balance; max-width: 100%; color: #fff;
    border: 1.5px solid color-mix(in srgb, var(--sc) 70%, transparent);
    background: linear-gradient(135deg, color-mix(in srgb, var(--sc) 26%, transparent), rgba(255, 255, 255, .04));
    box-shadow: 0 0 90px -26px var(--sc), inset 0 1px 0 rgba(255, 255, 255, .16); text-shadow: 0 0 26px color-mix(in srgb, var(--sc) 70%, transparent); }
  .vd-sub { font: 700 max(calc(var(--u, 60px) * .36), 15px)/1.15 var(--body); color: rgba(244, 242, 255, .82); }
  .stamp.a { --sc: var(--side-a); } .stamp.b { --sc: var(--side-b); }
  .stamp.tie { --sc: var(--gold); } .stamp.one { --sc: var(--ok); } .stamp.void { --sc: #94a3b8; font-size: calc(var(--u, 60px) * .62); text-shadow: none; }
  .wolfnote { font: 600 max(calc(var(--u, 60px) * .3), 15px)/1.1 var(--body); color: var(--muted); }
  .illusion { z-index: 2; }
  .illusion .plate { padding: calc(.8 * var(--vh)) calc(2 * var(--vw)) calc(1.2 * var(--vh)); border-radius: 26px; max-width: 100%; border: 1.5px solid color-mix(in srgb, var(--c2) 70%, transparent);
    background: linear-gradient(135deg, color-mix(in srgb, var(--c2) 28%, #0b0b14), color-mix(in srgb, var(--c1) 22%, #0b0b14));
    box-shadow: 0 0 100px -26px var(--c2), inset 0 1px 0 rgba(255, 255, 255, .2); }
  .illusion .plate h2 { margin: 0; font: 900 var(--u, 60px)/1.05 var(--display); letter-spacing: -.01em; }
  .illusion .plate p { margin: .15em 0 0; font: 600 max(calc(var(--u, 60px) * .38), 15px)/1.2 var(--body); text-wrap: balance; color: rgba(244, 242, 255, .9); }
  .illusion .plate p b { background: rgba(255, 255, 255, .14); color: var(--text); padding: 0 .35em; border-radius: 8px; white-space: nowrap; }
  .oprope { flex: none; width: 100%; height: clamp(86px, calc(15 * var(--vh)), 170px); position: relative; }
  .oprope .oh { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: baseline; font: 700 clamp(12px, calc(2 * var(--vh)), 22px)/1 var(--display); text-transform: uppercase; letter-spacing: .08em; }
  .oprope .oh #opA { color: var(--side-a2); } .oprope .oh #opB { color: var(--side-b2); }
  .oprope .oh #opT { color: var(--muted); font-size: .8em; }
  .oprope .oh span { font-variant-numeric: tabular-nums; }
  .oprope .oc { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
  .oprope .orope { position: absolute; left: 0; right: 0; top: 58%; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--side-a), var(--side-a2) 40%, var(--side-b) 60%, var(--side-b2)); box-shadow: 0 0 18px -2px rgba(255, 255, 255, .25); }
  .oprope .tk { position: absolute; top: 58%; width: 1.9em; height: 1.9em; margin-top: -2.05em; border-radius: 50%; background: rgba(14, 14, 24, .85); border: 2px solid var(--c); box-shadow: 0 0 12px -2px var(--c); display: grid; place-items: center; font-size: clamp(12px, calc(2 * var(--vh)), 22px); opacity: 0; transform: translateY(-.8em) scale(.5); transition: opacity .2s, transform .35s var(--pop); }
  .oprope .tk.on { opacity: 1; transform: none; }
  .oprope .tk.a { --c: var(--side-a); } .oprope .tk.b { --c: var(--side-b); }
  .oprope .oflag { position: absolute; top: 58%; left: 0; width: 0; height: 0; z-index: 2; }
  .oprope .oflag svg { position: absolute; left: -.7em; bottom: .15em; width: clamp(24px, calc(4.4 * var(--vh)), 48px); height: auto; overflow: visible; }

  /* ---------- счёт ---------- */
  .sc { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: calc(1.2 * var(--vh)); grid-template-columns: none; padding: calc(1 * var(--vh)) calc(5 * var(--vw)) calc(1.4 * var(--vh)); }
  .sc-head { flex: none; display: flex; align-items: baseline; justify-content: center; gap: calc(1.6 * var(--vw)); flex-wrap: wrap; text-align: center; }
  .sc-head h2 { margin: 0; font: 900 clamp(20px, calc(3.8 * var(--vh)), 44px)/1.1 var(--display); letter-spacing: -.02em; text-transform: uppercase; }
  .sc-head p { margin: 0; font: 600 clamp(14px, calc(2.2 * var(--vh)), 24px)/1.1 var(--body); color: var(--muted); }
  .sc-tab { font-size: var(--fs, 24px); flex: 0 0 auto; height: var(--th, 300px); min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 6), minmax(0, 1fr)); grid-auto-flow: column; gap: calc(.6 * var(--vh)) calc(3 * var(--vw)); align-content: stretch; width: 100%; max-width: 1500px; margin: 0 auto; }
  .row { display: grid; grid-template-columns: 1.4em 1.9em minmax(0, 7.5em) auto minmax(40px, 1fr) 3em 3.4em; align-items: center; gap: .5em; min-height: 0; font: 700 1em/1 var(--display); background: var(--panel); border: 1px solid var(--hair); border-left: 3px solid var(--pc); border-radius: 14px; padding: 0 .6em; }
  .sc-tab.nb .row { grid-template-columns: 1.4em 1.9em minmax(0, 1fr) auto 3em 3.4em; }
  .sc-tab.nb .bar { display: none; }
  .row .rk { text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .8em; }
  .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--body); font-weight: 700; }
  .av { display: grid; place-items: center; width: 1.8em; height: 1.8em; font-size: .62em; border-radius: 50%; background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .22), rgba(255, 255, 255, .06) 70%), #14141f; border: .1em solid var(--pc); font-style: normal; line-height: 1; flex: none; }
  .row .av { font-size: .7em; }
  .row .bd { display: flex; gap: .3em; white-space: nowrap; font-size: .7em; }
  .row .bd:empty { visibility: hidden; }
  .tag2 { background: linear-gradient(100deg, var(--c1), var(--c2)); color: #0a0a0f; border-radius: 6px; padding: .15em .4em; font-weight: 900; }
  .bar { height: .5em; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--pc); transform-origin: left; transform: scaleX(var(--w0, 0)); transition: transform 1s cubic-bezier(.3, 1, .4, 1) .3s; }
  .row .tot { text-align: right; font-variant-numeric: tabular-nums; }
  .row .tot.neg { color: var(--bad); }
  .row .dl { text-align: right; font-variant-numeric: tabular-nums; font-size: .8em; opacity: 0; transform: translateY(.4em); transition: opacity .3s .5s, transform .4s var(--pop) .5s; }
  .row .dl.on { opacity: 1; transform: none; }
  .row .dl.pos { color: var(--ok); } .row .dl.neg { color: var(--bad); } .row .dl.zero { opacity: .55; }
  .row.out { opacity: .5; }

  /* ---------- заставки, пауза ---------- */
  .full { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; grid-template-columns: none; padding: 0 calc(8 * var(--vw)); }
  .poster { position: relative; background: var(--panel); border: 1px solid var(--hair); border-radius: 32px; padding: calc(3 * var(--vh)) calc(4 * var(--vw)) calc(3.4 * var(--vh)); box-shadow: 0 34px 90px -44px #000, inset 0 1px 0 rgba(255, 255, 255, .14); animation: slam .55s var(--pop) both; max-width: 100%; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .poster h1 { display: inline-block; margin: 0; font: 900 clamp(40px, calc(13 * var(--vh)), 170px)/1.08 var(--display); text-transform: uppercase; letter-spacing: -.03em;
    background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .poster .x2 { display: inline-block; margin-left: .15em; color: var(--gold); -webkit-text-fill-color: var(--gold); }
  .poster p { margin: calc(1.4 * var(--vh)) auto 0; font: 600 clamp(18px, calc(3 * var(--vh)), 36px)/1.25 var(--body); max-width: 24em; text-wrap: balance; color: rgba(244, 242, 255, .85); }
  @keyframes slam { from { transform: scale(1.18); opacity: 0; } }
  .only { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(1 * var(--vh)) calc(1.2 * var(--vw)); }
  .only span { display: inline-flex; align-items: center; gap: .5em; font: 700 clamp(16px, calc(2.8 * var(--vh)), 32px)/1 var(--body); background: var(--panel); border: 1px solid var(--hair); border-radius: 999px; padding: .25em .9em .25em .25em; }
  .only .av { font-size: .8em; }
  .wait { font: 900 clamp(26px, calc(5 * var(--vh)), 60px)/1 var(--display); }

  /* ---------- лобби ---------- */
  .lobby { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); gap: calc(2.4 * var(--vw)); padding: calc(1.5 * var(--vh)) calc(3 * var(--vw)) calc(2.4 * var(--vh)); align-items: stretch; }
  .lobby > div { min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(1.4 * var(--vh)); }
  .lobby > div:nth-child(1), .lobby > div:nth-child(3) { padding: calc(1.8 * var(--vh)) calc(1.2 * var(--vw)); border-radius: 28px; border: 1px solid var(--hair); background: var(--panel); box-shadow: 0 34px 90px -44px #000, inset 0 1px 0 rgba(255, 255, 255, .12); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .ticket { display: flex; flex-direction: column; align-items: center; gap: calc(1 * var(--vh)); text-align: center; }
  #qr { width: clamp(110px, calc(22 * var(--vh)), 240px); height: clamp(110px, calc(22 * var(--vh)), 240px); background: #fff; padding: 8px; border-radius: 16px; box-shadow: 0 0 60px -18px var(--c1); }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  .bigcode { font: 900 var(--code-fs, 56px)/1.1 var(--display); letter-spacing: .04em; white-space: nowrap; max-width: 100%; overflow: hidden; text-align: center;
    background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .url { font: 500 clamp(12px, calc(1.8 * var(--vh)), 18px)/1.2 var(--body); color: var(--muted); overflow-wrap: anywhere; }
  .lb-h { margin: 0; font: 900 clamp(34px, calc(10 * var(--vh)), 120px)/1.04 var(--display); text-transform: uppercase; letter-spacing: -.03em; text-wrap: balance; overflow-wrap: anywhere;
    background: linear-gradient(100deg, #fff, #d8d4ff 55%, var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .lb-tag { margin: 0; font: 600 clamp(17px, calc(3 * var(--vh)), 34px)/1.25 var(--body); color: rgba(244, 242, 255, .9); }
  .lb-tag b { color: var(--side-a2); font-weight: 700; text-transform: uppercase; }
  .rules { margin: 0; padding: 0; list-style: none; counter-reset: r; display: flex; flex-direction: column; gap: calc(1 * var(--vh)); }
  .rules li { counter-increment: r; display: grid; grid-template-columns: 2em 1fr; align-items: center; gap: .7em; font: 500 clamp(14px, calc(2.1 * var(--vh)), 22px)/1.25 var(--body); color: rgba(244, 242, 255, .82); }
  .rules li::before { content: counter(r); display: grid; place-items: center; width: 1.8em; height: 1.8em; border-radius: 50%; background: var(--panel); border: 1px solid var(--hair); color: var(--text); font: 700 .8em var(--display); }
  .lb-pn { font: 700 clamp(12px, calc(1.9 * var(--vh)), 20px)/1 var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .lb-pn #pn { color: var(--text); }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--panel); border: 1px solid var(--hair); border-radius: 18px; padding: calc(1 * var(--vh)) 14px; transition: border-color .2s, background .2s; }
  .opt:has(.tog[aria-pressed="true"]) { border-color: color-mix(in srgb, var(--c1) 70%, transparent); background: linear-gradient(120deg, color-mix(in srgb, var(--c1) 22%, transparent), color-mix(in srgb, var(--c2) 14%, transparent)); }
  .opt b { display: block; font: 700 clamp(14px, calc(2.2 * var(--vh)), 24px)/1.15 var(--body); }
  .opt span { font-size: clamp(12px, calc(1.7 * var(--vh)), 17px); color: var(--muted); display: block; line-height: 1.25; }
  .opt span.warn { color: var(--bad); font-weight: 600; }
  .tog { flex: none; width: 64px; height: 34px; border: 1px solid var(--hair); border-radius: 20px; background: rgba(255, 255, 255, .08); position: relative; padding: 0; transition: background .2s; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, .7); transition: transform .2s var(--pop), background .2s; }
  .tog[aria-pressed="true"] { background: linear-gradient(100deg, var(--c1), var(--c2)); border-color: transparent; }
  .tog[aria-pressed="true"]::after { transform: translateX(30px); background: #fff; }
  .start, .ghostbtn { border: 0; border-radius: 20px; font: 900 clamp(18px, calc(3.2 * var(--vh)), 32px)/1 var(--display); text-transform: uppercase; letter-spacing: .05em; padding: calc(1.8 * var(--vh)) 20px; text-align: center; text-decoration: none; color: #0a0a0f; }
  .start { width: 100%; background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3)); box-shadow: 0 22px 60px -22px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45); transition: transform .12s; }
  .start:not(:disabled):active { transform: translateY(2px) scale(.99); }
  .ghostbtn { background: var(--panel); color: var(--text); border: 1px solid var(--hair); font-size: clamp(13px, calc(2.2 * var(--vh)), 22px); display: grid; place-items: center; }
  .ghostbtn:hover { background: var(--glass-hi); }
  .hint { min-height: 1.3em; font: 600 clamp(13px, calc(2 * var(--vh)), 22px)/1.3 var(--body); text-align: center; color: var(--muted); }
  .free { font: 600 clamp(12px, calc(1.8 * var(--vh)), 18px)/1 var(--body); color: var(--c3); letter-spacing: 0; text-transform: none; }

  /* ---------- итоги ---------- */
  .fin-up { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: calc(3 * var(--vw)); padding: calc(1 * var(--vh)) calc(4 * var(--vw)) calc(3 * var(--vh)); }
  .fin-l { display: flex; flex-direction: column; min-height: 0; gap: calc(1 * var(--vh)); }
  .fin-l h1 { align-self: flex-start; margin: 0; font: 900 clamp(30px, calc(7 * var(--vh)), 88px)/1.05 var(--display); text-transform: uppercase; letter-spacing: -.03em;
    background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .fin-l .sub { margin: 0; font: 600 clamp(15px, calc(2.4 * var(--vh)), 26px)/1.2 var(--body); color: var(--bad); }
  .podium { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: calc(1.2 * var(--vw)); }
  .step { display: flex; flex-direction: column; align-items: center; gap: calc(.8 * var(--vh)); min-width: 0; height: 100%; justify-content: flex-end; }
  .step .who { text-align: center; font: 700 clamp(15px, calc(2.6 * var(--vh)), 30px)/1.1 var(--body); width: 100%; animation: rise .6s var(--pop) both; animation-delay: var(--d, 0s); }
  .step .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .who .av { font-size: clamp(30px, calc(6 * var(--vh)), 70px); margin: 0 auto calc(.5 * var(--vh)); }
  .step .blk { width: 100%; height: var(--h); border: 1px solid var(--hair); border-bottom: 0; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; align-items: center; padding-top: calc(1.2 * var(--vh));
    background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .03)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
    font: 900 clamp(30px, calc(6.4 * var(--vh)), 76px)/1 var(--display); color: var(--text); transform-origin: bottom; animation: up .8s var(--pop) both; animation-delay: var(--d, 0s); }
  .step .blk small { font: 700 .36em/1 var(--display); color: var(--muted); margin-top: .5em; font-variant-numeric: tabular-nums; }
  .step.first .blk { border-color: color-mix(in srgb, var(--gold) 70%, transparent); color: var(--gold); box-shadow: 0 0 80px -26px var(--gold), inset 0 1px 0 rgba(255, 255, 255, .3);
    background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 38%, transparent), color-mix(in srgb, var(--gold) 6%, transparent)); }
  .step.first .blk small { color: rgba(251, 191, 36, .8); }
  @keyframes up { from { transform: scaleY(0); } }
  @keyframes rise { from { transform: translateY(-40px); opacity: 0; } }
  .rest { flex: none; display: flex; flex-wrap: wrap; gap: calc(.6 * var(--vh)) calc(.8 * var(--vw)); font: 600 clamp(13px, calc(2 * var(--vh)), 21px)/1 var(--body); max-height: calc(17 * var(--vh)); overflow: hidden; }
  .rest span { display: inline-flex; align-items: center; gap: .4em; background: var(--panel); border: 1px solid var(--hair); border-radius: 999px; padding: .2em .8em .2em .2em; max-width: 14em; }
  .rest .av { font-size: .62em; } .rest span b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .fin-r { display: flex; flex-direction: column; min-height: 0; gap: calc(1.6 * var(--vh)); justify-content: center; }
  .aw { display: grid; grid-template-columns: auto 1fr; gap: calc(1 * var(--vw)); align-items: center; background: var(--panel); border: 1px solid var(--hair); border-radius: 22px; padding: calc(1.1 * var(--vh)) calc(1 * var(--vw)); position: relative; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .aw .rosette { width: clamp(40px, calc(7 * var(--vh)), 76px); height: clamp(40px, calc(7 * var(--vh)), 76px); border-radius: 50%; background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 55%, transparent), color-mix(in srgb, var(--c2) 40%, transparent)); border: 1px solid var(--hair); display: grid; place-items: center; font-size: clamp(20px, calc(3.6 * var(--vh)), 40px); }
  .aw .ek { font: 700 clamp(10px, calc(1.6 * var(--vh)), 16px)/1 var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--c3); margin-bottom: .4em; }
  .aw b { display: block; font: 700 clamp(18px, calc(3 * var(--vh)), 36px)/1.15 var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .aw p { margin: 0; font: 500 clamp(13px, calc(2 * var(--vh)), 21px)/1.2 var(--body); color: var(--muted); }
  .hostbtns { display: grid; grid-template-columns: 1fr 1fr; gap: calc(1 * var(--vw)); }
  .hostbtns .start { grid-column: 1 / -1; }

  /* ---------- сцена ---------- */
  #stage { position: absolute; left: 0; right: 0; bottom: 0; height: var(--sh); z-index: 4; isolation: isolate; overflow: hidden; transition: opacity .5s, transform .6s;
    background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .015)); border-top: 1px solid var(--hair);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  body.fin #stage { opacity: 0; transform: translateY(14%); pointer-events: none; }
  #stage > svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  #sgBack { z-index: 1; } #sgRope { z-index: 3; } #sgFront { z-index: 7; }
  #sgRope .strand { fill: none; stroke-linecap: round; }
  #ropeG.shake { animation: shake .09s linear infinite alternate; }
  @keyframes shake { from { transform: translateY(-2px); } to { transform: translateY(2px); } }
  #ropeG.shake2 { animation-duration: .06s; }

  /* таймер: тонкая линия с метками, прогресс заливается слева, маркер несёт секунды */
  #tstring { position: absolute; left: 0; right: 0; top: 0; height: 44px; z-index: 1; pointer-events: none; }
  #tstring svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
  #tdone { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; transform: scaleX(0); }
  #tflag { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .3s; }
  #tflag.on { opacity: 1; }
  #tflag .tn { position: absolute; left: -22px; top: -12px; min-width: 44px; height: 26px; padding: 0 8px; border-radius: 999px; background: #0b0b14; border: 1.5px solid var(--c3); box-shadow: 0 0 18px -4px var(--c3);
    font: 900 13px/23px var(--display); text-align: center; color: var(--text); font-variant-numeric: tabular-nums; transition: border-color .2s, box-shadow .2s, color .2s; }
  #tflag.hot .tn { border-color: var(--bad); box-shadow: 0 0 22px -2px var(--bad); color: var(--bad); animation: tpulse .5s ease-in-out infinite alternate; }
  @keyframes tpulse { to { transform: scale(1.12); } }

  /* лобби: счётчик игроков над канатом справа и ✔/✖-превью зон — сцена не пустая, но без шума */
  #lobbyCount { position: absolute; left: 50%; right: 0; top: 40px; height: calc(var(--ry) - 40px - var(--sz) * .3); z-index: 2; display: flex; align-items: center; justify-content: center; gap: .6em; opacity: 0; transition: opacity .4s; pointer-events: none; font-size: calc(var(--sz) * .5); }
  body[data-phase="lobby"] #lobbyCount { opacity: 1; }
  #lobbyCount b { font: 900 1.8em/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  #lobbyCount span { font: 700 .5em/1.2 var(--display); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  #sgBack .zm { opacity: 0; transition: opacity .5s; }
  body[data-phase="lobby"] #sgBack .zm { opacity: 1; }

  /* игроки на канате */
  .pl { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 4; transition: transform .6s cubic-bezier(.3, .8, .3, 1), opacity .4s; will-change: transform; }
  .pl.b { z-index: 3; }
  .pl.fallen { z-index: 5; }
  body[data-phase="lobby"] #flag, body[data-phase="finished"] #flag { display: none; }
  .pl.inst, .pl.inst * { transition: none !important; }
  .pl.dim { opacity: .5; }
  .pl.gone { opacity: 0; }
  .pl-s { position: absolute; left: 0; top: 0; width: 0; height: 0; transform: scale(var(--k, 1)); }
  .pl-w { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .pl-in { position: absolute; left: calc(var(--sz) / -2); top: calc(var(--sz) / -2); width: var(--sz); height: var(--sz); transform-origin: 50% 100%; transform: rotate(var(--lean, 0deg)); transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
  .pl[data-side="a"] { --ring: var(--side-a); } .pl[data-side="b"] { --ring: var(--side-b); }
  .bub { width: 100%; height: 100%; border-radius: 50%; border: calc(var(--sz) * .055) solid var(--ring, var(--pc)); display: grid; place-items: center; font-size: calc(var(--sz) * .52); line-height: 1;
    background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .26), rgba(255, 255, 255, .07) 70%), #14141f;
    box-shadow: 0 0 calc(var(--sz) * .3) calc(var(--sz) * -.06) var(--ring, var(--pc)), inset 0 1px 0 rgba(255, 255, 255, .25);
    animation: sway 3.4s ease-in-out infinite; animation-delay: var(--dl, 0s); transition: border-color .3s, box-shadow .3s;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  @keyframes sway { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(calc(var(--sz) * .03)) rotate(1.5deg); } }
  .hand { position: absolute; width: calc(var(--sz) * .17); height: calc(var(--sz) * .17); border-radius: 50%; background: #e9e6ff; box-shadow: 0 0 8px rgba(255, 255, 255, .5); top: calc(50% - var(--sz) * .38 - var(--sz) * .085); }
  .hand.l { left: calc(var(--sz) * -.02); } .hand.r { right: calc(var(--sz) * -.02); }
  .pl.b .hand { top: calc(50% + var(--sz) * .28 - var(--sz) * .085); }
  .chk { position: absolute; left: calc(var(--sz) * .16); top: calc(var(--sz) * -.6); width: calc(var(--sz) * .38); height: calc(var(--sz) * .38); border-radius: 50%; background: var(--ok); border: 2px solid #0b0b14; box-shadow: 0 0 14px -2px var(--ok); color: #07120c; font: 900 calc(var(--sz) * .22)/1 var(--body); display: grid; place-items: center; opacity: 0; transform: scale(.3); transition: opacity .2s, transform .35s var(--pop); }
  .pl.ready .chk { opacity: 1; transform: none; }
  .wmark { position: absolute; left: calc(var(--sz) * -.66); top: calc(var(--sz) * -.62); font-size: calc(var(--sz) * .46); line-height: 1; opacity: 0; transform: scale(.3); transition: opacity .3s, transform .4s var(--pop); }
  .pl.wolf .wmark { opacity: 1; transform: none; }
  .nm2 { position: absolute; left: 0; top: calc(var(--sz) * var(--k, 1) * .5 + 5px); transform: translateX(-50%); max-width: var(--tw, 120px); padding: 2px 5px 3px; background: rgba(12, 12, 20, .78); border: 1px solid var(--hair); border-bottom: 2px solid var(--pc); border-radius: 10px;
    font: 700 var(--nfs, 16px)/1.2 var(--body); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
  .nm2 > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pl.b .nm2, .pl.fallen .nm2 { top: auto; bottom: calc(var(--sz) * var(--k, 1) * .5 + 5px); }
  .nm2 .x { flex: none; display: none; border: 0; background: var(--bad); color: #1a0509; font: 900 12px/1 var(--body); width: 18px; height: 18px; border-radius: 50%; padding: 0; }
  body.host.lobbyp .pl:hover .nm2 { max-width: none; }
  body.host.lobbyp .pl:hover .nm2 .x, body.host.lobbyp .pl:focus-within .nm2 .x { display: block; }
  .pts { position: absolute; left: 0; top: calc(var(--sz) * var(--k, 1) * -.5 - 36px); margin-left: 0; translate: -50% 0; padding: 1px 7px 2px; border-radius: 999px; border: 1.5px solid currentColor; background: #0b0b14; font: 900 max(calc(var(--sz) * var(--k, 1) * .24), 12px)/1.2 var(--display); white-space: nowrap; opacity: 0; transform: scale(.3); transition: opacity .2s, transform .4s var(--pop); z-index: 3; font-variant-numeric: tabular-nums; }
  .pts.on { opacity: 1; transform: none; }
  .pts.bk::before { content: "×2"; position: absolute; left: -10px; top: -15px; padding: 0 5px; font-size: .62em; line-height: 1.5; background: linear-gradient(100deg, var(--c1), var(--c2)); color: #0a0a0f; border-radius: 8px; }
  .pl.b .pts { top: calc(var(--sz) * var(--k, 1) * -.1); translate: calc(var(--sz) * var(--k, 1) * .5 + 50%) 0; }
  .pl.fallen .pts { top: calc(var(--sz) * var(--k, 1) * -.5 - 60px); }
  .pts.pos { color: var(--ok); } .pts.neg { color: var(--bad); } .pts.zero { color: var(--muted); }
  /* тесная толпа: очки — малый бейдж у верхнего правого края фишки, чтобы соседние не налезали */
  .pl.dense .pts, .pl.dense.b .pts, .pl.dense.fallen .pts { top: calc(var(--sz) * var(--k, 1) * -.5 - 8px); left: 0; translate: -50% 0; padding: 0 5px 1px; font-size: max(calc(var(--sz) * var(--k, 1) * .22), 10px); border-width: 1px; z-index: 6; }
  .pl.dense:not(.b):not(.fallen) .pts { top: calc(var(--sz) * var(--k, 1) * .5 - 8px); }
  .pl.dense:not(.b):not(.fallen) .nm2 { top: calc(var(--sz) * var(--k, 1) * .5 + 13px); }
  .pl.dense.b .nm2 { bottom: calc(var(--sz) * var(--k, 1) * .5 + 13px); }
  .pl.dense .pts.bk::before { left: -8px; top: -11px; }
  .pl.ready .pop, .pl.shiver .pl-w { animation: shiver .45s linear; }
  @keyframes shiver { 0%, 100% { transform: translateX(0); } 15% { transform: translateX(-4px) rotate(-3deg); } 35% { transform: translateX(4px) rotate(3deg); } 55% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .pl.hop .pl-w { animation: hop .7s var(--pop) 2; animation-delay: var(--hd, 0s); }
  @keyframes hop { 40% { transform: translateY(calc(var(--sz) * -.22)); } 70% { transform: translateY(0) scaleY(.92); } }
  .pl.enter .pl-w { animation: enter .6s var(--pop) both; }
  @keyframes enter { from { transform: scale(.2) translateY(-40px); opacity: 0; } }
  .pl.pulled .pl-in { transition: transform .4s; }
  .pl.mud .bub { --ring: var(--bad); filter: saturate(.55) brightness(.85); }

  #flag { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 2; will-change: transform; }
  #flag .fl { position: absolute; left: calc(var(--sz) * -.2); bottom: -6px; width: calc(var(--sz) * 1.05); height: calc(var(--sz) * 1.3); overflow: visible; transform-origin: calc(var(--sz) * .2) 100%; transition: transform .45s var(--pop); filter: drop-shadow(0 0 8px rgba(255, 255, 255, .5)); }
  #flag .rag { transform-origin: 20% 6%; animation: flap .9s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: skewY(-5deg) scaleX(1); } to { transform: skewY(6deg) scaleX(.93); } }
  #fx { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
  .drop { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 10px var(--bad); animation: splashd .7s cubic-bezier(.2, .7, .4, 1) forwards; }
  @keyframes splashd { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
  .ring { position: absolute; margin: 0; border: 2px solid rgba(251, 113, 133, .85); border-radius: 50%; animation: ring .9s ease-out forwards; }
  @keyframes ring { from { transform: scale(.25); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }

  @media (max-height: 800px) { .rules { display: none; } }
  @media (max-aspect-ratio: 5/4) {
    .up { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 0 calc(3 * var(--vw)); }
    .mid { grid-column: 1 / -1; grid-row: 1; }
    .sign { grid-row: 2 !important; height: calc(17 * var(--vh)); min-height: 96px; }
    .sign.a { grid-column: 1; } .sign.b { grid-column: 2; }
    .sg-board { flex-direction: row; justify-content: center; gap: 12px; padding: calc(1 * var(--vh)) 14px; }
    .sg-word { width: auto; flex: 1; font-size: clamp(18px, calc(3.4 * var(--vh)), 40px); }
    .sign.a .sg-n { right: auto; left: -.1em; } .sign.b .sg-n { left: auto; right: -.1em; }
    .lobby { grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0, 1fr); gap: calc(1.5 * var(--vh)) calc(3 * var(--vw)); overflow: hidden; padding-top: 0; }
    .lobby > div:nth-child(1) { grid-column: 1; grid-row: 2; }
    .lobby > div:nth-child(2) { grid-column: 1 / -1; grid-row: 1; }
    .lobby > div:nth-child(3) { grid-column: 2; grid-row: 2; }

const hostKey = () => "crowd-host-" + CODE;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS = "http://www.w3.org/2000/svg";
const upper = $("upper"), stage = $("stage");

const VW = () => innerWidth / Z, VH = () => innerHeight / Z;

let conn = null, state = null, isHost = false, dead = false;
let viewKey = "";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = escapeHtml;
const player = (id) => state && state.players.find((p) => p.id === id);
const present = () => state.players.filter((p) => !p.left);

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  showBanner(T("creating"));
  try {
    const body = { settings: { lang: wvLang() } };
    if (params.get("speed")) body.speed = Number(params.get("speed"));
    const res = await fetch("/crowd/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);

  } catch (err) {

}
function showBanner(text) {
  const b = $("banner");

}

// ---------- геометрия сцены ----------
const M = { W: 1600, H: 440, sz: 80, ropeY: 160, gy: 220, postL: 120, postR: 1480, px: 800, py: 340, rx: 140, ry: 40, nfs: 16 };

  const rawPortrait = innerWidth / innerHeight < 1.25;

  // ≥1.15 — ТВ (растягиваем); низкий экран (<700px высоты, например ТВ с браузерным зумом 200%) — наоборот, сжимаем виртуальный экран
  Z = zz >= 1.15 || (innerHeight < 700 && !rawPortrait) ? Math.round(zz * 100) / 100 : 1;
  document.documentElement.style.setProperty("--z", Z);

  const portrait = vw / vh < 1.25;

  const gy = Math.round(sh * 0.5);

  const ropeY = Math.round(34 + 1.25 * sz);
  document.documentElement.style.setProperty("--sh", sh + "px");
  document.documentElement.style.setProperty("--gy", gy + "px");
  document.documentElement.style.setProperty("--sz", sz + "px");
  document.documentElement.style.setProperty("--ry", ropeY + "px");

  M.postR = vw - M.postL;
  M.px = vw / 2;
  M.py = gy + (sh - gy) * 0.5;
  M.rx = clamp(vw * 0.085, 80, 220);

}

  const post = (x, c) => `<g><rect x="${x - 1}" y="${ropeY}" width="2" height="${H - ropeY}" fill="url(#pg${c})"/><circle cx="${x}" cy="${ropeY}" r="11" fill="#0b0b14" stroke="${c === "a" ? "#4f8bff" : "#ff7a2f"}" stroke-width="2.5"/><circle cx="${x}" cy="${ropeY}" r="4" fill="${c === "a" ? "#22d3ee" : "#ec4899"}"/></g>`;

  const zy = ropeY + (H - ropeY) * 0.62, zr = clamp(Math.min((H - ropeY) * 0.3, W * 0.07), 26, 110);

// размеры и позиции
function rowsFor(n) { return n > (M.portrait ? 3 : 6) ? 2 : 1; }
// слоты в полосе [x0, x1] (x0 — ближний к центру край, x1 — дальний), порядок от x0 к x1
function layoutRow(n, x0, x1, maxStep) {
  const R = rowsFor(n), cols = Math.ceil(n / R);
  const span = Math.abs(x1 - x0), dir = x1 >= x0 ? 1 : -1;
  const step = Math.min(span / (cols + (R === 2 ? 0.5 : 0)), maxStep);
  const out = [];
  for (let j = 0; j < n; j++) {
    const row = R === 2 ? j % 2 : 0, col = Math.floor(j / R);
    out.push({ x: x0 + dir * (col + 0.5 + (row ? 0.5 : 0)) * step, row });
  }
  return { slots: out, step, k: Math.min(1, (step * 0.94) / M.sz) };
}
function centered(n, half, maxStep) {
  // толпа по обе стороны от центра: посередине оставлен просвет под лоскут и меловую метку
  const R = rowsFor(n), nl = Math.ceil(n / 2), nr = n - nl, gap = M.sz * 0.62;
  const cols = Math.ceil(nl / R);
  const step = Math.min((half - gap) / (cols + (R === 2 ? 0.5 : 0)), maxStep);
  const out = [];
  for (let j = 0; j < nl; j++) { const row = R === 2 ? j % 2 : 0, col = Math.floor(j / R); out.push({ x: M.px - gap - (col + 0.5 + (row ? 0.5 : 0)) * step, row }); }
  for (let j = 0; j < nr; j++) { const row = R === 2 ? j % 2 : 0, col = Math.floor(j / R); out.push({ x: M.px + gap + (col + 0.5 + (row ? 0.5 : 0)) * step, row }); }
  return { slots: out, step, k: Math.min(1, (step * 0.94) / M.sz) };
}
const yFor = (row, k) => M.ropeY + (row ? -0.28 : 0.38) * M.sz * k;
function setT(pl, t) {
  const key = [Math.round(t.x), Math.round(t.y), t.k.toFixed(2), t.row, Math.round(t.lean || 0), Math.round(t.tw), t.fallen ? 1 : 0].join();
  if (pl.key === key) return;
  pl.key = key;
  const e = pl.el;
  e.style.transform = `translate(${t.x.toFixed(1)}px,${t.y.toFixed(1)}px)`;
  e.style.setProperty("--k", t.k.toFixed(3));
  e.style.setProperty("--tw", Math.round(t.tw) + "px");
  e.style.setProperty("--nfs", M.nfs + "px");
  e.querySelector(".pl-in").style.setProperty("--lean", (t.lean || 0) + "deg");
  e.classList.toggle("b", t.row === 1);
  e.classList.toggle("fallen", !!t.fallen);
  fitName(e, t.tw);
}
// подпись игрока: не режем до 2–3 букв — сначала уменьшаем кегль (до 9px), усечение только если и так не влезает
function fitName(e, tw) {
  const nm = e.querySelector(".nm2"), sp = nm.firstElementChild;
  nm.style.fontSize = "";
  const avail = tw - 12, w = sp.scrollWidth;
  if (w > avail && avail > 0) nm.style.fontSize = Math.max(9, Math.floor(M.nfs * avail / w * 10) / 10) + "px";
}
function groupTargets(ids, lay, lean) {
  ids.forEach((id, j) => {
    const pl = PL.get(id); if (!pl) return;
    const s = lay.slots[j];
    setT(pl, { x: s.x, y: yFor(s.row, lay.k), k: lay.k, row: s.row, lean: lean || 0, tw: Math.max(54, lay.step * 0.98) });
  });
}
function layoutSpread() {
  // лобби: участники слева, вплотную друг к другу, без дыры посередине
  const ids = [...PL.keys()];
  const lay = layoutRow(Math.max(1, ids.length), M.postL + M.sz * 0.9, M.W - M.postL - M.sz * 0.9, M.sz * 1.7);
  groupTargets(ids, lay, 0);
}
function layoutHuddle() {
  const ids = [...PL.keys()];
  const big = ids.length > 6;
  const lay = centered(ids.length, M.W * (M.portrait ? (big ? 0.3 : 0.22) : (big ? 0.22 : 0.16)), M.sz * 1.7);
  groupTargets(ids, lay, 0);
  return lay;
}

// ---------- флажок-таймер ----------
let lastTickSec = null;
function timerFrame() {
  const tf = $("tflag"), live = state && !dead && (state.phase === "vote" || state.phase === "opinion" || state.phase === "pause") && state.phaseEnd;
  tf.classList.toggle("on", !!live);
  if (!live) { $("tdone").style.transform = "scaleX(0)"; return; }
  const left = phaseLeft();
  // в голосовании первые 5 с — чтение вопроса: флажок едет по всему отрезку, но красный только в последние 5 с
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const f = clamp(1 - left / total, 0, 1);
  const W = M.W, x = 18 + f * (W - 36);
  const y = M.tys ? M.tys(x) : 14;
  tf.style.transform = `translate(${x.toFixed(1)}px,${(y - 1).toFixed(1)}px)`;
  const hot = left < 5000 && state.phase !== "pause";
  tf.classList.toggle("hot", hot);
  const dn = $("tdone");
  dn.style.transform = `scaleX(${f.toFixed(4)})`;
  const sec = Math.max(0, Math.ceil(left / 1000));
  if (hot && left > 0 && sec !== lastTickSec) { lastTickSec = sec; wvSfx.tick(sec <= 2); }
  if (!hot) lastTickSec = null;
  if (tf.dataset.s !== String(sec)) { tf.dataset.s = sec; $("tnum").textContent = sec; $("stage").setAttribute("aria-label", tpl("tm_left", { n: sec })); }
}

// ---------- раскрытие ----------
const RV = { id: "", plan: null, fired: new Set(), placed: new Set(), flagX: null, flagTo: 0, fallen: new Set(), lean: 0, op: null };

function buildPlan() {
  const r = state.round, res = r.result, q = r.q;
  const order = res.order;
  const N = order.length;
  const sides = { a: [], b: [] };
  for (const id of order) if (PL.has(id)) sides[res.votes[id]].push(id);
  const plan = { N, sides, vt: (i) => 500 + 600 * i };
  plan.tLast = N ? plan.vt(N - 1) : 500;
  plan.tEnd = plan.tLast + 750;
  plan.hasOp = !!res.opinions;
  plan.opAt = plan.tEnd + 1900;
  const oa = res.opinions ? res.opinions.a : 0, ob = res.opinions ? res.opinions.b : 0;
  plan.opSeq = [];
  for (let i = 0, a = oa, b = ob, s = "a"; a + b > 0; i++) { if ((s === "a" && a > 0) || b === 0) { plan.opSeq.push("a"); a--; } else { plan.opSeq.push("b"); b--; } s = s === "a" ? "b" : "a"; }
  plan.opDone = plan.opAt + 220 * plan.opSeq.length + 400;
  // раскладка по сторонам
  const { W, px, rx } = M;
  const near = W * (M.portrait ? 0.1 : 0.17);
  plan.lay = {};
  for (const s of ["a", "b"]) {
    const nr = sides[s].length > 6 ? near * (M.portrait ? 0.7 : 0.6) : near;
    const x0 = s === "a" ? px - nr : px + nr;
    const x1 = s === "a" ? W * 0.045 : W * 0.955;
    plan.lay[s] = layoutRow(sides[s].length || 1, x0, x1, M.sz * 1.7);
  }
  // меньшинство в луже
  const minSide = res.side && !res.unanimous ? (res.side === "a" ? "b" : "a") : null;

  plan.fall = {};
  if (minSide) {
    const ids = sides[minSide], m = ids.length, R = m > 4 ? 2 : 1, cols = Math.ceil(m / R);

    ids.forEach((id, j) => {
      const row = R === 2 ? j % 2 : 0, col = Math.floor(j / R);

}
const dFor = (na, nb, cast) => (cast ? (na - nb) / cast : 0);

function fitVerdict() {

function updateReveal(t, instant) {
  const plan = RV.plan; if (!plan) return;
  const r = state.round, res = r.result;
  const first = (k) => { if (RV.fired.has(k)) return false; RV.fired.add(k); return true; };
  const live = (at) => !instant && t - at < 900;
  // голоса по очереди
  let na = 0, nb = 0, shown = 0;
  const order = res.order;
  for (let i = 0; i < order.length; i++) {
    if (t < plan.vt(i) && !instant) break;
    const id = order[i], s = res.votes[id];
    if (s === "a") na++; else nb++;
    shown++;
    if (first("v" + i)) {
      const pl = PL.get(id);
      if (pl) {
        const j = plan.sides[s].indexOf(id);
        RV.placed.add(id);
        pl.el.dataset.side = s;
        pl.el.classList.toggle("dense", plan.lay[s].slots.some((x) => x.row) || plan.lay[s].k < 0.85);
        const lay = plan.lay[s];
        const sl = lay.slots[j];
        pl.el.classList.remove("ready");
        if (instant) pl.el.classList.add("inst");
        setT(pl, { x: sl.x, y: yFor(sl.row, lay.k), k: lay.k, row: sl.row, lean: s === "a" ? -8 : 8, tw: Math.max(54, lay.step * 0.98) });
        if (instant) requestAnimationFrame(() => pl.el.classList.remove("inst"));
      }
      if (live(plan.vt(i))) {
        const d = Math.abs(dFor(na, nb, res.cast));
        if (i === order.length - 1 && res.side) { wvSfx.step(); wvSfx.thud(); }
        else { wvSfx.step(); if (i % 2 === 0) wvSfx.creak(d); }
      }
      const el = $("n" + s); if (el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    }
  }
  for (const s of ["a", "b"]) { const e = $("n" + s); if (e) { const n = s === "a" ? na : nb; e.textContent = n; e.classList.toggle("on", shown > 0); } }
  const d = dFor(na, nb, res.cast);
  RV.flagTo = d;
  // натяжение
  const taut = shown > 0 && !res.void;
  const rope = $("ropeG");
  rope.classList.toggle("shake", taut && t < plan.tEnd + 300 && !instant);
  RV.sag = taut ? 0 : 5;
  // лидирующая сторона наклоняется сильнее
  if (shown > 0) {
    for (const s of ["a", "b"]) for (const id of plan.sides[s]) {
      if (!RV.placed.has(id)) continue;
      const pl = PL.get(id), ld = s === "a" ? Math.max(0, d) : Math.max(0, -d), cur = pl.key.split(",");
      const lean = (s === "a" ? -1 : 1) * (7 + 12 * ld);
      if (!RV.fallen.has(id) && +cur[4] !== Math.round(lean)) setT(pl, { x: +cur[0], y: +cur[1], k: +cur[2], row: +cur[3], lean, tw: +cur[5] });
    }
  }
  // итог
  const end = instant || t >= plan.tEnd;
  if (res.void) {
    if (instant || t >= 300) { showVerdict("vdVoid"); if (first("void") && !instant) wvSfx.buzz(); }
    return;
  }
  if (end) {
    const ended = first("end");
    if (res.tie) {
      showVerdict("vdTie");
      rope.classList.toggle("shake", !instant); rope.classList.add("shake2");
      if (ended && !instant) wvSfx.strain();
    } else if (res.unanimous) {
      showVerdict("vdOne");
      if (ended && !instant) wvSfx.chord();
    } else {
      showVerdict("vdMaj");
    }
    if (ended) {
      if (!res.tie) rope.classList.remove("shake", "shake2");
      // победители подпрыгивают, у меньшинства — падение
      const winners = res.unanimous ? plan.sides.a.concat(plan.sides.b) : res.tie ? [] : plan.sides[res.side];
      winners.forEach((id, i) => { const pl = PL.get(id); if (!pl) return; pl.el.style.setProperty("--hd", (i * 0.07) + "s"); pl.el.classList.add("hop"); });
      if (plan.minSide) plan.sides[plan.minSide].forEach((id) => { const f = plan.fall[id]; if (instant) dropPlayer(id, true); else later(f.delay + 150, () => dropPlayer(id, false)); });
      if (res.wolf) { const wp = PL.get(res.wolf); if (wp) wp.el.classList.add("wolf"); }
      // очки над аватарами
      let n = 0;
      for (const id of order) {
        const pl = PL.get(id); if (!pl || !(id in res.pts)) continue;
        const v = res.pts[id], b = pl.el.querySelector(".pts");
        b.textContent = (v > 0 ? "+" + v : v < 0 ? "−" + Math.abs(v) : "0");
        b.className = "pts " + (v > 0 ? "pos" : v < 0 ? "neg" : "zero") + (res.banked[id] ? " bk" : "");

  if (plan.hasOp && $("oprope")) {
    const tks = $("tks");
    if (instant || t >= plan.opAt) {
      const seq = plan.opSeq;
      let oa = 0, ob = 0;
      for (let i = 0; i < seq.length; i++) {
        if (!instant && t < plan.opAt + 220 * i) break;
        if (first("o" + i)) {
          const el = document.createElement("div");
          const s = seq[i];
          const cnt = seq.slice(0, i).filter((x) => x === s).length;
          const w = $("oprope").clientWidth, pitch = clamp(w * 0.5 / 13, 22, 44);
          el.className = "tk " + s; el.textContent = "👤";
          el.style.left = s === "a" ? cnt * pitch + "px" : "auto";
          if (s === "b") el.style.right = cnt * pitch + "px";
          tks.append(el);
          requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
          if (!instant) wvSfx.step();
        }
        if (seq[i] === "a") oa++; else ob++;
      }
      $("opA").textContent = oa ? oa : ""; $("opB").textContent = ob ? ob : "";
      RV.opTo = (oa + ob) ? (oa - ob) / (oa + ob) : 0;
      if (res.illusion && (instant || t >= plan.opDone)) {
        showVerdict("vdIll");
        if (first("ill") && !instant) wvSfx.pop();
      }
    }
  }
}

// флаг и канат — по кадрам
function frameFlag(dt) {
  const showFlag = state && !dead && state.phase !== "finished";
  const f = $("flag");
  if (!showFlag) return;
  const inRev = state.phase === "reveal" || state.phase === "scores";
  const to = inRev && RV.plan && state.round && state.round.result && !state.round.result.void ? RV.flagTo : 0;
  const tx = M.px - to * 0.30 * M.W;
  if (RV.flagX == null) RV.flagX = tx;
  RV.flagX += (tx - RV.flagX) * Math.min(1, dt * 0.006);
  const sag = inRev && RV.sag != null ? RV.sag : 5;
  if (Math.abs(sag - sagNow) > 0.05) setRope(sagNow + (sag - sagNow) * Math.min(1, dt * 0.01));
  const y = M.ropeY + sagAt(RV.flagX, sagNow) * 1.0;
  f.style.transform = `translate(${RV.flagX.toFixed(1)}px,${y.toFixed(1)}px)`;
  const fl = f.querySelector(".fl");
  const dir = to > 0.01 ? -1 : 1;
  fl.style.transform = dir < 0 ? "scaleX(-1) translateX(0)" : "none";
  // мнения
  const of = $("oflag"), orp = $("oprope");
  if (of && orp && RV.opTo != null) {
    const w = orp.clientWidth;
    RV.opX = (RV.opX == null ? 0.5 : RV.opX) + ((0.5 - RV.opTo * 0.3) - (RV.opX == null ? 0.5 : RV.opX)) * Math.min(1, dt * 0.006);
    of.style.transform = `translateX(${(RV.opX * w).toFixed(1)}px)`;
  } else if (of && orp) { of.style.transform = `translateX(${(orp.clientWidth / 2).toFixed(1)}px)`; }
}

function drawReveal() {

  RV.plan = buildPlan();

// ---------- счёт ----------
function drawScores() {
  const key = "scores:" + roundId() + wvLang() + M.W + M.H;
  if (viewKey === key) return;
  viewKey = key;
  const r = state.round, res = r.result;
  // сцена: итог раскрытия остаётся
  if (RV.id !== roundId() || !RV.plan) { RV.id = roundId(); RV.fired = new Set(); RV.placed = new Set(); RV.fallen = new Set(); resetPlayersFlags(); RV.plan = buildPlan(); }
  const list = present().slice();
  const before = (p) => p.score - (res.void ? 0 : res.pts[p.id] || 0);
  list.sort((a, b) => b.score - a.score);
  const max = Math.max(1, ...list.map((p) => p.score));
  const cols = list.length > 6 ? 2 : 1, rows = Math.ceil(list.length / cols);
  const title = r.num && (r.kind === "normal" || r.kind === "final") ? tpl("scores_title", { n: r.num }) : T("scores_title_x");
  const note = res.void ? T("void_note") : r.only ? tpl("decider_note", { names: wvNames(r.only, player) }) : "";
  const fmtD = (v) => (v > 0 ? "+" + v : v < 0 ? "−" + Math.abs(v) : "0");
  upper.innerHTML = `<div class="up sc"><div class="sc-head"><h2>${esc(title)}</h2>${note ? `<p>${esc(note)}</p>` : ""}</div>
    <div class="sc-tab" style="--cols:${cols};--rows:${rows}">${list.map((p) => {
      const has = !res.void && p.id in res.pts, d = has ? res.pts[p.id] : 0, b0 = before(p);
      const bd = (has && res.banked[p.id] ? `<span class="tag2" title="${esc(T("bank_tip"))}">×2</span>` : "") + (res.wolf === p.id && !res.void ? `<span title="${esc(T("wolf_tip"))}">🐺</span>` : "");
      return `<div class="row${has || res.void || r.only ? "" : " out"}" style="--pc:${esc(p.color)};--w0:${Math.max(0, b0) / max}" data-w="${Math.max(0, p.score) / max}"><span class="rk">${wvRank(list, p)}</span>${avHtml(p)}<b class="nm">${esc(p.name)}</b><span class="bd">${bd}</span><div class="bar"><i></i></div><span class="tot${p.score < 0 ? " neg" : ""}" data-from="${b0}" data-to="${p.score}">${b0}</span><span class="dl ${d > 0 ? "pos" : d < 0 ? "neg" : "zero"}">${has ? fmtD(d) : ""}</span></div>`;
    }).join("")}</div></div>`;
  const tab = upper.querySelector(".sc-tab");
  {
    const head = upper.querySelector(".sc-head"), avail = upper.clientHeight - head.offsetHeight - 40;
    const rh = Math.min(86, (avail - 6 * (rows - 1)) / rows), cw = (upper.clientWidth * 0.9) / cols;
    tab.style.setProperty("--th", Math.round(rh * rows + 6 * (rows - 1)) + "px");
    const fs = clamp(Math.min(rh * 0.42, cw / 19), 13, 34);
    tab.style.setProperty("--fs", fs + "px");
    tab.classList.toggle("nb", cw < fs * 26); // узкая колонка: шкалу прячем, имя важнее
  }
  const rowsEl = upper.querySelectorAll(".row");
  rowsEl.forEach((row) => { row.querySelector(".nm").style.minWidth = "0"; });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    rowsEl.forEach((row) => { row.querySelector(".bar i").style.setProperty("--w0", row.dataset.w); row.querySelector(".bar i").style.transform = `scaleX(${row.dataset.w})`; row.querySelector(".dl").classList.add("on"); });
    countUp(upper.querySelectorAll(".tot"), 900, 350);
  }));
  // сцена: показываем итог раскрытия без анимации, если он ещё не показан
  if (!RV.fired.has("end") && !res.void) updateReveal(Infinity, true);
  else if (res.void) updateReveal(Infinity, true);
}
function countUp(nodes, dur, delay) {
  const t0 = performance.now() + delay;
  const step = (t) => {
    const k = clamp((t - t0) / dur, 0, 1), e = 1 - Math.pow(1 - k, 3);
    nodes.forEach((n) => { const f = +n.dataset.from, to = +n.dataset.to; n.textContent = Math.round(f + (to - f) * e); });
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawFinal() {
  const key = "final:" + state.game + wvLang() + isHost + M.W + M.H;
  if (viewKey === key) return;
  viewKey = key;
  const list = present().slice().sort((a, b) => b.score - a.score);
  const top = [list[1], list[0], list[2]];
  const hsOf = (rk) => (rk === 1 ? "76%" : rk === 2 ? "58%" : "44%"), ds = ["1.1s", "1.6s", "0.7s"];
  const aw = state.awards || {};
  const names = (ids) => ids.map((id) => (player(id) || {}).name || "?").join(", ");
  const rows = [];
  const add = (a, ico, k) => { if (a && a.ids && a.ids.length) rows.push(`<div class="aw"><span class="rosette">${ico}</span><div style="min-width:0"><div class="ek">${esc(T("aw_" + k))}</div><b>${esc(names(a.ids))}</b><p>${esc(tpl("aw_" + k + "_d", { n: a.n }))}</p></div></div>`); };
  add(aw.crowd, "👥", "crowd"); add(aw.crow, "🐑", "crow"); add(aw.risk, "🎲", "risk"); add(aw.wolf, "🐺", "wolf");
  const sub = state.finishedReason === "paused" ? T("final_paused") : state.finishedReason === "few" ? T("final_few") : state.finishedReason === "host" ? T("final_host") : "";
  const head = state.finishedReason === "paused" ? T("final_paused") : T("final_title");
  upper.innerHTML = `<div class="up fin-up"><div class="fin-l"><h1>${esc(head)}</h1>${sub && state.finishedReason !== "paused" ? `<p class="sub">${esc(sub)}</p>` : ""}
    <div class="podium">${top.map((p, i) => p ? `<div class="step${wvRank(list, p) === 1 ? " first" : ""}"><div class="who" style="--d:${ds[i]}">${avHtml(p)}<span>${esc(p.name)}</span></div><div class="blk" style="--h:${hsOf(wvRank(list, p))};--d:${[0.4, 0.9, 0.1][i]}s">${wvRank(list, p)}<small>${p.score}</small></div></div>` : `<div class="step"></div>`).join("")}</div>
    ${list.length > 3 ? `<div class="rest">${list.slice(3).map((p) => `<span>${avHtml(p)}<b>${wvRank(list, p)}. ${esc(p.name)}</b> ${p.score}</span>`).join("")}</div>` : ""}</div>
    <div class="fin-r">${rows.join("")}<div class="hostbtns">${isHost ? `<button class="start" id="again" type="button">${esc(T("btn_again"))}</button><button class="ghostbtn" id="tolobby" type="button">${esc(T("btn_lobby"))}</button>` : ""}<a class="ghostbtn" href="index.html"${isHost ? "" : ' style="grid-column:1 / -1"'}>${esc(T("btn_home"))}</a></div></div></div>`;
  if (isHost) { $("again").onclick = () => conn.send({ type: "start" }); $("tolobby").onclick = () => conn.send({ type: "lobby" }); }
  if (state.finishedReason === "done" && !RM) later(900, () => wvSfx.fanfare());
}

// ---------- отрисовка ----------
let lastPhase = null, prevReady = new Set(), prevRoundId = "";
function render() {
  if (!state || dead) return;
  const ph = state.phase;
  document.body.dataset.phase = ph;
  document.body.classList.toggle("fin", ph === "finished");
  document.body.classList.toggle("lobbyp", ph === "lobby");
  topBar();
  ensurePlayers();
  const r = state.round;
  const dimOf = (p) => !p.online || (ph === "vote" && r && r.voters && !r.voters.includes(p.id)) || ((ph === "reveal" || ph === "scores") && r && r.result && !r.result.void && !(p.id in r.result.votes));
  for (const pl of PL.values()) pl.el.classList.toggle("dim", dimOf(pl.p));
  if (ph !== lastPhase) {
    if (ph === "lobby" || ph === "vote" || ph === "intro") { clearLater(); $("veil").setAttribute("opacity", 0); }
    if (ph === "vote") { RV.plan = null; RV.id = ""; RV.flagTo = 0; RV.sag = 5; $("ropeG").classList.remove("shake", "shake2"); $("fx").replaceChildren(); }
    lastPhase = ph;
  }
  // позиции в сцене
  if (ph === "lobby" || ph === "finished") { for (const pl of PL.values()) pl.el.classList.remove("ready", "hop", "wolf", "mud"); layoutSpread(); }
  else if (ph === "intro" || ph === "vote" || ph === "opinion" || ph === "pause") {
    if (ph === "vote") for (const pl of PL.values()) { pl.el.classList.remove("hop", "wolf", "mud"); pl.el.querySelector(".pts").className = "pts"; }
    layoutHuddle();
  }
  if (ph !== "reveal" && ph !== "scores") for (const pl of PL.values()) { pl.el.classList.remove("hop", "wolf", "mud", "dense"); delete pl.el.dataset.side; const pt = pl.el.querySelector(".pts"); if (pt.className !== "pts") pt.className = "pts"; }
  // «готов»
  if (ph === "vote" && r) {
    const rdy = new Set(r.ready || []);
    const same = prevRoundId === roundId();
    for (const [id, pl] of PL) {
      const on = rdy.has(id);
      pl.el.classList.toggle("ready", on);
      if (on && same && !prevReady.has(id)) { pl.el.classList.remove("shiver"); void pl.el.offsetWidth; pl.el.classList.add("shiver"); wvSfx.lock(); }
    }
    prevReady = rdy;
  } else { prevReady = new Set(); if (ph !== "vote") for (const pl of PL.values()) pl.el.classList.remove("ready"); }
  prevRoundId = r ? roundId() : "";
  switch (ph) {
    case "lobby": return drawLobby();
    case "intro": return drawIntro();
    case "vote": case "opinion": return drawVote();
    case "reveal": return drawReveal();
    case "scores": return drawScores();
    case "pause": return drawPause();
    case "finished": return drawFinal();
  }
}
$("endbtn").onclick = () => { if (confirm(T("btn_end") + "?")) conn.send({ type: "end" }); };

let lastFrame = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(100, t - lastFrame); lastFrame = t;
  if (!state || dead) return;
  timerFrame();
  frameFlag(dt);
  if (state.phase === "reveal" && RV.plan && !RV.instant) updateReveal(phaseNow(), false);
}

let rsz = null;
window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { measure(); for (const pl of PL.values()) pl.key = ""; viewKey = ""; if (state) render(); }, 120); });
window.addEventListener("langchange", () => {
  viewKey = "";
  if (isHost && state && (state.phase === "lobby" || state.phase === "finished") && state.settings.lang !== wvLang()) conn.send({ type: "settings", settings: { lang: wvLang() } });
  render();
});

// ---------- связь ----------
function setState(s) { s.__at = performance.now(); state = s; }
function onMessage(m) {
  switch (m.type) {
    case "hello":
      setState(m.state);
      if (!isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      setState(m.state);
      render();
      break;
    case "host_ok":
      isHost = true;
      document.body.classList.add("host");
      viewKey = "";
      if (state && state.phase === "lobby" && state.settings.lang !== wvLang()) conn.send({ type: "settings", settings: { lang: wvLang() } });
      render();
      break;
    case "host_lost":
      isHost = false;
      document.body.classList.remove("host");
      viewKey = "";
      render();
      break;
    case "error":
      if (m.error === "room_expired") gone();
      break;
  }
}
function gone() {
  dead = true;
  upper.innerHTML = "";
  showBanner(T("expired"));
}
async function boot() {
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  measure();
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  conn = wvConnect({
    code: CODE,
    onMessage,
    onGone: gone,
    onOpen: () => { isHost = false; },
    onState: (st) => { banner.textContent = T("err_connect"); banner.classList.toggle("on", st === "lost"); },
  });
  requestAnimationFrame(frame);
  window.wvBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state && !dead) { for (const pl of PL.values()) pl.key = ""; viewKey = ""; render(); } });
boot();
</script>
