<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1faa2.svg" type="image/svg+xml">
<title>Как все — общий экран</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="crowd-theme.css">
<style>
  /* «Как все», общий экран. Мир: два лагеря и толпа между ними (crowd-spec.md §9).
     Язык аукциона: крупные цветные пятна света на пол-кадра, плотные стеклянные панели с радиусом 26px, единая сетка
     (поля ~50px, зазор ~35px), якорь-логотип в шапке. Вся геометрия сцены считается в JS в «виртуальном экране»
     (1600×900 / портрет 800×1280, растягивается transform'ом под ТВ): зоны А и Б, толпа посередине, шкала-перетягивание
     над зонами. Голоса скрыты до раскрытия: до него толпа стоит в центре, при раскрытии фишки уходят в свой лагерь,
     лагерь большинства раздувается, маркер на шкале едет к победителю на пружине. */
  :root {
    --z: 1;
    --pop: cubic-bezier(.2, 1.5, .4, 1);
    --spring: cubic-bezier(.3, 1.25, .45, 1);
    --hair: rgba(255, 255, 255, .15);
    --g-main: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3));
    --nfs: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: transparent; color: var(--text); font: 500 20px/1.3 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 3px solid var(--c3); outline-offset: 3px; }
  .hidden { display: none !important; }
  b, strong { font-weight: 700; }

  /* свет: большие пятна на пол-кадра. Синий слева-сверху, оранжевый справа-снизу, фиолет в центре */
  .blob { width: 74vmax; height: 74vmax; filter: blur(110px); opacity: .58; transition: opacity 1s ease, background 1s ease; }
  .blob.a { background: var(--side-a); top: -34vmax; left: -26vmax; }
  .blob.b { background: var(--side-b); bottom: -38vmax; right: -26vmax; }
  .blob.c { background: var(--c1); width: 46vmax; height: 46vmax; top: 24%; left: 34%; opacity: .3; }
  body[data-win="a"] .blob.a { opacity: .78; } body[data-win="a"] .blob.b { opacity: .3; }
  body[data-win="b"] .blob.b { opacity: .78; } body[data-win="b"] .blob.a { opacity: .3; }
  body[data-win="tie"] .blob.c { opacity: .5; }
  body[data-phase="opinion"] .blob.c { opacity: .5; }

  #root { position: fixed; left: 0; top: 0; width: calc(100vw / var(--z)); height: calc(100vh / var(--z)); transform: scale(var(--z)); transform-origin: 0 0; overflow: hidden; }
  .lang-switch { transform: scale(var(--z)); transform-origin: top right; }

  /* ---------- шапка: якорь-логотип и код комнаты ---------- */
  .top { position: fixed; left: 0; right: 0; top: 0; z-index: 30; display: flex; align-items: center; gap: 18px; height: calc(var(--lsc, 32px) * 2 / var(--z)); padding: 0 calc(var(--lsw, 160px) / var(--z)) 0 50px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 0 1 auto; }
  .brand i { width: 54px; height: 16px; border-radius: 10px; flex: none; position: relative; background: linear-gradient(90deg, var(--side-a), var(--side-a2) 40%, var(--side-b) 60%, var(--side-b2)); box-shadow: 0 0 22px -2px var(--side-a), 0 0 22px -2px var(--side-b); }
  .brand i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px rgba(255, 255, 255, .9); }
  .brand span { font: 900 34px/1 var(--display); text-transform: uppercase; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: .1em 0;
    background: linear-gradient(100deg, #fff, #dcd6ff 55%, var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .chip { flex: none; font: 900 24px/1 var(--display); padding: 11px 20px; background: rgba(255, 255, 255, .09); border: 1px solid var(--hair); border-radius: 999px; letter-spacing: .12em; white-space: nowrap; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .grow { flex: 1; }
  .top .sound-toggle-btn, .endbtn { flex: none; height: calc(var(--lsh, 44px) / var(--z)); width: calc(var(--lsh, 44px) / var(--z)); border: 1px solid var(--hair); border-radius: 50%; background: rgba(255, 255, 255, .08); color: var(--text); padding: 0; display: grid; place-items: center; font-size: 15px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: background .15s, border-color .15s; }
  .sound-toggle-btn svg { width: 20px; height: 20px; }
  .endbtn:hover, .top .sound-toggle-btn:hover { background: var(--glass-hi); border-color: rgba(255, 255, 255, .3); }
  .banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 50; background: rgba(14, 14, 24, .92); border: 1px solid var(--hair); color: var(--text); padding: 10px 18px; font-weight: 600; border-radius: 999px; }
  .conn { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 50; background: rgba(14, 14, 24, .92); border: 1px solid var(--bad); color: var(--text); padding: 8px 16px; font-weight: 600; border-radius: 999px; visibility: hidden; }
  .conn.on { visibility: visible; }

  main { position: fixed; left: 0; right: 0; top: calc(var(--lsc, 32px) * 2 / var(--z)); bottom: 0; z-index: 2; }
  #upper, #game { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  #upper { z-index: 3; }
  #game { z-index: 2; }
  .pnl { border-radius: 26px; border: 1px solid var(--hair); background: linear-gradient(160deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .045));
    box-shadow: 0 34px 90px -44px #000, inset 0 1px 0 rgba(255, 255, 255, .2); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .gtext { background: var(--g-main); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }

  /* ---------- игровая сцена: вопрос ---------- */
  #game > .abs, #field { position: absolute; }
  .qpanel { display: flex; flex-direction: column; padding: 16px 38px 18px; }
  .qmeta { flex: none; height: 32px; display: flex; align-items: center; justify-content: center; gap: 18px; font: 700 20px/1 var(--display); letter-spacing: .13em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .qmeta .prog { overflow: hidden; text-overflow: ellipsis; }
  .qmeta .prog.k { color: #0a0a0f; background: var(--g-main); padding: .42em .9em; border-radius: 999px; letter-spacing: .1em; }
  .pips { display: flex; gap: 6px; }
  .pips i { width: 24px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .18); }
  .pips i.d { background: linear-gradient(90deg, var(--c1), var(--c3)); }
  .pips i.c { background: #fff; box-shadow: 0 0 12px rgba(255, 255, 255, .8); }
  .qbox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .qtxt { margin: 0; width: 100%; text-align: center; font: 700 var(--qfs, 56px)/1.14 var(--display); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; hyphens: manual; }

  /* боковые блоки: таймер или прогресс слева, готовность или итог справа */
  .sb { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 12px; min-width: 0; overflow: hidden; }
  .ring { position: relative; flex: none; width: var(--rs, 150px); height: var(--rs, 150px); }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ring circle { fill: none; stroke-width: 11; stroke-linecap: round; }
  .ring .tr { stroke: rgba(255, 255, 255, .13); }
  .ring .pg { stroke: url(#rgrad); transition: stroke-dashoffset .25s linear; }
  .ring.hot .pg { stroke: var(--bad); }
  .ring .num { position: absolute; inset: 0; display: flex; align-items: baseline; justify-content: center; padding-top: calc(var(--rs, 150px) * .3); font: 900 calc(var(--rs, 150px) * .36)/1 var(--display); font-variant-numeric: tabular-nums; }
  .ring .num small { font-size: .45em; opacity: .65; font-weight: 700; }
  .ring.hot .num { color: var(--bad); animation: tpulse .5s ease-in-out infinite alternate; }
  @keyframes tpulse { to { transform: scale(1.1); } }
  .sb .big { font: 900 var(--bs, 64px)/1 var(--display); font-variant-numeric: tabular-nums; }
  .sb .cap { font: 600 var(--cs, 22px)/1.2 var(--body); color: rgba(244, 242, 255, .86); text-wrap: balance; }
  .sb .big small { font-size: .5em; opacity: .6; margin-left: .05em; }
  .sb .ico { font-size: calc(var(--bs, 64px) * .8); line-height: 1; }
  .sb.pop .big, .sb.pop .ico { animation: bump .35s var(--pop); }
  @keyframes bump { from { transform: scale(1.3); } }

  /* ---------- поле ---------- */
  .railrow { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 22px; }
  .rn { flex: none; width: var(--nw, 90px); font: 900 var(--rf, 56px)/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .rn.a { text-align: left; color: #9cc0ff; text-shadow: 0 0 36px var(--glow-a); }
  .rn.b { text-align: right; color: #ffb78a; text-shadow: 0 0 36px var(--glow-b); }
  .rn.bump { animation: bump .3s var(--pop); }
  .rail { position: relative; flex: 1; height: 30px; border-radius: 16px;
    background: linear-gradient(90deg, var(--side-a), var(--side-a2) 49.2%, #fff 49.2%, #fff 50.8%, var(--side-b) 50.8%, var(--side-b2));
    box-shadow: 0 0 50px -14px var(--side-a), 0 0 50px -14px var(--side-b), inset 0 1px 0 rgba(255, 255, 255, .4); }
  .rail::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255, 255, 255, .28), transparent 55%, rgba(0, 0, 0, .25)); }
  .puck { position: absolute; left: 0; top: 50%; width: 0; height: 0; z-index: 3; will-change: transform; }
  .puck .knot { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #fff, #e4e0ff 70%); border: 4px solid #0e0e18;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, .55), 0 0 34px 4px rgba(255, 255, 255, .6); }
  .puck .knot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--c1); }
  .puck .fl { position: absolute; left: -1px; bottom: 22px; width: 38px; height: 46px; overflow: visible; transform-origin: 2px 100%; transition: transform .35s var(--pop); filter: drop-shadow(0 0 8px rgba(255, 255, 255, .5)); }
  .puck .rag { transform-origin: 8% 8%; animation: flap .9s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: skewY(-5deg) scaleX(1); } to { transform: skewY(6deg) scaleX(.93); } }
  .rail.win-a { box-shadow: -30px 0 70px -6px var(--side-a), 0 0 50px -14px var(--side-b), inset 0 1px 0 rgba(255, 255, 255, .4); }
  .rail.win-b { box-shadow: 30px 0 70px -6px var(--side-b), 0 0 50px -14px var(--side-a), inset 0 1px 0 rgba(255, 255, 255, .4); }
  .rail.shake .puck { animation: shake .09s linear infinite alternate; }
  @keyframes shake { from { margin-top: -3px; } to { margin-top: 3px; } }

  .oprow { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 22px; opacity: 0; transition: opacity .4s; }
  .oprow.on { opacity: 1; }
  .on-n { flex: none; width: var(--nw, 90px); font: 900 var(--of, 30px)/1 var(--display); font-variant-numeric: tabular-nums; }
  .on-n.a { text-align: left; color: #9cc0ff; } .on-n.b { text-align: right; color: #ffb78a; }
  .opmid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .oplab { font: 700 18px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .opbar { position: relative; width: 100%; height: 14px; border-radius: 8px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  .opbar i { position: absolute; top: 0; bottom: 0; width: 0; transition: width .22s ease-out; }
  .opbar i.a { left: 0; background: linear-gradient(90deg, var(--side-a), var(--side-a2)); }
  .opbar i.b { right: 0; background: linear-gradient(270deg, var(--side-b), var(--side-b2)); }
  .opbar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, .6); }

  .zone { position: absolute; border-radius: 28px; overflow: hidden; --c: var(--side-a); --c2: var(--side-a2);
    border: 1.5px solid color-mix(in srgb, var(--c) 75%, #fff 10%);
    background: linear-gradient(165deg, color-mix(in srgb, var(--c) 58%, transparent), color-mix(in srgb, var(--c2) 18%, transparent) 78%, color-mix(in srgb, var(--c) 8%, transparent));
    box-shadow: 0 0 110px -30px var(--c), inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 -40px 80px -50px rgba(0, 0, 0, .5);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transition: left .8s var(--spring), top .8s var(--spring), width .8s var(--spring), height .8s var(--spring), filter .9s, transform .9s var(--spring), opacity .5s, box-shadow .6s; }
  .zone.b { --c: var(--side-b); --c2: var(--side-b2); }
  .zone.dead { opacity: .72; }
  .zone.win { animation: zflash 1.4s ease-out; box-shadow: 0 0 150px -10px var(--c), inset 0 1px 0 rgba(255, 255, 255, .45); }
  @keyframes zflash { 0% { filter: brightness(1); } 18% { filter: brightness(1.7) saturate(1.3); } 100% { filter: brightness(1.08); } }
  .zone.lose { filter: saturate(.4) brightness(.78); transform: translateY(10px); }
  .zone.pre .zhead { flex-direction: column; justify-content: center; top: 0; bottom: 0; height: auto !important; gap: 18px; text-align: center; padding: 0 26px 6%; }
  .zone.pre .zl { width: calc(var(--bz, 62px) * 1.5); height: calc(var(--bz, 62px) * 1.5); font-size: calc(var(--bz, 62px) * .75); }
  .zone.pre .zw { flex: none; align-self: stretch; font-size: var(--zfp, 52px) !important; text-align: center; }
  .zhead { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 18px; padding: 0 24px; z-index: 1; }
  .zl { flex: none; display: grid; place-items: center; width: var(--bz, 62px); height: var(--bz, 62px); border-radius: 50%; background: linear-gradient(135deg, var(--c), var(--c2)); color: #07070c;
    font: 900 calc(var(--bz, 62px) * .5)/1 var(--display); box-shadow: 0 12px 34px -10px var(--c), inset 0 1px 0 rgba(255, 255, 255, .55); }
  .zw { flex: 1; min-width: 0; font: 800 var(--zf, 36px)/1.08 var(--body); overflow-wrap: normal; text-wrap: balance; text-shadow: 0 2px 22px rgba(0, 0, 0, .35); }
  .zbig { position: absolute; right: .02em; bottom: -.16em; font: 900 var(--gz, 340px)/1 var(--display); color: #fff; opacity: .09; pointer-events: none; }
  .pen { position: absolute; border-radius: 28px; border: 1.5px dashed rgba(255, 255, 255, .26); background: rgba(10, 10, 20, .28); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: left .8s var(--spring), top .8s var(--spring), width .8s var(--spring), height .8s var(--spring), opacity .4s; }
  .pen-t { position: absolute; left: 0; right: 0; top: 0; padding: 14px 16px 0; text-align: center; font: 600 21px/1.25 var(--body); color: rgba(244, 242, 255, .9); text-wrap: balance; }
  .pen-t b { color: #fff; font-weight: 800; text-transform: uppercase; }
  .pen-t small { display: block; font-size: 19px; color: var(--muted); margin-top: 4px; }
  #crack { position: absolute; z-index: 5; overflow: visible; pointer-events: none; opacity: 0; transition: opacity .4s; }
  #crack.on { opacity: 1; }

  /* фишки (в координатах main) */
  #chips { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 4; pointer-events: none; }
  #chips.off { display: none; }
  .pl { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 4; transition: transform .75s var(--spring), opacity .45s; will-change: transform; pointer-events: auto; }
  .pl.inst, .pl.inst * { transition: none !important; }
  .pl.dim { opacity: .5; }
  .pl.gone { opacity: 0; pointer-events: none; }
  .pl.fallen { z-index: 5; }
  .pl-s { position: absolute; left: 0; top: 0; width: 0; height: 0; transform: scale(var(--k, 1)); transition: transform .75s var(--spring); }
  .pl-w { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .pl-in { position: absolute; left: -56px; top: -56px; width: 112px; height: 112px; }
  .bub { width: 100%; height: 100%; border-radius: 50%; border: 6px solid var(--pc); display: grid; place-items: center; font-size: 58px; line-height: 1;
    background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .3), rgba(255, 255, 255, .08) 70%), #171726;
    box-shadow: 0 10px 28px -8px rgba(0, 0, 0, .7), 0 0 34px -4px var(--pc), inset 0 1px 0 rgba(255, 255, 255, .3);
    animation: sway 3.4s ease-in-out infinite; animation-delay: var(--dl, 0s);
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; transition: filter .6s; }
  @keyframes sway { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(2px) rotate(1.5deg); } }
  .chk { position: absolute; left: 22px; top: -66px; width: 44px; height: 44px; border-radius: 50%; background: var(--ok); border: 3px solid #0b0b14; box-shadow: 0 0 18px -2px var(--ok); color: #07120c; font: 900 24px/1 var(--body); display: grid; place-items: center; opacity: 0; transform: scale(.3); transition: opacity .2s, transform .35s var(--pop); }
  .pl.ready .chk { opacity: 1; transform: none; }
  .wmark { position: absolute; left: -74px; top: -70px; font-size: 48px; line-height: 1; opacity: 0; transform: scale(.3); transition: opacity .3s, transform .4s var(--pop); }
  .pl.wolf .wmark { opacity: 1; transform: none; }
  .nm2 { position: absolute; left: 0; top: calc(var(--a, 112px) / 2 + 6px); transform: translateX(-50%); max-width: var(--tw, 140px); transition: top .75s var(--spring);
    font: 700 var(--nfs)/1.2 var(--body); color: #fff; white-space: nowrap; display: flex; align-items: center; gap: 4px; text-shadow: 0 1px 2px rgba(0, 0, 0, .8), 0 2px 14px rgba(0, 0, 0, .7); }
  .nm2 > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .nm2 .x { flex: none; display: none; border: 0; background: var(--bad); color: #1a0509; font: 900 13px/1 var(--body); width: 20px; height: 20px; border-radius: 50%; padding: 0; }
  .pts { position: absolute; left: calc(var(--a, 112px) * .36); top: calc(var(--a, 112px) * -.4); translate: -50% -50%; padding: 2px 11px 3px; border-radius: 999px; border: 2px solid currentColor; background: #0c0c16;
    font: 900 max(calc(var(--a, 112px) * .22), 20px)/1.2 var(--display); white-space: nowrap; opacity: 0; transform: translateY(14px) scale(.3); transition: opacity .25s, transform .5s var(--pop); z-index: 3; font-variant-numeric: tabular-nums; }
  .pts.on { opacity: 1; transform: none; }
  .pts.bk::before { content: "×2"; position: absolute; left: -12px; top: -17px; padding: 0 6px; font-size: .6em; line-height: 1.5; background: var(--g-main); color: #0a0a0f; border-radius: 8px; }
  .pts.pos { color: var(--ok); } .pts.neg { color: var(--bad); } .pts.zero { color: var(--muted); }
  .pl.ready .pl-w, .pl.shiver .pl-w { animation: shiver .45s linear; }
  @keyframes shiver { 0%, 100% { transform: translateX(0); } 15% { transform: translateX(-4px) rotate(-3deg); } 35% { transform: translateX(4px) rotate(3deg); } 55% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .pl.hop .pl-w { animation: hop .62s var(--pop) 2; animation-delay: var(--hd, 0s); }
  @keyframes hop { 40% { transform: translateY(-34px); } 70% { transform: translateY(0) scaleY(.92); } }
  .pl.enter .pl-w { animation: enter .6s var(--pop) both; }
  @keyframes enter { from { transform: scale(.2) translateY(-40px); opacity: 0; } }
  .pl.lost .bub { filter: saturate(.45) brightness(.8); }

  /* вердикт поверх затемнённого поля */
  #dim { position: absolute; z-index: 6; border-radius: 28px; background: radial-gradient(ellipse at center, rgba(4, 4, 10, .84), rgba(4, 4, 10, .6)); opacity: 0; transition: opacity .35s; pointer-events: none; }
  #dim.on { opacity: 1; }
  #vd { position: absolute; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .15em; padding: 0 3%; pointer-events: none; opacity: 0; transform: scale(1.35); transition: opacity .22s, transform .55s var(--pop); }
  #vd.on { opacity: 1; transform: none; }
  .vd-k { font: 700 var(--ks, 40px)/1.1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .82); }

<script>
"use strict";
const T = (k) => wvT(k);
const tpl = (k, v) => wvTpl(k, v);
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const hostKey = () => "crowd-host-" + CODE;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const main = $("main"), upper = $("upper"), game = $("game"), field = $("field"), chipsEl = $("chips");
let Z = 1; // масштаб для ТВ (см. measure)

let conn = null, state = null, isHost = false, dead = false;
let viewKey = "";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = escapeHtml;
const player = (id) => state && state.players.find((p) => p.id === id);
const present = () => state.players.filter((p) => !p.left);
const avHtml = (p) => `<i class="av" style="--pc:${esc(p.color)}">${esc(p.avatar)}</i>`;
const phaseNow = () => state.serverNow - state.phaseStart + (performance.now() - state.__at); // мс от начала фазы
const phaseLeft = () => state.phaseEnd - state.serverNow - (performance.now() - state.__at);
const timers = [];
const later = (ms, fn) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const clearLater = () => { while (timers.length) clearTimeout(timers.pop()); };

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  showBanner(T("creating"));
  try {
    const body = { settings: { lang: wvLang() } };
    if (params.get("speed")) body.speed = Number(params.get("speed"));
    const res = await fetch("/crowd/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
    showBanner(null);
    return true;
  } catch (err) {
    showBanner(String(err.message || err));
    return false;
  }
}
function showBanner(text) {
  const b = $("banner");
  b.classList.toggle("hidden", !text);
  b.textContent = text || "";
}

// ---------- геометрия ----------
// Всё живёт в виртуальном экране: 1600×900 (портрет 800×1280), main в его координатах. L.f — поле (зоны, шкала, толпа).
const M = { portrait: false, nfs: 20, W: 1600, H: 800 };
const L = { f: { x: 50, y: 300, w: 1500, h: 500 } };
const place = (el, r) => { el.style.left = r.x + "px"; el.style.top = r.y + "px"; el.style.width = r.w + "px"; el.style.height = r.h + "px"; };
function measure() {
  const rawPortrait = innerWidth / innerHeight < 1.25;
  const zz = Math.min(innerWidth / (rawPortrait ? 800 : 1600), innerHeight / (rawPortrait ? 1280 : 900));
  // ≥1.15 — ТВ (растягиваем); низкий экран (<700px высоты, например ТВ с браузерным зумом 200%) — сжимаем виртуальный экран
  Z = zz >= 1.15 || (innerHeight < 700 && !rawPortrait) ? Math.round(zz * 100) / 100 : 1;
  document.documentElement.style.setProperty("--z", Z);
  const W = main.clientWidth, H = main.clientHeight;
  const portrait = W / H < 1.25;
  M.W = W; M.H = H; M.portrait = portrait;
  document.body.classList.toggle("ptr", portrait);
  const px = clamp(W * 0.031, 20, 56), gx = clamp(W * 0.022, 14, 36), gy = clamp(H * 0.034, 14, 30), bot = clamp(H * 0.045, 16, 40);
  let fy;
  if (!portrait) {
    const qh = clamp(H * 0.27, 170, 330), sbw = clamp(W * 0.15, 130, 270);
    L.q = { x: px + sbw + gx, y: 0, w: W - 2 * (px + sbw + gx), h: qh };
    L.sbL = { x: px, y: 0, w: sbw, h: qh };
    L.sbR = { x: W - px - sbw, y: 0, w: sbw, h: qh };
    fy = qh + gy;
  } else {
    const qh = clamp(H * 0.2, 190, 330), sbh = clamp(H * 0.085, 80, 116), sw = (W - 2 * px - gx) / 2, y2 = qh + gy * 0.7;
    L.q = { x: px, y: 0, w: W - 2 * px, h: qh };
    L.sbL = { x: px, y: y2, w: sw, h: sbh };
    L.sbR = { x: px + sw + gx, y: y2, w: sw, h: sbh };
    fy = y2 + sbh + gy;
  }
  L.f = { x: px, y: fy, w: W - 2 * px, h: Math.max(220, H - fy - bot) };
  L.railH = clamp(L.f.h * 0.14, 56, 84);
  L.opH = clamp(L.f.h * 0.095, 42, 58);
  L.fgap = clamp(L.f.h * 0.032, 10, 18);
  L.zg = clamp(L.f.w * 0.014, 12, 22);
  L.pg = clamp(L.f.w * 0.014, 12, 22);
  L.penW = clamp(L.f.w * (portrait ? 1 : 0.37), 300, 620);
  L.pent = 52;
  L.zhd = portrait ? 96 : 100;
  const zh0 = L.f.h - L.railH - L.fgap;
  L.zhv = portrait ? clamp(zh0 * 0.3, L.zhd + 130, 300) : 0;
  L.sig = [W, H, Z].join("x");
  M.nfs = portrait ? 19 : 21;
  document.documentElement.style.setProperty("--nfs", M.nfs + "px");
  place($("qpanel"), L.q); place($("sbL"), L.sbL); place($("sbR"), L.sbR); place(field, L.f);
  place(chipsEl, { x: 0, y: 0, w: W, h: H });
  const rs = Math.min(L.sbL.h - 28, L.sbL.w - 28, portrait ? 76 : 170);
  $("sbL").style.setProperty("--rs", rs + "px");
  $("sbR").style.setProperty("--bs", (portrait ? 40 : clamp(L.sbR.h * 0.3, 44, 84)) + "px");
  $("sbR").style.setProperty("--cs", (portrait ? 18 : 24) + "px");
  field.style.setProperty("--rf", clamp(L.railH * 0.82, 40, 68) + "px");
  field.style.setProperty("--nw", clamp(L.railH * 1.35, 70, 110) + "px");
  field.style.setProperty("--of", clamp(L.opH * 0.62, 24, 34) + "px");
  field.style.setProperty("--bz", (portrait ? 54 : 64) + "px");
  field.style.setProperty("--gz", (portrait ? 220 : 340) + "px");
  place($("railrow"), { x: 0, y: 0, w: L.f.w, h: L.railH });
  $("railrow").style.right = "auto";
  $("oprow").style.top = L.railH + 6 + "px"; $("oprow").style.height = L.opH + "px";
  const R = $("rail"); R.style.height = clamp(L.railH * 0.42, 24, 34) + "px";
}

// ---------- фишки ----------
const PL = new Map(); // id → {el, key}
function ensurePlayers() {
  const ps = present();
  const ids = new Set(ps.map((p) => p.id));
  for (const [id, pl] of PL) if (!ids.has(id)) { pl.el.remove(); PL.delete(id); }
  ps.forEach((p, i) => {
    let pl = PL.get(p.id);
    if (!pl) {
      const el = document.createElement("div");
      el.className = "pl enter inst gone";
      el.id = "pl-" + p.id;
      el.innerHTML = `<div class="pl-s"><div class="pl-w"><div class="pl-in"><div class="bub"></div></div></div><span class="chk">✓</span><span class="wmark">🐺</span></div><div class="nm2"><span></span></div><span class="pts"></span>`;
      el.style.setProperty("--dl", ((i * 0.37) % 3).toFixed(2) + "s");
      chipsEl.append(el);
      pl = { el, id: p.id, key: "" };
      PL.set(p.id, pl);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("inst")));
      setTimeout(() => el.classList.remove("enter"), 700);
    }
    pl.el.style.setProperty("--pc", p.color);
    const bub = pl.el.querySelector(".bub");

// подпись игрока: не режем до 2–3 букв — сначала уменьшаем кегль (до 13px), усечение только если и так не влезает
function fitName(e, tw) {

function setChip(id, t) {
  const pl = PL.get(id); if (!pl) return;
  const key = [Math.round(t.x), Math.round(t.y), t.k.toFixed(2), Math.round(t.tw), t.gone ? 1 : 0].join();

// сетка фишек в прямоугольнике: больше аватар — лучше; при равенстве — меньше колонок (компактная стопка)
function gridFit(n, w, h, maxA) {
  n = Math.max(1, n);
  const nameH = M.nfs * 1.3 + 16;
  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const a = Math.min(w / cols / 1.08, h / rows - nameH, maxA);
    const score = a - Math.max(0, 118 - w / cols) * 0.6;   // имена должны читаться: узкие колонки штрафуем
    if (!best || score > best.score + 0.75) best = { cols, rows, a, score };
  }
  const a = clamp(best.a, 36, maxA);
  return { n, cols: best.cols, rows: best.rows, a, k: a / 112, nameH,
    pitchX: Math.min(w / best.cols, Math.max(a * 1.2, 140)), pitchY: Math.min(h / best.rows, a + nameH + 6) };
}
function gridSlot(g, i, R) {
  const row = Math.floor(i / g.cols), col = i % g.cols;
  const inRow = row === g.rows - 1 ? g.n - row * g.cols : g.cols;
  const cx = R.x + R.w / 2 + (col - (inRow - 1) / 2) * g.pitchX;
  const top = R.y + (R.h - g.rows * g.pitchY) / 2;
  return { x: cx, y: top + row * g.pitchY + g.pitchY / 2 - g.nameH / 2 };
}

// ---------- поле: зоны, толпа, шкала ----------
// mode "pen": голоса скрыты, все стоят в центре; "reveal": placed уходят в свой лагерь, остальные ждут в загоне
const FS = { mode: "pen", placed: new Set(), sides: { a: [], b: [] }, share: 0.5, na: 0, nb: 0, hasOp: false, tie: false, sig: "" };
function applyField(force) {
  if (!state) return;
  const F = L.f, P = M.portrait;
  const ids = [...PL.keys()];
  const total = Math.max(1, ids.length);
  const pen = FS.mode === "pen";
  const left = pen ? ids.length : ids.filter((id) => !FS.placed.has(id)).length;
  const sig = [pen, left, FS.placed.size, FS.share.toFixed(3), FS.hasOp, FS.tie, FS.na, FS.nb, L.sig, ids.length, FS.sides.a.length, FS.sides.b.length].join();
  if (!force && sig === FS.sig) return;
  FS.sig = sig;
  const opH = FS.hasOp ? L.opH : 0;
  const zy = L.railH + (opH ? opH + 8 : 0) + L.fgap, zh = Math.max(120, F.h - zy);
  const sh = pen ? 0.5 : FS.share;
  const tg = FS.tie ? 2.6 : 1;
  let A, B, Pn;
  if (!P) {
    const penW = left > 0 ? clamp(L.penW * left / total, Math.min(190, L.penW), L.penW) : 0;
    const gapC = penW > 0 ? penW + 2 * L.pg : L.zg * tg;
    const span = F.w - gapC;
    const wA = clamp(span * sh, 170, span - 170);
    A = { x: 0, y: zy, w: wA, h: zh };
    B = { x: wA + gapC, y: zy, w: span - wA, h: zh };
    Pn = { x: wA + L.pg, y: zy, w: penW, h: zh };
  } else {
    const pr = pen ? 1 : left > 0 ? Math.max(left / total, 0.3) : 0;
    const zHt = L.zhv + (zh - L.zhv) * (1 - pr);
    const gapC = L.zg * tg, span = F.w - gapC;
    const wA = clamp(span * sh, 150, span - 150);
    A = { x: 0, y: zy, w: wA, h: zHt };
    B = { x: wA + gapC, y: zy, w: span - wA, h: zHt };
    Pn = { x: 0, y: zy + zHt + L.pg, w: F.w, h: Math.max(0, zh - zHt - L.pg) };
  }
  place($("zA"), A); place($("zB"), B);
  const penOn = left > 0 && Pn.w > 60 && Pn.h > 60;
  place($("pen"), Pn);
  $("pen").style.opacity = penOn ? 1 : 0;
  $("penT").style.opacity = pen ? 1 : 0;
  // трещина по центру зазора
  const crack = $("crack");
  if (FS.tie) {
    const cx = A.x + A.w + (B.x - A.x - A.w) / 2, hh = zh;
    place(crack, { x: cx - 30, y: zy, w: 60, h: hh });
    let d = "M30 -10"; const steps = 9;
    for (let i = 1; i <= steps; i++) d += ` L${30 + (i % 2 ? -1 : 1) * (7 + (i * 5) % 9)} ${(hh + 20) * i / steps - 10}`;
    $("crackP").setAttribute("d", d);
  }
  crack.classList.toggle("on", FS.tie && !!FS.decided);
  // чипы лагерей
  const used = new Set();
  const pad = 14;
  for (const s of ["a", "b"]) {
    const list = FS.sides[s]; if (!list.length) continue;
    const Zr = s === "a" ? A : B;
    const R = { x: Zr.x + pad, y: Zr.y + L.zhd + 8, w: Zr.w - 2 * pad, h: Zr.h - L.zhd - 8 - pad };
    const g = gridFit(list.length, R.w, R.h, 112);
    list.forEach((id, i) => {
      if (!FS.placed.has(id)) return;
      used.add(id);
      const p = gridSlot(g, i, R);
      setChip(id, { x: p.x + F.x, y: p.y + F.y, k: g.k, tw: g.pitchX - 6 });
    });
  }
  const penIds = ids.filter((id) => !used.has(id));
  if (penIds.length) {
    const tt = pen ? L.pent : 10;
    const R = { x: Pn.x + 12, y: Pn.y + tt, w: Math.max(40, Pn.w - 24), h: Math.max(40, Pn.h - tt - 12) };
    const g = gridFit(penIds.length, R.w, R.h, 112);
    penIds.forEach((id, i) => {
      const p = gridSlot(g, i, R);
      setChip(id, { x: p.x + F.x, y: p.y + F.y, k: g.k, tw: g.pitchX - 6 });
    });
  }
  // счётчики
  setNum($("nA"), FS.na, true); setNum($("nB"), FS.nb, true);
  $("railrow").style.opacity = pen ? 0.55 : 1;
  $("zA").classList.toggle("pre", pen); $("zB").classList.toggle("pre", pen);
  $("oprow").classList.toggle("on", FS.hasOp);
}
function setNum(el, n, show) {
  const t = show ? String(n) : "·";
  if (el.textContent !== t) { el.textContent = t; if (show && !RM) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } }
}

const SP = { x: 0.5, v: 0, t: 0.5, idle: true };
function springFrame(dt, now) {
  const rail = $("rail"), puck = $("puck");
  const W = rail.clientWidth; if (!W) return;
  let tgt = SP.t;
  if (SP.idle && !RM) tgt += 0.012 * Math.sin(now / 650);
  const k = 34, c = 5.2;
  let s = Math.min(dt, 50) / 1000, steps = Math.ceil(s / 0.008) || 1, h = s / steps;
  if (RM) { SP.x = tgt; SP.v = 0; }
  else for (let i = 0; i < steps; i++) { SP.v += (k * (tgt - SP.x) - c * SP.v) * h; SP.x += SP.v * h; }
  puck.style.transform = `translateX(${(clamp(SP.x, 0.01, 0.99) * W).toFixed(1)}px)`;
  const fl = puck.querySelector(".fl");
  const dir = SP.t < 0.49 ? -1 : 1;

}

// ---------- таймер-кольцо ----------
let lastTickSec = null;
const RC = 389.6;
function setRing(frac, text, hot) {
  $("ringPg").style.strokeDashoffset = (RC * (1 - clamp(frac, 0, 1))).toFixed(1);
  const rg = $("ring");
  rg.classList.toggle("hot", !!hot);
  if ($("ringNum").dataset.t !== text) { $("ringNum").dataset.t = text; $("ringNum").innerHTML = text; }
}
function timerFrame() {
  const ph = state.phase;
  const live = !dead && (ph === "vote" || ph === "opinion" || ph === "pause") && state.phaseEnd;
  if (!live) {
    // прогресс партии вместо таймера
    const r = state.round;
    if (r && (ph === "reveal" || ph === "scores")) {
      const norm = r.kind === "normal" || r.kind === "final";
      if (norm) setRing(r.num / state.total, `${r.num}<small>/${state.total}</small>`, false);
      else setRing(1, r.kind === "decider" ? "★" : "×2", false);
    }
    return;
  }
  const left = phaseLeft();
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const hot = left < 5000 && ph !== "pause";
  const sec = Math.max(0, Math.ceil(left / 1000));
  setRing(left / total, String(sec), hot);
  if (hot && left > 0 && sec !== lastTickSec) { lastTickSec = sec; wvSfx.tick(sec <= 2); }
  if (!hot) lastTickSec = null;
  const lbl = tpl("tm_left", { n: sec });
  if (game.getAttribute("aria-label") !== lbl && sec % 1 === 0) game.setAttribute("aria-label", lbl);
}

// ---------- раскрытие ----------
const RV = { id: "", plan: null, fired: new Set(), instant: false, vdOn: false, sec: "" };

function buildPlan() {
  const r = state.round, res = r.result;
  const order = (res.order || []).filter((id) => PL.has(id));
  const N = order.length;
  const sides = { a: [], b: [] };
  for (const id of order) sides[res.votes[id]].push(id);
  const plan = { N, order, sides, vt: (i) => 500 + 600 * i };
  plan.tEnd = (N ? plan.vt(N - 1) : 500) + 750;
  plan.hasOp = !!res.opinions;
  plan.opAt = plan.tEnd + 1900;
  const oa = res.opinions ? res.opinions.a : 0, ob = res.opinions ? res.opinions.b : 0;
  plan.oa = oa; plan.ob = ob;
  plan.opSeq = [];
  for (let i = 0, a = oa, b = ob, s = "a"; a + b > 0; i++) { if ((s === "a" && a > 0) || b === 0) { plan.opSeq.push("a"); a--; } else { plan.opSeq.push("b"); b--; } s = s === "a" ? "b" : "a"; }
  plan.opDone = plan.opAt + 220 * plan.opSeq.length + 400;
  return plan;
}

function verdictOf(kind) {

function kindOf(res) { return res.void ? "void" : res.tie ? "tie" : res.unanimous ? "one" : "maj"; }

// победители подпрыгивают, у них очки; зоны оседают/вспыхивают
function revealPoints(instant) {
  const plan = RV.plan, res = state.round.result, order = plan.order;
  const winners = res.void ? [] : res.unanimous ? order : res.tie ? [] : plan.sides[res.side];
  if (!instant) winners.forEach((id, i) => { const pl = PL.get(id); if (!pl) return; pl.el.style.setProperty("--hd", (i * 0.07) + "s"); pl.el.classList.add("hop"); });
  if (!res.unanimous && !res.tie && !res.void && res.side) {

    plan.sides[loser].forEach((id) => { const pl = PL.get(id); if (pl) pl.el.classList.add("lost"); });
  }
  if (res.wolf) { const wp = PL.get(res.wolf); if (wp) wp.el.classList.add("wolf"); }
  let n = 0;
  for (const id of order) {
    const pl = PL.get(id); if (!pl || !(id in res.pts)) continue;

    b.className = "pts " + (v > 0 ? "pos" : v < 0 ? "neg" : "zero") + (res.banked[id] ? " bk" : "");
    if (instant) b.classList.add("on"); else later(120 + n++ * 70, () => b.classList.add("on"));

}

function decideZones(res, instant) {
  const zA = $("zA"), zB = $("zB");
  if (res.tie) { document.body.dataset.win = "tie"; SP.t = 0.5; $("rail").classList.add("shake"); return; }
  const w = res.side;
  document.body.dataset.win = w;
  const win = $(w === "a" ? "zA" : "zB"), lose = $(w === "a" ? "zB" : "zA");
  if (res.unanimous) { lose.classList.add("dead"); win.classList.add("win"); }
  else { win.classList.add("win"); lose.classList.add("lose"); }
  $("rail").classList.add(w === "a" ? "win-a" : "win-b");

function updateReveal(t, instant) {
  const plan = RV.plan; if (!plan) return;
  const r = state.round, res = r.result;
  const first = (k) => { if (RV.fired.has(k)) return false; RV.fired.add(k); return true; };
  const live = (at) => !instant && t - at < 900;
  let na = 0, nb = 0, shown = 0;
  const placed = new Set();
  for (let i = 0; i < plan.order.length; i++) {
    if (t < plan.vt(i) && !instant) break;
    const id = plan.order[i], s = res.votes[id];
    if (s === "a") na++; else nb++;
    shown++;
    placed.add(id);
    if (first("v" + i) && live(plan.vt(i))) {
      const d = Math.abs(res.cast ? (na - nb) / res.cast : 0);
      if (i === plan.order.length - 1 && res.side) { wvSfx.step(); wvSfx.thud(); }
      else { wvSfx.step(); if (i % 2 === 0) wvSfx.creak(d); }
    }
  }
  FS.mode = "reveal"; FS.placed = placed; FS.sides = plan.sides; FS.na = na; FS.nb = nb;
  FS.share = res.void ? 0.5 : clamp((na + 1) / (na + nb + 2), 0.3, 0.7);
  FS.hasOp = plan.hasOp;
  // маркер: к победителю на пружине, с натяжением по ходу
  SP.idle = shown === 0;
  const d = res.cast ? (na - nb) / res.cast : 0;
  if (!res.void) SP.t = 0.5 - d * 0.44;
  applyField();
  // правый блок
  if (!RV.decided) setSbR(res.void ? `<span class="ico">⏳</span>` : `<b class="big">${shown}<small>/${plan.N}</small></b><span class="cap">${esc(T("votes_lbl"))}</span>`);
  const rail = $("rail");
  const taut = shown > 0 && !res.void && t < plan.tEnd + 300 && !instant;
  rail.classList.toggle("shake", taut && !res.tie);
  // итог
  const end = instant || t >= plan.tEnd;
  if (res.void) {
    if (instant || t >= 300) {
      if (first("void")) {
        RV.decided = true;
        if (!instant) { wvSfx.buzz(); showVd(Object.assign(verdictOf("void"), {})); later(1700, hideVd); }
        setSbR(detailHtml("void"));
      }
    }
    return;
  }
  if (end) {
    const ended = first("end");
    if (ended) {
      RV.decided = true;
      FS.decided = true; FS.tie = !!res.tie; FS.sig = "";
      const kind = kindOf(res);
      decideZones(res, instant);
      applyField();
      if (!instant) {
        if (res.tie) wvSfx.strain(); else if (res.unanimous) wvSfx.chord();
        showVd(verdictOf(kind));
        later(1500, () => { hideVd(); setSbR(detailHtml(kind)); revealPoints(false); });
      } else {
        setSbR(detailHtml(kind));
        revealPoints(true);
      }
    }
  }
  // мнения
  if (plan.hasOp) {
    if (instant || t >= plan.opAt) {
      const seq = plan.opSeq;
      let oa = 0, ob = 0;
      for (let i = 0; i < seq.length; i++) {
        if (!instant && t < plan.opAt + 220 * i) break;
        if (first("o" + i) && !instant) wvSfx.step();
        if (seq[i] === "a") oa++; else ob++;
      }
      const tot = Math.max(1, plan.oa + plan.ob);
      $("opA").textContent = oa || ""; $("opB").textContent = ob || "";
      $("opbA").style.width = (oa / tot * 100) + "%"; $("opbB").style.width = (ob / tot * 100) + "%";
      if (res.illusion && (instant || t >= plan.opDone)) {
        if (first("ill")) {

            wvSfx.pop();
            const sd = (s) => sideLabel(r.q, s);
            showVd({ w: T("ill_t"), vt: "#ffd3f0", vg: "rgba(236,72,153,.75)", s: esc(tpl("ill_d", { v: sd(res.illusion.vote), o: sd(res.illusion.opinion) })).replace(/(«[^»]*»|“[^”]*”)/g, "<b>$1</b>") });
          }
        }
      }
    }
  }
}

function countUp(nodes, dur, delay) {

  requestAnimationFrame(step);
}

    <div class="rest r">${restL.slice(rhalf).map(rowH).join("")}</div>
    <div class="awrow">${cards.join("")}</div>
    <div class="fbtn">${isHost ? `<button class="start" id="again" type="button">${esc(T("btn_again"))}</button><button class="ghostbtn" id="tolobby" type="button">${esc(T("btn_lobby"))}</button>` : ""}<a class="ghostbtn" href="index.html">${esc(T("btn_home"))}</a></div></div>`;
  showUpper(false);
  if (isHost) { $("again").onclick = () => conn.send({ type: "start" }); $("tolobby").onclick = () => conn.send({ type: "lobby" }); }
  // аватары подиума крупнее: до 150px, пока влезают по высоте
  const pod = $("podium");
  const ava = clamp(Math.min(150, (pod.clientHeight - 30) * 0.4), 64, 150);
  pod.style.setProperty("--ava", ava + "px");
  pod.style.setProperty("--bh", clamp(pod.clientHeight - ava - 74, 50, M.portrait ? 520 : 330) + "px");
  if (state.finishedReason === "done" && !RM) later(900, () => wvSfx.fanfare());
}

// ---------- отрисовка ----------
let lastPhase = null, prevReady = new Set(), prevRoundId = "";
function showGame() { game.classList.remove("hidden"); upper.classList.add("hidden"); chipsEl.classList.remove("off"); }
function showUpper(chips) { game.classList.add("hidden"); upper.classList.remove("hidden"); chipsEl.classList.toggle("off", !chips); }
function render() {
  if (!state || dead) return;
  const ph = state.phase;
  document.body.dataset.phase = ph;
  document.body.classList.toggle("fin", ph === "finished");
  document.body.classList.toggle("lobbyp", ph === "lobby");
  topBar();
  ensurePlayers();
  const r = state.round;
  const dimOf = (p) => !p.online || (ph === "vote" && r && r.voters && !r.voters.includes(p.id)) || ((ph === "reveal" || ph === "scores") && r && r.result && !r.result.void && !(p.id in r.result.votes));
  for (const pl of PL.values()) pl.el.classList.toggle("dim", dimOf(pl.p));
  if (ph !== lastPhase) {
    if (ph === "lobby" || ph === "vote" || ph === "intro") { clearLater(); hideVd(); }
    if (ph === "vote") { RV.plan = null; RV.id = ""; RV.decided = false; SP.t = 0.5; $("rail").classList.remove("shake"); for (const pl of PL.values()) pl.key = ""; }
    if (ph !== "reveal") hideVd();
    lastPhase = ph;
  }
  if (ph !== "reveal" && ph !== "scores") for (const pl of PL.values()) { pl.el.classList.remove("hop", "wolf", "lost"); const pt = pl.el.querySelector(".pts"); if (pt.className !== "pts") pt.className = "pts"; }
  // «готов»
  if (ph === "vote" && r) {
    const rdy = new Set(r.ready || []);
    const same = prevRoundId === roundId();
    for (const [id, pl] of PL) {
      const on = rdy.has(id);
      pl.el.classList.toggle("ready", on);
      if (on && same && !prevReady.has(id)) { pl.el.classList.remove("shiver"); void pl.el.offsetWidth; pl.el.classList.add("shiver"); wvSfx.lock(); }
    }
    prevReady = rdy;
  } else { prevReady = new Set(); if (ph !== "vote") for (const pl of PL.values()) pl.el.classList.remove("ready"); }
  prevRoundId = r ? roundId() : "";
  switch (ph) {
    case "lobby": showUpper(false); return drawLobby();
    case "intro": showUpper(false); return drawIntro();
    case "vote": case "opinion": showGame(); return drawVote();
    case "reveal": showGame(); return drawReveal();
    case "scores": return drawScores();
    case "pause": showUpper(false); return drawPause();
    case "finished": showUpper(false); return drawFinal();
  }
}
$("endbtn").onclick = () => { if (confirm(T("btn_end") + "?")) conn.send({ type: "end" }); };

let lastFrame = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(100, t - lastFrame); lastFrame = t;
  if (!state || dead) return;
  timerFrame();
  springFrame(dt, t);
  if (state.phase === "reveal" && RV.plan && !RV.instant) updateReveal(phaseNow(), false);
}

let rsz = null;
window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { measure(); for (const pl of PL.values()) pl.key = ""; viewKey = ""; questionKey = ""; FS.sig = ""; if (state) render(); }, 120); });
window.addEventListener("langchange", () => {
  viewKey = ""; questionKey = "";
  if (isHost && state && (state.phase === "lobby" || state.phase === "finished") && state.settings.lang !== wvLang()) conn.send({ type: "settings", settings: { lang: wvLang() } });
  render();
});

// ---------- связь ----------
function setState(s) { s.__at = performance.now(); state = s; }
function onMessage(m) {
  switch (m.type) {
    case "hello":
      setState(m.state);
      if (!isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      setState(m.state);
      render();
      break;
    case "host_ok":
      isHost = true;
      document.body.classList.add("host");
      viewKey = "";
      if (state && state.phase === "lobby" && state.settings.lang !== wvLang()) conn.send({ type: "settings", settings: { lang: wvLang() } });
      render();
      break;
    case "host_lost":
      isHost = false;
      document.body.classList.remove("host");
      viewKey = "";
      render();
      break;
    case "error":
      if (m.error === "room_expired") gone();
      break;
  }
}
function gone() {
  dead = true;
  upper.innerHTML = "";
  showBanner(T("expired"));
}
async function boot() {
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  measure();
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  conn = wvConnect({
    code: CODE,
    onMessage,
    onGone: gone,
    onOpen: () => { isHost = false; },
    onState: (st) => { banner.textContent = T("err_connect"); banner.classList.toggle("on", st === "lost"); },
  });
  requestAnimationFrame(frame);
  window.wvBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); if (state && !dead) { for (const pl of PL.values()) pl.key = ""; viewKey = ""; questionKey = ""; FS.sig = ""; render(); } });
boot();
</script>
