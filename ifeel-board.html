<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08070b">
<meta name="robots" content="noindex">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1fac2.svg" type="image/svg+xml">
<title>Айфилю — общий экран</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="ifeel-theme.css">
<style>
  /* Доска «Айфилю» — экран тепловизора. Читается с дивана: всё в единицах --u (1/100 высоты при 16:9) с потолками.
     В ходе слева — кадр видоискателя с набором мишени: пока порядок тайный, карточки серые «??,?°»;
     раскрытие прогревает кадр снизу вверх — от холодного 5-го места к раскалённому 1-му, у каждой полосы своя «температура».
     Справа — вопрос и ответы угадывающего; после раскрытия его ответы перекрашиваются в настоящую температуру пунктов.
     Синтаксис скриптов — не выше ES2017 (проекторы на Chromium 80–83): без ?. и ??. */
  :root {
    --lang-switch-bg: var(--bg);
    --lang-switch-border: var(--line);
    --lang-switch-fg: var(--muted);
    --lang-switch-active-bg: var(--hud);
    --lang-switch-active-fg: var(--bg);
    --lang-switch-active-border: var(--hud);
    --lang-switch-font: var(--mono);
    --u: min(1vh, 0.56vw); /* единица доски: 1/100 высоты при 16:9 */
    --vf-t: calc(.5 * var(--u)); --vf-l: calc(3.4 * var(--u));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 600 calc(2.4 * var(--u)) / 1.2 var(--font); overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .hidden { display: none !important; }
  #root { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: center; gap: calc(1.4 * var(--u)); padding: calc(1.6 * var(--u)) calc(var(--lsw, 160px)) calc(1 * var(--u)) calc(3 * var(--u)); }
  .brand { font: 900 calc(3.6 * var(--u)) / 1 var(--font); letter-spacing: -.01em; display: flex; align-items: center; gap: calc(1.1 * var(--u)); text-transform: uppercase; }
  .brand .thermo { font-size: calc(3 * var(--u)); }
  .top .mode { font-size: calc(1.8 * var(--u)); padding: calc(.5 * var(--u)) calc(1.2 * var(--u)); }
  .top .chip { font-size: calc(2 * var(--u)); padding: calc(.4 * var(--u)) calc(1.2 * var(--u)); }
  .grow { flex: 1; }
  .hostctl { display: flex; align-items: center; gap: 8px; font: 500 14px/1.2 var(--mono); }
  .hostctl button, .endbtn { border: 2px solid var(--line); background: transparent; border-radius: var(--r-sm); padding: 6px 12px; font: 700 14px/1 var(--mono); }
  .hostctl input { font: 500 14px/1 var(--mono); padding: 6px 10px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--bg2); color: var(--text); width: 220px; }
  .hostctl .note { color: var(--muted); }
  .sound-toggle-btn { width: 40px; height: 40px; border-radius: var(--r-sm); border: 2px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; }
  .lang-switch { top: calc(1.6 * var(--u)) !important; right: 16px !important; border-radius: var(--r-sm) !important; }
  .banner, .conn { position: fixed; left: 50%; top: calc(8 * var(--u)); transform: translateX(-50%); z-index: 30; background: var(--hud); color: var(--bg); font: 700 calc(2 * var(--u)) / 1.2 var(--mono); padding: 10px 18px; border-radius: var(--r-sm); }
  .conn { visibility: hidden; } .conn.on { visibility: visible; }
  main { flex: 1 1 auto; min-height: 0; position: relative; padding: calc(.6 * var(--u)) calc(3 * var(--u)) calc(3 * var(--u)); display: flex; flex-direction: column; gap: calc(1.8 * var(--u)); }
  /* таймер: тонкая полоса прибора и секунды моноширинным */
  .tbar { flex: none; height: calc(.6 * var(--u)); background: var(--bg3); overflow: hidden; }
  .tbar i { display: block; height: 100%; background: var(--hud); transform-origin: left; }
  .tsec { font: 700 calc(4 * var(--u)) / 1 var(--mono); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
  .tsec.hot { color: var(--h3); }
  .row { display: flex; align-items: center; gap: calc(2 * var(--u)); }
  .eyebrow { font: 700 calc(1.9 * var(--u)) / 1.1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font: 900 calc(7.6 * var(--u)) / .98 var(--font); letter-spacing: -.01em; text-wrap: balance; text-transform: uppercase; }
  h2 { margin: 0; font: 800 calc(4.4 * var(--u)) / 1.05 var(--font); text-wrap: balance; }
  .lede { margin: 0; color: var(--muted); font-size: calc(2.8 * var(--u)); font-weight: 600; }
  .av { width: calc(5.4 * var(--u)); height: calc(5.4 * var(--u)); flex: none; border-radius: 50%; background: var(--bg3); border: calc(.45 * var(--u)) solid var(--pc, var(--line)); display: grid; place-items: center; font-size: calc(2.8 * var(--u)); font-style: normal; line-height: 1; }
  .av.big { width: calc(10 * var(--u)); height: calc(10 * var(--u)); font-size: calc(5.4 * var(--u)); }

  /* лобби */
  .lobby { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: calc(4 * var(--u)); min-height: 0; }
  .lob-l { display: flex; flex-direction: column; gap: calc(2.2 * var(--u)); min-height: 0; }
  .join { display: flex; gap: calc(2.8 * var(--u)); align-items: center; padding: calc(2.4 * var(--u)); }
  .qr { flex: none; background: #fff; padding: calc(1 * var(--u)); width: calc(22 * var(--u)); height: calc(22 * var(--u)); }
  .qr img, .qr canvas { width: 100% !important; height: 100% !important; }
  .url { font: 500 calc(2.1 * var(--u)) / 1.2 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .bigcode { font: 700 calc(7.4 * var(--u)) / 1 var(--mono); letter-spacing: .04em; white-space: nowrap; color: var(--hud); }
  .join > div:last-child { min-width: 0; overflow: hidden; }
  /* правила: номер — полоса тепловизора своего места */
  .rules { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(1 * var(--u)); counter-reset: r; }
  .rules li { counter-increment: r; display: grid; grid-template-columns: calc(4.6 * var(--u)) minmax(0, 1fr); gap: calc(1.4 * var(--u)); align-items: center; font-size: calc(2.6 * var(--u)); color: var(--text); }
  .rules li::before { content: counter(r); display: grid; place-items: center; height: calc(4.6 * var(--u)); font: 700 calc(2.6 * var(--u)) / 1 var(--mono); background: var(--h1); color: var(--h1i); }
  .rules li:nth-child(2)::before { background: var(--h3); color: var(--h3i); }
  .rules li:nth-child(3)::before { background: var(--h5); color: var(--h5i); }
  .opts { display: flex; flex-wrap: wrap; gap: calc(1 * var(--u)); align-items: center; }
  .opts .eyebrow { min-width: calc(14 * var(--u)); }
  .opt { border: 2px solid var(--line); background: transparent; border-radius: var(--r-sm); padding: calc(.9 * var(--u)) calc(2 * var(--u)); font: 700 calc(2.1 * var(--u)) / 1 var(--mono); text-transform: uppercase; letter-spacing: .04em; }
  .opt.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .opt.on.edgy { background: var(--edgy); border-color: var(--edgy); color: #fff; }
  .opt:disabled { cursor: default; }
  .start { border: 0; border-radius: var(--r-sm); background: var(--h1); color: var(--h1i); font: 900 calc(3.6 * var(--u)) / 1 var(--font); text-transform: uppercase; letter-spacing: .02em; padding: calc(2 * var(--u)) calc(5 * var(--u)); box-shadow: 0 calc(.6 * var(--u)) 0 var(--h3); }
  .start:active:not(:disabled) { transform: translateY(calc(.4 * var(--u))); box-shadow: 0 calc(.2 * var(--u)) 0 var(--h3); }
  .start:disabled { opacity: .35; cursor: default; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(26 * var(--u)), 1fr)); gap: calc(1.2 * var(--u)); align-content: start; overflow: hidden; }
  .pcell { position: relative; display: flex; align-items: center; gap: calc(1.2 * var(--u)); background: var(--bg2); border-radius: var(--r-sm); padding: calc(1.2 * var(--u)) calc(1.6 * var(--u)); font: 800 calc(3 * var(--u)) / 1.05 var(--font); min-width: 0; }
  .pcell span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcell.off { opacity: .4; }
  /* готов = «откалиброван»: белая полоса снизу и галочка */
  .pcell.ok { box-shadow: inset 0 calc(-.6 * var(--u)) 0 var(--h1); }
  .pcell.ok::after { content: "✓"; margin-left: auto; color: var(--h1); font: 700 calc(3 * var(--u)) / 1 var(--mono); }
  .pcell .kick { position: absolute; right: 6px; top: 6px; border: 0; background: var(--bg3); border-radius: var(--r-sm); padding: 2px 8px; font: 700 13px/1.2 var(--mono); display: none; }
  body.host .lobbyp .pcell .kick { display: block; }
  .pcell .kick[data-armed="1"] { background: var(--bad); color: #fff; }
  .pcell .sc { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--accent); }
  .pcell .tg { position: absolute; left: calc(1.6 * var(--u)); bottom: calc(-1.2 * var(--u)); background: var(--bad); color: #fff; border-radius: var(--r-sm); padding: 2px 8px; font-size: calc(1.4 * var(--u)); white-space: nowrap; }

  /* ход: слева кадр видоискателя с набором, справа вопрос */
  .turn { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: calc(4 * var(--u)); min-height: 0; }
  .setp { position: relative; display: flex; flex-direction: column; gap: calc(1 * var(--u)); padding: calc(2.4 * var(--u)) calc(2.8 * var(--u)); min-height: 0; overflow: hidden; }
  .sethead { display: flex; align-items: baseline; justify-content: space-between; gap: calc(2 * var(--u)); }
  .settitle { font: 800 calc(3.6 * var(--u)) / 1.05 var(--font); text-wrap: balance; min-width: 0; }
  .sethead .eyebrow { flex: none; color: var(--hud); }
  .sl { font: 700 calc(2.1 * var(--u)) / 1.15 var(--mono); color: var(--h2); text-transform: uppercase; letter-spacing: .03em; }
  .sl.b { color: var(--cold); }
  .cards { flex: 1; display: grid; grid-template-columns: calc(1.4 * var(--u)) minmax(0, 1fr); gap: calc(1.6 * var(--u)); min-height: 0; }
  .cards .bar { background: var(--scale); }
  .clist { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: calc(1 * var(--u)); min-height: 0; }
  .clist .icard { padding: calc(1.2 * var(--u)) calc(2 * var(--u)); font-size: calc(3.4 * var(--u)); min-height: calc(8 * var(--u)); flex: 1 1 0; max-height: calc(11 * var(--u)); transition: opacity .3s, background-color .25s, color .25s; }
  .clist .icard > span:not([class]) { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .clist .icard .deg { font-size: calc(2.6 * var(--u)); }
  .clist .icard.dim { opacity: .35; }
  /* вопрос про пару/тройку: эти карточки в прицеле — белые уголки */
  .clist .icard.focus { --vf-c: var(--hud); --vf-t: calc(.45 * var(--u)); --vf-l: calc(2.2 * var(--u)); background-color: var(--bg3); }
  .qp { display: flex; flex-direction: column; gap: calc(1.8 * var(--u)); min-height: 0; }
  .who { display: flex; align-items: center; gap: calc(1.4 * var(--u)); font: 800 calc(3.2 * var(--u)) / 1.1 var(--font); flex-wrap: wrap; }
  .who .arr { color: var(--hud); font: 700 calc(3 * var(--u)) / 1 var(--mono); }
  .qbig { font: 900 calc(6 * var(--u)) / 1 var(--font); text-transform: uppercase; letter-spacing: -.005em; text-wrap: balance; }
  .qrows { display: grid; gap: calc(1 * var(--u)); }
  .qrow { display: grid; grid-template-columns: calc(4.6 * var(--u)) minmax(0, 1fr) auto; gap: calc(1.6 * var(--u)); align-items: center; border-top: 2px solid var(--line); padding: calc(1.1 * var(--u)) 0 calc(.4 * var(--u)); min-height: calc(7.6 * var(--u)); }
  .qrow .qn { display: grid; place-items: center; height: calc(4.6 * var(--u)); font: 700 calc(2.6 * var(--u)) / 1 var(--mono); color: var(--muted); border: 2px solid var(--line); border-radius: var(--r-sm); }
  .qrow.cur .qn { background: var(--hud); color: var(--bg); border-color: var(--hud); }
  .qrow .qa { font: 800 calc(3.2 * var(--u)) / 1.12 var(--font); min-width: 0; }
  .qrow .qa .q { color: var(--muted); font: 700 calc(1.7 * var(--u)) / 1.2 var(--mono); text-transform: uppercase; letter-spacing: .06em; display: block; }
  .qrow .qa .ans { display: inline-flex; flex-wrap: wrap; align-items: center; gap: calc(.6 * var(--u)); margin-top: calc(.5 * var(--u)); }
  .qrow .qa .ans > span { display: inline-flex; align-items: center; gap: calc(.6 * var(--u)); background: var(--cold-card); color: var(--text); border-radius: var(--r-sm); padding: calc(.3 * var(--u)) calc(1 * var(--u)); }
  .qrow .qa .ans > span b { font: 700 calc(2 * var(--u)) / 1 var(--mono); }
  .qrow .qa em { font: 500 calc(2 * var(--u)) / 1.2 var(--mono); }
  .qrow .pts { font: 700 calc(3.6 * var(--u)) / 1 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); opacity: 0; transition: opacity .3s; }
  .qrow .pts.on { opacity: 1; }
  .qrow .pts.ok { color: var(--h1); }
  .qrow .hl { display: block; font: 500 calc(2.2 * var(--u)) / 1.2 var(--mono); color: var(--muted); margin-top: calc(.5 * var(--u)); opacity: 0; transition: opacity .3s; }
  .qrow .hl.on { opacity: 1; }
  .qrow .hl b { color: var(--text); }
  .qbig .qc { text-transform: none; }
  .qrow .hl.ok b { color: var(--h1); }
  /* лобби: режим и язык карточек крупно — «калибровка прибора» перед стартом */
  .calib { display: flex; align-items: center; flex-wrap: wrap; gap: calc(1.4 * var(--u)) calc(2.4 * var(--u)); padding: calc(1.8 * var(--u)) calc(2.4 * var(--u)); background: var(--bg2); }
  .calib .eyebrow { flex-basis: 100%; }
  .calib .mode { font-size: calc(4.4 * var(--u)); padding: calc(.8 * var(--u)) calc(2 * var(--u)); border-width: calc(.4 * var(--u)); color: var(--text); }
  .calib .mode.edgy { color: #fff; }
  .calib .cl { font: 800 calc(4 * var(--u)) / 1 var(--font); text-transform: uppercase; }
  .rndlbl { color: var(--hud); }
  /* итоги: победители названы крупно, ничья — «Победу делят» */
  .winplate { display: flex; align-items: center; flex-wrap: wrap; gap: calc(1.2 * var(--u)); padding: calc(1.4 * var(--u)) calc(2 * var(--u)); background: var(--h1); color: var(--h1i); font: 900 calc(4.2 * var(--u)) / 1.05 var(--font); text-transform: uppercase; }
  .winplate .av { width: calc(4.6 * var(--u)); height: calc(4.6 * var(--u)); font-size: calc(2.4 * var(--u)); }
  .total { display: flex; align-items: baseline; gap: calc(1.6 * var(--u)); font: 700 calc(9 * var(--u)) / .9 var(--mono); color: var(--h1); letter-spacing: -.04em; opacity: 0; transition: opacity .25s, transform .25s; transform: scale(.94); transform-origin: left center; }
  .total.on { opacity: 1; transform: none; }
  .total .lede { letter-spacing: 0; font-family: var(--font); }
  .qrow .qa .ans > span b { visibility: hidden; }
  .qrow .qa .ans > span.on b { visibility: visible; }
  .qrow .qa .ans > span.on { transition: background-color .2s, color .2s; }
  .qrow .qa .ans > span.on.hb1 { background: var(--h1); color: var(--h1i); } .qrow .qa .ans > span.on.hb2 { background: var(--h2); color: var(--h2i); }
  .qrow .qa .ans > span.on.hb3 { background: var(--h3); color: var(--h3i); } .qrow .qa .ans > span.on.hb4 { background: var(--h4); color: var(--h4i); }
  .qrow .qa .ans > span.on.hb5 { background: var(--h5); color: var(--h5i); }

  /* раскрытие: кадр прогревается снизу вверх. Карточка сначала серая «??,?°», в свой момент заливается полосой места */
  .rv .icard { background: var(--cold-card); color: var(--muted); }
  .rv .icard > * { visibility: hidden; }
  .rv .icard.on > * { visibility: visible; }
  .rv .icard:not(.on)::after { content: attr(data-unk); position: absolute; right: calc(2 * var(--u)); top: 50%; transform: translateY(-50%); font: 700 calc(2.6 * var(--u)) / 1 var(--mono); color: var(--muted); }
  .rv .icard.on { animation: heat .5s steps(4, end) both; }
  .rv .icard.on.hb1 { background: var(--h1); color: var(--h1i); } .rv .icard.on.hb2 { background: var(--h2); color: var(--h2i); }
  .rv .icard.on.hb3 { background: var(--h3); color: var(--h3i); } .rv .icard.on.hb4 { background: var(--h4); color: var(--h4i); }
  .rv .icard.on.hb5 { background: var(--h5); color: var(--h5i); }
  /* «проявление» ступенями, как у тепловизора, который калибруется: без размытия и свечения */
  @keyframes heat { 0% { transform: scaleX(.97); filter: saturate(0); } 50% { filter: saturate(.5); } 100% { transform: none; filter: none; } }
  /* метка угадывающего на карточке: «⌖ Петя: №1» */
  .icard .gs { flex: none; display: inline-flex; align-items: center; gap: calc(.5 * var(--u)); font: 700 calc(1.9 * var(--u)) / 1 var(--mono); padding: calc(.5 * var(--u)) calc(.9 * var(--u)); border: 2px solid currentColor; border-radius: var(--r-sm); white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
  .icard .gs.miss { background: var(--bg); color: var(--text); border-color: var(--bg); }
  /* строка развёртки тепловизора — едет снизу вверх вместе с прогревом */
  .scan { position: absolute; left: calc(-1 * var(--u)); right: calc(-1 * var(--u)); bottom: 0; height: calc(.5 * var(--u)); background: var(--hud); pointer-events: none; opacity: 0; }
  .scan.go { animation: scan var(--scan-ms, 4000ms) linear var(--scan-delay, 0ms) both; }
  @keyframes scan { 0% { opacity: 1; transform: translateY(0); } 97% { opacity: 1; } 100% { opacity: 0; transform: translateY(var(--scan-h, -60vh)); } }

  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(2.4 * var(--u)); text-align: center; min-height: 0; }
  .center .pgrid { width: min(100%, calc(150 * var(--u))); }
  .vetos { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .vetos span { background: var(--bad); color: #fff; border-radius: var(--r-sm); padding: 6px 14px; font: 700 calc(2 * var(--u)) / 1.2 var(--mono); }
  /* заставка хода: угадывающий → мишень в прицеле */
  .duel { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: calc(4 * var(--u)); width: min(100%, calc(160 * var(--u))); }
  .duel .side { justify-self: center; max-width: 100%; display: flex; flex-direction: column; align-items: center; gap: calc(1.6 * var(--u)); min-width: 0; padding: calc(3 * var(--u)) calc(4 * var(--u)); }
  .duel .side h1 { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: calc(8 * var(--u)); }
  .duel .mid { font: 700 calc(2.4 * var(--u)) / 1.2 var(--mono); color: var(--hud); text-transform: uppercase; letter-spacing: .1em; display: grid; justify-items: center; gap: calc(1 * var(--u)); }
  .duel .mid i { font-style: normal; font-size: calc(6 * var(--u)); line-height: 1; }
  .duel .tgt { --vf-l: calc(5 * var(--u)); --vf-t: calc(.6 * var(--u)); }
  .duel .tgt .eyebrow, .duel .gss .eyebrow { color: var(--hud); }

  /* счёт и итоги */
  .board { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(.8 * var(--u)); width: min(100%, calc(110 * var(--u))); }
  .board li { display: flex; align-items: center; gap: calc(1.6 * var(--u)); background: var(--bg2); border-radius: var(--r-sm); padding: calc(.9 * var(--u)) calc(2 * var(--u)); font: 800 calc(3.2 * var(--u)) / 1.05 var(--font); }
  .board li.first { background: var(--h1); color: var(--h1i); }
  .board .rk { width: calc(4 * var(--u)); text-align: center; color: var(--muted); font: 700 calc(2.8 * var(--u)) / 1 var(--mono); }
  .board li.first .rk { color: var(--h1i); }
  .board .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }

<script>
"use strict";
const T = (k) => wvT(k);
const tpl = (k, v) => wvTpl(k, v);
const $ = (id) => document.getElementById(id);
const esc = escapeHtml;
const params = new URLSearchParams(location.search);
let CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const hostKey = () => "ifeel-host-" + CODE;
const langKey = () => "ifeel-lang-" + CODE; // язык карточек выбран ведущим вручную — не следуем за его интерфейсом
const main = $("main");
const FLAGS = { ru: "🇷🇺", en: "🇬🇧", el: "🇬🇷" };
const LANG_NAMES = { ru: "Русский", en: "English", el: "Ελληνικά" };

let conn = null, state = null, isHost = false, dead = false;
let viewKey = "";
const player = (id) => state && state.players.find((p) => p.id === id);
const nameOf = (id) => (player(id) || {}).name || "?";
const present = () => state.players.filter((p) => !p.left);
const avHtml = (p, cls) => `<i class="av ${cls || ""}" style="--pc:${esc(p.color)}">${esc(p.avatar)}</i>`;
const phaseNow = () => state.serverNow - state.phaseStart + (performance.now() - state.__at);
const phaseLeft = () => state.phaseEnd - state.serverNow - (performance.now() - state.__at);
const itemHtml = (x, no, extra) => `${no ? `<span class="no p${no}">${no}</span>` : ""}${x.e ? `<span class="e">${esc(x.e)}</span>` : ""}<span>${esc(x.t)}</span>${extra || ""}`;
function show(html, key) {
  if (key === viewKey) return false;
  viewKey = key;
  main.innerHTML = html;
  return true;
}

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  showBanner(T("creating"));
  try {
    const body = { settings: { lang: wvLang() } };
    if (params.get("speed")) body.speed = Number(params.get("speed"));
    const res = await fetch("/ifeel/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
    showBanner(null);
    return true;
  } catch (err) {
    showBanner(String(err.message || err));
    return false;
  }
}
function showBanner(text) {
  const b = $("banner");
  b.classList.toggle("hidden", !text);
  b.textContent = text || "";
}

// ---------- «🔑 Ссылка ведущего» (как в crowd) ----------
let hostNote = "", hostNoteT = 0, pasteOpen = false, hostLost = false, hostCtlKey = "";
const HL = window.MP && MP.hostLink ? MP.hostLink({
  hostKeyFn: hostKey,
  boardPath: "ifeel-board.html",
  getRoom: () => CODE,
  sendHost: (t) => { if (conn) conn.send({ type: "host", token: t }); },
  onToast: (kind) => {
    if (kind === "copied") setHostNote(T("link_copied"));

  const loud = state.loud || [];
  const cards = loud.slice(0, 3).map((x) => {
    const g = player(x.guesser), tp = player(x.target);
    const l = loudLine(x);
    return `<div class="lcard"><div class="lh">${g ? avHtml(g) : ""}<b>${esc(nameOf(x.guesser))}</b><span>⌖</span>${tp ? avHtml(tp) : ""}<b>${esc(nameOf(x.target))}</b><span class="lt">· ${esc(x.title)}</span></div>
      <div class="ll">${esc(l.text)}</div>
      <div class="lo">${x.order.map((k, i) => `<span class="icard ${wvHeat(i + 1)} ${k === l.hit ? "hit" : ""}">${itemHtml(x.items[k], i + 1)}</span>`).join("")}</div></div>`;
  }).join("");
  const key = ["fin", state.game, list.map((p) => p.id + p.score).join(","), isHost, wvLang()].join("|");
  if (!show(`<div class="fin"><div class="finl">
      <h1>${esc(T("final_t"))}</h1>
      ${winners.length ? `<div class="winplate vf">🏆 ${winners.map((p) => avHtml(p)).join("")}<span>${esc(winners.length > 1 ? tpl("final_shared", { names: winners.map((p) => p.name).join(", ") }) : tpl("final_win", { name: winners[0].name }))}</span></div>` : ""}${sub ? `<p class="lede">${esc(sub)}</p>` : ""}
      ${boardHtml()}
      ${isHost ? `<div class="fbtn"><button class="start" id="again" type="button"${list.length < state.minPlayers ? " disabled" : ""}>${esc(T("btn_again"))}</button><button class="ghostbtn" id="tolobby" type="button">${esc(T("btn_lobby"))}</button></div>` : ""}</div>
    <div class="loud${loud.length < 3 ? " few" : ""}"><h2>${esc(T("loud_t"))}</h2>${cards || `<p class="lede">${esc(T("loud_none"))}</p>`}</div></div>`, key)) return;
  if (why === "done") wvSfx.fanfare();
  const a = $("again"); if (a) a.onclick = () => conn.send({ type: "start" });
  const l = $("tolobby"); if (l) l.onclick = () => conn.send({ type: "lobby" });
}

// ---------- выбор экрана ----------
function render() {
  if (!state || dead) return;
  document.body.dataset.phase = state.phase;
  topBar();
  const r = state.round;
  switch (state.phase) {
    case "lobby": return drawLobby();
    case "pick": return drawWaitPhase("pick_t", "pick_s", r.cast);
    case "write": return drawWaitPhase("write_t", "write_s", r.writers || r.cast);
    case "rank": return drawWaitPhase("rank_t", "rank_s", r.ranking || r.cast);
    case "tintro": return drawTintro();
    case "ask": return drawAsk();
    case "reveal": return drawReveal();
    case "scores": return drawScores();
    case "pause": return drawPause();
    case "finished": return drawFinal();
  }
}
$("endbtn").onclick = () => { if (confirm(T("btn_end") + "?")) conn.send({ type: "end" }); };

let lastTickSec = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead) return;
  const bar = $("tbar"), ts = $("tsec");
  if (state.phaseEnd && (bar || ts)) {
    const left = phaseLeft();
    const total = Math.max(1, state.phaseEnd - state.phaseStart);
    if (bar) bar.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`;
    if (ts) { ts.textContent = String(Math.max(0, Math.ceil(left / 1000))); ts.classList.toggle("hot", left < 5000 && state.phase === "ask"); }
    if (state.phase === "ask" && left < 5000 && left > 0) {
      const sec = Math.ceil(left / 1000);
      if (sec !== lastTickSec) { lastTickSec = sec; wvSfx.tick(sec <= 3); }
    }
  }
  if (state.phase === "reveal") updReveal();
}

window.addEventListener("langchange", () => {
  viewKey = ""; hostCtlKey = "";
  // язык карточек по умолчанию — язык интерфейса ведущего, пока он не выбрал вручную
  if (isHost && state && state.phase === "lobby" && !manualLang() && state.settings.lang !== wvLang()) conn.send({ type: "settings", settings: { lang: wvLang() } });
  render();
});
const manualLang = () => { try { return !!localStorage.getItem(langKey()); } catch (e) { return false; } };

// ---------- связь ----------
function setState(s) { s.__at = performance.now(); state = s; }
function onMessage(m) {
  switch (m.type) {
    case "hello":
      if (goneFlow) goneFlow.hello();
      setState(m.state);
      if (!isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      setState(m.state);
      render();
      break;
    case "event":
      if (m.event && m.event.type === "round") wvSfx.whoosh();
      break;
    case "host_ok":
      isHost = true;
      hostLost = false;
      pasteOpen = false;
      document.body.classList.add("host");
      viewKey = "";
      if (state && state.phase === "lobby" && !manualLang() && state.settings.lang !== wvLang()) conn.send({ type: "settings", settings: { lang: wvLang() } });
      render();
      break;
    case "host_lost":
      isHost = false;
      hostLost = true;
      document.body.classList.remove("host");
      viewKey = "";
      render();
      break;
    case "rejected":
      if (m.action === "start" && m.reason) { showBanner(T(m.reason)); setTimeout(() => showBanner(null), 3000); }
      break;
    case "error":
      if (m.error === "room_expired") onRoomGone();
      if (m.error === "bad host token") {
        hostLost = false;
        try { localStorage.removeItem(hostKey()); } catch (e) {}
        pasteOpen = true;
        setHostNote(T("host_bad"));
      }
      break;
  }
}
function gone() {
  dead = true;
  main.innerHTML = "";
  showBanner(T("expired"));
}
const goneFlow = window.MP && MP.roomGone ? MP.roomGone({
  showForm: () => { dead = true; main.innerHTML = ""; showBanner(T("noroom")); },
  onClosed: () => gone(),
}) : null;
function onRoomGone() { if (goneFlow) goneFlow.gone(); else gone(); }
async function boot() {
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  let netLost = false, netQuiet = false;
  const showNet = () => {
    banner.textContent = T(netLost ? "err_connect" : "conn_lost");
    banner.classList.toggle("on", netLost || netQuiet);
  };
  window.addEventListener("langchange", showNet);
  conn = wvConnect({
    code: CODE,
    onMessage,
    onGone: onRoomGone,
    onOpen: () => { isHost = false; },
    onState: (st) => { netLost = st === "lost"; if (st === "open") netQuiet = false; showNet(); },
    onQuiet: (q) => { netQuiet = !!q; showNet(); },
  });
  requestAnimationFrame(frame);
  window.wvBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
window.addEventListener("resize", () => { viewKey = ""; if (state) render(); });
boot();
</script>
