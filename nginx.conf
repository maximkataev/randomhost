# Docker DNS: имя сервиса резолвится при запросе, а не при старте nginx —
# иначе неподнявшийся auction не даёт стартовать всему сайту.
resolver 127.0.0.11 valid=10s;

# $auction_real_ip (адрес игрока за двумя прокси) объявлен в nginx-limits.conf — он подключается
# как 00-limits.conf и читается раньше этого файла. Тем же значением ключуются зоны limit_req.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # Сжатие текста. На EDGE несжатые auction.html и скрипты (~200 КБ) давали форму входа через
    # 40 с. html жмётся всегда, остальное — по списку; proxied any — чтобы жались и ответы
    # long-polling (/auction/api/poll), где state уходит целиком.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml text/plain;

    # dotfiles (.env и т.п.) никогда не отдаём
    location ~ /\. {
        return 404;
    }

    # сервер аукциона: WebSocket и API
    location /auction/ws {
        set $auction http://auction:3000;
        proxy_pass $auction;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # адрес игрока — для потолка анонимных сокетов с одного адреса в комнате (M14)
        proxy_set_header X-Real-IP $auction_real_ip;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Лимит на открытие соединений, а не на сообщения внутри них (те режет MSG_RATE на сервере).
        # Зона та же, что у опроса: вся компания за одним NAT после деплоя переподключается разом,
        # burst 120 это покрывает; а цикл «открыл сокет — вошёл — закрыл» с одного адреса упирается в 30/с.
        limit_req zone=auction_poll burst=120 nodelay;
    }

    # создание комнат: редкая и дорогая операция.
    # X-Real-IP обязателен: сервер по нему считает лимит комнат на адрес.
    # Без него все запросы приходят с адреса nginx хоста и лимит схлопнул бы весь сайт до 20 комнат.
    location = /auction/api/rooms {
        set $auction http://auction:3000;
        proxy_pass $auction;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $auction_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=auction_rooms burst=10 nodelay;
    }

    # опрос состояния, ставки, health: весь игровой трафик, идёт часто и с одного IP
    location /auction/api/ {
        set $auction http://auction:3000;
        proxy_pass $auction;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $auction_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 90s;
        limit_req zone=auction_poll burst=120 nodelay;
    }

    # сервер рулетки: WebSocket и API — те же правила, что у аукциона, со своими зонами лимитов
    location /roulette/ws {
        set $roulette http://roulette:3100;
        proxy_pass $roulette;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $auction_real_ip;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        limit_req zone=roulette_poll burst=120 nodelay;
    }

    location = /roulette/api/rooms {
        set $roulette http://roulette:3100;
        proxy_pass $roulette;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $auction_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=roulette_rooms burst=10 nodelay;
    }

    location /roulette/api/ {
        set $roulette http://roulette:3100;
        proxy_pass $roulette;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $auction_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 90s;
        limit_req zone=roulette_poll burst=120 nodelay;
    }

    # сервер «Бомбы»: WebSocket и API — те же правила, что у рулетки, со своими зонами лимитов
    location /bomb/ws {
        set $bomb http://bomb:3300;
        proxy_pass $bomb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $auction_real_ip;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        limit_req zone=bomb_poll burst=120 nodelay;
    }

    location = /bomb/api/rooms {
        set $bomb http://bomb:3300;
        proxy_pass $bomb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $auction_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=bomb_rooms burst=10 nodelay;
    }

    location /bomb/api/ {
        set $bomb http://bomb:3300;
        proxy_pass $bomb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $auction_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 90s;
        limit_req zone=bomb_poll burst=120 nodelay;
    }

    # молнии для «Грома» (thunder.html). /latest и /stream при холодном старте ждут первый файл
    # до 25 с — отсюда таймаут. Ответы не кэшируем: они меняются каждые 20 с.
    location /storm/api/ {
        set $storm http://storm:3200;
        proxy_pass $storm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 40s;
        add_header Cache-Control "no-store" always;
        limit_req zone=storm burst=40 nodelay;
    }

    # Страницы и скрипты игры обязаны перепроверяться при каждом заходе. Без Cache-Control
    # браузер применяет эвристику и может держать старую копию: доска, открытая до деплоя,
    # продолжает крутить старый код, а игрок получает страницу, не совпадающую с сервером.
    # no-cache не запрещает кэш — он требует проверить актуальность (ETag отдаёт 304, трафика нет).
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Скрипты и стили вынесены из общего правила: для них фолбэк на index.html вреден.
    # Несуществующий .js отдавался как главная страница — 200 и Content-Type: text/html вместо
    # кода. Так удалённый /sw.js годами возвращал 155 КБ HTML: браузер отвергал его по MIME-типу,
    # регистрация service worker у посетителей не обновлялась и не снималась, старый воркер
    # продолжал перехватывать запросы (см. sw.js). Тот же фолбэк ломает и любой опечатанный путь
    # к скрипту: вместо честного 404 страница получает HTML и падает на разборе как на JS.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # картинки, шрифты и прочее меняются вместе с именем файла — их можно держать долго
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?|mp3|mp4)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri $uri/ =404;
    }

    # Несуществующие адреса — честный 404 со страницей 404.html, а не главная с кодом 200.
    # Фолбэк на index.html превращал любой мусорный путь (и отсутствующие robots.txt/sitemap.xml)
    # в копию главной: поисковики считали их дублями, а robots.txt «читался» как HTML.
    # На ответы проксируемых API (auction, roulette, bomb) не действует — proxy_intercept_errors выключен.
    location / {
        try_files $uri $uri/ =404;
    }
}
