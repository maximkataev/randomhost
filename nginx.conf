# Docker DNS: имя сервиса резолвится при запросе, а не при старте nginx —
# иначе неподнявшийся auction не даёт стартовать всему сайту.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # dotfiles (.env и т.п.) никогда не отдаём
    location ~ /\. {
        return 404;
    }

    # сервер аукциона: WebSocket и API
    location /auction/ws {
        set $auction http://auction:3000;
        proxy_pass $auction;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /auction/api/ {
        set $auction http://auction:3000;
        proxy_pass $auction;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        limit_req zone=auction_api burst=30 nodelay;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
