# Имя проекта задано явно, чтобы не выводилось из имени каталога:
# при переносе или переименовании каталога контейнер иначе осиротеет.
# Значение совпадает с прежним выводимым, поэтому переезда контейнера не происходит.
name: randomhostwebsite

services:
  web:
    build: .
    image: randomhostwebsite:latest
    container_name: randomhost
    # Ядра 0-1 зарезервированы под radio-encoder: перезапуск чего угодно
    # не должен отнимать CPU у RTMP-потока. Не убирать.
    cpuset: "2-5"
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # На хосте нет глобального лимита на json-логи контейнеров, поэтому
    # ограничение задаётся здесь. Без него лог растёт без предела.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - auction
      - roulette
      - bomb
      - fibs
      - lastq
      - quip
      - wave
      - crowd
      - floe
      - rapids
      - storm
      - oneword
      - pond
      - ifeel
      - bets

  # сервер онлайн-аукциона (WebSocket + API); nginx проксирует в него /auction/ws и /auction/api/
  auction:
    build:
      context: .
      dockerfile: auction/Dockerfile
    image: randomhostauction:latest
    container_name: randomhost-auction
    cpuset: "2-5"
    restart: always
    mem_limit: 256m
    # Ключ судьи берётся из /opt/randomhostwebsite/.env (compose подставляет его сам);
    # файла нет — переменные пустые, судья работает через голосование, сайт не падает.
    # ВАЖНО: .env должен быть читаем пользователем, под которым идёт деплой (root:techadmin 640).
    # compose читает .env ДО всего остального, и при `permission denied` падает весь деплой,
    # даже если ключ в этой сборке не нужен. Файл в rsync исключён, правами управляем на сервере.
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    # Флаги правил класса B (RULE_U01_CLAIM_IN_GAME, RULE_U08_GHOST_OUT, RULE_U26_BOMB_ONLINE, RULE_U47_CROWD_DECIDER,
    # RULE_U51_COUNTDOWN_LEAVE, RULE_U28_SERVER_DRAFT, RULE_U03_HOST_QR, OFFLINE_FALL_GRACE) здесь НЕ прописаны:
    # по умолчанию «как сейчас»; включать только по решению владельца, значением «1» (floe: OFFLINE_FALL_GRACE=1.5).
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
      - PING_MS=${PING_MS:-8000}
      - GAME_PONG_MISSES=${GAME_PONG_MISSES:-2}
      - GAME_DEAD_MS=${GAME_DEAD_MS:-20000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4}
    volumes:
      - auction-state:/app/state
    # Проверка отвечает ли процесс, а не «жив ли PID»: зависший на мёртвом цикле сервер docker
    # считает работающим. Сама по себе она контейнер не перезапускает (это делает restart: always
    # при падении) — она нужна, чтобы `docker ps` показывал (unhealthy), а деплой ждал реальной
    # готовности, а не факта запуска. wget есть в alpine, лишних пакетов не требуется.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/auction/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер рулетки (WebSocket + API); nginx проксирует в него /roulette/ws и /roulette/api/.
  # Устроен как auction: состояние комнат в памяти, дамп в том раз в 5 с — деплой не рвёт партию.
  roulette:
    build:
      context: .
      dockerfile: roulette/Dockerfile
    image: randomhostroulette:latest
    container_name: randomhost-roulette
    cpuset: "2-5"
    restart: always
    mem_limit: 256m
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    # Флаги правил класса B (RULE_U01_CLAIM_IN_GAME, RULE_U08_GHOST_OUT, RULE_U26_BOMB_ONLINE, RULE_U47_CROWD_DECIDER,
    # RULE_U51_COUNTDOWN_LEAVE, RULE_U28_SERVER_DRAFT, RULE_U03_HOST_QR, OFFLINE_FALL_GRACE) здесь НЕ прописаны:
    # по умолчанию «как сейчас»; включать только по решению владельца, значением «1» (floe: OFFLINE_FALL_GRACE=1.5).
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
    volumes:
      - roulette-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/roulette/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Бомбы» (WebSocket + API); nginx проксирует в него /bomb/ws и /bomb/api/.
  # Устроен как roulette. В дампе — запечатанная длина фитиля: без неё после рестарта нечего взрывать.
  bomb:
    build:
      context: .
      dockerfile: bomb/Dockerfile
    image: randomhostbomb:latest
    container_name: randomhost-bomb
    cpuset: "2-5"
    restart: always
    mem_limit: 128m
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    # Флаги правил класса B (RULE_U01_CLAIM_IN_GAME, RULE_U08_GHOST_OUT, RULE_U26_BOMB_ONLINE, RULE_U47_CROWD_DECIDER,
    # RULE_U51_COUNTDOWN_LEAVE, RULE_U28_SERVER_DRAFT, RULE_U03_HOST_QR, OFFLINE_FALL_GRACE) здесь НЕ прописаны:
    # по умолчанию «как сейчас»; включать только по решению владельца, значением «1» (floe: OFFLINE_FALL_GRACE=1.5).
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
      - PING_MS=${PING_MS:-8000}
      - GAME_PONG_MISSES=${GAME_PONG_MISSES:-2}
      - GAME_DEAD_MS=${GAME_DEAD_MS:-20000}
    volumes:
      - bomb-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3300/bomb/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Вопроса ребром» (WebSocket + API); nginx проксирует в него /quip/ws и /quip/api/.
  # Устроен как bomb. В дампе — авторы ответов и пулы подсказок: без них после рестарта не раскрыть схватку.
  quip:
    build:
      context: .
      dockerfile: quip/Dockerfile
    image: randomhostquip:latest
    container_name: randomhost-quip
    cpuset: "2-5"
    restart: always
    mem_limit: 128m
    # добавка (с) ко времени на ответ в раундах; 0 — прежние таймеры. Задаётся в .env, по умолчанию 15
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    # Флаги правил класса B (RULE_U01_CLAIM_IN_GAME, RULE_U08_GHOST_OUT, RULE_U26_BOMB_ONLINE, RULE_U47_CROWD_DECIDER,
    # RULE_U51_COUNTDOWN_LEAVE, RULE_U28_SERVER_DRAFT, RULE_U03_HOST_QR, OFFLINE_FALL_GRACE) здесь НЕ прописаны:
    # по умолчанию «как сейчас»; включать только по решению владельца, значением «1» (floe: OFFLINE_FALL_GRACE=1.5).
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
      - PING_MS=${PING_MS:-8000}
      - GAME_PONG_MISSES=${GAME_PONG_MISSES:-2}
      - GAME_DEAD_MS=${GAME_DEAD_MS:-20000}
      - ROUND_EXTRA_SEC=${ROUND_EXTRA_SEC:-15}
    volumes:
      - quip-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3400/quip/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # молнии для «Грома» (thunder.html): качает файлы NOAA GOES GLM из открытых бакетов AWS,
  # разбирает NetCDF и отдаёт вспышки; nginx проксирует в него /storm/api/. Состояния на диске нет.
  # Бакет опрашивается, только пока страницу кто-то смотрит (IDLE_S в server.py).
  storm:
    build: ./storm
    image: randomhoststorm:latest
    container_name: randomhost-storm
    cpuset: "2-5"
    restart: always
    mem_limit: 256m
    # в образе python:slim нет wget/curl — проверяем тем же питоном
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3200/storm/api/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Не верю!» (WebSocket + API); nginx проксирует в него /fibs/ws и /fibs/api/.
  # Устроен как bomb/quip. В дампе — правда до раскрытия и пул заготовленной лжи: снимки их не отдают.
  fibs:
    build:
      context: .
      dockerfile: fibs/Dockerfile
    image: randomhostfibs:latest
    container_name: randomhost-fibs
    cpuset: "2-5"
    restart: always
    mem_limit: 128m
    # добавка (с) ко времени на ответ в раундах; 0 — прежние таймеры. Задаётся в .env, по умолчанию 15
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    # Флаги правил класса B (RULE_U01_CLAIM_IN_GAME, RULE_U08_GHOST_OUT, RULE_U26_BOMB_ONLINE, RULE_U47_CROWD_DECIDER,
    # RULE_U51_COUNTDOWN_LEAVE, RULE_U28_SERVER_DRAFT, RULE_U03_HOST_QR, OFFLINE_FALL_GRACE) здесь НЕ прописаны:
    # по умолчанию «как сейчас»; включать только по решению владельца, значением «1» (floe: OFFLINE_FALL_GRACE=1.5).
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
      - PING_MS=${PING_MS:-8000}
      - GAME_PONG_MISSES=${GAME_PONG_MISSES:-2}
      - GAME_DEAD_MS=${GAME_DEAD_MS:-20000}
      - ROUND_EXTRA_SEC=${ROUND_EXTRA_SEC:-15}
    volumes:
      - fibs-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3500/fibs/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Последний вопрос» (WebSocket + API); nginx проксирует в него /lastq/ws и /lastq/api/.
  # Устроен как fibs. В дампе — верный ответ до раскрытия и ответы испытаний Камеры: снимки их не отдают.
  # mem_limit 160m: на нагрузочном прогоне (200 комнат) RSS доходил до ~123 МБ — снять docker stats после выкатки.
  lastq:
    build:
      context: .
      dockerfile: lastq/Dockerfile
    image: randomhostlastq:latest
    container_name: randomhost-lastq
    cpuset: "2-5"
    restart: always
    mem_limit: 160m
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    # Флаги правил класса B (RULE_U01_CLAIM_IN_GAME, RULE_U08_GHOST_OUT, RULE_U26_BOMB_ONLINE, RULE_U47_CROWD_DECIDER,
    # RULE_U51_COUNTDOWN_LEAVE, RULE_U28_SERVER_DRAFT, RULE_U03_HOST_QR, OFFLINE_FALL_GRACE) здесь НЕ прописаны:
    # по умолчанию «как сейчас»; включать только по решению владельца, значением «1» (floe: OFFLINE_FALL_GRACE=1.5).
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
    volumes:
      - lastq-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3800/lastq/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «На одной волне» (WebSocket + API); nginx проксирует в него /wave/ws и /wave/api/.
  # Устроен как fibs. В дампе — центры секторов и стрелки до раскрытия: снимки их не отдают.
  wave:
    build:
      context: .
      dockerfile: wave/Dockerfile
    image: randomhostwave:latest
    container_name: randomhost-wave
    cpuset: "2-5"
    restart: always
    mem_limit: 128m
    # добавка (с) ко времени на ответ в раундах; 0 — прежние таймеры. Задаётся в .env, по умолчанию 15
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    # Флаги правил класса B (RULE_U01_CLAIM_IN_GAME, RULE_U08_GHOST_OUT, RULE_U26_BOMB_ONLINE, RULE_U47_CROWD_DECIDER,
    # RULE_U51_COUNTDOWN_LEAVE, RULE_U28_SERVER_DRAFT, RULE_U03_HOST_QR, OFFLINE_FALL_GRACE) здесь НЕ прописаны:
    # по умолчанию «как сейчас»; включать только по решению владельца, значением «1» (floe: OFFLINE_FALL_GRACE=1.5).
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
      - PING_MS=${PING_MS:-8000}
      - GAME_PONG_MISSES=${GAME_PONG_MISSES:-2}
      - GAME_DEAD_MS=${GAME_DEAD_MS:-20000}
      - ROUND_EXTRA_SEC=${ROUND_EXTRA_SEC:-15}
    volumes:
      - wave-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3600/wave/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Как все» (WebSocket + API); nginx проксирует в него /crowd/ws и /crowd/api/.
  # Устроен как wave. В дампе — голоса, ва-банк и мнения до раскрытия: снимки их не отдают.
  # Рядом лежит анонимная статистика вопросов (qstats.json) для калибровки колоды.
  crowd:
    build:
      context: .
      dockerfile: crowd/Dockerfile
    image: randomhostcrowd:latest
    container_name: randomhost-crowd
    cpuset: "2-5"
    restart: always
    mem_limit: 128m
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    # Флаги правил класса B (RULE_U01_CLAIM_IN_GAME, RULE_U08_GHOST_OUT, RULE_U26_BOMB_ONLINE, RULE_U47_CROWD_DECIDER,
    # RULE_U51_COUNTDOWN_LEAVE, RULE_U28_SERVER_DRAFT, RULE_U03_HOST_QR, OFFLINE_FALL_GRACE) здесь НЕ прописаны:
    # по умолчанию «как сейчас»; включать только по решению владельца, значением «1» (floe: OFFLINE_FALL_GRACE=1.5).
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
      - PING_MS=${PING_MS:-8000}
      - GAME_PONG_MISSES=${GAME_PONG_MISSES:-2}
      - GAME_DEAD_MS=${GAME_DEAD_MS:-20000}
    volumes:
      - crowd-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3900/crowd/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Царя льдины» (WebSocket, 20 тиков в секунду); nginx проксирует в него /floe/ws и /floe/api/.
  # В дампе — только комнаты с людьми и токенами: идущая партия после рестарта отменяется.
  floe:
    build:
      context: .
      dockerfile: floe/Dockerfile
    image: randomhostfloe:latest
    container_name: randomhost-floe
    cpuset: "2-5"
    restart: always
    mem_limit: 128m
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    # Флаги правил класса B (RULE_U01_CLAIM_IN_GAME, RULE_U08_GHOST_OUT, RULE_U26_BOMB_ONLINE, RULE_U47_CROWD_DECIDER,
    # RULE_U51_COUNTDOWN_LEAVE, RULE_U28_SERVER_DRAFT, RULE_U03_HOST_QR, OFFLINE_FALL_GRACE) здесь НЕ прописаны:
    # по умолчанию «как сейчас»; включать только по решению владельца, значением «1» (floe: OFFLINE_FALL_GRACE=1.5).
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - INPUT_STALE_MS=${INPUT_STALE_MS:-1500}
    volumes:
      - floe-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3700/floe/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Утиного сплава» (WebSocket, 20 тиков в секунду); nginx проксирует в него /rapids/ws и /rapids/api/.
  # Устроен как floe: в дампе только комнаты с людьми и токенами, идущий заплыв после рестарта отменяется.
  rapids:
    build:
      context: .
      dockerfile: rapids/Dockerfile
    image: randomhostrapids:latest
    container_name: randomhost-rapids
    cpuset: "2-5"
    restart: always
    mem_limit: 128m
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    # Флаги правил класса B (RULE_U01_CLAIM_IN_GAME, RULE_U08_GHOST_OUT, RULE_U26_BOMB_ONLINE, RULE_U47_CROWD_DECIDER,
    # RULE_U51_COUNTDOWN_LEAVE, RULE_U28_SERVER_DRAFT, RULE_U03_HOST_QR, OFFLINE_FALL_GRACE) здесь НЕ прописаны:
    # по умолчанию «как сейчас»; включать только по решению владельца, значением «1» (floe: OFFLINE_FALL_GRACE=1.5).
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - INPUT_STALE_MS=${INPUT_STALE_MS:-1200}
    volumes:
      - rapids-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3800/rapids/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Сто к одному» (oneword, WebSocket + API); nginx проксирует в него /oneword/ws и /oneword/api/.
  # Устроен как crowd. В дампе — чужие ответы темы и guess'ы до раскрытия и кластеры с подсчитанным count: снимки их не отдают.
  oneword:
    build:
      context: .
      dockerfile: oneword/Dockerfile
    image: randomhostoneword:latest
    container_name: randomhost-oneword
    cpuset: "2-5"
    restart: always
    mem_limit: 128m
    # Политики мультиплеера (T-W2-01): значения = то, что сервер использует без env; сменить без пересборки кода можно в .env.
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
      - PING_MS=${PING_MS:-8000}
      - GAME_PONG_MISSES=${GAME_PONG_MISSES:-2}
      - GAME_DEAD_MS=${GAME_DEAD_MS:-20000}
    volumes:
      - oneword-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/oneword/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Айфилю» (ifeel, WebSocket + API); nginx проксирует в него /ifeel/ws и /ifeel/api/.
  # Устроен как crowd. В дампе — тайные расстановки мишеней до раскрытия: снимки их не отдают.
  ifeel:
    build:
      context: .
      dockerfile: ifeel/Dockerfile
    image: randomhostifeel:latest
    container_name: randomhost-ifeel
    cpuset: "2-5"
    restart: always
    mem_limit: 128m
    environment:
      - ROUND_EXTRA_SEC=${ROUND_EXTRA_SEC:-15}
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
      - PING_MS=${PING_MS:-8000}
      - GAME_PONG_MISSES=${GAME_PONG_MISSES:-2}
      - GAME_DEAD_MS=${GAME_DEAD_MS:-20000}
    volumes:
      - ifeel-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4100/ifeel/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Кувшинок» (WebSocket, события с метками времени + снимок раз в секунду); nginx проксирует /pond/ws и /pond/api/.
  # Устроен как floe: в дампе только комнаты с людьми и токенами, идущая партия после рестарта отменяется.
  pond:
    build:
      context: .
      dockerfile: pond/Dockerfile
    image: randomhostpond:latest
    container_name: randomhost-pond
    cpuset: "2-5"
    restart: always
    mem_limit: 128m
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
    volumes:
      - pond-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/pond/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервер «Ставок» (WebSocket + API); nginx проксирует /bets/ws и /bets/api/.
  # Устроен как roulette: комнаты в памяти, дамп в том раз в 5 с. В дампе исход сценического события уже выбран.
  # BETS_LIVE (реальные события из bets/feed.js): включены проверенные на записях типы; whales, lightning, news выключены. Пока источник не прогрелся или молчит, слоты заменяются сценическими.
  bets:
    build:
      context: .
      dockerfile: bets/Dockerfile
    image: randomhostbets:latest
    container_name: randomhost-bets
    cpuset: "2-5"
    restart: always
    mem_limit: 256m
    environment:
      - GHOST_TTL_MS=${GHOST_TTL_MS:-120000}
      - CLAIM_WAIT_MS=${CLAIM_WAIT_MS:-120000}
      - ANON_TTL_MS=${ANON_TTL_MS:-30000}
      - PONG_MISSES=${PONG_MISSES:-3}
      - OFFLINE_GRACE_MS=${OFFLINE_GRACE_MS:-8000}
      - BETS_LIVE=${BETS_LIVE:-lang,wikinext,emoji,wikiduel,wikiedit,btc,btceth,airport}
    volumes:
      - bets-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4300/bets/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auction-state:
  roulette-state:
  bomb-state:
  fibs-state:
  lastq-state:
  quip-state:
  wave-state:
  crowd-state:
  floe-state:
  rapids-state:
  oneword-state:
  pond-state:
  ifeel-state:
  bets-state:
