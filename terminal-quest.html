<head>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><path d='M7 9l7 7-7 7' stroke='%237ee787' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/><rect x='16' y='21' width='9' height='3' rx='1.5' fill='%237ee787'/></svg>" type="image/svg+xml">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #0a0c10;
      --panel: #12161d;
      --panel-2: #171c25;
      --border: rgba(255, 255, 255, 0.09);
      --text: #e6edf3;
      --muted: #8b949e;
      --dim: #545d68;
      --green: #7ee787;
      --green-dim: rgba(126, 231, 135, 0.14);
      --blue: #79c0ff;
      --amber: #ffa657;
      --amber-dim: rgba(255, 166, 87, 0.14);
      --red: #ff7b72;
      --red-dim: rgba(255, 123, 114, 0.14);
      --purple: #d2a8ff;
      --term-bg: #0d1117;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html { color-scheme: dark; }
    [hidden] { display: none !important; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      background-image:
        radial-gradient(1000px 500px at 50% -10%, rgba(126, 231, 135, 0.07), transparent 60%),
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: auto, 28px 28px;
      color: var(--text);
      min-height: 100vh;
      padding: calc(14px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar {
      width: 100%;
      max-width: 1040px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      margin-bottom: 14px;
      padding-right: 140px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font: 600 13px var(--sans);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .pill-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; transform: translateY(-1px); }

    .headline { text-align: center; margin-bottom: 16px; }
    .app-title {
      font-family: var(--mono);
      font-weight: 700;
      font-size: clamp(22px, 4vw, 34px);
      letter-spacing: -0.5px;
      color: var(--green);
      text-shadow: 0 0 24px rgba(126, 231, 135, 0.35);
    }
    .app-title .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: var(--green);
      vertical-align: -0.15em;
      margin-left: 4px;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .layout {
      width: 100%;
      max-width: 1040px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      align-items: start;
    }

    /* ---------- Task panel ---------- */
    .task {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      position: sticky;
      top: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .task.done {
      border-color: rgba(126, 231, 135, 0.45);
      box-shadow: 0 0 0 1px rgba(126, 231, 135, 0.1), 0 0 34px rgba(126, 231, 135, 0.14);
    }
    .task-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .task-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 600 11px var(--mono);
      letter-spacing: 0.5px;
      color: var(--amber);
      background: var(--amber-dim);
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .task-status::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: blink 1.4s ease-in-out infinite;
    }
    .task-status.done { color: var(--green); background: var(--green-dim); }
    .task-status.done::before { animation: none; }
    .task-meta {
      font: 500 11.5px var(--mono);
      color: var(--dim);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .task-meta .key { color: var(--blue); font-weight: 700; }
    .task-meta .sep { opacity: 0.5; }
    .round-pill {
      font: 700 11px var(--mono);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--green);
      background: var(--green-dim);
      padding: 5px 10px;
      border-radius: 999px;
    }
    .progress {
      display: flex;
      gap: 3px;
      margin-bottom: 16px;
    }
    .progress i {
      flex: 1; height: 5px; border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .progress i.done { background: var(--green); box-shadow: 0 0 6px rgba(126, 231, 135, 0.5); }
    .progress i.cur { background: var(--amber); box-shadow: 0 0 8px rgba(255, 166, 87, 0.7); }

    .task-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.25;
      letter-spacing: -0.2px;
    }
    .task-goal {
      color: #b9c2cc;
      font-size: 14px;
      line-height: 1.6;
    }
    .task-goal code, .hint code, .final code {
      font-family: var(--mono);
      font-size: 12.5px;
      background: rgba(255, 255, 255, 0.07);
      padding: 1px 6px;
      border-radius: 5px;
      color: var(--blue);
    }

    .task-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font: 600 13px var(--sans);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, opacity 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background: #1f2630; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
    .btn.hint { color: var(--amber); border-color: rgba(255, 166, 87, 0.3); }
    .btn.next { background: var(--green); color: #05130a; border-color: transparent; font-weight: 800; }
    .btn.next:hover { background: #95f19c; }

    .hints { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .hint {
      background: var(--amber-dim);
      border-left: 3px solid var(--amber);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      line-height: 1.5;
      color: #f2d9c4;
      animation: pop 0.25s ease-out;
    }
    .hint b { color: var(--amber); font-family: var(--mono); font-size: 11px; letter-spacing: 1px; margin-right: 6px; }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    .stats {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 10px 6px 8px;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid transparent;
      transition: background 0.25s, border-color 0.25s;
      min-width: 0;
    }
    .stat i { font-style: normal; font-size: 15px; height: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 3px; filter: grayscale(1); opacity: 0.55; transition: filter 0.25s, opacity 0.25s; }
    .stat b { font: 700 20px/1.1 var(--mono); color: var(--text); }
    .stat span { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    .stat.on i { filter: none; opacity: 1; }
    .stat.st-cmds.on b { color: var(--blue); }
    .stat.st-hints.on { background: var(--amber-dim); border-color: rgba(255, 166, 87, 0.25); }
    .stat.st-hints.on b { color: var(--amber); }
    .stat.st-hool.on { background: var(--red-dim); border-color: rgba(255, 123, 114, 0.3); }
    .stat.st-hool.on b { color: var(--red); }
    .stat.st-hool.bump { animation: stat-bump 0.35s; }
    @keyframes stat-bump { 30% { transform: scale(1.12); } }

    /* ---------- Terminal ---------- */
    .term {
      background: var(--term-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: min(72vh, 680px);
      min-height: 420px;
    }
    .term.shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .term-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #161b22;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .dots { display: flex; gap: 7px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .dots i:nth-child(1) { background: #ff5f57; }
    .dots i:nth-child(2) { background: #febc2e; }
    .dots i:nth-child(3) { background: #28c840; }
    .term-title {
      flex: 1;
      text-align: center;
      font: 500 12px var(--mono);
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .term-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 6px;
      font: 13.5px/1.55 var(--mono);
      cursor: text;
      -webkit-overflow-scrolling: touch;
    }
    .term-body::-webkit-scrollbar { width: 8px; }
    .term-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }

    .line { white-space: pre-wrap; word-break: break-word; }
    .line.cmd { color: var(--text); }
    .line.cmd .ps { color: var(--green); }
    .line.cmd .ps .path { color: var(--blue); }
    .line.out { color: #c9d1d9; }
    .line.err { color: var(--red); }
    .line.sys { color: var(--purple); }
    .line.scold {
      color: #ffd1cc;
      background: var(--red-dim);
      border-left: 3px solid var(--red);
      padding: 6px 10px;
      margin: 6px 0;
      border-radius: 6px;
    }
    .line.win {
      color: #dcffe0;
      background: var(--green-dim);
      border-left: 3px solid var(--green);
      padding: 8px 12px;
      margin: 8px 0;
      border-radius: 6px;
      animation: pop 0.3s ease-out;
    }
    .win-banner {
      margin: 10px 0 6px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(126, 231, 135, 0.45);
      background: linear-gradient(135deg, rgba(126, 231, 135, 0.16), rgba(121, 192, 255, 0.08));
      box-shadow: 0 0 0 1px rgba(126, 231, 135, 0.08), 0 0 30px rgba(126, 231, 135, 0.18);
      animation: win-in 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    @keyframes win-in { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: none; } }
    .win-title {
      font: 800 clamp(22px, 3.4vw, 30px) var(--mono);
      letter-spacing: 3px;
      color: var(--green);
      text-shadow: 0 0 18px rgba(126, 231, 135, 0.7);
      animation: win-glow 1.1s ease-in-out infinite alternate;
      margin-bottom: 10px;
    }
    @keyframes win-glow { from { text-shadow: 0 0 8px rgba(126, 231, 135, 0.4); } to { text-shadow: 0 0 26px rgba(126, 231, 135, 0.95); } }
    .win-result-label {
      font: 700 10.5px var(--mono);
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .win-result {
      background: rgba(0, 0, 0, 0.35);
      border-left: 3px solid var(--amber);
      border-radius: 6px;
      padding: 8px 12px;
      color: #ffe6c7;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 10px;
    }
    .win-result b { color: var(--amber); font-weight: 700; }
    .win-msg { color: #dcffe0; white-space: pre-wrap; }
    .win-next { color: var(--muted); margin-top: 8px; font-size: 12.5px; }
    .line.dir { color: var(--blue); }
    .ls-dir { color: var(--blue); font-weight: 600; }
    .ls-exe { color: var(--green); font-weight: 600; }

    .term-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 12px;
      font: 13.5px var(--mono);
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .term-input-row .ps { color: var(--green); white-space: nowrap; }
    .term-input-row .ps .path { color: var(--blue); }
    .term-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font: 16px var(--mono);
      caret-color: var(--green);
      min-width: 0;
    }
    @media (min-width: 640px) { .term-input { font-size: 13.5px; } }

    /* ---------- Final ---------- */
    .final {
      text-align: center;
      padding: 8px 4px;
    }
    .final .rank-emoji { font-size: 54px; margin-bottom: 8px; }
    .final .rank {
      font: 800 24px var(--sans);
      color: var(--green);
      margin-bottom: 6px;
    }
    .final p { color: var(--muted); font-size: 14px; line-height: 1.55; }
    .final-stats {
      margin: 14px 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .final-stats div {
      background: var(--panel-2);
      border-radius: 10px;
      padding: 10px;
    }
    .final-stats b { display: block; font: 700 22px var(--mono); }
    .final-stats span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.6px; }

    /* ---------- Participants modal ---------- */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.65);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .modal h3 { font-size: 17px; margin-bottom: 4px; }
    .modal p { color: var(--muted); font-size: 13px; margin-bottom: 12px; line-height: 1.5; }
    .modal textarea {
      width: 100%;
      height: 180px;
      background: var(--term-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font: 14px/1.6 var(--mono);
      padding: 10px 12px;
      resize: vertical;
      outline: none;
    }
    .modal textarea:focus { border-color: var(--green); }
    .modal-actions { display: flex; gap: 8px; margin-top: 12px; }

    @media (max-width: 860px) {
      body { padding-left: 10px; padding-right: 10px; }
      .layout { grid-template-columns: 1fr; }
      .task { position: static; }
      .term { height: 62vh; min-height: 380px; }
      .topbar { padding-right: 130px; }
      .stats { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 520px) {
      .topbar { padding-right: 0; padding-top: 44px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="index.html" class="pill-btn" data-i18n="nav_home">🏠 Главная</a>
    <button class="pill-btn" id="namesBtn" data-i18n="btn_names">👥 Участники</button>
  </div>

  <div class="headline">
    <h1 class="app-title">&gt;_ TERMINAL QUEST<span class="cursor"></span></h1>
  </div>

  <div class="layout">
    <aside class="task" id="taskPanel">
      <div class="task-head">
        <span class="round-pill" id="roundPill">Раунд 1/10</span>
        <span class="task-status" id="taskStatus"></span>
      </div>
      <div class="progress" id="progress"></div>
      <div id="taskBody">
        <div class="task-meta" id="taskMeta"></div>
        <div class="task-title" id="taskTitle"></div>
        <div class="task-goal" id="taskGoal"></div>
        <div class="task-actions">
          <button class="btn hint" id="hintBtn">💡 <span data-i18n="btn_hint">Подсказка</span> <span id="hintCount"></span></button>
          <button class="btn next" id="nextBtn" hidden><span data-i18n="btn_next">Дальше</span> ▶</button>
        </div>
        <div class="hints" id="hints"></div>
      </div>
      <div class="stats">
        <div class="stat st-cmds" id="statCmds"><i>⌨️</i><b id="stCmds">0</b><span data-i18n="st_cmds">команд</span></div>
        <div class="stat st-hints" id="statHints"><i>💡</i><b id="stHints">0</b><span data-i18n="st_hints">подсказок</span></div>
        <div class="stat st-hool" id="statHool"><i>🚨</i><b id="stHool">0</b><span data-i18n="st_hool">хулиганств</span></div>
      </div>
    </aside>

    <section class="term" id="term">
      <div class="term-bar">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="term-title" id="termTitle">dev@randomhost: ~ — bash</div>
        <div style="width:52px"></div>
      </div>
      <div class="term-body" id="termBody"></div>
      <div class="term-input-row" id="inputRow">
        <span class="ps" id="prompt"></span>
        <input class="term-input" id="termInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal">
      </div>
    </section>
  </div>

  <div class="modal-bg" id="namesModal">
    <div class="modal">
      <h3 data-i18n="names_title">👥 Участники</h3>
      <p data-i18n="names_desc">По одному имени на строку. Из этого списка берутся ведущий дейлика, владелец контейнера и виновник в git blame. Список общий с другими рандомайзерами.</p>
      <textarea id="namesArea"></textarea>
      <div class="modal-actions">
        <button class="btn" id="namesCancel" data-i18n="btn_cancel">Отмена</button>
        <button class="btn next" id="namesSave" data-i18n="btn_save">Сохранить и начать заново</button>
      </div>
    </div>
  </div>

  <script>

    function startRound(i) {
      roundIdx = i;
      roundDone = false;
      lastOut = '';
      flags = {};
      installed = new Set();
      procs = [{ pid: 1, name: 'systemd', cpu: 0.0, mem: 0.1, cmd: '/sbin/init' }, { pid: 812, name: 'slack', cpu: 2.1, mem: 12.4, cmd: 'slack' }];
      git = null;
      containers = null;
      prevCwd = HOME;
      mkRoot();
      const R = localizeRound(i);
      let built;
      try { built = BUILDERS[i](R); } catch (e) { console.error('round build failed', e); built = { check: () => false }; }
      ROUND = Object.assign({ data: R }, built);
      renderTask();
      saveProgress();
      termBody.innerHTML = '';
      printSys(fill(t('round_intro').replace('{n}', i + 1).replace('{title}', R.title), roles));
      printHtml(`<span class="line sys">${escapeHtml(fill(R.goal_plain, roles))}</span>`);
      printSys(t('type_help'));
      updatePrompt();
    }
    function localizeRound(i) {
      const R = JSON.parse(JSON.stringify(t('rounds')[i]));
      const walk = (o) => { for (const k in o) { if (typeof o[k] === 'string') o[k] = fill(o[k], roles); else if (o[k] && typeof o[k] === 'object') walk(o[k]); } };
      walk(R);
      if (R.hints) {
        const extra = Object.assign({}, R.dirs || {}, { name_real: (R.files || {}).name_real || '' });
        R.hints = R.hints.map(h => h.replace(/\{(newfolder|newfolder2|newfolder3|name_real)\}/g, (m, k) => extra[k] || m));
      }
      return R;
    }
    function checkRound() {
      if (roundDone) return;
      let ok = false;
      try { ok = ROUND.check(); } catch (e) { ok = false; }
      if (!ok) return;
      roundDone = true;
      const R = ROUND.data;
      let msg = fill(R.success, roles);
      const extra = ROUND.extra && ROUND.extra();
      if (extra) msg += '\n' + fill(extra, roles);
      markDone();
      let resultHtml = '';
      try {
        const res = ROUND.result ? ROUND.result() : null;
        if (res) {
          const body = escapeHtml(String(res.text || '').replace(/\n$/, ''));
          const hi = res.highlight ? body.split(escapeHtml(res.highlight)).join('<b>' + escapeHtml(res.highlight) + '</b>') : body;
          resultHtml = `<div class="win-result-label">${escapeHtml(res.label || t('result_label'))}</div><div class="win-result">${hi}</div>`;
        }
      } catch (e) {}
      printHtml(`<div class="win-banner"><div class="win-title">🏆 ${escapeHtml(t('win_title'))}</div>${resultHtml}<div class="win-msg">${escapeHtml(msg)}</div><div class="win-next">${escapeHtml(roundIdx === BUILDERS.length - 1 ? t('press_finish') : t('press_next'))}</div></div>`);
      saveProgress();
      nextBtn.focus();
    }
    function markDone() {
      roundDone = true;
      nextBtn.hidden = false;
      hintBtn.disabled = true;
      const st = document.getElementById('taskStatus'); st.textContent = t('task_status_done'); st.classList.add('done');
      document.getElementById('taskPanel').classList.add('done');
      progressRender();
      if (roundIdx === BUILDERS.length - 1) nextBtn.innerHTML = `🏆 ${escapeHtml(t('btn_finish'))}`;
    }
    function restoreHints(n) {
      const R = ROUND.data;
      for (let k = hintsEl.children.length; k < Math.min(n, R.hints.length); k++) appendHint(k);
    }
    function appendHint(k) {
      const R = ROUND.data;
      const div = document.createElement('div');
      div.className = 'hint';
      div.innerHTML = `<b>${t('hint_label')} ${k + 1}</b>${fill(R.hints[k], rolesHtml())}`;
      hintsEl.appendChild(div);
      hintCount.textContent = `(${k + 1}/${R.hints.length})`;
      if (k + 1 >= R.hints.length) hintBtn.disabled = true;
    }
    function rolesHtml() { const o = {}; for (const k in roles) if (typeof roles[k] === 'string') o[k] = escapeHtml(roles[k]); return o; }
    function nextRound() {
      if (!roundDone) return;
      if (roundIdx + 1 >= BUILDERS.length) { showFinal(); return; }

    function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function printHtml(html) { const d = document.createElement('div'); d.innerHTML = html; while (d.firstChild) termBody.appendChild(d.firstChild); termBody.scrollTop = termBody.scrollHeight; }
    function printLine(text, cls) { if (text === '') return; printHtml(`<div class="line ${cls}">${escapeHtml(text.replace(/\n$/, ''))}</div>`); }
    function printSys(text) { printLine(text, 'sys'); }
    function promptHtml() { return `<span class="ps">dev@randomhost:<span class="path">${escapeHtml(pretty(cwd))}</span>$</span>`; }
    function updatePrompt() { promptEl.innerHTML = promptHtml(); termTitle.textContent = `dev@randomhost: ${pretty(cwd)} — bash`; }

    function submit(raw) {
      const line = raw.trim();
      printHtml(`<div class="line cmd">${promptHtml()} ${escapeHtml(raw)}</div>`);

      stats.cmds++;
      let results;
      try { results = execLine(line); }
      catch (e) { results = [{ err: String(e) }]; }
      results.forEach(r => {
        if (r.hooligan) scold(r.hooligan, r.pkg);
        else if (r.sys) printSys(r.sys);
        else if (r.html !== undefined) printHtml(`<div class="line out">${r.html.replace(/\n$/, '')}</div>`);
        else if (r.err !== undefined) printLine(r.err, 'err');
        else if (r.out !== undefined) printLine(r.out, 'out');
      });
      updatePrompt();
      renderStats();
      checkRound();
      saveProgress();
    }
    function scold(kind, pkg) {
      stats.hool++;
      const pool = t('scold')[kind] || t('scold').generic;
      let msg = pool[Math.floor(Math.random() * pool.length)];
      msg = fill(msg, roles).replace('{pkg}', pkg || '');
      const streak = t('scold_streak');
      if (stats.hool >= 3 && streak && Math.random() < 0.5) msg += '\n' + fill(streak[Math.min(streak.length - 1, stats.hool - 3)], roles);
      printHtml(`<div class="line scold">🚨 ${escapeHtml(msg)}</div>`);
      termEl.classList.remove('shake'); void termEl.offsetWidth; termEl.classList.add('shake');
      renderStats();
      const sh = document.getElementById('statHool'); sh.classList.remove('bump'); void sh.offsetWidth; sh.classList.add('bump');
    }
    function renderStats() {
      document.getElementById('stCmds').textContent = stats.cmds;
      document.getElementById('stHints').textContent = stats.hints;
      document.getElementById('stHool').textContent = stats.hool;
      document.getElementById('statCmds').classList.toggle('on', stats.cmds > 0);
      document.getElementById('statHints').classList.toggle('on', stats.hints > 0);
      document.getElementById('statHool').classList.toggle('on', stats.hool > 0);
    }
    function progressRender() {
      const p = document.getElementById('progress');
      p.innerHTML = BUILDERS.map((_, i) => `<i class="${i < roundIdx || (i === roundIdx && roundDone) ? 'done' : i === roundIdx ? 'cur' : ''}"></i>`).join('');
    }
    function renderTask() {
      const R = ROUND.data;
      document.getElementById('roundPill').textContent = t('round_pill').replace('{n}', roundIdx + 1).replace('{total}', BUILDERS.length);
      document.getElementById('taskTitle').textContent = fill(R.title, roles);
      document.getElementById('taskMeta').innerHTML = `<span class="key">OPS-${101 + roundIdx}</span><span class="sep">·</span><span>${escapeHtml(t('task_from'))} ${escapeHtml(roles.lead)}</span>`;
      const st = document.getElementById('taskStatus'); st.textContent = t('task_status_open'); st.classList.remove('done');
      document.getElementById('taskPanel').classList.remove('done');
      document.getElementById('taskGoal').innerHTML = fill(R.goal, rolesHtml());
      hintsEl.innerHTML = '';
      hintCount.textContent = `(0/${R.hints.length})`;
      hintBtn.disabled = false;
      nextBtn.hidden = true;
      nextBtn.innerHTML = `<span>${escapeHtml(t('btn_next'))}</span> ▶`;
      progressRender();
      renderStats();
    }
    function showHint() {
      const R = ROUND.data;
      const shown = hintsEl.children.length;
      if (shown >= R.hints.length || roundDone) return;
      stats.hints++;
      appendHint(shown);
      renderStats();
      saveProgress();
    }
    function showFinal() {
      const mins = Math.max(1, Math.round((Date.now() - stats.started) / 60000));
      const ranks = t('ranks');
      let rank;
      if (stats.hool === 0 && stats.hints === 0) rank = ranks[0];
      else if (stats.hool === 0) rank = ranks[1];
      else if (stats.hool <= 2) rank = ranks[2];
      else if (stats.hool <= 5) rank = ranks[3];
      else rank = ranks[4];
      document.getElementById('taskBody').innerHTML = `
        <div class="final">
          <div class="rank-emoji">${rank.emoji}</div>
          <div class="rank">${escapeHtml(fill(rank.title, roles))}</div>
          <p>${escapeHtml(fill(rank.desc, roles))}</p>
          <div class="final-stats">
            <div><b>${stats.cmds}</b><span>${escapeHtml(t('st_cmds'))}</span></div>
            <div><b>${mins}</b><span>${escapeHtml(t('st_mins'))}</span></div>
            <div><b style="color:var(--amber)">${stats.hints}</b><span>${escapeHtml(t('st_hints'))}</span></div>
            <div><b style="color:var(--red)">${stats.hool}</b><span>${escapeHtml(t('st_hool'))}</span></div>
          </div>
          <button class="btn next" id="againBtn" style="width:100%">🔁 ${escapeHtml(t('btn_again'))}</button>
        </div>`;
      document.getElementById('roundPill').textContent = t('round_done_pill');
      { const st = document.getElementById('taskStatus'); st.textContent = t('task_status_done'); st.classList.add('done'); }
      document.getElementById('taskPanel').classList.add('done');
      hintBtn.disabled = true;
      roundIdx = BUILDERS.length; progressRender();
      termBody.innerHTML = '';
      printHtml(`<div class="line" style="color:var(--amber);white-space:pre">${escapeHtml(TROPHY)}</div><div class="line win">${escapeHtml(fill(t('final_term'), roles))}</div>`);
      printSys(fill(rank.title, roles) + ' — ' + t('final_thanks'));
      document.getElementById('inputRow').style.display = 'none';
      try { localStorage.removeItem(PROGRESS_KEY); } catch (e) {}
      document.getElementById('againBtn').addEventListener('click', () => { try { localStorage.removeItem(PROGRESS_KEY); } catch (e) {} location.reload(); });
    }
    function saveProgress() {
      try { localStorage.setItem(PROGRESS_KEY, JSON.stringify({ round: roundIdx, done: roundDone, hintsShown: hintsEl.children.length, stats: { cmds: stats.cmds, hints: stats.hints, hool: stats.hool, started: stats.started }, roles })); } catch (e) {}
    }
    function loadProgress() {
      try {
        const p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
        if (!p || typeof p.round !== 'number' || p.round >= BUILDERS.length || !p.roles) return null;
        return p;
      } catch (e) { return null; }
    }

    // tab completion
    function complete() {
      const val = termInput.value;
      const beforeCursor = val.slice(0, termInput.selectionStart);
      const m = beforeCursor.match(/(?:^|[\s|;&])((?:[^\s"'\\]|\\.)*)$/);
      if (!m) return;
      const word = m[1].replace(/\\(.)/g, '$1');
      const isFirst = /^\s*(sudo\s+)?(?:[^\s"'\\]|\\.)*$/.test(beforeCursor) && !beforeCursor.slice(0, -word.length).trim().match(/\S$/);
      let cands = [];
      if (isFirst && !word.includes('/')) cands = Object.keys(CMDS).concat(['apt', 'sudo']).filter(c => c.startsWith(word)).map(c => c + ' ');
      else {
        const dirPart = word.includes('/') ? word.slice(0, word.lastIndexOf('/') + 1) : '';
        const namePart = word.slice(dirPart.length);
        const d = get(dirPart || '.');
        if (!d || d.type !== 'dir') return;
        cands = Object.keys(d.children).filter(k => k.startsWith(namePart) && (namePart.startsWith('.') || !k.startsWith('.'))).sort()
          .map(k => dirPart + k + (d.children[k].type === 'dir' ? '/' : ' '));
      }
      if (!cands.length) return;
      let common = cands[0];
      cands.forEach(c => { let i = 0; while (i < common.length && i < c.length && common[i] === c[i]) i++; common = common.slice(0, i); });
      if (cands.length > 1 && common.length <= word.length) {
        printHtml(`<div class="line cmd">${promptHtml()} ${escapeHtml(val)}</div><div class="line out">${cands.map(c => escapeHtml(c.trim().split('/').filter(Boolean).pop() + (c.endsWith('/') ? '/' : ''))).join('  ')}</div>`);
        return;
      }
      const escaped = common.replace(/ (?!$)/g, '\\ ').replace(/([()])/g, '\\$1');
      const start = beforeCursor.length - m[1].length;
      termInput.value = val.slice(0, start) + escaped + val.slice(beforeCursor.length);
      const pos = start + escaped.length;
      termInput.setSelectionRange(pos, pos);
    }

    termInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { const v = termInput.value; termInput.value = ''; submit(v); }
      else if (e.key === 'Tab') { e.preventDefault(); complete(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (histPos > 0) { histPos--; termInput.value = history[histPos]; } }
      else if (e.key === 'ArrowDown') { e.preventDefault(); if (histPos < history.length - 1) { histPos++; termInput.value = history[histPos]; } else { histPos = history.length; termInput.value = ''; } }
      else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); termBody.innerHTML = ''; }
      else if (e.key === 'c' && e.ctrlKey) { e.preventDefault(); printHtml(`<div class="line cmd">${promptHtml()} ${escapeHtml(termInput.value)}^C</div>`); termInput.value = ''; }
    });
    termBody.addEventListener('click', () => { if (!window.getSelection().toString()) termInput.focus(); });
    hintBtn.addEventListener('click', () => { showHint(); termInput.focus(); });
    nextBtn.addEventListener('click', nextRound);

    // participants modal
    const modal = document.getElementById('namesModal');
    const area = document.getElementById('namesArea');
    document.getElementById('namesBtn').addEventListener('click', () => { area.value = loadNames().join('\n'); modal.classList.add('open'); area.focus(); });
    document.getElementById('namesCancel').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
    document.getElementById('namesSave').addEventListener('click', () => {
      const names = area.value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, MAX_PARTICIPANTS);
      if (names.length < 2) { area.focus(); return; }
      try { localStorage.setItem(NAMES_KEY, JSON.stringify(names)); localStorage.removeItem(PROGRESS_KEY); } catch (e) {}
      location.reload();
    });

    // ============================================================
    //  Boot
    // ============================================================
    let booted = false;
    function boot() {
      const saved = loadProgress();
      if (saved) {
        roles = saved.roles;
        Object.assign(stats, saved.stats);
        if (saved.done && saved.round + 1 >= BUILDERS.length) { roundIdx = saved.round; roundDone = true; ROUND = { data: localizeRound(roundIdx) }; renderTask(); showFinal(); booted = true; return; }
        startRound(saved.done ? saved.round + 1 : saved.round);
        if (!saved.done) restoreHints(saved.hintsShown || 0);
        printSys(t('resumed'));
      } else {
        roles = pickRoles();
        startRound(0);
      }
      booted = true;
    }
    window.addEventListener('langchange', () => {
      if (!booted) { boot(); return; }
      if (roundIdx >= BUILDERS.length) return;
      const shown = hintsEl.children.length;
      if (roundDone) { ROUND.data = localizeRound(roundIdx); renderTask(); restoreHints(shown); markDone(); return; }
      // Rebuild the current round in the new language (file contents are localized).
      startRound(roundIdx);
      restoreHints(shown);
      printSys(t('lang_switched'));
    });
    // i18n.js is deferred and fires langchange before load; this only runs if it failed to load.
    window.addEventListener('load', () => { if (!booted) boot(); });
  })();
  </script>
