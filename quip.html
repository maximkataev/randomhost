<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Вопрос ребром — игра в смешные ответы для компании</title>
<meta name="robots" content="index,follow">

<!-- ссылки на комнаты (?r=КОД) — та же страница: в выдаче должна быть одна, без кода -->
<link rel="canonical" href="https://randomhost.online/quip.html">

<meta property="og:description" content="На экране вопрос, каждый с телефона пишет самый смешной ответ, потом все голосуют. Бесплатно, в браузере.">
<meta property="og:url" content="https://randomhost.online/quip.html">
<meta property="og:site_name" content="Рандомайзер Онлайн">
<meta property="og:locale" content="ru_RU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- неблокирующий шрифт. Dela Gothic One — вывеска шоу, M PLUS Rounded 1c — всё остальное; обе покрывают кириллицу и греческий -->
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet"></noscript>
<style>
  /* Мир: субботний прайм-тайм, телеигра в студии (подробно — в начале <style> у quip-board.html).
     Пульт — это кнопки участника за стойкой: оранжевый задник с лучами, белые таблички с бирюзовым торцом,
     бордовая вывеска вопроса в лампочках, толстые аркадные кнопки, которые физически нажимаются.
     Ведущий Ребрик — жёлтый кубик на ребре — встречает на входе и объявляет раунды. */
  :root {
    --or: #ff8a3d;
    --or-2: #ff7a2f;
    --deep: #3d0b16;
    --deep-2: #561425;
    --deep-3: #72203a;
    --ink: #2a0810;
    --bulb: #ffe14d;
    --bulb-edge: #c98a00;
    --teal: #12b8a6;
    --teal-edge: #0a7a6f;
    --teal-ink: #064d46;
    --pink: #ff2e74;
    --pink-edge: #a3103f;
    --mint: #3ee6a8;
    --tile: #fffaf3;
    --tile-muted: #8a5a50;
    --text: #fff6ec;
    --muted: #f5c3b0;
    --ok: #3ee6a8;
    --bad: #ff2e74;
    --font: "M PLUS Rounded 1c", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", sans-serif;
    --show: "Dela Gothic One", "M PLUS Rounded 1c", "Arial Black", system-ui, sans-serif;
    --boing: cubic-bezier(.34, 1.56, .64, 1);
    --snap: cubic-bezier(.2, .9, .3, 1.2);
    --lang-switch-bg: var(--deep);
    --lang-switch-border: rgba(255, 225, 77, .45);
    --lang-switch-fg: var(--text);
    --lang-switch-active-bg: var(--bulb);
    --lang-switch-active-fg: var(--ink);
    --lang-switch-active-border: var(--bulb);
    --lang-switch-font: var(--font);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--or-2); color: var(--ink); font: 500 17px/1.35 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  /* задник студии: лучи + свет по центру. Отдельный fixed-слой: background-attachment: fixed на телефонах не работает */
  .stagefx { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
    background: radial-gradient(ellipse 80% 45% at 50% 30%, rgba(255, 226, 140, .5), transparent 70%),
      repeating-conic-gradient(from 0deg at 50% 30%, var(--or) 0 9deg, var(--or-2) 9deg 18deg); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  .hidden { display: none !important; }
  /* справа — место под переключатель языка из i18n.js (--lsw меряет quip-shared.js) */
  .util { display: flex; align-items: center; gap: 12px; height: calc(var(--lsc, 30px) * 2); padding: 0 var(--lsw, 150px) 0 14px; }
  /* ссылка «все игры» не переносится на вторую строку (греческая длинная) — обрезается */
  .util a { color: var(--ink); text-decoration: none; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sound-toggle-btn { flex: none; width: calc(var(--lsh, 44px) * 1.25); height: var(--lsh, 44px); border: 2px solid rgba(255, 225, 77, .45); border-radius: 999px; background: var(--deep); color: var(--text); font-size: 17px; display: grid; place-items: center; padding: 0; }
  .conn { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 30; background: var(--pink); color: #fff; font-weight: 900; padding: 7px 14px; visibility: hidden; white-space: nowrap; border-radius: 999px; }
  .conn.on { visibility: visible; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; background: var(--deep); color: #fff; font-weight: 900; padding: 12px 18px; max-width: calc(100% - 32px); visibility: hidden; border-radius: 16px; box-shadow: 0 6px 0 var(--ink); }
  .toast.on { visibility: visible; animation: toast .35s var(--boing); }
  @keyframes toast { from { transform: translate(-50%, 30px) scale(.9); } }
  /* overflow-x: clip — «хлопок» крупных надписей (scale) не расширяет страницу: на телефоне это сдвигало переключатель языка за край */
  /* экран пульта = сцена (то, что сейчас происходит) + стойка участника, прижатая к низу:
     реакции под большим пальцем и табличка с именем и очками. Пустое поле под контентом
     становится расстоянием до стойки, а не дырой; на экране ответа стойка идёт после формы — клавиатуре не мешает */
  #app { overflow-x: clip; max-width: 520px; margin: 0 auto; padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); min-height: calc(100vh - var(--lsc, 30px) * 2); min-height: calc(100dvh - var(--lsc, 30px) * 2); display: flex; flex-direction: column; }
  .stage { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 16px; min-width: 0; }
  #app.top .stage { justify-content: flex-start; padding-top: 6px; }
  .console { flex: none; display: grid; gap: 14px; padding-top: 20px; }
  .plate { display: flex; align-items: center; gap: 12px; min-width: 0; background: var(--deep); color: #fff; border-radius: 16px 16px 10px 10px; padding: 14px 14px 10px; box-shadow: inset 0 7px 0 var(--pc, var(--teal)), 0 6px 0 var(--ink); }
  .plate .puck { font-size: 20px; }
  .plate b { flex: 1; min-width: 0; font-weight: 900; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plate .sc { flex: none; display: grid; justify-items: end; gap: 3px; font: 400 22px/1 var(--show); color: var(--bulb); font-variant-numeric: tabular-nums; }
  .plate .sc small { font: 900 11px/1 var(--font); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .plate .rm { flex: none; font: 400 12px/1 var(--show); letter-spacing: .1em; color: var(--muted); }

  /* логотип шоу: белые буквы с выдавленным торцом — розовым, потом бордовым */
  .sign { font: 400 42px/1.1 var(--show); color: #fff; letter-spacing: .01em; margin: 0; overflow-wrap: anywhere;
    text-shadow: .02em .02em 0 var(--pink), .04em .04em 0 var(--pink), .06em .06em 0 var(--pink), .08em .08em 0 var(--ink), .1em .1em 0 var(--ink), .12em .12em 0 var(--ink); }
  .sign.sm { font-size: 30px; }
  @media (prefers-reduced-motion: no-preference) { .sign.flick { animation: wiggle 7s ease-in-out infinite; transform-origin: 20% 60%; } }
  @keyframes wiggle { 0%, 88%, 100% { transform: rotate(0); } 91% { transform: rotate(-3deg) scale(1.04); } 94% { transform: rotate(2deg); } 97% { transform: rotate(-1deg); } }

  /* ведущий Ребрик */
  .rebrik { display: block; overflow: visible; flex: none; }
  .rebrik .h-body { transform-origin: 108px 226px; transform-box: view-box; }
  .rebrik .h-eyes { transform-origin: 108px 92px; transform-box: view-box; }
  .rebrik .h-arm { transform-origin: 42px 128px; transform-box: view-box; }
  @media (prefers-reduced-motion: no-preference) {
    .rebrik .h-body { animation: teeter 2.6s ease-in-out infinite; }
    .rebrik .h-eyes { animation: blink 4.2s infinite; }
    .rebrik .h-arm { animation: mic 1.3s ease-in-out infinite alternate; }
  }
  @keyframes teeter { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes mic { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }

  /* кнопки — аркадные: толстые, с торцом, нажимаются вниз. Жёлтая — главная, бирюзовая — «подсказка» */
  .btn { display: block; width: 100%; border: 0; border-radius: 18px; background: var(--bulb); color: var(--ink); font: 400 22px/1.1 var(--show); padding: 17px 14px 18px; box-shadow: 0 7px 0 var(--bulb-edge); text-align: center; text-decoration: none; transition: transform .08s, box-shadow .08s; margin-bottom: 7px; }
  .btn:not(:disabled):active { transform: translateY(6px); box-shadow: 0 1px 0 var(--bulb-edge); }
  .btn:disabled { background: #d7a894; box-shadow: 0 7px 0 #a0705f; color: var(--deep); opacity: 1; }
  .btn.ghost { background: var(--teal); color: #fff; box-shadow: 0 7px 0 var(--teal-edge); font: 900 19px/1.15 var(--font); }
  .btn.ghost:not(:disabled):active { box-shadow: 0 1px 0 var(--teal-edge); }
  .btn.ghost:disabled { background: #c49a8a; box-shadow: 0 7px 0 #8e6456; color: var(--deep); }
  /* второе нажатие — «точно?»: розовая, дрожит */
  .btn.ghost.sure { background: var(--pink); box-shadow: 0 7px 0 var(--pink-edge); color: #fff; }
  @media (prefers-reduced-motion: no-preference) { .btn.ghost.sure { animation: shake .45s ease-in-out 2; } }
  @keyframes shake { 20% { transform: translateX(-5px) rotate(-1deg); } 40% { transform: translateX(5px) rotate(1deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  .link { background: none; border: 0; color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; padding: 6px; font-weight: 900; }

  /* табличка: белое лицо, бирюзовый торец */
  .card { position: relative; background: var(--tile); color: var(--ink); border-radius: 18px; padding: 16px 18px; box-shadow: 0 7px 0 var(--teal-edge); }
  .card .k { font: 800 13px/1.2 var(--font); color: var(--tile-muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
  .card .k:empty { display: none; }
  .card .q { font: 900 23px/1.22 var(--font); overflow-wrap: anywhere; }
  .card .q .scene { display: block; font-size: 60px; line-height: 1.1; letter-spacing: .08em; text-align: center; padding: 6px 0; }
  /* вопрос — бордовая вывеска в рамке лампочек, как на общем экране */
  .card.qcard { background: var(--deep); color: #fff; box-shadow: 0 7px 0 var(--ink), inset 0 0 0 5px var(--deep-2); padding: 20px 22px; }
  .card.qcard::before { content: ""; position: absolute; inset: 5px; border: 4px dotted var(--bulb); border-radius: 14px; pointer-events: none; }
  .card.qcard .k { color: var(--bulb); }
  .items { margin: 0; padding-left: 22px; }
  .items li + li { margin-top: 2px; }

  .eyebrow { color: var(--ink); font-weight: 900; font-size: 15px; }
  .lede { margin: 0; color: var(--ink); font-size: 18px; font-weight: 800; }
  .lede b { background: var(--bulb); padding: 0 .2em; border-radius: 5px; white-space: nowrap; }
  .rules { margin: 0; padding: 0; list-style: none; counter-reset: r; display: grid; gap: 8px; font-weight: 800; }
  .rules li { counter-increment: r; display: flex; gap: 10px; align-items: flex-start; }
  .rules li::before { content: counter(r); flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--deep); color: var(--bulb); font: 400 14px/1 var(--show); }
  .fine { color: var(--ink); font-size: 14px; font-weight: 800; }
  .center { text-align: center; }

  /* стартовый экран: логотип и Ребрик рядом */
  .hero { display: flex; align-items: center; gap: 10px; }
  .hero .rebrik { width: clamp(84px, 26vw, 120px); height: auto; }
  .hero .sign { font-size: clamp(34px, 11vw, 50px); }

  /* вход */
  .enter .room { display: inline-block; font: 400 15px/1 var(--show); letter-spacing: .12em; background: var(--bulb); color: var(--ink); padding: 7px 12px; border-radius: 8px; box-shadow: 0 3px 0 var(--bulb-edge); }
  .enter h2 { margin: 12px 0 10px; font: 400 26px/1.15 var(--show); }
  .enter input { width: 100%; border: 0; border-bottom: 4px solid var(--teal); background: transparent; color: var(--ink); font: 900 28px/1.2 var(--font); padding: 4px 0; border-radius: 0; }
  .enter input:focus { outline: none; border-bottom-color: var(--pink); }
  .err { min-height: 22px; color: var(--deep); font-weight: 900; }

  /* участники */
  .players { display: flex; flex-wrap: wrap; gap: 8px; }
  .pl { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--deep); color: #fff; font-weight: 900; font-size: 15px; max-width: 100%; }
  .pl b { font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pl.me { background: var(--bulb); color: var(--ink); }
  .pl.off { opacity: .55; }
  .av { font-style: normal; font-size: 18px; line-height: 1; }
  /* аватар: эмодзи в кружке цвета игрока с белым ободком */
  .puck { flex: none; display: inline-grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--pc, var(--teal)); box-shadow: 0 0 0 .12em #fff; font-style: normal; line-height: 1; }
  .pl .puck { font-size: 15px; }
  .me-badge { display: flex; align-items: center; gap: 14px; }
  .me-badge .puck { font-size: 34px; box-shadow: 0 0 0 4px #fff, 0 6px 0 4px var(--ink); }
  .me-badge b { font: 400 26px/1.1 var(--show); display: block; overflow-wrap: anywhere; color: #fff; text-shadow: 2px 2px 0 var(--ink); }

  .status h2 { margin: 0 0 4px; font: 400 26px/1.15 var(--show); }
  .status p { margin: 0; color: var(--ink); font-weight: 800; }
  .card.status p { color: var(--tile-muted); }
  .card.status .rebrik { width: 84px; height: auto; float: right; margin: -6px -4px 0 8px; }
  /* «твой ответ» / «твой голос»: жёлтая табличка, как выпавшая подсказка */
  .card.mine { background: var(--bulb); box-shadow: 0 7px 0 var(--bulb-edge); }
  .card.mine .k { color: var(--deep); }
  .card.qcard.sm { padding: 16px 20px; }
  .card.qcard.sm .q { font-size: 19px; }
  .card.qcard.sm .q .scene { font-size: 44px; padding: 0; }

  /* ответ */
  .ahead { display: flex; justify-content: space-between; align-items: center; font-weight: 900; color: var(--ink); font-size: 16px; }
  #tleft { display: inline-grid; place-items: center; min-width: 58px; height: 32px; padding: 0 8px; border-radius: 999px; background: var(--deep); color: var(--bulb); font: 400 15px/1 var(--show); font-variant-numeric: tabular-nums; }
  #tleft:empty { visibility: hidden; }
  .timer { height: 14px; background: var(--deep); border-radius: 7px; overflow: hidden; padding: 3px; }
  .timer i { display: block; height: 100%; border-radius: 4px; background: var(--bulb); transform-origin: 0 50%; }
  .timer.hot i { background: var(--pink); }
  .write textarea, .write input { width: 100%; background: var(--tile); border: 0; border-radius: 16px; padding: 12px 14px; font: 800 20px/1.3 var(--font); color: var(--ink); resize: none; box-shadow: 0 6px 0 var(--teal-edge); }
  .write textarea::placeholder, .write input::placeholder { color: #b58f84; }
  .write textarea:focus, .write input:focus { outline: none; box-shadow: 0 6px 0 var(--teal-edge), 0 0 0 4px var(--bulb); }
  .write textarea { height: 104px; }
  .write .three { display: grid; gap: 12px; }
  .write .three label { display: flex; align-items: center; gap: 10px; font: 400 16px/1 var(--show); color: var(--bulb); }
  .write .three label::before { content: none; }
  .write .three input { font-size: 18px; padding: 11px 12px; }
  .write .cnt { text-align: right; color: var(--ink); font-size: 13px; font-weight: 900; height: 18px; margin-top: 4px; }
  .num { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--deep); color: var(--bulb); font: 400 16px/1 var(--show); }
  .row2 { display: grid; gap: 10px; margin-top: 4px; }
  .dice { display: inline-block; letter-spacing: .1em; }
  /* подсказка переворачивается вокруг ребра */
  .flip { perspective: 900px; }
  .flip .card { transform-origin: 50% 100%; background: var(--bulb); box-shadow: 0 7px 0 var(--bulb-edge); }
  .flip .card .k { color: var(--deep); }
  @media (prefers-reduced-motion: no-preference) { .flip.go .card { animation: flip .7s var(--boing); } }
  @keyframes flip { 0% { transform: rotateX(-110deg); } 100% { transform: rotateX(0); } }
  .gotit { font: 900 22px/1.25 var(--font); overflow-wrap: anywhere; }
  .tag { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--bulb); font-size: 15px; vertical-align: middle; }

  /* голосование: таблички-кнопки. Выбранная — жёлтая с галочкой, своя — бледная с пометкой */
  .opts { display: grid; gap: 14px; }
  .opt { position: relative; text-align: left; background: var(--tile); color: var(--ink); border: 0; border-radius: 16px; padding: 14px 14px 14px 56px; min-height: 60px; font: 900 19px/1.3 var(--font); box-shadow: 0 6px 0 var(--teal-edge); overflow-wrap: anywhere; transition: transform .15s var(--boing), background .15s; }
  .opt .l { position: absolute; left: 12px; top: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--bulb); color: var(--ink); font: 400 15px/32px var(--show); text-align: center; box-shadow: 0 3px 0 var(--bulb-edge); }
  .opt.sel { background: var(--bulb); box-shadow: 0 6px 0 var(--bulb-edge), 0 0 0 4px var(--ink); transform: translateY(-2px) rotate(-.6deg); }
  .opt.sel .l { background: var(--ink); color: var(--bulb); box-shadow: none; }
  .opt.sel::after { content: "✓"; position: absolute; right: -8px; top: -10px; width: 32px; height: 32px; border-radius: 50%; background: var(--mint); color: var(--ink); font: 900 20px/32px var(--font); text-align: center; box-shadow: 0 0 0 3px var(--ink); }
  .opt.own { opacity: .55; box-shadow: 0 6px 0 #9c7a70; }
  /* «Голосую» всегда под пальцем: при 8–9 ответах по три пункта кнопка уезжала на 2–3 экрана вниз */
  #votebtn { position: sticky; bottom: 12px; z-index: 5; }
  .opt.own::after { content: attr(data-own); position: absolute; right: 10px; top: 8px; font: 900 11px/1 var(--font); text-transform: uppercase; background: var(--deep); color: #fff; padding: 4px 7px; border-radius: 999px; }
  .opt:not(:disabled):active { transform: translateY(4px); box-shadow: 0 2px 0 var(--teal-edge); }
  .opt .items { padding-left: 18px; }

  /* раскрытие */
  .res { display: grid; gap: 12px; }
  .res .r { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: start; background: var(--tile); border-radius: 14px; padding: 12px 14px 10px 16px; box-shadow: inset 7px 0 0 var(--pc, var(--tile-muted)), 0 5px 0 var(--teal-edge); font-weight: 900; }
  .res .r.win { background: var(--bulb); box-shadow: inset 7px 0 0 var(--pc, var(--tile-muted)), 0 5px 0 var(--bulb-edge), 0 0 0 3px var(--ink); }
  .res .r .t { overflow-wrap: anywhere; }
  .res .r .who { grid-column: 1 / -1; color: var(--tile-muted); font-size: 14px; font-weight: 800; }
  .res .r.win .who { color: var(--deep); }
  .res .r .p { font: 400 17px/1 var(--show); background: var(--deep); color: var(--bulb); padding: 6px 8px; border-radius: 8px; white-space: nowrap; }

const player = (id) => state && state.players.find((p) => p.id === id);
const mine = () => (state && me ? player(me) : null);
const avHtml = (p) => `<i class="av puck" style="--pc:${escapeHtml(p.color || "")}">${escapeHtml(p.avatar)}</i>`;

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), 2200);
}
// o.reacts — на стойке кнопки реакций; o.cls — класс сцены. Стойка есть только у вошедшего в идущую игру
function show(html, key, top, o) {
  o = o || {};
  screenKey = key;
  app.classList.toggle("top", !!top);
  const p = state && me && state.phase !== "lobby" ? mine() : null;
  const plate = p ? `<div class="plate" style="--pc:${escapeHtml(p.color || "")}">${avHtml(p)}<b>${escapeHtml(p.name)}</b><span class="rm">${escapeHtml(CODE)}</span><span class="sc"><small>${escapeHtml(T("score_k"))}</small>${p.score}</span></div>` : "";
  app.innerHTML = `<div class="stage${o.cls ? " " + o.cls : ""}">${html}</div>${plate ? `<div class="console">${o.reacts ? reactsHtml() : ""}${plate}</div>` : ""}`;
  if (typeof qpConfettiClear === "function") qpConfettiClear();
  if (o.reacts) bindReacts();
}

// экран не гаснет, пока идёт игра (где поддерживается)
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && me) keepAwake(); });

// ---------- стартовый экран ----------
function renderLanding() {
  screen = "landing";
  show(`<div class="l-head"><div class="eyebrow">${T("eyebrow")}</div><div class="hero">${qpHostSvg()}<h1 class="sign flick">${T("game_name")}</h1></div></div>
    <p class="lede">${T("lede")}</p>
    <div class="sample" aria-hidden="true">
      <div class="card qcard"><div class="k">${T("sample_k")}</div><div class="q">${T("sample_q")}</div></div>
      <div class="card a"><span class="coins">${"<i>😂</i>".repeat(5)}</span><div class="k">${T("sample_ak")}</div><div class="q">${T("sample_a")}</div></div>
    </div>
    <div class="l-cta"><button class="btn" id="create" type="button">${T("btn_create")}</button>
      <div class="fine center" style="margin-top:8px">${T("cta_sub")}</div>
      <div class="fine center"><button class="link" id="havecode" type="button">${T("have_code")}</button></div></div>
    <ol class="rules"><li>${T("rule1")}</li><li>${T("rule2")}</li><li>${T("rule3")}</li></ol>`, "landing", false, { cls: "landing" });
  document.getElementById("create").onclick = async () => {
    const btn = document.getElementById("create");
    btn.disabled = true;
    btn.textContent = T("btn_creating");
    try {
      const res = await fetch("/quip/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: qpLang() } }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "error");
      try { localStorage.setItem("quip-host-" + data.code, data.hostToken); } catch (e) {}
      location.href = `quip-board.html?r=${data.code}`;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = T("btn_create");
      toast(String(err.message || err));
    }
  };
  document.getElementById("havecode").onclick = () => {
    const c = prompt(T("prompt_code"));
    if (c) location.href = `quip.html?r=${encodeURIComponent(c.trim().toUpperCase())}`;
  };
}

// ---------- вход ----------
function renderEnter() {
  screen = "enter";
  let saved = "";
  try { saved = localStorage.getItem("quip-name") || ""; } catch (e) {}
  show(`<form class="enter" id="enterform" autocomplete="off" style="display:grid;gap:14px">
    <div class="card"><div class="room">${escapeHtml(CODE)}</div><h2>${T("enter_title")}</h2>
      <input id="name" maxlength="16" placeholder="${escapeHtml(T("enter_ph"))}" value="${escapeHtml(saved)}" enterkeyhint="go" aria-label="${escapeHtml(T("enter_ph"))}"></div>
    <div class="err" id="err">${joinErr ? escapeHtml(T(joinErr)) : ""}</div>
    <button class="btn" type="submit">${T("btn_join")}</button>
  </form>`, "enter");
  const input = document.getElementById("name");

}
function renderExpired() {

  screen = "expired";
  try { localStorage.removeItem(tokenKey()); } catch (e) {}
  renderCenter("expired_title", "expired_text", `<a class="btn" style="margin-top:14px" href="quip.html">${T("expired_new")}</a>`);

// ---------- общие куски ----------
function playersHtml() {
  return `<div class="players">${state.players.filter((p) => !p.left).map((p) => `<span class="pl${p.id === me ? " me" : ""}${p.online ? "" : " off"}" style="--pc:${p.color}">${avHtml(p)}<b>${escapeHtml(p.name)}</b></span>`).join("")}</div>`;
}
function reactsHtml() {
  return `<div class="reacts">${REACTIONS.map((e) => `<button type="button" data-e="${e}" aria-label="${e}">${e}</button>`).join("")}</div>`;

function bindReacts() {

    b.onclick = () => { conn.send({ type: "react", emoji: b.dataset.e }); qpVibrate(8); b.disabled = true; setTimeout(() => (b.disabled = false), 2000); };

function meBadge() {

  return `<div class="me-badge">${avHtml(p)}<div><span class="eyebrow">${T("lobby_in")}</span><b>${escapeHtml(p.name)}</b></div></div>`;

const timerHtml = () => `<div class="timer" id="timer"><i></i></div>`;

// ---------- экраны по фазам ----------
function renderLobby() {
  const key = "lobby:" + state.players.map((p) => p.id + p.online).join(",") + qpLang();
  if (screenKey === key) return;
  show(`${meBadge()}<div class="status"><p>${T("lobby_wait")}</p></div>${playersHtml()}${reactsHtml()}
    <div class="card howcard"><div class="k">${T("how_k")}</div><ul><li>${T("how_fast")}</li><li>${T("rule2")}</li><li>${T("rule3")}</li></ul></div>`, key, true);

function renderIntro() {
  const key = "intro:" + state.ri + qpLang();
  if (screenKey === key) return;
  const small = state.small;
  show(`<div class="center"><div class="pill">${escapeHtml(tpl("intro_k", { n: state.ri + 1, m: state.plan.length }))}</div>
    <h1 class="sign" style="margin-top:14px">${escapeHtml(qpRoundName(state.roundKey, small))}</h1>
    <p class="lede" style="margin-top:12px">${escapeHtml(qpRoundDesc(state.roundKey, small))}</p>
    <div class="introrow">${qpHostSvg()}${state.mult > 1 ? `<div class="burst"><span>${escapeHtml(tpl("mult", { n: state.mult }))}</span></div>` : ""}</div></div>`, key);
}

function renderAnswer() {
  const s = state.me;
  if (!s || !s.inRound) {
    const key = "late:" + state.ri + qpLang();
    if (screenKey === key) return;
    show(`<div class="card status"><h2>${T("late_title")}</h2><p style="margin:0;color:var(--tile-muted)">${T("late_sub")}</p></div>`, key, false, { reacts: true });
    return;
  }
  const list = s.prompts;
  const cur = list.find((p) => !p.done);
  // только что вытянутая подсказка: показываем карточку, пока игрок не нажмёт «дальше» или не истечёт пауза
  const flipped = justHinted && list.find((p) => p.id === justHinted && p.done);
  if (flipped) {
    hintSeen = flipped.id;
    const key = "hinted:" + flipped.id + qpLang();
    if (screenKey === key) return;
    show(`<div class="ahead"><span>${escapeHtml(tpl("q_of", { i: list.indexOf(flipped) + 1, n: list.length }))}</span><span id="tleft"></span></div>${timerHtml()}
      <div class="card qcard"><div class="k">${escapeHtml(flipped.prompt.e ? T("r_emoji") : "")}</div><div class="q">${qpPromptHtml(flipped.prompt)}</div></div>
      <div class="flip go"><div class="card"><div class="k">${T("got_hint")}</div><div class="gotit">${qpAnswerHtml(flipped.answer)}</div></div></div>`, key, true);
    qpSfx.flip();
    clearTimeout(renderAnswer.t);
    renderAnswer.t = setTimeout(() => { justHinted = null; screenKey = ""; render(); }, 1800);
    return;
  }
  if (!cur) {
    const key = "done:" + state.ri + qpLang();
    if (screenKey === key) return;
    show(`<div class="status center"><h2>${T("done_title")}</h2><p>${T("done_sub")}</p></div>
      <div class="opts">${list.map((p) => `<div class="card"><div class="k">${qpPromptHtml(p.prompt.e ? { q: p.prompt.e } : p.prompt)}</div><div class="gotit">${qpAnswerHtml(p.answer)} ${p.hint ? `<span class="tag">🎲</span>` : ""}</div></div>`).join("")}</div>`, key, true, { reacts: true });
    return;
  }
  const key = "ans:" + cur.id + ":" + s.hintsLeft + ":" + (hintArmed === cur.id) + qpLang();
  if (screenKey === key) return;
  const final = cur.deck === "final";
  const d = drafts[cur.id] || (final ? ["", "", ""] : "");
  const hintLabel = s.hintsLeft <= 0 ? T("btn_hint_none") : hintArmed === cur.id ? T("btn_hint_sure") : tpl("btn_hint", { n: s.hintsLeft });
  const promptKind = cur.prompt.e ? T("r_emoji") : "";
  show(`<div class="ahead"><span class="left">${escapeHtml(tpl("q_of", { i: list.indexOf(cur) + 1, n: list.length }))}</span><span id="tleft"></span></div>${timerHtml()}
    <div class="card qcard"><div class="k">${escapeHtml(promptKind)}</div><div class="q">${qpPromptHtml(cur.prompt)}</div></div>
    <form class="write" id="write" autocomplete="off">
      ${final
        ? `<div class="three">${[0, 1, 2].map((i) => `<label><span class="num">${i + 1}</span><input maxlength="${ITEM}" data-i="${i}" value="${escapeHtml(d[i] || "")}" placeholder="${escapeHtml(tpl("ph_item", { n: i + 1 }))}" enterkeyhint="${i < 2 ? "next" : "send"}"></label>`).join("")}</div>`
        : `<textarea id="ta" maxlength="${LIMIT}" placeholder="${escapeHtml(T(cur.prompt.e ? "ph_caption" : "ph_answer"))}" enterkeyhint="send" aria-label="${escapeHtml(T("ph_answer"))}">${escapeHtml(d)}</textarea><div class="cnt" id="cnt"></div>`}
      <div class="row2"><button class="btn" type="submit" id="sendbtn">${T("btn_send")}</button>
      <button class="btn ghost${hintArmed === cur.id ? " sure" : ""}" type="button" id="hintbtn"${s.hintsLeft <= 0 ? " disabled" : ""}>${escapeHtml(hintLabel)}</button></div>
    </form>`, key, true);
  const form = document.getElementById("write");
  const cnt = document.getElementById("cnt");
  if (final) {
    const inputs = [...form.querySelectorAll("input")];
    inputs.forEach((inp, i) => {
      inp.oninput = () => { drafts[cur.id] = inputs.map((x) => x.value); };
      inp.onkeydown = (e) => { if (e.key === "Enter" && i < 2) { e.preventDefault(); inputs[i + 1].focus(); } };
    });
    const first = inputs.find((x) => !x.value) || inputs[0];
    if (!matchMedia("(pointer: coarse)").matches) first.focus();
  } else {
    const ta = document.getElementById("ta");
    const upd = () => { drafts[cur.id] = ta.value; cnt.textContent = ta.value.length > LIMIT - 20 ? `${ta.value.length}/${LIMIT}` : ""; };
    ta.oninput = upd;
    ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.onsubmit(e); } };
    upd();
    if (!matchMedia("(pointer: coarse)").matches) ta.focus();
  }
  form.onsubmit = (e) => {
    e.preventDefault();
    const val = drafts[cur.id];
    const ans = final ? (val || []).map((x) => String(x || "").trim()) : String(val || "").trim();
    if (final ? !ans.some(Boolean) : !ans) { toast(T("rj_empty")); return; }
    if (final && ans.filter(Boolean).length < 3) { toast(T("rj_need_three")); return; }
    conn.send({ type: "answer", mid: cur.id, ans });
    qpSfx.send();
    qpVibrate(15);
    document.getElementById("sendbtn").disabled = true;
    hintArmed = null;
  };
  document.getElementById("hintbtn").onclick = () => {
    if (hintArmed !== cur.id) { hintArmed = cur.id; screenKey = ""; return render(); }
    hintArmed = null;
    justHinted = cur.id;
    conn.send({ type: "hint", mid: cur.id });
    qpVibrate([10, 30, 10]);
  };
}

function renderVote() {
  const s = state.me, c = state.current;
  if (!c || !c.answers) return;
  // подсказку вытянул последним — фаза ответов кончилась раньше, чем перевернулась карточка: покажем, что выпало
  if (justHinted && hintSeen !== justHinted) {
    const mineA = c.answers.find((a) => a.mine);
    if (mineA) toast(T("got_hint") + " " + (mineA.items ? mineA.items.join(" / ") : mineA.text));
    justHinted = null;
  }
  const voted = s && (s.voted || sentVote === c.id);
  const key = "vote:" + c.id + ":" + voted + ":" + (s && s.canVote) + ":" + picks.join(",") + qpLang();
  if (screenKey === key) return;
  const promptSm = `<div class="card qcard sm"><div class="q">${qpPromptHtml(c.prompt)}</div></div>`;
  const mineCard = (label, list) => (list.length ? `<div class="card mine"><div class="k">${escapeHtml(label)}</div>${list.map((a) => `<div class="gotit">${qpAnswerHtml(a)}</div>`).join("")}</div>` : "");
  if (s && s.author && c.kind === "duel") {
    show(`${timerHtml()}<div class="card status">${qpHostSvg()}<h2>${T("author_title")}</h2><p style="margin:0;color:var(--tile-muted)">${T("author_sub")}</p></div>
      ${promptSm}${mineCard(T("your_answer"), c.answers.filter((a) => a.mine))}`, key, true, { reacts: true });
    return;
  }
  if (voted || !s || !s.canVote) {
    const picked = voted ? picks.map((i) => c.answers[i]).filter(Boolean) : [];
    show(`${timerHtml()}<div class="card status">${qpHostSvg()}<h2>${T(voted ? "voted_title" : "novote_title")}</h2><p style="margin:0;color:var(--tile-muted)">${T(voted ? "voted_sub" : "novote_sub")}</p></div>
      ${promptSm}${mineCard(T("your_vote"), picked)}`, key, true, { reacts: true });
    return;
  }
  const n = s.votesFor;
  // отмеченное до перезагрузки/переподключения — с сервера
  if (!picks.length && s.myDraft) picks = s.myDraft.slice();
  show(`${timerHtml()}${s.inRound ? "" : `<div class="eyebrow">${escapeHtml(T("late_vote"))}</div>`}<div class="card qcard"><div class="k">${T("vote_title")}</div><div class="q" style="font-size:19px">${qpPromptHtml(c.prompt)}</div></div>
    <div class="eyebrow">${escapeHtml(n > 1 ? tpl("vote_many", { n }) : T("vote_one"))}</div>
    <div class="opts">${c.answers.map((a, i) => `<button type="button" class="opt${a.mine ? " own" : ""}${picks.includes(i) ? " sel" : ""}" data-i="${i}" data-own="${escapeHtml(T("own"))}"${a.mine ? " disabled" : ""}><span class="l">${String.fromCharCode(65 + i)}</span>${qpAnswerHtml(a)}</button>`).join("")}</div>
    ${n > 1 ? `<button class="btn" type="button" id="votebtn"${picks.length ? "" : " disabled"}>${escapeHtml(tpl("btn_vote", { n: `${picks.length}/${n}` }))}</button>` : ""}`, key, true);
  app.querySelectorAll(".opt:not(.own)").forEach((b) => {
    b.onclick = () => {
      const i = Number(b.dataset.i);
      qpSfx.tap();
      if (n === 1) { picks = [i]; sendVote(c.id); return; }
      picks = picks.includes(i) ? picks.filter((x) => x !== i) : picks.length < n ? picks.concat(i) : picks;
      // выбрал все N — голос уходит сам; иначе отметка идёт на сервер черновиком и засчитается по таймеру
      if (picks.length === n) { sendVote(c.id); return; }
      conn.send({ type: "vote", mid: c.id, picks, draft: true });
      render();
    };
  });
  const vb = document.getElementById("votebtn");
  if (vb) vb.onclick = () => sendVote(c.id);
}
function sendVote(mid) {
  if (!picks.length) return;
  conn.send({ type: "vote", mid, picks });
  sentVote = mid;
  qpVibrate(15);
  qpSfx.send();
  render();
}

function renderReveal() {
  const c = state.current;
  if (!c || !c.result) return;
  const key = "rev:" + c.id + qpLang();
  if (screenKey === key) return;
  const r = c.result;
  const myIdx = c.answers.findIndex((a) => a.playerId === me);
  let head = "";
  if (myIdx >= 0) head = r.jinx.includes(me) ? `<div class="stamp">${T("you_jinx")}</div>` : `<div class="big">${escapeHtml(tpl("you_got", { n: r.points[myIdx] }))}</div>`;
  const rows = c.answers.map((a, i) => {
    const p = player(a.playerId) || {};
    const jin = r.jinx.includes(a.playerId);
    const tags = [a.hint && !a.late ? `🎲 ${T("hint_mark")}` : "", a.late ? `🐌 ${T("late_mark")}` : "", jin ? T("jinx") : "", r.sweep === a.playerId ? T("sweep") : ""].filter(Boolean).join(" · ");
    return `<div class="r${r.winners.includes(a.playerId) ? " win" : ""}" style="--pc:${p.color || "#777"};--i:${(i * 0.08).toFixed(2)}s"><div class="t">${qpAnswerHtml(a)}</div><div class="p">${escapeHtml(tpl("pts", { n: r.points[i] }))}</div>
      <div class="who">${escapeHtml(p.avatar || "")} ${escapeHtml(p.name || "?")} · ${escapeHtml(qpVotes(r.tally[i]))}${tags ? " · " + escapeHtml(tags) : ""}</div></div>`;
  }).join("");
  show(`${head ? `<div class="center">${head}</div>` : ""}<div class="eyebrow">${T("reveal_title")}</div><div class="card qcard sm"><div class="q">${qpPromptHtml(c.prompt)}</div></div><div class="res">${rows}</div>`, key, true, { reacts: true });
}

// места с ничьими и порядок — как на доске (qpRanked)
function standing() {
  const list = qpRanked(state.players);
  const p = list.find((x) => x.id === me) || mine();
  return { list, place: p.place || 1, p };

function renderScores() {
  const key = "scores:" + state.ri + qpLang();
  if (screenKey === key) return;
  const { list, place, p } = standing();
  show(`<div class="center"><div class="eyebrow">${escapeHtml(tpl("scores_title", { n: state.ri + 1 }))}</div>
    <div class="big" style="margin:10px 0">${escapeHtml(qpPlace(place))}</div><div class="lede">${escapeHtml(p.avatar)} ${escapeHtml(p.name)} · <b>${p.score}</b></div></div>${setlistHtml(list)}`, key, true, { reacts: true });

function renderFinal() {
  const key = "final:" + state.game + ":" + state.finishedReason + qpLang();
  if (screenKey === key) return;
  const { list, place, p } = standing();
  const sub = state.finishedReason === "few" ? T("final_few") : state.finishedReason === "host" ? T("final_host") : T("final_sub");
  show(`<div class="center"><h1 class="sign sm">${T("final_title")}</h1>
    <div class="big" style="margin:14px 0 6px">${escapeHtml(qpPlace(place))}</div>
    <div class="lede">${escapeHtml(p.avatar)} ${escapeHtml(p.name)} · <b>${p.score}</b></div>
    <p class="fine">${escapeHtml(sub)}</p></div>${setlistHtml(list)}`, key, true, { reacts: true });
  if (place === 1 && state.finishedReason === "done") setTimeout(() => qpConfetti({ mode: "rain", n: 120 }), 300);
}

// ---------- выбор экрана ----------
function render() {
  if (dead || !state) return;
  if (!me) {
    if (screen === "kicked" || screen === "replaced" || screen === "enter") return;
    return renderEnter();
  }
  if (!mine()) return renderEnter();
  screen = "game";
  switch (state.phase) {
    case "lobby": return renderLobby();
    case "intro": return renderIntro();
    case "answer": return renderAnswer();
    case "vote": return renderVote();
    case "reveal": return renderReveal();
    case "scores": return renderScores();
    case "finished": return renderFinal();
  }
}

// таймер фазы: полоска и секунды; последние 5 с — красным и с тиканьем
let lastTickSec = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead || !state.phaseEnd) return;
  const now = qpNow();
  const left = state.phaseEnd - now;
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const bar = document.getElementById("timer");
  if (bar) {
    bar.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`;
    bar.classList.toggle("hot", left < 5000);
  }
  const tl = document.getElementById("tleft");
  if (tl) tl.textContent = tpl("sec", { s: Math.max(0, Math.ceil(left / 1000)) });
  if ((state.phase === "answer" || state.phase === "vote") && left < 5000 && left > 0) {
    const sec = Math.ceil(left / 1000);
    if (sec !== lastTickSec) { lastTickSec = sec; qpSfx.tick(true); }
  }
}

window.addEventListener("langchange", () => {
  if (!CODE) return renderLanding();
  if (screen === "enter") return renderEnter();
  screenKey = "";
  screen === "expired" ? renderExpired() : render();
});

// ---------- связь ----------
let prevPhase = null, prevMid = null;
function onMessage(m) {
  switch (m.type) {
    case "hello":
    case "state":
      state = m.state;
      if (m.type === "hello" && token && !me) conn.send({ type: "join", token });
      // язык пульта — язык комнаты, если человек сам его не выбирал (иначе телефон с русской
      // локалью в греческой комнате показывал русский интерфейс при греческих вопросах)
      if (m.type === "hello" && !langPicked && state.settings && window.I18N && I18N.setLang && state.settings.lang !== qpLang()) { langPicked = true; I18N.setLang(state.settings.lang); }
      // новая схватка — сбрасываем выбор
      if (state.current && state.current.id !== prevMid) { picks = []; prevMid = state.current.id; }
      if (state.phase !== prevPhase) {
        if (state.phase === "answer") { hintArmed = null; justHinted = null; }
        if (state.phase === "vote" || state.phase === "answer") qpVibrate(30);
        prevPhase = state.phase;
      }
      render();
      break;
    case "joined":
      me = m.playerId;
      token = m.token;
      joinErr = null;
      try { localStorage.setItem(tokenKey(), token); } catch (e) {}
      keepAwake();
      screen = null;
      screenKey = "";
      render();
      break;
    case "rejected":
      if (m.action === "hint") { justHinted = null; screenKey = ""; }
      if (m.action === "vote") { sentVote = null; screenKey = ""; }
      if (m.action === "answer") screenKey = "";
      if (T("rj_" + m.reason) !== "rj_" + m.reason) toast(T("rj_" + m.reason));
      render();
      break;
    case "error":
      if (m.error === "room_expired") return renderExpired();
      if (["room_full", "token_gone", "bad_name"].includes(m.error)) {
        if (m.error === "token_gone") { try { localStorage.removeItem(tokenKey()); } catch (e) {} token = null; }
        joinErr = m.error === "bad_name" ? "err_name" : "err_" + m.error;
        me = null;
        renderEnter();
      }
      break;
    case "kicked":
      me = null;
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
      token = null;
      screen = "kicked";
      renderCenter("kicked_title");
      break;
    case "replaced":
      me = null;
      screen = "replaced";
      renderCenter("replaced_title", "replaced_text", `<button class="btn" style="margin-top:14px" id="here" type="button">${T("btn_back_here")}</button>`);
      document.getElementById("here").onclick = () => { conn.send({ type: "join", token }); };
      break;
    case "event": {
      const e = m.event;
      if (e.type === "reveal") {
        if (e.sweep) qpSfx.sweep();
        // твой разгром — хлопушка и на телефоне
        if (e.sweep && e.sweep === me) setTimeout(() => qpConfetti({ y: innerHeight * 0.3, n: 90 }), 600);
        if (e.sweep === me || (e.winners || []).includes(me)) qpVibrate([40, 40, 80]);
      }
      if (e.type === "jinx") qpSfx.jinx();
      break;
    }
  }
}

function start() {
  if (!CODE) return renderLanding();
  renderCenter("wait_title");
  const banner = document.getElementById("conn");
  conn = qpConnect({
    code: CODE,
    onMessage,
    onGone: renderExpired,
    // переподключились — снова входим своим токеном (hello придёт первым)
    onOpen: () => { me = null; },
    onState: (st) => { banner.textContent = T("err_connect"); banner.classList.toggle("on", st === "lost"); },
  });
  requestAnimationFrame(frame);
  // ручка для стенда: состояние и отправка
  window.qpPhone = { send: (msg) => conn.send(msg), get state() { return state; }, get me() { return me; } };
}
start();
</script>
