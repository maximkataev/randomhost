<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- без maximum-scale: масштаб щипком нужен слабовидящим; поля ввода ≥ 16px, iOS при фокусе их не приближает.
     interactive-widget=resizes-content: клавиатура ужимает страницу (Chrome 108+), кнопки не уезжают под неё -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3d0b16">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f3a4.svg" type="image/svg+xml">
<title>Вопрос ребром — игра в смешные ответы для компании</title>
<meta name="robots" content="index,follow">
<meta name="description" content="🎤 Мультиплеерная игра для компании: на общем экране вопрос, каждый с телефона пишет самый смешной ответ или вытягивает вслепую подсказку, потом все голосуют. Как Quiplash, только бесплатно и в браузере." data-i18n-meta="_meta">
<!-- ссылки на комнаты (?r=КОД) — та же страница: в выдаче должна быть одна, без кода -->
<link rel="canonical" href="https://randomhost.online/quip.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Вопрос ребром — игра в смешные ответы для компании">
<meta property="og:description" content="На экране вопрос, каждый с телефона пишет самый смешной ответ, потом все голосуют. Бесплатно, в браузере.">
<meta property="og:url" content="https://randomhost.online/quip.html">
<meta property="og:site_name" content="Рандомайзер Онлайн">
<meta property="og:locale" content="ru_RU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- неблокирующий шрифт: одна гарнитура Commissioner (вариативная, кириллица и греческий нарисованы родные, не японские).
     Вывеска шоу — она же с осями FLAR/VOLM на максимум: расклёшенные засечки, как у заставок телешоу 70-х; текст — без них -->
<link href="https://fonts.googleapis.com/css2?family=Commissioner:FLAR,VOLM,wght@0..100,0..100,500..900&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Commissioner:FLAR,VOLM,wght@0..100,0..100,500..900&display=swap" rel="stylesheet"></noscript>
<style>
  /* Мир: субботний прайм-тайм, телеигра в студии (подробно — в начале <style> у quip-board.html).
     Пульт — это кнопки участника за стойкой: оранжевый задник с лучами, белые таблички с бирюзовым торцом,
     бордовая вывеска вопроса в лампочках, толстые аркадные кнопки, которые физически нажимаются.
     Ведущий Ребрик — жёлтый кубик на ребре — встречает на входе и объявляет раунды. */
  :root {
    --or: #ff8a3d;
    --or-2: #ff7a2f;
    --deep: #3d0b16;
    --deep-2: #561425;
    --deep-3: #72203a;
    --ink: #2a0810;
    --bulb: #ffe14d;
    --bulb-edge: #c98a00;
    --teal: #12b8a6;
    --teal-edge: #0a7a6f;
    --teal-ink: #064d46;
    --pink: #ff2e74;
    --pink-edge: #a3103f;
    --mint: #3ee6a8;
    --tile: #fffaf3;
    --tile-muted: #8a5a50;
    --text: #fff6ec;
    --muted: #f5c3b0;
    --ok: #3ee6a8;
    --bad: #ff2e74;
    --font: "Commissioner", system-ui, -apple-system, "Segoe UI", sans-serif;
    --show: "Commissioner", system-ui, sans-serif;
    --show-w: 900;
    --show-fvs: "FLAR" 100, "VOLM" 100;
    --boing: cubic-bezier(.34, 1.56, .64, 1);
    --snap: cubic-bezier(.2, .9, .3, 1.2);
    --lang-switch-bg: var(--deep);
    --lang-switch-border: rgba(255, 225, 77, .45);
    --lang-switch-fg: var(--text);
    --lang-switch-active-bg: var(--bulb);
    --lang-switch-active-fg: var(--ink);
    --lang-switch-active-border: var(--bulb);
    --lang-switch-font: var(--font);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--or-2); color: var(--ink); font: 500 17px/1.35 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  /* задник студии: лучи + свет по центру. Отдельный fixed-слой: background-attachment: fixed на телефонах не работает */
  .stagefx { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
    background: radial-gradient(ellipse 80% 45% at 50% 30%, rgba(255, 226, 140, .5), transparent 70%),
      repeating-conic-gradient(from 0deg at 50% 30%, var(--or) 0 9deg, var(--or-2) 9deg 18deg); }
  button, input, textarea { font: inherit; color: inherit; }
  /* <b> внутри жирного текста браузер делает «bolder» = 900, а 900 у Commissioner — уже почти вывеска. Выделение — 700 */
  b, strong { font-weight: 700; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  .hidden { display: none !important; }
  /* переключатель языка из i18n.js — fixed в углу; на пульте он уезжает вместе с шапкой, а не висит поверх ответов и вариантов при прокрутке */
  html .lang-switch { position: absolute; }
  /* справа — место под переключатель языка из i18n.js (--lsw меряет quip-shared.js) */
  .util { display: flex; align-items: center; gap: 12px; height: calc(var(--lsc, 30px) * 2); padding: 0 var(--lsw, 150px) 0 14px; }
  /* ссылка «все игры» не переносится на вторую строку (греческая длинная) — обрезается */
  .util a { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); text-decoration: none; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding: 0; }
  /* цели переключателя языка (i18n.js общий для сайта и ставит 36 px через !important) — не меньше 44 px на пульте (quip-034) */
  html .lang-switch button { min-height: 44px !important; min-width: 44px !important; padding: 4px 10px !important; }
  .sound-toggle-btn { flex: none; width: calc(var(--lsh, 44px) * 1.25); height: var(--lsh, 44px); border: 2px solid rgba(255, 225, 77, .45); border-radius: 999px; background: var(--deep); color: var(--text); font-size: 17px; display: grid; place-items: center; padding: 0; }
  /* баннер «нет связи»: под строкой с переключателем языка (--lsc — её центр), а не поверх него; клики сквозь */
  .conn { position: fixed; left: 50%; top: calc(var(--lsc, 30px) * 2 + 4px); transform: translateX(-50%); z-index: 30; background: var(--pink); color: #fff; font-weight: 700; padding: 7px 14px; visibility: hidden; max-width: calc(100% - 32px); text-align: center; border-radius: 16px; pointer-events: none; }
  .conn.on { visibility: visible; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; background: var(--deep); color: #fff; font-weight: 700; padding: 12px 18px; max-width: calc(100% - 32px); visibility: hidden; border-radius: 16px; box-shadow: 0 6px 0 var(--ink); }
  .toast.on { visibility: visible; animation: toast .35s var(--boing); }
  /* «Язык комнаты: EN. Переключить?» — поверх, ничего не сдвигает (правило «без скачков»); сам уходит через 12 с */
  .langhint { position: fixed; left: 12px; right: 12px; top: calc(var(--lsc, 30px) * 2 + 4px); z-index: 31; display: flex; align-items: center; gap: 8px; background: var(--deep); color: #fff; border-radius: 16px; padding: 8px 8px 8px 14px; box-shadow: 0 6px 0 var(--ink); font-weight: 700; }
  .langhint[hidden] { display: none; }
  .langhint span { flex: 1; min-width: 0; }
  .langhint button { flex: none; min-height: 44px; min-width: 44px; border: 0; border-radius: 12px; padding: 6px 12px; font: 700 15px/1.1 var(--font); }
  .langhint .yes { background: var(--bulb); color: var(--ink); }
  .langhint .no { background: transparent; color: #fff; text-decoration: underline; }
  @keyframes toast { from { transform: translate(-50%, 30px) scale(.9); } }
  /* overflow-x: clip — «хлопок» крупных надписей (scale) не расширяет страницу: на телефоне это сдвигало переключатель языка за край */
  /* экран пульта = сцена (то, что сейчас происходит) + стойка участника, прижатая к низу:
     реакции под большим пальцем и табличка с именем и очками. Пустое поле под контентом
     становится расстоянием до стойки, а не дырой; на экране ответа стойка идёт после формы — клавиатуре не мешает */
  #app { overflow-x: clip; max-width: 520px; margin: 0 auto; padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); min-height: calc(100vh - var(--lsc, 30px) * 2); min-height: calc(100dvh - var(--lsc, 30px) * 2); display: flex; flex-direction: column; }
  .stage { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 16px; min-width: 0; }
  #app.top .stage { justify-content: flex-start; padding-top: 6px; }
  .console { flex: none; display: grid; gap: 14px; padding-top: 20px; }
  .plate { display: flex; align-items: center; gap: 12px; min-width: 0; background: var(--deep); color: #fff; border-radius: 16px 16px 10px 10px; padding: 14px 14px 10px; box-shadow: inset 0 7px 0 var(--pc, var(--teal)), 0 6px 0 var(--ink); }
  .plate .puck { font-size: 20px; }
  .plate b { flex: 1; min-width: 0; font-weight: 700; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plate .sc { flex: none; display: grid; justify-items: end; gap: 3px; font: var(--show-w) 22px/1 var(--show); font-variation-settings: var(--show-fvs); color: var(--bulb); font-variant-numeric: tabular-nums; }
  .plate .sc small { font: 700 11px/1 var(--font); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .plate .rm { flex: none; font: var(--show-w) 12px/1 var(--show); font-variation-settings: var(--show-fvs); letter-spacing: .1em; color: var(--muted); }

  /* логотип шоу: белые буквы с выдавленным торцом — розовым, потом бордовым */
  .sign { font: var(--show-w) 42px/1.1 var(--show); font-variation-settings: var(--show-fvs); color: #fff; letter-spacing: 0; margin: 0; overflow-wrap: anywhere;
    text-shadow: .02em .02em 0 var(--pink), .04em .04em 0 var(--pink), .06em .06em 0 var(--pink), .08em .08em 0 var(--ink), .1em .1em 0 var(--ink), .12em .12em 0 var(--ink); }
  .sign.sm { font-size: 30px; }
  @media (prefers-reduced-motion: no-preference) { .sign.flick { animation: wiggle 7s ease-in-out infinite; transform-origin: 20% 60%; } }
  @keyframes wiggle { 0%, 88%, 100% { transform: rotate(0); } 91% { transform: rotate(-3deg) scale(1.04); } 94% { transform: rotate(2deg); } 97% { transform: rotate(-1deg); } }

  /* ведущий Ребрик */
  .rebrik { display: block; overflow: visible; flex: none; }
  .rebrik .h-body { transform-origin: 108px 226px; transform-box: view-box; }
  .rebrik .h-eyes { transform-origin: 108px 92px; transform-box: view-box; }
  .rebrik .h-arm { transform-origin: 42px 128px; transform-box: view-box; }
  @media (prefers-reduced-motion: no-preference) {
    .rebrik .h-body { animation: teeter 2.6s ease-in-out infinite; }
    .rebrik .h-eyes { animation: blink 4.2s infinite; }
    .rebrik .h-arm { animation: mic 1.3s ease-in-out infinite alternate; }
  }
  @keyframes teeter { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes mic { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }

  /* кнопки — аркадные: толстые, с торцом, нажимаются вниз. Жёлтая — главная, бирюзовая — «подсказка» */
  .btn { display: block; width: 100%; border: 0; border-radius: 18px; background: var(--bulb); color: var(--ink); font: var(--show-w) 22px/1.1 var(--show); font-variation-settings: var(--show-fvs); padding: 17px 14px 18px; box-shadow: 0 7px 0 var(--bulb-edge); text-align: center; text-decoration: none; transition: transform .08s, box-shadow .08s; margin-bottom: 7px; }
  .btn:not(:disabled):active { transform: translateY(6px); box-shadow: 0 1px 0 var(--bulb-edge); }
  .btn { min-height: 44px; }
  .btn:disabled { background: #d7a894; box-shadow: 0 7px 0 #a0705f; color: var(--deep); opacity: 1; }
  .btn.ghost { background: var(--teal); color: #fff; box-shadow: 0 7px 0 var(--teal-edge); font: 700 19px/1.15 var(--font); }
  .btn.ghost:not(:disabled):active { box-shadow: 0 1px 0 var(--teal-edge); }
  .btn.ghost:disabled { background: #c49a8a; box-shadow: 0 7px 0 #8e6456; color: var(--deep); }
  /* второе нажатие — «точно?»: розовая, дрожит */
  .btn.ghost.sure { background: var(--pink); box-shadow: 0 7px 0 var(--pink-edge); color: #fff; }
  @media (prefers-reduced-motion: no-preference) { .btn.ghost.sure { animation: shake .45s ease-in-out 2; } }
  @keyframes shake { 20% { transform: translateX(-5px) rotate(-1deg); } 40% { transform: translateX(5px) rotate(1deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  .link { background: none; border: 0; color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; padding: 6px; min-height: 44px; font-weight: 700; }

  /* табличка: белое лицо, бирюзовый торец */
  .card { position: relative; background: var(--tile); color: var(--ink); border-radius: 18px; padding: 16px 18px; box-shadow: 0 7px 0 var(--teal-edge); }
  .card .k { font: 600 13px/1.2 var(--font); color: var(--tile-muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
  .card .k:empty { display: none; }
  .card .q { font: 700 23px/1.22 var(--font); overflow-wrap: anywhere; }
  .card .q .given-k { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-bottom: 2px; }
  .card .q .blank { display: inline-block; min-width: 2.6em; height: .9em; margin: 0 .08em; border-bottom: .09em solid var(--bulb, currentColor); vertical-align: -.06em; }
  /* пропуск «___» не только в .q: на экране «ответы на сцене» вопрос лежит в .k, там черта пропадала (quip-022) */
  .blank { display: inline-block; min-width: 2em; height: .9em; margin: 0 .08em; border-bottom: .12em solid currentColor; vertical-align: -.06em; }
  .card .k .blank { min-width: 1.8em; }
  .card .q .scene { display: block; font-size: 60px; line-height: 1.1; letter-spacing: .08em; text-align: center; padding: 6px 0; }
  /* вопрос — бордовая вывеска в рамке лампочек, как на общем экране */
  .card.qcard { background: var(--deep); color: #fff; box-shadow: 0 7px 0 var(--ink), inset 0 0 0 5px var(--deep-2); padding: 20px 22px; }
  .card.qcard::before { content: ""; position: absolute; inset: 5px; border: 4px dotted var(--bulb); border-radius: 14px; pointer-events: none; }
  .card.qcard .k { color: var(--bulb); }
  .items { margin: 0; padding-left: 22px; }
  .items li + li { margin-top: 2px; }

  .eyebrow { color: var(--ink); font-weight: 700; font-size: 15px; }
  .lede { margin: 0; color: var(--ink); font-size: 18px; font-weight: 600; }
  .lede b { background: var(--bulb); padding: 0 .2em; border-radius: 5px; white-space: nowrap; }
  .rules { margin: 0; padding: 0; list-style: none; counter-reset: r; display: grid; gap: 8px; font-weight: 600; }
  .rules li { counter-increment: r; display: flex; gap: 10px; align-items: flex-start; }
  .rules li::before { content: counter(r); flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--deep); color: var(--bulb); font: var(--show-w) 14px/1 var(--show); font-variation-settings: var(--show-fvs); }
  .fine { color: var(--ink); font-size: 14px; font-weight: 600; }
  .center { text-align: center; }

  /* стартовый экран: логотип и Ребрик рядом */
  .hero { display: flex; align-items: center; gap: 10px; }
  .hero .rebrik { width: clamp(84px, 26vw, 120px); height: auto; }
  .hero .sign { font-size: clamp(40px, 13.5vw, 64px); line-height: 1; }

  /* вход */
  .enter .room { display: inline-block; font: var(--show-w) 15px/1 var(--show); font-variation-settings: var(--show-fvs); letter-spacing: .12em; background: var(--bulb); color: var(--ink); padding: 7px 12px; border-radius: 8px; box-shadow: 0 3px 0 var(--bulb-edge); }
  .enter h2 { margin: 12px 0 10px; font: var(--show-w) 26px/1.15 var(--show); font-variation-settings: var(--show-fvs); }
  .enter input { width: 100%; border: 0; border-bottom: 4px solid var(--teal); background: transparent; color: var(--ink); font: 700 28px/1.2 var(--font); padding: 4px 0; border-radius: 0; }
  .enter input:focus { outline: none; border-bottom-color: var(--pink); }
  /* счётчик имени «12/16» живёт в зарезервированном месте справа от поля: форма не прыгает (quip-030) */
  .enter .fld { position: relative; }
  .enter .fld input { padding-right: 64px; }
  .enter .ncnt { position: absolute; right: 0; bottom: 10px; font: 700 15px/1 var(--font); font-style: normal; color: var(--ink); pointer-events: none; }
  .enter .ncnt[data-state="full"] { color: var(--deep); }
  .claimbtns { display: grid; gap: 4px; margin-top: 14px; }
  /* поле кода комнаты (вместо prompt()) */
  .codeform { display: grid; gap: 8px; margin-top: 12px; }
  .codeform input { width: 100%; background: var(--tile); border: 0; border-radius: 16px; padding: 12px 14px; font: 700 22px/1.2 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); box-shadow: 0 6px 0 var(--teal-edge); }
  .codeform input:focus { outline: none; box-shadow: 0 6px 0 var(--teal-edge), 0 0 0 4px var(--bulb); }
  .codeform .btn { margin-bottom: 7px; }
  .err { min-height: 22px; color: var(--deep); font-weight: 700; }

  /* участники */
  .players { display: flex; flex-wrap: wrap; gap: 8px; }
  .pl { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--deep); color: #fff; font-weight: 700; font-size: 15px; max-width: 100%; }
  .pl b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pl.me { background: var(--bulb); color: var(--ink); }
  .pl.off { opacity: .55; }
  .pl .nc { font-style: normal; font-size: 13px; line-height: 1; }
  .av { font-style: normal; font-size: 18px; line-height: 1; }
  /* аватар: эмодзи в кружке цвета игрока с белым ободком */
  .puck { flex: none; display: inline-grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--pc, var(--teal)); box-shadow: 0 0 0 .12em #fff; font-style: normal; line-height: 1; }
  .pl .puck { font-size: 15px; }
  .me-badge { display: flex; align-items: center; gap: 14px; }
  /* своя аватарка — кнопка: тап открывает выбор (владелец, 27.09) */
  .me-badge .avbtn { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; }
  /* gap 6: на 375px восемь кружков выходят 37px, а не 35.9 — палец попадает */
  .avpick { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .avpick button { aspect-ratio: 1; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .85); font-size: 24px; line-height: 1; padding: 0; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
  .avpick button.on { background: var(--bulb); box-shadow: 0 0 0 3px #fff, 0 3px 0 rgba(0, 0, 0, .25); }
  .avpick button:disabled { opacity: .3; }
  @media (max-width: 360px) { .avpick { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .me-badge .puck { font-size: 34px; box-shadow: 0 0 0 4px #fff, 0 6px 0 4px var(--ink); }
  .me-badge b { font: var(--show-w) 26px/1.1 var(--show); font-variation-settings: var(--show-fvs); display: block; overflow-wrap: anywhere; color: #fff; text-shadow: 2px 2px 0 var(--ink); }

  .status h2 { margin: 0 0 4px; font: var(--show-w) 26px/1.15 var(--show); font-variation-settings: var(--show-fvs); }
  .status p { margin: 0; color: var(--ink); font-weight: 600; }
  .card.status p { color: var(--tile-muted); }
  .card.status .rebrik { width: 84px; height: auto; float: right; margin: -6px -4px 0 8px; }
  /* «твой ответ» / «твой голос»: жёлтая табличка, как выпавшая подсказка */
  .card.mine { background: var(--bulb); box-shadow: 0 7px 0 var(--bulb-edge); }
  .card.mine .k { color: var(--deep); }
  .card.qcard.sm { padding: 16px 20px; }

  /* ответ */

  #tleft:empty { visibility: hidden; }

  .write textarea, .write input { width: 100%; background: var(--tile); border: 0; border-radius: 16px; padding: 12px 14px; font: 600 20px/1.3 var(--font); color: var(--ink); resize: none; box-shadow: 0 6px 0 var(--teal-edge); }
  .write textarea::placeholder, .write input::placeholder { color: #b58f84; }
  .write textarea:focus, .write input:focus { outline: none; box-shadow: 0 6px 0 var(--teal-edge), 0 0 0 4px var(--bulb); }
  .write textarea { height: 104px; }
  .write .three { display: grid; gap: 12px; }
  .write .three label { display: flex; align-items: center; gap: 10px; font: var(--show-w) 16px/1 var(--show); font-variation-settings: var(--show-fvs); color: var(--bulb); }
  .write .three label::before { content: none; }
  .write .three input { font-size: 18px; padding: 11px 12px; min-height: 44px; }
  .write .three label { position: relative; }
  .write .three .icnt { position: absolute; right: 8px; top: -8px; font: 700 11px/1 var(--font); color: var(--bulb); background: var(--deep); padding: 3px 6px; border-radius: 999px; pointer-events: none; }
  .write .three .icnt:empty { display: none; }
  .write .cnt { text-align: right; color: var(--ink); font-size: 13px; font-weight: 700; height: 18px; margin-top: 4px; }
  /* «Ответили N из M»: высота занята всегда — текст появляется без сдвига соседей */
  .prog { margin: 6px 0 0; min-height: 20px; font: 700 14px/20px var(--font); color: var(--tile-muted); font-variant-numeric: tabular-nums; }
  .status.center .prog, .stage > .prog { color: var(--ink); }
  .num { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--deep); color: var(--bulb); font: var(--show-w) 16px/1 var(--show); font-variation-settings: var(--show-fvs); }
  .row2 { display: grid; gap: 10px; margin-top: 4px; }
  /* «Отправить» под тремя полями финала: у полей торец 6 px, при отступе 4 кнопка упиралась в третье (quip-033) */
  .write .three + .row2 { margin-top: 16px; }
  .dice { display: inline-block; letter-spacing: .1em; }
  /* подсказка переворачивается вокруг ребра */
  .flip { perspective: 900px; }

  .flip .card .k { color: var(--deep); }
  @media (prefers-reduced-motion: no-preference) { .flip.go .card { animation: flip .7s var(--boing); } }
  @keyframes flip { 0% { transform: rotateX(-110deg); } 100% { transform: rotateX(0); } }
  .gotit { font: 700 22px/1.25 var(--font); overflow-wrap: anywhere; }
  .gotit + .gotit { margin-top: 8px; padding-top: 8px; border-top: 3px dotted var(--bulb-edge); }
  .tag { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--bulb); font-size: 15px; vertical-align: middle; }

  /* голосование: таблички-кнопки. Выбранная — жёлтая с галочкой, своя — бледная с пометкой */
  .opts { display: grid; gap: 14px; }
  .opt { position: relative; text-align: left; background: var(--tile); color: var(--ink); border: 0; border-radius: 16px; padding: 14px 14px 14px 56px; min-height: 60px; font: 700 19px/1.3 var(--font); box-shadow: 0 6px 0 var(--teal-edge); overflow-wrap: anywhere; transition: transform .15s var(--boing), background .15s; }
  .opt .l { position: absolute; left: 12px; top: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--bulb); color: var(--ink); font: var(--show-w) 15px/32px var(--show); font-variation-settings: var(--show-fvs); text-align: center; box-shadow: 0 3px 0 var(--bulb-edge); }
  .opt.sel { background: var(--bulb); box-shadow: 0 6px 0 var(--bulb-edge), 0 0 0 4px var(--ink); transform: translateY(-2px) rotate(-.6deg); }
  .opt.sel .l { background: var(--ink); color: var(--bulb); box-shadow: none; }
  .opt.sel::after { content: "✓"; position: absolute; right: -8px; top: -10px; width: 32px; height: 32px; border-radius: 50%; background: var(--mint); color: var(--ink); font: 700 20px/32px var(--font); text-align: center; box-shadow: 0 0 0 3px var(--ink); }
  .opt.own { opacity: .55; box-shadow: 0 6px 0 #9c7a70; }
  /* «Голосую» всегда под пальцем: при 8–9 ответах по три пункта кнопка уезжала на 2–3 экрана вниз */
  #votebtn { position: sticky; bottom: 12px; z-index: 5; }
  /* запас под липкую кнопку: последний пункт при прокрутке не прячется под ней (quip-020) */
  .opts:has(+ #votebtn) { padding-bottom: 76px; }

  .opt.own::after { content: attr(data-own); position: absolute; right: 10px; top: -9px; font: 700 11px/1 var(--font); text-transform: uppercase; background: var(--deep); color: #fff; padding: 4px 7px; border-radius: 999px; }

  .res .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; background: var(--tile); border-radius: 14px; padding: 12px 14px 10px 16px; box-shadow: inset 7px 0 0 var(--pc, var(--tile-muted)), 0 5px 0 var(--teal-edge); font-weight: 700; }
  .res .r.win { background: var(--bulb); box-shadow: inset 7px 0 0 var(--pc, var(--tile-muted)), 0 5px 0 var(--bulb-edge), 0 0 0 3px var(--ink); }
  .res .r .t { overflow-wrap: anywhere; }
  /* свёрнутая карточка сетки финала: три пункта в одну строку через «·», не больше двух строк (quip-024) */
  .res .r.cmp { padding: 8px 12px 8px 14px; gap: 2px 10px; font-weight: 600; font-size: 16px; line-height: 1.25; }
  .res .r.cmp .t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .res .r.cmp .items { display: inline; margin: 0; padding: 0; list-style: none; }

  /* на 320–359 px бирка очков под текстом, а не сбоку: «+300» не отъедает ширину у пунктов и не переносит слова */
  @media (max-width: 359px) {
    .res .r { grid-template-columns: minmax(0, 1fr); }
    .res .r .p { justify-self: start; }
  }
  .res .r .who { grid-column: 1 / -1; color: var(--tile-muted); font-size: 14px; font-weight: 600; }
  .res .r.win .who { color: var(--deep); }
  .res .r .p { font: var(--show-w) 17px/1 var(--show); font-variation-settings: var(--show-fvs); background: var(--deep); color: var(--bulb); padding: 6px 8px; border-radius: 8px; white-space: nowrap; }
  .big { overflow-wrap: anywhere; max-width: 100%; font: var(--show-w) clamp(40px, 13vw, 62px)/1.05 var(--show); font-variation-settings: var(--show-fvs); color: #fff; text-shadow: .03em .03em 0 var(--pink), .06em .06em 0 var(--ink), .08em .08em 0 var(--ink); }
  .stamp { display: inline-block; font: var(--show-w) 26px/1 var(--show); font-variation-settings: var(--show-fvs); color: #fff; background: var(--pink); padding: 10px 16px 12px; border-radius: 12px; transform: rotate(-4deg); box-shadow: 0 6px 0 var(--pink-edge); }
  @media (prefers-reduced-motion: no-preference) {
    .big, .stamp { animation: slam .55s var(--boing) both; }
    .res .r { animation: slidein .45s var(--boing) both; animation-delay: var(--i, 0s); }
  }
  @keyframes slam { from { transform: scale(1.35) rotate(-6deg); opacity: .25; } }
  @keyframes slidein { from { transform: translateX(-40px); opacity: .25; } }

  /* табло: весь состав по местам — бордовая доска */
  .setlist { background: var(--deep); color: #fff; box-shadow: 0 7px 0 var(--ink); }
  .setlist .k { color: var(--bulb); }
  .setlist ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .setlist li { min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 34px; font-weight: 700; border-radius: 10px; padding: 0 6px; }
  .setlist li .n { font: var(--show-w) 15px/1 var(--show); font-variation-settings: var(--show-fvs); color: var(--bulb); width: 24px; flex: none; }
  .setlist li .puck { font-size: 14px; }
  .setlist li b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .setlist li .dots { flex: 1; min-width: 10px; border-bottom: 3px dotted rgba(255, 225, 77, .35); margin-top: 10px; }
  .setlist li .s { font: var(--show-w) 16px/1 var(--show); font-variation-settings: var(--show-fvs); font-variant-numeric: tabular-nums; }
  .setlist li.me { background: var(--bulb); color: var(--ink); position: sticky; top: 6px; bottom: 6px; z-index: 1; }
  .big.sm { font-size: clamp(26px, 8vw, 38px); }
  .setlist li.me .n { color: var(--ink); }
  .setlist li.me .dots { border-color: rgba(42, 8, 16, .35); }
  .howcard ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-weight: 600; }

  /* реакции — круглые кнопки пульта */
  .reacts { display: flex; justify-content: center; gap: 10px; }
  /* на 320px пять кнопок по 54 не влезали (310 > 288): пятая и очки на табличке обрезались. Сжимаются, оставаясь кругами */
  .reacts button { flex: 0 1 54px; min-width: 0; aspect-ratio: 1; border-radius: 50%; border: 0; background: var(--deep); font-size: 26px; box-shadow: 0 5px 0 var(--ink); transition: transform .1s; }
  .reacts button:not(:disabled):active { transform: translateY(4px) scale(.94); box-shadow: 0 1px 0 var(--ink); }
  .reacts button:disabled { opacity: .5; }

  /* заставка раунда */
  .introrow { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 14px; }
  .introrow .rebrik { width: 120px; height: auto; }
  .burst { display: grid; place-items: center; width: 118px; height: 118px; background: var(--pink); color: #fff; font: var(--show-w) 44px/1 var(--show); font-variation-settings: var(--show-fvs);
    clip-path: polygon(50.0% 0.0%, 59.1% 10.0%, 71.7% 5.0%, 75.6% 17.9%, 89.1% 18.8%, 86.9% 32.2%, 98.7% 38.9%, 91.0% 50.0%, 98.7% 61.1%, 86.9% 67.8%, 89.1% 81.2%, 75.6% 82.1%, 71.7% 95.0%, 59.1% 90.0%, 50.0% 100.0%, 40.9% 90.0%, 28.3% 95.0%, 24.4% 82.1%, 10.9% 81.2%, 13.1% 67.8%, 1.3% 61.1%, 9.0% 50.0%, 1.3% 38.9%, 13.1% 32.2%, 10.9% 18.8%, 24.4% 17.9%, 28.3% 5.0%, 40.9% 10.0%); }
  .burst span { transform: rotate(-8deg); text-shadow: 0 4px 0 var(--pink-edge); }
  .pill { display: inline-block; background: var(--deep); color: var(--bulb); font: 700 14px/1 var(--font); padding: 8px 14px; border-radius: 999px; letter-spacing: .06em; text-transform: uppercase; }

  /* пример на стартовом экране: вопрос-вывеска и ответ-победитель с жетонами */
  .sample { display: grid; gap: 14px; }
  .sample .card { transform: rotate(-1.2deg); }
  .sample .card.a { transform: rotate(1.4deg); margin-left: 34px; background: var(--bulb); box-shadow: 0 7px 0 var(--bulb-edge); }
  .sample .card.a .k { color: var(--deep); }
  .sample .coins { position: absolute; right: 12px; top: -14px; display: flex; gap: 3px; }
  .sample .coins i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; font-style: normal; font-size: 15px; box-shadow: 0 3px 0 var(--bulb-edge); }

  /* узкий телефон: «← Все игры» не обрезается до «Все …» — кнопка звука квадратная, текст чуть мельче */
  @media (max-width: 359px) {
    .util { gap: 8px; padding-left: 10px; }
    .reacts { gap: 8px; }
    .util a { font-size: 15px; }
    .util .sound-toggle-btn { width: var(--lsh, 44px); }
  }
  /* повёрнутые таблички (пример на старте, штамп «джинкс») не выступают за колонку на 320px:
     у повёрнутого прямоугольника рамка шире на высоту × sin угла — оставляем под это место */
  .sample { padding-inline: 4px; }
  .stamp { max-width: calc(100% - 12px); }
  /* короткий экран телефона (SE с панелями Safari, 320×460 … 375×548): всё сжато, вид тот же.
     Порог — по max-height, размеры — в svh: при скрытии панелей Safari они не меняются, раскладка не прыгает */
  @media (max-height: 620px) and (max-width: 899px) {
    /* старт: кнопка «Открыть студию» сразу после описания, пример — под ней (иначе она на втором экране) */
    .stage.landing { gap: 14px; }
    .landing > .l-cta { order: 1; } .landing > .sample { order: 2; } .landing > .rules { order: 3; }
    .hero .rebrik { width: clamp(72px, 22vw, 110px); }
    .hero .sign { font-size: clamp(38px, 12vw, 56px); }
    .lede { font-size: 17px; }

    .stage { gap: 10px; }
    .ahead + .timer { margin-top: -2px; }
    .card.qcard { padding: 14px 18px; }
    .card.qcard::before { inset: 4px; }
    .card .q { font-size: 20px; line-height: 1.18; }
    .write textarea { height: clamp(64px, 17svh, 104px); }

    .write .cnt { height: 0; margin: 0; padding-right: 14px; transform: translateY(-26px); pointer-events: none; }
    .write .three { gap: 9px; }
    .write .three input { padding: 6px 12px; }
    .card .q .scene { font-size: 46px; padding: 2px 0; }
    /* переключатель языка стал 44 px: поднимаем его на 4 px, чтобы шапка осталась прежней высоты */
    html .lang-switch { top: 4px; }
    .row2 { margin-top: 10px; }
    .write .three + .row2 { margin-top: 12px; }

  @media (max-height: 500px) and (max-width: 899px) {
    .card.qcard { padding: 12px 16px; }
    .card .q { font-size: 18px; }

    .write .three { gap: 4px; }
    .row2 { margin-top: 8px; }
    .write .three + .row2 { margin-top: 6px; }
    .btn { padding: 10px 14px 11px; }
    /* заставка раунда, табло и итоги — без прокрутки: Ребрик и крупные надписи на ступень меньше */
    .introrow { margin-top: 6px; }
    .introrow .rebrik { width: 88px; }

    .big { font-size: clamp(34px, 11vw, 48px); }

  /* Низкие окна без привязки к ширине (T-W1-16, quip-017): ландшафт телефона 915×412, 844×390, 667×375 не попадал

  @media (max-height: 520px) {

    .ahead + .timer { margin-top: -2px; }
    .card.qcard { padding: 12px 18px; }
    .card.qcard::before { inset: 4px; }
    .card .q { font-size: 20px; line-height: 1.18; }
    .card .q .scene { font-size: 44px; padding: 0; }
    .write textarea { height: clamp(56px, 17svh, 96px); }
    .write .cnt { height: 0; margin: 0; padding-right: 14px; transform: translateY(-26px); pointer-events: none; }
    .write .three { gap: 7px; }
    .write .three input { padding: 8px 12px; }
    .btn { padding: 11px 14px 12px; font-size: 20px; }
    .row2 { grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .write .three + .row2 { margin-top: 10px; }
    .btn.ghost { font-size: 16px; }
    #votebtn { position: static; }
    .opts:has(+ #votebtn) { padding-bottom: 0; }
    .introrow .rebrik { width: 88px; }
    .burst { width: 96px; height: 96px; font-size: 36px; }
  }
  /* ландшафт: на экранах ввода две колонки — слева вопрос и таймер, справа поле и кнопки; варианты ответов — в два столбца */
  @media (orientation: landscape) and (max-height: 520px) and (min-width: 560px) {

  .kb .util, .kb .console { display: none; }
  .kb #app { min-height: 0; padding-bottom: 8px; }
  .kb .stage { gap: 8px; justify-content: flex-start; padding-top: 6px; }
  .kb .card.qcard { padding: 8px 14px; }
  .kb .card.qcard::before { inset: 3px; }
  .kb .card .q { font-size: 18px; }
  .kb .write textarea { height: 56px; }
  .kb .write .three { gap: 6px; }
  .kb .write .three input { padding: 7px 12px; }
  .kb .row2 { position: sticky; bottom: var(--kb-h, 0px); z-index: 4; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; padding: 8px 0 4px; background: linear-gradient(to bottom, rgba(255, 122, 47, 0), var(--or-2) 10px); }
  .kb .row2 .btn { margin-bottom: 0; padding: 10px 8px 11px; font-size: 18px; }
  .kb .row2 .btn.ghost { font-size: 15px; }
  /* стартовый экран на ноутбуке: две колонки — слева вывеска и кнопка, справа пример схватки. Не узкая лента посередине */
  @media (min-width: 900px) {

    .landing > .l-head { grid-area: head; } .landing > .lede { grid-area: lede; } .landing > .l-cta { grid-area: cta; } .landing > .rules { grid-area: rules; }

  }

  }

<script>
window.I18N_DICT = {

  // с сервера (U-28): после reload и со второго телефона
  if (pr.draft) v = isFinal ? three(pr.draft.items) : String(pr.draft.text || "");
  if (v == null && draftStore) {
    const raw = draftStore.load(draftKey(pr.id));
    if (raw) {
      if (isFinal) { try { v = three(JSON.parse(raw)); } catch (e) { v = null; } } else v = raw;
    }
  }
  if (v != null) drafts[pr.id] = v;
  return v;
}

function saveDraft(mid, value, isFinal, quiet) {

function renderAnswer() {
  const s = state.me;
  if (!s || !s.inRound) {
    const key = "late:" + state.ri + qpLang();
    if (screenKey === key) return;
    show(`<div class="card status"><h2>${T("late_title")}</h2><p style="margin:0;color:var(--tile-muted)">${T("late_sub")}</p>${progHtml()}</div>`, key, false, { reacts: true });
    return;
  }
  const list = s.prompts;
  const cur = list.find((p) => !p.done);
  const promptKindOf = (p) => (p.e ? T("r_emoji") : p.a != null ? T("rev_k") : p.f != null ? T("fact_k") : "");
  // только что вытянутая подсказка: показываем карточку, пока игрок не нажмёт «дальше» или не истечёт пауза
  const flipped = justHinted && list.find((p) => p.id === justHinted && p.done);
  if (flipped) {
    hintSeen = flipped.id;
    const key = "hinted:" + flipped.id + qpLang();
    if (screenKey === key) return;
    show(`<div class="ahead"><span>${escapeHtml(tpl("q_of", { i: list.indexOf(flipped) + 1, n: list.length }))}</span><span id="tleft"></span></div>${timerHtml()}
      <div class="card qcard"><div class="k">${escapeHtml(promptKindOf(flipped.prompt))}</div><div class="q">${qpPromptHtml(flipped.prompt)}</div></div>
      <div class="flip go"><div class="card"><div class="k">${T("got_hint")}</div><div class="gotit">${qpAnswerHtml(flipped.answer)}</div></div></div>
      <button class="btn" type="button" id="hintnext">${T("btn_next")}</button>`, key, true);
    qpSfx.flip();
    const goOn = () => { clearTimeout(renderAnswer.t); justHinted = null; screenKey = ""; render(); };
    document.getElementById("hintnext").onclick = goOn;
    clearTimeout(renderAnswer.t);
    // 3,5 с: карточку успевают прочитать, медленный жмёт «Дальше» (quip-036)
    renderAnswer.t = setTimeout(goOn, 3500);
    return;
  }
  if (!cur) {
    const key = "done:" + state.ri + qpLang();
    if (screenKey === key) return;
    show(`<div class="status center"><h2>${T("done_title")}</h2><p>${T("done_sub")}</p>${progHtml()}</div>
      <div class="opts">${list.map((p) => `<div class="card"><div class="k">${qpPromptHtml(p.prompt.e ? { q: p.prompt.e } : p.prompt)}</div><div class="gotit">${qpAnswerHtml(p.answer)} ${p.hint ? `<span class="tag">🎲</span>` : ""}</div></div>`).join("")}</div>`, key, true, { reacts: true });
    return;
  }
  const key = "ans:" + cur.id + ":" + s.hintsLeft + ":" + (hintArmed === cur.id) + qpLang();
  if (screenKey === key) return;
  const final = cur.deck === "final";
  const d = loadDraft(cur, final) || (final ? ["", "", ""] : "");
  const hintLabel = s.hintsLeft <= 0 ? T("btn_hint_none") : hintArmed === cur.id ? T("btn_hint_sure") : tpl("btn_hint", { n: s.hintsLeft });
  const promptKind = promptKindOf(cur.prompt);
  show(`<div class="ahead"><span class="left">${escapeHtml(tpl("q_of", { i: list.indexOf(cur) + 1, n: list.length }))}${list.length > 1 ? `<small class="shared">${escapeHtml(T("shared_timer"))}</small>` : ""}</span><span id="tleft"></span></div>${timerHtml()}
    <div class="card qcard"><div class="k">${escapeHtml(promptKind)}</div><div class="q">${qpPromptHtml(cur.prompt)}</div></div>
    <form class="write" id="write" autocomplete="off">
      ${final
        ? `<div class="three">${[0, 1, 2].map((i) => `<label><span class="num">${i + 1}</span><input maxlength="${limItem()}" data-i="${i}" value="${escapeHtml(d[i] || "")}" placeholder="${escapeHtml(tpl("ph_item", { n: i + 1 }))}" enterkeyhint="${i < 2 ? "next" : "send"}"><span class="icnt"></span></label>`).join("")}</div>`
        : `<textarea id="ta" maxlength="${limAnswer()}" placeholder="${escapeHtml(T(cur.prompt.e ? "ph_caption" : cur.prompt.a != null ? "ph_question" : cur.prompt.f != null ? "ph_fill" : "ph_answer"))}" enterkeyhint="send" aria-label="${escapeHtml(T("ph_answer"))}">${escapeHtml(d)}</textarea><div class="cnt" id="cnt"></div>`}
      <div class="row2"><button class="btn" type="submit" id="sendbtn">${T("btn_send")}</button>
      <button class="btn ghost${hintArmed === cur.id ? " sure" : ""}" type="button" id="hintbtn"${s.hintsLeft <= 0 ? " disabled" : ""}>${escapeHtml(hintLabel)}</button></div>
    </form>`, key, true);
  const form = document.getElementById("write");
  const cnt = document.getElementById("cnt");
  if (final) {
    const inputs = [...form.querySelectorAll("input")];
    inputs.forEach((inp, i) => {
      const upd = (quiet) => {
        saveDraft(cur.id, inputs.map((x) => x.value), true, quiet === true);
        const lm = limItem(), c = inp.parentNode.querySelector(".icnt");
        if (c) c.textContent = inp.value.length > lm - 10 ? `${inp.value.length}/${lm}` : "";
      };
      inp.oninput = () => upd(false);
      upd(true);
      inp.onkeydown = (e) => { if (e.key === "Enter" && i < 2) { e.preventDefault(); inputs[i + 1].focus(); } };
    });
    const first = inputs.find((x) => !x.value) || inputs[0];
    if (!matchMedia("(pointer: coarse)").matches) first.focus();
  } else {
    const ta = document.getElementById("ta");
    const upd = (quiet) => { saveDraft(cur.id, ta.value, false, quiet === true); cnt.textContent = ta.value.length > limAnswer() - 20 ? `${ta.value.length}/${limAnswer()}` : ""; };
    ta.oninput = () => upd(false);
    ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.onsubmit(e); } };
    upd(true);
    if (!matchMedia("(pointer: coarse)").matches) ta.focus();
  }
  form.onsubmit = (e) => {
    e.preventDefault();
    const val = drafts[cur.id];
    const ans = final ? (val || []).map((x) => String(x || "").trim()) : String(val || "").trim();
    if (final ? !ans.some(Boolean) : !ans) { toast(T("rj_empty")); return; }
    if (final && ans.filter(Boolean).length < 3) { toast(T("rj_need_three")); return; }
    clearTimeout(draftTimer); // отложенный черновик после настоящего ответа не нужен
    conn.send({ type: "answer", mid: cur.id, ans });
    qpSfx.send();
    qpVibrate(15);
    const sb = document.getElementById("sendbtn");
    sb.disabled = true;
    hintArmed = null;
    // подтверждения нет (связь пропала, пока тап летел) — не оставляем кнопку мёртвой
    setTimeout(() => { if (sb.isConnected && screenKey.startsWith("ans:" + cur.id + ":")) sb.disabled = false; }, 3000);
  };
  document.getElementById("hintbtn").onclick = () => {
    if (hintArmed !== cur.id) { hintArmed = cur.id; screenKey = ""; return render(); }
    hintArmed = null;
    justHinted = cur.id;
    conn.send({ type: "hint", mid: cur.id });
    qpVibrate([10, 30, 10]);
  };
}

function renderVote() {
  const s = state.me, c = state.current;
  if (!c || !c.answers) return;
  // подсказку вытянул последним — фаза ответов кончилась раньше, чем перевернулась карточка: покажем, что выпало
  if (justHinted && hintSeen !== justHinted) {
    const mineA = c.answers.find((a) => a.mine);
    if (mineA) toast(T("got_hint") + " " + (mineA.items ? mineA.items.join(" / ") : mineA.text));
    justHinted = null;
  }
  // после reload: свой голос и отметки приходят с сервера (myVotes/myDraft) — «Твой голос» не пустеет
  if (!picks.length && s) {
    if (s.voted && s.myVotes) picks = s.myVotes.slice();
    else if (s.myDraft) picks = s.myDraft.slice();
  }
  const voted = s && (s.voted || sentVote === c.id);
  const key = "vote:" + c.id + ":" + voted + ":" + (s && s.canVote) + ":" + picks.join(",") + qpLang();
  if (screenKey === key) return;
  const promptSm = `<div class="card qcard sm"><div class="q">${qpPromptHtml(c.prompt)}</div></div>`;
  const mineCard = (label, list) => (list.length ? `<div class="card mine"><div class="k">${escapeHtml(label)}</div>${list.map((a) => `<div class="gotit">${qpAnswerHtml(a)}</div>`).join("")}</div>` : "");
  if (s && s.author && c.kind === "duel") {
    show(`${timerHtml()}<div class="card status">${qpHostSvg()}<h2>${T("author_title")}</h2><p style="margin:0;color:var(--tile-muted)">${T("author_sub")}</p>${progHtml()}</div>
      ${promptSm}${mineCard(T("your_answer"), c.answers.filter((a) => a.mine))}`, key, true, { reacts: true });
    return;
  }
  if (voted || !s || !s.canVote) {
    const picked = voted ? picks.map((i) => c.answers[i]).filter(Boolean) : [];
    show(`${timerHtml()}<div class="card status">${qpHostSvg()}<h2>${T(voted ? "voted_title" : "novote_title")}</h2><p style="margin:0;color:var(--tile-muted)">${T(voted ? "voted_sub" : "novote_sub")}</p>${progHtml()}</div>
      ${promptSm}${mineCard(T("your_vote"), picked)}`, key, true, { reacts: true });
    return;
  }
  const n = s.votesFor;
  // отмеченное до перезагрузки/переподключения — с сервера
  if (!picks.length && s.myDraft) picks = s.myDraft.slice();
  show(`${timerHtml()}${progHtml()}${s.inRound ? "" : `<div class="eyebrow">${escapeHtml(T("late_vote"))}</div>`}<div class="card qcard"><div class="k">${T("vote_title")}</div><div class="q" style="font-size:19px">${qpPromptHtml(c.prompt)}</div></div>
    <div class="eyebrow">${escapeHtml(n > 1 ? tpl("vote_many", { n }) : T("vote_one"))}</div>
    <div class="opts">${c.answers.map((a, i) => `<button type="button" class="opt${a.mine ? " own" : ""}${picks.includes(i) ? " sel" : ""}" data-i="${i}" data-own="${escapeHtml(T("own"))}"${a.mine ? " disabled" : ""}><span class="l">${String.fromCharCode(65 + i)}</span>${qpAnswerHtml(a)}</button>`).join("")}</div>
    ${n > 1 ? `<button class="btn" type="button" id="votebtn"${picks.length ? "" : " disabled"}>${escapeHtml(tpl("btn_vote", { n: `${picks.length}/${n}` }))}</button>` : ""}`, key, true);
  app.querySelectorAll(".opt:not(.own)").forEach((b) => {
    b.onclick = () => {
      const i = Number(b.dataset.i);
      qpSfx.tap();
      if (n === 1) { picks = [i]; sendVote(c.id); return; }
      picks = picks.includes(i) ? picks.filter((x) => x !== i) : picks.length < n ? picks.concat(i) : picks;
      // выбрал все N — голос уходит сам; иначе отметка идёт на сервер черновиком и засчитается по таймеру
      if (picks.length === n) { sendVote(c.id); return; }
      conn.send({ type: "vote", mid: c.id, picks, draft: true });
      render();
    };
  });
  const vb = document.getElementById("votebtn");
  if (vb) vb.onclick = () => sendVote(c.id);
}
function sendVote(mid) {
  if (!picks.length) return;
  conn.send({ type: "vote", mid, picks });
  sentVote = mid;
  qpVibrate(15);
  qpSfx.send();
  render();
  // голос не подтвердился, а голосование то же — возвращаем выбор
  setTimeout(() => {
    if (sentVote !== mid) return;
    const st = state && state.me;
    if (state && state.phase === "vote" && state.current && state.current.id === mid && st && !st.voted) { sentVote = null; screenKey = ""; render(); }
  }, 3000);
}

function renderReveal() {
  const c = state.current;
  if (!c || !c.result) return;
  const key = "rev:" + c.id + qpLang();
  if (screenKey === key) return;
  const r = c.result;
  const myIdx = c.answers.findIndex((a) => a.playerId === me);
  let head = "";
  if (myIdx >= 0) head = r.jinx.includes(me) ? `<div class="stamp">${T("you_jinx")}</div>` : `<div class="big">${escapeHtml(tpl("you_got", { n: r.points[myIdx] }))}</div>`;
  // сетка финала (5+ карточек по три пункта): свой ответ и победители сверху, остальные — свёрнуты в две строки (quip-024).
  // Порядок меняется только на этом экране; у остальных схваток он тот же, что на доске
  const many = c.answers.length > 4;
  const hot = (a) => a.playerId === me || r.winners.includes(a.playerId);
  const order = c.answers.map((a, i) => i);
  if (many) order.sort((x, y) => (hot(c.answers[y]) ? 1 : 0) - (hot(c.answers[x]) ? 1 : 0) || x - y);
  const rows = order.map((i, pos) => {
    const a = c.answers[i];
    const p = player(a.playerId) || {};
    const jin = r.jinx.includes(a.playerId);
    const tags = [a.hint && !a.late ? `🎲 ${T("hint_mark")}` : "", a.late ? `🐌 ${T("late_mark")} · ${T("late_half")}` : "", jin ? T("jinx") : "", r.sweep === a.playerId ? T("sweep") : ""].filter(Boolean).join(" · ");
    return `<div class="r${r.winners.includes(a.playerId) ? " win" : ""}${many && !hot(a) ? " cmp" : ""}" style="--pc:${p.color || "#777"};--i:${(pos * 0.08).toFixed(2)}s"><div class="t">${qpAnswerHtml(a)}</div><div class="p">${escapeHtml(tpl("pts", { n: r.points[i] }))}</div>
      <div class="who">${escapeHtml(p.avatar || "")} ${escapeHtml(p.name || "?")} · ${escapeHtml(jin ? T("jinx_cap") : qpVotes(r.tally[i]))}${tags ? " · " + escapeHtml(tags) : ""}</div></div>`;
  }).join("");
  show(`${head ? `<div class="center">${head}</div>` : ""}<div class="eyebrow">${T("reveal_title")}</div><div class="card qcard sm"><div class="q">${qpPromptHtml(c.prompt)}</div></div><div class="res">${rows}</div>`, key, true, { reacts: true });
}

// места с ничьими и порядок — как на доске (qpRanked)
function standing() {
  const list = qpRanked(state.players);
  const inList = list.find((x) => x.id === me);
  const p = inList || mine();
  // вошёл после финала: в таблице его нет, места не получает (T-W1-15, U-11)
  return { list, place: inList ? p.place : 0, p, out: !inList && state.phase === "finished" };
}

function setlistHtml(list) {
  return `<div class="card setlist"><div class="k">${T("setlist")}</div><ol>${list.map((x) => `<li class="${x.id === me ? "me" : ""}"><span class="n">${escapeHtml(qpPlaceLabel(x))}</span>${avHtml(x)}<b>${escapeHtml(x.name)}</b><span class="dots"></span><span class="s">${x.score}</span></li>`).join("")}</ol></div>`;
}

function renderScores() {
  const key = "scores:" + state.ri + qpLang();
  if (screenKey === key) return;
  const { list, place, p } = standing();
  show(`<div class="center"><div class="eyebrow">${escapeHtml(tpl("scores_title", { n: state.ri + 1 }))}</div>
    <div class="big" style="margin:10px 0">${escapeHtml(qpPlaceTie(p))}</div><div class="lede">${escapeHtml(p.avatar)} ${escapeHtml(p.name)} · <b>${p.score}</b></div></div>${setlistHtml(list)}`, key, true, { reacts: true });
}

function renderFinal() {
  const key = "final:" + state.game + ":" + state.finishedReason + qpLang();
  if (screenKey === key) return;
  const { list, place, p, out } = standing();
  const sub = state.finishedReason === "few" ? T("final_few") : state.finishedReason === "host" ? T("final_host") : T("final_sub");
  show(`<div class="center"><h1 class="sign sm">${T("final_title")}</h1>
    <div class="big${out ? " sm" : ""}" style="margin:14px 0 6px">${escapeHtml(out ? T("final_late") : qpPlaceTie(p))}</div>
    <div class="lede">${escapeHtml(p.avatar)} ${escapeHtml(p.name)} · <b>${p.score}</b></div>
    <p class="fine">${escapeHtml(sub)}</p></div>${setlistHtml(list)}
    <a class="btn ghost" id="homebtn" href="index.html">${T("btn_home")}</a>`, key, true, { reacts: true });
  if (!out && place === 1 && state.finishedReason === "done") setTimeout(() => qpConfetti({ mode: "rain", n: 120 }), 300);
}

// ---------- выбор экрана ----------
function render() {
  if (dead || !state) return;
  if (!me) {
    if (screen === "kicked" || screen === "replaced" || screen === "enter" || screen === "claim") return;
    return renderEnter();
  }
  if (!mine()) return renderEnter();
  screen = "game";
  switch (state.phase) {
    case "lobby": return renderLobby();
    case "intro": return renderIntro();
    case "answer": return renderAnswer();
    case "vote": return renderVote();
    case "reveal": return renderReveal();
    case "scores": return renderScores();
    case "finished": return renderFinal();
  }
}

// таймер фазы: полоска и секунды; последние 5 с — красным и с тиканьем
let lastTickSec = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead || !state.phaseEnd) return;
  const now = qpNow();
  const left = state.phaseEnd - now;
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const bar = document.getElementById("timer");
  if (bar) {
    bar.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`;
    bar.classList.toggle("hot", left < 5000);
  }
  const tl = document.getElementById("tleft");
  if (tl) tl.textContent = tpl("sec", { s: Math.max(0, Math.ceil(left / 1000)) });
  const pe = document.getElementById("prog");
  if (pe) { const pt = progText(); if (pe.textContent !== pt) pe.textContent = pt; }
  if ((state.phase === "answer" || state.phase === "vote") && left < 5000 && left > 0) {
    const sec = Math.ceil(left / 1000);
    if (sec !== lastTickSec) { lastTickSec = sec; qpSfx.tick(true); }
  }
}

window.addEventListener("langchange", () => {
  if (!CODE) return renderLanding();
  if (screen === "enter") return renderEnter();
  if (screen === "claim") return renderClaim();
  if (screen === "noroom") return renderNoRoom();
  screenKey = "";
  screen === "expired" ? renderExpired() : render();
});

// ---------- связь ----------
let prevPhase = null, prevMid = null, needJoin = true, pendingFlush = false;
// что нажато во время обрыва — отправляем, если ещё актуально (иначе сервер ответил бы «отказ» на давнее действие)
function flushQueued() {
  conn.flush((q) => {
    const st = state && state.me;
    if (!st || !state) return false;
    if (q.type === "answer") return state.phase === "answer" && !!(st.prompts || []).find((p) => p.id === q.mid && !p.done);
    if (q.type === "hint") return state.phase === "answer" && !!(st.prompts || []).find((p) => p.id === q.mid && !p.done);
    if (q.type === "vote") return state.phase === "vote" && !!state.current && state.current.id === q.mid && !st.voted;
    return true;
  });
}
// действие не дошло до сервера (очередь протухла/переполнена/отброшена): снимаем «ушло» и говорим об этом.
// Если сервер успел его принять (по снимку видно), молчим.
function lostAction(m) {
  if (!m || dead || m.draft === true) return;
  const st = state && state.me;
  let applied = false;
  if (m.type === "answer" || m.type === "hint") {
    const p = st && (st.prompts || []).find((x) => x.id === m.mid);
    applied = !!(p && p.done);
    if (m.type === "hint") { justHinted = null; hintArmed = null; }
    screenKey = "";
  } else if (m.type === "vote") {
    applied = !!(st && st.voted && state.current && state.current.id === m.mid);
    if (!applied) { sentVote = null; picks = picks.slice(); screenKey = ""; }
  } else return;
  if (applied) return;
  toast(T("send_lost"));
  render();
}
function onMessage(m) {
  if (mpOn()) {
    if (m.type === "hello" && MP.applyHello(m) === false) flow = null; // MP_OFF на сервере: старый протокол
    else if (flow && flow.handle(m)) return;
  }
  if (m.type === "hello" && goneFlow) goneFlow.hello();
  switch (m.type) {
    case "hello":
    case "state":
      state = m.state;
      // принятый ответ (или ушедшая фаза ответов) — черновик в хранилище больше не нужен
      if (draftSaved && (state.phase !== "answer" || (state.me && state.me.prompts.some((x) => x.done && draftKey(x.id) === draftSaved)))) dropDraft();
      else if (m.type === "hello" && state.phase !== "answer" && draftStore) dropDraft();
      // сервер сказал «имя занято, пока идёт вопрос» — входим сами, как только фаза сменилась
      if (waitPhase && !me && state.phase !== waitPhase) { waitPhase = null; joinErr = null; doJoin(); }
      if (m.type === "hello" && needJoin) {
        if (token) { needJoin = false; doJoin(); }
        // обрыв на экране «Это ты?»: повторяем join (без claim) — сервер продлевает ожидание, экран не пропадает
        else if (flow && flow.state().prompting) { needJoin = false; flow.resume(); }
      }
      // язык комнаты (T-W2-05, U-17): телефон с русской локалью в греческой комнате увидел бы русский интерфейс при греческих
      // вопросах. По умолчанию — подсказка «Язык комнаты: EL. Переключить?» (класс A); сам переключаться телефон
      // начинает только при MP.rules.RULE_U17_LANG_FOLLOW (класс B, выкл.). Ручной выбор языка не сбивается.
      if (m.type === "hello" || state.phase === "lobby") followLang();
      // новая схватка — сбрасываем выбор
      if (state.current && state.current.id !== prevMid) { picks = []; prevMid = state.current.id; }
      if (state.phase !== prevPhase) {
        // тост прошлого экрана не живёт на новом и не перекрывает плашку (quip-037)
        clearTimeout(toast.t);
        const tt = document.getElementById("toast");
        if (tt) tt.classList.remove("on");
        if (state.phase === "answer") { hintArmed = null; justHinted = null; }
        if (state.phase === "vote" || state.phase === "answer") qpVibrate(30);
        prevPhase = state.phase;
      }
      render();
      // вернулись по токену: действия, нажатые в обрыв, отправляем, когда сервер снова признал нас
      if (pendingFlush && state.me) { pendingFlush = false; flushQueued(); }
      break;
    case "joined": {
      const was = me;
      me = m.playerId;
      token = m.token;
      joinErr = null;
      waitPhase = null;
      claimPrompt = null;
      if (m.name) {
        joinName = m.name;
        try { localStorage.setItem("quip-name", m.name); } catch (e) {}
        if (m.renamed) toast(tpl("renamed_toast", { name: m.name }));
      }
      try { localStorage.setItem(tokenKey(), token); } catch (e) {}
      keepAwake();
      if (was !== me) { screen = null; screenKey = ""; } // повторный вход после обрыва экран не пересобирает
      render();
      pendingFlush = true;
      setTimeout(() => { if (pendingFlush) { pendingFlush = false; flushQueued(); } }, 2000);
      break;
    }
    case "rejected":
      if (m.action === "hint") { justHinted = null; screenKey = ""; }
      if (m.action === "vote") { sentVote = null; screenKey = ""; }
      if (m.action === "answer") screenKey = "";
      if (T("rj_" + m.reason) !== "rj_" + m.reason) toast(T("rj_" + m.reason));
      render();
      break;
    case "error":
      conn.flush(() => false, () => {});
      if (m.error === "room_expired") return renderExpired();
      if (["room_full", "token_gone", "bad_name", "name_taken"].includes(m.error)) {
        if (m.error === "token_gone") { try { localStorage.removeItem(tokenKey()); } catch (e) {} token = null; joinName = ""; }
        joinErr = m.error === "bad_name" ? "err_name" : "err_" + m.error;
        // секретная фаза: имя освободится со сменой фазы — ждём и входим сами
        waitPhase = m.error === "name_taken" && m.retry === true && state ? state.phase : null;
        if (waitPhase) joinErr = "err_name_wait";
        me = null;
        renderEnter();
      }
      break;
    case "kicked":
      conn.flush(() => false, () => {});
      me = null;
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
      token = null;
      joinName = "";
      dropDraft();
      screen = "kicked";
      renderCenter("kicked_title");
      break;
    case "replaced":
      me = null;
      screen = "replaced";
      renderCenter("replaced_title", "replaced_text", `<button class="btn" style="margin-top:14px" id="here" type="button">${T("btn_back_here")}</button>`);
      document.getElementById("here").onclick = () => { doJoin(); };
      break;
    case "event": {
      const e = m.event;
      if (e.type === "reveal") {
        if (e.sweep) qpSfx.sweep();
        // твой разгром — хлопушка и на телефоне
        if (e.sweep && e.sweep === me) setTimeout(() => qpConfetti({ y: innerHeight * 0.3, n: 90 }), 600);
        if (e.sweep === me || (e.winners || []).includes(me)) qpVibrate([40, 40, 80]);
      }
      if (e.type === "jinx") qpSfx.jinx();
      break;
    }
  }
}

function start() {
  if (!CODE) return renderLanding();
  renderCenter("wait_title");
  const banner = document.getElementById("conn");
  let netLost = false, netQuiet = false;
  const showNet = () => {
    banner.textContent = T(netLost ? "err_connect" : "conn_lost");
    banner.classList.toggle("on", netLost || netQuiet);
  };
  window.addEventListener("langchange", showNet);
  conn = qpConnect({
    code: CODE,
    onMessage,
    onGone: onRoomGone,
    onDrop: lostAction,
    // переподключились — снова входим своим токеном (hello придёт первым)
    onOpen: () => { needJoin = true; if (token) conn.gated = true; },
    // «lost» — сокет закрыт, переподключаемся; «quiet» — сокет жив, но молчит дольше 10 с (MP.conn): только предупреждение
    onState: (st) => { netLost = st === "lost"; if (st === "open") netQuiet = false; showNet(); },
    onQuiet: (q) => { netQuiet = !!q; showNet(); },
  });
  requestAnimationFrame(frame);
  // клавиатура открыта → html.kb (только CSS, форма не пересобирается)
  if (window.MP && MP.keyboardClass && !MP.off) MP.keyboardClass();
  // ручка для стенда: состояние и отправка
  window.qpPhone = { send: (msg) => conn.send(msg), get state() { return state; }, get me() { return me; } };
}
if (window.MP && !MP.off) {
  flow = MP.joinFlow({
    send: (m) => conn.send(m),
    buildJoin,
    onClaimPrompt: (c) => { claimPrompt = c; renderClaim(); },
    // «подождите» не бесконечно: после повторов — обычное «имя занято»
    onGiveUp: () => { joinErr = "err_name_taken"; me = null; renderEnter(); },
  });
}
start();
</script>
