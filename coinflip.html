<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Подбрось монетку — рандомайзер решений</title>
  <meta name="description" content="🪙 Не можешь решить? Подбрось монетку! Бинарный рандомайзер для принятия решений." data-i18n-meta="meta_desc">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://randomhost.online/coinflip.html">

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2830/2830284.png" type="image/png">

  <meta name="theme-color" content="#0f5c58">

<style>
/* Один плоский цвет, одна крупная монета, крупное слово-результат. Без градиентов, стекла, свечения и карточек. */
:root {
  --bg: #0f5c58;
  --bg-dk: #0a4542;
  --cream: #fdf6e3;
  --coral: #ff6f59;
  --ink: #0a2f2d;
  --muted: #a9cfc8;
  --disp: 'Play', 'Roboto Condensed', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --body: 'Roboto Condensed', 'Play', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --lang-switch-bg: var(--bg-dk);
  --lang-switch-border: var(--muted);
  --lang-switch-fg: var(--cream);
  --lang-switch-fg-hover: #fff;
  --lang-switch-hover-bg: var(--bg);
  --lang-switch-active-fg: var(--ink);
  --lang-switch-active-bg: var(--cream);
  --lang-switch-active-border: var(--cream);
  --lang-switch-font: var(--disp);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--cream);
  font: 700 16px/1.3 var(--body); -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
.home-button {
  position: fixed; top: 14px; left: 14px; z-index: 50; display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px;
  color: var(--cream); text-decoration: none; font: 700 14px/1 var(--disp); letter-spacing: .1em; text-transform: uppercase;
  border-bottom: 3px solid var(--coral);
}
.home-button::before { content: "←"; margin-right: 8px; }
.home-button:hover { color: #fff; }
.home-button:focus-visible, .flip-button:focus-visible, .question-input:focus-visible, .option-input:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

.container { width: 100%; max-width: 1120px; margin: 0 auto; padding: 72px 24px 32px; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; }
.main-layout { width: 100%; display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: clamp(28px, 6vw, 80px); align-items: center; }

/* ---------- настройки ---------- */
.settings-column { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
h1 { margin: 0; font: 700 clamp(30px, 4.4vw, 48px)/1 var(--disp); text-transform: uppercase; letter-spacing: .01em; }
.input-group { display: flex; flex-direction: column; gap: 18px; }
.question-input, .option-input {
  width: 100%; min-width: 0; border: 0; border-bottom: 3px solid var(--cream); border-radius: 0; background: transparent;
  color: var(--cream); font: 700 20px/1.2 var(--disp); padding: 10px 0;
}
.question-input::placeholder, .option-input::placeholder { color: var(--muted); font-weight: 400; }
.question-input:disabled, .option-input:disabled { opacity: .5; }
.option-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.option-wrapper { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.option-wrapper label { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 700 12px/1 var(--disp); letter-spacing: .14em; text-transform: uppercase; }
.option-wrapper label::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #e2b756; flex: none; }
.option-input.error { border-bottom-color: #ffd166; }
.char-counter { align-self: flex-end; font: 400 12px/1 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.char-counter.error { color: #ffd166; }
.error-message { min-height: 2.6em; margin: -6px 0 0; font: 700 14px/1.3 var(--body); color: #ffd166; visibility: hidden; }
.error-message.show { visibility: visible; }

.flip-button {
  min-height: 60px; width: 100%; border: 0; border-radius: 999px; background: var(--cream); color: var(--ink); cursor: pointer;
  font: 700 22px/1 var(--disp); letter-spacing: .08em; text-transform: uppercase; transition: transform .08s;
}
.flip-button:active:not(:disabled) { transform: scale(.97); }
.flip-button:disabled { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 3px var(--muted); cursor: not-allowed; }

/* ---------- монета ---------- */
.coin-column { min-width: 0; display: flex; flex-direction: column; align-items: center; }
/* Настоящая монета: две грани, толщина ~8% диаметра из 16 дисков, лежит на столе под углом камеры.
   Слои: .coin (подъём) → .tilt (камера сверху) → .spin (переворот вокруг горизонтальной оси). */
.coin-container {
  --coin: clamp(150px, min(26vw, 30vh), 270px);
  --t: calc(var(--coin) * .085);
  position: relative; z-index: 5; width: var(--coin); height: var(--coin);
  margin-top: calc(var(--coin) * .5); margin-bottom: calc(var(--coin) * .22);
  perspective: 1100px;
}
.coin, .tilt, .spin { position: absolute; inset: 0; transform-style: preserve-3d; }
.coin { z-index: 2; }
.tilt { transform: rotateX(32deg); }
.spin { transform: rotateX(0deg); }
.face, .edge { position: absolute; inset: 0; border-radius: 50%; }
.edge {
  transform: translateZ(calc((var(--i) - 7.5) * var(--t) / 15));
  background: conic-gradient(from 20deg, #b78a2e, #8c6218, #d1a345, #8c6218, #b78a2e, #8c6218, #d1a345, #8c6218, #b78a2e);
}
.face {
  display: grid; place-items: center; padding: 0 19%; overflow: hidden; white-space: nowrap; text-align: center;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: radial-gradient(circle at 34% 28%, #fbe7a6 0%, #e2b756 32%, #c28f33 62%, #94681b 100%);
  color: #6e4a0f; font: 700 calc(var(--coin) * .17)/1 var(--disp);
  text-shadow: 0 1px 0 rgba(255, 240, 190, .75), 0 -1px 0 rgba(70, 42, 5, .45);
}
.coin-front { transform: translateZ(calc(var(--t) / 2)); }
.coin-back { transform: rotateX(180deg) translateZ(calc(var(--t) / 2)); }
/* поднятый ободок и бусины по краю */
.face::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  box-shadow: inset 0 0 0 calc(var(--coin) * .035) #d7a944, inset 0 0 0 calc(var(--coin) * .045) rgba(80, 50, 8, .35), inset 0 0 0 calc(var(--coin) * .05) rgba(255, 236, 170, .55); }
.face::after { content: ""; position: absolute; inset: calc(var(--coin) * .062); border-radius: 50%;
  background: repeating-conic-gradient(rgba(80, 50, 8, .38) 0 2.4deg, transparent 2.4deg 7.2deg);
  -webkit-mask: radial-gradient(circle, transparent calc(100% - var(--coin) * .035), #000 calc(100% - var(--coin) * .035 + 1px));
  mask: radial-gradient(circle, transparent calc(100% - var(--coin) * .035), #000 calc(100% - var(--coin) * .035 + 1px)); }
.face > span { position: relative; z-index: 1; }

/* Бросок 2 с: подъём (замедляется) → падение (ускоряется) → два отскока; переворот с постоянной скоростью,
   у земли затухающее «дребезжание». Старт — из той стороны, что лежит сейчас: ничего не сбрасывается и не прыгает. */
.coin.flipping-front, .coin.flipping-back { animation: lift 2s both; }
.coin.flipping-front .spin, .coin.flipping-back .spin { animation: roll 2s both; }
.coin.flipping-front + .coin-shadow, .coin.flipping-back + .coin-shadow { animation: shade 2s both; }
@keyframes lift {
  0%   { transform: translateY(0);     animation-timing-function: cubic-bezier(.25, .46, .45, .94); }
  36%  { transform: translateY(-105%); animation-timing-function: cubic-bezier(.55, .085, .68, .53); }
  74%  { transform: translateY(0);     animation-timing-function: cubic-bezier(.25, .46, .45, .94); }
  82%  { transform: translateY(-13%);  animation-timing-function: cubic-bezier(.55, .085, .68, .53); }
  89%  { transform: translateY(0);     animation-timing-function: cubic-bezier(.25, .46, .45, .94); }
  93%  { transform: translateY(-3.5%); animation-timing-function: cubic-bezier(.55, .085, .68, .53); }
  97%, 100% { transform: translateY(0); }
}
@keyframes roll {
  0%   { transform: rotateZ(0deg) rotateX(var(--a0)); animation-timing-function: linear; }
  74%  { transform: rotateZ(0deg) rotateX(calc(var(--a1) - 14deg)); animation-timing-function: ease-out; }
  80%  { transform: rotateZ(-2deg) rotateX(calc(var(--a1) + 9deg)); animation-timing-function: ease-in-out; }
  87%  { transform: rotateZ(1.5deg) rotateX(calc(var(--a1) - 5deg)); animation-timing-function: ease-in-out; }
  93%  { transform: rotateZ(0deg) rotateX(calc(var(--a1) + 2deg)); animation-timing-function: ease-in-out; }
  100% { transform: rotateZ(0deg) rotateX(var(--a1)); }
}
/* тень на столе: далеко от земли — меньше и светлее */
.coin-shadow { position: absolute; z-index: 1; left: 9%; bottom: -9%; width: 82%; height: 15%; border-radius: 50%; background: var(--bg-dk); opacity: .9; }
@keyframes shade {
  0%, 74%, 89%, 97%, 100% { transform: scale(1); opacity: .9; animation-timing-function: ease-out; }
  36% { transform: scale(.55); opacity: .35; animation-timing-function: ease-in; }
  82% { transform: scale(.9); opacity: .75; }
  93% { transform: scale(.97); opacity: .85; }
}

/* строка результата: ожидание → «в воздухе» → крупное слово; высота одна, ничего не прыгает */
.coin-result {
  width: 100%; min-height: clamp(52px, 9vw, 96px); display: flex; align-items: center; justify-content: center; text-align: center;
  font: 700 16px/1.1 var(--disp); letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  transition: opacity .22s ease, transform .22s ease;
}
.coin-result.fading { opacity: 0; transform: translateY(-8px); }
.coin-result.air { opacity: 0; }
.coin-result.show { font-size: clamp(34px, 7vw, 76px); letter-spacing: .02em; color: var(--cream); }

@media (max-width: 760px) {
  .container { padding: 80px 18px 24px; align-items: flex-start; }
  .main-layout { grid-template-columns: 1fr; gap: 12px; }
  .settings-column { gap: 16px; }
  h1 { font-size: 30px; }
  .input-group { gap: 12px; }
  .question-input, .option-input { font-size: 18px; }
  .flip-button { min-height: 56px; }
  .coin-container { --coin: clamp(110px, min(38vw, 21vh), 190px); margin-top: calc(var(--coin) * .7); }
}
@media (max-width: 760px) and (max-height: 660px) {
  .container { padding-top: 72px; }
  h1 { font-size: 26px; }
  .settings-column { gap: 12px; }
  .input-group { gap: 8px; }
  .flip-button { min-height: 50px; font-size: 20px; }
  .error-message { min-height: 1.4em; margin-top: 0; }
  .coin-container { --coin: clamp(96px, 30vw, 120px); margin-top: calc(var(--coin) * .22); margin-bottom: calc(var(--coin) * .14); }
  .coin-result { min-height: 44px; }
}
@media (max-width: 380px) {
  .option-inputs { gap: 14px; }
  .question-input, .option-input { font-size: 16px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .container { padding: 56px 24px 12px; align-items: flex-start; }
  h1 { font-size: 22px; }
  .settings-column { gap: 10px; }
  .input-group { gap: 8px; }
  .question-input, .option-input { font-size: 16px; padding: 6px 0; }
  .flip-button { min-height: 46px; font-size: 18px; }
  .error-message { min-height: 1.2em; margin: 0; }
  .coin-container { --coin: clamp(90px, 24vh, 140px); margin-top: calc(var(--coin) * .6); }
  .coin-result.show { font-size: clamp(28px, 6vh, 44px); }
}
@media (prefers-reduced-motion: reduce) {
  .coin.flipping-front, .coin.flipping-back { animation: calm 2s linear both; }
  .coin.flipping-front .spin, .coin.flipping-back .spin { animation: none; transform: rotateX(var(--a1)); }
  .coin.flipping-front + .coin-shadow, .coin.flipping-back + .coin-shadow { animation: none; }
  @keyframes calm { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .coin-result { transition: none; }
}
</style>

</head>
<body>
  <a href="/" class="home-button" data-i18n="home">Главная</a>

  <div class="container">
    <div class="main-layout">
      <div class="settings-column">
        <h1 data-i18n="h1">Подбрось монетку</h1>
        <div class="input-group">
          <input
            type="text"
            id="questionInput"
            class="question-input"
            placeholder="Введи свой вопрос сюда"
            data-i18n-attr="placeholder:question_ph"
            maxlength="100"
            autocomplete="off"
          />

          <div class="option-inputs">
            <div class="option-wrapper">
              <label for="option1" data-i18n="option1_label">Вариант 1</label>
              <input type="text" id="option1" class="option-input" value="Да" maxlength="10" autocomplete="off" />
              <div class="char-counter" id="counter1">0 / 10</div>
            </div>

            <div class="option-wrapper">
              <label for="option2" data-i18n="option2_label">Вариант 2</label>
              <input type="text" id="option2" class="option-input" value="Нет" maxlength="10" autocomplete="off" />
              <div class="char-counter" id="counter2">0 / 10</div>
            </div>
          </div>

          <div class="error-message" id="errorMessage" role="status" data-i18n="err_length">
            Каждый вариант должен содержать от 1 до 10 символов
          </div>
        </div>

        <button class="flip-button" id="flipButton" data-i18n="flip_btn">
          Подбросить
        </button>
      </div>

      <div class="coin-column" id="scene">
        <div class="coin-result" id="coinResult" role="status" aria-live="polite"></div>
        <div class="coin-container">
          <div class="coin" id="coin">
            <div class="tilt">
              <div class="spin" id="spin">
                <div class="face coin-front" id="coinFront">Да</div>
                <div class="face coin-back" id="coinBack">Нет</div>
              </div>
            </div>
          </div>
          <div class="coin-shadow" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>
<script>
  const questionInput = document.getElementById('questionInput');
  const option1Input = document.getElementById('option1');
  const option2Input = document.getElementById('option2');
  const counter1 = document.getElementById('counter1');
  const counter2 = document.getElementById('counter2');
  const errorMessage = document.getElementById('errorMessage');
  const flipButton = document.getElementById('flipButton');
  const coin = document.getElementById('coin');
  const coinFront = document.getElementById('coinFront');
  const coinBack = document.getElementById('coinBack');
  const coinResult = document.getElementById('coinResult');
  const spin = document.getElementById('spin');
  const sceneEl = document.getElementById('scene');

  // 🔹 Только оформление: строка результата (ожидание → «в воздухе» → результат) и подгонка текста на сторонах монеты
  let stripState = 'idle';
  let lastResultOpt = '';
  function renderStrip() {
    if (!window.I18N) return;
    if (stripState === 'idle') coinResult.textContent = I18N.t('strip_idle');
    else if (stripState === 'air') coinResult.textContent = I18N.t('strip_air');
    else coinResult.textContent = I18N.t('result_prefix') + lastResultOpt;
    fitText(coinResult);
  }
  function fitText(el) {
    el.style.fontSize = '';
    let s = parseFloat(getComputedStyle(el).fontSize) || 16, n = 0;
    while (el.scrollWidth > el.clientWidth && s > 9 && n++ < 40) { s -= 1; el.style.fontSize = s + 'px'; }
  }
  function syncWords() {
    const a = option1Input.value.trim() || option1Input.placeholder || '';
    const b = option2Input.value.trim() || option2Input.placeholder || '';
    if (typeof isFlipping === 'undefined' || !isFlipping) {
      coinFront.textContent = a;
      coinBack.textContent = b;
      fitText(coinFront);
      fitText(coinBack);
    }
  }
  // 🔹 Толщина монеты: 16 дисков между гранями (только вид)
  for (let i = 0; i < 16; i++) { const e = document.createElement('div'); e.className = 'edge'; e.style.setProperty('--i', i); spin.insertBefore(e, coinFront); }
  // 🔹 Плавная смена надписи под монетой: гаснет, меняется, появляется (без скачка размера)
  let swapTimer = 0;
  function swapStrip(apply) {
    coinResult.classList.add('fading');
    clearTimeout(swapTimer);
    swapTimer = setTimeout(() => { apply(); coinResult.classList.remove('fading'); }, 220);
  }
  let restAngle = 0; // 0 — лежит первая сторона, 180 — вторая
  option1Input.addEventListener('input', syncWords);
  option2Input.addEventListener('input', syncWords);
  window.addEventListener('resize', syncWords);

  const STORAGE_KEY = 'coin_flip_options';

  // 🔹 Известные значения по умолчанию во всех языках (для локализации при смене языка)
  const KNOWN_YES = ['Да', 'Yes', 'Ναι'];
  const KNOWN_NO = ['Нет', 'No', 'Όχι'];

  // 🔹 Установка рандомного плейсхолдера и дефолтов для вариантов
  function setDefaultPlaceholders() {
    if (!window.I18N) return;
    const defaultQuestions = I18N.t('default_questions');
    // Только если пользователь ещё ничего не ввёл
    if (!questionInput.value) {
      const randomIndex = Math.floor(Math.random() * defaultQuestions.length);
      questionInput.placeholder = defaultQuestions[randomIndex];
    }

    // Да / Нет как плейсхолдеры ответов, если поля пустые
    if (!option1Input.value) {
      option1Input.placeholder = I18N.t('opt_yes');
    }
    if (!option2Input.value) {
      option2Input.placeholder = I18N.t('opt_no');
    }
  }

  // 🔹 Локализация значений по умолчанию (Да/Нет) при смене языка
  function localizeDefaults() {
    if (KNOWN_YES.includes(option1Input.value)) option1Input.value = I18N.t('opt_yes');
    if (KNOWN_NO.includes(option2Input.value)) option2Input.value = I18N.t('opt_no');
    setDefaultPlaceholders();
    updateCounters();
    validateOptions();
    syncWords();
    renderStrip();
  }
  window.addEventListener('langchange', localizeDefaults);

  function loadSavedOptions() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const { question, opt1, opt2 } = JSON.parse(saved);
        if (question && question.length >= 0 && question.length <= 100) {
          questionInput.value = question;
        }
        if (opt1 && opt1.length >= 1 && opt1.length <= 10) {
          option1Input.value = opt1;
        }
        if (opt2 && opt2.length >= 1 && opt2.length <= 10) {
          option2Input.value = opt2;
        }
        updateCounters();
      }
    } catch (e) {}
  }

  function saveOptions() {
    try {
      const question = questionInput.value.trim();
      const opt1 = option1Input.value.trim();
      const opt2 = option2Input.value.trim();
      if (opt1.length >= 1 && opt1.length <= 10 &&
          opt2.length >= 1 && opt2.length <= 10) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ question, opt1, opt2 }));
      }
    } catch (e) {}
  }

  function updateCounters() {
    const len1 = option1Input.value.length;
    const len2 = option2Input.value.length;
    
    counter1.textContent = `${len1} / 10`;
    counter2.textContent = `${len2} / 10`;
    
    if (len1 === 0 || len1 > 10) {
      counter1.classList.add('error');
    } else {
      counter1.classList.remove('error');
    }
    
    if (len2 === 0 || len2 > 10) {
      counter2.classList.add('error');
    } else {
      counter2.classList.remove('error');
    }
  }

  function validateOptions() {
    const opt1 = option1Input.value.trim();
    const opt2 = option2Input.value.trim();
    
    const valid1 = opt1.length >= 1 && opt1.length <= 10;
    const valid2 = opt2.length >= 1 && opt2.length <= 10;
    
    if (!valid1) {
      option1Input.classList.add('error');
    } else {
      option1Input.classList.remove('error');
    }
    
    if (!valid2) {
      option2Input.classList.add('error');
    } else {
      option2Input.classList.remove('error');
    }
    
    if (!valid1 || !valid2) {
      errorMessage.textContent = window.I18N ? I18N.t('err_length') : '';
      errorMessage.classList.add('show');
      flipButton.disabled = true;
      return false;
    }

    if (opt1.toLowerCase() === opt2.toLowerCase()) {
      errorMessage.textContent = window.I18N ? I18N.t('err_same') : '';
      errorMessage.classList.add('show');
    } else {
      errorMessage.classList.remove('show');
    }
    
    flipButton.disabled = false;
    return true;
  }

  questionInput.addEventListener('input', () => {
    saveOptions();
  });

  option1Input.addEventListener('input', () => {
    updateCounters();
    validateOptions();
    saveOptions();
  });

  option2Input.addEventListener('input', () => {
    updateCounters();
    validateOptions();
    saveOptions();
  });

  let isFlipping = false;

  flipButton.addEventListener('click', () => {
    if (!validateOptions() || isFlipping) return;

    isFlipping = true;
    flipButton.disabled = true;
    questionInput.disabled = true;
    option1Input.disabled = true;
    option2Input.disabled = true;

    const opt1 = option1Input.value.trim();
    const opt2 = option2Input.value.trim();
    coinFront.textContent = opt1;
    coinBack.textContent = opt2;

    swapStrip(() => { coinResult.classList.remove('show'); coinResult.classList.add('air'); stripState = 'air'; renderStrip(); });

    // сбрасываем анимацию и положение
    coin.classList.remove('flipping-front', 'flipping-back');

    const result = Math.random() < 0.5 ? 'front' : 'back';
    // из текущего положения до нужной стороны: 5 полных оборотов + доворот (ничего не сбрасывается)
    const target = result === 'front' ? 0 : 180;
    const delta = (((target - restAngle) % 360) + 360) % 360;
    spin.style.setProperty('--a0', restAngle + 'deg');
    spin.style.setProperty('--a1', (restAngle + 5 * 360 + delta) + 'deg');
    void coin.offsetWidth;

    // даём браузеру кадр, чтобы применить сброс
    setTimeout(() => {
      // запускаем нужную анимацию
      if (result === 'front') {
        coin.classList.add('flipping-front');
      } else {
        coin.classList.add('flipping-back');
      }

      // после окончания анимации
      setTimeout(() => {
        // фиксируем финальный угол: он равен последнему кадру анимации, рывка нет
        spin.style.transform = 'rotateX(' + target + 'deg)';
        restAngle = target;
        coin.classList.remove('flipping-front', 'flipping-back');

        lastResultOpt = result === 'front' ? opt1 : opt2;
        swapStrip(() => { stripState = 'result'; coinResult.classList.remove('air'); coinResult.classList.add('show'); renderStrip(); sceneEl.dataset.win = result === 'front' ? '1' : '2'; });

        isFlipping = false;
        flipButton.disabled = false;
        questionInput.disabled = false;
        option1Input.disabled = false;
        option2Input.disabled = false;
      }, 2000); // 2s = длительность анимации
    }, 50);
  });

  loadSavedOptions();
  setDefaultPlaceholders();
  updateCounters();
  validateOptions();
  syncWords();
  renderStrip();
</script>
