<style>
  /* Современный live-казино пульт: почти чёрный фон, плоские поверхности с тонкой гранью, точные акценты —
     зелёное сукно, красный рулетки и один тёплый жёлтый. Тактильны только игровые предметы: фишки и стол.
     Шрифт один — Inter Tight (кириллица и греческий), крупные цифры табличные. */
  :root {
    --bg: #0a0b0d;
    --surface: #14161a;
    --surface-2: #1c1f25;
    --surface-3: #262a32;
    --line: rgba(255, 255, 255, .08);
    --line-2: rgba(255, 255, 255, .14);
    --text: #f4f4f1;
    --ivory: #f4f4f1;
    --muted: #8f96a1;
    --accent: #ffc043;
    --accent-ink: #1a1305;
    --gold: #ffc043;
    --gold-hi: #ffd57a;
    --green: #22c77f;
    --felt: #0c6a44;
    --felt-hi: #0f7d50;
    --felt-lo: #084a30;
    --red: #e3263a;
    --red-lo: #9b1424;
    --black: #17191e;
    --zero: #17b06b;
    --warn: #ff6a3d;
    --ok: #3ddc84;
    --ink: #0a0b0d;
    --serif: "Inter Tight", "Helvetica Neue", Arial, system-ui, sans-serif;
    --cond: "Inter Tight", "Helvetica Neue", Arial, system-ui, sans-serif;
    --spring: cubic-bezier(.3, 1.5, .5, 1);
    --lang-switch-bg: #14161a;
    --lang-switch-border: rgba(255, 255, 255, .1);
    --lang-switch-fg: #a8aeb8;
    --lang-switch-active-bg: #f4f4f1;
    --lang-switch-active-fg: #0a0b0d;
    --lang-switch-active-border: transparent;
    --lang-switch-font: "Inter Tight", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; max-width: 100vw; overflow-x: hidden; }
  body {
    min-height: 100dvh; color: var(--text); font: 500 15px/1.4 var(--cond); letter-spacing: -.005em;
    /* свет над столом — зелёный отсвет сукна сверху, без текстур */
    background: radial-gradient(110% 50% at 50% -10%, rgba(34, 199, 127, .14), rgba(34, 199, 127, 0) 60%), var(--bg);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }
  svg.ic { width: 20px; height: 20px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #app { min-height: 100dvh; display: flex; flex-direction: column; }
  .util { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 10px; z-index: 30; display: flex; gap: 8px; align-items: center; }
  .util a { font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 0 4px; display: inline-flex; align-items: center; min-height: 44px; }
  .sound-toggle-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: grid; place-items: center; }
  /* roulette-032/007: тап-цель языка 44 px (i18n.js на ≤520 ставит 36 с !important — перебиваем) */
  body .lang-switch { top: calc(4px + env(safe-area-inset-top)); }
  body .lang-switch button { min-width: 44px !important; min-height: 44px !important; font-weight: 700 !important; }

  /* ---------- фишка: игровой предмет, остаётся тактильной ---------- */
  .rchip {
    --c: #f2c14e; --cd: #8a6a22; --cs: #ffffff; --inlay: #fbfaf6;
    position: relative; border-radius: 50%; display: grid; place-items: center; color: #111; font-style: normal;
    font: 800 13px/1 var(--cond); font-variant-numeric: tabular-nums; letter-spacing: -.03em;
    background:
      radial-gradient(circle, var(--inlay) 0 50%, var(--cd) 51% 53%, var(--c) 54% 66%, rgba(0, 0, 0, 0) 67%),
      repeating-conic-gradient(from 8deg, var(--c) 0 32deg, var(--cs) 32deg 45deg);
    box-shadow: inset 0 0 0 1.5px var(--cd), 0 2px 0 var(--cd), 0 6px 10px -2px rgba(0, 0, 0, .55);
  }
  .rchip.dark { --inlay: #1c1f25; color: var(--accent); }

  /* ---------- кнопки: плоские, пружинят под пальцем ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; border: 0; background: var(--accent); color: var(--accent-ink); font: 800 17px/1 var(--cond); letter-spacing: -.01em; border-radius: 16px; padding: 16px 20px; min-height: 58px; box-shadow: 0 10px 30px -10px rgba(255, 192, 67, .55); transition: transform .18s var(--spring), box-shadow .2s; }
  .btn:active:not(:disabled) { transform: scale(.97); box-shadow: 0 4px 14px -6px rgba(255, 192, 67, .5); }
  .btn.shine { position: relative; overflow: hidden; }
  .btn.shine::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 24%; background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .55), rgba(255, 255, 255, 0)); transform: skewX(-20deg); animation: shine 3.6s ease-in-out infinite; }
  @keyframes shine { 0%, 60% { left: -40%; } 100% { left: 130%; } }
  .link { background: none; border: 0; color: var(--text); font-weight: 700; text-decoration: none; padding: 10px 14px; font-size: 14px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line-2); }

  .hud { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) 136px 48px; gap: 10px; align-items: center; padding: 0 4px; height: 48px; }
  .hud .me { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .mystack { width: 28px; height: 32px; position: relative; flex: none; }
  .mystack i { position: absolute; left: 0; width: 28px; height: 9px; border-radius: 50%; background: repeating-linear-gradient(90deg, var(--c) 0 5px, var(--cs) 5px 7px); box-shadow: inset 0 -2px 0 var(--cd); }
  .mystack i:nth-child(1) { bottom: 0; } .mystack i:nth-child(2) { bottom: 7px; } .mystack i:nth-child(3) { bottom: 14px; }
  .mystack i:nth-child(4) { bottom: 21px; background: radial-gradient(ellipse at 50% 45%, #fbfaf6 0 35%, var(--c) 38% 72%, var(--cd) 74%); }
  .hud .stack { font: 900 32px/1 var(--cond); letter-spacing: -.045em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .hud .stack.bump { animation: bump .4s var(--spring); }
  @keyframes bump { 40% { transform: scale(1.12); color: var(--ok); } }
  .need { min-width: 0; display: grid; gap: 5px; }
  .need .nl { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; line-height: 1; }
  .need .nl b { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; }
  .meter { position: relative; height: 18px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--warn); transition: width .3s var(--spring); border-radius: 9px; }
  .meter span { position: absolute; inset: 0; display: grid; place-items: center; font: 800 10.5px/1 var(--cond); letter-spacing: .04em; text-transform: uppercase; color: #fff; white-space: nowrap; }
  .need:not(.ok):not(.short) .meter i { background: var(--surface-3); }
  .need.ok .meter i { background: var(--green); }
  .need.ok .meter span { color: #04210f; }
  .need.short.hurry .meter { animation: needpulse .8s ease-in-out infinite; }
  @keyframes needpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 125, 85, 0); } 50% { box-shadow: 0 0 0 4px rgba(255, 125, 85, .5); } }
  .need.short.hurry .meter span { font-size: 13px; }
  .need.short.hurry .nl b { color: var(--warn); }
  .need.short .meter i { background: repeating-linear-gradient(-45deg, #ff7d55 0 6px, #f0582b 6px 12px); }
  .need.short .nl b:last-child { color: var(--warn); }
  /* стол: сукно в тонкой тёмной рамке, линии разметки белые и тонкие */
  .table-wrap { flex: 1; min-height: 0; position: relative; border-radius: 20px; padding: 5px; background: var(--surface); border: 1px solid var(--line); }
  .felt {
    position: absolute; inset: 5px; border-radius: 15px;
    background: radial-gradient(100% 70% at 50% 30%, var(--felt-hi), var(--felt) 55%, var(--felt-lo));
    display: grid; grid-template-columns: 40px 40px 1fr 1fr 1fr; /* roulette-032: дюжины и равные шансы ≥40 px в ширину (было 30) */ grid-template-rows: minmax(26px, 1fr) repeat(12, minmax(22px, 1fr)) minmax(24px, 1fr);
    overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .cell { position: relative; border-right: 1px solid rgba(255, 255, 255, .13); border-bottom: 1px solid rgba(255, 255, 255, .13); display: grid; place-items: center; font: 700 15px/1 var(--cond); min-width: 0; min-height: 0; }
  .num span { position: relative; z-index: 1; width: 34px; height: min(24px, 82%); display: grid; place-items: center; border-radius: 7px; font: 800 15px/1 var(--cond); letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: #fff; }
  .num.red span { background: var(--red); }
  .num.black span { background: var(--black); }
  .zero { grid-column: 3 / 6; grid-row: 1; }
  .zero span { width: 76px; background: var(--zero) !important; border-radius: 999px; }
  .col { font: 800 12px/1 var(--cond); color: rgba(255, 255, 255, .75); }
  .dz, .ev { font: 800 11.5px/1 var(--cond); color: rgba(255, 255, 255, .8); writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .06em; text-transform: uppercase; }
  .ev.red-box::after, .ev.black-box::after { content: ""; width: 16px; height: 16px; transform: rotate(45deg); border-radius: 3px; }
  .ev.red-box::after { background: var(--red); }
  .ev.black-box::after { background: var(--black); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
  .ev.red-box, .ev.black-box { writing-mode: horizontal-tb; transform: none; }
  .corner-blank { grid-column: 1 / 3; grid-row: 1; border-right: 1px solid rgba(255, 255, 255, .13); border-bottom: 1px solid rgba(255, 255, 255, .13); display: grid; place-items: center; }
  .corner-blank .hist { display: flex; gap: 3px; }
  .corner-blank .hist i { width: 18px; height: 18px; border-radius: 50%; font: 800 9px/18px var(--cond); text-align: center; font-style: normal; opacity: .7; }
  .corner-blank .hist i:first-child { width: 22px; height: 22px; line-height: 22px; font-size: 11px; opacity: 1; box-shadow: 0 0 0 2px #fff; }
  .foot-blank { grid-column: 1 / 3; grid-row: 14; border-right: 1px solid rgba(255, 255, 255, .13); }
  .cell.hit { background: rgba(255, 255, 255, .22); box-shadow: inset 0 0 0 2px #fff; }
  /* маркер на выпавшем числе */
  .cell.hit.num::after { content: ""; position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; margin: -17px 0 0 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--accent), 0 4px 8px rgba(0, 0, 0, .5); animation: dolly .5s var(--spring) both; z-index: 2; }
  @keyframes dolly { from { transform: translateY(-30px) scale(1.4); opacity: 0; } }
  .hitlayer { grid-column: 3 / 6; grid-row: 1 / 14; position: relative; z-index: 3; }
  .chips { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  /* размер фишки считает drawChips по высоте строки (--cs/--cf): на строке 22 px фишка 44 px закрывала числа (roulette-021) */
  .chip { position: absolute; transform: translate(-50%, -50%); width: var(--sz, 30px); height: var(--sz, 30px); font-size: var(--cf, 10.5px); }
  .num.mine span { box-shadow: 0 0 0 2px #fff; }
  .cell.mine:not(.num) { background: rgba(255, 255, 255, .14); }
  .chip.pop { animation: drop .4s var(--spring); }
  .chip.pop::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #fff; animation: ripple .45s ease-out forwards; }
  @keyframes drop { 0% { transform: translate(-50%, -140%) scale(1.6); opacity: .2; } 55% { transform: translate(-50%, -50%) scale(.9); opacity: 1; } 75% { transform: translate(-50%, -58%) scale(1.04); } }
  @keyframes ripple { from { transform: scale(.8); opacity: 1; } to { transform: scale(2.3); opacity: 0; } }
  .chip.other { width: 14px; height: 14px; font-size: 0; opacity: .85; box-shadow: inset 0 0 0 1px var(--cd), 0 1px 0 var(--cd), 0 2px 3px rgba(0, 0, 0, .5); }
  .felt.frozen .hitlayer, .felt.locked .hitlayer { pointer-events: none; }
  .num::before { content: ""; position: absolute; inset: 0; background: radial-gradient(closest-side, rgba(255, 150, 60, .85), rgba(255, 80, 30, 0)); opacity: var(--heat, 0); transition: opacity .4s; pointer-events: none; }
  .num.fire span::after { content: "🔥"; position: absolute; margin: -20px 0 0 30px; font-size: 13px; }
  .bubble { position: absolute; z-index: 5; transform: translate(-50%, -150%); pointer-events: none; white-space: nowrap; font: 800 11px/1 var(--cond); color: #111; background: var(--c); padding: 5px 8px; border-radius: 999px; box-shadow: 0 6px 14px -4px rgba(0, 0, 0, .6); animation: bubble 1.5s ease-out forwards; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  @keyframes bubble { 0% { opacity: 0; transform: translate(-50%, -80%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -150%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%); } }
  .ghost { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; pointer-events: none; font: 900 min(52vw, 240px)/1 var(--cond); letter-spacing: -.06em; color: rgba(255, 106, 61, .2); font-variant-numeric: tabular-nums; }
  .ghost.pop { animation: ghost 1s ease-out; }
  @keyframes ghost { from { transform: scale(1.4); color: rgba(255, 106, 61, .45); } }
  .controls.spect::after { content: attr(data-spect); position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 16px; border-radius: 16px; font: 700 16px/1.3 var(--cond); color: var(--text); background: var(--surface); border: 1px solid var(--line); }
  .rack { display: flex; gap: 4px; align-items: center; justify-content: space-between; padding: 5px 7px; height: 60px; border-radius: 30px; background: var(--surface); border: 1px solid var(--line); }
  .rack .den { flex: none; width: 46px; height: 46px; border: 0; padding: 0; font-size: 12.5px; transition: transform .2s var(--spring), box-shadow .2s; }
  .rack .den.sel { transform: translateY(-6px) scale(1.1); box-shadow: inset 0 0 0 1.5px var(--cd), 0 2px 0 var(--cd), 0 0 0 3px var(--bg), 0 0 0 5px #fff, 0 12px 16px -4px rgba(0, 0, 0, .7); }
  /* «ВА-БАНК» / «ALL IN» — в две строки внутри вкладки фишки */
  .rack .den.all { font-size: 8.5px; line-height: 1.05; letter-spacing: -.02em; text-align: center; padding: 0 9px; }
  .actions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 1.7fr; gap: 5px; }
  .act { height: 46px; border-radius: 14px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--text); font: 700 11px/1.05 var(--cond); padding: 2px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: transform .18s var(--spring), background .15s; }
  .act:active:not(:disabled) { transform: scale(.94); background: var(--surface-2); }
  .act .i { display: block; line-height: 1; color: var(--text); }
  .act .i svg.ic { width: 18px; height: 18px; }
  .act.dbl { font: 900 18px/1 var(--cond); letter-spacing: -.02em; }
  .act.ready { background: var(--accent); color: var(--accent-ink); font: 900 16px/1 var(--cond); letter-spacing: -.01em; box-shadow: 0 8px 20px -10px rgba(255, 192, 67, .7); white-space: nowrap; }
  .act.ready.arm { font-size: 12.5px; letter-spacing: -.02em; background: var(--warn); color: #fff; box-shadow: 0 0 0 3px rgba(255, 106, 61, .3); animation: stamp .35s var(--spring); }
  /* пока ставки закрыты — лоток и кнопки притушены и не нажимаются */
  .controls.locked .rack, .controls.locked .act:not(.ready) { opacity: .35; pointer-events: none; }
  .rack .den.off { opacity: .3; }
  .act.ready.on { background: var(--green); color: #04210f; box-shadow: 0 8px 20px -10px rgba(34, 199, 127, .8); }
  .act.ready.stamp { animation: stamp .45s var(--spring); }

  /* ---------- соло: страница ---------- */
  body { background: radial-gradient(110% 50% at 50% -10%, rgba(34, 199, 127, .14), rgba(34, 199, 127, 0) 60%), var(--bg); padding: 0; min-height: 100dvh; }
  .game { --ctl-h: 112px; position: relative; display: flex; flex-direction: column; min-height: 100dvh; padding: calc(56px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom)); gap: 6px; }
  .game .table-wrap { min-height: 272px; }
  .game .controls { height: var(--ctl-h); }
  .hud { grid-template-columns: minmax(0, 1fr) 136px 44px; }
  .hud .me { flex-direction: row; }
  .hud .spinno { font: 700 11px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .hud .stackbox { min-width: 0; }
  .qbtn { width: 44px; height: 44px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); display: grid; place-items: center; padding: 0; transition: transform .18s var(--spring), background .15s, color .15s; }
  .qbtn:active:not(:disabled) { transform: scale(.94); }
  .qbtn.arm { background: var(--warn); color: #fff; animation: stamp .35s var(--spring); }
  .qbtn:disabled { opacity: .3; }
  .actions { grid-template-columns: repeat(4, minmax(0, 1fr)) 1.9fr; }
  .act.ready.more { background: var(--surface-3); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 14px; }
  .act.ready.wait { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
  .act.ready:disabled { opacity: 1; }
  .felt.locked { filter: saturate(.7) brightness(.8); }

  /* сцена с колесом: на телефоне выезжает поверх стола, пока шарик в игре; на широком экране стоит слева всегда */
  .stage { position: absolute; z-index: 6; left: 8px; right: 8px; top: calc(52px + env(safe-area-inset-top)); bottom: calc(var(--ctl-h) + 14px + env(safe-area-inset-bottom)); border-radius: 20px; overflow: hidden; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .35s ease, visibility 0s linear .35s; background: radial-gradient(60% 50% at 50% 42%, rgba(12, 106, 68, .55), rgba(12, 106, 68, 0) 80%), radial-gradient(90% 80% at 50% 40%, #16181d, var(--bg) 75%); box-shadow: inset 0 0 0 1px var(--line); }
  body.show-stage .stage { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .35s ease; }
  .stage canvas { display: block; }
  .stagebar { position: absolute; left: 0; right: 0; top: 12px; text-align: center; pointer-events: none; font: 800 13px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .8); text-shadow: 0 2px 10px rgba(0, 0, 0, .8); }
  .result { position: absolute; left: 10px; right: 10px; bottom: 10px; display: none; align-items: center; gap: 14px; padding: 12px 12px 12px 12px; border-radius: 20px; background: rgba(14, 16, 20, .88); box-shadow: inset 0 0 0 1px var(--line-2), 0 18px 40px -12px rgba(0, 0, 0, .8); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: rise .45s var(--spring) both; }

<script>
"use strict";
const RG = window.RouletteGame;
const T = (k) => rlT(k);
const tpl = (k, v) => rlTpl(k, v);
const $ = (id) => document.getElementById(id);
const PID = "me";
const COLOR = "#f2c14e";
const REC_KEY = "roulette_solo_best_v1", SAVE_KEY = "roulette_solo_game_v1", PREF_KEY = "roulette_solo_pref_v1";
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// честный жребий: crypto, а не Math.random (отказ без выборки по остатку)
function rnd(n) {
  try {
    const a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n;
    let x;
    do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim);
    return x % n;
  } catch (e) { return Math.floor(Math.random() * n); }
}

let game = null, scene = null, sceneKey = "", phaseKey = "";
let myBets = {}, undo = [], chipIdx = 1, lastAdded = null;
let newRecord = false, peak = 0, startStack = 1000, quitArmed = 0, shownStack = null, els = {};
let pref = Object.assign({ mode: "classic", stack: 1000 }, lsGet(PREF_KEY) || {});

const me = () => game && game.player(PID);
const now = () => Date.now();
const phase = () => (game ? game.s.phase : "");
const canBet = () => phase() === "betting" && me() && !me().out;
function saveGame() { if (game && game.s.solo && game.s.phase !== "finished") lsSet(SAVE_KEY, { s: game.s, peak, startStack, pref }); }

let toastT = null;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), 2200);
}

function wheelSvg() {
  const C = 150, n = RL_WHEEL.length, a = (Math.PI * 2) / n;
  const pt = (r, t) => `${(C + r * Math.cos(t)).toFixed(1)},${(C + r * Math.sin(t)).toFixed(1)}`;
  let cells = "";
  RL_WHEEL.forEach((num, i) => {
    const a0 = i * a - Math.PI / 2 - a / 2, a1 = a0 + a;
    const col = num === 0 ? "#17b06b" : RL_RED.has(num) ? "#e3263a" : "#17191e";
    cells += `<path d="M${pt(92, a0)}L${pt(134, a0)}A134,134 0 0 1 ${pt(134, a1)}L${pt(92, a1)}A92,92 0 0 0 ${pt(92, a0)}Z" fill="${col}"/>`;
  });
  const frets = RL_WHEEL.map((_, i) => { const t = i * a - Math.PI / 2 - a / 2; return `M${pt(92, t)}L${pt(134, t)}`; }).join("");
  return `<svg viewBox="0 0 300 300" aria-hidden="true">
    <defs><radialGradient id="hr" cx=".45" cy=".4"><stop offset="0" stop-color="#2b2f37"/><stop offset="1" stop-color="#0d0e11"/></radialGradient>
    <radialGradient id="hc" cx=".45" cy=".4"><stop offset="0" stop-color="#2a2e36"/><stop offset=".7" stop-color="#17191e"/><stop offset="1" stop-color="#0d0e11"/></radialGradient>
    <radialGradient id="hb" cx=".4" cy=".35"><stop offset="0" stop-color="#ffe3a0"/><stop offset=".6" stop-color="#ffc043"/><stop offset="1" stop-color="#c98f1a"/></radialGradient></defs>
    <circle cx="150" cy="150" r="149" fill="url(#hr)"/><circle cx="150" cy="150" r="136" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
    ${cells}<path d="${frets}" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/>
    <circle cx="150" cy="150" r="92" fill="url(#hc)" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
    <g fill="url(#hb)"><path d="M150 96l7 44 44 7-44 7-7 44-7-44-44-7 44-7z"/><circle cx="150" cy="150" r="16"/></g></svg>`;
}

// ---------- 3D-колесо: если модуль не загрузился, играем без него ----------
async function loadScene() {
  try {
    const mod = await import("./roulette-wheel.js");
    scene = mod.createRouletteScene($("stage"), { quality: "auto", lang: (window.I18N && I18N.lang) || "ru", safeArea: { top: 0.06, right: 0.03, bottom: 0.2, left: 0.03 } });
    window.addEventListener("resize", () => scene && scene.resize());
    syncScene(true);
  } catch (err) {
    console.error("[roulette-solo] сцена не загрузилась:", err);
    scene = null;
    toast(T("wheel_fail"));
  }
}
function syncScene(force) {
  if (!scene || !game) return;
  const s = game.s, p = me();
  const players = [{ id: PID, name: p.name, color: COLOR, bets: p.bets || {} }];
  const key = s.spin + ":" + s.phase;
  if (s.phase === "betting" || s.phase === "lobby" || s.phase === "finished") {
    if (force || key !== sceneKey) scene.setIdle();
    scene.setBets(s.phase === "betting" ? players : []);
  } else if (s.phase === "closing" && s.result) {
    if (force || key !== sceneKey) { scene.setBets(players); scene.noMoreBets(); scene.spin(s.result); }
  } else if (s.phase === "spinning" && s.result) {
    if (force || (key !== sceneKey && !sceneKey.startsWith(s.spin + ":closing"))) { scene.setBets(players); scene.spin(s.result); }
  } else if (s.phase === "payout" && s.result && s.result.perPlayer) {
    if (force || key !== sceneKey) scene.payout({ number: s.result.number, players, perPlayer: s.result.perPlayer });
  }
  sceneKey = key;
}

// ---------- стол: сукно, фишки, лоток (из пульта roulette.html) ----------
function denominations() {
  const min = Math.max(1, game ? game.levelNeed() : 10);
  const p = me();
  if (p && !p.out && p.stack > 0 && p.stack < min) {
    const st = p.stack;
    return [...new Set([Math.max(1, Math.ceil(st / 4)), Math.max(1, Math.ceil(st / 2)), st])];
  }
  return [1, 2, 5, 10, 25].map((k) => k * min);
}
function fmtChip(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + "M";
  if (n >= 10000) return Math.round(n / 1000) + "k";
  if (n >= 1000) return (n / 1000).toFixed(n % 1000 ? 1 : 0) + "k";
  return String(n);
}
function pushBets(next) {
  const p = me();
  if (!p || !canBet()) return false;
  if (rlSum(next) > p.stack) { toast(T("no_money")); return false; }
  const r = game.setBets(PID, next);
  if (!r.ok) return false;
  undo.push(myBets);
  if (undo.length > 60) undo.shift();
  myBets = Object.assign({}, p.bets);
  saveGame();
  drawChips(true); drawHud(); syncScene(false);
  return true;
}
function addChip(key) {
  const p = me();
  if (!p || !canBet()) return;
  const dens = denominations();
  const free = p.stack - rlSum(myBets);
  let amt = chipIdx === dens.length ? free : dens[Math.min(chipIdx, dens.length - 1)];
  if (amt > free) amt = free;
  if (amt <= 0) { toast(T("no_money")); return; }
  const next = Object.assign({}, myBets);
  next[key] = (next[key] || 0) + amt;
  lastAdded = key;
  if (pushBets(next)) { rlSfx.chip(); rlBuzz(8); } else lastAdded = null;
}

function chipPos(key) {
  const b = RL_BETS[key];
  if (!b) return null;
  const outside = { dz: 1, col: 1, red: 1, black: 1, even: 1, odd: 1, low: 1, high: 1 };
  if (outside[b.type]) return { cell: key };
  const ns = b.numbers;
  const pos = (n) => (n === 0 ? { x: 1.5 / 3, y: 0.5 / 13 } : { x: (((n - 1) % 3) + 0.5) / 3, y: (Math.floor((n - 1) / 3) + 1.5) / 13 });
  if (b.type === "st" && !ns.includes(0)) { const p = pos(ns[2]); return { x: 1 - 0.02, y: p.y }; }
  if (b.type === "sl") { const p = pos(ns[2]); return { x: 1 - 0.02, y: p.y + 0.5 / 13 }; }
  if (ns.includes(0) && ns.length > 1) {
    const rest = ns.filter((n) => n);
    const avgX = rest.reduce((a, n) => a + pos(n).x, 0) / rest.length;
    return { x: key === "co:0-1-2-3" ? 0.02 : avgX, y: 1 / 13 };
  }
  const ps = ns.map(pos);
  return { x: ps.reduce((a, p) => a + p.x, 0) / ps.length, y: ps.reduce((a, p) => a + p.y, 0) / ps.length };
}
function rowEdges() {
  const top = els.felt.querySelector(".hitlayer").getBoundingClientRect().top;
  const e = [0, els.felt.querySelector(".num.zero").getBoundingClientRect().bottom - top];
  for (let r = 0; r < 12; r++) e.push(els.felt.querySelector(`.num[data-n="${3 * r + 1}"]`).getBoundingClientRect().bottom - top);
  return e;
}
function rowY(u) {
  const e = rowEdges();
  const k = Math.max(0, Math.min(12, Math.floor(u)));
  return e[k] + (u - k) * (e[k + 1] - e[k]);
}
function chipAt(key) {
  const p = chipPos(key);
  if (!p || !els.felt) return null;
  const fr = els.felt.getBoundingClientRect();
  if (p.cell) {
    const c = els.felt.querySelector(`[data-key="${p.cell}"]`);
    if (!c) return null;
    const cr = c.getBoundingClientRect();
    return { x: cr.left - fr.left + cr.width / 2, y: cr.top - fr.top + cr.height / 2 };
  }
  const hr = els.felt.querySelector(".hitlayer").getBoundingClientRect();
  return { x: hr.left - fr.left + p.x * hr.width, y: hr.top - fr.top + rowY(p.y * 13) };
}

function buildFelt() {
  const f = els.felt;
  const cells = [];
  const corner = el("div", "corner-blank");
  corner.append(el("div", "hist"));
  cells.push(corner);
  const zero = el("div", "cell num zero");
  zero.dataset.n = "0";
  zero.append(el("span", null, "0"));
  cells.push(zero);
  for (let r = 0; r < 12; r++) {
    for (let c = 0; c < 3; c++) {
      const n = 3 * r + c + 1;
      const d = el("div", `cell num ${rlColor(n)}`);
      d.style.gridColumn = String(3 + c);
      d.style.gridRow = String(2 + r);
      d.dataset.n = String(n);
      d.append(el("span", null, String(n)));
      cells.push(d);
    }
  }
  const ev = [["low", "1–18"], ["even", null], ["red", ""], ["black", ""], ["odd", null], ["high", "19–36"]];
  ev.forEach(([key, label], i) => {
    const d = el("div", `cell ev ${key === "red" ? "red-box" : key === "black" ? "black-box" : ""}`, label == null ? rlT("bet_" + key) : label);
    d.style.gridColumn = "1";
    d.style.gridRow = `${2 + i * 2} / span 2`;
    d.dataset.key = key;
    cells.push(d);
  });
  for (let i = 0; i < 3; i++) {
    const d = el("div", "cell dz", ["1–12", "13–24", "25–36"][i]);
    d.style.gridColumn = "2";
    d.style.gridRow = `${2 + i * 4} / span 4`;
    d.dataset.key = `dz:${i + 1}`;
    cells.push(d);
  }
  cells.push(el("div", "foot-blank"));
  for (let c = 0; c < 3; c++) {
    const d = el("div", "cell col", "2:1");
    d.style.gridColumn = String(3 + c);
    d.style.gridRow = "14";
    d.dataset.key = `col:${c + 1}`;
    cells.push(d);
  }
  const hit = el("div", "hitlayer");
  const chips = el("div", "chips");
  chips.id = "chips";
  f.replaceChildren(...cells, hit, chips);
  f.addEventListener("click", (e) => {
    const k = e.target.closest("[data-key]");
    if (k && !hit.contains(e.target)) addChip(k.dataset.key);
  });
  let press = null;
  hit.addEventListener("pointerdown", (e) => {
    if (!canBet()) return;
    const r = hit.getBoundingClientRect();
    const edges = rowEdges(), y = e.clientY - r.top;
    let k = 0;
    while (k < 12 && y >= edges[k + 1]) k++;
    const rh = Math.max(1, edges[k + 1] - edges[k]);
    press = { x: e.clientX, y: e.clientY, fx: (e.clientX - r.left) / r.width, fy: (k + Math.max(0, Math.min(0.9999, (y - edges[k]) / rh))) / 13, w: r.width, h: rh * 13 };
  });
  hit.addEventListener("pointermove", (e) => { if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 12) press = null; });
  hit.addEventListener("pointerup", () => {
    if (!press) return;
    const key = hitKey(Math.max(0, Math.min(0.9999, press.fx)), Math.max(0, Math.min(0.9999, press.fy)), press.w, press.h);
    press = null;
    if (key) addChip(key);
  });
  hit.addEventListener("pointercancel", () => { press = null; });
  hit.addEventListener("contextmenu", (e) => e.preventDefault());
}

function drawChips(animate) {
  const layer = $("chips");
  if (!layer || !game) return;
  const out = [];
  const e = rowEdges();
  const rowH = e[2] - e[1];
  const S = Math.max(26, Math.min(34, Math.floor(rowH * 0.8)));
  layer.style.setProperty("--sz", S + "px");
  layer.style.setProperty("--cf", Math.max(10, Math.min(12.5, S * 0.36)).toFixed(1) + "px");
  const nudge = (key, at) => {
    const b = RL_BETS[key];
    if (!b) return at;
    if (b.type === "n" && rowH < 32) return { x: at.x + 8, y: at.y };
    if (["red", "black", "even", "odd", "low", "high"].includes(key)) return { x: at.x + 9, y: at.y };
    return at;
  };
  els.felt.querySelectorAll(".mine").forEach((c) => c.classList.remove("mine"));
  for (const key of Object.keys(myBets)) {
    const b = RL_BETS[key];
    const c = b && b.type === "n" ? els.felt.querySelector(`.num[data-n="${b.numbers[0]}"]`) : els.felt.querySelector(`[data-key="${key}"]`);
    if (c) c.classList.add("mine");
  }
  const min = game.levelNeed();
  for (const [key, amount] of Object.entries(myBets)) {
    const at0 = chipAt(key);
    const at = at0 && nudge(key, at0);
    if (!at) continue;
    const d = el("div", "chip rchip" + (animate && key === lastAdded ? " pop" : ""), fmtChip(amount));
    const layers = rlStackLayers(amount, min);
    let sh = "inset 0 0 0 1.5px var(--cd)";
    for (let i = 1; i < layers; i++) sh += `, 0 ${i * 3}px 0 ${i % 2 ? "var(--cd)" : "var(--c)"}`;
    sh += `, 0 ${layers * 3}px 0 rgba(0,0,0,.5), 0 ${layers * 3 + 3}px 6px rgba(0,0,0,.5)`;
    d.style.cssText = rlChipVars(COLOR) + `;box-shadow:${sh};left:${Math.max(S / 2 + 1, Math.min(els.felt.clientWidth - S / 2 - 1, at.x))}px;top:${at.y - (layers - 1) * 1.5}px`;
    out.push(d);
  }
  lastAdded = null;
  layer.replaceChildren(...out);
}

function buildRack() {
  const dens = denominations();
  const pick = (i) => { chipIdx = i; rlSfx.select(); rlBuzz(5); buildRack(); drawHud(); };
  if (chipIdx > dens.length) chipIdx = dens.length;
  const buttons = dens.map((v, i) => {
    const b = el("button", "den rchip" + (i === chipIdx ? " sel" : ""), fmtChip(v));
    b.dataset.v = String(v);
    b.style.cssText = rlChipVars(COLOR);
    b.setAttribute("aria-pressed", i === chipIdx ? "true" : "false");
    b.onclick = () => pick(i);
    return b;
  });
  const all = el("button", "den all rchip dark" + (chipIdx === dens.length ? " sel" : ""), T("all_in"));
  all.style.cssText = rlChipVars("#17130f") + ";--cs:#e7c068";
  all.setAttribute("aria-pressed", chipIdx === dens.length ? "true" : "false");
  all.onclick = () => pick(dens.length);
  els.rack.replaceChildren(...buttons, all);
  els.rack.dataset.min = String(game ? game.levelNeed() : 0);
}

function buildActions() {
  const svg = (d) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const IC = {
    undo: svg('<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'),
    clear: svg('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>'),
    repeat: svg('<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>'),
  };
  const mk = (icon, key, fn, cls) => {
    const b = el("button", "act" + (cls ? " " + cls : ""));
    b.innerHTML = icon ? `<span class="i">${icon}</span>${escapeHtml(T(key))}` : escapeHtml(T(key));
    b.onclick = fn;
    return b;
  };
  const undoB = mk(IC.undo, "act_undo", () => {
    if (!canBet() || !undo.length) return;
    const prev = undo.pop();
    game.setBets(PID, prev);
    myBets = Object.assign({}, me().bets);
    saveGame();
    drawChips(); drawHud(); syncScene(false);
  });
  const clearB = mk(IC.clear, "act_clear", () => { if (canBet() && Object.keys(myBets).length) pushBets({}); });
  const repB = mk(IC.repeat, "act_repeat", () => {
    if (!canBet()) return;
    const last = me().lastBets || {};
    if (!Object.keys(last).length) return;
    const stack = me().stack, total = rlSum(last);
    if (total <= stack) return pushBets(Object.assign({}, last));
    const k = stack / total, next = {};
    for (const [key, v] of Object.entries(last)) { const a = Math.floor(v * k); if (a > 0) next[key] = a; }
    pushBets(next);
  });
  const dblB = mk("", "act_double", () => {
    if (!canBet() || !Object.keys(myBets).length) return;
    const next = {};
    for (const [k, v] of Object.entries(myBets)) next[k] = v * 2;
    pushBets(next);
  }, "dbl");
  const spin = mk("", "btn_spin", onSpin, "ready");
  spin.id = "spinbtn";
  els.actions.replaceChildren(undoB, clearB, repB, dblB, spin);
}

function onSpin() {
  const p = me();
  if (!game || !p) return;
  if (phase() === "payout") { skipPayout(); return; }
  if (phase() !== "betting") return;
  const need = game.need(p), bet = rlSum(myBets);
  if (bet < need) { toast(tpl("toast_more", { n: rlNum(need - bet) })); rlBuzz([20, 40, 20]); return; }
  rlSfx.stamp(); rlBuzz(20);
  const r = game.setReady(PID, true, now());
  if (r.ok) afterTick();
}
function skipPayout() {
  if (phase() !== "payout") return;
  game.tick(Math.max(now(), game.s.deadline || 0));
  afterTick();
}

// ---------- HUD ----------
function drawHud() {
  const p = me();
  if (!p || !els.stack) return;
  const s = game.s;
  const bet = rlSum(myBets);
  const settled = s.phase === "payout" || s.phase === "finished";
  const val = settled ? p.stack : p.stack - rlSum(p.bets);
  els.stack.textContent = rlNum(val);
  if (shownStack != null && val > shownStack && settled) { els.stack.classList.remove("bump"); void els.stack.offsetWidth; els.stack.classList.add("bump"); }
  shownStack = val;
  els.spinno.textContent = tpl("spin_lbl", { n: Math.max(1, s.spin) });
  const betting = s.phase === "betting" && !p.out;
  const need = betting ? game.need(p) : 0;
  const short = betting && bet < need;
  els.need.classList.toggle("short", short);
  els.need.classList.toggle("ok", betting && need > 0 && bet >= need);
  els.needl.innerHTML = tpl("need_lbl", { bet: `<b>${rlNum(bet)}</b>`, min: `<b>${rlNum(game.levelNeed() > p.stack ? p.stack : game.levelNeed())}</b>` });
  els.meter.style.width = (need > 0 ? Math.min(100, (bet / need) * 100) : 0) + "%";
  els.metertx.textContent = short ? tpl("meter_more", { n: rlNum(need - bet) }) : betting && need > 0 ? T("meter_ok") : "";
  els.controls.classList.toggle("locked", !canBet());
  els.felt.classList.toggle("locked", !canBet());
  const free = p.stack - bet;
  els.rack.querySelectorAll(".den[data-v]").forEach((b) => b.classList.toggle("off", Number(b.dataset.v) > free));
  const rb = $("spinbtn");
  if (rb) {
    rb.classList.remove("more", "wait");
    if (s.phase === "betting") {
      if (short) { rb.classList.add("more"); rb.textContent = tpl("btn_spin_more", { n: rlNum(need - bet) }); }
      else rb.textContent = T("btn_spin");
      rb.disabled = false;
    } else if (s.phase === "payout") { rb.textContent = T("btn_next"); rb.disabled = false; }
    else { rb.classList.add("wait"); rb.textContent = T("btn_spinning"); rb.disabled = true; }
  }
  els.quit.disabled = s.phase !== "betting";
  els.quit.classList.toggle("arm", quitArmed > now());
  const h = els.felt.querySelector(".hist");
  if (h) {
    const bg = { red: "var(--red)", black: "var(--black)", green: "var(--zero)" };
    h.replaceChildren(...s.history.slice(0, 3).map((n) => { const i = el("i", null, String(n)); i.style.background = bg[rlColor(n)]; return i; }));
  }
}

// ---------- итог спина и финал ----------
function showResult(silent) {
  const s = game.s, r = s.result, x = r && r.perPlayer && r.perPlayer[PID];
  if (!x) return;
  const net = x.net;
  const p = me();
  const wins = Object.entries(p.bets).filter(([k]) => RL_BETS[k].numbers.includes(r.number)).map(([k, a]) => [k, a * RL_BETS[k].pays]);
  const lines = wins.length ? wins.slice(0, 3).map(([k, v]) => `${rlBetName(k)} +${rlNum(v)}`).join(" · ") + (wins.length > 3 ? " …" : "") : T("res_none");
  const kind = net > 0 ? "win" : net < 0 ? "lose" : "even";
  $("result").innerHTML = `<div class="disc ${r.color}">${r.number}</div>
    <div class="rtx"><div class="cn">${escapeHtml(T("color_" + r.color))} · ${T(!wins.length ? "res_lose" : net > 0 ? "res_win" : net < 0 ? "res_down" : "res_even")}</div>
    <div class="net ${kind}">${net > 0 ? "+" : net < 0 ? "−" : ""}${rlNum(Math.abs(net))}</div>
    <div class="ln">${escapeHtml(lines)}</div></div>
    <button class="nx" id="nx">${escapeHtml(T("btn_next"))}</button>`;
  $("nx").onclick = skipPayout;
  document.body.classList.add("show-result");
  if (silent) return;
  if (r.number === 0) rlSfx.zero(); else if (net > 0) rlSfx.win(net >= 10 * game.levelNeed()); else if (net < 0) rlSfx.lose();
  if (net > 0) rlBuzz([30, 40, 30]);
}

function recordNow(finalize) {
  const p = me();
  if (!p) return false;
  peak = Math.max(peak, p.stack);
  const best = lsGet(REC_KEY) || { peak: 0, spins: 0 };
  if (peak > startStack && peak > best.peak && (finalize || phase() === "payout")) {
    lsSet(REC_KEY, { peak, spins: Math.max(best.spins, game.s.spin) });
    newRecord = true;
  }
  return newRecord;
}

function showFinal() {
  const s = game.s, p = me();
  const hadRecord = recordNow(true);
  const bust = s.finishedReason === "all_out" || p.stack <= 0;
  const delta = p.stack - startStack;
  const big = s.stats.biggestWin && s.stats.biggestWin.amount;
  const sub = bust ? T("end_bust_s") : T("end_host_s");
  $("final").innerHTML = `<div class="in">
    <div class="eyebrow">${escapeHtml(T("eyebrow"))}</div>
    <h2>${escapeHtml(bust ? T("end_bust_t") : tpl("end_host_t", { n: rlNum(p.stack) }))}</h2>
    ${hadRecord && peak > 0 ? `<div class="newrec">${escapeHtml(T("new_record"))}</div>` : ""}
    <p class="lede">${escapeHtml(delta > 0 ? tpl("delta_up", { n: rlNum(delta) }) : delta < 0 ? tpl("delta_down", { n: rlNum(-delta) }) : T("delta_zero"))}. ${escapeHtml(sub)}</p>
    <div class="stats"><div><b>${rlNum(s.spin - (bust ? 0 : 1) || 0)}</b><span>${escapeHtml(T("stat_spins"))}</span></div><div><b>${rlNum(peak)}</b><span>${escapeHtml(T("stat_peak"))}</span></div><div><b>${big ? "+" + rlNum(big) : "—"}</b><span>${escapeHtml(T("stat_big"))}</span></div></div>
    <button class="btn shine" id="again">${escapeHtml(T("btn_again"))}</button>
    <a class="link" href="index.html">${escapeHtml(T("nav_all_games"))}</a></div>`;
  $("again").onclick = () => { lsSet(SAVE_KEY, null); showIntro(); };
  $("final").classList.add("on");
  lsSet(SAVE_KEY, null);
}

function showIntro() {

  const best = lsGet(REC_KEY);
  $("intro").innerHTML = `<div class="in">

      <button class="mode${pref.mode === "free" ? " sel" : ""}" data-m="free"><b>${escapeHtml(T("mode_free"))}</b><span>${escapeHtml(T("mode_free_d"))}</span></button></div></div>
    <div class="opt"><div class="cap">${escapeHtml(T("stack_cap"))}</div><div class="seg">${[500, 1000, 2000].map((v) => `<button data-s="${v}" class="${pref.stack === v ? "sel" : ""}">${rlNum(v)}</button>`).join("")}</div></div>
    <button class="btn shine" id="play">${escapeHtml(T("btn_play"))}</button>
    ${best && best.peak ? `<div class="best">${tpl("best", { peak: rlNum(best.peak), spins: rlNum(best.spins) })}</div>` : ""}
    <a class="link" href="roulette.html">${escapeHtml(T("btn_friends"))}</a></div>`;
  $("intro").querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { pref.mode = b.dataset.m; lsSet(PREF_KEY, pref); showIntro(); }));
  $("intro").querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => { pref.stack = Number(b.dataset.s); lsSet(PREF_KEY, pref); showIntro(); }));
  $("play").onclick = newGame;
  $("intro").classList.add("on");
}

// ---------- ход партии ----------
function newGame() {
  game = RG.Game.create({ settings: { stack: pref.stack, pace: "slow", cards: false }, solo: true, flat: pref.mode === "free", rnd });
  game.addPlayer({ id: PID, name: "Я" });
  game.start(now());
  startStack = pref.stack;
  peak = startStack;
  newRecord = false;
  begin();
}
function begin() {
  $("intro").classList.remove("on");
  $("final").classList.remove("on");
  myBets = Object.assign({}, me().bets);
  undo = [];
  chipIdx = 1;
  phaseKey = "";
  buildRack(); buildActions();
  afterTick();
  syncScene(true);
}
let lastLevel = null;
function afterTick() {
  const s = game.s;
  const key = s.spin + ":" + s.phase;
  if (key === phaseKey) { drawHud(); return; }
  const prev = phaseKey;
  phaseKey = key;
  const p = me();
  document.body.classList.toggle("show-stage", ["closing", "spinning", "payout"].includes(s.phase));
  document.body.classList.toggle("show-result", s.phase === "payout");
  $("stagebar").textContent = s.phase === "closing" ? T("stage_closing") : s.phase === "spinning" ? T("stage_spinning") : "";
  if (s.phase === "betting") {
    myBets = Object.assign({}, p.bets);
    undo = [];
    buildRack();
    if (lastLevel != null && s.level !== lastLevel) toast(tpl("toast_level", { n: rlNum(game.levelNeed()) }));
    lastLevel = s.level;
    saveGame();
  } else if (s.phase === "payout") {
    recordNow(false);
    showResult();
  } else if (s.phase === "finished") {
    document.body.classList.remove("show-stage", "show-result");
    syncScene(false);
    drawChips(); drawHud();
    showFinal();
    return;
  }
  drawChips(false);
  drawHud();
  syncScene(false);
  void prev;
}
function loop() {
  if (!game) return;
  for (let i = 0; i < 6; i++) {
    const before = game.s.phase + game.s.spin;
    game.tick(now());
    if (game.s.phase + game.s.spin === before) break;
  }
  afterTick();
}

function quitTap() {
  if (phase() !== "betting") return;
  if (quitArmed < now()) { quitArmed = now() + 2500; toast(T("toast_quit")); drawHud(); setTimeout(drawHud, 2600); return; }
  quitArmed = 0;
  $("toast").classList.remove("on");
  game.finishNow(now());
  afterTick();
}

function buildGame() {
  $("app").innerHTML = `<div class="game" id="game">
    <div class="hud">
      <div class="me"><div class="mystack" id="mystack"><i></i><i></i><i></i><i></i></div><div class="stackbox"><div class="spinno" id="spinno"></div><div class="stack" id="stack">0</div></div></div>
      <div class="need" id="need"><div class="nl" id="needl"></div><div class="meter"><i id="meterbar"></i><span id="metertx"></span></div></div>
      <button class="qbtn" id="quit" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
    <div class="table-wrap"><div class="felt" id="felt"></div></div>
    <div class="controls" id="controls"><div class="rack" id="rack"></div><div class="actions" id="actions"></div></div>
    <div class="stage" id="stage"><div class="stagebar" id="stagebar"></div><div class="result" id="result"></div></div>
  </div>`;
  els = {
    stack: $("stack"), spinno: $("spinno"), need: $("need"), needl: $("needl"), meter: $("meterbar"), metertx: $("metertx"), mystack: $("mystack"),
    felt: $("felt"), rack: $("rack"), actions: $("actions"), controls: $("controls"), quit: $("quit"),
  };
  els.mystack.style.cssText = rlChipVars(COLOR);
  els.quit.onclick = quitTap;
  els.quit.setAttribute("aria-label", T("quit"));
  buildFelt();
}

window.addEventListener("langchange", () => {
  if (!els.felt) return;
  const stage = $("stage");
  els.quit.setAttribute("aria-label", T("quit"));
  buildFelt();
  if (game) {
    buildRack(); buildActions();
    const ph = game.s.phase;
    drawChips(false); drawHud();
    if (ph === "payout") showResult(true);
    if (ph === "finished") showFinal();
    $("stagebar").textContent = ph === "closing" ? T("stage_closing") : ph === "spinning" ? T("stage_spinning") : "";
  }
  if ($("intro").classList.contains("on")) showIntro();
  void stage;
});
window.addEventListener("resize", () => { if (game && els.felt) drawChips(false); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) loop(); });

function start() {
  if (!RG) { $("app").textContent = "Error: engine not loaded"; return; }
  buildGame();
  loadScene();
  setInterval(loop, 100);
  // продолжение прерванной партии (вкладку закрыли или перезагрузили)
  const saved = lsGet(SAVE_KEY);
  if (saved && saved.s && saved.s.solo && saved.s.phase !== "finished") {
    try {
      game = RG.Game.from(saved.s, rnd);
      peak = saved.peak || me().stack;
      startStack = saved.startStack || game.s.settings.stack;
      if (saved.pref) pref = saved.pref;
      if (!me()) throw new Error("no player");
      begin();
      return;
    } catch (e) { game = null; lsSet(SAVE_KEY, null); }
  }
  showIntro();
}
// шрифт и колонки сукна считаются после раскладки
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
</script>
