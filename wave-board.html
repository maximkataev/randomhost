<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f30a.svg" type="image/svg+xml">
<title>На одной волне — общий экран</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,400..1000&display=swap" rel="stylesheet">
<style>
  /* Мир: «плакат-табло» (wave-spec.md §8). Общий экран — ТВ или демонстрация в Zoom: всё видно с трёх метров.
     Сплошная заливка, у каждой шкалы свой цвет, смена — шторкой из центра шкалы. Шкала — главный герой, на пол-экрана.
     Своё лицо игры — ширма (как у настольной Wavelength): пока угадывают, шкала закрыта штриховкой в цвет шкалы;
     стрелки падают на закрытую ширму, под дробь она уезжает вокруг оси, и очки вскрываются от дальнего промаха к ближнему.
     Без наклонных стикеров и теней-смещений: только заливка, чёрная линия и крупный шрифт. */
  :root {
    --bg: #5b8cff;
    --card: #5b8cff;
    --ink: #111;
    --paper: #fff;
    --hot: #ff2d2d;
    --f: "Roboto Flex", "Arial Black", system-ui, sans-serif;
    --press: cubic-bezier(.2, 1.6, .4, 1);
    --lang-switch-bg: var(--paper);
    --lang-switch-border: var(--ink);
    --lang-switch-fg: var(--ink);
    --lang-switch-active-bg: var(--ink);
    --lang-switch-active-fg: var(--paper);
    --lang-switch-active-border: var(--ink);
    --lang-switch-font: var(--f);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 600 18px/1.3 var(--f); -webkit-font-smoothing: antialiased; overflow: hidden; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  .hidden { display: none !important; }

  /* line-height меньше единицы режет «Й» и «Ё» — запас сверху */
  .shout { font-weight: 1000; font-stretch: 151%; font-variation-settings: "wdth" 151; text-transform: uppercase; line-height: .88; letter-spacing: -.01em; margin: 0; padding-top: .12em; }
  .eyebrow { font-weight: 900; font-size: clamp(16px, 2.3vh, 28px); text-transform: uppercase; letter-spacing: .1em; }

  /* шапка: название и код; справа — место под переключатель языка */
  .top { flex: none; display: flex; align-items: center; gap: 14px; height: calc(var(--lsc, 32px) * 2); padding: 0 var(--lsw, 160px) 0 26px; position: relative; z-index: 3; }
  .brand { font-weight: 1000; font-size: 22px; text-transform: uppercase; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 44px; height: 18px; flex: none; }
  .chip { font-weight: 1000; font-size: 18px; padding: 7px 12px; background: var(--ink); color: var(--paper); white-space: nowrap; letter-spacing: .04em; }
  .top .grow { flex: 1; }
  .sound-toggle-btn { flex: none; width: calc(var(--lsh, 44px) * 1.25); height: var(--lsh, 44px); border: 3px solid var(--ink); border-radius: 0; background: var(--paper); font-size: 17px; display: grid; place-items: center; padding: 0; }
  /* «Закончить» — видна на ТВ, поэтому тихая: квадрат ■ с подписью по наведению */
  .endbtn { flex: none; width: var(--lsh, 44px); height: var(--lsh, 44px); border: 3px solid var(--ink); background: transparent; padding: 0; font-size: 16px; display: grid; place-items: center; }
  .endbtn:hover { background: var(--ink); color: var(--paper); }
  .banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--paper); padding: 8px 14px; font-weight: 800; }
  .conn { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--paper); padding: 6px 12px; font-weight: 800; visibility: hidden; }
  .conn.on { visibility: visible; }

  /* шторка: новый цвет растёт кругом из центра шкалы */
  .wipe { position: fixed; inset: 0; z-index: 0; pointer-events: none; clip-path: circle(0 at 50% 92%); animation: wipe .55s cubic-bezier(.6, 0, .2, 1) forwards; }
  @keyframes wipe { to { clip-path: circle(150% at 50% 92%); } }

  main { flex: 1; min-height: 0; position: relative; z-index: 1; }
  .screen { position: absolute; inset: 4px 26px 6vh; display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }

  /* ---------- шкала ---------- */
  .dialwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .dialbox { position: relative; height: 100%; max-height: 100%; aspect-ratio: 1000 / 540; max-width: 100%; }
  .dial { display: block; width: 100%; height: 100%; overflow: visible; }
  .poles { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; flex: none; }
  .poles div { height: var(--pole-h, 10vh); display: flex; align-items: flex-start; overflow: hidden; }
  .poles div:last-child { justify-content: flex-end; text-align: right; }
  .poles span { font-weight: 1000; font-stretch: 151%; font-variation-settings: "wdth" 151; text-transform: uppercase; line-height: .95; font-size: var(--pfs, 56px); text-wrap: balance; }
  .poles div:first-child span::before { content: "←\00a0"; }
  .poles div:last-child span::after { content: "\00a0→"; }

  /* подсказка — чёрная плашка; на раскрытии её текст перещёлкивается на итог («В ЯБЛОЧКО! 🐸 ОЛЯ») */
  .cluebar { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; background: var(--ink); color: var(--paper); }
  .cluebar .who { display: flex; align-items: center; gap: 12px; padding: 0 22px; border-right: 4px solid var(--card); max-width: 30vw; }
  .cluebar .who .av { width: 64px; height: 64px; font-size: 38px; }
  .cluebar .who b { font-size: clamp(18px, 2.2vh, 28px); line-height: 1.1; overflow-wrap: anywhere; }
  .cluebar .txt { position: relative; height: var(--clue-h, 15vh); overflow: hidden; min-width: 0; }
  .cluebar .txt > div { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 28px; }
  .cluebar q { font-weight: 1000; font-size: var(--cfs, 80px); line-height: 1; quotes: "«" "»" "“" "”"; overflow-wrap: anywhere; }
  .cluebar .flash { background: var(--card); color: var(--ink); clip-path: inset(0 0 100% 0); font-weight: 1000; font-stretch: 151%; font-variation-settings: "wdth" 151; text-transform: uppercase; font-size: var(--ffs, 80px); line-height: .95; white-space: nowrap; gap: .4em; }
  .cluebar.flashed .flash { animation: flashIn .35s cubic-bezier(.7, 0, .3, 1) forwards; }
  @keyframes flashIn { to { clip-path: inset(0); } }
  .cluebar .num { display: grid; place-items: center; align-content: center; padding: 0 22px; border-left: 4px solid var(--card); text-align: center; white-space: nowrap; }
  .cluebar .num small { font-weight: 900; font-size: clamp(12px, 1.4vh, 16px); letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
  .cluebar .num b { font-weight: 1000; font-size: clamp(24px, 3.4vh, 40px); font-variant-numeric: tabular-nums; }

  /* нижняя строка: игроки, «зафиксировали», секунды */
  .foot { flex: none; display: flex; align-items: center; gap: 18px; min-height: 7vh; }
  .chips { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; align-items: center; }
  .pc { display: inline-flex; align-items: center; gap: 8px; border: 3px solid var(--ink); background: var(--paper); padding: 4px 12px 4px 4px; font-weight: 800; font-size: clamp(17px, 2.6vh, 30px); max-width: 16em; }
  .pc b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pc.on { background: var(--ink); color: var(--paper); animation: slam .35s var(--press); }
  /* замок место держит всегда: плитка не шире после «клац», соседи не прыгают */
  .pc::after { content: "🔒"; visibility: hidden; }
  .pc.on::after { visibility: visible; }
  .pc.author::after, .pc:has(.pts)::after { display: none; }
  .pc.author { border-style: dashed; background: transparent; }
  .pc.off { opacity: .45; }
  .pc .pts { font-weight: 1000; font-variant-numeric: tabular-nums; }
  @keyframes slam { from { transform: scale(1.35); } }
  .av { font-style: normal; width: 38px; height: 38px; display: grid; place-items: center; background: var(--pc, #111); border-radius: 50%; font-size: 22px; flex: none; border: 3px solid var(--ink); }
  .count { font-weight: 1000; font-stretch: 151%; font-variation-settings: "wdth" 151; font-size: clamp(30px, 5vh, 60px); line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .count small { font-size: .42em; font-stretch: 100%; font-variation-settings: "wdth" 100; letter-spacing: .08em; margin-right: .5em; vertical-align: middle; }
  .secs { min-width: 2.6em; text-align: right; font-weight: 1000; font-stretch: 151%; font-variation-settings: "wdth" 151; font-size: clamp(34px, 6vh, 72px); line-height: 1; font-variant-numeric: tabular-nums; }
  .secs.hot { color: var(--hot); animation: jump .5s steps(1) infinite; }
  @keyframes jump { 50% { transform: translateY(-.12em); } }
  .timer { flex: none; height: 14px; background: rgba(0, 0, 0, .14); position: relative; overflow: hidden; }
  .timer i { position: absolute; inset: 0; background: var(--ink); transform-origin: left; }
  .timer.hot i { background: var(--hot); }
  .timer.done i { transform: none !important; }
  /* волна у нижнего края: вздрагивает на каждый «клац», на «На одной волне!» выпрямляется в ровную синусоиду */
  .wave { position: fixed; left: 0; bottom: 0; width: 100%; height: 5vh; z-index: 0; pointer-events: none; }
  .wave path { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }

  /* ---------- лобби: игроки слева (правило владельца), подключение и пример справа ---------- */
  .lobby { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(400px, 1fr); gap: 3vw; height: 100%; }
  .col { display: flex; flex-direction: column; gap: 1.8vh; min-height: 0; }
  .lobby h1 { font-size: clamp(44px, 8.4vh, 118px); }
  .seats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2vh 1.4vw; align-content: start; flex: 1; min-height: 0; }
  .seat { position: relative; display: flex; align-items: center; gap: 14px; min-width: 0; animation: slam .45s var(--press); }
  .seat .av { width: clamp(44px, 7vh, 80px); height: clamp(44px, 7vh, 80px); font-size: clamp(24px, 4vh, 46px); border-width: 4px; }
  .seat b { font-weight: 1000; font-size: clamp(20px, 3.4vh, 40px); line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .seat .x { background: none; border: 0; padding: 2px 6px; font-weight: 900; visibility: hidden; }
  .host .seat:hover .x, .host .seat:focus-within .x { visibility: visible; }
  .seat.off { opacity: .5; }
  .free { display: flex; gap: 6px; align-items: center; font-weight: 900; font-size: clamp(15px, 2vh, 22px); }
  .free i { width: 1.1em; height: 1.1em; border: 3px solid var(--ink); display: inline-block; }
  .joinbox { background: var(--paper); border: 4px solid var(--ink); padding: 18px; display: flex; gap: 20px; align-items: center; }
  #qr { flex: none; width: clamp(150px, 25vh, 250px); height: clamp(150px, 25vh, 250px); background: #fff; }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  .bigcode { font-weight: 1000; font-stretch: 151%; font-variation-settings: "wdth" 151; font-size: var(--code-fs, 64px); line-height: 1; letter-spacing: .02em; white-space: nowrap; overflow: hidden; }
  .url { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; opacity: .75; }
  .scan { font-size: clamp(17px, 2.3vh, 26px); font-weight: 700; margin-top: 8px; }
  #starthint { min-height: 1.3em; }
  .demo { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1vh; }
  .demo .dq { font-weight: 1000; font-size: clamp(18px, 2.6vh, 30px); display: flex; gap: .6em; align-items: baseline; }
  .demo .dq span { background: var(--ink); color: var(--paper); padding: .15em .5em; }
  .demo .dq em { font-style: normal; font-size: .6em; letter-spacing: .1em; text-transform: uppercase; }
  .demo .dp { display: flex; justify-content: space-between; font-weight: 1000; text-transform: uppercase; font-size: clamp(14px, 2vh, 22px); }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 4px solid var(--ink); padding-top: 12px; }
  .opt b { display: block; font-size: 19px; }
  .opt span { font-size: 15px; opacity: .75; }
  .tog { flex: none; width: 76px; height: 40px; border: 4px solid var(--ink); background: var(--paper); position: relative; padding: 0; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; background: var(--ink); transition: left .15s; }
  .tog[aria-pressed="true"] { background: var(--ink); }
  .tog[aria-pressed="true"]::after { left: 39px; background: var(--paper); }
  .start { width: 100%; border: 4px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 1000; font-stretch: 151%; font-variation-settings: "wdth" 151; font-size: clamp(26px, 4vh, 44px); text-transform: uppercase; padding: 2vh 20px; }
  .start:not(:disabled):hover { background: var(--paper); color: var(--ink); }
  .start:not(:disabled):active { transform: translateY(4px); }
  .ghostbtn { border: 4px solid var(--ink); background: var(--paper); font-weight: 900; font-size: 20px; padding: 14px 20px; text-transform: uppercase; text-decoration: none; color: var(--ink); display: grid; place-items: center; }
  .fine { font-size: clamp(17px, 2.4vh, 28px); font-weight: 700; }

  /* ---------- заставка раунда ---------- */
  .intro { flex: 1; display: grid; place-items: center; text-align: center; align-content: center; gap: 3vh; }
  .intro h1 { font-size: clamp(70px, 17vh, 240px); }
  .intro .mult { display: inline-block; background: var(--ink); color: var(--card); font-weight: 1000; font-stretch: 151%; font-variation-settings: "wdth" 151; font-size: clamp(40px, 8vh, 110px); padding: .5vh 2.4vw; clip-path: inset(0 100% 0 0); animation: wipeIn .45s cubic-bezier(.7, 0, .3, 1) .5s forwards; }
  @keyframes wipeIn { to { clip-path: inset(0); } }
  .intro p { font-size: clamp(20px, 3vh, 36px); font-weight: 800; max-width: 26em; margin: 0; text-wrap: balance; }
  .intro .eyebrow { font-size: clamp(18px, 2.6vh, 30px); }
  .intro .leaders { display: grid; gap: 1vh; animation: rise .5s var(--press) both; animation-delay: .9s; }
  .intro h1 span { display: inline-block; animation: rise .55s var(--press) both; }
  @keyframes rise { from { transform: translateY(60%); opacity: 0; } }

  /* ---------- подсказки пишут ---------- */
  .cluehead { flex: none; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
  .cluehead h1 { font-size: clamp(44px, 9vh, 120px); }

  /* ---------- счёт: полоса из двух частей — прежний счёт чёрным и прибавка цветом, вырастающая из конца ---------- */
  .board { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 1.2vh; }
  .brow { flex: 0 1 13vh; min-height: 0; display: grid; grid-template-columns: 2.2em 2.2em minmax(0, 11em) 1fr 4.2em; align-items: center; gap: 1vw; font-size: clamp(18px, 3.6vh, 44px); font-weight: 1000; }
  .brow .n { font-stretch: 151%; font-variation-settings: "wdth" 151; }
  .brow .av { width: 1.8em; height: 1.8em; font-size: .9em; }
  .brow b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 62%; display: flex; align-items: stretch; min-width: 0; }
  .bar .old { background: var(--ink); width: var(--o); }
  .bar .add { background: var(--next, #fff); border: 4px solid var(--ink); width: var(--g); min-width: 3.4em; transform-origin: left; animation: grow .8s cubic-bezier(.3, 1.3, .5, 1) .5s both; display: flex; align-items: center; justify-content: flex-end; padding-right: .3em; overflow: hidden; font-size: .8em; white-space: nowrap; }
  .bar .add.empty { display: none; }
  @keyframes grow { from { transform: scaleX(0); } }
  .brow .s { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- итоги ---------- */
  .final { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 3vw; flex: 1; min-height: 0; }
  .podium { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 12px; min-height: 0; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .step .who { text-align: center; font-weight: 1000; font-size: clamp(16px, 2.6vh, 30px); line-height: 1.1; overflow-wrap: anywhere; }
  .step .who .av { margin: 0 auto 6px; width: 2.4em; height: 2.4em; font-size: 1.3em; }
  .step .col { width: 100%; background: var(--ink); color: var(--card); display: grid; place-items: start center; align-content: start; gap: .6vh; padding-top: 1.4vh; font-weight: 1000; font-stretch: 151%; font-variation-settings: "wdth" 151; font-size: clamp(40px, 7vh, 90px); line-height: 1; animation: up .8s var(--press) both; transform-origin: bottom; }
  .step .col small { font-size: .5em; color: var(--paper); font-stretch: 100%; font-variation-settings: "wdth" 100; font-variant-numeric: tabular-nums; }
  @keyframes up { from { transform: scaleY(0); } }
  .awards { display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
  .aw { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
  .aw .av { width: 60px; height: 60px; font-size: 32px; }
  .aw .eyebrow { opacity: .75; }
  .aw b { display: block; font-size: clamp(20px, 3vh, 36px); font-weight: 1000; line-height: 1.05; }
  .aw p { margin: 2px 0 0; font-size: clamp(17px, 2.6vh, 30px); font-weight: 700; }
  .replay { flex: 1; min-height: 0; background: var(--paper); border: 4px solid var(--ink); display: flex; flex-direction: column; padding: 1.4vh 1.4vw; gap: .8vh; }
  .replay .dialwrap { flex: 1; }
  .replay q { font-weight: 1000; font-size: clamp(20px, 3.2vh, 40px); line-height: 1; quotes: "«" "»" "“" "”"; }
  .replay .dp { display: flex; justify-content: space-between; gap: 12px; font-weight: 1000; text-transform: uppercase; font-size: clamp(16px, 2.6vh, 30px); }
  .hostbtns { display: flex; gap: 12px; flex-wrap: wrap; }
  .hostbtns .start { flex: 1; width: auto; }

  .floater { position: fixed; bottom: 60px; z-index: 40; display: flex; flex-direction: column; align-items: center; pointer-events: none; animation: float 2.6s ease-out forwards; }
  .floater span { font-size: 56px; }
  .floater small { background: var(--ink); color: var(--paper); font-weight: 800; padding: 2px 8px; font-size: 15px; }
  @keyframes float { to { transform: translateY(-55vh); opacity: 0; } }

  /* ---------- узкий экран (хост открыл экран игры с телефона): лобби — одна прокручиваемая колонка.
     Сначала то, что нужно хосту: код + QR + ссылка, настройка, кнопка старта; ниже — игроки и пример.
     Только лобби (body:has(.lobby)), остальные фазы и ТВ-раскладка не трогаются. ---------- */
  @media (max-width: 760px) {
    body:has(.lobby) { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    /* шапка липкая и с фоном: прокручиваемое содержимое уходит под неё, а не под звук/переключатель языка */
    body:has(.lobby) .top { position: sticky; top: 0; background: var(--bg); padding-left: 16px; gap: 10px; }
    body:has(.lobby) .brand { min-width: 0; font-size: 19px; }
    body:has(.lobby) .brand span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    body:has(.lobby) main { flex: none; }
    .screen:has(> .lobby) { position: static; padding: 4px 16px calc(5vh + 28px); }
    .lobby { display: flex; flex-direction: column; gap: 16px; height: auto; }
    .lobby > .col { display: contents; }
    /* название уже в шапке — крупный заголовок на телефоне не нужен */
    .lobby h1 { display: none; }
    .lobby .joinbox { order: 1; }
    .lobby .opt { order: 2; }
    .lobby > .col:last-child > :last-child { order: 3; }
    .lobby .eyebrow { order: 4; white-space: nowrap; margin-top: 8px; }
    .lobby .seats { order: 5; flex: none; gap: 12px; }
    .lobby .free { order: 6; flex-wrap: wrap; }
    .lobby .demo { order: 7; flex: none; margin-top: 8px; }

    /* код во всю ширину сверху, под ним QR и ссылка с подсказкой */
    .lobby .joinbox { display: grid; grid-template-columns: 112px minmax(0, 1fr); grid-template-areas: "code code" "qr url" "qr scan"; grid-template-rows: auto auto 1fr; gap: 8px 14px; padding: 12px; align-items: start; }
    .lobby .joinbox > div:last-child { display: contents; }
    /* запас по высоте строки: иначе fit() видит «вылезающие» на 1–2px глифы и сжимает код до минимума */
    .lobby .bigcode { grid-area: code; line-height: 1.15; }
    .lobby #qr { grid-area: qr; width: 112px; height: 112px; }
    .lobby .joinbox .url { grid-area: url; font-size: 15px; }
    .lobby .joinbox .scan { grid-area: scan; font-size: 16px; margin-top: 0; }
    .lobby .opt { padding-top: 14px; }
    .lobby .opt b { font-size: 18px; }
    .lobby .tog { width: 80px; height: 48px; }
    .lobby .tog::after { top: 4px; left: 4px; width: 32px; height: 32px; }
    .lobby .tog[aria-pressed="true"]::after { left: 36px; }
    .lobby .start { min-height: 56px; padding: 12px 16px; font-size: 30px; }
    .lobby .fine { font-size: 17px; }

    .lobby .seat { gap: 10px; }
    .lobby .seat .av { width: 44px; height: 44px; font-size: 24px; border-width: 3px; }
    .lobby .seat b { font-size: 20px; }
    .host .lobby .seat .x { visibility: visible; flex: none; width: 44px; height: 44px; margin-left: auto; padding: 0; }

    /* пример: шкала ограничена по высоте, штриховка ширмы не вылезает за край */
    .lobby .demo .dq { font-size: 17px; flex-wrap: wrap; }
    .lobby .demo .dialwrap { flex: none; height: 150px; overflow: hidden; }
    .lobby .demo .dp { font-size: 15px; }
  }
  /* очень узкий экран: QR поменьше, игроки в один столбец */
  @media (max-width: 360px) {
    .lobby .joinbox { grid-template-columns: 96px minmax(0, 1fr); column-gap: 12px; }
    .lobby #qr { width: 96px; height: 96px; }
    .lobby .seats { grid-template-columns: minmax(0, 1fr); }
  }
  /* телефон вертикально: шапке не хватает места на название рядом со звуком и языками — остаётся волна-логотип */
  @media (max-width: 440px) {
    body:has(.lobby) .brand span { display: none; }
  }

  /* ---------- экран игры с телефона: все фазы после лобби. ТВ-раскладка (шире 760 и выше 500) не трогается ---------- */
  @media (max-width: 760px), (max-height: 500px) {
    /* шапка: название ужимается, код, «■» и звук всегда видны, ничего не уезжает под переключатель языка */
    .top { padding-left: 16px; gap: 10px; }
    .brand { min-width: 44px; font-size: 19px; }
    .brand span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .chip { font-size: 15px; padding: 6px 9px; }
    .screen { inset: 4px 16px calc(4vh + 10px); gap: 10px; }
    /* крупные заголовки по ширине подгоняет fitShout(): длинное слово («НАСТРОЙКА») уменьшается, а не режется */
    .intro { grid-template-columns: minmax(0, 1fr); gap: 2vh; }
    .intro h1 { font-size: clamp(30px, 12vw, 17vh); }
    .intro p { font-size: 17px; }
    .cluehead > div { min-width: 0; }
    .cluehead h1 { font-size: clamp(30px, 10vw, 9vh); }
    /* нижняя строка: плитки игроков поменьше; «написали 1/3» и секунды не наезжают на плитки */
    .foot { gap: 8px 12px; min-height: 0; }
    .pc { font-size: 15px; gap: 6px; padding: 2px 8px 2px 2px; border-width: 2px; max-width: 100%; }
    .pc .av, .chips .av { width: 28px; height: 28px; font-size: 16px; border-width: 2px; }
    .count { font-size: 30px; }
    .secs { font-size: 34px; min-width: 1.6em; }
    .timer { height: 10px; }
    /* плашка подсказки: аватар и номер шкалы компактнее, подсказке — всё остальное */
    .cluebar .who { padding: 6px 12px; gap: 8px; border-right-width: 3px; }
    .cluebar .who .av { width: 36px; height: 36px; font-size: 20px; }
    .cluebar .who b { font-size: 16px; }
    .cluebar .txt > div { padding: 0 14px; }
    /* слово подсказки не рвём посреди («Бабушки / н»): fitClue() видит, что оно не влезает, и уменьшает кегль */
    .cluebar q { overflow-wrap: normal; }
    .cluebar .flash { white-space: normal; flex-wrap: wrap; align-content: center; gap: 0 .4em; }
    .cluebar .num { padding: 4px 12px; border-left-width: 3px; }
    .cluebar .num b { font-size: 24px; }
    .poles { gap: 12px; }

    /* счёт и итоги на телефоне — одна прокручиваемая колонка, как лобби */
    body[data-phase="scores"], body[data-phase="finished"] { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    body[data-phase="scores"] .top, body[data-phase="finished"] .top { position: sticky; top: 0; background: inherit; }
    body[data-phase="scores"] main, body[data-phase="finished"] main { flex: none; }
    body[data-phase="scores"] .screen, body[data-phase="finished"] .screen { position: static; padding: 4px 16px calc(5vh + 28px); gap: 14px; }
    body[data-phase="scores"] .screen > h1.shout { font-size: clamp(30px, 9.5vw, 56px) !important; }
    body[data-phase="finished"] .screen > h1.shout { font-size: clamp(40px, 13vw, 72px) !important; }
    .board { flex: none; gap: 10px; }
    .brow { flex: none; height: 46px; grid-template-columns: 1.3em 1.7em minmax(0, 7em) minmax(0, 1fr) 2.8em; gap: 8px; font-size: 18px; }
    .brow .av { border-width: 2px; }
    .bar .add { border-width: 3px; min-width: 3.2em; }
    .final { display: flex; flex-direction: column; gap: 24px; }

    .step .who { font-size: 16px; }
    .step .col { font-size: 36px; padding-top: 8px; }
    .step:nth-child(1) .col { height: 120px !important; }
    .step:nth-child(2) .col { height: 160px !important; }
    .step:nth-child(3) .col { height: 90px !important; }
    .awards { gap: 16px; }
    .aw { gap: 12px; }
    .aw .av { width: 44px; height: 44px; font-size: 24px; }
    .aw b { font-size: 20px; overflow-wrap: anywhere; }
    .aw p { font-size: 16px; }
    .replay { flex: none; padding: 12px; gap: 8px; }
    .replay .dialwrap { flex: none; height: 150px; }
    .replay q { font-size: 22px; overflow-wrap: anywhere; }
    .replay .dp { font-size: 15px; }
    .replay .dp span { min-width: 0; overflow-wrap: anywhere; }
    .hostbtns .start { min-height: 56px; padding: 12px 16px; font-size: 26px; flex-basis: 100%; }
    .hostbtns .ghostbtn { flex: 1; min-height: 52px; font-size: 18px; padding: 10px 14px; }
  }
  /* телефон вертикально: плашка подсказки в две строки (кто + номер шкалы, под ними подсказка во всю ширину),
     плитки игроков — своей строкой над «зафиксировали» и секундами */
  @media (max-width: 760px) and (min-height: 501px) {
    .cluebar { grid-template-columns: minmax(0, 1fr) auto; }
    .cluebar .who { grid-row: 1; grid-column: 1; max-width: none; border-right: 0; min-width: 0; }
    .cluebar .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cluebar .num { grid-row: 1; grid-column: 2; grid-auto-flow: column; gap: 8px; align-items: baseline; }
    .cluebar .txt { grid-column: 1 / -1; border-top: 3px solid var(--card); }
    .foot { flex-wrap: wrap; }
    .foot .chips { flex: 1 1 100%; }
    .foot .secs { margin-left: auto; }
    .foot .count:empty, .foot .secs:empty { display: none; }
    /* шкала упирается в ширину экрана — пусть стоит посередине свободного места, а не прилипает к полюсам */
    .screen > .dialwrap { justify-content: center; }
  }
  /* телефон вертикально: название игры не влезает рядом с кодом, «■», звуком и языками — остаётся волна-логотип */
  @media (max-width: 440px) {
    .brand span { display: none; }
  }
  /* в игре шапке не хватает места на волну-логотип, код, «■» и звук рядом с языками (переключатель ~140 px):
     до 600 px остаются код и кнопки 44×44; совсем узко (320) код уступает место волне — он есть в лобби и у игроков */
  @media (max-width: 600px) {
    body:not([data-phase="lobby"]) .top { gap: 8px; }
    body:not([data-phase="lobby"]) .brand { display: none; }
    body:not([data-phase="lobby"]) .chip { font-size: 12px; padding: 5px 7px; letter-spacing: .02em; }
    body:not([data-phase="lobby"]) .endbtn, body:not([data-phase="lobby"]) .sound-toggle-btn { width: 44px; height: 44px; }
  }
  @media (max-width: 359px) {
    body:not([data-phase="lobby"]) .chip { display: none; }
    body:not([data-phase="lobby"]) .brand { display: flex; flex: none; }
    body:not([data-phase="lobby"]) .brand svg { width: 36px; }
    .step .who { font-size: 14px; }
  }
  /* телефон боком: высоты мало — шапка и подписи плотнее, шкале остаётся середина экрана */
  @media (max-height: 500px) {
    .screen { gap: 6px; }
    .cluebar .who { max-width: 34vw; }
    .cluebar .who .av { width: 30px; height: 30px; font-size: 16px; }
    .cluebar .num small { font-size: 11px; }
    .cluebar .num b { font-size: 20px; }
    .foot { gap: 10px; }
    .count { font-size: 26px; }
    .secs { font-size: 28px; }
    .intro h1 { font-size: clamp(30px, 14vh, 64px); }
    .intro p { font-size: 15px; }
    .cluehead h1 { font-size: clamp(26px, 9vh, 44px); }
    .cluehead .fine { font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition: none !important; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
const T = (k) => wvT(k);
const tpl = (k, v) => wvTpl(k, v);
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const hostKey = () => "wave-host-" + CODE;
const main = $("main");

let conn = null, state = null, isHost = false, dead = false;
let viewKey = "";
let prevScores = { game: null, by: {} };
const timers = []; // таймауты раскрытия: при смене экрана гасим, чтобы звук не играл поверх следующей шкалы
const later = (ms, fn) => timers.push(setTimeout(fn, ms));
const clearLater = () => { while (timers.length) clearTimeout(timers.pop()); };

const player = (id) => state && state.players.find((p) => p.id === id);
const present = () => state.players.filter((p) => !p.left);
const roundKey = () => state.game + ":" + state.ri;
const cardKey = () => roundKey() + ":" + (state.card ? state.card.n : 0);
const avHtml = (p) => `<i class="av" style="--pc:${p.color}">${escapeHtml(p.avatar)}</i>`;
const cardColor = (ri, n) => wvColor(ri * 5 + n);

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  showBanner(T("creating"));
  try {
    const res = await fetch("/wave/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: wvLang() } }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
    showBanner(null);
    return true;
  } catch (err) {
    showBanner(String(err.message || err));
    return false;
  }
}
function showBanner(text) {
  const b = $("banner");
  b.classList.toggle("hidden", !text);
  b.textContent = text || "";
}

// подогнать шрифт под коробку: уменьшаем, пока текст не влезет (коробка не растёт — правило «без скачков»)
function fit(box, holder, varName, max, min) {
  let fs = max;
  holder.style.setProperty(varName, fs + "px");
  let guard = 0;
  while (fs > min && (box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1) && guard++ < 80) {
    fs -= 2;
    holder.style.setProperty(varName, fs + "px");
  }
}
const vh = (k) => Math.round(window.innerHeight * k);
// крупный заголовок: если самое длинное слово шире экрана (телефон), уменьшаем кегль; на ТВ всё влезает — не трогаем
function fitShout(h) {
  if (!h) return;
  let fs = parseFloat(getComputedStyle(h).fontSize), guard = 0;
  while (fs > 22 && h.scrollWidth > h.clientWidth + 1 && guard++ < 80) { fs -= 2; h.style.fontSize = fs + "px"; }
}

// ---------- цвет экрана ----------
let curColor = null;
function paint(color) {
  if (color === curColor) return;
  const first = curColor == null;
  curColor = color;
  document.documentElement.style.setProperty("--card", color);
  if (first || matchMedia("(prefers-reduced-motion: reduce)").matches) { document.body.style.background = color; return; }
  const w = el("div", "wipe");
  w.style.background = color;
  document.body.append(w);
  wvSfx.whoosh();
  setTimeout(() => { document.body.style.background = color; w.remove(); }, 560);
}
function phaseColor() {
  switch (state.phase) {
    case "intro": return state.ri === 1 ? "#ff5fa2" : "#2ee8b0";
    case "clue": return wvColor(state.ri * 3 + 4);
    case "guess": case "reveal": return cardColor(state.ri, state.card ? state.card.n : 0);
    case "scores": return "#9be7ff";
    case "finished": return "#c6f432";
    default: return WV_HOME;
  }
}

// ---------- волна внизу ----------
const wave = { amp: 4, phase: 0, calm: 0 };
function bumpWave(k) { wave.amp = Math.min(16, wave.amp + (k || 6)); }
function calmWave(ms) { wave.calm = performance.now() + ms; }
function drawWave(dt, t) {
  wave.phase += dt * 0.004;
  wave.amp += (4 - wave.amp) * Math.min(1, dt * 0.002);
  const calm = t < wave.calm; // «На одной волне!» — рваная линия становится ровной синусоидой
  let d = "";
  for (let x = 0; x <= 1000; x += 8) {
    const jag = calm ? 0 : Math.sin(x / 13 + wave.phase * 2.3) * 0.35 * wave.amp;
    const y = 20 + Math.sin(x / 40 + wave.phase) * (calm ? 14 : wave.amp) + jag;
    d += (x ? " L" : "M") + x + " " + y.toFixed(1);
  }
  $("wave").firstChild.setAttribute("d", d);
}

// ---------- шкала ----------
function dialBlock(o, l, r) {
  return `<div class="dialwrap"><div class="dialbox">${wvDialSvg(Object.assign({ uid: "b", bands: state.bands, missText: T("miss_short") }, o))}</div></div>
    <div class="poles" id="poles"><div><span>${wvPole(l)}</span></div><div><span>${wvPole(r)}</span></div></div>`;
}
// оба полюса одним кеглем — меньший из двух, иначе шкала выглядит кривой
function fitPoles() {
  const ps = $("poles");
  if (!ps) return;
  ps.style.setProperty("--pole-h", vh(0.105) + "px");
  let best = 80;
  ps.querySelectorAll("div").forEach((box) => {
    const span = box.firstChild;
    let fs = Math.min(80, vh(0.078));
    span.style.fontSize = fs + "px";
    while (fs > 16 && (box.scrollHeight > box.clientHeight + 1 || span.offsetWidth > box.clientWidth + 1)) { fs -= 2; span.style.fontSize = fs + "px"; }
    best = Math.min(best, fs);
  });
  ps.querySelectorAll("span").forEach((s) => (s.style.fontSize = ""));
  ps.style.setProperty("--pfs", best + "px");
}
function clueBar(card, flash) {
  const a = player(card.author) || { name: "?", avatar: "?", color: "#111" };
  return `<div class="cluebar" id="cluebar"><div class="who">${avHtml(a)}<b>${escapeHtml(a.name)}</b></div>
    <div class="txt" id="cluetxt"><div id="clueq"><q>${escapeHtml(card.clue)}</q></div>${flash ? `<div class="flash" id="flash">${flash}</div>` : ""}</div>
    <div class="num"><small>${T("card_k")}</small><b>${card.n}/${card.of}</b>${state.mult > 1 ? `<small>×${state.mult}</small>` : ""}</div></div>`;
}
function fitClue() {

  const chips = state.guessers.map((id) => { const p = player(id); return p ? `<span class="pc${locked.has(id) ? " on" : ""}" data-id="${escapeHtml(id)}">${avHtml(p)}<b>${escapeHtml(p.name)}</b></span>` : ""; });
  if (a) chips.unshift(`<span class="pc author">${avHtml(a)}<b>${escapeHtml(a.name)}</b></span>`);
  // перерисовываем только если поменялся состав — иначе «слэм» замка проигрывался бы у всех заново
  const sig = state.guessers.join(",") + "|" + state.locked.join(",");
  const box = $("chips");
  if (box.dataset.sig !== sig) {
    const before = new Set((box.dataset.sig || "").split("|")[1]?.split(",").filter(Boolean) || []);
    box.innerHTML = chips.join("");
    box.querySelectorAll(".pc.on").forEach((c) => { if (before.has(c.dataset.id)) c.style.animation = "none"; });

// реплика ведущего на раскрытии, когда нет ни «в яблочко», ни «на одной волне» (просьба игроков: «после промаха нет соли»)
function hostLine(card, guesses) {
  if (guesses.length < 2) return "";
  const pick = (k) => { const v = T(k); return Array.isArray(v) ? v[card.n % v.length] : v; };
  const as = guesses.map((g) => g.a);
  const spread = Math.max(...as) - Math.min(...as);
  if (guesses.every((g) => !g.pts)) {
    if (as.every((a) => a > card.target) || as.every((a) => a < card.target)) return pick("c_side");
    return spread >= 60 ? pick("c_split") : pick("c_miss");
  }
  if (spread >= 70) return pick("c_split");
  if (guesses.every((g) => g.pts)) return pick("c_close");
  return "";
}

// ---------- раскрытие ----------
// стрелки падают на закрытую ширму → дробь → ширма уезжает → очки по одной от дальнего промаха к ближнему → итог в плашке подсказки
function drawReveal() {
  const card = state.card;
  const key = "reveal:" + cardKey() + wvLang();
  if (viewKey === key) return;
  viewKey = key;
  clearLater();
  const guesses = wvRevealGuesses(card, player);
  const plan = wvRevealPlan(guesses.length);
  const bullPts = 400 * state.mult;
  const bulls = guesses.filter((g) => g.pts >= bullPts);
  if (guesses.length) guesses[guesses.length - 1].best = guesses[guesses.length - 1].pts > 0;
  let flash = "";
  if (card.wave) flash = escapeHtml(T("wave"));
  else if (bulls.length) flash = `${escapeHtml(T("bull"))} ${bulls.map((g) => `${escapeHtml(g.avatar)} ${escapeHtml((player(g.id) || {}).name || "")}`).join(" ")}`;
  else flash = escapeHtml(hostLine(card, guesses));
  const a = player(card.author);
  // очки игроков в нижней строке появляются вместе с табличками на шкале
  const chips = guesses.map((g, i) => { const p = player(g.id); return p ? `<span class="pc" style="animation:slam .35s var(--press) both;animation-delay:${plan.badgeAt(i)}ms">${avHtml(p)}<b>${escapeHtml(p.name)}</b><span class="pts">${g.pts ? "+" + g.pts : "0"}</span></span>` : ""; });
  main.innerHTML = `<div class="screen">${clueBar(card, flash)}${dialBlock({ target: card.target, shutter: "open", label: wvNo(card.n), guesses, plan }, card.l, card.r)}
    <div class="foot"><div class="chips">${a ? `<span class="pc author" style="animation:slam .35s var(--press) both;animation-delay:${plan.done}ms">${avHtml(a)}<b>${escapeHtml(a.name)}</b><span class="pts">+${card.authorPts}</span></span>` : ""}${chips.join("")}</div><div class="count"></div><div class="secs"></div></div><div class="timer done" id="timer"><i></i></div></div>`;
  fitClue();
  fitPoles();
  // звук: стрелки падают, дробь, «вжух» ширмы, очки по одной (ближе к центру — выше нота), итог
  guesses.forEach((g, i) => later(plan.drop + i * plan.dropStep + 250, () => { wvSfx.lock(); bumpWave(3); }));
  later(plan.open - 700, () => wvSfx.drumroll(0.65));
  later(plan.open, () => wvSfx.whoosh());
  guesses.forEach((g, i) => later(plan.badgeAt(i), () => { wvSfx.drop(1 - Math.min(1, g.dist / 60)); bumpWave(g.pts ? 6 : 2); }));
  later(plan.done, () => {
    if (flash) $("cluebar")?.classList.add("flashed");
    if (card.wave) { wvSfx.wave(); calmWave(1800); }
    else if (bulls.length) wvSfx.bull();
    else if (!guesses.some((g) => g.pts)) wvSfx.womp();
    bumpWave(10);
  });
}

function drawScores() {
  const key = "scores:" + roundKey() + wvLang();
  if (viewKey === key) return;
  viewKey = key;
  const list = present().slice().sort((a, b) => b.score - a.score);
  const max = Math.max(1, ...list.map((p) => p.score));
  // прибавка за раунд: доска помнит счёт прошлого табло (с начала партии — ноль)
  if (prevScores.game !== state.game) prevScores = { game: state.game, by: {} };
  const was = prevScores.by;
  const next = state.ri + 1 < state.rounds ? "#ff5fa2" : "#c6f432";
  main.innerHTML = `<div class="screen"><h1 class="shout" style="font-size:clamp(40px,8vh,110px)">${escapeHtml(tpl("scores_title", { n: state.ri + 1 }))}</h1>
    <div class="board" style="--next:${next}">${list.map((p, i) => {
      const old = Math.min(was[p.id] || 0, p.score), g = p.score - old;
      return `<div class="brow"><span class="n">${wvRank(list, p)}</span>${avHtml(p)}<b>${escapeHtml(p.name)}</b><div class="bar"><div class="old" style="--o:${(old / max) * 100}%"></div><div class="add${g > 0 ? "" : " empty"}" style="--g:${(g / max) * 100}%">${g > 0 ? "+" + g : ""}</div></div><span class="s" data-to="${p.score}" data-from="${old}">${old}</span></div>`;
    }).join("")}</div></div>`;
  fitShout(main.querySelector(".screen > h1"));
  prevScores.by = Object.fromEntries(list.map((p) => [p.id, p.score]));
  countUp(main.querySelectorAll(".brow .s"), 1100, 500);
}
function countUp(nodes, dur, delay) {
  const t0 = performance.now() + (delay || 0);
  const step = (t) => {
    const k = Math.max(0, Math.min(1, (t - t0) / dur));
    const e = 1 - Math.pow(1 - k, 3);
    nodes.forEach((n) => { const f = Number(n.dataset.from || 0); n.textContent = Math.round(f + (Number(n.dataset.to) - f) * e); });
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawFinal() {
  const key = "final:" + state.game + wvLang() + isHost;
  if (viewKey === key) return;
  viewKey = key;
  const list = present().slice().sort((a, b) => b.score - a.score);
  const top = [list[1], list[0], list[2]];
  const heights = ["36vh", "48vh", "26vh"];
  const places = top.map((p) => (p ? wvRank(list, p) : 0));
  const aw = state.awards || {};
  const names = (ids) => ids.map((id) => (player(id) || {}).name || "?").join(", ");
  const firstAv = (ids) => { const p = player(ids[0]); return p ? avHtml(p) : ""; };
  const rows = [];
  if (aw.telepath) rows.push(`<div class="aw">${firstAv(aw.telepath.ids)}<div><div class="eyebrow">${T("aw_telepath")}</div><b>${escapeHtml(names(aw.telepath.ids))}</b><p>${escapeHtml(tpl("aw_telepath_d", { n: aw.telepath.n }))}</p></div></div>`);
  if (aw.split && !aw.miss) {
    const gs = Object.entries(aw.split.guesses).map(([id, a]) => { const p = player(id) || { color: "#111", avatar: "?" }; return { a, color: p.color, avatar: p.avatar }; });
    rows.push(`<div class="replay"><div class="eyebrow">⚡ ${T("aw_split")} · ${escapeHtml(tpl("aw_split_d", { n: aw.split.spread }))}</div><q>${escapeHtml(aw.split.clue)}</q>
      <div class="dialwrap"><div class="dialbox">${wvDialSvg({ uid: "split", target: aw.split.target, guesses: gs })}</div></div>
      <div class="dp"><span>← ${wvPole(aw.split.l)}</span><span>${wvPole(aw.split.r)} →</span></div></div>`);
  } else if (aw.split) rows.push(`<div class="aw"><i class="av" style="--pc:#111">⚡</i><div><div class="eyebrow">${T("aw_split")}</div><b><q>${escapeHtml(aw.split.clue)}</q></b><p>${escapeHtml(aw.split.l)} ↔ ${escapeHtml(aw.split.r)} — ${escapeHtml(tpl("aw_split_d", { n: aw.split.spread }))}</p></div></div>`);
  if (aw.clear) rows.push(`<div class="aw">${firstAv(aw.clear.ids)}<div><div class="eyebrow">${T("aw_clear")}</div><b>${escapeHtml(names(aw.clear.ids))}</b><p>${escapeHtml(tpl("aw_clear_d", { n: aw.clear.n }))}</p></div></div>`);
  // «Мимо кассы» — повтор той самой шкалы: сектор и промахнувшаяся стрелка, над этим смеются
  let replay = "";
  if (aw.miss) {
    const h = (state.history || []).find((x) => x.clue === aw.miss.clue && x.guesses[aw.miss.playerId] != null);
    const p = player(aw.miss.playerId) || { color: "#111", avatar: "?" };
    if (h) replay = `<div class="replay"><div class="eyebrow">🙈 ${T("aw_miss")} · ${escapeHtml(tpl("aw_miss_d", { name: p.name || "?", n: aw.miss.dist }))}</div><q>${escapeHtml(aw.miss.clue)}</q>
      <div class="dialwrap"><div class="dialbox">${wvDialSvg({ uid: "miss", target: h.target, guesses: [{ a: h.guesses[aw.miss.playerId], color: p.color, avatar: p.avatar }] })}</div></div>
      <div class="dp"><span>← ${wvPole(aw.miss.l)}</span><span>${wvPole(aw.miss.r)} →</span></div></div>`;
  }
  const sub = state.finishedReason === "few" ? T("final_few") : state.finishedReason === "host" ? T("final_host") : "";
  main.innerHTML = `<div class="screen"><h1 class="shout" style="font-size:clamp(44px,9vh,120px)">${T("final_title")}</h1>${sub ? `<div class="fine">${escapeHtml(sub)}</div>` : ""}
    <div class="final"><div class="podium">${top.map((p, i) => p ? `<div class="step"><div class="who">${avHtml(p)}${escapeHtml(p.name)}</div><div class="col" style="height:${heights[i]};animation-delay:${[0.5, 1, 0][i]}s">${places[i]}<small>${p.score}</small></div></div>` : `<div class="step"></div>`).join("")}</div>
    <div class="awards">${rows.join("")}${replay}<div class="hostbtns">${isHost ? `<button class="start" id="again" type="button">${T("btn_again")}</button><button class="ghostbtn" id="tolobby" type="button">${T("btn_lobby")}</button>` : ""}<a class="ghostbtn" href="index.html">${T("btn_home")}</a></div></div></div></div>`;
  fitShout(main.querySelector(".screen > h1"));
  if (isHost) {
    $("again").onclick = () => conn.send({ type: "start" });
    $("tolobby").onclick = () => conn.send({ type: "lobby" });
  }
  if (state.finishedReason === "done") later(900, () => wvSfx.fanfare());
}

// ---------- отрисовка ----------
let lastPhase = null;
function render() {
  if (!state || dead) return;
  if (state.phase !== lastPhase) { if (lastPhase === "reveal" || state.phase === "lobby") clearLater(); lastPhase = state.phase; }
  document.body.dataset.phase = state.phase;
  paint(phaseColor());
  $("brand").textContent = T("game_name");
  $("codechip").textContent = CODE;
  $("codechip").classList.toggle("hidden", state.phase === "lobby");
  const inGame = !["lobby", "finished"].includes(state.phase);
  $("endbtn").classList.toggle("hidden", !(isHost && inGame));
  $("endbtn").title = T("btn_end");
  $("endbtn").setAttribute("aria-label", T("btn_end"));
  if (state.phase !== "lobby") clearTimeout(demoTimer);
  switch (state.phase) {
    case "lobby": return drawLobby();
    case "intro": return drawIntro();
    case "clue": return drawClues();
    case "guess": return drawGuess();
    case "reveal": return drawReveal();
    case "scores": return drawScores();
    case "finished": return drawFinal();
  }
}
$("endbtn").onclick = () => { if (confirm(T("btn_end") + "?")) conn.send({ type: "end" }); };

// таймер, секунды, тиканье, волна
let lastTickSec = null, lastFrame = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  drawWave(Math.min(100, t - lastFrame), t);
  lastFrame = t;
  if (!state || dead || !state.phaseEnd) return;
  const left = state.phaseEnd - wvNow();
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const live = state.phase === "clue" || state.phase === "guess";
  const bar = $("timer");
  if (bar && live) {
    bar.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`;
    bar.classList.toggle("hot", left < 5000);
  }
  const secs = $("secs");
  if (secs && live) {
    secs.textContent = String(Math.max(0, Math.ceil(left / 1000)));
    secs.classList.toggle("hot", left < 5000);
  }
  if (live && left < 5000 && left > 0) {
    const sec = Math.ceil(left / 1000);
    if (sec !== lastTickSec) { lastTickSec = sec; wvSfx.tick(true); }
  }
}

// лобби, счёт и итоги на телефоне прокручиваются: при прокрутке браузер прячет/показывает адресную строку,
// и меняется только высота. Перерисовка тогда сбрасывала прокрутку, заново растила пьедестал и повторяла фанфары —
// в этих фазах от высоты зависит только CSS, поэтому перерисовываем лишь при смене ширины
let lastW = window.innerWidth;
window.addEventListener("resize", () => {
  const sameW = window.innerWidth === lastW;
  lastW = window.innerWidth;
  if (sameW && state && ["lobby", "scores", "finished"].includes(state.phase)) return;
  viewKey = "";
  if (state) render();
});
window.addEventListener("langchange", () => {
  viewKey = "";
  // язык доски — язык банка шкал комнаты: в лобби ведущий переключает и шкалы
  if (isHost && state && (state.phase === "lobby" || state.phase === "finished") && state.settings.lang !== wvLang()) conn.send({ type: "settings", settings: { lang: wvLang() } });
  render();
});

// реакции: эмодзи взлетает снизу с именем
function floatReact(playerId, emoji) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const p = player(playerId);
  const f = el("div", "floater");
  f.style.left = (8 + Math.random() * 84) + "vw";
  f.append(el("span", null, emoji), el("small", null, p ? p.name : ""));
  document.body.append(f);
  setTimeout(() => f.remove(), 2700);
}

// ---------- связь ----------
function onMessage(m) {
  switch (m.type) {
    case "hello":
      state = m.state;
      if (!isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      state = m.state;
      render();
      break;
    case "host_ok":
      isHost = true;
      document.body.classList.add("host");
      viewKey = "";
      if (state && state.phase === "lobby" && state.settings.lang !== wvLang()) conn.send({ type: "settings", settings: { lang: wvLang() } });
      render();
      break;
    case "host_lost":
      isHost = false;
      document.body.classList.remove("host");
      viewKey = "";
      render();
      break;
    case "event": {
      const e = m.event;
      if (e.type === "react") floatReact(e.playerId, e.emoji);
      // «клац»: ширма вздрагивает, волна подпрыгивает
      if (e.type === "locked" || e.type === "clued") { wvSfx.lock(); bumpWave(6); jolt(); }
      break;
    }
    case "error":
      if (m.error === "room_expired") gone();
      break;
  }
}

function gone() {
  dead = true;
  main.innerHTML = "";
  showBanner(T("expired"));
}

async function boot() {
  // ?h=токен — ссылка ведущего на другое устройство: токен кладём в хранилище и убираем из адреса
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  paint(WV_HOME);
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  conn = wvConnect({
    code: CODE,
    onMessage,
    onGone: gone,
    onOpen: () => { isHost = false; },
    onState: (st) => { banner.textContent = T("err_connect"); banner.classList.toggle("on", st === "lost"); },
  });
  requestAnimationFrame(frame);
  // ручка для отладки и стенда: те же сообщения, что шлют кнопки доски
  window.wvBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
boot();
</script>
