<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f3b0.svg" type="image/svg+xml">
<title>Рулетка — стол</title>
<!-- доска ведущего с кодом комнаты: в поиске ей делать нечего -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
<style>
  /* Общий экран: современный HUD live-казино поверх 3D-сцены. Плоские почти чёрные плашки с тонкой гранью,
     крупные табличные цифры Inter Tight, точные акценты: сукно, красный, жёлтый. Колесо и разметку стола не закрываем. */
  :root {
    --bg: #0a0b0d;
    --panel: rgba(14, 15, 18, .92);
    --surface: #14161a;
    --surface-2: #1c1f25;
    --surface-3: #262a32;
    --line: rgba(255, 255, 255, .09);
    --line-2: rgba(255, 255, 255, .16);
    --text: #f4f4f1;
    --ivory: #f4f4f1;
    --muted: #9aa1ab;
    --accent: #ffc043;
    --accent-ink: #1a1305;
    --gold: #ffc043;
    --gold-hi: #ffd57a;
    --green: #22c77f;
    --red: #e3263a;
    --black: #17191e;
    --zero: #17b06b;
    --felt: #0c6a44;
    --warn: #ff6a3d;
    --ok: #3ddc84;
    --ink: #0a0b0d;
    --serif: "Inter Tight", "Helvetica Neue", Arial, system-ui, sans-serif;
    --cond: "Inter Tight", "Helvetica Neue", Arial, system-ui, sans-serif;
    --spring: cubic-bezier(.3, 1.5, .5, 1);
    --lang-switch-bg: rgba(14, 15, 18, .92);
    --lang-switch-border: rgba(255, 255, 255, .1);
    --lang-switch-fg: #a8aeb8;
    --lang-switch-active-bg: #f4f4f1;
    --lang-switch-active-fg: #0a0b0d;
    --lang-switch-active-border: transparent;
    --lang-switch-font: "Inter Tight", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 500 16px/1.35 var(--cond); letter-spacing: -.005em; }
  button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #stage { position: fixed; inset: 0; z-index: 0; background: radial-gradient(45% 45% at 62% 55%, rgba(12, 106, 68, .35), rgba(12, 106, 68, 0) 75%), radial-gradient(90% 80% at 50% 40%, #16181d, var(--bg) 72%); }
  #stage canvas { display: block; }
  .hud { position: fixed; z-index: 5; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); }

  /* ---------- верх: название, доска минимума/уровней/таймера/банка ---------- */
  .top { top: 14px; left: 18px; right: 18px; display: flex; align-items: flex-start; gap: 16px; pointer-events: none; }
  .brand { font: 900 30px/1 var(--cond); letter-spacing: -.05em; text-transform: uppercase; text-shadow: 0 2px 12px rgba(0, 0, 0, .8); }
  .brand em { font-style: normal; color: var(--green); }
  .roomtag { margin-top: 8px; font: 700 12px/1.2 var(--cond); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 1px 6px #000; }
  .roomtag b { color: var(--text); background: var(--surface-2); border: 1px solid var(--line-2); padding: 3px 8px; border-radius: 999px; margin-left: 4px; letter-spacing: .08em; }
  .spacer { flex: 1; }
  .level { display: flex; align-items: center; gap: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 10px 20px 10px 22px; box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .9); }
  .level .blk { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .level .k { font: 700 11px/1 var(--cond); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; white-space: nowrap; }
  .level .v { font: 900 40px/.92 var(--cond); letter-spacing: -.05em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .level .v.bump { animation: bump .5s var(--spring); }
  @keyframes bump { 35% { transform: scale(1.14); color: var(--accent); } }
  .level .pot .v { color: var(--accent); }
  /* лестница уровней: пройденные — белые, текущий мигает, в овертайме — оранжевые */
  .pips { display: flex; gap: 3px; }
  .pips i { width: 10px; height: 14px; border-radius: 3px; background: var(--surface-3); }
  .pips i.on { background: var(--text); }
  .pips i.cur { background: var(--accent); animation: pip 1.2s ease-in-out infinite; }
  .pips.ot i.on { background: var(--warn); }
  @keyframes pip { 50% { opacity: .4; } }
  .level .next { font: 600 13px/1.1 var(--cond); color: var(--muted); white-space: nowrap; }
  .level .ot { color: var(--warn); }
  .ring { position: relative; width: 78px; height: 78px; flex: none; border-radius: 50%; background: var(--surface); }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .v { position: absolute; inset: 0; display: grid; place-items: center; font: 900 32px/1 var(--cond); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .ring.hot { animation: throb 1s ease-in-out infinite; }
  .ring.hot .v { color: var(--warn); }
  @keyframes throb { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); box-shadow: 0 0 0 8px rgba(255, 106, 61, .22); } }
  .ring.res.red { background: var(--red); } .ring.res.black { background: var(--black); } .ring.res.green { background: var(--zero); }
  .ring.res { box-shadow: inset 0 0 0 3px #fff; }
  .ring.res .v { color: #fff; animation: numin .5s var(--spring); }
  .ring.res svg { opacity: 0; }
  .toprt { width: 150px; flex: none; }

  /* ---------- табло последних номеров ---------- */
  .hist { right: 18px; top: 74px; width: min(360px, 25vw); display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: nowrap; overflow: hidden; }
  .hist .ball { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 800 12px/1 var(--cond); color: #fff; font-variant-numeric: tabular-nums; opacity: .75; }
  .hist .ball:first-child { width: 40px; height: 40px; font-size: 17px; opacity: 1; box-shadow: inset 0 0 0 2.5px #fff; }
  .hist .ball.fresh { animation: numin .5s var(--spring); }
  .ball.red, .bignum.red { background: var(--red); }
  .ball.black, .bignum.black { background: var(--black); box-shadow: inset 0 0 0 1px var(--line-2); }
  .ball.green, .bignum.green { background: var(--zero); }

  /* ---------- лента ---------- */
  /* лента у правого края над кнопками ведущего: узкая и полупрозрачная, чтобы цифры стола справа читались */
  .feed { right: 18px; bottom: calc(var(--rail-h, 110px) + 66px); width: clamp(230px, 19vw, 310px); display: flex; flex-direction: column; gap: 5px; justify-content: flex-end; max-height: min(40vh, calc(100vh - var(--rail-h, 110px) - 200px)); overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 28px); mask-image: linear-gradient(transparent, #000 28px); }
  .msg { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: start; background: rgba(14, 15, 18, .8); border: 1px solid var(--line); border-radius: 14px; padding: 7px 11px 7px 7px; font-size: 15px; line-height: 1.3; animation: slidein .4s var(--spring); position: relative; overflow-wrap: anywhere; }
  .msg .rchip { width: 24px; height: 24px; font-size: 9px; }
  .msg b { font-weight: 800; }
  /* голос крупье: тише, без аватарки, с цветной меткой */
  .msg.sys { display: block; background: rgba(14, 15, 18, .66); border-color: transparent; padding: 6px 12px 6px 24px; color: #c9ced6; font: 600 14px/1.3 var(--cond); }
  .msg.sys::before { content: ""; position: absolute; left: 11px; top: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .msg.sys.big { color: var(--text); font-weight: 700; }
  .msg.sys.big::before { background: var(--accent); }
  .msg .x { position: absolute; right: 6px; top: 6px; border: 0; background: none; color: var(--muted); font-size: 14px; display: none; }
  .host .msg:hover .x { display: block; }
  @keyframes slidein { from { transform: translateX(40px) scale(.94); opacity: 0; } }

  /* ---------- рельс игроков: тёмная полоса снизу, места по центру ---------- */
  .rail { left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 26px 18px 14px; background: linear-gradient(rgba(10, 11, 13, 0), rgba(10, 11, 13, .88) 34%, var(--bg)); }
  .rail { z-index: 6; } /* всплывающие суммы над местами — поверх кнопок ведущего */
  .rail:empty { display: none; }
  .seat { position: relative; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 2px 12px; align-items: center; min-width: 150px; max-width: 230px; flex: 1 1 150px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px 9px 9px; transition: opacity .3s, border-color .3s, transform .3s var(--spring), box-shadow .3s; }
  .seat .avw { grid-row: span 2; position: relative; width: 54px; height: 54px; }
  .seat .av { width: 100%; height: 100%; font: 800 16px/1 var(--cond); }
  /* значки на углах аватарки: карты в руке (низ-право), статус (верх-лево) */
  .seat .bdg { position: absolute; display: none; place-items: center; font: 900 11px/1 var(--cond); font-style: normal; }
  .seat .bdg.on { display: grid; }
  .seat .bc { right: -5px; bottom: -4px; width: 16px; height: 21px; border-radius: 4px; background: var(--red); color: #fff; box-shadow: inset 0 0 0 1.5px #fff, 0 2px 4px rgba(0, 0, 0, .6); }
  .seat .bs { left: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); color: #fff; font-size: 12px; box-shadow: 0 0 0 2px var(--surface); }
  .seat .bs.out { background: var(--warn); }
  .seat .bs.off { background: #3a3f48; color: var(--muted); }
  .seat .nm { font: 700 18px/1.1 var(--cond); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; padding-right: 16px; }
  .seat .st { display: flex; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; min-width: 0; white-space: nowrap; overflow: hidden; }
  .seat .st .s { font: 900 26px/1 var(--cond); letter-spacing: -.045em; }
  .seat .st .b { font: 800 15px/1 var(--cond); color: var(--accent); }
  .seat .lamp { position: absolute; right: 11px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface-3); }
  .seat.ready .lamp { background: var(--green); box-shadow: 0 0 0 4px rgba(34, 199, 127, .22); }
  .seat.ready { border-color: rgba(34, 199, 127, .7); }
  .seat .played { position: absolute; right: 28px; top: -20px; width: 24px; height: 34px; border-radius: 5px; background: var(--red); box-shadow: inset 0 0 0 2px #fff, 0 8px 16px -4px rgba(0, 0, 0, .8); transform: rotate(12deg); animation: cardin .5s var(--spring); }
  @keyframes cardin { from { transform: translateY(-40px) rotate(-30deg) scale(1.4); opacity: 0; } }
  .seat.out .st .b { color: var(--warn); text-transform: uppercase; font-size: 12px; letter-spacing: .06em; }
  .seat .tag { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 800 13px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--warn); border-radius: 999px; padding: 6px 12px; white-space: nowrap; pointer-events: none; }
  .seat.out { opacity: .45; }
  .seat.out .av { filter: grayscale(1); }
  .seat.offline .av { filter: grayscale(1); opacity: .6; }
  .seat.offline .tag { background: var(--surface-3); color: var(--muted); }
  .seat.frozen { border-color: rgba(150, 210, 255, .8); }
  .seat.frozen::after { content: "❄"; position: absolute; inset: 0; border-radius: 20px; display: grid; place-items: center end; padding-right: 30px; font-size: 20px; color: #dff2ff; background: linear-gradient(120deg, rgba(150, 210, 255, .28), rgba(150, 210, 255, 0) 55%); pointer-events: none; }
  .seat.host-click { cursor: pointer; }
  .seat.host-click:hover { transform: translateY(-2px); border-color: var(--line-2); }
  /* 9–12 игроков: два ряда по шесть, имя целиком помещается */
  .rail.many { gap: 8px 10px; padding-top: 20px; }
  .rail.many .seat { grid-template-columns: 42px minmax(0, 1fr); min-width: 0; max-width: 280px; flex: 0 1 calc((100% - 50px) / 6); padding: 7px 12px 7px 8px; }
  .rail.many .seat .avw { width: 42px; height: 42px; }
  .rail.many .seat .av { font-size: 13px; }
  .rail.many .seat .nm { font-size: 15px; }
  .rail.many .seat .st .s { font-size: 21px; }
  .rail.many .seat .st .b { font-size: 13px; }
  /* сыгранная карта в два ряда — внутри места, иначе ложится на имя соседа сверху */
  .rail.many .seat .played { top: 5px; right: 24px; width: 14px; height: 20px; border-radius: 3px; }
  .rail.many .seat .nm { padding-right: 36px; }
  .float { position: absolute; left: 50%; top: -38px; transform: translateX(-50%); font: 900 32px/1 var(--cond); letter-spacing: -.04em; pointer-events: none; animation: floatup 2.6s var(--spring) forwards; white-space: nowrap; z-index: 3; text-shadow: 0 4px 16px rgba(0, 0, 0, .9); }
  .float.plus { color: var(--ok); }
  .float.minus { color: var(--warn); font-size: 24px; }
  .float.react { font-size: 56px; animation: reactup 2s var(--spring) forwards; text-shadow: none; }
  .float.save { color: #bfe6ff; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
  @keyframes floatup { 0% { opacity: 0; transform: translate(var(--fx, -50%), 16px) scale(.5); } 14% { opacity: 1; transform: translate(var(--fx, -50%), -6px) scale(1.15); } 24% { transform: translate(var(--fx, -50%), 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--fx, -50%), -56px); } }
  @keyframes reactup { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.3) rotate(-20deg); } 18% { opacity: 1; transform: translate(-50%, -20px) scale(1.3) rotate(8deg); } 30% { transform: translate(-50%, -10px) scale(1) rotate(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110px) scale(.9); } }
  .seat.hit { animation: seathit .6s var(--spring); }
  @keyframes seathit { 30% { transform: translateY(-8px); border-color: var(--ok); box-shadow: 0 0 0 4px rgba(61, 220, 132, .2); } }

  /* фишка — игровой предмет, как на пульте */
  .rchip {
    --c: #f2c14e; --cd: #8a6a22; --cs: #ffffff; --inlay: #fbfaf6;
    position: relative; border-radius: 50%; display: grid; place-items: center; color: #111; font-style: normal;
    font-variant-numeric: tabular-nums; letter-spacing: -.03em;
    background:
      radial-gradient(circle, var(--inlay) 0 50%, var(--cd) 51% 53%, var(--c) 54% 66%, rgba(0, 0, 0, 0) 67%),
      repeating-conic-gradient(from 8deg, var(--c) 0 32deg, var(--cs) 32deg 45deg);
    box-shadow: inset 0 0 0 1.5px var(--cd), 0 2px 0 var(--cd), 0 6px 10px -2px rgba(0, 0, 0, .55);
  }

  /* ---------- центр: реплики, карты ---------- */
  .center { left: 0; right: min(380px, 26vw); top: 15vh; display: flex; flex-direction: column; align-items: center; gap: 18px; pointer-events: none; }
  .callout { font: 900 clamp(44px, 5.6vw, 96px)/.92 var(--cond); letter-spacing: -.055em; text-transform: uppercase; color: var(--text); text-shadow: 0 8px 40px rgba(0, 0, 0, .9); animation: callin .55s var(--spring); text-align: center; position: relative; padding: 0 20px; }
  .callout.gold { color: var(--accent); }
  .callout.green { color: var(--green); }
  .callout.fade { animation: callin .55s var(--spring), callout 2.6s ease-in forwards; }
  @keyframes callout { 80% { opacity: 1; } to { opacity: 0; transform: translateY(-14px); } }
  @keyframes callin { from { opacity: 0; transform: scale(1.3); } }
  .wave { position: fixed; top: 0; bottom: 0; width: 34vw; left: 0; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .1), rgba(255, 255, 255, 0)); animation: wave 1.1s ease-in-out forwards; pointer-events: none; z-index: 4; }
  @keyframes wave { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  .reveals { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 72vw; }
  /* карта: рубашка красная с белой рамкой и фишкой владельца, лицо — тёмное с цветной плашкой, итог — штамп-пилюлей */
  .rcard { width: 156px; height: 216px; perspective: 900px; }
  .rcard .in { position: relative; width: 100%; height: 100%; }
  /* 3D-слой и лицевая сторона — только на время переворота: все карты с preserve-3d и тенями,
     собранные разом, давали кадр 55–75 мс ровно на «Ставок больше нет», перед раскруткой колеса */
  .rcard .front { display: none !important; }
  .rcard.open .front { display: flex !important; }
  .rcard.open .in { transform-style: preserve-3d; animation: flipcard .8s var(--spring) forwards; }
  .rcard.dealt { animation: dealin .35s var(--spring) both; }
  @keyframes dealin { from { opacity: 0; transform: translateY(-18px) scale(.92); } }
  @keyframes flipcard { 0% { transform: rotateY(0); } 45% { transform: translateY(-30px) scale(1.1) rotateY(100deg); } 100% { transform: rotateY(180deg); } }
  .rcard .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 14px 10px; gap: 7px; box-shadow: 0 24px 40px -14px rgba(0, 0, 0, .9); }
  .rcard .back { background: var(--red); box-shadow: inset 0 0 0 6px var(--red), inset 0 0 0 8px rgba(255, 255, 255, .9), 0 24px 40px -14px rgba(0, 0, 0, .9); }
  .rcard .back .rchip { width: 56px; height: 56px; font: 800 17px/1 var(--cond); }
  .rcard .back b { font: 800 15px/1.1 var(--cond); background: rgba(0, 0, 0, .35); padding: 5px 10px; border-radius: 999px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rcard .front { background: var(--surface); color: var(--text); transform: rotateY(180deg); border: 1px solid var(--line-2); justify-content: flex-start; padding-top: 0; overflow: hidden; }
  .rcard .front .ic { font-size: 44px; line-height: 1; width: calc(100% + 20px); padding: 16px 0 12px; background: var(--k, #9b1424); margin-bottom: 4px; }
  .rcard .front b { font: 900 19px/1.05 var(--cond); letter-spacing: -.03em; }
  .rcard .front small { font: 600 13px/1.25 var(--cond); color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
  .rcard .front .o { font: 600 11.5px/1.2 var(--cond); color: var(--warn); }
  .rcard .stamp { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) rotate(-6deg); font: 900 14px/1 var(--cond); letter-spacing: .04em; text-transform: uppercase; padding: 8px 12px; border-radius: 999px; white-space: nowrap; opacity: 0; color: #04210f; background: var(--ok); }
  .rcard.void .stamp { color: #fff; background: var(--warn); }
  .rcard.stamped .stamp { animation: stampin .45s var(--spring) forwards; }
  @keyframes stampin { from { opacity: 0; transform: translateX(-50%) rotate(-18deg) scale(2.2); } to { opacity: 1; transform: translateX(-50%) rotate(-6deg) scale(1); } }
  .rcard.void .front > :not(.stamp) { opacity: .5; }
  .reveals.many .rcard { width: 118px; height: 164px; }
  .reveals.many .rcard .front .ic { font-size: 32px; padding: 10px 0 8px; }
  .reveals.many .rcard .front b { font-size: 15px; }
  .reveals.many .rcard .back .rchip { width: 42px; height: 42px; font-size: 13px; }

  /* ---------- итог спина: табло справа ---------- */
  body.m-result .feed, body.m-result .hist { visibility: hidden; }
  .resbox { position: fixed; z-index: 6; right: 18px; top: 78px; width: min(380px, 27vw); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .result { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
  .result .col { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; width: 100%; }
  .result.out { animation: resout .5s ease-in forwards; }
  @keyframes resout { to { opacity: 0; transform: translateY(-20px) scale(.96); } }
  .numbox { position: relative; display: grid; place-items: center; }
  .numbox .rays { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 255, 255, .1) 0 5deg, rgba(255, 255, 255, 0) 5deg 15deg); -webkit-mask: radial-gradient(circle, #000 20%, transparent 64%); mask: radial-gradient(circle, #000 20%, transparent 64%); animation: rays 4.2s ease-out forwards; pointer-events: none; }
  .numbox.red .rays { background: repeating-conic-gradient(rgba(227, 38, 58, .28) 0 5deg, rgba(227, 38, 58, 0) 5deg 15deg); }
  .numbox.green .rays { background: repeating-conic-gradient(rgba(34, 199, 127, .3) 0 5deg, rgba(34, 199, 127, 0) 5deg 15deg); }
  @keyframes rays { from { transform: rotate(-30deg) scale(.4); opacity: 0; } 20% { opacity: 1; } to { transform: rotate(40deg) scale(1); opacity: .6; } }
  .numbox .burst { position: absolute; width: 190px; height: 190px; border-radius: 50%; border: 4px solid #fff; animation: ringout 1s ease-out forwards; pointer-events: none; }
  .numbox .burst.b2 { animation-delay: .18s; opacity: 0; }
  @keyframes ringout { from { transform: scale(.8); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }
  .bignum { position: relative; width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center; font: 900 100px/1 var(--cond); letter-spacing: -.06em; color: #fff; font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 6px #fff, 0 30px 60px -16px rgba(0, 0, 0, .9); animation: numin .6s var(--spring); }
  @keyframes numin { from { transform: scale(.2); opacity: 0; } }
  .numword { font: 800 18px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; animation: callin .5s .15s both; white-space: nowrap; }
  .winners { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .winners div { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font: 700 17px/1 var(--cond); animation: callin .45s var(--spring) both; }
  .winners .rchip { width: 34px; height: 34px; font-size: 12px; flex: none; }
  .winners span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .winners b { font: 900 22px/1 var(--cond); letter-spacing: -.04em; color: var(--ok); }
  .banner { font: 900 clamp(18px, 1.8vw, 28px)/1.1 var(--cond); letter-spacing: -.01em; text-transform: uppercase; padding: 12px 22px; border-radius: 999px; text-align: center; max-width: 100%; color: var(--text); background: var(--panel); border: 1px solid var(--line-2); animation: callin .45s var(--spring); }
  .center .banner { max-width: 70vw; font-size: clamp(22px, 2.4vw, 36px); }
  .banner.allin { background: var(--red); border-color: transparent; color: #fff; box-shadow: 0 0 0 6px rgba(227, 38, 58, .25), 0 20px 40px -12px rgba(227, 38, 58, .6); animation: callin .45s var(--spring), allin 1.2s ease-in-out .5s 4; }
  @keyframes allin { 50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(227, 38, 58, .12), 0 20px 40px -12px rgba(227, 38, 58, .6); } }
  .banner.jackpot { color: var(--accent-ink); background: var(--accent); border-color: transparent; font-size: clamp(28px, 3vw, 48px); padding: 14px 30px; box-shadow: 0 0 0 8px rgba(255, 192, 67, .2), 0 0 60px rgba(255, 192, 67, .5); animation: callin .45s var(--spring), jack .6s ease-in-out .5s 5 alternate; }
  @keyframes jack { to { box-shadow: 0 0 0 16px rgba(255, 192, 67, .08), 0 0 90px rgba(255, 192, 67, .7); } }
  .banner.save { color: #04210f; background: #bfe6ff; border-color: transparent; }
  .result .col .callout { font-size: clamp(40px, 4.4vw, 72px); padding: 0; }
  .flash-green { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(circle at 50% 42%, rgba(34, 199, 127, .55), rgba(34, 199, 127, .2) 60%, rgba(34, 199, 127, 0)); animation: gflash 1.2s ease-out forwards; }
  @keyframes gflash { from { opacity: 0; } 18% { opacity: 1; } to { opacity: 0; } }

  /* ---------- лобби: справа, колесо слева крутится на холостом ходу ---------- */
  body.m-lobby .feed, body.m-lobby .hist { visibility: hidden; }
  /* прокручивается только середина; «Начать партию» всегда на виду внизу таблички */
  .lobby { right: 24px; top: 74px; max-height: calc(100vh - 92px); width: min(560px, 44vw); background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .9); }
  .lobby .lscroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding: 24px 26px 16px; display: flex; flex-direction: column; gap: 16px; }
  .lobby .lfoot { flex: none; padding: 14px 26px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; background: var(--panel); }
  .lobby .lfoot .fine:empty { display: none; }
  .lobby .lhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 700 12px/1.2 var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .live { display: inline-flex; align-items: center; gap: 8px; color: var(--text); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px rgba(227, 38, 58, .22); animation: live 1.2s ease-in-out infinite alternate; }
  @keyframes live { to { box-shadow: 0 0 0 8px rgba(227, 38, 58, 0); } }
  .lobby h2 { font: 900 36px/1 var(--cond); letter-spacing: -.045em; margin: 0; }
  .lobby .join { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
  .lobby #qr { background: #fff; padding: 10px; border-radius: 16px; width: 184px; height: 184px; }
  .lobby #qr img, .lobby #qr canvas { width: 164px !important; height: 164px !important; }
  .lobby .join > div:last-child { min-width: 0; }
  .lobby .code { font: 900 var(--code-fs, 92px)/.88 var(--cond); letter-spacing: -.05em; color: var(--text); white-space: nowrap; }
  .lobby .url { color: var(--green); font: 700 15px/1.2 var(--cond); word-break: break-all; margin-top: 10px; }
  .lobby .scan { color: var(--muted); font-size: 14px; margin-top: 6px; }
  /* места за столом: сукно, фишки строго по центру */
  .seats { border-radius: 20px; padding: 14px; background: radial-gradient(120% 120% at 50% 20%, #0f7d50, var(--felt) 60%, #084a30); }
  .seats .cap { display: flex; justify-content: space-between; font: 700 11px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .85); margin-bottom: 12px; }
  .lobby .who { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 8px; min-height: 64px; }
  .lobby .who > span { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 68px; }
  .lobby .who > span .rchip { width: 44px; height: 44px; font: 800 14px/1 var(--cond); }
  .lobby .who > span.new .rchip { animation: drop .5s var(--spring) both; }
  @keyframes drop { 0% { transform: translateY(-40px) scale(1.6); opacity: 0; } 60% { transform: translateY(0) scale(.9); opacity: 1; } }
  .lobby .who > span b { font: 700 12.5px/1.1 var(--cond); max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lobby .who > span.empty { opacity: .45; }
  .lobby .who > span.empty i { width: 44px; height: 44px; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, .55); }
  .lobby .who .x { position: absolute; right: 4px; top: -4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--bg); color: var(--muted); padding: 0; font-size: 11px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; font-size: 14px; }
  .opts .o { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .opts .k { color: var(--muted); font: 700 11px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; }
  /* сегментный переключатель — одна дорожка, выбранный сегмент белый */
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 12px; align-self: flex-start; }
  .seg button { border: 0; background: none; border-radius: 9px; padding: 7px 11px; font: 700 13.5px/1 var(--cond); min-height: 32px; color: #c9ced6; transition: background .15s, color .15s; }
  .seg button.on { background: var(--text); color: var(--ink); }
  .btn { position: relative; overflow: hidden; border: 0; background: var(--accent); color: var(--accent-ink); font: 800 19px/1 var(--cond); letter-spacing: -.01em; border-radius: 16px; padding: 19px 24px; box-shadow: 0 14px 34px -12px rgba(255, 192, 67, .6); transition: transform .18s var(--spring); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.shine:not(:disabled)::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 24%; background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .55), rgba(255, 255, 255, 0)); transform: skewX(-20deg); animation: shine 3.4s ease-in-out infinite; }
  @keyframes shine { 0%, 60% { left: -40%; } 100% { left: 130%; } }
  .btn.small { font-size: 14px; padding: 11px 16px; border-radius: 12px; }
  .btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line-2); box-shadow: none; }
  .fine { color: var(--muted); font-size: 13px; }

  .ctrl { right: 18px; bottom: var(--rail-h, 110px); margin-bottom: 10px; display: flex; gap: 8px; }
  .ctrl .sound-toggle-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); display: grid; place-items: center; }
  body.m-lobby .ctrl { right: auto; left: 18px; }
  .viewer { left: 18px; bottom: var(--rail-h, 110px); margin-bottom: 12px; color: var(--muted); font-size: 13px; }

  /* ---------- финал ---------- */
  .final { z-index: 9; inset: 0; background: radial-gradient(60% 55% at 50% 36%, rgba(40, 32, 10, .95), rgba(10, 11, 13, .97) 72%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; overflow: hidden; padding: 20px; }
  .final .sub { color: var(--accent); font: 800 14px/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; }
  .final h2 { font: 900 clamp(40px, 5.4vw, 84px)/.95 var(--cond); letter-spacing: -.055em; text-transform: uppercase; margin: 0; max-width: 90vw; overflow-wrap: anywhere; }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 12px; margin-top: 6px; }
  .podium .p { display: flex; flex-direction: column; align-items: center; gap: 8px; width: clamp(150px, 14vw, 210px); }
  .podium .p .rchip { width: 72px; height: 72px; font: 800 22px/1 var(--cond); }
  .podium .p.first .rchip { width: 112px; height: 112px; font-size: 34px; }
  .podium .p .nm { font: 700 20px/1.1 var(--cond); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium .p.first .nm { font-size: 25px; font-weight: 800; }
  .podium .p .st { font: 900 22px/1 var(--cond); letter-spacing: -.04em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .podium .p.first .st { color: var(--accent); }
  .podium .step { width: 100%; display: grid; place-items: center; border-radius: 18px 18px 6px 6px; font: 900 48px/1 var(--cond); letter-spacing: -.05em; color: var(--ink); }
  .podium .first .step { height: 150px; background: var(--accent); font-size: 68px; box-shadow: 0 0 60px -10px rgba(255, 192, 67, .6); }
  .podium .second .step { height: 104px; background: #d9dde3; }
  .podium .third .step { height: 76px; background: #d98a4a; }
  .podium .crown { font-size: 42px; line-height: 1; margin-bottom: -8px; animation: crown 1.2s ease-in-out infinite alternate; }
  @keyframes crown { to { transform: translateY(-6px) rotate(6deg); } }
  .final .places { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 86vw; }
  .final .places span { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 4px; font: 700 14px/1 var(--cond); }
  .final .places .rchip { width: 24px; height: 24px; font-size: 0; }
  .final .stats { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 1100px; }
  .final .stats div { width: 200px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .final .stats small { display: block; color: var(--muted); font: 700 10.5px/1.2 var(--cond); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
  .final .stats b { font: 700 15px/1.25 var(--cond); overflow-wrap: anywhere; }
  .rain { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
  .rain .rchip { position: absolute; top: -50px; width: 34px; height: 34px; animation: fall var(--d, 4s) var(--w, 0s) linear forwards; }
  @keyframes fall { to { transform: translateY(calc(100vh + 100px)) rotate(var(--r, 360deg)); } }

  /* ---------- раздача карт: общий показ перед первым спином ---------- */
  body.m-brief .feed, body.m-brief .hist { visibility: hidden; }
  .brief { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 70px 24px calc(24px + var(--rail-h, 0px)); background: radial-gradient(70% 60% at 50% 45%, rgba(10, 11, 13, .82), rgba(10, 11, 13, .95)); text-align: center; animation: bfade .5s ease-out; }
  .brief.out { animation: bout .6s ease-in forwards; pointer-events: none; }
  @keyframes bfade { from { opacity: 0; } }
  @keyframes bout { to { opacity: 0; transform: scale(1.04); } }
  .brief .eyebrow { font: 700 13px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--green); }
  .brief h2 { font: 900 clamp(48px, 6vw, 96px)/.9 var(--cond); letter-spacing: -.055em; text-transform: uppercase; margin: 8px 0 10px; }
  .brief .sub { color: #c9ced6; font: 600 clamp(15px, 1.4vw, 20px)/1.35 var(--cond); max-width: 60ch; margin: 0 auto; }
  /* легенда: все пять карт лицом, раскладываются веером по одной */
  .legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; max-width: 1200px; }
  .lcard { width: clamp(150px, 13vw, 200px); border-radius: 20px; overflow: hidden; background: var(--surface); border: 1px solid var(--line-2); text-align: left; box-shadow: 0 24px 40px -18px rgba(0, 0, 0, .9); animation: ldeal .7s var(--spring) both; }
  @keyframes ldeal { from { transform: translateY(80px) rotate(var(--rot, -6deg)) scale(.7); opacity: 0; } }
  .lcard .top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--k, #9b1424); }
  .lcard .top .ic { font-size: 30px; line-height: 1; }
  .lcard .top b { font: 900 clamp(16px, 1.3vw, 20px)/1.05 var(--cond); letter-spacing: -.03em; }
  .lcard p { margin: 0; padding: 10px 14px 14px; font: 600 clamp(12.5px, 1vw, 14.5px)/1.3 var(--cond); color: #d3d7de; }
  .brief .rule { font: 600 14px/1.3 var(--cond); color: var(--muted); max-width: 90ch; }
  /* места: фишка, рубашки карт, лампа и штамп «Готов» */
  .bseats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; max-width: 1300px; }
  .bseat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 110px; padding: 12px 8px 10px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); transition: border-color .3s, transform .3s var(--spring); }
  .bseat .rchip { width: 48px; height: 48px; font: 800 15px/1 var(--cond); }
  .bseat b { font: 700 15px/1.1 var(--cond); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bseat .backs { display: flex; height: 18px; }
  .bseat .backs i { width: 13px; height: 18px; margin-left: -3px; border-radius: 3px; background: var(--red); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .85); }
  .bseat .st { font: 700 12px/1 var(--cond); color: var(--muted); letter-spacing: .02em; }
  .bseat.ready { border-color: rgba(34, 199, 127, .8); transform: translateY(-4px); }
  .bseat.ready .st { font: 900 13px/1 var(--cond); text-transform: uppercase; letter-spacing: .04em; color: #04210f; background: var(--green); padding: 5px 10px; border-radius: 999px; animation: stampin2 .45s var(--spring); }
  @keyframes stampin2 { from { transform: scale(2) rotate(-10deg); opacity: 0; } }
  .bseat.off { opacity: .45; }
  .brief .bwait { display: flex; align-items: center; gap: 16px; justify-content: center; flex-wrap: wrap; font: 800 20px/1 var(--cond); letter-spacing: -.02em; }
  .brief .bwait.all { color: var(--green); }
  @media (max-height: 760px) {
    .brief { gap: 14px; padding-top: 56px; }
    .brief h2 { font-size: clamp(40px, 5vw, 64px); margin: 4px 0 6px; }
    .lcard .top { padding: 9px 12px; } .lcard .top .ic { font-size: 24px; } .lcard p { padding: 8px 12px 10px; }
    .bseat { width: 96px; padding: 9px 6px 8px; } .bseat .rchip { width: 40px; height: 40px; }
  }
  /* табличка паузы: по центру над сценой, уходит сразу после «Продолжить» */
  /* ниже разметки, на пустом сукне над рядом игроков: по центру она закрывала числа стола */
  .pauseplate { left: 50%; top: auto; bottom: calc(var(--rail-h, 110px) + 22px); transform: translateX(-50%); z-index: 7; display: flex; align-items: center; gap: 16px; padding: 18px 30px; border-radius: 22px; background: rgba(14, 15, 18, .94); border: 1px solid var(--line-2); font: 900 clamp(26px, 3vw, 44px)/1 var(--cond); letter-spacing: -.03em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .9); animation: platein .4s var(--spring); }
  @keyframes platein { from { opacity: 0; transform: translateX(-50%) scale(1.25); } }
  .pauseplate .pi { color: var(--accent); }
  .pauseplate.soft { top: auto; bottom: calc(var(--rail-h, 110px) + 22px); font-size: clamp(16px, 1.5vw, 22px); padding: 10px 18px; border-radius: 999px; }
  .roomtag .specs { margin-left: 8px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); padding: 3px 9px; border-radius: 999px; letter-spacing: .02em; text-transform: none; }
  .menu { position: fixed; z-index: 20; background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; padding: 6px; display: none; min-width: 190px; box-shadow: 0 20px 40px rgba(0, 0, 0, .7); }
  .menu.on { display: grid; }
  .menu button { background: none; border: 0; text-align: left; padding: 10px; border-radius: 9px; font-weight: 600; }
  .menu button:hover { background: var(--surface-2); }
  .conn { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 30; background: var(--warn); color: #fff; font-weight: 700; padding: 7px 12px; border-radius: 10px; display: none; }
  .conn.on { display: block; }
  .hidden { display: none !important; }
  @media (max-width: 1360px) {
    .level { gap: 14px; padding: 8px 16px; }
    .level .v { font-size: 32px; }
    .ring { width: 66px; height: 66px; }
    .ring .v { font-size: 26px; }
    .brand { font-size: 25px; }
    .center { top: 14vh; }
    .bignum { width: 150px; height: 150px; font-size: 80px; }
    .numbox .burst { width: 150px; height: 150px; }
    .seat { grid-template-columns: 46px minmax(0, 1fr); }
    .seat .avw { width: 46px; height: 46px; }
    .seat .st .s { font-size: 23px; }
    .seat .nm { font-size: 16px; }
  }
  @media (max-height: 760px) {
    .lobby { top: 64px; max-height: calc(100vh - 76px); }
    .lobby .lscroll { padding: 16px 20px 12px; gap: 11px; }
    .lobby .lfoot { padding: 10px 20px 12px; }
    .opts { gap: 8px 14px; }
    .lobby .join { gap: 16px; }
    .lobby h2 { font-size: 28px; }
    .lobby #qr { width: 150px; height: 150px; padding: 8px; }
    .lobby #qr img, .lobby #qr canvas { width: 134px !important; height: 134px !important; }
    .lobby .who { min-height: 56px; }
    .lobby .who > span .rchip, .lobby .who > span.empty i { width: 38px; height: 38px; }
    .seg button { padding: 6px 9px; min-height: 30px; }
    .btn { padding: 16px 20px; }
    .bignum { width: 140px; height: 140px; font-size: 74px; }
    .numbox .burst { width: 140px; height: 140px; }
    .center { top: 13vh; gap: 12px; }
    .rcard { width: 136px; height: 190px; }
    .podium .first .step { height: 110px; } .podium .second .step { height: 78px; } .podium .third .step { height: 56px; }
    .podium .p.first .rchip { width: 92px; height: 92px; }
    .final { gap: 10px; }
    .final .stats div { width: 180px; padding: 9px 11px; }
  }
  @media (max-width: 900px) {
    .lobby { left: 10px; right: 10px; width: auto; top: 70px; bottom: auto; max-height: calc(100vh - 90px); }
    .center { right: 0; }
    .feed, .hist { display: none; }
    .level .pot, .level .pips { display: none; }

<script type="module">
"use strict";
const T = (k) => rlT(k);
const tpl = (k, v) => rlTpl(k, v);
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 10);

let conn = null, state = null, isHost = false, dead = false;
let scene = null;
const hostKey = () => "roulette-host-" + CODE;

// ---------- 3D-сцена: если модуль не загрузился, игра идёт без колеса ----------
async function loadScene() {
  try {
    const mod = await import("./roulette-wheel.js");
    const calm = !!(state && state.settings && state.settings.calm);
    scene = mod.createRouletteScene($("stage"), { now: rlNow, calm, quality: "auto", lang: (window.I18N && I18N.lang) || "ru" });
    scene.on && scene.on("land", () => {});
    window.addEventListener("resize", () => scene && scene.resize());
    syncScene(true);
  } catch (err) {
    console.error("[roulette] сцена не загрузилась:", err);
    scene = null;
    feedSys(T("wheel_fail"));
  }
}

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  $("center").innerHTML = `<div class="banner">${escapeHtml(T("creating"))}</div>`;
  try {
    const lang = (window.I18N && I18N.lang) || "ru";
    const res = await fetch("/roulette/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang } }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
    $("center").innerHTML = "";
    return true;
  } catch (err) {
    $("center").innerHTML = `<div class="banner">${escapeHtml(String(err.message || err))}</div>`;
    return false;
  }
}

// ---------- лента: чат и события ----------
// Во время вращения новые сообщения копятся и выходят пачкой после остановки шарика (§5)
let heldChat = [];
const shownChat = new Set();
function holdChat() {
  return state && (state.phase === "spinning" || state.phase === "closing");
}
function feedPush(node) {
  const f = $("feed");
  f.append(node);
  while (f.children.length > 7) f.firstChild.remove();
}
function feedSys(text, big) {
  feedPush(el("div", "msg sys" + (big ? " big" : ""), text));
}
function feedChat(m) {
  if (shownChat.has(m.id)) return;
  shownChat.add(m.id);
  const p = player(m.pid);
  const d = el("div", "msg");
  d.dataset.id = m.id;
  d.innerHTML = chipHtml(p ? p.color : "#e7c068", initials(p ? p.name : "?"));
  const body = el("div");
  const b = el("b", null, (p ? p.name : "?") + ": ");
  if (p) b.style.color = p.color;
  body.append(b, document.createTextNode(m.text));
  d.append(body);
  if (isHost) {
    const x = el("button", "x", "✕");
    x.title = "hide";
    x.onclick = () => conn.send({ type: "hide_msg", id: m.id });
    d.append(x);
  }
  feedPush(d);
}
function syncChat() {
  if (!state) return;
  const visible = new Set(state.chat.map((m) => m.id));
  // скрытые ведущим — убираем с экрана
  for (const node of [...$("feed").querySelectorAll(".msg[data-id]")]) if (!visible.has(Number(node.dataset.id))) node.remove();
  for (const m of state.chat) {
    if (shownChat.has(m.id)) continue;
    if (holdChat()) { if (!heldChat.some((x) => x.id === m.id)) heldChat.push(m); }
    else feedChat(m);
  }
  if (!holdChat() && heldChat.length) { heldChat.forEach(feedChat); heldChat = []; }
}

// ---------- рельс ----------
const player = (id) => state && state.players.find((p) => p.id === id);
// по кодовым точкам: эмодзи в имени не рвётся пополам («�E»)
const initials = (name) => Array.from(String(name || "?").replace(/^🤖\s*/, "").split(/\s+/).map((w) => Array.from(w)[0] || "").join("")).slice(0, 2).join("").toUpperCase();
const seatNodes = new Map();
const chipHtml = (color, text, extra) => `<i class="rchip" style="${rlChipVars(color)}${extra || ""}">${text == null ? "" : escapeHtml(text)}</i>`;
const CARD_INK = { double: "#7d0f19", freeze: "#1f5f8f", share: "#4a5560", eye: "#0f6b73", shield: "#8a6420" };
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const shownStack = new Map();

function drawRail() {
  const rail = $("rail");
  // на финале рельса нет: он закрывал награды и «Ещё партию», а клик по месту открывал меню ведущего
  if (!state || state.phase === "lobby" || state.phase === "briefing" || state.phase === "finished") { rail.replaceChildren(); seatNodes.clear(); setRailH(); return; }
  const players = state.players.filter((p) => !p.left && !p.spectator);
  rail.classList.toggle("many", players.length > 8);
  const want = new Set(players.map((p) => p.id));
  for (const [id, n] of seatNodes) if (!want.has(id)) { n.remove(); seatNodes.delete(id); }
  for (const p of players) {
    let n = seatNodes.get(p.id);
    if (!n) {
      n = el("div", "seat");
      // статусы — значками на углах аватарки, чтобы не закрывать имя и стек
      n.innerHTML = `<div class="avw"><i class="av rchip"></i><i class="bdg bc"></i><i class="bdg bs"></i></div><div class="nm"></div><div class="st"><span class="s"></span><span class="b"></span></div><i class="lamp"></i>`;
      n.onclick = (e) => { if (isHost) openSeatMenu(p.id, e); };
      seatNodes.set(p.id, n);
      rail.append(n);
    }
    n.classList.toggle("host-click", isHost);
    n.classList.toggle("out", !!p.out);
    n.classList.toggle("offline", !p.online && !p.out);
    n.classList.toggle("ready", state.phase === "betting" && !!p.ready);
    n.classList.toggle("frozen", !!(p.frozen || p.freezeNext));
    const av = n.querySelector(".av");
    n.classList.toggle("muted", !!p.muted);
    av.style.cssText = rlChipVars(p.color);
    av.textContent = initials(p.name);
    n.querySelector(".nm").textContent = p.name;
    // пока шарик летит, стеки не меняются (сервер отдаёт их «до спина»); на выплате считаем вверх/вниз
    const settled = state.phase === "payout" || state.phase === "finished";
    const s = settled ? p.stack : p.stack - p.betTotal;
    animateStack(p.id, n.querySelector(".s"), s);
    n.querySelector(".b").textContent = p.betTotal && !settled ? `· ${rlNum(p.betTotal)}` : "";
    // карты в руке — красная рубашка с числом в углу аватарки; сыгранная — поверх места до открытия
    const cards = state.settings.cards && !p.out ? p.cards : 0;
    const bc = n.querySelector(".bc");
    bc.textContent = cards ? String(cards) : "";
    bc.classList.toggle("on", !!cards);
    const played = !!(p.played && state.phase === "betting");
    let pc = n.querySelector(".played");
    if (played && !pc) { pc = el("i", "played"); n.append(pc); if (!reduceMotion()) rlSfx.flip(); }
    if (!played && pc) pc.remove();
    const bs = n.querySelector(".bs");
    const badge = p.out ? "✕" : !p.online ? "⏻" : p.muted ? "🔇" : "";
    bs.textContent = badge;
    bs.className = "bdg bs" + (badge ? " on" : "") + (p.out ? " out" : !p.online ? " off" : "");
    bs.title = p.out ? T("tag_out") : !p.online ? T("tag_off") : "";
    // выбывший: вместо суммы ставки — короткое «выбыл», стек не перекрыт
    if (p.out) n.querySelector(".b").textContent = T("tag_out");
  }
  setRailH();
}
// высота рельса — для кнопок ведущего над ним (рельс бывает в один или два ряда)
function setRailH() {
  const h = $("rail").offsetHeight;
  document.documentElement.style.setProperty("--rail-h", (h || 16) + "px");
}

function animateStack(id, node, target) {
  const from = shownStack.has(id) ? shownStack.get(id) : target;
  shownStack.set(id, target);
  if (from === target) { node.textContent = rlNum(target); return; }
  const t0 = performance.now(), dur = 900;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    node.textContent = rlNum(Math.round(from + (target - from) * e));
    if (k < 1 && shownStack.get(id) === target) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function floatAt(pid, text, cls) {
  const n = seatNodes.get(pid);
  if (!n) return;
  if (cls === "plus") { n.classList.remove("hit"); void n.offsetWidth; n.classList.add("hit"); }
  const f = el("div", "float " + cls, text);
  n.append(f);
  // у крайних мест сумма не должна уезжать за край экрана
  // (анимация начинается со scale(.5) — считаем по настоящей ширине, а не по сжатому прямоугольнику)
  const r = f.getBoundingClientRect(), pad = 10, cx = r.left + r.width / 2, hw = f.offsetWidth / 2;
  const shift = cx + hw > innerWidth - pad ? cx + hw - innerWidth + pad : cx - hw < pad ? cx - hw - pad : 0;
  if (shift) f.style.setProperty("--fx", `calc(-50% - ${Math.round(shift)}px)`);
  setTimeout(() => f.remove(), 2600);
}

// меню ведущего по клику на игрока
function openSeatMenu(pid, e) {
  const p = player(pid);
  if (!p) return;
  const m = $("menu");
  const kick = el("button", null, T("kick"));
  kick.onclick = () => { m.classList.remove("on"); if (confirm(tpl("kick_confirm", { name: p.name }))) conn.send({ type: "kick", playerId: pid }); };

  m.replaceChildren(el("div", "fine", p.name), mute, kick);
  m.style.left = Math.min(innerWidth - 200, e.clientX) + "px";

}
document.addEventListener("click", () => $("menu").classList.remove("on"));

// ---------- лобби ----------
let qrDrawn = false;
const lobbySeen = new Set();
function drawLobby() {
  const box = $("lobby");
  const on = state && state.phase === "lobby";
  box.classList.toggle("hidden", !on);
  document.body.classList.toggle("m-lobby", !!on);
  if (!on) return;
  const url = `${location.origin}/roulette.html?r=${CODE}`;
  if (!box.dataset.built || box.dataset.lang !== (window.I18N && I18N.lang)) {
    box.dataset.built = "1";
    box.dataset.lang = (window.I18N && I18N.lang) || "ru";
    qrDrawn = false;
    box.innerHTML = `<div class="lscroll"><div class="lhead"><span class="live"><i></i>${T("lobby_live")}</span><span>${T("fine")}</span></div>
      <h2>${T("lobby_title")}</h2>
      <div class="join"><div id="qr"></div><div><div class="code">${escapeHtml(CODE)}</div><div class="url">${escapeHtml(url.replace(/^https?:\/\//, ""))}</div><div class="scan">${T("lobby_scan")}</div></div></div>
      <div class="seats"><div class="cap"><span>${T("lobby_who")}</span><span id="seatn"></span></div><div class="who" id="who"></div></div>
      <div class="opts" id="opts"></div></div>
      <div class="lfoot"><button class="btn shine" id="startbtn">${T("btn_start")}</button><div class="fine" id="starthint"></div></div>`;
    $("startbtn").onclick = () => conn.send({ type: "start" });
    // код во всю ширину таблички: короткий — огромный, длинный — ужимаем, но в одну строку
    const codeEl = box.querySelector(".code");
    let fs = 96;
    codeEl.style.setProperty("--code-fs", fs + "px");
    while (fs > 36 && codeEl.scrollWidth > codeEl.clientWidth + 1) { fs -= 4; codeEl.style.setProperty("--code-fs", fs + "px"); }
  }
  if (!qrDrawn && window.QRCode) {
    qrDrawn = true;
    new QRCode($("qr"), { text: url, width: 164, height: 164, colorDark: "#140f0b", colorLight: "#fbf4e3", correctLevel: QRCode.CorrectLevel.M });
  }
  const players = state.players.filter((p) => !p.left);
  const who = $("who");
  // новые игроки падают фишкой на сукно со щелчком; пустые места — пунктиром, чтобы было видно, сколько ещё можно
  const fresh = players.filter((p) => !lobbySeen.has(p.id));
  if (fresh.length && lobbySeen.size) rlSfx.chip();
  const nodes = players.map((p) => {
    const sp = el("span", lobbySeen.has(p.id) ? "" : "new");
    sp.innerHTML = chipHtml(p.color, initials(p.name));
    sp.append(el("b", null, p.name));
    if (isHost) { const x = el("button", "x", "✕"); x.title = T("kick"); x.onclick = () => conn.send({ type: "kick", playerId: p.id }); sp.append(x); }
    return sp;
  });
  fresh.forEach((p) => lobbySeen.add(p.id));
  const free = Math.max(0, Math.min(12, Math.max(4, players.length + 1)) - players.length);
  for (let i = 0; i < free; i++) { const sp = el("span", "empty"); sp.append(el("i"), el("b", null, T("lobby_free"))); nodes.push(sp); }
  who.replaceChildren(...nodes);
  $("seatn").textContent = tpl("lobby_seats", { n: players.length });
  drawOpts();
  const enough = players.filter((p) => p.online).length >= 2;
  $("startbtn").disabled = !isHost || !enough;
  $("startbtn").classList.toggle("hidden", !isHost);
  $("starthint").textContent = !enough ? T("need_two") : "";
}

function drawOpts() {
  const s = state.settings;
  const opts = $("opts");
  const row = (label, values, cur, fmt, set) => {
    const seg = el("div", "seg");
    for (const v of values) {
      const b = el("button", v === cur ? "on" : "", fmt(v));
      b.disabled = !isHost;
      b.onclick = () => conn.send({ type: "settings", settings: set(v) });
      seg.append(b);
    }
    const o = el("div", "o");
    o.append(el("div", "k", label), seg);
    return [o];
  };
  const onoff = (v) => T(v ? "on" : "off");
  opts.replaceChildren(
    ...row(T("opt_stack"), [500, 1000, 2000], s.stack, (v) => rlNum(v), (v) => ({ stack: v })),
    ...row(T("opt_pace"), ["fast", "normal", "slow"], s.pace, (v) => T("pace_" + v), (v) => ({ pace: v })),
    ...row(T("opt_time"), [20000, 25000, 30000, 45000], s.betTime, (v) => tpl("sec", { n: v / 1000 }), (v) => ({ betTime: v })),
    ...row(T("opt_cards"), [true, false], s.cards, onoff, (v) => ({ cards: v })),
    ...row(T("opt_chat"), [true, false], s.chat, onoff, (v) => ({ chat: v })),
    ...row(T("opt_calm"), [false, true], s.calm, onoff, (v) => ({ calm: v })),
  );
}

// ---------- верх: уровень, таймер ----------
let shownPot = null;
function drawTop() {
  const specs = state ? state.players.filter((p) => p.spectator && !p.left).length : 0;
  $("roomtag").innerHTML = (CODE ? tpl("room", { code: escapeHtml(CODE) }) : "") + (specs ? ` <span class="specs">👀 ${escapeHtml(tpl("spectators", { n: specs }))}</span>` : "");
  const lv = $("level");
  const on = state && state.phase !== "lobby" && state.phase !== "finished" && state.phase !== "briefing";
  lv.classList.toggle("hidden", !on);
  drawHist();
  if (!on) return;
  const mv = $("minv");
  const minTxt = rlNum(state.minBet);
  if (mv.textContent !== minTxt && mv.textContent !== "–") { mv.classList.remove("bump"); void mv.offsetWidth; mv.classList.add("bump"); }
  mv.textContent = minTxt;
  // лестница уровней: горят пройденные, мигает текущий; в овертайме лестница краснеет
  const n = state.levels || 10;
  const pips = $("pips");
  if (pips.childElementCount !== n) pips.innerHTML = "<i></i>".repeat(n);
  [...pips.children].forEach((x, i) => { x.classList.toggle("on", i <= state.level); x.classList.toggle("cur", i === state.level && !state.overtime); });
  pips.classList.toggle("ot", !!state.overtime);
  const next = state.nextMinBet !== state.minBet || state.nextOvertime !== state.overtime;
  let txt = "";
  if (state.overtime) txt = `<span class="ot">${escapeHtml(tpl("overtime", { p: state.overtime }))}</span>`;
  else if (next && state.spinsToLevel != null) txt = escapeHtml(tpl("next_in", { n: state.spinsToLevel + 1, v: state.nextOvertime ? tpl("overtime", { p: state.nextOvertime }) : rlNum(state.nextMinBet) }));
  $("nextv").innerHTML = txt;
  // банк: сколько сейчас лежит на столе у всех — растёт на глазах
  const pot = state.players.reduce((a, p) => a + (p.out ? 0 : p.betTotal || 0), 0);
  const pv = $("potv");
  if (shownPot != null && pot > shownPot) { pv.classList.remove("bump"); void pv.offsetWidth; pv.classList.add("bump"); }
  shownPot = pot;
  pv.textContent = rlNum(pot);
}

// табло последних номеров, свежий — крупнее
let histTop = null;
function drawHist() {
  const h = $("hist");
  const list = state && state.phase !== "lobby" ? (state.history || []).slice(0, 10) : [];
  const key = list.join(",");
  if (h.dataset.key === key) return;
  h.dataset.key = key;
  const fresh = list.length && histTop !== null && key !== histTop;
  histTop = key;
  h.replaceChildren(...list.map((n, i) => { const b = el("div", "ball " + rlColor(n) + (i === 0 && fresh ? " fresh" : ""), String(n)); return b; }));
}

function tickRing() {
  if (!state) return;
  const total = state.settings.betTime;
  let left = 0;
  if (state.phase === "betting" && state.deadline && !state.paused) left = Math.max(0, state.deadline - rlNow());
  if (state.paused) left = total;
  const hot = state.phase === "betting" && left < 5000 && !state.paused;
  $("ringc").setAttribute("stroke-dashoffset", String(213.6 * (1 - (state.phase === "betting" ? Math.min(1, left / total) : 0))));
  $("ringc").setAttribute("stroke", hot ? "#ff7a45" : "#e7c068");
  const res = (state.phase === "payout") && state.result && state.result.number != null ? state.result.number : null;
  const ring = $("ring");
  ring.classList.toggle("res", res != null);
  ["red", "black", "green"].forEach((c) => ring.classList.toggle(c, res != null && rlColor(res) === c));
  $("ringv").textContent = state.phase === "betting" ? (state.paused ? "II" : String(Math.ceil(left / 1000))) : res != null ? String(res) : "";
  $("ring").classList.toggle("hot", state.phase === "betting" && left < 5000 && !state.paused);
}
setInterval(tickRing, 200);

// ---------- управление ведущего ----------
function drawCtrl() {
  const c = $("ctrl");
  const sound = c.querySelector(".sound-toggle-btn");
  const btns = [];
  if (isHost && state && state.phase !== "lobby" && state.phase !== "finished" && state.phase !== "briefing") {

    const eb = el("button", "btn small ghost", T("btn_end"));

// ---------- центр: фазы спина ----------
let centerSpin = -1, centerPhase = null, timers = [];
function later(ms, fn) { timers.push(setTimeout(fn, Math.max(0, ms))); }
function clearLater() {
  timers.forEach(clearTimeout); timers = [];
  const rb = $("resbox");
  if (rb) rb.replaceChildren();
  document.body.classList.remove("m-result");
}

function drawCenter() {
  const s = state;
  const box = $("center");
  if (!s) return;
  // пауза в ключе: после «Продолжить» снова звучит «Делайте ставки»; сама табличка паузы — отдельный элемент
  const key = s.spin + ":" + s.phase + (s.phase === "betting" && s.paused ? ":p" : "");
  if (key === centerSpin + ":" + centerPhase) return;
  const prevPhase = centerPhase;
  centerSpin = s.spin;
  centerPhase = key.slice(String(s.spin).length + 1);
  clearLater();
  box.replaceChildren();
  const r = s.result;
  const nm = (id) => (player(id) || {}).name || "?";
  if (s.phase === "betting") {
    if (s.paused) return;
    // реплика крупье на старте ставок — крупно и уходит сама
    box.append(el("div", "callout gold fade", T("place_bets")));
    later(2700, () => box.replaceChildren());
  } else if (s.phase === "closing" && r) {
    box.append(el("div", "callout", T("no_more")));
    if (!reduceMotion()) { const w = el("div", "wave"); document.body.append(w); setTimeout(() => w.remove(), 1300); }
    rlSfx.sweep(); later(150, () => rlSfx.stamp());
    // штрафы — над аватарками
    for (const [pid, n] of Object.entries(r.penalties || {})) floatAt(pid, `−${rlNum(n)} ${T("penalty")}`, "minus");
    // карты: рубашкой вверх, переворачиваются по одной с весом, итог ставится штампом
    if (r.reveals && r.reveals.length) {
      const row = el("div", "reveals" + (r.reveals.length > 5 ? " many" : ""));
      const start = (r.closedAt || rlNow()) + 700 - rlNow();
      // первые четыре — по одной, с паузой; остальные идут очередью, чтобы 12 карт не тянулись 15 секунд
      const at = (i) => (i < 4 ? i * 1100 : 4 * 1100 + (i - 4) * 420);
      r.reveals.forEach((rv, i) => {
        const by = player(rv.by), tg = player(rv.target);
        const card = el("div", "rcard" + (rv.outcome !== "ok" ? " void" : ""));
        card.style.setProperty("--k", CARD_INK[rv.card] || "#7d0f19");
        const outTxt = rv.outcome === "ok" ? "" : T("out_" + rv.outcome);
        card.innerHTML = `<div class="in"><div class="face back">${chipHtml(by ? by.color : "#e7c068", initials(nm(rv.by)))}<b>${escapeHtml(nm(rv.by))}</b></div>
          <div class="face front"><div class="ic">${RL_CARDS[rv.card].icon}</div><b>${escapeHtml(T("card_" + rv.card))}</b>
          <small>${escapeHtml(nm(rv.by))} → ${escapeHtml(nm(rv.target))}</small>${outTxt ? `<div class="o">${escapeHtml(outTxt)}</div>` : ""}
          <div class="stamp">${escapeHtml(T("stamp_" + rv.outcome) || "")}</div></div></div>`;
        // карта ложится на стол за полсекунды до своего переворота, а не все разом в кадр закрытия ставок
        later(start + at(i) - 500, () => { card.classList.add("dealt"); row.append(card); });
        later(start + at(i), () => {
          card.classList.add("open");
          rlSfx.flip();
          feedSys(tpl("ev_card", { by: nm(rv.by), target: nm(rv.target), card: T("card_" + rv.card) }) + (outTxt ? ` — ${outTxt}` : ""));
          if (rv.card === "freeze" && rv.outcome === "ok" && tg) feedSys(tpl("ev_frozen", { name: tg.name }));
        });
        later(start + at(i) + 650, () => { card.classList.add("stamped"); if (i < 4 || i === r.reveals.length - 1) rlSfx.stamp(); });
      });
      box.append(row);
    }
    // штрафы видны над местами — в ленту их не пишем, чтобы не тонул чат
  } else if (s.phase === "spinning" && r) {
    const st = r.story || {};
    if (st.allin && st.allin.length) {
      const names = st.allin.map((id) => (player(id) || {}).name).filter(Boolean).join(", ");
      box.append(el("div", "banner allin", tpl("allin_banner", { names })));
      st.allin.forEach((id) => { const p = player(id); if (p) feedSys(tpl("ev_allin", { name: p.name }), true); });
    }
  } else if ((s.phase === "payout" || s.phase === "finished") && r && r.number != null) {
    const n = r.number, col = rlColor(n);
    const st = r.story || {};
    // номер-шар с лучами и двумя кольцами-вспышками
    const rb = $("resbox");
    const row = el("div", "result");
    const nb = el("div", "numbox " + col);
    nb.innerHTML = `<div class="rays"></div><div class="burst"></div><div class="burst b2"></div><div class="bignum ${col}">${n}</div>`;
    const side = el("div", "col");
    row.append(nb, side);
    rb.replaceChildren(row);
    document.body.classList.add("m-result");
    const words = n === 0 ? [T("zero")] : [T("color_" + col), rlBetName(n % 2 ? "odd" : "even"), n <= 18 ? "1–18" : "19–36"];
    side.append(el("div", "numword", words.join(" · ")));
    if (!scene) rlSfx.ding();
    if (st.zero) {
      side.append(el("div", "callout green", T("zero")));
      if (!reduceMotion()) { const g = el("div", "flash-green"); document.body.append(g); setTimeout(() => g.remove(), 1300); }
      rlSfx.zero();
    } else if (st.jackpot) {
      side.append(el("div", "banner jackpot", T("jackpot")));
      rlSfx.win(true);
    }
    if (st.save && st.save.length) {
      side.append(el("div", "banner save", "🛟 " + tpl("saved", { names: st.save.map((id) => (player(id) || {}).name).filter(Boolean).join(", ") })));
      st.save.forEach((id) => floatAt(id, T("saved_float"), "save"));
    }
    // выигрыши и проигрыши над аватарками; тройка лучших — плашками под номером и в ленту
    const pp = r.perPlayer || {};
    const wins = [];
    for (const [pid, x] of Object.entries(pp)) {
      const net = x.net + x.share + x.eye;
      if (net > 0) floatAt(pid, "+" + rlNum(net), "plus");
      else if (net < 0) floatAt(pid, "−" + rlNum(-net), "minus");
      if (net > 0) wins.push([pid, net]);
    }
    wins.sort((a, b) => b[1] - a[1]);
    if (wins.length) {
      const wl = el("div", "winners");
      wins.slice(0, 4).forEach(([pid, v], i) => {
        const p = player(pid); if (!p) return;
        const d = el("div");
        d.style.animationDelay = 0.15 + i * 0.1 + "s";
        d.innerHTML = `${chipHtml(p.color, initials(p.name))}<span>${escapeHtml(p.name)}</span><b>+${rlNum(v)}</b>`;
        wl.append(d);
      });
      side.append(wl);
    }
    // крупный итог уходит раньше конца выплаты: на столе в это время едут фишки, их надо видеть
    later(3600, () => row.classList.add("out"));
    later(4100, () => { rb.replaceChildren(); document.body.classList.remove("m-result"); });
    // в ленту — только крупные выигрыши (от 5 минимумов), мелкие видно над местами
    wins.filter(([, v]) => v >= 5 * Math.max(1, s.minBet)).slice(0, 3).forEach(([pid, v]) => { const p = player(pid); if (p) feedSys(tpl("ev_win", { name: p.name, n: rlNum(v) }), true); });
    for (const p of s.players) if (p.out && p.outSpin === s.spin) feedSys(tpl("ev_out", { name: p.name }), true);
  }
}


// ---------- пауза: своя табличка, не зависит от реплик центра ----------
function drawPause() {
  const el2 = $("pauseplate");
  const live = state && state.phase !== "lobby" && state.phase !== "finished" && state.phase !== "briefing";
  const txt = !live ? "" : state.paused ? T("pause_plate") : state.pauseNext ? T("pause_next") : "";
  el2.classList.toggle("hidden", !txt);
  el2.classList.toggle("soft", !!txt && !state.paused);
  if (el2.dataset.t !== txt) { el2.dataset.t = txt; el2.innerHTML = txt ? `<span class="pi">II</span><span>${escapeHtml(txt)}</span>` : ""; }
}

// ---------- финал ----------
function drawFinal() {
  const f = $("final");
  const on = state && state.phase === "finished";
  f.classList.toggle("hidden", !on);
  if (!on) { f.dataset.spin = ""; return; }
  // число последнего спина и баннеры не должны просвечивать из-под итогов
  clearLater();
  $("center").replaceChildren();
  const key = state.spin + ":" + state.winnerId + ":" + ((window.I18N && I18N.lang) || "");
  if (f.dataset.spin === key) return;
  const firstTime = !f.dataset.spin;
  f.dataset.spin = key;
  const w = player(state.winnerId);
  const nm = (id) => escapeHtml((player(id) || {}).name || "?");
  const st = state.stats || {};
  const stats = [];
  if (st.biggestWin) stats.push([T("st_bigwin"), tpl("st_bigwin_v", { name: nm(st.biggestWin.playerId), n: rlNum(st.biggestWin.amount), num: st.biggestWin.number })]);
  if (st.cruelCard) stats.push([T("st_cruel"), tpl("st_cruel_v", { by: nm(st.cruelCard.by), target: nm(st.cruelCard.target), card: escapeHtml(T("card_" + st.cruelCard.card)), n: rlNum(st.cruelCard.amount) })]);
  if (st.biggestPenalty) stats.push([T("st_penalty"), tpl("st_penalty_v", { name: nm(st.biggestPenalty.playerId), n: rlNum(st.biggestPenalty.amount) })]);
  const breath = Object.entries(st.lastBreath || {}).sort((a, b) => b[1] - a[1])[0];
  if (breath) stats.push([T("st_breath"), tpl("st_breath_v", { name: nm(breath[0]), n: breath[1] })]);
  stats.push([T("st_casino"), tpl("st_casino_v", { won: rlNum(state.casino.won), paid: rlNum(state.casino.paid) })]);
  const places = state.players.filter((p) => !p.left && !p.spectator).sort((a, b) => (a.place || 99) - (b.place || 99));
  // пьедестал: 2 — 1 — 3; остальные — строкой ниже
  const podium = [places[1], places[0], places[2]].map((p, i) => {
    if (!p) return "";
    const cls = ["second", "first", "third"][i];
    return `<div class="p ${cls}">${cls === "first" ? `<div class="crown">👑</div>` : ""}${chipHtml(p.color, initials(p.name))}<div class="nm">${escapeHtml(p.name)}</div><div class="st">${rlNum(p.stack)}</div><div class="step">${p.place || "–"}</div></div>`;
  }).join("");
  let rain = "";
  if (!reduceMotion()) {
    const cols = places.map((p) => p.color).concat(["#e7c068", "#cf2331", "#17130f"]);
    for (let i = 0; i < 56; i++) rain += chipHtml(cols[i % cols.length], "", `;left:${(Math.random() * 100).toFixed(1)}%;--d:${(3 + Math.random() * 2.5).toFixed(2)}s;--w:${(Math.random() * 3).toFixed(2)}s;--r:${(Math.random() * 900 - 450).toFixed(0)}deg`);
  }
  f.innerHTML = `<div class="rain">${rain}</div>
    <div class="sub">${T(state.finishedReason === "host" ? "fin_host" : "fin_sub")}</div>
    <h2>${w ? escapeHtml(tpl("fin_title", { name: w.name })) : ""}</h2>
    <div class="podium">${podium}</div>
    ${places.length > 3 ? `<div class="places">${places.slice(3).map((p) => `<span>${chipHtml(p.color, "")}#${p.place || "–"} ${escapeHtml(p.name)}</span>`).join("")}</div>` : ""}
    <div class="stats">${stats.map(([k, v]) => `<div><small>${escapeHtml(k)}</small><b>${v}</b></div>`).join("")}</div>
    ${isHost ? `<button class="btn shine" id="again">${T("btn_again")}</button>` : ""}`;
  if (isHost) $("again").onclick = () => conn.send({ type: "next_game" });
  if (firstTime) rlSfx.win(true);
}


// ---------- раздача карт (briefing) ----------
// Легенду строим один раз на язык, места обновляем по готовности; на переходе в ставки — плавный уход.
const LEGEND = ["double", "freeze", "share", "eye", "shield"];
let briefOn = false;
function drawBrief() {
  const b = $("brief");
  const on = !!(state && state.phase === "briefing");
  document.body.classList.toggle("m-brief", on);
  if (!on) {
    if (briefOn) { b.classList.add("out"); setTimeout(() => { if (!document.body.classList.contains("m-brief")) { b.classList.add("hidden"); b.classList.remove("out"); } }, 600); }
    briefOn = false;
    return;
  }
  const lang = (window.I18N && I18N.lang) || "ru";
  if (!briefOn || b.dataset.lang !== lang || b.dataset.host !== String(isHost)) {
    b.dataset.lang = lang;
    b.dataset.host = String(isHost);
    b.classList.remove("hidden", "out");
    b.innerHTML = `<div><div class="eyebrow">${T("br_eyebrow")}</div><h2>${T("br_title")}</h2><p class="sub">${T("br_sub")}</p></div>
      <div class="legend">${LEGEND.map((c, i) => `<div class="lcard" style="--k:${CARD_INK[c]};--rot:${(i - 2) * 4}deg;animation-delay:${0.15 + i * 0.12}s"><div class="top"><span class="ic">${RL_CARDS[c].icon}</span><b>${escapeHtml(T("card_" + c))}</b></div><p>${escapeHtml(T("card_" + c + "_d"))}</p></div>`).join("")}</div>
      <div class="rule">${T("br_rule")}</div>
      <div class="bseats" id="bseats"></div>
      <div class="bwait" id="bwait"></div>`;
    if (!briefOn) LEGEND.forEach((_, i) => setTimeout(() => rlSfx.flip(), 150 + i * 120));
  }
  briefOn = true;
  const players = state.players.filter((p) => !p.left && !p.out && !p.spectator);
  const seats = $("bseats");
  const prev = new Map([...seats.children].map((n) => [n.dataset.id, n.classList.contains("ready")]));
  seats.replaceChildren(...players.map((p) => {
    const d = el("div", "bseat" + (p.ready ? " ready" : "") + (!p.online ? " off" : ""));
    d.dataset.id = p.id;
    d.innerHTML = `${chipHtml(p.color, initials(p.name))}<b></b><div class="backs">${"<i></i>".repeat(Math.min(3, p.cards || 0))}</div><div class="st"></div>`;
    d.querySelector("b").textContent = p.name;
    d.querySelector(".st").textContent = p.ready ? T("br_ready") : !p.online ? T("br_off") : T("br_reading");
    // только что нажал «Готов» — щелчок штампа
    if (p.ready && prev.has(p.id) && !prev.get(p.id)) rlSfx.stamp();
    else if (p.ready && prev.get(p.id)) d.querySelector(".st").style.animation = "none";
    return d;
  }));
  const waiting = players.filter((p) => p.online && !p.ready).length;
  const total = players.filter((p) => p.online).length;
  const w = $("bwait");
  w.classList.toggle("all", !waiting);
  w.innerHTML = `<span>${escapeHtml(waiting ? tpl("br_wait", { n: waiting, m: total }) : T("br_all"))}</span>`;
  if (isHost) {
    const go = el("button", "btn shine", T("br_go"));
    go.onclick = () => conn.send({ type: "go" });
    w.append(go);
  }
}

// ---------- синхронизация 3D-сцены ----------
let sceneKey = "";
function syncScene(force) {
  if (!scene || !state) return;
  const s = state;
  if (s.settings && typeof scene.setCalm === "function") scene.setCalm(!!s.settings.calm);
  const players = s.players.filter((p) => !p.left).map((p) => ({ id: p.id, name: p.name, color: p.color, bets: p.bets || {} }));
  const key = s.spin + ":" + s.phase;
  if (s.phase === "lobby" || s.phase === "finished" || s.phase === "briefing") {
    if (force || key !== sceneKey) scene.setIdle();
    if (s.phase === "lobby") scene.setBets([]);
  } else if (s.phase === "betting") {
    if (force || key !== sceneKey) scene.setIdle();
    scene.setBets(players);
  } else if (s.phase === "closing" && s.result) {
    if (force || key !== sceneKey) {
      scene.setBets(players);
      scene.noMoreBets();
      scene.spin(s.result); // сцена сама ждёт spinAt по серверным часам
    }
  } else if (s.phase === "spinning" && s.result) {
    // переподключились посреди вращения — сцена прыгает в нужный момент
    if (force || (key !== sceneKey && !sceneKey.startsWith(s.spin + ":closing"))) { scene.setBets(players); scene.spin(s.result); }
  } else if (s.phase === "payout" && s.result && s.result.perPlayer) {
    if (force || key !== sceneKey) scene.payout({ number: s.result.number, players, perPlayer: s.result.perPlayer });
  }
  sceneKey = key;
}

// ---------- сообщения ----------
function render() {
  if (dead || !state) return;
  drawTop();
  drawLobby();
  drawRail();
  drawCtrl();
  drawCenter();
  drawFinal();
  drawBrief();
  drawPause();
  syncChat();
  syncScene(false);
}

let lastLevel = null;
function onMessage(m) {
  switch (m.type) {
    case "hello":
      state = m.state;
      if (m.state && !isHost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      if (state && m.state.level !== state.level && m.state.phase === "betting") {
        feedSys(m.state.overtime ? tpl("ev_overtime", { p: m.state.overtime }) : tpl("ev_level", { n: rlNum(m.state.minBet) }));
      }
      state = m.state;
      render();
      break;
    case "host_ok":
      isHost = true;
      document.body.classList.add("host");
      $("lobby").dataset.built = "";
      render();
      break;
    case "host_lost":
      isHost = false;
      document.body.classList.remove("host");
      render();
      break;
    case "event":
      if (m.event.type === "react") floatAt(m.event.playerId, m.event.emoji, "react");
      break;
    case "error":
      if (m.error === "room_expired") gone();
      break;
  }
}

function gone() {
  dead = true;
  $("lobby").classList.add("hidden");
  $("center").innerHTML = `<div class="banner">${escapeHtml(T("expired"))}</div>`;
}

window.addEventListener("langchange", () => { $("lobby").dataset.built = ""; centerSpin = -1; render(); });

async function boot() {
  // ?h=токен — ссылка ведущего на другое устройство: токен кладём в хранилище и убираем из адреса
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  conn = rlConnect({
    code: CODE,
    onMessage,
    onGone: gone,
    onOpen: () => { isHost = false; },
    onState: (st) => { banner.textContent = T("err_connect"); banner.classList.toggle("on", st === "lost"); },
  });
  loadScene();
  // ручка для отладки и стенда: те же сообщения, что шлют кнопки доски
  window.rlBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
boot();
</script>
