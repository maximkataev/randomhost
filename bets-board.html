<body>
<div id="app">
  <header id="top">
    <a class="homelink" href="index.html" data-i18n="home">🏠 Главная</a>
    <div class="sign"><span data-i18n="sign_a">Тотал</span><b data-i18n="sign_b">изатор</b></div>
    <div class="evinfo" id="evinfo"></div>
    <div class="minbet" id="minbet"></div>
    <div class="phase" id="phase"></div>
    <div class="timer off" id="timer"><svg viewBox="0 0 64 64"><circle class="tr" cx="32" cy="32" r="28"/><circle class="tf" id="tf" cx="32" cy="32" r="28" stroke-dasharray="175.93" stroke-dashoffset="0"/></svg><span class="tv" id="tv"></span></div>
  </header>
  <main id="mid">
    <aside id="tote"><h2><span data-i18n="board">Табло</span><small id="toteNote"></small></h2><div id="rows"></div></aside>
    <section id="stage">
      <div id="vwrap"><div id="view">
        <div id="scene"></div>
        <div id="idle"><div><div class="big" id="idleBig"></div><div class="sub" id="idleSub"></div></div></div>
        <div id="alert"><span id="alertT"></span></div>
        <div id="stamp"></div>
        <div id="rules"></div>
      </div></div>
      <div id="sbar"><div id="say">&nbsp;</div><div id="gate"></div><div id="ctrl"><button class="sound-toggle-btn" type="button"></button></div></div>
    </section>
    <aside id="chat"><div class="cap" data-i18n="chat_cap">Чат</div><div id="feed"></div></aside>
  </main>
  <footer id="rail"></footer>
</div>

<div id="lobby" class="hidden"></div>
<div id="final" class="hidden"></div>
<canvas id="confetti" class="hidden"></canvas>
<div id="menu"></div>
<div id="conn"></div>
<div id="banner"></div>

<script src="bets-shared.js"></script>
<script src="bets-sound.js"></script>
<script src="bets-scenes.js"></script>
<script src="bets-scenes-live.js"></script>
<script src="i18n.js"></script>
<script src="sound-toggle.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
(function () {
const $ = (id) => document.getElementById(id);
const BS = window.BetsShared;
const PC = BS.PLAYER_COLORS;
const params = new URLSearchParams(location.search);
let CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 10);
const hostKey = () => "bets-host-" + CODE;
const lang = () => (window.I18N && I18N.lang) || "ru";
const T = (k, v) => {
  const D = window.I18N_DICT, L = lang();
  let s = (D[L] && D[L][k] != null ? D[L][k] : D.en[k] != null ? D.en[k] : D.ru[k] != null ? D.ru[k] : k);
  if (v) s = String(s).replace(/\{(\w+)\}/g, (m, x) => (x in v ? v[x] : m));
  return s;
};
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n) => Number(n).toLocaleString(lang() === "ru" ? "ru-RU" : lang() === "el" ? "el-GR" : "en-US");
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const snd = (name, arg) => { try { if (typeof window.BetsSound === "function") window.BetsSound(name, arg); } catch (e) {} };
const UVAL = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--u")) || 1;
const PAYOUT_MS = 7000;

let fails = 0, ws = null, wsTimer = null, wsDelay = 500, pingTimer = null, dead = false, stopped = false;
let snap = null, recvPerf = 0, prev = null;
let isHost = false, hostLost = false, hostSent = false, chatHidden = false, helloState = null; // helloState — снимок из hello, ждёт host_ok (до него это вид без исхода)
let sc = null;            // сцена BetsScenes
const serverNow = () => (snap ? snap.now + (performance.now() - recvPerf) : Date.now());
const remaining = () => (snap ? snap.deadline - serverNow() : 0);
const colorOf = (pid) => { const i = snap ? snap.players.findIndex((p) => p.id === pid) : -1; return PC[(i < 0 ? 0 : i) % PC.length]; };
const player = (pid) => snap && snap.players.find((p) => p.id === pid);
const initials = (n) => [...String(n || "?").trim()][0] || "?";

// ---------- связь ----------
function send(m) { try { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); } catch (e) {} }
function connect() {
  if (stopped) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  let opened = false;
  try { ws = new WebSocket(`${proto}://${location.host}/bets/ws?r=${CODE}`); } catch (e) { return retry(); }
  ws.onopen = () => {
    hostSent = false;
    opened = true; wsDelay = 500; $("conn").classList.remove("on");
    clearInterval(pingTimer); pingTimer = setInterval(() => send({ type: "ping", c: Date.now() }), 8000);
  };
  ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMessage(m); };
  ws.onclose = () => { clearInterval(pingTimer); if (stopped) return; if (!snap && ++fails >= 4) { gone("noroom"); return; } $("conn").textContent = T("conn"); $("conn").classList.add("on"); retry(); };
  ws.onerror = () => {};
}
function retry() { clearTimeout(wsTimer); wsTimer = setTimeout(connect, wsDelay); wsDelay = Math.min(wsDelay * 2, 8000); }

async function ensureRoom() {
  if (CODE) return true;
  banner(T("creating"));
  try {
    const res = await fetch("/bets/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", "?r=" + CODE);
    banner("");
    return true;
  } catch (err) { banner(String(err.message || err)); return false; }
}
function banner(text) { const b = $("banner"); b.textContent = text || ""; b.classList.toggle("on", !!text); }

function gone(key) { stopped = true; dead = true; try { ws && ws.close(); } catch (e) {} $("lobby").classList.add("hidden"); $("final").classList.add("hidden"); banner(T(key)); }

function onMessage(m) {
  switch (m.type) {
    case "hello": {
      // host шлём один раз на соединение (hostSent сбрасывается в connect); доска, потерявшая роль (host_lost), не забирает её автоматически
      let token = null; try { token = localStorage.getItem(hostKey()); } catch (e) {}
      if (token && !hostSent && !hostLost) { hostSent = true; send({ type: "host", token }); helloState = m.state || null; setTimeout(() => { if (!snap && helloState) onState(helloState); }, 2500); break; }
      if (m.state) onState(m.state);
      break;
    }
    case "state": onState(m.state); break;
    case "host_ok": { const was = isHost; isHost = true; hostLost = false; document.body.classList.add("host"); if (!was) lobbyKey = ""; drawCtrl(); drawGate(); if (snap) drawLobby(); break; }
    case "host_lost": isHost = false; hostLost = true; document.body.classList.remove("host"); drawCtrl(); drawGate(); if (snap) drawLobby(); break;
    case "event": onGameEvent(m.event || {}); break;
    case "live": if (sc && sc.live) { try { sc.live(m.data); } catch (e) { console.error(e); } } break;
    case "chat": onChat(m); break;
    case "react": floatAt(m.playerId, m.emoji, "react"); break;
    case "error":
      if (m.error === "room_expired") gone("expired");
      if (m.error === "bad host token") { try { localStorage.removeItem(hostKey()); } catch (e) {} hostLost = false; drawCtrl(); if (helloState && !snap) onState(helloState); }
      break;
  }
}
function onGameEvent(ev) {
  if (ev.type === "submitted") snd("submit");
  else if (ev.type === "out") { floatAt(ev.id, T("out"), "minus"); snd("out"); }
}

// ---------- состояние ----------
let evKey = "", rowsKey = "";
const revealed = new Set();      // игроки, чей купон уже проверен в выплатах
let payoutT0 = 0, payoutKey = "", payoutTimers = [];
const stats = { longest: null };  // самый длинный коэффициент среди выигранных (копится на клиенте)
function loadStats() { try { const s = JSON.parse(sessionStorage.getItem("bets-stats-" + CODE) || "null"); if (s) stats.longest = s.longest; } catch (e) {} }
function saveStats() { try { sessionStorage.setItem("bets-stats-" + CODE, JSON.stringify(stats)); } catch (e) {} }

function onState(s) {
  prev = snap; snap = s; recvPerf = performance.now();
  if (!prev || (prev.phase === "done" && s.phase === "lobby")) { loadStats(); }
  if (s.phase === "lobby") { stats.longest = null; saveStats(); streaks.clear(); }
  const newEv = s.ev ? s.idx + ":" + s.ev.type : "";
  const evChanged = newEv !== evKey;
  const phaseChanged = !prev || prev.phase !== s.phase || evChanged || !!prev.intro !== !!s.intro;
  if (evChanged) { evKey = newEv; revealed.clear(); clearPayoutTimers(); landed.clear(); pending.clear(); rowsKey = ""; rowFlapDelay = true; rowNodes.clear(); }
  const first = !prev;
  render(phaseChanged, evChanged, first);
}

function render(phaseChanged, evChanged, first) {
  document.body.classList.toggle("has-lobby", snap.phase === "lobby");
  document.body.classList.toggle("has-final", snap.phase === "done");
  chatHidden = chatHidden || snap.settings.chat === false;
  document.body.classList.toggle("nochat", chatHidden);
  drawTop();
  drawRows(phaseChanged && !first && prev && prev.phase === "bets" && snap.phase === "locked" && !evChanged);
  drawRail();
  drawLobby();
  drawFinal();
  drawCtrl();
  drawGate();
  syncChat();
  if (phaseChanged) onPhase(first, evChanged);
  syncScene(phaseChanged);
}

// ---------- шапка ----------
function drawTop() {
  const ev = snap.ev, lobby = snap.phase === "lobby" || !ev;
  const info = $("evinfo");
  if (lobby) { info.innerHTML = `<span class="evtitle" style="color:var(--dim)">${esc(T("wait_title"))}</span>`; $("minbet").innerHTML = ""; }
  else {
    const total = snap.total ? ` ${T("of")} ${snap.total}` : "";
    const badges = (ev.live ? `<span class="badge live"><i></i>${T("live")}</span><span class="badge est">${T("est")}</span>` : "") + (ev.fallback ? `<span class="badge fb">${T("fallback")}</span>` : "");
    const k = `${ev.type}|${ev.n}|${snap.total}|${ev.live}|${ev.fallback}|${ev.fallbackWhy || ""}|${lang()}`;

  const c = $("confetti"); c.classList.remove("hidden"); c.width = innerWidth; c.height = innerHeight;
  const g = c.getContext("2d"), cols = [color, "#b6ff2e", "#ff2e88", "#ffd34d", "#38d3ff"];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height, vy: 2 + Math.random() * 4, vx: (Math.random() - .5) * 2, w: 6 + Math.random() * 8, h: 3 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now();
  const loop = (t) => {
    g.clearRect(0, 0, c.width, c.height);
    const fade = Math.max(0, Math.min(1, (7000 - (t - t0)) / 1500));
    g.globalAlpha = fade;
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.shadowColor = p.c; g.shadowBlur = 8; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); }
    if (t - t0 < 7000 && snap && snap.phase === "done") confRaf = requestAnimationFrame(loop); else c.classList.add("hidden");
  };
  confRaf = requestAnimationFrame(loop);
}

// ---------- кнопки ведущего ----------
let ctrlKey = "", armedEnd = false, armedT = 0, note = "", noteT = 0;
const HL = window.MP && MP.hostLink ? MP.hostLink({
  hostKeyFn: hostKey, boardPath: "bets-board.html", getRoom: () => CODE,
  sendHost: (t) => send({ type: "host", token: t }),
  onToast: (kind) => setNote(kind === "copied" || kind === "shared" ? T("copied") : ""),
  prompt: (m, v) => window.prompt(T("paste"), v),
}) : null;
function setNote(t) { note = t; clearTimeout(noteT); if (t) noteT = setTimeout(() => { note = ""; drawCtrl(); }, 4000); drawCtrl(); }
function hasToken() { try { return !!localStorage.getItem(hostKey()); } catch (e) { return false; } }
let gateKey = "";
// кнопка ведущего в темпе «по кнопке»: открыть ставки → закрыть ставки → дальше
function drawGate() {
  const box = $("gate"); if (!box || !snap) return;
  const g = snap.gate;
  const subs = snap.players.filter((p) => p.alive && p.submitted).length, alive = snap.players.filter((p) => p.alive).length;
  const key = [g, isHost, lang(), g === "lock" ? subs + "/" + alive : ""].join("|");
  if (key === gateKey) return; gateKey = key;
  box.innerHTML = "";
  if (!g) return;
  if (isHost) {
    const btn = el("button", "gatebtn " + g, T("gate_" + (g === "lock" ? "lock" : g)));
    btn.type = "button";
    btn.onclick = () => { btn.disabled = true; send({ type: g }); };
    box.append(btn);
    if (g === "lock") box.append(el("span", "gatecnt", T("sub_n", { a: subs, b: alive })));
  } else box.append(el("span", "gatecnt", T("gate_wait")));
}
function drawCtrl() {
  if (!snap) return;
  const c = $("ctrl"), sound = c.querySelector(".sound-toggle-btn");
  const inGame = snap.phase !== "lobby" && snap.phase !== "done";
  const key = [isHost, inGame, armedEnd, chatHidden, hostLost, note, lang(), hasToken()].join("|");
  if (key === ctrlKey) return; ctrlKey = key;
  const btns = [];
  if (isHost && HL) { const b = el("button", "cbtn"); b.type = "button"; b.title = T("host_link"); b.append("🔑", el("span", "lt", " " + T("host_link"))); b.onclick = () => HL.copy(); btns.push(b); }
  if (isHost && inGame) {
    const ch = el("button", "cbtn" + (chatHidden ? " on" : ""), chatHidden ? T("show_chat") : T("hide_chat"));
    ch.onclick = () => { chatHidden = !chatHidden; document.body.classList.toggle("nochat", chatHidden); send({ type: "settings", patch: { chat: !chatHidden } }); ctrlKey = ""; drawCtrl(); };
    const e = el("button", "cbtn endbtn" + (armedEnd ? " armed" : ""), armedEnd ? T("sure") : T("end"));
    e.onclick = () => {
      if (!armedEnd) { armedEnd = true; clearTimeout(armedT); armedT = setTimeout(() => { armedEnd = false; drawCtrl(); }, 3000); drawCtrl(); return; }
      armedEnd = false; send({ type: "end" }); drawCtrl();
    };
    btns.push(ch, e);
  }
  if (!isHost && HL && (hostLost || !hasToken())) {
    const b = el("button", "cbtn", T("imhost")); b.onclick = () => { const v = window.prompt(T("paste"), ""); if (v && MP.hostLink.parseToken(v)) HL.take(Date.now(), v); };
    btns.push(b);
  }
  if (note) btns.push(el("span", "note", note));
  c.replaceChildren(...btns, sound);
}

window.addEventListener("langchange", () => { redrawSay(); lobbyKey = ""; finalKey = ""; rowsKey = ""; ctrlKey = ""; $("evinfo").dataset.k = ""; if (snap) render(false, false, false); });
window.addEventListener("resize", () => { redrawSay(); rowsKey = ""; if (snap) { drawRows(false); } });

(async function boot() {
  const h = params.get("h");
  if (h && CODE) { try { localStorage.setItem(hostKey(), h); } catch (e) {} history.replaceState(null, "", "?r=" + CODE); }
  if (!(await ensureRoom())) return;
  connect();
  window.betsBoard = { send, get state() { return snap; }, get code() { return CODE; }, get isHost() { return isHost; }, debug() { return sc && sc.debug ? sc.debug() : null; } };
})();
})();
</script>
