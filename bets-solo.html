<style>
:root {
  --bg: #07090c; --glass: #0d1217; --glass-2: #121a21; --glass-3: #18222b; --line: #1f2b34; --line-2: #2c3b47;
  --text: #eef2ee; --dim: #8a98a0; --lime: #b6ff2e; --magenta: #ff2e88; --amber: #ffd34d; --ink: #06090b;
  --disp: "Big Shoulders Display", "Oswald", "Roboto Condensed", "Arial Narrow", Impact, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --lang-switch-bg: #0d1217; --lang-switch-border: #2c3b47; --lang-switch-fg: #8a98a0;
  --lang-switch-active-bg: #b6ff2e; --lang-switch-active-fg: #06090b; --lang-switch-active-border: transparent;
  --lang-switch-font: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--mono); font-size: 14px; line-height: 1.4; touch-action: manipulation; -webkit-text-size-adjust: 100%;
  background: radial-gradient(110% 40% at 50% -8%, rgba(255, 46, 136, .20), transparent 62%), radial-gradient(70% 30% at 100% 40%, rgba(56, 211, 255, .07), transparent 70%), var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
[hidden] { display: none !important; }
body .lang-switch { top: calc(6px + env(safe-area-inset-top)); }
body .lang-switch button { min-width: 44px !important; min-height: 40px !important; }
body.playing .lang-switch { display: none; }

.homelink { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 40; min-height: 36px; display: inline-flex; align-items: center; padding: 0 12px; border: 1px solid var(--line-2); background: var(--glass-2); color: var(--text); font-size: 14px; font-weight: 800; text-decoration: none; }
body.playing .homelink { display: none; }

/* настройка */
#setup { height: 100%; overflow-y: auto; display: grid; place-items: center; padding: 64px 16px 24px; }
.page { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
.sign { font-family: var(--disp); font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: .14em; text-transform: uppercase; color: #fff; text-align: center;
  text-shadow: 0 0 4px #fff, 0 0 14px var(--magenta), 0 0 30px var(--magenta); }
.eyebrow { text-align: center; font: 800 13px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--amber); }
.lede { text-align: center; color: #c5d0d5; font-size: 14px; }
.card { background: var(--glass); border: 1px solid var(--line-2); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.fld label, .fld .lb { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
.fld input { width: 100%; min-height: 48px; background: var(--glass-2); border: 1px solid var(--line-2); padding: 0 12px; font-size: 17px; outline: none; }
.fld input:focus { border-color: var(--lime); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { min-height: 46px; background: var(--glass-3); border-bottom: 3px solid #000; font-weight: 800; font-size: 13px; letter-spacing: .04em; color: var(--text); padding: 0 4px; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--ink); border-bottom-color: #a8871c; }
.seg small { display: block; font-weight: 600; font-size: 10px; letter-spacing: 0; opacity: .75; margin-top: 1px; }
.hint { font-size: 12px; color: var(--dim); line-height: 1.45; }
.btn { min-height: 56px; width: 100%; background: linear-gradient(#d8ff6a, var(--lime) 50%, #86c60f); color: var(--ink); font: 900 18px var(--disp); letter-spacing: .14em; text-transform: uppercase; border-bottom: 3px solid #6c9e10; box-shadow: 0 0 22px rgba(182, 255, 46, .4), inset 0 1px 0 rgba(255, 255, 255, .6); border-radius: 8px; }
.btn:active { transform: translateY(2px); border-bottom-width: 1px; }
.btn:disabled { opacity: .5; }
.link { display: block; margin: 0 auto; padding: 10px; min-height: 40px; color: var(--dim); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
.err { min-height: 18px; text-align: center; color: var(--magenta); font-size: 12px; }
.best { text-align: center; font-size: 12px; color: var(--amber); letter-spacing: .06em; }
.rules { display: grid; gap: 8px; }
.rules .r { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #c5d0d5; }
.rules .r i { font-style: normal; font-size: 18px; line-height: 1.2; }

/* игра: слева сцена (доска 1280×720, уменьшенная), справа телефон */
#play { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; background: #000; }
#boardbox { position: relative; overflow: hidden; background: #05070a; min-width: 0; }
#boardfit { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; flex: none; }
#boardfit iframe { position: absolute; inset: 0; width: 1280px; height: 720px; border: 0; background: #05070a; }
#phonebox { position: relative; min-height: 0; border-left: 1px solid var(--line-2); background: var(--bg); }
#phonebox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
#x { position: absolute; top: 8px; left: 8px; z-index: 5; width: 36px; height: 36px; display: grid; place-items: center; background: rgba(7, 9, 12, .78); border: 1px solid var(--line-2); font-size: 16px; font-weight: 800; color: var(--dim); }
#x.armed { color: var(--magenta); border-color: var(--magenta); width: auto; padding: 0 12px; font-size: 12px; }
@media (max-width: 880px) {
  #play { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  #boardbox { height: calc(100vw * 9 / 16); max-height: 34vh; }
  #phonebox { border-left: 0; border-top: 1px solid var(--line-2); }
}
@media (max-width: 880px) and (orientation: landscape) {
  #play { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: 1fr; }
  #boardbox { height: auto; max-height: none; }
  #phonebox { border-top: 0; border-left: 1px solid var(--line-2); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

<script src="i18n.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lang = () => (window.I18N && I18N.lang) || "ru";
const T = (k, v) => {
  let s = null;
  try { if (window.I18N && I18N.t) { const x = I18N.t(k); if (typeof x === "string" && x !== k) s = x; } } catch (e) {}
  if (s == null) s = ((window.I18N_DICT.ru || {})[k]) || k;
  return v ? s.replace(/\{(\w+)\}/g, (m, a) => (v[a] != null ? v[a] : m)) : s;
};
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const ROOM_KEY = "bets_solo_room_v1", CFG_KEY = "bets_solo_cfg_v1", BEST_KEY = "bets_solo_best_v1";
const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

let cfg = { events: 12, mode: "mixed", name: "" };
try { Object.assign(cfg, JSON.parse(ls.get(CFG_KEY) || "{}")); } catch (e) {}
if (!cfg.name) cfg.name = ls.get("bets-name") || "";
if (![8, 12, 16, 0].includes(cfg.events)) cfg.events = 12;
if (!["mixed", "real", "scenic"].includes(cfg.mode)) cfg.mode = "mixed";

let screen = "", busy = false, err = "";

function bestStack() { try { const b = JSON.parse(ls.get(BEST_KEY) || "null"); return b && b.stack > 0 ? b.stack : 0; } catch (e) { return 0; } }

function renderSetup() {
  screen = "setup";
  document.body.classList.remove("playing");
  $("play").hidden = true; $("setup").hidden = false;
  $("play").querySelector("#boardfit").replaceChildren(); $("phonebox").replaceChildren();
  const seg = (field, items) => `<div class="seg" role="group">${items.map(([v, t, sub]) => `<button type="button" data-f="${field}" data-v="${v}" aria-pressed="${cfg[field] === v}">${esc(t)}${sub ? `<small>${esc(sub)}</small>` : ""}</button>`).join("")}</div>`;
  const best = bestStack();
  $("setup").innerHTML = `<form class="page" id="sf" autocomplete="off">
    <div class="sign">${esc(T("bs_sign"))}</div>
    <div class="eyebrow">${esc(T("bs_eyebrow"))}</div>
    <p class="lede">${esc(T("bs_lede"))}</p>
    <div class="rules"><div class="r"><i>🎟️</i><span>${esc(T("bs_r1"))}</span></div><div class="r"><i>🧮</i><span>${esc(T("bs_r2"))}</span></div><div class="r"><i>🏆</i><span>${esc(T("bs_r3"))}</span></div></div>
    <div class="card">
      <div class="fld"><label for="nm">${esc(T("bs_name"))}</label><input id="nm" maxlength="20" placeholder="${esc(T("bs_name_ph"))}" value="${esc(cfg.name)}" enterkeyhint="go" autocomplete="off"></div>
      <div class="fld"><span class="lb">${esc(T("bs_len"))}</span>${seg("events", [[8, T("bs_len8"), T("bs_len8s")], [12, T("bs_len12"), T("bs_len12s")], [16, T("bs_len16"), T("bs_len16s")], [0, "∞", T("bs_len0s")]])}</div>
      <div class="fld"><span class="lb">${esc(T("bs_mode"))}</span>${seg("mode", [["mixed", T("bs_mixed")], ["real", T("bs_real")], ["scenic", T("bs_scenic")]])}<p class="hint" id="mh" style="margin-top:8px">${esc(T("bs_hint_" + cfg.mode))}</p></div>
    </div>
    ${best ? `<div class="best">${esc(T("bs_best", { n: fmt(best) }))}</div>` : ""}
    <div class="err" id="err">${esc(err)}</div>
    <button class="btn" type="submit" id="go"${busy ? " disabled" : ""}>${esc(busy ? T("bs_wait") : T("bs_go"))}</button></form>`;
  $("sf").onsubmit = (e) => { e.preventDefault(); startGame(); };
  $("sf").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    const f = b.dataset.f, v = f === "mode" ? b.dataset.v : Number(b.dataset.v);
    cfg[f] = v; cfg.name = $("nm").value; save();
    $("sf").querySelectorAll(`[data-f="${f}"]`).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    $("mh").textContent = T("bs_hint_" + cfg.mode);
  });
}
function save() { ls.set(CFG_KEY, JSON.stringify(cfg)); }

async function startGame() {
  if (busy) return;
  const name = $("nm").value.trim().slice(0, 20);
  if (!name) { err = T("bs_err_name"); $("err").textContent = err; $("nm").focus(); return; }
  err = ""; cfg.name = name; save(); ls.set("bets-name", name);
  busy = true; $("go").disabled = true; $("go").textContent = T("bs_wait");
  try {
    const settings = { events: cfg.events, mode: cfg.mode, chat: false };
    const res = await fetch("/bets/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ solo: true, settings }) });
    const data = await res.json();
    if (!res.ok || !data.code) throw new Error(data.error || "error");
    ls.set("bets-host-" + data.code, data.hostToken);
    ls.set(ROOM_KEY, JSON.stringify({ code: data.code, name, at: Date.now() }));
    busy = false;
    enterPlay(data.code, name);
  } catch (e) {
    busy = false; err = T("bs_err"); renderSetup();
  }
}

// ---- игра: две рамки на одной комнате ----
function fitBoard() {
  const box = $("boardbox"), fit = $("boardfit");
  if (!box || $("play").hidden) return;
  const w = box.clientWidth, h = box.clientHeight;
  const k = Math.min(w / 1280, h / 720);
  const ox = (w - 1280 * k) / 2, oy = (h - 720 * k) / 2;
  fit.style.transform = `translate(${ox}px, ${oy}px) scale(${k})`;
}
function enterPlay(code, name) {
  screen = "play";
  document.body.classList.add("playing");
  $("setup").hidden = true; $("play").hidden = false;
  const q = "r=" + encodeURIComponent(code) + "&solo=1";
  $("boardfit").innerHTML = `<iframe title="board" src="bets-board.html?${q}" allow="autoplay"></iframe>`;
  $("phonebox").innerHTML = `<iframe title="phone" src="bets.html?${q}&name=${encodeURIComponent(name)}" allow="autoplay"></iframe>`;
  fitBoard();
}
let xT = 0;
$("x").onclick = () => {
  const x = $("x");
  if (!x.classList.contains("armed")) {
    x.classList.add("armed"); x.textContent = T("bs_exit"); clearTimeout(xT);
    xT = setTimeout(() => { x.classList.remove("armed"); x.textContent = "✕"; }, 3000);
    return;
  }
  x.classList.remove("armed"); x.textContent = "✕";
  exitGame();
};
function exitGame() { ls.del(ROOM_KEY); err = ""; renderSetup(); }
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data || typeof e.data !== "object") return;
  if (e.data.bets === "solo-exit") exitGame();
});
window.addEventListener("resize", fitBoard);
window.addEventListener("langchange", () => { if (screen === "setup") { cfg.name = ($("nm") && $("nm").value) || cfg.name; renderSetup(); } });

// комната могла закрыться, пока вкладка была закрыта: проверяем сокетом, прежде чем возвращать в партию
function probeRoom(code) {
  return new Promise((resolve) => {
    let done = false;
    const fin = (ok) => { if (done) return; done = true; try { ws.close(); } catch (e) {} resolve(ok); };
    let ws;
    try { ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/bets/ws?r=${encodeURIComponent(code)}`); } catch (e) { return resolve(false); }
    ws.onopen = () => fin(true);
    ws.onerror = () => fin(false);
    ws.onclose = () => fin(false);
    setTimeout(() => fin(false), 4000);
  });
}
(async function init() {
  let saved = null;
  try { saved = JSON.parse(ls.get(ROOM_KEY) || "null"); } catch (e) {}
  if (saved && /^[A-Z2-9]{4,12}$/.test(saved.code || "") && Date.now() - (saved.at || 0) < 6 * 3600 * 1000 && await probeRoom(saved.code)) return enterPlay(saved.code, saved.name || cfg.name || "Игрок");
  ls.del(ROOM_KEY);
  renderSetup();
})();
</script>
