    // иначе летящий жетон проезжает под ней; у правого края дорожки — слева от них
    f.style.top = "calc(50% - .65em)";
    road.append(f);
    const rw = road.clientWidth, tk = tok.offsetWidth || 40;
    const right = Math.max(fromX, toX) / 100 * rw + tk / 2 + 10;
    const leftSide = Math.min(fromX, toX) / 100 * rw - tk / 2 - 10 - f.offsetWidth;
    f.style.left = (right + f.offsetWidth > rw + 24 && leftSide > 0 ? leftSide : right) + "px";
    f.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-40px)", opacity: 0 }], { duration: 1600, delay: knock ? 700 : 200, easing: "ease-out", fill: "both" }).onfinish = () => f.remove();
  }
}
function dust(road, x) {
  if (!road || !road.isConnected) return;
  for (let i = 0; i < 7; i++) {
    const d = el("div", "dust");
    d.style.left = x + "%";
    d.style.top = "60%";
    road.append(d);
    const a = Math.PI * (0.9 + Math.random() * 1.2);
    const r = 20 + Math.random() * 30;
    d.animate([{ transform: "translate(0,0) scale(1)", opacity: 0.9 }, { transform: `translate(${Math.cos(a) * r}px, ${Math.sin(a) * r * 0.5 - 6}px) scale(1.8)`, opacity: 0 }], { duration: 600 + Math.random() * 300, easing: "ease-out", fill: "both" }).onfinish = () => d.remove();
  }
}

// ---------- кадр: часы, шкала, пошаговые экраны ----------
let lastTick = null, lastSlow = 0;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead) return;
  syncTrack();
  const tn = performance.now();
  if (tn - lastSlow > 90) {
    lastSlow = tn;
    if (state.phase === "verdict") drawVerdict();
    if (state.phase === "freveal") drawFreveal();
  }
  if (state.phase === "cell" || state.phase === "fcell") drawCell();
  if (!state.phaseEnd || state.paused) return;
  const now = lqNow();
  const ph = state.phase;
  const end = state.cellEnd || state.phaseEnd;
  const left = end - now;
  const total = Math.max(1, end - state.phaseStart);
  const hot = left < 5000 && ["answer", "fanswer", "cell", "fcell", "stake"].includes(ph);
  const clock = $("clock");
  const shows = ["read", "answer", "fread", "fanswer", "cell", "fcell", "stake"].includes(ph);
  if (clock) {
    const c = shows ? String(Math.max(0, Math.ceil(left / 1000))) : "";
    if (clock.textContent !== c) clock.textContent = c;
    clock.classList.toggle("hot", hot);
  }
  const tl = $("timeline");
  if (tl) { tl.firstChild.style.transform = `scaleX(${shows ? Math.max(0, Math.min(1, left / total)) : 0})`; tl.classList.toggle("hot", hot); }
  const ri = $("readin");
  if (ri) { const r = tpl("read_in", { s: Math.max(1, Math.ceil(left / 1000)) }); if (ri.textContent !== r) ri.textContent = r; }
  if (hot && left > 0) {
    const s = Math.ceil(left / 1000);
    if (s !== lastTick) { lastTick = s; lqSfx.tick(true); }
  }
}

// ---------- отрисовка ----------
function render() {
  if (!state || dead) return;
  document.body.dataset.phase = state.phase;
  $("brand").innerHTML = escapeHtml(T("game_name")).replace(/(\S+)$/, "<em>$1</em>");
  $("codechip").innerHTML = `<b>${escapeHtml(CODE)}</b>`;
  const inGame = !["lobby", "finished"].includes(state.phase);
  $("codechip").classList.toggle("hidden", !inGame);
  $("endbtn").classList.toggle("hidden", !(isHost && inGame));
  // «Дальше» — пока можно закрыть фазу как «время вышло»: ответ, раскрытие, ставка финала (U-12)
  const canSkip = isHost && ["answer", "fanswer", "reveal", "stake"].includes(state.phase);
  $("skipbtn").classList.toggle("hidden", !canSkip);
  if (!canSkip || !isHost) hostTap.disarm();
  syncHostBtns();
  drawHostbar();
  showBanner(state.paused ? T("paused") : null);
  switch (state.phase) {
    case "lobby": drawLobby(); break;
    case "intro": drawIntro(); break;
    case "read": case "answer": case "reveal": case "fread": case "fanswer": case "fshow": drawQuestion(); break;
    case "cell": case "fcell": drawCell(); break;
    case "verdict": drawVerdict(); break;
    case "stake": drawStake(); break;
    case "freveal": drawFreveal(); break;
    case "finished": drawFinal(); syncFinalToggles(); break;
  }
  syncTrack();
  syncLaneKicks();
  markPlaces(state.phase === "finished" ? ranked() : null);
}
$("endbtn").onclick = () => { if (hostTap.tap("end")) conn.send({ type: "end" }); };
$("skipbtn").onclick = () => { if (hostTap.tap("skip")) conn.send({ type: "skip" }); };

// шрифты (Geologica, JetBrains Mono) приходят после первой отрисовки, а подгонка кегля мерила запасным: перерисовываем
if (document.fonts && document.fonts.addEventListener) {
  let fontsT = 0;
  document.fonts.addEventListener("loadingdone", () => { clearTimeout(fontsT); fontsT = setTimeout(() => { viewKey = ""; if (trk) trk.ids = []; if (state) render(); }, 120); });
}
window.addEventListener("resize", () => { fitScreen(); viewKey = ""; if (trk) trk.ids = []; if (state) render(); });
window.addEventListener("langchange", () => {
  viewKey = "";
  if (trk) trk.ids = [];
  // язык доски — язык вопросов комнаты: в лобби ведущий переключает и вопросы
  if (isHost && state && (state.phase === "lobby" || state.phase === "finished") && state.settings.lang !== lqLang()) conn.send({ type: "settings", settings: { lang: lqLang() } });
  render();
});

// реакции: эмодзи взлетает снизу с именем
function floatReact(playerId, emoji) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const p = player(playerId);
  const f = el("div", "floater");
  f.style.left = `calc(${(8 + Math.random() * 84).toFixed(1)} * var(--vw))`;
  f.append(el("span", null, emoji), el("small", null, p ? p.name : ""));
  document.body.append(f);
  setTimeout(() => f.remove(), 2700);
}

// ---------- связь ----------
let prevPhase = null;
function onEvent(e) {
  switch (e.type) {
    case "react": return floatReact(e.playerId, e.emoji);
    case "answered": return lqSfx.tap();
    case "reveal": return e.clean ? lqSfx.fanfare() : lqSfx.gong();
    case "group": return lqSfx.pop();
    case "cellWrong": return lqSfx.clang();
    case "cellOk": return lqSfx.ok();
    case "escaped": return lqSfx.escape();
  }
}
function onMessage(m) {
  switch (m.type) {
    case "hello":
      if (window.MP && MP.applyHello) MP.applyHello(m);
      if (gone$) gone$.hello();
      state = m.state;
      // управление ушло на другой экран — сами не отбираем (иначе после обрыва связи два окна дерутся молча): только «Забрать»
      if (!isHost && !hostLost) {
        let token = null;
        try { token = localStorage.getItem(hostKey()); } catch (e) {}
        if (token) conn.send({ type: "host", token });
      }
      render();
      break;
    case "state":
      state = m.state;
      if (state.phase !== prevPhase) { prevPhase = state.phase; if (state.phase === "fshow") lqSfx.gong(); }
      render();
      break;
    case "host_ok":
      isHost = true;
      hostLost = false;
      pasteOpen = false;
      document.body.classList.add("host");
      viewKey = "";
      lqWake.on();
      // язык доски главнее: комнату создали на одном языке, а доску переключили — синхронизируем
      if (state && state.phase === "lobby" && state.settings.lang !== lqLang()) conn.send({ type: "settings", settings: { lang: lqLang() } });
      render();
      break;
    case "host_lost":
      isHost = false;
      hostLost = true;
      document.body.classList.remove("host");
      viewKey = "";
      render();
      break;
    case "event":
      onEvent(m.event);
      break;
    case "rejected":
      if (m.action === "start") { const k = "rj_start_" + m.reason; showBanner(T(k) !== k ? T(k) : m.reason); setTimeout(() => showBanner(null), 4000); }
      break;
    case "error":
      if (m.error === "room_expired") gone();
      if (m.error === "bad host token") {
        // токен из ссылки не подошёл (комната другая или ключ старый): забываем и просим вставить правильную ссылку
        hostLost = false;
        try { localStorage.removeItem(hostKey()); } catch (e) {}
        pasteOpen = true;
        setHostNote(T("host_bad"));
      }
      break;
  }
}

// ---------- ссылка ведущего (T-W2-33, U-03 вариант A) ----------
let hostNote = "", hostNoteT = 0, pasteOpen = false, hostLost = false, hostBarKey = "";
const HL = window.MP && MP.hostLink ? MP.hostLink({
  hostKeyFn: hostKey,
  boardPath: "lastq-board.html",
  getRoom: () => CODE,
  sendHost: (t) => { if (conn) conn.send({ type: "host", token: t }); },
  onToast: (kind) => {
    if (kind === "copied") setHostNote(T("link_copied"));
    else if (kind === "shared") setHostNote(T("link_shared"));
    else if (kind === "none") setHostNote(T("link_none"));
  },
  prompt: (m, v) => window.prompt(T("link_prompt_hint"), v),
}) : null;
function setHostNote(text) {
  hostNote = text;
  clearTimeout(hostNoteT);
  if (text) hostNoteT = setTimeout(() => { hostNote = ""; drawHostbar(); }, 5000);
  drawHostbar();
}
function hasHostToken() {
  try { return !!localStorage.getItem(hostKey()); } catch (e) { return false; }
}
function drawHostbar() {
  const bar = $("hostbar");
  if (!bar) return;
  if (dead || !state || !HL) { bar.textContent = ""; hostBarKey = ""; return; }
  const claim = !isHost && (hostLost || !hasHostToken());
  const key = [isHost, hostLost, claim, pasteOpen, hostNote, lqLang()].join("|");
  if (key === hostBarKey) return;
  hostBarKey = key;
  bar.textContent = "";
  if (isHost) {
    const lb = el("button", "linkbtn");
    lb.type = "button";
    lb.title = T("host_link");
    lb.setAttribute("aria-label", T("host_link"));
    lb.append("🔑", el("span", "lt", " " + T("host_link")));
    lb.onclick = () => { HL.copy(); };
    bar.append(lb);
  } else if (claim && hostLost && hasHostToken()) {
    const note = el("span", "note warn", T("host_lost_msg"));
    const tk = el("button", "linkbtn", T("btn_take"));
    tk.type = "button";
    tk.onclick = () => { HL.take(); };
    bar.append(note, tk);
  } else if (claim) {
    if (pasteOpen) {
      const inp = el("input");
      inp.type = "text";
      inp.placeholder = T("host_paste_ph");
      inp.autocomplete = "off";
      inp.setAttribute("aria-label", T("host_paste_ph"));
      const ok = el("button", "linkbtn", T("btn_ok"));
      ok.type = "button";
      const submit = () => {
        if (!MP.hostLink.parseToken(inp.value)) { setHostNote(T("host_bad")); return; }
        hostLost = false;
        HL.take(Date.now(), inp.value);
        pasteOpen = false;
      };
      ok.onclick = submit;
      inp.onkeydown = (e) => { if (e.key === "Enter") submit(); };
      bar.append(inp, ok);
      setTimeout(() => inp.focus(), 0);
    } else {
      const im = el("button", "linkbtn", T("btn_im_host"));
      im.type = "button";
      im.onclick = () => { pasteOpen = true; hostBarKey = ""; drawHostbar(); };
      bar.append(el("span", "note", T("viewer_screen")), im);
    }
  }
  if (hostNote) bar.append(el("span", "note", hostNote));
}

// Комнаты нет (404 до первого hello) и «закрылась» (после) — разные экраны. Серверного различителя нет (К-11).
const gone$ = window.MP && MP.roomGone ? MP.roomGone({ showForm: noRoom, onClosed: closed }) : null;
function gone() {
  if (gone$) gone$.gone(); else closed();
}
function closed() {
  dead = true;
  stage.innerHTML = "";
  track.classList.add("off");
  $("hostbar").textContent = "";
  showBanner(T("expired"));
}
function noRoom() {
  dead = true;
  stage.innerHTML = "";
  track.classList.add("off");
  $("hostbar").textContent = "";
  stage.innerHTML = `<div class="gonebox"><h2>${escapeHtml(T("noroom_title"))}</h2><p>${escapeHtml(T("noroom_text"))}</p>
    <form id="goneform" autocomplete="off"><input id="gonecode" maxlength="24" placeholder="${escapeHtml(T("code_ph"))}" aria-label="${escapeHtml(T("code_ph"))}" value="${escapeHtml(CODE)}"><button type="submit">${escapeHtml(T("btn_go"))}</button></form></div>`;
  $("goneform").onsubmit = (e) => {
    e.preventDefault();
    const c = MP.roomGone.normalize($("gonecode").value);
    if (c) location.href = `lastq-board.html?r=${encodeURIComponent(c)}`;
  };
}

async function boot() {
  // ?h=токен — ссылка ведущего на другое устройство: токен кладём в хранилище и убираем из адреса
  const h = params.get("h");
  if (h && CODE) {
    try { localStorage.setItem(hostKey(), h); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
  }
  if (!(await ensureRoom())) return;
  const banner = $("conn");
  let netLost = false, netQuiet = false;
  const showNet = () => {
    banner.textContent = T(netLost ? "err_connect" : "conn_lost");
    banner.classList.toggle("on", netLost || netQuiet);
  };
  window.addEventListener("langchange", showNet);
  conn = lqConnect({
    code: CODE,
    onMessage,
    onGone: gone,
    onOpen: () => { isHost = false; },
    // «lost» — сокет закрыт, переподключаемся; «quiet» — сокет жив, но молчит дольше 10 с (MP.conn): только предупреждение
    onState: (st) => { netLost = st === "lost"; if (st === "open") netQuiet = false; showNet(); },
    onQuiet: (q) => { netQuiet = !!q; showNet(); },
  });
  requestAnimationFrame(frame);
  // ручка для отладки и стенда: те же сообщения, что шлют кнопки доски
  window.lqBoard = { send: (m) => conn.send(m), get state() { return state; }, get code() { return CODE; } };
}
boot();
</script>
