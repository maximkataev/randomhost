<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2753.svg" type="image/svg+xml">
<title>Последний вопрос — общий экран</title>
<!-- доска ведущего с кодом комнаты: в поиске ей делать нечего -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="lastq-challenges.css">
<style>
  /* Мир «Последнего вопроса» (дизайн 05.10, DESIGNER-SKILL.md): ночной стадион. Квиз — забег по дорожкам.
     Лицо игры — шкала очков: тартановые дорожки с белыми линиями, ноль — стартовая линия, всё, что ниже нуля, —
     песчаная яма (как у прыжков в длину): отлетевший падает в песок и сидит в нём по пояс.
     Ближайший сосед — «Бомба» (те же испытания): у неё светлая бумага, комикс, сдвинутые тени, узкий курсив.
     Здесь — тёмная сцена, плоская краска без обводок-теней, Geologica + моноширинное табло JetBrains Mono.
     Читается с другого конца комнаты: крупный кегль, контраст ≥ 7:1 у основного текста. */
  :root {
    --night: #0b120e;      /* фон: ночь над стадионом */
    --infield: #13221a;    /* газон внутри овала — панели */
    --infield-2: #1c3125;
    --edge: #2f4a3b;       /* кромки панелей */
    --chalk: #f2eee3;      /* разметка и основной текст */
    --chalk-2: #b4beb5;
    --track: #b2432a;      /* тартан */
    --track-2: #a23c25;
    --sand: #dcbd80;       /* яма */
    --sand-ink: #5d4317;
    --ok: #52d07a;
    --bad: #ff6b4f;
    --gold: #f0c75e;
    --c0: #ffcf3f; --c1: #4aa9ff; --c2: #ff8a66; --c3: #62d6c4; /* буквы A–D, те же на телефоне */
    --lang-switch-bg: var(--night);
    --lang-switch-border: var(--edge);
    --lang-switch-fg: var(--chalk-2);
    --lang-switch-active-bg: var(--chalk);
    --lang-switch-active-fg: var(--night);
    --lang-switch-active-border: var(--chalk);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  /* большой экран (ТВ 4K): fitScreen() увеличивает доску целиком (zoom), высота делится на тот же множитель;
     единицы окна под zoom на масштаб не делятся сами — делим вручную через --vh/--vw */
  :root { --vh: 1vh; --vw: 1vw; }
  body.scaled { --vh: calc(1vh / var(--z)); --vw: calc(1vw / var(--z)); zoom: var(--z); height: calc(100vh / var(--z)); height: calc(100dvh / var(--z)); }
  body { background: var(--night); color: var(--chalk); font: 600 20px/1.25 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .hidden { display: none !important; }
  .mono, .clock, .chip, .bigcode { font-family: var(--mono); }

  /* шапка — полоса табло над стадионом */
  .top { flex: none; display: flex; align-items: center; gap: 14px; height: calc(var(--lsc, 32px) * 2); padding: 0 var(--lsw, 160px) 0 22px; background: #060a08; border-bottom: 4px solid var(--track); }
  .top h1 { margin: 0; font: 900 28px/1 var(--font); text-transform: uppercase; letter-spacing: -.01em; white-space: nowrap; }
  .top h1 em { font-style: normal; background: var(--chalk); color: var(--night); padding: 1px 8px 3px; margin-left: 2px; }
  .chip { font: 800 22px/1 var(--mono); padding: 0 6px; white-space: nowrap; color: var(--chalk); }
  .chip b { color: var(--gold); letter-spacing: .08em; }
  .top .grow { flex: 1; }
  .sound-toggle-btn { flex: none; width: calc(var(--lsh, 44px) * 1.25); height: var(--lsh, 44px); border: 2px solid var(--edge); background: var(--infield); color: var(--chalk); font-size: 17px; display: grid; place-items: center; padding: 0; }
  /* «🔑 Ссылка ведущего», «Я ведущий», «Забрать»: в шапке, кнопки ≥ 44 px; токен на экран не рисуется */
  .hostbar { flex: none; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hostbar:empty { display: none; }
  .hostbar button { min-height: 44px; min-width: 44px; border: 2px solid var(--edge); background: var(--infield); color: var(--chalk); font: 800 16px/1 var(--font); padding: 6px 12px; white-space: nowrap; }
  .hostbar input { min-height: 44px; width: 220px; min-width: 0; border: 2px solid var(--edge); background: var(--night); color: var(--chalk); font: 600 16px/1 var(--font); padding: 6px 8px; border-radius: 0; }
  .hostbar .note { font: 700 15px/1.1 var(--font); color: var(--chalk-2); max-width: 300px; }
  .hostbar .note.warn { color: var(--gold); }
  .gonebox { margin: auto; max-width: 560px; padding: 24px; text-align: center; display: grid; gap: 12px; }
  .gonebox h2 { margin: 0; font: 900 40px/1.05 var(--font); }
  .gonebox p { margin: 0; color: var(--chalk-2); font-size: 22px; }
  .gonebox form { display: grid; gap: 10px; justify-items: center; }
  .gonebox input { width: min(420px, 100%); min-height: 52px; border: 3px solid var(--edge); background: var(--night); color: var(--chalk); font: 800 30px/1 var(--font); text-transform: uppercase; text-align: center; border-radius: 0; }
  .gonebox button { min-height: 52px; padding: 8px 28px; border: 0; background: var(--track); color: #fff; font: 900 22px/1 var(--font); text-transform: uppercase; }
  @media (max-width: 760px) { .hostbar .lt, .hostbar .note { display: none; } }
  /* ТВ 1024: шапка шире экрана, кнопка звука уезжала за край (T-W3-32) */
  @media (max-width: 1100px) { .hostbar .lt { display: none; } }
  .endbtn { flex: none; min-height: 44px; border: 0; background: transparent; padding: 8px 6px; font: 700 18px/1 var(--font); color: var(--chalk-2); text-decoration: underline; text-underline-offset: 4px; }
  .endbtn.skipbtn { border: 2px solid var(--chalk-2); padding: 8px 14px; text-decoration: none; color: var(--chalk); }
  .endbtn[data-armed], .seat .x[data-armed], .lname .x[data-armed] { background: var(--bad); border-color: var(--bad); color: var(--night); text-decoration: none; }
  .banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 50; background: var(--bad); color: var(--night); padding: 8px 14px; font-weight: 800; }
  .conn { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 50; background: var(--bad); color: var(--night); padding: 6px 12px; font-weight: 800; visibility: hidden; }
  .conn.on { visibility: visible; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 22px 16px; gap: 14px; }
  #stage { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 14px; }
  .box { background: var(--infield); border: 2px solid var(--edge); }
  .kicker { font: 700 18px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }

  /* ---------- лобби: стартовый лист слева (правило владельца), подключение справа ---------- */
  .lobby { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(380px, 1fr); gap: 22px; }
  .panel { padding: 20px; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
  .panel h2 { margin: 0; font: 900 30px/1 var(--font); text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid var(--chalk); padding-bottom: 10px; }
  .panel h2 span { color: var(--chalk-2); font: 700 20px/1 var(--mono); text-transform: none; }
  /* места — дорожки 1…10: номер краской, занятая дорожка — тартан */
  .seats { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, minmax(0, 1fr)); grid-auto-flow: column; gap: 8px 12px; flex: 1; min-height: 0; counter-reset: lane; }
  .seat { position: relative; display: flex; align-items: center; gap: 12px; padding: 6px 14px 6px 0; background: var(--track); border-top: 3px solid var(--chalk); border-bottom: 3px solid var(--chalk); min-width: 0; }
  .seat::before { counter-increment: lane; content: counter(lane); flex: none; align-self: stretch; display: grid; place-items: center; width: 1.9em; background: var(--pc, transparent); color: var(--night); font: 800 clamp(20px, calc(3 * var(--vh)), 30px)/1 var(--mono); }
  .seat .emo { font-size: clamp(28px, calc(4 * var(--vh)), 44px); }
  .seat b { font: 800 clamp(20px, calc(2.8 * var(--vh)), 30px)/1.05 var(--font); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; color: #fff; }
  .seat .nm2 { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .seat .nm2 b { flex: none; }
  .seat .off { color: var(--chalk); font: 700 15px/1 var(--mono); opacity: .8; }
  .seat .x { position: absolute; right: 0; top: 0; bottom: 0; min-width: 44px; background: rgba(0, 0, 0, .25); border: 0; color: var(--chalk); padding: 0 10px; font: 800 20px/1 var(--font); visibility: hidden; }
  .host .seat .x { visibility: visible; }
  .host .seat:not(.empty) { padding-right: 50px; }
  /* пустое лобби: вместо пустой левой половины — приглашение (lastq-027) */
  .seatsempty { grid-column: 1 / -1; grid-row: 1 / -1; align-self: center; text-align: center; display: grid; gap: 12px; padding: 0 12px; }
  .seatsempty b { font: 900 clamp(30px, calc(4.4 * var(--vh)), 48px)/1.05 var(--font); text-transform: uppercase; }
  .seatsempty span { font: 600 clamp(20px, calc(2.6 * var(--vh)), 28px)/1.25 var(--font); color: var(--chalk-2); overflow-wrap: anywhere; }
  /* узкая доска (1024): имя на месте не помещалось — уплотняем рамку места, имя целиком важнее */
  @media (min-width: 701px) and (max-width: 1100px) {
    .lobby { grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); }
    .seat { gap: 8px; padding-right: 8px; }
    .seat::before { width: 1.45em; }
    .seat .emo { font-size: 30px; }
    .host .seat:not(.empty) { padding-right: 40px; }
    .seat .x { min-width: 36px; padding: 0 6px; }
  }
  .seat.empty { background: transparent; border-top-color: var(--edge); border-bottom-color: var(--edge); color: var(--chalk-2); font: 600 18px/1 var(--font); }
  .seat.empty::before { background: transparent; color: var(--edge); }
  .seat.empty.next { border-color: var(--chalk-2); }
  .seat.empty.next::before { color: var(--chalk-2); }
  .emo { font-style: normal; line-height: 1; }
  .join { display: flex; gap: 22px; align-items: center; }
  /* узкое окно: QR над кодом — код комнаты в узкой колонке рядом с QR обрезался */
  @media (max-width: 1199px) {
    .join { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; align-items: start; }
    .join > div:last-child { display: contents; }
    .bigcode { grid-column: 1 / -1; grid-row: 1; }
    #qr { grid-row: 2 / span 2; width: clamp(120px, calc(20 * var(--vh)), 180px); height: clamp(120px, calc(20 * var(--vh)), 180px); }
    .url { grid-column: 2; grid-row: 2; margin-top: 0; }
    .scan { grid-column: 2; grid-row: 3; margin-top: 0; }
  }
  /* QR крупный и на белом: его сканируют с дивана, метров с трёх */
  #qr { flex: none; width: clamp(150px, calc(27 * var(--vh)), 250px); height: clamp(150px, calc(27 * var(--vh)), 250px); background: #fff; padding: 10px; }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  .bigcode { font: 800 var(--code-fs, 64px)/1 var(--mono); letter-spacing: .06em; white-space: nowrap; overflow: hidden; color: var(--gold); }
  .url { color: var(--chalk-2); font: 500 17px/1.3 var(--mono); overflow-wrap: anywhere; margin-top: 6px; }
  .scan { font-size: 20px; margin-top: 8px; }
  .toggles { display: grid; gap: 10px; }
  .tog { display: flex; align-items: center; gap: 14px; text-align: left; background: transparent; border: 2px solid var(--edge); padding: 10px 14px; }
  .tog .bx { flex: none; width: 34px; height: 34px; border: 3px solid var(--chalk); display: grid; place-items: center; font: 900 24px/1 var(--font); color: var(--night); }
  .tog.on .bx { background: var(--ok); border-color: var(--ok); }
  .tog b { display: block; font: 800 24px/1.1 var(--font); }
  .tog span { color: var(--chalk-2); font-size: 17px; font-weight: 500; }
  .startbox { margin-top: auto; display: grid; gap: 8px; }
  /* пример шкалы в лобби: пока ждём, все видят, куда отлетают (подписан как пример) */
  .demo { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; container-type: size; }
  .demo .mt { position: relative; flex: 1; min-height: 0; max-height: 170px; background: var(--track); }
  .demo .pit { position: absolute; left: 0; top: 0; bottom: 0; width: 28%; background: var(--sand) radial-gradient(circle, rgba(93, 67, 23, .22) 1.4px, transparent 2px) 0 0 / 11px 11px; box-shadow: inset -8px 0 0 #fff; }
  .demo .pit span { position: absolute; left: 10px; top: 8px; font: 900 18px/1 var(--font); letter-spacing: .25em; text-transform: uppercase; color: var(--sand-ink); }
  .demo .ln { position: absolute; left: 0; right: 0; border-top: 3px solid rgba(242, 238, 227, .9); }
  .demo .t { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--chalk); border: 4px solid var(--pc); display: grid; place-items: center; font-size: 24px; font-style: normal; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
  .demo .t.sunk { box-shadow: none; }
  .demo .t.sunk::after { content: ""; position: absolute; left: -10px; right: -10px; bottom: -8px; height: 52%; background: var(--sand); border-radius: 50% 50% 6px 6px / 70% 70% 6px 6px; }
  .demo .fly { position: absolute; font: 800 18px/1 var(--mono); color: var(--sand-ink); }
  @container (max-height: 90px) { .demo > * { visibility: hidden; } }
  /* «Старт» — клавиша стартёра: тартан, нижняя кромка, нажатие уходит вниз */
  .start { width: 100%; border: 0; background: var(--track); color: #fff; font: 900 40px/1 var(--font); text-transform: uppercase; letter-spacing: .02em; padding: 20px; box-shadow: 0 7px 0 #5e2214, inset 0 0 0 3px var(--chalk); }
  .start:not(:disabled):active { transform: translateY(5px); box-shadow: 0 2px 0 #5e2214, inset 0 0 0 3px var(--chalk); }
  .fine { color: var(--chalk-2); font-size: 19px; font-weight: 500; }
  /* ТВ от 1600 px: подписи лобби читаются из угла комнаты — ≥ 24 px, ссылка 28, QR до 320 */
  @media (min-width: 1600px) {
    .tog b { font-size: 28px; }
    .tog span span, .fine { font-size: 24px; }
    .url { font-size: 28px; }
    .scan { font-size: 26px; }
    .seat .off { font-size: 20px; }
    #qr { width: clamp(220px, calc(30 * var(--vh)), 320px); height: clamp(220px, calc(30 * var(--vh)), 320px); }
    .panel h2 span { font-size: 24px; }
  }
  /* на мелких ТВ и ноутбуках подписи лобби — не мельче 20 px */
  @media (min-width: 1200px) and (max-width: 1599px) { .tog span span { font-size: 20px; } .seat .off { font-size: 17px; } }

  /* ---------- заставка акта: название и полоса тартана «прокрашивается» слева направо ---------- */
  .intro { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; }
  .intro .kicker { font-size: 26px; }
  .intro h2 { margin: 0; font: 900 clamp(70px, calc(13 * var(--vh)), 150px)/.95 var(--font); text-transform: uppercase; letter-spacing: -.02em; }
  .intro h2::after { content: ""; display: block; height: 16px; margin: 22px auto 0; width: 70%; background: var(--track); border-top: 3px solid var(--chalk); border-bottom: 3px solid var(--chalk); transform-origin: 0 50%; }
  .intro .desc { font: 600 30px/1.25 var(--font); max-width: 1100px; color: var(--chalk-2); }
  .intro .pts { font: 800 26px/1 var(--mono); color: var(--gold); }
  @media (prefers-reduced-motion: no-preference) {
    .intro h2 { animation: slam .55s cubic-bezier(.2, .9, .3, 1.15) both; }
    .intro h2::after { animation: paint .7s .25s cubic-bezier(.6, 0, .2, 1) both; }
  }
  @keyframes slam { from { transform: translateY(-30px) scale(1.25); opacity: 0; } }
  @keyframes paint { from { transform: scaleX(0); } }

  /* ---------- вопрос ---------- */
  .qbar { flex: none; display: flex; align-items: center; gap: 18px; height: 56px; }
  .qbar .what { font: 700 26px/1.1 var(--font); color: var(--chalk-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .qbar .what b { color: var(--chalk); font-weight: 900; text-transform: uppercase; }
  .clock { font: 800 62px/1 var(--mono); min-width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
  .clock.hot { color: var(--bad); }
  .timeline { flex: none; height: 8px; background: var(--infield-2); overflow: hidden; }
  .timeline i { display: block; height: 100%; background: var(--chalk); transform-origin: 0 50%; }
  .timeline.hot i { background: var(--bad); }
  .qtext { flex: 1 1 0; min-height: 0; display: flex; align-items: center; padding: 6px 8px; }
  .qtext .t { font: 800 var(--qfs, 64px)/1.08 var(--font); letter-spacing: -.01em; overflow-wrap: break-word; overflow: hidden; max-height: 100%; width: 100%; padding-bottom: .22em; /* у Geologica высокие выносные: без запаса подгонка кегля считает их переполнением */ }
  .qtext .tag { display: block; font: 700 20px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  .bopts { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bopt { position: relative; display: flex; align-items: center; gap: 16px; min-height: 92px; padding: 10px 18px 10px 10px; background: var(--lc); color: var(--night); border: 0; transition: opacity .3s; }
  .bopt .lt { flex: none; width: 58px; height: 58px; background: var(--night); color: var(--lc); font: 800 36px/58px var(--mono); text-align: center; }
  .bopt .tx { flex: 1; min-width: 0; font: 800 var(--ofs, 36px)/1.08 var(--font); overflow-wrap: anywhere; }
  .bopt.closed { background: var(--infield); color: var(--chalk); box-shadow: inset 0 0 0 2px var(--edge); }
  .bopt.closed .tx { visibility: hidden; }
  .bopt.closed .lt { opacity: .6; }
  .bopt.right { background: var(--ok); color: var(--night); }
  .bopt.right .lt { background: var(--night); color: var(--ok); }
  /* галочка занимает место всегда (невидимая), иначе на раскрытии текст правильного варианта перестраивается и растит ряд */
  .bopt .tx::after { content: " ✓"; visibility: hidden; }
  .bopt.right .tx::after { visibility: visible; }
  .bopt.dim { background: var(--infield); color: var(--chalk-2); opacity: .6; }
  .bopt .who { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 45%; }
  .bopt .who:empty { display: none; }
  .bopt .who span { display: flex; align-items: center; gap: 2px; background: var(--night); color: var(--chalk); border: 2px solid var(--chalk-2); border-radius: 22px; padding: 2px 8px 2px 4px; font: 800 var(--wfs, 20px)/1 var(--mono); }
  .bopt .who span i { font-style: normal; font-size: 1.4em; }
  .bopt .who span.g { background: var(--night); border-color: var(--night); color: var(--ok); }
  @media (prefers-reduced-motion: no-preference) { .bopt .who span { animation: drop .4s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: var(--d, 0s); } }
  @keyframes drop { from { transform: translateY(-18px); opacity: 0; } }
  .strip { flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 52px; font: 700 28px/1.1 var(--font); text-align: center; }
  .strip .dots { display: flex; gap: 6px; }
  .strip .dots i { font-style: normal; font-size: 34px; opacity: .25; transition: opacity .2s, transform .2s; }
  .strip .dots i.on { opacity: 1; transform: translateY(-4px); }
  .strip .big { font: 900 40px/1 var(--font); text-transform: uppercase; color: var(--bad); }
  .strip .ok { color: var(--ok); }

  /* ---------- Камера: плитки — клетки со стальными прутьями; вырвался — прутья уезжают вверх ---------- */
  .cellwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; }
  .tiles { display: grid; grid-template-columns: repeat(var(--tc, 3), minmax(0, 1fr)); grid-template-rows: repeat(var(--tr, 1), minmax(0, 250px)); gap: 12px; min-height: 0; align-content: center; }
  .tile { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 10px 16px; background: #1a1f22; border: 4px solid #59626a; border-left: 12px solid var(--pc); min-width: 0; min-height: 0; overflow: hidden; transition: background .3s, border-color .3s; }
  .tile::before { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0 34px, rgba(0, 0, 0, .55) 34px 36px, rgba(160, 170, 178, .55) 36px 39px, rgba(70, 78, 85, .55) 39px 46px);
    transition: transform .7s cubic-bezier(.5, -0.3, .7, 1); }
  .tile > * { position: relative; z-index: 1; }
  .tile .nm { display: flex; align-items: center; gap: 10px; font: 800 clamp(20px, calc(3 * var(--vh)), 32px)/1.05 var(--font); min-width: 0; text-shadow: 0 2px 0 #000; }
  .tile .nm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .nm .emo { font-size: 1.3em; }
  .tile .pr { display: flex; gap: 6px; }
  .tile .pr i { flex: 1; max-width: 46px; height: clamp(10px, calc(1.6 * var(--vh)), 18px); border: 2.5px solid var(--chalk); background: #1a1f22; }
  .tile .pr i.on { background: var(--ok); border-color: var(--ok); }
  .tile .st { align-self: flex-start; max-width: 100%; font: 700 clamp(17px, calc(2.3 * var(--vh)), 24px)/1.1 var(--font); color: var(--chalk); background: #1a1f22; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.locked { background: #4b1b12; border-color: var(--bad); }
  .tile.locked .st { color: var(--bad); }
  .tile.esc { background: #163b25; border-color: var(--ok); }
  .tile.esc::before { transform: translateY(-105%); }
  .tile.esc .st { color: var(--ok); background: transparent; font-weight: 900; text-transform: uppercase; }
  .tile.burn { opacity: .55; }
  .side { width: min(520px, calc(36 * var(--vw))); display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .headq { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .headq .who { font: 800 24px/1.1 var(--font); }
  .headq .task { font: 900 26px/1.1 var(--font); color: var(--gold); }
  .headq .zoom { flex: 1; min-height: 0; overflow: hidden; display: flex; justify-content: center; }
  .headq .pad { width: 400px; pointer-events: none; min-height: 0; }
  .passcode { background: var(--sand); color: var(--night); padding: 10px 14px; }
  .passcode .h { font: 700 20px/1.2 var(--font); }
  .passcode .code { font: 800 64px/1 var(--mono); letter-spacing: .14em; }
  .betbox { flex: none; padding: 12px 16px; font: 800 26px/1.1 var(--font); text-align: center; }
  .betbox small { display: block; font: 600 18px/1.2 var(--font); color: var(--chalk-2); }

  /* ---------- приговор: списки — строкой сверху, а шкала растёт и забирает экран: отлёт видно из угла ---------- */
  .verdict { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; align-content: start; overflow: hidden; }
  .vcol { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; gap: 8px 10px; min-width: 0; }
  .vcol h3 { flex: 0 0 100%; margin: 0; font: 900 40px/1 var(--font); text-transform: uppercase; }
  .vcol.y h3 { color: var(--ok); }
  .vcol.n h3 { color: var(--bad); }
  .vrow { display: flex; align-items: center; gap: 10px; max-width: 100%; padding: 6px 14px 6px 10px; background: var(--infield); border-left: 10px solid var(--pc); font: 800 30px/1.1 var(--font); }
  .vrow b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vrow .d { color: var(--bad); font-family: var(--mono); }
  .vrow.wait { visibility: hidden; }
  @media (prefers-reduced-motion: no-preference) { .vrow.go { animation: drop .45s cubic-bezier(.3, 1.6, .5, 1) both; } }
  .seers { grid-column: 1 / -1; font: 700 24px/1.2 var(--font); color: var(--chalk-2); }
  .vcol .fine { font-size: 24px; }

  /* ---------- финал: тема на ставках, раскрытие ставок ---------- */
  .theme { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; }
  .theme .kicker { font-size: 28px; }
  .theme h2 { margin: 0; font: 900 clamp(70px, calc(14 * var(--vh)), 170px)/.95 var(--font); text-transform: uppercase; letter-spacing: -.02em; color: var(--gold); }
  .theme .sub { font: 700 32px/1.2 var(--mono); color: var(--chalk-2); }
  .fsteps { flex: 1; min-height: 0; display: grid; grid-auto-rows: minmax(0, var(--rh, 64px)); gap: 8px; align-content: center; width: min(1300px, 100%); align-self: center; }
  .frow { display: grid; grid-template-columns: minmax(0, 1fr) 7em 3em 6em 6em; align-items: center; gap: 14px; padding: 0 16px; background: var(--infield); border-left: 12px solid var(--pc); font: 800 clamp(22px, calc(var(--rh, 64px) * .42), 36px)/1 var(--font); transition: background .3s; }
  .frow .n { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .frow .n b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow span { text-align: right; font-variant-numeric: tabular-nums; }
  .frow span:not(.n) { font-family: var(--mono); }
  .frow .q { color: var(--chalk-2); opacity: .6; }
  .frow.now { background: var(--infield-2); box-shadow: inset 0 0 0 3px var(--gold); }
  .frow .plus { color: var(--ok); } .frow .minus { color: var(--bad); }

  /* ---------- итоги: пьедестал из тартана, награды ---------- */
  /* итоги: пьедестал слева на всю высоту сцены, справа награды и кнопки (стопкой пьедесталу доставалось ~200px и имена прятались) */
  .final { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 14px 28px; }
  .freason { grid-column: 1 / -1; text-align: center; color: var(--chalk-2); font: 700 22px/1 var(--mono); }
  .final .podium { grid-column: 1; grid-row: 2; }
  .finside { grid-column: 2; grid-row: 2; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
  .podium { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; gap: 14px; }
  .step { text-align: center; display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; min-width: 0; }
  .step .emo { font-size: clamp(50px, calc(8.5 * var(--vh)), 90px); display: block; }
  .step b { display: block; font: 800 var(--nfs, 34px)/1.1 var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 6px; } /* --nfs подгоняет drawFinal(): «куклускл…» на пьедестале не читалось */
  .step .sc { font: 800 32px/1 var(--mono); margin-top: 4px; color: var(--chalk-2); }
  .step .col { flex: none; margin-top: 8px; background: var(--track); color: #fff; border-top: 6px solid var(--pc); display: grid; place-items: start center; padding-top: 8px; font: 800 52px/1 var(--mono); }
  .step.p1 .col { height: 40%; background: var(--chalk); color: var(--night); } .step.p2 .col { height: 30%; } .step.p3 .col { height: 22%; background: var(--track-2); }
  @media (prefers-reduced-motion: no-preference) {
    .step .col { animation: rise .7s cubic-bezier(.2, .9, .3, 1.2) both; transform-origin: 50% 100%; }
    .step.p3 .col { animation-delay: .1s; } .step.p2 .col { animation-delay: .25s; } .step.p1 .col { animation-delay: .45s; }
  }
  @keyframes rise { from { transform: scaleY(0); } }
  .awards { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .awcards { flex: 0 1 auto; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 22px; }
  .award { min-width: 0; padding: 4px 0 4px 14px; border-left: 4px solid var(--gold); }
  /* --aw — множитель кегля: drawFinal() уменьшает его, пока все награды не влезут (на 640px высоты «Дно» резалось пополам) */
  .award .k { display: inline; font: 700 calc(20px * var(--aw, 1))/1.1 var(--font); color: var(--gold); margin-right: 10px; }
  .award .a { display: inline; font: 800 calc(26px * var(--aw, 1))/1.1 var(--font); overflow-wrap: anywhere; }
  .award .by { margin-top: 0; font-size: calc(18px * var(--aw, 1)); color: var(--chalk-2); font-weight: 500; }
  .table { flex: 1; padding: 12px 16px; min-height: 0; overflow: hidden; }
  .table ol { list-style: none; margin: 6px 0 0; padding: 0; display: grid; }
  .table li { display: flex; align-items: center; gap: 10px; min-width: 0; font: 800 var(--tfs, 26px)/1.7 var(--font); border-bottom: 2px solid var(--edge); }
  .table li .n { width: 1.6em; color: var(--chalk-2); flex: none; font-family: var(--mono); }
  .table li b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .table li > span:last-child { font-family: var(--mono); }
  .table li .neg { color: var(--bad); }
  .againbox { flex: none; display: grid; gap: 6px; }
  .againbox .toggles { grid-template-columns: 1fr 1fr; gap: 10px; }
  .againbox .tog { padding: 6px 10px; gap: 10px; }
  .againbox .tog .bx { width: 28px; height: 28px; font-size: 20px; }
  .againbox .tog b { font-size: clamp(16px, calc(2.2 * var(--vh)), 24px); }
  .againbox .fine { text-align: center; font-size: clamp(16px, calc(2.1 * var(--vh)), 22px); }
  .hostbtns { flex: none; display: flex; gap: 14px; padding-bottom: 8px; }
  .hostbtns > * { flex: 1; }
  .hostbtns .start { flex: 2; }
  .ghostbtn { border: 0; background: var(--infield-2); box-shadow: 0 5px 0 #070c09, inset 0 0 0 2px var(--edge); padding: 18px 14px; font: 800 24px/1 var(--font); text-transform: uppercase; display: grid; place-items: center; color: inherit; text-decoration: none; }
  .hostbtns .start { font-size: 34px; padding: 18px 14px; white-space: nowrap; }

  /* ---------- шкала очков: дорожки из тартана, старт = ноль, левее — песчаная яма ---------- */
  #track { --namew: clamp(240px, calc(18 * var(--vw)), 340px); flex: none; height: var(--trh, calc(30 * var(--vh))); position: relative; display: grid; grid-template-columns: var(--namew, 230px) minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); background: var(--track); padding: 30px 0 6px; overflow: hidden; container-type: size; transition: height .6s cubic-bezier(.3, .8, .3, 1); }
  #track.off { display: none; }
  /* приговор: шкала забирает экран — отлёт главное событие */
  body[data-phase="verdict"] #stage { flex: 0 0 auto; max-height: calc(36 * var(--vh)); }
  body[data-phase="verdict"] .verdict { flex: none; }
  body[data-phase="verdict"] #track { flex: 1 1 auto; }
  #track::before { content: ""; position: absolute; left: 0; top: 0; width: var(--namew, 230px); bottom: 0; background: #0f1a14; }
  #track .road { position: absolute; left: var(--namew, 230px); right: 34px; top: 0; bottom: 0; pointer-events: none; }
  #track .pit { position: absolute; top: 0; bottom: 0; left: 0; background: var(--sand) radial-gradient(circle, rgba(93, 67, 23, .22) 1.4px, transparent 2px) 0 0 / 11px 11px; box-shadow: inset -10px 0 0 #fff; }
  #track .pit span { position: absolute; left: 14px; right: 22px; bottom: 10px; overflow: hidden; color: var(--sand-ink); font: 900 24px/1 var(--font); text-transform: uppercase; letter-spacing: .18em; white-space: nowrap; }
  @media (max-width: 1300px) { #track .pit span { font-size: 16px; letter-spacing: .06em; left: 10px; } }
  #track .tick { position: absolute; top: 0; bottom: 0; border-left: 2px dashed rgba(242, 238, 227, .35); }
  @media (prefers-reduced-motion: no-preference) { #track .tick { transition: left .6s cubic-bezier(.3, .8, .3, 1); } #track .pit { transition: width .6s cubic-bezier(.3, .8, .3, 1); } }
  #track .tick span { position: absolute; top: 6px; left: 6px; font: 800 20px/1 var(--mono); color: var(--chalk); }
  #track .tick:last-child span { left: auto; right: 6px; }
  #track .tick.zero { border-left: 0; }
  #track .tick.zero span { left: 10px; color: var(--chalk); }
  .lane { display: contents; }
  .lname { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 0; min-width: 0; z-index: 2; font: 800 var(--lfs, 22px)/1 var(--font); border-top: 3px solid #0f1a14; }
  .lname .no { flex: none; align-self: stretch; display: grid; place-items: center; width: 1.7em; background: var(--pc); color: var(--night); font: 800 1em/1 var(--mono); }
  .lname b { flex: 1; min-width: 0; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lname .sc { flex: none; min-width: 5ch; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lname .sc.neg { color: var(--bad); }
  /* ✕ в партии: у серых (нет связи) — всегда, у остальных — по наведению/фокусу: имя на шкале не должно ужиматься */
  .lname .x { display: none; flex: none; align-self: stretch; align-items: center; justify-content: center; min-width: 44px; margin-right: -10px; background: rgba(0, 0, 0, .3); border: 0; color: var(--chalk); font: 800 18px/1 var(--font); padding: 0 8px; }
  .lname.off .x, .lname:hover .x, .lname:focus-within .x { display: flex; }
  /* итоги: вместо номера на груди — место (иначе 1–2–3–4 по порядку входа читались как таблица мест и спорили с пьедесталом) */
  .lname .no.place { background: var(--chalk); color: var(--night); box-shadow: inset 6px 0 0 var(--pc); }
  .lname .no.place.p1 { background: var(--gold); }
  .lname.off { opacity: .45; }
  .lroad { position: relative; border-top: 3px solid rgba(242, 238, 227, .9); margin-right: 34px; }
  /* --tk по умолчанию приходит из JS (buildTrack); точный размер от высоты дорожки — только где есть container queries,
     иначе значение с cqh недействительно и жетон остаётся без размера */
  @supports (container-type: size) { .lroad { --tk: clamp(26px, calc((100cqh - 36px) / var(--n, 3) - 8px), 76px); } }
  .lane:nth-child(odd) .lroad { background: rgba(0, 0, 0, .07); }
  .tok { position: absolute; top: 50%; left: 0; width: var(--tk, 40px); height: var(--tk, 40px); margin: calc(var(--tk, 40px) / -2) 0 0 calc(var(--tk, 40px) / -2); border-radius: 50%; background: var(--chalk); border: 4px solid var(--pc); display: grid; place-items: center; font-size: calc(var(--tk, 40px) * .58); line-height: 1; z-index: 3; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
  /* ниже нуля — сидит в песке по пояс */
  .tok.sunk { box-shadow: none; }
  .tok.sunk::after { content: ""; position: absolute; left: -10px; right: -10px; bottom: -8px; height: 52%; background: var(--sand); border-radius: 50% 50% 6px 6px / 70% 70% 6px 6px; box-shadow: inset 0 3px 0 rgba(93, 67, 23, .35); }
  .fly { position: absolute; z-index: 4; font: 800 34px/1 var(--mono); color: var(--bad); pointer-events: none; white-space: nowrap; text-shadow: 0 2px 0 var(--night), 0 0 6px var(--night); }
  .fly.plus { color: var(--ok); }
  .dust { position: absolute; z-index: 2; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--sand); pointer-events: none; }

  /* реакции взлетают снизу */
  .floater { position: fixed; bottom: -60px; z-index: 40; font-size: 46px; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
  .floater small { font: 700 15px/1.2 var(--font); background: var(--chalk); color: var(--night); padding: 2px 6px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: no-preference) { .floater { animation: floatup 2.6s ease-out forwards; } }
  @keyframes floatup { to { transform: translateY(calc(-62 * var(--vh))); opacity: 0; } }

  /* невысокие экраны (ноутбук 1280×720 по HDMI): вопросу — больше места, шкала и варианты плотнее */
  @media (max-height: 800px) {
    main { padding: 10px 18px 12px; gap: 10px; }
    #stage { gap: 10px; }
    .qbar { height: 46px; }
    .clock { font-size: 50px; }
    .bopt { min-height: 72px; padding-top: 6px; padding-bottom: 6px; }
    .bopt .lt { width: 48px; height: 48px; font-size: 30px; line-height: 48px; }
    .bopts { gap: 10px; }
    .strip { min-height: 44px; font-size: 24px; }
    .strip .big { font-size: 34px; }
    #track { padding-top: 26px; }
    body.dense .qtext .tag { display: none; }
  }
  @media (max-width: 1000px) {
    body { overflow: auto; }
    main { min-height: calc(100 * var(--vh) - var(--lsc, 32px) * 2 - 4px); }
    .lobby, .final, .verdict { grid-template-columns: minmax(0, 1fr); }
    .final { grid-template-rows: none; }
    .final .podium, .finside { grid-column: 1; grid-row: auto; }
    .final .podium { min-height: 300px; }
    /* узкий режим прокручивается: сцена растёт по содержимому, а не режет его по высоте окна */
    #stage { flex: 1 0 auto; min-height: auto; }
    .lobby, .final, .verdict, .cellwrap { flex: none; }
    .panel { min-height: auto; }
    .seats { flex: none; }
    .tiles { grid-template-rows: none; grid-auto-rows: minmax(96px, auto); }
    .side { min-height: auto; }
    .qtext { flex: none; min-height: 110px; }
    .cellwrap { grid-template-columns: minmax(0, 1fr); }
    .side { width: auto; }
    .top h1 { display: none; }
    .seats { grid-template-rows: none; grid-auto-flow: row; }
    .seat { min-height: 56px; }
  }

  /* ---------- правки 05.10 по ревью ---------- */
  /* полоса под вариантами — одна строка фиксированной высоты, кегль подгоняет fitStrip() */
  .strip { height: 60px; min-height: 0; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; font-size: var(--sfs, 28px); }
  .strip > * { flex: none; }
  .strip .big { font-size: 1.4em; }
  .strip .dots i { font-size: 1.2em; }
  /* узники — аватары за прутьями, красная рамка: видно из угла, кто идёт в Камеру */
  .jail { display: flex; gap: .4em; }
  .jl { display: inline-flex; align-items: center; gap: .3em; padding: .12em .5em .12em .25em; background: #1a1f22; border: 3px solid var(--bad); color: var(--chalk); font-weight: 800; }
  .jl i { position: relative; font-style: normal; font-size: 1.4em; line-height: 1; }
  .jl i::after { content: ""; position: absolute; top: -3px; right: -4px; bottom: -3px; left: -4px; background: repeating-linear-gradient(90deg, transparent 0 6px, #111 6px 7px, #aab2b8 7px 9px, transparent 9px 11px); }
  .jail.many .jl { padding: .12em .25em; }
  .jail.many .jl b { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* раскрытие: гаснет текст неверного варианта, но не аватарки тех, кто его выбрал — они идут в Камеру */
  .bopt.dim { opacity: 1; background: transparent; }
  .bopt.dim .lt, .bopt.dim .tx { opacity: .35; }
  .bopt.dim .who span { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad); }
  /* больше шести игроков: шкала выше, варианты — в один ряд */
  body.dense .bopt { min-height: 64px; gap: 10px; padding-left: 8px; }
  body.dense .bopt .lt { width: 44px; height: 44px; font-size: 28px; line-height: 44px; }
  @media (min-width: 1200px) {
    body.dense .bopts, body.short .bopts { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    /* четыре узких колонки: плашки «кто выбрал» — второй строкой под текстом, а не рядом (рядом текст рвался по буквам) */
    body.dense .bopt, body.short .bopt { flex-wrap: wrap; align-content: center; row-gap: 4px; min-height: clamp(76px, calc(9 * var(--vh)), 92px); }
    body.dense .bopt .tx, body.short .bopt .tx { flex: 1 1 calc(100% - 70px); }
    body.dense .bopt .who, body.short .bopt .who { flex: 1 0 100%; max-width: none; justify-content: flex-start; }
  }
  /* проектор и ноутбук по HDMI ниже 720px: два ряда вариантов по 72px и шкала оставляли вопросу ~55px —
     текст вопроса обрезался. Варианты встают в один ряд (выше), подпись темы и полоса — плотнее */
  body.short .bopt { min-height: 64px; gap: 10px; padding-left: 8px; }
  body.short .bopt .lt { width: 44px; height: 44px; font-size: 28px; line-height: 44px; }
  body.short .qtext .tag { font-size: 16px; margin-bottom: 4px; }
  body.short .qbar { height: 40px; }
  body.short .clock { font-size: 42px; }
  body.short .strip { min-height: 38px; }
  /* подписи очков на шкале — на тёмной плашке справа от жетона */
  .fly { background: var(--night); padding: 3px 8px; text-shadow: none; font-size: clamp(20px, calc(var(--tk, 40px) * .7), 36px); }
  /* узник на шкале — жетон за прутьями */
  .tok.jailed::before { content: ""; position: absolute; top: -5px; right: -5px; bottom: -5px; left: -5px; border-radius: 50%; border: 3px solid #59626a; background: repeating-linear-gradient(90deg, transparent 0 22%, #2b3136 22% 30%); pointer-events: none; }
  /* Камера: плитки заполняют высоту, имя в две строки, статус — иконкой испытания */
  .tiles { grid-template-rows: repeat(var(--tr, 1), minmax(0, 1fr)); align-content: stretch; }
  .tile .nm b { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: normal; hyphens: manual; line-height: 1.05; }
  .tile .st { display: flex; align-items: center; gap: .35em; }
  .tile .st .ic { flex: none; font-style: normal; font-size: 1.5em; line-height: 1; }
  .tile .st span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .cellwrap.dense .side { width: min(400px, calc(27 * var(--vw))); }
  .cellwrap.dense .tile .nm { font-size: clamp(16px, calc(2.6 * var(--vh)), 28px); gap: 6px; }
  /* без :has() (Chromium <105 на проекторах): классы ставит syncSide() */
  .side.hq-on .warden { display: none; }
  .side.hq-on .betbox { grid-column: 1 / -1; padding: 6px 12px; font-size: clamp(16px, calc(2.2 * var(--vh)), 22px); }
  .side.hq-on .betbox small { display: inline; margin-left: 10px; font-size: .8em; }
  .side.hq-on { grid-template-rows: auto auto minmax(0, 1fr); }
  .cellwrap.dense .side > * { grid-column: 1 / -1; }
  @media (max-height: 800px) { .strip { height: 46px; } }
  .cellwrap.dense .tile { padding: 8px 10px; gap: 6px; }
  .cellwrap.dense .tile .st span { display: none; }
  .cellwrap.dense .tile .st .ic { font-size: clamp(26px, calc(3.6 * var(--vh)), 40px); }
  .cellwrap.few .tiles { grid-template-columns: repeat(var(--tc, 1), minmax(0, 440px)); justify-content: center; gap: 22px; }
  .cellwrap.few .tile { align-items: center; text-align: center; gap: 14px; }
  .cellwrap.few .tile .nm { flex-direction: column; font-size: clamp(28px, calc(4.6 * var(--vh)), 50px); }
  .cellwrap.few .tile .nm .emo { font-size: 1.9em; }
  .cellwrap.few .tile .pr { justify-content: center; width: 100%; }
  .cellwrap.few .tile .pr i { max-width: 80px; height: clamp(16px, calc(2.4 * var(--vh)), 26px); }
  .cellwrap.few .tile .st { align-self: center; font-size: clamp(20px, calc(3 * var(--vh)), 32px); }
  /* в боковой колонке всегда живое: палач и его набор крупно */
  .warden { flex: none; padding: 10px 16px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; }
  .warden .kicker { grid-column: 1 / -1; }
  .warden .wp { display: flex; align-items: center; gap: 10px; min-width: 0; font: 900 clamp(24px, calc(3.4 * var(--vh)), 40px)/1.05 var(--font); }
  .warden .wp b { min-width: 0; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .warden .wp .emo { font-size: 1.3em; }
  .warden .wp.auto { font: 700 22px/1.2 var(--font); color: var(--chalk-2); }
  .warden .wg { display: flex; align-items: center; gap: 8px; font: 900 clamp(24px, calc(3.4 * var(--vh)), 40px)/1 var(--font); text-transform: uppercase; color: var(--gold); }
  .warden .wg i { font-style: normal; }
  /* вопрос «Головы» на доске — крупно: стену ужимаем, zoom растягивает её до колонки */
  .headq .pad { width: 320px; min-height: 0; }
  .side .betbox { padding: 8px 14px; font-size: 22px; display: grid; align-content: center; }
  /* палач и ставки — одной строкой, чтобы вопросу «Головы» досталась почти вся колонка */
  .side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); align-content: start; }
  .side > #passes, .side > .headq { grid-column: 1 / -1; }
  .side.bet-off > .warden { grid-column: 1 / -1; }
  .side .warden { grid-template-columns: minmax(0, 1fr); }
  .side .warden .wg { font-size: clamp(22px, calc(3 * var(--vh)), 34px); }
  .side .headq { height: 100%; }
  /* «Внимание»/«Ловкость»: стены «Головы» нет — колонка не пустая, а показывает, сколько уже вырвалось (lastq-026) */
  .escbox { grid-column: 1 / -1; min-height: 0; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 10px 14px; text-align: center; }
  .escbox .k { font: 800 clamp(18px, calc(2.4 * var(--vh)), 28px)/1.1 var(--font); color: var(--chalk-2); text-transform: uppercase; letter-spacing: .08em; }
  .escbox .big { font: 900 var(--bgf, clamp(48px, calc(10 * var(--vh)), 120px))/1 var(--mono); color: var(--gold); }
  .escbox .big span { color: var(--chalk-2); font-size: .55em; }
  .escbox .who { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; font: 800 var(--esf, clamp(18px, calc(2.6 * var(--vh)), 30px))/1.1 var(--font); }
  .escbox .who b { min-width: 0; max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Камера с кодами «Передачки»: колонка не переполняется (W5, T-W3-32). Код — справа от подписи, кегль кодов
     (--pcs), подписи (--pcf) и списка сбежавших (--esf) подгоняет fitSide(); «Сбежали» — одной компактной плашкой */
  .side.tight { grid-template-rows: auto auto auto; }
  .side.tight.hq-on { grid-template-rows: auto auto minmax(0, 1fr); }
  .side.tight .warden .kicker { display: none; }
  .side.tight .warden { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr) auto; padding: 6px 12px; }
  .side.tight .warden .wp, .side.tight .warden .wg { font-size: clamp(18px, calc(2.8 * var(--vh)), 30px); }
  .side.tight .betbox { grid-column: 1 / -1; padding: 4px 12px; font-size: clamp(16px, calc(2.2 * var(--vh)), 22px); }
  .side.tight .betbox small { display: inline; margin-left: 10px; font-size: .8em; }
  .cellwrap.dense .side.has-pass { width: min(460px, calc(33 * var(--vw))); }
  .side.has-pass #passes { gap: 4px !important; min-height: auto; }
  .side.has-pass .passcode { display: flex; align-items: center; gap: 0 10px; padding: 2px 12px; }
  .side.has-pass .passcode .h { flex: 1 1 0; font-size: var(--pcf, 18px); line-height: 1.15; min-width: 0; overflow-wrap: anywhere; }
  .side.has-pass .passcode .code { flex: none; font-size: var(--pcs, 56px); letter-spacing: .08em; }
  .side.tight .escbox { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: flex-start; gap: 0 10px; padding: 3px 10px; text-align: left; min-height: 0; }
  .side.tight .escbox .k { font-size: var(--esf, 16px); }
  .side.tight .escbox .big { font-size: calc(var(--esf, 16px) * 1.8); }
  .side.tight .escbox .who { flex: 1 0 100%; justify-content: flex-start; font-size: var(--esf, 16px); gap: 2px 10px; }
  .cellwrap.few { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
  .cellwrap.few .side { width: auto; }
  .headq .pad { padding: 10px; gap: 10px; width: 100%; }
  /* на доске стена «Головы» — во всю колонку, кегль крупный сам по себе (зум только ужимает, если не влезло) */
  .headq .pad .qtext { font-size: clamp(34px, calc(4.6 * var(--vh)), 52px); padding: 0; flex: none; display: block; }
  .headq .pad .opt { min-height: 0; padding: 10px 8px; font-size: clamp(26px, calc(3.6 * var(--vh)), 40px); }
  .headq .pad .clue, .headq .pad .rule { font-size: clamp(20px, calc(2.6 * var(--vh)), 30px); }
  .headq .pad .eq { font-size: clamp(36px, calc(5 * var(--vh)), 56px); }
  .headq .pad .opts.code .opt { font-size: clamp(30px, calc(4.2 * var(--vh)), 46px); }
  .hostbtns .start { font-size: clamp(20px, calc(2 * var(--vw)), 30px); }
  /* стена «Головы» на доске — полосой, а не столбиком: в широкой колонке образец и варианты встают рядом, масштаб выше
     (в 1280×720 столбик давал k≈0,35 — стена мельчала до нечитаемого, lastq-025). align-content: flex-start — иначе
     переполнение уходит вверх и scrollHeight его не видит */
  .headq .pad { display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; align-items: center; gap: 10px 16px; }
  .headq .pad > * { flex: 0 1 auto; max-width: 100%; }
  .headq .pad > .opts, .headq .pad > .eqs, .headq .pad > .clues { flex: 1 1 260px; }
  .headq .pad > .qtext { flex: 1 1 100%; }
  .headq .zoom { justify-content: flex-start; }
  .headq { padding: 8px 12px; gap: 6px; }
  .headq .task { font-size: clamp(18px, calc(2.6 * var(--vh)), 28px); }
  .headq .who { font-size: clamp(16px, calc(2.2 * var(--vh)), 26px); }
  /* раскрытие ставок: шапка колонок */
  .frow { grid-template-columns: minmax(0, 1fr) 7em 5em 6em 6em; }
  .frow.fhead { background: transparent; border-left-color: transparent; color: var(--chalk-2); align-items: end; padding-bottom: 6px; }
  .frow.fhead span { font: 700 clamp(13px, calc(1.6 * var(--vh)), 18px)/1.1 var(--mono); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  /* ---------- телефон (ведущий создал комнату с телефона): лобби — одна колонка с прокруткой ----------
     сначала то, что нужно ведущему: код, QR, ссылка, настройки, «Старт»; стартовый лист — под ним */
  @media (max-width: 760px) {
    .top { height: max(56px, calc(var(--lsc, 28px) * 2)); padding: 0 var(--lsw, 150px) 0 12px; gap: 10px; }
    .chip { font-size: 15px; padding: 6px 8px; }
    main { padding: 12px 12px 20px; min-height: 0; }
    .lobby { flex: none; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .lobby > .panel:last-child { order: -1; }
    .panel { padding: 14px; gap: 12px; }
    .panel h2 { font-size: 24px; padding-bottom: 8px; }
    .panel h2 span { font-size: 17px; }
    /* код — во всю ширину панели (кегль подгоняет drawLobby), под ним QR и ссылка с подсказкой */
    .join { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto 1fr; gap: 0 14px; align-items: start; }
    .join > div:not(#qr) { display: contents; }
    .join .bigcode { grid-column: 1 / -1; margin-bottom: 12px; font-size: min(var(--code-fs, 64px), 60px); }
    #qr { grid-row: 2 / 4; width: 116px; height: 116px; padding: 6px; }
    .url { font-size: 14px; margin-top: 0; }
    .scan { font-size: 15px; font-weight: 500; line-height: 1.3; margin-top: 6px; }
    .tog { min-height: 56px; gap: 12px; padding: 8px 12px; }
    .tog .bx { width: 30px; height: 30px; font-size: 20px; }
    .tog b { font-size: 19px; }
    .tog span { font-size: 14px; }
    /* пример шкалы — для зала у телевизора; на телефоне он только отнимает экран */
    .demo { display: none; }
    .startbox { margin-top: 4px; }
    .fine { font-size: 16px; }
    .start { font-size: 30px; padding: 16px; min-height: 60px; }
    .seats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
    .seat { min-height: 52px; gap: 8px; padding-right: 8px; }
    .seat::before { font-size: 20px; width: 1.6em; }
    .seat .emo { font-size: 28px; }
    .seat b { font-size: 18px; }
    .seat.empty { font-size: 16px; }
    /* на тач-экране наведения нет: «убрать» видно всегда, кнопка во всю высоту дорожки */
    .host .seat:not(.empty) { padding-right: 44px; }
    .seat .x { visibility: visible; top: 0; right: 0; bottom: 0; width: 44px; padding: 0; font-size: 18px; }
  }
  /* узкий телефон: дорожки в один столбец, иначе имени рядом с эмодзи и «✕» не остаётся места */
  @media (max-width: 520px) { .seats { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 360px) { #qr { width: 96px; height: 96px; } }
  /* ---------- телефон: партия на доске-телефоне — экран не делится по высоте, всё идёт столбцом с прокруткой ----------
     (на ТВ фазы подогнаны под 100vh; на телефоне так не влезает: вопрос сжимался в ноль, а имена на шкале съедали дорожку) */
  @media (max-width: 760px) {
    /* шапка: акт и так виден на заставке и над вопросом */
    #actchip { display: none; }
    .endbtn { font-size: 14px; padding: 7px 9px; }
    main { flex: 1 0 auto; }
    #stage { flex: 1 0 auto; gap: 10px; }
    .qbar { height: auto; min-height: 40px; gap: 10px; }
    .qbar .what { font-size: 18px; }
    .clock { font-size: 36px; min-width: 0; }
    /* заставка акта и тема финала */
    .intro { padding: 24px 0; gap: 10px; }
    .intro .kicker, .theme .kicker { font-size: 17px; }
    .intro h2, .theme h2 { font-size: clamp(36px, 11vw, 64px); overflow-wrap: anywhere; }
    .intro h2::after { height: 10px; margin-top: 14px; }
    .intro .desc { font-size: 18px; }
    .intro .pts, .theme .sub { font-size: 18px; }
    .theme { padding: 24px 0; gap: 10px; }
    /* вопрос: высота по тексту, кегль подгонки — не больше телефонного */
    .qtext { flex: none; padding: 2px 0; }
    .qtext .t { font-size: min(var(--qfs, 26px), 26px); max-height: none; }
    .qtext .tag { font-size: 14px; margin-bottom: 6px; }
    .bopts { gap: 8px; }
    .bopt, body.dense .bopt { min-height: 52px; gap: 10px; padding: 6px 10px 6px 6px; }
    .bopt .lt, body.dense .bopt .lt { width: 38px; height: 38px; font-size: 24px; line-height: 38px; }
    .bopt .tx { font-size: min(var(--ofs, 20px), 20px); overflow-wrap: break-word; hyphens: auto; }
    .bopt .who span { font-size: 15px; padding: 1px 6px 1px 3px; }
    .bopt .who span i { font-size: 20px; }
    /* полоса под вариантами — переносится, а не режется */
    .strip { height: auto; min-height: 40px; flex-wrap: wrap; white-space: normal; gap: 6px 10px; font-size: min(var(--sfs, 18px), 18px); padding: 4px 0; }
    .strip > * { flex: 0 1 auto; min-width: 0; }
    .jail { flex-wrap: wrap; justify-content: center; }
    /* Камера: плитки по содержимому, вопрос «Головы» — своей высоты */
    .cellwrap, .cellwrap.few { flex: none; gap: 10px; grid-template-columns: minmax(0, 1fr); }
    .tiles, .cellwrap.few .tiles { grid-template-rows: none; grid-auto-rows: auto; gap: 8px; }
    .tile { min-height: 76px; padding: 8px 10px; border-width: 3px; border-left-width: 10px; }
    .tile .nm, .cellwrap.few .tile .nm, .cellwrap.dense .tile .nm { font-size: 18px; }
    .cellwrap.few .tile .nm .emo { font-size: 1.5em; }
    .tile .st, .cellwrap.few .tile .st { font-size: 15px; }
    .side, .cellwrap.dense .side { width: auto; }
    .warden { padding: 8px 10px; }
    .warden .wp, .warden .wg, .side .warden .wg { font-size: 20px; }
    .side .betbox { font-size: 17px; }
    .betbox small { font-size: 14px; }
    .side .headq { height: auto; }
    .headq .zoom { flex: none; height: calc(62 * var(--vh)); }
    .passcode .code { font-size: 44px; }
    /* приговор */
    body[data-phase="verdict"] #stage { flex: none; max-height: none; }
    body[data-phase="verdict"] #track { flex: none; }
    .verdict { flex: none; gap: 8px; }
    .vcol h3 { font-size: 26px; }
    .vrow { font-size: 19px; padding: 4px 10px 4px 8px; border-left-width: 8px; }
    .seers, .vcol .fine { font-size: 16px; }
    /* раскрытие ставок: узкие колонки, строки по содержимому */
    .fsteps { flex: none; grid-auto-rows: minmax(40px, auto); gap: 6px; }
    .frow, .frow.fhead { grid-template-columns: minmax(0, 1fr) 3.2em 2.4em 3.4em 3.6em; gap: 5px; padding: 0 6px; border-left-width: 6px; font-size: 15px; }
    .frow .n { gap: 4px; }
    .frow.fhead span { font-size: 10px; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; }
    /* итоги: пьедестал своей высоты, кнопки в две строки */
    .final { flex: none; gap: 12px; }
    .podium { flex: none; height: 230px; }
    .step .emo { font-size: 38px; }
    .step b, .step .sc { font-size: 17px; }
    .step .col { font-size: 34px; padding-top: 8px; }
    .award { padding: 8px 10px; }
    .award .k { font-size: 13px; letter-spacing: .04em; }
    .award .a { font-size: 18px; }
    .award .by { font-size: 14px; }
    .table { flex: none; }
    .hostbtns { flex-wrap: wrap; gap: 8px; }
    .hostbtns .start { flex: 1 1 100%; font-size: 24px; padding: 12px; }
    .ghostbtn { font-size: 18px; padding: 12px; min-height: 48px; }
    /* шкала: высота — по числу дорожек (--n ставит buildTrack), имена узкой колонкой, аватар — только на жетоне */
    #track { --namew: 128px; height: calc(var(--n, 4) * 46px + 34px); padding-top: 26px; }
    .lname { font-size: 16px; gap: 6px; padding-right: 6px; }
    .lname .emo { display: none; }
    .lname .sc { font-size: 14px; }
    .lroad { margin-right: 18px; }
    #track .road { right: 18px; }
    #track .tick span { font-size: 13px; }
    /* подписи — только ноль и края: промежуточные на узкой дорожке слипаются */
    #track .tick:not(.zero):not(:first-child):not(:last-child) span { display: none; }
    #track .pit span { font-size: 14px; left: 8px; right: 14px; letter-spacing: .1em; }
    .fly { font-size: 16px; }
  }
  /* узкий телефон: варианты — столбцом, иначе длинный ответ рвётся по буквам */
  @media (max-width: 520px) { .bopts, body.dense .bopts { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 420px) { #codechip { display: none; } }
  @media (max-width: 360px) {
    .top { gap: 6px; padding-left: 8px; }
    .endbtn { font-size: 13px; padding: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script src="mp-common.js"></script>

<body>
<div class="top">
  <h1 id="brand" data-i18n="game_name">Последний <em>вопрос</em></h1>
  <span class="grow"></span>
  <span class="hostbar" id="hostbar"></span>
  <button class="endbtn skipbtn hidden" id="skipbtn" type="button"></button>
  <button class="endbtn hidden" id="endbtn" type="button"></button>
  <span class="chip hidden" id="codechip"></span>
  <button class="sound-toggle-btn" type="button"></button>
</div>
<div class="banner hidden" id="banner"></div>
<div class="conn" id="conn"></div>
<main id="main"><div id="stage"></div><div id="track" class="off"></div></main>

<script>
window.I18N_DICT = {
  ru: {
    end_q: `Закончить партию? Сразу покажем итоги`, rj_start_few_players: `Нужно хотя бы двое игроков`, rj_start_no_content: `Вопросы не загрузились — попробуйте позже`, rj_start_started: `Партия уже идёт`,
    _title: `Последний вопрос — общий экран`,
    lobby_who: `Игроки`, lobby_n: `{n} из 10`, lobby_empty: `свободно`, offline: `не в сети`, kick: `Убрать`,

<!-- QR — асинхронно: медленный CDN не должен держать всю доску; доехал — лобби перерисует QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" async onload="window.lqQrReady && window.lqQrReady()"></script>
<script>
"use strict";
const T = (k) => lqT(k);
const tpl = (k, v) => lqTpl(k, v);
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
// Масштаб под большой экран: от 2200px шириной доску увеличиваем целиком (zoom) до логических ~1700×960, как в других играх
let ZOOM = 1;
function fitScreen() {
  const w = window.innerWidth || 0, h = window.innerHeight || 0;
  ZOOM = w >= 2200 ? Math.max(1, Math.min(2.5, Math.round(Math.min(w / 1600, h / 960) * 100) / 100)) : 1;
  document.body.style.setProperty("--z", String(ZOOM));
  document.body.classList.toggle("scaled", ZOOM > 1);
  document.body.classList.toggle("short", h / ZOOM < 720 && w / ZOOM >= 1001);
  if (window.lqMeasureLangSwitch) window.lqMeasureLangSwitch();
}
fitScreen();
const LH = () => Math.round(innerHeight / ZOOM); // высота окна в логических пикселях страницы
let CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const hostKey = () => "lastq-host-" + CODE;
const stage = $("stage");
const GROUP_ICON = { hands: "✋", eyes: "👁️", head: "🧠" };
// иконки испытаний для плиток узников (спека §4.1): по ним зал видит, кто чем занят
const CH_ICON = LQ_CH_ICON; // таблица — в lastq-shared.js (её же берёт телефон на экране ставок)
const FSTEP_MS = 3000;
window.lqQrReady = () => { if (state && state.phase === "lobby") { qrDrawn = false; drawLobby(); } };

let conn = null, state = null, isHost = false, dead = false;
let viewKey = "";
// Команды ведущего, которые нельзя отменить, — двухтактные (MP.twoTap, U-12): первый тап взводит на 3 с, второй выполняет.
// Нет mp-common.js или MP_OFF — один тап, как раньше. Взведена одна на всю доску: «Закончить», «Дальше», ✕.
const hostTap = (window.MP && MP.twoTap && MP.twoTap.create ? MP.twoTap.create : () => ({ tap: () => true, armed: () => null, isArmed: () => false, disarm() {} }))({ armedMs: 3000, onChange: () => syncHostBtns() });
function syncHostBtns() {
  const set = (id, key, label, sure) => {
    const b = document.getElementById(id);
    if (!b) return;
    const on = hostTap.isArmed(key);
    b.textContent = on ? T(sure) : T(label);
    if (on) b.setAttribute("data-armed", "1"); else b.removeAttribute("data-armed");
  };
  set("endbtn", "end", "btn_end", "end_sure");
  set("skipbtn", "skip", "btn_skip", "skip_sure");
  document.querySelectorAll("[data-kick]").forEach((b) => {
    const on = hostTap.isArmed("kick:" + b.dataset.kick);
    b.textContent = on ? T("kick_sure") : "✕";
    if (on) b.setAttribute("data-armed", "1"); else b.removeAttribute("data-armed");
  });
}
function kickTap(id) { if (isHost && hostTap.tap("kick:" + id)) conn.send({ type: "kick", playerId: id }); }
// ✕ у имени на шкале в партии: ведущий может убрать игрока и посреди партии (lastq-016); создаём на месте, шкалу не пересобираем
function syncLaneKicks() {
  const inGame = state && !(state.phase === "lobby" || state.phase === "finished");
  document.querySelectorAll("#track .lname").forEach((ln) => {
    const id = ln.id.replace(/^ln_/, "");
    let x = ln.querySelector(".x");
    if (isHost && inGame) {
      if (!x) {
        x = el("button", "x", "✕");
        x.type = "button";
        x.dataset.kick = id;
        x.title = T("kick") + ". " + T("kick_hint");
        x.setAttribute("aria-label", T("kick"));
        x.onclick = () => kickTap(id);
        ln.append(x);
      }
    } else if (x) x.remove();
  });
}

const player = (id) => state && state.players.find((p) => p.id === id);
const present = () => state.players.filter((p) => !p.left);
const qid = () => state.game + ":" + state.qn + ":" + state.act;
const emo = (p) => `<i class="emo">${escapeHtml(p ? p.avatar : "❔")}</i>`;
const nameOf = (id) => ((player(id) || {}).name || "?");

// ---------- создание комнаты, если доску открыли без кода ----------
async function ensureRoom() {
  if (CODE) return true;
  showBanner(T("creating"));
  try {
    const res = await fetch("/lastq/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: lqLang() } }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "error");
    CODE = data.code;
    try { localStorage.setItem(hostKey(), data.hostToken); } catch (e) {}
    history.replaceState(null, "", `?r=${CODE}`);
    showBanner(null);
    return true;
  } catch (err) {
    showBanner(String(err.message || err));
    return false;
  }
}
function showBanner(text) {
  const b = $("banner");
  b.classList.toggle("hidden", !text);
  b.textContent = text || "";
}

// подогнать шрифт под коробку: уменьшаем, пока текст не влезет (коробка не растёт — без скачков)
function fit(box, holder, varName, max, min) {
  let fs = max;
  holder.style.setProperty(varName, fs + "px");
  let guard = 0;
  while (fs > min && (box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1) && guard++ < 80) {
    fs -= 2;
    holder.style.setProperty(varName, fs + "px");
  }
}

// имя в своей коробке: сначала уменьшаем кегль (до min), и только потом многоточие; полное имя — в title.
// Рвать слово посреди (перенос по границе символа) нельзя — W5, T-W3-32
function fitNames(list, min, multiline) {
  list.forEach((b) => {
    b.title = b.textContent;
    b.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(b).fontSize) || 16, guard = 0;
    // высота: допуск на выносные элементы шрифта (scrollHeight > clientHeight на 3 px и у одной строки)
    while (fs > min && guard++ < 40 && (b.scrollWidth > b.clientWidth + 1 || (multiline && b.scrollHeight > b.clientHeight + fs * 0.4))) {
      fs -= 1;
      b.style.fontSize = fs + "px";
    }
  });
}

// ---------- лобби ----------
let qrDrawn = false;
const seen = new Set();
function drawLobby() {
  const url = `${location.origin}/lastq.html?r=${CODE}`;
  const key = "lobby:" + lqLang() + ":" + isHost;
  if (viewKey !== key) {
    viewKey = key;
    qrDrawn = false;
    stage.innerHTML = `<div class="lobby">
      <div class="panel box"><h2>${T("lobby_who")}<span id="seatn"></span></h2><div class="seats" id="seats"></div></div>
      <div class="panel box">
        <div class="join"><div id="qr"></div><div style="min-width:0;flex:1"><div class="bigcode" id="bigcode">${escapeHtml(CODE)}</div><div class="url">${escapeHtml(url.replace(/^https?:\/\//, "")).replace("?r=", "<wbr>?r=")}</div><div class="scan">${T("lobby_scan")}</div></div></div>
        <div class="toggles" id="toggles"></div>
        <div class="startbox"><div class="fine" id="starthint"></div><button class="start" id="startbtn" type="button">${T("btn_start")}</button></div>
      </div></div>`;
    $("startbtn").onclick = () => conn.send({ type: "start" });
    const code = $("bigcode");
    let fs = 96;
    code.style.setProperty("--code-fs", fs + "px");

// узники — аватары за прутьями с красной рамкой; имена видны, пока их немного (текст есть всегда — для чтения с экрана)

// полоса — одна строка фиксированной высоты: не влезает — уменьшаем кегль, а не переносим

function drawCellData(cell, open, late) {
  for (const x of cell) {
    const t = $("tl_" + x.id);

    let pr = "";

    const ic = x.escaped ? "🕊️" : x.burned ? "💨" : x.locked ? "🔒" : x.type ? (CH_ICON[x.type] || "❔") : "⏳";

  }

  }

// колонка Камеры с кодами: уменьшаем кегль кодов, подписей и списка сбежавших, пока всё не встанет в колонку (минимумы читаемы)
function fitSide() {

  const hq = side.classList.contains("hq-on");
  const set = (n, v) => side.style.setProperty(n, v + "px");
  let pcs = Math.min(64, Math.round(LH() / 12)), pcf = Math.min(20, Math.max(14, Math.round(LH() / 38))), esf = Math.min(26, Math.max(15, Math.round(LH() / 38)));

// состояние боковой колонки — классами (вместо :has(), которого нет в старых Chromium на проекторах)

// стена «Головы» в колонке: transform: scale() с шириной zoomWidth/k, а не CSS zoom — у zoom единицы cqw и переносы
// расходятся с измерением (tf, часы), стена оставалась полноразмерной и резалась рамкой. Нижней границы почти нет (0,35):
// мельче, но целиком (lastq-025)
function fitHeadQ() {
  const z = $("hqzoom"), pad = $("hqpad");
  if (!z || !pad) return;
  const zw = z.clientWidth, zh = z.clientHeight;
  if (!zw || !zh) return;
  pad.style.zoom = "";
  pad.style.transform = "none";
  pad.style.flex = "none";
  pad.style.height = "auto";
  pad.style.minHeight = "0";
  pad.style.alignSelf = "flex-start"; // не растягивать до высоты колонки: стена своей высоты, иначе .pad{overflow:hidden} режет её
  pad.style.overflow = "visible";
  // наибольший k, при котором высота стены на ширине zw/k, умноженная на k, влезает: чем меньше k, тем шире раскладка и ниже
  // стена — предел монотонен, ищем делением пополам
  const fits = (kk) => { pad.style.width = zw / kk + "px"; return (Math.max(1, pad.scrollHeight) + pad.offsetHeight - pad.clientHeight) * kk <= zh; }; // + рамка стены
  let lo = 0.35, hi = 2;

  else if (fits(lo)) { for (let i = 0; i < 8; i++) { const m = (lo + hi) / 2; if (fits(m)) lo = m; else hi = m; } }
  const k = lo;
  pad.style.width = zw / k + "px";
  pad.style.transformOrigin = "0 0";
  pad.style.transform = "scale(" + k.toFixed(3) + ")";
}

// ---------- приговор ----------
// спасшиеся сразу, отлетевшие — по одному, в такт шкале (verdictAt)

    const seers = Object.entries(v.betGain || {}).filter(([, n]) => n > 0).map(([id, n]) => `${(player(id) || {}).avatar || ""} ${nameOf(id)} +${n}`);

      <div class="vcol n"><h3>${T("v_title_n")}</h3>${(v.burned || []).map((id) => row(id, (v.delta || {})[id] || 0)).join("") || `<div class="fine">${T("v_nobody_n")}</div>`}</div>

// ---------- итоги ----------

// «Ещё партия»: те же две галочки, что в лобби, и подпись, с чем стартует нажатие (U-14): без захода в лобби, но и без сюрпризов

// итоги: имя на ступени — самым крупным кеглем, при котором влезает в строку; награды — общим множителем, пока все не влезут
function fitFinal() {
  stage.querySelectorAll(".step b").forEach((b) => {
    let fs = 34;
    b.style.setProperty("--nfs", fs + "px");

}
// номер на груди ↔ место на итогах; вне итогов — снова номер по порядку входа
function markPlaces(list) {
  const place = {};
  (list || []).forEach((p) => { place[p.id] = p.place; });
  if (!trk) return;
  trk.ids.forEach((id, i) => {
    const no = document.querySelector(`#ln_${CSS.escape(id)} .no`);
    if (!no) return;
    const pl = list ? place[id] : null;
    no.textContent = pl ? pl : chestNo(id) || i + 1;

}

// ---------- шкала очков ----------
// Дорожка на каждого игрока в порядке входа (не переезжают), аватар стоит на своём счёте.
// Ниже нуля — яма. Верный ответ — плавно вперёд; отлёт — назад с кувырком, отскоком и пылью.
const track = $("track");
let trk = null; // { ids, lo, hi, toks: {id: {x, score}} }
function trackDomain(scores) {
  const min = Math.min(0, ...scores), max = Math.max(0, ...scores);
  // шаг 500 — шкала меняется редко; нижний край — хотя бы один отлёт Акта 2
  const lo = Math.min(-300, Math.floor((min - 150) / 250) * 250);
  const hi = Math.max(1000, Math.ceil((max * 1.12 + 50) / 500) * 500);
  return [lo, hi];
}
// номер на груди — место в списке игроков партии, а не среди «оставшихся»: ушёл игрок — номера остальных не прыгают (lastq-053)
const chestNo = (id) => state.players.findIndex((p) => p.id === id) + 1;
function buildTrack(ids) {
  trk = { ids, lo: trk ? trk.lo : -300, hi: trk ? trk.hi : 1000, toks: {}, game: state.game };
  const n = ids.length;
  // мало игроков — шкала ниже, вопросу больше места; больше шести — до 44 % высоты, чтобы имена читались из угла
  // (варианты тогда встают в один ряд — body.dense)
  const vh = LH();
  const h = n > 6 ? Math.round(Math.min(vh * (vh < 800 ? (innerWidth < 1200 ? 0.34 : 0.37) : 0.44), n * 58 + 40)) : Math.round(Math.min(vh * (vh < 800 ? 0.27 : 0.3), Math.max(170, n * 66 + 40)));
  track.style.setProperty("--trh", h + "px");
  document.body.classList.toggle("dense", n > 6);
  const laneH = (h - 32) / Math.max(1, n);
  track.style.setProperty("--tk", Math.max(22, Math.min(48, laneH - 6)) + "px");
  track.style.setProperty("--lfs", Math.round(Math.min(laneH * 0.8, Math.max(15, vh * 0.024, Math.min(28, laneH * 0.6)))) + "px");
  track.style.setProperty("--n", Math.max(1, n));
  track.innerHTML = `<div class="road" id="road"><div class="pit" id="pit"><span>${escapeHtml(T("pit"))}</span></div><div id="ticks"></div></div>` + ids.map((id, i) => {
    const p = player(id) || {};
    return `<div class="lane" style="--pc:${p.color || "#999"}"><div class="lname" id="ln_${escapeHtml(id)}"><span class="no">${chestNo(id) || i + 1}</span>${emo(p)}<b>${escapeHtml(p.name || "?")}</b><span class="sc">0</span></div><div class="lroad" id="lr_${escapeHtml(id)}"><div class="tok" id="tk_${escapeHtml(id)}">${escapeHtml(p.avatar || "❔")}</div></div></div>`;
  }).join("");
  fitNames(Array.from(track.querySelectorAll(".lname b")), 12);
  drawScale();
}
function drawScale() {
  const span = trk.hi - trk.lo;
  const pct = (v) => ((v - trk.lo) / span) * 100;
  $("pit").style.width = pct(0) + "%";
  const step = span > 3000 ? 1000 : 500;
  // метки переиспользуем по значению: при перемасштабе они плавно переезжают (transition .6 с, lastq-031), а не мигают
  const host = $("ticks"), keep = new Set();
  for (let v = Math.ceil(trk.lo / step) * step; v <= trk.hi; v += step) {
    keep.add(String(v));
    let t = host.querySelector(`.tick[data-v="${v}"]`);
    if (!t) {
      t = document.createElement("div");
      t.dataset.v = String(v);
      t.innerHTML = `<span>${lqNum(v)}</span>`;
      // по возрастанию значения (последняя метка — крайняя справа, на неё завязан CSS); существующие не двигаем
      const after = Array.from(host.children).find((x) => Number(x.dataset.v) > v);
      host.insertBefore(t, after || null);
    }
    t.className = "tick" + (v === 0 ? " zero" : "");
    t.style.left = pct(v) + "%";
  }
  host.querySelectorAll(".tick").forEach((t) => { if (!keep.has(t.dataset.v)) t.remove(); });
}
const xOf = (score) => ((score - trk.lo) / (trk.hi - trk.lo)) * 100;
// счёт, который шкала должна показывать сейчас: прибавку раскрытия — после гонга, отлёты — по одному в такт приговору,
// финал — по шагам раскрытия ставок
function trackTargets() {
  const now = lqNow();
  const out = {};
  const ph = state.phase;
  for (const p of state.players) {
    let s = p.score;
    if (ph === "reveal" && state.gain && state.gain[p.id] && now < state.phaseStart + 1300) s -= state.gain[p.id];
    if (ph === "verdict" && state.verdict) {
      const i = (state.verdict.burned || []).indexOf(p.id);
      if (i >= 0 && now < knockAt(i)) s -= (state.verdict.delta || {})[p.id] || 0;
    }
    if (ph === "freveal" && state.fsteps) {
      const i = state.fsteps.findIndex((x) => x.id === p.id);
      if (i >= 0 && now >= state.phaseStart + FSTEP_MS * i + 1500) s = state.fsteps[i].after;
    }

}
function syncTrack() {
  // шкала видна всегда, кроме лобби: и в итогах — там она и есть финиш
  const inGame = state && state.phase !== "lobby";
  track.classList.toggle("off", !inGame);
  if (!inGame) { trk = null; return; }
  const inCell = state.phase === "cell" || state.phase === "fcell";
  const jailed = new Set(inCell ? (state.cell || []).filter((x) => !x.escaped).map((x) => x.id) : []);
  const ids = state.players.filter((p) => !p.left).map((p) => p.id);
  if (!trk || trk.game !== state.game || trk.ids.join(",") !== ids.join(",")) buildTrack(ids);
  const target = trackTargets();
  const [lo, hi] = trackDomain(ids.map((id) => target[id]));
  // шкала только расширяется: сжатие двигало бы всех без повода
  if (lo < trk.lo || hi > trk.hi) { trk.lo = Math.min(lo, trk.lo); trk.hi = Math.max(hi, trk.hi); drawScale(); for (const id of ids) if (trk.toks[id]) trk.toks[id].x = null; }
  ids.forEach((id) => {
    const tok = $("tk_" + id);
    if (!tok) return;
    const s = target[id];
    const cur = trk.toks[id];
    const x = xOf(s);
    const ln = $("ln_" + id);
    if (ln) ln.classList.toggle("off", !(player(id) || {}).online);
    tok.classList.toggle("jailed", jailed.has(id));
    if (!cur) { trk.toks[id] = { x, score: s }; tok.style.left = x + "%"; tok.classList.toggle("sunk", s < 0); setScore(id, s, s); return; }
    if (cur.score === s && cur.x === x) return;
    const fromX = cur.x == null ? parseFloat(tok.style.left) || x : cur.x;
    const knock = s < cur.score;
    moveTok(tok, fromX, x, knock, s - cur.score, id);
    setScore(id, cur.score, s);
    cur.x = x;
    cur.score = s;
  });
}
function setScore(id, from, to) {
  const sc = document.querySelector(`#ln_${CSS.escape(id)} .sc`);
  if (!sc) return;
  sc.classList.toggle("neg", to < 0);
  if (from === to || matchMedia("(prefers-reduced-motion: reduce)").matches) { sc.textContent = lqNum(to); return; }
  const t0 = performance.now(), dur = 900;
  const step = () => {
    const k = Math.min(1, (performance.now() - t0) / dur);
    sc.textContent = lqNum(Math.round((from + (to - from) * (1 - Math.pow(1 - k, 3))) / 10) * 10);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function moveTok(tok, fromX, toX, knock, delta, id) {

  // ниже нуля — по пояс в песке; после отлёта песок «насыпается», когда аватар приземлился
  const sunk = (trk.toks[id] ? trk.toks[id].score : 0) + delta < 0;
  clearTimeout(tok.sunkT);
  if (knock && !still) { tok.classList.remove("sunk"); tok.sunkT = setTimeout(() => tok.classList.toggle("sunk", sunk), 950); }
  else tok.classList.toggle("sunk", sunk);
  const road = $("lr_" + id);
  if (!still) {
    if (knock) {
      // отлёт: подлёт вверх с кувырком, перелёт за цель, отскок
      const over = Math.max(0, toX - Math.max(1.5, (fromX - toX) * 0.12));
      tok.animate([
        { left: fromX + "%", transform: "translateY(0) rotate(0)" },
        { left: (fromX + toX) / 2 + "%", transform: "translateY(-70%) rotate(-200deg)", offset: 0.45 },
        { left: over + "%", transform: "translateY(0) rotate(-360deg)", offset: 0.75 },
        { left: (toX + 0.8) + "%", transform: "translateY(-18%) rotate(-360deg)", offset: 0.88 },
        { left: toX + "%", transform: "translateY(0) rotate(-360deg)" },
      ], { duration: 1100, easing: "cubic-bezier(.25,.6,.35,1)" });
      setTimeout(() => dust(road, toX), 800);
      // дорожка вспыхивает красным в момент приземления — отлёт видно и краем глаза
      if (road) road.animate([{ backgroundColor: "rgba(255, 107, 79, .55)" }, { backgroundColor: "rgba(255, 107, 79, 0)" }], { duration: 700, delay: 750, easing: "ease-out" });
      lqSfx.whoosh();
