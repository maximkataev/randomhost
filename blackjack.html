<style>
  /* Пульт блэкджека: тот же мир, что у стола (синее сукно, золото, Inter Tight + Bodoni Moda для «21», переменные --bj-* из
     blackjack-table.css), но это пульт, а не копия стола: крупные свои карты, четыре кнопки с подписями, строка Марго.
     Каждая фаза — без скролла на 360×640; кнопки не ниже 56 px. Без `?.`, `??`, spread в объектах. */
  :root {
    --surface: #1a0a0d; --surface-2: #26100f; --line: rgba(212, 175, 55, .22); --line-2: rgba(212, 175, 55, .5);
    --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bj-bg); color: var(--bj-ivory); font: 500 17px/1.3 var(--bj-text); }
  body { overscroll-behavior-y: contain; }
  /* в игре страница прибита: фокус в поле чата (шторка) иначе прокручивал документ, и пульт уезжал вверх */
  body.m-game { position: fixed; left: 0; right: 0; top: 0; bottom: 0; height: 100dvh; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--bj-gold-hi); }
  .hidden { display: none !important; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; width: 100%; border: 1px solid var(--bj-gold); background: var(--bj-gold); color: var(--bj-ink); font: 700 19px/1 var(--bj-cond); letter-spacing: .12em; text-transform: uppercase; padding: 0 18px; text-decoration: none; transition: transform .15s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; }
  .btn.ghost { background: var(--surface); color: var(--bj-gold-hi); border-color: var(--line-2); }
  .btn.red { background: var(--bj-red); border-color: var(--bj-red); color: #fff; }
  .link { background: none; border: 0; color: var(--bj-gold-hi); font: 600 15px/1 var(--bj-cond); letter-spacing: .06em; text-decoration: underline; padding: 12px; min-height: 44px; }

  /* ---------- меню рандомайзеров и верхняя полоса ---------- */
  .menu-wrap { position: fixed; top: calc(8px + var(--safe-top)); left: 10px; z-index: 1000; }
  .menu-btn { width: 40px; height: 40px; border: 1px solid var(--line-2); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; }
  .menu-btn span { width: 18px; height: 2px; background: var(--bj-gold-hi); transition: transform .2s ease, opacity .2s ease; }
  .menu-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .menu-btn.open span:nth-child(2) { opacity: 0; }
  .menu-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .menu-drop { position: absolute; top: 46px; left: 0; min-width: 260px; padding: 8px 0; background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 10px 30px rgba(0, 0, 0, .6); display: flex; flex-direction: column; max-height: calc(100dvh - 80px); overflow-y: auto; opacity: 0; visibility: hidden; transition: opacity .12s, visibility .12s; }
  .menu-drop.open { opacity: 1; visibility: visible; }
  .menu-drop::before { content: attr(data-heading); display: block; padding: 2px 16px 6px; color: var(--bj-muted); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
  .menu-drop a { color: var(--bj-ivory); font-size: 15px; padding: 8px 16px; white-space: nowrap; text-decoration: none; }
  .menu-drop a:hover { background: var(--surface-2); }
  .util { position: fixed; top: calc(8px + var(--safe-top)); left: 58px; z-index: 30; display: flex; gap: 8px; align-items: center; }
  .util a { font: 600 15px/1 var(--bj-cond); letter-spacing: .08em; color: var(--bj-muted); text-decoration: none; padding: 0 4px; display: inline-flex; align-items: center; min-height: 40px; }
  .sound-toggle-btn { width: 40px; height: 40px; border: 1px solid var(--line-2); background: var(--surface); color: var(--bj-gold); padding: 0; display: grid; place-items: center; }
  .sound-toggle-btn svg { width: 55%; height: 55%; }
  body.m-game .util, body.m-game .menu-wrap, body.m-game .lang-switch { display: none !important; }
  .conn { position: fixed; left: 50%; top: 0; transform: translate(-50%, -110%); z-index: 50; background: var(--bj-red); color: #fff; font: 700 15px/1 var(--bj-cond); letter-spacing: .1em; text-transform: uppercase; padding: 8px 14px; transition: transform .3s; }
  .conn.on { transform: translate(-50%, 0); }
  .toast { position: fixed; left: 50%; top: calc(58px + var(--safe-top)); transform: translate(-50%, -10px); z-index: 60; background: var(--bj-ivory); color: var(--bj-ink); font: 600 16px/1.2 var(--bj-cond); padding: 10px 14px; max-width: 90vw; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .langhint { position: fixed; left: 50%; top: calc(56px + var(--safe-top)); transform: translateX(-50%); z-index: 45; display: none; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line-2); padding: 8px 10px; font-size: 13px; }
  .langhint.on { display: flex; }
  .langhint button { background: var(--bj-gold); color: var(--bj-ink); border: 0; font: 700 15px/1 var(--bj-cond); padding: 8px 10px; }
  .langhint button.no { background: transparent; color: var(--bj-muted); }

  /* ---------- стартовый экран ---------- */
  .landing { max-width: 520px; margin: 0 auto; padding: calc(60px + var(--safe-top)) 18px 40px; }
  .eyebrow { font: 600 14px/1 var(--bj-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--bj-muted); }
  .landing h1 { margin: 10px 0 8px; font: 800 54px/1 var(--bj-ui); letter-spacing: -.02em; color: var(--bj-ivory); }
  .landing h1 em { font-style: normal; color: var(--bj-gold-hi); }
  .landing .lede { margin: 0 0 18px; font-size: 16px; line-height: 1.45; color: #c7cbd6; }
  .landing .lede b { color: var(--bj-ivory); }
  .hero { position: relative; height: 170px; margin: 6px 0 18px; background: radial-gradient(ellipse at 50% 30%, var(--bj-felt-hi), var(--bj-felt) 55%, var(--bj-felt-lo)); border: 1px solid var(--line-2); box-shadow: inset 0 0 0 5px #4a0f1a, inset 0 0 0 7px #d9ae44, inset 0 0 30px 8px rgba(0, 12, 6, .5); overflow: hidden; }
  .hero .pcard { position: absolute; left: 50%; top: 50%; --bj-card-w: 86px; --bj-card-h: 120px; width: 86px; height: 120px; margin: -60px 0 0 -43px; }
  .hero .sign { position: absolute; left: 14px; top: 10px; font: 500 34px/1 var(--bj-sign); color: var(--bj-neon-warm); text-shadow: 0 0 12px rgba(255, 215, 122, .7); }
  .hero .pays { position: absolute; right: 10px; bottom: 8px; font: 600 10px/1 var(--bj-ui); letter-spacing: .12em; color: var(--bj-print); }
  .cta { display: grid; gap: 10px; }
  .cta .sub2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--bj-muted); }
  .codeform { display: flex; gap: 8px; width: 100%; }
  .codeform input { flex: 1; min-width: 0; height: 56px; background: var(--surface); border: 1px solid var(--line-2); color: var(--bj-ivory); font: 700 22px/1 var(--bj-cond); letter-spacing: .14em; text-transform: uppercase; padding: 0 14px; }
  .codeform .btn { width: auto; }
  .rules { display: grid; gap: 10px; margin: 22px 0 10px; }
  .rules .r { display: flex; gap: 12px; align-items: center; font-size: 14px; line-height: 1.35; color: #c7cbd6; }
  .rules .r i { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font: 800 15px/1 var(--bj-cond); color: var(--bj-ink); background: var(--bj-gold); }
  .fine { font-size: 12px; color: var(--bj-muted); }
  .solo { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }

  /* ---------- вход, центр ---------- */
  .center, .enter { max-width: 440px; margin: 0 auto; padding: calc(70px + var(--safe-top)) 18px 40px; text-align: center; }
  .center h2, .enter h2 { margin: 0 0 10px; font: 700 30px/1.1 var(--bj-serif); }
  .center p { color: #c7cbd6; font-size: 15px; line-height: 1.45; }
  .placecard { padding: 22px 16px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--line); margin-bottom: 14px; }
  .placecard .room { font: 700 34px/1 var(--bj-cond); letter-spacing: .18em; color: var(--bj-gold-hi); margin-bottom: 14px; }
  .fld { position: relative; }
  .fld input { width: 100%; height: 56px; background: var(--bj-ink); border: 1px solid var(--line-2); color: var(--bj-ivory); font: 600 20px/1 var(--bj-cond); padding: 0 14px; }
  .fld .cnt { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 600 14px/1 var(--bj-cond); color: var(--bj-muted); font-style: normal; }
  .fld .cnt[data-state="full"] { color: var(--bj-lose); }
  .err { min-height: 20px; color: var(--bj-lose); font-size: 14px; margin: 8px 0; }
  .claimbtns { display: grid; gap: 8px; margin-top: 14px; }
  .lobby-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
  .lobby-list span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; border: 1px solid rgba(255, 255, 255, .1); border-left: 3px solid var(--c); background: var(--surface); font-weight: 600; font-size: 14px; }
  .lobby-list span.me { border-color: var(--bj-gold); }
  .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #111; font: 800 13px/1 var(--bj-cond); flex: none; }
  .av.em { font-size: 16px; }
  .howto { text-align: left; display: grid; gap: 8px; margin: 14px 0; font-size: 14px; color: #c7cbd6; }
  .howto div { display: flex; gap: 10px; align-items: flex-start; }
  .howto i { font-style: normal; flex: none; width: 24px; }

  /* ---------- игра: каркас ---------- */
  .game { display: flex; flex-direction: column; overflow: hidden; height: 100dvh; padding: calc(6px + var(--safe-top)) 10px calc(6px + var(--safe-bottom)); }
  .top { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 46px; border-bottom: 1px solid var(--line); }
  .top .stack { font: 700 24px/1 var(--bj-num); color: var(--bj-gold-hi); font-variant-numeric: tabular-nums; }
  .top .stack small { display: block; font: 600 12px/1 var(--bj-cond); letter-spacing: .18em; text-transform: uppercase; color: var(--bj-muted); margin-bottom: 3px; }
  .top .mid { text-align: center; font: 600 14px/1.2 var(--bj-cond); letter-spacing: .1em; text-transform: uppercase; color: var(--bj-muted); }
  .top .mid b { display: block; font: 700 16px/1 var(--bj-cond); letter-spacing: .04em; text-transform: none; color: var(--bj-ivory); margin-top: 2px; }
  .top .tm { text-align: right; font: 700 24px/1 var(--bj-num); font-variant-numeric: tabular-nums; color: var(--bj-ivory); }
  .top .tm.hot { color: var(--bj-red); animation: pulse .5s infinite alternate; }
  .top .tm small { display: block; font: 600 12px/1 var(--bj-cond); letter-spacing: .18em; text-transform: uppercase; color: var(--bj-muted); margin-bottom: 3px; }
  .tbar { flex: none; height: 3px; background: rgba(255, 255, 255, .08); margin-bottom: 6px; }
  .tbar i { display: block; height: 100%; width: 0; background: var(--bj-gold); transition: width .25s linear; }
  .tbar i.hot { background: var(--bj-red); }
  @keyframes pulse { from { opacity: 1; } to { opacity: .55; } }
  .main { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .note { font: 600 15px/1.25 var(--bj-cond); color: var(--bj-muted); text-align: center; min-height: 16px; }
  .note.warn { color: var(--bj-lose); }
  .dock { flex: none; display: flex; gap: 6px; align-items: center; justify-content: space-between; min-width: 0; overflow: hidden; height: 54px; padding-top: 5px; border-top: 1px solid var(--line); }
  .dock .tab { height: 46px; min-width: 46px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; font: 700 16px/1 var(--bj-cond); letter-spacing: .06em; display: flex; align-items: center; justify-content: center; gap: 5px; flex: none; font-size: 20px; }
  .dock .tab .n { background: var(--bj-gold); color: var(--bj-ink); font-size: 12px; padding: 2px 5px; }
  .dock .mface { width: 48px; height: 48px; flex: none; }
  .rpanel { position: fixed; right: 10px; bottom: calc(66px + var(--safe-bottom)); z-index: 35; display: none; gap: 6px; padding: 8px; background: var(--surface); border: 1px solid var(--bj-gold); box-shadow: 0 10px 30px rgba(0, 0, 0, .7); }
  .rpanel.on { display: flex; }
  .rpanel button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font-size: 22px; padding: 0; }
  .rpanel button:active { transform: scale(1.25); }
  .fly-emoji { position: fixed; z-index: 70; font-size: 28px; pointer-events: none; animation: flyup 1s ease-out forwards; }
  @keyframes flyup { to { transform: translateY(-90px) scale(1.4); opacity: 0; } }

  /* ---------- сукно: игровая зона от карты Марго до бокса ---------- */
  .pcard { position: relative; width: var(--bj-card-w); height: var(--bj-card-h); flex: none; }
  .pcard .bj-card { position: absolute; }
  .felt { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; margin-bottom: 6px; overflow: hidden;
    border: 1px solid #b8902f; box-shadow: inset 0 0 0 6px #4a0f1a, inset 0 0 0 7px #0b0205, inset 0 0 0 9px #d9ae44, inset 0 0 36px 10px rgba(0, 12, 6, .55), 0 0 0 2px #4a3410, 0 10px 30px rgba(0, 0, 0, .7);
    background: radial-gradient(ellipse at 50% 34%, rgba(255, 226, 160, .2), rgba(255, 226, 160, 0) 60%), radial-gradient(ellipse at 50% 18%, var(--bj-felt-hi), var(--bj-felt) 55%, var(--bj-felt-lo)); }
  /* тканевая текстура: две сетки тонких линий, как feTurbulence на доске, только дешевле */
  .felt::before { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; opacity: .18;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 3px); }
  .felt .print { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font: 600 11px/1 var(--bj-ui); letter-spacing: .14em; color: var(--bj-print); pointer-events: none; }
  .felt .print small { display: block; margin-top: 5px; font-size: 8px; letter-spacing: .26em; opacity: .8; }
  .felt.is-bet .print { top: auto; bottom: 108px; }
  .drail { flex: none; position: relative; z-index: 1; min-height: 66px; display: flex; align-items: center; gap: 12px; padding: 5px 10px;
    background: linear-gradient(#2a1a10, #17100a 60%, #0e0806); border-bottom: 2px solid var(--bj-gold-dk); box-shadow: 0 6px 12px rgba(0, 0, 0, .5); }
  .drail .dcards { display: flex; --bj-card-w: 44px; --bj-card-h: 62px; }
  .drail .dcards .pcard { margin-left: -16px; }
  .drail .dcards .pcard:first-child { margin-left: 0; }
  .drail .dsc { font: 700 13px/1.2 var(--bj-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--bj-muted); }
  .drail .dsc b { display: block; font: 700 26px/1 var(--bj-cond); letter-spacing: 0; color: var(--bj-neon); text-shadow: 0 0 10px rgba(159, 232, 255, .5); margin-top: 3px; }
  .drail .dsc b.bust { color: var(--bj-lose); text-shadow: none; }
  .drail .dnote { flex: 1; font: 600 16px/1.25 var(--bj-cond); color: var(--bj-ivory); text-align: center; }
  .drail .dnote.warn { color: var(--bj-lose); }
  .drail .dnote small { display: block; font: 600 12px/1 var(--bj-cond); letter-spacing: .2em; text-transform: uppercase; color: var(--bj-muted); margin-bottom: 4px; }
  .pulse-back { animation: backpulse 1.1s ease-in-out infinite; }
  @keyframes backpulse { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.08); filter: brightness(1.4); } }
  .fanarea { flex: 1; min-height: 0; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 8px 8px 0; }
  .hands { display: flex; gap: 8px; width: 100%; justify-content: center; align-items: flex-end; }
  .hand { display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 4px 2px 0; border: 1px solid transparent; }
  .hand.two { flex: 1; border-color: rgba(212, 175, 55, .3); background: rgba(8, 24, 14, .35); }
  .hand.two.active { border-color: var(--bj-gold); }
  /* веер своих карт: ширина ~75% экрана, карты повёрнуты от центра */
  .fan { --cw: min(27vw, 106px); --ch: calc(var(--cw) * 1.4); position: relative; height: calc(var(--ch) + 8px); width: calc(var(--cw) + (var(--n) - 1) * var(--cw) * .52); max-width: 100%; }
  .fan.sm { --cw: min(19vw, 72px); }
  .fan .pcard { position: absolute; left: calc(var(--i) * var(--cw) * .52); top: 6px; --bj-card-w: var(--cw); --bj-card-h: var(--ch); width: var(--cw); height: var(--ch); transform: rotate(var(--r)); transform-origin: 50% 118%; animation: cardin .35s var(--bj-fly) both; }
  @keyframes cardin { from { transform: translate(60px, -50px) rotate(12deg); opacity: 0; } to { transform: rotate(var(--r)); opacity: 1; } }
  .score { position: relative; font: 700 42px/1 var(--bj-num); font-variant-numeric: tabular-nums; color: var(--bj-neon); text-shadow: 0 0 4px rgba(159, 232, 255, .9), 0 0 14px rgba(47, 208, 140, .8), 0 0 30px rgba(47, 208, 140, .5); margin-top: 2px; }
  .score.gold { color: var(--bj-gold-hi); text-shadow: 0 0 5px rgba(243, 221, 138, .95), 0 0 16px rgba(212, 175, 55, .9), 0 0 36px rgba(212, 175, 55, .6); animation: scoreflash 1s ease-in-out 3; }
  @keyframes scoreflash { 50% { transform: scale(1.16); filter: brightness(1.5); } }
  .score.bust { color: #a99d92; text-shadow: none; }
  .score svg.crack { position: absolute; left: -14%; top: -12%; width: 128%; height: 124%; pointer-events: none; }
  .score svg.crack path { fill: none; stroke: var(--bj-lose); stroke-width: 3; stroke-linejoin: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: crack .4s ease-out .1s forwards; }
  @keyframes crack { to { stroke-dashoffset: 0; } }
  .hand.two .score { font-size: 30px; }
  .scsub { font: 600 14px/1.2 var(--bj-cond); color: #b9c2d4; text-align: center; min-height: 14px; text-shadow: 0 1px 2px #000; }
  .decided { font: 700 14px/1 var(--bj-cond); letter-spacing: .14em; text-transform: uppercase; color: var(--bj-gold-hi); margin-top: 4px; min-height: 12px; }
  .watch { font: 600 17px/1.3 var(--bj-serif); color: var(--bj-ivory); text-align: center; margin: 6px 0 2px; text-shadow: 0 1px 3px #000; }
  .watch small { display: block; font: 600 13px/1.3 var(--bj-cond); letter-spacing: .1em; text-transform: uppercase; color: #b9c2d4; font-style: normal; }
  /* бокс: золотой круг со столбиком фишек в твоём цвете, по бокам — побочные круги PP и 21+3 */

<script>
"use strict";
const params = new URLSearchParams(location.search);
// код идёт в разметку — только алфавит кодов, иначе ?r=<img onerror> даёт XSS
const CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const app = document.getElementById("app");
const T = (k) => bjT(k);
const tpl = (k, v) => bjTpl(k, v);
const lang = () => bjLang();

let conn = null, state = null, me = null, token = null, dead = false, screen = null, joinErr = null;
const tokenKey = () => "blackjack-token-" + CODE;
try { token = localStorage.getItem(tokenKey()); } catch (e) {}
const mpOn = () => !!(window.MP && !MP.off);
const NAME_LIMIT = () => (window.MP && MP.limits && MP.limits.name) || 15;

// ---------- меню рандомайзеров ----------
(function () {
  const b = document.getElementById("menuBtn"), d = document.getElementById("menuDrop");
  b.onclick = (e) => { e.stopPropagation(); const on = !d.classList.contains("open"); d.classList.toggle("open", on); b.classList.toggle("open", on); b.setAttribute("aria-expanded", String(on)); };
  document.addEventListener("click", () => { d.classList.remove("open"); b.classList.remove("open"); });
})();

function screenMode(m) {
  if (document.body.classList.contains("m-game") !== (m === "game")) scrollTo(0, 0);
  document.body.classList.toggle("m-game", m === "game");
}
let toastT = null;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove("on"); }, 2200);
}
function avHtml(p, cls) {
  const a = p.avatar || "";
  const em = a && a.length <= 4 && !/^[\w\s]+$/.test(a);
  return `<span class="av${em ? " em" : ""}${cls ? " " + cls : ""}" style="${bjChipVars(p.color || "#d4af37")}">${escapeHtml(em ? a : initials(p.name))}</span>`;
}
// карта как DOM-элемент рендерера (SVG-спрайт), в обёртке своего размера
function cardEl(card, down, cls) {
  const w = el("div", "pcard" + (cls ? " " + cls : ""));
  const c = BJCards.element(card || { r: "A", s: "s" }, { down: !!down });
  w.appendChild(c);
  return w;
}

// ---------- стартовый экран ----------
function renderLanding() {
  screen = "landing";
  screenMode(null);
  app.innerHTML = `<div class="landing">
    <div class="eyebrow">${T("eyebrow")}</div>
    <h1>${T("h1_a")}<em>${T("h1_b")}</em></h1>
    <p class="lede">${T("lede")}</p>
    <div class="hero" id="hero"><div class="sign">21</div><div class="pays">BLACKJACK PAYS 3 TO 2</div></div>
    <div class="cta">
      <button class="btn" id="create">${T("btn_create")}</button>
      <div class="sub2"><span>${T("cta_sub")}</span><button class="link" id="havecode">${T("have_code")}</button></div>
    </div>
    <div class="rules">
      <div class="r"><i>21</i><div>${T("rule1")}</div></div>
      <div class="r"><i>×2</i><div>${T("rule2")}</div></div>
      <div class="r"><i>↑</i><div>${T("rule3")}</div></div>
    </div>
    <div class="fine">${T("fine")}</div>
    <div class="solo"><div class="fine" style="margin-bottom:8px">${T("solo_title")}</div><a class="btn ghost" href="blackjack-solo.html">${T("btn_solo")}</a></div>
  </div>`;
  // три карты веером: туз, король и рубашка
  const hero = document.getElementById("hero");
  [[{ r: "A", s: "s" }, -16], [{ r: "K", s: "h" }, 0], [null, 16]].forEach(([c, rot], i) => {
    const w = cardEl(c || { r: "A", s: "s" }, !c);
    w.style.transform = `translate(${(i - 1) * 36}px, ${i === 1 ? -8 : 0}px) rotate(${rot}deg)`;
    hero.appendChild(w);
  });
  document.getElementById("create").onclick = async () => {
    const btn = document.getElementById("create");
    btn.disabled = true;
    btn.textContent = T("btn_creating");
    try {
      const res = await fetch("/blackjack/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: lang() } }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "error");
      try { localStorage.setItem("blackjack-host-" + data.code, data.hostToken); } catch (e) {}
      location.href = `blackjack-board.html?r=${data.code}`;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = T("btn_create");
      toast(String(err.message || err));
    }
  };
  document.getElementById("havecode").onclick = () => {
    const sub = document.querySelector(".landing .sub2");
    sub.innerHTML = codeFormHtml("");
    bindCodeForm();
    document.getElementById("codein").focus();
  };
}
function normCode(raw) {
  if (window.MP && MP.roomGone) return MP.roomGone.normalize(raw);
  return String(raw || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
}
function codeFormHtml(value) {
  return `<form class="codeform" id="codeform" autocomplete="off"><input id="codein" maxlength="24" value="${escapeHtml(value)}" placeholder="${escapeHtml(T("prompt_code"))}" aria-label="${escapeHtml(T("prompt_code"))}" autocapitalize="characters" enterkeyhint="go"><button class="btn" type="submit">${T("btn_go")}</button></form>`;
}
function bindCodeForm() {
  document.getElementById("codeform").onsubmit = (e) => {
    e.preventDefault();
    const c = normCode(document.getElementById("codein").value);
    if (c) location.href = `blackjack.html?r=${encodeURIComponent(c)}`;
  };
}

// ---------- вход: MP.joinFlow («Это ты?») и MP.replacedTab ----------
let flow = null, tab = null, joinName = "", claimPrompt = null, renamedTo = null;
function savedName() { try { return localStorage.getItem("blackjack-name") || ""; } catch (e) { return ""; } }
function buildJoin() {
  const m = { type: "join" };
  if (joinName) m.name = joinName;
  // токен берём свежий: другая вкладка могла выдать новый (подхват по имени), прежний уже отозван
  try { const t = localStorage.getItem(tokenKey()); if (t) token = t; } catch (e) {}
  if (token) m.token = token;
  return m;
}
function doJoin(extra) {
  if (flow && flow.join(extra)) return;
  const m = buildJoin();
  if (extra) for (const k in extra) m[k] = extra[k];
  conn.send(m);
}
function renderClaim() {
  if (!claimPrompt) return;
  screen = "claim";
  const c = claimPrompt;
  const st = c.summary && typeof c.summary.stack === "number" ? c.summary.stack : null;
  const text = st == null ? tpl("claim_text0", { name: c.name }) : tpl("claim_text", { name: c.name, n: bjNum(st) });
  renderCenter("claim_title", null, `<p>${escapeHtml(text)}</p><div class="claimbtns"><button class="btn" id="claimyes" type="button">${T("btn_claim_yes")}</button><button class="link" id="claimno" type="button">${T("btn_claim_no")}</button></div>`);
  document.getElementById("claimyes").onclick = () => { const p = claimPrompt; claimPrompt = null; screen = null; if (p) p.accept(); };
  document.getElementById("claimno").onclick = () => { const p = claimPrompt; claimPrompt = null; screen = null; if (p) p.decline(); };
}
function renderEnter() {
  screen = "enter";
  screenMode(null);
  const saved = savedName();
  app.innerHTML = `<form class="enter" id="enterform" autocomplete="off">
    <div class="placecard">
      <div class="room">${escapeHtml(CODE)}</div>
      <h2>${T("enter_title")}</h2>
      <div class="fld"><input id="name" maxlength="${NAME_LIMIT()}" placeholder="${escapeHtml(T("enter_ph"))}" value="${escapeHtml(saved)}" enterkeyhint="go" aria-label="${escapeHtml(T("enter_ph"))}"><em class="cnt" id="namecnt"></em></div>
    </div>
    <div class="err" id="err">${joinErr ? escapeHtml(T(joinErr)) : ""}</div>
    <button class="btn" type="submit">${T("btn_join")}</button>
  </form>`;
  const input = document.getElementById("name");
  if (mpOn()) MP.nameCounter(input, NAME_LIMIT(), { el: document.getElementById("namecnt") });
  document.getElementById("enterform").onsubmit = (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) { document.getElementById("err").textContent = T("err_name"); return; }
    try { localStorage.setItem("blackjack-name", name); } catch (e2) {}
    joinErr = null;
    joinName = name;
    doJoin();
  };
}
function renderCenter(titleKey, textKey, extra) {
  screenMode(null);
  app.innerHTML = `<div class="center"><h2>${T(titleKey)}</h2>${textKey ? `<p>${T(textKey)}</p>` : ""}${extra || ""}</div>`;
}
function renderNoRoom() {
  dead = true; screen = "noroom";
  renderCenter("noroom_title", "noroom_text", codeFormHtml(CODE) + `<a class="link" href="blackjack.html">${T("expired_new")}</a>`);
  bindCodeForm();
}
const goneFlow = window.MP && MP.roomGone ? MP.roomGone({ showForm: renderNoRoom, onClosed: () => renderExpired() }) : null;
function onRoomGone() { if (goneFlow) goneFlow.gone(); else renderExpired(); }
function renderExpired() {
  dead = true; screen = "expired";
  try { localStorage.removeItem(tokenKey()); } catch (e) {}
  renderCenter("expired_title", "expired_text", `<a class="btn" href="blackjack.html">${T("expired_new")}</a>`);
}
function renderKicked() {
  const again = state && state.phase === "lobby";
  const key = "k:" + again + ":" + lang();
  if (app.dataset.key === key) return;
  app.dataset.key = key;
  renderCenter("kicked_title", null, again ? `<button class="btn" id="sitagain">${T("kicked_again")}</button>` : "");
  if (again) document.getElementById("sitagain").onclick = () => { screen = null; app.dataset.key = ""; joinErr = null; renderEnter(); };
}

// ---------- игрок, ставки, очередь отправки ----------
const player = (id) => state && state.players.find((p) => p.id === id);
const mine = () => player(me);
let myBets = { main: 0, pp: 0, tp: 0 }, undo = [], pendingUntil = 0, chipIdx = 0, box = "main", lastHand = -1;
const betSum = (b) => (b.main || 0) + (b.pp || 0) + (b.tp || 0);
function minBet() { const p = mine(); return Math.max(1, p && p.need ? p.need : state ? state.minBet : 10); }
function denominations() {
  const min = Math.max(1, state ? state.minBet : 10);
  const p = mine();
  if (p && !p.out && p.stack > 0 && p.stack < min) {
    const st = p.stack;
    return [st]; // §5: безштрафна только ставка «всё»
  }
  return [1, 2, 5, 10, 25].map((k) => k * min);
}
function canBet() { const p = mine(); return state && state.phase === "betting" && p && !p.out && !p.spectator && p.stack > 0; }

// Действия без связи не теряем (память «Потерянные тапы»): не ушло — в очередь MP.sendQueue до возврата связи;
// ушло, но в снимке не появилось — через 1,5 с повтор, до трёх раз. Подтверждение — сам снимок.
let queued = {};
const QUEUED_TYPES = ["set_bets", "ready", "play_card", "insure", "decide", "chat", "hint"];
function qKeep(m) {
  if (!state) return false;
  const ph = state.phase;
  if (m.type === "set_bets" || m.type === "ready" || m.type === "play_card") return ph === "betting";
  if (m.type === "insure") return ph === "insurance";
  if (m.type === "decide") return ph === "deciding";
  if (m.type === "chat") return !!(state.settings && state.settings.chat);
  return true;
}
function qDrop(m, reason) { if (reason === "expired" || reason === "overflow") toast(T("conn_dropped")); }
const outq = window.MP && MP.sendQueue ? MP.sendQueue({
  send: (m) => conn.send(m), keep: qKeep, onDrop: qDrop,
  ceilingMs: { set_bets: 25000, ready: 25000, play_card: 20000, insure: 8000, decide: 14000, chat: 15000, "*": 20000 },
  replace: ["set_bets", "ready", "chat", "hint", "insure"],
  max: 8,
  probe: (ms) => { if (conn && conn.api) conn.api.probe(ms); },
}) : null;
const ackWatch = {};
let ackTimer = null;
function ackKey(m) { return m.type === "decide" ? "decide:" + m.hand : m.type; }
// сигнатура рук: сплит и пересдача меняют число рук/карт, а decision у новой руки пуст — ack по ней, не по decision
function handSig(p) { return state.wave + ":" + p.hands.map((x) => x.cards.length + "," + x.done).join("|"); }
function isAcked(m, p) {
  if (m.type === "set_bets") return p.bet === myBets.main && p.side.pp === myBets.pp && p.side.tp === myBets.tp;
  if (m.type === "ready") return !!p.ready === (m.ready !== false);
  if (m.type === "play_card") return !!p.played;
  if (m.type === "insure") return !!p.insDecided;
  if (m.type === "decide") { const h = p.hands[m.hand]; return !h || h.done || h.decision === m.action || state.phase !== "deciding" || handSig(p) !== m._sig; }
  return true;
}
function ackTick() {
  const keys = Object.keys(ackWatch);
  if (!keys.length) { clearInterval(ackTimer); ackTimer = null; return; }
  const p = mine();
  const now = Date.now();
  for (const k of keys) {
    const w = ackWatch[k];
    if (!state || !p || !qKeep(w.m) || isAcked(w.m, p)) { delete ackWatch[k]; continue; }
    if (outq && outq.has(w.m.type)) { delete ackWatch[k]; continue; }
    if (now - w.at < 2500) continue;
    const m = w.m.type === "set_bets" ? Object.assign({ type: "set_bets" }, myBets) : w.m;
    if (w.tries >= 3) { delete ackWatch[k]; if (outq) outq.push(m); continue; }
    w.tries++; w.at = now;
    toast(T("conn_resend"));
    conn.send(m);
  }
}
function sendQ(m) {
  if (m.type === "decide") { const pp = mine(); if (pp) m._sig = handSig(pp); }
  conn.send(m);
  if (QUEUED_TYPES.indexOf(m.type) >= 0 && m.type !== "chat" && m.type !== "hint") {
    ackWatch[ackKey(m)] = { m, at: Date.now(), tries: 0 };
    if (!ackTimer) ackTimer = setInterval(ackTick, 500);
  }
}
function onSendFail(m) {
  if (!m || QUEUED_TYPES.indexOf(m.type) === -1) return;
  delete ackWatch[ackKey(m)];
  if (!(outq && outq.push(m))) queued[ackKey(m)] = m;
  toast(T("conn_queued"));
}
function flushQueued() {
  if (outq && outq.size()) outq.flush(qKeep, qDrop);
  const q = queued; queued = {};
  for (const k in q) if (qKeep(q[k])) conn.send(q[k]);
}

// ---------- ставки ----------
function pushBets(next) {
  const p = mine();
  if (!p) return false;
  if (betSum(next) > p.stack) { toast(T("rj_no_money")); return false; }
  if (next.pp > next.main || next.tp > next.main) { toast(T("rj_over_main")); return false; }
  undo.push(myBets);
  if (undo.length > 60) undo.shift();
  myBets = next;
  pendingUntil = Date.now() + 1500;
  sendQ(Object.assign({ type: "set_bets" }, myBets));
  drawBetting();
  return true;
}
function addChip() {
  const p = mine();
  if (!p || !canBet()) return;
  const dens = denominations();
  const free = p.stack - betSum(myBets);
  let amt = dens[Math.min(chipIdx, dens.length - 1)];
  if (amt > free) amt = free;
  if (amt <= 0) { toast(T("rj_no_money")); return; }
  if (box !== "main" && !myBets.main) box = "main";
  const next = Object.assign({}, myBets);
  next[box] = (next[box] || 0) + amt;
  if (box !== "main" && next[box] > next.main) next[box] = next.main; // побочная не больше основной
  if (next[box] === myBets[box]) { toast(T("rj_over_main")); return; }
  if (pushBets(next)) { bjBuzz(8); if (window.BJSfx) BJSfx.play("chip"); }
}
function undoBet() {
  if (!canBet()) return;
  if (!undo.length) { toast(T("rj_empty")); return; }
  const prev = undo.pop();
  myBets = prev;
  pendingUntil = Date.now() + 1500;
  sendQ(Object.assign({ type: "set_bets" }, myBets));
  drawBetting();
}
function clearBets() { if (!canBet()) return; box = "main"; pushBets({ main: 0, pp: 0, tp: 0 }); }
function doubleBets() {
  const p = mine();
  if (!canBet() || !p) return;
  if (!betSum(myBets)) { toast(T("rj_empty")); return; }
  pushBets({ main: myBets.main * 2, pp: myBets.pp * 2, tp: myBets.tp * 2 });
}
function allIn() { if (!canBet()) return; pendingUntil = 0; sendQ({ type: "all_in" }); bjBuzz([10, 30, 10]); }
function repeatBet() { if (!canBet()) return; pendingUntil = 0; sendQ({ type: "repeat" }); }
function toggleReady() {
  const p = mine();
  if (!canBet() || !p) return;
  if (p.ready) { sendQ({ type: "ready", ready: false }); return; }
  const need = Math.min(p.need || state.minBet, p.stack);
  if (myBets.main < need && p.stack >= (p.need || state.minBet)) { openReadyConfirm(Math.max(0, need - myBets.main)); return; }
  sendQ({ type: "ready", ready: true });
  if (window.BJSfx) BJSfx.play("tap");
}
// «Готово» ниже минимума — подтверждение, а не молчаливый штраф
function openReadyConfirm(pen) {
  sheetRebuild = () => openReadyConfirm(pen);
  const yes = el("button", "btn red", T("ready_yes")), no = el("button", "btn", T("ready_no"));
  yes.type = no.type = "button";
  yes.onclick = () => { sendQ({ type: "ready", ready: true }); closeSheet(); };
  no.onclick = () => closeSheet();
  const g = el("div", "insbtns"); g.append(no, yes);
  openSheet([el("h3", null, "⚠"), el("p", "hint", tpl("ready_confirm", { n: bjNum(pen) })), g]);
}

// карта-пакость: тап — сыграть (себе сразу, соседу — выбрать цель), долгое нажатие — описание
let pressT = 0, pressed = false;
function trickButtons(p) {
  const wrap = el("div", "tricks");
  if (!state.settings.cards) { wrap.append(el("div", "tnote", T("tricks_off"))); return wrap; }
  const hand = (state.me && state.me.cards) || [];
  if (!hand.length) { wrap.append(el("div", "tnote", T("tricks_none"))); return wrap; }
  if (p.played) { wrap.append(el("div", "tnote", T("tricks_played"))); return wrap; }
  hand.forEach((c, i) => {
    const b = el("button", "trick");
    b.type = "button";
    b.innerHTML = `<span class="ic">${BJ_TRICKS[c].icon}</span><span>${escapeHtml(T("card_" + c))}</span>`;
    b.disabled = c === "shield" || !canBet();
    const start = () => { pressed = false; clearTimeout(pressT); pressT = setTimeout(() => { pressed = true; openTrickInfo(c); }, 480); };
    const end = () => { clearTimeout(pressT); };
    b.addEventListener("pointerdown", start);
    b.addEventListener("pointerup", end);
    b.addEventListener("pointercancel", end);
    b.addEventListener("pointerleave", end);
    b.addEventListener("contextmenu", (e) => e.preventDefault());
    b.onclick = () => { if (pressed) { pressed = false; return; } if (BJ_TRICKS[c].self) openTrickInfo(c, true); else openTargets(c); };
    wrap.append(b);
  });
  if (hand.length < 3) { const n = el("div", "tnote", T("tricks_hint")); wrap.append(n); }
  return wrap;
}
function openTrickInfo(card, play) {
  sheetRebuild = () => openTrickInfo(card, play);
  const h = el("h3", null, BJ_TRICKS[card].icon + " " + T("card_" + card));
  const d = el("p", "hint", T("card_" + card + "_d"));
  const nodes = [h, d];
  if (card === "shield") nodes.push(el("p", "hint", T("trick_shield_passive")));
  else if (play && canBet()) {
    const b = el("button", "btn", T("trick_self"));
    b.type = "button";
    b.onclick = () => { sendQ({ type: "play_card", card }); closeSheet(); toast(tpl("card_sent_self", { card: T("card_" + card) })); };
    nodes.push(b);
  }
  openSheet(nodes);
}
function openTargets(card) {
  sheetRebuild = () => openTargets(card);
  const h = el("h3", null, `${BJ_TRICKS[card].icon} ${T("card_" + card)} — ${T("trick_target")}`);
  const list = el("div", "list");
  for (const p of state.players.filter((x) => x.id !== me && !x.out && !x.left && !x.spectator)) {
    const b = el("button", "target");
    b.type = "button";
    b.innerHTML = `${avHtml(p)}<b>${escapeHtml(p.name)}</b><span class="s">${bjNum(p.stack)}</span>`;
    b.onclick = () => { sendQ({ type: "play_card", card, target: p.id }); closeSheet(); toast(tpl("card_sent", { card: T("card_" + card), name: p.name })); };
    list.append(b);
  }
  openSheet([h, el("p", "hint", T("card_" + card + "_d")), list]);
}
function openCoef(which) {
  sheetRebuild = () => openCoef(which);
  const h = el("h3", null, T(which + "_title"));
  const p = el("p", "hint", T(which + "_hint"));
  const g = el("div", "coef");
  const keys = which === "pp" ? ["pp_mixed", "pp_colored", "pp_perfect"] : ["tp_flush", "tp_straight", "tp_trips", "tp_straightFlush", "tp_suitedTrips"];
  for (const k of keys) { const [name, mult] = String(T(k)).split(" · "); const row = el("div"); row.append(el("span", null, name), el("b", null, mult || "")); g.append(row); }
  openSheet([h, p, g]);
}

let els = {};
function buildGame() {
  screen = "game";
  screenMode("game");
  app.dataset.key = "";
  app.innerHTML = `<div class="game">
    <div class="top"><div class="stack" id="stack"></div><div class="mid" id="mid"></div><div class="tm" id="tm"></div></div>
    <div class="tbar"><i id="tbar"></i></div>
    <div class="main" id="main"></div>
    <div class="dock" id="dock"></div>
  </div>`;
  els = { main: document.getElementById("main"), dock: document.getElementById("dock"), stack: document.getElementById("stack"), mid: document.getElementById("mid"), tm: document.getElementById("tm"), tbar: document.getElementById("tbar") };
  buildDock();
  mainKey = "";
}
function buildDock() {
  const cards = el("button", "tab");
  cards.type = "button";

  else if (Date.now() > pendingUntil) myBets = { main: p.bet || 0, pp: p.side.pp || 0, tp: p.side.tp || 0 };

  if (!CODE) return renderLanding();

function onMessage(m) {

    if (m.type === "hello" && goneFlow) goneFlow.hello();
    if (m.type === "hello" && MP.applyHello(m) === false) { flow = tab = null; }
    else if (tab && tab.handle(m)) return;
    else if (flow && flow.handle(m)) return;
  }
  switch (m.type) {
    case "hello":
    case "state":
      state = m.state;
      if (m.type === "hello" && token && !me) { joinName = joinName || savedName(); doJoin(); }
      else if (m.type === "hello" && !me && flow && flow.state().prompting) flow.resume();
      render();
      if (langFollow && screen !== "game") langFollow.check();
      break;
    case "joined":
      me = m.playerId;
      token = m.token;
      claimPrompt = null;
      if (m.name) {
        joinName = m.name;
        try { localStorage.setItem("blackjack-name", m.name); } catch (e) {}
        if (m.renamed) { renamedTo = m.name; toast(tpl("renamed_toast", { name: m.name })); }
      }
      try { localStorage.setItem(tokenKey(), token); } catch (e) {}
      if (!hintsOn()) conn.send({ type: "hint", on: false });
      render();
      flushQueued();
      break;
    case "rejected":
      toast(T("rj_" + m.reason) !== "rj_" + m.reason ? T("rj_" + m.reason) : m.reason);
      delete ackWatch[m.action === "decide" ? "decide:" + (m.hand || 0) : m.action];
      if (m.action === "chat" && chatPending !== null) { clearTimeout(chatCloseT); chatPending = null; }
      if (m.action === "set_bets" || m.action === "bet" || m.action === "all_in") { pendingUntil = 0; const p = mine(); if (p) myBets = { main: p.bet || 0, pp: p.side.pp || 0, tp: p.side.tp || 0 }; if (screen === "game" && state && state.phase === "betting") drawBetting(); }
      if (m.action === "decide") { decidedLocal = {}; mainKey = ""; render(); }
      break;
    case "error":
      if (m.error === "room_expired") return onRoomGone();
      if (m.error === "too_fast") { toast(T("rj_too_fast")); break; }
      if (["game_started", "room_full", "token_gone", "bad_name", "name_taken"].indexOf(m.error) >= 0) {
        if (m.error === "token_gone") { try { localStorage.removeItem(tokenKey()); } catch (e) {} token = null; }
        joinErr = m.error === "bad_name" ? "err_name" : "err_" + m.error;
        me = null;
        renderEnter();
      }
      break;
    case "kicked":
      me = null;
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
      token = null; screen = "kicked"; app.dataset.key = "";
      closeSheet();
      renderKicked();
      break;
    case "replaced":
      me = null; screen = "replaced";
      renderCenter("replaced_title", "replaced_text", `<button class="btn" id="here">${T("btn_back_here")}</button>`);
      document.getElementById("here").onclick = () => { if (tab && tab.back()) return; doJoin(); };
      break;
    case "event":
      if (m.event && m.event.type === "out" && m.event.playerId !== me) { const op = player(m.event.playerId); if (op) toast(tpl("out_toast", { name: op.name })); }
      break;
  }
}
function start() {
  if (!CODE) return renderLanding();

  conn = bjConnect({
    code: CODE,

  window.bjPhone = { send: (m) => conn.send(m), get state() { return state; }, get me() { return me; }, inject: (s) => { state = s; mainKey = ""; render(); } };
}
let langFollow = null;
function showLangHint(h) {
  const box = document.getElementById("langhint");

  box.textContent = "";

  const yes = el("button", null, T("lang_hint_yes")); yes.type = "button"; yes.onclick = () => { done(); h.accept(); };

}
if (window.MP) {

  });
}
