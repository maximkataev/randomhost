# Конфигурация nginx ХОСТА (не контейнера) — копия для восстановления.
#
# Живёт на сервере: /etc/nginx/sites-available/randomhostwebsite
#                   /etc/nginx/conf.d/websocket-upgrade.conf
# Деплоем НЕ раскатывается: этот файл здесь только для того, чтобы при гибели сервера
# не пришлось восстанавливать конфиг по памяти. Это была единственная часть инфраструктуры,
# существовавшая в одном экземпляре: ключ судьи лежит в Doppler, карточки в репозитории,
# volume с комнатами ценности не имеет.
#
# Лежит в auction/, а не в корне: корень целиком копируется в образ nginx и раздаётся наружу.
#
# Обновлять руками при изменениях на сервере. Дата снятия: 2026-09-23.
# Проверить после правки:
#   sudo nginx -t && sudo systemctl reload nginx
server {

    server_name randomhost.online www.randomhost.online;

    # Intercept upstream errors (so nginx can show our custom 404 page)
    proxy_intercept_errors on;

    # Use custom 404 page for 404 from upstream
    error_page 404 = /404.html;

    # Serve the custom 404 file from disk (not from upstream)
    location = /404.html {
        root /srv/www/randomhostwebsite;
        internal;
    }

    # приложение аукциона само отдаёт коды 404/410 в JSON — не подменяем их HTML-страницей
    location /auction/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_intercept_errors off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/randomhost.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/randomhost.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.randomhost.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = randomhost.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name randomhost.online www.randomhost.online;
    return 404; # managed by Certbot




}

# ---------- /etc/nginx/conf.d/websocket-upgrade.conf ----------
# WebSocket-апгрейд для проксируемых приложений: при обычных запросах — close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
