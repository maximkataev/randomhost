<style>
  /* Пульт: всё под большой палец. Заливка — цвет ходящей команды; поле на всю ширину, плитки тапаются сразу.
     Слова на узких плитках — сжатой гарнитурой (wdth 70), иначе длинные не читаются. */
  body { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
  .grid { --ws: 72%; --wd: 72; --gap: 5px; --bw: 3px; --tile-ar: 1.05 / 1; --band: 7px; }
  .util { display: flex; align-items: center; gap: 12px; height: calc(var(--lsc, 30px) * 2); padding: 0 var(--lsw, 150px) 0 14px; position: relative; z-index: 3; }
  .util a { color: var(--ink); text-decoration: none; font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; }
  @media (max-width: 380px) { .util a { font-size: 0; } .util a::before { content: "←"; font-size: 24px; } }
  .sound-toggle-btn { flex: none; margin-left: auto; width: calc(var(--lsh, 44px) * 1.25); height: var(--lsh, 44px); border: 3px solid var(--ink); border-radius: 0; background: var(--paper); font-size: 17px; display: grid; place-items: center; padding: 0; }
  html .lang-switch { position: absolute !important; }
  html.kb .lang-switch, html.kb .util { display: none !important; }
  .conn { top: calc(var(--lsc, 30px) * 2 + 4px); bottom: auto; font-size: 14px; padding: 8px 12px; z-index: 30; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--paper); font-weight: 800; font-size: 15px; padding: 12px 16px; width: max-content; max-width: calc(100% - 32px); visibility: hidden; }
  .toast.on { visibility: visible; animation: pop .35s var(--press); }
  @keyframes pop { from { transform: translateX(-50%) scale(.7); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
  .codeform { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .codeform input { min-width: 0; border: 4px solid var(--ink); background: var(--paper); font-weight: 800; font-size: 20px; padding: 10px 12px; border-radius: 0; text-transform: uppercase; }
  .codeform button { border: 4px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 900; padding: 0 16px; min-height: 48px; }

  #app { position: relative; z-index: 2; max-width: 560px; margin: 0 auto; padding: 4px 14px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; min-height: calc(100dvh - var(--lsc, 30px) * 2); overflow-x: clip; }
  #app.mid { justify-content: center; }
  #app > * { min-width: 0; }
  h1.shout { font-size: clamp(34px, 13vw, 66px); }
  h2.shout { font-size: clamp(26px, 8.4vw, 40px); }
  .lede { font-size: 18px; font-weight: 600; margin: 0; text-wrap: pretty; overflow-wrap: anywhere; }
  .fine { font-size: 14px; font-weight: 600; opacity: .8; margin: 0; }
  .center { text-align: center; }
  .link { background: none; border: 0; padding: 8px 12px 0; min-height: 44px; font-weight: 800; text-decoration: underline; text-underline-offset: 4px; display: block; margin: 0 auto; }
  input.field { width: 100%; border: 4px solid var(--ink); background: var(--paper); font-weight: 800; font-size: 22px; padding: 14px; border-radius: 0; outline: none; }
  input.field:focus { box-shadow: 0 0 0 4px var(--paper), 0 0 0 8px var(--ink); }
  .err { min-height: 22px; font-weight: 900; font-size: 16px; }
  .err:not(:empty)::before { content: "✋ "; }
  .room { font-weight: 1000; font-stretch: 151%; font-variation-settings: "wdth" 151; font-size: 28px; letter-spacing: .04em; }
  .card { background: var(--paper); border: 4px solid var(--ink); padding: 12px 14px; }

  /* лендинг */
  .rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: r; }
  .rules li { counter-increment: r; position: relative; display: block; min-height: 36px; font-weight: 700; font-size: 16px; line-height: 1.3; background: var(--paper); border: 4px solid var(--ink); padding: 10px 12px 10px 58px; text-wrap: pretty; }
  .rules li::before { content: counter(r); position: absolute; left: 12px; top: 10px; font-weight: 1000; font-size: 20px; background: var(--ink); color: var(--paper); width: 36px; height: 36px; display: grid; place-items: center; }
  .minirow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .minirow .tile { --tile-ar: 1.1 / 1; }
  .minirow .tile .w { --wfs: clamp(9px, 2.6vw, 15px); }

  /* лобби: выбор команды */
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tbtn { border: 5px solid var(--ink); background: var(--paper); padding: 12px 8px 10px; display: grid; gap: 4px; text-align: center; font-weight: 1000; font-stretch: 130%; font-variation-settings: "wdth" 130; text-transform: uppercase; font-size: 21px; min-height: 96px; align-content: center; box-shadow: 0 6px 0 rgba(0, 0, 0, .28); transition: transform .08s, box-shadow .08s; }
  .tbtn i { font-style: normal; font-size: 30px; line-height: 1; }
  .tbtn small { font-size: 13px; letter-spacing: .06em; opacity: .75; font-stretch: 100%; }
  .tbtn.red { --tc: var(--red); } .tbtn.blue { --tc: var(--blue); }
  .tbtn[aria-pressed="true"] { background: var(--tc); transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .28); }
  .tbtn:disabled { opacity: .5; }
  .capbtn { border: 4px solid var(--ink); background: var(--paper); font-weight: 900; font-size: 17px; min-height: 52px; padding: 8px 12px; width: 100%; }
  .capbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .roster { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .roster > div { background: var(--paper); border: 4px solid var(--ink); padding: 8px 10px; display: grid; gap: 6px; align-content: start; min-height: 80px; }
  .roster h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; }
  .roster .r h3 { color: var(--ink); background: var(--red); margin: -8px -10px 0; padding: 4px 10px; border-bottom: 4px solid var(--ink); }
  .roster .b h3 { background: var(--blue); margin: -8px -10px 0; padding: 4px 10px; border-bottom: 4px solid var(--ink); }
  .mem { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; min-width: 0; }
  .mem .av { font-size: 14px; }
  .mem b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .mem.me b { text-decoration: underline; text-underline-offset: 3px; }
  .mem.off { opacity: .5; }
  .avbtn { border: 4px solid var(--ink); background: var(--paper); font-size: 30px; width: 56px; height: 56px; padding: 0; display: grid; place-items: center; }
  .avgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .avgrid button { border: 3px solid var(--ink); background: var(--paper); font-size: 26px; height: 48px; padding: 0; }
  .avgrid button:disabled { opacity: .3; }
  .mehead { display: flex; align-items: center; gap: 12px; }
  .mehead b { font-size: 22px; font-weight: 1000; overflow: hidden; text-overflow: ellipsis; }

  /* игра */
  .chips { display: flex; gap: 8px; align-items: stretch; }
  .cnt { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 6px; border: 4px solid var(--ink); background: var(--tc); padding: 2px 12px; font-weight: 1000; min-height: 50px; }
  .cnt.red { --tc: var(--red); } .cnt.blue { --tc: var(--blue); }
  .cnt b { font-size: 34px; line-height: 1; font-stretch: 130%; font-variation-settings: "wdth" 130; font-variant-numeric: tabular-nums; }
  .cnt i { font-style: normal; font-size: 24px; }
  .cnt.active { box-shadow: 0 0 0 4px var(--ink); }
  .plate { position: relative; background: var(--ink); color: var(--paper); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; min-height: 72px; }
  .plate .tag { width: 52px; display: grid; place-items: center; background: var(--tc, #888); color: var(--ink); font-weight: 1000; font-size: 26px; border-right: 4px solid var(--paper); }
  .plate .txt { min-width: 0; display: flex; align-items: center; padding: 8px 12px; overflow: hidden; }
  .plate q { font-weight: 1000; font-stretch: 120%; font-variation-settings: "wdth" 120; text-transform: uppercase; font-size: var(--cfs, 30px); line-height: 1; quotes: none; white-space: nowrap; }
  .plate .msg { font-weight: 900; font-size: 17px; line-height: 1.15; text-transform: uppercase; text-wrap: balance; }
  .plate .rt { display: grid; place-items: center; align-content: center; padding: 0 12px; border-left: 4px solid var(--paper); min-width: 62px; text-align: center; }
  .plate .rt small { font-weight: 900; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
  .plate .rt b { font-weight: 1000; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
  .plate .rt b.hot { color: var(--hot); }
  .timer { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255, 255, 255, .22); }
  .timer i { display: block; height: 100%; background: var(--paper); transform-origin: 0 50%; }
  .timer.hot i { background: var(--hot); }
  .plate.slam q { animation: slam .45s var(--press); }
  @keyframes slam { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .gridwrap { width: 100%; }
  .grid .tile { min-height: 44px; }
  .grid.live .tile[data-o="0"] .face { cursor: pointer; }
  .dock { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .dock .btn { font-size: 20px; }
  .hint { font-weight: 800; font-size: 15px; text-align: center; text-wrap: balance; }
  .hint.big { font-size: 17px; background: var(--paper); border: 4px solid var(--ink); padding: 10px 12px; }
  .clueform { display: grid; gap: 10px; }
  .nums { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  .nums button { border: 3px solid var(--ink); background: var(--paper); font-weight: 1000; font-size: 20px; height: 48px; padding: 0; }
  .nums button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .nums button:disabled { opacity: .25; }
  .sendrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
  .sendrow .btn { width: auto; padding: 0 18px; }
  .over-title { background: var(--ink); color: var(--paper); padding: 12px 14px; animation: slam .5s var(--press); }
  .over-title .shout { font-size: clamp(26px, 8vw, 40px); }
  .over-title small { display: block; margin-top: 6px; font-weight: 800; font-size: 14px; opacity: .85; text-transform: none; letter-spacing: 0; }
  .awards { display: grid; gap: 8px; }
  .awards .aw { background: var(--paper); border: 3px solid var(--ink); padding: 6px 10px; font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .awards small { font-weight: 700; opacity: .75; }
  .glyph { display: inline-block; width: 1em; text-align: center; font-weight: 1000; }
  .glyph.red { color: var(--red); -webkit-text-stroke: 1px var(--ink); }
  .glyph.blue { color: var(--blue); -webkit-text-stroke: 1px var(--ink); }
  @media (max-height: 640px) { .nums button { height: 44px; } .tbtn { min-height: 78px; } }
  @media (max-width: 400px) { .nums { gap: 3px; } }

  /* заметные состояния: пауза, объявление о смене капитана, ожидание */
  .toast.alert { background: #ffd400; color: var(--ink); border: 4px solid var(--ink); font-weight: 1000; font-size: 16px; line-height: 1.2; text-align: center; animation-name: popalert; }
  .toast.alert::before { content: "★ "; }
  @keyframes popalert { from { transform: translateX(-50%) scale(.7); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
  .plate.paused { background: #ffd400; color: var(--ink); box-shadow: 0 0 0 4px var(--ink); }
  .plate.paused .tag { background: var(--ink) !important; color: #ffd400; border-right-color: var(--ink); }
  .pausebox { background: #ffd400; border: 4px solid var(--ink); padding: 14px; display: grid; gap: 12px; text-align: center; }
  .pausebox .hint.big { background: transparent; border: 0; padding: 0; font-size: 18px; }
  .pausebox .btn { font-size: 26px; padding: 18px 14px; animation: beat 1s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.04); } }
  .dots { display: inline-block; white-space: nowrap; }
  .dots i { font-style: normal; animation: dot 1.2s infinite; opacity: .2; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .2; } 30% { opacity: 1; } }
  .plate.waiting .tag { animation: tagpulse 1.3s ease-in-out infinite; }
  @keyframes tagpulse { 0%, 100% { box-shadow: inset 0 0 0 0 var(--paper); } 50% { box-shadow: inset 0 0 0 6px var(--paper); } }
  @media (prefers-reduced-motion: reduce) { .pausebox .btn, .dots i, .plate.waiting .tag, .toast.alert { animation: none !important; } .dots i { opacity: .7; } }

  /* телефон на боку (844×390, 667×375): поле слева на всю высоту, счёт, плашка и док справа — всё в один экран */
  @media (orientation: landscape) and (max-height: 520px) {
    #app[data-screen="game"] { max-width: none; height: calc(100dvh - var(--lsc, 30px) * 2); min-height: 0; padding: 0 max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left)); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); column-gap: 14px; row-gap: 8px; align-content: stretch; }
    #app[data-screen="game"] .gridwrap { grid-column: 1; grid-row: 1 / 4; height: 100%; min-height: 0; }
    #app[data-screen="game"] .grid { height: 100%; grid-template-rows: repeat(5, minmax(0, 1fr)); --tile-ar: auto; }
    #app[data-screen="game"] .grid .tile { aspect-ratio: auto; height: 100%; min-height: 0; }
    #app[data-screen="game"] .chips { grid-column: 2; grid-row: 1; padding-right: 0; }
    #app[data-screen="game"] .cnt { min-height: 40px; }
    #app[data-screen="game"] .cnt b { font-size: 28px; }
    #app[data-screen="game"] .plate { grid-column: 2; grid-row: 2; min-height: 56px; }
    #app[data-screen="game"] .plate .msg { font-size: 15px; }
    #app[data-screen="game"] .dock { grid-column: 2; grid-row: 3; min-height: 0; overflow-y: auto; align-content: start; gap: 8px; }
    #app[data-screen="game"] .dock .btn { font-size: 18px; padding: 10px 12px; }
    #app[data-screen="game"] .dock .fine { display: none; }
    #app[data-screen="game"] .hint.big { padding: 6px 10px; font-size: 15px; }
    #app[data-screen="game"] .nums button { height: 44px; }
    #app[data-screen="game"] .err { min-height: 16px; font-size: 14px; }
    #app[data-screen="game"] input.field { padding: 8px 12px; font-size: 20px; }
    #app[data-screen="game"] .capbtn { min-height: 44px; padding: 4px 10px; }
    #app[data-screen="game"] .sendrow .btn { padding: 0 12px; font-size: 16px; }
    #app[data-screen="game"] .pausebox { padding: 8px; gap: 8px; }
    #app[data-screen="game"] .pausebox .btn { font-size: 20px; padding: 10px; }
  }
</style>

<script>
"use strict";
const params = new URLSearchParams(location.search);
// код идёт в разметку — только алфавит кодов, иначе ?r=<img onerror> даёт XSS
const CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const app = document.getElementById("app");
const T = (k) => csT(k);
const tpl = (k, v) => csTpl(k, v);

let conn = null, state = null, me = null, token = null, dead = false;
let screen = null, screenKey = "";
let joinErr = null, lastJoinName = null;
let autoJoining = false, autoJoinTried = false, waitJoin = true;
let needJoin = true, pendingFlush = false, prevPhase = null, prevLog = -1;
let avOpen = false, keyHidden = false;
let clueWord = "", clueNum = 0, clueErr = null, clueErrWord = "";
const tokenKey = () => "callsign-token-" + CODE;
const savedName = () => { try { return (localStorage.getItem("callsign-name") || "").trim(); } catch (e) { return ""; } };
try { token = localStorage.getItem(tokenKey()); } catch (e) {}

const player = (id) => state && state.players.find((p) => p.id === id);
const mine = () => (state && me ? player(me) : null);
const avHtml = (p) => `<i class="av" style="--pc:${p.color}">${escapeHtml(p.avatar)}</i>`;
const turnKey = () => (state ? state.game + ":" + state.log.length + ":" + state.team : "");
const GLYPH = { red: "▲", blue: "●", n: "◼", x: "✕" };

// отправка с привязкой к ходу: после обрыва связи тап по старой карточке в очереди не отправляем
const sendCtx = new WeakMap();
let netLostNow = false;
function csend(m) { sendCtx.set(m, { t: turnKey() }); if (netLostNow && m.type !== "join") toast(T("conn_tap")); conn.send(m); }
function queuedWanted(q) {
  const c = sendCtx.get(q);
  return !!(state && c && c.t === turnKey() && (state.phase === "guess" || state.phase === "clue"));
}
function flushQueued() { conn.flush(queuedWanted, onDropped); }
function onDropped() { toast(T("dropped")); }

let lastCapSeq = null;
// «Капитан сменился»: объясняем причину, иначе игроки видят нового капитана без объяснений
function capNotice() {
  const cc = state.capChange;
  const seq = cc ? cc.seq : 0;
  if (lastCapSeq === null) { lastCapSeq = seq; return; }
  if (!cc || seq === lastCapSeq) return;
  lastCapSeq = seq;
  toast(csCapText(cc, (id) => (player(id) || { name: "?" }).name), 6000, "alert");
}
function toast(text, ms, kind) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.toggle("alert", kind === "alert");
  t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), ms || 2400);
}
function show(html, key, mid) {
  screenKey = key;
  app.classList.toggle("mid", !!mid);
  app.dataset.screen = key.split(":")[0];
  app.innerHTML = html;
  fitShouts();
}
function fitShouts() {
  app.querySelectorAll(".shout").forEach((h) => {
    h.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(h).fontSize), guard = 0;
    while (fs > 22 && h.scrollWidth > h.clientWidth + 1 && guard++ < 60) { fs -= 2; h.style.fontSize = fs + "px"; }
  });
}
async function keepAwake() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && me) keepAwake(); });

// ---------- цвет экрана ----------
let curColor;
function paint(color) {
  if (color === curColor) return;
  const first = curColor === undefined;
  curColor = color;
  if (color == null) {
    document.querySelectorAll(".wipe").forEach((w) => w.remove());
    document.body.style.background = "";
    document.body.classList.add("home");
    return;
  }
  document.body.classList.remove("home");
  if (first || matchMedia("(prefers-reduced-motion: reduce)").matches) { document.body.style.background = color; return; }
  const w = el("div", "wipe");
  w.style.background = color;
  document.body.append(w);
  setTimeout(() => { document.body.style.background = color; w.remove(); }, 560);
}
function phaseColor() {
  if (!state) return null;
  switch (state.phase) {
    case "draw": case "clue": case "guess": case "swap": return csTeamColor(state.team);
    case "finished": return state.winner ? csTeamColor(state.winner) : "#cfcfcf";
    default: return null;
  }
}

// ---------- лендинг / код / вход ----------
let demoTimer = null;
function renderLanding() {
  screen = "landing";
  paint(null);
  const demoWords = T("demo_words").split("|");
  const demo = ["red", "n", "blue", "x", "blue"].map((t, i) => `<div class="tile" data-o="1" data-t="${t}" style="--i:${i}"><span class="face"><span class="w">${escapeHtml(demoWords[i] || "")}</span></span></div>`).join("");
  show(`<div><div class="eyebrow">${T("kicker")}</div><h1 class="shout" style="margin-top:8px">${escapeHtml(T("game_name"))}</h1></div>
    <p class="lede">${T("lede")}</p>
    <div class="minirow grid" aria-hidden="true">${demo}</div>
    <div><button class="btn" id="create" type="button">${T("btn_create")}</button>
      <p class="fine center" style="margin-top:10px;text-wrap:balance">${T("cta_sub")}</p><button class="link" id="havecode" type="button">${T("have_code")}</button></div>
    <ol class="rules"><li><span>${T("rule1")}</span></li><li><span>${T("rule2")}</span></li><li><span>${T("rule3")}</span></li></ol>`, "landing");
  document.getElementById("create").onclick = async () => {
    const btn = document.getElementById("create");
    btn.disabled = true;
    btn.textContent = T("btn_creating");
    try {
      const res = await fetch("/callsign/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: { lang: csLang(), mode: "words" } }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "error");
      try { localStorage.setItem("callsign-host-" + data.code, data.hostToken); } catch (e) {}
      location.href = `callsign-board.html?r=${data.code}`;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = T("btn_create");
      toast(String(err.message || err));
    }
  };
  document.getElementById("havecode").onclick = () => {
    const b = document.getElementById("havecode");
    b.outerHTML = codeFormHtml("");
    bindCodeForm();
    document.getElementById("codein").focus();
  };
}
function normCode(raw) {
  if (window.MP && MP.roomGone) return MP.roomGone.normalize(raw);
  return String(raw || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
}
function codeFormHtml(value) {
  return `<form class="codeform" id="codeform" autocomplete="off"><input id="codein" maxlength="24" value="${escapeHtml(value)}" placeholder="${escapeHtml(T("prompt_code"))}" aria-label="${escapeHtml(T("prompt_code"))}" autocapitalize="characters" enterkeyhint="go"><button type="submit">${T("btn_go")}</button></form>`;
}
function bindCodeForm() {
  document.getElementById("codeform").onsubmit = (e) => {
    e.preventDefault();
    const c = normCode(document.getElementById("codein").value);
    if (c) location.href = `callsign.html?r=${encodeURIComponent(c)}`;
  };
}
function renderEnter() {
  screen = "enter";
  paint(null);
  let saved = "";
  try { saved = localStorage.getItem("callsign-name") || ""; } catch (e) {}
  show(`<form id="enterform" autocomplete="off" style="display:grid;gap:14px">
    <div class="room">${escapeHtml(CODE)}</div>
    <h2 class="shout">${T("enter_title")}</h2>
    <input class="field" id="name" maxlength="16" placeholder="${escapeHtml(T("enter_ph"))}" value="${escapeHtml(saved)}" enterkeyhint="go" aria-label="${escapeHtml(T("enter_ph"))}">
    <div class="err" id="err">${joinErr ? escapeHtml(T(joinErr)) : ""}</div>
    <button class="btn" type="submit">${T("btn_join")}</button>
  </form>`, "enter", true);
  const input = document.getElementById("name");
  document.getElementById("enterform").onsubmit = (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) { document.getElementById("err").textContent = T("err_name"); return; }
    try { localStorage.setItem("callsign-name", name); } catch (e2) {}
    joinErr = null;
    lastJoinName = name;
    conn.send({ type: "join", name });
    keepAwake();
  };
}
function renderCenter(titleKey, textKey, extra, key) {
  show(`<div class="center" style="display:grid;gap:14px"><h2 class="shout">${T(titleKey)}</h2>${textKey ? `<p class="lede">${T(textKey)}</p>` : ""}${extra || ""}</div>`, key || "c:" + titleKey, true);
}
function renderNoRoom() {
  dead = true;
  screen = "noroom";
  paint(null);
  renderCenter("noroom_title", "noroom_text", codeFormHtml(CODE || (params.get("r") || "").slice(0, 24)));

}

let lastTickSec = null;
function frame() {
  requestAnimationFrame(frame);
  if (!state || dead || !state.phaseEnd) return;
  const left = state.phaseEnd - csNow();
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const live = state.phase === "clue" || state.phase === "guess";
  const bar = document.getElementById("timer");
  if (bar && live) {
    bar.firstChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`;
    bar.classList.toggle("hot", left < 5000);
  }
  const secs = document.getElementById("secs");
  if (secs && live) {
    secs.textContent = String(Math.max(0, Math.ceil(left / 1000)));
    secs.classList.toggle("hot", left < 5000);
  }
  if (live && left < 5000 && left > 0 && state.me && (state.me.team === state.team)) {
    const sec = Math.ceil(left / 1000);
    if (sec !== lastTickSec) { lastTickSec = sec; csSfx.tick(true); }
  }
}

function render() {
  if (dead || !state) return;
  if (!me) {
    if (screen === "kicked" || screen === "replaced" || screen === "enter") return;
    if ((waitJoin && token) || autoJoining) return renderCenter("wait_title");
    return renderEnter();
  }
  if (!mine()) return renderEnter();
  if (!state.me && state.phase !== "lobby") return;
  screen = "game";
  paint(phaseColor());
  if (state.phase === "lobby") return renderLobby();
  if (!state.board) return;
  renderGame();
}

// ---------- связь ----------
function onMessage(m) {
  switch (m.type) {
    case "hello":
    case "state":
      state = m.state;
      if (m.type === "hello" && goneFlow) goneFlow.hello();
      if (m.type === "hello" && token && needJoin) { needJoin = false; conn.send({ type: "join", token }); }
      if (langFollow) langFollow.check(state.settings && state.settings.lang);
      if (state.phase !== prevPhase) {
        if (state.phase === "clue" && state.me && state.me.captain && state.me.team === state.team) { csVibrate(30); csSfx.turn(); }
        prevPhase = state.phase;
      }
      capNotice();
      if (state.log.length !== prevLog) { prevLog = state.log.length; clueWord = ""; clueNum = 0; clueErr = null; }
      render();
      if (pendingFlush && state.me) { pendingFlush = false; flushQueued(); }
      break;
    case "joined": {
      const was = me;
      me = m.playerId;
      token = m.token;
      joinErr = null;
      autoJoining = false;
      if (lastJoinName && m.name && m.name !== lastJoinName.replace(/\s+/g, " ")) toast(tpl("you_are", { name: m.name }));
      lastJoinName = null;
      try { localStorage.setItem(tokenKey(), token); } catch (e) {}
      keepAwake();
      if (was !== me) { screen = null; screenKey = ""; }
      render();
      pendingFlush = true;
      setTimeout(() => { if (pendingFlush) { pendingFlush = false; flushQueued(); } }, 2000);
      break;
    }
    case "rejected":
      if (m.action === "clue") {
        clueErr = m.reason;
        clueErrWord = typeof m.word === "string" ? m.word : "";
        csSfx.buzz();
        csVibrate([60, 40, 60]);
        lastDockKey = "";
        render();
        break;
      }
      if (T("rj_" + m.reason) !== "rj_" + m.reason) toast(T("rj_" + m.reason));
      lastDockKey = "";
      break;
    case "event": {
      const e = m.event;
      if (e.type === "clue") { csSfx.clue(); if (state && state.me && state.me.canOpen) csVibrate(20); }
      if (e.type === "open") { if (e.t === "x") { csSfx.boom(); csVibrate([80, 40, 160]); } else if (e.t === e.team) csSfx.good(); else if (e.t === "n") csSfx.neutral(); else csSfx.foe(); }
      if (e.type === "final" && e.winner) setTimeout(() => csSfx.fanfare(), 600);
      break;
    }
    case "error":
      conn.flush(() => false);
      if (m.error === "room_expired") return onRoomGone();
      if (m.error === "token_gone") {
        try { localStorage.removeItem(tokenKey()); } catch (e) {}
        token = null;
        const nm = savedName();
        if (nm && !autoJoinTried && state && (state.phase === "lobby" || state.phase === "finished")) {
          autoJoinTried = true; autoJoining = true; me = null; lastJoinName = nm;
          conn.send({ type: "join", name: nm });
          setTimeout(() => { if (autoJoining) { autoJoining = false; waitJoin = false; if (!me && !dead) render(); } }, 4000);
          break;
        }
      }
      if (["room_full", "token_gone", "bad_name", "name_taken"].includes(m.error)) {
        autoJoining = false;
        joinErr = m.error === "bad_name" ? "err_name"
          : m.error === "name_taken" && typeof m.online === "boolean" ? (m.online ? "err_name_taken_online" : "err_name_taken_offline")
          : "err_" + m.error;
        me = null; waitJoin = false; lastJoinName = null;
        renderEnter();
      }
      break;
    case "kicked":
      conn.flush(() => false);
      me = null;
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
      token = null;
      screen = "kicked";
      renderCenter("kicked_title");
      break;
    case "replaced":
      me = null;
      screen = "replaced";
      renderCenter("replaced_title", "replaced_text", `<button class="btn" id="here" type="button">${T("btn_back_here")}</button>`);
      document.getElementById("here").onclick = () => { conn.send({ type: "join", token }); };
      break;
  }
}

  d.style.cssText = "position:fixed;left:8px;right:8px;top:calc(var(--lsc,30px)*2 + 4px);z-index:29;max-width:544px;margin:0 auto;background:#fff;border:4px solid #111;padding:8px 10px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;font-weight:800;font-size:15px";
  const done = (fn) => () => { d.remove(); fn(); };
  const mk = (txt, dark) => { const b = el("button", null, txt); b.type = "button"; b.style.cssText = "min-height:44px;min-width:44px;border:3px solid #111;font-weight:900;padding:4px 12px;background:" + (dark ? "#111" : "#fff") + ";color:" + (dark ? "#fff" : "#111"); return b; };
  const yes = mk(T("lang_yes"), true), no = mk(T("lang_no"), false);
  yes.onclick = done(o.accept);
  no.onclick = done(o.decline);
  d.append(el("span", null, tpl("lang_hint", { l: LANG_NAMES[o.lang] || o.lang.toUpperCase() })), yes, no);
  document.body.append(d);
}
const langFollow = window.MP && MP.followRoomLang ? MP.followRoomLang({
  enabled: true,
  auto: !!(MP.rules && MP.rules.RULE_U17_LANG_FOLLOW),
  getRoomLang: () => (state && state.settings && state.settings.lang) || null,
  onSuggest: showLangHint,
}) : null;
window.addEventListener("langchange", () => { screenKey = ""; lastDockKey = ""; lastPlateKey = ""; if (state) render(); });
window.addEventListener("resize", () => { if (screen === "game" && state && state.board) fitTiles(); });
const refitFonts = () => { fitShouts(); fitTiles(); fitPlate(); };
if (document.fonts) {
  if (document.fonts.ready) document.fonts.ready.then(refitFonts);
  if ("onloadingdone" in document.fonts) document.fonts.onloadingdone = refitFonts;
}

function start() {
  if (!CODE && (params.get("r") || "").trim()) return renderNoRoom();
  if (!CODE) return renderLanding();
  renderCenter("wait_title");
  if (token) setTimeout(() => { waitJoin = false; if (!me && !dead) render(); }, 4000);
  else waitJoin = false;
  const banner = document.getElementById("conn");
  let netLost = false, netQuiet = false;
  const showNet = () => {
    banner.textContent = T(netLost ? "err_connect" : "conn_lost");
    banner.classList.toggle("on", netLost || netQuiet);
  };
  window.addEventListener("langchange", showNet);
  conn = csConnect({
    code: CODE,
    onMessage,
    onDrop: onDropped,
    onGone: onRoomGone,
    onOpen: () => {
      needJoin = true;
      if (token) {
        conn.gated = true;
        setTimeout(() => { if (conn.gated) flushQueued(); }, 4000);
      }
    },
    onState: (st) => { netLost = st === "lost"; netLostNow = netLost; if (st === "open") netQuiet = false; showNet(); },
    onQuiet: (q) => { netQuiet = !!q; showNet(); },
  });
  requestAnimationFrame(frame);
  window.csPhone = { send: (msg) => csend(msg), get state() { return state; }, get me() { return me; } };
}
start();
</script>
