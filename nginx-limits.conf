# Адрес игрока. Перед нами два прокси: nginx хоста → этот nginx, поэтому $remote_addr здесь —
# адрес хостового nginx, один и тот же для всех. Ключевать лимиты по нему нельзя: зона стала бы
# общей на весь интернет (создание комнат — 1 в секунду на всех, опрос — 30 запросов в секунду на всех).
# Внешний nginx ставит X-Real-IP = адрес клиента, затирая присланный клиентом заголовок; порт 8080
# слушает только 127.0.0.1, так что подделать его снаружи нельзя. Если заголовка нет (обращение
# напрямую к контейнеру) — откатываемся на адрес соединения.
# Файл подключается как 00-limits.conf, то есть раньше default.conf: map виден и в нём.
map $http_x_real_ip $auction_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

# Долгий опрос и ставки идут с одного IP от всей компании — лимит должен быть щедрым.
# Отдельная зона для создания комнат: там дорогие операции, их и ограничиваем.
limit_req_zone $auction_real_ip zone=auction_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=auction_rooms:1m rate=1r/s;

# Рулетка: тот же профиль нагрузки, что у аукциона (вся компания с одного IP), свои зоны —
# чтобы шумная партия в одной игре не съедала лимит другой.
limit_req_zone $auction_real_ip zone=roulette_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=roulette_rooms:1m rate=1r/s;

# «Ставки»: профиль рулетки (вся компания с одного IP, WebSocket + long-poll запасом), свои зоны
limit_req_zone $auction_real_ip zone=bets_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=bets_rooms:1m rate=1r/s;

# «Бомба»: та же схема (компания с одного IP, WebSocket + long-poll запасом), свои зоны
limit_req_zone $auction_real_ip zone=bomb_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=bomb_rooms:1m rate=1r/s;
limit_req_zone $auction_real_ip zone=fibs_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=fibs_rooms:1m rate=1r/s;
limit_req_zone $auction_real_ip zone=lastq_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=lastq_rooms:1m rate=1r/s;
limit_req_zone $auction_real_ip zone=quip_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=quip_rooms:1m rate=1r/s;
limit_req_zone $auction_real_ip zone=wave_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=wave_rooms:1m rate=1r/s;
limit_req_zone $auction_real_ip zone=crowd_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=crowd_rooms:1m rate=1r/s;
# «Сто к одному»: тот же профиль, что у crowd (WebSocket + long-poll запасом, long-poll — вся компания с одного IP)
limit_req_zone $auction_real_ip zone=oneword_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=oneword_rooms:1m rate=1r/s;
# «Айфилю»: тот же профиль, что у crowd
limit_req_zone $auction_real_ip zone=ifeel_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=ifeel_rooms:1m rate=1r/s;
# «Блэкджек»: тот же профиль, что у oneword
limit_req_zone $auction_real_ip zone=blackjack_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=blackjack_rooms:1m rate=1r/s;
# «Царь льдины»: только открытие сокета и health, ввод идёт внутри сокета
limit_req_zone $auction_real_ip zone=floe_ws:2m rate=10r/s;
limit_req_zone $auction_real_ip zone=floe_rooms:1m rate=1r/s;
# «Утиный сплав»: так же, как «Царь льдины»
limit_req_zone $auction_real_ip zone=rapids_ws:2m rate=10r/s;
limit_req_zone $auction_real_ip zone=rapids_rooms:1m rate=1r/s;
# «Кувшинки»: так же, как «Царь льдины» (ввод — редкие прыжки внутри сокета)
limit_req_zone $auction_real_ip zone=pond_ws:2m rate=10r/s;
limit_req_zone $auction_real_ip zone=pond_rooms:1m rate=1r/s;

# «Гром»: страница опрашивает /storm/api/ раз в 6 с (два запроса), розыгрыш — ещё один.
# Вся команда с одного офисного IP — лимит с запасом.
limit_req_zone $auction_real_ip zone=storm:1m rate=10r/s;
