# Адрес игрока. Перед нами два прокси: nginx хоста → этот nginx, поэтому $remote_addr здесь —
# адрес хостового nginx, один и тот же для всех. Ключевать лимиты по нему нельзя: зона стала бы
# общей на весь интернет (создание комнат — 1 в секунду на всех, опрос — 30 запросов в секунду на всех).
# Внешний nginx ставит X-Real-IP = адрес клиента, затирая присланный клиентом заголовок; порт 8080
# слушает только 127.0.0.1, так что подделать его снаружи нельзя. Если заголовка нет (обращение
# напрямую к контейнеру) — откатываемся на адрес соединения.
# Файл подключается как 00-limits.conf, то есть раньше default.conf: map виден и в нём.
map $http_x_real_ip $auction_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

# Долгий опрос и ставки идут с одного IP от всей компании — лимит должен быть щедрым.
# Отдельная зона для создания комнат: там дорогие операции, их и ограничиваем.
limit_req_zone $auction_real_ip zone=auction_poll:2m rate=30r/s;
limit_req_zone $auction_real_ip zone=auction_rooms:1m rate=1r/s;

# «Гром»: страница опрашивает /storm/api/ раз в 6 с (два запроса), розыгрыш — ещё один.
# Вся команда с одного офисного IP — лимит с запасом.
limit_req_zone $auction_real_ip zone=storm:1m rate=10r/s;
