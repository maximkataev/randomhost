<style>
  /* Соло-страница: сверху сцена BJTable (layout solo, 420×760 логических, масштабируется сама), снизу пульт.
     Пульт — плоские панели в палитре стола (чернильный фон, золотой кант, Inter Tight), без стекла и неона.
     Высота пульта фиксирована на телефоне, чтобы сцена не прыгала между фазами (правило владельца: без скачков). */
  :root {
    --bg: #070304; --panel: #120708; --panel-2: #1d0b0e; --line: rgba(212, 175, 55, .28); --line-soft: rgba(255, 255, 255, .08);
    --gold: #d4af37; --gold-hi: #f3dd8a; --ivory: #f3efe4; --muted: #b9aea0; --red: #c8102e; --win: #5ad28b; --lose: #ff6b6b; --neon: #f2fff8;
    --cond: var(--bj-ui);
    --num: var(--bj-num);
    --text: var(--bj-text);
    --serif: var(--bj-display);
    --top: 44px; --pult-h: 248px;
    --lang-switch-bg: #120708; --lang-switch-border: rgba(212, 175, 55, .35); --lang-switch-fg: #a9b0c2;
    --lang-switch-active-bg: #d4af37; --lang-switch-active-fg: #0a0d16; --lang-switch-active-border: transparent;
    --lang-switch-font: "Inter Tight", Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ivory); font: 500 16px/1.3 var(--text); }
  body { height: 100vh; height: 100dvh; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  a { color: var(--gold-hi); }
  .lang-switch { top: calc(4px + env(safe-area-inset-top)) !important; right: 8px !important; }

  /* ---------- верхняя полоса ---------- */
  #top { position: fixed; left: 0; right: 0; top: 0; z-index: 30; height: calc(var(--top) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0; display: flex; align-items: center; gap: 6px; background: var(--bg); }
  .tb { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--panel); color: var(--gold); display: grid; place-items: center; padding: 0; }
  .tb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sound-toggle-btn { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--panel); color: var(--gold); display: grid; place-items: center; padding: 0; }
  .top-title { margin-left: 6px; font: 700 15px/1 var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--gold-hi); white-space: nowrap; }
  .top-friends { margin-left: auto; margin-right: 128px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; color: var(--muted); white-space: nowrap; }
  .top-friends:hover { color: var(--gold-hi); }
  @media (max-width: 640px) { .top-friends { display: none; } }
  @media (max-width: 400px) { .top-title { display: none; } }

  /* меню разделов — тот же гамбургер, что на страницах рандомайзеров, в тёмной палитре стола */
  .menu-wrap { position: relative; }
  .menu-btn { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; }
  .menu-btn span { width: 18px; height: 2px; background: var(--gold); transition: transform .2s, opacity .2s; }
  .menu-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .menu-btn.open span:nth-child(2) { opacity: 0; }
  .menu-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .menu-drop { position: absolute; top: 46px; left: 0; min-width: 260px; max-height: calc(100vh - 80px); overflow-y: auto; padding: 6px 0; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0, 0, 0, .6); display: flex; flex-direction: column; opacity: 0; visibility: hidden; transition: opacity .12s, visibility .12s; }
  .menu-drop.open { opacity: 1; visibility: visible; }
  .menu-drop::before { content: attr(data-heading); display: block; padding: 4px 16px 6px; color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .menu-drop a { color: var(--ivory); font-size: 15px; padding: 7px 16px; white-space: nowrap; text-decoration: none; }
  .menu-drop a:hover { background: rgba(212, 175, 55, .12); }
  @media (max-width: 520px) { .menu-drop { min-width: calc(100vw - 20px); } }

  /* ---------- сцена и пульт ---------- */
  #main { position: fixed; left: 0; right: 0; top: calc(var(--top) + env(safe-area-inset-top)); bottom: 0; }
  #col { height: 100%; display: flex; flex-direction: column; }
  #scene { flex: 1 1 auto; min-height: 0; position: relative; }
  #scene .bj-margot-wrap { cursor: pointer; }
  /* пузырь в портрете: стоит на x≈260 из 420 — ограничиваем ширину, чтобы реплика не уходила за рамку */
  #scene .bj[data-layout="solo"] .bj-bubble { max-width: 176px; font-size: 25px; padding: 6px 16px 7px; }
  /* пульт одной высоты во всех фазах, в том числе при разорении: таблица рекордов при нехватке места скроллится внутри него, а не раздувает пульт и не двигает сцену */
  #pult[data-phase="finished"] { justify-content: flex-start; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  #pult { flex: 0 0 var(--pult-h); height: var(--pult-h); min-width: 0; overflow-x: hidden; padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; border-top: 1px solid var(--line); background: var(--panel); }
  @media (max-height: 660px) { :root { --pult-h: 224px; } #pult { gap: 4px; } }
  /* десктоп: колонка 760 px по центру, сцена solo-wide (760×440) сверху, пульт под боксом */
  @media (min-width: 820px) and (min-height: 560px) {
    #col { max-width: 760px; margin: 0 auto; justify-content: center; }
    #scene { flex: 1 1 auto; max-height: 440px; }
    #pult { padding: 10px 16px 18px; gap: 8px; }
    :root { --pult-h: 268px; }
  }
  /* телефон в ландшафте: сцена solo-wide слева во всю высоту, пульт 320 px справа, прижат к низу */
  @media (min-width: 700px) and (max-height: 559px) {
    #col { flex-direction: row; }
    #pult { flex: 0 0 320px; width: 320px; min-width: 0; height: auto; border-top: 0; border-left: 1px solid var(--line); padding: 10px 14px 12px; gap: 6px; justify-content: flex-end; overflow-x: hidden; }
    .stats { flex-wrap: wrap; row-gap: 2px; }
    :root { --pult-h: 0px; }
  }

  /* ---------- кнопки пульта ---------- */
  .btn { min-height: 56px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ivory); font: 700 18px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 8px; flex: 1 1 0; min-width: 0; }
  .btn small { display: block; font: 500 13px/1.15 var(--cond); letter-spacing: .01em; text-transform: none; color: var(--muted); text-align: center; max-width: 100%; }
  .btn.gold { background: var(--gold); color: #0a0d16; border-color: var(--gold-hi); }
  .btn.gold small { color: rgba(10, 13, 22, .75); }
  .btn.wide { flex: 2 1 0; }
  #pult > .btn { flex: 0 0 auto; min-height: 60px; }
  .btn:disabled { opacity: .42; cursor: default; }
  .btn:not(:disabled):active { transform: translateY(1px); }
  .btn.picked { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .row { display: flex; gap: 6px; }
  .row .btn { font-size: 16px; letter-spacing: .03em; }
  .row .btn small { white-space: normal; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid2 .btn { min-height: 60px; }
  @media (max-height: 660px) { .grid2 .btn { min-height: 56px; } }

  /* ставки */
  .stats { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .stats span { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .stats b { font-size: 20px; letter-spacing: 0; color: var(--ivory); font-variant-numeric: tabular-nums; }
  .stats b.gold { color: var(--gold-hi); }
  .stats b.neon { color: var(--neon); }
  .boxes { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 6px; }
  .box { height: 44px; border: 1px solid var(--line-soft); background: #1a0a0d; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; -webkit-user-select: none; user-select: none; padding: 0; color: var(--ivory); }
  .box .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .box .v { font-size: 18px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .box.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .box .q { position: absolute; right: 5px; top: 4px; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font: 700 9px/12px var(--cond); text-align: center; }
  .chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .chip.all { background: transparent; color: var(--gold-hi); box-shadow: inset 0 0 0 2px var(--gold), 0 2px 0 rgba(0, 0, 0, .5); font-size: 13px; text-transform: uppercase; letter-spacing: 0; }
  .chip { width: 44px; height: 44px; margin: 0 auto; border-radius: 50%; border: 0; padding: 0; background: var(--c); color: var(--ct); font: 800 16px/1 var(--num); letter-spacing: -.02em; box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .25), inset 0 0 0 5px var(--c), inset 0 0 0 6px rgba(255, 255, 255, .55), 0 2px 0 rgba(0, 0, 0, .5); font-variant-numeric: tabular-nums; }
  .chip:disabled { opacity: .35; cursor: default; }
  .chip:not(:disabled):active { transform: scale(.94); }
  .foot { font-size: 11px; line-height: 1.2; color: var(--muted); text-align: center; letter-spacing: .02em; min-height: 13px; }
  .foot b { color: var(--gold-hi); font-weight: 600; }

  /* решения */
  .mhint { flex: none; width: 100%; }
  .mhint .mh-t { font-size: 16px; }
  .hands { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .hands .h { display: flex; align-items: baseline; gap: 5px; padding: 2px 8px; border: 1px solid transparent; }
  .hands .h.on { border-color: var(--gold); color: var(--ivory); }
  .hands .h.done { opacity: .6; }
  .hands b { font-size: 18px; letter-spacing: 0; color: var(--neon); font-variant-numeric: tabular-nums; }
  .hands b.bad { color: var(--lose); }
  .hands b.bj { color: var(--gold-hi); }
  .hands .vs { margin-left: auto; }
  .hands .vs b { color: var(--ivory); }
  .note { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.25; }

  /* страховка и прочие листы в пульте */
  .ins { border: 1px solid var(--gold); background: #1a0a0d; padding: 7px 10px; }
  .ins .t { font: 700 17px/1.1 var(--serif); color: var(--gold-hi); }
  .ins .x { margin-top: 3px; font-size: 13px; line-height: 1.25; color: var(--ivory); }
  .ins .x.m { color: var(--muted); }

  /* итог раздачи */
  .res { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
  .res .ln { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .res .ln span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .res .amt.w { color: var(--win); } .res .amt.l { color: var(--lose); } .res .amt.p { color: var(--muted); }
  .res .tot { border-top: 1px solid var(--line-soft); margin-top: 3px; padding-top: 4px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .res .tot .amt { font-size: 24px; }

  /* разорение: эта партия против рекорда — строки пульта, без карточек */
  .rec { display: grid; grid-template-columns: 1fr auto auto; column-gap: 14px; align-items: baseline; font-size: 13px; }
  .rec > span { padding: 2px 0; border-bottom: 1px solid var(--line-soft); white-space: nowrap; line-height: 1.25; }
  .rec .hd { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-bottom: 2px; }
  .rec .k { color: var(--ivory); }
  .rec .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .rec .v.r { color: var(--muted); font-weight: 600; }
  .rec .v.new { color: var(--gold-hi); }
  .rec .v.new i { font: 600 12px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; font-style: normal; margin-right: 6px; vertical-align: 2px; }
  .rec .ft { grid-column: 1 / -1; border-bottom: 0; font-size: 12px; color: var(--muted); padding-top: 4px; }
  @media (max-height: 660px) { .rec > span { padding: 0; line-height: 1.2; } .rec .v { font-size: 15px; } .rec .hd { padding-bottom: 1px; } .rec .ft { padding-top: 2px; } }

  /* пошаговая первая раздача */
  .tut { border: 1px solid var(--gold); background: #1a0a0d; padding: 6px 10px 7px; display: flex; flex-direction: column; gap: 3px; }
  .tut .who { font: 700 12px/1 var(--cond); letter-spacing: .2em; text-transform: uppercase; color: var(--gold-hi); display: flex; justify-content: space-between; }
  .tut .who i { font-style: normal; color: var(--muted); }
  .tut .txt { font: normal 600 18px/1.25 var(--bj-voice); color: var(--ivory); }
  .tut.big .txt { font-size: 19px; }
  .btn.sm { min-height: 44px; font-size: 15px; }

  /* ---------- нижний лист (Спроси Марго, правила, настройки, побочные) ---------- */
  #sheetbg { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, .62); opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; z-index: 40; }
  #sheetbg.on { opacity: 1; visibility: visible; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 86%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--panel); border-top: 1px solid var(--gold); padding: 14px 14px calc(16px + env(safe-area-inset-bottom)); transform: translateY(102%); transition: transform .25s; z-index: 41; }
  #sheet.on { transform: none; }
  @media (min-width: 820px) and (min-height: 560px) { #sheet { left: 50%; right: auto; bottom: 50%; width: 460px; max-height: 80%; transform: translate(-50%, 50%) scale(.96); opacity: 0; border: 1px solid var(--gold); transition: transform .2s, opacity .2s; } #sheet.on { transform: translate(-50%, 50%); opacity: 1; } }
  #sheet h3 { margin: 0 0 8px; font: 700 22px/1.1 var(--serif); color: var(--gold-hi); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #sheet h3 .x { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ivory); font: 700 18px/1 var(--cond); padding: 0; }
  #sheet p { margin: 0 0 8px; font-size: 15px; line-height: 1.35; }
  #sheet p.m { color: var(--muted); font-size: 13px; }
  #sheet .say { font: normal 600 20px/1.3 var(--bj-voice); border-left: 3px solid var(--gold); padding: 4px 10px; margin: 0 0 12px; }
  #sheet .list { margin: 0 0 10px; padding: 0; list-style: none; font-size: 14px; }
  #sheet .list li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line-soft); }
  #sheet .list li b { color: var(--gold-hi); white-space: nowrap; }
  #sheet .cards { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -14px; padding: 2px 14px 6px; }
  #sheet .cards::-webkit-scrollbar { display: none; }
  #sheet .card { flex: 0 0 100%; scroll-snap-align: center; border: 1px solid var(--line); background: #1a0a0d; padding: 10px 12px 12px; min-height: 150px; }
  #sheet .card .n { font: 700 12px/1 var(--cond); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  #sheet .card .t { margin: 4px 0 6px; font: 700 20px/1.1 var(--serif); color: var(--gold-hi); }
  #sheet .card .b { font-size: 14px; line-height: 1.35; }
  #sheet .dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
  #sheet .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  #sheet .dots i.on { background: var(--gold); }
  #sheet .tg { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  #sheet .tg .l { font-size: 16px; } #sheet .tg .l small { display: block; font-size: 12px; color: var(--muted); }
  #sheet .sw { flex: 0 0 46px; width: 46px; height: 26px; border-radius: 13px; background: #3a2a28; position: relative; transition: background .2s; }
  #sheet .sw.on { background: var(--gold); }
  #sheet .sw i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
  #sheet .sw.on i { left: 23px; }
  #sheet table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 10px; }
  #sheet th, #sheet td { padding: 5px 4px; text-align: right; border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
  #sheet th { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  #sheet td:first-child, #sheet th:first-child { text-align: left; }
  #sheet .act { margin-top: 10px; }
  #sheet .act .btn { min-height: 50px; }
  #sheet a.btn { text-decoration: none; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--pult-h) + 10px); transform: translate(-50%, 8px); background: var(--ivory); color: #1a1410; border: 1px solid var(--gold); padding: 8px 14px; font: 600 16px/1.2 var(--cond); opacity: 0; transition: opacity .2s, transform .2s; z-index: 35; pointer-events: none; white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (min-width: 820px) and (min-height: 560px), (min-width: 700px) and (max-height: 559px) { #toast { bottom: 40px; } }
</style>

<script>
(function () {
  'use strict';
  // Соло: движок blackjack/game.js работает прямо в браузере (settings.solo), страница сама зовёт ready/insure/decide,
  // tick(now) двигает фазы с таймингами (раздача, ход дилера, выплаты). Таймеров на игрока нет.
  var G = window.BlackjackGame, Strategy = window.BlackjackStrategy;
  var KEY = 'blackjack_solo_v1', HKEY = 'blackjack_hints_v1', ME = 'me';
  var REC_KEYS = ['bestStack', 'bestHands', 'bestStreak', 'blackjacks', 'bestSide'];

  // ---------- хранилище ----------
  function load(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var store = load(KEY) || {};
  if (!store.records) store.records = {};
  if (!store.withHints) store.withHints = {};
  var hintsOn = (function () { var h = load(HKEY); return !(h && h.on === false); })();
  function setHints(on) { hintsOn = !!on; save(HKEY, { on: hintsOn }); }
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var fxOn = reduced ? false : store.fx !== false;

  // ---------- язык ----------
  var lang = (window.I18N && window.I18N.lang) || 'ru';
  function T(k) {
    var d = window.I18N_DICT, v = (d[lang] || d.ru)[k];
    if (v === undefined) v = d.ru[k];
    return v === undefined ? k : v;
  }
  function F(k, vars) { var s = T(k); for (var x in vars) s = s.split('{' + x + '}').join(String(vars[x])); return s; }
  function plural(n, key) {
    var f = T(key);
    if (typeof f === 'string') return n + ' ' + f;
    var i;
    if (lang === 'ru') { var m10 = n % 10, m100 = n % 100; i = (m10 === 1 && m100 !== 11) ? 0 : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? 1 : 2; }
    else i = n === 1 ? 0 : 1;
    return n + ' ' + f[Math.min(i, f.length - 1)];
  }
  function fmt(n) {
    n = Math.round(n || 0);
    var s = String(Math.abs(n)), out = '';
    while (s.length > 3) { out = ' ' + s.slice(-3) + out; s = s.slice(0, -3); }
    return (n < 0 ? '−' : '') + s + out;
  }
  function signed(n) { return n > 0 ? '+' + fmt(n) : n < 0 ? fmt(n) : '0'; }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); }
  function now() { return Date.now(); }

  // crypto-рандом без смещения по модулю (§3: Фишер–Йейтс на getRandomValues)
  var rndBuf = new Uint32Array(1);
  function rnd(n) {
    n = Math.floor(n);
    if (!(n > 1)) return 0;
    var lim = 4294967296 - (4294967296 % n), v;
    do { crypto.getRandomValues(rndBuf); v = rndBuf[0]; } while (v >= lim);
    return v % n;
  }

  // ---------- DOM ----------
  var sceneEl = document.getElementById('scene'), pultEl = document.getElementById('pult');
  var sheetEl = document.getElementById('sheet'), sheetBg = document.getElementById('sheetbg'), toastEl = document.getElementById('toast');
  // портрет — solo (420×760); десктоп и ландшафт телефона — solo-wide (760×440). Рендерер раскладку на лету не меняет:
  // при смене пересоздаём сцену и отдаём ей текущий снимок.
  function wantLayout() { var w = window.innerWidth, h = window.innerHeight; return (w >= 820 && h >= 560) || (w >= 700 && h < 560) ? 'solo-wide' : 'solo'; }
  var table = null, curLayout = null;
  function createTable() {
    curLayout = wantLayout();
    table = BJTable.create(sceneEl, { fx: fxOn, lang: lang, layout: curLayout, levelBase: 0, instantGapMs: Infinity, onMargotTap: function () { openAsk(); } });
  }
  createTable();
  var resizeTimer = 0;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (wantLayout() === curLayout) return;
      table.destroy(); createTable();
      if (cur) table.render(cur.b);
    }, 150);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  // ---------- состояние страницы ----------
  var game = null, cur = null, session = null, recAtStart = null;
  var tut = { on: false, step: 0, acting: false };
  var lastAction = now(), nudged = false, hintCache = {}, pendingTimer = 0, target = 'main', lastHandSeen = 0, saveLocked = false, modal = false;

  function newGame() {
    game = G.Game.create({ settings: { solo: true, stack: 1000, pace: 'normal', format: 'last', cards: false, chat: false, lang: lang }, rnd: rnd });
    game.addPlayer({ id: ME, name: T('you') });
    session = { hands: 0, bestStack: 1000, streak: 0, bestStreak: 0, blackjacks: 0, bestSide: 0, hinted: false, over: false, newRec: {} };
    recAtStart = { records: copy(store.records), withHints: copy(store.withHints) };
    tut.on = !store.tutorialDone; tut.step = tut.on ? 1 : 0; tut.acting = false;
    hintCache = {}; target = 'main'; nudged = false; lastAction = now();
    var r = game.start(now());
    afterEvents(r.events || []);
    table.say(BJMargot.pick(lang, 'hello'));
  }
  function copy(o) { var c = {}; for (var k in o) c[k] = o[k]; return c; }

  // снимки: сцене — полный (она сама ведёт переворот по revealAt и рисует соло-финал), пульту — свой (options, итог по времени)
  function snaps() { var t = now(); return { b: game.snapshot(t, null), m: game.snapshot(t, ME), t: t }; }
  function render() {
    cur = snaps();
    table.render(cur.b);
    renderPult(cur);
    saveNow();
  }
  // Сохранение между раздачами: снимок движка в начале ставок (до первой фишки). Перезагрузка посреди раздачи откатывает
  // её к этому снимку — ставка возвращается в стек, стек не теряется.
  var savedHand = 0;
  function saveNow() {
    if (saveLocked || tut.on || !game) return;
    var st = game.s, pl = game.player(ME);
    if (st.phase === 'finished') { if (store.save) { store.save = null; save(KEY, store); } return; }
    if (st.phase !== 'betting' || pl.bet > 0 || pl.side.pp > 0 || pl.side.tp > 0 || st.hand < 2 || savedHand === st.hand) return;
    savedHand = st.hand;
    store.save = { s: JSON.parse(JSON.stringify(st)), session: session, recAtStart: recAtStart };
    save(KEY, store);
  }
  function validSave(sv) { return !!(sv && sv.s && sv.s.phase === 'betting' && sv.s.players && sv.s.players.length === 1 && sv.s.settings && sv.s.settings.solo && sv.session && sv.recAtStart); }
  function resumeGame() {
    var sv = store.save;
    game = G.Game.from(JSON.parse(JSON.stringify(sv.s)), rnd);
    session = sv.session; recAtStart = sv.recAtStart;

      case 'clear': r = game.clearBets(ME); if (fail(r)) { target = 'main'; render(); } break;
      case 'deal': case 'tut_deal':
        if (name === 'tut_deal' && game.player(ME).bet <= 0) game.setBets(ME, { main: Math.min(game.player(ME).stack, game.levelNeed() * 5), pp: 0, tp: 0 });
        r = game.ready(ME, true, t);
        if (fail(r)) { nudged = false; afterEvents(r.events); }
        break;
      case 'ins':
        r = game.insure(ME, arg === 'yes' ? true : arg === 'evenMoney' ? 'evenMoney' : false, t);
        if (fail(r)) { if (arg !== 'no') BJSfx.play('chip'); afterEvents(r.events); }
        break;
      case 'decide':
        var p = game.player(ME), hi = -1;
        for (var i = 0; i < p.hands.length; i++) if (!p.hands[i].done && !p.hands[i].decision) { hi = i; break; }
        if (hi < 0) return;
        r = game.decide(ME, hi, arg, t);
        if (fail(r)) { nudged = false; if (arg === 'double' || arg === 'split') BJSfx.play('chip'); afterEvents(r.events); }
        break;
      case 'next': if (game.s.phase === 'payout') { game.s.deadline = t; pump(); } break;
      case 'again': freshGame(); break;
      case 'ask': openAsk(); break;
      case 'tut_skip': finishTut(); render(); break;
      case 'tut_next': tutNext(); break;
    }
  }
  function tutNext() {
    var ph = game.s.phase;
    if (tut.step === 2) {
      if (ph === 'deciding' && game.pending().length) tut.step = 3;
      else if (ph === 'dealer') tut.step = 4;
      else tut.step = 5;
      render();
    } else if (tut.step === 3) { tut.acting = true; render(); }
    else if (tut.step === 4) { tut.step = 5; pump(); render(); }
    else if (tut.step === 5) { tut.step = 6; render(); }
    else if (tut.step === 6) { finishTut(); pump(); render(); }
  }
  function finishTut() { tut.on = false; tut.step = 0; tut.acting = false; store.tutorialDone = true; save(KEY, store); }

  pultEl.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el) { if (el.disabled) return; act(el.getAttribute('data-act'), el.getAttribute('data-arg')); return; }
    var chip = e.target.closest('[data-chip]');
    if (chip && !chip.disabled) { act('chip', parseInt(chip.getAttribute('data-chip'), 10)); return; }
    var box = e.target.closest('[data-box]');
    if (box) {
      if (longFired) { longFired = false; return; }
      var k = box.getAttribute('data-box');
      if (e.target.classList.contains('q')) { openSide(k); return; }
      if (k !== 'main' && game.player(ME).bet <= 0) { toast(T('err_over_main')); return; }
      target = k; render();
    }
  });
  // долгое нажатие на бокс — пояснение ставки
  var longTimer = 0, longFired = false;
  pultEl.addEventListener('pointerdown', function (e) {
    longFired = false;
    var box = e.target.closest('[data-box]');
    if (!box) return;
    var k = box.getAttribute('data-box');
    clearTimeout(longTimer);
    longTimer = setTimeout(function () { longFired = true; openSide(k); }, 450);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { pultEl.addEventListener(n, function () { clearTimeout(longTimer); }); });
  pultEl.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-box]')) e.preventDefault(); });

  // ---------- листы ----------
  var toastTimer = 0;
  function toast(text) { toastEl.textContent = text; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1800); }
  function openSheet(html) { sheetEl.innerHTML = html; sheetEl.classList.add('on'); sheetBg.classList.add('on'); sheetEl.scrollTop = 0; }
  function closeSheet() { if (modal) return; sheetEl.classList.remove('on'); sheetBg.classList.remove('on'); }
  sheetBg.addEventListener('click', closeSheet);
  function head(title) { return '<h3><span>' + esc(title) + '</span><button type="button" class="x" data-sh="close" aria-label="' + esc(T('close')) + '">×</button></h3>'; }
  sheetEl.addEventListener('click', function (e) {
    var el = e.target.closest('[data-sh]');
    if (!el) return;
    var k = el.getAttribute('data-sh');
    if (k === 'close') closeSheet();
    else if (k === 'rules') openRules();
    else if (k === 'ask') openAsk();
    else if (k === 'hints') { setHints(!hintsOn); openSettings(); if (game && game.s.phase === 'deciding') render(); }
    else if (k === 'fx') { fxOn = !fxOn; store.fx = fxOn; save(KEY, store); table.setFx(fxOn); openSettings(); }
    else if (k === 'tut') { store.tutorialDone = false; save(KEY, store); closeSheet(); freshGame(); }
    else if (k === 'new') { closeSheet(); freshGame(); }
    else if (k === 'resume') resumeGame();
    else if (k === 'fresh') { modal = false; closeSheet(); freshGame(); }
  });
  function openAsk() {
    if (!game) return;
    var s = snaps(), p = s.m.players[0], b = s.b, ph = b.phase, text;
    if (ph === 'betting') text = F('ask_betting', { min: fmt(b.minBet) });
    else if (ph === 'insurance') text = F('ask_insurance', { n: fmt(Math.floor(p.bet / 2)) });
    else if (ph === 'deciding') {
      var ai = -1; for (var i = 0; i < p.hands.length; i++) if (!p.hands[i].done && !p.hands[i].decision) { ai = i; break; }
      var h = ai >= 0 ? p.hands[ai] : p.hands[0];
      text = F('ask_deciding', { you: h ? valText(h) : '', up: upName(b.dealer.up), hint: h ? hintFor(h, Math.max(0, ai), b.dealer.up) : '' });
    } else if (ph === 'dealer' || ph === 'dealing' || ph === 'closing') text = T('ask_dealer');
    else if (ph === 'payout') text = T('ask_payout');
    else text = T('ask_finished');
    openSheet(head(T('ask_title')) + '<p class="say">' + esc(text) + '</p><div class="row act">' + '<button type="button" class="btn gold" data-sh="rules">' + esc(T('ask_all')) + '</button></div>');
    table.margot('think', 1500);
  }
  function openRules() {
    var cards = '';
    for (var i = 1; i <= 6; i++) cards += '<div class="card"><div class="n">' + i + ' / 6</div><div class="t">' + esc(T('rule_' + i + '_t')) + '</div><div class="b">' + esc(T('rule_' + i)) + '</div></div>';
    openSheet(head(T('rules_title')) + '<div class="cards" id="ruleCards">' + cards + '</div><div class="dots" id="ruleDots">' + '<i class="on"></i><i></i><i></i><i></i><i></i><i></i>' + '</div><div class="row act"><button type="button" class="btn" data-sh="ask">' + esc(T('ask_back')) + '</button><button type="button" class="btn gold" data-sh="close">' + esc(T('close')) + '</button></div>');
    var wrap = document.getElementById('ruleCards'), dots = document.getElementById('ruleDots');
    wrap.addEventListener('scroll', function () {
      var idx = Math.round(wrap.scrollLeft / Math.max(1, wrap.clientWidth));
      for (var j = 0; j < dots.children.length; j++) dots.children[j].className = j === idx ? 'on' : '';
    });
  }
  function tg(key, on, title, sub) { return '<div class="tg" data-sh="' + key + '"><div class="l">' + esc(title) + '<small>' + esc(sub) + '</small></div><div class="sw' + (on ? ' on' : '') + '"><i></i></div></div>'; }
  function recRow(label, row) {
    if (!(row.bestHands > 0)) return '';
    return '<tr><td>' + esc(label) + '</td><td>' + fmt(row.bestStack) + '</td><td>' + (row.bestHands || 0) + '</td><td>' + (row.bestStreak || 0) + '</td><td>' + (row.blackjacks || 0) + '</td><td>' + (row.bestSide ? '+' + fmt(row.bestSide) : '—') + '</td></tr>';
  }
  function openSettings() {
    var rows = recRow(T('rec_row_plain'), store.records) + recRow(T('rec_row_hints'), store.withHints);
    var rec = rows ? '<table><tr><th></th><th>' + esc(T('rec_h_stack')) + '</th><th>' + esc(T('rec_h_hands')) + '</th><th>' + esc(T('rec_h_streak')) + '</th><th>' + esc(T('rec_h_bj')) + '</th><th>' + esc(T('rec_h_side')) + '</th></tr>' + rows + '</table>' : '<p class="m">' + esc(T('rec_empty')) + '</p>';
    openSheet(head(T('set_title')) +
      tg('hints', hintsOn, T('set_hints'), T('set_hints_sub')) +
      tg('fx', fxOn, T('set_fx'), T('set_fx_sub')) +
      '<div class="tg" data-sh="tut"><div class="l">' + esc(T('set_tut')) + '<small>' + esc(T('set_tut_sub')) + '</small></div><span style="color:var(--gold-hi)">→</span></div>' +
      '<h3 style="margin-top:14px">' + esc(T('set_records')) + '</h3>' + rec +
      '<div class="row act"><button type="button" class="btn" data-sh="new">' + esc(T('set_new')) + '<small>' + esc(T('set_new_sub')) + '</small></button><a class="btn gold" href="blackjack.html">' + esc(T('set_friends')) + '<small>' + esc(T('set_friends_sub')) + '</small></a></div>');
  }
  function openSide(box) {
    var html;
    if (box === 'pp') html = head(T('side_pp_title')) + '<p>' + esc(T('side_pp_text')) + '</p><ul class="list"><li>' + esc(T('pp_mixed')) + '<b>5:1</b></li><li>' + esc(T('pp_colored')) + '<b>10:1</b></li><li>' + esc(T('pp_perfect')) + '<b>25:1</b></li></ul>';
    else if (box === 'tp') html = head(T('side_tp_title')) + '<p>' + esc(T('side_tp_text')) + '</p><ul class="list"><li>' + esc(T('tp_flush')) + '<b>5:1</b></li><li>' + esc(T('tp_straight')) + '<b>10:1</b></li><li>' + esc(T('tp_trips')) + '<b>30:1</b></li><li>' + esc(T('tp_sf')) + '<b>40:1</b></li><li>' + esc(T('tp_strips')) + '<b>100:1</b></li></ul>';
    else html = head(T('box_main')) + '<p>' + esc(F('ask_betting', { min: fmt(game ? game.levelNeed() : 10) })) + '</p>';
    openSheet(html + '<div class="row act"><button type="button" class="btn gold" data-sh="close">' + esc(T('close')) + '</button></div>');
  }
  document.getElementById('settingsBtn').addEventListener('click', openSettings);

  // меню разделов
  var menuBtn = document.getElementById('menuBtn'), menuDrop = document.getElementById('menuDrop');
  function setMenu(open) { menuBtn.classList.toggle('open', open); menuDrop.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  menuBtn.addEventListener('click', function (e) { e.stopPropagation(); setMenu(!menuDrop.classList.contains('open')); });
  document.addEventListener('click', function (e) { if (!menuDrop.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { setMenu(false); closeSheet(); } });

  // язык
  window.addEventListener('langchange', function (e) {
    lang = e.detail.lang;
    table.setLang(lang);
    if (game) { game.player(ME).name = T('you'); hintCache = {}; render(); }
    if (sheetEl.classList.contains('on')) closeSheet();
  });

  // ---------- отладочный хук (стенд, Playwright) ----------
  window.BJSOLO = {
    game: function () { return game; }, table: function () { return table; }, render: render, snaps: snaps, tut: tut, store: store,
    debug: {
      // rig(['10s','Ac','6h',…]) — следующие карты шуза в порядке сдачи: игрок, дилер открытая, игрок, дилер закрытая, добор…
      rig: function (cards) { cards.slice().reverse().forEach(function (c) { game.s.shoe.push(c); }); },
      stack: function (n) { game.player(ME).stack = n; render(); },
      skip: function () { if (game.s.deadline != null) { game.s.deadline = now(); } pump(); },
      state: function () { return game.s; },
      session: function () { return session; },
      act: act, newGame: newGame, finishTut: finishTut
    }
  };

  if (validSave(store.save)) {
    saveLocked = true; modal = true;
    newGame();
    var sv = store.save, pl = sv.s.players[0];
    openSheet('<h3><span>' + esc(T('cont_title')) + '</span></h3><p>' + esc(F('cont_text', { hand: sv.s.hand, stack: fmt(pl.stack) })) + '</p><div class="row act"><button type="button" class="btn" data-sh="fresh">' + esc(T('cont_new')) + '</button><button type="button" class="btn gold" data-sh="resume">' + esc(T('cont_go')) + '</button></div>');
  } else newGame();
})();
</script>
