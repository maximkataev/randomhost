}

function drawCardsTab() {
  const t = document.getElementById("cardstab");
  if (!t || !state) return;
  const n = state.me ? state.me.hand.length : 0;
  const on = state.settings.cards;
  t.innerHTML = `<span class="fan${n ? "" : " empty"}"><b></b><b></b><b></b>${on ? `<span class="n">${n}</span>` : ""}</span>${escapeHtml(T("tab_cards"))}`;
}

let lastReady = false;
let shownStackVal = null;
function drawHud() {
  const p = mine();
  if (!p || !els.stack) return;
  const bet = rlSum(myBets);
  // до остановки шарика сервер держит стек «до спина», а ставки лежат на столе — вычитаем их;
  // на выплате стек уже пересчитан, и ставки вычитать нельзя
  const settled = state.phase === "payout" || state.phase === "finished";
  const val = settled ? p.stack : p.stack - (state.phase === "betting" ? bet : p.betTotal);
  els.stack.textContent = rlNum(val);
  // стек вырос на выплате — цифра подпрыгивает
  if (shownStackVal != null && val > shownStackVal && settled) { els.stack.classList.remove("bump"); void els.stack.offsetWidth; els.stack.classList.add("bump"); }
  shownStackVal = val;
  els.mystack.style.cssText = rlChipVars(p.color);
  const need = p.need || 0;
  const betting = state.phase === "betting" && !p.frozen && !p.out;
  const short = betting && bet < need;
  els.need.classList.toggle("short", short);
  els.need.classList.toggle("ok", betting && need > 0 && bet >= need);
  els.needl.innerHTML = tpl("need_lbl", { bet: `<b>${rlNum(bet)}</b>`, min: `<b>${rlNum(need)}</b>` });
  // шкала: сколько поставлено от минимума; недобор — оранжевая штриховка с суммой штрафа
  els.meter.style.width = (need > 0 ? Math.min(100, (bet / need) * 100) : bet > 0 ? 100 : 0) + "%";
  els.metertx.textContent = short ? tpl("penalty_warn", { n: rlNum(need - bet) }) : betting && need > 0 ? T("meter_ok") : "";
  const rb = document.getElementById("readybtn");
  if (rb) {
    const on = !!p.ready && state.phase === "betting";
    rb.classList.toggle("on", on);
    rb.textContent = T(on ? "act_ready_on" : "act_ready");
    rb.disabled = state.phase !== "betting" || p.out;
    // «Готов» ставится штампом: удар, звук, короткая вибрация
    if (on && !lastReady) { rb.classList.remove("stamp"); void rb.offsetWidth; rb.classList.add("stamp"); rlSfx.stamp(); if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {} }
    lastReady = on;
  }
}

function drawHistory() {
  const h = els.felt && els.felt.querySelector(".hist");
  if (!h || !state) return;
  const bg = { red: "var(--red)", black: "var(--black)", green: "var(--zero)" };
  h.replaceChildren(...state.history.slice(0, 3).map((n) => { const i = el("i", null, String(n)); i.style.background = bg[rlColor(n)]; return i; }));
}

// Покрывало над столом: закрытие ставок, «смотрите на экран», итог спина, заморозка, пауза, выбыл.
// Содержимое пересобираем только при смене ключа — иначе анимации перезапускались бы на каждом снимке.
function netOf(x) { return x ? x.net + x.share + x.eye : 0; }
function resultLines(x) {
  const lines = [];
  if (!x) return lines;
  if (x.penalty) lines.push(tpl("res_penalty", { n: rlNum(x.penalty) }));
  for (const tr of state.result.transfers || []) {
    const nm = (id) => escapeHtml((player(id) || {}).name || "?");
    if (tr.card === "share" && tr.by === me) lines.push(tpl("res_share_in", { name: nm(tr.target), n: rlNum(tr.amount) }));
    if (tr.card === "share" && tr.target === me) lines.push(tpl("res_share_out", { name: nm(tr.by), n: rlNum(tr.amount) }));
    if (tr.card === "eye" && tr.by === me) lines.push(tpl("res_eye_in", { name: nm(tr.target), n: rlNum(tr.amount) }));
  }
  return lines;
}
function drawVeil() {
  const v = els.veil;
  const p = mine();
  if (!v || !p) return;
  const s = state;
  const felt = els.felt;
  felt.classList.toggle("frozen", !!p.frozen);
  felt.classList.toggle("locked", s.phase !== "betting");
  let key = null, build = null, cls = "";
  if (s.phase === "betting" && s.paused) {
    key = "paused";
    build = () => `<div class="icon">⏸</div><div class="big">${T("paused")}</div><p>${T("paused_text")}</p>`;
  } else if (s.phase === "betting" && p.out) {
    key = "out";
    build = () => `<div class="icon wink">😎</div><div class="big">${T("out_title")}</div><p>${T("out_text")}</p><div class="quip">${T("out_quip")}</div>`;
  } else if (s.phase === "betting" && p.frozen) {
    key = "frozen:" + s.spin;
    cls = "frost";
    build = () => { rlSfx.freeze(); return `<div class="icon">❄️</div><div class="big">${T("frozen")}</div><p>${escapeHtml(tpl("frozen_text", { n: rlNum(p.need) }))}</p>`; };
  } else if (s.phase === "closing") {
    key = "closing:" + s.spin;
    cls = "soft";
    build = () => { rlSfx.sweep(); setTimeout(() => rlSfx.stamp(), 120); return `<div class="wave"></div><div class="nomore">${T("no_more")}</div>`; };
  } else if (s.phase === "spinning") {
    key = "spin:" + s.spin;
    build = () => `<div class="spinbox">${wheelSvg("ring", false)}<div class="ball" id="sball"></div></div><div class="look" id="slook">${T("look")}</div><p>${T("look_sub")}</p>`;
  } else if ((s.phase === "payout" || s.phase === "finished") && s.result && s.result.number != null && s.result.perPlayer) {
    key = "res:" + s.spin + ":" + ((window.I18N && I18N.lang) || "");
    cls = "res";
    build = () => {
      const n = s.result.number;
      const x = s.result.perPlayer[me];
      const net = netOf(x);
      const played = x && (x.wager > 0 || x.penalty > 0);
      let quip = "";
      if (!played) quip = T("nobet");
      else if (net < 0 && n === 0) quip = T("zero_quip");
      else if (net < 0) { const q = T("lose_quips").split("|"); quip = q[s.spin % q.length]; }
      else if (net === 0) quip = T("even_quip");
      const netTxt = !played ? "" : net > 0 ? tpl("res_plus", { n: rlNum(net) }) : net < 0 ? tpl("res_minus", { n: rlNum(-net) }) : T("res_zero");
      const lines = resultLines(x);
      return `<div class="numball ${rlColor(n)}">${n}</div>${netTxt ? `<div class="net ${net > 0 ? "plus" : net < 0 ? "minus" : ""}">${netTxt}</div>` : ""}<div class="lines">${lines.map((l) => `<div>${l}</div>`).join("")}</div>${quip ? `<div class="quip">${escapeHtml(quip)}</div>` : ""}`;
    };
  }
  // подсветка выпавшего числа и маркер на нём — пока идёт выплата
  const hitN = (s.phase === "payout" || s.phase === "finished") && s.result && s.result.number != null ? s.result.number : null;
  felt.querySelectorAll(".cell.hit").forEach((c) => { if (Number(c.dataset.n) !== hitN) c.classList.remove("hit"); });
  if (hitN != null) felt.querySelectorAll(`.cell[data-n="${hitN}"]`).forEach((c) => c.classList.add("hit"));
  v.classList.toggle("on", key != null);
  if (key !== v.dataset.key) {
    v.dataset.key = key || "";
    v.className = "veil" + (cls ? " " + cls : "") + (key != null ? " on" : "");
    if (build) v.innerHTML = build();
  }
  if (s.phase === "spinning") startSuspense(); else stopSuspense();
}

// ---------- ожидание шарика: без числа, только темп ----------
// Шарик на кольце тормозит к revealAt, сердце стучит чаще — телефон не знает числа и не спойлерит.
let susp = null;
function startSuspense() {
  if (susp || !state.result) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const t0 = rlNow();
  const end = state.result.revealAt || t0 + 10000;
  susp = { raf: 0, ang: 0, ring: 0, last: performance.now(), nextBeat: performance.now() + 300 };
  // без анимации шарик просто лежит на дорожке, а не на турели
  if (reduce) { const b = document.getElementById("sball"); if (b) { const r = b.parentNode.clientWidth * 0.39; b.style.transform = `translate(${r * 0.7}px, ${-r * 0.7}px)`; } }
  const step = (now) => {
    if (!susp) return;
    const dt = Math.min(50, now - susp.last) / 1000;
    susp.last = now;
    const k = Math.max(0, Math.min(1, (rlNow() - t0) / Math.max(1, end - t0)));
    const ball = document.getElementById("sball"), ring = els.veil.querySelector(".ring");
    if (!reduce && ball && ring) {
      susp.ang -= dt * (9 * Math.pow(1 - k, 1.4) + 0.6); // по бортику против колеса, с торможением
      susp.ring += dt * 0.5;
      const r = ball.parentNode.clientWidth * 0.39;
      ball.style.transform = `translate(${Math.cos(susp.ang) * r}px, ${Math.sin(susp.ang) * r}px)`;
      ring.style.transform = `rotate(${susp.ring}rad)`;
    }
    if (now >= susp.nextBeat) {
      rlSfx.heart(k);
      const look = document.getElementById("slook");
      if (look && !reduce) { look.classList.remove("beat"); void look.offsetWidth; look.classList.add("beat"); }
      susp.nextBeat = now + 950 - 520 * k;
    }
    susp.raf = requestAnimationFrame(step);
  };
  susp.raf = requestAnimationFrame(step);
}
function stopSuspense() {
  if (!susp) return;
  cancelAnimationFrame(susp.raf);
  susp = null;
}

// ---------- итог спина: выигрыш на весь экран, зеро — зелёная вспышка, проигрыш — коротко ----------
let splashT = null;
function showOutcome() {
  const r = state.result;
  const x = r.perPlayer[me];
  const net = netOf(x);
  const n = r.number;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (n === 0) {
    const g = el("div", "greenflash");
    document.body.append(g);
    setTimeout(() => g.remove(), 1000);
    if (!(net > 0)) rlSfx.zero();
  }
  if (!(net > 0)) {
    if (x && net < 0) rlSfx.lose();
    return;
  }
  // «Джекпот» — только прямое попадание 35:1; крупный выигрыш на сплите просто получает больше фишек в залпе
  const jackpot = !!(x.top && x.top.pays === 35);
  const big = jackpot || net >= 10 * Math.max(1, state.minBet);
  const my = mine();
  const top = x.top ? tpl("res_top", { bet: rlBetName(x.top.key), pays: x.top.pays }) : "";
  const lines = resultLines(x);
  let chips = "";
  if (!reduce) {
    const cols = [my ? my.color : "#f2c14e", "#e7c068", "#cf2331", "#17130f", "#f7eedb"];
    const cnt = big ? 34 : 20;
    for (let i = 0; i < cnt; i++) {
      const a = (i / cnt) * Math.PI * 2 + Math.random() * 0.4;
      const d = 130 + Math.random() * (big ? 260 : 170);
      chips += `<i class="rchip" style="${rlChipVars(cols[i % cols.length])};--x:${(Math.cos(a) * d).toFixed(0)}px;--y:${(Math.sin(a) * d + 60).toFixed(0)}px;--r:${(Math.random() * 720 - 360).toFixed(0)}deg;--d:${(0.9 + Math.random() * 0.7).toFixed(2)}s"></i>`;
    }
  }
  const sp = els.splash;
  sp.className = "splash on" + (n === 0 ? " zero" : "");
  sp.innerHTML = `<div class="rays"></div><div class="burst">${chips}</div>
    <div class="numball ${rlColor(n)}">${n}</div>
    <div class="stamp">${T(jackpot ? "jackpot_stamp" : "win_stamp")}</div>
    <div class="win" id="wincount">+0</div>
    ${top ? `<div class="sub">${escapeHtml(top)}</div>` : ""}
    ${lines.length ? `<div class="sub">${lines.join("<br>")}</div>` : ""}
    <div class="tapx">${T("tap_close")}</div>`;
  rlSfx.win(big);
  if (navigator.vibrate) try { navigator.vibrate(big ? [60, 50, 60, 50, 120] : [40, 60, 40]); } catch (e) {}
  // сумма набегает, как на табло
  const cnt = document.getElementById("wincount");
  const t0 = performance.now(), dur = reduce ? 1 : 1300;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    if (cnt) cnt.textContent = tpl("res_plus", { n: rlNum(Math.round(net * (1 - Math.pow(1 - k, 3)))) });
    if (k < 1 && sp.classList.contains("on")) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  clearTimeout(splashT);
  splashT = setTimeout(closeSplash, big ? 4200 : 3400);
}
function closeSplash() {
  const sp = els.splash;
  if (!sp || !sp.classList.contains("on")) return;
  clearTimeout(splashT);
  sp.classList.add("out");
  setTimeout(() => { sp.className = "splash"; sp.innerHTML = ""; }, 360);
}

let lastTickSec = null;
function tickTimer() {
  if (!state || !els.ring) return;
  const s = state;
  let left = 0, total = s.settings.betTime;
  if (s.phase === "betting" && s.deadline && !s.paused) left = Math.max(0, s.deadline - rlNow());
  if (s.paused) left = total;
  const frac = s.phase === "betting" ? Math.min(1, left / total) : 0;
  const hot = s.phase === "betting" && !s.paused && left < 5000;
  els.ring.setAttribute("stroke-dashoffset", String(125.7 * (1 - frac)));
  els.ring.setAttribute("stroke", hot ? "#ff7a45" : "#e7c068");
  const sec = s.phase === "betting" && !s.paused ? Math.ceil(left / 1000) : null;
  els.tv.textContent = sec == null ? "" : String(sec);
  els.timer.classList.toggle("hot", hot);
  els.felt.parentNode.classList.toggle("hot", hot);
  const g = document.getElementById("ghost");
  if (g && sec !== lastTickSec) {
    g.textContent = hot && sec > 0 ? String(sec) : "";
    if (hot) { g.classList.remove("pop"); void g.offsetWidth; g.classList.add("pop"); }
  }
  // последние секунды тикают вслух, если ещё не нажал «Готово»
  if (hot && sec !== lastTickSec && sec > 0) { const p = mine(); if (p && !p.ready && !p.out) rlSfx.tick(true); }
  lastTickSec = sec;
}
setInterval(tickTimer, 250);

// ---------- выдвижные панели ----------

function openSheet(nodes) {
  const sh = document.getElementById("sheet");
  sh.replaceChildren(...nodes);
  sh.classList.add("on");
  document.getElementById("sheetbg").classList.add("on");
}
function closeSheet() {
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("sheetbg").classList.remove("on");
}
document.getElementById("sheetbg").onclick = closeSheet;

function openCards() {
  const h = el("h3", null, T("cards_title"));
  if (!state.settings.cards) return openSheet([h, el("p", "hint", T("cards_off"))]);
  const hand = (state.me && state.me.hand) || [];
  const p = mine();
  const played = p && p.played;
  const hint = el("p", "hint", played ? T("cards_played") : T("cards_hint"));
  if (!hand.length) return openSheet([h, el("p", "hint", T("cards_none"))]);
  const list = el("div", "cardlist");
  for (const c of hand) {
    const b = el("button", "gcard" + (c === "shield" ? " passive" : ""));
    b.style.setProperty("--k", CARD_INK[c] || "#7d0f19");
    b.innerHTML = `<div class="ic">${RL_CARDS[c].icon}</div><div><b>${escapeHtml(T("card_" + c))}</b><small>${escapeHtml(T("card_" + c + "_d"))}</small></div>`;
    b.disabled = c === "shield" || played || state.phase !== "betting" || (p && p.out);
    b.onclick = () => openTargets(c);
    list.append(b);
  }
  openSheet([h, hint, list]);
}

// рубашка карты своего цвета: смерть — багровая, лёд — синий, магнит — сталь, сглаз — бирюза, щит — латунь
const CARD_INK = { double: "#7d0f19", freeze: "#1f5f8f", share: "#4a5560", eye: "#0f6b73", shield: "#8a6420" };

function openTargets(card) {
  const h = el("h3", null, `${RL_CARDS[card].icon} ${T("card_" + card)} — ${T("target_title")}`);
  const list = el("div", "targets");
  for (const p of state.players.filter((x) => x.id !== me && !x.out && !x.left)) {
    const b = el("button", "target");
    b.innerHTML = `${chipHtml(p.color, initials(p.name))}<b>${escapeHtml(p.name)}</b><span class="s">${rlNum(p.stack)}</span>`;
    b.onclick = () => { conn.send({ type: "card", card, target: p.id }); closeSheet(); };
    list.append(b);
  }
  openSheet([h, list]);
}

function openChat() {
  const h = el("h3", null, T("chat_title"));
  if (!state.settings.chat) return openSheet([h, el("p", "hint", T("chat_off"))]);
  if (state.me && state.me.muted) return openSheet([h, el("p", "hint", T("chat_muted"))]);
  const hint = el("p", "hint", T("chat_hint"));
  const form = el("form", "chatbox");
  const input = el("input");
  input.maxLength = 80;
  input.placeholder = T("chat_ph");
  input.enterKeyHint = "send";
  const send = el("button", "btn", T("chat_send"));
  send.type = "submit";
  form.append(input, send);
  form.onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    conn.send({ type: "chat", text });
    input.value = "";
    closeSheet();
  };
  // готовые фразы — одним тапом, без клавиатуры
  const quick = el("div", "quick");
  for (const q of T("quick").split("|")) {
    const b = el("button", null, q);
    b.type = "button";
    b.onclick = () => { conn.send({ type: "chat", text: q }); closeSheet(); };
    quick.append(b);
  }
  openSheet([h, hint, form, quick]);
  setTimeout(() => input.focus(), 250);
}

function openCopy() {
  if (!canBet()) return;
  const h = el("h3", null, T("copy_title"));
  const list = el("div", "targets");
  const who = state.players.filter((x) => x.id !== me && !x.out && x.betTotal > 0);
  if (!who.length) return openSheet([h, el("p", "hint", T("copy_empty"))]);
  for (const p of who) {
    const b = el("button", "target");
    b.innerHTML = `${chipHtml(p.color, initials(p.name))}<b>${escapeHtml(p.name)}</b><span class="s">${rlNum(p.betTotal)}</span>`;
    b.onclick = () => {
      // чужие ставки в пределах своего стека: при нехватке — пропорционально меньше
      const my = mine();
      const k = Math.min(1, my.stack / p.betTotal);
      const next = {};
      for (const [key, v] of Object.entries(p.bets)) { const a = Math.floor(v * k); if (a > 0) next[key] = a; }
      pushBets(next);
      closeSheet();
    };
    list.append(b);
  }
  openSheet([h, list]);
}

function openExact(n) {
  const h = el("h3", null, tpl("exact_title", { n }));
  const list = el("div", "exact");
  const keys = Object.keys(RL_BETS).filter((k) => RL_BETS[k].numbers.includes(n) && RL_BETS[k].numbers.length <= 6);
  keys.sort((a, b) => RL_BETS[a].numbers.length - RL_BETS[b].numbers.length);
  for (const k of keys) {
    const b = el("button");
    b.innerHTML = `<span>${escapeHtml(rlBetName(k))}${myBets[k] ? ` · ${rlNum(myBets[k])}` : ""}</span><span class="p">${RL_BETS[k].pays}:1</span>`;
    b.onclick = () => { addChip(k); closeSheet(); };
    list.append(b);
  }
  if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
  openSheet([h, list]);
}

// ---------- отрисовка по состоянию ----------

function render() {
  if (dead) return;
  if (!state) return;
  const p = mine();
  if (!p) {
    // есть токен — ждём ответа на join, а не показываем форму имени на полсекунды
    if (!token && screen !== "enter") renderEnter();
    return;
  }
  if (state.phase === "lobby") {
    screen = "wait";
    screenMode(null);
    const seated = state.players.filter((x) => !x.left);
    // новенькие падают на сукно со щелчком, старые лежат спокойно
    const fresh = seated.filter((x) => !lobbySeen.has(x.id));
    const list = seated.map((x) => `<div class="who${x.id === me ? " me" : ""}${lobbySeen.has(x.id) ? "" : " new"}">${chipHtml(x.color, initials(x.name))}<b>${escapeHtml(x.name)}</b></div>`).join("");
    if (fresh.length && lobbySeen.size) rlSfx.chip();
    fresh.forEach((x) => lobbySeen.add(x.id));
    app.innerHTML = `<div class="center"><div class="room">${escapeHtml(CODE)}</div><h2>${T("wait_title")}</h2><p>${T("wait_text")}</p>
      <div class="waitfelt"><div class="wf-head"><span class="live"><i></i>${T("wait_live")}</span><span>${escapeHtml(tpl("wait_seats", { n: seated.length }))}</span></div><div class="lobby-list">${list}</div><div class="wf-foot">${T("wait_tap")}</div></div>
      <div class="howto"><div><i>👆</i>${T("how1")}</div><div><i>✌️</i>${T("how2")}</div><div><i>✋</i>${T("how3")}</div></div>
      <button class="link" id="leave">${T("btn_leave")}</button></div>`;
    app.querySelector(".lobby-list").onclick = (e) => {
      const c = e.target.closest(".rchip");
      if (!c) return;
      c.classList.remove("flip"); void c.offsetWidth; c.classList.add("flip");
      rlSfx.chip();
      if (navigator.vibrate) try { navigator.vibrate(6); } catch (e2) {}
    };
    document.getElementById("leave").onclick = () => { conn.send({ type: "leave" }); try { localStorage.removeItem(tokenKey()); } catch (e) {} me = null; token = null; renderEnter(); };
    myBets = {};
    undo = [];
    return;
  }
  if (state.phase === "finished") {
    const key = "final:" + state.spin + ":" + state.winnerId + ":" + ((window.I18N && I18N.lang) || "");
    if (screen === "final" && app.dataset.key === key) return;
    stopSuspense();
    screen = "final";
    screenMode(null);
    app.dataset.key = key;
    const w = player(state.winnerId);
    const won = state.winnerId === me;
    const place = p.place || "–";
    const medal = won ? "cup" : place === 2 ? "silver" : place === 3 ? "bronze" : "plain";
    let rain = "";
    if (won && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const cols = state.players.map((x) => x.color).concat(["#e7c068", "#cf2331", "#17130f"]);
      for (let i = 0; i < 40; i++) rain += `<i class="rchip" style="${rlChipVars(cols[i % cols.length])};left:${(Math.random() * 100).toFixed(1)}%;--d:${(2.4 + Math.random() * 2).toFixed(2)}s;--w:${(Math.random() * 2.5).toFixed(2)}s;--r:${(Math.random() * 900 - 450).toFixed(0)}deg"></i>`;
    }
    app.innerHTML = `<div class="final">${rain ? `<div class="rain">${rain}</div>` : ""}
      <div class="medal ${medal}">${won ? "🏆" : place}</div>
      <h2>${won ? T("fin_win") : escapeHtml(tpl("fin_place", { n: place }))}</h2>
      ${won ? `<p class="winner">${chipHtml(p.color, initials(p.name))}<b>${rlNum(p.stack)}</b></p>` : w ? `<p class="winner">${chipHtml(w.color, initials(w.name))}<span>${escapeHtml(tpl("fin_winner", { name: w.name }))}</span></p>` : ""}
      <p class="quip">${T("fin_quip")}</p>
      <div class="top3">${state.players.filter((x) => !x.left && x.place && x.place <= 3).sort((x, y) => x.place - y.place).map((x) => `<div class="${x.id === me ? "me" : ""}"><span class="pl">${x.place}</span>${chipHtml(x.color, initials(x.name))}<b>${escapeHtml(x.name)}</b><span class="st">${rlNum(x.stack)}</span></div>`).join("")}</div>
      <p style="color:var(--muted);margin-top:8px">${T("fin_wait")}</p></div>`;
    if (won) rlSfx.win(true);
    return;
  }
  // выбывший смотрит на стол без права ставить, но с чатом и реакциями
  if (screen !== "game") { app.dataset.key = ""; buildGame(); }
  let freshSpin = false;
  if (state.spin !== lastSpin) {
    lastSpin = state.spin;
    myBets = Object.assign({}, p.bets);
    undo = [];
    freshSpin = true;
  } else if (Date.now() > pendingUntil) {
    myBets = Object.assign({}, p.bets);
  }
  if (els.rack.dataset.min !== String(state.minBet)) buildRack();
  drawHud();
  drawChips();
  drawHeat();
  if (state.phase === "betting") bubbleNewBets(freshSpin); else seenBets = {};
  drawHistory();
  drawVeil();
  drawCardsTab();
  // выбывший: вместо лотка фишек — табличка трибуны (место не пустеет и не прыгает)
  els.controls.classList.toggle("spect", !!p.out);
  els.controls.dataset.spect = T("spect");
  if (state.phase === "payout" && lastPhase !== "payout" && lastPhase != null && state.result && state.result.perPlayer) showOutcome();
  if (state.phase !== "payout") closeSplash();
  lastPhase = state.phase;
  tickTimer();
}

window.addEventListener("resize", () => { if (screen === "game") drawChips(); });
window.addEventListener("langchange", () => {
  if (!CODE) return renderLanding();
  if (screen === "enter") return renderEnter();
  if (screen === "game") { buildGame(); }
  screen === "expired" ? renderExpired() : render();
});

// ---------- связь ----------

function onMessage(m) {
  switch (m.type) {
    case "hello":
    case "state":
      state = m.state;
      if (m.type === "hello" && token && !me) conn.send({ type: "join", token });
      render();
      break;
    case "joined":
      me = m.playerId;
      token = m.token;
      try { localStorage.setItem(tokenKey(), token); } catch (e) {}
      render();
      break;
    case "rejected":
      toast(T("rj_" + m.reason) !== "rj_" + m.reason ? T("rj_" + m.reason) : m.reason);
      if (m.action === "set_bets" || m.action === "bet") { pendingUntil = 0; const p = mine(); if (p) myBets = Object.assign({}, p.bets); drawChips(); drawHud(); }
      break;
    case "error":
      if (m.error === "room_expired") return renderExpired();
      if (["game_started", "room_full", "token_gone", "bad_name"].includes(m.error)) {
        if (m.error === "token_gone") { try { localStorage.removeItem(tokenKey()); } catch (e) {} token = null; }
        joinErr = m.error === "bad_name" ? "err_name" : "err_" + m.error;
        me = null;
        renderEnter();
      }
      break;
    case "kicked":
      me = null;
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
      token = null;
      screen = "kicked";
      renderCenter("kicked_title");
      break;
    case "replaced":
      me = null;
      screen = "replaced";
      renderCenter("replaced_title", "replaced_text", `<button class="btn" id="here">${T("btn_back_here")}</button>`);
      document.getElementById("here").onclick = () => { conn.send({ type: "join", token }); };
      break;
    case "event":
      break;
  }
}

function start() {
  if (!CODE) return renderLanding();
  renderCenter("wait_title");
  const banner = document.getElementById("conn");
  conn = rlConnect({
    code: CODE,
    onMessage,
    onGone: renderExpired,
    // переподключились — снова садимся за стол своим токеном (hello придёт первым)
    onOpen: () => { me = null; },
    onState: (st) => { banner.textContent = T("conn_lost"); banner.classList.toggle("on", st === "lost"); },
  });
}
start();
