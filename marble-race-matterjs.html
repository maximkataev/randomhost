<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Гонка Мраморов — Рандомайзер</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f3f1.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/2.0.20/matter.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

    body {

      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
      touch-action:manipulation;
      scrollbar-gutter:stable;
      overflow-y:scroll;
    }

    .top-buttons { position:fixed; top:20px; left:20px; z-index:1000; }
    .desktop-menu-toggle {
      position:relative; background:linear-gradient(135deg,rgba(30,35,60,.85),rgba(50,30,70,.85));

    }
    .desktop-menu-toggle:hover { transform:translateY(-3px) scale(1.05); border-color:rgba(255,255,255,.5); }
    .desktop-menu-toggle:active { transform:translateY(-1px) scale(.98); }
    .menu-icon { display:flex; flex-direction:column; justify-content:center; align-items:center;
      width:24px; height:18px; position:relative; transition:transform .3s ease; }
    .menu-icon span { display:block; width:100%; height:3px; background:#fff; border-radius:2px;
      position:absolute; left:0; transition:all .4s cubic-bezier(.68,-.55,.265,1.55); }
    .menu-icon span:nth-child(1) { top:0; }
    .menu-icon span:nth-child(2) { top:50%; margin-top:-1.5px; }
    .menu-icon span:nth-child(3) { bottom:0; }
    .desktop-menu-toggle:hover .menu-icon { transform:scale(1.1); }
    .desktop-menu-toggle.active .menu-icon span:nth-child(1) { top:50%; margin-top:-1.5px; transform:rotate(45deg); }
    .desktop-menu-toggle.active .menu-icon span:nth-child(2) { opacity:0; transform:rotate(180deg) scale(0); }
    .desktop-menu-toggle.active .menu-icon span:nth-child(3) { bottom:auto; top:50%; margin-top:-1.5px; transform:rotate(-45deg); }
    .desktop-dropdown { position:absolute; top:100%; left:0; margin-top:15px;
      background:linear-gradient(135deg,rgba(20,25,45,.92),rgba(40,20,55,.92));
      backdrop-filter:blur(20px); border-radius:16px; border: 1px solid rgba(255,255,255,.15);
      overflow:hidden; max-height:0; opacity:0; transform:translateY(-10px);
      transition:max-height .4s,opacity .3s,transform .4s; min-width:240px; }
    .desktop-dropdown.active { max-height:700px; opacity:1; transform:translateY(0); }
    .desktop-dropdown a { position:relative; display:flex; align-items:center; gap:14px; padding:16px 20px;
      color:#fff; text-decoration:none; font-size:16px; font-weight:600;
      border-bottom:1px solid rgba(255,255,255,.08); transition:all .3s; overflow:hidden; }
    .desktop-dropdown a:last-child { border-bottom:none; }
    .desktop-dropdown a:hover { background:rgba(102,126,234,.25); padding-left:24px; color:#ffd43b; }
    .desktop-dropdown a.current { color:#ffd43b; }

    .menu-container { display:none; }

    .menu-title { color:#fff; font-size:17px; font-weight:700; }
    .burger-btn { background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.3);
      border-radius:8px; padding:7px 11px; cursor:pointer; display:flex; flex-direction:column; gap:4px; transition:all .3s; }
    .burger-btn span { display:block; width:22px; height:3px; background:#fff; border-radius:2px; transition:all .3s; }

    .menu-dropdown { position:absolute; top:100%; left:0; right:0;

    .main-container { display: flex; gap: 40px; align-items: center; justify-content: center;

    .obstacle-course { height: 84vh; width: 35vw;

    .remove-btn { width: 44px; padding: 8px 0; background: rgba(239,68,68,0.7); color: #fff; border: none;

    .error-message { color: #fff; font-size: 13px; margin-top: 8px; min-height: 16px; }

    .probability-error-tooltip { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      background:linear-gradient(135deg,rgba(239,68,68,.95),rgba(220,38,38,.95));
      color:#fff; padding:18px 28px; border-radius:14px; z-index:1002; font-weight:700;
      font-size:15px; text-align:center; backdrop-filter:blur(10px);
      border:2px solid rgba(255,255,255,.3);
      animation:tooltipAppear .3s cubic-bezier(.68,-.55,.265,1.55); }
    @keyframes tooltipAppear { from { opacity:0; transform:translate(-50%,-50%) scale(.8); }
      to { opacity:1; transform:translate(-50%,-50%) scale(1); } }

    @media (max-width:1100px) { .main-container { flex-direction:column; align-items:center; gap:24px; }
      .settings-panel { width:100%; max-width:510px; } }
    @media (max-width:918px) { html,body { max-width:100%; overflow-x:hidden; }
      body { padding:calc(66px + var(--safe-top)) 12px calc(20px + var(--safe-bottom)) 12px; }
      .top-buttons { display:none; }
      .menu-container { display:block; position:fixed; top:var(--safe-top); left:var(--safe-left);
        right:var(--safe-right); z-index:1000; padding:10px 14px;
        background:linear-gradient(180deg,rgba(102,126,234,.95) 0%,rgba(118,75,162,.85) 100%);
        backdrop-filter:blur(10px); }
      .settings-panel { padding:16px 14px; width:100%; max-width:100%; } }
    button:disabled { opacity:.5; cursor:not-allowed!important; }
  </style>

<script>
// Matter.js modules
const Engine = Matter.Engine;
const World = Matter.World;
const Bodies = Matter.Bodies;
const Body = Matter.Body;
const Events = Matter.Events;
const Composite = Matter.Composite;

// ============================================================
//  STORAGE & STATE
// ============================================================
const NAMES_KEY = 'shared_names_v1';
const PROB_KEY = 'shared_probabilities_v2';
const LOCKED_KEY = 'shared_locked_v1';
const MAX_PARTICIPANTS = 20;
const MIN_PROBABILITY = 0.05;

let names = ['Участник 1', 'Участник 2'];
let probabilities = {};
let lockedParticipants = {};
let hasCustomProbabilities = false;
let participantColors = {};

const PARTICIPANT_COLORS = [
  '#FF0000', '#FF6600', '#FFFF00', '#00FF00', '#00FFCC',
  '#00FFFF', '#0099FF', '#0000FF', '#0033FF', '#7700FF',
  '#9900FF', '#FF00FF', '#FF0099', '#FF1493', '#CCFF00',
  '#00FF99', '#00CCCC', '#6600FF', '#CC00FF', '#FF00CC',
];

// ============================================================
//  PHYSICS STATE (Matter.js)
// ============================================================
let engine = null;
let world = null;
let matterMarbles = [];
let matterBodies = [];

const MARBLE_RADIUS = 11;

const marbleOptions = {
  restitution: 0.20,
  friction: 0.05,
  frictionAir: 0.008,
  density: 0.006,
  label: 'marble'
};

const obstacleOptions = {
  restitution: 0.15,
  friction: 0.08,
  isStatic: true,
  label: 'obstacle'
};

const MAX_VELOCITY = 15;

const COURSE_LAYOUT = [
  { type: 'spacing', height: 0.08 },
  { type: 'funnel', width: 0.9, narrowWidth: 0.3 },
  { type: 'spacing', height: 0.06 },
  { type: 'chokePoint', width: 0.35, offset: 0.1 },
  { type: 'spacing', height: 0.06 },
  { type: 'deflectors', angles: [-15, 15], spread: 0.6 },
  { type: 'spacing', height: 0.05 },
  { type: 'pegs', count: 8, spread: 0.7 },
  { type: 'spacing', height: 0.06 },
  { type: 'halfPipe', width: 0.6, depth: 0.08 },
  { type: 'spacing', height: 0.05 },
  { type: 'splitPath', leftWidth: 0.35, rightWidth: 0.35 },
  { type: 'spacing', height: 0.05 },
  { type: 'spinners', count: 5, spread: 0.8 },
  { type: 'spacing', height: 0.06 },
  { type: 'gravityDrop', width: 0.5 },
  { type: 'spacing', height: 0.08 }
];

let raceInProgress = false;
let selectedWinner = null;
let rafId = null;
let lastTime = 0;
let matterSpinners = [];

// ============================================================
//  UTILITIES
// ============================================================
function secureRandomFloat() {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0] / 0x100000000;
}

function selectWeightedItem(names, probabilities) {
  const rand = secureRandomFloat();
  let cumulative = 0;
  for (const name of names) {
    cumulative += probabilities[name] || 0;
    if (rand <= cumulative) return name;
  }
  return names[names.length - 1];
}

function getContainerSize() {
  const container = document.querySelector('.obstacle-course');
  return { w: container.clientWidth, h: container.clientHeight };
}

// ============================================================
//  STORAGE
// ============================================================
function saveState() {
  try {
    localStorage.setItem(NAMES_KEY, JSON.stringify(names));
    const cleanP = {};
    names.forEach(n => cleanP[n] = probabilities[n] ?? 0);
    const cleanL = {};
    names.forEach(n => { if (lockedParticipants[n]) cleanL[n] = true; });
    localStorage.setItem(PROB_KEY, JSON.stringify({probabilities: cleanP, hasCustomProbabilities}));
    localStorage.setItem(LOCKED_KEY, JSON.stringify(cleanL));
  } catch(e) {}
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(NAMES_KEY) || '[]');
    if (Array.isArray(saved) && saved.length) names = saved.slice(0, MAX_PARTICIPANTS);
  } catch(e) {}

  names.forEach((name, idx) => {
    if (!(name in participantColors)) {
      participantColors[name] = idx % PARTICIPANT_COLORS.length;
    }
  });

  try {
    const saved = JSON.parse(localStorage.getItem(PROB_KEY) || '{}');
    const savedL = JSON.parse(localStorage.getItem(LOCKED_KEY) || '{}');
    if (saved?.hasCustomProbabilities && saved?.probabilities) {
      probabilities = {...saved.probabilities};
      lockedParticipants = {...savedL};
      hasCustomProbabilities = true;
      Object.keys(probabilities).forEach(n => { if (!names.includes(n)) delete probabilities[n]; });
      Object.keys(lockedParticipants).forEach(n => { if (!names.includes(n)) delete lockedParticipants[n]; });
      names.forEach(n => { if (!(n in probabilities)) probabilities[n] = 0.05; });
    } else { equalizeProbabilities(); }
  } catch(e) { equalizeProbabilities(); }
}

function equalizeProbabilities() {
  const p = 1 / Math.max(1, names.length);
  probabilities = {}; lockedParticipants = {}; hasCustomProbabilities = false;
  names.forEach(n => probabilities[n] = p);
  saveState(); renderParticipants();
}

function normalizeProbabilities() {
  if (!hasCustomProbabilities) {
    const exact = 1 / (names.length || 1);
    names.forEach(n => probabilities[n] = exact); return;
  }
  const locked = names.filter(n => lockedParticipants[n]);
  const unlocked = names.filter(n => !lockedParticipants[n]);
  if (unlocked.length === 0) {
    const sum = names.reduce((s,n) => s + (probabilities[n]||0), 0);
    if (sum > 0 && Math.abs(sum-1) > 1e-4) {
      const k = 1/sum; names.forEach(n => probabilities[n] = (probabilities[n]||0)*k);
    }
    if (names.some(n => (probabilities[n]??0) < 0.049)) { equalizeProbabilities(); } return;
  }
  const lockedSum = locked.reduce((s,n) => s+(probabilities[n]||0), 0);
  const minU = unlocked.length * 0.05;
  const remain = 1 - lockedSum;
  if (locked.some(n=>(probabilities[n]??0)<0.049) || remain < minU-0.001 || lockedSum > 1.001) {
    equalizeProbabilities(); return;
  }
  const share = remain / unlocked.length;
  unlocked.forEach(n => probabilities[n] = share);
  if (names.some(n=>(probabilities[n]??0)<0.049)) { equalizeProbabilities(); }
}

function getPercent(name) {
  return ((probabilities[name]||0)*100).toFixed(1);
}

function getRealisticMaxPercent(name) {
  const otherLocked = names.filter(n=>lockedParticipants[n]&&n!==name);
  const willUnlocked = names.filter(n=>!lockedParticipants[n]&&n!==name);
  const lockedSum = otherLocked.reduce((s,n)=>s+(probabilities[n]||0),0);
  const minU = willUnlocked.length * 0.05;
  return Math.max(5, Math.min(100, Math.round((1-lockedSum-minU)*1000)/10));
}

function setProbabilityManually(name, pct) {
  const max = getRealisticMaxPercent(name);
  if (isNaN(pct)||pct<5||pct>max+0.2) { showErrorTooltip(`Мин 5%, макс ${max.toFixed(1)}%`); return false; }
  hasCustomProbabilities = true; lockedParticipants[name] = true;
  probabilities[name] = pct/100; normalizeProbabilities(); saveState(); return true;
}

function changeProbability(name, delta) {
  const cur = parseFloat(getPercent(name))||0;
  const maxP = 100-(names.length-1)*5;
  const next = Math.max(5, Math.min(maxP, cur+delta));
  if (Math.abs(next-cur) < 0.01) { showErrorTooltip(delta>0 ? `Макс: ${getRealisticMaxPercent(name).toFixed(1)}%` : 'Мин: 5%'); return; }
  const otherLocked = names.filter(n=>lockedParticipants[n]&&n!==name);
  const willUnlocked = names.filter(n=>!lockedParticipants[n]&&n!==name);
  const lockedSum = otherLocked.reduce((s,n)=>s+(probabilities[n]||0),0);
  const remain = 1 - lockedSum - next/100;
  if (remain < willUnlocked.length*0.05-0.001) { showErrorTooltip(`Макс: ${getRealisticMaxPercent(name).toFixed(1)}%`); return; }
  setProbabilityManually(name, next); renderParticipants();
}

function validateAllNames() {
  const inputs = document.querySelectorAll('.name-input');
  let ok = true;
  inputs.forEach(inp => { if (!inp.value.trim()||inp.value.length>15) ok = false; });
  return ok;
}

function validateProbabilities() {
  if (!names.length) return false;
  let sum = 0;
  for (const n of names) { const p = probabilities[n]||0; if (p < MIN_PROBABILITY-1e-6) { showErrorTooltip('Мин вероятность 5%'); return false; } sum += p; }
  if (Math.abs(sum-1) > 0.001) { showErrorTooltip(`Сумма должна быть 100% (сейчас ${(sum*100).toFixed(1)}%)`); return false; }
  clearErrorMessage(); return true;
}

function showErrorTooltip(msg) {
  document.querySelectorAll('.probability-error-tooltip').forEach(e=>e.remove());
  const t = document.createElement('div');
  t.className='probability-error-tooltip'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.transition='opacity .3s,transform .3s'; t.style.opacity='0'; t.style.transform='translate(-50%,-50%) scale(.8)'; setTimeout(()=>t.remove(), 300); }, 2000);
}

function clearErrorMessage() {
  const el = document.getElementById('errorMessage');
  if (el) el.textContent='';
}

function removeParticipant(idx) {
  if (names.length <= 2) { showErrorTooltip('Минимум 2 участника!'); return; }
  const name = names[idx];
  names.splice(idx,1); delete probabilities[name]; delete lockedParticipants[name]; delete participantColors[name];
  equalizeProbabilities(); saveState(); renderParticipants();
}

function addNewParticipant() {
  const inp = document.getElementById('newNameInput');
  const v = inp.value.trim();
  if (!v) { inp.classList.add('error-state'); inp.placeholder='Введите имя'; return; }
  if (v.length > 15) { showErrorTooltip('Максимум 15 символов'); return; }
  if (names.some(n=>n.toLowerCase()===v.toLowerCase())) { showErrorTooltip('Это имя уже есть!'); return; }
  if (names.length >= MAX_PARTICIPANTS) { showErrorTooltip(`Максимум ${MAX_PARTICIPANTS} участников!`); return; }

  const usedIndices = new Set(Object.values(participantColors));
  let colorIdx = 0;
  for (let i = 0; i < PARTICIPANT_COLORS.length; i++) {
    if (!usedIndices.has(i)) {
      colorIdx = i;
      break;
    }
  }
  participantColors[v] = colorIdx;

  names.push(v); probabilities[v]=0.05; equalizeProbabilities();
  saveState(); renderParticipants();
  inp.value=''; inp.style.borderColor='rgba(255,255,255,.2)'; inp.style.background='rgba(255,255,255,.1)';
  inp.classList.remove('error-state'); clearErrorMessage();
}

function changeParticipantColor(name) {
  const usedIndices = new Set();
  names.forEach(n => {
    if (n !== name) {
      const idx = participantColors[n];
      if (idx !== undefined) usedIndices.add(idx);
    }
  });

  const available = [];
  for (let i = 0; i < PARTICIPANT_COLORS.length; i++) {
    if (!usedIndices.has(i)) {
      available.push(i);
    }
  }

  if (available.length === 0) return;

  const currentIdx = participantColors[name];
  let currentPos = available.indexOf(currentIdx);

  if (currentPos === -1) currentPos = -1;

  const nextPos = (currentPos + 1) % available.length;
  participantColors[name] = available[nextPos];

  saveState();
  renderParticipants();
}

function renderParticipants() {
  const namesList = document.getElementById('namesList');
  namesList.innerHTML = '';
  names.forEach((name, idx) => {
    const row = document.createElement('div');
    row.className = 'name-item';

    const colorBox = document.createElement('div');
    colorBox.style.width = '28px';
    colorBox.style.height = '28px';
    colorBox.style.borderRadius = '8px';
    colorBox.style.cursor = 'pointer';
    colorBox.style.border = '3px solid rgba(255,255,255,0.4)';
    colorBox.style.transition = 'all 0.2s ease';
    colorBox.style.flexShrink = '0';
    const colorIdx = participantColors[name] !== undefined ? participantColors[name] : idx % PARTICIPANT_COLORS.length;
    colorBox.style.backgroundColor = PARTICIPANT_COLORS[colorIdx];
    colorBox.addEventListener('click', () => changeParticipantColor(name));

    const inp = document.createElement('input');
    inp.type='text'; inp.className='name-input'; inp.value=name; inp.placeholder='Имя'; inp.maxLength=15;

    inp.addEventListener('blur', () => {
      const v = inp.value.trim();
      if (!v) { inp.value=name; validateAllNames(); return; }
      const dup = names.some((n,i)=>i!==idx&&n.toLowerCase()===v.toLowerCase());
      if (dup||v.length>15) { inp.value=names[idx]; showErrorTooltip('Имя занято или слишком длинное'); validateAllNames(); return; }
      const old=names[idx]; names[idx]=v;
      if (probabilities[old]!==undefined) { probabilities[v]=probabilities[old]; delete probabilities[old]; }
      if (lockedParticipants[old]) { lockedParticipants[v]=true; delete lockedParticipants[old]; }
      if (participantColors[old]!==undefined) { participantColors[v]=participantColors[old]; delete participantColors[old]; }
      inp.classList.remove('error-state'); inp.style.borderColor='rgba(255,255,255,.2)'; inp.style.background='rgba(255,255,255,.1)';
      saveState(); validateAllNames();
    });

    inp.addEventListener('input', () => {
      const v=inp.value.trim();
      const dup=names.some((n,i)=>i!==idx&&n.toLowerCase()===v.toLowerCase());
      if (!v||dup||v.length>15) { inp.classList.add('error-state'); } else { inp.classList.remove('error-state'); }
      validateAllNames();
    });

    inp.addEventListener('focus', () => {
      inp.classList.remove('error-state'); inp.style.borderColor='rgba(255,255,255,.5)'; inp.style.background='rgba(255,255,255,.2)';
      clearErrorMessage();
    });

    const pc = document.createElement('div'); pc.className='probability-controls';
    const minusBtn = document.createElement('button'); minusBtn.className='prob-btn'; minusBtn.textContent='−';
    minusBtn.onclick = () => { if (lockedParticipants[name]) { delete lockedParticipants[name]; hasCustomProbabilities=Object.keys(lockedParticipants).length>0; } changeProbability(name,-1); };

    const probInp = document.createElement('input'); probInp.type='text'; probInp.className='probability-input'; probInp.setAttribute('inputmode','decimal');
    probInp.value=getPercent(name); if (lockedParticipants[name]) probInp.classList.add('manual');
    let lastValid=probInp.value;

    probInp.addEventListener('focus', () => { probInp.value=probInp.value.replace('%',''); lastValid=probInp.value; });
    probInp.addEventListener('input', () => { probInp.value=probInp.value.replace(',','.'); const num=parseFloat(probInp.value); const max=getRealisticMaxPercent(name); if (isNaN(num)||num<5||num>max) { probInp.classList.add('error'); } else { probInp.classList.remove('error'); } });
    probInp.addEventListener('blur', () => { const num=parseFloat(probInp.value); const max=getRealisticMaxPercent(name); if (isNaN(num)||num<5||num>max) { probInp.value=lastValid; probInp.classList.remove('error'); } else if (setProbabilityManually(name,num)) { lastValid=getPercent(name); renderParticipants(); } else { probInp.value=lastValid; probInp.classList.remove('error'); } });
    probInp.addEventListener('keypress', e => { if(e.key==='Enter'){e.preventDefault();probInp.blur();} if(!/[\d.,]/.test(e.key)&&e.key!=='Enter')e.preventDefault(); });

    const plusBtn = document.createElement('button'); plusBtn.className='prob-btn'; plusBtn.textContent='+';
    plusBtn.onclick = () => { if (lockedParticipants[name]) { delete lockedParticipants[name]; hasCustomProbabilities=Object.keys(lockedParticipants).length>0; } changeProbability(name,1); };

    pc.appendChild(minusBtn); pc.appendChild(probInp); pc.appendChild(plusBtn);

    const removeBtn = document.createElement('button'); removeBtn.className='remove-btn'; removeBtn.textContent='✕';
    removeBtn.onclick = () => removeParticipant(idx);

    row.appendChild(colorBox); row.appendChild(inp); row.appendChild(pc); row.appendChild(removeBtn);
    namesList.appendChild(row);
  });
  validateAllNames();
}

// ============================================================
//  OBSTACLES (Matter.js bodies)
// ============================================================
function initializeObstacles() {
  const { w, h } = getContainerSize();

  let currentY = 0;
  const courseHeightRatio = 0.95;
  const totalHeight = h * courseHeightRatio;

  const totalUnits = COURSE_LAYOUT.reduce((sum, section) => {
    if (section.type === 'spacing') return sum + section.height;
    return sum + 0.08;
  }, 0);

  const pixelsPerUnit = totalHeight / totalUnits;

  COURSE_LAYOUT.forEach((layout) => {
    if (layout.type === 'spacing') {
      currentY += layout.height * pixelsPerUnit;
      return;
    }

    let sectionHeight = 0.08 * pixelsPerUnit;

    if (layout.type === 'funnel') {
      const funnelW = w * layout.width;
      const narrowW = w * layout.narrowWidth;
      const startX = (w - funnelW) / 2;
      const endX = (w - narrowW) / 2;

      // Left angled wall
      const leftDx = endX - startX;
      const leftAngle = Math.atan2(sectionHeight, leftDx);
      const leftMidX = (startX + endX) / 2;
      const leftMidY = currentY + sectionHeight / 2;
      const leftLen = Math.hypot(sectionHeight, leftDx);

      const leftBody = Bodies.rectangle(
        leftMidX, leftMidY,
        leftLen, 8,
        { ...obstacleOptions, angle: leftAngle }
      );
      World.add(world, leftBody);

      // Right angled wall
      const rightDx = (endX + narrowW) - (startX + funnelW);
      const rightAngle = Math.atan2(sectionHeight, rightDx);
      const rightMidX = ((startX + funnelW) + (endX + narrowW)) / 2;
      const rightMidY = currentY + sectionHeight / 2;
      const rightLen = Math.hypot(sectionHeight, rightDx);

      const rightBody = Bodies.rectangle(
        rightMidX, rightMidY,
        rightLen, 8,
        { ...obstacleOptions, angle: rightAngle }
      );
      World.add(world, rightBody);
    }
    else if (layout.type === 'chokePoint') {
      const chokeW = w * layout.width;
      const offset = w * layout.offset;

      const body = Bodies.rectangle(
        offset,
        currentY + sectionHeight / 2,
        8,
        sectionHeight,
        obstacleOptions
      );
      World.add(world, body);
    }
    else if (layout.type === 'deflectors') {
      const spread = w * layout.spread;
      const startX = (w - spread) / 2;

      layout.angles.forEach((angle, i) => {
        const x = startX + (spread / (layout.angles.length + 1)) * (i + 1);
        const len = sectionHeight * 0.6;
        const rad = angle * Math.PI / 180;
        const x2 = x + Math.cos(rad) * len;
        const y2 = currentY + sectionHeight * 0.2 + Math.sin(rad) * len;

        const centerX = (x + x2) / 2;
        const centerY = (currentY + sectionHeight * 0.2 + y2) / 2;
        const distance = Math.hypot(x2 - x, y2 - (currentY + sectionHeight * 0.2));
        const angle_rad = Math.atan2(y2 - (currentY + sectionHeight * 0.2), x2 - x);

        const body = Bodies.rectangle(
          centerX, centerY,
          distance, 6,
          { ...obstacleOptions, angle: angle_rad }
        );
        World.add(world, body);
      });
    }
    else if (layout.type === 'pegs') {
      const spread = w * layout.spread;
      const startX = (w - spread) / 2;
      const pegRadius = 5;

      for (let i = 0; i < layout.count; i++) {
        const row = Math.floor(i / 4);
        const col = i % 4;
        const pegX = startX + (spread / 4) * (col + 0.5);
        const pegY = currentY + (sectionHeight / (Math.ceil(layout.count / 4) + 1)) * (row + 1);

        const body = Bodies.circle(pegX, pegY, pegRadius, obstacleOptions);
        World.add(world, body);
      }
    }
    else if (layout.type === 'halfPipe') {
      const pipeW = w * layout.width;
      const pipeStartX = (w - pipeW) / 2;

      // Left wall
      const leftBody = Bodies.rectangle(
        pipeStartX, currentY + sectionHeight / 2,
        8, sectionHeight,
        obstacleOptions
      );
      World.add(world, leftBody);

      // Right wall
      const rightBody = Bodies.rectangle(
        pipeStartX + pipeW, currentY + sectionHeight / 2,
        8, sectionHeight,
        obstacleOptions
      );
      World.add(world, rightBody);
    }
    else if (layout.type === 'splitPath') {
      const leftW = w * layout.leftWidth;
      const rightW = w * layout.rightWidth;
      const gap = (w - leftW - rightW) / 2;

      const body = Bodies.rectangle(
        gap + leftW, currentY + sectionHeight / 2,
        8, sectionHeight,
        obstacleOptions
      );
      World.add(world, body);
    }
    else if (layout.type === 'spinners') {
      const spread = w * layout.spread;
      const startX = (w - spread) / 2;
      const spinnerRadius = 25;
      const rotationSpeed = 8;

      for (let i = 0; i < layout.count; i++) {
        const spinnerX = startX + (spread / (layout.count + 1)) * (i + 1);
        const spinnerY = currentY + sectionHeight / 2;

        const direction = i % 2 === 0 ? 1 : -1;

        matterSpinners.push({
          x: spinnerX,
          y: spinnerY,
          radius: spinnerRadius,
          rotationSpeed: rotationSpeed,
          direction: direction,
          angle: 0,
          armLength: spinnerRadius * 1.5,
          armWidth: 12
        });
      }
    }

    currentY += sectionHeight;
  });
}

// ============================================================
//  PHYSICS (Matter.js)
// ============================================================
function initPhysicsEngine() {
  engine = Engine.create();
  world = engine.world;
  world.gravity.y = 1;
  world.gravity.x = 0;

  const { w, h } = getContainerSize();
  const wallThickness = 50;

  // Container walls
  const wallOptions = { isStatic: true, restitution: 0.15, friction: 0.1 };

  // Bottom
  World.add(world, Bodies.rectangle(w / 2, h + wallThickness / 2, w, wallThickness, {
    ...wallOptions,
    label: 'wall'
  }));

  // Left
  World.add(world, Bodies.rectangle(-wallThickness / 2, h / 2, wallThickness, h, {
    ...wallOptions,
    label: 'wall'
  }));

  // Right
  World.add(world, Bodies.rectangle(w + wallThickness / 2, h / 2, wallThickness, h, {
    ...wallOptions,
    label: 'wall'
  }));

  // Top
  World.add(world, Bodies.rectangle(w / 2, -wallThickness / 2, w, wallThickness, {
    ...wallOptions,
    label: 'wall'
  }));

  // Initialize obstacles
  initializeObstacles();
}

function createMatterMarbles() {
  const { w, h } = getContainerSize();
  const container = document.querySelector('.obstacle-course');
  const marblesContainer = document.getElementById('marblesContainer');
  marblesContainer.innerHTML = '';

  matterMarbles = [];

  const topY = 40;
  const minSpacing = MARBLE_RADIUS * 2.5;
  const maxWidth = w - minSpacing * 2 - 8;

  names.forEach((name, idx) => {
    const count = names.length;
    const spacing = Math.max(minSpacing, maxWidth / Math.max(1, count - 1));
    const startX = 4 + w / 2 - (spacing * (count - 1)) / 2 + spacing * idx;

    // Matter body
    const body = Bodies.circle(startX, topY, MARBLE_RADIUS, marbleOptions);
    World.add(world, body);

    // DOM element
    const marbleEl = document.createElement('div');
    marbleEl.className = 'marble';
    marbleEl.style.backgroundColor = PARTICIPANT_COLORS[participantColors[name] % PARTICIPANT_COLORS.length];
    marbleEl.style.width = (MARBLE_RADIUS * 2) + 'px';
    marbleEl.style.height = (MARBLE_RADIUS * 2) + 'px';
    marbleEl.style.boxShadow = '0 4px 12px rgba(0,0,0,0.6)';
    marblesContainer.appendChild(marbleEl);

    matterMarbles.push({
      body,
      name,
      el: marbleEl
    });
  });
}

function renderSpinners() {
  const container = document.querySelector('.obstacle-course');
  const existing = container.querySelectorAll('.spinner');
  existing.forEach(el => el.remove());

  matterSpinners.forEach(spinner => {
    const spinnerEl = document.createElement('div');
    spinnerEl.className = 'spinner';
    spinnerEl.style.left = spinner.x + 'px';
    spinnerEl.style.top = spinner.y + 'px';

    const centerEl = document.createElement('div');
    centerEl.className = 'spinner-center';
    spinnerEl.appendChild(centerEl);

    const armEl = document.createElement('div');
    armEl.className = 'spinner-arm';
    armEl.style.width = spinner.armLength + 'px';
    armEl.style.height = spinner.armWidth + 'px';
    spinnerEl.appendChild(armEl);

    container.appendChild(spinnerEl);

    spinner.el = spinnerEl;
    spinner.armEl = armEl;
  });
}

// ============================================================
//  GAME LOOP
// ============================================================
function gameLoop(now) {
  if (!raceInProgress) return;

  const rawDt = (now - lastTime) / 1000;
  lastTime = now;

  // Run Matter.js engine
  Engine.update(engine, Math.min(rawDt * 1000, 30));

  // Update spinners
  matterSpinners.forEach(spinner => {
    spinner.angle += spinner.rotationSpeed * spinner.direction * rawDt;
  });

  // Spinner-marble collisions
  for (const spinner of matterSpinners) {
    for (const marble of matterMarbles) {
      const armAngle = spinner.angle;
      const armStartX = spinner.x;
      const armStartY = spinner.y;
      const armEndX = spinner.x + spinner.armLength * Math.cos(armAngle);
      const armEndY = spinner.y + spinner.armLength * Math.sin(armAngle);

      // Closest point on arm to marble
      const mx = marble.body.position.x;
      const my = marble.body.position.y;
      const dx = armEndX - armStartX;
      const dy = armEndY - armStartY;
      const len2 = dx * dx + dy * dy;
      let t = 0;
      if (len2 > 0) t = Math.max(0, Math.min(1, ((mx - armStartX) * dx + (my - armStartY) * dy) / len2));

      const closestX = armStartX + t * dx;
      const closestY = armStartY + t * dy;
      const distX = mx - closestX;
      const distY = my - closestY;
      const dist = Math.hypot(distX, distY);

      const collisionDist = MARBLE_RADIUS + spinner.armWidth / 2;
      if (dist < collisionDist && dist > 0) {
        const nx = distX / dist;
        const ny = distY / dist;

        // Arm velocity at contact point
        const radiusX = closestX - spinner.x;
        const radiusY = closestY - spinner.y;
        const omega = spinner.rotationSpeed * spinner.direction;
        const armVx = -omega * radiusY;
        const armVy = omega * radiusX;

        // Relative velocity
        const relVx = marble.body.velocity.x - armVx;
        const relVy = marble.body.velocity.y - armVy;
        const relVn = relVx * nx + relVy * ny;

        if (relVn < 0) {
          // Collision impulse
          const j = -(1 + 0.6) * relVn;
          Body.applyForce(marble.body, { x: marble.body.position.x, y: marble.body.position.y }, {
            x: j * nx / marble.body.mass,
            y: j * ny / marble.body.mass
          });

          // Position correction
          const overlap = collisionDist - dist;
          marble.body.position.x += overlap * nx * 0.5;
          marble.body.position.y += overlap * ny * 0.5;
        }
      }
    }
  }

  // Clamp velocities
  matterMarbles.forEach(m => {
    const speed = Body.getSpeed(m.body);
    if (speed > MAX_VELOCITY) {
      const scale = MAX_VELOCITY / speed;
      Body.setVelocity(m.body, {
        x: m.body.velocity.x * scale,
        y: m.body.velocity.y * scale
      });
    }
  });

  // Update spinner visual rotation
  matterSpinners.forEach(spinner => {
    if (spinner.armEl) {
      spinner.armEl.style.transform = `rotate(${spinner.angle}rad)`;
    }
  });

  // Sync DOM positions
  matterMarbles.forEach(m => {
    const x = m.body.position.x - MARBLE_RADIUS;
    const y = m.body.position.y - MARBLE_RADIUS;
    m.el.style.transform = `translate(${x}px, ${y}px)`;
  });

  rafId = requestAnimationFrame(gameLoop);
}

function startRace() {
  if (!validateProbabilities()) return;
  if (raceInProgress) return;

  selectedWinner = selectWeightedItem(names, probabilities);
  raceInProgress = true;
  document.getElementById('startRaceBtn').disabled = true;

  lastTime = performance.now();

  // Reset spinner angles
  matterSpinners.forEach(s => s.angle = 0);

  // Clear previous bodies
  if (world) {
    const bodies = Composite.allBodies(world);
    bodies.forEach(b => {
      if (b.label === 'marble') {
        World.remove(world, b);
      }
    });
  } else {
    initPhysicsEngine();
  }

  createMatterMarbles();
  renderSpinners();
  rafId = requestAnimationFrame(gameLoop);
}
