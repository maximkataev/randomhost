  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/2.0.20/matter.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    body {
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; padding:20px;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
      touch-action:manipulation;
      scrollbar-gutter:stable;
      overflow-y:scroll;
    }

    .top-buttons { position:fixed; top:20px; left:20px; z-index:1000; }
    .desktop-menu-toggle {
      position:relative;
      background:linear-gradient(135deg,rgba(30,35,60,.85),rgba(50,30,70,.85));
      backdrop-filter:blur(12px);
      color:#fff;
      border:2px solid rgba(255,255,255,.3);
      padding:0;
      width:56px;
      height:56px;
      border-radius:50%;
      font-size:24px;
      cursor:pointer;
      transition:all .4s cubic-bezier(.68,-.55,.265,1.55);
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      overflow:hidden;
    }

    .desktop-menu-toggle::before {
      content:'';
      position:absolute;
      inset:-2px;
      border-radius:50%;
      background:linear-gradient(135deg,#667eea,#764ba2,#667eea);
      background-size:200% 200%;
      animation:gradientSpin 3s ease infinite;
      opacity:0;
      transition:opacity .3s ease;
      z-index:-1;
    }

    @keyframes gradientSpin {
      0%,100% { background-position:0% 50%; }
      50% { background-position:100% 50%; }
    }

    .desktop-menu-toggle:hover::before {
      opacity:1;
    }

    .desktop-menu-toggle:hover {
      transform:translateY(-3px) scale(1.05);
      border-color:rgba(255,255,255,.5);
    }

    .desktop-menu-toggle:active {
      transform:translateY(-1px) scale(.98);
    }

    .menu-icon {
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      width:24px;
      height:18px;
      position:relative;
      transition:transform .3s ease;
    }

    .menu-icon span {
      display:block;
      width:100%;
      height:3px;
      background:#fff;
      border-radius:2px;
      position:absolute;
      left:0;
      transition:all .4s cubic-bezier(.68,-.55,.265,1.55);
    }

    .menu-icon span:nth-child(1) {
      top:0;
    }

    .menu-icon span:nth-child(2) {
      top:50%;
      margin-top:-1.5px;
    }

    .menu-icon span:nth-child(3) {
      bottom:0;
    }

    .desktop-menu-toggle:hover .menu-icon {
      transform:scale(1.1);
    }

    .desktop-menu-toggle.active .menu-icon span:nth-child(1) {
      top:50%;
      margin-top:-1.5px;
      transform:rotate(45deg);
    }

    .desktop-menu-toggle.active .menu-icon span:nth-child(2) {
      opacity:0;
      transform:rotate(180deg) scale(0);
    }

    .desktop-menu-toggle.active .menu-icon span:nth-child(3) {
      bottom:auto;
      top:50%;
      margin-top:-1.5px;
      transform:rotate(-45deg);
    }
    .desktop-dropdown {
      position:absolute;
      top:100%;
      left:0;
      margin-top:15px;
      background:linear-gradient(135deg,rgba(20,25,45,.92),rgba(40,20,55,.92));
      backdrop-filter:blur(20px);
      border-radius:16px;
      border: 1px solid rgba(255,255,255,.15);
      overflow:hidden;
      max-height:0;
      opacity:0;
      transform:translateY(-10px);
      transition:max-height .4s,opacity .3s,transform .4s;
      min-width: 280px;
    }
    .desktop-dropdown.active {
      max-height: 800px; opacity:1; transform:translateY(0);
    }
    .desktop-dropdown a {
      position:relative; display:flex; align-items:center; gap:14px; padding: 12px 16px;
      color:#fff; text-decoration:none; font-size: 14px; font-weight:600;
      border-bottom:1px solid rgba(255,255,255,.08); transition:all .3s; overflow:hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .desktop-dropdown a:last-child { border-bottom:none; }
    .desktop-dropdown a:hover { background:rgba(102,126,234,.25); padding-left:24px; color:#ffd43b; }
    .desktop-dropdown a.current { color:#ffd43b; }

    .menu-container { display:none; }
    .menu-header { display:flex; align-items:center; justify-content:space-between; }
    .menu-title { color:#fff; font-size:17px; font-weight:700; }
    .burger-btn {
      background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.3);
      border-radius:8px; padding:7px 11px; cursor:pointer;
      display:flex; flex-direction:column; gap:4px; transition:all .3s;
    }
    .burger-btn span { display:block; width:22px; height:3px; background:#fff; border-radius:2px; transition:all .3s; }
    .burger-btn.active span:nth-child(1) { transform:rotate(45deg) translateY(7px); }
    .burger-btn.active span:nth-child(2) { opacity:0; }
    .burger-btn.active span:nth-child(3) { transform:rotate(-45deg) translateY(-7px); }
    .menu-dropdown {
      position:absolute; top:100%; left:0; right:0;
      background:linear-gradient(180deg,rgba(102,126,234,.98),rgba(118,75,162,.98));
      backdrop-filter:blur(10px); max-height:0; overflow:hidden; transition:max-height .3s;
    }
    .menu-dropdown.active {
      max-height: 80vh;
      overflow-y: auto;
    }
    .menu-dropdown a {
      display:flex; align-items:center; gap:10px; padding:14px 18px;
      color:#fff; text-decoration:none; font-size:15px; font-weight:600;
      border-bottom:1px solid rgba(255,255,255,.1);
    }
    .menu-dropdown a:last-child { border-bottom:none; }
    .menu-dropdown a:hover { background:rgba(255,255,255,.15); }

    .main-container {
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      width: 100%;
      margin-top: 20px;
    }

    .obstacle-course {
      height: 84vh;
      width: 35vw;
      background: linear-gradient(135deg, rgba(20,25,45,0.95), rgba(40,20,60,0.95));
      border: 3px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 40px rgba(102,126,234,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }


    .marbles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    .marble {
      position: absolute;
      border-radius: 50%;
      z-index: 5;
      will-change: transform;
      transition: none;
    }

    .start-race-btn {
      position: relative;
      margin-top: 20px;
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .start-race-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.5);
    }

    .start-race-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .start-race-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .winner-tooltip {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, rgba(255,215,0,0.95), rgba(255,150,0,0.95));
      color: #fff;
      padding: 30px 50px;
      border-radius: 20px;
      font-size: 28px;
      font-weight: 800;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .winner-tooltip.show {
      opacity: 1;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .settings-panel {
      width: 490px;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .settings-title {
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .settings-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.25);
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.5);
    }

    .icon-btn:active {
      transform: translateY(0px);
    }

    .icon-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
    }

    .icon-btn:disabled:hover {
      transform: none;
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
    }

    .names-list-wrapper {
      transition: max-height 0.3s ease;
    }

    .names-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 500px;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .names-list::-webkit-scrollbar {
      display: none;
    }

    .headers-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      width: 100%;
    }

    .header-name {
      flex: 1;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      margin-left: 7px;
    }

    .header-probability {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      width: 140px;
      flex-shrink: 0;
    }

    .header-remove {
      width: 44px;
    }

    .name-item {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .color-box {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      border: 3px solid rgba(255,255,255,0.4);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }


    .name-input {
      flex: 1;
      padding: 10px 15px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 16px;
      transition: 0.3s;
    }

    .add-name-container .name-input {
      max-width: none;
      margin-left: 0px;
      height: 46px;
    }
    .name-input:focus {
      outline: none;
      border-color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.2);
    }
    .name-input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .name-input.error-state {
      border-color: #ef4444 !important;
      background: rgba(239,68,68,0.1) !important;
    }

    .probability-controls {
      display: flex;
      gap: 5px;
      width: 120px;
      flex-shrink: 0;
    }

    .prob-btn {
      padding: 5px 10px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .prob-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }

    .prob-btn:active {
      transform: scale(0.95);
    }

    .probability-input {
      width: 55px;
      padding: 4px;
      background: rgba(255,255,255,0.1);
      color: #ffd43b;
      border: 2px solid rgba(255,212,59,0.3);
      border-radius: 5px;
      text-align: center;
      font-weight: 800;
      font-size: 14px;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .probability-input:focus {
      outline: none;
      border-color: rgba(255,212,59,0.6);
      background: rgba(255,255,255,0.15);
    }

    .probability-input.error {
      border-color: #ef4444;
      background: rgba(239,68,68,0.2);
    }

    .probability-input.manual {
      background: rgba(255,244,204,0.25);
      border-color: #F59E0B;
    }

    .remove-btn {
      width: 44px;
      padding: 8px 0;
      background: rgba(239,68,68,0.7);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      transition: 0.3s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .remove-btn:hover {
      background: rgba(239,68,68,0.95);
    }

    .remove-btn:active {
      opacity: 0.8;
    }

    .add-name-container {
      display: flex;
      gap: 5px;
      margin-top: 15px;
    }

    .add-btn-small {
      padding: 0px 14px;
      background: rgba(34,197,94,0.7);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .add-btn-small:hover {
      background: rgba(34,197,94,0.95);
    }

    .add-btn-small:active {
      opacity: 0.85;
    }

    .error-message {
      color: #fff;
      font-size: 13px;
      margin-top: 8px;
      min-height: 16px;
    }

    .probability-error-tooltip {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      background:linear-gradient(135deg,rgba(239,68,68,.95),rgba(220,38,38,.95));
      color:#fff; padding:18px 28px; border-radius:14px;
      z-index:1002; font-weight:700;
      font-size:15px; text-align:center; backdrop-filter:blur(10px);
      border:2px solid rgba(255,255,255,.3);
      animation:tooltipAppear .3s cubic-bezier(.68,-.55,.265,1.55);
    }
    @keyframes tooltipAppear {
      from { opacity:0; transform:translate(-50%,-50%) scale(.8); }
      to   { opacity:1; transform:translate(-50%,-50%) scale(1); }
    }


    @media (max-width:1100px) {
      .main-container { flex-direction:column; align-items:center; gap:24px; }
      .settings-panel { width:100%; max-width:510px; }
    }
    @media (max-width:918px) {
      html,body { max-width:100%; overflow-x:hidden; }
      body { padding:calc(66px + var(--safe-top)) 12px calc(20px + var(--safe-bottom)) 12px; }
      .top-buttons { display:none; }
      .menu-container { display:block; position:fixed; top:var(--safe-top); left:var(--safe-left); right:var(--safe-right); z-index:1000; padding:10px 14px; background:linear-gradient(180deg,rgba(102,126,234,.95) 0%,rgba(118,75,162,.85) 100%); backdrop-filter:blur(10px);  }
      .settings-panel { padding:16px 14px; width:100%; max-width:100%; }
    }
    button:disabled { opacity:.5; cursor:not-allowed!important; }
  </style>
</head>

window.I18N = window.I18N || { t: (k) => k, lang: 'ru', setLang() {}, supported: ['ru','en','el'] };

function secureRandomFloat() {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0] / 0x100000000;
}

function selectWeightedItem(names, probabilities) {
  const rand = secureRandomFloat();
  let cumulative = 0;
  for (const name of names) {
    cumulative += probabilities[name] || 0;
    if (rand <= cumulative) return name;
  }
  return names[names.length - 1];
}

function getContainerSize() {
  const container = document.querySelector('.obstacle-course');
  return { w: container.clientWidth, h: container.clientHeight };
}

function saveState() {
  try {
    localStorage.setItem(NAMES_KEY, JSON.stringify(names));
    const cleanP = {};
    names.forEach(n => cleanP[n] = probabilities[n] ?? 0);
    const cleanL = {};
    names.forEach(n => { if (lockedParticipants[n]) cleanL[n] = true; });
    localStorage.setItem(PROB_KEY, JSON.stringify({probabilities: cleanP, hasCustomProbabilities}));
    localStorage.setItem(LOCKED_KEY, JSON.stringify(cleanL));
  } catch(e) {}
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(NAMES_KEY) || '[]');
    if (Array.isArray(saved) && saved.length) names = saved.slice(0, MAX_PARTICIPANTS);
  } catch(e) {}

  names.forEach((name, idx) => {
    if (!(name in participantColors)) {
      participantColors[name] = idx % PARTICIPANT_COLORS.length;
    }
  });

  try {
    const saved = JSON.parse(localStorage.getItem(PROB_KEY) || '{}');
    const savedL = JSON.parse(localStorage.getItem(LOCKED_KEY) || '{}');
    if (saved?.hasCustomProbabilities && saved?.probabilities) {
      probabilities = {...saved.probabilities};
      lockedParticipants = {...savedL};
      hasCustomProbabilities = true;
      Object.keys(probabilities).forEach(n => { if (!names.includes(n)) delete probabilities[n]; });
      Object.keys(lockedParticipants).forEach(n => { if (!names.includes(n)) delete lockedParticipants[n]; });
      names.forEach(n => { if (!(n in probabilities)) probabilities[n] = 0.05; });
    } else { equalizeProbabilities(); }
  } catch(e) { equalizeProbabilities(); }
}

function equalizeProbabilities() {
  const p = 1 / Math.max(1, names.length);
  probabilities = {}; lockedParticipants = {}; hasCustomProbabilities = false;
  names.forEach(n => probabilities[n] = p);
  saveState(); renderParticipants();
}

function normalizeProbabilities() {
  if (!hasCustomProbabilities) {
    const exact = 1 / (names.length || 1);
    names.forEach(n => probabilities[n] = exact); return;
  }
  const locked = names.filter(n => lockedParticipants[n]);
  const unlocked = names.filter(n => !lockedParticipants[n]);
  if (unlocked.length === 0) {
    const sum = names.reduce((s,n) => s + (probabilities[n]||0), 0);
    if (sum > 0 && Math.abs(sum-1) > 1e-4) {
      const k = 1/sum; names.forEach(n => probabilities[n] = (probabilities[n]||0)*k);
    }
    if (names.some(n => (probabilities[n]??0) < 0.049)) { equalizeProbabilities(); } return;
  }
  const lockedSum = locked.reduce((s,n) => s+(probabilities[n]||0), 0);
  const minU = unlocked.length * 0.05;
  const remain = 1 - lockedSum;
  if (locked.some(n=>(probabilities[n]??0)<0.049) || remain < minU-0.001 || lockedSum > 1.001) {
    equalizeProbabilities(); return;
  }
  const share = remain / unlocked.length;
  unlocked.forEach(n => probabilities[n] = share);
  if (names.some(n=>(probabilities[n]??0)<0.049)) { equalizeProbabilities(); }
}

function getPercent(name) {
  return ((probabilities[name]||0)*100).toFixed(1);
}

function getRealisticMaxPercent(name) {
  const otherLocked = names.filter(n=>lockedParticipants[n]&&n!==name);
  const willUnlocked = names.filter(n=>!lockedParticipants[n]&&n!==name);
  const lockedSum = otherLocked.reduce((s,n)=>s+(probabilities[n]||0),0);
  const minU = willUnlocked.length * 0.05;
  return Math.max(5, Math.min(100, Math.round((1-lockedSum-minU)*1000)/10));
}

function setProbabilityManually(name, pct) {
  const max = getRealisticMaxPercent(name);
  if (isNaN(pct)||pct<5||pct>max+0.2) { showErrorTooltip(I18N.t('err_minmax').replace('{max}',max.toFixed(1))); return false; }
  hasCustomProbabilities = true; lockedParticipants[name] = true;
  probabilities[name] = pct/100; normalizeProbabilities(); saveState(); return true;
}

function changeProbability(name, delta) {
  const cur = parseFloat(getPercent(name))||0;
  const maxP = 100-(names.length-1)*5;
  const next = Math.max(5, Math.min(maxP, cur+delta));
  if (Math.abs(next-cur) < 0.01) { showErrorTooltip(delta>0 ? I18N.t('err_max').replace('{v}',getRealisticMaxPercent(name).toFixed(1)) : I18N.t('err_min5')); return; }
  const otherLocked = names.filter(n=>lockedParticipants[n]&&n!==name);
  const willUnlocked = names.filter(n=>!lockedParticipants[n]&&n!==name);
  const lockedSum = otherLocked.reduce((s,n)=>s+(probabilities[n]||0),0);
  const remain = 1 - lockedSum - next/100;
  if (remain < willUnlocked.length*0.05-0.001) { showErrorTooltip(I18N.t('err_max').replace('{v}',getRealisticMaxPercent(name).toFixed(1))); return; }
  setProbabilityManually(name, next); renderParticipants();
}

function validateAllNames() {
  const inputs = document.querySelectorAll('.name-input');
  let ok = true;
  inputs.forEach(inp => { if (!inp.value.trim()||inp.value.length>15) ok = false; });
  return ok;
}

function validateProbabilities() {
  if (!names.length) return false;
  let sum = 0;
  for (const n of names) { const p = probabilities[n]||0; if (p < MIN_PROBABILITY-1e-6) { showErrorTooltip(I18N.t('err_min_prob5')); return false; } sum += p; }
  if (Math.abs(sum-1) > 0.001) { showErrorTooltip(I18N.t('err_sum100').replace('{v}',(sum*100).toFixed(1))); return false; }
  clearErrorMessage(); return true;
}

function showErrorTooltip(msg) {
  document.querySelectorAll('.probability-error-tooltip').forEach(e=>e.remove());
  const t = document.createElement('div');
  t.className='probability-error-tooltip'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.transition='opacity .3s,transform .3s'; t.style.opacity='0'; t.style.transform='translate(-50%,-50%) scale(.8)'; setTimeout(()=>t.remove(), 300); }, 2000);
}

function clearErrorMessage() {
  const el = document.getElementById('errorMessage');
  if (el) el.textContent='';
}

function removeParticipant(idx) {
  if (names.length <= 2) { showErrorTooltip(I18N.t('err_min2')); return; }
  const name = names[idx];
  names.splice(idx,1); delete probabilities[name]; delete lockedParticipants[name]; delete participantColors[name];
  equalizeProbabilities(); saveState(); renderParticipants();
}

function changeParticipantColor(name) {
  const usedIndices = new Set();
  names.forEach(n => {
    if (n !== name) {
      const idx = participantColors[n];
      if (idx !== undefined) usedIndices.add(idx);
    }
  });

  const available = [];
  for (let i = 0; i < PARTICIPANT_COLORS.length; i++) {
    if (!usedIndices.has(i)) {
      available.push(i);
    }
  }

  if (available.length === 0) return;

  const currentIdx = participantColors[name];
  let currentPos = available.indexOf(currentIdx);

  if (currentPos === -1) currentPos = -1;

  const nextPos = (currentPos + 1) % available.length;
  participantColors[name] = available[nextPos];

  saveState();
  renderParticipants();
}

function initializeObstaclesAndSpinners() {
  initializeObstacles();
  renderObstacles();
  initializeSpinners(); // Must be after initializeObstacles
  renderSpinners();
}

function renderParticipants() {
  const namesList = document.getElementById('namesList');
  namesList.innerHTML = '';
  names.forEach((name, idx) => {
    const row = document.createElement('div');
    row.className = 'name-item';

    const colorBox = document.createElement('div');
    colorBox.className = 'color-box';
    const colorIdx = participantColors[name] !== undefined ? participantColors[name] : idx % PARTICIPANT_COLORS.length;
    colorBox.style.backgroundColor = PARTICIPANT_COLORS[colorIdx];
    colorBox.style.flexShrink = '0';
    colorBox.addEventListener('click', () => changeParticipantColor(name));

    const inp = document.createElement('input');
    inp.type='text'; inp.className='name-input'; inp.value=name; inp.placeholder=I18N.t('ph_name'); inp.maxLength=15;

    inp.addEventListener('blur', () => {
      const v = inp.value.trim();
      if (!v) { inp.value=name; validateAllNames(); return; }
      const dup = names.some((n,i)=>i!==idx&&n.toLowerCase()===v.toLowerCase());
      if (dup||v.length>15) { inp.value=names[idx]; showErrorTooltip(I18N.t('err_taken_long')); validateAllNames(); return; }
      const old=names[idx]; names[idx]=v;
      if (probabilities[old]!==undefined) { probabilities[v]=probabilities[old]; delete probabilities[old]; }
      if (lockedParticipants[old]) { lockedParticipants[v]=true; delete lockedParticipants[old]; }
      if (participantColors[old]!==undefined) { participantColors[v]=participantColors[old]; delete participantColors[old]; }
      inp.classList.remove('error-state'); inp.style.borderColor='rgba(255,255,255,.2)'; inp.style.background='rgba(255,255,255,.1)';
      saveState(); validateAllNames();
    });

    inp.addEventListener('input', () => {
      const v=inp.value.trim();
      const dup=names.some((n,i)=>i!==idx&&n.toLowerCase()===v.toLowerCase());
      if (!v||dup||v.length>15) { inp.classList.add('error-state'); } else { inp.classList.remove('error-state'); }
      validateAllNames();
    });

    inp.addEventListener('focus', () => {
      inp.classList.remove('error-state'); inp.style.borderColor='rgba(255,255,255,.5)'; inp.style.background='rgba(255,255,255,.2)';
      clearErrorMessage();
    });

    const pc = document.createElement('div'); pc.className='probability-controls';
    const minusBtn = document.createElement('button'); minusBtn.className='prob-btn'; minusBtn.textContent='−';
    minusBtn.onclick = () => { if (lockedParticipants[name]) { delete lockedParticipants[name]; hasCustomProbabilities=Object.keys(lockedParticipants).length>0; } changeProbability(name,-1); };

    const probInp = document.createElement('input'); probInp.type='text'; probInp.className='probability-input'; probInp.setAttribute('inputmode','decimal');
    probInp.value=getPercent(name); if (lockedParticipants[name]) probInp.classList.add('manual');
    let lastValid=probInp.value;

    probInp.addEventListener('focus', () => { probInp.value=probInp.value.replace('%',''); lastValid=probInp.value; });
    probInp.addEventListener('input', () => { probInp.value=probInp.value.replace(',','.'); const num=parseFloat(probInp.value); const max=getRealisticMaxPercent(name); if (isNaN(num)||num<5||num>max) { probInp.classList.add('error'); } else { probInp.classList.remove('error'); } });
    probInp.addEventListener('blur', () => { const num=parseFloat(probInp.value); const max=getRealisticMaxPercent(name); if (isNaN(num)||num<5||num>max) { probInp.value=lastValid; probInp.classList.remove('error'); } else if (setProbabilityManually(name,num)) { lastValid=getPercent(name); renderParticipants(); } else { probInp.value=lastValid; probInp.classList.remove('error'); } });
    probInp.addEventListener('keypress', e => { if(e.key==='Enter'){e.preventDefault();probInp.blur();} if(!/[\d.,]/.test(e.key)&&e.key!=='Enter')e.preventDefault(); });

    const plusBtn = document.createElement('button'); plusBtn.className='prob-btn'; plusBtn.textContent='+';
    plusBtn.onclick = () => { if (lockedParticipants[name]) { delete lockedParticipants[name]; hasCustomProbabilities=Object.keys(lockedParticipants).length>0; } changeProbability(name,1); };

    pc.appendChild(minusBtn); pc.appendChild(probInp); pc.appendChild(plusBtn);

    const removeBtn = document.createElement('button'); removeBtn.className='remove-btn'; removeBtn.textContent='✕';
    removeBtn.onclick = () => removeParticipant(idx);

    row.appendChild(colorBox); row.appendChild(inp); row.appendChild(pc); row.appendChild(removeBtn);
    namesList.appendChild(row);
  });
  validateAllNames();
  initializeMarbles();
  initializeObstaclesAndSpinners();
}


function resolveWalls(m) {
  const { w, h } = getContainerSize();
  const cx = m.x + MARBLE_RADIUS;
  const cy = m.y + MARBLE_RADIUS;
  const minX = CONTAINER_BORDER + MARBLE_RADIUS;
  const maxX = w - CONTAINER_BORDER - MARBLE_RADIUS;
  const minY = CONTAINER_BORDER + MARBLE_RADIUS;
  const maxY = h - CONTAINER_BORDER - MARBLE_RADIUS;

  if (cx < minX) {
    m.x = minX - MARBLE_RADIUS;
    m.vx = Math.abs(m.vx) * restitutionMarbleFloor;
    m.onSurface = true;
  } else if (cx > maxX) {
    m.x = maxX - MARBLE_RADIUS;
    m.vx = -Math.abs(m.vx) * restitutionMarbleFloor;
    m.onSurface = true;
  }

  if (cy < minY) {
    m.y = minY - MARBLE_RADIUS;
    m.vy = Math.abs(m.vy) * restitutionMarbleFloor;
    m.onSurface = true;
  } else if (cy > maxY) {
    m.y = maxY - MARBLE_RADIUS;
    m.vy = -Math.abs(m.vy) * restitutionMarbleFloor;
    m.onSurface = true;
  }
}

function resolveMarbleCollision(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const distSq = dx * dx + dy * dy;
  const minDist = MARBLE_RADIUS * 2;
  const minDistSq = minDist * minDist;

  // Fail-safe: only process if actually colliding
  if (distSq >= minDistSq) return;
  if (distSq < 1e-8) return; // too close, skip

  const dist = Math.sqrt(distSq);
  const nx = dx / dist;
  const ny = dy / dist;

  // Relative velocity along contact normal
  const rvx = b.vx - a.vx;
  const rvy = b.vy - a.vy;
  const rvn = rvx * nx + rvy * ny;

  // Only resolve if objects moving toward each other
  if (rvn > 0) return;

  // Impulse response (equal mass simplification for stability)
  const j = -(1 + restitutionMarbleMarble) * rvn * 0.5; // divided by 2 for equal masses

  a.vx -= j * nx;
  a.vy -= j * ny;
  b.vx += j * nx;
  b.vy += j * ny;

  // AGGRESSIVE positional correction to prevent overlap
  const penetration = minDist - dist;
  if (penetration > 0) {
    const corrMag = (penetration - posCorrectSlop) * posCorrectPercent * 0.5; // half to each
    a.x -= corrMag * nx;
    a.y -= corrMag * ny;
    b.x += corrMag * nx;
    b.y += corrMag * ny;
  }
}

function resolveMarbleBarCollisions() {
  for (const marble of marbles) {
    for (const obs of obstacles) {
      if (obs.type === 'spinners' || obs.type === 'spacing') continue;

      // Handle bars
      if (obs.bars && obs.bars.length > 0) {
        for (const bar of obs.bars) {
          resolveMarbleBarCollision(marble, bar);
        }
      }

      // Handle pegs
      if (obs.pegs && obs.pegs.length > 0) {
        for (const peg of obs.pegs) {
          resolveMarblePegCollision(marble, peg);
        }
      }
    }
  }
}

function resolveMarblePegCollision(marble, peg) {
  const marbleCx = marble.x + MARBLE_RADIUS;
  const marbleCy = marble.y + MARBLE_RADIUS;

  const dx = marbleCx - peg.x;
  const dy = marbleCy - peg.y;
  const dist = Math.hypot(dx, dy);

  const collisionDist = MARBLE_RADIUS + peg.r;
  if (dist > collisionDist || dist < 1e-6) return;

  const nx = dx / dist;
  const ny = dy / dist;

  // Positional correction
  const penetration = collisionDist - dist;
  marble.x += nx * penetration * 0.6;
  marble.y += ny * penetration * 0.6;
  marble.onSurface = true;

  // Impulse response (peg is static)
  const rvx = marble.vx;
  const rvy = marble.vy;
  const rvn = rvx * nx + rvy * ny;

  if (rvn >= 0) return;

  const j = -(1 + restitutionMarbleFloor * 0.8) * rvn / (1 / marble.mass);
  marble.vx += j * nx;
  marble.vy += j * ny;
}

function resolveMarbleBarCollision(marble, bar) {
  const marbleCx = marble.x + MARBLE_RADIUS;
  const marbleCy = marble.y + MARBLE_RADIUS;

  // Find closest point on bar segment to marble center
  const dx = bar.x2 - bar.x1;
  const dy = bar.y2 - bar.y1;
  const lenSq = dx * dx + dy * dy;

  let t = 0;
  if (lenSq > 0) {
    t = Math.max(0, Math.min(1, ((marbleCx - bar.x1) * dx + (marbleCy - bar.y1) * dy) / lenSq));
  }

  const closestX = bar.x1 + t * dx;
  const closestY = bar.y1 + t * dy;

  const dist_x = marbleCx - closestX;
  const dist_y = marbleCy - closestY;
  const dist = Math.hypot(dist_x, dist_y);

  const barRadius = 8; // half of bar width
  const collisionDistance = MARBLE_RADIUS + barRadius;
  if (dist > collisionDistance || dist < 1e-6) return;

  // Normal vector (from bar to marble)
  const nx = dist_x / dist;
  const ny = dist_y / dist;

  // Positional correction
  const penetration = collisionDistance - dist;
  marble.x += nx * penetration;
  marble.y += ny * penetration;
  marble.onSurface = true;

  // Impulse response
  const relVx = marble.vx;
  const relVy = marble.vy;
  const relVn = relVx * nx + relVy * ny;

  if (relVn >= 0) return; // moving away

  const invMassMarble = 1 / marble.mass;
  const j = -(1 + restitutionMarbleFloor) * relVn * invMassMarble;

  marble.vx += j * nx;
  marble.vy += j * ny;
}

function resolveMarbleSpinnerCollisions() {
  for (const marble of marbles) {
    for (const spinner of spinners) {
      // Check each of the 4 arms
      for (let armIdx = 0; armIdx < 4; armIdx++) {
        const armAngle = spinner.angle + (armIdx * Math.PI / 2);
        const armStartX = spinner.cx;
        const armStartY = spinner.cy;
        const armEndX = spinner.cx + spinner.armLength * Math.cos(armAngle);
        const armEndY = spinner.cy + spinner.armLength * Math.sin(armAngle);

        resolveMarbleArmCollision(marble, spinner, armStartX, armStartY, armEndX, armEndY, armAngle);
      }
    }
  }
}

function resolveMarbleArmCollision(marble, spinner, armStartX, armStartY, armEndX, armEndY, armAngle) {
  const marbleCx = marble.x + MARBLE_RADIUS;
  const marbleCy = marble.y + MARBLE_RADIUS;

  // Find closest point on arm segment to marble center
  const dx = armEndX - armStartX;
  const dy = armEndY - armStartY;
  const lenSq = dx * dx + dy * dy;

  let t = 0;
  if (lenSq > 0) {
    t = Math.max(0, Math.min(1, ((marbleCx - armStartX) * dx + (marbleCy - armStartY) * dy) / lenSq));
  }

  const closestX = armStartX + t * dx;
  const closestY = armStartY + t * dy;

  const dist_x = marbleCx - closestX;
  const dist_y = marbleCy - closestY;
  const dist = Math.hypot(dist_x, dist_y);

  const collisionDistance = MARBLE_RADIUS + spinner.armWidth / 2;
  if (dist > collisionDistance || dist < 1e-6) return;

  // Normal vector (from arm to marble)
  const nx = dist_x / dist;
  const ny = dist_y / dist;

  // Positional correction (only move marble, spinner is kinematic)
  const penetration = collisionDistance - dist;
  marble.x += nx * penetration;
  marble.y += ny * penetration;

  // Velocity of contact point on rotating arm: v_arm = omega × r
  const radiusX = closestX - spinner.cx;
  const radiusY = closestY - spinner.cy;
  const distFromCenter = Math.hypot(radiusX, radiusY);

  let armVx = 0, armVy = 0;
  if (distFromCenter > 1e-6) {
    // v_arm = omega × r in 2D: omega_z * r_perp = (-ry * omega, rx * omega)
    const omega = spinner.rotationSpeed * spinner.direction;
    armVx = -radiusY * omega;
    armVy = radiusX * omega;
  }

  // Relative velocity of marble w.r.t. arm contact point
  const relVx = marble.vx - armVx;
  const relVy = marble.vy - armVy;
  const relVn = relVx * nx + relVy * ny;

  if (relVn >= 0) return; // marble moving away from arm

  // Impulse (spinner is kinematic: invMass_spinner = 0)
  const invMassMarble = 1 / marble.mass;
  const j = -(1 + restitutionMarbleFloor) * relVn * invMassMarble;

  marble.vx += j * nx;
  marble.vy += j * ny;
}

function physicsSubstep(dt) {
  // 1) Update spinner rotations
  updateSpinners(dt);

  // 2) Apply forces and integrate using semi-implicit Euler
  for (const m of marbles) {
    m.onSurface = false; // Reset each substep

    // Air drag (exponential damping)
    const dragFactor = Math.exp(-airDrag * dt);
    m.vx *= dragFactor;
    m.vy *= dragFactor;

    // Gravity
    m.vy += gravityPx * dt;

    // Semi-implicit Euler integration
    m.x += m.vx * dt;
    m.y += m.vy * dt;
  }

  // 3) Resolve container walls
  for (const m of marbles) {
    resolveWalls(m);
  }

  // 4) Resolve marble-bar collisions
  resolveMarbleBarCollisions();

  // 5) Resolve marble-spinner collisions
  resolveMarbleSpinnerCollisions();

  // 6) Resolve marble-marble collisions (impulse-based with high iterations)
  for (let iter = 0; iter < collisionIterations; iter++) {
    for (let i = 0; i < marbles.length; i++) {
      for (let j = i + 1; j < marbles.length; j++) {
        resolveMarbleCollision(marbles[i], marbles[j]);
      }
    }
  }

  // 6b) HARD SEPARATION PASS: Force marbles apart if still overlapping (no slip)
  for (let iter = 0; iter < separationIterations; iter++) {
    for (let i = 0; i < marbles.length; i++) {
      for (let j = i + 1; j < marbles.length; j++) {
        const a = marbles[i];
        const b = marbles[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        const minDist = MARBLE_RADIUS * 2;

        if (dist < minDist && dist > 1e-6) {
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = minDist - dist;
          const sep = overlap / 2 + 0.01; // small buffer to prevent re-overlap

          // Push both marbles apart equally
          a.x -= nx * sep;
          a.y -= ny * sep;
          b.x += nx * sep;
          b.y += ny * sep;
        }
      }
    }
  }

  // 7) Rolling friction (only on contact surfaces)
  for (const m of marbles) {
    if (m.onSurface) {
      const rfFactor = Math.exp(-rollingFriction * dt);
      m.vx *= rfFactor;
    }
  }
}

function raceLoop(now) {
  if (!raceInProgress) return;

  const rawDt = Math.min((now - lastTime) / 1000, dtMax);
  lastTime = now;
  physicsAccumulator += rawDt;

  while (physicsAccumulator >= physicsDt) {
    physicsSubstep(physicsDt);
    physicsAccumulator -= physicsDt;
  }

  marbles.forEach(m => {
    if (m.el) {
      m.el.style.transform = `translate(${m.x}px, ${m.y}px)`;
    }
  });

  if (raceInProgress) {
    rafId = requestAnimationFrame(raceLoop);
  }
}

function initializeObstacles() {
  const { w, h } = getContainerSize();
  obstacles = [];

  let currentY = 0;
  const courseHeightRatio = 0.95; // Leave some margin
  const totalHeight = h * courseHeightRatio;

  // Calculate total height units to scale sections
  const totalUnits = COURSE_LAYOUT.reduce((sum, section) => {
    if (section.type === 'spacing') return sum + section.height;
    return sum + 0.08; // default section height
  }, 0);

  const pixelsPerUnit = totalHeight / totalUnits;

  COURSE_LAYOUT.forEach((layout, idx) => {
    let sectionHeight = layout.type === 'spacing' ? layout.height * pixelsPerUnit : 0.08 * pixelsPerUnit;

    const obs = {
      type: layout.type,
      startY: currentY,
      endY: currentY + sectionHeight,
      centerY: currentY + sectionHeight / 2,
      width: w,
      height: sectionHeight,
      x1: w * 0.05,
      x2: w * 0.95,
      bars: [],
      pegs: [],
      ...layout
    };

    // Define collision geometry based on type
    if (layout.type === 'funnel') {
      const funnelW = w * layout.width;
      const narrowW = w * layout.narrowWidth;
      const startX = (w - funnelW) / 2;
      const endX = (w - narrowW) / 2;

      obs.walls = [
        { x1: startX, y1: currentY, x2: endX, y2: currentY + sectionHeight }, // left
        { x1: startX + funnelW, y1: currentY, x2: endX + narrowW, y2: currentY + sectionHeight } // right
      ];
      obs.bars = obs.walls;
    } else if (layout.type === 'chokePoint') {
      const chokeW = w * layout.width;
      const offset = w * layout.offset;
      obs.bars = [
        { x1: offset, y1: currentY, x2: offset, y2: currentY + sectionHeight }
      ];
    } else if (layout.type === 'deflectors') {
      const spread = w * layout.spread;
      const startX = (w - spread) / 2;
      layout.angles.forEach((angle, i) => {
        const x = startX + (spread / (layout.angles.length + 1)) * (i + 1);
        const len = sectionHeight * 0.6;
        const rad = angle * Math.PI / 180;
        obs.bars.push({
          x1: x,
          y1: currentY + sectionHeight * 0.2,
          x2: x + Math.cos(rad) * len,
          y2: currentY + sectionHeight * 0.2 + Math.sin(rad) * len
        });
      });
    } else if (layout.type === 'pegs') {
      const spread = w * layout.spread;
      const startX = (w - spread) / 2;
      const pegRadius = 5;
      for (let i = 0; i < layout.count; i++) {
        const row = Math.floor(i / 4);
        const col = i % 4;
        obs.pegs.push({
          x: startX + (spread / 4) * (col + 0.5),
          y: currentY + (sectionHeight / (Math.ceil(layout.count / 4) + 1)) * (row + 1),
          r: pegRadius
        });
      }
    } else if (layout.type === 'halfPipe') {
      const pipeW = w * layout.width;
      const pipeStartX = (w - pipeW) / 2;
      obs.walls = [
        { x1: pipeStartX, y1: currentY, x2: pipeStartX, y2: currentY + sectionHeight },
        { x1: pipeStartX + pipeW, y1: currentY, x2: pipeStartX + pipeW, y2: currentY + sectionHeight }
      ];
      obs.bars = obs.walls;
      obs.curveType = 'halfPipe';
    } else if (layout.type === 'splitPath') {
      const leftW = w * layout.leftWidth;
      const rightW = w * layout.rightWidth;
      const gap = (w - leftW - rightW) / 2;
      obs.bars = [
        { x1: gap + leftW, y1: currentY, x2: gap + leftW, y2: currentY + sectionHeight }
      ];
    }

    obstacles.push(obs);
    currentY += sectionHeight;
  });
}

function initializeSpinners() {
  const { w, h } = getContainerSize();

  // Find all spinner sections
  const spinnerSections = obstacles.filter(obs => obs.type === 'spinners');
  spinners = [];

  spinnerSections.forEach(section => {
    const sectionCenterY = section.centerY;
    const count = section.count || 5;
    const spread = section.spread || 0.8;
    const startX = (w - w * spread) / 2;
    const spacing = (w * spread) / count;

    const speeds = [1.2, 1.6, 2.0, 1.6, 2.8];
    const directions = [1, -1, 1, -1, 1];

    for (let i = 0; i < count; i++) {
      spinners.push({
        cx: startX + spacing * (i + 0.5),
        cy: sectionCenterY,
        angle: 0,
        rotationSpeed: speeds[i % speeds.length],
        direction: directions[i % directions.length],
        armLength: 60,
        armWidth: 10,
        element: null
      });
    }
  });

  renderSpinners();
}

function updateSpinners(dt) {
  spinners.forEach((spinner, idx) => {
    spinner.angle += spinner.rotationSpeed * spinner.direction * dt;

    const svg = spinner.element;
    if (!svg) return;

    const lines = svg.querySelectorAll('line');
    lines.forEach((line, armIdx) => {
      const armAngle = spinner.angle + (armIdx * Math.PI / 2);
      const endX = 100 + spinner.armLength * Math.cos(armAngle);
      const endY = 100 + spinner.armLength * Math.sin(armAngle);

      line.setAttribute('x2', endX);
      line.setAttribute('y2', endY);
    });
  });
}

function initializeMarbles() {

  const maxWidth = w - minSpacing * 2 - CONTAINER_BORDER * 2;

  marbles = names.map((name, idx) => {
    const count = names.length;
    const spacing = Math.max(minSpacing, maxWidth / Math.max(1, count - 1));
    const startX = CONTAINER_BORDER + w / 2 - (spacing * (count - 1)) / 2 + spacing * idx;

    const marble = {
      x: startX,
      y: topY,
      vx: 0,
      vy: 0,
      mass: MARBLE_MASS,
      onSurface: false,
      color: PARTICIPANT_COLORS[participantColors[name] % PARTICIPANT_COLORS.length],
      name,

    };

function startRace() {
  if (!validateProbabilities()) return;
  if (raceInProgress) return;

  selectedWinner = selectWeightedItem(names, probabilities);
  raceInProgress = true;
  winnerFound = false;
  document.getElementById('startRaceBtn').disabled = true;

  // Initialize physics timing
  physicsAccumulator = 0;
  lastTime = performance.now();

  const container = document.querySelector('.obstacle-course');
  const w = container.clientWidth;
  const topY = 25;
  const minSpacing = MARBLE_RADIUS * 2.5;
  const maxWidth = w - minSpacing * 2 - CONTAINER_BORDER * 2;

  marbles.forEach((m, idx) => {
    const count = names.length;
    const spacing = Math.max(minSpacing, maxWidth / Math.max(1, count - 1));
    m.x = CONTAINER_BORDER + w / 2 - (spacing * (count - 1)) / 2 + spacing * idx;
    m.y = topY;
    m.vx = 0;
    m.vy = 0;
    m.onSurface = false;

    if (m.el) {
      m.el.style.transform = `translate(${m.x}px, ${m.y}px)`;
    }
  });

  // Ensure no initial overlaps
  for (let iter = 0; iter < 10; iter++) {
    for (let i = 0; i < marbles.length; i++) {
      for (let j = i + 1; j < marbles.length; j++) {
        const a = marbles[i];
        const b = marbles[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        const minDist = MARBLE_RADIUS * 2;

        if (dist < minDist && dist > 1e-6) {
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = minDist - dist;
          const sep = overlap / 2 + 0.5;

          a.x -= nx * sep;
          a.y -= ny * sep;
          b.x += nx * sep;
          b.y += ny * sep;
        }
      }
    }
  }

  // Reinitialize obstacles in random order and reset spinner angles
  initializeObstaclesAndSpinners();

  rafId = requestAnimationFrame(raceLoop);
}
