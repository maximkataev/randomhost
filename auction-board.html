    judging: `Το ChatGPT διαλέγει τον νικητή`,
    home: `Αρχική`,
    results_title: `Αποτελέσματα`,
    by_vote: `η ψηφοφορία διάλεξε τον νικητή`,
    by_ai: `ChatGPT {judge}`,
    btn_again: `Ξανά (ίδια κατηγορία)`,
    btn_another: `Άλλη κατηγορία`,
    votes_score: `{n} {w}`,
    plural_vote: [`ψήφος`, `ψήφοι`, `ψήφοι`],
    empty: `άδειο`,
    spent: `ξόδεψε {sum}`,
    kind_artist: `Καλλιτέχνης`,
    kind_film: `Ταινία`,
    kind_series: `Σειρά`,
    kind_person: `Πρόσωπο`,
    kind_character: `Χαρακτήρας`,
    kind_food: `Φαγητό`,
    kind_city: `Πόλη`,
    kind_country: `Χώρα`,
    kind_place: `Μέρος`,
    kind_animal: `Ζώο`,
    kind_painting: `Πίνακας`,
    kind_company: `Εταιρεία`,
    kind_club: `Ομάδα`,
    kind_profession: `Επάγγελμα`,
    kind_invention: `Εφεύρεση`,
    kind_label_artist: `Μουσικός`,
    kind_label_film: `Ταινία`,
    kind_label_series: `Σειρά`,
    kind_label_person: `Πρόσωπο`,
    kind_label_character: `Χαρακτήρας`,
    kind_label_food: `Φαγητό`,
    kind_label_city: `Πόλη`,
    kind_label_country: `Χώρα`,
    kind_label_place: `Αξιοθέατο`,
    kind_label_animal: `Ζώο`,
    kind_label_painting: `Πίνακας`,
    kind_label_company: `Εταιρεία`,
    kind_label_club: `Αθλητική ομάδα`,
    kind_label_profession: `Επάγγελμα`,
    kind_label_invention: `Εφεύρεση`
  }
};
</script>
<script>
const params = new URLSearchParams(location.search);
// код комнаты идёт в innerHTML — оставляем только буквы алфавита кодов, иначе ?r=<img onerror> даёт XSS
const CODE = (params.get("r") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 8);
const TOKEN = params.get("t") || "";
const app = document.getElementById("app");
const overlay = document.getElementById("overlay");
// Язык интерфейса — устройства, а не комнаты. Задание и название категории это подписи, а не
// содержимое лота: игрок с английским телефоном должен читать их по-английски, даже если партия
// идёт на русских карточках. От языка комнаты зависят только сами лоты и вердикты судьи —
// они приходят с сервера и общие для всех за столом.
const uiLang = () => (window.I18N && window.I18N.lang) || "ru";
let state = null, kinds = [], ws, offset = 0, rendered = { round: -1, phase: null, kind: null }, hero = null, widget = null;
// hostLost — управление забрала другая доска (host_lost). Такая доска остаётся зрителем: при
// переподключении хост-токен сама не шлёт (иначе права прыгали туда-обратно) и настройки
// локально не меняет — только по кнопке «Забрать управление».
let hostLost = false;

// 4K-телевизор с масштабом 1: доска свёрстана под ~1500 CSS-пикселей и занимала 39% ширины.
// На экранах шире 2200px увеличиваем её целиком (zoom), а высоту делим на тот же множитель.
function fitScreen() {
  const w = window.innerWidth || 0;
  const z = w >= 2200 ? Math.min(2.5, Math.round((w / 1600) * 100) / 100) : 1;
  document.body.style.setProperty("--z", String(z));
  document.body.classList.toggle("scaled", z > 1);
}
addEventListener("resize", fitScreen);
fitScreen();

// ---------- i18n ----------
// Словарь объявлен выше, i18n.js грузится с defer — к первому state он уже на месте.
// Эта же строка рисуется синхронно при разборе страницы, когда I18N ещё нет: тогда берём ru.
const lang = () => (window.I18N ? I18N.lang : "ru");
function T(key) {
  if (window.I18N) return I18N.t(key);
  const d = (window.I18N_DICT || {}).ru || {};
  return key in d ? d[key] : key;
}
// "Лот {n} из {total}" + {n:3,total:12} — порядок слов задаёт словарь, а не склейка
function tf(key, vars) {
  return String(T(key)).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? String(vars[k]) : m));
}
// то же для строк с вставленным узлом: имя игрока остаётся textContent, а не innerHTML
function tn(key, vars) {
  const s = String(T(key)), out = [], re = /\{(\w+)\}/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) out.push(document.createTextNode(s.slice(last, m.index)));
    const v = vars ? vars[m[1]] : null;
    out.push(v instanceof Node ? v : document.createTextNode(v == null ? m[0] : String(v)));
    last = m.index + m[0].length;
  }
  if (last < s.length) out.push(document.createTextNode(s.slice(last)));
  return out;
}
// формы слова: в русском их три (голос / голоса / голосов), в английском и греческом хватает двух.
// Те же ключи и та же логика, что в пульте: «3 голоса» на телевизоре и в телефоне обязаны совпадать.
function pluralWord(n, key) {
  const forms = T(key);
  if (!Array.isArray(forms)) return String(forms);
  if (lang() === "ru") {
    const i = n % 10 === 1 && n % 100 !== 11 ? 0 : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 1 : 2);
    return forms[i] || forms[forms.length - 1];
  }
  return n === 1 ? forms[0] : (forms[1] || forms[0]);
}
const dictHas = (key) => { const d = (window.I18N_DICT || {})[lang()]; return !!(d && key in d); };
// Названия категорий переводит auction-shared.js (auctionKind), их же показывает пульт — иначе
// на экране и в телефоне категория называлась бы по-разному. Словарь страницы остаётся запасным
// вариантом на случай старого закешированного auction-shared.js, а после него — русский оригинал.
function kindField(k, field, key) {
  const shared = window.auctionKind ? auctionKind(k, lang()) : null;
  if (shared && shared[field] && (lang() === "ru" || shared[field] !== (AUCTION_KINDS[k] || {})[field])) return shared[field];
  if (dictHas(key + k)) return T(key + k);
  return (AUCTION_KINDS[k] || {})[field] || k;
}
const kindBtn = (k) => kindField(k, "button", "kind_");
const kindLabel = (k) => kindField(k, "label", "kind_label_");
// Текст задания переводит сам auction-modes.js — ему нужен язык, на котором сейчас доска.
// Берём язык переключателя, а не state.settings.lang: подписи заданий обязаны совпадать
// с остальным экраном (в лобби хост синхронизирует и настройку комнаты — см. push()).
const modeT = (id, kind) => (window.auctionModeText ? auctionModeText(id, kind, lang()) : null);

// data-i18n: строка рисуется до загрузки i18n.js (по-русски), а тот потом переставит её на язык гостя
if (!CODE || !TOKEN) { app.innerHTML = '<div class="lobby"><div data-i18n="no_room">' + T("no_room") + '</div></div>'; }
else connect();

// Доска висит на большом экране всю партию: её обрыв не ставит игру на паузу, но оставляет гостей
// смотреть на замерший экран. Возвращаемся так же, как пульт: сразу, потом с растущей задержкой.
let bRetry = 0, bRetryTimer = null, boardDead = false;
function scheduleReconnect() {
  if (boardDead || bRetryTimer) return;
  const delay = bRetry === 0 ? 0 : Math.min(8000, 500 * 2 ** (bRetry - 1)) + Math.floor(Math.random() * 400);
  bRetry++;
  bRetryTimer = setTimeout(() => { bRetryTimer = null; connect(); }, delay);
}
function reconnectNow() {
  if (boardDead) return;
  // живой по виду транспорт после смены сети бывает мёртв — проверяем пингом, а не верим
  if (ws && (ws.mode === "ws" || ws.mode === "poll")) { ws.probe(); return; }
  if (ws && ws.mode !== "none") return;
  clearTimeout(bRetryTimer);
  bRetryTimer = null;
  bRetry = 0;
  connect();
}
addEventListener("online", reconnectNow);
document.addEventListener("visibilitychange", () => { if (!document.hidden) reconnectNow(); });
// то же, что на пульте: bfcache рвёт сокет, а pageshow — единственный надёжный сигнал возврата
addEventListener("pageshow", (e) => { if (e.persisted) reconnectNow(); });
addEventListener("pagehide", () => { try { if (ws) ws.close(); } catch (e) {} });

// Гаснущий экран доски — это погасший QR в лобби и замерший ход торгов на виду у всех.
let wakeLock = null;
async function keepAwake() {
  try {
    if (!navigator.wakeLock || document.hidden || wakeLock) return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
keepAwake();

function connect() {
  // прежний транспорт гасим: два соединения одной доски отнимали бы друг у друга управление
  if (ws) { try { ws.close(); } catch (e) {} }
  // до первого hello экран не пустой: за прокси без WebSocket подключение может занять секунды
  if (!state && !app.firstChild) app.innerHTML = '<div class="connecting">' + escapeHtml(T("connecting")) + '</div>';
  ws = openTransport({
    code: CODE,
    onClock: () => { offset = serverOffset(); },
    onOpen: () => {
      bRetry = 0;
      overlay.classList.remove("on");
      if (!hostLost) sendMsg({ type: "host", token: TOKEN });
    },
    onMessage: (msg) => {
      if (msg.type === "hello") { kinds = msg.kinds; setState(msg.state); }
      if (msg.type === "state") setState(msg.state);
      if (msg.type === "event") onEvent(msg.event);
      if (msg.type === "host_lost") setHostLost(true);
      if (msg.type === "host_ok") setHostLost(false);
      if (msg.type === "error") toast(msg.error === "need at least 2 players" ? T("start_note_two") : msg.error);
    },
    onClose: () => { overlay.textContent = T("reconnecting"); overlay.classList.add("on"); scheduleReconnect(); },
    // комнаты нет: доска, забытая на экране после закрытия комнаты, иначе стучится в сервер вечно
    onGone: () => {
      boardDead = true;
      clearTimeout(bRetryTimer);
      bRetryTimer = null;
      overlay.classList.remove("on");
      app.innerHTML = '<div class="lobby"><div data-i18n="no_room">' + T("no_room") + '</div></div>';
    },
  });
}
const sendMsg = (m) => ws && ws.send(m);

function setHostLost(on) {
  hostLost = on;
  let bar = document.getElementById("hostlost");
  if (!bar) {
    bar = el("div", "hostlost"); bar.id = "hostlost";
    const btn = el("button", "btn"); btn.id = "hosttake";
    btn.onclick = () => sendMsg({ type: "host", token: TOKEN });
    bar.append(el("span", null, ""), btn);
    document.body.append(bar);
  }
  bar.firstChild.textContent = T("host_lost");
  bar.lastChild.textContent = T("host_take");
  bar.classList.toggle("on", on);
}

function setState(s) {
  state = s;
  // смещение часов — по лучшему замеру ping/pong, а не «как пришёл этот state» (§6.4)
  offset = serverOffset(s.serverNow);
  document.body.dataset.kind = s.kind;
  overlay.classList.toggle("on", !!s.paused);
  if (s.paused) showPause();
  render();
}

function showPause() {
  const box = el("div", "pausebox");
  const btn = el("button", "start", T("resume_game"));
  btn.onclick = () => sendMsg({ type: "resume" });
  // соло-добор ждёт конкретного человека и не дольше минуты — так и пишем, а не «Пауза»
  const who = state && state.pausedFor ? nameOf(state.pausedFor) : "";
  box.append(el("div", null, who ? tf("wait_player", { who }) : T("paused")), btn);
  overlay.replaceChildren(box);
}

// смена языка: каркасы лобби и доски строятся один раз, поэтому пересобираем их с нуля
window.addEventListener("langchange", () => {
  // до первого state рисовать нечего, а экран «нет кода комнаты» переведёт сам i18n.js по data-i18n:
  // без этой проверки первое же событие (его шлёт i18n.js при старте) стирало бы эту строку
  if (!state) return;
  if (state.phase === "lobby") pushLang();
  if (hostLost) setHostLost(true);
  app.replaceChildren();
  rendered = { round: -1, phase: null, kind: null };
  seatsSeen = new Set();
  if (state.paused) showPause();
  render();
});

function toast(text) { const t = document.getElementById("toast"); t.textContent = text; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2500); }
// разделитель тысяч у каждого языка свой: $20,000 против $20 000
const NUM_LOCALE = { ru: "ru-RU", en: "en-US", el: "el-GR" };
const money = (n) => "$" + Number(n).toLocaleString(NUM_LOCALE[lang()] || "en-US");
const nameOf = (id) => (state.players.find(function (p) { return p.id === id; }) || {}).name || "?";

// ---------- звук ----------
let actx;
function beep(freq, ms = 90, type = "sine", gain = .08) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = gain;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + ms / 1000);
  } catch {}
}
function onEvent(e) {
  if (e.type === "bid") beep(660, 70);
  if (e.type === "sold") { beep(520, 120); setTimeout(() => beep(780, 160), 130); }
  if (e.type === "taken") beep(440, 160, "triangle");
  if (e.type === "finished") stopMusic();
  if (e.type === "judging") render();
  if (e.type === "judge_failed") toast(T("judge_failed"));
}

// ---------- рендер ----------
function render() {
  if (!state) return;
  // новая партия — монетка итогов снова может понадобиться
  if (state.phase !== "finished") coinShown = "";
  // m-game / m-final: на узкой доске (телефон) экран торгов и итоги прокручиваются страницей
  document.body.classList.toggle("m-game", !["lobby", "intro", "finished"].includes(state.phase));
  document.body.classList.toggle("m-final", state.phase === "finished");
  if (state.phase === "lobby") return renderLobby();
  if (state.phase === "intro") return renderIntro();
  if (state.phase === "finished") return renderFinal();
  renderGame();
}

// ---------- лобби ----------
// Каркас строится один раз (чтобы QR не мигал и «фишки» не переигрывали анимацию),
// дальше приходящие state'ы только синхронизируют выбранные значения и ленту игроков.
const BUDGETS = [20, 30, 50], SLOTS = [3, 5, 7];
let seatsSeen = new Set();

function renderLobby() {
  stopMusic();
  rendered = { round: -1, phase: null, kind: null };
  app.style.display = "block";
  if (!document.getElementById("lobby")) buildLobby();
  syncLobby();
}

function buildLobby() {
  document.body.classList.add("m-lobby");
  const url = lobbyUrl();
  seatsSeen = new Set();
  // порядок фишек — как на стартовом экране, а не как отдал сервер
  const order = Object.keys(AUCTION_KINDS);
  const list = kinds.slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));
  app.innerHTML = `
    <div class="lobby" id="lobby">
      <div class="joincol">
      <section class="join card-l2">
        <div class="eyebrow"><i></i>${T("lobby_open")}</div>
        <input class="roomtitle" id="roomtitle" maxlength="40" placeholder="${escapeHtml(T("room_title_ph"))}" autocomplete="off">
        <div class="code">${CODE}</div>
        <div class="qrbox"><div id="qr"></div></div>
        <a class="url" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="${escapeHtml(T("play_here"))}">${escapeHtml(url.replace(/^https?:\/\//, ""))}</a>
        <div class="hint">${T("lobby_hint")}</div>
      </section>
      <section class="seats card-l2">
        <div class="cap"><span id="seatcap">${T("players")}</span><small id="seatcount"></small></div>
        <div class="seatrow" id="seatrow"></div>
      </section>
      </div>
      <section class="setup card-l2">
        <div class="setup-body">
        <h2>${T("setup_title")} <small>${T("setup_sub")}</small></h2>
        <div class="set">
          <div class="cap">${T("cap_kind")}</div>
          <div class="tiles" id="kind">${list.map((k, i) => `<button class="tile" data-v="${k}" style="animation-delay:${i * 0.025}s"><span class="ico">${(AUCTION_KINDS[k] || {}).icon || "🎲"}</span>${escapeHtml(kindBtn(k))}</button>`).join("")}</div>
        </div>
        <div class="pair">
          <div class="set">
            <div class="cap">${T("cap_budget")} · <b id="budgetVal"></b></div>
            <div class="row" id="budget">
              ${BUDGETS.map((v) => `<button class="opt" data-v="${v}">$${v}</button>`).join("")}
              <span class="step"><button data-d="-5" aria-label="${escapeHtml(T("less"))}">−</button><button data-d="5" aria-label="${escapeHtml(T("more"))}">+</button></span>
            </div>
          </div>
          <div class="set">
            <div class="cap">${T("cap_slots")} · <b id="slotsVal"></b></div>
            <div class="row" id="slots">
              ${SLOTS.map((v) => `<button class="opt" data-v="${v}">${v}</button>`).join("")}
              <span class="step"><button data-d="-1" aria-label="${escapeHtml(T("less"))}">−</button><button data-d="1" aria-label="${escapeHtml(T("more"))}">+</button></span>
            </div>
          </div>
        </div>
        <div class="set task">
          <div class="cap">${T("cap_task")} <em>${T("task_hint")}</em></div>
          <div class="tiles modes" id="mode"></div>
          <div class="judgerow">
            <div class="seg" id="judge"><button data-v="chatgpt">ChatGPT</button><button data-v="vote">${T("judge_vote")}</button></div>
            <div class="modehint" id="modehint"></div>
          </div>
        </div>
        <div class="rounds" id="rounds"></div>
        <div class="rules">
          <div class="rule"><div class="k">1</div><div class="t">${T("rule1_t")}</div><div class="d">${T("rule1_d")}</div></div>
          <div class="rule"><div class="k">2</div><div class="t">${T("rule2_t")}</div><div class="d" id="rule2d"></div></div>
          <div class="rule"><div class="k">3</div><div class="t">${T("rule3_t")}</div><div class="d">${T("rule3_d")}</div></div>
        </div>
        </div>
        <div class="setup-foot">
          <button class="start" id="start">${T("start_btn")}</button>
          <div class="start-note" id="startnote"></div>
          ${location.hostname === "localhost" || location.hostname === "127.0.0.1" ? '<button class="btn ghost" id="bots">' + T("bots_btn") + '</button>' : ""}
        </div>
      </section>
    </div>`;
  // библиотека QR лежит на cdnjs: если он недоступен, без try лобби осталось бы без обработчиков
  // (кнопка «Начать игру» не работала бы вовсе). Код комнаты и ссылка на экране есть и без QR.
  try {
    new QRCode(document.getElementById("qr"), { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  } catch (err) {
    console.warn("QR не нарисовался:", err.message);
    const box = document.querySelector(".join .qrbox");
    if (box) box.hidden = true;
  }

  // любое изменение контрола уходит хосту тем же сообщением settings
  const push = (patch) => {
    // управление у другой доски: сервер эту правку всё равно отбросит, а применённая локально
    // она разводила бы экран и сервер (на ТВ $50, на сервере $30)
    if (hostLost) return;
    const s = state.settings;
    const next = { kind: state.kind, budget: Number(s.budget), slots: Number(s.slots), judge: s.judge, mode: s.mode || "base", lang: lang(), title: s.title || "", ...patch };
    next.budget = Math.min(200, Math.max(10, next.budget));
    next.slots = Math.min(8, Math.max(3, next.slots));
    // задание живёт не во всех категориях: при смене категории недоступное сбрасываем на обычное
    if (window.auctionModesForKind && !auctionModesForKind(next.kind).some((m) => m.id === next.mode)) next.mode = "base";
    // оптимистично применяем локально — контрол реагирует мгновенно, сервер пришлёт подтверждение
    state.kind = next.kind; state.settings.budget = next.budget; state.settings.slots = next.slots; state.settings.judge = next.judge; state.settings.mode = next.mode; state.settings.lang = next.lang; state.settings.title = next.title;
    document.body.dataset.kind = next.kind;
    sendMsg({ type: "settings", kind: next.kind, settings: { budget: next.budget, slots: next.slots, judge: next.judge, mode: next.mode, lang: next.lang, title: next.title } });
    syncLobby();
  };
  // Имя комнаты уходит на сервер по потере фокуса и по Enter, а не на каждую букву:
  // иначе каждое нажатие рассылало бы состояние всем телефонам.
  var titleInput = document.getElementById("roomtitle");
  if (titleInput) {
    var pushTitle = function () { if (titleInput.value !== (state.settings.title || "")) push({ title: titleInput.value }); };
    titleInput.addEventListener("blur", pushTitle);
    titleInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { titleInput.blur(); } });
  }
  const pick = (box, key, cast) => document.getElementById(box).addEventListener("click", (e) => {
    const hit = e.target.closest("[data-v],[data-d]");
    if (!hit) return;
    if (hit.dataset.d) return push({ [key]: Number(state.settings[key]) + Number(hit.dataset.d) });
    push({ [key]: cast(hit.dataset.v) });
  });
  document.getElementById("kind").addEventListener("click", (e) => {
    const hit = e.target.closest("[data-v]"); if (hit) push({ kind: hit.dataset.v });
  });
  pick("budget", "budget", Number);
  pick("slots", "slots", Number);
  pick("judge", "judge", String);
  document.getElementById("mode").addEventListener("click", (e) => {
    const hit = e.target.closest("[data-v]"); if (hit) push({ mode: hit.dataset.v });
  });
  document.getElementById("start").onclick = () => { unlockAudio(); sendMsg({ type: "start" }); };
  var botsBtn = document.getElementById("bots"); if (botsBtn) botsBtn.addEventListener("click", () => sendMsg({ type: "bots", n: 3 }));
}

function lobbyUrl() { return `${location.origin}${location.pathname.replace(/auction-board\.html$/, "")}auction.html?r=${CODE}`; }

// Язык партии лежит в настройках комнаты: от него зависят колода на сервере и текст в телефонах.
// Хост переключил язык на доске — комната идёт за ним. Сервер принимает settings только в лобби,
// поэтому дальше в игре молчим: иначе в ответ прилетит ошибка «game_started».
// langPushed: на каждый выбранный язык уходит ровно одно сообщение. Старый сервер (без языка
// в настройках) вернул бы прежний язык, и синхронизация на каждом state зациклилась бы.
let langPushed = null;
function pushLang() {
  if (!state || state.phase !== "lobby" || state.settings.lang === lang() || langPushed === lang()) return;
  langPushed = lang();
  state.settings.lang = lang();
  sendMsg({ type: "settings", kind: state.kind, settings: { lang: lang() } });
}

function syncLobby() {
  const s = state, box = document.getElementById("lobby");
  if (!box) return;
  // язык доски — язык всей комнаты: от него зависит и колода карточек на сервере
  pushLang();
  const budget = Number(s.settings.budget), slots = Number(s.settings.slots);
  const players = s.players.filter((p) => !p.left);
  const n = players.length;

  // Имя комнаты приходит в состоянии: так его видит вторая доска и оно переживает перерисовку.
  // Пока ведущий печатает, поле не трогаем — иначе курсор прыгал бы на каждое обновление.
  var ti = document.getElementById("roomtitle");
  if (ti && document.activeElement !== ti && ti.value !== (s.settings.title || "")) ti.value = s.settings.title || "";
  markOn("kind", s.kind);
  const modes = window.auctionModesForKind ? auctionModesForKind(s.kind) : [];
  const current = modeT(s.settings.mode, s.kind) || { id: "base" };
  const modeBox = document.getElementById("mode");
  if (modeBox.dataset.kind !== s.kind + "/" + lang()) {
    modeBox.dataset.kind = s.kind + "/" + lang();
    // название плитки — на языке категории: у музыкантов «Лайнап фестиваля», у еды «Меню ужина»
    modeBox.replaceChildren(...modes.map((m) => {
      const t = modeT(m.id, s.kind) || m;
      const b = el("button", "tile");
      b.dataset.v = m.id;
      b.append(el("span", "ico", t.icon), document.createTextNode(t.title));
      return b;
    }));
  }
  markOn("mode", current.id);
  // подсказка отвечает ровно на вопрос хоста «что сделает судья при этом задании»
  // и не пересказывает второй раз подпись плитки (раньше short и judge дублировали друг друга)
  const hint = document.getElementById("modehint");
  if (s.settings.judge === "vote") {
    hint.replaceChildren(...tn("hint_vote", { b: el("b", null, T("hint_vote_b")), topic: (current.short || "").toLowerCase() }));
  } else {
    hint.replaceChildren(...tn("hint_ai", { b: el("b", null, "ChatGPT"), judge: current.judge || "" }));
  }
  markOn("judge", s.settings.judge);
  syncPills("budget", budget, BUDGETS, (v) => "$" + v);
  syncPills("slots", slots, SLOTS, (v) => String(v));
  document.getElementById("budgetVal").textContent = money(budget);
  document.getElementById("slotsVal").textContent = slots;
  // Порог запаса — игроки × слоты × 1.25 + 6 × слоты: последние 6 × слоты лотов может забрать
  // соло-добор (§5, §6.5), и без этой добавки предупреждение врало бы на маленьких категориях.
  const need = Math.ceil(Math.max(n, 2) * slots * 1.25) + 6 * slots;
  const thin = s.deckSize != null && s.deckSize < need;
  // правила — с настоящими T1/T2 комнаты: текст «каждая ставка даёт ещё 5» расходился с кодом
  const r2 = document.getElementById("rule2d");
  if (r2) r2.textContent = tf("rule2_d", { t1: s.settings.t1 / 1000, t2: s.settings.t2 / 1000 });
  document.getElementById("rounds").innerHTML =
    tf("rounds", { t1: s.settings.t1 / 1000, t2: s.settings.t2 / 1000 }) +
    (thin ? `<span class="warn">${escapeHtml(tf("deck_warn", { n: s.deckSize }))}</span>` : "");

  document.getElementById("seatcap").textContent = n ? tf("players_n", { n: n }) : T("players");
  document.getElementById("seatcount").textContent = n < 2 ? T("need_two") : T("ready_to_start");
  const row = document.getElementById("seatrow");
  const seats = players.map((p) => {
    const seat = el("div", "seat" + (p.online ? "" : " off") + (seatsSeen.has(p.id) ? "" : " new"));
    seatsSeen.add(p.id);
    seat.append(el("div", "av", initial(p.name)), el("div", "nm", p.name));
    return seat;
  });
  const wait = el("div", "seat wait");
  wait.append(el("div", "av", "+"), el("div", "nm", T(n ? "wait_more" : "wait_none")));
  seats.push(wait);
  row.replaceChildren(...seats);

  // стартовать можно с двумя на связи: отключённый «призрак» в списке — не второй игрок
  const online = players.filter((p) => p.online).length;
  const start = document.getElementById("start");
  start.disabled = online < 2;
  document.getElementById("startnote").textContent = online < 2 ? T("start_note_two") : "";
}

// аватар: первая буква имени; у ботов имя начинается с эмодзи — берём её целиком, а не половину суррогатной пары
// Составной эмодзи (семья, флаг) — одна графема из нескольких кодпоинтов: берём её целиком.
function initial(name) {
  const s = String(name || "").trim();
  const letter = (s.match(/[\p{L}\p{N}]/u) || [])[0];
  if (letter) return letter.toUpperCase();
  try { const first = new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(s)[Symbol.iterator]().next().value; if (first) return first.segment; } catch (e) {}
  return Array.from(s)[0] || "?";
}
function markOn(boxId, value) {
  document.getElementById(boxId).querySelectorAll("[data-v]").forEach((b) => b.classList.toggle("on", b.dataset.v === String(value)));
}
function syncPills(boxId, value, presets, fmt) {
  const box = document.getElementById(boxId);
  markOn(boxId, value);
  box.querySelectorAll(".step button").forEach((b) => {
    const next = value + Number(b.dataset.d);
    b.disabled = boxId === "budget" ? next < 10 || next > 200 : next < 3 || next > 8;
  });
}

// ---------- заставка перед первым лотом ----------
// Задание крупно, потом «три, два, один» — чтобы компания подняла головы от телефонов
// и поняла, что именно собирают. Своя фаза на сервере, поэтому время торгов не страдает.
const COUNTDOWN_MS = 3000;

function renderIntro() {
  document.body.classList.remove("m-lobby");
  stopMusic();
  const s = state;
  app.style.display = "block";
  if (!document.getElementById("intro")) {
    const m = modeT(s.settings.mode, s.kind);
    // судью подписываем целиком из словаря: в голосовании придаточного «что делает судья» нет
    const judgeLine = !m ? "" : s.settings.judge === "vote" ? T("intro_judge_vote") : tf("intro_judge_ai", { judge: m.judge || "" });
    app.innerHTML = `<div class="intro" id="intro">
      <div class="itext">
        <div class="icap">${escapeHtml(tf("intro_cap", { kind: kindLabel(s.kind) }))}</div>
        <div class="ibig"><span class="iicon">${m ? m.icon : "🔨"}</span><span class="iname">${escapeHtml(m ? m.title : T("auction"))}</span></div>
        <div class="isub">${m ? escapeHtml(m.short || "") : ""}</div>
        <div class="ijudge">${escapeHtml(judgeLine)}</div>
      </div>
      <div class="count" id="count"></div>
    </div>`;
    if (!introTicking) { introTicking = true; requestAnimationFrame(tickIntro); }
  }
}

// отсчёт идёт по серверному дедлайну, а не по локальному таймеру: на всех экранах одни и те же цифры
// introTicking/timerTicking: при смене языка каркас пересобирается, а второй цикл rAF
// звучал бы вторым отсчётом — заводим петлю один раз за жизнь страницы
let countShown = null, introTicking = false, timerTicking = false;
function tickIntro() {
  const box = document.getElementById("count");
  if (!box || !state || state.phase !== "intro") { countShown = null; return requestAnimationFrame(tickIntro); }
  const left = Math.max(0, state.deadline - (Date.now() + offset));
  const intro = document.getElementById("intro");
  if (left > COUNTDOWN_MS) {
    if (countShown !== "task") { countShown = "task"; box.replaceChildren(); intro.classList.remove("counting"); }
  } else {
    const n = Math.max(1, Math.ceil(left / 1000));
    if (countShown !== n) {
      countShown = n;
      intro.classList.add("counting");
      const d = el("div", "num", String(n));
      box.replaceChildren(d);
      beep(n === 1 ? 880 : 520); // «три, два» глуше, «один» звонче — слышно, что сейчас старт
    }
  }
  requestAnimationFrame(tickIntro);
}

// подпись фазы в топбаре: ключ словаря на каждую фазу сервера
const PHASE_KEY = { lot: "ph_lot", bidding: "ph_bidding", pickup: "ph_pickup", draft: "ph_draft", sold: "ph_sold", taken: "ph_taken", unsold: "ph_unsold" };

// «Аня · слот 4 из 5 · скипов 3» — вторая строка верхней полосы в соло-доборе (§10.2).
// Номер слота считаем по лайнапу: добирают как раз тот слот, который сейчас свободен.
function draftLine(s) {
  if (!s.solo) return "";
  const p = s.players.find((x) => x.id === s.solo.playerId);
  if (!p) return "";
  const vars = { who: p.name, n: Math.min(p.lots.length + 1, s.settings.slots), total: s.settings.slots, k: s.solo.skips };
  // price 0 — у игрока нет денег: скипов нет, лоты уходят ему даром подряд
  return tf(s.solo.price === 0 ? "draft_line_broke" : s.solo.skips ? "draft_line" : "draft_line_must", vars);
}

// «Пропустить» со ставками продаёт лот лидеру. На узкой (телефонной) доске и на сенсорном экране
// кнопки стоят плотно, и промах пальцем продавал лот (M24): там нужен второй тап — кнопка на 3 с
// превращается в «Точно пропустить?». На большом экране с мышью — как раньше, одним нажатием.
var skipArmed = null;
function onSkipClick() {
  const btn = document.getElementById("skip");
  const careful = matchMedia("(max-width: 760px), (pointer: coarse)").matches;
  if (careful && (!skipArmed || skipArmed.round !== state.round)) {
    clearTimeout(skipArmed && skipArmed.timer);
    skipArmed = { round: state.round, timer: setTimeout(disarmSkip, 3000) };
    btn.textContent = T("skip_sure");
    btn.classList.add("accent");
    return;
  }
  // round: запоздавшее нажатие (промах, медленная сеть) не должно продать уже следующий лот
  const round = skipArmed ? skipArmed.round : state.round;
  disarmSkip();
  sendMsg({ type: "skip_lot", round });
}
function disarmSkip() {
  if (skipArmed) clearTimeout(skipArmed.timer);
  skipArmed = null;
  const btn = document.getElementById("skip");
  if (btn) { btn.textContent = T("btn_skip"); btn.classList.remove("accent"); }
}

function renderGame() {
  document.body.classList.remove("m-lobby");
  const s = state;
  app.style.display = "grid";
  if (!document.getElementById("topbar")) {
    app.innerHTML = `
      <main>
        <div class="topbar" id="topbar"><span class="phase" id="phase"></span><span class="lotno" id="lotno"></span><span class="draftline" id="draftline"></span><span class="spacer"></span><span class="gtask" id="gtask"></span>
          <div class="timer" id="timer"><svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="28"/><circle class="ring" id="ring" cx="32" cy="32" r="28" stroke-dasharray="176" stroke-dashoffset="0"/></svg><div class="num" id="tnum"></div></div>
        </div>
        <section class="frame"><div class="card center" id="card"></div></section>
        <div class="bidbar" id="bidbar"></div>
      </main>
      <aside>
        <section class="panel"><h2>${T("players")} <small id="pcount"></small></h2><div class="players" id="players"></div></section>
        <div class="hostbar"><span class="code">${escapeHtml(tf("room_code", { code: CODE }))}</span><button class="btn ghost" id="skip">${T("btn_skip")}</button><button class="btn ghost" id="pause">${T("btn_pause")}</button><button class="btn ghost" id="end">${T("btn_end")}</button></div>
      </aside>`;
    document.getElementById("pause").onclick = () => sendMsg({ type: state.paused ? "resume" : "pause" });
    // round: запоздавшее нажатие (промах, медленная сеть) не должно продать уже следующий лот
    document.getElementById("skip").onclick = onSkipClick;
    document.getElementById("end").onclick = () => confirm(T("end_confirm")) && sendMsg({ type: "end" });
    if (!timerTicking) { timerTicking = true; requestAnimationFrame(tickTimer); }
  }
  const pauseBtn = document.getElementById("pause");
  pauseBtn.textContent = T(s.paused ? "btn_resume" : "btn_pause");
  pauseBtn.classList.toggle("accent", !!s.paused);
  document.getElementById("skip").disabled = s.paused || !(s.phase === "lot" || s.phase === "bidding" || s.phase === "pickup" || s.phase === "draft");
  // лот сменился, пока кнопка ждала второго тапа, — подтверждение относилось к прошлому лоту
  if (skipArmed && (skipArmed.round !== s.round || document.getElementById("skip").disabled)) disarmSkip();
  // только номер лота: общее число раундов — прогноз, и владелец просил его не показывать
  // В фазе лота номер — часть крупного заголовка («ЛОТ 7»), мелкая подпись прячется: иначе читалось
  // «ЛОТ 7 ЛОТ». В остальных фазах — крупная фаза и мелкий «Лот 7» после неё. Фаза стоит первой,
  // поэтому левый край заголовка не сдвигается при смене фазы.
  const lotLabel = tf("lot_of", { n: s.round + 1 });
  const lotnoEl = document.getElementById("lotno");
  lotnoEl.textContent = lotLabel;
  lotnoEl.hidden = s.phase === "lot";
  const gtask = document.getElementById("gtask");
  if (gtask) {
    const m = modeT(s.settings.mode, s.kind);
    const custom = m && m.id !== "base";
    gtask.className = "gtask" + (custom ? " on" : "");
    if (custom) gtask.replaceChildren(el("b", null, m.icon + " " + m.title), document.createTextNode(" — " + (m.short || "")));
  }
  const phaseEl = document.getElementById("phase");
  phaseEl.className = "phase " + s.phase;
  phaseEl.textContent = s.phase === "lot" ? lotLabel : PHASE_KEY[s.phase] ? T(PHASE_KEY[s.phase]) : "";
  const dl = document.getElementById("draftline");
  if (dl) { dl.textContent = draftLine(s); dl.classList.toggle("on", !!dl.textContent); }

  // карточка перерисовывается только на новом лоте
  if (s.lot && (rendered.round !== s.round || rendered.kind !== s.kind)) {
    rendered = { round: s.round, kind: s.kind };
    renderCard(s.lot, s.kind);
  }
  renderBidbar();
  renderPlayers();
}

function renderCard(lot, kind) {
  const card = document.getElementById("card");
  stopMusic();
  const meta = el("div", "meta");
  (lot.meta || []).forEach((m) => meta.append(el("span", null, m)));
  const fact = el("p", "fact");
  fact.append(el("b", null, T("fact")), el("span", "ft", lot.fact));
  const text = el("div", "text");
  text.append(el("div", "emoji", lot.emoji), el("div", "kind", kindLabel(kind)), el("div", "name", lot.name), meta, el("p", "desc", lot.description), fact);
  widget = kind === "artist" && state.settings.media ? playerWidget() : null;
  card.className = "card result";
  card.replaceChildren(state.settings.media ? heroWidget(lot, kind) : el("div", "hero gone"), text, ...(widget ? [widget.box] : []));
  if (widget) startMusic(lot, widget);
  fitCard(true);
}
// Длинное описание не должно уходить под нижний край карточки (у неё overflow: hidden):
// не влезло — ступенька «snug» с обрезкой описания и факта по строкам. Замер без анимаций
// появления: сдвиг translateY у ещё «всплывающих» строк тоже считался бы переполнением.
// Длинный текст лота не должен уходить под нижний край карточки (у неё overflow: hidden) и не должен
// резаться посреди строки: сначала пропорционально ужимаем кегль (--k до 0.72), и только если и этого
// мало — «snug», обрезка описания и факта целыми строками. Замер без анимаций появления на новом лоте
// (сдвиг translateY у «всплывающих» строк считался бы переполнением); на ресайзе анимации не трогаем,
// иначе у уже показанного лота заново проигрывалось бы появление.
function fitCard(fresh) {
  const card = document.getElementById("card");
  if (!card) return;
  if (fresh) card.classList.add("fitting");
  card.classList.remove("snug");
  const fits = (k) => { card.style.setProperty("--k", String(k)); return card.scrollHeight <= card.clientHeight + 1; };
  if (!fits(1)) {
    if (!fits(.72)) card.classList.add("snug");
    else {
      let lo = .72, hi = 1;
      for (let i = 0; i < 6; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
      fits(Math.floor(lo * 100) / 100);
    }
  }
  if (fresh) card.classList.remove("fitting");
}
addEventListener("resize", () => {
  if (!state || !document.getElementById("players")) return;
  fitCard();
  fitPlayers(document.getElementById("players"));
});

function renderBidbar() {
  const s = state, bar = document.getElementById("bidbar");
  bar.replaceChildren();
  if (s.phase === "sold" || s.phase === "taken") {
    const t = el("div", "lead");
    // имя игрока остаётся узлом, а порядок слов вокруг него задаёт словарь
    t.append(...tn(s.phase === "sold" ? "sold_to" : "taken_by", { who: el("b", null, nameOf(s.leaderId)), price: money(s.price) }));
    bar.append(el("div", "gavel-mark", "🔨"), el("div", "stamp", T(s.phase === "sold" ? "ph_sold" : "ph_taken")), t);
    return;
  }
  if (s.phase === "unsold") { bar.append(el("div", "lead", T("unsold_line"))); return; }
  // соло-добор: торговаться не с кем, полоса объясняет, что вообще происходит (§10.2)
  if (s.phase === "draft" && s.solo) {
    const who = nameOf(s.solo.playerId);
    const line = s.solo.price === 0 ? tf("draft_bar_broke", { who }) : s.solo.skips ? T("draft_bar") : tf("draft_bar_must", { who });
    bar.append(el("div", "cap", T("ph_draft")), el("div", "lead", line));
    return;
  }
  if (s.phase === "pickup") {
    const who = s.players.filter((p) => p.canTake).map((p) => p.name).join(", ");
    bar.append(el("div", "lead", T("pickup_line")), el("div", "tape", who || T("nobody")));
    return;
  }
  if (!s.leaderId) {
    const bidders = s.players.filter((p) => p.canBid).length;
    bar.append(el("div", "cap", T("cap_nobids")), el("div", "lead", bidders ? tf("first_bid", { min: money(1) }) : T("nobody_to_bid")));
    return;
  }
  const lead = el("div", "lead");
  lead.append(el("b", null, nameOf(s.leaderId)), document.createTextNode(` ${money(s.price)}`));
  const tape = el("div", "tape");
  s.bids.slice(0, -1).reverse().forEach((b) => tape.append(el("span", null, `${nameOf(b.playerId)} ${money(b.amount)}`)));
  bar.append(el("div", "cap", T("cap_leader")), lead, tape);
}

function renderPlayers() {
  const s = state, box = document.getElementById("players");
  document.getElementById("pcount").textContent = tf("pcount", { n: s.players.filter((p) => !p.left).length, slots: s.settings.slots, w: pluralWord(s.settings.slots, "plural_slot") });

    const row = el("div", "p" + (p.id === s.leaderId && (s.phase === "bidding" || s.phase === "sold" || s.phase === "taken") ? " leader" : "") + (p.full ? " full" : "") + (!p.online ? " offline" : "") + (p.left ? " left" : "") + (p.money === 0 ? " broke" : ""));

function tickTimer() {
  if (!state || state.phase === "lobby" || state.phase === "finished" || !document.getElementById("timer")) return requestAnimationFrame(tickTimer);
  const s = state;
  const total = { lot: s.settings.t1, bidding: s.settings.t2, pickup: 5000, draft: s.t4 || 10000 }[s.phase] || 2000;
  const left = s.paused ? total : Math.max(0, s.deadline - (Date.now() + offset));
  const frac = Math.min(1, left / total);
  document.getElementById("ring").setAttribute("stroke-dashoffset", String(176 * (1 - frac)));
  document.getElementById("tnum").textContent = (s.phase === "lot" || s.phase === "bidding" || s.phase === "pickup" || s.phase === "draft") ? Math.ceil(left / 1000) : "";

  return `<div class="pl ${res && res.first ? "first" : ""}${res && res.minor ? " minor" : ""}" style="animation-delay:${(res && res.delay) || 0}s">${head}${res && res.verdict ? `<div class="verdict">${escapeHtml(res.verdict)}</div>` : ""}<div class="lots">${lots}</div><div class="spent">${escapeHtml(tf("spent", { sum: money(p.spent) }))}</div></div>`;
}
function escapeHtml(t) { return String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
</script>
<script src="i18n.js" defer></script>
</body>
