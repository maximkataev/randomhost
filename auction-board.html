<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Аукцион — доска</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f528.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auction-shared.css">
<style>
  /* ---------- раскладка доски ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 34%, 460px); gap: 20px; height: 100%; max-width: 1500px; margin: 0 auto; }
  main, aside { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: 12px; }
  .topbar { display: flex; align-items: center; gap: 18px; flex: none; }
  .topbar .lotno { font: 700 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .topbar .phase { font: 900 clamp(22px, 2vw, 30px)/1 var(--display); letter-spacing: -.035em; text-transform: uppercase; }
  .topbar .phase.bidding { color: var(--c1); }
  .topbar .spacer { flex: 1; }
  .timer { position: relative; width: 64px; height: 64px; flex: none; }
  .timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .timer circle { fill: none; stroke-width: 5; }
  .timer .track { stroke: rgba(255, 255, 255, .1); }
  .timer .ring { stroke: var(--c1); stroke-linecap: round; transition: stroke .3s; }
  .timer .num { position: absolute; inset: 0; display: grid; place-items: center; font: 900 22px/1 var(--display); }
  .timer.urgent .ring { stroke: #ff6b6b; }
  .timer.urgent .num { color: #ff6b6b; animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.18); } }

  /* три уровня фона: пятна → стеклянные панели (.04) → карточка лота (.08) */
  .frame { flex: 1 1 auto; min-height: 0; margin-top: 0; background: rgba(255, 255, 255, .08); box-shadow: 0 34px 90px -44px #000, 0 0 0 1px rgba(255, 255, 255, .03); }
  .card { overflow: hidden; }
  @media (min-width: 1100px) {
    .card.result { display: grid; grid-template-columns: 40% minmax(0, 1fr); grid-template-rows: 1fr auto; column-gap: 28px; }
    .card.result > .hero { grid-column: 1; grid-row: 1; margin: -28px 0 14px -28px; height: auto; min-height: 200px; }
    .card.result > .text { grid-column: 2; grid-row: 1 / span 2; }
    .card.result > .player { grid-column: 1; grid-row: 2; margin-top: 0; align-self: end; }
    .card.result > .hero:not(.gone) + .text > .emoji { margin-top: 0; font-size: 52px; }
    .card.result:has(.hero.gone) { grid-template-columns: minmax(0, 1fr); }
    .card.result:has(.hero.gone) > * { grid-column: 1; grid-row: auto; }
    .card.result .name { font-size: clamp(28px, 2.6vw, 40px); }
    .card.result .desc { font-size: 15px; }
  }
  .text { display: flex; flex-direction: column; min-width: 0; }
  .text > * { flex: none; }
  .hero:not(.gone) + .text > .emoji { margin-top: -62px; position: relative; z-index: 1; font-size: 64px; }

  /* полоса ставок */
  .bidbar { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 20px; background: rgba(255, 255, 255, .045); border: 1px solid var(--glass-line); border-radius: 20px; backdrop-filter: blur(20px); min-height: 76px; }
  .bidbar .cap { flex: none; font: 700 10.5px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .bidbar .lead { font: 900 clamp(24px, 2.2vw, 32px)/1.05 var(--display); letter-spacing: -.035em; }
  .bidbar .lead b { color: var(--c1); }
  .bidbar .tape { flex: 1; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .bidbar .tape span { font-size: 13.5px; color: var(--muted); background: rgba(255, 255, 255, .05); border: 1px solid var(--glass-line); border-radius: 999px; padding: 5px 12px; }
  /* «ПРОДАНО» — та же печать, что на стартовом экране, плюс удар молотка */
  .bidbar .stamp { flex: none; font: 900 15px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--c3); border: 1.5px solid var(--c3); border-radius: 9px; padding: 8px 10px; transform: rotate(-7deg); animation: stamp .45s cubic-bezier(.3, 1.8, .5, 1) both; }
  .bidbar .gavel-mark { font-size: 30px; margin-right: 4px; }
  @keyframes stamp { from { opacity: 0; transform: rotate(-7deg) scale(2.2); } }

  /* игроки */
  .panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: rgba(255, 255, 255, .04); border: 1px solid var(--glass-line); border-radius: 24px; padding: 18px 18px 14px; backdrop-filter: blur(24px); }
  .panel h2 { font: 900 20px/1 var(--display); letter-spacing: -.035em; text-transform: uppercase; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .panel h2 small { font: 500 12px var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); }
  .players { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; display: flex; flex-direction: column; gap: 8px; }
  .p { background: rgba(255, 255, 255, .045); border: 1px solid var(--glass-line); border-radius: 16px; padding: 10px 14px; transition: border-color .3s, box-shadow .3s, opacity .3s; }
  .p.leader { border-color: var(--c1); box-shadow: 0 0 0 1px var(--c1), 0 10px 30px -12px var(--c1); }
  .p.full, .p.offline, .p.left { opacity: .55; }
  .p-top { display: flex; align-items: baseline; gap: 8px; }
  .p-name { font-weight: 600; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-tag { font: 700 10px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--c1); }
  .p-tag.dim { color: var(--muted); }
  .p-left { font: 900 19px/1 var(--display); letter-spacing: -.02em; }
  .p.broke .p-left { color: #ff8a8a; }
  .p-bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .08); margin: 8px 0 8px; overflow: hidden; }
  .p-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width .6s cubic-bezier(.2, .8, .3, 1); }
  .slots { display: flex; gap: 6px; flex-wrap: wrap; }
  .slot-i { min-width: 28px; height: 28px; border-radius: 999px; border: 1px dashed var(--glass-line); display: flex; align-items: center; gap: 6px; padding: 0 9px; font-size: 13px; }
  .slot-i.filled { border-style: solid; background: rgba(255, 255, 255, .07); }
  .p.leader .slot-i.filled { border-color: transparent; background: linear-gradient(100deg, var(--c1), var(--c2) 85%); color: #0a0a0f; font-weight: 600; }
  .slot-i .n { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players.compact .slot-i .n { max-width: 70px; font-size: 12px; }
  .hostbar { flex: none; display: flex; gap: 8px; align-items: center; }
  .hostbar .code { font: 700 12px/1 var(--display); letter-spacing: .14em; color: var(--muted); flex: 1; }
  .btn { font: 700 11.5px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: #0a0a0f; background: linear-gradient(120deg, var(--c1), var(--c2)); border: 0; border-radius: 999px; padding: 13px 20px; cursor: pointer; box-shadow: 0 14px 34px -18px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .4); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), border-color .2s, background .2s, box-shadow .3s; }
  .btn.ghost { background: none; color: var(--text); border: 1px solid var(--glass-line); box-shadow: none; }
  .btn:hover { transform: translateY(-2px); }
  .btn.ghost:hover { border-color: var(--c1); background: rgba(255, 255, 255, .06); }

  /* ===== лобби: слева «вход» (код + QR), справа настройки, снизу лента игроков ===== */
  .lobby {
    flex: 1; min-height: 100%; display: grid;
    grid-template-columns: minmax(340px, 40%) minmax(0, 1fr);
    gap: clamp(18px, 2.4vw, 34px);
  }
  /* левая колонка: код с QR и блок ожидания — вместе по центру экрана по вертикали */
  .joincol { display: flex; flex-direction: column; justify-content: center; gap: clamp(12px, 2vh, 20px); min-height: 0; overflow-y: auto; scrollbar-width: thin; }
  .card-l2 { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 26px; backdrop-filter: blur(24px); box-shadow: 0 30px 80px -50px #000; }

  /* --- вход --- */
  .join { flex: none; display: flex; flex-direction: column; align-items: center; text-align: center; gap: clamp(10px, 1.6vh, 18px); padding: clamp(18px, 2.6vh, 30px) 24px; }
  .join .eyebrow { font: 700 11px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 9px; }
  .join .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--c1); box-shadow: 0 0 14px var(--c1); animation: glow 1.8s ease-in-out infinite alternate; }
  @keyframes glow { to { opacity: .35; transform: scale(.7); } }
  .join .code {
    font: 900 clamp(56px, 7.4vw, 116px)/.9 var(--display); letter-spacing: .06em; text-transform: uppercase;
    background: linear-gradient(100deg, #fff 25%, color-mix(in srgb, var(--c2) 75%, white));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 18px 44px color-mix(in srgb, var(--c1) 55%, transparent));
  }
  .join .qrbox { background: #fff; padding: 12px; border-radius: 20px; line-height: 0; box-shadow: 0 24px 60px -28px #000; }
  .join .qrbox img, .join .qrbox canvas { display: block; width: clamp(150px, 15vw, 210px) !important; height: auto !important; }
  .join .url { font: 600 clamp(14px, 1.1vw, 17px)/1.3 var(--body); color: var(--text); word-break: break-all; }
  .join .hint { font-size: clamp(13px, .95vw, 15px); color: var(--muted); max-width: 34ch; }

  /* --- настройки --- */
  .setup { display: flex; flex-direction: column; justify-content: center; gap: clamp(10px, 1.6vh, 18px); padding: clamp(18px, 2.6vh, 28px) clamp(18px, 2vw, 28px); min-height: 0; overflow-y: auto; scrollbar-width: thin; }
  .setup h2 { font: 900 clamp(24px, 2.4vw, 38px)/.95 var(--display); letter-spacing: -.04em; text-transform: uppercase; margin: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .setup h2 small { font: 500 13px/1.3 var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); }
  .set { display: flex; flex-direction: column; gap: 8px; }
  .set > .cap { font: 700 10.5px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .set > .cap::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--glass-line), transparent); }
  .set > .cap b { color: var(--text); font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }

  /* пилюли-пресеты + тонкая подстройка */
  .opt {
    font: 900 14px/1 var(--display); letter-spacing: -.01em; color: rgba(244, 242, 255, .88);
    background: rgba(255, 255, 255, .045); border: 1px solid var(--glass-line); border-radius: 999px;
    padding: 11px 17px; cursor: pointer;
    transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), border-color .2s, background .25s, box-shadow .3s, color .25s;
  }
  .opt:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c1) 70%, transparent); background: rgba(255, 255, 255, .08); }
  .opt.on { color: #0a0a0f; border-color: transparent; background: linear-gradient(100deg, var(--c1), var(--c2) 75%, var(--c3)); box-shadow: 0 12px 34px -14px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .4); }
  .step { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; }
  .step button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, .045); color: var(--text); font: 500 19px/1 var(--body); cursor: pointer; transition: border-color .2s, background .2s; }
  .step button:hover { border-color: var(--c1); background: rgba(255, 255, 255, .09); }
  .step button:disabled { opacity: .3; cursor: default; }

  /* сегмент-переключатель */
  .seg { align-self: flex-start; display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, .045); }
  .setup > .btn.ghost { align-self: flex-start; }
  .seg button { font: 700 11.5px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; color: rgba(244, 242, 255, .8); background: none; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; transition: color .2s, background .25s, box-shadow .3s; }
  .seg button.on { color: #0a0a0f; background: linear-gradient(100deg, var(--c1), var(--c2) 80%); box-shadow: 0 10px 26px -14px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .4); }
  .seg button:not(.on):hover { color: var(--text); background: rgba(255, 255, 255, .07); }

  .rounds { font-size: 13.5px; color: var(--muted); }
  .rounds b { color: var(--text); font-weight: 600; }

  /* правила — чтобы пустота под настройками работала на игроков, пока все собираются */
  .rules { margin-top: 4px; padding-top: 16px; border-top: 1px solid var(--glass-line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 1.4vw, 20px); }
  .rule { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 9px; }
  .rule .k { grid-row: 1 / span 2; font: 900 22px/.95 var(--display); color: var(--c1); }
  .rule .t { font: 600 13.5px/1.3 var(--body); }
  .rule .d { font-size: 12.5px; line-height: 1.4; color: var(--muted); }
  @media (max-width: 760px) { .rules { grid-template-columns: minmax(0, 1fr); } }

  /* главная кнопка */
  .start {
    position: relative; overflow: hidden; width: 100%;
    font: 900 clamp(17px, 1.6vw, 22px)/1 var(--display); text-transform: uppercase; letter-spacing: .05em;
    color: #0a0a0f; background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3));
    border: 0; border-radius: 20px; padding: clamp(18px, 2.2vh, 24px) 24px; cursor: pointer;
    box-shadow: 0 22px 60px -22px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45);
    transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), box-shadow .3s, opacity .3s;
  }
  .start::before { content: "→"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; background: rgba(10, 10, 15, .16); display: grid; place-items: center; font: 500 20px/1 var(--body); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  .start:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 30px 70px -20px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45); }
  .start:not(:disabled):hover::before { transform: translateY(-50%) translateX(4px); }
  .start:disabled { opacity: .4; filter: grayscale(.45); cursor: default; box-shadow: none; }
  .start-note { font-size: 13px; color: var(--muted); text-align: center; }

  /* --- лента игроков --- */
  .seats { flex: none; display: flex; flex-direction: column; gap: 12px; padding: 16px clamp(16px, 2vw, 22px) 18px; }
  .seats .cap { font: 900 14px/1.25 var(--display); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .seats .cap small { font: 500 12.5px var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
  .seatrow { min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .seat { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, .05); }
  .seat .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 900 15px/1 var(--display); color: #0a0a0f; background: linear-gradient(140deg, var(--c1), var(--c2)); }
  .seat .nm { font: 600 16px/1 var(--body); max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat.new { animation: seatIn .55s cubic-bezier(.3, 1.7, .5, 1) both; }
  @keyframes seatIn { from { opacity: 0; transform: scale(.6) translateY(10px); } }
  .seat.off { opacity: .5; }
  .seat.off .av { background: rgba(255, 255, 255, .12); color: var(--text); }
  .seat.wait { border-style: dashed; background: none; color: var(--muted); font-size: 14px; padding: 8px 16px; animation: waitPulse 2.2s ease-in-out infinite; }
  @keyframes waitPulse { 50% { opacity: .45; } }
  .seat.wait .av { background: rgba(255, 255, 255, .08); color: var(--muted); font-size: 13px; }
  .seat.wait .nm { max-width: none; font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    .join .eyebrow i, .seat.new, .seat.wait, .timer.urgent .num, .thinking .dice, .pl { animation: none !important; }
  }

  /* финал */
  .final { flex: 1; min-height: 100%; overflow-y: auto; scrollbar-width: thin; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 28px; padding: clamp(22px, 3vh, 32px); backdrop-filter: blur(24px); box-shadow: 0 30px 80px -50px #000; }
  .final h2 { font: 900 clamp(30px, 3.4vw, 44px)/.95 var(--display); text-transform: uppercase; letter-spacing: -.045em; margin: 0 0 20px; }
  .podium { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .pl { background: rgba(255, 255, 255, .05); border: 1px solid var(--glass-line); border-radius: 22px; padding: 18px; backdrop-filter: blur(14px); box-shadow: 0 18px 40px -30px #000; animation: rise .6s both; }
  .pl.first { border-color: var(--c1); box-shadow: 0 0 0 1px var(--c1), 0 20px 50px -20px var(--c1); }
  .pl .place { font-size: 34px; line-height: 1; }
  .pl .who { font: 900 clamp(20px, 1.7vw, 26px)/1.05 var(--display); letter-spacing: -.03em; margin: 8px 0 2px; }
  .pl .score { font: 900 clamp(30px, 2.8vw, 40px)/1 var(--display); letter-spacing: -.04em; color: var(--c1); }
  .pl .verdict { margin: 10px 0 12px; font-size: 14.5px; line-height: 1.45; color: rgba(244, 242, 255, .86); }
  .pl .lots { display: flex; flex-wrap: wrap; gap: 6px; }
  .pl .spent { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  /* пилюли: лоты в лайнапе; у победителя — залитые градиентом */
  .chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .06); border: 1px solid var(--glass-line); border-radius: 999px; padding: 6px 13px; font-size: 14px; }
  .chip.off { opacity: .5; }
  .pl.first .chip { color: #0a0a0f; border-color: transparent; background: linear-gradient(100deg, var(--c1), var(--c2) 80%); font-weight: 600; }
  .final .summary { margin: 20px 0 0; padding: 16px 18px; font-size: 16px; background: rgba(255, 255, 255, .05); border-left: 3px solid var(--c1); border-radius: 4px 16px 16px 4px; }
  .final .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .thinking { text-align: center; padding: 60px 0; }
  .thinking .dice { font-size: 56px; display: inline-block; animation: roll .9s linear infinite; }
  @keyframes roll { to { transform: rotate(360deg); } }

  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); backdrop-filter: blur(6px); display: none; place-items: center; z-index: 50; font: 900 40px var(--display); text-transform: uppercase; }
  .overlay.on { display: grid; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #ff6b6b; color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; display: none; z-index: 60; }
  .toast.on { display: block; }
  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    body:has(.lobby) { overflow-y: auto; }
    .lobby { grid-template-columns: minmax(0, 1fr); }
    .joincol { overflow: visible; }
    .setup { overflow: visible; }
    .start { margin-top: 6px; }
    .seats { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<div class="bg"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="grain"></div></div>
<div class="layout" id="app"></div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="auction-shared.js"></script>
<script>
const params = new URLSearchParams(location.search);
const CODE = (params.get("r") || "").toUpperCase();
const TOKEN = params.get("t") || "";
const app = document.getElementById("app");
const overlay = document.getElementById("overlay");
let state = null, kinds = [], ws, offset = 0, rendered = { round: -1, phase: null, kind: null }, hero = null, widget = null;

if (!CODE || !TOKEN) { app.innerHTML = '<div class="lobby"><div>Нет кода комнаты. Открой <a href="auction.html" style="color:var(--c1)">auction.html</a> и создай комнату.</div></div>'; }
else connect();

function connect() {
  ws = openTransport({
    code: CODE,
    onOpen: () => sendMsg({ type: "host", token: TOKEN }),
    onMessage: (msg) => {
      if (msg.type === "hello") { kinds = msg.kinds; setState(msg.state); }
      if (msg.type === "state") setState(msg.state);
      if (msg.type === "event") onEvent(msg.event);
      if (msg.type === "error") toast(msg.error);
    },
    onClose: () => { overlay.textContent = "Нет связи — переподключаемся…"; overlay.classList.add("on"); setTimeout(connect, 2000); },
  });
}
const sendMsg = (m) => ws && ws.send(m);

function setState(s) {
  state = s;
  offset = s.serverNow - Date.now();
  document.body.dataset.kind = s.kind;
  overlay.classList.toggle("on", !!s.paused);
  if (s.paused) overlay.textContent = "Пауза";
  render();
}

function toast(text) { const t = document.getElementById("toast"); t.textContent = text; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2500); }
const money = (n) => "$" + Number(n).toLocaleString("ru-RU");
const nameOf = (id) => state.players.find((p) => p.id === id)?.name || "?";

// ---------- звук ----------
let actx;
function beep(freq, ms = 90, type = "sine", gain = .08) {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = gain;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + ms / 1000);
  } catch {}
}
function onEvent(e) {
  if (e.type === "bid") beep(660, 70);
  if (e.type === "sold") { beep(520, 120); setTimeout(() => beep(780, 160), 130); }
  if (e.type === "taken") beep(440, 160, "triangle");
  if (e.type === "finished") stopMusic();
  if (e.type === "judging") render();
  if (e.type === "judge_failed") toast("Судья не ответил — голосуем");
}

// ---------- рендер ----------
function render() {
  if (!state) return;
  if (state.phase === "lobby") return renderLobby();
  if (state.phase === "finished") return renderFinal();
  renderGame();
}

// ---------- лобби ----------
// Каркас строится один раз (чтобы QR не мигал и «фишки» не переигрывали анимацию),
// дальше приходящие state'ы только синхронизируют выбранные значения и ленту игроков.
const BUDGETS = [20, 30, 50], SLOTS = [3, 5, 7];
let seatsSeen = new Set();

function renderLobby() {
  stopMusic();
  rendered = { round: -1, phase: null, kind: null };
  app.style.display = "block";
  if (!document.getElementById("lobby")) buildLobby();
  syncLobby();
}

function buildLobby() {
  const url = lobbyUrl();
  seatsSeen = new Set();
  // порядок фишек — как на стартовом экране, а не как отдал сервер
  const order = Object.keys(AUCTION_KINDS);
  const list = kinds.slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));
  app.innerHTML = `
    <div class="lobby" id="lobby">
      <div class="joincol">
      <section class="join card-l2">
        <div class="eyebrow"><i></i>Комната открыта</div>
        <div class="code">${CODE}</div>
        <div class="qrbox"><div id="qr"></div></div>
        <div class="url">${escapeHtml(url.replace(/^https?:\/\//, ""))}</div>
        <div class="hint">Сканируй QR или открой ссылку и введи имя</div>
      </section>
      <section class="seats card-l2">
        <div class="cap"><span id="seatcap">Игроки</span><small id="seatcount"></small></div>
        <div class="seatrow" id="seatrow"></div>
      </section>
      </div>
      <section class="setup card-l2">
        <h2>Аукцион <small>лоты, ставки, ИИ-судья</small></h2>
        <div class="set">
          <div class="cap">Категория</div>
          <div class="tiles" id="kind">${list.map((k, i) => `<button class="tile" data-v="${k}" style="animation-delay:${i * 0.025}s"><span class="ico">${AUCTION_KINDS[k]?.icon || "🎲"}</span>${AUCTION_KINDS[k]?.button || k}</button>`).join("")}</div>
        </div>
        <div class="set">
          <div class="cap">Бюджет каждого · <b id="budgetVal"></b></div>
          <div class="row" id="budget">
            ${BUDGETS.map((v) => `<button class="opt" data-v="${v}">$${v}</button>`).join("")}
            <span class="step"><button data-d="-5" aria-label="меньше">−</button><button data-d="5" aria-label="больше">+</button></span>
          </div>
        </div>
        <div class="set">
          <div class="cap">Слотов в лайнапе · <b id="slotsVal"></b></div>
          <div class="row" id="slots">
            ${SLOTS.map((v) => `<button class="opt" data-v="${v}">${v}</button>`).join("")}
            <span class="step"><button data-d="-1" aria-label="меньше">−</button><button data-d="1" aria-label="больше">+</button></span>
          </div>
        </div>
        <div class="set">
          <div class="cap">Кто судит</div>
          <div class="seg" id="judge"><button data-v="chatgpt">ChatGPT</button><button data-v="vote">Голосование</button></div>
        </div>
        <div class="rounds" id="rounds"></div>
        <div class="rules">
          <div class="rule"><div class="k">1</div><div class="t">Заходите по коду</div><div class="d">QR с этого экрана или ссылка — и имя</div></div>
          <div class="rule"><div class="k">2</div><div class="t">Торги</div><div class="d">10 секунд на лот, каждая ставка даёт ещё 5</div></div>
          <div class="rule"><div class="k">3</div><div class="t">Судья</div><div class="d">Разбирает лайнапы и называет победителя</div></div>
        </div>
        <button class="start" id="start">Начать игру</button>
        <div class="start-note" id="startnote"></div>
        ${location.hostname === "localhost" || location.hostname === "127.0.0.1" ? '<button class="btn ghost" id="bots">+ 3 бота (dev)</button>' : ""}
      </section>
    </div>`;
  new QRCode(document.getElementById("qr"), { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });

  // любое изменение контрола уходит хосту тем же сообщением settings
  const push = (patch) => {
    const s = state.settings;
    const next = { kind: state.kind, budget: Number(s.budget), slots: Number(s.slots), judge: s.judge, ...patch };
    next.budget = Math.min(200, Math.max(10, next.budget));
    next.slots = Math.min(8, Math.max(3, next.slots));
    // оптимистично применяем локально — контрол реагирует мгновенно, сервер пришлёт подтверждение
    state.kind = next.kind; state.settings.budget = next.budget; state.settings.slots = next.slots; state.settings.judge = next.judge;
    document.body.dataset.kind = next.kind;
    sendMsg({ type: "settings", kind: next.kind, settings: { budget: next.budget, slots: next.slots, judge: next.judge } });
    syncLobby();
  };
  const pick = (box, key, cast) => document.getElementById(box).addEventListener("click", (e) => {
    const hit = e.target.closest("[data-v],[data-d]");
    if (!hit) return;
    if (hit.dataset.d) return push({ [key]: Number(state.settings[key]) + Number(hit.dataset.d) });
    push({ [key]: cast(hit.dataset.v) });
  });
  document.getElementById("kind").addEventListener("click", (e) => {
    const hit = e.target.closest("[data-v]"); if (hit) push({ kind: hit.dataset.v });
  });
  pick("budget", "budget", Number);
  pick("slots", "slots", Number);
  pick("judge", "judge", String);
  document.getElementById("start").onclick = () => { unlockAudio(); sendMsg({ type: "start" }); };
  document.getElementById("bots")?.addEventListener("click", () => sendMsg({ type: "bots", n: 3 }));
}

function lobbyUrl() { return `${location.origin}${location.pathname.replace(/auction-board\.html$/, "")}auction.html?r=${CODE}`; }

function syncLobby() {
  const s = state, box = document.getElementById("lobby");
  if (!box) return;
  const budget = Number(s.settings.budget), slots = Number(s.settings.slots);
  const players = s.players.filter((p) => !p.left);
  const n = players.length;

  markOn("kind", s.kind);
  markOn("judge", s.settings.judge);
  syncPills("budget", budget, BUDGETS, (v) => "$" + v);
  syncPills("slots", slots, SLOTS, (v) => String(v));
  document.getElementById("budgetVal").textContent = money(budget);
  document.getElementById("slotsVal").textContent = slots;
  document.getElementById("rounds").innerHTML =
    `Лотов в игре: <b>${Math.ceil(Math.max(n, 2) * slots * 1.25)}</b> · на лот <b>${s.settings.t1 / 1000} с</b>, после ставки <b>${s.settings.t2 / 1000} с</b>`;

  document.getElementById("seatcap").textContent = n ? `Игроки · ${n}` : "Игроки";
  document.getElementById("seatcount").textContent = n < 2 ? "нужно хотя бы двое" : "можно начинать";
  const row = document.getElementById("seatrow");
  const seats = players.map((p) => {
    const seat = el("div", "seat" + (p.online ? "" : " off") + (seatsSeen.has(p.id) ? "" : " new"));
    seatsSeen.add(p.id);
    seat.append(el("div", "av", initial(p.name)), el("div", "nm", p.name));
    return seat;
  });
  const wait = el("div", "seat wait");
  wait.append(el("div", "av", "+"), el("div", "nm", n ? "ждём ещё…" : "пока никого — заходите по коду"));
  seats.push(wait);
  row.replaceChildren(...seats);

  const start = document.getElementById("start");
  start.disabled = n < 2;
  document.getElementById("startnote").textContent = n < 2 ? "Нужно хотя бы двое — пусть друзья зайдут по коду" : "";
}

// аватар: первая буква имени; у ботов имя начинается с эмодзи — берём её целиком, а не половину суррогатной пары
function initial(name) {
  const s = String(name || "").trim();
  return (s.match(/[\p{L}\p{N}]/u)?.[0] || Array.from(s)[0] || "?").toUpperCase();
}
function markOn(boxId, value) {
  document.getElementById(boxId).querySelectorAll("[data-v]").forEach((b) => b.classList.toggle("on", b.dataset.v === String(value)));
}
function syncPills(boxId, value, presets, fmt) {
  const box = document.getElementById(boxId);
  let custom = box.querySelector(".opt.custom");
  if (!presets.includes(value)) {
    if (!custom) { custom = el("button", "opt custom"); custom.dataset.v = value; box.insertBefore(custom, box.querySelector(".step")); }
    custom.dataset.v = value; custom.textContent = fmt(value);
  } else if (custom) custom.remove();
  markOn(boxId, value);
  box.querySelectorAll(".step button").forEach((b) => {
    const next = value + Number(b.dataset.d);
    b.disabled = boxId === "budget" ? next < 10 || next > 200 : next < 3 || next > 8;
  });
}

function renderGame() {
  const s = state;
  app.style.display = "grid";
  if (!document.getElementById("topbar")) {
    app.innerHTML = `
      <main>
        <div class="topbar" id="topbar"><span class="lotno" id="lotno"></span><span class="phase" id="phase"></span><span class="spacer"></span>
          <div class="timer" id="timer"><svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="28"/><circle class="ring" id="ring" cx="32" cy="32" r="28" stroke-dasharray="176" stroke-dashoffset="0"/></svg><div class="num" id="tnum"></div></div>
        </div>
        <section class="frame"><div class="card center" id="card"></div></section>
        <div class="bidbar" id="bidbar"></div>
      </main>
      <aside>
        <section class="panel"><h2>Игроки <small id="pcount"></small></h2><div class="players" id="players"></div></section>
        <div class="hostbar"><span class="code">Комната ${CODE}</span><button class="btn ghost" id="pause">Пауза</button><button class="btn ghost" id="end">Завершить</button></div>
      </aside>`;
    document.getElementById("pause").onclick = () => sendMsg({ type: state.paused ? "resume" : "pause" });
    document.getElementById("end").onclick = () => confirm("Завершить игру и перейти к судейству?") && sendMsg({ type: "end" });
    requestAnimationFrame(tickTimer);
  }
  document.getElementById("pause").textContent = s.paused ? "Продолжить" : "Пауза";
  document.getElementById("lotno").textContent = `Лот ${s.round + 1} из ${s.rounds}`;
  const phaseEl = document.getElementById("phase");
  phaseEl.className = "phase " + s.phase;
  phaseEl.textContent = { lot: "Лот", bidding: "Торги", pickup: "Разбор", sold: "Продано", taken: "Забрали", unsold: "Никто не взял" }[s.phase] || "";

  // карточка перерисовывается только на новом лоте
  if (s.lot && (rendered.round !== s.round || rendered.kind !== s.kind)) {
    rendered = { round: s.round, kind: s.kind };
    renderCard(s.lot, s.kind);
  }
  renderBidbar();
  renderPlayers();
}

function renderCard(lot, kind) {
  const card = document.getElementById("card");
  stopMusic();
  const meta = el("div", "meta");
  (lot.meta || []).forEach((m) => meta.append(el("span", null, m)));
  const fact = el("p", "fact");
  fact.append(el("b", null, "Факт"), document.createTextNode(lot.fact));
  const text = el("div", "text");
  text.append(el("div", "emoji", lot.emoji), el("div", "kind", AUCTION_KINDS[kind]?.label || kind), el("div", "name", lot.name), meta, el("p", "desc", lot.description), fact);
  widget = kind === "artist" && state.settings.media ? playerWidget() : null;
  card.className = "card result";
  card.replaceChildren(state.settings.media ? heroWidget(lot, kind) : el("div", "hero gone"), text, ...(widget ? [widget.box] : []));
  if (widget) startMusic(lot, widget);
}

function renderBidbar() {
  const s = state, bar = document.getElementById("bidbar");
  bar.replaceChildren();
  if (s.phase === "sold" || s.phase === "taken") {
    const t = el("div", "lead");
    t.append(document.createTextNode("Ушло: "), el("b", null, nameOf(s.leaderId)), document.createTextNode(s.phase === "sold" ? ` за ${money(s.price)}` : " бесплатно"));
    bar.append(el("div", "gavel-mark", "🔨"), el("div", "stamp", s.phase === "sold" ? "Продано" : "Забрали"), t);
    return;
  }
  if (s.phase === "unsold") { bar.append(el("div", "lead", "Никто не взял — следующий лот")); return; }
  if (s.phase === "pickup") {
    const who = s.players.filter((p) => p.canTake).map((p) => p.name).join(", ");
    bar.append(el("div", "lead", "Без ставок — забирает бесплатно: "), el("div", "tape", who || "никто"));
    return;
  }
  if (!s.leaderId) {
    const bidders = s.players.filter((p) => p.canBid).length;
    bar.append(el("div", "cap", "Ставок пока нет"), el("div", "lead", bidders ? "Кто первый? Минимум $1" : "Торговаться некому"));
    return;
  }
  const lead = el("div", "lead");
  lead.append(el("b", null, nameOf(s.leaderId)), document.createTextNode(` ${money(s.price)}`));
  const tape = el("div", "tape");
  s.bids.slice(0, -1).reverse().forEach((b) => tape.append(el("span", null, `${nameOf(b.playerId)} ${money(b.amount)}`)));
  bar.append(el("div", "cap", "Лидер"), lead, tape);
}

function renderPlayers() {
  const s = state, box = document.getElementById("players");
  document.getElementById("pcount").textContent = `${s.players.filter((p) => !p.left).length} · ${s.settings.slots} слотов`;
  box.classList.toggle("compact", s.players.length > 4);
  box.replaceChildren(...s.players.map((p) => {
    const row = el("div", "p" + (p.id === s.leaderId && (s.phase === "bidding" || s.phase === "sold" || s.phase === "taken") ? " leader" : "") + (p.full ? " full" : "") + (!p.online ? " offline" : "") + (p.left ? " left" : "") + (p.money === 0 ? " broke" : ""));
    const top = el("div", "p-top");
    const tag = p.left ? "вышел" : !p.online ? "offline" : p.full ? "готов" : p.id === s.leaderId && s.phase === "bidding" ? "лидер" : p.money === 0 ? "на мели" : "";
    top.append(el("div", "p-name", p.name), el("span", "p-tag" + (tag === "лидер" ? "" : " dim"), tag), el("div", "p-left", money(p.money)));
    const bar = el("div", "p-bar"); const fill = el("i"); fill.style.width = Math.max(0, Math.min(100, (p.money / s.settings.budget) * 100)) + "%"; bar.append(fill);
    const slots = el("div", "slots");
    for (let i = 0; i < s.settings.slots; i++) {
      const l = p.lots[i];
      const sl = el("div", "slot-i" + (l ? " filled" : ""));
      if (l) { sl.append(el("span", null, l.emoji), el("span", "n", l.name)); sl.title = `${l.name} — ${l.price ? money(l.price) : "бесплатно"}`; }
      slots.append(sl);
    }
    row.append(top, bar, slots);
    return row;
  }));
}

function tickTimer() {
  if (!state || state.phase === "lobby" || state.phase === "finished" || !document.getElementById("timer")) return requestAnimationFrame(tickTimer);
  const s = state;
  const total = { lot: s.settings.t1, bidding: s.settings.t2, pickup: 5000 }[s.phase] || 2000;
  const left = s.paused ? total : Math.max(0, s.deadline - (Date.now() + offset));
  const frac = Math.min(1, left / total);
  document.getElementById("ring").setAttribute("stroke-dashoffset", String(176 * (1 - frac)));
  document.getElementById("tnum").textContent = (s.phase === "lot" || s.phase === "bidding" || s.phase === "pickup") ? Math.ceil(left / 1000) : "";
  document.getElementById("timer").classList.toggle("urgent", left < 3000 && (s.phase === "lot" || s.phase === "bidding"));
  requestAnimationFrame(tickTimer);
}

function renderFinal() {
  stopMusic();
  const s = state;
  app.style.display = "block";
  const players = s.players.filter((p) => !p.left);
  if (!s.results) {
    if (s.voting) {
      app.innerHTML = `<div class="final"><h2>Голосование</h2><p style="color:var(--muted)">Судья недоступен или выбрано голосование. Каждый голосует с телефона за чужой лайнап. Проголосовало: ${s.votes}/${players.filter((p) => p.lots.length).length}</p><div class="podium">${players.map((p) => lineupCard(p, null)).join("")}</div></div>`;
    } else {
      app.innerHTML = `<div class="final"><div class="thinking"><div class="dice">🎲</div><h2>Судья думает…</h2><p style="color:var(--muted)">ChatGPT читает лайнапы</p></div></div>`;
    }
    return;
  }
  const r = s.results;
  const places = ["🥇", "🥈", "🥉"];
  app.innerHTML = `<div class="final"><h2>Итоги</h2><div class="podium">${r.ranking.map((x, i) => lineupCard(s.players.find((p) => p.id === x.playerId), { place: places[i] || `${i + 1}.`, score: x.score, verdict: x.verdict, first: i === 0, mode: r.mode, delay: (r.ranking.length - 1 - i) * .5 })).join("")}</div>${r.summary ? `<div class="summary">${escapeHtml(r.summary)}</div>` : ""}<div class="actions"><button class="btn" id="again">Ещё раз (та же категория)</button><button class="btn ghost" id="another">Другая категория</button></div></div>`;
  document.getElementById("again").onclick = () => sendMsg({ type: "next_game" });
  document.getElementById("another").onclick = () => sendMsg({ type: "next_game" });
}
function lineupCard(p, res) {
  if (!p) return "";
  const lots = p.lots.map((l) => `<span class="chip">${l.emoji} ${escapeHtml(l.name)}</span>`).join("") || '<span style="color:var(--muted)">пусто</span>';
  return `<div class="pl ${res?.first ? "first" : ""}" style="animation-delay:${res?.delay || 0}s">${res ? `<div class="place">${res.place}</div>` : ""}<div class="who">${escapeHtml(p.name)}</div>${res ? `<div class="score">${res.mode === "vote" ? res.score + " голос." : res.score}</div><div class="verdict">${escapeHtml(res.verdict || "")}</div>` : ""}<div class="lots">${lots}</div><div class="spent">потрачено ${money(p.spent)}</div></div>`;
}
function escapeHtml(t) { return String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
</script>
