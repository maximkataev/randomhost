<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<!-- тёмная тема своя: без этого «принудительная тёмная тема» браузера перекрашивала доску -->
<meta name="color-scheme" content="dark">
<title>Аукцион — доска</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f528.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифты грузятся НЕблокирующе. Обычный rel="stylesheet" задерживает первую отрисовку до
     ответа fonts.googleapis.com, и у браузера нет таймаута на зависший стиль: при медленной или
     режущей сети доска оставалась бы белой на весь вечер. Так текст сразу рисуется системным
     шрифтом и подменяется фирменным, когда файл доедет. <noscript> — для случая без JS. -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="auction-shared.css">
<style>
  /* ---------- раскладка доски ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 34%, 460px); gap: 20px; height: 100%; max-width: 1500px; margin: 0 auto; }
  /* 4K-телевизор с масштабом 1: без этого доска занимала 39% ширины мелким текстом. Масштаб
     выставляет скрипт (fitScreen) через --z, высота делится на тот же множитель, чтобы влезть в экран */
  body.scaled { zoom: var(--z); height: calc(100vh / var(--z)); height: calc(100dvh / var(--z)); }
  main, aside { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: 12px; }
  .topbar { display: flex; align-items: center; gap: 18px; flex: none; }
  /* «Лот 7» стоит после крупной фазы, дальше — растяжка: смена длины текста ничего не сдвигает */
  .topbar .lotno { flex: none; white-space: nowrap; font: 700 12px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .topbar .phase { font: 900 clamp(22px, 2vw, 30px)/1 var(--display); letter-spacing: -.035em; text-transform: uppercase; }
  .topbar .phase.bidding { color: var(--c1); }
  .topbar .phase.draft { color: var(--c2); }
  /* соло-добор: кто добирает, какой слот и сколько скипов осталось (§10.2) */
  .topbar .draftline { display: none; font: 700 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  /* длинное имя добирающего — не больше двух строк и не выталкивает таймер за край */
  .topbar .draftline.on { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 0 1 auto; min-width: 0; line-height: 1.25; }
  .topbar .phase { flex: none; }
  /* телефон: строка добора — отдельной строкой под фазой, во всю ширину */
  @media (max-width: 760px) {
    .topbar { flex-wrap: wrap; row-gap: 8px; }
    .topbar .draftline.on { order: 10; flex: 1 1 100%; }
  }
  .topbar .spacer { flex: 1; }
  /* задание партии видно весь матч: игроки смотрят на экран, а не в телефон */
  /* nowrap + предел ширины: самое длинное задание не должно разгонять топбар на вторую строку
     (иначе карточка лота под ним теряет в высоте на 720p) */
  .topbar .gtask { display: none; font-size: clamp(14px, 1.15vw, 18px); padding: 8px 16px; border-radius: 999px;
    flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid color-mix(in srgb, var(--c1) 40%, transparent); background: color-mix(in srgb, var(--c1) 12%, transparent); color: rgba(244, 242, 255, .8); }
  .topbar .gtask.on { display: block; }
  .topbar .gtask b { color: var(--text); font-weight: 700; }
  .timer { position: relative; width: 64px; height: 64px; flex: none; transition: opacity .35s; }
  .timer svg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: rotate(-90deg); }
  .timer circle { fill: none; stroke-width: 5; }
  .timer .track { stroke: rgba(255, 255, 255, .1); }
  .timer .ring { stroke: var(--c1); stroke-linecap: round; transition: stroke .3s; }
  .timer .num { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; font: 900 22px/1 var(--display); }
  .timer.urgent .ring { stroke: #ff6b6b; }
  .timer.urgent .num { color: #ff6b6b; animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.18); } }
  /* в фазах без обратного отсчёта цифра пустая — гасим кольцо, чтобы не висело «сломанным» таймером */
  .phase.sold ~ .timer, .phase.taken ~ .timer, .phase.unsold ~ .timer { opacity: .16; }

  /* три уровня фона: пятна → стеклянные панели (.04) → карточка лота (.08) */
  .frame { flex: 1 1 auto; min-height: 0; margin-top: 0; background: rgba(255, 255, 255, .08); box-shadow: 0 34px 90px -44px #000, 0 0 0 1px rgba(255, 255, 255, .03); }
  .card { overflow: hidden; }
  /* Две колонки — фото слева, текст справа. Без :has(): если фото не нашлось (.hero.gone → display:none),
     текст и плеер растягиваются на обе колонки соседним селектором .hero.gone ~ (см. ниже). */
  /* Фото — во всю высоту карточки (object-fit: cover уже в shared), текст и плеер — одним блоком
     справа, по центру по вертикали. Раньше фото кончалось на 415px, а карточка тянулась до плеера:
     под фото и между «фактом» и плеером висели пустые поля. Сетка вместо flex-wrap: четыре строки,
     крайние — гибкие поровну, так что свободное место (если есть) делится сверху и снизу блока,
     а не копится дырой в одном месте. Высота карточки задана рамкой — между лотами ничего не прыгает. */
  @media (min-width: 1100px) {
    .card.result { --pt: 28px; --pr: 28px; --pb: 24px; --pl: 28px; padding: var(--pt) var(--pr) var(--pb) var(--pl);
      display: grid; grid-template-columns: 40% minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto minmax(0, 1fr);
      column-gap: clamp(22px, 2.2vw, 34px); align-items: stretch; }
    .card.result > .hero { grid-column: 1; grid-row: 1 / -1; height: auto; min-height: 0; margin: calc(-1 * var(--pt)) 0 calc(-1 * var(--pb)) calc(-1 * var(--pl)); }
    /* фото теперь вертикальная полоса: градиент уводит его в карточку справа, а не снизу */
    .card.result > .hero::after { inset: 0 0 0 auto; width: 38%; height: auto; background: linear-gradient(to left, rgba(18, 17, 24, .55), transparent); }
    .card.result > .hero.poster::after, .card.result > .hero.logo::after { display: none; }
    /* высокое фото в высокой колонке: кадрируем (cover, фокус сверху — там лицо), без размытых полос по бокам */
    .card.result > .hero.poster img:not(.blur) { padding: 0; object-fit: cover; object-position: 50% 18%; filter: none; }
    .card.result > .hero.poster img.blur { display: none; }
    .card.result > .text { grid-column: 2; grid-row: 2; min-width: 0; }
    .card.result > .player { grid-column: 2; grid-row: 3; margin-top: clamp(14px, 2.4vh, 24px); }
    /* фото не нашлось — текст и плеер на всю ширину */
    .card.result > .hero.gone ~ .text, .card.result > .hero.gone ~ .player { grid-column: 1 / -1; }
    .card.result > .hero:not(.gone) + .text > .emoji { margin-top: 0; font-size: 52px; }
    /* кегль растёт и с высотой экрана: на высоком экране текст занимает колонку, а не плавает в ней */
    /* --k — множитель кегля, его подбирает fitCard: длинный текст ужимается целиком, а не режется */
    .card.result .name { font-size: calc(clamp(28px, min(3vw, 6vh), 54px) * var(--k, 1)); }
    .card.result .desc { font-size: calc(clamp(15px, min(1.15vw, 2.3vh), 19px) * var(--k, 1)); }
    .card.result .fact { font-size: calc(clamp(14px, min(1vw, 2vh), 17px) * var(--k, 1)); }
    /* длинное описание не влезло — fitCard ужимает: описание до 4 строк, факт до 3 */
    /* крайний случай (не влезло и на минимальном кегле): обрезка только целыми строками. Кламп стоит на
       строке без отступов — у .fact с padding недорезанная строка просвечивала в нижнем отступе */
    .card.result.snug .desc, .card.result.snug .fact .ft { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .card.result.snug .desc { margin-bottom: 10px; }
    .card.result.snug .meta { margin-bottom: 10px; }
  }
  .text { display: flex; flex-direction: column; min-width: 0; }
  .text > * { flex: none; }
  .hero:not(.gone) + .text > .emoji { margin-top: -62px; position: relative; z-index: 1; font-size: 64px; }

  .card.fitting, .card.fitting * { animation: none !important; }

  /* ТВ и ноутбуки ниже 800px: карточка лота должна помещаться целиком, без внутренней прокрутки */
  @media (max-height: 840px) {
    .card { padding: 20px 22px 18px; }
    .card.result { --pt: 20px; --pr: 22px; --pb: 18px; --pl: 22px; }
    .card.result .name { font-size: calc(clamp(26px, min(2.8vw, 5.4vh), 44px) * var(--k, 1)); margin: 8px 0; }
    .card.result .desc { font-size: calc(clamp(14.5px, min(1.1vw, 2.1vh), 17px) * var(--k, 1)); margin-bottom: 12px; }
    .card.result .meta { margin-bottom: 12px; }
    .card.result .fact { padding: 11px 13px 11px 15px; font-size: calc(clamp(13.5px, min(.95vw, 1.9vh), 15.5px) * var(--k, 1)); }
    .card.result > .hero:not(.gone) + .text > .emoji { font-size: 40px; margin-bottom: 10px; }
  }

  /* полоса ставок */
  /* высота полосы постоянна во всех фазах — карточка лота над ней не «прыгает» при смене состояния */
  .bidbar { flex: none; display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: rgba(255, 255, 255, .045); border: 1px solid var(--glass-line); border-radius: 20px; backdrop-filter: blur(20px); height: clamp(84px, 9vh, 104px); overflow: hidden; }
  .bidbar .cap { flex: none; font: 700 10.5px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .bidbar .lead { min-width: 0; font: 900 clamp(22px, 2vw, 30px)/1.1 var(--display); letter-spacing: -.035em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .bidbar .lead b { color: var(--c1); }
  /* лента предыдущих ставок: одна строка, лишнее просто уезжает под маску — полоса не растёт */
  .bidbar .tape { flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: nowrap; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%); mask-image: linear-gradient(90deg, transparent, #000 12%); }
  .bidbar .tape span { flex: none; max-width: 30ch; font-size: 13.5px; color: var(--muted); background: rgba(255, 255, 255, .05); border: 1px solid var(--glass-line); border-radius: 999px; padding: 5px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* «разбор» (в полосе только .lead и список имён) — не больше двух строк */
  .bidbar > .lead:first-child + .tape { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 15px; line-height: 1.35; color: var(--muted); text-align: right; mask-image: none; -webkit-mask-image: none; }
  /* «ПРОДАНО» — та же печать, что на стартовом экране, плюс удар молотка */
  .bidbar .stamp { flex: none; font: 900 15px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--c3); border: 1.5px solid var(--c3); border-radius: 9px; padding: 8px 10px; transform: rotate(-7deg); animation: stamp .45s cubic-bezier(.3, 1.8, .5, 1) both; }
  .bidbar .gavel-mark { font-size: 30px; margin-right: 4px; }
  @keyframes stamp { from { opacity: 0; transform: rotate(-7deg) scale(2.2); } }

  /* игроки */
  .panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: rgba(255, 255, 255, .04); border: 1px solid var(--glass-line); border-radius: 24px; padding: 18px 18px 14px; backdrop-filter: blur(24px); }
  .panel h2 { font: 900 20px/1 var(--display); letter-spacing: -.035em; text-transform: uppercase; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .panel h2 small { font: 500 12px var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); }
  /* Карточки игроков — по содержимому (никакой пустоты внутри), все размеры в em от кегля списка.
     Кегль подбирает fitPlayers: самый крупный, при котором список влезает в панель, — так высоту панели
     заполняют сами карточки, а не растянутые рамки. Ступени (roomy → обычная → dense → две колонки)
     меняют устройство карточки, кегль — её масштаб. */
  .players { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; display: flex; flex-direction: column; gap: .5em; font-size: 16px; }
  .p { flex: none; background: rgba(255, 255, 255, .045); border: 1px solid var(--glass-line); border-radius: 1em; padding: .62em .88em; transition: border-color .3s, box-shadow .3s, opacity .3s; }
  .p.leader { border-color: var(--c1); box-shadow: 0 0 0 1px var(--c1), 0 10px 30px -12px var(--c1); }
  .p.full, .p.offline, .p.left { opacity: .55; }
  .p-top { display: flex; align-items: baseline; gap: .5em; }
  .p-name { font-weight: 600; font-size: 1em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-tag { font: 700 .63em/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--c1); }
  .p-tag.dim { color: var(--muted); }
  .p-left { font: 900 1.2em/1 var(--display); letter-spacing: -.02em; }
  .p.broke .p-left { color: #ff8a8a; }
  .p-bar { height: .25em; border-radius: .25em; background: rgba(255, 255, 255, .08); margin: .5em 0; overflow: hidden; }
  .p-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width .6s cubic-bezier(.2, .8, .3, 1); }
  /* слоты переносятся целыми пилюлями (названия не режутся); последний лот с пустыми кружками — одна группа */
  .slots { display: flex; gap: .38em; flex-wrap: wrap; min-width: 0; }
  .slots .tailgrp { display: inline-flex; gap: .38em; flex: none; max-width: 100%; }
  .players.roomy .slots .tailgrp { display: contents; }
  .slot-i { flex: none; min-width: 2.15em; height: 2.15em; border-radius: 999px; border: 1px dashed var(--glass-line); display: flex; align-items: center; gap: .45em; padding: 0 .7em; font-size: .82em; }
  .slot-i.filled { flex: 0 1 auto; min-width: 2.15em; border-style: solid; background: rgba(255, 255, 255, .07); }
  .slot-i.filled > :first-child { flex: none; }
  .p.leader .slot-i.filled { border-color: transparent; background: linear-gradient(100deg, var(--c1), var(--c2) 85%); background-origin: border-box; color: #0a0a0f; font-weight: 600; }
  .slot-i .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot-i .pr, .slot-i .no { display: none; }
  /* плотно: без полосы денег, лоты — только эмодзи (название в подсказке) */
  .players.dense { gap: .3em; }
  .players.dense .p { padding: .35em .65em .4em; border-radius: .75em; }
  .players.dense .p-bar { display: none; }
  .players.dense .p-top { margin-bottom: .3em; }
  .players.dense .slots, .players.dense .slots .tailgrp { flex-wrap: nowrap; overflow: hidden; gap: .25em; }
  .players.dense .slot-i { padding: 0 .35em; }
  .players.dense .slot-i .n { display: none; }
  /* просторно (мало игроков): каждый слот — строка «эмодзи · лот · цена», у пустого — номер */
  .players.roomy { gap: .6em; }
  .players.roomy .p { padding: .8em 1em .9em; border-radius: 1.2em; }
  .players.roomy .p-name { font-size: 1.12em; }
  .players.roomy .p-left { font-size: 1.5em; }
  .players.roomy .p-bar { height: .3em; margin: .6em 0 .7em; }
  .players.roomy .slots { display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: 2.2em; gap: .3em; }
  .players.roomy .slot-i { height: auto; min-width: 0; border-radius: .9em; padding: 0 .9em; gap: .7em; font-size: .92em; }
  .players.roomy .slot-i > :first-child { flex: none; font-size: 1.15em; }
  .players.roomy .slot-i .n { flex: 1 1 auto; font-weight: 600; }
  .players.roomy .slot-i .pr { display: block; flex: none; font: 700 .82em/1 var(--display); letter-spacing: -.01em; opacity: .8; }
  .players.roomy .slot-i .no { display: block; font: 700 .72em/1 var(--display); letter-spacing: .12em; color: rgba(244, 242, 255, .32); }
  /* и две колонки, если всё равно не влезает */
  .players.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; }
  /* RTL-имя не переворачивает соседний текст («Лидер $5», «лот 3/8») */
  .p-name, .seat .nm, .pl .who, .bidbar .lead b, .bidbar .tape span, .chip { unicode-bidi: isolate; }

  /* панель хоста: код отдельной строкой, три кнопки делят ряд и никогда не вылезают за колонку */
  /* поверх оверлея паузы: иначе ведущий не может снять паузу, которую сам же поставил */
  .hostbar { position: relative; z-index: 60; flex: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .hostbar .code { flex: 1 0 100%; font: 700 12px/1 var(--display); letter-spacing: .14em; color: var(--muted); }
  /* кнопки не сжимаются в «ПРОПУСТИТЬПАУЗА» на узком экране: не влезают в ряд — переносятся */
  .hostbar .btn { flex: 1 1 90px; min-width: 0; padding: 12px 10px; overflow-wrap: anywhere; }
  .btn { min-height: 44px; font: 700 11.5px/1.25 var(--display); letter-spacing: .06em; text-transform: uppercase; color: #0a0a0f; background: linear-gradient(120deg, var(--c1), var(--c2)); border: 0; border-radius: 999px; padding: 13px 20px; cursor: pointer; box-shadow: 0 14px 34px -18px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .4); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), border-color .2s, background .2s, box-shadow .3s; }
  .btn.ghost { background: none; color: var(--text); border: 1px solid var(--glass-line); box-shadow: none; }
  .btn.ghost:disabled { opacity: .35; cursor: default; }
  .btn.accent { background: linear-gradient(120deg, var(--c1), var(--c2)); color: #0a0a0f; border-color: transparent; background-origin: border-box; }
  /* .overlay гасит pointer-events, поэтому кнопке «Продолжить игру» их надо вернуть — иначе клик не доходит */
  .pausebox { display: flex; flex-direction: column; align-items: center; gap: 22px; pointer-events: auto; }
  .pausebox .start { width: auto; padding: 18px 34px; }
  .pausebox .start::before { content: none; } /* у кнопки уже есть свой знак ▶ — стрелка справа наезжала на текст */
  .btn:hover { transform: translateY(-2px); }
  .btn.ghost:hover { border-color: var(--c1); background: rgba(255, 255, 255, .06); }

  /* ===== лобби: слева «вход» (код + QR), справа настройки, снизу лента игроков ===== */
  .lobby {
    /* height, а не flex: .layout в лобби переключается в display:block, и без этого
       проценты у колонок не разрешались — список игроков уезжал под нижний край */
    height: 100%; min-height: 0; display: grid; align-items: center;
    grid-template-columns: minmax(320px, 36%) minmax(0, 1fr);
    gap: clamp(18px, 2.4vw, 34px);
  }
  /* левая колонка: код с QR и блок ожидания — вместе по центру экрана по вертикали */
  .joincol { align-self: center; display: flex; flex-direction: column; gap: clamp(12px, 2vh, 20px); max-height: 100%; min-height: 0; }
  .card-l2 { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 26px; backdrop-filter: blur(24px); box-shadow: 0 30px 80px -50px #000; }

  /* --- вход --- */
  .join { flex: none; display: flex; flex-direction: column; align-items: center; text-align: center; gap: clamp(10px, 1.6vh, 18px); padding: clamp(18px, 2.6vh, 30px) 24px; }
  .join .eyebrow { font: 700 11px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 9px; }
  .join .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--c1); box-shadow: 0 0 14px var(--c1); animation: glow 1.8s ease-in-out infinite alternate; }
  @keyframes glow { to { opacity: .35; transform: scale(.7); } }
  .join .code {
    font: 900 clamp(48px, min(7.4vw, 13vh), 116px)/.9 var(--display); letter-spacing: .06em; text-transform: uppercase;
    background: linear-gradient(100deg, #fff 25%, color-mix(in srgb, var(--c2) 75%, white));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 18px 44px color-mix(in srgb, var(--c1) 55%, transparent));
  }
  .join .qrbox { flex: none; background: #fff; padding: 12px; border-radius: 20px; line-height: 0; box-shadow: 0 24px 60px -28px #000; }
  /* QR считает и высоту экрана: на 720p он не должен выдавливать список игроков за край */
  .join .qrbox img, .join .qrbox canvas { display: block; width: clamp(132px, min(15vw, 23vh), 210px) !important; height: auto !important; }
  .join .url { font: 600 clamp(14px, 1.1vw, 17px)/1.3 var(--body); color: var(--text); word-break: break-all; text-decoration: none; }
  .join a.url:hover { color: var(--c1); }
  .join .hint { font-size: clamp(13px, .95vw, 15px); color: var(--muted); max-width: 34ch; }

  /* --- настройки --- */
  /* Панель из двух зон: прокручиваемое тело и приклеенный низ с «Начать игру».
     До этого кнопка жила в общем потоке и после появления блока задания уезжала
     за нижнюю кромку панели на 1366×768 и 1280×720 — хост видел обрезанный список настроек
     и ни одной кнопки. Теперь главное действие на экране всегда. */
  .setup { align-self: center; display: flex; flex-direction: column; gap: 0; padding: clamp(18px, 2.6vh, 28px) clamp(18px, 2vw, 28px); max-height: 100%; overflow: hidden; }
  .setup-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 18px); }
  .setup-foot { flex: none; display: flex; flex-direction: column; gap: 8px; padding-top: clamp(10px, 1.6vh, 18px); }
  .setup h2 { font: 900 clamp(24px, 2.4vw, 38px)/.95 var(--display); letter-spacing: -.04em; text-transform: uppercase; margin: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .setup h2 small { font: 500 13px/1.3 var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); }
  .set { display: flex; flex-direction: column; gap: 8px; }
  /* бюджет и слоты — две одинаковые числовые настройки: держим их в одной строке,
     чтобы они не отнимали у задания две полных полосы панели */
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px clamp(14px, 1.6vw, 24px); }
  .set > .cap { font: 700 10.5px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .set > .cap::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--glass-line), transparent); }
  .set > .cap b { color: var(--text); font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }

  /* пилюли-пресеты + тонкая подстройка */
  .opt {
    font: 900 14px/1 var(--display); letter-spacing: -.01em; color: rgba(244, 242, 255, .88);
    background: rgba(255, 255, 255, .045); border: 1px solid var(--glass-line); border-radius: 999px;
    padding: 11px 17px; cursor: pointer;
    transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), border-color .2s, background .25s, box-shadow .3s, color .25s;
  }
  .opt:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c1) 70%, transparent); background: rgba(255, 255, 255, .08); }
  .opt.on { color: #0a0a0f; border-color: transparent; background: linear-gradient(100deg, var(--c1), var(--c2) 75%, var(--c3)); background-origin: border-box; box-shadow: 0 12px 34px -14px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .4); }
  .step { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; }
  .step button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, .045); color: var(--text); font: 500 19px/1 var(--body); cursor: pointer; transition: border-color .2s, background .2s; }
  .step button:hover { border-color: var(--c1); background: rgba(255, 255, 255, .09); }
  .step button:disabled { opacity: .3; cursor: default; }
  /* хост с планшета: пресеты и степперы дорастают до пальца */
  @media (pointer: coarse) {
    .opt { min-height: 44px; padding: 13px 18px; }
    .seg button { min-height: 40px; }
    .step button { width: 44px; height: 44px; }
  }

  /* сегмент-переключатель */
  .seg { align-self: flex-start; display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, .045); }
  .setup .btn.ghost { align-self: flex-start; }
  .seg button { font: 700 11.5px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; color: rgba(244, 242, 255, .8); background: none; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; transition: color .2s, background .25s, box-shadow .3s; }
  .seg button.on { color: #0a0a0f; background: linear-gradient(100deg, var(--c1), var(--c2) 80%); box-shadow: 0 10px 26px -14px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .4); }
  .seg button:not(.on):hover { color: var(--text); background: rgba(255, 255, 255, .07); }

  /* ЗАДАНИЕ — не такая же строчка настроек, как бюджет: оно меняет правило победы.
     Поэтому блок поднят на третий уровень фона (как карточка лота) и обведён цветом категории,
     а фишки заданий крупнее категорий, а не мельче (было 9px — с дивана не прочитать). */
  .set.task { gap: 9px; padding: 13px 15px 14px; border-radius: 20px;
    background: rgba(255, 255, 255, .055); border: 1px solid color-mix(in srgb, var(--c1) 30%, var(--glass-line));
    box-shadow: 0 20px 46px -36px #000, inset 0 1px 0 rgba(255, 255, 255, .05); }
  .set.task > .cap { color: var(--text); font-size: 11.5px; letter-spacing: .18em; }
  /* панель задания уже обведена рамкой — черта под заголовком дублирует её и добавляет шума */
  .set.task > .cap::after { display: none; }
  .set.task > .cap em { flex: none; font: 500 12.5px/1 var(--body); font-style: normal; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .modes .tile { font-size: 11px; padding: 8px 12px 8px 9px; }
  .modes .tile .ico { font-size: 14px; }
  /* «кто судит» стоит рядом с самим заданием, а не отдельной настройкой ниже:
     вместе они и отвечают на вопрос «как определится победитель» */
  .judgerow { display: flex; align-items: center; flex-wrap: wrap; gap: 9px 12px; }
  .judgerow .seg { flex: none; align-self: center; }
  .judgerow .modehint { flex: 1 1 240px; min-width: 0; }
  /* Подсказка живёт внутри уже обведённой панели, поэтому своей рамки и фона не имеет:
     коробка в коробке — главный источник визуального шума в этом блоке.
     От текста её отделяет только цветная полоса слева. */
  .modehint {
    padding: 2px 0 2px 12px; font-size: 14px; line-height: 1.4;
    color: rgba(244, 242, 255, .78); border-left: 2px solid color-mix(in srgb, var(--c1) 70%, transparent);
  }
  .modehint b { color: var(--c1); font-weight: 700; }
  .rounds { font-size: 13.5px; color: var(--muted); }
  .rounds b { color: var(--text); font-weight: 600; }
  .rounds .warn { display: block; margin-top: 5px; color: #ffc15c; }

  /* служебная строка: назад в каталог + звук. Живёт в лобби (в игре экран занят доской);
     правый верхний угол оставлен пустым — туда i18n.js кладёт фиксированный .lang-switch. */
  .util { position: fixed; left: 18px; top: 14px; z-index: 30; display: none; align-items: center; gap: 8px; }
  body.m-lobby .util { display: flex; }
  body.m-lobby .lobby { padding-top: 42px; }
  .util a, .util button {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 44px; padding: 0 15px; border-radius: 999px;
    border: 1px solid var(--glass-line); background: rgba(255, 255, 255, .04);
    color: var(--muted); font: 500 13px/1 var(--body); text-decoration: none; cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
  }
  .util button { width: 44px; padding: 0; }
  .util a:hover, .util button:hover { color: var(--text); border-color: var(--c1); background: rgba(255, 255, 255, .08); }
  /* Переключатель языка (его кладёт i18n.js) живёт только в лобби — как и вся служебная строка.
     В партии правый верхний угол занят шапкой панели игроков, и фиксированная плашка легла бы
     поверх счётчика мест. Язык всё равно выбирают до старта: сервер принимает настройки комнаты
     (и язык колоды) только в лобби, а посреди партии доска разъехалась бы с телефонами. */
  body:not(.m-lobby) .lang-switch { display: none !important; }

  /* правила — чтобы пустота под настройками работала на игроков, пока все собираются */
  .rules { margin-top: 4px; padding-top: 16px; border-top: 1px solid var(--glass-line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 1.4vw, 20px); }
  .rule { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 9px; }
  .rule .k { grid-row: 1 / span 2; font: 900 22px/.95 var(--display); color: var(--c1); }
  .rule .t { font: 600 13.5px/1.3 var(--body); }
  .rule .d { font-size: 12.5px; line-height: 1.4; color: var(--muted); }
  @media (max-width: 760px) { .rules { grid-template-columns: minmax(0, 1fr); } }

  /* главная кнопка */
  .start {
    position: relative; overflow: hidden; width: 100%;
    font: 900 clamp(17px, 1.6vw, 22px)/1 var(--display); text-transform: uppercase; letter-spacing: .05em;
    color: #0a0a0f; background: linear-gradient(100deg, var(--c1), var(--c2) 60%, var(--c3));
    border: 0; border-radius: 20px; padding: clamp(18px, 2.2vh, 24px) 24px; cursor: pointer;
    box-shadow: 0 22px 60px -22px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45);
    transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), box-shadow .3s, opacity .3s;
  }
  .start::before { content: "→"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; background: rgba(10, 10, 15, .16); display: grid; place-items: center; font: 500 20px/1 var(--body); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  .start:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 30px 70px -20px var(--c1), inset 0 1px 0 rgba(255, 255, 255, .45); }
  .start:not(:disabled):hover::before { transform: translateY(-50%) translateX(4px); }
  .start:disabled { opacity: .4; filter: grayscale(.45); cursor: default; box-shadow: none; }
  .start-note { font-size: 13px; color: var(--muted); text-align: center; }

  /* --- лента игроков --- */
  /* блок ожидания сжимается сам и отдаёт прокрутку ленте мест: 12 игроков не выталкивают карточку за экран */
  .seats { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px clamp(16px, 2vw, 22px) 18px; overflow: hidden; }
  .seats .cap { flex: none; font: 900 14px/1.25 var(--display); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .seats .cap small { font: 500 12.5px var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
  .seatrow { min-width: 0; min-height: 0; overflow-y: auto; scrollbar-width: thin; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; }
  .seat { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, .05); }
  .seat .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 900 15px/1 var(--display); color: #0a0a0f; background: linear-gradient(140deg, var(--c1), var(--c2)); }
  .seat .nm { font: 600 16px/1 var(--body); max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat.new { animation: seatIn .55s cubic-bezier(.3, 1.7, .5, 1) both; }
  @keyframes seatIn { from { opacity: 0; transform: scale(.6) translateY(10px); } }
  .seat.off { opacity: .5; }
  .seat.off .av { background: rgba(255, 255, 255, .12); color: var(--text); }
  .seat.wait { border-style: dashed; background: none; color: var(--muted); font-size: 14px; padding: 8px 16px; animation: waitPulse 2.2s ease-in-out infinite; }
  @keyframes waitPulse { 50% { opacity: .45; } }
  .seat.wait .av { background: rgba(255, 255, 255, .08); color: var(--muted); font-size: 13px; }
  /* подпись «ждём ещё…» переносится: nowrap без предела ширины раздвигал лобби шире экрана телефона */
  .seat.wait .nm { max-width: none; font-weight: 500; white-space: normal; }
  .seat { max-width: 100%; }

  /* ноутбук/ТВ пониже: вход ужимается, а места игроков становятся плотнее — список из 12 человек влезает */
  /* Три шага правил были «заполнителем пустоты» под настройками. Пустоты больше нет:
     её занял блок задания. Оставляем правила только там, где панель и так не переполнена. */
  @media (max-height: 960px) { .rules { display: none; } }
  @media (max-height: 820px) {
    .setup { padding: 14px 18px 16px; }
    .setup h2 { font-size: 20px; }
    /* 8px, а не 9: на 1280×720 у самой высокой категории (15 фишек + задание в три строки
       подсказки) панели не хватало одного-двух пикселей и она получала внутреннюю прокрутку */
    .setup-body { gap: 8px; }
    .set.task { padding: 10px 12px 11px; gap: 8px; }
    .modehint { padding: 8px 12px; font-size: 13px; }
    /* фишки категорий чуть плотнее: три ряда по 15 штук — самый дорогой блок панели */
    #kind.tiles { gap: 6px; }
    #kind .tile { padding: 6px 11px 6px 9px; }
    .opt { padding: 9px 15px; }
    .step button { width: 32px; height: 32px; }
    .join { gap: 8px; padding: 14px 20px 16px; }
    .join .url { font-size: 13px; }
    .join .hint { font-size: 12.5px; }
    .seats { gap: 8px; padding: 12px 16px 14px; }
    .seat { padding: 5px 12px 5px 5px; gap: 8px; }
    .seat .av { width: 26px; height: 26px; font-size: 13px; }
    .seat .nm { font-size: 14px; max-width: 12ch; }
    .seat.wait { padding: 5px 12px; font-size: 13px; }
  }

  /* планшет пальцем: степперы 44px и на невысоких экранах (правило выше ужимало их до 32px) */
  @media (pointer: coarse) { .step button { width: 44px; height: 44px; } }

  @media (prefers-reduced-motion: reduce) {
    .join .eyebrow i, .seat.new, .seat.wait, .timer.urgent .num, .pl,
    .bidbar .stamp, .bidbar .gavel-mark, .hero::before { animation: none !important; }
  }

  /* монетка (§9): ничья по голосам и по деньгам — на доске видно, что решил жребий, а не сбой */
  .coinflip { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 80; display: grid; place-items: center; align-content: center; gap: 18px; background: rgba(6, 5, 12, .72); pointer-events: none; animation: coinfade 2.4s ease forwards; }
  .coinflip .coin { font-size: clamp(90px, 14vw, 180px); line-height: 1; animation: coinspin 1.7s cubic-bezier(.25, .8, .3, 1) forwards; }
  .coinflip .ccap { font: 700 clamp(16px, 1.6vw, 24px)/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  @keyframes coinspin { 0% { transform: translateY(0) rotateX(0); } 45% { transform: translateY(-18vh) rotateX(1260deg); } 100% { transform: translateY(0) rotateX(2160deg); } }
  @keyframes coinfade { 0%, 82% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }

  /* заставка перед первым лотом: задание во весь экран, затем отсчёт */
  .intro { height: 100%; display: grid; place-items: center; text-align: center; position: relative; }
  .intro .itext { display: flex; flex-direction: column; align-items: center; gap: 10px; transition: transform .45s cubic-bezier(.3, 1.2, .4, 1), opacity .45s; }
  .intro .icap { font: 700 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); animation: ifade .5s both; }
  .intro .ibig { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .2em;
    font: 900 clamp(46px, 7vw, 104px)/.92 var(--display); letter-spacing: -.045em; text-transform: uppercase;
    animation: ipop .6s cubic-bezier(.2, 1.5, .4, 1) both; }
  /* градиент только на буквах: под background-clip эмодзи теряет свои цвета и становится силуэтом */
  .intro .ibig .iname { background: linear-gradient(100deg, var(--c1), var(--c2) 55%, var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .intro .ibig .iicon { font-size: .82em; line-height: 1; }
  .intro .isub { font: 500 clamp(18px, 1.9vw, 28px)/1.25 var(--body); color: var(--text); max-width: 22ch; animation: ifade .6s .15s both; }
  .intro .ijudge { font-size: clamp(14px, 1.3vw, 20px); color: var(--muted); max-width: 46ch; animation: ifade .6s .3s both; }
  /* Отсчёт: задание сжимается в строку под верхний край, цифра остаётся на экране одна.
     Без этого огромная цифра ложилась поверх текста и оба становились нечитаемы. */
  .intro.counting .itext { position: absolute; top: 7vh; transform: scale(.52); transform-origin: top center; }
  /* animation: ... both у появления держит свою opacity и перебивает обычное правило — гасим анимацию */
  .intro.counting .isub, .intro.counting .ijudge, .intro.counting .icap { animation: none; opacity: 0; transition: opacity .3s; }
  .intro .count { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .intro .count .num { font: 900 clamp(120px, 26vw, 360px)/1 var(--display); letter-spacing: -.06em; color: var(--text);
    text-shadow: 0 0 80px color-mix(in srgb, var(--c1) 70%, transparent); animation: icount 1s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes ipop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
  @keyframes ifade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  /* цифра держится плотной почти всю секунду и гаснет только перед сменой:
     при равномерном затухании она к концу каждой секунды была еле видна */
  @keyframes icount { 0% { opacity: 0; transform: scale(1.9); } 16% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: .3; transform: scale(.92); } }
  @media (prefers-reduced-motion: reduce) {
    .intro .icap, .intro .ibig, .intro .isub, .intro .ijudge, .intro .count .num { animation: none; }
  }

  /* финал */
  /* height, а не min-height: иначе экран итогов вырастал за пределы body{overflow:hidden} и низ обрезался.
     Прокрутки у панели нет вовсе (overflow: hidden): на телевизоре полоса выглядела сбоем, листать доску
     с дивана некому. Всё обязано влезть — за это отвечает fitFinal (ступени плотности), а сами
     карточки ограничены сеткой и клампами строк. На узкой доске (телефон) прокручивается страница. */
  .final { height: 100%; display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 20px);
    overflow: hidden; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 28px;
    padding: clamp(18px, 2.6vh, 30px) clamp(18px, 2vw, 30px); backdrop-filter: blur(24px); box-shadow: 0 30px 80px -50px #000; }
  .final > * { flex: none; }
  .final h2 { font: 900 clamp(30px, 3.4vw, 44px)/.95 var(--display); text-transform: uppercase; letter-spacing: -.045em; margin: 0; }
  /* подпись задания объясняет вердикты судьи — её читают с дивана вместе с «Итогами», не мельче 16px */
  .final .ftask { font-size: clamp(16px, 1.45vw, 22px); color: rgba(244, 242, 255, .78); }
  .final .ftask b { color: var(--c1); font-weight: 700; }

  /* --- голосование: сетка лайнапов (как было) --- */
  .final.voting { justify-content: safe center; }
  .final.voting .ftask { margin: -8px 0 8px; }
  .podium { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 460px)); align-items: start; gap: 14px; }
  .pl { background: rgba(255, 255, 255, .05); border: 1px solid var(--glass-line); border-radius: 22px; padding: 18px; backdrop-filter: blur(14px); box-shadow: 0 18px 40px -30px #000; animation: settle .55s cubic-bezier(.2, .9, .3, 1) both; min-width: 0; }
  /* появление без сдвига: scale(<1) не выходит за рамку карточки, translateY выходил — и давал полосу прокрутки */
  @keyframes settle { from { opacity: 0; transform: scale(.965); } }
  .pl.first { border-color: var(--c1); box-shadow: 0 0 0 1px var(--c1), 0 20px 50px -20px var(--c1); }
  .pl .place { font-size: 34px; line-height: 1; }
  .pl .who { font: 900 clamp(18px, 1.5vw, 24px)/1.08 var(--display); letter-spacing: -.03em; margin: 8px 0 2px; overflow-wrap: anywhere; }
  .pl .score { font: 900 clamp(30px, 2.8vw, 40px)/1 var(--display); letter-spacing: -.04em; color: var(--c1); }
  .pl .verdict { margin: 10px 0 12px; font-size: 14.5px; line-height: 1.45; color: rgba(244, 242, 255, .86); display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .pl .lots .chip { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl .lots { display: flex; flex-wrap: wrap; gap: 6px; }
  .pl .spent { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  /* пилюли: лоты в лайнапе; у победителя — залитые градиентом */
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; background: rgba(255, 255, 255, .06); border: 1px solid var(--glass-line); border-radius: 999px; padding: 6px 13px; font-size: 14px; overflow-wrap: anywhere; }
  .chip.off { opacity: .5; }
  .chip .cn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { align-items: center; }
  /* background-origin: border-box — у всех градиентов с прозрачной рамкой: иначе градиент считается от
     внутренней области и повторяется под рамкой, по краю пилюли выходила светлая кайма другого цвета */
  .pl.first .chip { color: #0a0a0f; border-color: transparent; background: linear-gradient(100deg, var(--c1), var(--c2) 80%); background-origin: border-box; font-weight: 600; }
  .final.voting.many .podium { grid-template-columns: repeat(auto-fill, minmax(min(170px, 100%), 1fr)); gap: 10px; }
  .final.voting.many .pl { padding: 12px 14px; }
  .final.voting.many .chip { font-size: 12px; padding: 3px 9px; }
  .final.voting.tight .podium { grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 8px; }
  .final.voting.tight .chip { font-size: 11.5px; padding: 2px 8px; }
  .final.voting.tight .pl .spent { display: none; }

  /* --- итоги: композиция по числу мест ---
     duo (1–2): две большие карточки во всю высоту, у победителя шире;
     stack (3–4): плакат победителя слева во всю высоту, остальные — карточки столбиком справа;
     grid (5–8): плакат победителя слева, остальные — сетка 2 колонки справа.
     Все размеры внутри карточки — в em от её кегля, а кегль подбирает fitFinal: самый крупный,
     при котором карточка целиком влезает в свою клетку. Так свободная высота уходит в рост имени,
     счёта и вердикта, а не в дыру под лотами и не в растянутые «бруски». Вердикты не режутся
     многоточием: не влезло — меньше кегль, а не обрезка. У плиток один кегль на всех — имена в ряду
     на одной высоте и одного размера. */
  .fhead { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; min-width: 0; }
  .fhead h2 { flex: none; }
  .fhead .ftask { flex: 1 1 280px; min-width: 0; }
  /* «Главная» — вторичная кнопка-пилюля (как «← Все игры» в лобби), слева вверху */
  .homebtn { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px 0 14px; border-radius: 999px;
    border: 1px solid var(--glass-line); background: rgba(255, 255, 255, .05); color: var(--text); text-decoration: none;
    font: 700 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; transition: border-color .2s, background .2s; }
  .homebtn svg { width: 17px; height: 17px; flex: none; }
  .homebtn:hover { border-color: var(--c1); background: rgba(255, 255, 255, .09); }
  .fbody { flex: 1 1 auto; min-height: 0; display: grid; gap: clamp(10px, 1.4vh, 16px); }
  .fbody > .pl { font-size: 16px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; padding: 1em 1.15em; }
  /* строки карточки не сжимаются: иначе текст молча срезался бы, а fitFinal не видел переполнения */
  .fbody > .pl > * { flex-shrink: 0; }
  /* место — медаль или номер в одинаковом круге, в одну строку с именем и счётом */
  /* шапка — сетка: место | имя | счёт. Имя переносится внутри своей колонки, до счёта всегда зазор .6em */
  .fbody .plhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: .6em; min-width: 0; }
  .fbody .place { flex: none; display: grid; place-items: center; font-size: 1.55em; width: 1.35em; height: 1.35em; line-height: 1; }
  .fbody .place.num { font: 900 .95em/1 var(--display); width: 2.2em; height: 2.2em; border-radius: 50%; border: 1.5px solid var(--glass-line); color: var(--muted); }
  .fbody .who { min-width: 0; margin: 0; font: 900 1.3em/1.08 var(--display); letter-spacing: -.03em; overflow-wrap: break-word; }
  .fbody .score { font: 900 1.9em/1 var(--display); letter-spacing: -.04em; color: var(--c1); }
  .fbody .verdict { display: block; -webkit-line-clamp: unset; overflow: visible; margin: .6em 0 .75em; font-size: 1em; line-height: 1.45; }
  .fbody .lots { display: flex; flex-wrap: wrap; gap: .4em; }
  .fbody .pl .chip { font-size: .85em; padding: .35em .85em; }
  .fbody .spent { margin-top: .75em; font-size: max(13px, .78em); color: var(--muted); }
  /* «+N» вместо хвоста лотов — только у мест 5+ и только если иначе кегль ушёл бы ниже 14px */
  .chip.more, .pl .lots .chip.more { display: none; }
  .fbody.fold > .pl.minor .lots .chip:nth-child(n+3):not(.more),
  .fbody.fold2 > .pl:not(.first) .lots .chip:nth-child(n+3):not(.more) { display: none; }
  .fbody.fold > .pl.minor .lots .chip.more, .fbody.fold2 > .pl:not(.first) .lots .chip.more { display: inline-flex; color: var(--muted); }
  /* последняя ступень перед аварийным кеглем: «потрачено» убираем у всех сразу, а не у части карточек */
  .fbody.nospent .spent { display: none; }
  /* плакат (победитель; в дуэли — обе карточки): имя крупнее, счёт отдельной строкой, лоты столбиком */
  /* плакат: медаль и имя (с эмодзи, неразрывно) в одну строку, счёт — под ними на всю ширину */
  .fbody > .pl.first .plhead, .fbody.duo > .pl .plhead { grid-template-columns: auto minmax(0, 1fr); row-gap: .1em; }
  .fbody > .pl.first .who, .fbody.duo > .pl .who { font-size: 1.6em; }
  .fbody > .pl.first .score, .fbody.duo > .pl .score { grid-column: 1 / -1; margin: .12em 0 0; font-size: 3.3em; }
  /* лоты на плакате — обычные пилюли в строку (не растянутые бруски): место уходит в имя, счёт и вердикт */
  .fbody > .pl.first .lots, .fbody.duo > .pl .lots { gap: .45em; }
  .fbody > .pl.first .lots .chip, .fbody.duo > .pl .lots .chip { font-size: .85em; padding: .4em .95em; }
  .fbody > .pl.first .place, .fbody.duo > .pl .place { font-size: 2.1em; }
  .fbody > .pl.first .place.num, .fbody.duo > .pl .place.num { font-size: 1.3em; }

  .fbody.empty { place-items: center; text-align: center; }
  .fbody.empty .fempty { max-width: 18ch; font: 900 clamp(28px, min(4.6vw, 8vh), 72px)/1.02 var(--display); letter-spacing: -.04em; text-transform: uppercase; text-wrap: balance; color: rgba(244, 242, 255, .9); }
  .fbody.duo { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
  .fbody.duo.one { grid-template-columns: minmax(0, 1fr); }
  /* строка не ниже своего содержимого, остаток делится поровну: тесный ряд получает больше, просторный — меньше */
  /* stack (3–4): строки поровну — каждая полоса подбирает свой кегль под свою клетку */
  .fbody.stack { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); }
  .fbody.grid { grid-template-columns: minmax(0, 1fr) repeat(2, minmax(0, .8fr)); grid-template-rows: repeat(var(--rows), minmax(min-content, 1fr)); }
  /* contain: size — плакат не раздвигает строки плиток своим содержимым (Chrome считал вклад
     растянутой на все строки карточки с запасом, и плакат переставал расти на половине высоты);
     его переполнение fitFinal видит по scrollHeight самой карточки */
  .fbody.stack > .pl.first, .fbody.grid > .pl.first { grid-column: 1; grid-row: 1 / -1; contain: size; }
  /* нечётный остаток в сетке: последняя карточка на обе колонки — вместо пустой клетки; устроена так же, как соседние */
  .fbody.grid:not(.g3) > .pl:last-child:nth-child(even) { grid-column: 2 / -1; }
  /* запасная сетка, если в две колонки не влезло даже мелким кеглем (8 мест на 720p): плитки в три колонки,
     плакат уже; хвост последнего ряда растягивает fitFinal (grid-column: span N) */
  .fbody.grid.g3 { grid-template-columns: minmax(0, .85fr) repeat(3, minmax(0, .72fr)); }

  /* низ: вывод судьи и кнопки в одну полосу. Вывод не режется: длинный — займёт больше строк,
     а карточки над ним подберут кегль под оставшуюся высоту */
  .ffoot { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; }
  /* низ растёт вместе с экраном: на FHD сводка и кнопки не выглядят мелкими под огромными карточками */
  .ffoot .btn { font-size: clamp(11.5px, min(.8vw, 1.5vh), 16px); padding: 1.1em 1.7em; }
  .ffoot .summary { flex: 1 1 420px; min-width: 0; margin: 0; padding: 12px 16px; font-size: clamp(14.5px, min(1.15vw, 2.1vh), 24px); line-height: 1.45; background: rgba(255, 255, 255, .05); border-left: 3px solid var(--c1); border-radius: 4px 16px 16px 4px; }
  .ffoot .actions { flex: none; display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }

  /* --- ChatGPT выбирает победителя: одна надпись на весь экран ---
     Раньше тут были кубик, подзаголовок и лайнапы внутри панели с overflow:auto. Кубик крутился
     (повёрнутый квадрат по диагонали шире себя), карточки при каждом новом state перерисовывались
     и «всплывали» через translateY — scrollHeight качался вокруг clientHeight, и полоса прокрутки
     то появлялась, то исчезала. Теперь прокручиваемого блока нет вовсе, надпись по размеру всегда
     влезает, а анимации — только цвет по буквам и прозрачность точек: геометрию они не меняют. */
  .judging { height: 100%; display: grid; place-items: center; text-align: center; overflow: hidden; position: relative; padding: 24px; }
  /* кегль по ширине и высоте экрана: самое длинное слово («ПОБЕДИТЕЛЯ», «ΝΙΚΗΤΗ») целиком влезает и на телефоне,
     поэтому переносов внутри слова нет (overflow-wrap: anywhere рвал «ПОБЕДИТЕЛ-Я») */
  .judging .jtext { font: 900 clamp(24px, min(6.6vw, 12.5vh), 118px)/.98 var(--display); letter-spacing: -.045em; text-transform: uppercase;
    max-width: 14ch; text-wrap: balance; color: #fff;
    filter: drop-shadow(0 20px 60px color-mix(in srgb, var(--c1) 45%, transparent)); }
  /* цветом выделено одно слово — «ChatGPT»; по нему медленно переливается палитра категории */
  .judging .brand { background: linear-gradient(100deg, var(--c1), var(--c3) 30%, var(--c2) 60%, var(--c1)); background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: jsweep 3.2s ease-in-out infinite alternate; }
  .judging .jdots { display: inline-flex; gap: .16em; margin-left: .12em; }
  .judging .jdots i { width: .16em; height: .16em; border-radius: 50%; background: var(--c1); animation: jdot 1.4s ease-in-out infinite; }
  .judging .jdots i:nth-child(2) { animation-delay: .2s; background: var(--c2); }
  .judging .jdots i:nth-child(3) { animation-delay: .4s; background: var(--c3); }
  @keyframes jsweep { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @keyframes jdot { 0%, 100% { opacity: .18; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .judging .brand, .judging .jdots i, .pl { animation: none; }
  }

  /* Имя комнаты: ведущий набирает его прямо на плакате. Поле без рамки, чтобы не выглядело
     анкетой; код под ним остаётся главным — по нему заходят. */
  .roomtitle { width: 100%; background: none; border: 0; outline: none; text-align: center; color: var(--text);
    font: 700 clamp(15px, 1.5vw, 22px)/1.2 var(--body); padding: 2px 6px 6px; border-radius: 10px; }
  .roomtitle::placeholder { color: rgba(244, 242, 255, .35); font-weight: 500; }
  .roomtitle:focus { background: rgba(255, 255, 255, .07); }
  .overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, .6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: none; place-items: center; z-index: 50; font: 900 40px var(--display); text-transform: uppercase; pointer-events: none; }
  .overlay.on { display: grid; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #ff6b6b; color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; display: none; z-index: 60; }
  .toast.on { display: block; }
  /* управление перешло на другую доску: плашка поверх всего, с кнопкой вернуть его себе */
  .hostlost { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 80; display: none; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 16px; background: #1a1822; border: 1px solid var(--c1); box-shadow: 0 20px 50px -20px #000; font-weight: 600; }
  .hostlost.on { display: flex; }
  .connecting { height: 100%; display: grid; place-items: center; color: var(--muted); font: 700 18px/1.3 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  /* Итоги на телефоне-доске: одна колонка, прокручивается страница (не панель — никакой второй полосы) */
  @media (max-width: 760px) {
    body.m-final { height: auto; min-height: 100vh; min-height: 100dvh; overflow-y: auto; }
    body.m-final .layout { height: auto; }
    body.m-final .final { height: auto; min-height: calc(100dvh - 36px); }
    body.m-final .judging { height: calc(100dvh - 36px); }
    body.m-final .fbody { display: flex; flex-direction: column; }
    body.m-final .fbody > .pl { flex: none; overflow: visible; }
    body.m-final .fbody > .pl { font-size: 15px; }
    body.m-final .fbody > .pl.first { contain: none; } /* на телефоне карточки в столбик — высота по содержимому */
    /* полоса ставок на телефоне: подпись сверху, фраза под ней во всю ширину и без обрезки
       («Кто первый?…»); min-height держит одну высоту для обычных фаз, чтобы страница не прыгала */
    body.m-game .bidbar { height: auto; min-height: 112px; flex-wrap: wrap; align-content: center; row-gap: 6px; padding: 14px 18px; }
    body.m-game .bidbar .cap { flex: 1 0 100%; }
    body.m-game .bidbar .lead { flex: 1 1 100%; display: block; -webkit-line-clamp: unset; font-size: 24px; }
    body.m-game .bidbar .tape { flex: 1 1 100%; justify-content: flex-start; }
    body.m-final .judging .jtext { font-size: min(8.4vw, 44px); }
    /* кнопки — всегда столбиком во всю ширину: в полуширинной «Ещё раз (та же категория)» шла в три строки */
    body.m-final .ffoot .actions { margin-left: 0; width: 100%; flex-direction: column; }
    body.m-final .ffoot .actions .btn { width: 100%; }
  }
  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    body.m-lobby { overflow-y: auto; height: auto; min-height: 100vh; min-height: 100dvh; }
    /* узкий экран — лобби в одну колонку и скроллится страница, а не отдельные блоки */
    .lobby { height: auto; grid-template-columns: minmax(0, 1fr); align-items: start; }
    .joincol { max-height: none; overflow: visible; }
    .setup { max-height: none; overflow: visible; }
    .setup-body { overflow: visible; min-height: auto; }
    /* на узком экране страница и так прокручивается: правила уместны, а пары — в колонку */
    .rules { display: grid; }
    .pair { grid-template-columns: minmax(0, 1fr); }
    .start { margin-top: 6px; }
    .seats { flex-direction: column; align-items: stretch; overflow: visible; }
    .seatrow { overflow: visible; }
    /* одна колонка (iPad портрет): картинка ограничена по высоте, текст лота прокручивается —
       раньше при .card{overflow:hidden} в карточке оставалась одна картинка */
    .card { overflow-y: auto; }
    .card .hero { height: min(180px, 15vh); }
    .card .hero.poster { height: min(200px, 17vh); }
    /* Торги на узкой доске: страница прокручивается целиком, карточка лота в полный рост.
       Раньше всё жалось в 100dvh: карточка получала 220px и свою прокрутку, описание не было видно. */
    body.m-game { height: auto; min-height: 100vh; min-height: 100dvh; overflow-y: auto; }
    body.m-game .layout { height: auto; }
    body.m-game .frame { flex: none; }
    body.m-game .card { height: auto; overflow: visible; }
    body.m-game .card .hero { height: min(260px, 32vh); }
    body.m-game .card .hero.poster { height: min(300px, 36vh); }
    /* высокое фото на телефоне — cover во всю ширину (фокус сверху, на лице), без тёмных полей по бокам */
    body.m-game .card .hero.poster img:not(.blur) { object-fit: cover; object-position: 50% 18%; padding: 0; filter: none; }
    body.m-game .card .hero.poster img.blur { display: none; }
    body.m-game .panel { flex: none; }
    body.m-game .players { overflow: visible; }
    /* страница длиннее экрана: фон (пятна) — на всю высоту документа, а не только первого экрана */
    body.m-game .bg, body.m-final .bg { position: absolute; }
    /* эмодзи категории не наезжает на нижний край фото */
    body.m-game .card .hero:not(.gone) + .text > .emoji { margin-top: 0; font-size: 44px; margin-bottom: 12px; }
    /* «ПРОПУСТИ-ТЬ»: слово рвалось посередине — на узкой доске кнопки мельче и слова целые */
    .hostbar .btn { overflow-wrap: normal; font-size: 10.5px; letter-spacing: .04em; padding: 12px 6px; }
