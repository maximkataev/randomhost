<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Рандомайзер команд — разделить людей на команды</title>
  <meta name="description" content="✏️ Рандомайзер команд с карандашным дизайном. Разделите список участников на 2, 3, 4 или 5 случайных команд онлайн!" data-i18n-meta="meta_desc">
  <meta name="robots" content="index,follow">

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/992/992651.png" type="image/png">

  <meta name="theme-color" content="#ffffff">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --white: #fcfcfc;
      --black: #232323; /* не глухой, ближе к карандашу */
      --gray-light: #f3f3f3;
      --gray-medium: #c7c7c7;
      --gray-dark: #777777;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 0 0, rgba(0,0,0,0.04), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(0,0,0,0.04), transparent 55%),
        var(--white);
      font-family: 'Permanent Marker', 'Bangers', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(80px + var(--safe-top)) var(--safe-right) calc(20px + var(--safe-bottom)) var(--safe-left);
      position: relative;
      overflow-x: hidden;
      color: var(--black);
    }

    /* Лист в клетку/линейку легким карандашом */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(0,0,0,0.04) 27px,
          rgba(0,0,0,0.04) 28px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 27px,
          rgba(0,0,0,0.025) 27px,
          rgba(0,0,0,0.025) 28px
        );
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 1;
    }

    /* Кнопка домой */
    .home-button {
      position: fixed;
      top: calc(20px + var(--safe-top));
      left: calc(20px + var(--safe-left));
      z-index: 1000;
      padding: 10px 22px;
      background: var(--white);
      color: var(--black);
      text-decoration: none;
      font-family: 'Bangers', cursive;
      font-size: 20px;
      border-radius: 12px;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.5),
        3px 3px 0 rgba(0,0,0,0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      letter-spacing: 1px;
      text-transform: uppercase;
      transform: rotate(-2deg);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.08) 0 1px,
          transparent 1px 3px
        );
    }

    .home-button:hover {
      transform: rotate(-2deg) translate(-2px, -2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.6),
        5px 5px 0 rgba(0,0,0,0.6);
    }

    .home-button:active {
      transform: rotate(-2deg) translate(2px, 2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.6),
        1px 1px 0 rgba(0,0,0,0.6);
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1100px;
      background: var(--white);
      padding: 40px 30px;
      border-radius: 20px;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.7),
        6px 6px 0 rgba(0,0,0,0.7);
      transform: rotate(-0.8deg);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.03) 0 2px,
          transparent 2px 4px
        );
      overflow: hidden;
    }

    /* "Кривой" контур, как от руки */
    .container::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 16px;
      border: 2px dashed rgba(0,0,0,0.3);
      transform: rotate(0.8deg);
      pointer-events: none;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 30px;
      align-items: start;
    }

    .settings-column {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .generator-column {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      min-height: 400px;
    }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: clamp(32px, 8vw, 52px);
      color: var(--black);
      text-align: center;
      margin-bottom: 30px;
      font-weight: 400;
      letter-spacing: 2px;
      position: relative;
      text-shadow:
        0 0 1px rgba(0,0,0,0.8),
        -1px 1px 0 rgba(255,255,255,0.5);
      transform: rotate(-3deg);
      grid-column: 1 / -1;
    }

    .subtitle {
      display: none;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 16px;
      font-family: 'Rubik', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      border-radius: 10px;
      background: var(--white);
      color: var(--black);
      border: 2px solid var(--black);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.3),
        3px 3px 0 rgba(0,0,0,0.4);
      transition: all 0.3s ease;
      resize: vertical;
      line-height: 1.6;
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.02) 0 2px,
          transparent 2px 4px
        );
    }

    textarea:focus {
      outline: none;
      transform: translateY(-2px) rotate(-0.5deg);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.35),
        4px 4px 0 rgba(0,0,0,0.55);
    }

    .input-group {
      background: var(--gray-light);
      padding: 20px;
      border-radius: 15px;
      position: relative;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.4),
        4px 4px 0 rgba(0,0,0,0.4);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.02) 0 2px,
          transparent 2px 4px
        );
    }

    .input-group::after {
      content: '';
      position: absolute;
      top: 5px;
      right: 5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--black);
      background:
        radial-gradient(circle at 30% 30%, rgba(0,0,0,0.15), transparent 60%),
        var(--white);
    }

    .input-label {
      display: block;
      font-size: clamp(18px, 4.5vw, 22px);
      color: var(--black);
      margin-bottom: 15px;
      font-family: 'Bangers', cursive;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .count-label {
      display: block;
      margin-top: 18px;
      margin-bottom: 10px;
      font-size: 16px;
      color: var(--gray-dark);
      font-family: 'Permanent Marker', cursive;
      text-transform: uppercase;
    }

    /* Кол-во команд — карандашные квадратики */
    .team-count {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .team-count button {
      padding: 12px 0;
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: var(--black);
      background: var(--white);
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.4),
        2px 2px 0 rgba(0,0,0,0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.03) 0 1px,
          transparent 1px 3px
        );
    }

    .team-count button:nth-child(1) { transform: rotate(-1.5deg); }
    .team-count button:nth-child(2) { transform: rotate(1deg); }
    .team-count button:nth-child(3) { transform: rotate(-0.7deg); }
    .team-count button:nth-child(4) { transform: rotate(1.4deg); }

    .team-count button:hover {
      transform: translate(-1px, -1px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.55),
        4px 4px 0 rgba(0,0,0,0.6);
    }

    .team-count button.active {
      background: var(--black);
      color: var(--white);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(255,255,255,0.14) 0 2px,
          transparent 2px 4px
        );
      transform: translate(1px, 1px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.7),
        1px 1px 0 rgba(0,0,0,0.7);
    }

    /* Кнопка генерации */
    .generate-btn {
      padding: 18px 34px;
      font-family: 'Bangers', cursive;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 400;
      color: var(--black);
      background: var(--gray-light);
      border-radius: 14px;
      cursor: pointer;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.6),
        4px 4px 0 rgba(0,0,0,0.7);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      text-transform: uppercase;
      letter-spacing: 2px;
      transform: rotate(-1deg);
      margin-top: 22px;
      width: 100%;
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.08) 0 2px,
          transparent 2px 5px
        );
    }

    .generate-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 15px,
          rgba(0,0,0,0.08) 15px 17px
        );
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .generate-btn:hover:not(:disabled)::before {
      opacity: 1;
    }

    .generate-btn:hover:not(:disabled) {
      transform: rotate(-1deg) translate(-2px, -2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.75),
        6px 6px 0 rgba(0,0,0,0.8);
    }

    .generate-btn:active:not(:disabled) {
      transform: rotate(-1deg) translate(2px, 2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.75),
        2px 2px 0 rgba(0,0,0,0.8);
    }

    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: rotate(-1deg);
    }

    /* Поле результата */
    .result-container {
      width: 100%;
      min-height: 360px;
      background: var(--white);
      border-radius: 15px;
      padding: 20px;
      position: relative;
      border: 2px dashed var(--black);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.25);
      transform: rotate(0.5deg);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.02) 0 3px,
          transparent 3px 6px
        );
    }

    .placeholder {
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--gray-dark);
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(16px, 4vw, 20px);
      line-height: 1.6;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    /* Карточка команды — как от руки */
    .team-card {
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.4),
        3px 3px 0 rgba(0,0,0,0.5);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.02) 0 2px,
          transparent 2px 4px
        );
      opacity: 0;
      animation: cardIn 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
    }

    .team-card:nth-child(odd) { transform: rotate(-0.8deg); }
    .team-card:nth-child(even) { transform: rotate(0.8deg); }

    @keyframes cardIn {
      0% { opacity: 0; transform: scale(0.6) rotate(-4deg); }
      100% { opacity: 1; }
    }

    .team-title {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      letter-spacing: 1px;
      margin-bottom: 10px;
      border-bottom: 2px solid var(--black);
      padding-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .team-size {
      font-family: 'Permanent Marker', cursive;
      font-size: 14px;
      color: var(--gray-dark);
    }

    .member {
      font-family: 'Rubik', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      font-weight: 500;
      padding: 6px 2px;
      border-bottom: 1px dashed rgba(0,0,0,0.25);
      overflow-wrap: anywhere;
    }

    .member:last-child {
      border-bottom: none;
    }

    .error-message {
      color: var(--black);
      background: var(--white);
      border-radius: 8px;
      font-size: 15px;
      margin-top: 15px;
      text-align: center;
      font-family: 'Permanent Marker', cursive;
      opacity: 0;
      transition: opacity 0.3s ease;
      border: 2px solid var(--black);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.4),
        3px 3px 0 rgba(0,0,0,0.5);
      transform: rotate(-1deg);
      padding: 8px 12px;
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.02) 0 2px,
          transparent 2px 4px
        );
    }

    .error-message.show {
      opacity: 1;
      animation: wiggle 0.5s ease;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-1deg); }
      25% { transform: rotate(-3deg); }
      75% { transform: rotate(1deg); }
    }

    /* Декоративные звездочки */
    .star-decoration {
      position: absolute;
      font-size: 22px;
      opacity: 0.22;
      pointer-events: none;
      font-family: 'Bangers', cursive;
      color: var(--black);
    }

    .star-decoration:nth-child(1) { top: 10px; right: 16px; transform: rotate(9deg); }
    .star-decoration:nth-child(2) { top: 50%; left: -6px; transform: rotate(-18deg); }
    .star-decoration:nth-child(3) { bottom: 15px; right: -4px; transform: rotate(27deg); }

    /* Карандашные декорации */
    .pencil-decoration {
      position: fixed;
      pointer-events: none;
      opacity: 0.16;
      z-index: 0;
      font-size: 72px;
      filter: grayscale(1);
      color: var(--black);
    }

    /* ===== РЯД 1 — ВЕРХНИЙ ===== */
    .pencil-1 { top: 7%; left: 9%; transform: rotate(-20deg); }
    .pencil-2 { top: 3%; left: 45%; transform: rotate(12deg); }
    .pencil-3 { top: 5%; right: 8%; transform: rotate(160deg); }

    /* ===== РЯД 2 — СРЕДНИЙ ===== */
    .pencil-4 { top: 45%; left: 10%; transform: rotate(95deg); }
    .pencil-5 { top: 50%; left: 48%; transform: rotate(-35deg); }
    .pencil-6 { top: 40%; right: 10%; transform: rotate(-10deg); }

    /* ===== РЯД 3 — НИЖНИЙ ===== */
    .pencil-7 { bottom: 20%; left: 12%; transform: rotate(110deg); }
    .pencil-8 { bottom: 4%; left: 50%; transform: rotate(270deg); }
    .pencil-9 { bottom: 5%; right: 12%; transform: rotate(10deg); }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: calc(80px + var(--safe-top)) 12px calc(20px + var(--safe-bottom)) 12px;
      }

      .home-button {
        position: absolute;
        font-size: 18px;
        padding: 8px 18px;
      }

      .container {
        padding: 28px 18px;
        transform: rotate(-0.4deg);
      }

      .main-layout {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .generator-column {
        min-height: auto;
      }

      .result-container {
        min-height: 220px;
      }

      .placeholder {
        min-height: 180px;
      }

      .pencil-decoration {
        font-size: 56px;
        opacity: 0.18;
      }

      /* часть карандашей убираем, чтобы не перегружать фон */
      .pencil-3,
      .pencil-4,
      .pencil-5,
      .pencil-6,
      .pencil-7,
      .pencil-8,
      .pencil-9 {
        display: none;
      }

      /* 👉 мобильный шрифт (iPhone fix) */
      body,
      h1,
      .input-label,
      .count-label,
      .team-count button,
      .generate-btn,
      .team-title,
      .team-size,
      .placeholder,
      .error-message,
      .home-button {
        font-family: 'Rubik', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      }
    }

    textarea {
      font-family: 'Rubik', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
    }

    @media (max-width: 360px) {
      .input-group {
        padding: 15px;
      }
    }

    @media (hover: none) {
      .generate-btn:hover {
        transform: rotate(-1deg) !important;
      }
    }
  </style>

</head>
<body>
  <a href="/" class="home-button" data-i18n="home">Главная</a>


    <!-- Карандаши и школьные штукены по фону -->
    <div class="pencil-decoration pencil-1">✎</div>
    <div class="pencil-decoration pencil-2">✍</div>
    <div class="pencil-decoration pencil-3">✏</div>
    <div class="pencil-decoration pencil-4">✎</div>
    <div class="pencil-decoration pencil-5">✐</div>
    <div class="pencil-decoration pencil-6">✲</div>
    <div class="pencil-decoration pencil-7">〰</div>
    <div class="pencil-decoration pencil-8">✏</div>
    <div class="pencil-decoration pencil-9">⌇</div>


  <div class="container">
    <div class="star-decoration">✶</div>
    <div class="star-decoration">✶</div>
    <div class="star-decoration">✶</div>

    <h1 data-i18n="h1">Рандомайзер команд</h1>

    <div class="main-layout">
      <div class="settings-column">
        <div class="input-group">
          <label class="input-label" for="namesInput" data-i18n="input_label">Участники</label>
          <textarea id="namesInput" data-i18n-attr="placeholder:input_ph" placeholder="Введите имена по строкам">Аня
Борис
Вика
Глеб
Даша
Егор
Женя
Кирилл
Лена
Максим</textarea>
          <span class="count-label" data-i18n="count_label">Сколько команд</span>
          <div class="team-count" id="teamCount">
            <button data-count="2" class="active">2</button>
            <button data-count="3">3</button>
            <button data-count="4">4</button>
            <button data-count="5">5</button>
          </div>
        </div>
        <button class="generate-btn" id="splitBtn" data-i18n="gen_btn">Разделить</button>
        <div class="error-message" id="errorMsg"></div>
      </div>

      <div class="generator-column">
        <div class="result-container" id="results" aria-live="polite">
          <div class="placeholder" data-i18n="placeholder">Команды появятся здесь.<br>Никаких капитанов, только рандом.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
  // Заглушка до загрузки i18n.js (defer)
  window.I18N = window.I18N || { t: (k) => k, lang: 'ru', setLang(){}, supported: ['ru','en','el'] };
  </script>

  <script>
    const input = document.getElementById('namesInput');
    const results = document.getElementById('results');
    const errorMsg = document.getElementById('errorMsg');
    const splitBtn = document.getElementById('splitBtn');

    let selectedCount = 2;
    let userEdited = false;
    let lastTeams = null;

    const DEFAULT_NAME_SETS = {
      ru: ['Аня', 'Борис', 'Вика', 'Глеб', 'Даша', 'Егор', 'Женя', 'Кирилл', 'Лена', 'Максим'],
      en: ['Anna', 'Boris', 'Vicky', 'Gleb', 'Dasha', 'Egor', 'Jane', 'Kirill', 'Lena', 'Max'],
      el: ['Άννα', 'Μπόρις', 'Βίκυ', 'Γκλεμπ', 'Ντάσα', 'Έγκορ', 'Τζένη', 'Κύριλλος', 'Λένα', 'Μαξ']
    };

    input.addEventListener('input', () => { userEdited = true; });

    document.querySelectorAll('#teamCount button').forEach(button => {
      button.addEventListener('click', () => {
        selectedCount = Number(button.dataset.count);
        document.querySelectorAll('#teamCount button').forEach(item => item.classList.toggle('active', item === button));
      });
    });

    function parseNames() {
      return input.value.split(/\n|,|;/).map(name => name.trim()).filter(Boolean);
    }

    function shuffle(items) {
      const arr = [...items];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.add('show');
      setTimeout(() => {
        errorMsg.classList.remove('show');
      }, 3000);
    }

    function renderTeams(teams) {
      results.innerHTML = '<div class="teams-grid"></div>';
      const grid = results.querySelector('.teams-grid');
      teams.forEach((team, index) => {
        const card = document.createElement('div');
        card.className = 'team-card';
        card.style.animationDelay = (index * 0.08) + 's';
        const title = document.createElement('div');
        title.className = 'team-title';
        title.innerHTML = '<span></span><span class="team-size"></span>';
        title.querySelector('span').textContent = I18N.t('team_title').replace('{n}', index + 1);
        title.querySelector('.team-size').textContent = team.length;
        card.appendChild(title);
        team.forEach(name => {
          const member = document.createElement('div');
          member.className = 'member';
          member.textContent = name;
          card.appendChild(member);
        });
        grid.appendChild(card);
      });
    }

    splitBtn.addEventListener('click', () => {
      const names = shuffle(parseNames());
      if (names.length < selectedCount) {
        showError(I18N.t('err_few'));
        return;
      }
      const teams = Array.from({ length: selectedCount }, () => []);
      names.forEach((name, index) => teams[index % selectedCount].push(name));
      lastTeams = teams;
      renderTeams(teams);
    });

    window.addEventListener('langchange', () => {
      // локализуем дефолтный список, только если пользователь его не трогал
      if (!userEdited) {
        const current = parseNames().join('|');
        const isDefault = Object.values(DEFAULT_NAME_SETS).some(set => set.join('|') === current);
        if (isDefault) input.value = DEFAULT_NAME_SETS[I18N.lang].join('\n');
      }
      if (lastTeams) renderTeams(lastTeams);
    });
  </script>
