<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#121f16">

<meta name="robots" content="index,follow">
<meta name="description" content="🗣️ Мультиплеерная игра для компании: все отвечают одним словом на тему, а потом вслепую угадывают, что ответило больше всех и что ответил только один человек. Бесплатно, в браузере, с телефонов." data-i18n-meta="_meta">

<meta property="og:title" content="Сто к одному — игра для компании">
<meta property="og:description" content="Все отвечают одним словом, потом угадывают самый популярный и самый редкий ответ. Бесплатно, в браузере, с телефонов.">
<meta property="og:url" content="https://randomhost.online/oneword.html">
<meta property="og:image" content="https://randomhost.online/og-image.png">
<meta property="og:site_name" content="Рандомайзер Онлайн">
<meta property="og:locale" content="ru_RU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400..800&family=Roboto+Condensed:wght@500..800&display=swap">
<link rel="stylesheet" href="oneword-theme.css">
<style>
  /* oneword, телефон — лёгкое эхо доски мела: тот же грифельно-зелёный, поле ответа как линия для письма
     мелом, на раскрытии — две мини-считалки своих угадываний. Токены и компонент .tslot — oneword-theme.css. */
  :root {
    --lang-switch-bg: var(--frame-ink); --lang-switch-border: rgba(242, 239, 226, .4); --lang-switch-fg: var(--chalk);
    --lang-switch-active-bg: var(--chalk); --lang-switch-active-fg: var(--ink); --lang-switch-active-border: var(--chalk);
    --lang-switch-font: var(--body);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--text); font: 500 16px/1.35 var(--body); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; opacity: .5; }
  :focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }

  /* шапка — деревянная планка цвета рамки доски (не золотая плита); меловые буквы */
  .util { display: flex; align-items: center; gap: 8px; height: calc(var(--lsc, 30px) * 2 + 10px); padding: 8px calc(var(--lsw, 150px)) 0 12px; position: relative; z-index: 3; background-color: var(--frame); background-image: var(--noise); background-size: 140px 140px; border-bottom: 4px solid var(--frame-ink); }
  .util a { position: relative; color: var(--chalk); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap; flex: none; height: 44px; min-width: 44px; padding: 0 16px; border: 2px solid rgba(242, 239, 226, .7); border-radius: var(--r); background: transparent; display: inline-flex; align-items: center; justify-content: center; }
  @media (max-width: 400px) { .util a { font-size: 0; padding: 0; width: 44px; } .util a::before { content: "←"; font-size: 22px; } }
  .sound-toggle-btn { position: relative; flex: none; margin: 0; width: 44px; height: 44px; border: 2px solid rgba(242, 239, 226, .7); border-radius: var(--r); background: transparent; color: var(--chalk); font-size: 16px; display: grid; place-items: center; padding: 0; }
  .conn { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); z-index: 30; background: var(--chalk); color: var(--ink); font-weight: 800; font-size: 14px; padding: 8px 14px; border-radius: var(--r); visibility: hidden; white-space: nowrap; }
  .conn.on { visibility: visible; }
  .langhint { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 31; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; background: var(--chalk); color: var(--ink); border-radius: var(--r); font-weight: 800; font-size: 15px; }
  .langhint[hidden] { display: none; }
  .langhint span { flex: 1 1 160px; min-width: 0; }
  .langhint button { min-height: 44px; min-width: 44px; padding: 0 14px; border: 2px solid var(--ink); border-radius: var(--r); background: transparent; color: var(--ink); font-weight: 800; font-size: 15px; }
  .langhint button.yes { background: var(--ink); color: var(--chalk); }

  #app { position: relative; z-index: 2; max-width: 520px; margin: 0 auto; padding: 2px 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; min-height: calc(100dvh - var(--lsc, 30px) * 2 - 10px); }
  #app > * { min-width: 0; }
  #app.mid { justify-content: center; }
  #app.fit { height: calc(100dvh - var(--lsc, 30px) * 2 - 10px); min-height: 0; overflow: hidden; }

  h1, h2 { margin: 0; font-family: var(--display); font-weight: 800; line-height: 1.12; letter-spacing: 0; }
  .lede { font-size: 16px; font-weight: 500; margin: 0; color: var(--muted); }
  .fine { font-size: 14px; font-weight: 500; margin: 0; color: var(--muted); }
  .center { text-align: center; }
  .eyebrow { font: 800 12px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }

  .meta { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 800 12px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: -2px; }
  .meta b { font: 700 22px/1 var(--display); letter-spacing: 0; font-variant-numeric: tabular-nums; min-width: 2.4ch; text-align: right; display: inline-block; color: var(--text); }
  .meta > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timer { flex: none; height: 10px; background: var(--board2); border: 2px solid var(--line); position: relative; overflow: hidden; border-radius: var(--r); }
  .timer i { position: absolute; inset: 0; background: var(--chalk); transform-origin: left; }
  .timer.hot i { background: var(--hot); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .5; } }

  /* тема раунда — та же деревянная рамка доски, что и у доски: сцена читается как один и тот же
     предмет на любом экране, не просто тёмная карточка с цветной полоской сверху */
  .q { flex: none; padding: 14px 14px 15px; font: 700 clamp(16px, 5.1vw, 23px)/1.25 var(--display); letter-spacing: 0; overflow-wrap: anywhere; text-wrap: balance; text-align: left; }
  .q.cabinet { border-width: 3px; border-bottom-width: 6px; }
  /* подсказка — сплошная меловая плита, не просто цветной текст (жалоба владельца: "цвета простые") */
  .prompt { --pc: var(--chalk); flex: none; display: inline-block; width: fit-content; max-width: 100%; border: 2px solid var(--pc); color: var(--pc); font: 700 14px/1.25 var(--display); padding: 4px 10px 5px; border-radius: var(--r); }
  .prompt.guessPopular { --pc: var(--chalk-yellow); }
  .prompt.guessRare { --pc: var(--chalk-blue); }

  .fld { display: grid; gap: 6px; }
  .fld > span { font: 800 12px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  input.field { width: 100%; border: 0; border-bottom: 3px solid var(--chalk); border-radius: 0; background: var(--board2); color: var(--text); font: 700 22px/1.2 var(--body); padding: 14px 14px; outline: none; }
  input.field::placeholder { color: rgba(236, 231, 215, .4); font-weight: 600; }
  input.field:focus { background: var(--board); border-bottom-color: var(--a); }
  input.field.code { text-transform: uppercase; letter-spacing: .1em; }
  /* поле ответа — линия для письма мелом: пунктирное подчёркивание на доске, а не просто текстовое поле */
  input.field.word { text-align: center; font-size: 25px; font-family: var(--display); text-transform: lowercase; letter-spacing: .01em; background: var(--board); border: 0; border-bottom: 3px dashed var(--chalk); color: var(--chalk); border-radius: 0; }
  input.field.word:focus { background: var(--board2); border-bottom-color: var(--a); border-bottom-style: solid; color: var(--text); }
  .fld.cnt-on { position: relative; }
  .fld.cnt-on input.field { padding-right: 58px; }
  .fld .cnt { position: absolute; right: 12px; bottom: 15px; font: 800 12px/1 var(--body); letter-spacing: .06em; color: var(--muted); pointer-events: none; }
  .fld .cnt[data-state="full"] { color: var(--bad); }
  .hint1 { flex: none; min-height: 16px; margin: -4px 0 -2px; font: 700 13px/1.2 var(--body); color: var(--chalk-yellow); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .err { min-height: 18px; margin: -6px 0; font-weight: 800; font-size: 14px; color: var(--bad); }
  .or { display: flex; align-items: center; gap: 12px; font: 800 12px/1 var(--body); text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }
  .or::before, .or::after { content: ""; flex: 1; height: 2px; background: var(--line); }

  .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; border: 0; border-radius: var(--r); background: var(--chalk); color: var(--ink); font: 700 clamp(16px, 4.6vw, 20px)/1.1 var(--display); letter-spacing: 0; padding: 12px; text-align: center; text-decoration: none; transition: transform .08s, opacity .15s; }
  .btn:active:not(:disabled) { transform: translateY(2px); }
  .btn.ghost { background: transparent; color: var(--text); border: 2px solid var(--chalk); font-size: clamp(14px, 4vw, 16px); }
  .link { background: none; border: 0; min-height: 44px; padding: 8px 12px; font-weight: 700; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; display: block; margin: 0 auto; }
  .link.leave { position: sticky; bottom: 0; z-index: 4; background: var(--board); width: 100%; margin-top: auto; }

  .note { flex: 1 1 auto; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 10px; text-align: left; background: var(--board2); border-top: 6px solid var(--chalk); padding: 20px 16px; }
  .note h2 { font-size: clamp(20px, 6.4vw, 28px); }
  #app.mid .note, .note .btn { align-self: stretch; }
  .claimbtns { display: grid; gap: 10px; align-self: stretch; margin-top: 6px; }
  .signcode { align-self: stretch; font: 900 clamp(26px, 10vw, 40px)/1 var(--body); letter-spacing: .04em; padding: 12px 14px; background: var(--chalk); color: var(--ink); max-width: 100%; white-space: nowrap; overflow: hidden; text-align: left; font-variant-numeric: tabular-nums; }

  .enter { display: flex; flex-direction: column; gap: 14px; }
  .enter-h { display: grid; gap: 8px; padding-top: 6px; }
  .enter-h .gname { font: 800 13px/1 var(--body); text-transform: uppercase; letter-spacing: .16em; color: var(--a); }
  .enter-h h1 { font-family: var(--display); font-weight: 700; letter-spacing: 0; font-size: clamp(26px, 9vw, 42px); line-height: 1.12; }
  ol.rules { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 0; counter-reset: r; border-top: 2px solid var(--line); }
  ol.rules li { counter-increment: r; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; padding: 11px 0; border-bottom: 2px solid var(--line); font: 500 14px/1.3 var(--body); color: var(--muted); }
  ol.rules li::before { content: counter(r); font: 900 24px/.9 var(--body); color: var(--a); }

  .me-badge { display: flex; align-items: center; gap: 12px; background: var(--board2); border-left: 6px solid var(--pc, var(--chalk)); padding: 10px 14px; }
  .av { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--board); border: 3px solid var(--pc, var(--line)); display: grid; place-items: center; font-size: 22px; font-style: normal; line-height: 1; }
  .me-badge b { font: 800 18px/1.15 var(--body); overflow-wrap: anywhere; min-width: 0; }
  .avbtn { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; font: inherit; color: inherit; line-height: 0; flex: none; display: grid; place-items: center; min-width: 44px; min-height: 44px; margin: -1px; }
  .avpick { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .avpick button { aspect-ratio: 1; border: 0; border-radius: var(--r); background: var(--board2); font-size: 22px; line-height: 1; padding: 0; cursor: pointer; }
  .avpick button.on { box-shadow: 0 0 0 3px var(--chalk); }
  .avpick button:disabled { opacity: .3; cursor: default; }
  @media (max-width: 360px) { .avpick { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; list-style: none; margin: 0; padding: 0; }
  .plist li { display: flex; align-items: center; gap: 8px; background: var(--board2); border-left: 5px solid var(--pc, var(--line)); padding: 5px 8px; font: 700 13px/1.1 var(--body); min-width: 0; }
  .plist li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .av { width: 26px; height: 26px; font-size: 14px; }
  .plist li.me { background: var(--chalk); color: var(--ink); }
  .plist li.off { opacity: .5; }
  .lobcode .signcode { letter-spacing: .02em; }
  .roster { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; background: var(--board2); border-top: 6px solid var(--chalk); padding: 14px; min-height: 0; }
  .roster-h { display: flex; justify-content: space-between; align-items: baseline; font: 800 12px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .roster-h b { font: 900 18px/1 var(--body); letter-spacing: 0; color: var(--text); }

  .waitbox { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; background: var(--board2); border-top: 4px solid var(--line); padding: 12px; }
  .waith { display: flex; align-items: center; gap: 8px; font: 800 15px/1.1 var(--body); }
  .pulse { width: 10px; height: 10px; background: var(--a); border-radius: 50%; animation: pulse 1.2s steps(2) infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  .mywordbox { flex: none; display: flex; flex-direction: column; gap: 4px; background: var(--board2); border-left: 6px solid var(--chalk); padding: 10px 14px; }
  .mywordbox b { font: 700 22px/1.15 var(--display); overflow-wrap: anywhere; }

  /* списки результатов упругие: на коротком экране (320×460, 12 игроков) строки сжимаются, а если и так не лезет —
     прокручивается сам список, но не страница. Высоту #app при этом держит .fit (экраны со списками). */
  .bars { flex: 1 1 0; min-height: 56px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
  .bars > .barrow { flex: 1 1 0; min-height: 30px; max-height: 60px; align-items: stretch; }
  .barrow .n { align-self: center; }
  .barrow { display: grid; grid-template-columns: minmax(0, 1fr) 2.6em; align-items: center; gap: 8px; }
  .barrow .lbl { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; background: var(--board); padding: 7px 10px; border-left: 5px solid var(--line); font: 700 15px/1.2 var(--display); overflow: hidden; }
  .barrow .lbl i.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--board2); }
  .barrow .lbl span { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .barrow[hidden] { display: none; }
  .barrow .n { text-align: right; font: 700 20px/1 var(--display); font-variant-numeric: tabular-nums; }
  .barrow.more .lbl { background: transparent; border-left-color: transparent; color: var(--muted); font-size: 14px; justify-content: center; }
  .gain { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .gainrow { display: flex; align-items: center; gap: 12px; background: var(--board2); border-left: 6px solid var(--a); padding: 8px 12px; }
  .gainrow.rare { border-left-color: var(--b); }
  .gainrow .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .gainrow b { font: 700 24px/1 var(--display); font-variant-numeric: tabular-nums; }
  .gainrow span { font: 700 13px/1.2 var(--body); color: var(--muted); }
  .gainrow .tslot { --sw: 72px; --sh: 56px; --stw: 40px; --sth: 18px; --sword: 11px; --scount: 12px; flex: none; }
  .gainrow b { opacity: 0; transition: opacity .2s; }
  .gainrow.show b { opacity: 1; }
  .segdots { margin-top: 2px; }

  .standings { flex: 1 1 0; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .standings li { flex: 1 1 44px; max-height: 60px; min-height: 22px; overflow: hidden; display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--board2); font: 700 15px/1.1 var(--display); }
  .standings li.me { background: var(--chalk); color: var(--ink); }
  .standings li.me .rk { color: var(--ink); }
  .standings .rk { position: relative; align-self: stretch; display: grid; place-items: center; width: 24px; flex: none; text-align: center; font: 700 14px/1 var(--display); color: var(--muted); }
  .standings .rk svg { position: absolute; left: 50%; top: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px; }
  #app.tight .standings .rk svg { width: 25px; height: 25px; margin: -12px 0 0 -12px; }
  .standings li.win .rk { color: var(--chalk); }
  .standings li.me.win .rk { color: var(--ink); }
  .standings li.me .chalk-ul path { stroke: var(--ink); }
  .nmw { position: relative; flex: 0 1 auto; min-width: 0; }
  .standings .sp { flex: 1 1 0; min-width: 0; }
  .standings .nmw svg.chalk-ul { position: absolute; left: -2%; width: 104%; bottom: -3px; height: 6px; }
  .standings .av { width: 30px; height: 30px; font-size: 17px; border-width: 2px; }
  .standings .nm { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .standings b { font: 700 17px/1 var(--display); font-variant-numeric: tabular-nums; }
  .finhead { flex: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding-bottom: 4px; border-bottom: 2px dashed var(--line); }
  .finhead h2 { font-size: clamp(22px, 7vw, 30px); }
  .finhead p { margin: 0; }
  /* больше 8 игроков: строки плотнее на любом экране, чтобы аватары не обрезались при сжатии */
  #app.tight .standings li { gap: 8px; padding: 2px 8px; flex-basis: 34px; min-height: 22px; }
  #app.tight .standings .av { width: 22px; height: 22px; font-size: 12px; border-width: 2px; }
  #app.tight .standings .rk { width: 18px; }
  .awards { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 8px; }
  .tag { background: transparent; color: var(--text); border: 2px solid var(--line); border-radius: var(--r); padding: 3px 9px; font: 800 13px/1.2 var(--body); }

  @media (max-height: 520px) {
    #app { gap: 6px; }
    .q { padding: 7px 10px; }
    .btn { min-height: 50px; }
    input.field { padding: 10px 12px; }
    .enter { gap: 6px; }
    .enter-h h1 { font-size: 22px; }
    .enter-h .gname { display: none; }
    ol.rules li { font-size: 12.5px; padding: 5px 0; } ol.rules li::before { font-size: 20px; }
    .util { height: 40px; padding-top: 2px; }
    .util a, .sound-toggle-btn { height: 34px; }
    .util a::after, .sound-toggle-btn::after { content: ""; position: absolute; inset: -5px; }
    #app { min-height: calc(100dvh - 40px); padding-top: 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
    #app.fit { height: calc(100dvh - 40px); min-height: 0; }
    .me-badge { padding: 6px 10px; gap: 8px; }
    .me-badge .av { width: 34px; height: 34px; font-size: 18px; }
    .me-badge b { font-size: 15px; }
    .note.lobcode { padding: 8px 12px; gap: 3px; }
    .lobcode .signcode { font-size: clamp(22px, 8vw, 30px); padding: 6px 10px; }
    .lobcode h2 { font-size: 16px; }
    .roster { padding: 8px 10px; gap: 6px; }
    .roster .plist li { padding: 3px 6px; }
    .roster .av { width: 24px; height: 24px; font-size: 13px; }
    .link.leave { min-height: 36px; padding: 4px; }
    ol.rules { display: none; }
    .note { padding: 10px 12px; gap: 6px; }
    .note h2 { font-size: 18px; }
    .awards { gap: 4px; }
    .tag { font-size: 11px; padding: 2px 6px; }
    .standings li { padding: 3px 8px; font-size: 13px; }
    .standings li { gap: 8px; padding: 2px 8px; flex-basis: 34px; min-height: 20px; }
    .standings .rk { width: 18px; }
    .standings .av { width: 20px; height: 20px; font-size: 11px; }
    #app.tight .awards, .finish-sub { display: none; }
    .note .lede { font-size: 14px; line-height: 1.2; }
    .awards { flex-direction: column; flex-wrap: nowrap; gap: 3px; }
    .awards .tag { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lobcode .eyebrow, .avhint, .lobcode h2 { display: none; }
    .plist { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; min-height: 0; overflow-y: auto; }
    .roster .plist li { padding: 1px 6px; }
    .roster { padding: 6px 10px; gap: 4px; }

<script>
"use strict";

// ---------- мелкие помощники (аналог crowd-shared.js, свои пути /oneword/) ----------
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function T(key) { if (window.I18N && I18N.t) return I18N.t(key); const d = (window.I18N_DICT || {}).ru || {}; return key in d ? d[key] : key; }
function tpl(key, vars) { return String(T(key)).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? String(vars[k]) : m)); }
function wvLang() { return (window.I18N && window.I18N.lang) || "ru"; }

// ---------- звуки: тот же беcфайловый синтез, что в crowd-shared.js/wave-shared.js (sound-toggle.js глушит общий выход) ----------
const wvSfx = (function () {
  let ctx = null, noise = null;
  function ac() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume().catch(() => {}); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { return null; }
    noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 2), ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }
  ["pointerdown", "keydown"].forEach((t) => window.addEventListener(t, () => ac(), { passive: true, capture: true }));
  function env(g, t, a, d, v) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(f0, f1, at, dur, type, vol) {
    const c = ac(); if (!c || c.state !== "running") return;
    const t = c.currentTime + at;
    const o = c.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); o.connect(g); g.connect(c.destination); env(g, t, 0.004, dur, vol);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function hiss(at, dur, vol, type, f, q, attack) {
    const c = ac(); if (!c || c.state !== "running" || !noise) return;
    const t = c.currentTime + at;
    const s = c.createBufferSource(); s.buffer = noise;
    const fl = c.createBiquadFilter(); fl.type = type || "bandpass"; fl.frequency.value = f || 2500; fl.Q.value = q || 1.2;
    const g = c.createGain(); s.connect(fl); fl.connect(g); g.connect(c.destination); env(g, t, attack || 0.002, dur, vol);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  return {
    tap() { tone(700, 900, 0, 0.03, "triangle", 0.08); },
    // «Зафиксировать»: тот же щелчок замка, что у «Готово» в crowd
    lock() { tone(180, 90, 0, 0.09, "square", 0.16); hiss(0, 0.05, 0.3, "highpass", 4000, 0.7, 0.001); },
    // начало темы/новой фазы — короткий аккорд
    chord() { [392, 494, 587].forEach((f, i) => tone(f, f, i * 0.04, 0.4, "triangle", 0.1)); },
    // раскрытие кластеров
    pop() { tone(300, 900, 0, 0.14, "triangle", 0.2); tone(900, 450, 0.12, 0.24, "triangle", 0.14); hiss(0.1, 0.25, 0.15, "highpass", 5000, 0.7, 0.01); },
    // свой guess принёс очки
    win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, i * 0.07, 0.2, "triangle", 0.16)); },
    // свой guess не попал ни в один кластер
    womp() { tone(330, 300, 0, 0.2, "sawtooth", 0.1); tone(250, 170, 0.22, 0.45, "sawtooth", 0.12); },
    fanfare() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, f, i * 0.1, 0.18, "triangle", 0.16)); },
    chalktick(hot) { tone(hot ? 1500 : 1200, hot ? 1400 : 1100, 0, 0.03, "square", hot ? 0.06 : 0.035); },
    // короткий стук мелка по доске — своя считалка дорисована (своё эхо, как на доске)
    draw() { tone(2200, 1500, 0, 0.025, "square", 0.045); },
  };
})();

const params = new URLSearchParams(location.search);
const cleanCode = (s) => String(s || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 12);
const CODE = cleanCode(params.get("r"));
const app = document.getElementById("app");
const tokenKey = () => "oneword-token-" + CODE;

// ---------- транспорт: WebSocket, запасной путь — long-polling (как crowd-shared.js, свои пути) ----------
let wsBroken = false;
function openTransport({ code, onMessage, onClose, onOpen, onSendFail, onGone, onQuiet }) {
  const proto = location.protocol === "https:" ? "wss" : "ws";

  const stopBeat = () => { if (beat) { clearInterval(beat); beat = null; } if (mpConn) { mpConn.stop(); mpConn = null; } };
  const fireClose = () => {
    if (closed) return;
    stopBeat(); closed = true;
    try { if (ws) ws.close(); } catch (e) {}
    try { if (pollAbort) pollAbort.abort(); } catch (e) {}
    sid = null;
    if (onClose) onClose();
  };
  const ping = () => api.send({ type: "ping", c: Date.now() });
  const deliver = (m) => {
    if (closed) return;
    if (m && m.type === "hello" && window.MP && MP.applyHello) MP.applyHello(m);
    if (mpConn) mpConn.seen(Date.now());
    if (m && (m.type === "state" || m.type === "hello") && m.state) inGame = !!m.state.phase && m.state.phase !== "lobby" && m.state.phase !== "finished";
    onMessage(m);
  };
  const startBeat = () => {
    stopBeat();
    ping();
    if (window.MP && typeof MP.conn === "function" && !MP.off) {
      mpConn = MP.conn({
        ping: () => { if (!closed) ping(); },
        inGame: () => inGame,
        onOffline: () => { if (onQuiet) onQuiet(true); },
        onOnline: () => { if (onQuiet) onQuiet(false); },
        onDead: () => fireClose(),
      });
      mpConn.start();
      return;
    }
    beat = setInterval(ping, 8000);
  };
  const api = {
    send(msg, attempt) {
      if (closed) { if (onSendFail && msg && msg.type !== "ping") onSendFail(msg); return; }
      if (ws && ws.readyState === 1) return ws.send(JSON.stringify(msg));
      if (!sid) { if (onSendFail && msg && msg.type !== "ping") onSendFail(msg); return; }
      const tries = attempt || 0;
      fetch("/oneword/api/msg", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sid, msg }) })
        .then((r) => { if (r.ok || r.status === 410) return; if (tries < 2) setTimeout(() => api.send(msg, tries + 1), 400 * (tries + 1)); else if (onSendFail) onSendFail(msg); })
        .catch(() => { if (tries < 2) setTimeout(() => api.send(msg, tries + 1), 400 * (tries + 1)); else if (onSendFail) onSendFail(msg); });
    },
    close() { closed = true; stopBeat(); try { if (ws) ws.close(); } catch (e) {} try { if (pollAbort) pollAbort.abort(); } catch (e) {} sid = null; },
    visible() { if (mpConn) mpConn.visible(Date.now()); },
    probe(ms) { if (closed || !opened) return; ping(); },
    get mode() { if (closed) return "none"; if (ws && ws.readyState === 1) return "ws"; if (ws && ws.readyState === 0) return "connecting"; if (sid) return "poll"; if (polling) return "connecting"; return "none"; },
  };
  const timedFetch = (url, ms) => {
    const ctl = typeof AbortController === "function" ? new AbortController() : null;
    pollAbort = ctl;
    const t = ctl ? setTimeout(() => ctl.abort(), ms) : null;
    return fetch(url, ctl ? { signal: ctl.signal } : undefined).finally(() => clearTimeout(t));
  };
  async function startPolling() {
    if (closed || polling) return;
    polling = true;
    try {
      const res = await timedFetch(`/oneword/api/session?r=${encodeURIComponent(code)}`, 15000);
      if (res.status === 404 && onGone) { closed = true; stopBeat(); polling = false; onGone(); return; }
      if (!res.ok) throw new Error("session " + res.status);
      const data = await res.json();
      if (closed) return;
      sid = data.sid; opened = true; startBeat(); if (onOpen) onOpen();
      for (const m of data.messages) deliver(m);
      while (!closed && sid) {
        const r = await timedFetch(`/oneword/api/poll?sid=${sid}`, 28000);
        if (r.status === 410) throw new Error("session gone");
        if (!r.ok) { await new Promise((z) => setTimeout(z, 1500)); continue; }
        const body = await r.json();
        for (const m of body.messages) deliver(m);
      }
    } catch (e) { if (!closed) { sid = null; polling = false; fireClose(); } }
  }
  if (wsBroken || typeof WebSocket !== "function") { startPolling(); return api; }
  try {
    ws = new WebSocket(`${proto}://${location.host}/oneword/ws?r=${encodeURIComponent(code)}`);
    const handshake = setTimeout(() => {
      if (closed || opened || !ws || ws.readyState !== 0) return;
      wsBroken = true;
      const dead = ws; ws = null;
      dead.onclose = dead.onmessage = dead.onopen = null;
      try { dead.close(); } catch (e) {}
      startPolling();
    }, 5000);
    ws.onopen = () => { clearTimeout(handshake); opened = true; startBeat(); if (onOpen) onOpen(); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } deliver(m); };
    ws.onclose = () => { clearTimeout(handshake); if (closed) return; if (!opened) { ws = null; startPolling(); } else fireClose(); };
    ws.onerror = () => {};
  } catch (e) { startPolling(); }
  return api;
}

// Слово на фазе ответа/угадывания не должно тихо пропадать, если сокет оборвался между нажатием «Зафиксировать»
// и доставкой (roulette/crowd/fibs/bomb — тот же приём): действие ждёт в очереди MP.sendQueue и уходит, как только
// связь и фаза снова совпадают. Без общего каркаса (mp-off) — очереди нет, как и раньше: без связи сразу «не дошло».
const WORD_TYPES = ["answer", "guessPopular", "guessRare"];
function connect({ code, onMessage, onOpen, onGone, onState, onQuiet, keep, onDrop }) {
  let t = null, delay = 500, stopped = false;
  const queue = window.MP && MP.sendQueue ? MP.sendQueue({
    send: (m) => { if (holder.api) holder.api.send(m); },
    keep,
    onDrop: (m, why, at) => { if (onDrop) onDrop(m, why, at); },
    ceilingMs: { "*": 90000 },
    replace: WORD_TYPES, // новое слово той же фазы заменяет прежнее в очереди, а не копится рядом
    max: 8,
    minGapMs: 250,
    probe: (ms) => { if (holder.api) holder.api.probe(ms); },
  }) : null;
  const queueable = (m) => m && WORD_TYPES.indexOf(m.type) !== -1;
  const enqueue = (m) => {
    if (queue) return queue.push(m);
    if (onDrop) onDrop(m, "off", Date.now());
    return false;
  };
  const holder = {
    api: null,
    queue,
    send(m) {
      const a = holder.api;
      if (queueable(m) && (!a || a.mode === "none" || a.mode === "connecting" || (queue && queue.isFlushing()))) {
        enqueue(m);
        return;
      }
      if (a) a.send(m);
    },
    flush(keepNow, dropNow) { if (queue) queue.flush(keepNow, dropNow); },
    stop() { stopped = true; clearTimeout(t); if (queue) queue.clear(); if (holder.api) holder.api.close(); },
  };
  const open = () => {
    if (stopped) return;
    if (onState) onState("connecting");
    holder.api = openTransport({
      code,
      onMessage: (m) => { if (queue) queue.heard(); onMessage(m); },
      onQuiet,
      onSendFail: (m) => { if (queueable(m)) enqueue(m); },
      onOpen: () => { delay = 500; if (onState) onState("open"); if (onOpen) onOpen(); },
      onClose: () => { if (stopped) return; if (onState) onState("lost"); t = setTimeout(open, delay); delay = Math.min(delay * 2, 8000); },
      onGone: () => { stopped = true; if (onGone) onGone(); },
    });
  };
  open();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && holder.api) { holder.api.visible(); holder.api.probe(); } });
  window.addEventListener("online", () => { if (holder.api) holder.api.probe(); });
  return holder;
}

// ---------- таймер ----------
function nowServer() { return (state && state.serverNow) || Date.now(); }
function secsLeft() {
  if (!state || state.phaseEnd == null) return null;
  return Math.max(0, (state.phaseEnd - nowServer()) / 1000);
}
function timerHtml() {
  return `<div class="timer" id="timer"><i></i></div>`;
}
function patchTimer() {
  const bar = document.getElementById("timer");
  if (!bar || !state || state.phaseStart == null || state.phaseEnd == null) return;
  const total = Math.max(1, state.phaseEnd - state.phaseStart);
  const left = Math.max(0, state.phaseEnd - nowServer());
  const frac = Math.max(0, Math.min(1, left / total));
  const i = bar.querySelector("i");
  if (i) i.style.transform = "scaleX(" + frac + ")";
  bar.classList.toggle("hot", left < 5000);
}
setInterval(() => { patchTimer(); const m = document.getElementById("tsec"); if (m && state) { const s = secsLeft(); if (s != null) m.textContent = tpl("sec", { s: Math.ceil(s) }); } }, 250);

// ---------- фазы ответа/угадывания ----------
const PROMPT_KEY = { answer: "prompt_answer", guessPopular: "prompt_popular", guessRare: "prompt_rare" };
function kindOf(phase) { return phase === "answer" ? "answer" : phase === "guessPopular" ? "guessPopular" : "guessRare"; }
function renderWordPhase() {
  const r = state.round, me2 = state.me, kind = kindOf(state.phase);
  const play = me2.inRound;
  const confirmedField = kind + "Confirmed";
  const confirmed = play && me2[confirmedField];
  const mode = !play ? "late" : confirmed ? "wait" : "play";
  const key = `${kind}:${r.num}:${mode}`;
  let html = `<div class="meta"><span>${escapeHtml(tpl("topic_of", { n: r.num, m: state.total }))}</span><b id="tsec"></b></div>${timerHtml()}
    <h2 class="q cabinet">${escapeHtml(r.topic.topic)}</h2>
    <div class="prompt ${kind}">${escapeHtml(T(PROMPT_KEY[kind]))}</div>`;
  if (mode === "late") {
    html += `<div class="note"><h2>${escapeHtml(T("late_title"))}</h2><p class="lede">${escapeHtml(T("late_sub"))}</p></div>`;
  } else if (mode === "wait") {
    html += `<div class="waitbox"><div class="waith"><span class="pulse"></span><span>${escapeHtml(T("locked_wait"))}</span></div><div class="fine" id="waitcnt"></div><div class="segdots" id="waitdots" aria-hidden="true"></div></div>`;
  } else {
    html += `<label class="fld"><input class="field word" id="word" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${escapeHtml(T("word_ph"))}" enterkeyhint="done"></label>
      <div class="hint1" id="w1" aria-live="polite"></div>
      <button class="btn" id="lockbtn" type="button" disabled>${escapeHtml(T("btn_lock"))}</button>`;
  }
  const fresh = show(html, key);
  if (fresh && mode === "play") bindWord(kind);
  // новая тема раунда — короткий аккорд, как «Как один!» в crowd (только на самой первой фазе раунда)
  if (fresh && kind === "answer") wvSfx.chord();
  patchWordPhase(mode);
  if (fresh) patchTimer();
}
// слово должно содержать хоть одну букву/цифру/эмодзи — то же, что нормализация на сервере (game.js normalizeWord)
const WORD_OK = /[\p{L}\p{N}\p{Extended_Pictographic}]/u;
function bindWord(kind) {
  const input = document.getElementById("word");
  const btn = document.getElementById("lockbtn");
  input.value = wordInput;
  const hint = document.getElementById("w1");
  const update = () => {
    // одно слово (§4): лишние пробелы схлопываем, уходит первое слово. Пока игрок набирает второе слово, говорим, что именно
    // уйдёт (хвостовой пробел после автодополнения клавиатуры — не второе слово, молчим). Только знаки/пусто — «Готово» неактивна.
    let v = input.value.replace(/\s+/g, " ");
    if (v !== input.value) input.value = v;
    const parts = input.value.trim().split(/\s+/);
    wordInput = parts[0] || "";
    btn.disabled = !WORD_OK.test(wordInput);
    if (hint) hint.textContent = parts.length > 1 && parts[1] ? tpl("one_word", { w: wordInput }) : "";
  };
  input.addEventListener("input", update);
  input.focus();
  update();
  btn.onclick = () => {
    const w = Array.from(input.value.trim().split(/\s+/)[0] || "").slice(0, 24).join("");
    if (!WORD_OK.test(w)) return;
    wvSfx.lock();
    conn.send({ type: kind, word: w });
    btn.disabled = true;
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !btn.disabled) btn.click(); });
}
function patchWordPhase(mode) {
  if (mode === "wait") {
    const r = state.round, kind = kindOf(state.phase);
    const confirmed = r.confirmed[kind] || [];
    const voters = r.voters || [];
    const el = document.getElementById("waitcnt");
    if (el) el.textContent = MP && MP.progress ? MP.progress.text(confirmed.length, voters.length, secsLeft(), { kind: "answered", lang: wvLang() }) : tpl("waiting_for", { n: confirmed.length, m: voters.length });
    const dots = document.getElementById("waitdots");
    if (dots) dots.innerHTML = Array.from({ length: voters.length }, (_, i) => `<i class="${i < confirmed.length ? "on" : ""}"></i>`).join("");
  }
}

// ---------- раскрытие ----------
// считалка-пучок: та же |||| + диагональная пятая, что у доски (oneword-theme.css), общий компонент.
// viewBox фиксирован на максимум вместимости комнаты (12 игроков = 3 пучка), размер слота не меняется от count.
const TALLY_PITCH = 27;
function jit(i, k) { const r = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return (r - Math.floor(r) - 0.5) * 1.1; }
function tallySVG(count, stepMs) {
  const step = stepMs || 70;
  let left = Math.max(0, count | 0), stroke = 0, paths = [];
  for (let bi = 0; left > 0; bi++) {
    const n = Math.min(5, left);
    left -= n;
    const ox = 4 + bi * TALLY_PITCH;
    for (let v = 0; v < Math.min(n, 4); v++) {
      const x = ox + v * 5;
      paths.push(`<path pathLength="1" style="--sd:${stroke * step}ms" d="M${(x + jit(stroke, 1)).toFixed(1)} 4 L${(x + jit(stroke, 2)).toFixed(1)} 26"></path>`);
      stroke++;
    }
    if (n === 5) {
      paths.push(`<path pathLength="1" style="--sd:${stroke * step}ms" d="M${ox - 2.5} 24.5 L${ox + 17.5} 5.5"></path>`);
      stroke++;
    }
  }
  return `<svg class="tally" viewBox="0 0 80 30" aria-hidden="true">${paths.join("")}</svg>`;
}
// «написано мелом»: подчёркивание (двойной штрих) и кружок вокруг цифры места, рисуются штрихом (stroke-dash) при .drawn
const UL_SVG = `<svg class="chalk-ul" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M2 8 C 36 3, 84 12, 128 6 S 184 5, 198 8"></path><path pathLength="1" d="M14 12.5 C 62 9, 120 13, 186 10.5"></path></svg>`;
const RING_SVG = `<svg class="chalk-ring" viewBox="0 0 60 60" aria-hidden="true"><path pathLength="1" d="M33 4 C 50 4, 58 19, 55 34 C 52 50, 36 58, 22 55 C 7 51, 2 33, 10 19 C 17 8, 30 4, 44 8"></path></svg>`;
function drawChalk() { setTimeout(() => { document.querySelectorAll(".chalk-ul, .chalk-ring").forEach((e) => e.classList.add("drawn")); }, 380); }
const reducedMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
// одна из своих двух мини-считалок угадывания: слово и очки проступают мелом
function myTileHtml(cls, word, gain, colorVar) {
  return `<div class="tslot ${cls}" style="--chalk-c:${colorVar}">${tallySVG(gain > 0 ? Math.min(gain, 2) : 0)}<b class="tword">${escapeHtml(word || "—")}</b><em class="tcount">+${gain || 0}</em></div>`;
}
// список кластеров не должен обрезаться (320×460, 12 разных ответов): строки, которые не влезли, заменяет «ещё N»
function fitBars() {
  const box = document.querySelector(".bars");
  if (!box) return;
  const rows = Array.from(box.querySelectorAll(".barrow:not(.more)"));
  const more = box.querySelector(".barrow.more");
  rows.forEach((x) => { x.hidden = false; });
  if (more) more.hidden = true;
  let hidden = 0;
  while (box.scrollHeight > box.clientHeight + 1 && hidden < rows.length - 1) {
    hidden++;
    rows[rows.length - hidden].hidden = true;
    if (more) { more.hidden = false; more.querySelector("span").textContent = tpl("more_n", { n: hidden }); }
  }
}
window.addEventListener("resize", fitBars);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBars);
function renderReveal() {
  const r = state.round, me2 = state.me;
  const key = "reveal:" + r.num;
  const maxCount = Math.max(1, ...r.clusters.map((c) => c.count));
  const bars = r.clusters.map((c) => {
    const w = Math.round((c.count / maxCount) * 100);
    return `<div class="barrow"><div class="lbl"><i class="fill" style="width:${w}%"></i><span>${escapeHtml(c.sample)}</span></div><div class="n">${c.count}</div></div>`;
  }).join("") + `<div class="barrow more" hidden><div class="lbl"><span></span></div><div class="n"></div></div>`;
  const popTxt = me2.popularGain > 0 ? tpl("gain_popular", { w: me2.guessPopular || "" }) : T("gain_none");
  const rareTxt = me2.rareGain > 0 ? tpl("gain_rare", { w: me2.guessRare || "" }) : T("gain_none");
  const html = `<div class="meta"><span>${escapeHtml(tpl("topic_of", { n: r.num, m: state.total }))}</span></div>
    <h2 class="q sm cabinet">${escapeHtml(r.topic.topic)}</h2>
    <div class="fine">${escapeHtml(tpl("reveal_your_answer", { w: me2.answer || "—" }))}</div>
    <div class="gain"><div class="gainrow">${myTileHtml("popflip", me2.guessPopular, me2.popularGain, "var(--chalk-yellow)")}<div class="txt"><span>${escapeHtml(T("reveal_popular"))}</span><span>${escapeHtml(popTxt)}</span></div><b>+${me2.popularGain || 0}</b></div>
    <div class="gainrow rare">${myTileHtml("rareflip", me2.guessRare, me2.rareGain, "var(--chalk-blue)")}<div class="txt"><span>${escapeHtml(T("reveal_rare"))}</span><span>${escapeHtml(rareTxt)}</span></div><b>+${me2.rareGain || 0}</b></div></div>
    <div class="bars">${bars || `<div class="fine center">${escapeHtml(T("nobody"))}</div>`}</div>`;
  if (show(html, key, false, true)) {
    wvSfx.pop();
    fitBars();
    const calm = reducedMotion();
    document.querySelectorAll(".popflip, .rareflip").forEach((t, i) => {
      const go = () => { t.classList.add("revealed"); t.closest(".gainrow").classList.add("show"); wvSfx.draw(); };
      if (calm) go(); else setTimeout(go, 350 + i * 420);
    });
    // свой результат угадывания: хоть одно попадание — победный аккорд, оба в молоко — тусклый «womp»
    setTimeout(() => { (me2.popularGain || me2.rareGain ? wvSfx.win : wvSfx.womp)(); }, 1250);
  }
}

// ---------- счёт раунда ----------
function renderScores() {
  const r = state.round;
  const key = "scores:" + r.num;
  const ranked = MP && MP.rank ? MP.rank(state.players, { score: "score" }).list : state.players.slice().sort((a, b) => b.score - a.score);
  const topScore = Math.max(0, ...ranked.map((e) => (e.player || e).score));
  const rows = ranked.map((e) => {
    const p = e.player || e;
    const delta = (r.popularPts[p.id] || 0) + (r.rarePts[p.id] || 0);
    const lead = p.score > 0 && p.score === topScore;
    return `<li class="${p.id === me ? "me" : ""}"><span class="rk">${e.place || ""}</span>${avHtml(p)}<span class="nmw"><span class="nm">${escapeHtml(p.name)}</span>${lead ? UL_SVG : ""}</span><i class="sp"></i><b>+${delta}</b><b>${p.score}</b></li>`;
  }).join("");
  const html = `<div class="meta"><span>${escapeHtml(T("scores_title"))}</span></div>
    <ol class="standings">${rows}</ol><p class="fine center">${escapeHtml(T("total_label"))}</p>`;
  if (show(html, key, false, true)) drawChalk();
}

// ---------- пауза ----------
function renderPause() {
  renderCenter("pause_title", null, `<p class="lede">${escapeHtml(tpl("pause_sub", { n: state.minPlayers }))}</p>`, "pause");
}

// ---------- финал ----------
function renderFinished() {
  const key = "finished:" + state.game;
  const ranked = MP && MP.rank ? MP.rank(state.players, { score: "score" }).list : state.players.slice().sort((a, b) => b.score - a.score);
  const topScore = Math.max(0, ...ranked.map((e) => (e.player || e).score));
  const rows = ranked.map((e) => {
    const p = e.player || e;
    const win = p.score > 0 && p.score === topScore;
    return `<li class="${p.id === me ? "me" : ""}${win ? " win" : ""}"><span class="rk">${e.place || ""}${win ? RING_SVG : ""}</span>${avHtml(p)}<span class="nmw"><span class="nm">${escapeHtml(p.name)}</span>${win ? UL_SVG : ""}</span><i class="sp"></i><b>${p.score}</b></li>`;
  }).join("");
  const awards = state.awards || {};
  const nameOf = (id) => (player(id) || {}).name || "?";
  const awardsHtml = [
    awards.popular ? `<span class="tag">${escapeHtml(T("aw_popular"))}: ${escapeHtml(awards.popular.ids.map(nameOf).join(", "))}</span>` : "",
    awards.rare ? `<span class="tag">${escapeHtml(T("aw_rare"))}: ${escapeHtml(awards.rare.ids.map(nameOf).join(", "))}</span>` : "",
  ].join("");
  const reasonTxt = state.finishedReason === "host" ? T("final_host") : state.finishedReason === "few" || state.finishedReason === "paused" ? T("final_few") : "";
  const html = `<div class="finhead"><h2>${escapeHtml(T("finished_title"))}</h2>${reasonTxt ? `<p class="fine">${escapeHtml(reasonTxt)}</p>` : `<p class="fine finish-sub">${escapeHtml(T("finished_sub"))}</p>`}</div>
    <div class="awards">${awardsHtml}</div>
    <ol class="standings">${rows}</ol>
    <button class="link leave" id="leave" type="button">${escapeHtml(T("btn_leave"))}</button>`;
  if (show(html, key, false, true)) drawChalk();
  document.getElementById("leave").onclick = leave;
}

// ---------- диспетчер ----------
function render() {
  if (dead) return;
  if (claimPrompt) return renderClaim();
  if (replacedHere) return showReplaced();
  if (!state) { renderCenter("wait_title", null, "", "wait"); return; }
  if (!me) { renderEnter(); return; }
  checkRoomLang();
  // «joined» приходит раньше снимка с моим местом: до него в фазах с личным состоянием ждём, а не падаем на state.me === null
  if (!state.me && ["answer", "guessPopular", "guessRare", "reveal"].includes(state.phase)) { renderCenter("wait_title", null, "", "wait:me"); return; }
  switch (state.phase) {
    case "lobby": return renderLobby();
    case "answer": case "guessPopular": case "guessRare": return renderWordPhase();
    case "reveal": return renderReveal();
    case "scores": return renderScores();
    case "pause": return renderPause();
    case "finished": return renderFinished();
    default: return renderLobby();
  }
}

const LANG_NAMES = { ru: "Русский", en: "English", el: "Ελληνικά" };
function hideLangHint() { const h = document.getElementById("langhint"); if (h) { h.hidden = true; h.textContent = ""; } }
function showLangHint(s) {
  const h = document.getElementById("langhint");
  if (!h) return;
  h.textContent = "";
  const t = document.createElement("span");
  t.textContent = tpl("lang_hint", { lang: LANG_NAMES[s.lang] || s.lang.toUpperCase() });
  const yes = document.createElement("button"); yes.type = "button"; yes.className = "yes"; yes.textContent = T("lang_hint_yes");
  const no = document.createElement("button"); no.type = "button"; no.textContent = T("lang_hint_no");
  yes.onclick = () => { hideLangHint(); s.accept(); };
  no.onclick = () => { hideLangHint(); s.decline(); };
  h.append(t, yes, no);
  h.hidden = false;
}
function checkRoomLang() {
  if (!langFollow || !state) return;
  if (state.phase !== "lobby" && state.phase !== "finished") { hideLangHint(); return; }
  langFollow.check();
}

// ---------- очередь слова (MP.sendQueue, разрыв связи между нажатием «Зафиксировать» и доставкой) ----------
// действие нужно, пока идёт та же фаза в том же раунде и сервер ещё не подтвердил его (confirmed) — иначе сервер
// всё равно ответил бы отказом на устаревшее слово. Раунд — метка на САМОМ сообщении (sentRound), а не «сейчас»:
// очередь живёт до 90 с, и за это время фаза могла успеть смениться и вернуться к тому же типу в НОВОМ раунде.
const sentRound = typeof WeakMap === "function" ? new WeakMap() : null;
function roundKey() { return state && state.round ? state.round.num : -1; }
function stillWanted(m) {
  if (!state || !state.me || !m) return false;
  if (sentRound && sentRound.has(m) && sentRound.get(m) !== roundKey()) return false;
  if (state.phase !== m.type) return false;
  return !state.me[m.type + "Confirmed"];
}
// не ушло (потолок, переполнение, нет связи): разблокируем кнопку, если слово ещё актуально — иначе игрок
// уверен, что нажал, а поле мёртвое; устаревшее (раунд/фаза сменились) — молча, сервер его и не ждёт.
function onQueueDrop(m, why) {
  if (!stillWanted(m)) return;
  const btn = document.getElementById("lockbtn");
  if (btn) btn.disabled = false;
}

// ---------- подключение ----------
flow = window.MP && MP.joinFlow ? MP.joinFlow({
  send: (m) => conn.send(m),
  buildJoin,
  onClaimPrompt: ({ name, summary, accept, decline }) => {
    claimPrompt = { name, summary, accept: () => { claimPrompt = null; accept(); }, decline: () => { claimPrompt = null; decline(); } };
    render();
  },
  onJoined: (m, info) => { joinName = ""; },
  onTaken: (m) => { joinErr = "err_name_taken"; render(); },
  onGiveUp: () => { joinErr = "err_connect"; render(); },
}) : null;
tab = window.MP && MP.replacedTab ? MP.replacedTab({
  rejoin: () => doJoin(),
  onReplaced: () => { showReplaced(); render(); },
  onTokenGone: () => { me = null; token = null; try { localStorage.removeItem(tokenKey()); } catch (e) {} render(); },
}) : null;
langFollow = window.MP && MP.followRoomLang ? MP.followRoomLang({
  getRoomLang: () => state && state.settings && state.settings.lang,
  onSuggest: showLangHint,
}) : null;

function handleMessage(m) {
  if (!m || typeof m !== "object") return;
  if (flow && flow.handle(m)) { render(); return; }
  if (tab && tab.handle(m)) { render(); return; }
  switch (m.type) {
    case "hello":
      if (goneFlow) goneFlow.hello();
      state = m.state;
      if (m.state.me) me = m.state.me.id;
      if (!me && token) doJoin();
      render();
      if (conn.queue && conn.queue.size()) conn.flush(stillWanted, onQueueDrop);
      return;
    case "state":
      state = m.state;
      if (m.state.me) me = m.state.me.id;
      render();
      if (conn.queue && conn.queue.size()) conn.flush(stillWanted, onQueueDrop);
      return;
    case "joined":
      me = m.playerId;
      token = m.token;
      try { localStorage.setItem(tokenKey(), token); } catch (e) {}
      if (m.renamed) { /* тост можно добавить позже */ }
      render();
      return;
    case "error":
      if (m.error === "room_expired") { onRoomGone(); return; }
      if (m.error === "bad_name") { joinErr = "err_name"; render(); return; }
      if (m.error === "room_full") { joinErr = "err_room_full"; render(); return; }
      if (m.error === "token_gone") { me = null; token = null; try { localStorage.removeItem(tokenKey()); } catch (e) {} render(); return; }
      if (m.error === "name_taken") { joinErr = "err_name_taken"; render(); return; }
      return;
    case "rejected":
      // слово не принято (знаки вместо слова, слишком частые нажатия): «Готово» снова доступна, пока слово актуально
      if (WORD_TYPES.indexOf(m.action) !== -1 && state && state.phase === m.action && state.me && !state.me[m.action + "Confirmed"]) {
        const b = document.getElementById("lockbtn");
        if (b && WORD_OK.test(wordInput)) b.disabled = false;
      }
      return;
    case "kicked":
      me = null; token = null;
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
      render();
      return;
    case "room_expired":
      onRoomGone();
      return;
    default:
      return;
  }
}

conn = connect({
  code: CODE,
  onMessage: handleMessage,
  onOpen: () => { setConnBanner(false); if (!me) doJoin(); },
  onGone: () => onRoomGone(),
  keep: stillWanted,
  onDrop: onQueueDrop,
  onState: (s) => { if (s === "lost") setConnBanner(true, T("conn_lost")); if (s === "open") setConnBanner(false); },
  onQuiet: (q) => setConnBanner(q, T("conn_lost")),
});
// действие помечаем раундом, в котором оно нажато: из очереди (до 90 с) оно уйдёт только в нём же — иначе
// сервер ответил бы отказом на слово из прошлого раунда (приём crowd.html).
if (sentRound) { const rawSend = conn.send; conn.send = (m) => { if (m && typeof m === "object" && WORD_TYPES.indexOf(m.type) !== -1 && !sentRound.has(m)) sentRound.set(m, roundKey()); return rawSend(m); }; }

if (!CODE) { renderEnter(); }
else render();
</script>
</body>
</html>
