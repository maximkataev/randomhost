<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Ставки · лаборатория: канат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<style>
  :root {
    --bg: #07090c; --glass: #0d1217; --glass-2: #121a21; --line: #1f2b34; --text: #eef2ee; --dim: #7d8c93;
    --lime: #b6ff2e; --magenta: #ff2e88; --amber: #ffd34d;
    --disp: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); min-height: 100%; }
  body { font-family: var(--mono); display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 18px; padding: 14px 22px 10px; border-bottom: 1px solid var(--line); }
  .sign { font-family: var(--disp); font-weight: 900; font-size: 34px; letter-spacing: .14em; text-transform: uppercase; color: #fff;
    text-shadow: 0 0 4px #fff, 0 0 12px var(--magenta), 0 0 28px var(--magenta), 0 0 52px var(--magenta); animation: hum 5s infinite; }
  @keyframes hum { 0%, 92%, 96%, 100% { opacity: 1 } 93% { opacity: .55 } 95% { opacity: .85 } }
  .sub { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .spacer { flex: 1; }
  .live { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--lime); }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px var(--lime); animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25 } }
  main { flex: 1; display: grid; grid-template-columns: 372px 1fr; gap: 16px; padding: 16px 22px 22px; min-height: 0; }
  main > * { min-width: 0; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; padding: 12px 12px 18px; }
    .stage { order: -1; }
    .view { aspect-ratio: 4 / 3 !important; }
    header { flex-wrap: wrap; padding: 10px 14px 8px; gap: 6px 12px; }
    .sign { font-size: 26px; } .sub { display: none; } .say { font-size: 18px; } button { padding: 11px 14px; }
    .sb { transform: scale(.78); transform-origin: top left; }
  }
  .board { background: var(--glass); border: 1px solid var(--line); padding-bottom: 12px; }
  .board h2 { font-family: var(--disp); font-weight: 800; font-size: 20px; letter-spacing: .1em; text-transform: uppercase; padding: 12px 14px 4px; display: flex; justify-content: space-between; align-items: baseline; }
  .board h2 small { font-family: var(--mono); font-size: 11px; color: var(--dim); font-weight: 700; letter-spacing: .06em; }
  .grp { padding: 8px 14px 2px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .tiles { display: grid; gap: 6px; padding: 4px 14px; }
  .t2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .t4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tile { background: var(--glass-2); border: 1px solid var(--line); padding: 7px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: opacity .35s, border-color .25s, box-shadow .25s, background .25s; }
  .tile b { font-family: var(--disp); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; text-align: center; line-height: 1; }
  .t2 .tile b { font-size: 19px; }
  .tile.win { border-color: var(--lime); box-shadow: 0 0 14px rgba(182,255,46,.55), inset 0 0 18px rgba(182,255,46,.18); background: #14200c; animation: winpop .6s ease-out; }
  .tile.lose { opacity: .32; }
  @keyframes winpop { 0% { transform: scale(1.12) } 100% { transform: scale(1) } }
  .flap { display: inline-flex; gap: 1px; justify-content: center; }
  .flap span { position: relative; width: 13px; height: 22px; display: grid; place-items: center; background: linear-gradient(#232c33 50%, #1a2128 50%); color: var(--amber); font-weight: 800; font-size: 14px; border-radius: 2px; font-variant-numeric: tabular-nums; }
  .t2 .flap span { width: 17px; height: 28px; font-size: 19px; }
  .flap span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #000; opacity: .7; }
  .flap span.dot { width: 7px; background: none; } .t2 .flap span.dot { width: 9px; } .flap span.dot::after { display: none; }
  .flap span.flip { animation: flip .38s cubic-bezier(.3,.1,.3,1); }
  @keyframes flip { 0% { transform: rotateX(-95deg); filter: brightness(.4) } 100% { transform: rotateX(0); filter: none } }
  .tile.win .flap span { color: var(--lime); }
  .now { margin: 10px 14px 0; padding: 8px 10px; border: 1px dashed #2a3842; font-size: 12px; color: var(--dim); min-height: 52px; line-height: 1.5; }
  .now b { color: var(--text); font-weight: 800; }

  .stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .view { position: relative; background: #000; border: 1px solid var(--line); aspect-ratio: 16 / 9; width: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  /* табло серии */
  .hud { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: min(92%, 760px); font-family: var(--disp); pointer-events: none; }
  .hud .row { display: flex; justify-content: space-between; align-items: flex-end; }
  .hud .tm { display: flex; align-items: baseline; gap: 10px; text-transform: uppercase; font-weight: 900; letter-spacing: .08em; font-size: 20px; text-shadow: 0 0 10px rgba(0,0,0,.9); }
  .hud .tm b { font-size: 46px; line-height: .9; color: #fff; }
  .hud .a { color: var(--lime); } .hud .b { color: var(--magenta); flex-direction: row-reverse; }
  .hud .mid { text-align: center; font: 700 11px var(--mono); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; background: rgba(6,8,12,.7); padding: 3px 8px; }
  .bar { position: relative; height: 12px; margin-top: 6px; background: #151c22; border: 1px solid #26323b; }
  .bar i { position: absolute; top: 0; bottom: 0; }
  .bar .fa { left: 0; background: linear-gradient(90deg, rgba(182,255,46,.65), rgba(182,255,46,.1)); }
  .bar .fb { right: 0; background: linear-gradient(270deg, rgba(255,46,136,.65), rgba(255,46,136,.1)); }
  .bar .mk { position: absolute; top: -5px; width: 6px; height: 22px; background: #fff; box-shadow: 0 0 12px #fff; transform: translateX(-3px); transition: left .12s linear; }
  .bar .c { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: #ffffff55; }
  .tag { display: none; }
  .stamp { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%) rotate(-4deg); font-family: var(--disp); font-weight: 900; font-size: min(11vw, 120px); letter-spacing: .06em; text-transform: uppercase;
    color: #fff; text-shadow: 0 0 6px #fff, 0 0 24px var(--lime), 0 0 54px var(--lime); opacity: 0; pointer-events: none; white-space: nowrap; }
  .stamp.sm { font-size: min(6.5vw, 70px); }
  .stamp.pm { text-shadow: 0 0 6px #fff, 0 0 24px var(--magenta), 0 0 54px var(--magenta); }
  .stamp.am { text-shadow: 0 0 6px #fff, 0 0 24px var(--amber), 0 0 54px var(--amber); }
  .stamp.on { animation: stamp 1.5s ease-out forwards; }
  @keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scale(2.4) } 12% { opacity: 1; transform: translate(-50%, -50%) rotate(-4deg) scale(1) } 80% { opacity: 1 } 100% { opacity: 0 } }
  .who { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; }
  .who.on { opacity: 1; }
  .who b { display: block; font-family: var(--disp); font-weight: 900; font-size: min(5vw, 46px); letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 0 18px rgba(0,0,0,.9); }
  .who span { font: 700 12px var(--mono); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; background: rgba(6,8,12,.7); padding: 3px 8px; }
  .say { font-family: var(--disp); font-weight: 700; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; min-height: 30px; }
  .say em { font-style: normal; color: var(--lime); }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: 800 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #06090b; background: var(--lime); border: 0; padding: 11px 18px; cursor: pointer; border-bottom: 3px solid #6c9e10; }
  button:active { transform: translateY(2px); border-bottom-width: 1px; }
  button:disabled { opacity: .45; cursor: default; }
  label { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .hint { font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="sign">Тотализатор</div>
  <div class="sub">лаборатория · канат · не в деплое</div>
  <div class="spacer"></div>
  <div class="live"><i></i>LIVE</div>
</header>

<main>
  <section class="board" aria-label="Табло каната">
    <h2><span>Канат</span><small>41 рывок · больше — победа</small></h2>
    <div class="grp">Победитель</div>
    <div class="tiles t2" id="g-win"></div>
    <div class="grp">Победа с перевесом 9+ рывков</div>
    <div class="tiles t2" id="g-big"></div>
    <div class="grp">Камбэк: победитель отставал на 5+</div>
    <div class="tiles t2" id="g-cb"></div>
    <div class="now" id="now">Нажми «Рывок».</div>
  </section>

  <section class="stage">
    <div class="view" id="view">
      <canvas id="cv"></canvas>
      <div class="hud" id="hud">
        <div class="row"><div class="tm a"><span id="nA">БУГАЙ</span><b id="sA">0</b></div><div class="mid" id="mid">рывок 0 / 41</div><div class="tm b"><span id="nB">ЖИЛА</span><b id="sB">0</b></div></div>
        <div class="bar"><i class="fa" id="fa"></i><i class="fb" id="fb"></i><div class="c"></div><div class="mk" id="mk" style="left:50%"></div></div>
      </div>
      <div class="stamp" id="stamp">Серия!</div>
    </div>
    <div class="say" id="say">Нажми <em>«Рывок»</em></div>
    <div class="ctl">
      <button id="go">Рывок</button>
      <label><input type="checkbox" id="fast"> ×2 быстрее</label>
      <span class="hint">каждый из 41 рывка и коэффициенты — из настоящего движка (bets/events/rope.js)</span>
    </div>
  </section>
</main>

<script src="bets-lab-rope-data.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const kc2 = (kc) => (kc / 100).toFixed(2).replace(".", ",");
const HERO = { A: { name: "Бугай", col: "#b6ff2e", dark: "#07090c", skin: "#e8b48a" }, B: { name: "Жила", col: "#ff2e88", dark: "#ffffff", skin: "#d9a07a" } };
const PULLS = 41;

// ---------- табло ----------
function setFlap(el, text) {
  const prev = el._t || ""; if (prev === text) return;
  el._t = text; el.innerHTML = "";
  [...text].forEach((ch, i) => { const s = document.createElement("span"); s.textContent = ch; if (ch === ",") s.className = "dot"; if (prev[i] !== ch) { s.classList.add("flip"); s.style.animationDelay = (i * 0.05) + "s"; } el.appendChild(s); });
}
const tileEls = {};
function tile(parent, id, label, kc) {
  const d = document.createElement("div"); d.className = "tile"; d.innerHTML = `<b>${label}</b><div class="flap"></div>`;
  parent.appendChild(d); tileEls[id] = d; setFlap(d.querySelector(".flap"), kc2(kc));
}
function buildBoard(r) {
  ["g-win", "g-big", "g-cb"].forEach((g) => ($(g).innerHTML = ""));
  Object.keys(tileEls).forEach((k) => delete tileEls[k]);
  const lab = { A: HERO.A.name, B: HERO.B.name };
  const add = (pre, g) => ["A", "B"].forEach((t) => { const m = r.markets.find((x) => x.id === pre + ":" + t); if (m) tile($(g), m.id, lab[t], m.kc); });
  add("win", "g-win"); add("big", "g-big"); add("comeback", "g-cb");
}
const clearTiles = () => Object.values(tileEls).forEach((e) => (e.className = "tile"));

// ---------- сцена ----------
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, SC = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const b = cv.getBoundingClientRect();
  W = Math.max(300, Math.round(b.width)); H = Math.max(220, Math.round(b.height));
  cv.width = W * DPR; cv.height = H * DPR; SC = Math.min(W / 1100, H / 620);
}
window.addEventListener("resize", resize);
const S = { phase: "idle", r: null, idx: -1, k: -1, pt: 0, dur: 0.5, d: 0, dFrom: 0, dTo: 0, a: 0, b: 0, ts: 1, lean: { A: 0.15, B: 0.15 }, jerk: { A: 0, B: 0 }, streak: 0, lastWinner: null, min: 0, max: 0, parts: [], crowd: [], shake: 0, flash: 0, said: {}, end: 0, wait: 0, running: false, floorOff: 0, sweat: [] };
for (let i = 0; i < 360; i++) S.crowd.push({ x: Math.random(), row: Math.floor(Math.random() * 7), c: Math.floor(Math.random() * 8), ph: Math.random() * 6 });
const CROWD_COL = ["#3b2f4a", "#4a2f3a", "#2f3f4a", "#463d2a", "#2c4a3c", "#4a3a2c", "#2f2f4a", "#503040"];
function say(h) { $("say").innerHTML = h; }
const ease = (t) => t * t * (3 - 2 * t);
const easeBack = (t) => 1 + 2.4 * Math.pow(t - 1, 3) + 1.4 * Math.pow(t - 1, 2);

// ---------- ход ----------
function start() {
  S.idx = (S.idx + 1) % window.LAB_ROPE.length; S.r = window.LAB_ROPE[S.idx];
  S.k = -1; S.d = 0; S.dFrom = 0; S.dTo = 0; S.a = 0; S.b = 0; S.streak = 0; S.lastWinner = null; S.min = 0; S.max = 0; S.said = {}; S.parts.length = 0;
  S.phase = "intro"; S.wait = 1.6; S.running = true; S.end = 0; S.lean = { A: 0.15, B: 0.15 };
  buildBoard(S.r); clearTiles(); hud(); $("go").disabled = true;
  const s = S.r.s;
  $("now").innerHTML = `Сила за рывок: <b>${HERO.A.name} ${(s / 10).toFixed(1)}%</b> против <b>${HERO.B.name} ${((1000 - s) / 10).toFixed(1)}%</b>. Побеждает тот, кто выиграет больше рывков из 41.`;
  say("Бойцы взялись за канат. <em>Ставки закрыты.</em>");
}
function nextPull() {
  S.k++;
  if (S.k >= PULLS) return finish();
  const w = S.r.o.pulls[S.k] ? "A" : "B";
  S.dFrom = S.d; S.dTo = S.d + (w === "A" ? 1 : -1);
  const prev = S.lastWinner;
  S.streak = prev === w ? S.streak + 1 : 1;
  const left = PULLS - 1 - S.k, decided = Math.abs(S.dTo) > left;
  const tight = !decided && left <= 6;
  S.dur = decided ? 0.3 : tight ? 0.9 : S.streak >= 3 ? 0.36 : prev && prev !== w ? 0.62 : 0.48;
  S.pt = 0; S.w = w; S.lastWinner = w; S.phase = "pull"; S.tight = tight;
  S.jerk[w] = 1; S.jerk[w === "A" ? "B" : "A"] = -1;
  if (S.dTo < S.min) S.min = S.dTo; if (S.dTo > S.max) S.max = S.dTo;
  if (w === "A") S.a++; else S.b++;
  // события для комментатора
  const ln = (t) => `<em>${HERO[t].name}</em>`;
  if (S.streak === 3) { say(`Серия! ${ln(w)} тянет три подряд`); stamp("Серия!", w); S.shake = 0.7; }
  else if (S.streak === 5) { say(`Пять рывков подряд! ${ln(w)} <em>не оставляет шансов</em>`); S.shake = 1; }
  else if (prev && prev !== w && Math.abs(S.dFrom) >= 4 && Math.sign(S.dTo) !== Math.sign(S.dFrom) || (Math.abs(S.dFrom) >= 4 && Math.sign(S.dFrom) === (w === "A" ? -1 : 1) && Math.abs(S.dTo) === Math.abs(S.dFrom) - 1 && Math.abs(S.dTo) <= 1)) { say(`${ln(w)} <em>отыгрывается!</em>`); }
  if (!S.said.mid && S.k === 20) { S.said.mid = 1; say(`Середина: ${S.a}:${S.b}. <em>Всё впереди!</em>`); }
  if (tight && !S.said.tight) { S.said.tight = 1; say("Последние рывки. <em>Всё решается сейчас!</em>"); stamp("Решающие!", w); }
  if (decided && !S.said.dec) { S.said.dec = 1; say(`${ln(w)} уже не догнать`); }
  hud();
}
function stamp(t, who) { const st = $("stamp"); st.textContent = t; st.className = "stamp sm" + (who === "B" ? " pm" : ""); void st.offsetWidth; st.classList.add("on"); }
function hud() {
  $("sA").textContent = S.a; $("sB").textContent = S.b; $("mid").textContent = `рывок ${Math.max(0, S.k + (S.phase === "pull" ? 1 : 0))} / ${PULLS}`;
  const p = 50 + S.d / PULLS * 50; // положение метки на шкале −41…+41 (влево — A)
  $("mk").style.left = (50 - S.d / PULLS * 50) + "%";
  $("fa").style.width = Math.max(0, 50 + S.d / PULLS * 50) + "%"; $("fb").style.width = Math.max(0, 50 - S.d / PULLS * 50) + "%";
}
function finish() {
  S.phase = "end"; S.end = 0;
  const o = S.r.o, win = new Set(S.r.win);
  Object.entries(tileEls).forEach(([id, el]) => { el.className = "tile " + (win.has(id) ? "win" : "lose"); });
  const w = o.winner, cb = (w === "A" && o.minDiff <= -5) || (w === "B" && o.maxDiff >= 5);
  stamp(cb ? "КАМБЭК!" : "Победа: " + HERO[w].name, w);
  say(`Победил <em>${HERO[w].name}</em>, ${w === "A" ? o.winsA : PULLS - o.winsA}:${w === "A" ? PULLS - o.winsA : o.winsA}${cb ? " — после отставания " + (w === "A" ? -o.minDiff : o.maxDiff) + " рывков!" : ""}`);
  $("now").innerHTML = `Итог <b>${o.winsA}:${PULLS - o.winsA}</b>. Максимальное отставание победителя: <b>${w === "A" ? -o.minDiff : o.maxDiff}</b>.`;
  S.flash = 0.4; S.shake = 1.4; $("go").disabled = false; S.running = false;
}

// ---------- рисование ----------
function drawBg(now, cx, hype) {
  let g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  g.addColorStop(0, "#04050b"); g.addColorStop(0.6, "#161028"); g.addColorStop(1, "#2c1634"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.55);
  for (const fx of [0.1, 0.35, 0.65, 0.9]) {
    const x = W * fx, y = H * 0.04, gl = ctx.createRadialGradient(x, y, 0, x, y, H * 0.5);
    gl.addColorStop(0, "rgba(255,244,220,.55)"); gl.addColorStop(0.14, "rgba(255,238,200,.16)"); gl.addColorStop(1, "rgba(255,238,200,0)"); ctx.fillStyle = gl; ctx.fillRect(x - H * 0.55, 0, H * 1.1, H * 0.65);
    ctx.fillStyle = "#fff6dd"; ctx.fillRect(x - 22 * SC, y - 5 * SC, 44 * SC, 11 * SC);
  }
  // трибуна с болельщиками, прыгают сильнее при серии
  const top = H * 0.17, bot = H * 0.52; ctx.fillStyle = "#130f22"; ctx.fillRect(0, top, W, bot - top);
  for (const c of S.crowd) {
    const y = top + (c.row + 0.6) / 7.4 * (bot - top), x = ((c.x * W * 1.4 - cx * 0.15) % (W * 1.4) + W * 1.4) % (W * 1.4) - W * 0.2;
    const bob = Math.sin(now * (4 + c.row) + c.ph) * (0.6 + hype * 3.2) * (1 + c.row * 0.3);
    ctx.fillStyle = CROWD_COL[c.c]; const s = (3.5 + c.row * 0.9) * SC * 1.2;
    ctx.beginPath(); ctx.arc(x, y + bob, s, 0, 6.3); ctx.fill(); ctx.fillRect(x - s, y + bob, s * 2, s * 1.4);
  }
  // неоновые щиты
  const by = H * 0.52, bh = H * 0.07; ctx.fillStyle = "#0a0c12"; ctx.fillRect(0, by - bh, W, bh);
  const n = 9, w = W / n;
  for (let i = 0; i < n; i++) { ctx.fillStyle = i % 2 ? "#b6ff2e" : "#ff2e88"; ctx.font = `900 ${bh * 0.7}px "Big Shoulders Display", Impact, sans-serif`; ctx.textAlign = "center"; ctx.globalAlpha = 0.8 + 0.2 * Math.sin(now * 3 + i); ctx.fillText(i % 2 ? "КАНАТ" : "ТОТАЛ", ((i + 0.5) * w - cx * 0.4 % w + W) % W, by - bh * 0.22); ctx.globalAlpha = 1; }
  ctx.textAlign = "left";
}
function drawFloor(cx, d, now) {
  const top = H * 0.52;
  const g = ctx.createLinearGradient(0, top, 0, H); g.addColorStop(0, "#1a2a2e"); g.addColorStop(1, "#0a1012"); ctx.fillStyle = g; ctx.fillRect(0, top, W, H - top);
  // метки: мир скользит под ногами; U — пикселей на рывок
  const U = 36 * SC;
  for (let m = -60; m <= 60; m++) {
    const x = cx + (m + d) * U; if (x < -20 || x > W + 20) continue;
    const major = m % 5 === 0, zero = m === 0;
    ctx.strokeStyle = zero ? "#ff2e88" : major ? "rgba(255,255,255,.4)" : "rgba(255,255,255,.12)"; ctx.lineWidth = zero ? 4 : major ? 2 : 1;
    if (zero) { ctx.shadowColor = "#ff2e88"; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.moveTo(x, top + 6); ctx.lineTo(x - (x - cx) * 0.18, H); ctx.stroke(); ctx.shadowBlur = 0;
    if (major && !zero) { ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.font = `800 ${12 * Math.max(0.8, SC)}px "JetBrains Mono", monospace`; ctx.textAlign = "center"; ctx.fillText(Math.abs(m), x, top + 22 * SC); ctx.textAlign = "left"; }
  }
  // горизонтали дорожки
  ctx.strokeStyle = "rgba(182,255,46,.35)"; ctx.lineWidth = 2; ctx.shadowColor = "#b6ff2e"; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(0, top + 2); ctx.lineTo(W, top + 2); ctx.stroke(); ctx.shadowBlur = 0;
}

function limb(x1, y1, x2, y2, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
// боец: dir=+1 слева (смотрит вправо), −1 справа; lean — откидывание назад; tr — «стресс» (дрожь)
function drawFighter(x, gy, dir, lean, hero, mood, now, t) {
  const s = SC * 1.15, shake = (mood === "pull" ? Math.sin(now * 40) * 1.2 : 0);
  ctx.save(); ctx.translate(x + shake, gy); ctx.scale(s * dir, s);   // локально: смотрит вправо
  const col = hero.col, skin = hero.skin, pants = "#232a35";
  const hipY = -78 + (mood === "stumble" ? 10 : 0), hipX = -lean * 46;
  const shX = hipX - Math.sin(lean) * 62, shY = hipY - Math.cos(lean) * 62;
  const handX = 96, handY = -128;
  // дальняя нога и ближняя: широкая стойка, упор
  const spread = 26 + lean * 52;
  limb(hipX, hipY, hipX + spread, 0, 17, pants); limb(hipX + spread, 0, hipX + spread + 20, 0, 13, "#10151c");
  limb(hipX, hipY, hipX - spread * 0.9, 0, 18, pants); limb(hipX - spread * 0.9, 0, hipX - spread * 0.9 + 20, 0, 13, "#10151c");
  // торс
  limb(hipX, hipY, shX, shY, 46, col);
  ctx.fillStyle = hero.dark; ctx.font = `900 24px "Big Shoulders Display", Impact, sans-serif`; ctx.textAlign = "center";
  ctx.save(); ctx.translate((hipX + shX) / 2, (hipY + shY) / 2 + 8); ctx.scale(dir, 1); ctx.fillText(hero.name[0], 0, 0); ctx.restore(); ctx.textAlign = "left";
  // руки к канату
  limb(shX + 4, shY + 4, handX, handY, 13, col); limb(shX - 6, shY + 8, handX - 10, handY + 6, 12, skin);
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(handX, handY, 9, 0, 6.3); ctx.fill();
  // голова: рот открыт, когда тянет
  const hx = shX + 8, hy = shY - 26;
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(hx, hy, 20, 0, 6.3); ctx.fill();
  ctx.fillStyle = "#2a1c18"; ctx.beginPath(); ctx.arc(hx - 3, hy - 6, 20, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(hx + 10, hy - 3, 4, 0, 6.3); ctx.fill(); ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(hx + 11, hy - 3, 2, 0, 6.3); ctx.fill();
  ctx.strokeStyle = "#111"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(hx + 4, hy - 11); ctx.lineTo(hx + 16, hy - 8); ctx.stroke();
  if (mood === "pull") { ctx.fillStyle = "#3a0b17"; ctx.beginPath(); ctx.ellipse(hx + 12, hy + 9, 6, 8, 0, 0, 6.3); ctx.fill(); }
  else { ctx.strokeStyle = "#111"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(hx + 7, hy + 10); ctx.lineTo(hx + 16, hy + 10); ctx.stroke(); }
  ctx.restore();
  return { hx: x + dir * handX * s, hy: gy + handY * s };
}

let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!W) resize();
  const now = ts / 1000, dtReal = Math.min(0.05, now - (last || now)); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const fast = $("fast").checked ? 1.8 : 1;
  // замедление в решающих рывках
  let target = fast * (S.phase === "pull" && S.tight ? 0.7 : 1);
  S.ts += (target - S.ts) * Math.min(1, dtReal * 6);
  const dt = dtReal * S.ts;

  if (S.running) {
    if (S.phase === "intro") { S.wait -= dtReal; if (S.wait <= 0) nextPull(); }
    else if (S.phase === "pull") {
      S.pt += dt / S.dur;
      const e = easeBack(Math.min(1, S.pt));
      S.d = S.dFrom + (S.dTo - S.dFrom) * e;
      if (S.pt >= 1) { S.d = S.dTo; S.phase = "gap"; S.wait = S.tight ? 0.25 : 0.04; hud(); S.shake = Math.max(S.shake, 0.25); }
      else $("mk").style.left = (50 - S.d / PULLS * 50) + "%";
    } else if (S.phase === "gap") { S.wait -= dt; if (S.wait <= 0) nextPull(); }
  }
  if (S.phase === "end") S.end += dtReal;

  // позы: победитель откидывается, проигравший вытягивается вперёд
  ["A", "B"].forEach((t) => {
    const target = S.phase === "pull" ? (S.jerk[t] > 0 ? 0.62 : -0.05) : S.phase === "end" ? 0 : 0.25;
    S.lean[t] += (target - S.lean[t]) * Math.min(1, dtReal * (S.phase === "pull" ? 14 : 5));
  });
  S.shake = Math.max(0, S.shake - dtReal * 2.5);
  const hype = Math.min(1, (S.streak >= 3 ? 0.6 : 0.15) + (S.phase === "end" ? 0.8 : 0) + (S.tight ? 0.3 : 0));

  // кадр
  const cx = W / 2;
  ctx.save(); ctx.translate((Math.random() - 0.5) * S.shake * 7 * SC, (Math.random() - 0.5) * S.shake * 5 * SC);
  const d = S.phase === "idle" ? 0 : S.d;
  drawBg(now, d * 36, hype);
  drawFloor(cx, d, now);
  const gy = H * 0.86, span = 255 * SC * 1.15;
  const ropeY = gy - 128 * SC * 1.15;
  const endFall = S.phase === "end" ? Math.min(1, S.end / 0.7) : 0;
  const winner = S.r ? S.r.o.winner : null;
  const moodOf = (t) => S.phase === "pull" ? (S.jerk[t] > 0 ? "pull" : "stumble") : S.phase === "end" ? (t === winner ? "pull" : "stumble") : "idle";
  // бойцы (фигура A слева смотрит вправо)
  const ax = cx - span, bx = cx + span;
  const lA = S.lean.A + (S.phase === "end" && winner === "B" ? -0.4 * endFall : 0), lB = S.lean.B + (S.phase === "end" && winner === "A" ? -0.4 * endFall : 0);
  const hA = drawFighter(ax, gy, 1, lA, HERO.A, moodOf("A"), now), hB = drawFighter(bx, gy, -1, lB, HERO.B, moodOf("B"), now);
  // канат: тяжелее провисает, когда не тянут; ленточка по центру
  const tension = S.phase === "pull" || S.phase === "gap" ? 1 : 0.5;
  const sag = (14 + 40 * (1 - tension)) * SC + Math.sin(now * 30) * (S.phase === "pull" ? 2 : 0);
  ctx.strokeStyle = "#e9d7a6"; ctx.lineWidth = 7 * SC; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(hA.hx, hA.hy);
  ctx.quadraticCurveTo(cx, hA.hy + sag, hB.hx, hB.hy); ctx.stroke();
  ctx.strokeStyle = "#8a7448"; ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.moveTo(hA.hx, hA.hy); ctx.quadraticCurveTo(cx, hA.hy + sag, hB.hx, hB.hy); ctx.stroke(); ctx.setLineDash([]);
  // красная ленточка в середине
  const my = hA.hy + sag * 0.5;
  ctx.fillStyle = "#ff2e88"; ctx.shadowColor = "#ff2e88"; ctx.shadowBlur = 14; ctx.fillRect(cx - 6 * SC, my - 16 * SC, 12 * SC, 34 * SC); ctx.shadowBlur = 0;
  ctx.fillStyle = "#fff"; ctx.fillRect(cx - 2 * SC, my - 16 * SC, 4 * SC, 34 * SC);

  // пыль под ногами проигравшего на рывке и искры у рук победителя
  if (S.phase === "pull" && Math.random() < dtReal * 45) {
    const loser = S.jerk.A < 0 ? "A" : "B", lx = loser === "A" ? ax : bx;
    S.parts.push({ x: lx + (loser === "A" ? 20 : -20) * SC, y: gy, vx: (loser === "A" ? 1 : -1) * rnd(40, 160), vy: rnd(-60, -10), life: rnd(0.4, 0.9), age: 0, r: rnd(3, 7) * SC, t: "dust" });
    const win = S.jerk.A > 0 ? hA : hB; S.parts.push({ x: win.hx, y: win.hy, vx: rnd(-80, 80), vy: rnd(-140, -30), life: rnd(0.3, 0.6), age: 0, r: rnd(1.5, 3) * SC, t: "spark" });
    if (Math.random() < 0.5) { const t = Math.random() < 0.5 ? hA : hB; S.parts.push({ x: t.hx - (t === hA ? 70 : -70) * SC, y: gy - 180 * SC, vx: rnd(-40, 40), vy: rnd(-90, -20), life: 0.7, age: 0, r: 2.5 * SC, t: "sweat" }); }
  }
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i]; p.age += dtReal; if (p.age > p.life) { S.parts.splice(i, 1); continue; }
    p.vy += (p.t === "dust" ? 40 : 300) * dtReal; p.x += p.vx * dtReal; p.y += p.vy * dtReal; const a = 1 - p.age / p.life;
    ctx.globalAlpha = a * (p.t === "dust" ? 0.5 : 1); ctx.fillStyle = p.t === "dust" ? "#b8a98a" : p.t === "spark" ? "#ffd34d" : "#9fe6ff";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.t === "dust" ? 1 + (1 - a) : 1), 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // виньетка и вспышка
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.5)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (S.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.6, S.flash)})`; ctx.fillRect(0, 0, W, H); S.flash -= dtReal * 2.2; }
}
$("go").onclick = start;
window.labRope = start; window.labState = S;
window.addEventListener("load", () => { buildBoard(window.LAB_ROPE[0]); hud(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
