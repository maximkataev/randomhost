<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>О чём поговорить — рандомайзер тем для разговора</title>
  <meta name="description" content="Не знаешь о чём поговорить? Крутани барабан и получи тему для разговора с кем угодно!" data-i18n-meta="meta_desc">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://randomhost.online/talk-topics.html">

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Kalam:wght@400;700&family=Caveat:wght@600;700&family=Permanent+Marker&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💬</text></svg>" type="image/svg+xml">

  <meta name="theme-color" content="#ffffff">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);

  --white: #fcfcfc;
  --black: #232323;
  --gray-light: #f3f3f3;
  --gray-medium: #c7c7c7;
  --gray-dark: #777777;
  --accent: #ff6b35;
  --accent-light: #fff0ea;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 0 0, rgba(0,0,0,0.04), transparent 55%),
    radial-gradient(circle at 100% 100%, rgba(0,0,0,0.04), transparent 55%),
    var(--white);
  font-family: 'Permanent Marker', 'Bangers', cursive;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(80px + var(--safe-top)) var(--safe-right) calc(20px + var(--safe-bottom)) var(--safe-left);
  position: relative;
  overflow-x: hidden;
  color: var(--black);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 27px,
      rgba(0,0,0,0.04) 27px,
      rgba(0,0,0,0.04) 28px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 27px,
      rgba(0,0,0,0.025) 27px,
      rgba(0,0,0,0.025) 28px
    );
  mix-blend-mode: multiply;
  pointer-events: none;
  z-index: 1;
}

.home-button {
  position: fixed;
  top: calc(20px + var(--safe-top));
  left: calc(20px + var(--safe-left));
  z-index: 1000;
  padding: 10px 22px;
  background: var(--white);
  color: var(--black);
  text-decoration: none;
  font-family: 'Bangers', cursive;
  font-size: 20px;
  border-radius: 12px;
  border: 2px solid var(--black);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.5),
    3px 3px 0 rgba(0,0,0,0.5);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  letter-spacing: 1px;
  text-transform: uppercase;
  transform: rotate(-2deg);
  background-image:
    repeating-linear-gradient(
      -45deg,
      rgba(0,0,0,0.08) 0 1px,
      transparent 1px 3px
    );
}

.home-button:hover {
  transform: rotate(-2deg) translate(-2px, -2px);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    5px 5px 0 rgba(0,0,0,0.6);
}

.home-button:active {
  transform: rotate(-2deg) translate(2px, 2px);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    1px 1px 0 rgba(0,0,0,0.6);
}

.container {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 600px;
  background: var(--white);
  padding: 40px 30px;
  border-radius: 20px;
  border: 2px solid var(--black);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.7),
    6px 6px 0 rgba(0,0,0,0.7);
  transform: rotate(-0.8deg);
  background-image:
    repeating-linear-gradient(
      -45deg,
      rgba(0,0,0,0.03) 0 2px,
      transparent 2px 4px
    );
  overflow: hidden;
}

.container::before {
  content: '';
  position: absolute;
  inset: 6px;
  border-radius: 16px;
  border: 2px dashed rgba(0,0,0,0.3);
  transform: rotate(0.8deg);
  pointer-events: none;
}

h1 {
  font-family: 'Bangers', cursive;
  font-size: clamp(28px, 7vw, 44px);
  color: var(--black);
  text-align: center;
  margin-bottom: 8px;
  font-weight: 400;
  letter-spacing: 2px;
  position: relative;
  text-shadow:
    0 0 1px rgba(0,0,0,0.8),
    -1px 1px 0 rgba(255,255,255,0.5);
  transform: rotate(-1deg);
}

.subtitle {
  text-align: center;
  font-family: 'Permanent Marker', cursive;
  font-size: clamp(14px, 3.5vw, 18px);
  color: var(--gray-dark);
  margin-bottom: 30px;
  transform: rotate(0.5deg);
}

/* ===== Выбор собеседника ===== */
.person-section {
  margin-bottom: 25px;
}

.section-label {
  display: block;
  font-size: clamp(16px, 4vw, 20px);
  color: var(--black);
  margin-bottom: 12px;
  font-family: 'Bangers', cursive;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: center;
}

.person-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.person-chip {
  padding: 8px 16px;
  font-family: 'Kalam', sans-serif;
  font-size: 15px;
  font-weight: 700;
  border-radius: 20px;
  border: 2px solid var(--black);
  background: var(--white);
  color: var(--black);
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.3),
    2px 2px 0 rgba(0,0,0,0.4);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  background-image:
    repeating-linear-gradient(
      -45deg,
      rgba(0,0,0,0.02) 0 2px,
      transparent 2px 4px
    );
}

.person-chip:hover {
  transform: translate(-1px, -1px);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.4),
    3px 3px 0 rgba(0,0,0,0.5);
}

.person-chip:active {
  transform: translate(1px, 1px);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.4),
    1px 1px 0 rgba(0,0,0,0.5);
}

.person-chip.selected {
  background: var(--black);
  color: var(--white);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.8),
    3px 3px 0 rgba(0,0,0,0.8);
  transform: rotate(-1deg) scale(1.05);
}

/* ===== iOS-style Drum Picker ===== */
.drum-wrapper {
  position: relative;
  height: 220px;
  margin: 20px 0;
  border-radius: 16px;
  border: 2px solid var(--black);
  overflow: hidden;
  background: var(--gray-light);
  box-shadow:
    inset 0 10px 30px rgba(0,0,0,0.08),
    inset 0 -10px 30px rgba(0,0,0,0.08),
    0 0 0 1px rgba(0,0,0,0.4),
    4px 4px 0 rgba(0,0,0,0.5);
  background-image:
    repeating-linear-gradient(
      -45deg,
      rgba(0,0,0,0.015) 0 2px,
      transparent 2px 4px
    );
}

/* Градиентные маски сверху и снизу */
.drum-wrapper::before,
.drum-wrapper::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  height: 80px;
  z-index: 10;
  pointer-events: none;
}

.drum-wrapper::before {
  top: 0;
  background: linear-gradient(to bottom,
    var(--gray-light) 0%,
    rgba(243,243,243,0.95) 20%,
    rgba(243,243,243,0.7) 50%,
    transparent 100%
  );
}

.drum-wrapper::after {
  bottom: 0;
  background: linear-gradient(to top,
    var(--gray-light) 0%,
    rgba(243,243,243,0.95) 20%,
    rgba(243,243,243,0.7) 50%,
    transparent 100%
  );
}

/* Выделение центральной строки */
.drum-highlight {
  position: absolute;
  top: 50%;
  left: 10px;
  right: 10px;
  height: 44px;
  transform: translateY(-50%);
  border-radius: 10px;
  border: 2px solid var(--black);
  background: var(--white);
  z-index: 5;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.3),
    inset 0 1px 3px rgba(0,0,0,0.05);
  background-image:
    repeating-linear-gradient(
      -45deg,
      rgba(0,0,0,0.02) 0 2px,
      transparent 2px 4px
    );
}

/* Контейнер для крутящихся элементов */
.drum-track {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  z-index: 6;
  overflow: hidden;
}

.drum-items {
  position: absolute;
  left: 0;
  right: 0;
  transition: transform 0.1s linear;
  will-change: transform;
}

.drum-item {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Kalam', sans-serif;
  font-size: clamp(11px, 2.8vw, 15px);
  font-weight: 700;
  color: var(--black);
  padding: 0 16px;
  text-align: center;
  line-height: 1.2;
  overflow: hidden;
  opacity: 0.4;
  transform: scale(0.9);
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.drum-item.center {
  opacity: 1;
  transform: scale(1);
}

/* Состояние размытия до нажатия */
.drum-track.blurred .drum-item {
  filter: blur(6px);
  transition: filter 0.4s ease, opacity 0.15s ease, transform 0.15s ease;
}

.drum-track.blurred .drum-item.center {
  filter: blur(4px);
}

.drum-track:not(.blurred) .drum-item {
  filter: blur(0px);
  transition: filter 0.3s ease, opacity 0.15s ease, transform 0.15s ease;
}

/* Кнопка крутить */
.spin-button {
  width: 100%;
  padding: 18px 34px;
  font-family: 'Bangers', cursive;
  font-size: clamp(22px, 5.5vw, 32px);
  font-weight: 400;
  color: var(--black);
  background: var(--gray-light);
  border-radius: 14px;
  cursor: pointer;
  border: 2px solid var(--black);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    4px 4px 0 rgba(0,0,0,0.7);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  overflow: hidden;
  touch-action: manipulation;
  text-transform: uppercase;
  letter-spacing: 2px;
  transform: rotate(-1deg);
  background-image:
    repeating-linear-gradient(
      -45deg,
      rgba(0,0,0,0.08) 0 2px,
      transparent 2px 5px
    );
}

.spin-button::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 15px,
      rgba(0,0,0,0.08) 15px 17px
    );
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.spin-button:hover:not(:disabled)::before {
  opacity: 1;
}

.spin-button:hover:not(:disabled) {
  transform: rotate(-1deg) translate(-2px, -2px);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.75),
    6px 6px 0 rgba(0,0,0,0.8);
}

.spin-button:active:not(:disabled) {
  transform: rotate(-1deg) translate(2px, 2px);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.75),
    2px 2px 0 rgba(0,0,0,0.8);
}

.spin-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: rotate(-1deg);
}

/* Декоративные элементы */
.deco {
  position: fixed;
  font-size: 40px;
  opacity: 0.08;
  pointer-events: none;
  z-index: 0;
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(5deg); }
}

.deco-1 { top: 10%; left: 5%; animation-delay: 0s; }
.deco-2 { top: 15%; right: 8%; animation-delay: 0.5s; }
.deco-3 { top: 60%; left: 3%; animation-delay: 1s; }
.deco-4 { top: 75%; right: 10%; animation-delay: 1.5s; }
.deco-5 { top: 30%; left: 12%; animation-delay: 2s; }
.deco-6 { top: 45%; right: 15%; animation-delay: 2.5s; }
.deco-7 { top: 85%; left: 20%; animation-delay: 3s; }
.deco-8 { top: 20%; right: 25%; animation-delay: 3.5s; }

/* Мобильная адаптация */
@media (max-width: 768px) {
  body {
    padding: calc(20px + var(--safe-top)) 8px calc(20px + var(--safe-bottom)) 8px;
    align-items: flex-start;
  }

  .container {
    padding: 24px 12px;
    max-width: 100%;
    margin-top: 50px;
    transform: none;
    border-radius: 16px;
  }

  .container::before {
    inset: 4px;
    border-radius: 12px;
    transform: none;
  }

  h1 {
    font-size: clamp(22px, 6vw, 32px);
    margin-bottom: 6px;
    transform: none;
  }

  .subtitle {
    transform: none;
    margin-bottom: 20px;
  }

  .person-chip {
    padding: 7px 12px;
    font-size: 14px;
  }

  .drum-item {
    padding: 0 10px;
    font-size: clamp(10px, 2.5vw, 13px);
  }

  .drum-wrapper {
    height: 220px;
  }

  .spin-button {
    padding: 16px 24px;
    font-size: clamp(20px, 5vw, 26px);
  }
}

@media (max-width: 768px) {
  .home-button {
    position: absolute;
    top: calc(20px + var(--safe-top));
  }
}

@media (max-width: 480px) {
  .home-button {
    padding: 8px 14px;
    font-size: 16px;
  }

  .person-chip {
    padding: 6px 10px;
    font-size: 13px;
  }

  .spin-button {
    padding: 14px 20px;
    transform: none;
  }

  .spin-button:hover:not(:disabled) {
    transform: translate(-2px, -2px);
  }

  .spin-button:active:not(:disabled) {
    transform: translate(2px, 2px);
  }
}

/* iOS + тач-устройства */
@supports (-webkit-touch-callout: none) {
  @media (pointer: coarse) {
    body {
      font-family: 'Kalam', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .home-button,
    h1,
    .subtitle,
    .section-label,
    .spin-button {
      font-family: 'Caveat', 'Kalam', -apple-system, BlinkMacSystemFont, 'Segoe UI', cursive;
      font-weight: 700;
    }

    .person-chip,
    .drum-item {
      font-family: 'Kalam', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 700;
    }
  }
}
/* ===== АДАПТИВНЫЕ ПРАВКИ (2026-09, только вёрстка) ===== */

/* Планшет-портрет: не растягивать карточку на всю ширину */
@media (min-width: 561px) and (max-width: 900px) {
  .container { max-width: 640px; margin-left: auto; margin-right: auto; }
}

/* Текст барабана на телефонах был 10px — поднимаем до читаемого */
@media (max-width: 768px) {
  .drum-item {
    font-size: clamp(12.5px, 3.4vw, 15px);
    padding: 0 12px;
    line-height: 1.15;
  }
}
</style>

</head>
<body>
  <!-- Декоративные элементы -->
  <div class="deco deco-1">💬</div>
  <div class="deco deco-2">🗣️</div>
  <div class="deco deco-3">💭</div>
  <div class="deco deco-4">🎲</div>
  <div class="deco deco-5">💬</div>
  <div class="deco deco-6">🗣️</div>
  <div class="deco deco-7">🎲</div>
  <div class="deco deco-8">💭</div>

  <a href="/" class="home-button" data-i18n="home">Главная</a>

  <div class="container">
    <h1 data-i18n="h1">О чём поговорить с...</h1>

    <!-- Выбор собеседника -->
    <div class="person-section">
      <div class="person-grid" id="personGrid">
        <!-- chips генерируются в JS -->
      </div>
    </div>

    <!-- Drum Picker -->
    <div class="drum-wrapper" id="drumWrapper">
      <div class="drum-highlight"></div>
      <div class="drum-track">
        <div class="drum-items" id="drumItems">
          <!-- items генерируются в JS -->
        </div>
      </div>
    </div>

    <!-- Кнопка -->
    <button class="spin-button" id="spinButton" data-i18n="spin_btn">
      Крутить
    </button>
  </div>

<script>
(function() {
  'use strict';

  // ===== Конфигурация собеседников (загружается из словаря i18n) =====
  let people = [];
  let _d = {};
  function loadData() {
    if (!window.I18N) return;
    people = I18N.t('people');
    _d = I18N.t('topics');
  }

  const _k = [114,97,110,100,111,109,104,111,115,116,50,48,50,54];

  // Маппинг ID → категория
  const _m = {
    husband:'partner_m',wife:'partner_f',girlfriend:'partner_f',boyfriend:'partner_m',
    mother:'parent_f',father:'parent_m',
    grandfather:'grandparent_m',grandmother:'grandparent_f',
    son:'kid',daughter:'kid',child:'kid',
    friend_m:'friend_m',friend_f:'friend_f',
    stranger:'stranger',colleague:'colleague'
  };

  // ===== Декодер =====
  function _x(encoded) {
    const raw = atob(encoded);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) {
      bytes[i] = raw.charCodeAt(i) ^ _k[i % _k.length];
    }
    return new TextDecoder().decode(bytes);
  }

  function getTopics(personId) {
    const ctx = _m[personId] || 'stranger';
    const pool = (_d[ctx] || []).map(_x);
    // Шафл Фишера-Йетса
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool;
  }

  // ===== DOM =====
  const personGrid = document.getElementById('personGrid');
  const drumItems = document.getElementById('drumItems');
  const drumTrack = drumItems.parentElement;
  const spinButton = document.getElementById('spinButton');

  const ITEM_HEIGHT = 44;
  const CENTER_INDEX = 2;
  const STORAGE_KEY = 'talk_topics_person';

  let selectedPerson = null;
  let isSpinning = false;
  let currentPool = [];

  // ===== Рендер чипсов =====
  function renderPeople() {
    personGrid.innerHTML = '';
    people.forEach(p => {
      const chip = document.createElement('button');
      chip.className = 'person-chip';
      chip.textContent = p.label;
      chip.dataset.id = p.id;
      chip.addEventListener('click', () => selectPerson(p.id));
      personGrid.appendChild(chip);
    });
  }

  function selectPerson(id) {
    selectedPerson = id;
    try { localStorage.setItem(STORAGE_KEY, id); } catch(e) {}
    personGrid.querySelectorAll('.person-chip').forEach(chip => {
      chip.classList.toggle('selected', chip.dataset.id === id);
    });
    refreshDrum();
  }

  // ===== Drum =====
  // Padding: дублируем элементы сверху и снизу, чтобы барабан казался бесконечным
  const PAD = 4;

  function poolToDom(poolIdx) { return PAD + poolIdx; }

  function refreshDrum() {
    currentPool = getTopics(selectedPerson);
    renderDrumItems(1);
    drumTrack.classList.add('blurred');
    // Центрируем на середине пула — элементы видны и сверху, и снизу
    const midPool = Math.floor(currentPool.length / 2);
    const domIdx = poolToDom(midPool);
    drumItems.style.transition = 'none';
    drumItems.style.transform = `translateY(${-(domIdx - CENTER_INDEX) * ITEM_HEIGHT}px)`;
    updateCenterHighlight(domIdx);
  }

  const SPIN_REPEATS = 3; // сколько раз повторить пул для длинной прокрутки

  function renderDrumItems(repeats) {
    repeats = repeats || 1;
    drumItems.innerHTML = '';
    const total = currentPool.length;
    // Padding сверху: последние PAD элементов пула (закольцовка)
    for (let i = 0; i < PAD; i++) {
      const div = document.createElement('div');
      div.className = 'drum-item';
      div.textContent = currentPool[(total - PAD + i) % total];
      drumItems.appendChild(div);
    }
    // Основные элементы (повторяем repeats раз)
    for (let r = 0; r < repeats; r++) {
      currentPool.forEach((topic) => {
        const div = document.createElement('div');
        div.className = 'drum-item';
        div.textContent = topic;
        drumItems.appendChild(div);
      });
    }
    // Padding снизу: первые PAD элементов пула (закольцовка)
    for (let i = 0; i < PAD; i++) {
      const div = document.createElement('div');
      div.className = 'drum-item';
      div.textContent = currentPool[i % total];
      drumItems.appendChild(div);
    }
  }

  function updateCenterHighlight(centerIdx) {
    const items = drumItems.querySelectorAll('.drum-item');
    const totalDom = items.length;
    items.forEach((item, i) => {
      const dist = Math.abs(i - centerIdx);
      if (dist === 0) {
        item.classList.add('center');
        item.style.opacity = '1';
        item.style.transform = 'scale(1)';
      } else {
        item.classList.remove('center');
        const opacity = Math.max(0.15, 0.6 - dist * 0.15);
        const scale = Math.max(0.85, 1 - dist * 0.03);
        item.style.opacity = opacity;
        item.style.transform = `scale(${scale})`;
      }
    });
  }

  // ===== Анимация вращения (снизу вверх = обратное направление) =====
  function spin() {
    if (!selectedPerson || isSpinning) return;

    isSpinning = true;
    spinButton.disabled = true;
    drumTrack.classList.remove('blurred');

    // Свежий пул
    currentPool = getTopics(selectedPerson);
    renderDrumItems(SPIN_REPEATS);

    const totalItems = currentPool.length;
    const totalDom = totalItems * SPIN_REPEATS + PAD * 2;
    // Целевой элемент — рандомный из первого повтора пула
    const targetPool = 5 + Math.floor(Math.random() * (totalItems - 10));

    // DOM-индексы с учётом padding
    const startDom = PAD + totalItems * SPIN_REPEATS - 1;
    const endDom = poolToDom(targetPool);

    const startY = -(startDom - CENTER_INDEX) * ITEM_HEIGHT;
    const endY = -(endDom - CENTER_INDEX) * ITEM_HEIGHT;

    // Длительность и easing
    const duration = 3000;
    const startTime = performance.now();

    function easeOutQuart(t) {
      return 1 - Math.pow(1 - t, 5);
    }

    drumItems.style.transition = 'none';
    drumItems.style.transform = `translateY(${startY}px)`;
    updateCenterHighlight(startDom);

    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutQuart(progress);

      const currentY = startY + (endY - startY) * eased;
      drumItems.style.transform = `translateY(${currentY}px)`;

      const currentCenter = Math.round(-currentY / ITEM_HEIGHT) + CENTER_INDEX;
      const clampedCenter = Math.max(0, Math.min(currentCenter, totalDom - 1));
      updateCenterHighlight(clampedCenter);

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        drumItems.style.transform = `translateY(${endY}px)`;
        updateCenterHighlight(endDom);

        setTimeout(() => {
          isSpinning = false;
          spinButton.disabled = false;
        }, 200);
      }
    }

    requestAnimationFrame(animate);
  }

  // ===== Init =====
  spinButton.addEventListener('click', spin);

  // (Re)build whenever the language changes; i18n.js fires 'langchange' on init.
  function onLang() {
    loadData();
    if (!people.length) return;
    renderPeople();
    let saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch(e) {}
    const id = (selectedPerson && people.some(p => p.id === selectedPerson)) ? selectedPerson
             : (saved && people.some(p => p.id === saved)) ? saved
             : people[0].id;
    selectPerson(id);
  }
  window.addEventListener('langchange', onLang);
  if (window.I18N) onLang();
})();
</script>
